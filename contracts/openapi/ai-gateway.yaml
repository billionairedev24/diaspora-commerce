openapi: 3.1.0
info:
  title: AI Gateway API
  description: 'Lola, the AfroTransact shopping agent (streaming chat with visible tool calls, grounded product cards and
    action proposals that always need the shopper''s tap), plus AI utilities: embeddings for search, image moderation for
    media uploads, listing writer, translation, storefront taglines and trust-team triage. Models are served through OpenRouter
    with per-task routing, fallbacks and per-user / per-feature budgets.'
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8113
  description: local
- url: https://api.dev.afrotransact.com/ai-gateway
  description: dev
- url: https://api.uat.afrotransact.com/ai-gateway
  description: uat
- url: https://api.afrotransact.com/ai-gateway
  description: prod
security:
- bearer: []
tags:
- name: Lola
  description: 'AI shopping agent: streaming chat with visible tool calls and action proposals'
- name: AI utilities
  description: Embeddings for search, image moderation for media and drafting aids for sellers and staff
- name: AI usage
  description: AI credits per organisation for metered billing (S206)
paths:
  /v1/ai/listing-writer:
    post:
      tags:
      - AI utilities
      summary: Draft a listing title, description and bullets (ai:use)
      description: Returns a DRAFT for the seller to edit; nothing is saved or published.
      operationId: listingWriter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingWriterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListingDraft'
  /v1/ai/moderate-image:
    post:
      tags:
      - AI utilities
      summary: Moderate an uploaded image before it is published (ai:use)
      description: 'The AI moderation hook of media-service (client media-service): a vision model checks a product or storefront
        image for prohibited content (BLOCK) and marketplace rules such as watermarks, contact details or text overlays (REVIEW).
        Labels imply a minimum decision and an unreadable answer is REVIEW, never ALLOW. Advisory: media holds or publishes
        the image and staff review held ones.'
      operationId: moderateImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateImageRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModerateImageResponse'
  /v1/ai/tagline:
    post:
      tags:
      - AI utilities
      summary: Suggest storefront taglines (ai:use)
      operationId: tagline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaglineRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Taglines'
  /v1/ai/translate:
    post:
      tags:
      - AI utilities
      summary: Translate text (ai:use)
      description: Draft translation; never applied automatically.
      operationId: translate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Translation'
  /v1/ai/seller-assistant/complete:
    post:
      tags:
      - AI utilities
      summary: One model turn for Lola in Seller Center (ai:use, seller and provider members)
      description: |-
        Called by the gateway-bff, which runs the conversation, the tools (it holds the seller's session and the platform
        APIs) and the plan tier limits. Send the conversation and the tools offered for this turn; the answer is text, or
        tool calls for the caller to run before calling again. Nothing is executed here. The usage is billed to the member's
        organisation as AI credits and counted against the `seller-assistant` budget (429 `ai.budget-exceeded` when it is
        spent). 403 `ai.seller-only` for anyone who is not a seller or provider member.
      operationId: sellerAssistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AssistantReply'
  /v1/ai/staff-assistant/complete:
    post:
      tags:
      - AI utilities
      summary: One model turn for Lola in the staff console (ai:use, staff accounts)
      description: Called by the gateway-bff, which runs the conversation and the tools with the staff member's own session and permissions. Same shape as the seller assistant turn. Nothing is executed here; counted against the `staff-assistant` budget (429 `ai.budget-exceeded` when it is spent).
      operationId: staffAssistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AssistantReply'
  /v1/ai/triage:
    post:
      tags:
      - AI utilities
      summary: Trust-team triage summary with cited fields (ai:triage)
      description: 'Advisory only: decision is always HUMAN_REVIEW_REQUIRED; flags without real citations are dropped.'
      operationId: triage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Report'
  /v1/ai/usage/orgs:
    get:
      tags:
      - AI usage
      summary: AI credits per organisation and UTC day (metered billing, S206)
      description: Service scope ai:usage.read (seller-service) or staff with ai:manage. Only calls made by seller and provider
        members are attributed to their organisation. Inclusive range of at most 93 days; only days with usage are listed.
      operationId: orgs
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AiOrgUsageReport'
  /v1/embeddings:
    post:
      tags:
      - AI utilities
      summary: Embed text (ai:use)
      description: 'Used by the search service for semantic retrieval: request `{"input","purpose"}`, response `{"embedding":[…]}`
        (plus model and dimensions). Personal data is redacted before embedding.'
      operationId: embed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
  /v1/lola/chat:
    post:
      tags:
      - Lola
      summary: Chat with Lola (Server-Sent Events)
      description: 'Streams one turn as SSE. Event names, in order: `tool_call` (what Lola is doing, e.g. "Searching for jollof
        seasoning"), `tool_result` (product cards, offers, delivery promise, order status, services), `action_proposal` (add
        to cart, checkout, book a service, start a return — the app performs it only after the shopper''s tap), `token` (answer
        text, grounded sentence by sentence), `handoff` (passed to human support) and finally `done` (grounded message, cards,
        proposals, suggestion chips). On failure an `error` event carries a problem code. Budget problems before the stream
        starts are returned as RFC 9457 problems (429 `ai.budget-exceeded`).'
      operationId: chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventView'
  /v1/lola/chat/complete:
    post:
      tags:
      - Lola
      summary: Chat with Lola (single JSON response)
      description: 'Same turn as the streaming endpoint, returned at once: every event in order plus `done`.'
      operationId: complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReply'
  /v1/lola/sessions/{sessionId}/messages:
    get:
      tags:
      - Lola
      summary: Stored turns of one of my Lola conversations (redacted)
      operationId: history
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TurnView'
components:
  schemas:
    EventView:
      type: object
      description: One streamed event, as in the SSE stream (event name + JSON data)
      properties:
        type:
          type: string
          example: tool_call
        data: {}
    ChatRequest:
      type: object
      description: A shopper message to Lola
      properties:
        sessionId:
          type: string
          description: Conversation id returned by a previous turn; omit to start a new conversation
          example: lola_3f2a9c0d1e7b4a51
          pattern: '[A-Za-z0-9_-]{8,64}'
        message:
          type: string
          description: What the shopper typed
          example: Jollof for 20
          maxLength: 4000
          minLength: 0
        zip:
          type: string
          description: Deliver-to ZIP from the header picker
          example: '77002'
          pattern: \d{5}
        language:
          type: string
          description: Preferred reply language (BCP 47)
          example: en
          maxLength: 16
          minLength: 0
      required:
      - message
    ActionProposal:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - ADD_TO_CART
          - CHECKOUT
          - BOOK_SERVICE
          - START_RETURN
        label:
          type: string
        payload:
          type: object
          additionalProperties: {}
        requiresConfirmation:
          type: boolean
    ChatReply:
      type: object
      description: 'Non-streaming Lola turn: every event in order, then the final turn summary'
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventView'
        done:
          $ref: '#/components/schemas/Done'
    Done:
      type: object
      properties:
        sessionId:
          type: string
        message:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/ActionProposal'
        suggestions:
          type: array
          items:
            type: string
        dropped:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        models:
          type: array
          items:
            type: string
        promptTokens:
          type: integer
          format: int64
        completionTokens:
          type: integer
          format: int64
    ProductCard:
      type: object
      properties:
        atin:
          type: string
        title:
          type: string
        brand:
          type: string
        sellerName:
          type: string
        priceMinor:
          type: integer
          format: int64
        currency:
          type: string
        inStock:
          type: boolean
        availableQty:
          type: integer
          format: int32
        lowStock:
          type: boolean
        deliveryDays:
          type: integer
          format: int32
        rating:
          type: number
          format: double
        imageUrl:
          type: string
    EmbeddingRequest:
      type: object
      description: Embedding request (the Go search service sends exactly {input, purpose})
      properties:
        input:
          type: string
          description: Text to embed
          example: spicy pepper soup for a cold night
          maxLength: 16000
          minLength: 0
        purpose:
          type: string
          description: search-query, search-document, listing or similarity
          example: search-query
      required:
      - input
    EmbeddingResponse:
      type: object
      description: Embedding vector
      properties:
        embedding:
          type: array
          description: The vector
          items:
            type: number
            format: float
        model:
          type: string
          example: openai/text-embedding-3-small
        dimensions:
          type: integer
          format: int32
          example: 1536
    AssistantRequest:
      type: object
      description: One model turn for Lola in Seller Center
      properties:
        messages:
          type: array
          maxItems: 48
          minItems: 1
          items:
            $ref: '#/components/schemas/AssistantMessage'
        tools:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AssistantTool'
        maxTokens:
          type: integer
          format: int32
          description: Completion limit (default 900, capped at 1500)
      required:
      - messages
    AssistantMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
          maxLength: 24000
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/AssistantToolCall'
        toolCallId:
          type: string
        toolName:
          type: string
      required:
      - role
    AssistantToolCall:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: string
          description: JSON object as text
      required:
      - id
      - name
    AssistantTool:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,40}$
        description:
          type: string
          maxLength: 1000
        inputSchema:
          type: string
          description: JSON schema as text
      required:
      - inputSchema
      - name
    AssistantReply:
      type: object
      description: Either text or tool calls for the caller to run
      properties:
        text:
          type: string
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/AssistantToolCall'
        promptTokens:
          type: integer
          format: int64
        completionTokens:
          type: integer
          format: int64
        model:
          type: string
    TriageRequest:
      type: object
      description: Trust-team triage input; field values as the reviewer sees them (masked where required)
      properties:
        subjectType:
          type: string
          example: APPLICATION
          minLength: 1
        subjectId:
          type: string
          minLength: 1
        fields:
          type: object
          additionalProperties:
            type: string
          minProperties: 1
      required:
      - fields
      - subjectId
      - subjectType
    Citation:
      type: object
      properties:
        field:
          type: string
        excerpt:
          type: string
    Flag:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        citedFields:
          type: array
          items:
            type: string
    Report:
      type: object
      properties:
        subjectType:
          type: string
        subjectId:
          type: string
        summary:
          type: string
        riskLevel:
          type: string
        flags:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        droppedFlags:
          type: integer
          format: int32
        decision:
          type: string
        model:
          type: string
    TranslateRequest:
      type: object
      description: Translation input
      properties:
        text:
          type: string
          maxLength: 16000
          minLength: 0
        targetLanguage:
          type: string
          example: fr
          minLength: 1
        sourceLanguage:
          type: string
          example: en
        context:
          type: string
          example: product description
      required:
      - targetLanguage
      - text
    Translation:
      type: object
      properties:
        translation:
          type: string
        targetLanguage:
          type: string
        model:
          type: string
    TaglineRequest:
      type: object
      description: Storefront tagline input
      properties:
        storeName:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        categories:
          type: array
          items:
            type: string
        tone:
          type: string
          example: joyful
        count:
          type: integer
          format: int32
          example: 3
      required:
      - storeName
    Taglines:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
        model:
          type: string
    ModerateImageRequest:
      type: object
      description: Image moderation input (media-service sends a JPEG preview of at most 768 px)
      properties:
        image:
          type: string
          description: Base64-encoded image (at most 2 MB decoded)
          maxLength: 2900000
          minLength: 0
        contentType:
          type: string
          example: image/jpeg
          minLength: 1
        purpose:
          type: string
          description: product-image or storefront
          example: product-image
      required:
      - contentType
      - image
    ModerateImageResponse:
      type: object
      description: Image moderation verdict; advisory, media decides how to apply it
      properties:
        decision:
          type: string
          description: ALLOW (publish), REVIEW (hold for a person) or BLOCK (prohibited)
          enum:
          - ALLOW
          - REVIEW
          - BLOCK
        labels:
          type: array
          items:
            $ref: '#/components/schemas/ModerationLabelView'
        model:
          type: string
          example: google/gemini-2.5-flash
    ModerationLabelView:
      type: object
      description: A moderation finding
      properties:
        code:
          type: string
          example: WATERMARK
        description:
          type: string
          example: Another shop's logo in the corner
    ListingWriterRequest:
      type: object
      description: Listing writer input; the result is a draft and is never published automatically
      properties:
        productType:
          type: string
          example: SPICE_BLEND
        title:
          type: string
          example: Jollof seasoning 100g
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Product attributes
        language:
          type: string
          example: en
        tone:
          type: string
          example: warm
    ListingDraft:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        bullets:
          type: array
          items:
            type: string
        status:
          type: string
        autoPublished:
          type: boolean
        model:
          type: string
    TurnView:
      type: object
      description: A stored (redacted) conversation turn
      properties:
        role:
          type: string
        content:
          type: string
        products:
          type: array
          items: {}
        at:
          type: string
    AiOrgDayUsage:
      type: object
      description: AI usage of one organisation on one UTC day
      properties:
        orgId:
          type: string
          examples:
          - org_3k2j9x8q7w6e5r4t3y2u
        day:
          type: string
          format: date
          description: UTC day
        calls:
          type: integer
          format: int64
        tokens:
          type: integer
          format: int64
        costMicros:
          type: integer
          format: int64
          description: Estimated model cost in micro-dollars
        credits:
          type: integer
          format: int64
          description: AI credits (1 credit = 10,000 micro-dollars, rounded up per day)
    AiOrgUsageReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        microsPerCredit:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiOrgDayUsage'
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
