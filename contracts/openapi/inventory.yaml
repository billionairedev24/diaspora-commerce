openapi: 3.1.0
info:
  title: Inventory API
  description: 'Sellable stock for AfroTransact-owned (1P) products and seller stock held in AfroTransact fulfilment centres
    (FBA): positions per SKU × node, lots with expiry (FEFO), all-or-nothing reservations, receipts, lot operations and the
    append-only stock ledger.'
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8103
  description: local
- url: https://api.dev.afrotransact.com/inventory
  description: dev
- url: https://api.uat.afrotransact.com/inventory
  description: uat
- url: https://api.afrotransact.com/inventory
  description: prod
security:
- bearer: []
tags:
- name: Stock
  description: Storefront availability, positions and the stock ledger
- name: Reconciliation
  description: Positions recomputed from the ledger and lots; drift alerts
- name: Receiving
  description: Goods receipts from retail-service and FBA inbound (inventory:receive)
- name: Returns
  description: Returned units after inspection (inventory:adjust)
- name: Lots
  description: Batches with expiry, FEFO order, quarantine, write-off, cycle counts, transfers
- name: Storage
  description: FBA storage volume for metered billing (S206)
- name: Reservations
  description: 'Checkout holds: reserve → confirm → commit (ship) or release. Called by the orders service (SERVICE principal
    with inventory:reserve).'
- name: Nodes
  description: Fulfilment centres, origin hubs and warehouses
paths:
  /v1/availability:
    get:
      tags:
      - Stock
      summary: Sellable availability per SKU (summed over nodes) and per node
      description: 'Public: storefront, search, cart and Lola read it. available = on hand − reserved.'
      operationId: availability
      parameters:
      - name: skus
        in: query
        description: Comma-separated SKUs (max 100), e.g. AT-JOL-6,AT-BAS-10
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Availability'
      security: []
  /v1/inbound:
    post:
      tags:
      - Receiving
      summary: Record expected inbound units (ASN); negative qty cancels
      operationId: inbound
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Position'
  /v1/lots:
    get:
      tags:
      - Lots
      summary: Search lots (inventory:read; sellers see their own), FEFO order within SKU × node
      operationId: search
      parameters:
      - name: sku
        in: query
        required: false
        schema:
          type: string
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SELLABLE
          - QUARANTINE
          - EXPIRED
          - WRITTEN_OFF
          - DAMAGED
      - name: lotNo
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LotPage'
  /v1/lots/expiry-runs:
    post:
      tags:
      - Lots
      summary: Run the lot expiry job now (inventory:adjust)
      operationId: expireNow
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ExpiryRun'
  /v1/lots/markdown:
    get:
      tags:
      - Lots
      summary: 'Markdown list: sellable lots expiring within 60 (or 30) days, soonest first'
      operationId: markdown
      parameters:
      - name: within
        in: query
        description: WITHIN_60 (default, includes ≤ 30) or WITHIN_30
        required: false
        schema:
          type: string
          enum:
          - NONE
          - WITHIN_60
          - WITHIN_30
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lot'
  /v1/lots/markdown-runs:
    post:
      tags:
      - Lots
      summary: Recompute markdown flags now (inventory:adjust); returns lots whose flag changed
      operationId: markdownNow
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int32
  /v1/lots/{id}:
    get:
      tags:
      - Lots
      summary: Get a lot
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/adjust:
    post:
      tags:
      - Lots
      summary: 'Cycle count: post the counted quantity with a reason (ADJUST, inventory:adjust)'
      description: Refused (422 inventory.below-reserved) when it would take on hand below reserved.
      operationId: adjust
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleCountRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/quarantine:
    post:
      tags:
      - Lots
      summary: Quarantine a sellable lot with a reason (inventory:adjust)
      description: Blocks the lot from sale; refused while units are reserved.
      operationId: quarantine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/release:
    post:
      tags:
      - Lots
      summary: Release a quarantined or damaged lot back to sale after inspection (inventory:adjust)
      operationId: release_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/transfer:
    post:
      tags:
      - Lots
      summary: Transfer unreserved units of a lot to another node (TRANSFER, inventory:adjust)
      operationId: transfer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TransferResult'
  /v1/lots/{id}/write-off:
    post:
      tags:
      - Lots
      summary: Write off units of a lot with a reason (inventory:adjust)
      description: Never touches reserved units. The lot becomes WRITTEN_OFF when nothing is left.
      operationId: writeOff
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOffRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/movements:
    get:
      tags:
      - Stock
      summary: Stock movement history, newest first (inventory:read)
      description: Filter by lot for recalls, or by reference (order id, receipt, transfer).
      operationId: movements
      parameters:
      - name: sku
        in: query
        required: false
        schema:
          type: string
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: lotId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: reference
        in: query
        required: false
        schema:
          type: string
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - RECEIVE
          - PUT_AWAY
          - RESERVE
          - RELEASE
          - SHIP
          - RETURN_RESTOCK
          - RETURN_DAMAGED
          - ADJUST
          - QUARANTINE
          - RELEASE_QUARANTINE
          - EXPIRE
          - WRITE_OFF
          - TRANSFER
          - INBOUND
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MovementPage'
  /v1/nodes:
    get:
      tags:
      - Nodes
      summary: List nodes (inventory:read)
      operationId: list
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
    post:
      tags:
      - Nodes
      summary: Create a node (inventory:adjust)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Node'
  /v1/positions:
    get:
      tags:
      - Stock
      summary: Stock positions (inventory:read; sellers see only their own FBA stock)
      operationId: positions
      parameters:
      - name: sku
        in: query
        required: false
        schema:
          type: string
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      - name: lowStock
        in: query
        description: Only positions with 10 or fewer available
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PositionPage'
  /v1/receipts:
    post:
      tags:
      - Receiving
      summary: Receive the lots of a completed goods receipt
      description: Creates one lot per batch (RECEIVE + PUT_AWAY). Damaged units become a separate <lot>-DMG quarantine lot;
        lots with remaining life below max(90 days, 50% of shelf life) are quarantined; expired lots or impossible dates reject
        the receipt (422 inventory.lot-rejected).
      operationId: receive
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReceiptResult'
  /v1/reconciliation/runs:
    post:
      tags:
      - Reconciliation
      summary: Run reconciliation now (inventory:adjust)
      operationId: run
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
  /v1/reconciliation/runs/latest:
    get:
      tags:
      - Reconciliation
      summary: Latest reconciliation run (staff, inventory:read)
      operationId: latest
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
  /v1/reservations:
    post:
      tags:
      - Reservations
      summary: Reserve all lines of an order, or none
      description: 'Locks positions in (sku, node) order, allocates lots FEFO and holds stock for the reservation TTL (15
        min). The order id is the idempotency key: a retry returns the existing reservation with 200 and replayed=true and
        never reserves twice.'
      operationId: reserve
      parameters:
      - name: Idempotency-Key
        in: header
        description: Unique per attempt; replays return the stored result
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
        required: true
      responses:
        '201':
          description: Reserved
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
        '200':
          description: Replay of an earlier reservation for this order
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
        '409':
          description: inventory.insufficient-stock with per-SKU shortfalls
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/reservations/{orderId}:
    get:
      tags:
      - Reservations
      summary: Get the reservation of an order (orders service or staff)
      operationId: get
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
  /v1/reservations/{orderId}/commit:
    post:
      tags:
      - Reservations
      summary: 'Ship the order: SHIP movements, lot decrements and COGS at lot landed cost'
      description: 'Idempotent: committing a committed reservation returns the same result with replayed=true.'
      operationId: commit
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommitResult'
  /v1/reservations/{orderId}/confirm:
    post:
      tags:
      - Reservations
      summary: 'Payment authorised: keep the hold until shipment (no more TTL)'
      operationId: confirm
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
  /v1/reservations/{orderId}/groups/commit:
    post:
      tags:
      - Reservations
      summary: Ship only some groups (one shipment's lines)
      description: 'Commits the held lines of the groups: SHIP movements and COGS for those lines only; other groups stay
        held. Idempotent per group. 404 inventory.group-not-found for unknown groups (reservations made without groups use
        /commit).'
      operationId: commitGroups
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationGroupsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommitResult'
  /v1/reservations/{orderId}/groups/release:
    post:
      tags:
      - Reservations
      summary: Release only some groups (one cancelled shipment)
      description: Gives the held lines of the groups back to available stock; other groups stay held. Idempotent; 409 inventory.group-committed
        when a line already shipped.
      operationId: releaseGroups
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationGroupsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
  /v1/reservations/{orderId}/release:
    post:
      tags:
      - Reservations
      summary: Release a held reservation (cancellation or payment failure)
      description: 'Idempotent: releasing a released or expired reservation returns it unchanged.'
      operationId: release
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
  /v1/returns:
    post:
      tags:
      - Returns
      summary: Restock a returned unit or move it to the lot's -DMG lot (inventory:adjust, or a SERVICE with inventory:returns)
      description: RETURN_RESTOCK puts units back into their sellable lot; RETURN_DAMAGED holds them in <lot>-DMG. Never more
        than the order shipped. With receivingNodeId the units go into the same lot number at that node (e.g. the return centre).
      operationId: accept
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReturnResult'
  /v1/skus/{sku}/dimensions:
    get:
      tags:
      - Storage
      summary: A SKU's unit dimensions (inventory:read)
      operationId: dimensions
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SkuDimensions'
    put:
      tags:
      - Storage
      summary: Set a SKU's unit dimensions (inventory:adjust or inventory:receive)
      operationId: setDimensions
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuDimensionsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SkuDimensions'
  /v1/storage/snapshots:
    post:
      tags:
      - Storage
      summary: Retake today's storage snapshot now (inventory:adjust)
      description: The hourly job does this; the last snapshot of a UTC day stands. Idempotent.
      operationId: snapshot
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StorageSnapshotResult'
  /v1/storage/usage:
    get:
      tags:
      - Storage
      summary: Cubic-feet-days per owner organisation and UTC day (metered billing, S206)
      description: SERVICE principals with inventory:storage.read (seller-service) and staff with inventory:read see every
        owner (optionally ownerOrg); seller members only their own organisation. Inclusive range of at most 93 days; physical
        stock in fulfilment centres only (on hand + damaged).
      operationId: usage
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StorageUsage'
components:
  schemas:
    SkuDimensionsRequest:
      type: object
      description: Outer dimensions of one sellable unit, in inches
      properties:
        lengthIn:
          type: number
          examples:
          - 12
        widthIn:
          type: number
          examples:
          - 8
        heightIn:
          type: number
          examples:
          - 4.5
      required:
      - heightIn
      - lengthIn
      - widthIn
    SkuDimensions:
      type: object
      properties:
        sku:
          type: string
        lengthIn:
          type: number
        widthIn:
          type: number
        heightIn:
          type: number
        unitCubicFeet:
          type: number
          description: Volume of one unit in cubic feet
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    StorageSnapshotResult:
      type: object
      properties:
        day:
          type: string
          format: date
          description: UTC day the snapshot is for
        rows:
          type: integer
          format: int32
          description: Owner × node rows written
    ReturnRequest:
      type: object
      description: A returned item after inspection
      properties:
        orderId:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        lotId:
          type: string
          format: uuid
        qty:
          type: integer
          format: int32
          exclusiveMinimum: 0
        condition:
          type: string
          enum:
          - RESTOCK
          - DAMAGED
        reason:
          type: string
          maxLength: 500
          minLength: 0
        receivingNodeId:
          type: string
          description: Warehouse that received the parcel (e.g. the return centre); default = the node the unit shipped from
          maxLength: 20
          minLength: 0
      required:
      - condition
      - orderId
      - reason
      - sku
    Lot:
      type: object
      description: A batch of one SKU at one node with dates, bin, unit landed cost and status
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        lotNo:
          type: string
        nodeId:
          type: string
        ownerOrg:
          type: string
        bin:
          type: string
        qtyOnHand:
          type: integer
          format: int32
        qtyReserved:
          type: integer
          format: int32
        qtyAvailable:
          type: integer
          format: int32
        mfgDate:
          type: string
          format: date
        expDate:
          type: string
          format: date
        receivedAt:
          type: string
          format: date-time
        unitLandedCostMinor:
          type: integer
          format: int64
        currency:
          type: string
        status:
