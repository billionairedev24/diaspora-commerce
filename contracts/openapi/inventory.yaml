          type: string
          maxLength: 3
          minLength: 3
        shelfLifeDays:
          type: integer
          format: int32
          description: Shelf life from manufacture in days (short-dated rule)
          exclusiveMinimum: 0
        holdReason:
          type: string
          description: Receive the good units straight into QUARANTINE with this reason (e.g. QC hold at the dock); omit for
            sellable stock
          maxLength: 500
          minLength: 0
      required:
      - currency
      - lotNo
      - sku
    ReceiptRequest:
      type: object
      description: Lots of a completed goods receipt
      properties:
        receiptRef:
          type: string
          maxLength: 80
          minLength: 0
        nodeId:
          type: string
          minLength: 1
        ownerOrg:
          type: string
          description: FBA seller org; omit for AfroTransact Retail (1P)
        inboundRef:
          type: string
          description: 'Inbound shipment the units arrived on (FBA plan number or retail shipment reference): its expected
            units are consumed and the received quantities recorded against it (S226, S257)'
          maxLength: 120
          minLength: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptLine'
          maxItems: 500
          minItems: 0
      required:
      - lines
      - nodeId
      - receiptRef
    ReceiptResult:
      type: object
      properties:
        receiptRef:
          type: string
        nodeId:
          type: string
        ownerOrg:
          type: string
        lots:
          type: array
          items:
            $ref: '#/components/schemas/Lot'
        replayed:
          type: boolean
    CreateNodeRequest:
      type: object
      properties:
