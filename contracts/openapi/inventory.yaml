        name:
          type: string
          maxLength: 120
          minLength: 0
        kind:
          type: string
          enum:
          - FULFILMENT_CENTRE
          - ORIGIN_HUB
          - WAREHOUSE
        country:
          type: string
          maxLength: 2
          minLength: 2
        timezone:
          type: string
          minLength: 1
        temperatureZones:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - country
      - id
      - kind
      - name
      - timezone
    Node:
      type: object
      description: Fulfilment centre, origin hub or warehouse
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - FULFILMENT_CENTRE
          - ORIGIN_HUB
          - WAREHOUSE
        country:
          type: string
        timezone:
          type: string
        temperatureZones:
          type: array
          items:
            type: string
        active:
          type: boolean
