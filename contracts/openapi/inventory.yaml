openapi: 3.1.0
info:
  title: Inventory API
  description: 'Sellable stock for AfroTransact-owned (1P) products and seller stock held in AfroTransact fulfilment centres
    (FBA): positions per SKU × node, lots with expiry (FEFO), all-or-nothing reservations, receipts, lot operations and the
    append-only stock ledger.'
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8103
  description: local
- url: https://api.dev.afrotransact.com/inventory
  description: dev
- url: https://api.uat.afrotransact.com/inventory
  description: uat
- url: https://api.afrotransact.com/inventory
  description: prod
security:
- bearer: []
tags:
- name: Inbound shipments
  description: 'Send stock to AfroTransact (S257): seller FBA plans with AT-FN unit labels and carton labels, tracking, FC
    receiving against the plan with discrepancies; AfroTransact Retail ASNs (S226). Sellers: inventory:inbound (own org);
    FC staff: inventory:receive.'
- name: Insights
  description: Seller FBA inventory (S067) and the staff inventory hub overview and recall traces (S066); inventory:read,
    sellers see their own organisation
- name: Stock
  description: Storefront availability, positions and the stock ledger
- name: Reconciliation
  description: Positions recomputed from the ledger and lots; drift alerts
- name: Receiving
  description: Goods receipts from retail-service and FBA inbound (inventory:receive)
- name: Returns
  description: Returned units after inspection (inventory:adjust)
- name: Lots
  description: Batches with expiry, FEFO order, quarantine, write-off, cycle counts, transfers
- name: Storage
  description: FBA storage volume for metered billing (S206)
- name: Reservations
  description: 'Checkout holds: reserve → confirm → commit (ship) or release. Called by the orders service (SERVICE principal
    with inventory:reserve).'
- name: Nodes
  description: Fulfilment centres, origin hubs and warehouses
paths:
  /v1/availability:
    get:
      tags:
      - Stock
      summary: Sellable availability per SKU (summed over nodes) and per node
      description: 'Public: storefront, search, cart and Lola read it. available = on hand − reserved.'
      operationId: availability
      parameters:
      - name: skus
        in: query
        description: Comma-separated SKUs (max 100), e.g. AT-JOL-6,AT-BAS-10
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Availability'
      security: []
  /v1/fba/inventory:
    get:
      tags:
      - Insights
      summary: A seller's stock in AfroTransact fulfilment centres
      description: 'Per SKU × FC: on hand, reserved, available, inbound, unfulfillable (quarantined, damaged, expired), ageing
        since receipt (D0_90 … D365_PLUS), storage volume and whether the stock is stranded (no live Fulfilled-by-AfroTransact
        offer: NO_OFFER / OFFER_INACTIVE), with totals over all of the owner''s FBA stock. Sellers see their own; staff name
        ownerOrg.'
      operationId: fbaInventory
      parameters:
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: sku
        in: query
        required: false
        schema:
          type: string
      - name: stranded
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FbaInventory'
  /v1/inbound:
    post:
      tags:
      - Receiving
      summary: Record expected inbound units (ASN); negative qty cancels
      operationId: inbound
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Position'
  /v1/inbound/shipments:
    get:
      tags:
      - Inbound shipments
      summary: 'List inbound shipments (sellers: their own)'
      operationId: listInboundShipments
      parameters:
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - WORKING
          - SHIPPED
          - RECEIVING
          - CLOSED
          - CANCELLED
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - FBA
          - RETAIL_ASN
      - name: sku
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundShipmentPage'
    post:
      tags:
      - Inbound shipments
      summary: 'Create an inbound plan: SKUs and quantities to send'
      description: Each line names a variant ATIN; its unit label is the seller's AT-FN code from catalog (issued once per
        seller and variant, so units of different sellers never mix), which is also the default inventory SKU. A destination
        fulfilment centre is assigned (never one where another seller stocks the SKU) unless nodeId is requested. Boxes get
        LPN carton labels. Returns the plan in WORKING.
      operationId: createInboundPlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundPlanRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundShipment'
  /v1/inbound/shipments/{id}:
    get:
      tags:
      - Inbound shipments
      summary: One inbound shipment with lines, boxes, received quantities and discrepancies
      operationId: getInboundShipment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundShipment'
    put:
      tags:
      - Inbound shipments
      summary: Replace the SKUs and / or boxes of a WORKING plan
      description: 'If-Match with the ETag: 409 inventory.version-mismatch when the plan changed meanwhile.'
      operationId: updateInboundPlan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundPlanUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundShipment'
  /v1/inbound/shipments/{id}/cancel:
    post:
      tags:
      - Inbound shipments
      summary: Cancel a plan or a shipment not yet received
      operationId: cancelInboundShipment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundShipment'
  /v1/inbound/shipments/{id}/carrier-label:
    post:
      tags:
      - Inbound shipments
      summary: Buy the inbound shipping label through carrier-gateway
      description: One parcel per box (weights required), from the ship-from address to the FC. Stores the carrier, tracking
        number, cost and document link. 503 inventory.carrier-unavailable, 422 inventory.carrier-rejected.
      operationId: buyInboundLabel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundLabelPurchaseRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundShipment'
  /v1/inbound/shipments/{id}/close:
    post:
      tags:
      - Inbound shipments
      summary: Finish receiving (inventory:receive)
      description: Units that did not arrive stop counting as inbound and are reported SHORT; inventory.inbound.closed carries
        every discrepancy.
      operationId: closeInboundShipment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundShipment'
  /v1/inbound/shipments/{id}/labels:
    get:
      tags:
      - Inbound shipments
      summary: Unit (AT-FN) or carton (LPN) labels as PDF or ZPL
      description: 'UNIT: one label per planned unit with the seller''s AT-FN code (catalog renders it); BOX: one carton label
        per box with its LPN, the plan number and the FC. lineNo limits unit labels to one line. 503 inventory.catalog-unavailable
        when catalog cannot render.'
      operationId: printInboundLabels
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNIT
          - BOX
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - PDF
          - ZPL
      - name: lineNo
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: byte
            text/plain:
              schema:
                type: string
                format: byte
            application/problem+json:
              schema:
                type: string
                format: byte
  /v1/inbound/shipments/{id}/receipts:
    post:
      tags:
      - Inbound shipments
      summary: Receive at the FC against the plan (inventory:receive)
      description: Lines by SKU or scanned AT-FN label; the seller's lots are created (damaged units as -DMG quarantine lots,
        holdReason for QC holds), the plan's inbound units are consumed and inventory.inbound.received is published (offers
        switches the listing to Fulfilled by AfroTransact). Unplanned SKUs are UNEXPECTED discrepancies. Idempotent per Idempotency-Key.
      operationId: receiveInboundShipment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundReceiveRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundReceiptResult'
  /v1/inbound/shipments/{id}/ship:
    post:
      tags:
      - Inbound shipments
      summary: Mark the plan shipped
      description: 'Expected units become inbound at the FC (storefront: Coming soon). Boxes, when given, must hold every
        planned unit.'
      operationId: shipInboundShipment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundShipment'
  /v1/inbound/shipments/{id}/tracking:
    put:
      tags:
      - Inbound shipments
      summary: Carrier and tracking number entered by the seller
      description: Registered with carrier-gateway for scans when it can (trackingRegistered).
      operationId: setInboundTracking
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundTrackingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InboundTrackingResult'
  /v1/lots:
    get:
      tags:
      - Lots
      summary: Search lots (inventory:read; sellers see their own), FEFO order within SKU × node
      operationId: search
      parameters:
      - name: sku
        in: query
        required: false
        schema:
          type: string
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SELLABLE
          - QUARANTINE
          - EXPIRED
          - WRITTEN_OFF
          - DAMAGED
      - name: lotNo
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LotPage'
  /v1/lots/expiry-runs:
    post:
      tags:
      - Lots
      summary: Run the lot expiry job now (inventory:adjust)
      operationId: expireNow
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ExpiryRun'
  /v1/lots/markdown:
    get:
      tags:
      - Lots
      summary: 'Markdown list: sellable lots expiring within 60 (or 30) days, soonest first'
      operationId: markdown
      parameters:
      - name: within
        in: query
        description: WITHIN_60 (default, includes ≤ 30) or WITHIN_30
        required: false
        schema:
          type: string
          enum:
          - NONE
          - WITHIN_60
          - WITHIN_30
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lot'
  /v1/lots/markdown-runs:
    post:
      tags:
      - Lots
      summary: Recompute markdown flags now (inventory:adjust); returns lots whose flag changed
      operationId: markdownNow
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int32
  /v1/lots/{id}:
    get:
      tags:
      - Lots
      summary: Get a lot
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/adjust:
    post:
      tags:
      - Lots
      summary: 'Cycle count: post the counted quantity with a reason (ADJUST, inventory:adjust)'
      description: Refused (422 inventory.below-reserved) when it would take on hand below reserved.
      operationId: adjust
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleCountRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/quarantine:
    post:
      tags:
      - Lots
      summary: Quarantine a sellable lot with a reason (inventory:adjust)
      description: Blocks the lot from sale; refused while units are reserved.
      operationId: quarantine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/release:
    post:
      tags:
      - Lots
      summary: Release a quarantined or damaged lot back to sale after inspection (inventory:adjust)
      operationId: release_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/lots/{id}/trace:
    get:
      tags:
      - Insights
      summary: Recall trace of a lot
      description: The lot, its ledger rows, the same batch at other nodes (transfers, -DMG) and the orders whose reservations
        took its units.
      operationId: lotTrace
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LotTrace'
  /v1/lots/{id}/transfer:
    post:
      tags:
      - Lots
      summary: Transfer unreserved units of a lot to another node (TRANSFER, inventory:adjust)
      operationId: transfer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TransferResult'
  /v1/lots/{id}/write-off:
    post:
      tags:
      - Lots
      summary: Write off units of a lot with a reason (inventory:adjust)
      description: Never touches reserved units. The lot becomes WRITTEN_OFF when nothing is left.
      operationId: writeOff
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOffRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Lot'
  /v1/movements:
    get:
      tags:
      - Stock
      summary: Stock movement history, newest first (inventory:read)
      description: Filter by lot for recalls, or by reference (order id, receipt, transfer).
      operationId: movements
      parameters:
      - name: sku
        in: query
        required: false
        schema:
          type: string
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: lotId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: reference
        in: query
        required: false
        schema:
          type: string
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - RECEIVE
          - PUT_AWAY
          - RESERVE
          - RELEASE
          - SHIP
          - RETURN_RESTOCK
          - RETURN_DAMAGED
          - ADJUST
          - QUARANTINE
          - RELEASE_QUARANTINE
          - EXPIRE
          - WRITE_OFF
          - TRANSFER
          - INBOUND
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MovementPage'
  /v1/nodes:
    get:
      tags:
      - Nodes
      summary: List nodes (inventory:read)
      operationId: list
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
    post:
      tags:
      - Nodes
      summary: Create a node (inventory:adjust)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Node'
  /v1/nodes/{id}/address:
    get:
      tags:
      - Nodes
      summary: Street address of a node (where sellers send FBA stock)
      operationId: nodeAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PostalAddress'
    put:
      tags:
      - Nodes
      summary: Set a node's street address (inventory:adjust)
      description: Inbound carrier labels need line 1, city and postal code; the country is the node's.
      operationId: updateNodeAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostalAddress'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PostalAddress'
  /v1/overview:
    get:
      tags:
      - Insights
      summary: Inventory hub overview
      description: Units and landed value per lot status, expiry buckets (node-local days), per-node figures, open inbound
        shipments, held reservations and alerts (expired and expiring lots, low stock, inbound discrepancies).
      operationId: inventoryOverview
      parameters:
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Overview'
  /v1/positions:
    get:
      tags:
      - Stock
      summary: Stock positions (inventory:read; sellers see only their own FBA stock)
      operationId: positions
      parameters:
      - name: sku
        in: query
        required: false
        schema:
          type: string
      - name: nodeId
        in: query
        required: false
        schema:
          type: string
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      - name: lowStock
        in: query
        description: Only positions with 10 or fewer available
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PositionPage'
  /v1/receipts:
    post:
      tags:
      - Receiving
      summary: Receive the lots of a completed goods receipt
      description: Creates one lot per batch (RECEIVE + PUT_AWAY). Damaged units become a separate <lot>-DMG quarantine lot;
        lots with remaining life below max(90 days, 50% of shelf life) are quarantined; expired lots or impossible dates reject
        the receipt (422 inventory.lot-rejected).
      operationId: receive
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReceiptResult'
  /v1/reconciliation/runs:
    post:
      tags:
      - Reconciliation
      summary: Run reconciliation now (inventory:adjust)
      operationId: run
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
  /v1/reconciliation/runs/latest:
    get:
      tags:
      - Reconciliation
      summary: Latest reconciliation run (staff, inventory:read)
      operationId: latest
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
  /v1/reservations:
    post:
      tags:
      - Reservations
      summary: Reserve all lines of an order, or none
      description: 'Locks positions in (sku, node) order, allocates lots FEFO and holds stock for the reservation TTL (15
        min). The order id is the idempotency key: a retry returns the existing reservation with 200 and replayed=true and
        never reserves twice.'
      operationId: reserve
      parameters:
      - name: Idempotency-Key
        in: header
        description: Unique per attempt; replays return the stored result
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
        required: true
      responses:
        '201':
          description: Reserved
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
        '200':
          description: Replay of an earlier reservation for this order
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
        '409':
          description: inventory.insufficient-stock with per-SKU shortfalls
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/reservations/{orderId}:
    get:
      tags:
      - Reservations
      summary: Get the reservation of an order (orders service or staff)
      operationId: get
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
  /v1/reservations/{orderId}/commit:
    post:
      tags:
      - Reservations
      summary: 'Ship the order: SHIP movements, lot decrements and COGS at lot landed cost'
      description: 'Idempotent: committing a committed reservation returns the same result with replayed=true.'
      operationId: commit
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommitResult'
  /v1/reservations/{orderId}/confirm:
    post:
      tags:
      - Reservations
      summary: 'Payment authorised: keep the hold until shipment (no more TTL)'
      operationId: confirm
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
  /v1/reservations/{orderId}/groups/commit:
    post:
      tags:
      - Reservations
      summary: Ship only some groups (one shipment's lines)
      description: 'Commits the held lines of the groups: SHIP movements and COGS for those lines only; other groups stay
        held. Idempotent per group. 404 inventory.group-not-found for unknown groups (reservations made without groups use
        /commit).'
      operationId: commitGroups
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationGroupsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommitResult'
  /v1/reservations/{orderId}/groups/release:
    post:
      tags:
      - Reservations
      summary: Release only some groups (one cancelled shipment)
      description: Gives the held lines of the groups back to available stock; other groups stay held. Idempotent; 409 inventory.group-committed
        when a line already shipped.
      operationId: releaseGroups
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationGroupsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
  /v1/reservations/{orderId}/release:
    post:
      tags:
      - Reservations
      summary: Release a held reservation (cancellation or payment failure)
      description: 'Idempotent: releasing a released or expired reservation returns it unchanged.'
      operationId: release
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Reservation'
  /v1/returns:
    post:
      tags:
      - Returns
      summary: Restock a returned unit or move it to the lot's -DMG lot (inventory:adjust, or a SERVICE with inventory:returns)
      description: RETURN_RESTOCK puts units back into their sellable lot; RETURN_DAMAGED holds them in <lot>-DMG. Never more
        than the order shipped. With receivingNodeId the units go into the same lot number at that node (e.g. the return centre).
      operationId: accept
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReturnResult'
  /v1/skus/{sku}/dimensions:
    get:
      tags:
      - Storage
      summary: A SKU's unit dimensions (inventory:read)
      operationId: dimensions
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SkuDimensions'
    put:
      tags:
      - Storage
      summary: Set a SKU's unit dimensions (inventory:adjust or inventory:receive)
      operationId: setDimensions
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuDimensionsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SkuDimensions'
  /v1/storage/snapshots:
    post:
      tags:
      - Storage
      summary: Retake today's storage snapshot now (inventory:adjust)
      description: The hourly job does this; the last snapshot of a UTC day stands. Idempotent.
      operationId: snapshot
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StorageSnapshotResult'
  /v1/storage/usage:
    get:
      tags:
      - Storage
      summary: Cubic-feet-days per owner organisation and UTC day (metered billing, S206)
      description: SERVICE principals with inventory:storage.read (seller-service) and staff with inventory:read see every
        owner (optionally ownerOrg); seller members only their own organisation. Inclusive range of at most 93 days; physical
        stock in fulfilment centres only (on hand + damaged).
      operationId: usage
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: ownerOrg
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StorageUsage'
components:
  schemas:
    SkuDimensionsRequest:
      type: object
      description: Outer dimensions of one sellable unit, in inches
      properties:
        lengthIn:
          type: number
          examples:
          - 12
        widthIn:
          type: number
          examples:
          - 8
        heightIn:
          type: number
          examples:
          - 4.5
      required:
      - heightIn
      - lengthIn
      - widthIn
    SkuDimensions:
      type: object
      properties:
        sku:
          type: string
        lengthIn:
          type: number
        widthIn:
          type: number
        heightIn:
          type: number
        unitCubicFeet:
          type: number
          description: Volume of one unit in cubic feet
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    PostalAddress:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        line1:
          type: string
          maxLength: 200
          minLength: 0
        line2:
          type: string
          maxLength: 200
          minLength: 0
        city:
          type: string
          maxLength: 100
          minLength: 0
        region:
          type: string
          maxLength: 60
          minLength: 0
        postalCode:
          type: string
          maxLength: 20
          minLength: 0
        country:
          type: string
          description: ISO 3166-1 alpha-2
          maxLength: 2
          minLength: 2
        phone:
          type: string
          maxLength: 40
          minLength: 0
    InboundBoxInput:
      type: object
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/InboundBoxItem'
          maxItems: 200
          minItems: 0
        weightLb:
          type: number
          maximum: 150
          minimum: 0.01
        lengthIn:
          type: number
          minimum: 0
        widthIn:
          type: number
          minimum: 0
        heightIn:
          type: number
          minimum: 0
      required:
      - contents
    InboundBoxItem:
      type: object
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 0
        qty:
          type: integer
          format: int32
          minimum: 1
      required:
      - sku
    InboundPlanLine:
      type: object
      properties:
        atin:
          type: string
          maxLength: 10
          minLength: 0
        sku:
          type: string
          description: 'Inventory SKU (the FBA offer''s inventory SKU); default: your AT-FN unit label code'
          maxLength: 64
          minLength: 0
        qty:
          type: integer
          format: int32
          maximum: 100000
          minimum: 1
      required:
      - atin
    InboundPlanUpdateRequest:
      type: object
      description: Replaces the lines and / or boxes of a WORKING plan; omitted lists are kept
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InboundPlanLine'
          maxItems: 200
          minItems: 0
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/InboundBoxInput'
          maxItems: 200
          minItems: 0
    InboundBox:
      type: object
      properties:
        boxNo:
          type: integer
          format: int32
        lpn:
          type: string
          description: Carton license plate (LPN + 8)
        contents:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        units:
          type: integer
          format: int32
        weightLb:
          type: number
        lengthIn:
          type: number
        widthIn:
          type: number
        heightIn:
          type: number
        receivedAt:
          type: string
          format: date-time
    InboundDiscrepancy:
      type: object
      properties:
        sku:
          type: string
        atin:
          type: string
        type:
          type: string
          enum:
          - SHORT
          - OVER
          - DAMAGED
          - UNEXPECTED
        expectedQty:
          type: integer
          format: int32
        receivedQty:
          type: integer
          format: int32
        qty:
          type: integer
          format: int32
    InboundLine:
      type: object
      properties:
        lineNo:
          type: integer
          format: int32
        sku:
          type: string
        atin:
          type: string
        unitLabel:
          type: string
          description: AT-FN unit label code (seller-specific)
        expectedQty:
          type: integer
          format: int32
        receivedGood:
          type: integer
          format: int32
        receivedDamaged:
          type: integer
          format: int32
        shortQty:
          type: integer
          format: int32
        overQty:
          type: integer
          format: int32
        inboundOpen:
          type: integer
          format: int32
          description: Expected units still counted as inbound
    InboundShipment:
      type: object
      description: An FBA inbound plan or a retail ASN with what was received
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        source:
          type: string
          description: FBA | RETAIL_ASN
        externalRef:
          type: string
        ownerOrg:
          type: string
        nodeId:
          type: string
        requestedNodeId:
          type: string
        assignmentReason:
          type: string
        name:
          type: string
        status:
          type: string
          description: WORKING | SHIPPED | RECEIVING | CLOSED | CANCELLED
        shipFrom:
          $ref: '#/components/schemas/PostalAddress'
        shipTo:
          $ref: '#/components/schemas/PostalAddress'
        carrier:
          type: string
        trackingNumber:
          type: string
        trackingSource:
          type: string
          description: SELLER | CARRIER_GATEWAY
        carrierLabelId:
          type: string
        labelCostMinor:
          type: integer
          format: int64
        labelCurrency:
          type: string
        labelDocumentUrl:
          type: string
        expectedArrival:
          type: string
          format: date
        expectedUnits:
          type: integer
          format: int32
        receivedUnits:
          type: integer
          format: int32
        receiptCount:
          type: integer
          format: int32
        discrepancy:
          type: boolean
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/InboundDiscrepancy'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InboundLine'
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/InboundBox'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        shippedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    Item:
      type: object
      properties:
        sku:
          type: string
        qty:
          type: integer
          format: int32
    InboundTrackingRequest:
      type: object
      description: Carrier and tracking number of a label bought elsewhere
      properties:
        carrier:
          type: string
          description: usps, ups, fedex, dhl …
          maxLength: 40
          minLength: 0
        trackingNumber:
          type: string
          maxLength: 60
          minLength: 0
      required:
      - carrier
      - trackingNumber
    InboundTrackingResult:
      type: object
      properties:
        shipment:
          $ref: '#/components/schemas/InboundShipment'
        trackingRegistered:
          type: boolean
          description: carrier-gateway tracks the number (scans update the shipment)
    StorageSnapshotResult:
      type: object
      properties:
        day:
          type: string
          format: date
          description: UTC day the snapshot is for
        rows:
          type: integer
          format: int32
          description: Owner × node rows written
    ReturnRequest:
      type: object
      description: A returned item after inspection
      properties:
        orderId:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        lotId:
          type: string
          format: uuid
        qty:
          type: integer
          format: int32
          exclusiveMinimum: 0
        condition:
          type: string
          enum:
          - RESTOCK
          - DAMAGED
        reason:
          type: string
          maxLength: 500
          minLength: 0
        receivingNodeId:
          type: string
          description: Warehouse that received the parcel (e.g. the return centre); default = the node the unit shipped from
          maxLength: 20
          minLength: 0
      required:
      - condition
      - orderId
      - reason
      - sku
    Lot:
      type: object
      description: A batch of one SKU at one node with dates, bin, unit landed cost and status
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        lotNo:
          type: string
        nodeId:
          type: string
        ownerOrg:
          type: string
        bin:
          type: string
        qtyOnHand:
          type: integer
          format: int32
        qtyReserved:
          type: integer
          format: int32
        qtyAvailable:
          type: integer
          format: int32
        mfgDate:
          type: string
          format: date
        expDate:
          type: string
          format: date
        receivedAt:
          type: string
          format: date-time
        unitLandedCostMinor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        reason:
          type: string
        markdownFlag:
          type: string
        receiptRef:
          type: string
        version:
          type: integer
          format: int64
    ReturnResult:
      type: object
      properties:
        orderId:
          type: string
        sku:
          type: string
        qty:
          type: integer
          format: int32
        condition:
          type: string
          enum:
          - RESTOCK
          - DAMAGED
        lot:
          $ref: '#/components/schemas/Lot'
        replayed:
          type: boolean
    ReserveLine:
      type: object
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 0
        nodeId:
          type: string
          description: Node chosen by the promise service; omit to let inventory choose
        qty:
          type: integer
          format: int32
          maximum: 10000
          minimum: 1
        group:
          type: string
          description: 'Caller''s grouping key (orders: the order line id); groups can be committed or released on their own
            (one shipment at a time)'
          maxLength: 80
          minLength: 0
      required:
      - sku
    ReserveRequest:
      type: object
      description: All lines are reserved or none; orderId makes the call idempotent
      properties:
        orderId:
          type: string
          maxLength: 80
          minLength: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReserveLine'
          maxItems: 100
          minItems: 0
      required:
      - lines
      - orderId
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    LotAllocation:
      type: object
      properties:
        lotId:
          type: string
          format: uuid
        lotNo:
          type: string
        qty:
          type: integer
          format: int32
        expDate:
          type: string
          format: date
        unitLandedCostMinor:
          type: integer
          format: int64
        currency:
          type: string
    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ReservationLine'
        replayed:
          type: boolean
    ReservationLine:
      type: object
      properties:
        lineNo:
          type: integer
          format: int32
        sku:
          type: string
        nodeId:
          type: string
        qty:
          type: integer
          format: int32
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/LotAllocation'
        group:
          type: string
        status:
          type: string
          description: HELD, COMMITTED or RELEASED
        stockOwnerOrgId:
          type: string
    ReleaseRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
    ReservationGroupsRequest:
      type: object
      description: 'The groups (orders: line ids of one shipment) to commit or release'
      properties:
        groups:
          type: array
          items:
            type: string
            maxLength: 80
            minLength: 0
          maxItems: 100
          minItems: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - groups
    CommitResult:
      type: object
      description: Shipped reservation with COGS at lot landed cost
      properties:
        reservation:
          $ref: '#/components/schemas/Reservation'
        cogs:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineCost'
        replayed:
          type: boolean
    LineCost:
      type: object
      properties:
        lineNo:
          type: integer
          format: int32
        sku:
          type: string
        nodeId:
          type: string
        qty:
          type: integer
          format: int32
        cogs:
          type: array
          items:
            $ref: '#/components/schemas/Money'
        group:
          type: string
        stockOwnerOrgId:
          type: string
    Money:
      type: object
      properties:
        currency:
          type: string
        amountMinor:
          type: integer
          format: int64
    PositionDrift:
      type: object
      properties:
        sku:
          type: string
        nodeId:
          type: string
        position:
          $ref: '#/components/schemas/StockLevels'
        ledger:
          $ref: '#/components/schemas/StockLevels'
        lots:
          $ref: '#/components/schemas/StockLevels'
    ReconciliationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ranAt:
          type: string
          format: date-time
        positionsChecked:
          type: integer
          format: int32
        driftUnits:
          type: integer
          format: int64
        clean:
          type: boolean
        drifts:
          type: array
          items:
            $ref: '#/components/schemas/PositionDrift'
    StockLevels:
      type: object
      properties:
        onHand:
          type: integer
          format: int32
        reserved:
          type: integer
          format: int32
        damaged:
          type: integer
          format: int32
        inbound:
          type: integer
          format: int32
    ReceiptLine:
      type: object
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 0
        lotNo:
          type: string
          maxLength: 59
          minLength: 0
        mfgDate:
          type: string
          format: date
        expDate:
          type: string
          format: date
        qtyGood:
          type: integer
          format: int32
          minimum: 0
        qtyDamaged:
          type: integer
          format: int32
          minimum: 0
        bin:
          type: string
          maxLength: 30
          minLength: 0
        unitLandedCostMinor:
          type: integer
          format: int64
          minimum: 0
