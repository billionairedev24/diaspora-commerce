              allOf:
              - $ref: '#/components/schemas/FactDefinition'
              - $ref: '#/components/schemas/FactRequirement'
          decisionTable: {type: array, items: {$ref: '#/components/schemas/DecisionRow'}}
          changedBy: {type: string}
          changedAt: {type: string, format: date-time}
          note: {type: string}
          history:
            type: array
            description: Status changes of the profile, newest first (detail only)
            items:
              type: object
              properties:
                at: {type: string, format: date-time}
                actor: {type: string}
                kind: {type: string}
                reason: {type: string}
                approvedBy: {type: string}
                decisionRef: {type: string}
                ruleVersion: {type: string}
                before: {type: object, additionalProperties: {}}
                after: {type: object, additionalProperties: {}}
    TaxProfileStatusChange:
      type: object
      required: [status, reason]
      properties:
        status: {$ref: '#/components/schemas/ProfileStatus'}
        reason: {type: string, minLength: 3}
        approvedBy: {type: string, description: 'Name or firm of the tax professional who approved, required when lifting NEEDS_APPROVAL, CONFLICT_OPEN or BLOCKED_BUNDLE'}
        decisionRef: {type: string, description: Reference to the signed-off open decision or opinion letter}
    ProviderCodeMapEntry:
      type: object
      properties:
        internalTaxCode: {type: string}
        categoryCode: {type: string}
        outcome: {$ref: '#/components/schemas/TaxOutcome'}
        provider: {$ref: '#/components/schemas/TaxProvider'}
        providerCode: {type: [string, 'null']}
        verified: {type: boolean, description: A person confirmed the provider treats this code as this outcome}
        active: {type: boolean, description: The mapping may be used for a quote}
        verifiedNote: {type: string}
        note: {type: string, description: Same as verifiedNote (why the entry was set or verified)}
        mapVersion: {type: integer}
        changedBy: {type: string}
        changedAt: {type: string, format: date-time}
    ProviderCodeMapUpdate:
      type: object
      required: [provider, reason]
      properties:
        provider: {$ref: '#/components/schemas/TaxProvider'}
        providerCode: {type: [string, 'null'], description: Null clears the mapping}
        verified: {type: boolean}
        reason: {type: string, minLength: 3}
    ClassificationReviewReason:
      type: string
      description: 'Why a classification record needs a person: AUDIT_SAMPLE (approved by the system, live, waiting to be confirmed), CONFLICT (open decision on the category), REGULATED_CATEGORY (needs the tax professional''s sign-off), CODE_TO_VERIFY (generic provider code), BLOCKED (mixed bundle), NO_MATCHING_RULE (no decision row matches), MISSING_FACT (a required answer is missing), CHANGED (facts or category changed after approval), WITH_SELLER (sent back), NEW_LISTING (resolved, waiting for its first check)'
      enum: [AUDIT_SAMPLE, CONFLICT, REGULATED_CATEGORY, CODE_TO_VERIFY, BLOCKED, NO_MATCHING_RULE, MISSING_FACT, CHANGED, WITH_SELLER, NEW_LISTING]
    VariantClassification:
      type: object
      properties:
        atin: {type: string, description: The variant ATIN (the document's SKU)}
        gtin: {type: string}
        productId: {type: string, format: uuid}
        title: {type: string}
        categoryCode: {type: string}
        productTypeCode: {type: string}
        status: {$ref: '#/components/schemas/ClassificationRecordStatus'}
        facts: {type: object, additionalProperties: {}}
        staffFacts: {type: object, additionalProperties: {}, description: Facts set by tax review (owner STAFF)}
        ordersAffected: {type: integer, format: int64, description: Orders placed with this variant (detail only)}
        auditSample: {type: boolean, description: 'Approved by the system under the risk-based rule and waiting in the audit sample for a reviewer to confirm or reclassify it. The item is live meanwhile.'}
        auditSampledAt: {type: [string, 'null'], format: date-time}
        reviewReason: {type: [string, 'null'], description: 'Why a person has to review it, in plain words: Conflict, No matching rule, Missing answer, Missing proof, Regulated category, Needs sign-off or Blocked. Null when nothing waits or the rules would approve it.'}
        informationRequest:
          type: [object, 'null']
          description: What tax review asked the seller to provide; cleared when the seller's facts change
          properties:
            message: {type: string}
            requestedBy: {type: string}
            requestedAt: {type: string, format: date-time}
        ownerOrgId: {type: string}
        sellerOrgIds: {type: [array, 'null'], items: {type: string}, description: 'Organisations that sell the variant: the owner first, then every seller seen in a stored decision (list items only)'}
        reviewReasonCode:
          description: 'Why a person has to review it, derived from the stored state; null when nothing waits (an approved item outside the audit sample)'
          oneOf:
          - $ref: '#/components/schemas/ClassificationReviewReason'
          - type: 'null'
        evidence:
          type: array
          items:
            type: object
            properties:
              factId: {type: string}
              fileName: {type: string}
              url: {type: string}
              uploadedBy: {type: string}
              uploadedAt: {type: string, format: date-time}
        refinedProviderCodes: {type: object, additionalProperties: {type: string}, description: 'Verified SKU-level code per provider for REFINE_CODE profiles'}
        resolution: {$ref: '#/components/schemas/ClassificationResolveResponse'}
        decisions:
          type: array
          description: The stored decision per selling organisation (variant facts plus that seller's behaviour facts)
          items:
            type: object
            properties:
              sellerOrgId: {type: string}
              sellerBehaviour: {type: object, additionalProperties: {}}
              resolution: {$ref: '#/components/schemas/ClassificationResolveResponse'}
        classifiedBy: {type: string}
        classifiedAt: {type: string, format: date-time}
        reviewedBy: {type: string}
        reviewedAt: {type: string, format: date-time}
        ruleVersion: {type: string}
        audit:
          type: array
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              actor: {type: string}
              action: {type: string, enum: [FACTS_CHANGED, SUBMITTED, APPROVED, REJECTED, RECLASSIFIED, MARKED_STALE, EVIDENCE_ADDED, INFORMATION_REQUESTED, AUDIT_SAMPLED, AUDIT_CONFIRMED]}
              reason: {type: string}
              ruleVersion: {type: string}
              before: {type: object, additionalProperties: {}}
              after: {type: object, additionalProperties: {}}
    VariantClassificationPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/VariantClassification'}}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}
    ClassificationApproveRequest:
      type: object
      properties:
        reason: {type: string}
        staffFacts: {type: object, additionalProperties: {}, description: Facts owned by STAFF, such as exemption_confirmed}
        refinedProviderCodes: {type: object, additionalProperties: {type: string}}
        decisionRef: {type: string, description: Reference of the tax professional's sign-off}
    ClassificationReclassifyRequest:
      type: object
      required: [categoryCode, reason]
      properties:
        categoryCode: {type: string}
        productTypeCode: {type: string}
        reason: {type: string, minLength: 3}
    ShadowReport:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        provider: {$ref: '#/components/schemas/TaxProvider'}
        linesCompared: {type: integer, format: int64}
        linesDiffering: {type: integer, format: int64}
        absoluteDifferenceMinor: {type: integer, format: int64}
        netDifferenceMinor: {type: integer, format: int64, description: provider minus in-house}
        byInternalTaxCode:
          type: array
          items:
            $ref: '#/components/schemas/ShadowGroup'
        thresholds:
          type: object
          description: '"Ready to cut over?" thresholds (placeholders to agree with the tax adviser): minDays, minLines, minLinesPerCode, maxOutcomeDisagreementPct, maxProviderErrorPct'
          additionalProperties: {type: number}
        byCategory: {type: array, items: {$ref: '#/components/schemas/ShadowGroup'}}
        byOutcome: {type: array, items: {$ref: '#/components/schemas/ShadowGroup'}, description: 'Per in-house outcome (EXEMPT, TAXABLE or NONE)'}
        byState: {type: array, items: {$ref: '#/components/schemas/ShadowGroup'}}
        byKind: {type: array, items: {$ref: '#/components/schemas/ShadowGroup'}, description: 'MATCH, OUTCOME, RATE, PROVIDER_ERROR, NO_DECISION'}
        differences:
          type: array
          items:
            $ref: '#/components/schemas/ShadowDifference'
        page: {type: integer}
        size: {type: integer}
    ShadowGroup:
      type: object
      description: A group of compared lines and how many of them disagree
      properties:
        key: {type: string, description: 'The internal tax code, category, outcome, state or kind'}
        internalTaxCode: {type: string, description: Set for byInternalTaxCode groups}
        providerCode: {type: string}
        lines: {type: integer, format: int64}
        differing: {type: integer, format: int64}
        disagreementRate: {type: number, description: differing divided by lines}
        absoluteDifferenceMinor: {type: integer, format: int64}
    ShadowDifference:
      type: object
      properties:
        orderRef: {type: string, description: The order or cart id the quote carried}
        categoryCode: {type: string}
        state: {type: string}
        shipToState: {type: string, description: Same as state}
        orderId: {type: string, format: uuid}
        lineId: {type: string}
        atin: {type: string}
        internalTaxCode: {type: string}
        providerCode: {type: string}
        kind: {type: string, enum: [OUTCOME, RATE, BOTH, PROVIDER_ERROR, NO_DECISION]}
        inHouse: {$ref: '#/components/schemas/ShadowQuoteSide'}
        provider: {$ref: '#/components/schemas/ShadowQuoteSide'}
        differenceMinor: {type: integer, format: int64}
        quotedAt: {type: string, format: date-time}
    ShadowQuoteSide:
      type: object
      properties:
        outcome: {$ref: '#/components/schemas/TaxOutcome'}
        rate: {type: number, description: Fraction, 0.0825 = 8.25 %}
        taxMinor: {type: integer, format: int64}
        error: {type: string}
    ListingDecisionRequest:
      type: object
      required: [atin, sellerOrgId]
      properties:
        atin: {type: string, pattern: 'AT[0-9A-Z]{8}'}
        sellerOrgId: {type: string, minLength: 1, maxLength: 80}
        sellerBehaviour:
          type: object
          additionalProperties: {}
          description: The seller's behaviour facts for this listing (sold_heated, utensils_provided ...). Empty means none given.
    ListingDecisionState:
      type: object
      required: [atin, sellerOrgId, status, resolved]
      properties:
        atin: {type: string}
        sellerOrgId: {type: string}
        status:
          type: string
          description: RESOLVED, MISSING (no stored decision) or the unresolved ResolveStatus (MISSING_FACTS, BLOCKED, NEEDS_APPROVAL, REFINE_CODE, CONFLICT_OPEN)
          enum: [RESOLVED, MISSING, MISSING_FACTS, BLOCKED, NEEDS_APPROVAL, REFINE_CODE, CONFLICT_OPEN]
        resolved:
          type: boolean
          description: True only for RESOLVED with a stored decision
        outcome: {$ref: '#/components/schemas/TaxOutcome'}
        internalTaxCode: {type: [string, 'null']}
        ruleVersion: {type: [string, 'null']}
        decidedAt: {type: [string, 'null'], format: date-time}
        reasons:
          type: array
          description: Plain reasons when not resolved
          items: {type: string}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
