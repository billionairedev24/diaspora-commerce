openapi: 3.1.0
info:
  title: Tax & Returns API
  description: 'Marketplace-facilitator sales tax (quotes, rate table, ledger, monthly liability and seller statements), returns
    (RMAs: eligibility, drop-off labels, driver pickup, inspection) and refund orchestration through payments-service with
    restock / quarantine in inventory-service.'
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8111
  description: local
- url: https://api-dev.afrotransact.com/tax-returns
  description: dev
- url: https://api-uat.afrotransact.com/tax-returns
  description: uat
- url: https://api.afrotransact.com/tax-returns
  description: prod
security:
- bearer: []
tags:
- name: Returns
  description: Start a return on delivered items, RMA lifecycle, inspection and seller policies
- name: Refunds
  description: 'Refund orchestration: partial refunds, refund history and retries'
- name: Tax classification
  description: 'Category tax profiles, outcome-level internal codes, provider code maps, per-variant classification records and review'
- name: Tax shadow
  description: Provider-versus-in-house comparison on real orders (never charged)
- name: Tax
  description: 'Marketplace-facilitator sales tax: quotes, rate table, ledger and liability reports'
paths:
  /v1/refunds:
    get:
      tags:
      - Refunds
      summary: 'Refunds of an order or of a return (staff: refunds:issue or returns:manage)'
      operationId: list
      parameters:
      - name: orderId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: rmaId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Refund'
    post:
      tags:
      - Refunds
      summary: Partial refund without return (Idempotency-Key; staff or the seller of every line)
      description: Calls payments POST /v1/payments/{id}/refunds with Idempotency-Key = refund id; payments reverses the seller
        transfer portion and commission. AfroTransact Retail lines have neither (payments debits Retail sales; nothing is
        transferred). The tax reversal is booked in the ledger.
      operationId: create_1
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefund'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Refund'
  /v1/refunds/{id}:
    get:
      tags:
      - Refunds
      summary: A refund
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Refund'
  /v1/refunds/{id}/retry:
    post:
      tags:
      - Refunds
      summary: Send a pending or failed refund to payments again (same Idempotency-Key; refunds:issue)
      operationId: retry
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Refund'
  /v1/return-policies/{orgId}:
    get:
      tags:
      - Returns
      summary: A seller's return policy (returns:manage for the organisation, or staff)
      operationId: policy
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerReturnPolicy'
    put:
      tags:
      - Returns
      summary: 'Set the seller''s return policy: window ≥ 14 days, restocking fee ≤ 20 %, return address'
      operationId: putPolicy
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerReturnPolicy'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerReturnPolicy'
  /v1/returns:
    get:
      tags:
      - Returns
      summary: 'Returns: customers see their own, sellers their organisation''s, staff filter by seller'
      operationId: search
      parameters:
      - name: orderId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - REQUESTED
          - APPROVED
          - AUTO_APPROVED
          - LABEL_ISSUED
          - IN_TRANSIT
          - RECEIVED
          - INSPECTED
          - REFUNDED
          - REJECTED
          - CANCELLED
      - name: sellerOrgId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rma'
    post:
      tags:
      - Returns
      summary: Start a return (Idempotency-Key required; same key replays the same RMA)
      description: Auto-approved returns come back with the label / QR (drop-off), the handover code (driver pickup) or the
        refund (no return). Seller-fulfilled returns wait for the seller until the SLA.
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReturn'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/eligibility:
    get:
      tags:
      - Returns
      summary: 'What can be returned from an order (per shipment and line: window, methods, report a problem)'
      operationId: eligibility
      parameters:
      - name: orderId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReturnEligibility'
  /v1/returns/number/{number}:
    get:
      tags:
      - Returns
      summary: A return by its number (RMA-XXXXXXXX), e.g. scanned from the QR code
      operationId: byNumber
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/{id}:
    get:
      tags:
      - Returns
      summary: A return
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/{id}/approve:
    post:
      tags:
      - Returns
      summary: Approve (seller for seller-fulfilled, staff otherwise; returns:manage)
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/{id}/cancel:
    post:
      tags:
      - Returns
      summary: Cancel a return before drop-off / pickup (customer)
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/{id}/inspect:
    post:
      tags:
      - Returns
      summary: 'Inspection per line: restock or damaged; passed lines are refunded (returns:manage)'
      description: AfroTransact-fulfilled lines post RETURN_RESTOCK / RETURN_DAMAGED to inventory.
      operationId: inspect
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inspection'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/{id}/label:
    post:
      tags:
      - Returns
      summary: Retry the return label / handover code of an approved return (staff, returns:manage)
      operationId: label
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/{id}/pickup:
    post:
      tags:
      - Returns
      summary: Driver collected the parcel with the customer's handover code (delivery:operate)
      operationId: pickup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pickup'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/{id}/receive:
    post:
      tags:
      - Returns
      summary: Parcel received at the seller or return centre (returns:manage)
      operationId: receive
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/returns/{id}/refund-quote:
    get:
      tags:
      - Returns
      summary: Refund estimate of the return (items + proportional tax + fault shipping − restocking fee)
      operationId: refundQuote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RefundQuote'
  /v1/returns/{id}/reject:
    post:
      tags:
      - Returns
      summary: Reject with a note to the customer (returns:manage)
      operationId: reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Rma'
  /v1/tax/liability:
    get:
      tags:
      - Tax
      summary: Monthly marketplace liability per jurisdiction (tax:read)
      operationId: liability
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LiabilityReport'
  /v1/tax/liability/export:
    get:
      tags:
      - Tax
      summary: Monthly liability as CSV (tax:read)
      operationId: liabilityCsv
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
  /v1/tax/orders/{orderId}/transactions:
    get:
      tags:
      - Tax
      summary: 'Tax ledger entries of an order: sales and refund reversals (tax:read)'
      operationId: transactions
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxTransaction'
  /v1/tax/quotes:
    post:
      tags:
      - Tax
      summary: Quote tax per line for a cart or order (tax:quote; orders-service at checkout)
      description: rate = state rate for the category + local rate for the ZIP; tax = taxable × rate rounded half up once
        per line. Non-facilitator states and non-US addresses get no tax.
      operationId: quote
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxQuoteRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxQuote'
  /v1/tax/rates:
    get:
      tags:
      - Tax
      summary: 'The rate table: state rules and local ZIP rates (tax:read)'
      operationId: rates
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxRateTable'
  /v1/tax/rates/local/{state}/{zipPrefix}:
    put:
      tags:
      - Tax
      summary: Create or update a local rate for a 5-digit ZIP or 3-digit prefix (tax:configure)
      operationId: putLocal
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
      - name: zipPrefix
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalTaxRate'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LocalTaxRate'
    delete:
      tags:
      - Tax
      summary: Delete a local rate (tax:configure)
      operationId: deleteLocal
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
      - name: zipPrefix
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/tax/rates/import:
    post:
      tags:
      - Tax
      summary: Bulk upsert state rules and local ZIP rates from CSV (tax:configure)
      description: 'Header: kind,country,state,name,zipPrefix,generalRate,groceryRate,preparedFoodRate,shippingTaxable,facilitator,localRate,appliesToGrocery.
        kind=STATE|LOCAL.'
      operationId: importRates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRatesImportRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxRatesImportResult'
  /v1/tax/rates/states/{state}:
    put:
      tags:
      - Tax
      summary: Create or update a state rule (tax:configure; version from the last read to update)
      operationId: putState
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateTaxRule'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StateTaxRule'
  /v1/tax/settings:
    get:
      tags:
      - Tax settings
      summary: The tax method in force and its history (tax:read)
      operationId: taxSettings
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxSettings'
    put:
      tags:
      - Tax settings
      summary: Switch who calculates sales tax (tax:configure)
      description: RULES is our own rules over the rate tables and tax codes; STRIPE_TAX needs Stripe Tax set up (422 tax.stripe-not-set-up otherwise). A reason is required and the change is recorded. It applies to new quotes; placed orders keep the tax they were charged.
      operationId: changeTaxMethod
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxMethodChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxSettings'
  /v1/tax/review-settings:
    get:
      tags:
      - Tax settings
      summary: The tax review mode, always-review list, audit sample percentage and their history (tax:read)
      operationId: taxReviewSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxReviewSettings'
    put:
      tags:
      - Tax settings
      summary: Set the tax review mode, always-review list and audit sample percentage (tax:classify-admin)
      description: 'taxReview.mode is RISK_BASED until staff change it: the rules decide and a person reviews only exceptions. A classification is approved by the system (actor auto) only when the category is ACTIVE, the rules resolve cleanly (RESOLVED), no required evidence is missing and the category is not on the always-review list; everything else (a conflict, no matching rule, a missing answer or proof, a regulated category) and every category whose status is NEEDS_APPROVAL, REFINE_CODE, CONFLICT_OPEN or BLOCKED_BUNDLE stays in the review queue. ALL sends every classification to a person. A reason of 10+ characters is required (422 tax.reason-required) and the change is recorded. alwaysReview replaces the list, absent keeps it (422 tax.unknown-category); auditPercent 0 to 100, absent keeps it (422 tax.invalid-audit-percent). Switching to RISK_BASED also approves the records already waiting in review that the rules decide (audited as auto, tax.classification.changed published so catalog re-opens the gate); a scheduled sweep does the same for records that qualify later. Needs tax:classify-admin only (403 otherwise).'
      operationId: changeTaxReviewSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxReviewSettingsChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxReviewSettings'
        '403':
          description: Needs tax:classify-admin
        '422':
          description: tax.reason-required, tax.unknown-category or tax.invalid-audit-percent
  /v1/tax/remittances:
    get:
      tags:
      - Tax remittance
      summary: Month by month and state by state, tax due, remitted and outstanding (tax:read)
      description: The last `months` months (default 6) up to `through` (default this month), newest first. Due is the ledger's net liability now, so a refund or late sale after filing shows as changedSinceFilingMinor and moves the status to OWES_MORE or OVERPAID.
      operationId: taxObligations
      parameters:
      - name: through
        in: query
        required: false
        schema: {type: string, example: 2026-09}
      - name: months
        in: query
        required: false
        schema: {type: integer, format: int32, default: 6}
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ObligationsResponse'
    post:
      tags:
      - Tax remittance
      summary: Record a filing and payment to a state (tax:configure)
      description: 409 tax.remittance-exists when the month and state already have an active record (void it first); 422 for a future month or date. The amount due at the time is stored with it.
      operationId: recordTaxRemittance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRemittanceRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxRemittance'
  /v1/tax/remittances/{month}/{jurisdiction}:
    get:
      tags:
      - Tax remittance
      summary: One month and state (tax:read)
      operationId: taxObligation
      parameters:
      - {name: month, in: path, required: true, schema: {type: string}}
      - {name: jurisdiction, in: path, required: true, schema: {type: string}}
      - {name: currency, in: query, required: false, schema: {type: string, default: USD}}
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxFilingObligation'
  /v1/tax/remittances/{month}/history:
    get:
      tags:
      - Tax remittance
      summary: Every record of a month, voided ones included (tax:read)
      operationId: taxRemittanceHistory
      parameters:
      - {name: month, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxRemittance'
  /v1/tax/remittances/{id}/void:
    post:
      tags:
      - Tax remittance
      summary: Withdraw a mistaken record (tax:configure)
      description: The record stays visible as voided, with who and why. Record the correct one afterwards.
      operationId: voidTaxRemittance
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRemittanceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxRemittance'
  /v1/tax/nexus:
    get:
      tags:
      - Tax nexus
      summary: Nexus tracker, sales into each state over the last 12 months against its thresholds (tax:read)
      description: 'Most urgent first: EXCEEDED (past a threshold and not registered), APPROACHING (80 % or more), REGISTERED, BELOW. Thresholds are the defaults until staff set a state''s own; confirm them with a tax advisor. This tracks and warns; it registers nobody.'
      operationId: taxNexusTracker
      parameters:
      - {name: through, in: query, required: false, schema: {type: string, example: 2026-09}}
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NexusResponse'
  /v1/tax/nexus/{jurisdiction}:
    get:
      tags:
      - Tax nexus
      summary: One state (tax:read)
      operationId: taxNexusState
      parameters:
      - {name: jurisdiction, in: path, required: true, schema: {type: string, example: US-TX}}
      - {name: through, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxNexusState'
    put:
      tags:
      - Tax nexus
      summary: Record a state's thresholds and registration (tax:configure)
      description: A registration needs its number and the date it took effect. 422 tax.invalid-nexus otherwise.
      operationId: updateTaxNexus
      parameters:
      - {name: jurisdiction, in: path, required: true, schema: {type: string, example: US-TX}}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNexusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxNexusState'
  /v1/tax/reversals:
    post:
      tags:
      - Tax
      summary: Reverse tax for a refund made outside the returns flow (refunds:issue; idempotent per refundRef and line).
        Refunds published as payments.refunded are reversed automatically.
      operationId: reverse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxReversal'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaxReversalResult'
  /v1/tax/sellers/{orgId}/statement:
    get:
      tags:
      - Tax
      summary: Tax collected on a seller's behalf per jurisdiction, for the monthly statement (the seller with payouts:read,
        or staff with tax:read)
      operationId: sellerStatement
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: month
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LiabilityReport'
  /v1/tax/sellers/{orgId}/statement/export:
    get:
      tags:
      - Tax
      summary: Seller statement as CSV
      operationId: sellerStatementCsv
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: month
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
  /v1/tax/classifications/resolve:
    post:
      tags:
      - Tax classification
      summary: Resolve the tax outcome of a category and its facts, without charging anything (tax:classify)
      description: |
        Pure rules evaluation over the category tax profile (docs/engineering/category-tax-design.md). Never guesses: missing facts give
        status MISSING_FACTS with the fact ids and plain messages, and no outcome. A matched decision row gives outcome, internalTaxCode
        and the provider codes; the profile's status gate then decides the status (BLOCKED, CONFLICT_OPEN, NEEDS_APPROVAL, REFINE_CODE or RESOLVED).
        Only RESOLVED may be published or charged; consumers must act on status, not on outcome. Used by catalog-service (publish gate, seller form),
        the staff console and the quote path. DRAFT rules: a Texas tax professional must approve before production use.
      operationId: resolveClassification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationResolveRequest'
      responses:
        '200':
          description: The resolution (also 200 for MISSING_FACTS, BLOCKED and the other gates)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResolveResponse'
        '404':
          description: Unknown category or product type (tax.profile-not-found)
  /v1/tax/listing-decisions/status:
    post:
      tags:
      - Tax classification
      summary: Is the stored tax decision of these variants RESOLVED? Batched, read-only (tax:classify)
      description: |
        The catalog publish gate's authority. Reads the same classification record and rules checkout's quote reads (record APPROVED and the
        rules resolve to a chargeable outcome under the seller's behaviour), without a ship-to, without creating a record and without storing
        anything. A variant with no record is MISSING_FACTS. Only RESOLVED may be listed or sold. At most 500 variants per call.
      operationId: listingDecisionStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingDecisionStatusRequest'
      responses:
        '200':
          description: One answer per requested ATIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDecisionStatusResponse'
  /v1/tax/profiles:
    get:
      tags:
      - Tax classification
      summary: Category tax profiles with their status (tax:read)
      operationId: listTaxProfiles
      parameters:
      - {name: department, in: query, required: false, schema: {type: string}}
      - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/ProfileStatus'}}
      - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxProfileSummary'
  /v1/tax/profiles/{categoryCode}:
    get:
      tags:
      - Tax classification
      summary: One category tax profile with its facts and the ordered decision table (tax:read)
      operationId: getTaxProfile
      parameters:
      - {name: categoryCode, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxProfile'
        '404':
          description: tax.profile-not-found
  /v1/tax/profiles/{categoryCode}/status:
    put:
      tags:
      - Tax classification
      summary: Change a profile's status gate, with a reason (tax:classify-admin)
      description: Lifting a gate (to ACTIVE) records who approved and why, bumps the rule version and publishes tax.classification.changed. Lifting CONFLICT_OPEN needs the open decision's code to be set first (422 tax.profile-conflict-unresolved).
      operationId: changeTaxProfileStatus
      parameters:
      - {name: categoryCode, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxProfileStatusChange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxProfile'
        '422':
          description: tax.profile-conflict-unresolved
  /v1/tax/provider-code-map:
    get:
      tags:
      - Tax classification
      summary: The internal outcome code to provider code map (tax:read)
      operationId: listProviderCodeMap
      parameters:
      - {name: provider, in: query, required: false, schema: {$ref: '#/components/schemas/TaxProvider'}}
      - {name: categoryCode, in: query, required: false, schema: {type: string}}
      - {name: unmappedOnly, in: query, required: false, schema: {type: boolean}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderCodeMapEntry'
  /v1/tax/provider-code-map/{internalTaxCode}:
    put:
      tags:
      - Tax classification
      summary: Set or clear one provider's code for an internal outcome code (tax:classify-admin)
      description: Mapping is per outcome, never per category, because a provider code can carry different outcomes in different scenarios. A change is versioned and audited.
      operationId: updateProviderCode
      parameters:
      - {name: internalTaxCode, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCodeMapUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCodeMapEntry'
  /v1/tax/variant-classifications:
    get:
      tags:
      - Tax classification
      summary: Variant classification records; the review queue is status=PENDING_REVIEW (tax:read)
      description: 'auditSample=true lists the audit sample instead (status is ignored): items the system approved under the risk-based review rule that are live and wait for a reviewer to confirm (POST approve) or reclassify them. reason keeps the items that need a person for that reason (reviewReasonCode of each item). q matches the ATIN, GTIN or title, or a seller whose id is in qSellerOrgIds (the name lives in another service, so the caller resolves names to ids). Every item names its sellers (sellerOrgIds: the owner first, then every seller seen in a stored decision).'
      operationId: listVariantClassifications
      parameters:
      - {name: auditSample, in: query, required: false, description: 'Only the audit sample, oldest first', schema: {type: boolean, default: false}}
      - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/ClassificationRecordStatus'}}
      - {name: categoryCode, in: query, required: false, schema: {type: string}}
      - {name: sellerOrgId, in: query, required: false, schema: {type: string}}
      - {name: q, in: query, required: false, description: 'ATIN, GTIN or title', schema: {type: string}}
      - {name: qSellerOrgIds, in: query, required: false, description: 'Organisations whose name matched the search text: an item sold by one of them matches q too', style: form, explode: true, schema: {type: array, items: {type: string}}}
      - {name: reason, in: query, required: false, schema: {$ref: '#/components/schemas/ClassificationReviewReason'}}
      - {name: sort, in: query, required: false, description: 'Column to sort by; omitted keeps the queue order', schema: {type: string, enum: [title, atin, category, status, submitted, reviewed]}}
      - {name: order, in: query, required: false, schema: {type: string, enum: [asc, desc], default: asc}}
      - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 25}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantClassificationPage'
  /v1/tax/variant-classifications/{atin}:
    get:
      tags:
      - Tax classification
      summary: The classification record of one variant ATIN with its audit trail (tax:read)
      operationId: getVariantClassification
      parameters:
      - {name: atin, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantClassification'
        '404':
          description: tax.classification-not-found
  /v1/tax/variant-classifications/{atin}/approve:
    post:
      tags:
      - Tax classification
      summary: Approve a classification after review (tax:classify-admin)
      description: Fails with 422 unless the profile resolves to a chargeable decision. A REFINE_CODE profile needs the verified provider code in refinedProviderCodes; staff-owned facts (for example exemption_confirmed) are set here.
      operationId: approveVariantClassification
      parameters:
      - {name: atin, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationApproveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantClassification'
        '422':
          description: tax.classification-not-resolvable
  /v1/tax/variant-classifications/{atin}/request-information:
    post:
      tags:
      - Tax classification
      summary: Ask the seller for more information before a decision (tax:classify-admin)
      description: The message is stored on the record (informationRequest), audited as INFORMATION_REQUESTED and published in tax.classification.changed (reason = the message) so catalog and notifications can show or send it. It is cleared when the seller's facts change.
      operationId: requestVariantInformation
      parameters:
      - {name: atin, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 10, maxLength: 1000}
                reason: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantClassification'
        '404':
          description: tax.classification-not-found
        '422':
          description: tax.invalid-information-request
  /v1/tax/variant-classifications/{atin}/reclassify:
    post:
      tags:
      - Tax classification
      summary: Move a variant to another category or product type, with a reason (tax:classify-admin)
      description: The previous decision is kept in the audit trail; the record returns to PENDING_REVIEW and tax.classification.changed is published.
      operationId: reclassifyVariant
      parameters:
      - {name: atin, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationReclassifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantClassification'
  /v1/tax/listing-decisions:
    get:
      tags:
      - Tax classification
      summary: Does this seller have a stored tax decision on this variant? (service clients, offers-service, S384)
      description: |
        The decision is stored per (variant ATIN, seller behaviour) and lists the selling organisations it applies to
        (`listing_tax_decision`); the page owner's decision is **not** another seller's. `status` is `RESOLVED` only when a stored,
        RESOLVED decision names this organisation. Anything else (`MISSING` for no decision, or the unresolved status such as
        `NEEDS_APPROVAL`, `MISSING_FACTS`, `BLOCKED`) means the seller's offer must not be live. Read-only; never creates a
        decision. Needs tax:read (service token).
      operationId: getListingDecision
      parameters:
      - {name: atin, in: query, required: true, description: Variant ATIN, schema: {type: string, pattern: 'AT[0-9A-Z]{8}'}}
      - {name: sellerOrgId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 80}}
      responses:
        '200':
          description: The seller's decision state (MISSING is an answer, not an error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDecisionState'
        '403':
          description: Missing tax:read
  /v1/tax/listing-decisions/request:
    post:
      tags:
      - Tax classification
      summary: Ask for the seller's decision on a variant from the page's facts (service clients, offers-service, S384)
      description: |
        Resolves the variant's classification record (the page's facts, already reviewed for the page owner) under the
        seller's own behaviour facts and, when the outcome is chargeable (status `RESOLVED`), stores the decision for this
        organisation. **Never defaults a rate or an outcome**: when the record is not approved, facts are missing (a behaviour
        fact the seller has not given), or the profile is gated, nothing is stored and the answer carries that status with
        plain reasons, so the offer stays held. Idempotent: asking again returns the stored decision. For the page owner
        the owner's listing behaviour is used; another seller's behaviour is never assumed. Needs tax:classify (service token).
      operationId: requestListingDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingDecisionRequest'
      responses:
        '200':
          description: The state after the request (also 200 when not resolvable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDecisionState'
        '403':
          description: Missing tax:classify
        '404':
          description: tax.classification-not-found when tax-returns has no record for the ATIN (it asks catalog once)
  /v1/tax/shadow/report:
    get:
      tags:
      - Tax shadow
      summary: 'Shadow mode report: provider quote vs in-house quote on real orders (tax:read)'
      description: Lines where the two engines disagree on outcome or amount, grouped by internal tax code and provider code. Shadow quotes are logged and never charged.
      operationId: shadowReport
      parameters:
      - {name: from, in: query, required: true, schema: {type: string, format: date}}
      - {name: to, in: query, required: true, schema: {type: string, format: date}}
      - {name: provider, in: query, required: false, schema: {$ref: '#/components/schemas/TaxProvider'}}
      - {name: onlyDifferences, in: query, required: false, schema: {type: boolean, default: true}}
      - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
      - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowReport'
components:
  schemas:
    TaxNexusState:
      type: object
      properties:
        jurisdiction: {type: string, example: US-TX}
        name: {type: string}
        facilitator: {type: boolean}
        salesMinor: {type: integer, format: int64, description: Gross sales shipped there over the trailing 12 months, net of refunds}
        orders: {type: integer, format: int64}
        salesThresholdMinor: {type: integer, format: int64}
        transactionsThreshold: {type: integer, format: int32}
        percent: {type: integer, format: int32, description: The higher of the sales and transaction percentages of their thresholds}
        status: {type: string, enum: [REGISTERED, EXCEEDED, APPROACHING, BELOW]}
        registered: {type: boolean}
        registrationNumber: {type: string}
        registeredOn: {type: string, format: date}
        note: {type: string}
        customised: {type: boolean}
        updatedBy: {type: string}
        updatedAt: {type: string, format: date-time}
    NexusResponse:
      type: object
      properties:
        through: {type: string}
        windowMonths: {type: integer, format: int32}
        defaultSalesThresholdMinor: {type: integer, format: int64}
        states:
          type: array
          items:
            $ref: '#/components/schemas/TaxNexusState'
    UpdateNexusRequest:
      type: object
      required: [salesThresholdMinor, registered]
      properties:
        salesThresholdMinor: {type: integer, format: int64, minimum: 0}
        transactionsThreshold: {type: integer, format: int32, minimum: 0}
        registered: {type: boolean}
        registrationNumber: {type: string}
        registeredOn: {type: string, format: date}
        note: {type: string}
    TaxRemittance:
      type: object
      properties:
        id: {type: string, format: uuid}
        jurisdiction: {type: string, example: US-TX}
        month: {type: string, example: 2026-09}
        currency: {type: string}
        dueMinor: {type: integer, format: int64, description: Net liability when it was recorded}
        paidMinor: {type: integer, format: int64}
        filedOn: {type: string, format: date}
        paidOn: {type: string, format: date}
        confirmationRef: {type: string}
        paymentRef: {type: string}
        note: {type: string}
        recordedBy: {type: string}
        recordedAt: {type: string, format: date-time}
        voidedAt: {type: string, format: date-time}
        voidedBy: {type: string}
        voidReason: {type: string}
        active: {type: boolean}
    TaxFilingObligation:
      type: object
      properties:
        month: {type: string}
        jurisdiction: {type: string}
        currency: {type: string}
        dueMinor: {type: integer, format: int64, description: 'Net liability now: collected - refunded'}
        status: {type: string, enum: [NOTHING_DUE, NOT_FILED, SETTLED, OWES_MORE, OVERPAID]}
        outstandingMinor: {type: integer, format: int64, description: Due now - paid; negative when overpaid}
        changedSinceFilingMinor: {type: integer, format: int64, description: Due now - due when it was recorded}
        remittance:
          $ref: '#/components/schemas/TaxRemittance'
    ObligationsResponse:
      type: object
      properties:
        obligations:
          type: array
          items:
            $ref: '#/components/schemas/TaxFilingObligation'
    RecordRemittanceRequest:
      type: object
      required: [month, jurisdiction, paidMinor, filedOn, paidOn]
      properties:
        month: {type: string, example: 2026-09}
        jurisdiction: {type: string, example: US-TX}
        currency: {type: string, example: USD}
        paidMinor: {type: integer, format: int64, minimum: 0}
        filedOn: {type: string, format: date}
        paidOn: {type: string, format: date}
        confirmationRef: {type: string}
        paymentRef: {type: string}
        note: {type: string}
    VoidRemittanceRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 10}
    TaxMethodChange:
      type: object
      properties:
        from: {type: string, enum: [RULES, STRIPE_TAX, AVALARA]}
        to: {type: string, enum: [RULES, STRIPE_TAX, AVALARA]}
        reason: {type: string}
        changedBy: {type: string}
        changedAt: {type: string, format: date-time}
    TaxSettings:
      type: object
      properties:
        method: {type: string, enum: [RULES, STRIPE_TAX, AVALARA]}
        configuredDefault: {type: string, enum: [RULES, STRIPE_TAX], description: What applies until staff choose (TAX_PROVIDER)}
        stripeAvailable: {type: boolean, description: Stripe Tax can be chosen (its key is set)}
        avalaraAvailable: {type: boolean, description: 'Avalara can be chosen (account id, license key and company code are set)'}
        shadowProvider: {type: [string, 'null'], enum: [STRIPE, AVALARA, null], description: 'SHADOW mode: this provider is quoted next to the in-house engine on real orders; differences are logged (GET /v1/tax/shadow/report) and the shadow quote is never charged. Null = off.'}
        changedBy: {type: string}
        changedAt: {type: string, format: date-time}
        history:
          type: array
          items:
            $ref: '#/components/schemas/TaxMethodChange'
    TaxMethodChangeRequest:
      type: object
      required: [method, reason]
      properties:
        method: {type: string, enum: [RULES, STRIPE_TAX, AVALARA]}
        shadowProvider: {type: [string, 'null'], enum: [STRIPE, AVALARA, null], description: 'Turn SHADOW mode on for this provider, or null/absent to turn it off. A PUT replaces both method and shadowProvider. The provider must be configured and differ from the method''s provider (422 tax.shadow-same-as-method); a method that is a provider needs at least one mapped code (422 tax.provider-not-mapped).'}
        reason: {type: string}
    TaxReviewSettingsValues:
      type: object
      properties:
        mode: {type: string, enum: [ALL, RISK_BASED]}
        alwaysReview: {type: array, items: {type: string}, description: Category codes}
        auditPercent: {type: integer, minimum: 0, maximum: 100}
    TaxReviewSettingsChange:
      type: object
      properties:
        from: {oneOf: [{$ref: '#/components/schemas/TaxReviewSettingsValues'}, {type: 'null'}]}
        to: {$ref: '#/components/schemas/TaxReviewSettingsValues'}
        reason: {type: string}
        changedBy: {type: string}
        changedAt: {type: string, format: date-time}
    TaxReviewSettings:
      type: object
      description: 'RISK_BASED until staff change it: the rules decide and a person reviews only exceptions. Staff may choose ALL. Switching to RISK_BASED approves the records already waiting that the rules decide (actor auto).'
      properties:
        mode: {type: string, enum: [ALL, RISK_BASED], description: 'RISK_BASED (the default when staff stored nothing): a classification is approved by the rules when the category is ACTIVE, the rules resolve, no required evidence is missing and the category is not on the always-review list; anything else (conflict, no matching rule, missing answer or proof, a category awaiting sign-off, a regulated category) waits for a tax reviewer. ALL: every classification waits for a tax reviewer.'}
        alwaysReview: {type: array, items: {type: string}, description: 'Category codes that always go to review in RISK_BASED mode. Default: dietary-supplements, otc-medicines, medicated-skincare, medical-devices, baby-food-formula, gift-cards.'}
        alwaysReviewStatuses: {type: array, items: {type: string}, description: 'Category statuses that always go to review whatever the list says: NEEDS_APPROVAL, REFINE_CODE, CONFLICT_OPEN, BLOCKED_BUNDLE.'}
        auditPercent: {type: integer, minimum: 0, maximum: 100, description: 'Share of auto-approved items also queued as audit items (default 5). Deterministic: a hash of the variant ATIN.'}
        changedBy: {type: [string, 'null']}
        changedAt: {type: [string, 'null'], format: date-time}
        history:
          type: array
          items:
            $ref: '#/components/schemas/TaxReviewSettingsChange'
    TaxReviewSettingsChangeRequest:
      type: object
      required: [mode, reason]
      properties:
        mode: {type: string, enum: [ALL, RISK_BASED]}
        alwaysReview: {type: [array, 'null'], items: {type: string}, description: Replaces the always-review list; absent or null keeps the current list}
        auditPercent: {type: [integer, 'null'], minimum: 0, maximum: 100, description: Absent or null keeps the current percentage}
        reason: {type: string, minLength: 10}
    StateTaxRule:
      type: object
      description: State rates are fractions (0.0625 = 6.25 %)
      properties:
        country:
          type: string
          maxLength: 2
          minLength: 0
        state:
          type: string
        name:
          type: string
          maxLength: 80
          minLength: 0
        generalRate:
          type: number
          maximum: 0.5
          minimum: 0
        groceryRate:
          type: number
          maximum: 0.5
          minimum: 0
        preparedFoodRate:
          type: number
          maximum: 0.5
          minimum: 0
        shippingTaxable:
          type: boolean
        facilitator:
          type: boolean
          description: AfroTransact collects and remits as marketplace facilitator
        version:
          type: integer
          format: int64
      required:
      - generalRate
      - groceryRate
      - name
      - preparedFoodRate
    LocalTaxRate:
      type: object
      description: Local rate added to the state rate for a ZIP or 3-digit ZIP prefix
      properties:
        state:
          type: string
        zipPrefix:
          type: string
        name:
          type: string
          maxLength: 120
          minLength: 0
        rate:
          type: number
          maximum: 0.5
          minimum: 0
        appliesToGrocery:
          type: boolean
      required:
      - name
      - rate
    Address:
      type: object
      description: Postal address (customer origin or seller / FC return address)
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        line1:
          type: string
          maxLength: 200
          minLength: 0
        line2:
          type: string
          maxLength: 200
          minLength: 0
        city:
          type: string
          maxLength: 120
          minLength: 0
        state:
          type: string
          maxLength: 10
          minLength: 0
        postalCode:
          type: string
          maxLength: 20
          minLength: 0
        country:
          type: string
          maxLength: 2
          minLength: 0
        phone:
          type: string
          maxLength: 40
          minLength: 0
    SellerReturnPolicy:
      type: object
      properties:
        windowDays:
          type: integer
          format: int32
          maximum: 365
          minimum: 14
        restockingFeeBps:
          type: integer
          format: int32
          description: Restocking fee for no-fault returns, basis points (max 2000)
          maximum: 2000
          minimum: 0
