openapi: 3.1.0
info:
  title: Gateway BFF API (Staff console)
  version: v1
  summary: Screen-shaped API for the AfroTransact staff console (web/apps/staff-console), the platform back office.
  description: |
    The same gateway BFF (Go, port 8200) that serves the storefront and the Seller Center also serves the platform back
    office under `/v1/staff/...`. Browsers never talk to the domain services: the staff console's same-origin `/api/bff`
    proxy forwards to the BFF, which relays the signed-in staff member's access token (token relay) to identity, seller,
    catalog, orders, payments, inventory, retail, fulfilment, trust-ops, tax-returns, content, notifications and media.

    **Staff only.** Every operation needs a signed-in STAFF principal: identity `GET /v1/me` → `principalType: STAFF`
    (the `pt=STAFF` token claim). Customers and seller members get 403 `NOT_STAFF`; guests 401 `UNAUTHENTICATED`.

    **RBAC.** Module access (VIEW, EDIT, APPROVE, FULL) comes from identity's module matrix for the `platform` portal
    (`GET /v1/admin/module-access?portal=platform`), taking the highest level over the staff member's platform roles;
    the BFF falls back to the seeded default matrix when identity cannot be read. `GET /v1/staff/session` returns the
    sidebar already filtered. Every action additionally needs the permission the upstream enforces (for example
    `disputes:manage` for claim decisions): the BFF reports `allowed: false` with a reason on each action of a detail
    sheet, and refuses the call server-side with 403 `FORBIDDEN` before it reaches the upstream.

    **Tables are server-driven.** `GET /v1/staff/resources/{resource}` returns the columns, the status facets, the
    rows of one page and whether a record can be created; `GET /v1/staff/resources/{resource}/{id}` returns the
    detail sheet (all fields grouped in sections, nested tables, activity, actions and the edit form). Upstreams that
    page with cursors report `total: null` and a `nextCursor`.

    **Exports.** `POST /v1/staff/exports` builds CSV or XLSX on the server by streaming pages from the upstream. Up to
    5,000 rows are built while you wait (201, `READY`); larger exports run as a background job (202, `QUEUED`) to poll.
    Download links are signed and expire 24 hours after the file is ready.

    **Errors** are RFC 9457 `application/problem+json` with a stable `code`. Upstreams that are unreachable, or that do
    not serve a route yet, answer 503 `UPSTREAM_UNAVAILABLE` (`type https://developers.afrotransact.com/problems/bff.upstream-unavailable`)
    with `Retry-After`.

    **Money** is always an integer amount in minor units (`*Minor`, cents for USD) plus an ISO 4217 `currency`.

    **CSRF.** Unsafe methods require an `Origin` header matching an allowed web origin (the staff console).
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
servers:
  - url: http://localhost:8200
    description: local
  - url: https://api.dev.afrotransact.com/bff
    description: dev
  - url: https://api.uat.afrotransact.com/bff
    description: uat
  - url: https://api.afrotransact.com/bff
    description: prod
tags:
  - name: Shell
    description: Staff session and the RBAC-filtered sidebar
  - name: Dashboard
    description: Platform KPIs and charts from one dashboard feed
  - name: Resources
    description: Server-driven tables, detail sheets, create / edit forms and RBAC-gated actions
  - name: Exports
    description: Server-side CSV / XLSX exports with signed, expiring download links
  - name: Support
    description: Customer support console (Lola hand-offs, customer lookup, refunds, notifications, shipments)
  - name: Fees
    description: Fee-schedule editor (commission per category, seller overrides, card and FBA fees, AfroTransact Delivery pricing) over payments' immutable versions
  - name: Dispatch
    description: Seller pickups of AfroTransact Delivery from the seller's store (S255) — nearest-driver suggestions, overrides and their history
  - name: Notifications
    description: Notification templates (S268) — every key's versions per locale and channel, live previews with production-shaped sample data, new versions and test-sends to yourself
  - name: Pre-orders
    description: |
      Pre-orders module (S270–S275): mirrors delivery-runs' staff API 1:1 with the staff member's token — windows
      (list, create, edit, publish, pause, resume), creatives, orders, summary, CSV exports (streamed), late orders,
      platform settings (master switch, fallback, placements, payment setup), coverage areas and place search — plus
      the late-add customer picker. Module `preorders`: Super Admin and Marketing FULL, Operations EDIT, Support
      APPROVE (view + late add), Finance / Auditor / Product owner / Fulfilment / Retail VIEW. Writes need EDIT and
      `preorders:manage`, settings need FULL and `preorders:manage`, exports `preorders:export`, late adds
      `preorders:late-add` with APPROVE or above. Window, list, settings and area answers carry `can`.
security:
  - sessionCookie: []
paths:
  # ───────────────────────────────────────────────────────────── shell
  /v1/staff/session:
    get:
      tags: [Shell]
      operationId: getStaffSession
      security: [{sessionCookie: []}]
      summary: Signed-in staff member, roles, effective permissions and the RBAC-filtered sidebar
      description: |
        Composes identity `GET /v1/me` (profile, principal type, platform roles and effective permissions) and identity's
        module matrix `GET /v1/admin/module-access?portal=platform` (cached; seeded defaults when it cannot be read).
        Modules the staff member's roles cannot open are not returned. The dashboard is the landing page.
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/StaffSession'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── dashboard
  /v1/staff/dashboard:
    get:
      tags: [Dashboard]
      operationId: getStaffDashboard
      security: [{sessionCookie: []}]
      summary: Platform dashboard feed (KPIs and every chart)
      description: |
        One feed for every figure on the dashboard: sales and net sales by day and orders by department (orders
        `GET /v1/admin/orders`, lines' category), applications by status (seller `GET /v1/applications`), payouts
        (payments `GET /v1/payouts/requests`) versus claim refunds (trust-ops `GET /v1/claims?status=RESOLVED_REFUND`)
        by week. Each chart reports `available: false` when its upstream cannot answer. Chart exports (PDF, Excel with a
        native chart, CSV) are built from these rows. Needs VIEW on the dashboard module.
      parameters:
        - {name: rangeDays, in: query, schema: {type: integer, enum: [7, 30, 90], default: 30}}
      responses:
        '200': {description: Dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/StaffDashboard'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  # ───────────────────────────────────────────────────────────── resources
  /v1/staff/resources/{resource}:
    get:
      tags: [Resources]
      operationId: listStaffResource
      security: [{sessionCookie: []}]
      summary: One page of a server-driven table (columns, facets, rows)
      description: |
        Upstreams per resource — users: identity `GET /v1/admin/users`; roles: identity `GET /v1/admin/roles`;
        applications: seller `GET /v1/applications`; orders: orders `GET /v1/admin/orders`; products: catalog
        `GET /v1/products`; moderation: trust-ops `GET /v1/moderation/items`; claims: trust-ops `GET /v1/claims`;
        returns: tax-returns `GET /v1/returns`; payouts: payments `GET /v1/payouts/requests`; inventory: inventory
        `GET /v1/lots`; purchase-orders: retail `GET /v1/purchase-orders`; routes: fulfilment `GET /v1/dispatch/routes`;
        support-cases: trust-ops `GET /v1/support-cases`; audit: trust-ops `GET /v1/audit/entries`; markets: content
        `GET /v1/markets/draft/countries`; site-settings: content `GET /v1/site-config/settings`; legal-documents: content
        `GET /v1/legal`; announcements and placements: content `GET /v1/placements`; identity-providers: identity
        `GET /v1/admin/identity-providers`; fee-schedules: payments `GET /v1/fee-schedules`; tax-rates: tax-returns
        `GET /v1/tax/rates`. Needs VIEW on the resource's module.
      parameters:
        - {$ref: '#/components/parameters/Resource'}
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: Free-text search where the upstream supports it}
        - {name: status, in: query, schema: {type: string, maxLength: 60}, description: One of the page's facet values}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}, description: nextCursor of the previous page (cursor-paged upstreams)}
      responses:
        '200': {description: Table page, content: {application/json: {schema: {$ref: '#/components/schemas/ResourcePage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Resources]
      operationId: createStaffRecord
      security: [{sessionCookie: []}]
      summary: Create a record from the table's create form (New)
      description: |
        users: identity `POST /v1/admin/users` (access:admin); announcements and placements: content `POST /v1/placements`
        (content:placements.edit); fee-schedules: payments `POST /v1/fee-schedules` (payments:configure); tax-rates
        (local rate): tax-returns `PUT /v1/tax/rates/local/{state}/{zipPrefix}` (tax:configure). Fields are validated
        against the create form first (422 with per-field errors).
      parameters: [{$ref: '#/components/parameters/Resource'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RecordValues'}}}
      responses:
        '201': {description: Created record, content: {application/json: {schema: {$ref: '#/components/schemas/RecordDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/resources/{resource}/{id}:
    get:
      tags: [Resources]
      operationId: getStaffRecord
      security: [{sessionCookie: []}]
      summary: Detail sheet of one record (fields, nested tables, activity, RBAC-gated actions, edit form)
      parameters: [{$ref: '#/components/parameters/Resource'}, {$ref: '#/components/parameters/RecordId'}]
      responses:
        '200': {description: Record, content: {application/json: {schema: {$ref: '#/components/schemas/RecordDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Resources]
      operationId: updateStaffRecord
      security: [{sessionCookie: []}]
      summary: Save the edit form of a record (Edit)
      description: |
        markets: content `PATCH /v1/markets/draft/countries/{code}` (content:markets.edit); site-settings: content
        `PUT /v1/site-config` with the revision read last (content:site.edit); legal-documents: content
        `PATCH /v1/legal/{type}/current` (content:legal.edit); announcements and placements: content `PUT /v1/placements/{id}`
        with `expectedVersion` (content:placements.edit); tax-rates (state rule): tax-returns `PUT /v1/tax/rates/states/{state}`
        (tax:configure). A stale `version` answers 409 `CONFLICT`.
      parameters: [{$ref: '#/components/parameters/Resource'}, {$ref: '#/components/parameters/RecordId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RecordValues'}}}
      responses:
        '200': {description: Saved record, content: {application/json: {schema: {$ref: '#/components/schemas/RecordDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/resources/{resource}/{id}/actions/{action}:
    post:
      tags: [Resources]
      operationId: runStaffAction
      security: [{sessionCookie: []}]
      summary: Run one action of a detail sheet (approve, hold, refund, cancel, …) and return the updated sheet
      description: |
        The action must be listed on the record's sheet with `allowed: true`; otherwise 403 `FORBIDDEN` (missing
        permission or module level) or 409 `CONFLICT` (not possible in the record's current state). Examples: applications
        `review-approve` / `review-flag` / `review-request-info` (seller `POST /v1/applications/{id}/review`,
        applications:review) and `final-approve` / `send-back` / `reject` (seller `POST /v1/applications/{id}/decision`,
        applications:approve, never by the step-one reviewer); claims `refund` / `deny` (trust-ops
        `POST /v1/claims/{id}/decision`, disputes:manage, refunds capped by the role's refund limit); payouts `approve` /
        `hold` / `release` (payments, payouts:approve); orders `shipment-status` (orders `POST /v1/shipments/{id}/transitions`).
        `Idempotency-Key` is relayed to upstreams that accept one.
      parameters:
        - {$ref: '#/components/parameters/Resource'}
        - {$ref: '#/components/parameters/RecordId'}
        - {name: action, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9-]{1,40}$'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/RecordValues'}}}
      responses:
        '200': {description: Updated record, content: {application/json: {schema: {$ref: '#/components/schemas/RecordDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/resources/{resource}/{id}/notes:
    post:
      tags: [Resources]
      operationId: addStaffNote
      security: [{sessionCookie: []}]
      summary: Add an internal note to a record
      description: |
        No upstream stores internal notes on records yet, so this answers 503 `UPSTREAM_UNAVAILABLE` until one does
        (sheets report `notesEnabled: false` meanwhile).
      parameters: [{$ref: '#/components/parameters/Resource'}, {$ref: '#/components/parameters/RecordId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NoteRequest'}}}
      responses:
        '200': {description: Updated record, content: {application/json: {schema: {$ref: '#/components/schemas/RecordDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── exports
  /v1/staff/exports:
    get:
      tags: [Exports]
      operationId: listStaffExports
      security: [{sessionCookie: []}]
      summary: My export jobs, newest first (kept 24 hours after they finish)
      responses:
        '200': {description: Export jobs, content: {application/json: {schema: {$ref: '#/components/schemas/ExportJobList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Exports]
      operationId: createStaffExport
      security: [{sessionCookie: []}]
      summary: Export a whole table (all pages matching the filters) as CSV or XLSX
      description: |
        Streams every page of the resource's upstream list with the caller's token and writes the file on the server.
        Up to 5,000 rows finish within the request (201 READY); larger exports are queued (202 QUEUED) and built in the
        background — poll `GET /v1/staff/exports/{id}`. Capped at 200,000 rows. Needs VIEW on the resource's module.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExportRequest'}}}
      responses:
        '201': {description: Export ready, content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}}
        '202': {description: Export queued, content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/exports/{exportId}:
    get:
      tags: [Exports]
      operationId: getStaffExport
      security: [{sessionCookie: []}]
      summary: Status of one export job (poll until READY or FAILED)
      parameters: [{$ref: '#/components/parameters/ExportId'}]
      responses:
        '200': {description: Export job, content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/staff/exports/{exportId}/download:
    get:
      tags: [Exports]
      operationId: downloadStaffExport
      security: [{sessionCookie: []}]
      summary: Redirect to the signed download URL of a ready export
      description: 302 to the signed URL (valid until `expiresAt`); 409 while the job is not ready, 410 once it expired.
      parameters: [{$ref: '#/components/parameters/ExportId'}]
      responses:
        '302':
          description: Signed download URL
          headers:
            Location: {description: Signed URL of the file, schema: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /v1/staff/export-files/{exportId}:
    get:
      tags: [Exports]
      operationId: getStaffExportFile
      security: []
      summary: The export file behind a signed link (no session needed; the signature and expiry are checked)
      description: |
        Served when exports are stored by the BFF itself (default). With media storage the signed URL points at the
        object store instead. 403 for a bad signature, 410 after `expires`.
      parameters:
        - {$ref: '#/components/parameters/ExportId'}
        - {name: expires, in: query, required: true, schema: {type: integer, format: int64}, description: Unix seconds}
        - {name: sig, in: query, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: File
          content:
            text/csv: {schema: {type: string}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── support
  /v1/staff/support/customers:
    get:
      tags: [Support]
      operationId: searchSupportCustomers
      security: [{sessionCookie: []}]
      summary: Find a customer by name or email
      description: identity `GET /v1/admin/users?q=` (users:read). Needs VIEW on the support module.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 120}}
      responses:
        '200': {description: Matches, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerSearch'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/support/customers/{customerId}:
    get:
      tags: [Support]
      operationId: getSupportCustomer
      security: [{sessionCookie: []}]
      summary: Customer 360 — account, orders with shipments, bookings, claims, returns, notifications, cases and audit
      description: |
        identity `GET /v1/admin/users/{id}`; orders `GET /v1/admin/orders?customer=`; trust-ops `GET /v1/claims?orderId=`
        and `GET /v1/support-cases`; tax-returns `GET /v1/returns?orderId=`; notifications `GET /v1/notifications?recipient=`;
        trust-ops `GET /v1/audit/entries?entityId=`. Bookings have no staff lookup by customer yet (listed in
        `unavailable`). Sections whose upstream fails are empty and named in `unavailable`; the rest still renders.
      parameters: [{name: customerId, in: path, required: true, schema: {type: string, maxLength: 64}}]
      responses:
        '200': {description: Customer 360, content: {application/json: {schema: {$ref: '#/components/schemas/Customer360'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/support/refunds:
    post:
      tags: [Support]
      operationId: supportRefund
      security: [{sessionCookie: []}]
      summary: Refund a customer within the role's refund limit (claim decision or a partial refund)
      description: |
        `via: CLAIM` decides the customer's open claim with a refund (trust-ops `POST /v1/claims/{id}/decision`,
        disputes:manage). `via: ORDER` issues a partial refund without a return (tax-returns `POST /v1/refunds`,
        refunds:issue), spread over the order's lines. Amounts above the role's limit answer 403 `REFUND_LIMIT`. Both
        upstreams write the decision to the trust-ops audit log.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyRequired'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SupportRefundRequest'}}}
      responses:
        '200': {description: Refund issued, content: {application/json: {schema: {$ref: '#/components/schemas/SupportActionResult'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/support/notifications/{notificationId}/resend:
    post:
      tags: [Support]
      operationId: supportResendNotification
      security: [{sessionCookie: []}]
      summary: Resend a notification to the customer
      description: |
        Failed notifications are replayed (notifications `POST /v1/dead-letters/{id}/replay`); delivered ones are queued
        again from the same template (notifications `POST /v1/notifications`, notifications:send). Needs EDIT on support.
      parameters:
        - {name: notificationId, in: path, required: true, schema: {type: string, maxLength: 64}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SupportResendRequest'}}}
      responses:
        '200': {description: Queued again, content: {application/json: {schema: {$ref: '#/components/schemas/SupportActionResult'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/support/shipments/{shipmentId}/cancel:
    post:
      tags: [Support]
      operationId: supportCancelShipment
      security: [{sessionCookie: []}]
      summary: Cancel a customer's shipment (until it is packed)
      description: orders `POST /v1/shipments/{id}/transitions` to `CANCELLED` with the reason (orders:manage or orders:update-status).
      parameters:
        - {name: shipmentId, in: path, required: true, schema: {type: string, maxLength: 64}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SupportCancelRequest'}}}
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/SupportActionResult'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── fees & commissions
  /v1/staff/fees:
    get:
      tags: [Fees]
      operationId: getStaffFees
      security: [{sessionCookie: []}]
      summary: Fee schedule versions (active, scheduled, past, cancelled), the base of a new version, categories and limits
      description: |
        payments `GET /v1/fee-schedules` (payments:read) and catalog `GET /v1/categories` (departments are the commission
        categories, lower-cased; `services` is always offered; categories schedules already use are added). Override
        organisations are named from seller `GET /v1/orgs/directory` (best effort; `orgNamesAvailable`). Needs VIEW on
        the fees module; `canConfigure` (payments:configure plus EDIT) unlocks creating and cancelling. Rates are basis
        points (1250 = 12.50 %): the console shows and takes percentages with two decimals.
      responses:
        '200': {description: Fees overview, content: {application/json: {schema: {$ref: '#/components/schemas/FeesOverview'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/fees/orgs:
    get:
      tags: [Fees]
      operationId: searchFeeOrgs
      security: [{sessionCookie: []}]
      summary: Find a seller or provider organisation by name for a commission override
      description: |
        seller `GET /v1/orgs/directory` (pages of 200, up to 1,000 organisations), filtered by name or exact id. AfroTransact
        Retail is returned with `selectable: false` — it is the merchant of record and pays no commission and no fees.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 120}}
      responses:
        '200': {description: Matches (at most 20), content: {application/json: {schema: {$ref: '#/components/schemas/FeeOrgSearch'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/fees/schedules:
    post:
      tags: [Fees]
      operationId: createFeeSchedule
      security: [{sessionCookie: []}]
      summary: Publish a new fee schedule version (Super Admin / Finance)
      description: |
        payments `POST /v1/fee-schedules` (payments:configure). The BFF validates first: effective date in the future and
        not before the latest scheduled version (or `immediate: true`, refused while a version is scheduled), commission
        0–50 %, card fee 0–10 % + up to $10.00, FBA fee up to $100.00, a note of 3–500 characters, unique categories and
        (organisation, category) overrides, and no override for AfroTransact Retail. Errors are keyed by property
        (`categoryRates.2.commissionBps`). Versions are immutable; the new one applies to orders placed from its date.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FeeScheduleDraft'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/FeeScheduleView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/fees/schedules/{scheduleId}/cancel:
    post:
      tags: [Fees]
      operationId: cancelFeeSchedule
      security: [{sessionCookie: []}]
      summary: Cancel a scheduled fee schedule version before it takes effect (Super Admin / Finance)
      description: |
        payments `POST /v1/fee-schedules/{id}/cancel` (payments:configure). Only scheduled versions (409 once in force or
        already cancelled). The version is kept and marked cancelled (who, when, why) — never deleted — and payments
        audits it.
      parameters:
        - {name: scheduleId, in: path, required: true, schema: {type: string, maxLength: 64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FeeCancelRequest'}}}
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/FeeScheduleView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/fees/delivery-quote:
    post:
      tags: [Fees]
      operationId: quoteStaffDelivery
      security: [{sessionCookie: []}]
      summary: Price one AfroTransact Delivery trip under the live fee schedule (S255)
      description: |
        payments `POST /v1/delivery-pricing/quote` (staff payments:read): the customer charge and the seller's pickup-delivery
        fee for a seller organisation, a road distance and a number of packages, under the version in force at `at`
        (default now). `available: false` with `BEYOND_MAX_RADIUS` beyond the version's radius or `NOT_CONFIGURED` when it
        has no delivery pricing. Needs VIEW on the fees module. Drafts are previewed in the console with the same rules.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryQuoteRequest'}}}
      responses:
        '200': {description: Quote, content: {application/json: {schema: {$ref: '#/components/schemas/DeliveryQuote'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── dispatch: seller pickups (S255)
  /v1/staff/dispatch/pickups:
    get:
      tags: [Dispatch]
      operationId: listStaffPickups
      security: [{sessionCookie: []}]
      summary: Seller pickups waiting for a route (AfroTransact Delivery from the seller's store)
      description: |
        fulfilment `GET /v1/dispatch/shipments` (delivery:dispatch), keeping the SELLER-origin entries. Pickups already
        routed (auto-assigned to the nearest driver) are not in the pool; open them by shipment id. Needs VIEW on dispatch.
      parameters:
        - {name: nodeId, in: query, schema: {type: string, maxLength: 64}, description: Depot / fulfilment node}
      responses:
        '200': {description: Waiting pickups, content: {application/json: {schema: {$ref: '#/components/schemas/PickupList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/dispatch/pickups/{shipmentId}/driver-suggestions:
    get:
      tags: [Dispatch]
      operationId: getPickupDriverSuggestions
      security: [{sessionCookie: []}]
      summary: Top 5 available drivers for a seller pickup, nearest first
      description: |
        fulfilment `GET /v1/dispatch/pickups/{id}/driver-suggestions`: fresh positions in the pickup's delivery zone,
        access active, an ASSIGNED or IN_PROGRESS route today, vehicle inspection passed, room left; ranked by geo road
        distance (straight line when geo is down — `distanceMethod: STRAIGHT_LINE`, `roadMiles: null`).
      parameters: [{$ref: '#/components/parameters/ShipmentId'}]
      responses:
        '200': {description: Suggestions, content: {application/json: {schema: {$ref: '#/components/schemas/DriverSuggestions'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/dispatch/pickups/{shipmentId}/assign:
    post:
      tags: [Dispatch]
      operationId: assignPickup
      security: [{sessionCookie: []}]
      summary: Assign or override the route of a seller pickup (reason required)
      description: |
        fulfilment `POST /v1/dispatch/pickups/{id}/assign {routeId, reason}` (delivery:dispatch, EDIT on dispatch). The
        reason (5–500 characters) is logged as a DISPATCH_OVERRIDE. 409 `CONFLICT` when the pickup can't move any more
        (collected, or its drop-off carries other shipments).
      parameters: [{$ref: '#/components/parameters/ShipmentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PickupAssignRequest'}}}
      responses:
        '200': {description: Assigned, content: {application/json: {schema: {$ref: '#/components/schemas/PickupAssignResult'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/dispatch/pickups/{shipmentId}/assignments:
    get:
      tags: [Dispatch]
      operationId: listPickupAssignments
      security: [{sessionCookie: []}]
      summary: Assignment history of a seller pickup (automatic nearest-driver and dispatch overrides)
      description: fulfilment `GET /v1/dispatch/pickups/{id}/assignments`, newest first.
      parameters: [{$ref: '#/components/parameters/ShipmentId'}]
      responses:
        '200': {description: History, content: {application/json: {schema: {$ref: '#/components/schemas/PickupAssignmentList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/ship-from-locations/{locationId}:
    get:
      tags: [Dispatch]
      operationId: getStaffShipFromLocation
      security: [{sessionCookie: []}]
      summary: A seller's ship-from / pickup location (address, geocoded position, pickup hours)
      description: seller `GET /v1/ship-from-locations/{id}` (staff seller:ship-from). Needs VIEW on dispatch.
      parameters:
        - {name: locationId, in: path, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '200': {description: Location, content: {application/json: {schema: {$ref: '#/components/schemas/ShipFromLocation'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── notifications: templates (S268)
  /v1/staff/notifications/templates:
    get:
      tags: [Notifications]
      operationId: listNotificationTemplates
      security: [{sessionCookie: []}]
      summary: Every notification template key with its channels, locales and latest version
      description: |
        notifications `GET /v1/templates` (latest version of every key, locale and channel) grouped by key; `q` filters
        by key, category or channel. Needs `notifications:read` (VIEW on the notifications module); `canEdit` says
        whether the staff member holds `notifications:templates:write`.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: 'Part of a key, a category or a channel'}
      responses:
        '200': {description: Templates, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTemplateList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/notifications/templates/{key}:
    get:
      tags: [Notifications]
      operationId: getNotificationTemplate
      security: [{sessionCookie: []}]
      summary: A template key's versions per locale and channel, with its sample data
      description: |
        notifications `GET /v1/templates?key=` (every version, newest first per locale and channel) and
        `GET /v1/templates/{key}/sample`: the fields the key's event carries in production (a contract-shaped event run
        through the real ingest), used to prefill the preview. When the sample cannot be read the editor starts from
        empty data (`source: none`). Needs `notifications:read`.
      parameters: [{$ref: '#/components/parameters/TemplateKey'}]
      responses:
        '200': {description: Template, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTemplateDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/notifications/templates/{key}/preview:
    post:
      tags: [Notifications]
      operationId: previewNotificationTemplate
      security: [{sessionCookie: []}]
      summary: Render a stored version or an unsaved draft with sample data
      description: |
        notifications `POST /v1/templates/{key}/preview` with the service's real renderer. `version` 0 renders the
        latest stored version (locale fallback fr-CA → fr → en); `draft` renders unsaved content (the editor's live
        preview). A template that does not compile, or reads a field the data lacks, is a 422 on the part that failed
        (`subject`, `bodyText`, `bodyHtml`, prefixed `draft.` for drafts, else `data`). SMS and WhatsApp previews carry
        the GSM-7 / UCS-2 segment count. Needs `notifications:read`.
      parameters: [{$ref: '#/components/parameters/TemplateKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreviewRequest'}}}
      responses:
        '200': {description: Rendered, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreview'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/notifications/templates/{key}/versions:
    post:
      tags: [Notifications]
      operationId: createNotificationTemplateVersion
      security: [{sessionCookie: []}]
      summary: Create the next version of a template for one locale and channel
      description: |
        notifications `POST /v1/templates` (`notifications:templates:write`). Before storing, the BFF checks that every
        placeholder (`{{.field}}`, `{{if .field}}`, `{{$.field}}`) is a field of the key's sample data (keys without a
        sample are only render-checked), renders the draft with the sample data, and refuses SMS longer than 3
        segments. Emails need a subject and an HTML body; push notifications need a title; only emails have HTML.
        The new version is what every later send of the key uses.
      parameters: [{$ref: '#/components/parameters/TemplateKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationVersionDraft'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTemplateVersion'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/notifications/templates/{key}/test-send:
    post:
      tags: [Notifications]
      operationId: testSendNotificationTemplate
      security: [{sessionCookie: []}]
      summary: Send a stored version or a draft to your own email or phone
      description: |
        notifications `POST /v1/templates/{key}/test-send` (`notifications:templates:write`). The destination is
        always the signed-in staff member's own email (email) or phone (SMS, WhatsApp) from their access token, never
        an address in the request; email subjects are prefixed `[TEST]`. Push cannot be test-sent (422 on `channel`);
        no address on the account is a 422 without field errors.
      parameters: [{$ref: '#/components/parameters/TemplateKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreviewRequest'}}}
      responses:
        '200': {description: Sent, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTestSendResult'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
