      parameters:
        - {name: key, in: path, required: true, schema: {type: string, examples: [US%2FTX%2FLubbock]}}
      responses:
        '200': {description: Areas after the removal, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderAreas'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/places/search:
    get:
      tags: [Pre-orders]
      operationId: searchStaffPreorderPlaces
      security: [{sessionCookie: []}]
      summary: Country / region / city suggestions for the area picker
      description: delivery-runs `GET /v1/places/search?country=&region=&q=` (geo-service backed, built-in list fallback) → {items, regionLabel}.
      parameters:
        - {name: country, in: query, schema: {type: string, maxLength: 2}}
        - {name: region, in: query, schema: {type: string, maxLength: 3}}
        - {name: q, in: query, schema: {type: string, maxLength: 80}}
      responses:
        '200': {description: Places, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderItems'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/address-verify:
    post:
      tags: [Pre-orders]
      operationId: verifyStaffPreorderAddress
      security: [{sessionCookie: []}]
      summary: Verify a new late-add address (geo, Google Places with Nominatim fallback)
      description: |
        geo `POST /v1/addresses/validate`. `verified` for VALID or CORRECTED; `placeId` is geo's place id, else a stable
        reference of the standardised address (delivery-runs re-verifies it). Needs the late-add ability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line1, zip]
              properties:
                line1: {type: string, maxLength: 200}
                zip: {type: string, maxLength: 12}
                city: {type: string, maxLength: 80}
                region: {type: string, maxLength: 3}
                country: {type: string, maxLength: 2}
      responses:
        '200':
          description: Verification
          content:
            application/json:
              schema:
                type: object
                required: [verified, placeId, formatted]
                properties:
                  verified: {type: boolean}
                  placeId: {type: [string, 'null']}
                  formatted: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/uploads:
    post:
      tags: [Pre-orders]
      operationId: requestStaffPreorderUpload
      security: [{sessionCookie: []}]
      summary: Sign a direct media upload for a creative
      description: |
        media `POST /v1/uploads` (purpose storefront; JPEG, PNG or WebP up to 10 MB). The console PUTs the file to
        `upload.url`, then sets the slot (`PUT /v1/staff/preorders/{id}/creatives/{slot} {assetId}`), where the BFF
        finalises the asset with media and delivery-runs verifies it. Needs EDIT and preorders:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, size]
              properties:
                fileName: {type: string, maxLength: 200}
                contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
                size: {type: integer, minimum: 1, maximum: 10485760}
                width: {type: integer}
                height: {type: integer}
      responses:
        '201':
          description: Upload ticket
          content:
            application/json:
              schema:
                type: object
                required: [assetId, upload]
                properties:
                  assetId: {type: string}
                  upload:
                    type: object
                    required: [method, url, headers]
                    properties:
                      method: {type: string, enum: [PUT, POST]}
                      url: {type: string}
                      headers: {type: object, additionalProperties: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/products:
    get:
      tags: [Pre-orders]
      operationId: listStaffPreorderProducts
      security: [{sessionCookie: []}]
      summary: The window's products (late-add item list)
      description: delivery-runs `GET /v1/preorders/{id}/products` → items [{atin, name, price (minor units), sellerName}].
      parameters: [{$ref: '#/components/parameters/PreorderId'}]
      responses:
        '200': {description: Products, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderItems'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}:
    get:
      tags: [Pre-orders]
      operationId: getStaffPreorder
      security: [{sessionCookie: []}]
      summary: One window (detail header, wizard)
      description: delivery-runs `GET /v1/preorders/{id}`.
      parameters: [{$ref: '#/components/parameters/PreorderId'}]
      responses:
        '200': {description: Window, headers: {ETag: {description: 'Optimistic-lock version ("<version>"); send it back as If-Match', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Pre-orders]
      operationId: updateStaffPreorder
      security: [{sessionCookie: []}]
      summary: Edit a window (If-Match)
      description: delivery-runs `PUT /v1/preorders/{id}` (If-Match relayed; preorders:manage, EDIT).
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: If-Match, in: header, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderDraft'}}}
      responses:
        '200': {description: Saved, headers: {ETag: {description: 'Optimistic-lock version ("<version>"); send it back as If-Match', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/publish:
    post:
      tags: [Pre-orders]
      operationId: publishStaffPreorder
      security: [{sessionCookie: []}]
      summary: Publish a draft (422 lists the failed checks)
      description: delivery-runs `POST /v1/preorders/{id}/publish` (preorders:manage, EDIT).
      parameters: [{$ref: '#/components/parameters/PreorderId'}]
      responses:
        '200': {description: Published, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/pause:
    post:
      tags: [Pre-orders]
      operationId: pauseStaffPreorder
      security: [{sessionCookie: []}]
      summary: Pause a window
      description: delivery-runs `POST /v1/preorders/{id}/pause` (preorders:manage, EDIT).
      parameters: [{$ref: '#/components/parameters/PreorderId'}]
      responses:
        '200': {description: Paused, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/resume:
    post:
      tags: [Pre-orders]
      operationId: resumeStaffPreorder
      security: [{sessionCookie: []}]
      summary: Resume a paused window
      description: delivery-runs `POST /v1/preorders/{id}/resume` (preorders:manage, EDIT).
      parameters: [{$ref: '#/components/parameters/PreorderId'}]
      responses:
        '200': {description: Resumed, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/creatives/{slot}:
    put:
      tags: [Pre-orders]
      operationId: putStaffPreorderCreative
      security: [{sessionCookie: []}]
      summary: Set a creative slot from an uploaded media asset
      description: |
        delivery-runs `PUT /v1/preorders/{id}/creatives/{slot} {assetId}` (verifies with media-service and stores the
        size; a ratio more than 12 % off spec is flagged RATIO_OFF). preorders:manage, EDIT.
      parameters: [{$ref: '#/components/parameters/PreorderId'}, {$ref: '#/components/parameters/CreativeSlot'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: {type: string, maxLength: 64}
      responses:
        '200': {description: Window with the creative, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Pre-orders]
      operationId: deleteStaffPreorderCreative
      security: [{sessionCookie: []}]
      summary: Remove a creative
      description: delivery-runs `DELETE /v1/preorders/{id}/creatives/{slot}` (preorders:manage, EDIT).
      parameters: [{$ref: '#/components/parameters/PreorderId'}, {$ref: '#/components/parameters/CreativeSlot'}]
      responses:
        '200': {description: Window without the creative, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/orders:
    get:
      tags: [Pre-orders]
      operationId: listStaffPreorderOrders
      security: [{sessionCookie: []}]
      summary: The window's orders (search by order / customer / phone / address / zip)
      description: delivery-runs `GET /v1/preorders/{id}/orders?status=&channel=&q=&page=&size=`.
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: status, in: query, schema: {type: string, maxLength: 20}, description: 'PAID, LATE_ADD, CANCELLED'}
        - {name: channel, in: query, schema: {type: string, maxLength: 20}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderItems'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/summary:
    get:
      tags: [Pre-orders]
      operationId: getStaffPreorderSummary
      security: [{sessionCookie: []}]
      summary: KPIs, orders by day, by channel, top products, door / pickup split, placements
      description: delivery-runs `GET /v1/preorders/{id}/summary`.
      parameters: [{$ref: '#/components/parameters/PreorderId'}]
      responses:
        '200': {description: Summary, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderObject'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/exports/{file}:
    get:
      tags: [Pre-orders]
      operationId: exportStaffPreorder
      security: [{sessionCookie: []}]
      summary: Download a CSV (streamed from delivery-runs)
      description: |
        delivery-runs `GET /v1/preorders/{id}/exports/{file}` (preorders:export; audit event preorders.export.created),
        relayed without buffering. `orders-filtered.csv` takes the orders list's status / channel / q.
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: file, in: path, required: true, schema: {type: string, enum: [orders.csv, orders-filtered.csv, picking-list.csv, advertorial-report.csv]}}
        - {name: status, in: query, schema: {type: string, maxLength: 20}}
        - {name: channel, in: query, schema: {type: string, maxLength: 20}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
      responses:
        '200':
          description: CSV
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            text/csv: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/late-orders:
    post:
      tags: [Pre-orders]
      operationId: addStaffPreorderLateOrder
      security: [{sessionCookie: []}]
      summary: Add a late order for a customer (tagged Agent (late))
      description: |
        delivery-runs `POST /v1/preorders/{id}/late-orders` (preorders:late-add; APPROVE, EDIT or FULL on preorders),
        which creates the on-behalf order in orders-service (saved card charged off-session, or a payment link sent by
        SMS when lateAdd.paymentLink is allowed in the payment settings). Only while the window is CLOSED (or OPEN, as
        an assisted order); refused once DELIVERED. `Idempotency-Key` is relayed.
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderLateOrder'}}}
      responses:
        '201': {description: Late order added, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderObject'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/customers/search:
    get:
      tags: [Pre-orders]
      operationId: searchStaffCustomers
      security: [{sessionCookie: []}]
      summary: Late-add customer picker (identity people search with saved addresses)
      description: |
        identity `GET /v1/admin/users?q=&size=10` (customers only) and, per hit, `GET /v1/admin/users/{id}/addresses`
        (best effort: `addressesUnavailable` when identity can't list them — enter a new address). Needs the late-add
        ability on preorders. Fewer than 2 characters answer no one. `windowId` is the window the late add is for
        (validated; reserved for ranking customers of the window's areas first). Addresses are default first; the
        customer's city / region / country are the default address's.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: windowId, in: query, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}}
      responses:
        '200': {description: Customers, content: {application/json: {schema: {$ref: '#/components/schemas/LateAddCustomers'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: at_session
      description: Opaque BFF session id (HttpOnly, Secure, SameSite=Lax). Tokens stay server-side.
  parameters:
    Resource:
      name: resource
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceKey'}
    RecordId: {name: id, in: path, required: true, schema: {type: string, maxLength: 120}}
    ExportId: {name: exportId, in: path, required: true, schema: {type: string, maxLength: 64}}
    ShipmentId: {name: shipmentId, in: path, required: true, schema: {type: string, maxLength: 64}}
    PreorderId: {name: preorderId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}, description: Window id or code}
    CreativeSlot: {name: slot, in: path, required: true, schema: {type: string, enum: [HERO, PDP, STORY, FEED, EMAIL]}}
    TemplateKey: {name: key, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,119}$'}, example: order.confirmed}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}, description: Makes retries safe (same key = same result).}
    IdempotencyKeyRequired: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}, description: Same key = same refund; never refunds twice.}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Validation failed; `errors` maps request properties to messages
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          description: |
            Stable machine code: VALIDATION_FAILED, UNAUTHENTICATED, NOT_STAFF, FORBIDDEN, NOT_FOUND, CONFLICT,
            REFUND_LIMIT, EXPORT_NOT_READY, EXPORT_EXPIRED, RATE_LIMITED, UPSTREAM_UNAVAILABLE, UPSTREAM_ERROR.
        errors:
          type: object
          additionalProperties: {type: string}
      additionalProperties: true
    # ── shell
    AccessLevel: {type: string, enum: [VIEW, EDIT, APPROVE, FULL]}
    StaffModuleKey:
      type: string
      description: Sidebar modules; keys follow identity's platform module matrix (support, exports and notifications are derived; preorders follows the Pre-orders matrix column).
      enum: [dash, exports, orders, catalog, inventory, retail, dispatch, apps, support, rbac, payouts, fees, marketing, disputes, audit, markets, siteCfg, dev, notifications, preorders]
    StaffUser:
      type: object
      required: [id, firstName, lastName, email, initials]
      properties:
        id: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        initials: {type: string}
    StaffRole:
      type: object
      required: [key, label]
      properties:
        key: {type: string, description: 'Platform role, e.g. platform.customer_support'}
        label: {type: string}
    StaffNavModule:
      type: object
      required: [key, label, description, level, badge]
      properties:
        key: {$ref: '#/components/schemas/StaffModuleKey'}
        label: {type: string}
        description: {type: string}
        level: {$ref: '#/components/schemas/AccessLevel'}
        badge: {type: [integer, 'null']}
    StaffNavGroup:
      type: object
      required: [key, label, modules]
      properties:
        key: {type: string, enum: [overview, commerce, partners, finance, growth, trust, settings]}
        label: {type: string}
        modules: {type: array, items: {$ref: '#/components/schemas/StaffNavModule'}}
    StaffSession:
      type: object
      required: [user, roles, roleLabel, permissions, navGroups, landing, accessNote, refundLimitMinor]
      properties:
        user: {$ref: '#/components/schemas/StaffUser'}
        roles: {type: array, items: {$ref: '#/components/schemas/StaffRole'}}
        roleLabel: {type: string}
        permissions: {type: array, items: {type: string}}
        navGroups: {type: array, items: {$ref: '#/components/schemas/StaffNavGroup'}}
        landing: {$ref: '#/components/schemas/StaffModuleKey'}
        accessNote: {type: string}
        refundLimitMinor:
          type: [integer, 'null']
          format: int64
          description: Largest refund the roles allow (null = no limit, 0 = may not refund)
    # ── dashboard
    ChartTone: {type: string, enum: [ink, gold, green, blue, red, grey]}
    ValueFormat: {type: string, enum: [money, count]}
    ChartSeries:
      type: object
      required: [key, label, tone]
      properties:
        key: {type: string}
        label: {type: string}
        tone: {$ref: '#/components/schemas/ChartTone'}
        format: {$ref: '#/components/schemas/ValueFormat'}
    ChartRow:
      type: object
      required: [category, values]
      properties:
        category: {type: string}
        values:
          type: object
          additionalProperties: {type: number}
    ChartSpec:
      type: object
      required: [id, title, kind, categoryLabel, valueFormat, series, rows, available]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {type: string, enum: [trend, hbar, donut, stack]}
        categoryLabel: {type: string}
        valueFormat: {$ref: '#/components/schemas/ValueFormat'}
        series: {type: array, items: {$ref: '#/components/schemas/ChartSeries'}}
        rows: {type: array, items: {$ref: '#/components/schemas/ChartRow'}}
        available: {type: boolean}
    Kpi:
      type: object
      required: [label, value, detail, tone]
      properties:
        label: {type: string}
        value: {type: string}
        detail: {type: string}
        tone: {type: string, enum: [positive, attention, neutral]}
    StaffDashboard:
      type: object
      required: [rangeDays, generatedAt, kpis, charts]
      properties:
        rangeDays: {type: integer}
        generatedAt: {type: string, format: date-time}
        kpis: {type: array, items: {$ref: '#/components/schemas/Kpi'}}
        charts: {type: array, items: {$ref: '#/components/schemas/ChartSpec'}}
    # ── resources
    ResourceKey:
      type: string
      enum: [users, roles, applications, orders, products, moderation, claims, returns, payouts, inventory, purchase-orders,
        routes, support-cases, audit, markets, site-settings, legal-documents, announcements, placements, identity-providers,
        fee-schedules, tax-rates]
    Tone: {type: string, enum: [good, warn, bad, info, brand]}
    CellValue:
      type: [string, number, 'null']
    ColumnKind: {type: string, enum: [text, strong, mono, money, number, date, datetime, status, percent]}
    Column:
      type: object
      required: [key, label, kind, width]
      properties:
        key: {type: string}
        label: {type: string}
        kind: {$ref: '#/components/schemas/ColumnKind'}
        width: {type: integer, minimum: 1, maximum: 100, description: Share of the table width in percent (tables never scroll sideways)}
    Facet:
      type: object
      required: [value, label]
      properties:
        value: {type: string}
        label: {type: string}
    ResourceRow:
      type: object
      required: [id, cells, tone]
      properties:
        id: {type: string}
        cells:
          type: object
          additionalProperties: {$ref: '#/components/schemas/CellValue'}
        tone: {oneOf: [{$ref: '#/components/schemas/Tone'}, {type: 'null'}]}
    FieldOption:
      type: object
      required: [value, label]
      properties:
        value: {type: string}
        label: {type: string}
    FieldValue:
      oneOf:
        - {type: string}
        - {type: number}
        - {type: boolean}
        - {type: array, items: {type: string}}
        - {type: 'null'}
    FormField:
      type: object
      required: [key, label, type, required]
      properties:
        key: {type: string}
        label: {type: string}
        type: {type: string, enum: [text, textarea, number, money, select, multiselect, toggle, date, datetime, email, password]}
        required: {type: boolean}
        options: {type: array, items: {$ref: '#/components/schemas/FieldOption'}}
        min: {type: number}
        max: {type: number}
        maxLength: {type: integer}
        pattern: {type: string, description: ECMAScript regular expression the value must match}
        help: {type: string}
        placeholder: {type: string}
        value: {$ref: '#/components/schemas/FieldValue'}
    Form:
      type: object
      required: [title, submitLabel, fields]
      properties:
        title: {type: string}
        submitLabel: {type: string}
        fields: {type: array, items: {$ref: '#/components/schemas/FormField'}}
    ResourcePage:
      type: object
      required: [resource, title, columns, rows, page, size, total, nextCursor, hasNext, facets, searchable, canCreate, createForm, exportable]
      properties:
        resource: {$ref: '#/components/schemas/ResourceKey'}
        title: {type: string}
        columns: {type: array, items: {$ref: '#/components/schemas/Column'}}
        rows: {type: array, items: {$ref: '#/components/schemas/ResourceRow'}}
        page: {type: integer}
        size: {type: integer}
        total: {type: [integer, 'null'], description: Rows matching the filters (null when the upstream pages with cursors)}
        nextCursor: {type: [string, 'null']}
        hasNext: {type: boolean}
        facets: {type: array, items: {$ref: '#/components/schemas/Facet'}}
        searchable: {type: boolean}
        searchPlaceholder: {type: string}
        canCreate: {type: boolean}
        createForm: {oneOf: [{$ref: '#/components/schemas/Form'}, {type: 'null'}]}
        exportable: {type: boolean}
    DetailField:
      type: object
      required: [label, value, kind]
      properties:
        label: {type: string}
        value: {type: string}
        kind: {type: string, enum: [text, mono, money, date, datetime, status, link]}
        href: {type: string}
    DetailSection:
      type: object
      required: [title, fields]
      properties:
        title: {type: string}
        fields: {type: array, items: {$ref: '#/components/schemas/DetailField'}}
    DetailTable:
      type: object
      required: [title, columns, rows]
      properties:
        title: {type: string}
        columns: {type: array, items: {$ref: '#/components/schemas/Column'}}
        rows: {type: array, items: {$ref: '#/components/schemas/ResourceRow'}}
    ActivityEntry:
      type: object
      required: [at, actor, text]
      properties:
        at: {type: string, format: date-time}
        actor: {type: string}
        text: {type: string}
    Note:
      type: object
      required: [id, at, author, text]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        author: {type: string}
        text: {type: string}
    RecordAction:
      type: object
      required: [key, label, tone, allowed, reason, permission, confirm, form]
      properties:
        key: {type: string}
        label: {type: string}
        tone: {type: string, enum: [primary, neutral, danger]}
        allowed: {type: boolean}
        reason: {type: [string, 'null'], description: 'Why the action is disabled: missing permission, wrong state or the step-one reviewer'}
        permission: {type: string, description: Permission the upstream checks}
        confirm: {type: [string, 'null'], description: Confirmation question for actions without a form}
        form: {oneOf: [{$ref: '#/components/schemas/Form'}, {type: 'null'}]}
    RecordLink:
      type: object
      required: [label, href]
      properties:
        label: {type: string}
        href: {type: string, description: 'Console path, for example /support?customer=… or /orders?open=AT-…'}
    RecordDetail:
      type: object
      required: [resource, id, title, subtitle, status, tone, sections, tables, activity, notes, notesEnabled, actions, editForm, links, version]
      properties:
        resource: {$ref: '#/components/schemas/ResourceKey'}
        id: {type: string}
        title: {type: string}
        subtitle: {type: string}
        status: {type: [string, 'null']}
        tone: {oneOf: [{$ref: '#/components/schemas/Tone'}, {type: 'null'}]}
        sections: {type: array, items: {$ref: '#/components/schemas/DetailSection'}}
        tables: {type: array, items: {$ref: '#/components/schemas/DetailTable'}}
        activity: {type: array, items: {$ref: '#/components/schemas/ActivityEntry'}}
        notes: {type: array, items: {$ref: '#/components/schemas/Note'}}
        notesEnabled: {type: boolean}
        actions: {type: array, items: {$ref: '#/components/schemas/RecordAction'}}
        editForm: {oneOf: [{$ref: '#/components/schemas/Form'}, {type: 'null'}]}
        links: {type: array, items: {$ref: '#/components/schemas/RecordLink'}}
        version: {type: [string, 'null'], description: Optimistic-locking version to send back with edits}
    RecordValues:
      type: object
      properties:
        values:
          type: object
          additionalProperties: {$ref: '#/components/schemas/FieldValue'}
        version: {type: [string, 'null']}
    NoteRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
    # ── exports
    ExportFormat: {type: string, enum: [csv, xlsx]}
    ExportRequest:
      type: object
      required: [resource, format]
      properties:
        resource: {$ref: '#/components/schemas/ResourceKey'}
        format: {$ref: '#/components/schemas/ExportFormat'}
        q: {type: string, maxLength: 120}
        status: {type: string, maxLength: 60}
    ExportJob:
      type: object
      required: [id, resource, format, status, rows, async, fileName, createdAt, finishedAt, expiresAt, downloadUrl, error]
      properties:
        id: {type: string}
        resource: {$ref: '#/components/schemas/ResourceKey'}
        format: {$ref: '#/components/schemas/ExportFormat'}
        status: {type: string, enum: [QUEUED, RUNNING, READY, FAILED, EXPIRED]}
        rows: {type: integer, description: Rows written so far}
        async: {type: boolean, description: 'Built in the background (more than 5,000 rows)'}
        fileName: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time, description: The download link stops working at this time (24 hours after READY)}
        downloadUrl: {type: [string, 'null'], description: Console-relative download path (redirects to the signed URL)}
        error: {type: [string, 'null']}
    ExportJobList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ExportJob'}}
    # ── support
    CustomerHit:
      type: object
      required: [id, name, email, enabled, principalType]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        enabled: {type: boolean}
        principalType: {type: string}
    CustomerSearch:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CustomerHit'}}
    SupportShipment:
      type: object
      required: [id, label, status, sellerName, carrier, trackingNumber, cancellable, totalMinor]
      properties:
        id: {type: string}
        label: {type: string}
        status: {type: string}
        sellerName: {type: string}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        cancellable: {type: boolean}
        totalMinor: {type: integer, format: int64}
    SupportOrder:
      type: object
      required: [id, orderNumber, status, placedAt, totalMinor, currency, shipments]
      properties:
        id: {type: string}
        orderNumber: {type: string}
        status: {type: string}
        placedAt: {type: string, format: date-time}
        totalMinor: {type: integer, format: int64}
        currency: {type: string}
        shipments: {type: array, items: {$ref: '#/components/schemas/SupportShipment'}}
    SupportClaim:
      type: object
      required: [id, reference, type, status, orderNumber, amountMinor, refundMinor, open]
      properties:
        id: {type: string}
        reference: {type: string}
        type: {type: string}
        status: {type: string}
        orderNumber: {type: string}
        amountMinor: {type: integer, format: int64}
        refundMinor: {type: [integer, 'null'], format: int64}
        open: {type: boolean}
    SupportReturn:
      type: object
      required: [id, number, status, orderNumber, refundState, estimateMinor]
      properties:
        id: {type: string}
        number: {type: string}
        status: {type: string}
        orderNumber: {type: string}
        refundState: {type: [string, 'null']}
        estimateMinor: {type: integer, format: int64}
    SupportNotification:
      type: object
      required: [id, channel, templateKey, subject, status, address, createdAt]
      properties:
        id: {type: string}
        channel: {type: string}
        templateKey: {type: string}
        subject: {type: [string, 'null']}
        status: {type: string}
        address: {type: string}
        createdAt: {type: string, format: date-time}
    SupportCaseSummary:
      type: object
      required: [id, reference, reason, summary, status, openedAt]
      properties:
        id: {type: string}
        reference: {type: string}
        reason: {type: string}
        summary: {type: string}
        status: {type: string}
        openedAt: {type: string, format: date-time}
    SupportBooking:
      type: object
      required: [id, service, status, startsAt]
      properties:
        id: {type: string}
        service: {type: string}
        status: {type: string}
        startsAt: {type: string, format: date-time}
    AuditLine:
      type: object
      required: [at, actor, action, summary]
      properties:
        at: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string}
        summary: {type: string}
    SupportCustomer:
      type: object
      required: [id, name, email, enabled, emailVerified, roles]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        enabled: {type: boolean}
        emailVerified: {type: boolean}
        roles: {type: array, items: {type: string}}
    SupportPermissions:
      type: object
      required: [refund, resend, cancelShipment]
      properties:
        refund: {type: boolean}
        resend: {type: boolean}
        cancelShipment: {type: boolean}
    Customer360:
      type: object
      required: [customer, orders, bookings, claims, returns, notifications, cases, audit, refundLimitMinor, can, unavailable]
      properties:
        customer: {$ref: '#/components/schemas/SupportCustomer'}
        orders: {type: array, items: {$ref: '#/components/schemas/SupportOrder'}}
        bookings: {type: array, items: {$ref: '#/components/schemas/SupportBooking'}}
        claims: {type: array, items: {$ref: '#/components/schemas/SupportClaim'}}
        returns: {type: array, items: {$ref: '#/components/schemas/SupportReturn'}}
        notifications: {type: array, items: {$ref: '#/components/schemas/SupportNotification'}}
        cases: {type: array, items: {$ref: '#/components/schemas/SupportCaseSummary'}}
        audit: {type: array, items: {$ref: '#/components/schemas/AuditLine'}}
        refundLimitMinor: {type: [integer, 'null'], format: int64}
        can: {$ref: '#/components/schemas/SupportPermissions'}
        unavailable: {type: array, items: {type: string}, description: Upstreams that could not answer (their sections are empty)}
    SupportRefundRequest:
      type: object
      required: [customerId, orderNumber, amountMinor, reason, via]
      properties:
        customerId: {type: string}
        orderNumber: {type: string, minLength: 1}
        amountMinor: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 3, maxLength: 500}
        via: {type: string, enum: [CLAIM, ORDER]}
        claimId: {type: string, description: Required with via CLAIM}
        caseId: {type: string, description: Support case the refund resolves (optional)}
    SupportResendRequest:
      type: object
      required: [customerId]
      properties:
        customerId: {type: string}
        caseId: {type: string}
    SupportCancelRequest:
      type: object
      required: [customerId, orderNumber, reason]
      properties:
        customerId: {type: string}
        orderNumber: {type: string, minLength: 1}
        reason: {type: string, minLength: 3, maxLength: 500}
        caseId: {type: string}
    SupportActionResult:
      type: object
      required: [ok, message, reference, audited]
      properties:
        ok: {type: boolean}
        message: {type: string}
        reference: {type: [string, 'null'], description: 'Refund, notification or shipment reference'}
        audited: {type: boolean, description: The upstream records the action in the trust-ops audit log}
    # ── fees & commissions
    FeeLimits:
      type: object
      description: Bounds the editor enforces (rates in basis points, amounts in minor units)
      required: [commissionMaxBps, cardPctMaxBps, cardFixedMaxMinor, fbaPerUnitMaxMinor, noteMinLength, noteMaxLength, maxCategoryRates, maxOverrides,
        deliveryMaxRadiusMiles, deliveryAmountMaxMinor, deliveryMaxBands, maxDeliveryOverrides]
      properties:
        commissionMaxBps: {type: integer, examples: [5000]}
        cardPctMaxBps: {type: integer, examples: [1000]}
        cardFixedMaxMinor: {type: integer, format: int64, examples: [1000]}
        fbaPerUnitMaxMinor: {type: integer, format: int64, examples: [10000]}
        noteMinLength: {type: integer}
        noteMaxLength: {type: integer}
        maxCategoryRates: {type: integer}
        maxOverrides: {type: integer}
        deliveryMaxRadiusMiles: {type: number, examples: [200], description: Largest AfroTransact Delivery service radius payments accepts}
        deliveryAmountMaxMinor: {type: integer, format: int64, examples: [10000], description: 'Largest delivery amount: fee, base, per mile, band, min or max'}
        deliveryMaxBands: {type: integer, examples: [20]}
        maxDeliveryOverrides: {type: integer, examples: [500]}
    FeeCategory:
      type: object
      required: [key, label, source]
      properties:
        key: {type: string, description: 'payments category key (lower-case), e.g. groceries'}
        label: {type: string}
        source: {type: string, enum: [TAXONOMY, SCHEDULE, PLATFORM], description: 'TAXONOMY: a catalog department; SCHEDULE: only known from a fee schedule; PLATFORM: services'}
    FeeCategoryRate:
      type: object
      required: [category, label, commissionBps]
      properties:
        category: {type: string}
        label: {type: string}
        commissionBps: {type: integer, minimum: 0, maximum: 10000}
    FeeOverride:
      type: object
      required: [orgId, orgName, category, categoryLabel, commissionBps]
      properties:
        orgId: {type: string}
        orgName: {type: [string, 'null']}
        category: {type: [string, 'null'], description: null = every category}
        categoryLabel: {type: string}
        commissionBps: {type: integer, minimum: 0, maximum: 10000}
    FeeScheduleView:
      type: object
      required: [id, version, status, effectiveFrom, currency, defaultCommissionBps, categoryRates, overrides, cardPctBps, cardFixedMinor, fbaPerUnitMinor,
        reverseCommissionOnRefund, deliveryPricing, note, createdBy, createdAt, cancelledAt, cancelledBy, cancelReason, cancellable]
      properties:
        id: {type: string}
        version: {type: integer}
        status: {type: string, enum: [ACTIVE, SCHEDULED, SUPERSEDED, CANCELLED]}
        effectiveFrom: {type: string, format: date-time}
        currency: {type: string}
        defaultCommissionBps: {type: integer, description: Commission of categories without their own rate (basis points)}
        categoryRates: {type: array, items: {$ref: '#/components/schemas/FeeCategoryRate'}}
        overrides: {type: array, items: {$ref: '#/components/schemas/FeeOverride'}}
        cardPctBps: {type: integer, description: 'Card fee estimate per charge, percentage part'}
        cardFixedMinor: {type: integer, format: int64, description: 'Card fee estimate per charge, fixed part'}
        fbaPerUnitMinor: {type: integer, format: int64}
        reverseCommissionOnRefund: {type: boolean}
        deliveryPricing:
          oneOf: [{$ref: '#/components/schemas/DeliveryPricing'}, {type: 'null'}]
          description: 'AfroTransact Delivery from seller stores (S255); null when the version has no delivery pricing (quotes NOT_CONFIGURED)'
        note: {type: [string, 'null']}
        createdBy: {type: string}
        createdAt: {type: [string, 'null'], format: date-time}
        cancelledAt: {type: [string, 'null'], format: date-time}
        cancelledBy: {type: [string, 'null']}
        cancelReason: {type: [string, 'null']}
        cancellable: {type: boolean, description: Scheduled and the caller may configure fees}
    FeeRetail:
      type: object
      required: [orgId, name, note]
      properties:
        orgId: {type: string, description: Empty when RETAIL_ORG_ID is not configured}
        name: {type: string}
        note: {type: string, examples: ['No commission, no fees (merchant of record)']}
    FeesOverview:
      type: object
      required: [generatedAt, currency, canConfigure, current, base, minEffectiveFrom, immediateAllowed, schedules, categories, taxonomyAvailable,
        orgNamesAvailable, retail, limits, exampleSaleMinor, reverseOnRefundHelp]
      properties:
        generatedAt: {type: string, format: date-time}
        currency: {type: string}
        canConfigure: {type: boolean, description: payments:configure and EDIT on fees (create and cancel versions)}
        current: {oneOf: [{$ref: '#/components/schemas/FeeScheduleView'}, {type: 'null'}], description: The version in force now}
        base: {oneOf: [{$ref: '#/components/schemas/FeeScheduleView'}, {type: 'null'}], description: 'What a new version starts from (the latest scheduled version, else the active one)'}
        minEffectiveFrom: {type: string, format: date-time, description: 'Earliest effective time of a new version'}
        immediateAllowed: {type: boolean, description: false while a version is scheduled}
        schedules: {type: array, items: {$ref: '#/components/schemas/FeeScheduleView'}, description: 'Every version, newest first'}
        categories: {type: array, items: {$ref: '#/components/schemas/FeeCategory'}}
        taxonomyAvailable: {type: boolean, description: false when catalog could not be read (free text still works)}
        orgNamesAvailable: {type: boolean}
        retail: {$ref: '#/components/schemas/FeeRetail'}
        limits: {$ref: '#/components/schemas/FeeLimits'}
        exampleSaleMinor: {type: integer, format: int64, description: Sale amount of the impact preview (10000 = $100.00)}
        reverseOnRefundHelp: {type: string}
    FeeOrgHit:
      type: object
      required: [orgId, name, kind, status, retail, selectable, reason]
      properties:
        orgId: {type: string}
        name: {type: string}
        kind: {type: string}
        status: {type: string}
        retail: {type: boolean}
        selectable: {type: boolean}
        reason: {type: [string, 'null'], description: Why the organisation can't be chosen}
    FeeOrgSearch:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FeeOrgHit'}}
    FeeDraftCategoryRate:
      type: object
      required: [category, commissionBps]
      properties:
        category: {type: string, minLength: 1, maxLength: 80}
        commissionBps: {type: integer, minimum: 0, maximum: 5000}
    FeeDraftOverride:
      type: object
      required: [orgId, commissionBps]
      properties:
        orgId: {type: string, minLength: 1, maxLength: 80}
        category: {type: [string, 'null'], maxLength: 80, description: Omitted or null = every category}
        commissionBps: {type: integer, minimum: 0, maximum: 5000}
    FeeScheduleDraft:
      type: object
      required: [defaultCommissionBps, categoryRates, overrides, cardPctBps, cardFixedMinor, fbaPerUnitMinor, reverseCommissionOnRefund, note]
      properties:
        effectiveFrom: {type: [string, 'null'], format: date-time, description: Required unless immediate; in the future}
        immediate: {type: boolean, description: Take effect now (the console asks for confirmation)}
        defaultCommissionBps: {type: integer, minimum: 0, maximum: 5000}
        categoryRates: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/FeeDraftCategoryRate'}}
        overrides: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/FeeDraftOverride'}}
        cardPctBps: {type: integer, minimum: 0, maximum: 1000}
        cardFixedMinor: {type: integer, format: int64, minimum: 0, maximum: 1000}
        fbaPerUnitMinor: {type: integer, format: int64, minimum: 0, maximum: 10000}
        reverseCommissionOnRefund: {type: boolean}
        deliveryPricing:
          oneOf: [{$ref: '#/components/schemas/DeliveryPricingDraft'}, {type: 'null'}]
          description: AfroTransact Delivery pricing (S255). Omitted or null = carried over from the latest live version; enabled=false stops offering it
        note: {type: string, minLength: 3, maxLength: 500, description: Why the fees change (required)}
    FeeCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
    # ── AfroTransact Delivery pricing (S255; amounts in minor units, distances in road miles)
    DeliveryBand:
      type: object
      required: [fromMiles, toMiles, feeMinor]
      properties:
        fromMiles: {type: number, minimum: 0, description: From (inclusive)}
        toMiles: {type: number, minimum: 0, description: To (exclusive); bands never overlap}
        feeMinor: {type: integer, format: int64, minimum: 0}
    DeliveryTariff:
      type: object
      description: 'FLAT: flatPerPackageMinor × packages. DISTANCE (per trip): the fee of the band covering the distance, else
        baseMinor + perMileMinor × miles (half up), then at least minMinor and at most maxMinor (null = no cap)'
      required: [mode, flatPerPackageMinor, baseMinor, perMileMinor, bands, minMinor, maxMinor]
      properties:
        mode: {type: string, enum: [FLAT, DISTANCE]}
        flatPerPackageMinor: {type: [integer, 'null'], format: int64, minimum: 0}
        baseMinor: {type: [integer, 'null'], format: int64, minimum: 0}
        perMileMinor: {type: [integer, 'null'], format: int64, minimum: 0, description: '85 = $0.85 per mile'}
        bands: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/DeliveryBand'}}
        minMinor: {type: [integer, 'null'], format: int64, minimum: 0}
        maxMinor: {type: [integer, 'null'], format: int64, minimum: 0}
    DeliveryFeeOverride:
      type: object
      required: [orgId, orgName, sellerFee]
      properties:
        orgId: {type: string}
        orgName: {type: [string, 'null']}
        sellerFee: {$ref: '#/components/schemas/DeliveryTariff'}
    DeliveryPricing:
      type: object
      description: AfroTransact Delivery pricing of a fee-schedule version
      required: [enabled, maxRadiusMiles, customerCharge, sellerFee, sellerOverrides]
      properties:
        enabled: {type: boolean, description: false = not offered under this version}
        maxRadiusMiles: {type: number, description: Beyond this road distance the option is unavailable (BEYOND_MAX_RADIUS)}
        customerCharge: {oneOf: [{$ref: '#/components/schemas/DeliveryTariff'}, {type: 'null'}], description: What the shopper pays (4200); null = free}
        sellerFee: {oneOf: [{$ref: '#/components/schemas/DeliveryTariff'}, {type: 'null'}], description: What the seller pays per pickup-delivery (4250); null = no fee}
        sellerOverrides: {type: array, items: {$ref: '#/components/schemas/DeliveryFeeOverride'}, description: Negotiated seller fees (AfroTransact Retail never pays one)}
    DeliveryDraftOverride:
      type: object
      required: [orgId, sellerFee]
      properties:
        orgId: {type: string, minLength: 1, maxLength: 80}
        sellerFee: {$ref: '#/components/schemas/DeliveryTariff'}
    DeliveryPricingDraft:
      type: object
      required: [enabled, maxRadiusMiles, customerCharge, sellerFee, sellerOverrides]
      properties:
        enabled: {type: boolean}
        maxRadiusMiles: {type: [number, 'null'], description: 0 < r ≤ limits.deliveryMaxRadiusMiles}
        customerCharge: {oneOf: [{$ref: '#/components/schemas/DeliveryTariff'}, {type: 'null'}]}
        sellerFee: {oneOf: [{$ref: '#/components/schemas/DeliveryTariff'}, {type: 'null'}]}
        sellerOverrides: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/DeliveryDraftOverride'}}
    DeliveryQuoteRequest:
      type: object
      required: [sellerOrgId, distanceMiles]
      properties:
        sellerOrgId: {type: string, minLength: 1, maxLength: 80}
        distanceMiles: {type: number, minimum: 0, maximum: 1000, description: Road miles}
        packages: {type: integer, minimum: 1, maximum: 50, default: 1}
        at: {type: [string, 'null'], format: date-time, description: Version in force at this time; default now}
    DeliveryQuote:
      type: object
      required: [available, unavailableReason, customerChargeMinor, sellerFeeMinor, sellerFeeSource, scheduleVersion, maxRadiusMiles, currency]
      properties:
        available: {type: boolean}
        unavailableReason: {type: [string, 'null'], enum: [NOT_CONFIGURED, BEYOND_MAX_RADIUS, null]}
        customerChargeMinor: {type: integer, format: int64}
        sellerFeeMinor: {type: integer, format: int64}
        sellerFeeSource: {type: [string, 'null'], enum: [DEFAULT, OVERRIDE, RETAIL, null]}
        scheduleVersion: {type: [integer, 'null']}
        maxRadiusMiles: {type: [number, 'null']}
        currency: {type: string}
    # ── Dispatch: seller pickups (S255)
    PickupRow:
      type: object
      required: [shipmentId, orderNumber, sellerOrgId, sellerName, city, state, postalCode, status, routeId, perishable, units, promisedBy, createdAt]
      properties:
        shipmentId: {type: string}
        orderNumber: {type: string}
        sellerOrgId: {type: string}
        sellerName: {type: string}
        city: {type: string, description: Drop-off city}
        state: {type: string}
        postalCode: {type: string}
        status: {type: string, description: 'AWAITING_ROUTE, ROUTED, DELIVERED, FAILED or CANCELLED'}
        routeId: {type: [string, 'null']}
        perishable: {type: boolean}
        units: {type: integer}
        promisedBy: {type: [string, 'null'], format: date}
        createdAt: {type: [string, 'null'], format: date-time}
    PickupList:
      type: object
      required: [items, canAssign]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PickupRow'}}
        canAssign: {type: boolean, description: delivery:dispatch and EDIT on dispatch}
    DriverSuggestion:
      type: object
      required: [driverId, routeId, routeName, zone, routeStatus, straightLineMiles, roadMiles, durationMinutes, distanceMethod, positionAt, packagesOnRoute, capacityLeft]
      properties:
        driverId: {type: string}
        routeId: {type: string}
        routeName: {type: string}
        zone: {type: string}
        routeStatus: {type: string}
        straightLineMiles: {type: number}
        roadMiles: {type: [number, 'null'], description: null when geo is down (ranked by straight line)}
        durationMinutes: {type: [number, 'null']}
        distanceMethod: {type: string, description: 'ROAD_GOOGLE, ROAD_OSRM, GEODESIC_DETOUR or STRAIGHT_LINE'}
        positionAt: {type: [string, 'null'], format: date-time}
        packagesOnRoute: {type: integer}
        capacityLeft: {type: integer}
    DriverSuggestions:
      type: object
      required: [shipmentId, drivers, canAssign]
      properties:
        shipmentId: {type: string}
        drivers: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/DriverSuggestion'}}
        canAssign: {type: boolean}
    PickupAssignRequest:
      type: object
      required: [routeId, reason]
      properties:
        routeId: {type: string, minLength: 1, maxLength: 20}
        reason: {type: string, minLength: 5, maxLength: 500}
    PickupAssignResult:
      type: object
      required: [shipmentId, routeId, routeName, driverId, status]
      properties:
        shipmentId: {type: string}
        routeId: {type: string}
        routeName: {type: [string, 'null']}
        driverId: {type: [string, 'null']}
        status: {type: string, description: The route's status}
    PickupAssignment:
      type: object
      required: [id, shipmentId, routeId, driverId, mode, reason, previousRouteId, straightMiles, roadMiles, distanceMethod, actor, createdAt]
      properties:
        id: {type: string}
        shipmentId: {type: string}
        routeId: {type: string}
        driverId: {type: [string, 'null']}
        mode: {type: string, enum: [AUTO_NEAREST, DISPATCH_OVERRIDE]}
        reason: {type: [string, 'null']}
        previousRouteId: {type: [string, 'null']}
        straightMiles: {type: [number, 'null']}
        roadMiles: {type: [number, 'null']}
        distanceMethod: {type: [string, 'null']}
        actor: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
    PickupAssignmentList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PickupAssignment'}}
    PickupWindow:
      type: object
      required: [day, opens, closes]
      properties:
        day: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
        opens: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        closes: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    ShipFromLocation:
      type: object
      required: [id, orgId, label, line1, line2, city, state, postalCode, country, position, pickupEnabled, pickupHours, zoneName]
      properties:
        id: {type: string}
        orgId: {type: string}
        label: {type: string}
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        state: {type: string}
        postalCode: {type: string}
        country: {type: string}
        position:
          type: [object, 'null']
          required: [lat, lng, precision]
          properties:
            lat: {type: number}
            lng: {type: number}
            precision: {type: string, enum: [ADDRESS, ZIP, POINT]}
        pickupEnabled: {type: boolean}
        pickupHours: {type: array, items: {$ref: '#/components/schemas/PickupWindow'}}
        zoneName: {type: [string, 'null']}
    # ── Notifications: templates (S268)
    NotificationChannel: {type: string, enum: [email, sms, push, chat], description: chat is WhatsApp}
    NotificationCategory: {type: string, enum: [security, transactional, reminder, marketing], description: 'Consent rules: security always sends, transactional unless the channel is off, reminder respects preferences and quiet hours, marketing needs opt-in'}
    NotificationTemplateSummary:
      type: object
      required: [key, category, channels, locales, latestVersion, updatedBy, updatedAt]
      properties:
        key: {type: string, examples: [order.confirmed]}
        category: {$ref: '#/components/schemas/NotificationCategory'}
        channels: {type: array, items: {$ref: '#/components/schemas/NotificationChannel'}}
        locales: {type: array, items: {type: string}}
        latestVersion: {type: integer, description: Highest version over the key's locales and channels}
        updatedBy: {type: [string, 'null'], description: Who created the most recent version (system for seeded templates)}
        updatedAt: {type: [string, 'null'], format: date-time}
    NotificationTemplateList:
      type: object
      required: [items, total, canEdit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/NotificationTemplateSummary'}}
        total: {type: integer}
        canEdit: {type: boolean, description: 'notifications:templates:write (new versions and test-sends)'}
    NotificationTemplateVersion:
      type: object
      required: [locale, channel, version, category, subject, bodyHtml, bodyText, createdBy, createdAt]
      properties:
        locale: {type: string}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        version: {type: integer}
        category: {$ref: '#/components/schemas/NotificationCategory'}
        subject: {type: string, description: 'Email subject, push title or WhatsApp template name'}
        bodyHtml: {type: string, description: 'Email HTML (Go html/template); empty on other channels'}
        bodyText: {type: string, description: 'Text part, SMS, push body or WhatsApp parameters (Go text/template)'}
        createdBy: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
    NotificationTemplateVariant:
      type: object
      required: [locale, channel, latestVersion, versions]
      properties:
        locale: {type: string}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        latestVersion: {type: integer}
        versions: {type: array, description: Newest first, items: {$ref: '#/components/schemas/NotificationTemplateVersion'}}
    NotificationSample:
      type: object
      required: [source, area, eventTypes, data]
      properties:
        source:
          type: string
          enum: [event, request, sample, none]
          description: "event: a producer event through notifications' real ingest; request: a producer's notification.requested; sample: fixed data for keys no event maps to; none: no sample"
        area: {type: string, enum: [account, orders, seller, payouts, bookings, trust, retail, marketing, security, other]}
        eventTypes: {type: array, items: {type: string}, description: Event types that send this template}
        data: {type: object, additionalProperties: true}
    NotificationTemplateDetail:
      type: object
      required: [key, category, variants, sample, canEdit, canTestSend]
      properties:
        key: {type: string}
        category: {$ref: '#/components/schemas/NotificationCategory'}
        variants: {type: array, items: {$ref: '#/components/schemas/NotificationTemplateVariant'}}
        sample: {$ref: '#/components/schemas/NotificationSample'}
        canEdit: {type: boolean}
        canTestSend: {type: boolean}
    NotificationDraft:
      type: object
      required: [bodyText]
      properties:
        category: {$ref: '#/components/schemas/NotificationCategory'}
        subject: {type: string, maxLength: 300}
        bodyHtml: {type: string, maxLength: 50000}
        bodyText: {type: string, maxLength: 5000}
    NotificationPreviewRequest:
      type: object
      required: [channel]
      properties:
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        locale: {type: string, default: en, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
        version: {type: integer, minimum: 0, default: 0, description: 0 = latest}
        data: {type: object, additionalProperties: true, description: Template fields (start from the sample data)}
        draft: {$ref: '#/components/schemas/NotificationDraft'}
    SmsSegments:
      type: object
      required: [encoding, characters, units, segments, perSegment]
      properties:
        encoding: {type: string, enum: [GSM-7, UCS-2], description: UCS-2 as soon as one character is outside the GSM 03.38 alphabet}
        characters: {type: integer}
        units: {type: integer, description: GSM-7 septets (extension characters count two) or UTF-16 code units}
        segments: {type: integer}
        perSegment: {type: integer, description: '160 / 70 for one segment, 153 / 67 per part when concatenated'}
    NotificationPreview:
      type: object
      required: [subject, html, text, version, category, sms]
      properties:
        subject: {type: string}
        html: {type: string, description: Email HTML; show it in a sandboxed iframe}
        text: {type: string}
        version: {type: integer, description: The rendered version (0 for a draft)}
        category: {$ref: '#/components/schemas/NotificationCategory'}
        sms:
          oneOf:
            - {$ref: '#/components/schemas/SmsSegments'}
            - {type: 'null'}
    NotificationVersionDraft:
      type: object
      required: [locale, channel, category, bodyText]
      properties:
        locale: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        category: {$ref: '#/components/schemas/NotificationCategory'}
        subject: {type: string, maxLength: 300}
        bodyHtml: {type: string, maxLength: 50000}
        bodyText: {type: string, minLength: 1, maxLength: 5000}
    NotificationTestSendResult:
      type: object
      required: [to, channel, provider]
      properties:
        to: {type: string, description: Your own email or phone}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        provider: {type: [string, 'null']}
    # ── pre-orders (S270–S275); relayed from delivery-runs, so objects stay open (additionalProperties)
    PreorderCan:
      type: object
      required: [manage, settings, export, lateAdd]
      properties:
        manage: {type: boolean, description: 'EDIT or FULL and preorders:manage: windows, creatives, areas'}
        settings: {type: boolean, description: 'FULL and preorders:manage: master switch, fallback, placements, payment setup'}
        export: {type: boolean, description: preorders:export}
        lateAdd: {type: boolean, description: 'APPROVE, EDIT or FULL and preorders:late-add'}
    StaffPreorderObject:
      type: object
      additionalProperties: true
    StaffPreorderItems:
      type: object
      required: [items]
      additionalProperties: true
      properties:
        items: {type: array, items: {type: object, additionalProperties: true}}
        total: {type: [integer, 'null']}
        page: {type: integer}
        size: {type: integer}
    StaffPreorderList:
      type: object
      required: [items, can]
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'Row: id, code, name, where, opensAt, closesAt, deliversOn, status, count, revenueMinor, areaOff'
        total: {type: [integer, 'null']}
        counts: {type: object, additionalProperties: {type: integer}, description: Tab counts}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderDraft:
      type: object
      additionalProperties: true
      description: |
        Window fields (delivery-runs PreorderWindow): name, targets[] (country/region[/city] keys), opensAt, closesAt,
        deliversOn, ribbon (≤ 80), headline (≤ 140), smsCopy (≤ 160, GSM-7), categories[], door, pickup, pickupPoint,
        doorFeeOverride / pickupFeeOverride (minor units, null = the settings' fees), showCount, socialBudget, comms[]
        (ANNOUNCE, REMIND_48H, LAST_CALL_6H, CLOSED, OUT_FOR_DELIVERY, PAID_SOCIAL).
      properties:
        name: {type: string, maxLength: 120}
        targets: {type: array, items: {type: string}}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        deliversOn: {type: string, format: date}
        ribbon: {type: string, maxLength: 80}
        headline: {type: string, maxLength: 140}
        smsCopy: {type: string, maxLength: 160}
        categories: {type: array, items: {type: string}}
        door: {type: boolean}
        pickup: {type: boolean}
        pickupPoint: {type: [object, 'null'], additionalProperties: true}
        doorFeeOverride: {type: [integer, 'null']}
        pickupFeeOverride: {type: [integer, 'null']}
        showCount: {type: boolean}
        comms: {type: array, items: {type: string}}
        version: {type: integer}
    StaffPreorderWindow:
      type: object
      required: [can]
      additionalProperties: true
      properties:
        id: {type: string}
        code: {type: string, examples: [LBK-7]}
        name: {type: string}
        status: {type: string, description: 'DRAFT, PAUSED, UPCOMING, OPEN, CLOSED, DELIVERED (derived)'}
        doorFeeOverride: {type: [integer, 'null'], description: Window override in minor units (null = the settings' fee for its currency)}
        pickupFeeOverride: {type: [integer, 'null']}
        effectiveDoorFee: {type: integer, description: 'Door fee shoppers pay (override, else settings), minor units'}
        effectivePickupFee: {type: integer}
        currency: {type: string}
        pickupWindow: {type: [string, 'null']}
        allowedMethods: {type: array, items: {type: string, enum: [CARD, WALLET, ACH]}}
        creatives: {type: object, additionalProperties: true}
        violations: {type: array, items: {type: object, additionalProperties: true}, description: Publish checks that fail}
        version: {type: integer}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderSettings:
      type: object
      additionalProperties: true
      description: |
        Platform settings (delivery-runs): enabled, fallback (SHIP | WAITLIST), placements {ribbon, hero, badge, pdp,
        cart, family}, payment {doorFee and pickupFee (per currency, minor units), pickupWindow, allowedMethods
        [CARD, WALLET, ACH], lateAdd {savedCard, paymentLink, linkExpiryHours}, missedDelivery {offerRefund,
        offerNewDate}}. Answers carry `can`.
      properties:
        enabled: {type: boolean}
        fallback: {type: string, enum: [SHIP, WAITLIST]}
        placements: {type: object, additionalProperties: {type: boolean}}
        payment:
          type: object
          additionalProperties: true
          properties:
            doorFee: {type: object, additionalProperties: {type: integer}, description: Minor units per currency, examples: [{USD: 799, CAD: 999}]}
            pickupFee: {type: object, additionalProperties: {type: integer}, description: Minor units per currency, examples: [{USD: 0, CAD: 0}]}
            pickupWindow: {type: string, examples: [10am–2pm]}
            allowedMethods: {type: array, items: {type: string, enum: [CARD, WALLET, ACH]}}
            lateAdd:
              type: object
              properties:
                savedCard: {type: boolean}
                paymentLink: {type: boolean}
                linkExpiryHours: {type: integer}
            missedDelivery:
              type: object
              properties:
                offerRefund: {type: boolean}
                offerNewDate: {type: boolean}
        version: {type: integer}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderAreas:
      type: object
      required: [can]
      additionalProperties: true
      properties:
        items: {type: array, items: {type: object, additionalProperties: true}}
        total: {type: [integer, 'null']}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderLateOrder:
      type: object
      required: [customerId, phoneConfirmed, items, payment, reason]
      properties:
        customerId: {type: string}
        addressId: {type: string}
        newAddress:
          type: object
          properties:
            line1: {type: string}
            zip: {type: string}
            placeId: {type: string}
        phoneConfirmed: {type: boolean, const: true}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [atin, qty]
            properties:
              atin: {type: string}
              qty: {type: integer, minimum: 1}
        payment: {type: string, enum: [SAVED_CARD, PAYMENT_LINK]}
        fulfilment: {type: string, enum: [DOOR, PICKUP]}
        reason: {type: string, maxLength: 120, examples: [Customer called]}
        note: {type: string, maxLength: 500}
    LateAddAddress:
      type: object
      required: [id, label, line1, city, region, zip]
      properties:
        id: {type: string}
        label: {type: string}
        line1: {type: string}
        city: {type: string}
        region: {type: string}
        zip: {type: string}
    LateAddCustomers:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, phone, email, city, region, country, addresses]
            properties:
              id: {type: string}
              name: {type: string}
              phone: {type: string}
              email: {type: string}
              city: {type: string}
              region: {type: string}
              country: {type: string}
              addresses: {type: array, items: {$ref: '#/components/schemas/LateAddAddress'}}
              addressesUnavailable: {type: boolean, description: identity could not list the addresses (enter a new one)}
