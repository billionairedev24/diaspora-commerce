openapi: 3.1.0
info:
  title: Geo API
  version: v1
  description: |
    Address autocomplete for every address field (Google Places API (New) when a key is configured, OpenStreetMap
    Nominatim otherwise, with automatic fallback), structured resolution, USPS-grade validation through Smarty
    (missing unit, undeliverable, corrections suggested — never silently applied), ZIP lookup for the
    deliver-to picker, PostGIS delivery zones / FC catchments / provider service areas, and road distances for
    AfroTransact Delivery pricing and dispatch (routing providers Google Routes API / OSRM in priority order, PostGIS
    geodesic × detour factor as the last resort).
    Provider keys never reach clients: browsers and apps call this API.
servers:
  - {url: 'http://localhost:8205', description: local}
  - {url: 'https://api.dev.afrotransact.com/geo', description: dev}
  - {url: 'https://api.uat.afrotransact.com/geo', description: uat}
  - {url: 'https://api.afrotransact.com/geo', description: prod}
tags:
  - name: Addresses
    description: Autocomplete, resolution, validation and ZIP lookup for address fields
  - name: Zones
    description: Delivery zones, FC catchments and provider service areas
  - name: Distance
    description: Distances between places (AfroTransact Delivery pricing, nearest drivers) and forward geocoding
paths:
  /v1/addresses/autocomplete:
    get:
      tags: [Addresses]
      operationId: autocompleteAddress
      summary: Suggestions from the first character
      description: >-
        One call per keystroke of any address field (checkout, account addresses, onboarding, warehouses, pickup
        points, deliver-to ZIP, city fields). Send the `session` returned by the first call with every following
        keystroke and with `GET /v1/addresses/resolve/{id}` for the picked suggestion: Google Places bills the whole
        entry as one session. `kind` narrows suggestions to the field (street addresses, ZIP codes or cities), `near`
        biases them towards a point (the deliver-to location, a warehouse) and `lang` sets the language of the text.
        Providers fail over in order; responses are never cached (`Cache-Control: no-store`).
      security: []
      parameters:
        - {name: q, in: query, required: true, description: What the user typed (one character is enough), schema: {type: string, maxLength: 120}}
        - name: session
          in: query
          description: Session token from the previous response (one per address entry); omit on the first keystroke.
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,36}$'}
        - {name: country, in: query, description: ISO 3166-1 alpha-2 country the suggestions are restricted to, schema: {type: string, default: US, pattern: '^[A-Za-z]{2}$'}}
        - name: kind
          in: query
          description: >-
            `address` (street level: checkout, account, onboarding, warehouses, pickup points), `postal_code`
            (deliver-to ZIP) or `locality` (cities); omitted = street addresses and ZIP codes.
          schema: {type: string, enum: [address, postal_code, locality]}
        - {name: near, in: query, description: 'Bias point as lat,lng (lat and lng parameters are accepted too)', schema: {type: string, example: '29.7604,-95.3698'}}
        - {name: lat, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: lng, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: radiusMiles, in: query, description: 'Bias radius (default and maximum about 31 miles, the Places limit)', schema: {type: number, exclusiveMinimum: 0, maximum: 100}}
        - {name: lang, in: query, description: BCP 47 language of the suggestion text; defaults to Accept-Language, schema: {type: string, example: fr}}
      responses:
        '200':
          description: Up to five suggestions and the session token to reuse
          headers:
            Cache-Control: {description: no-store, schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, session]
                properties:
                  suggestions: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
                  session: {type: string, description: Send with the next keystroke and with the resolve call}
        '400': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /v1/addresses/resolve/{id}:
    get:
      tags: [Addresses]
      operationId: resolveAddress
      summary: Structured address and coordinates for a suggestion
      description: >-
        Fills the form when the user picks a suggestion: street, unit, city, state, ZIP, country and coordinates. A
        house number the user typed is kept. Pass the autocomplete `session` to close the billing session.
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: session, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,36}$'}}
      responses:
        '200': {description: Address, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/addresses/validate:
    post:
      tags: [Addresses]
      operationId: validateAddress
      summary: Validate deliverability and get suggested corrections
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/Validation'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/zip/{zip}:
    get:
      tags: [Addresses]
      operationId: lookupZip
      summary: City and state for a 5-digit ZIP (deliver-to picker)
      security: []
      parameters:
        - {name: zip, in: path, required: true, schema: {type: string, pattern: '^\d{5}$'}}
      responses:
        '200': {description: Place, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/reverse:
    get:
      tags: [Addresses]
      operationId: reverseGeocode
      summary: ZIP, city, state and country at a point (deliver-to by device location)
      description: |
        Providers in order: Google Geocoding (when a key is configured), then OpenStreetMap Nominatim (and the offline
        fixture list locally). A provider that fails or knows no address hands over to the next. Coordinates are
        rounded to 4 decimals (~11 m) before they leave the service. `lon` is accepted as an alias of `lng`.
      security: []
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: lng, in: query, required: true, schema: {type: number, minimum: -180, maximum: 180}}
      responses:
        '200': {description: Nearest postal address, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /v1/zones/covering:
    get:
      tags: [Zones]
      operationId: zonesCovering
      summary: Active zones containing a point (delivery eligibility, provider reach)
      security: []
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}}
        - {name: lon, in: query, required: true, schema: {type: number}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/ZoneType'}}
        - name: withinMiles
          in: query
          description: >-
            Also return zones whose edge is at most this many miles away (0–200), nearest first, each with `inside` and
            `distanceMiles` (seller pickup locations just outside a delivery zone).
          schema: {type: number, minimum: 0, maximum: 200}
      responses:
        '200':
          description: Zones
          content: {application/json: {schema: {type: object, properties: {zones: {type: array, items: {$ref: '#/components/schemas/ZoneMatch'}}}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/distance:
    post:
      tags: [Distance]
      operationId: distance
      summary: Distance between two places
      description: >-
        Each end is coordinates (`lat`/`lng`, e.g. stored on an address), a provider address id (`addressId`, from
        autocomplete), a `zip` (centroid) or a street `address` (geocoded with the provider chain, ZIP centroid as a
        fallback). `roadMiles` and `durationMinutes` are driving distance and time from the first routing provider
        that answers, in the configured priority order (`GEO_ROUTING_PROVIDERS`, e.g. google then osrm; each enabled
        only when its key / URL is set; a failure or timeout moves to the next): method `ROAD_GOOGLE` (Routes API
        computeRouteMatrix) or `ROAD_OSRM` (OSRM table service). Only when no provider is configured or all fail:
        PostGIS geodesic distance × detour factor (default 1.3) at 25 mph, method `GEODESIC_DETOUR`. Provider results
        are cached by origin / destination rounded to ~50 m (`cached: true`). `straightLineMiles` is always the
        PostGIS geodesic distance (WGS84 spheroid). `estimatedRoadMiles` repeats `roadMiles` (deprecated alias).
        Miles are rounded to 2 decimals, minutes to 1.
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DistanceRequest'}}}
      responses:
        '200': {description: Distance, content: {application/json: {schema: {$ref: '#/components/schemas/Distance'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /v1/distance/batch:
    post:
      tags: [Distance]
      operationId: distanceBatch
      summary: One origin, many destinations (at most 100)
      description: >-
        Results keep the destinations' order. A destination that cannot be located gets its own `error` (codes
        `geo.invalid-place`, `geo.place-not-found`, `geo.provider-unavailable`); the others are still measured.
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DistanceBatchRequest'}}}
      responses:
        '200': {description: Distances, content: {application/json: {schema: {$ref: '#/components/schemas/DistanceBatch'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /v1/geocode:
    post:
      tags: [Distance]
      operationId: geocode
      summary: Position of a street address (seller ship-from and customer addresses)
      description: >-
        Coordinates already on the address are returned as they are (precision `POINT`). Otherwise the address is
        geocoded with the autocomplete provider chain (precision `ADDRESS`), falling back to the ZIP centroid
        (`ZIP`). 404 `geo.not-found` when nothing matches.
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GeocodeRequest'}}}
      responses:
        '200': {description: Position, content: {application/json: {schema: {$ref: '#/components/schemas/Located'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /v1/zones:
    get:
      tags: [Zones]
      operationId: listZones
      summary: List zones, optionally by type and owner
      security: [{bearer: []}]
      parameters:
        - {name: type, in: query, schema: {$ref: '#/components/schemas/ZoneType'}}
        - {name: ownerId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Zones
          content: {application/json: {schema: {type: object, properties: {zones: {type: array, items: {$ref: '#/components/schemas/Zone'}}}}}}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Zones]
      operationId: saveZone
      summary: Create or update a zone (geo:zones:write)
      security: [{bearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Zone'}}}
      responses:
        '201': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/Zone'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Problem:
      description: RFC 9457 problem
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Problem:
      type: object
      properties: {type: {type: string}, title: {type: string}, status: {type: integer}, detail: {type: string}, code: {type: string}}
    Suggestion:
      type: object
      properties:
        id: {type: string, description: Pass to resolve}
        text: {type: string}
        mainText: {type: string}
        secondaryText: {type: string}
        provider: {type: string, enum: [google-places, osm-nominatim, fixture]}
        kind: {type: string, enum: [address, postal_code, locality]}
        distanceMeters: {type: number, description: Straight-line distance from the bias point (when near was given)}
    Address:
      type: object
      required: [line1, city, state, postalCode]
      properties:
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        state: {type: string}
        postalCode: {type: string}
        country: {type: string, default: US}
        lat: {type: number}
        lon: {type: number}
    Validation:
      type: object
      properties:
        status: {type: string, enum: [VALID, CORRECTED, MISSING_UNIT, UNDELIVERABLE, UNVERIFIED]}
        standardized: {$ref: '#/components/schemas/Address'}
        suggestions: {type: array, items: {$ref: '#/components/schemas/Address'}}
        residential: {type: boolean}
        messages: {type: array, items: {type: string}}
    ZoneType: {type: string, enum: [DELIVERY, FC_CATCHMENT, SERVICE_AREA]}
    Zone:
      type: object
      required: [type, ownerId, name]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/ZoneType'}
        ownerId: {type: string}
        name: {type: string}
        geojson: {type: string, description: GeoJSON Polygon or MultiPolygon}
        centerLat: {type: number}
        centerLon: {type: number}
        radiusMiles: {type: number, maximum: 200}
        active: {type: boolean}
    ZoneMatch:
      allOf:
        - {$ref: '#/components/schemas/Zone'}
        - type: object
          properties:
            inside: {type: boolean, description: Only with withinMiles - the zone contains the point}
            distanceMiles: {type: number, description: Only with withinMiles - miles to the zone edge (0 inside)}
    GeocodeRequest:
      type: object
      description: A street address; line1 or postalCode is required
      properties:
        line1: {type: string, example: 9800 Bissonnet St}
        line2: {type: string}
        city: {type: string, example: Houston}
        state: {type: string, example: TX}
        postalCode: {type: string, example: '77036'}
        country: {type: string, default: US}
        lat: {type: number}
        lon: {type: number}
    Place:
      type: object
      description: One of lat + lng, addressId, zip or address (first match wins in that order)
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
        addressId: {type: string, description: 'Provider address id from autocomplete (g:…, o:…, f:…)'}
        zip: {type: string, example: '77002'}
        address: {$ref: '#/components/schemas/GeocodeRequest'}
    Located:
      type: object
      required: [lat, lng, precision]
      properties:
        lat: {type: number}
        lng: {type: number}
        precision: {type: string, enum: [POINT, ADDRESS, ZIP]}
    DistanceRequest:
      type: object
      required: [from, to]
      properties:
        from: {$ref: '#/components/schemas/Place'}
        to: {$ref: '#/components/schemas/Place'}
    DistanceMethod:
      type: string
      enum: [ROAD_GOOGLE, ROAD_OSRM, GEODESIC_DETOUR]
      description: Which routing provider produced roadMiles / durationMinutes (GEODESIC_DETOUR = last-resort estimate)
    Distance:
      type: object
      required: [straightLineMiles, roadMiles, durationMinutes, method]
      properties:
        straightLineMiles: {type: number, example: 12.23}
        roadMiles: {type: number, example: 15.53}
        durationMinutes: {type: number, example: 25}
        method: {$ref: '#/components/schemas/DistanceMethod'}
        cached: {type: boolean, description: Served from the route cache (no provider call)}
        estimatedRoadMiles: {type: number, deprecated: true, description: Same as roadMiles}
        from: {$ref: '#/components/schemas/Located'}
        to: {$ref: '#/components/schemas/Located'}
    DistanceBatchRequest:
      type: object
      required: [from, to]
      properties:
        from: {$ref: '#/components/schemas/Place'}
        to: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Place'}}
    DistanceBatchItem:
      type: object
      required: [index]
      properties:
        index: {type: integer}
        straightLineMiles: {type: number}
        roadMiles: {type: number}
        durationMinutes: {type: number}
        method: {$ref: '#/components/schemas/DistanceMethod'}
        cached: {type: boolean}
        estimatedRoadMiles: {type: number, deprecated: true}
        from: {$ref: '#/components/schemas/Located'}
        to: {$ref: '#/components/schemas/Located'}
        error:
          type: object
          properties: {code: {type: string}, detail: {type: string}}
    DistanceBatch:
      type: object
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/DistanceBatchItem'}}
