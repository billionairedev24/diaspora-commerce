    LocationRequest:
      type: object
      description: 'A town or area. areaKind RADIUS needs radiusMiles; POLYGON needs geoZoneId (an existing geo-service zone)

        or polygonGeoJson (registered in geo-service as a zone owned by delivery-runs:<slug>). centerLat/centerLng

        is always required: the circle centre, and the drive destination for run economics.'
      properties:
        slug:
          type: string
          example: bastrop-tx
          maxLength: 80
          minLength: 0
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        name:
          type: string
          example: Bastrop
          maxLength: 120
          minLength: 0
        market:
          type: string
          example: US
          maxLength: 16
          minLength: 0
        state:
          type: string
          example: TX
          maxLength: 8
          minLength: 0
        timeZone:
          type: string
          description: IANA time zone; default America/Chicago
          example: America/Chicago
        areaKind:
          type: string
          enum:
          - POLYGON
          - RADIUS
        geoZoneId:
          type: string
          maxLength: 80
          minLength: 0
        polygonGeoJson:
          type: string
          maxLength: 200000
          minLength: 0
        centerLat:
          type: number
          format: double
          example: 30.1105
          maximum: 90
          minimum: -90
        centerLng:
          type: number
          format: double
          example: -97.3153
          maximum: 180
          minimum: -180
        radiusMiles:
          type: number
          format: double
          example: 12
          exclusiveMinimum: 0
          maximum: 100
        originLat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        originLng:
          type: number
          format: double
          maximum: 180
          minimum: -180
        defaultFeeMinor:
          type: integer
          format: int64
          description: Default run fee, minor units (default 799)
          example: 799
          minimum: 0
        currency:
          type: string
          example: USD
          pattern: ^[A-Z]{3}$
        defaultMinOrders:
          type: integer
          format: int32
          example: 10
          maximum: 10000
          minimum: 1
        defaultCapacityOrders:
          type: integer
          format: int32
          maximum: 10000
          minimum: 1
        defaultCapacityPackages:
          type: integer
          format: int32
          maximum: 100000
          minimum: 1
        dropMode:
          type: string
          enum:
          - DOORSTEP
          - PICKUP_POINT
        pickupPoint:
          $ref: '#/components/schemas/PickupPoint'
        whatsappInviteUrl:
          type: string
          example: https://chat.whatsapp.com/AbCdEf123
          maxLength: 500
          minLength: 0
        socialLinks:
          type: object
          additionalProperties:
            type: string
        defaultCutoffPolicy:
          type: string
          enum:
          - EXTEND
          - CANCEL
        defaultExtendDays:
          type: integer
          format: int32
          maximum: 30
          minimum: 1
        active:
          type: boolean
      required:
      - areaKind
      - centerLat
      - centerLng
      - market
      - name
      - slug
