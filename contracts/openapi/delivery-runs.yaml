          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        market:
          type: string
        state:
          type: string
        timeZone:
          type: string
        area:
          $ref: '#/components/schemas/RunArea'
        defaultFeeMinor:
          type: integer
          format: int64
        currency:
          type: string
        dropMode:
          type: string
          enum:
          - DOORSTEP
          - PICKUP_POINT
        pickupPoint:
          $ref: '#/components/schemas/PickupPoint'
        whatsappInviteUrl:
          type: string
        socialLinks:
          type: object
          additionalProperties:
            type: string
    LocationPage:
      type: object
      description: 'Location page data: location, upcoming runs, share links'
      properties:
        location:
          $ref: '#/components/schemas/PublicLocation'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/PublicRun'
        locationUrl:
          type: string
        shareLinks:
          type: object
          additionalProperties:
            type: string
    LocationHistory:
      type: object
      description: 'Per-location history: runs with orders, subscriber growth'
      properties:
        location:
          $ref: '#/components/schemas/Location'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/LocationRunSummary'
        subscribers:
          $ref: '#/components/schemas/SubscriberCounts'
        subscriberGrowth:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyCount'
    LocationRunSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        windowStart:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
        orders:
          type: integer
          format: int32
        packages:
          type: integer
          format: int32
        feeMinor:
          type: integer
          format: int64
        feeRevenueMinor:
          type: integer
          format: int64
        minOrders:
          type: integer
          format: int32
        minimumMet:
          type: boolean
    MonthlyCount:
      type: object
      properties:
        month:
          type: string
          example: 2026-10
        count:
          type: integer
          format: int64
    Problem:
      type: object
      description: RFC 9457 problem details; `code` is a stable delivery-runs.* (or auth.*) code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: delivery-runs.invalid-transition
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
