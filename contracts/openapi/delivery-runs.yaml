          type: boolean
          description: 'Published and not delivered: the window has its own on/off switch'
        switchState:
          type: string
          description: 'ON when live (master AND window AND an area on); else which switch holds it: PAUSED (this window),
            GLOBAL_OFF (master switch), AREA_OFF; NOT_LIVE for drafts and delivered windows'
          enum:
          - 'ON'
          - PAUSED
          - GLOBAL_OFF
          - AREA_OFF
          - NOT_LIVE
