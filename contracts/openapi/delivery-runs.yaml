          type: integer
          format: int32
          description: GSM-7 septets (-1 = needs UCS-2)
        pickupPointId:
          type: string
        pickupWindow:
          type: string
        locationId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
