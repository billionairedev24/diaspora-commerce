openapi: 3.1.0
info:
  title: Delivery Runs API
  description: 'Community delivery runs: locations (towns / areas by geo polygon or radius), scheduled runs with cutoff, minimum
    orders and capacity, run slots for preorders, location subscriptions with per-channel consent, advertorial data and run
    economics.'
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8115
  description: local
- url: https://api.dev.afrotransact.com/delivery-runs
  description: dev
- url: https://api.uat.afrotransact.com/delivery-runs
  description: uat
- url: https://api.afrotransact.com/delivery-runs
  description: prod
security:
- bearer: []
tags:
- name: Pre-orders
  description: 'Staff: pre-order windows, creatives, orders, analytics, exports and late adds (delivery-runs:read to view;
    preorders:manage, preorders:export, preorders:late-add)'
- name: Delivery fees
  description: 'Staff: the delivery fee by delivery method (AfroTransact delivery by distance band, carrier shipping, pickup)
    and its audit trail (delivery-runs:read to view; preorders:manage to change)'
- name: Locations
  description: 'Staff: towns / areas served by delivery runs (delivery-runs:read / :manage)'
- name: Public runs
  description: 'No sign-in: run availability, location pages, advertorial data'
- name: Subscriptions
  description: Run alerts per location with per-channel consent (S262)
- name: Runs
  description: 'Staff: schedule runs and move them through their lifecycle (delivery-runs:manage)'
- name: Service
  description: 'Service clients: orders (run slots), fulfilment (dispatch), notifications (audience)'
- name: Pre-order settings
  description: 'Staff: master switch, fallback, placements, payment setup and coverage areas (delivery-runs:read to view;
    preorders:manage to change)'
- name: Public pre-orders
  description: 'No sign-in: what the storefront shows for a delivery place; service: per-product eligibility for orders-service'
paths:
  /v1/delivery-fees:
    get:
      tags:
      - Delivery fees
      summary: Every delivery fee rule (delivery-runs:read)
      description: 'One rule per method and currency: AFROTRANSACT_DELIVERY (flat fee by distance band, inside covered locations),
        CARRIER (carrier-gateway quote plus handling, beyond coverage) and PICKUP (often 0).'
      operationId: rules
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryFeeRules'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/delivery-fees/changes:
    get:
      tags:
      - Delivery fees
      summary: Audit trail of the delivery fees, newest first (delivery-runs:read)
      description: Every version of every rule (or one method and currency) with the rule before and after, who changed it,
        when and why.
      operationId: changes
      parameters:
      - name: method
        in: query
        required: false
        schema:
          type: string
          enum:
          - AFROTRANSACT_DELIVERY
          - CARRIER
          - PICKUP
      - name: currency
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryFeeChanges'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/delivery-fees/preview:
    post:
      tags:
      - Delivery fees
      summary: What would a customer pay? (delivery-runs:read)
      description: 'The same resolution checkout runs: the window''s own fee first, then the method''s rule. applies is false
        when no rule can price it (no rule, or beyond how far AfroTransact delivers: the order ships by carrier).'
      operationId: preview_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryFeePreviewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryFeeResolution'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/delivery-fees/{method}/{currency}:
    put:
      tags:
      - Delivery fees
      summary: Set the delivery fee of one method and currency (preorders:manage)
      description: Creates the rule or makes its next version. A reason is required (422 delivery-runs.reason-required) and
        is logged with who and when; numbers that are not a valid rule are 422 (bands must start at 0 and not overlap or leave
        a gap, fees are 0 to 100.00). If-Match is the version seen (0 when the rule does not exist yet; 412 delivery-runs.version-mismatch
        when it changed). A save that changes nothing makes no new version. Orders already placed keep the rule version they
        were charged by.
      operationId: replace
      parameters:
      - name: method
        in: path
        required: true
        schema:
          type: string
          enum:
          - AFROTRANSACT_DELIVERY
          - CARRIER
          - PICKUP
      - name: currency
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryFeeRuleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryFeeRule'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/locations:
    get:
      tags:
      - Locations
      summary: List locations, optionally only active or inactive ones (delivery-runs:read)
      operationId: list_2
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Locations
      summary: Create a location (delivery-runs:manage)
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Location'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/locations/{id}:
    get:
      tags:
      - Locations
      summary: Get a location (delivery-runs:read)
      operationId: get_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Location'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - Locations
      summary: Replace a location's details (delivery-runs:manage)
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Location'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Locations
      summary: 'Deactivate a location (never deleted: runs and consent records refer to it)'
      description: delivery-runs:manage. Inactive locations get no new runs and disappear from public reads.
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Location'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/locations/{id}/history:
    get:
      tags:
      - Locations
      summary: 'Per-location history: runs with orders and fees, subscribers and monthly growth'
      description: delivery-runs:read (S265)
      operationId: history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LocationHistory'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/locations/{id}/subscribers/counts:
    get:
      tags:
      - Locations
      summary: Subscriber counts of a location, per channel (delivery-runs:read)
      operationId: counts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubscriberCounts'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/me/run-subscriptions:
    get:
      tags:
      - Subscriptions
      summary: 'Signed-in shopper: my run subscriptions'
      operationId: mine
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Subscriptions
      summary: 'Signed-in shopper: subscribe to a location (or add channels); active at once'
      operationId: subscribe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MySubscriptionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Subscription'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/me/run-subscriptions/{locationId}:
    delete:
      tags:
      - Subscriptions
      summary: 'Signed-in shopper: withdraw channels for a location (no channel = all)'
      operationId: unsubscribeMine
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: channel
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - EMAIL
            - SMS
            - PUSH
            - WHATSAPP
          uniqueItems: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Subscription'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/places/search:
    get:
      tags:
      - Pre-order settings
      summary: Places for the area pickers (delivery-runs:read)
      description: 'q (2+ characters): search countries, regions and cities (8 best). Otherwise browse: every country, a country''s
        regions (country) or every city of a region (country + region), from geo-service''s world gazetteer (built-in list
        when geo is down). regionLabel is what the country calls regions.'
      operationId: places
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
      - name: region
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlaceList'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/preorder-areas:
    get:
      tags:
      - Pre-order settings
      summary: 'Coverage drill-down: countries → regions → areas, 12 per page (delivery-runs:read)'
      description: level COUNTRY (no country), REGION (country) or AREA (country + region). Rows carry areas on of total and
        the published pre-orders targeting them; saved lists every area switched on.
      operationId: areas
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
      - name: region
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 12
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AreaPage'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Pre-order settings
      summary: Add a coverage area, switched on (preorders:manage)
      description: 'key: country/region (every city) or country/region/city; 409 when it exists. Returns the page of the area''s
        region.'
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderAreaRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AreaPage'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Pre-order settings
      summary: Remove a coverage area named by ?key= (preorders:manage)
      operationId: removeByQuery
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AreaPage'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - Pre-order settings
      summary: Switch areas on or off in bulk (preorders:manage)
      description: 'Every area at or under each key: a country code, a region key or one area. Returns the page of the first
        key''s row.'
      operationId: toggle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderAreaToggleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AreaPage'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/preorder-areas/regions/{country}/{region}:
    get:
      tags:
      - Pre-order settings
      summary: One region's coverage for the in-place editor (delivery-runs:read)
      description: The "Every city" row (or null) and every listed city with its switch, row version and the live pre-orders
        selling there. ETag = the region's version (send it back as If-Match).
      operationId: region
      parameters:
      - name: country
        in: path
        required: true
        schema:
          type: string
      - name: region
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RegionCoverageView'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - Pre-order settings
      summary: Edit one region's coverage in place (preorders:manage)
      description: 'Full replacement of the region''s rows: cities listed are added or switched, cities left out are removed,
        everyCity adds, switches or (null) removes the "Every city" row. If-Match with the region''s ETag: 412 delivery-runs.version-mismatch
        when anyone changed the region since. 409 delivery-runs.area-in-use when a removal would leave a live pre-order''s
        place uncovered (switch it off instead). Publishes preorder.areas.changed with the actor.'
      operationId: updateRegion
      parameters:
      - name: country
        in: path
        required: true
        schema:
          type: string
      - name: region
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderRegionCoverageRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RegionCoverageView'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/preorder-areas/{key}:
    delete:
      tags:
      - Pre-order settings
      summary: Remove a coverage area (preorders:manage)
      description: The key is the rest of the path (DELETE /v1/preorder-areas/US/TX/El%20Paso; an encoded US%2FTX%2FEl%20Paso
        works too). Returns the page of the area's region. 409 delivery-runs.area-in-use when a live pre-order sells there
        and nothing else covers it.
      operationId: remove
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AreaPage'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/preorder-settings:
    get:
      tags:
      - Pre-order settings
      summary: Platform pre-order settings incl. payment setup (delivery-runs:read)
      description: ETag carries the version to send back in If-Match.
      operationId: get_2
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PreorderSettings'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - Pre-order settings
      summary: Change settings (preorders:manage)
      description: Null fields keep their value; placements may name only the ones that change. Fees 0–100.00 per currency,
        at least one payment method (422 otherwise). If-Match; publishes preorder.settings.changed.
      operationId: update_2
      parameters:
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderSettingsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PreorderSettings'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/preorders:
    get:
      tags:
      - Pre-orders
      summary: List pre-orders with tab counts (delivery-runs:read)
      description: 'status: all, open, upcoming, closed, draft (tabs) or a status (OPEN, UPCOMING, CLOSED, DELIVERED, DRAFT,
        PAUSED); q searches name, code and areas. counts per tab; enabled = master switch.'
      operationId: list_1
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PreorderWindowPage'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - Pre-orders
      summary: Open a pre-order (DRAFT) (preorders:manage)
      description: The code (e.g. LUB-7) is the first 3 letters of the first target city plus a counter.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderWindowRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PreorderWindow'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - Pre-orders
      summary: Switch several pre-orders on or off (preorders:manage)
      description: '1–100 ids, each switched on its own as PATCH /v1/preorders/{id}: SWITCHED, UNCHANGED or SKIPPED (draft,
        delivered, unknown or failing its publish checks, with the reason).'
      operationId: setActive_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderBulkSwitchRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PreorderBulkSwitchResult'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/preorders/{id}:
    get:
      tags:
      - Pre-orders
      summary: A pre-order with its checks, fees, creatives and counts (delivery-runs:read)
      description: ETag carries the version to send back in If-Match.
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PreorderWindow'
        4XX:
          description: Problem (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - Pre-orders
      summary: Edit a pre-order (preorders:manage)
      description: If-Match with the ETag; 412 delivery-runs.version-mismatch when it changed since. A published pre-order
        must keep passing its checks (422 delivery-runs.preorder-checks-failed); a delivered one is read-only.
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderWindowRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
