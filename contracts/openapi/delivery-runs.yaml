components:
  schemas:
    PickupPoint:
      type: object
      description: Community pickup point of a PICKUP_POINT drop
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        line1:
          type: string
          maxLength: 200
          minLength: 0
        city:
          type: string
          maxLength: 80
          minLength: 0
        state:
          type: string
          maxLength: 8
          minLength: 0
        postalCode:
          type: string
          maxLength: 10
          minLength: 0
        hours:
          type: string
          example: Sat 2–5 PM
          maxLength: 120
          minLength: 0
        notes:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - city
      - hours
      - line1
      - name
    RunRequest:
      type: object
      description: 'Schedule (or reschedule) a run. Null fee, currency, minimum, capacity, drop mode, pickup point, cutoff

        policy and extend days take the location''s defaults. OPEN runs keep their fee, currency, cutoff and drop

        mode (use extend to move the cutoff); capacity can never drop below what is reserved.'
      properties:
        locationId:
          type: string
          format: uuid
          description: Required on create; a run cannot move to another location
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
        opensAt:
          type: string
          format: date-time
          description: ANNOUNCED runs open automatically at this time
        sellerPickupAt:
          type: string
          format: date-time
          description: When the sweep collects from sellers
        feeMinor:
          type: integer
          format: int64
          example: 799
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        minOrders:
          type: integer
          format: int32
          maximum: 10000
          minimum: 1
        capacityOrders:
          type: integer
          format: int32
          maximum: 10000
          minimum: 1
        capacityPackages:
          type: integer
          format: int32
          maximum: 100000
          minimum: 1
        dropMode:
          type: string
          enum:
          - DOORSTEP
          - PICKUP_POINT
        pickupPoint:
          $ref: '#/components/schemas/PickupPoint'
        cutoffPolicy:
          type: string
          enum:
          - EXTEND
          - CANCEL
        extendDays:
          type: integer
          format: int32
          maximum: 30
          minimum: 1
      required:
      - cutoffAt
      - windowEnd
      - windowStart
    RouteEstimate:
      type: object
      properties:
        roadMiles:
          type: number
          format: double
        driveMinutes:
          type: number
          format: double
        method:
          type: string
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        status:
          type: string
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
        originalCutoffAt:
          type: string
          format: date-time
        opensAt:
          type: string
          format: date-time
        sellerPickupAt:
          type: string
          format: date-time
        feeMinor:
          type: integer
          format: int64
        currency:
          type: string
        minOrders:
          type: integer
          format: int32
        capacityOrders:
          type: integer
          format: int32
        capacityPackages:
          type: integer
          format: int32
        dropMode:
          type: string
          enum:
          - DOORSTEP
          - PICKUP_POINT
        pickupPoint:
          $ref: '#/components/schemas/PickupPoint'
        cutoffPolicy:
          type: string
          enum:
          - EXTEND
          - CANCEL
        extendDays:
          type: integer
          format: int32
        extensions:
          type: integer
          format: int32
        reservedOrders:
          type: integer
          format: int32
        reservedPackages:
          type: integer
          format: int32
        ordersLeft:
          type: integer
          format: int32
        minimumMet:
          type: boolean
        cancelReason:
          type: string
        estimate:
          $ref: '#/components/schemas/RouteEstimate'
        breakEvenOrders:
          type: integer
          format: int32
          description: Fewest orders covering the estimated cost (create / get only)
        milestones:
          $ref: '#/components/schemas/RunMilestones'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    RunMilestones:
      type: object
      properties:
        announcedAt:
          type: string
          format: date-time
        openedAt:
          type: string
          format: date-time
        cutOffAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        collectingAt:
          type: string
          format: date-time
        outForDeliveryAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
    PreorderWindowRequest:
      type: object
      description: 'Create (draft) or edit a pre-order window. Drafts may be incomplete; a published window must keep passing

        its publish checks. Fees are minor units of the window''s currency (the first target''s country); null fee

        overrides use the platform payment settings.'
      properties:
        name:
          type: string
          example: 'Lubbock Pre-order #7'
          maxLength: 120
          minLength: 0
        targets:
          type: array
          description: country/region or country/region/city
          example:
          - US/TX/Lubbock
          items:
            type: string
          maxItems: 50
          minItems: 0
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
        deliversOn:
          type: string
          format: date
