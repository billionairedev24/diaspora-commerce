        id:
          type: string
          format: uuid
        kind:
          type: string
        brand:
          type: string
        last4:
          type: string
        expMonth:
          type: integer
          format: int32
        expYear:
          type: integer
          format: int32
        bankName:
          type: string
        accountType:
          type: string
        verified:
          type: boolean
        receivesPayouts:
          type: boolean
        isDefault:
          type: boolean
        label:
          type: string
    PendingPlanChange:
      type: object
      description: Downgrade or cadence change applied at renewal
      properties:
        planCode:
          type: string
        planName:
          type: string
        cadence:
          type: string
        effectiveAt:
          type: string
          format: date-time
    PlanPrice:
      type: object
      description: Price of a plan for one cadence; amounts in cents (USD)
      properties:
        cadence:
          type: string
        months:
          type: integer
          format: int32
        totalCents:
          type: integer
          format: int64
        perMonthCents:
          type: integer
          format: int64
        savingCents:
          type: integer
          format: int64
        perMonthLabel:
          type: string
        billedLabel:
          type: string
        savingLabel:
          type: string
        firstCharge:
          $ref: '#/components/schemas/FirstCharge'
    ChangePlanRequest:
      type: object
      properties:
        planCode:
          type: string
          minLength: 1
        cadence:
          type: string
          enum:
          - MONTHLY
          - QUARTERLY
          - ANNUAL
      required:
      - planCode
    ChangePlanResponse:
      type: object
      description: 'applied: IMMEDIATE_UPGRADE (prorated now), AT_RENEWAL (downgrade or cadence change) or NO_CHANGE'
      properties:
        applied:
          type: string
        billing:
          $ref: '#/components/schemas/Billing'
    AddPaymentMethodRequest:
      type: object
