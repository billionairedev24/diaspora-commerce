          - US_BANK_ACCOUNT
          minLength: 1
        brand:
          type: string
        last4:
          type: string
        expMonth:
          type: integer
          format: int32
        expYear:
          type: integer
          format: int32
        bankName:
          type: string
        accountType:
          type: string
        makeDefault:
          type: boolean
      required:
      - kind
      - stripePaymentMethodId
    RequirementAnswer:
