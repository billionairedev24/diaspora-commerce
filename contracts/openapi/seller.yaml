                $ref: '#/components/schemas/ShipFromAddress'
  /v1/orgs/{orgId}/ship-from-addresses/{id}:
    put:
      tags:
      - Ship-from addresses
      summary: Change a ship-from address
      description: 'Optimistic: send the version you edited; 409 seller.concurrent-update when it changed meanwhile.'
      operationId: updateShipFrom
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipFromAddressRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ShipFromAddress'
    delete:
      tags:
      - Ship-from addresses
      summary: Delete an address; returns the remaining ones (a new default is chosen when needed)
      operationId: deleteShipFrom
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipFromAddress'
  /v1/orgs/{orgId}/ship-from-addresses/{id}/afrotransact-pickup:
    put:
      tags:
      - Ship-from addresses
      summary: Turn AfroTransact Delivery pickup on or off for a location (S255)
      description: Enabling needs an approved organisation (409 seller.org-not-approved), at least one pickup window (422
        seller.invalid-pickup-hours), a street-level geocoded position (422 seller.ship-from-not-geocoded) and a location
        inside an active AfroTransact DELIVERY zone or within PICKUP_MAX_RADIUS_MILES of one (422 seller.pickup-outside-delivery-area);
        503 seller.geo-unavailable when geo-service is down. Publishes seller.pickup_location.updated. Offers with fulfilment
        AFROTRANSACT_DELIVERY reference the location by id.
      operationId: pickupShipFrom
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AfrotransactPickupRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ShipFromAddress'
  /v1/orgs/{orgId}/ship-from-addresses/{id}/default:
    post:
      tags:
      - Ship-from addresses
      summary: Make an address the default; returns every address
      operationId: defaultShipFrom
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipFromAddress'
  /v1/orgs/{orgId}/stripe/account-session:
    post:
      tags:
      - Stripe compliance
      summary: Account Session for Stripe's embedded components (owner / finance)
      description: 'Seller accounts are Stripe-collected: what Stripe needs (identity, tax ID, documents, terms) and the payout
        bank account are entered in Stripe''s embedded components — account onboarding, account management, notification banner
        — never through AfroTransact. Returns client_secret for Connect.js. Staff can''t open one.'
      operationId: orgAccountSession
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountSession'
  /v1/orgs/{orgId}/suspend:
    post:
      tags:
      - Enforcement
      summary: Suspend an approved organisation — sellers:enforce
      description: 'Adds a suspension hold: publishes seller.listings.hidden and seller.payouts.paused (reason SUSPENDED)
        and seller.org.updated (status SUSPENDED). Idempotent: an organisation that is already suspended is returned unchanged.'
      operationId: suspendOrg
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendOrgRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrgEnforcement'
  /v1/plans:
    get:
      tags:
      - Plans & billing
      summary: Plans with monthly, quarterly (5% off) and annual (2 months free) prices (public)
      operationId: listPlans
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
  /v1/review-reason-codes:
    get:
      tags:
      - Application review
      summary: Review reason codes
      operationId: listReasonCodes
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReasonCode'
  /v1/ship-from-locations/{id}:
    get:
      tags:
      - Ship-from addresses
      summary: 'One ship-from location by id (services: sellers:ship-from.read)'
      description: For offers-service (an AFROTRANSACT_DELIVERY offer must reference a location with pickup enabled), orders-service
        (checkout distance from the location's position) and fulfilment (pickup stop address). Staff with seller:ship-from
        and the organisation's members can read it too.
      operationId: shipFromLocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ShipFromAddress'
  /v1/webhooks/stripe-billing:
    post:
      tags:
      - Stripe webhooks
      summary: 'Billing events: invoice.created/finalized/paid/payment_failed/voided/deleted, credit_note.created, customer.subscription.created/updated/deleted'
      description: 'invoice.created claims a renewal invoice of an organisation that pays its plan from its sales and collects
        it at once (S298). 503 while that collection failed for a transient reason: Stripe redelivers and keeps the invoice
        a draft until we acknowledge it.'
      operationId: stripeBillingWebhook
      parameters:
      - name: Stripe-Signature
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Applied (or a duplicate)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WebhookResult'
        '503':
          description: 'Retry later: paying the invoice from sales is still pending'
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WebhookResult'
  /v1/webhooks/stripe-connect:
    post:
      tags:
      - Stripe webhooks
      summary: 'Connect events: account.updated, capability.updated, person.created/updated, account.external_account.created/updated/deleted,
        payout.failed, account.application.deauthorized'
      operationId: stripeConnectWebhook
      parameters:
      - name: Stripe-Signature
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WebhookResult'
components:
  schemas:
    ShipFromAddressRequest:
      type: object
      description: A ship-from address; US addresses need a state code and ZIP
      properties:
        label:
          type: string
          example: Houston warehouse
          maxLength: 60
          minLength: 0
        name:
          type: string
          example: Ade Okafor
          maxLength: 120
          minLength: 0
        company:
          type: string
          maxLength: 120
          minLength: 0
        phone:
          type: string
          example: +1 713 555 0100
          maxLength: 40
          minLength: 0
        line1:
          type: string
          example: 4521 Main St
          maxLength: 120
          minLength: 0
        line2:
          type: string
          maxLength: 120
          minLength: 0
        city:
          type: string
          example: Houston
          maxLength: 80
          minLength: 0
        state:
          type: string
          example: TX
          maxLength: 40
          minLength: 0
        postalCode:
          type: string
          example: '77002'
          maxLength: 12
          minLength: 0
        country:
          type: string
          default: US
          example: US
          maxLength: 2
          minLength: 0
        makeDefault:
          type: boolean
          description: Also make it the default
        version:
          type: integer
          format: int64
          description: Version being edited (updates); 409 when it changed
      required:
      - city
      - line1
      - name
      - postalCode
      - state
    AfrotransactPickup:
      type: object
      description: 'AfroTransact Delivery from this location: the seller packs, the nearest AfroTransact driver collects during
        the pickup hours'
      properties:
        enabled:
          type: boolean
        hours:
          type: array
          items:
            $ref: '#/components/schemas/PickupWindow'
        zoneName:
          type: string
          description: Delivery zone covering (or nearest to) the location
        enabledAt:
          type: string
          format: date-time
    GeoPosition:
      type: object
      description: Where the address is (geo-service geocoding)
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        precision:
          type: string
          enum:
          - ADDRESS
          - ZIP
          - POINT
        geocodedAt:
          type: string
          format: date-time
    PickupWindow:
      type: object
      description: 'One pickup window: day of the week and 24-hour local times (HH:MM, opens before closes)'
      properties:
        day:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
        opens:
          type: string
          description: Opening time, HH:MM
          minLength: 1
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        closes:
          type: string
          description: Closing time, HH:MM
          minLength: 1
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      required:
      - closes
      - day
      - opens
    BusinessPageSettings:
      type: object
      properties:
        orgId:
          type: string
        slug:
          type: string
          description: null until the page is first made
        kind:
          type: string
        name:
          type: string
        description:
          type: string
        brandColor:
          type: string
        logoUrl:
          type: string
        contactEmail:
          type: string
        approved:
          type: boolean
    BusinessPageSettingsRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 2000
        brandColor:
          type: string
          description: '#rrggbb; blank clears it'
          maxLength: 7
        logoUrl:
          type: string
          description: https URL of an uploaded logo; blank removes it
          maxLength: 2048
    ShipFromAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        label:
          type: string
        name:
          type: string
        company:
          type: string
        phone:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        position:
          $ref: '#/components/schemas/GeoPosition'
          description: Geocoded position; null until geo-service located it
        afrotransactPickup:
          $ref: '#/components/schemas/AfrotransactPickup'
    AfrotransactPickupRequest:
      type: object
      description: Turn AfroTransact Delivery pickup on or off for a ship-from location (S255)
      properties:
        enabled:
          type: boolean
        hours:
          type: array
          description: Pickup windows; at least one to enable
          items:
            $ref: '#/components/schemas/PickupWindow'
          maxItems: 14
          minItems: 0
        version:
          type: integer
          format: int64
          description: Version being edited; 409 when it changed
      required:
      - enabled
    PlanFeeCollectionRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
          - EARNINGS_FIRST
          - CARD
    PlanFeeCollection:
      type: object
      description: 'How the organisation pays its plan: EARNINGS_FIRST takes each invoice from pending earnings and charges
        the card only for the rest; CARD always charges the card'
      properties:
        orgId:
          type: string
        available:
          type: boolean
          description: 'The kill switch is on: the choice is offered and honoured'
        mode:
          type: string
          enum:
          - EARNINGS_FIRST
          - CARD
        effective:
          type: string
          description: What the next invoice uses (CARD while the kill switch is off)
          enum:
          - EARNINGS_FIRST
          - CARD
        source:
          type: string
          enum:
          - DEFAULT
          - ONBOARDING
          - SELLER
          - STAFF
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
        platformDefault:
          type: string
          enum:
          - EARNINGS_FIRST
          - CARD
        appliesFromInvoiceAt:
          type: string
          format: date-time
          description: A change applies from the invoice of this date (next renewal); null without a paid plan
        appliesFromLabel:
          type: string
          description: e.g. Applies from your next invoice, on Nov 9, 2026
        inProgressInvoiceId:
          type: string
          description: An invoice being collected now keeps the choice it was created with
        history:
          type: array
          items:
            $ref: '#/components/schemas/PlanFeeCollectionChange'
    PlanFeeCollectionChange:
      type: object
      description: One change of an organisation's choice
      properties:
        id:
          type: string
          format: uuid
        previous:
          type: string
          enum:
          - EARNINGS_FIRST
          - CARD
        mode:
          type: string
          enum:
          - EARNINGS_FIRST
          - CARD
        source:
          type: string
          enum:
          - ONBOARDING
          - SELLER
          - STAFF
        actorId:
          type: string
        reasonCode:
          type: string
          description: 'Staff overrides: billing reason code'
        note:
          type: string
        appliesFrom:
          type: string
          format: date-time
          description: The next invoice when it changed
        createdAt:
          type: string
          format: date-time
    PlanFeeCollectionOverrideRequest:
      type: object
      description: Staff override, audited with a reason code (OTHER needs a note)
      properties:
        mode:
          type: string
          enum:
          - EARNINGS_FIRST
          - CARD
        reasonCode:
          type: string
        note:
          type: string
    TrialCampaignRequest:
      type: object
      description: A promo code, a sign-up window, or both
      properties:
        name:
          type: string
        promoCode:
          type: string
        trialDays:
          type: integer
          format: int32
        signupFrom:
          type: string
          format: date-time
        signupTo:
          type: string
          format: date-time
        kind:
          type: string
          enum:
          - SELLER
          - PROVIDER
        eligiblePlans:
          type: array
          items:
            type: string
        maxRedemptions:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - ENDED
        expectedVersion:
          type: integer
          format: int64
    TrialCampaign:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        promoCode:
          type: string
        trialDays:
          type: integer
          format: int32
        signupFrom:
          type: string
          format: date-time
        signupTo:
          type: string
          format: date-time
        kind:
          type: string
        eligiblePlans:
          type: array
          items:
            type: string
        maxRedemptions:
          type: integer
          format: int32
        redemptions:
          type: integer
          format: int32
        status:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    BillingSettingsRequest:
      type: object
      properties:
        planFeeCollectionDefault:
          type: string
          enum:
          - EARNINGS_FIRST
          - CARD
    BillingSettings:
      type: object
      description: Platform billing settings (staff console › Plans & billing)
      properties:
        earningsCollectionEnabled:
          type: boolean
          description: The kill switch COLLECT_PLAN_FEES_FROM_EARNINGS
        planFeeCollectionDefault:
          type: string
          description: How new sellers pay their plan unless they choose
          enum:
          - EARNINGS_FIRST
          - CARD
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    RewardRuleRequest:
      type: object
      description: Reach threshold of metric (optionally in the last windowDays days and/or within withinDaysOfApproval days
        of approval) and get the reward, once per seller. LESS_THAN rewards staying under the threshold in the first withinDaysOfApproval
        days (from approval or the subscription's start), checked once, checkLeadHours before the window or the trial ends
      properties:
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum:
          - SELLER
          - PROVIDER
        metric:
          type: string
          enum:
          - GROSS_SALES
          - ACTIVE_LISTINGS
          - COMPLETED_ORDERS
          - COMPLETED_BOOKINGS
          - DAYS_SINCE_APPROVAL
        threshold:
          type: integer
          format: int64
          description: Cents for GROSS_SALES, a count otherwise
        windowDays:
          type: integer
          format: int32
        withinDaysOfApproval:
          type: integer
          format: int32
          description: The first N days from windowAnchor (the window of a rule checked at window end)
        comparison:
          type: string
          description: Default AT_LEAST
          enum:
          - AT_LEAST
          - LESS_THAN
        windowAnchor:
          type: string
          description: Default APPROVAL
          enum:
          - APPROVAL
          - SUBSCRIPTION_START
        checkAtWindowEnd:
          type: boolean
          description: 'AT_LEAST: decide once when the window closes (LESS_THAN always does)'
        checkLeadHours:
          type: integer
          format: int32
          description: Hours before the window (or the trial) ends that the check runs; default 24
        rewardType:
          type: string
          enum:
          - FREE_DAYS
          - CREDIT
          - PERCENT_OFF
        freeDays:
          type: integer
          format: int32
        creditCents:
          type: integer
          format: int64
        percentOff:
          type: number
        durationInvoices:
          type: integer
          format: int32
        eligiblePlans:
          type: array
          items:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        maxGrants:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - ENDED
        expectedVersion:
          type: integer
          format: int64
        ruleId:
          type: string
          description: 'Preview only: marks who already got this rule'
    RewardRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        kind:
          type: string
        metric:
          type: string
        threshold:
          type: integer
          format: int64
        windowDays:
          type: integer
          format: int32
        withinDaysOfApproval:
          type: integer
          format: int32
        comparison:
          type: string
          enum:
          - AT_LEAST
          - LESS_THAN
        windowAnchor:
          type: string
          enum:
          - APPROVAL
          - SUBSCRIPTION_START
        checkAtWindowEnd:
          type: boolean
          description: Decided once when the window closes (always for LESS_THAN)
        checkLeadHours:
          type: integer
          format: int32
        rewardType:
          type: string
        freeDays:
          type: integer
          format: int32
        creditCents:
          type: integer
          format: int64
        percentOff:
          type: number
        durationInvoices:
          type: integer
          format: int32
        eligiblePlans:
          type: array
          items:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        maxGrants:
          type: integer
          format: int32
        grantsCount:
          type: integer
          format: int32
        rewardLabel:
          type: string
        conditionLabel:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    UpdatePlanRequest:
      type: object
      description: Metadata only; expectedVersion is the plan's rowVersion
      properties:
        name:
          type: string
        tagline:
          type: string
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties:
            type: string
        visibility:
          type: string
          enum:
          - PUBLIC
          - HIDDEN
          - INVITE_ONLY
        sortOrder:
          type: integer
          format: int32
        expectedVersion:
          type: integer
          format: int64
    PlanAdmin:
      type: object
      description: 'A plan for staff: metadata, versions with Stripe prices, invites'
      properties:
        code:
          type: string
        kind:
          type: string
        name:
          type: string
        tagline:
          type: string
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties:
            type: string
        visibility:
          type: string
        status:
          type: string
        sortOrder:
          type: integer
          format: int32
        currentVersion:
          type: integer
          format: int32
        monthlyCents:
          type: integer
          format: int64
        quarterlyCents:
          type: integer
          format: int64
        annualCents:
          type: integer
          format: int64
        trialDays:
          type: integer
          format: int32
        rowVersion:
          type: integer
          format: int64
        stripeProductId:
          type: string
        subscribers:
          type: integer
          format: int64
        invites:
          type: array
          items:
            type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersion'
    PlanVersion:
      type: object
      properties:
        version:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - SUPERSEDED
        trialDays:
          type: integer
          format: int32
        note:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        subscribers:
          type: integer
          format: int64
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersionPrice'
    PlanVersionPrice:
      type: object
      description: One cadence of a version and its Stripe Price
      properties:
        cadence:
          type: string
        amountCents:
          type: integer
          format: int64
        lookupKey:
          type: string
        stripePriceId:
          type: string
        syncedAt:
          type: string
          format: date-time
        syncError:
          type: string
    PlanInvitesRequest:
      type: object
      properties:
        orgIds:
          type: array
          items:
