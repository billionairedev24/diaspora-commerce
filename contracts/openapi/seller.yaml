openapi: 3.1.0
info:
  title: Seller API
  description: 'Seller and service-provider organisations: resumable onboarding applications (entity-aware business details,
    beneficial owners, Stripe Connect embedded verification, payouts, plan, permits and licences), the two-step staff review,
    Stripe Connect compliance sync (Account health, reminders, payout holds) and plans & billing on Stripe Billing.'
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8106
  description: local
- url: https://api.dev.afrotransact.com/seller
  description: dev
- url: https://api.uat.afrotransact.com/seller
  description: uat
- url: https://api.afrotransact.com/seller
  description: prod
security:
- bearer: []
tags:
- name: Billing adjustments
  description: Staff per-seller billing panel and audited adjustments (credits, free days, waived invoices, trial overrides)
    with reason codes; billing:adjust to change. The Idempotency-Key header makes a retried request return the first grant.
- name: Plan fee collection
  description: 'How each organisation pays its plan (S298): from its sales first (EARNINGS_FIRST) or always by card (CARD).
    Changes apply from the next invoice.'
- name: Ship-from addresses
  description: Where a seller ships its own orders from (label purchase, rates, AfroTransact Delivery pickup). Members read;
    owner, admin and fulfilment members change them. Addresses are geocoded with geo-service when saved (position).
- name: Plan catalogue
  description: AfroTransact owns plans, versions (prices per cadence and the default trial) and trial campaigns; Stripe only
    executes the charges. Staff with plans:manage change them; plans:manage, seller:billing or billing:adjust read them.
- name: Application review
  description: 'Two-step staff review. Step 1 (applications:review): approve → AWAITING_FINAL_APPROVAL, flag → FLAGGED, request
    info → INFO_REQUESTED. Step 2 (applications:approve, a different person): final approve → APPROVED (seller.org.approved),
    send back → PENDING_REVIEW, reject.'
- name: Plans & billing
  description: Plan catalogue (public) and each organisation's Stripe Billing subscription. Owner and finance can view; only
    the owner changes billing.
- name: Stripe compliance
  description: Account health for sellers (owner / finance) and the staff compliance console (compliance:remind, compliance:hold).
    Stripe is the source of truth and collects every answer in its embedded components; Account health is read-only.
- name: Stripe webhooks
  description: Signature-verified (Stripe-Signature) and de-duplicated by event id
- name: Onboarding
  description: 'The applicant''s resumable application: start (prefilled from the signed-in account), autosave each step,
    Stripe verification, submit. No back-office access until final approval.'
- name: Enforcement
  description: 'Trust and Safety suspension of an organisation (sellers:enforce; staff or the trust-ops-service client). Separate
    from Stripe compliance payout holds: reinstating releases only the suspension hold.'
- name: Organisations
  description: Seller and provider organisations
- name: Metered usage
  description: FBA storage, sponsored-products spend and AI credits billed on Stripe Billing meters (S206)
- name: Rewards
  description: Reward rules (staff with plans:manage), the grants log, and the rewards an organisation can earn (owner / finance)
paths:
  /v1/applications:
    get:
      tags:
      - Application review
      summary: 'Review queue (default: pending review, flagged and awaiting final approval)'
      operationId: reviewQueue
      parameters:
      - name: status
        in: query
        description: Comma-separated statuses
        required: false
        schema:
          type: string
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApplicationQueue'
  /v1/applications/me:
    get:
      tags:
      - Onboarding
      summary: My draft with its current step and progress (resume after Save & sign out)
      operationId: myApplication
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Application'
    post:
      tags:
      - Onboarding
      summary: Start or resume my application
      description: Creates a DRAFT organisation (caller = owner) and application; name, email and phone are prefilled from
        the token's identity claims (phone, store name and business address from prefill when given) and listed in prefilledFields.
        Returns 200 with the existing draft when one exists (resume).
      operationId: startApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartApplicationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Application'
        '200':
          description: Existing application resumed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Application'
  /v1/applications/me/steps/{step}:
    put:
      tags:
      - Onboarding
      summary: Autosave one step
      description: 'Steps: business, business-details, owners, plan, catalog-compliance, review. The body is the step''s data;
        only the fields present are validated (submit validates everything). stripe-verification and payouts are completed
        in Stripe''s embedded components (Stripe collects the payout bank account); saving them answers 422 seller.step-managed-by-stripe.'
      operationId: saveStep
      parameters:
      - name: step
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/BusinessStep'
              - $ref: '#/components/schemas/BusinessDetailsStep'
              - $ref: '#/components/schemas/OwnersStep'
              - $ref: '#/components/schemas/PlanStep'
              - $ref: '#/components/schemas/CatalogComplianceStep'
        required: true
      responses:
        '422':
          description: seller.invalid-application (fieldErrors), seller.country-not-live, seller.step-not-applicable or seller.step-managed-by-stripe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/applications/me/stripe/account-session:
    post:
      tags:
      - Onboarding
      summary: Account Session for Stripe's embedded onboarding / account-management components
      description: Creates the platform-controlled connected account on first use (no Stripe dashboard, manual payouts). Returns
        client_secret for Connect.js.
      operationId: createAccountSession
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccountSession'
  /v1/applications/me/stripe/refresh:
    post:
      tags:
      - Onboarding
      summary: Refresh Stripe verification results (identity, IRS name/TIN match, requirements)
      operationId: refreshStripeVerification
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Application'
  /v1/applications/me/submit:
    post:
      tags:
      - Onboarding
      summary: Submit (or resubmit after a request for info)
      description: Validates every step; 422 seller.application-incomplete lists every failing field.
      operationId: submitApplication
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Application'
  /v1/applications/{id}:
    get:
      tags:
      - Application review
      summary: Full application dossier
      description: SSN/EIN shown as last 4 and dates of birth as year only, unless the reviewer has applications:pii (the
        view is logged).
      operationId: applicationDetail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Application'
  /v1/applications/{id}/decision:
    post:
      tags:
      - Application review
      summary: 'Step 2 — final decision: FINAL_APPROVE, SEND_BACK or REJECT (not by the reviewer)'
      description: 'Idempotent: a retry with the same Idempotency-Key, or the same person repeating the decision that put
        the application in its current state, answers 200 with the current application and changes nothing (no timeline entry,
        no events, no email). A decision that is no longer possible answers 409: seller.already-decided / seller.already-reviewed
        say what was decided, by whom and when (properties decision, decidedBy, decidedAt); seller.idempotency-key-reused
        when the key named a different decision.'
      operationId: finalDecision
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Optional, 8–128 characters; the same key on every retry of one decision
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Application'
  /v1/applications/{id}/documents/{assetId}:
    get:
      tags:
      - Application review
      summary: Open an uploaded document (logged in the access log)
      operationId: viewDocument
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentView'
  /v1/applications/{id}/review:
    post:
      tags:
      - Application review
      summary: 'Step 1 — reviewer decision: APPROVE, FLAG (failedChecks) or REQUEST_INFO (requestedItems)'
      description: 'Idempotent: a retry with the same Idempotency-Key, or the same person repeating the decision that put
        the application in its current state, answers 200 with the current application and changes nothing (no timeline entry,
        no events, no email). A decision that is no longer possible answers 409: seller.already-decided / seller.already-reviewed
        say what was decided, by whom and when (properties decision, decidedBy, decidedAt); seller.idempotency-key-reused
        when the key named a different decision.'
      operationId: reviewApplication
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Optional, 8–128 characters; the same key on every retry of one decision
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Application'
  /v1/billing/grants:
    get:
      tags:
      - Rewards
      summary: 'Grants log: rewards and staff adjustments, newest first (staff)'
      operationId: listGrants
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: source
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: ruleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BillingGrantPage'
  /v1/billing/plans:
    get:
      tags:
      - Plan catalogue
      summary: Every plan with its versions, Stripe prices and subscribers (staff)
      operationId: listAdminPlans
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanAdmin'
    post:
      tags:
      - Plan catalogue
      summary: Create a plan (draft, with version 1 as a draft)
      operationId: createPlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanAdmin'
  /v1/billing/plans/{code}:
    get:
      tags:
      - Plan catalogue
      summary: One plan (staff)
      operationId: getAdminPlan
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanAdmin'
    put:
      tags:
      - Plan catalogue
      summary: Edit a plan's name, tagline, features, limits, visibility and sort
      description: No new version. 409 seller.concurrent-update when expectedVersion is stale.
      operationId: updatePlan
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanAdmin'
  /v1/billing/plans/{code}/draft:
    put:
      tags:
      - Plan catalogue
      summary: Save the draft version's prices and trial
      description: Creates the next version when prices or trial differ from the current one; subscribers stay on their version
        until migrated.
      operationId: savePlanDraft
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanPrices'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanAdmin'
  /v1/billing/plans/{code}/invites:
    put:
      tags:
      - Plan catalogue
      summary: Organisations invited to an invite-only plan
      operationId: setPlanInvites
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInvitesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanAdmin'
  /v1/billing/plans/{code}/migration:
    get:
      tags:
      - Plan catalogue
      summary: Subscribers on older versions and what the current version will charge them
      operationId: previewPlanMigration
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanMigrationPreview'
    post:
      tags:
      - Plan catalogue
      summary: Migrate subscribers to the current version (from their next renewal, no proration)
      operationId: migratePlan
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanMigrationRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanMigrationResult'
  /v1/billing/plans/{code}/publish:
    post:
      tags:
      - Plan catalogue
      summary: Publish the draft version and sync it to Stripe (a new Price per cadence; the old one is archived)
      operationId: publishPlan
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanAdmin'
  /v1/billing/plans/{code}/retire:
    post:
      tags:
      - Plan catalogue
      summary: 'Retire a plan: no new subscribers; existing ones keep it'
      operationId: retirePlan
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanAdmin'
  /v1/billing/reason-codes:
    get:
      tags:
      - Rewards
      summary: Reason codes for staff adjustments
      operationId: listBillingReasonCodes
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingReasonCode'
  /v1/billing/reward-rules:
    get:
      tags:
      - Rewards
      summary: Reward rules (staff)
      operationId: listRewardRules
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RewardRule'
    post:
      tags:
      - Rewards
      summary: Create a reward rule (DRAFT unless a status is given)
      operationId: createRewardRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRuleRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RewardRule'
  /v1/billing/reward-rules/preview:
    post:
      tags:
      - Rewards
      summary: Who qualifies now under a rule (unsaved or edited; nothing is granted)
      operationId: previewRewardRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRuleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RewardPreview'
  /v1/billing/reward-rules/{id}:
    get:
      tags:
      - Rewards
      summary: One reward rule (staff)
      operationId: getRewardRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RewardRule'
    put:
      tags:
      - Rewards
      summary: Edit a reward rule (expectedVersion required)
      operationId: updateRewardRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRuleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RewardRule'
  /v1/billing/reward-rules/{id}/status:
    post:
      tags:
      - Rewards
      summary: Activate, pause or end a reward rule
      operationId: setRewardRuleStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RewardRule'
  /v1/billing/settings:
    get:
      tags:
      - Plan fee collection
      summary: 'Platform billing settings: the kill switch and the default for new sellers (billing staff)'
      operationId: billingSettings
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BillingSettings'
    put:
      tags:
      - Plan fee collection
      summary: Set how new sellers pay their plan unless they choose (plans:manage)
      operationId: updateBillingSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingSettingsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BillingSettings'
  /v1/billing/stripe-sync:
    get:
      tags:
      - Plan catalogue
      summary: Drift between our plan versions and Stripe (nothing changes)
      operationId: planSyncReport
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanSyncReport'
    post:
      tags:
      - Plan catalogue
      summary: 'Sync with Stripe: adopt matching Prices, create missing ones, replace drifted ones'
      operationId: syncPlans
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlanSyncReport'
  /v1/billing/trial-campaigns:
    get:
      tags:
      - Plan catalogue
      summary: Trial campaigns (promo codes and sign-up windows)
      operationId: listTrialCampaigns
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrialCampaign'
    post:
      tags:
      - Plan catalogue
      summary: Create a trial campaign
      operationId: createTrialCampaign
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialCampaignRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TrialCampaign'
  /v1/billing/trial-campaigns/{id}:
    put:
      tags:
      - Plan catalogue
      summary: Edit a trial campaign (expectedVersion required)
      operationId: updateTrialCampaign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialCampaignRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TrialCampaign'
  /v1/billing/trial-campaigns/{id}/status:
    post:
      tags:
      - Plan catalogue
      summary: Activate, pause or end a trial campaign
      operationId: setTrialCampaignStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TrialCampaign'
  /v1/billing/usage/runs:
    get:
      tags:
      - Metered usage
      summary: Recent metering runs (staff with billing:usage)
      operationId: runs
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageRun'
    post:
      tags:
      - Metered usage
      summary: Re-run metering for a period (staff with billing:usage)
      description: Re-reads every source for [from, to] (at most 93 days, ending today at the latest), stores each day's usage
        and sends Stripe meter events for the differences only. Idempotent; 409 seller.usage-run-in-progress while another
        run holds the lease.
      operationId: run
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageRunRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UsageRun'
  /v1/compliance/accounts:
    get:
      tags:
      - Stripe compliance
      summary: 'Staff: connected accounts (filter by status or open items)'
      operationId: complianceAccounts
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: openOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountHealth'
  /v1/compliance/accounts/{accountId}:
    get:
      tags:
      - Stripe compliance
      summary: 'Staff: one account with requirements, Stripe updates and messages sent'
      operationId: complianceAccount
      parameters:
      - name: accountId
        in: path
        required: true
