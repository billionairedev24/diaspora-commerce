openapi: 3.1.0
info:
  title: Payments API
  description: Stripe PaymentIntents with manual capture per shipment, line-level refunds, the immutable double-entry ledger,
    multi-seller payment splits and fee schedules, settlement holds and Connect transfers, payouts on request, chargebacks,
    the signed Stripe webhook inbox, daily reconciliation and shoppers' saved payment methods.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8105
  description: local
- url: https://api.dev.afrotransact.com/payments
  description: dev
- url: https://api.uat.afrotransact.com/payments
  description: uat
- url: https://api.afrotransact.com/payments
  description: prod
security:
- bearer: []
tags:
- name: Settlement & payouts
  description: Settlement hold after delivery, Connect transfers and payouts on request
- name: Finance
  description: 'Staff views and configuration: payment split, fees & commissions, ledger, reconciliation, connected accounts'
- name: Payments
  description: Order payment lifecycle for the orders saga (SERVICE principals with payments:service; Idempotency-Key on every
    write)
- name: Supplier payments
  description: AfroTransact Retail (merchant of record) supplier payables released by retail-service after the three-way match,
    scheduled by payment terms and paid by Finance from the operating bank account (never through Stripe Connect)
- name: Stripe webhooks
  description: Signed, idempotent inbox for Stripe events
- name: Saved payment methods
  description: The signed-in shopper's wallet (called by gateway-bff with the customer's token)
paths:
  /v1/connected-accounts/{orgId}:
    get:
      tags:
      - Finance
      summary: Stripe Connect account of an organisation
      operationId: account
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ConnectedAccountResponse'
    put:
      tags:
      - Finance
      summary: Register the Stripe Connect account of an organisation (seller-service or Finance)
      operationId: registerAccount
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectedAccountRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ConnectedAccountResponse'
  /v1/customers/me/ephemeral-keys:
    post:
      tags:
      - Saved payment methods
      summary: 'PaymentSheet: ephemeral key for the shopper''s Stripe Customer (shopper token)'
      description: Returns {customerId, ephemeralKeySecret, expiresAt} for the Stripe Customer linked to the signed-in shopper,
        creating the customer on first use. gateway-bff's POST /v1/account/payment-sheet calls it with the shopper's token.
        Optional Idempotency-Key.
      operationId: ephemeralKey
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EphemeralKeyRequest'
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EphemeralKey'
  /v1/customers/me/payment-methods:
    get:
      tags:
      - Saved payment methods
      summary: List saved payment methods (display data only, never full numbers)
      operationId: list
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethodResponse'
  /v1/customers/me/payment-methods/{id}:
    delete:
      tags:
      - Saved payment methods
      summary: Remove (detach) a saved method
      description: 'The default method cannot be removed: choose another default first (409 payments.default-method-required).'
      operationId: remove
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/customers/me/payment-methods/{id}/default:
    post:
      tags:
      - Saved payment methods
      summary: Make a saved method the default
      operationId: makeDefault
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
  /v1/customers/me/setup-intents:
    post:
      tags:
      - Saved payment methods
      summary: 'Start saving a method: SetupIntent client secret for Stripe Elements / PaymentSheet'
      description: Bank accounts verify instantly with Financial Connections or by microdeposits (listed as verified=false
        until then). The Stripe Customer is created on first use.
      operationId: setupIntent
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupIntentRequest'
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SetupIntentResponse'
  /v1/delivery-pricing/quote:
    post:
      tags:
      - Finance
      summary: Price an AfroTransact Delivery trip from a seller's store (S255)
      description: 'Under the fee-schedule version in force at `at` (default now): the customer''s delivery charge and the
        seller''s pickup-delivery fee (seller override first; 0 for AfroTransact Retail, source RETAIL). `available=false`
        with BEYOND_MAX_RADIUS beyond the version''s service radius (the offer is not deliverable to that address) or NOT_CONFIGURED
        when the version has no delivery pricing. FLAT tariffs count packages; DISTANCE tariffs price the trip. orders-service
        (payments:service), services with payments:fees.read, staff payments:read.'
      operationId: quoteDelivery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryQuoteRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryQuote'
  /v1/fee-schedules:
    get:
      tags:
      - Finance
      summary: Fee schedule versions, newest first (payments:read)
      operationId: feeSchedules
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeeScheduleResponse'
    post:
      tags:
      - Finance
      summary: Create a fee schedule version (Super Admin / Finance, payments:configure)
      description: Applies to orders placed from effectiveFrom (never in the past); history is kept.
      operationId: createFeeSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeScheduleRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeeScheduleResponse'
  /v1/fee-schedules/active:
    get:
      tags:
      - Finance
      summary: Fee schedule in force at a time (default now)
      operationId: activeFeeSchedule
      parameters:
      - name: at
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeeScheduleResponse'
  /v1/fee-schedules/effective:
    get:
      tags:
      - Finance
      summary: Effective fees for an organisation and category (payments:service or payments:read)
      description: 'Commission (seller override, then category, then default), card-fee estimate (cardPctBps + cardFixedMinor
        per charge) and FBA fee of the version in force at `at` (default now). AfroTransact Retail gets zero commission and
        zero FBA fee (source RETAIL): only its card fee share applies. Callers such as bookings use it instead of hard-coding
        fees. Fee schedules are per currency; there is no market dimension.'
      operationId: effectiveFees
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: at
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EffectiveFeesResponse'
  /v1/fee-schedules/{id}/cancel:
    post:
      tags:
      - Finance
      summary: Cancel a scheduled fee schedule version (Super Admin / Finance, payments:configure)
      description: 'Only before its effectiveFrom (409 payments.fee-schedule-in-force afterwards, 409 payments.fee-schedule-cancelled
        when already cancelled). Fee schedules stay immutable: the version is kept and marked cancelled (cancelledAt, cancelledBy,
        cancelReason), never deleted, and is skipped when picking the version in force. Audited.'
      operationId: cancelFeeSchedule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelFeeScheduleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeeScheduleResponse'
  /v1/ledger/balances:
    get:
      tags:
      - Finance
      summary: Ledger balances of every account (payments:read)
      description: AfroTransact Retail sales appear on their own revenue account 4400, separate from the 2000:<org> seller
        payables (Retail is never a payable).
      operationId: balances
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceResponse'
  /v1/ledger/journals:
    get:
      tags:
      - Finance
      summary: Journals of an order (payments:read)
      operationId: journals
      parameters:
      - name: orderId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalResponse'
  /v1/ledger/orgs/{orgId}/balances:
    get:
      tags:
      - Finance
      summary: Ledger balances attributed to one seller / provider organisation (payments:read)
      operationId: orgBalances
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceResponse'
  /v1/orders/{orderId}/refunds:
    post:
      tags:
      - Payments
      summary: Refund by order and line ids (payments:service; e.g. trust-ops claims)
      description: 'Finds the order''s payment and spreads amountMinor (default: everything still refundable) over the lines''
        remaining items, shipping and tax with the largest-remainder method, then refunds like POST /v1/payments/{id}/refunds.
        Idempotent per Idempotency-Key. With fault CUSTOMER the delivery charge of AfroTransact Delivery lines is left out
        of the spread.'
      operationId: refundByOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRefundRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RefundResponse'
  /v1/orders/{orderId}/split:
    get:
      tags:
      - Finance
      summary: Payment split of an order (staff, payments:read)
      description: 'Per recipient: items, shipping, tax collected, commission, FBA fees, pro-rata Stripe fee share (largest
        remainder, leftover cents to AfroTransact) and net. Totals always reconcile to the charge.'
      operationId: split
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SplitResponse'
  /v1/payments:
    get:
      tags:
      - Payments
      summary: Get the payment of an order
      description: Services with payments:service and staff with payments:read read any order's payment. Shoppers (CUSTOMER
        tokens) read only their own orders' payments; another shopper's order is 403 payments.not-your-order (S241).
      operationId: byOrder
      parameters:
      - name: orderId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
    post:
      tags:
      - Payments
      summary: Create the order's PaymentIntent (manual capture) and return its client secret
      description: Stripe idempotency key = <orderId>:create-intent. Replays (same order, same lines) return 200 with replayed=true;
        a different amount or lines for the same order is 409. S272 late pre-order adds set offSession (confirmed now on
        the default saved card; 422 payments.no-saved-method without one) or paymentLinkHours (hosted payment link,
        Stripe idempotency key <orderId>:payment-link).
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /v1/payments/{id}:
    get:
      tags:
      - Payments
      summary: Get a payment
      description: refresh=true reads the intent's status from Stripe first (confirmation, 3-D Secure, authorisation).
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /v1/payments/{id}/cancel:
    post:
      tags:
      - Payments
      summary: Cancel an uncaptured payment (releases the authorisation)
      description: 'Refused (409 payments.already-captured) once something was captured: use /release.'
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /v1/payments/{id}/capture:
    post:
      tags:
      - Payments
      summary: Capture one shipment and post its journal
      description: Stripe amount_to_capture = the lines' items + shipping + tax (multicapture; final_capture releases the
        rest). Posts Dr 1000 Stripe clearing / Dr 5000 Stripe fees, Cr 2000 seller payables, 2100 sales tax, 4000 commission,
        4100 FBA fees, 4200 shipping. Idempotent per (payment, shipmentId).
      operationId: capture
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CaptureResponse'
  /v1/payments/{id}/captures:
    get:
      tags:
      - Payments
      summary: Captures of a payment
      operationId: captures
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaptureResponse'
  /v1/payments/{id}/off-session-charges:
    get:
      tags:
      - Payments
      summary: Off-session charges of a payment, oldest first
      operationId: offSessionCharges
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
    post:
      tags:
      - Payments
      summary: Charge lines off-session on the customer's saved card (long-dated bookings)
      description: 'After the order''s authorisation was released or lapsed (cards hold ~7 days), creates and confirms a manual-capture
        PaymentIntent off_session on a saved card of the customer: a new payment of the same order (parentPaymentId = this
        payment), captured / refunded / settled through the usual endpoints. Status AUTHORIZED = ready to capture; REQUIRES_ACTION
        = the bank requires authentication (SCA): payments.intent.action_required is published and the customer confirms on-session
        with clientSecret; FAILED = declined (retry with another card and a new Idempotency-Key). Idempotent per Idempotency-Key.'
      operationId: chargeOffSession
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OffSessionChargeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /v1/payments/{id}/refunds:
    get:
      tags:
      - Payments
      summary: Refunds of a payment
      operationId: refunds
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundResponse'
    post:
      tags:
      - Payments
      summary: Refund captured lines (partially)
      description: 'Reverses the seller payable, tax and — per fee policy — commission of each line; FBA fees and Stripe fee
        shares are kept. If the seller''s net was already transferred, a Stripe transfer reversal takes it back. AfroTransact
        Delivery lines (S255) follow `fault`: SELLER (default) keeps the seller''s pickup-delivery fee and may refund the
        delivery charge; CUSTOMER returns the fee to the seller pro rata to items refunded and refuses a delivery-charge refund
        (422 payments.delivery-charge-not-refundable).'
      operationId: refund
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RefundResponse'
  /v1/payments/{id}/release:
    post:
      tags:
      - Payments
      summary: Release the remaining authorisation after a partial (deposit) capture
      description: 'For a booking cancelled or a no-show after the deposit capture: the uncaptured rest of the hold is released
        (Stripe: cancelling a requires_capture multicapture intent with captures releases the remainder; nothing to do at
        Stripe when the card already released it at the partial capture). The payment becomes CAPTURED for what was captured
        (releasedMinor = the rest); without captures it is cancelled. Uncaptured lines can later be charged off-session. No
        journal is posted: authorisations never reach the ledger. Idempotent (Idempotency-Key; a payment already released
        replays 200).'
      operationId: releaseAuthorization
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /v1/payouts/balance:
    get:
      tags:
      - Settlement & payouts
      summary: 'Your balance: available to request, on hold per order (with release date), requested / on the way, provider
        fees, and whether payouts are paused (payoutsPaused + payoutsPausedReason)'
      description: 'AfroTransact Retail is not a payable organisation: its balance is always zero and canRequestToday false.'
      operationId: balance
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: currency
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PayoutBalanceResponse'
  /v1/payouts/label-charges:
    get:
      tags:
      - Settlement & payouts
      summary: Shipping label charges of an organisation (labels bought through AfroTransact), newest first
      description: 'Org members see their own; staff pass orgId. Each seller-shipped label bought through carrier-gateway
        is debited from the payable at the carrier''s cost plus handling (CHARGED) and credited back once if voided (CREDITED).
        AfroTransact Retail and FBA / AfroTransact Delivery labels are never charged. Outstanding charges reduce availableMinor
        until a transfer recovers them. Filters: status (CHARGED | CREDITED), purchased in [from, to), limit (≤ 200).'
      operationId: labelCharges
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CHARGED
          - CREDITED
          - VOIDED
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabelChargeResponse'
  /v1/payouts/provider-fees:
    get:
      tags:
      - Settlement & payouts
      summary: Provider fees of an organisation (late provider cancellations), newest first
      description: Org members see their own; staff pass orgId. Fees are debited from the connected account (Stripe account
        debit) and reduce availableMinor; OUTSTANDING ones are retried.
      operationId: providerFees
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderFeeResponse'
  /v1/payouts/requests:
    get:
      tags:
      - Settlement & payouts
      summary: Finance queue of payout requests (payouts:approve)
      operationId: queue
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - REQUESTED
          - HELD
          - IN_TRANSIT
          - PAID
          - FAILED
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayoutResponse'
    post:
      tags:
      - Settlement & payouts
      summary: Request a payout (owner / finance roles, payouts:request)
      description: Minimum USD 25, one request per day, never more than available; no fee. AfroTransact Retail is refused
        with 422 payments.retail-no-payouts.
      operationId: request
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutRequestBody'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PayoutResponse'
  /v1/payouts/requests/{id}:
    get:
      tags:
      - Settlement & payouts
      summary: One payout request
      operationId: payout
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PayoutResponse'
  /v1/payouts/requests/{id}/approve:
    post:
      tags:
      - Settlement & payouts
      summary: 'Approve: creates the Stripe payout on the connected account (payouts:approve)'
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PayoutResponse'
  /v1/payouts/requests/{id}/hold:
    post:
      tags:
      - Settlement & payouts
      summary: Put a request on hold with a reason (payouts:approve)
      operationId: hold
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PayoutResponse'
  /v1/payouts/requests/{id}/release:
    post:
      tags:
      - Settlement & payouts
      summary: Release a held request back to the queue (payouts:approve)
      operationId: release
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PayoutResponse'
  /v1/payouts/statement:
    get:
      tags:
      - Settlement & payouts
      summary: 'Seller statement: movements of the organisation''s payable, newest first'
      description: 'Sales (captures), refunds, transfers, chargebacks and shipping labels as their own lines (LABEL_CHARGE
        / LABEL_CREDIT with labelId, shipmentId and trackingNumber). Amounts are signed: credit to the seller positive. Default
        period: the last 90 days. Org members see their own; staff pass orgId. kind (repeatable) narrows the lines, e.g. kind=LABEL_CHARGE&kind=LABEL_CREDIT
        for the label charges of the period.'
      operationId: statement
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: currency
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      - name: kind
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - CAPTURE
            - REFUND
            - REFUND_SETTLED
            - TRANSFER
            - TRANSFER_REVERSAL
            - DISPUTE_OPENED
            - DISPUTE_WON
            - DISPUTE_LOST
            - PROVIDER_FEE
            - PROVIDER_FEE_COLLECTED
            - LABEL_CHARGE
            - LABEL_CREDIT
            - LABEL_RECOVERY
            - SUPPLIER_PAYABLE
            - SUPPLIER_PAYMENT
          uniqueItems: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatementLineResponse'
  /v1/reconciliation/runs:
    get:
      tags:
      - Finance
      summary: Recent reconciliation runs (payments:read)
      operationId: runs
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReconciliationResponse'
    post:
      tags:
      - Finance
      summary: Reconcile one day now (payments:configure)
      description: Compares ledger 1000 Stripe clearing per Stripe object with Stripe balance transactions.
      operationId: reconcile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReconciliationResponse'
  /v1/settlements/{orderId}:
    get:
      tags:
      - Settlement & payouts
      summary: Settlement hold of an order
      operationId: settlement
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SettlementResponse'
  /v1/settlements/{orderId}/delivered:
    post:
      tags:
      - Settlement & payouts
      summary: 'Order delivered / service completed: start the settlement hold (payments:service)'
      description: Each seller's net becomes transferable after the hold (7 days by default). AfroTransact Retail lines are
        AfroTransact revenue and are never transferred. Idempotent.
      operationId: delivered
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveredRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SettlementResponse'
  /v1/settlements/{orderId}/shipments:
    get:
      tags:
      - Settlement & payouts
      summary: Shipment settlement holds of an order
      operationId: shipmentSettlements
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipmentSettlement'
  /v1/settlements/{orderId}/shipments/{shipmentId}/delivered:
    post:
      tags:
      - Settlement & payouts
      summary: 'One shipment delivered: start that shipment''s settlement hold (payments:service)'
      description: The seller net captured for the shipment becomes transferable after the hold, without waiting for the order's
        other shipments; the order hold transfers whatever is left. Idempotent per shipment.
      operationId: shipmentDelivered
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveredRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ShipmentSettlement'
  /v1/supplier-payments:
    get:
      tags:
      - Supplier payments
      summary: AfroTransact Retail supplier payments (payments:read, platform-wide staff)
      description: Newest due date first. dueBy lists the payment run (SCHEDULED, due on or before the day).
      operationId: listSupplierPayments
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SCHEDULED
          - ON_HOLD
          - PAID
      - name: supplierId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: dueBy
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierPayment'
  /v1/supplier-payments/{id}:
    get:
      tags:
      - Supplier payments
      summary: One supplier payment (payments:read)
      operationId: getSupplierPayment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierPayment'
  /v1/supplier-payments/{id}/hold:
    post:
      tags:
      - Supplier payments
      summary: Hold a supplier payment (payouts:approve)
      operationId: holdSupplierPayment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierHoldRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierPayment'
  /v1/supplier-payments/{id}/paid:
    post:
      tags:
      - Supplier payments
      summary: Record that Finance paid the supplier (payouts:approve)
      description: Posts Dr 2500:<supplier> / Cr 1050 Operating bank. Repeating the same reference is a no-op; a held payment
        must be released first (409 payments.supplier-payment-on-hold).
      operationId: markSupplierPaymentPaid
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkPaidRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierPayment'
  /v1/supplier-payments/{id}/release:
    post:
      tags:
      - Supplier payments
      summary: Release a held supplier payment back to the schedule (payouts:approve)
      operationId: releaseSupplierPayment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierPayment'
  /v1/webhooks/stripe:
    post:
      tags:
      - Stripe webhooks
      summary: Stripe webhook endpoint
      description: Verifies Stripe-Signature with the endpoint secret (400 payments.invalid-signature), stores the event once
        by id and acknowledges; processing is asynchronous. Duplicates and unknown types are acknowledged.
      operationId: receive
      parameters:
      - name: Stripe-Signature
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WebhookAck'
      security: []
components:
  schemas:
    ConnectedAccountRequest:
      type: object
      properties:
        stripeAccountId:
          type: string
          maxLength: 80
          minLength: 0
      required:
      - stripeAccountId
    ConnectedAccountResponse:
      type: object
      properties:
        orgId:
          type: string
        stripeAccountId:
          type: string
    WebhookAck:
      type: object
      properties:
        received:
          type: boolean
        eventId:
          type: string
        type:
          type: string
        duplicate:
          type: boolean
        handled:
          type: boolean
    SupplierPayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        poId:
          type: string
          format: uuid
        poNumber:
          type: string
        supplierId:
          type: string
          format: uuid
        supplierCode:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/SupplierPaymentInvoice'
        status:
          type: string
          enum:
          - SCHEDULED
          - ON_HOLD
          - PAID
        dueOn:
          type: string
          format: date
          description: Payment date by the supplier's terms
        due:
          type: boolean
          description: Scheduled and due on or before today
        paymentReference:
          type: string
        holdReason:
          type: string
        paidBy:
          type: string
        scheduledAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        payableJournalId:
          type: string
          format: uuid
        paymentJournalId:
          type: string
          format: uuid
    SupplierPaymentInvoice:
      type: object
      properties:
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
    MarkPaidRequest:
      type: object
      properties:
        paymentReference:
          type: string
          description: Bank transfer / ACH reference
          maxLength: 120
          minLength: 0
        paidAt:
          type: string
          format: date-time
          description: When the transfer was made (default now)
      required:
      - paymentReference
    SupplierHoldRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - reason
    DeliveredRequest:
      type: object
      properties:
        deliveredAt:
          type: string
          format: date-time
          description: Delivery or service completion time; default now
        kind:
          type: string
          description: PRODUCT (delivery) or SERVICE (booking completed)
    ShipmentSettlement:
      type: object
      description: Settlement hold of one shipment
      properties:
        orderId:
          type: string
        shipmentId:
          type: string
        kind:
          type: string
        deliveredAt:
          type: string
          format: date-time
        releaseAt:
          type: string
          format: date-time
        status:
          type: string
    SettlementResponse:
      type: object
      properties:
        orderId:
          type: string
        kind:
          type: string
        deliveredAt:
          type: string
          format: date-time
        releaseAt:
          type: string
          format: date-time
        status:
          type: string
    ReconcileRequest:
      type: object
      properties:
        date:
          type: string
          format: date
      required:
      - date
    DriftResponse:
      type: object
      properties:
        stripeRef:
          type: string
        ledgerMinor:
          type: integer
          format: int64
        stripeMinor:
          type: integer
          format: int64
        differenceMinor:
          type: integer
          format: int64
    ReconciliationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        currency:
          type: string
        ledgerNetMinor:
          type: integer
          format: int64
        stripeNetMinor:
          type: integer
          format: int64
        driftMinor:
          type: integer
          format: int64
        drifts:
          type: array
          items:
            $ref: '#/components/schemas/DriftResponse'
        createdAt:
          type: string
          format: date-time
    PayoutRequestBody:
      type: object
      description: 'Request a payout: an amount, or all=true for everything available'
      properties:
        orgId:
          type: string
          description: Staff only; members always request for their own org
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        all:
          type: boolean
        currency:
          type: string
          pattern: '[A-Za-z]{3}'
    PayoutResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        requestDay:
          type: string
          format: date
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        holdReason:
          type: string
        stripePayoutId:
          type: string
        failureMessage:
          type: string
    HoldRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - reason
    CreatePaymentRequest:
      type: object
      description: Create the PaymentIntent (manual capture) of an order
      properties:
        orderId:
          type: string
          maxLength: 80
          minLength: 0
        customerId:
          type: string
          description: Stripe customer id (cus_…) of the shopper
          maxLength: 120
          minLength: 0
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 1
          pattern: '[A-Za-z]{3}'
        paymentMethodTypes:
          type: array
          description: Explicit types (card, us_bank_account, cashapp, affirm, link); empty = automatic payment methods
          items:
            type: string
        placedAt:
          type: string
          format: date-time
          description: When the order was placed; selects the fee schedule version
        metadata:
          type: object
          additionalProperties:
            type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineRequest'
          maxItems: 200
          minItems: 0
        shopperId:
          type: string
          description: AfroTransact customer id (token subject) of the shopper; required with saveForOffSession
          maxLength: 120
          minLength: 0
        saveForOffSession:
          type: boolean
          description: Save the confirmed payment method on the shopper's Stripe Customer (setup_future_usage=off_session)
            so a later balance can be charged off-session; customerId is then the shopper's Stripe Customer
        offSession:
          type: boolean
          description: 'S272 late pre-order adds: confirm the intent now, off-session, on the shopper''s default saved card
            (shopperId required); the response status is AUTHORIZED, REQUIRES_ACTION (the customer must authenticate) or
            FAILED'
        paymentLinkHours:
          type: integer
          format: int32
          description: 'S272 late pre-order adds: create a hosted Stripe payment link (Checkout, manual capture) that expires
            after this many hours instead of returning a client secret; the response carries paymentLinkUrl. The paid
            link''s PaymentIntent is attached to the payment by its first webhook (metadata payment_id).'
          maximum: 24
          minimum: 1
      required:
      - amountMinor
      - currency
      - lines
      - orderId
    LineRequest:
      type: object
      description: 'One order line: who sells it and what the shopper pays for it'
      properties:
        lineId:
          type: string
          maxLength: 80
          minLength: 0
        sellerOrg:
          type: string
          maxLength: 80
          minLength: 0
        category:
          type: string
          maxLength: 80
          minLength: 0
        fulfilment:
          type: string
          description: 'PREORDER (S272): the line''s shipping is its share of the pre-order window''s delivery fee, booked
            to 4250 Local delivery fees (also for AfroTransact Retail) and refunded from there'
          enum:
          - FBA
          - SELF
          - AFROTRANSACT_DELIVERY
          - PREORDER
        quantity:
          type: integer
          format: int32
          minimum: 1
        itemsMinor:
          type: integer
          format: int64
          minimum: 0
        shippingMinor:
          type: integer
          format: int64
          minimum: 0
        taxMinor:
          type: integer
          format: int64
          minimum: 0
        taxJurisdiction:
          type: string
          maxLength: 40
          minLength: 0
        shippingTaxMinor:
          type: integer
          format: int64
          description: Part of taxMinor charged on shipping (states that tax delivery); default 0
          minimum: 0
        deliveryFeeMinor:
          type: integer
          format: int64
          description: 'AFROTRANSACT_DELIVERY lines (S255): the seller''s pickup-delivery fee allocated to this line, as quoted
            at checkout (POST /v1/delivery-pricing/quote) and snapshotted by orders. Credited to 4250 at capture; ignored
            for AfroTransact Retail; must be 0 on other lines'
          minimum: 0
      required:
      - fulfilment
      - itemsMinor
      - lineId
      - sellerOrg
    PaymentLineResponse:
      type: object
      description: One line as charged, with what was refunded so far (by this service's refunds, cancellations and claims
        alike)
      properties:
        lineId:
          type: string
        sellerOrg:
          type: string
        category:
          type: string
        fulfilment:
          type: string
        quantity:
          type: integer
          format: int32
        itemsMinor:
          type: integer
          format: int64
        shippingMinor:
          type: integer
          format: int64
        taxMinor:
          type: integer
          format: int64
        taxJurisdiction:
          type: string
        captureId:
          type: string
          format: uuid
        commissionMinor:
          type: integer
          format: int64
        fbaFeeMinor:
          type: integer
          format: int64
        refundedMinor:
          type: integer
          format: int64
        shippingTaxMinor:
          type: integer
          format: int64
          description: Part of taxMinor charged on shipping
        itemsTaxMinor:
          type: integer
          format: int64
          description: taxMinor − shippingTaxMinor
        refundedItemsMinor:
          type: integer
          format: int64
        refundedShippingMinor:
          type: integer
          format: int64
        refundedTaxMinor:
          type: integer
          format: int64
        refundableMinor:
          type: integer
          format: int64
          description: Captured and not refunded yet (0 before capture)
        deliveryFeeMinor:
          type: integer
          format: int64
          description: Seller pickup-delivery fee quoted for the line (AFROTRANSACT_DELIVERY)
        deliveryFeeChargedMinor:
          type: integer
          format: int64
          description: Delivery fee charged at capture (0 for AfroTransact Retail)
        deliveryFeeReversedMinor:
          type: integer
          format: int64
          description: Delivery fee given back by customer-fault refunds
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
        status:
          type: string
        stripePaymentIntentId:
          type: string
        clientSecret:
          type: string
          description: For Stripe.js / PaymentSheet confirmation (also to complete authentication of an off-session charge
            in REQUIRES_ACTION); only returned to the calling service
        amountMinor:
          type: integer
          format: int64
        capturedMinor:
          type: integer
          format: int64
        refundedMinor:
          type: integer
          format: int64
        releasedMinor:
          type: integer
          format: int64
          description: Authorised but released without capture (final capture, release or cancellation)
        currency:
          type: string
        feeScheduleId:
          type: string
          format: uuid
        placedAt:
          type: string
          format: date-time
        authorizedAt:
          type: string
          format: date-time
        failureMessage:
          type: string
          description: Decline message; authentication_required while an off-session charge waits for the customer
        parentPaymentId:
          type: string
          format: uuid
          description: 'Set for an off-session charge: the order''s primary payment'
        offSession:
          type: boolean
        replayed:
          type: boolean
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLineResponse'
        paymentLinkUrl:
          type: string
          description: Hosted payment link (created with paymentLinkHours)
        paymentLinkExpiresAt:
          type: string
          format: date-time
          description: When the payment link expires
    ReleaseRequest:
      type: object
      description: Release the uncaptured rest of the authorisation (e.g. booking cancelled or no-show after the deposit capture)
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
    RefundLineRequest:
      type: object
      properties:
        lineId:
          type: string
          minLength: 1
        itemsMinor:
          type: integer
          format: int64
          minimum: 0
        shippingMinor:
          type: integer
          format: int64
          minimum: 0
        taxMinor:
          type: integer
          format: int64
          minimum: 0
      required:
      - lineId
    RefundRequest:
      type: object
      description: Line-level partial refund
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RefundLineRequest'
          maxItems: 200
          minItems: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
        fault:
          type: string
          description: 'Who caused the refund, for AfroTransact Delivery lines: SELLER (default) keeps the seller''s delivery
            fee; CUSTOMER returns it pro rata and the delivery charge is not refundable'
          enum:
          - SELLER
          - CUSTOMER
      required:
      - lines
    RefundLineResponse:
      type: object
      properties:
        lineId:
          type: string
        sellerOrg:
          type: string
        itemsMinor:
          type: integer
          format: int64
        shippingMinor:
          type: integer
          format: int64
        taxMinor:
          type: integer
          format: int64
        commissionReversedMinor:
          type: integer
          format: int64
        deliveryFeeReversedMinor:
          type: integer
          format: int64
          description: AfroTransact Delivery fee returned to the seller (customer fault)
    RefundResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        orderId:
          type: string
        stripeRefundId:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        reason:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RefundLineResponse'
        transferReversals:
          type: array
          items:
            $ref: '#/components/schemas/Reversal'
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
        replayed:
          type: boolean
    Reversal:
      type: object
      properties:
        orgId:
          type: string
        stripeTransferId:
          type: string
        stripeReversalId:
          type: string
        amountMinor:
          type: integer
          format: int64
    OffSessionChargeRequest:
      type: object
      description: 'Charge lines of the order off-session on the customer''s saved card (manual capture: capture with POST
        /v1/payments/{newId}/capture)'
      properties:
        customerId:
          type: string
          description: AfroTransact customer id (token subject)
          maxLength: 120
          minLength: 0
        paymentMethodId:
          type: string
          description: Saved card pm_…; default = the customer's default method
          maxLength: 80
          minLength: 0
        lineIds:
          type: array
          description: Lines of the primary payment; empty = every line not captured yet
          items:
            type: string
      required:
      - customerId
    CaptureRequest:
      type: object
      description: Capture one shipment (carrier acceptance)
      properties:
        shipmentId:
          type: string
          maxLength: 80
          minLength: 0
        lineIds:
          type: array
          description: Lines in the shipment; empty = every line not captured yet
          items:
            type: string
        amountMinor:
          type: integer
          format: int64
          description: Expected amount; must equal the lines' items + shipping + tax
        finalCapture:
          type: boolean
          description: Release the rest of the authorisation after this capture
      required:
      - shipmentId
    CaptureResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        orderId:
          type: string
        shipmentId:
          type: string
        amountMinor:
          type: integer
          format: int64
        stripeFeeMinor:
          type: integer
          format: int64
        feeEstimated:
          type: boolean
        currency:
          type: string
        stripeChargeId:
          type: string
        finalCapture:
          type: boolean
        lineIds:
          type: array
          items:
            type: string
        journalId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
        paymentStatus:
          type: string
        replayed:
          type: boolean
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
    OrderRefundRequest:
      type: object
      description: 'Refund by order and line ids (service callers such as trust-ops): the amount is spread over the lines''
        remaining items, shipping and tax'
      properties:
        lineIds:
          type: array
          items:
            type: string
            maxLength: 80
            minLength: 0
          maxItems: 200
          minItems: 0
        amountMinor:
          type: integer
          format: int64
          description: Total to refund; omit to refund everything still refundable on the lines
          exclusiveMinimum: 0
        reason:
          type: string
          maxLength: 500
          minLength: 0
        fault:
          type: string
          description: SELLER (default) or CUSTOMER; see POST /v1/payments/{id}/refunds
          enum:
          - SELLER
          - CUSTOMER
      required:
      - lineIds
    DeliveryBand:
      type: object
      description: Trips of fromMiles (inclusive) up to toMiles (exclusive) cost feeMinor
      properties:
        fromMiles:
          type: number
          minimum: 0
        toMiles:
          type: number
        feeMinor:
          type: integer
          format: int64
          minimum: 0
      required:
      - feeMinor
      - fromMiles
      - toMiles
    DeliveryPricingRequest:
      type: object
      description: 'AfroTransact Delivery from seller stores: the customer''s delivery charge (to 4200), the seller''s pickup-delivery
        fee (to 4250) with per-seller overrides, and the service radius'
      properties:
        enabled:
          type: boolean
          default: true
          description: false = not offered under this version
        maxRadiusMiles:
          type: number
          description: Beyond this (estimated road miles) the option is unavailable
          example: 25
          exclusiveMinimum: 0
          maximum: 200
        customerCharge:
          $ref: '#/components/schemas/DeliveryTariff'
          description: What the customer pays (FLAT or DISTANCE); omitted = free
        sellerFee:
          $ref: '#/components/schemas/DeliveryTariff'
          description: What the seller pays (FLAT or DISTANCE); omitted = no fee
        sellerOverrides:
          type: array
          items:
            $ref: '#/components/schemas/SellerDeliveryFeeOverride'
          maxItems: 500
          minItems: 0
    DeliveryTariff:
      type: object
      description: 'FLAT: flatPerPackageMinor × packages. DISTANCE (per trip): the fee of the band covering the distance,
        else baseMinor + perMileMinor × miles (half up), then at least minMinor and at most maxMinor'
      properties:
        mode:
          type: string
          enum:
          - FLAT
          - DISTANCE
        flatPerPackageMinor:
          type: integer
          format: int64
          minimum: 0
        baseMinor:
          type: integer
          format: int64
          minimum: 0
        perMileMinor:
          type: integer
          format: int64
          description: Minor units per mile (85 = $0.85 / mi)
          minimum: 0
        bands:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryBand'
          maxItems: 20
          minItems: 0
        minMinor:
          type: integer
          format: int64
          minimum: 0
        maxMinor:
          type: integer
          format: int64
          description: Cap; omit for none
          minimum: 0
      required:
      - mode
    FeeScheduleRequest:
      type: object
      description: A new fee-schedule version (Super Admin / Finance)
      properties:
        effectiveFrom:
          type: string
          format: date-time
          description: Takes effect for orders placed from this time; default now, never in the past
        currency:
          type: string
          pattern: '[A-Za-z]{3}'
        categoryBps:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: Commission per category in basis points (800 = 8 %)
        defaultCommissionBps:
          type: integer
          format: int32
          maximum: 10000
          minimum: 0
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/OverrideRequest'
        cardPctBps:
          type: integer
          format: int32
          maximum: 10000
          minimum: 0
        cardFixedMinor:
          type: integer
          format: int64
          minimum: 0
        fbaPerUnitMinor:
          type: integer
          format: int64
          minimum: 0
        reverseCommissionOnRefund:
          type: boolean
        note:
          type: string
          maxLength: 500
          minLength: 0
        deliveryPricing:
          $ref: '#/components/schemas/DeliveryPricingRequest'
          description: AfroTransact Delivery pricing (S255). Omit to carry the latest version's section over; send enabled=false
            to stop offering AfroTransact Delivery from seller stores
      required:
      - categoryBps
    OverrideRequest:
      type: object
      properties:
        orgId:
          type: string
          minLength: 1
        category:
          type: string
        commissionBps:
          type: integer
          format: int32
          maximum: 10000
          minimum: 0
      required:
      - orgId
    SellerDeliveryFeeOverride:
      type: object
      description: Negotiated seller pickup-delivery fee of one organisation
      properties:
        orgId:
          type: string
          maxLength: 80
          minLength: 0
        sellerFee:
          $ref: '#/components/schemas/DeliveryTariff'
      required:
      - orgId
      - sellerFee
    DeliveryPricing:
      type: object
      description: AfroTransact Delivery pricing of a fee-schedule version
      properties:
        enabled:
          type: boolean
        maxRadiusMiles:
          type: number
        customerCharge:
          $ref: '#/components/schemas/DeliveryTariff'
        sellerFee:
          $ref: '#/components/schemas/DeliveryTariff'
        sellerOverrides:
          type: array
          items:
            $ref: '#/components/schemas/SellerDeliveryFeeOverride'
    FeeScheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
        effectiveFrom:
          type: string
          format: date-time
        currency:
          type: string
        categoryBps:
          type: object
          additionalProperties:
            type: integer
            format: int32
        defaultCommissionBps:
          type: integer
          format: int32
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/OverrideRequest'
        cardPctBps:
          type: integer
          format: int32
        cardFixedMinor:
          type: integer
          format: int64
        fbaPerUnitMinor:
          type: integer
          format: int64
        reverseCommissionOnRefund:
          type: boolean
        note:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          description: Set when the version was cancelled before it took effect (it never applies)
        cancelledBy:
          type: string
          description: Who cancelled the version
        cancelReason:
          type: string
          description: Why the version was cancelled
        deliveryPricing:
          $ref: '#/components/schemas/DeliveryPricing'
          description: AfroTransact Delivery pricing (S255)
    CancelFeeScheduleRequest:
      type: object
      description: Why a scheduled fee schedule version is withdrawn (audited)
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - reason
    DeliveryQuoteRequest:
      type: object
      description: Price one AfroTransact Delivery trip
      properties:
        sellerOrgId:
          type: string
          maxLength: 80
          minLength: 0
        distanceMiles:
          type: number
          description: Road miles (geo POST /v1/distance roadMiles)
          example: 7.4
          minimum: 0
        packages:
          type: integer
          format: int32
          default: 1
          maximum: 50
          minimum: 1
        at:
          type: string
          format: date-time
          description: Fee-schedule version in force at this time; default now
      required:
      - distanceMiles
      - sellerOrgId
    DeliveryQuote:
      type: object
      description: customerChargeMinor goes on the order as the package's shipping (4200); sellerFeeMinor is snapshotted and
        deducted from the seller at capture (4250)
      properties:
        available:
          type: boolean
        unavailableReason:
          type: string
          enum:
          - NOT_CONFIGURED
          - BEYOND_MAX_RADIUS
        customerChargeMinor:
          type: integer
          format: int64
        sellerFeeMinor:
          type: integer
          format: int64
        sellerFeeSource:
          type: string
          enum:
          - DEFAULT
          - OVERRIDE
          - RETAIL
        currency:
          type: string
        scheduleId:
          type: string
          format: uuid
        scheduleVersion:
          type: integer
          format: int32
        distanceMiles:
          type: number
        packages:
          type: integer
          format: int32
        maxRadiusMiles:
          type: number
    SetupIntentRequest:
      type: object
      properties:
        types:
          type: array
          description: card, us_bank_account, cashapp, link; default card
          items:
            type: string
    SetupIntentResponse:
      type: object
      properties:
        setupIntentId:
          type: string
        clientSecret:
          type: string
        status:
          type: string
    PaymentMethodResponse:
      type: object
      description: A saved payment method (display data only — never full numbers)
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - card
          - us_bank_account
          - cashapp
          - link
        brand:
          type: string
        last4:
          type: string
        expMonth:
          type: integer
          format: int32
        expYear:
          type: integer
          format: int32
        bankName:
          type: string
        accountType:
          type: string
        verified:
          type: boolean
          description: false = bank account pending verification
        isDefault:
          type: boolean
    EphemeralKeyRequest:
      type: object
      properties:
        stripeVersion:
          type: string
          description: Stripe API version of the mobile SDK; default 2025-08-27.basil
          examples:
          - 2025-08-27.basil
    EphemeralKey:
      type: object
      description: PaymentSheet setup for the signed-in shopper (S241)
      properties:
        customerId:
          type: string
          description: The shopper's Stripe Customer
          examples:
          - cus_Q1w2e3r4
        ephemeralKeySecret:
          type: string
          description: Ephemeral key secret for the PaymentSheet (never log it)
        expiresAt:
          type: string
          format: date-time
    StatementLineResponse:
      type: object
      description: 'One line of the seller statement: a movement of the organisation''s payable (credit to the seller positive).
        Label lines carry labelId, shipmentId, trackingNumber and carrier.'
      properties:
        journalId:
          type: string
          format: uuid
        kind:
          type: string
          description: CAPTURE, REFUND, TRANSFER, TRANSFER_REVERSAL, DISPUTE_OPENED, DISPUTE_WON, LABEL_CHARGE, LABEL_CREDIT,
            …
        occurredAt:
          type: string
          format: date-time
        orderId:
          type: string
        description:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        labelId:
          type: string
        shipmentId:
          type: string
        trackingNumber:
          type: string
        carrier:
          type: string
    ProviderFeeResponse:
      type: object
      description: A fee a provider owes (late provider cancellation), collected by a Stripe account debit
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        bookingId:
          type: string
        bookingReference:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        reason:
          type: string
        status:
          type: string
          enum:
          - OUTSTANDING
          - COLLECTED
        stripeDebitId:
          type: string
        attempts:
          type: integer
          format: int32
        lastError:
          type: string
        nextAttemptAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        collectedAt:
          type: string
          format: date-time
    LabelChargeResponse:
      type: object
      description: A shipping label bought through AfroTransact and charged to the seller (carrier cost + handling), credited
        back once if the label is voided
      properties:
        id:
          type: string
          format: uuid
        labelId:
          type: string
        orgId:
          type: string
        shipmentId:
          type: string
        orderId:
          type: string
        carrier:
          type: string
        service:
          type: string
        trackingNumber:
          type: string
        costMinor:
          type: integer
          format: int64
          description: The carrier's negotiated charge
        handlingMinor:
          type: integer
          format: int64
          description: AfroTransact handling markup (0 by default)
        amountMinor:
          type: integer
          format: int64
          description: costMinor + handlingMinor
        currency:
          type: string
        status:
          type: string
          enum:
          - CHARGED
          - CREDITED
        purchasedAt:
          type: string
          format: date-time
        chargedAt:
          type: string
          format: date-time
        creditedAt:
          type: string
          format: date-time
    HeldOrderResponse:
      type: object
      description: Net on settlement hold for one order; releaseAt null until delivered / completed
      properties:
        orderId:
          type: string
        amountMinor:
          type: integer
          format: int64
        releaseAt:
          type: string
          format: date-time
    PayoutBalanceResponse:
      type: object
      properties:
        orgId:
          type: string
        currency:
          type: string
        availableMinor:
          type: integer
          format: int64
        onHoldMinor:
          type: integer
          format: int64
        onHold:
          type: array
          items:
            $ref: '#/components/schemas/HeldOrderResponse'
        requestedOrInTransitMinor:
          type: integer
          format: int64
        paidMinor:
          type: integer
          format: int64
        providerFeesMinor:
          type: integer
          format: int64
          description: Provider fees (late cancellations) debited from or reserved in the balance
        labelChargesMinor:
          type: integer
          format: int64
          description: 'Shipping labels bought through AfroTransact and not yet recovered from a transfer; deducted from availableMinor,
            which may go negative. Negative when voided labels are owed back (paid with the next transfer). Details: GET /v1/payouts/label-charges'
        deliveryFeesMinor:
          type: integer
          format: int64
          description: AfroTransact Delivery pickup fees paid on captured lines, net of fees given back by customer-fault
            refunds (S259); already deducted from the order nets, shown for earnings
        minimumPayoutMinor:
          type: integer
          format: int64
        canRequestToday:
          type: boolean
        payoutsPaused:
          type: boolean
          description: 'Payouts are on a compliance hold: requests and approvals fail with 422 payments.payouts_paused; the
            balance keeps accruing'
        payoutsPausedReason:
          type: string
          description: Why payouts are paused (null when not paused)
          enum:
          - AUTO_PAST_DUE
          - MANUAL
          - DEAUTHORIZED
          - CHARGES_DISABLED
    LineSplitResponse:
      type: object
      properties:
        lineId:
          type: string
        sellerOrg:
          type: string
        commissionBps:
          type: integer
          format: int32
        commissionMinor:
          type: integer
          format: int64
        fbaFeeMinor:
          type: integer
          format: int64
        shippingToPlatform:
          type: boolean
        deliveryFeeMinor:
          type: integer
          format: int64
    RecipientResponse:
      type: object
      description: 'One recipient. For sellers commission, FBA fees, delivery fees and Stripe fee are deductions; for the
        AfroTransact platform row they are the totals earned. AfroTransact Retail (kind RETAIL) pays no commission and no
        FBA fee: its net (items + shipping − Stripe fee share) is AfroTransact revenue (4400 Retail sales), never transferred
        or paid out. Tax is collected and remitted by AfroTransact.'
      properties:
        recipient:
          type: string
        kind:
          type: string
          enum:
          - SELLER
          - RETAIL
          - PLATFORM
        itemsMinor:
          type: integer
          format: int64
        shippingMinor:
          type: integer
          format: int64
        taxMinor:
          type: integer
          format: int64
        taxByJurisdiction:
          type: object
          additionalProperties:
            type: integer
            format: int64
        commissionMinor:
          type: integer
          format: int64
        fbaFeesMinor:
          type: integer
          format: int64
        deliveryFeesMinor:
          type: integer
          format: int64
          description: AfroTransact Delivery pickup-delivery fees (4250)
        stripeFeeMinor:
          type: integer
          format: int64
        netMinor:
          type: integer
          format: int64
    SplitResponse:
      type: object
      properties:
        orderId:
          type: string
        paymentId:
          type: string
          format: uuid
        feeScheduleVersion:
          type: integer
          format: int32
        feeSource:
          type: string
        chargeMinor:
          type: integer
          format: int64
        stripeFeeMinor:
          type: integer
          format: int64
        taxCollectedMinor:
          type: integer
          format: int64
        currency:
          type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/RecipientResponse'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineSplitResponse'
    BalanceResponse:
      type: object
      properties:
        account:
          type: string
        code:
          type: string
        key:
          type: string
        title:
          type: string
        type:
          type: string
        currency:
          type: string
        debitsMinor:
          type: integer
          format: int64
        creditsMinor:
          type: integer
          format: int64
        balanceMinor:
          type: integer
          format: int64
    JournalLineResponse:
      type: object
      properties:
        account:
          type: string
        title:
          type: string
        side:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        orgId:
          type: string
    JournalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        type:
          type: string
        orderId:
          type: string
        paymentId:
          type: string
        stripeRef:
          type: string
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLineResponse'
    EffectiveFeesResponse:
      type: object
      description: Fees payments applies to one organisation and category (fee-schedule version in force)
      properties:
        feeScheduleId:
          type: string
          format: uuid
        version:
          type: integer
          format: int32
        effectiveFrom:
          type: string
          format: date-time
        currency:
          type: string
        category:
          type: string
        orgId:
          type: string
        commissionBps:
          type: integer
          format: int32
          description: Commission in basis points (1000 = 10 %)
        commissionSource:
          type: string
          enum:
          - OVERRIDE
          - CATEGORY
          - DEFAULT
          - RETAIL
        cardPctBps:
          type: integer
          format: int32
          description: 'Card fee estimate per charge: percentage part in bps'
        cardFixedMinor:
          type: integer
          format: int64
          description: 'Card fee estimate per charge: fixed part'
        fbaPerUnitMinor:
          type: integer
          format: int64
          description: FBA fee per unit; 0 for AfroTransact Retail
        reverseCommissionOnRefund:
          type: boolean
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
