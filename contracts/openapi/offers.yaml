          format: int32
        score:
          type: number
          format: double
        buyBoxEligible:
          type: boolean
        listable:
          type: boolean
        ineligibility:
          type: array
          items:
            type: string
            enum:
            - NOT_ACTIVE
            - PRODUCT_NOT_LIVE
            - OUT_OF_STOCK
            - SELLER_LISTINGS_HIDDEN
            - SELLER_RESTRICTED
            - CONDITION_NOT_NEW
            - SELLER_HEALTH_BELOW_THRESHOLD
        priceMinor:
          type: integer
          format: int64
        shippingMinor:
          type: integer
          format: int64
        landedPriceMinor:
          type: integer
          format: int64
        fulfilment:
          type: string
          enum:
          - AFROTRANSACT
          - SELLER
        condition:
          type: string
          enum:
          - NEW
          - RENEWED
          - USED_LIKE_NEW
          - USED_VERY_GOOD
          - USED_GOOD
          - USED_ACCEPTABLE
        availableQty:
          type: integer
          format: int32
        deliveryDays:
          type: integer
          format: int32
        components:
          type: array
          items:
            $ref: '#/components/schemas/ScoreComponent'
  securitySchemes:
    bearer:
      type: http
