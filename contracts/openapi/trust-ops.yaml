          type: string
          description: 'Optional: taken from the shipment / order (orders lookup)'
          maxLength: 80
          minLength: 0
        customerId:
          type: string
          maxLength: 120
          minLength: 0
        amountMinor:
          type: integer
          format: int64
          exclusiveMinimum: 0
