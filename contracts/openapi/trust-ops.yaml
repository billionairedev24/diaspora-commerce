openapi: 3.1.0
info:
  title: Trust & Safety Ops API
  description: Listing moderation queue, disputes and A-to-z claims, the immutable hash-chained audit log, seller health,
    suspension and reinstatement, and the support-case queue for Lola hand-offs.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8110
  description: local
- url: https://api.dev.afrotransact.com/trust-ops
  description: dev
- url: https://api.uat.afrotransact.com/trust-ops
  description: uat
- url: https://api.afrotransact.com/trust-ops
  description: prod
security:
- bearer: []
tags:
- name: Audit log
  description: Immutable, hash-chained record of every privileged action (audit:read)
- name: Listing moderation
  description: Queue of listings awaiting a human decision, with SLA timers, assignment, AI triage hints, allow / remove with
    reason codes and escalation (catalog:moderate)
- name: Support cases
  description: Conversations Lola handed to human support (support:respond)
- name: Disputes & A-to-z claims
  description: Customers open claims on orders or shipments, sellers respond within the response window, staff decide with
    a refund (payments) or a denial
- name: Seller health & enforcement
  description: Late shipment, cancellation and defect rates; suspend and reinstate sellers
paths:
  /v1/audit/entries:
    get:
      tags:
      - Audit log
      summary: 'Search the audit log, newest first: filter by actor, entity, action, org and date [from, to)'
      operationId: search
      parameters:
      - name: actorId
        in: query
        required: false
        schema:
          type: string
      - name: entityType
        in: query
        required: false
        schema:
          type: string
      - name: entityId
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseAuditEntryResponse'
  /v1/audit/entries/{seq}:
    get:
      tags:
      - Audit log
      summary: One audit entry by sequence number
      operationId: get_3
      parameters:
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuditEntryResponse'
  /v1/audit/export.csv:
    get:
      tags:
      - Audit log
      summary: CSV export of matching entries, oldest first (same filters; capped)
      operationId: export
      parameters:
      - name: actorId
        in: query
        required: false
        schema:
          type: string
      - name: entityType
        in: query
        required: false
        schema:
          type: string
      - name: entityId
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
  /v1/audit/verify:
    get:
      tags:
      - Audit log
      summary: 'Verify the hash chain (default: the whole log); detects edited, re-hashed or missing entries'
      operationId: verify
      parameters:
      - name: fromSeq
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: toSeq
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VerificationResponse'
  /v1/claims:
    get:
      tags:
      - Disputes & A-to-z claims
      summary: Staff queue (disputes:manage), soonest due first; default open claims
      operationId: queue
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - AWAITING_SELLER
          - UNDER_REVIEW
          - ESCALATED
          - RESOLVED_REFUND
          - RESOLVED_DENIED
          - WITHDRAWN
      - name: sellerOrgId
        in: query
        required: false
        schema:
          type: string
      - name: orderId
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseClaimResponse'
    post:
      tags:
      - Disputes & A-to-z claims
      summary: Open a claim (customer; staff with disputes:manage on a customer's behalf)
      operationId: open
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenClaimRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClaimResponse'
  /v1/claims/mine:
    get:
      tags:
      - Disputes & A-to-z claims
      summary: My claims (customer)
      operationId: mine
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseClaimResponse'
  /v1/claims/seller/{orgId}:
    get:
      tags:
      - Disputes & A-to-z claims
      summary: Claims against a seller organisation (its members with support:respond, or staff)
      operationId: forSeller
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - AWAITING_SELLER
          - UNDER_REVIEW
          - ESCALATED
          - RESOLVED_REFUND
          - RESOLVED_DENIED
          - WITHDRAWN
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseClaimResponse'
  /v1/claims/{id}:
    get:
      tags:
      - Disputes & A-to-z claims
      summary: One claim (customer, seller or staff)
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClaimResponse'
  /v1/claims/{id}/decision:
    post:
      tags:
      - Disputes & A-to-z claims
      summary: 'Decide: refund through payments or deny (disputes:manage); notifies both parties'
      operationId: decide
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClaimResponse'
  /v1/claims/{id}/escalate:
    post:
      tags:
      - Disputes & A-to-z claims
      summary: Escalate (disputes:manage)
      operationId: escalate_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateClaimRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClaimResponse'
  /v1/claims/{id}/evidence:
    post:
      tags:
      - Disputes & A-to-z claims
      summary: Add evidence (media asset id) while the claim is open
      operationId: evidence
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClaimResponse'
  /v1/claims/{id}/history:
    get:
      tags:
      - Disputes & A-to-z claims
      summary: Claim timeline
      operationId: history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryResponse'
  /v1/claims/{id}/seller-response:
    post:
      tags:
      - Disputes & A-to-z claims
      summary: Seller response within the response window (support:respond for the seller org)
      operationId: sellerResponse
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerResponseRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClaimResponse'
  /v1/claims/{id}/withdraw:
    post:
      tags:
      - Disputes & A-to-z claims
      summary: Withdraw (the customer)
      operationId: withdraw
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ClaimResponse'
  /v1/moderation/items:
    get:
      tags:
      - Listing moderation
      summary: 'Moderation queue, soonest due first (default: open items of both types)'
      description: 'type=NEW_LISTING: submissions awaiting review; type=LIVE_LISTING: reported or flagged live listings (catalog.product.flagged).'
      operationId: queue_2
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ESCALATED
          - APPROVED
          - REJECTED
          - CLOSED
      - name: assignee
        in: query
        required: false
        schema:
          type: string
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - NEW_LISTING
          - LIVE_LISTING
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseModerationItemResponse'
  /v1/moderation/items/{id}:
    get:
      tags:
      - Listing moderation
      summary: One queue item
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModerationItemResponse'
  /v1/moderation/items/{id}/approve:
    post:
      tags:
      - Listing moderation
      summary: Allow, then close the item (audited)
      description: 'NEW_LISTING: approves the product in catalog. LIVE_LISTING: keeps the listing live and dismisses the reports
        (no catalog call).'
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModerationItemResponse'
  /v1/moderation/items/{id}/assign:
    post:
      tags:
      - Listing moderation
      summary: 'Assign to a reviewer (default: me)'
      operationId: assign_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModerationItemResponse'
  /v1/moderation/items/{id}/escalate:
    post:
      tags:
      - Listing moderation
      summary: Escalate to senior review (new escalation SLA)
      operationId: escalate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModerationItemResponse'
  /v1/moderation/items/{id}/reject:
    post:
      tags:
      - Listing moderation
      summary: Remove with a reason code, then close the item (audited)
      description: 'NEW_LISTING: rejects the product in catalog. LIVE_LISTING: takes the live listing down in catalog (POST
        /v1/products/{id}/takedown). If catalog refuses, the item stays open (409).'
      operationId: reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModerationItemResponse'
  /v1/moderation/items/{id}/triage:
    post:
      tags:
      - Listing moderation
      summary: Re-run AI triage (fail-open)
      operationId: retriage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModerationItemResponse'
  /v1/moderation/reason-codes:
    get:
      tags:
      - Listing moderation
      summary: Reason codes for removing a listing
      operationId: reasonCodes
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReasonCodeResponse'
  /v1/seller-enforcement:
    get:
      tags:
      - Seller health & enforcement
      summary: Suspended sellers (orgs:read)
      operationId: suspended
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandingResponse'
  /v1/seller-enforcement/{orgId}:
    get:
      tags:
      - Seller health & enforcement
      summary: Seller standing (orgs:read)
      operationId: standing
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StandingResponse'
  /v1/seller-enforcement/{orgId}/reinstate:
    post:
      tags:
      - Seller health & enforcement
      summary: 'Reinstate: lift the suspension hold (compliance payout holds stay) and the buy-box restriction; audited (sellers:enforce)'
      operationId: reinstate
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReinstateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StandingResponse'
  /v1/seller-enforcement/{orgId}/suspend:
    post:
      tags:
      - Seller health & enforcement
      summary: 'Suspend: seller-service suspension hold (payouts paused, listings hidden) and buy-box restriction (offers);
        audited. Calling again retries steps that failed (sellers:enforce)'
      operationId: suspend
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StandingResponse'
  /v1/seller-health/{orgId}:
    get:
      tags:
      - Seller health & enforcement
      summary: Seller health over the rolling window, with standing (orgs:read)
      operationId: health
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerHealthResponse'
  /v1/seller-health/{orgId}/recompute:
    post:
      tags:
      - Seller health & enforcement
      summary: Recompute now, store a snapshot and push performance to offers (sellers:enforce)
      operationId: recompute
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/support-cases:
    get:
      tags:
      - Support cases
      summary: 'Support queue, soonest due first (default: not resolved)'
      operationId: queue_1
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - RESOLVED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseSupportCaseResponse'
  /v1/support-cases/{id}:
    get:
      tags:
      - Support cases
      summary: One support case
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupportCaseResponse'
  /v1/support-cases/{id}/assign:
    post:
      tags:
      - Support cases
      summary: 'Assign (default: me)'
      operationId: assign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCaseRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupportCaseResponse'
  /v1/support-cases/{id}/resolve:
    post:
      tags:
      - Support cases
      summary: Resolve
      operationId: resolve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupportCaseResponse'
components:
  schemas:
    ResolveRequest:
      type: object
      description: Resolve with what was done
      properties:
        resolution:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - resolution
    SlaResponse:
      type: object
      description: 'SLA timer: due time, ON_TRACK / AT_RISK (last quarter) / BREACHED, seconds left or overdue'
      properties:
        startedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - BREACHED
        remainingSeconds:
          type: integer
          format: int64
        overdueSeconds:
          type: integer
          format: int64
    SupportCaseResponse:
      type: object
      description: A support case opened from a Lola hand-off (summary redacted by ai-gateway)
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        source:
          type: string
        handoffId:
          type: string
          format: uuid
        sessionId:
          type: string
        customerId:
          type: string
        reason:
          type: string
        summary:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - RESOLVED
        assignee:
          type: string
        sla:
          $ref: '#/components/schemas/SlaResponse'
        openedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        resolution:
          type: string
        version:
          type: integer
          format: int64
    AssignCaseRequest:
      type: object
      description: Assign; omit assignee to take it yourself
      properties:
        assignee:
          type: string
          maxLength: 120
          minLength: 0
    HealthResponse:
      type: object
      description: Seller health over the rolling window (rates null when unknown)
      properties:
        orgId:
          type: string
        status:
          type: string
          enum:
          - GOOD
          - AT_RISK
          - UNKNOWN
        breaches:
          type: array
          items:
            type: string
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        shipments:
          type: integer
          format: int32
        delivered:
          type: integer
          format: int32
        lateDeliveries:
          type: integer
          format: int32
        sellerCancellations:
          type: integer
          format: int32
        claims:
          type: integer
          format: int32
        lateShipmentRate:
          type: number
          format: double
        onTimeRate:
          type: number
          format: double
        cancellationRate:
          type: number
          format: double
        defectRate:
          type: number
          format: double
        computedAt:
          type: string
          format: date-time
    SuspendRequest:
      type: object
      description: 'Suspend a seller: holds payouts, hides its listings and restricts it in the buy box'
      properties:
        reason:
          type: string
          enum:
          - POOR_PERFORMANCE
          - PROHIBITED_ITEMS
          - COUNTERFEIT
          - FRAUD_RISK
          - POLICY_VIOLATION
          - COMPLIANCE
          - OTHER
        note:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - note
      - reason
    StandingResponse:
      type: object
      description: Seller standing and which upstream effects are applied. payoutsHeld and listingsHidden report seller-service's
        suspension hold only; a Stripe compliance hold may keep payouts paused after reinstatement (see seller-service GET
        /v1/orgs/{orgId}/enforcement).
      properties:
        orgId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        reason:
          type: string
          enum:
          - POOR_PERFORMANCE
          - PROHIBITED_ITEMS
          - COUNTERFEIT
          - FRAUD_RISK
          - POLICY_VIOLATION
          - COMPLIANCE
          - OTHER
        note:
          type: string
        actorId:
          type: string
        changedAt:
          type: string
          format: date-time
        payoutsHeld:
          type: boolean
        listingsHidden:
          type: boolean
        buyBoxRestricted:
          type: boolean
        stepsPending:
          type: boolean
    ReinstateRequest:
      type: object
      description: 'Reinstate a seller: lifts the suspension hold (unrelated compliance payout holds stay) and the buy-box
        restriction'
      properties:
        note:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - note
