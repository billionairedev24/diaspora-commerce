        orderNumber:
          type: string
        shipmentId:
          type: string
        sellerOrgId:
          type: string
        customerId:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        description:
          type: string
        evidence:
          type: array
