          type: string
        escalatedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        reasonCode:
          type: string
          enum:
          - PROHIBITED_ITEM
          - UNAPPROVED_HEALTH_CLAIM
          - RESTRICTED_INGREDIENT
          - COUNTERFEIT
          - IMAGE_POLICY
          - MISLEADING_CONTENT
          - LABELLING
