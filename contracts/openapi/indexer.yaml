openapi: 3.1.0
info:
  title: Indexer
  version: v1
  description: |
    Kafka → Elasticsearch projection of the product read model. Consumes catalog.product.* and
    inventory.availability.changed (topics at.product.events, at.inventory.events), upserts product documents
    with version guards so redelivered or out-of-order events never overwrite newer data, and parks poison
    events on at.indexer.dlq.events after retries. Seller display names are warmed on start from seller-service's
    organisation directory (GET /v1/orgs/directory, client indexer-service, scope sellers:directory) and kept current
    by seller.org.* events, so restarts never change indexed seller names. New indices reference the diaspora
    synonyms set owned by search-service. The HTTP surface is operational only.
servers:
  - url: http://localhost:8202
    description: local
tags:
  - name: Operations
    description: Liveness, readiness and Prometheus metrics (unauthenticated, served by the shared HTTP server)
paths:
  /healthz:
    get:
      tags: [Operations]
      summary: Liveness
      security: []
      operationId: healthz
      responses: {'200': {description: alive}}
  /readyz:
    get:
      tags: [Operations]
      summary: Readiness (Elasticsearch reachable)
      security: []
      operationId: readyz
      responses: {'200': {description: ready}, '503': {description: not ready}}
  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics (indexer_events_total by type and outcome)
      security: []
      operationId: metrics
      responses: {'200': {description: metrics, content: {text/plain: {schema: {type: string}}}}}
