                $ref: '#/components/schemas/SellerReviewPage'
  /v1/search-export/products:
    get:
      tags:
      - Search export
      summary: Products as catalog.product.* event payloads, keyset-paged by id, for the search index rebuild
      description: Service clients with catalog:read (the indexer-service client) and staff. Each item is the payload the
        indexer would have received for the product's current state (sellerHidden while the owner's listings are hidden),
        the time that state last changed (version) and the stored rating. Page with after = nextAfter until nextAfter is null.
        Read-only; publishes nothing.
      operationId: searchExportProducts
      parameters:
      - name: status
        in: query
        description: Only these statuses (default LIVE)
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - IN_REVIEW
            - PENDING_CATEGORY_APPROVAL
            - LIVE
            - REJECTED
            - PAUSED
            - TAKEN_DOWN
            - PENDING_EXEMPTION
            - MERGED
      - name: after
        in: query
        description: 'Exclusive lower bound: the nextAfter of the previous page'
        required: false
        schema:
          type: string
          format: uuid
      - name: since
        in: query
        description: Only products changed (own data, rating or owner's listing visibility) at or after this instant
        required: false
        schema:
          type: string
          format: date-time
      - name: size
        in: query
        description: Page size, 1 to 200
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SearchExportPage'
  /v1/size-charts:
    get:
      tags:
      - Size charts
      summary: The organisation's size charts, newest change first
      description: Sellers see their own organisation's charts. productTypeId (a product-type category node) or productType
        (its code) keeps the charts made for that type and the ones made for any. Staff may pass ownerOrgId to read one organisation's
        charts; without it they read every organisation's (platform-wide staff only). Retired charts are left out unless includeRetired.
      operationId: listSizeCharts
      parameters:
      - name: ownerOrgId
        in: query
        required: false
        schema:
          type: string
      - name: productTypeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: productType
        in: query
        required: false
        schema:
          type: string
      - name: includeRetired
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SizeChartPage'
    post:
      tags:
      - Size charts
      summary: Write a new size chart
      description: 422 with fieldErrors such as rows[2].values.bust, columns[0].label or name when the chart breaks a rule;
        the name must differ (ignoring case) from the organisation's other active charts.
      operationId: createSizeChart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SizeChartRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SizeChart'
  /v1/size-charts/import:
    post:
      tags:
      - Size charts
      summary: Upload size charts from a .xlsx or .csv file
      description: Rows with the same chart name make one chart. A chart whose name matches one of the organisation's active
        charts is updated (re-uploading the file changes nothing), others are created. Each chart is saved whole or not at
        all. dryRun=true validates and reports without saving (applied=false). 200 with per-row messages (unknown or duplicate
        size, a measurement that is not a number, min above max, a missing value ...); 422 catalog.upload-rejected when the
        file cannot be read at all (format, 10 MB, 5,000 rows, missing Size chart name / Size column, no measurement column).
        Pass productType / productTypeId to say which type the charts are made for (the template's).
      operationId: importSizeCharts
      parameters:
      - name: productTypeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: productType
        in: query
        required: false
        schema:
          type: string
      - name: dryRun
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SizeChartImportReport'
  /v1/size-charts/import-template:
    get:
      tags:
      - Size charts
      summary: Download the size chart upload template
      description: One row per size and one column per measurement. With productType (or productTypeId, a product-type category
        node) the columns are that type's suggested measurements (bust, waist, hip ...); without, a generic template. Any
        extra column a seller adds is a measurement. xlsx has a Size charts sheet, an Instructions and an Example sheet; csv
        has "#" comment lines and the header row.
      operationId: sizeChartImportTemplate
      parameters:
      - name: productTypeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: productType
        in: query
        required: false
        schema:
          type: string
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: xlsx
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /v1/size-charts/suggestions:
    get:
      tags:
      - Size charts
      summary: What a product type suggests for a size chart
      description: The sizes (XS to 3XL ...) and the measurement columns (bust, waist, hip ...) staff configured in the product
        type's sizing trait, to pre-fill the chart editor and offer as size chips. Sellers may use, rename or extend them.
        sized=false for a product type without sizes. Pass productTypeId (a product-type category node) or productType (its
        code).
      operationId: getSizeChartSuggestions
      parameters:
      - name: productTypeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: productType
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SizeChartSuggestions'
  /v1/size-charts/{id}:
    get:
      tags:
      - Size charts
      summary: One size chart
      operationId: getSizeChart
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SizeChart'
    put:
      tags:
      - Size charts
      summary: Replace a size chart's content
      description: Send the version you loaded; 409 catalog.size-chart-changed when it changed since. The products that use
        the chart keep it, so every size they still sell must keep a row (422 on rows). A retired chart cannot be edited.
      operationId: updateSizeChart
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SizeChartRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SizeChart'
    delete:
      tags:
      - Size charts
      summary: Retire a size chart
      description: 'A chart is never deleted: the products that use it keep showing it, but it can no longer be linked to
        products and its name is free again. Returns the retired chart.'
      operationId: retireSizeChart
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SizeChart'
  /v1/size-charts/{id}/duplicate:
    post:
      tags:
