      - images
      - title
      - variants
    TakedownRequest:
      type: object
      description: Reason code required; note required for OTHER
      properties:
        reasonCode:
          type: string
          enum:
          - PROHIBITED_ITEM
          - UNAPPROVED_HEALTH_CLAIM
          - RESTRICTED_INGREDIENT
          - COUNTERFEIT
          - IMAGE_POLICY
          - MISLEADING_CONTENT
          - LABELLING
          - SHIPPING_METHOD
          - DUPLICATE_LISTING
          - WRONG_CATEGORY
          - OTHER
        note:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - reasonCode
    RestoreListingRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
          minLength: 0
    ModerationNote:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - note
    FlagListingRequest:
      type: object
      description: Reason code required; details required for OTHER
      properties:
        reasonCode:
          type: string
