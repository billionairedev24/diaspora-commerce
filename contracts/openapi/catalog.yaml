      - payload
    ProductDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        title:
          type: string
        categoryPath:
          type: string
        payload:
          $ref: '#/components/schemas/JsonNode'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ReportListingRequest:
      type: object
      description: Reason code required; details required for OTHER
      properties:
        reasonCode:
          type: string
          enum:
          - PROHIBITED_ITEM
          - UNAPPROVED_HEALTH_CLAIM
