      tags:
      - Review queue
      summary: Staff queue of no-barcode exemption requests (catalog:moderate)
      description: Oldest first. Each request carries duplicate hints (title, brand and part number similarity) so staff can spot a page that already exists.
      operationId: listGtinExemptions
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ExemptionStatus'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
