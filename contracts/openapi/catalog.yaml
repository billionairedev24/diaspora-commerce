          enum:
          - TEXT
          - MULTILINE
          - ENUM
          - NUMBER
          - BRAND
          - BOOLEAN
          - DECIMAL
          - INTEGER
          - PERCENT
          - FILE
        units:
          type: array
          items:
            type: string
