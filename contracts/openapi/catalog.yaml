          minLength: 0
        gtin:
          type: string
          examples:
          - 09501101530003
          maxLength: 20
          minLength: 0
        sscc:
          type: string
          examples:
          - '106141411234567897'
          maxLength: 20
          minLength: 0
        lot:
          type: string
          maxLength: 20
          minLength: 0
        productionDate:
          type: string
          format: date
        bestBefore:
          type: string
          format: date
        expiry:
          type: string
          format: date
        serial:
          type: string
          maxLength: 20
          minLength: 0
        count:
          type: integer
          format: int32
        caption:
          type: string
          maxLength: 60
          minLength: 0
        title:
          type: string
          maxLength: 200
          minLength: 0
        lines:
          type: array
          items:
            type: string
            maxLength: 120
            minLength: 0
          maxItems: 4
          minItems: 0
        copies:
