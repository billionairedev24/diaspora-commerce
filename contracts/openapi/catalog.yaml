                $ref: '#/components/schemas/GtinExemptionPage'
        '403':
          description: Missing catalog:moderate
  /v1/gtin-exemptions/{id}/decision:
    post:
      tags:
      - Review queue
      summary: Approve or reject a no-barcode exemption with a reason (catalog:moderate)
      description: |
        Approving moves the page from `PENDING_EXEMPTION` to `IN_REVIEW` (never LIVE: the normal review and the tax gate
        still apply). Rejecting rejects the page with the reason. The reason (3 or more characters) is required and the
        decision is audited. 409 `catalog.exemption-decided` when already decided.
      operationId: decideGtinExemption
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExemptionDecisionInput'
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtinExemptionRequest'
        '403':
          description: Missing catalog:moderate
        '404':
          description: catalog.exemption-not-found
        '409':
          description: catalog.exemption-decided
        '422':
          description: A reason of 3 or more characters is required
  /v1/review-queue:
    get:
      tags:
      - Review queue
      summary: One queue for staff - change requests and no-barcode exemptions, with age and SLA (catalog:moderate)
      description: |
        Merged, oldest first, server-side paging. Held images are listed by media-service (`GET /v1/assets?status=FLAGGED`)
        and are not part of this response yet. `overdue` is true when the item is past its SLA; the gauge
        `catalog_change_request_open` and `catalog_change_request_oldest_age_seconds` back the alert at 3 business days.
      operationId: reviewQueue
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - CHANGE_REQUEST
          - GTIN_EXEMPTION
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueuePage'
        '403':
          description: Missing catalog:moderate
  /v1/public/products/{atin}/redirect:
    get:
      tags:
      - Public catalog
      summary: Where an ATIN went after two duplicate pages were merged
      description: Anonymous. 200 with the surviving page ATIN, 404 when the ATIN was never merged away.
      operationId: atinRedirect
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
          pattern: AT[0-9A-Z]{8}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtinRedirect'
        '404':
          description: catalog.redirect-not-found
  /v1/catalog/settings:
    get:
      tags:
      - Catalog settings
      summary: Matching, exemption and review-queue settings (catalog:moderate)
      description: Every threshold of S381 to S387 lives here and is editable by staff; nothing is hard-coded. Defaults come from configuration until staff save a value.
      operationId: getCatalogSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPolicySettings'
        '403':
          description: Missing catalog:moderate
    put:
      tags:
      - Catalog settings
      summary: Save the settings (catalog:moderate, audited by `updatedBy` and `version`)
      description: 409 `catalog.concurrent-update` when `version` is stale; 422 for an invalid value (for example a reserved prefix that is not digits).
      operationId: updateCatalogSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogPolicySettings'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPolicySettings'
        '403':
          description: Missing catalog:moderate
        '409':
          description: catalog.concurrent-update
        '422':
          description: Invalid value
components:
  schemas:
    ListingDetails:
      type: object
      description: Description, condition, search keywords, fulfilment, package, handling time and ship-from, and the seller's tax behaviour facts
      properties:
        sellerBehaviour:
          type: object
          description: 'Behaviour facts of this seller''s listing (owner OFFER): sold_heated, heated_by_seller, utensils_provided. seller_is_bakery comes from the seller profile.'
          additionalProperties: {}
        description:
          type: string
          maxLength: 5000
          minLength: 0
        condition:
          type: string
          enum:
          - NEW
          - RENEWED
          - USED_LIKE_NEW
          - USED_VERY_GOOD
          - USED_GOOD
          - USED_ACCEPTABLE
        keywords:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 0
          maxItems: 20
          minItems: 0
        fulfilment:
          type: string
          enum:
          - SELLER
          - AFROTRANSACT
        packaging:
          $ref: '#/components/schemas/PackageDimensions'
        handlingDays:
          type: integer
          format: int32
          description: Business days from order to dispatch, 1–30 (default 2)
        shipFrom:
          $ref: '#/components/schemas/ShipFrom'
        sizeChartId:
          type: string
          format: uuid
          description: The seller's size chart for this product (POST /v1/size-charts). Required when the product type's sizing
            trait says sizeChartRequired; every size the variants sell needs a row in it. Must be a chart of the same organisation.
        fitNote:
          type: string
          description: How the sizes fit; shown beside the size chart (defaults to the chart's own fit note)
          enum:
          - RUNS_SMALL
          - TRUE_TO_SIZE
          - RUNS_LARGE
        dangerousGoods:
          type: boolean
          description: The dangerous goods answer (aerosol, flammable, battery, candle, cleaner). Required where the category's rules ask the question, ignored elsewhere. true marks the listing; fulfilment by AfroTransact and carrier-gated flows read it.
        documents:
          type: array
          description: Documents uploaded on the form. Kept and marked PENDING_REVIEW for the approval engine; they never block the listing here.
          items:
            $ref: '#/components/schemas/ListingDocument'
          maxItems: 20
        exemptions:
          type: object
          description: Rule field id to the reason the seller cannot provide a field the rules mark required_or_exemption
          additionalProperties:
            type: string
            maxLength: 300
