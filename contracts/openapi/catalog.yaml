openapi: 3.1.0
info:
  title: Catalog API
  description: Products (ATIN/GTIN), variants, category tree, product-type schemas and category requests.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8101
  description: local
- url: https://api-dev.afrotransact.com/catalog
  description: dev
- url: https://api-uat.afrotransact.com/catalog
  description: uat
- url: https://api.afrotransact.com/catalog
  description: prod
security:
- bearer: []
tags:
- name: Catalog matching
  description: 'One lookup from a barcode or a brand with a part number to the existing product page (S381, S383): the seller sells an offer on the page and never edits its content'
- name: Change requests
  description: Suggest an edit, report a wrong match or a duplicate page (S385). Staff decide; the page is never changed by the request itself.
- name: Review queue
  description: Staff review of change requests and no-barcode exemptions with age and SLA (S386, catalog:moderate)
- name: GTIN exemptions
  description: Selling an item without a barcode (S387); brand-gated categories and known GS1 brands need staff approval
- name: Catalog settings
  description: Staff-editable thresholds for matching, exemptions and the review queue
- name: Selling approvals (internal)
  description: 'Service-to-service: seller-service migrates the old bakery answer.'
- name: Seller scope
  description: The departments the signed-in seller's organisation may list in. Creating or changing anything in another department is refused with 403 catalog.department-not-allowed (or catalog.no-departments); 503 catalog.scope-unavailable when seller-service cannot be asked.
- name: Public catalog
  description: Anonymous reads of live products (storefront, cart, search)
- name: Categories
  description: Browse tree, product-type schemas and new-category requests
- name: Labels
  description: 'Barcode labels (S032): Code 128, GS1-128 and EAN-13 as SVG, PNG, ZPL or PDF'
- name: Products
  description: Product builder, listing moderation and lookup
- name: Product drafts
  description: Autosaved drafts of the one-step product form (S307)
- name: Identifiers
  description: GTIN / ISBN checks and GTIN prefill for the product builder, GTIN lookups by service clients
- name: Listing reports
  description: Shoppers report a live listing (signed in); reports reach the trust-ops moderation queue through catalog.product.flagged
- name: Product reviews
  description: 'Verified-purchase ratings and reviews (S324): customers who received a product review it once, public reads
    of the published reviews and the rating, and reports'
- name: Seller reviews
  description: The product owner sees the published reviews of its products and replies once to each (catalog:write). Sellers
    cannot edit or hide a review; they can report it.
- name: Search export
  description: Read-only enumeration of products for rebuilding the search index (indexer reindex command)
- name: Review moderation
  description: Trust and safety staff and the trust-ops service client (catalog:moderate) approve, reject and remove product
    reviews. Decisions are idempotent; the product's rating follows each decision.
- name: Image quality
  description: 'Existing listings against the enforced main-image rules: the Improve your image task, the staff report and the hide step (S392)'
- name: Image library
  description: 'Library images (media) matched to listings by SKU file names: attach matching images, image usage (S310)'
- name: Bulk upload
  description: 'Upload templates, .xlsx/.csv uploads with row validation, preview, error report and the background import
    (S308). Limits: 10 MB and 5,000 rows per file'
- name: Taxonomy (back office)
  description: Staff create, rename, move, reorder and retire departments, categories and product types, and edit each product
    type's attributes (catalog:taxonomy)
- name: Brands (back office)
  description: 'Staff review the brands sellers typed in and keep the brand registry: approve, reject, merge, edit name and
    scope, add and retire (catalog:taxonomy)'
- name: Brands
  description: The brands the product form offers for a category, and typing in a brand that is not listed (S326)
- name: Size charts
  description: Size charts sellers write and reuse on their sized products (fashion). Sellers create, edit, duplicate and
    retire their own charts; staff can read but not change them. Staff only mark which product types are sized (the sizing
    trait of /v1/taxonomy/product-types).
paths:
  /v1/brands:
    get:
      tags:
      - Brands
      summary: Brands for the product form's brand combobox
      description: Approved brands whose scope covers the category or product type (or an ancestor of it), plus the organisation's
        own pending brands there; the organisation's most used first, then the most popular. Never brands of unrelated departments.
        422 when neither category nor productType is sent. q ignores case, accents and punctuation.
      operationId: listBrands
      parameters:
      - name: productType
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
          minLength: 0
      - name: category
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
          minLength: 0
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          minLength: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BrandList'
    post:
      tags:
      - Brands
      summary: Add a brand the seller typed (pending staff review)
      description: Returns the existing brand (created=false) when the registry already has this name in the category, ignoring
        case, accents and punctuation. Otherwise creates a PENDING brand scoped to the category's department, usable at once
        by this organisation. 201 when created, 200 for a match.
      operationId: createBrand
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreatedBrand'
  /v1/categories:
    get:
      tags:
      - Categories
      summary: Full active category tree (department › category › product type)
      description: includeRetired=true also lists retired nodes, for consumers that resolve the category of an existing product.
        forSeller=true (signed in, catalog:write) limits the tree to the departments the caller's organisation may sell in; 503
        catalog.scope-unavailable when seller-service cannot say.
      operationId: tree
      parameters:
      - name: includeRetired
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: forSeller
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNode'
  /v1/category-requests:
    get:
      tags:
      - Categories
      summary: Review queue of category requests (catalog:taxonomy)
      operationId: queue
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_REVIEW
          - APPROVED
          - REJECTED
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRequest'
    post:
      tags:
      - Categories
      summary: Request a new category (products can be built against it right away)
      operationId: request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/mine:
    get:
      tags:
      - Categories
      summary: My organisation's category requests
      operationId: sellerCatalogScope
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/{id}:
    get:
      tags:
      - Categories
      summary: One category request with the products waiting on it (catalog:taxonomy)
      operationId: requestDetail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequestDetail'
  /v1/category-requests/{id}/approval-preview:
    post:
      tags:
      - Categories
      summary: What approving would create, without creating it (catalog:taxonomy)
      operationId: previewApproval
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApprovalPlan'
  /v1/category-requests/{id}/approve:
    post:
      tags:
      - Categories
      summary: Approve a category request, creating its category and product type in one step; waiting products move into
        listing review
      operationId: approve_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/{id}/reject:
    post:
      tags:
      - Categories
      summary: Reject a category request; waiting products are rejected with the note
      operationId: reject_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/identifiers/gtin/{code}:
    get:
      tags:
      - Identifiers
      summary: Validate a GTIN and find an existing product page that already uses it
      description: Needs catalog:read (service tokens such as offers-service, any principal type) or catalog:write (sellers
        in the product builder).
      operationId: check
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: isbn
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GtinCheck'
  /v1/identifiers/gtin/{code}/prefill:
    get:
      tags:
      - Identifiers
      summary: Prefill the product builder from a GTIN (GS1, Open Food Facts)
      description: Validates the GTIN-8/12/13/14 check digit (422 with a suggested fix), then asks the product-data providers
        in order (GS1 Verified when configured, then Open Food Facts for groceries) and returns title, brand, net content,
        images and category hints in our taxonomy. `importedFrom` marks imported fields (they stay editable); `found=false`
        means manual entry. When a product page already uses the GTIN, `existingAtin` is set and no provider is called. Answers
        are cached per GTIN. Needs catalog:write or catalog:read.
      operationId: prefillGtin
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GtinPrefill'
  /v1/products/image-tasks:
    get:
      tags:
      - Image quality
      summary: My Improve your image tasks
      description: The organisation's live listings whose main image passes with a warning (IMPROVE) or breaks a rule (FAIL), failing
        ones first, with the reasons in plain words and, for failing ones, the end of the grace period (60 days by default). Live
        listings stay live; after the grace period they are limited only when the owner has switched the hide step on. Nothing is
        deleted and the listing can still be edited; a new main image must pass the rules.
      operationId: listImageTasks
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageTaskList'
  /v1/image-quality/report:
    get:
      tags:
      - Image quality
      summary: Image quality report (staff, catalog:moderate)
      description: Listings per state, how many are not scored yet, the reasons, the failing listings and how many the hide step would
        limit now (a dry run; read it on the seeded catalog before the hide flag is enabled).
      operationId: imageQualityReport
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageQualityReport'
  /v1/image-quality/rescore:
    post:
      tags:
      - Image quality
      summary: Score the next batch of listings now (staff, catalog:moderate)
      description: The back-fill job runs by itself (a batch per interval, resumable, rate limited); this runs one batch at once.
      operationId: rescoreImagesNow
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageRescoreResult'
  /v1/image-quality/hide:
    post:
      tags:
      - Image quality
      summary: The hide step (staff, catalog:moderate)
      description: With dryRun=true (the default) only counts the failing listings past the grace period. Without it the step runs
        only when at.catalog.images.hide-failing is on (a separate flag, off until the owner switches it on); it never deletes anything.
      operationId: hideFailingImages
      parameters:
      - name: dryRun
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageHideResult'
  /v1/image-library/attach:
    post:
      tags:
      - Image library
      summary: Attach matching library images to the organisation's listings by SKU
      description: 'Looks up the organisation''s library images (media) for the SKUs of its listings (all, or those in skus)
        and applies them: SKU.MAIN and SKU.PT01-PT08 of the first of a product''s SKUs that has a MAIN image replace the product
        images in that order; on products with several variants a variant SKU''s MAIN sets that variant''s image. Images held
        by moderation are skipped. Each changed product is validated again like an edit (catalog.product.updated); taken-down
        listings and products whose new main image media rejects or holds (under 1000 px on its longest side, not on white, ...)
        are skipped with media''s plain reason. Products without matches are
        left unchanged. 503 catalog.media-unavailable when media cannot be reached.'
      operationId: attachLibraryImages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachLibraryImagesRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttachLibraryImagesResult'
  /v1/image-library/usage:
    post:
      tags:
      - Image library
      summary: Which of the organisation's SKUs use these image URLs, and which of these SKUs exist
      description: For the image library page (used by). An image counts for every SKU of a product whose images include it
        and for the variant whose image or swatch it is.
      operationId: imageUsage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUsageRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageUsage'
  /v1/imports:
    get:
      tags:
      - Bulk upload
      summary: The organisation's uploads, newest first (upload history)
      operationId: listImports
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImportPage'
    post:
      tags:
      - Bulk upload
      summary: Upload and validate a .xlsx or .csv file
      description: 'Every row is validated (required fields, allowed values, numbers and units, GTIN check digit, duplicate
        SKUs in the file and against the organisation''s listings, image URL format). 422 catalog.upload-rejected when the
        file cannot be read (format, 10 MB (25 MB for PRICE_QTY), 5,000 rows (50,000 for PRICE_QTY), missing required columns);
        nothing is stored then. mode=OFFER matches each row to an existing page (barcode, ATIN or brand and part number)
        and PRICE_QTY reads a price and quantity feed (S393, S394). 409 catalog.import-already-running (one active upload
        per mode) and catalog.import-daily-limit (20 a day). fileSha256 and sameFileAs say when the organisation uploaded
        the same file before. Starts nothing: see POST /v1/imports/{id}/start.'
      operationId: uploadImport
      parameters:
      - name: mode
        in: query
        required: false
        schema:
          type: string
          default: CREATE
          enum:
          - CREATE
          - UPDATE
          - OFFER
          - PRICE_QTY
      - name: productType
        in: query
        required: false
        schema:
          type: string
      - name: uploadedByName
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImport'
  /v1/imports/template:
    get:
      tags:
      - Bulk upload
      summary: Download an upload template
      description: 'Generated from the product type definitions: a product type''s template (productType, or the product type
        of categoryId) or the generic one. xlsx: Products sheet with required columns marked *, a note per column and dropdowns;
        Instructions, Example and hidden Lists sheets. csv: "#" comment lines and the header row.'
      operationId: importTemplate
      parameters:
      - name: productType
        in: query
        required: false
        schema:
          type: string
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: mode
        in: query
        required: false
        description: 'OFFER (sell products already on AfroTransact: barcode, ATIN or brand and part number, with price, quantity, condition, shipping and handling; no image, title or attribute columns) and PRICE_QTY (seller SKU or ATIN with price, list price and quantity) are generated server-side and do not depend on a category (S393, S394)'
        schema:
          type: string
          default: CREATE
          enum:
          - CREATE
          - UPDATE
          - OFFER
          - PRICE_QTY
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: xlsx
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /v1/imports/{id}:
    get:
      tags:
      - Bulk upload
      summary: An upload with its validation counts and import progress
      operationId: getImport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImport'
  /v1/imports/{id}/report:
    get:
      tags:
      - Bulk upload
      summary: Download the error report
      description: The uploaded rows with Row, Row status, Result and Errors columns; cells starting with = + - @ are prefixed
        with ' (formula injection)
      operationId: importReport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: xlsx
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /v1/imports/{id}/rows:
    get:
      tags:
      - Bulk upload
      summary: Rows of an upload (preview)
      description: In file order; status filters the preview (ERROR = errors only), outcome the import result
      operationId: importRows
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - VALID
          - WARNING
          - ERROR
      - name: outcome
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - CREATED
          - UPDATED
          - FAILED
          - SKIPPED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImportRowPage'
  /v1/imports/{id}/start:
    post:
      tags:
      - Bulk upload
      summary: Start the import
      description: Runs in the background (poll GET /v1/imports/{id}); resumable and idempotent per row. 409 catalog.import-has-errors
        when rows have errors and validOnly is false; starting again returns the upload as it is.
      operationId: startImport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartImportRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImport'
  /v1/internal/bakery-claims:
    get:
      tags:
      - Selling approvals (internal)
      summary: Organisations whose listings say the seller is a bakery (service scope catalog:bakery-claims.read)
      description: seller-service opens a PENDING food service application for each; the answer is never auto-approved.
      operationId: bakeryClaims
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BakeryClaims'
  /v1/labels:
    post:
      tags:
      - Labels
      summary: Render one label
      description: Needs catalog:write or catalog:read. Invalid data (GTIN / SSCC check digits, GS1 AI rules, too long for
        the label) is a 422 with fieldErrors.
      operationId: renderLabel
      parameters:
      - name: format
        in: query
        description: SVG (vector label), PNG (bare symbol, no text), ZPL (Zebra, 203 dpi), PDF (one page per label, or a sheet)
        required: false
        schema:
          type: string
          default: SVG
          enum:
          - SVG
          - PNG
          - ZPL
          - PDF
      - name: layout
        in: query
        required: false
        schema:
          type: string
          enum:
          - LABEL
          - SHEET
      - name: paper
        in: query
        required: false
        schema:
          type: string
          enum:
          - LETTER
          - A4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
        required: true
      responses:
        '200':
          description: The label
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
            application/pdf:
              schema:
                type: string
                format: binary
  /v1/labels/batch:
    post:
      tags:
      - Labels
      summary: Render a batch of labels as one PDF or ZPL
      description: Up to 500 labels and 2000 printed labels (copies included). Field errors are keyed labels[i].field. Needs
        catalog:write or catalog:read.
      operationId: renderLabelBatch
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: PDF
          enum:
          - PDF
          - ZPL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelBatchRequest'
        required: true
      responses:
        '200':
          description: The labels
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
  /v1/labels/units/{atin}:
    get:
      tags:
      - Labels
      summary: Unit label of a product or variant ATIN
      description: 'Platform (AfroTransact Retail) stock with a vendor GTIN keeps the manufacturer barcode; every other unit
        gets the stock owner''s AT-FN code (ATF + 7, Code 128), issued once per owner and variant. Sellers print for their
        own organisation; staff and service clients may pass orgId (default: the product''s owner). Needs catalog:write; service
        clients (inventory-service) and staff may use catalog:read. The AT-FN code is returned as data in the X-Unit-Label-Code
        header (absent for manufacturer barcodes).'
      operationId: unitLabel
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: SVG (vector label), PNG (bare symbol, no text), ZPL (Zebra, 203 dpi), PDF (one page per label, or a sheet)
        required: false
        schema:
          type: string
          default: SVG
          enum:
          - SVG
          - PNG
          - ZPL
          - PDF
      - name: copies
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The unit label
          headers:
            X-Unit-Label-Code:
              description: AT-FN code of the unit label (absent for a manufacturer barcode)
              style: simple
              schema:
                type: string
                pattern: ^ATF[0-9A-Z]{7}$
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
            application/pdf:
              schema:
                type: string
                format: binary
  /v1/product-drafts:
    get:
      tags:
      - Product drafts
      summary: The organisation's drafts, most recently saved first
      description: 'Server-driven: q searches title and category path, kind=new leaves out the unsaved edits of existing products, sort is updatedAt|title|categoryPath[,asc|desc] (default updatedAt,desc), page is 0-based, size is at most 100. The body stays a plain array; X-Total-Count is the number of drafts matching q and kind.'
      operationId: listDrafts
      parameters:
      - name: q
        in: query
        required: false
        description: Search over title and category path
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: new = drafts of products not created yet; all (default) = every draft
        schema:
          type: string
          default: all
      - name: sort
        in: query
        required: false
        description: updatedAt | title | categoryPath, optionally ,asc or ,desc
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              description: Drafts matching q and kind, in all pages
              schema:
                type: integer
                format: int64
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDraftSummary'
    post:
      tags:
      - Product drafts
      summary: Save a new draft (Save draft, or the first autosave)
      operationId: createDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDraft'
  /v1/product-drafts/{id}:
    get:
      tags:
      - Product drafts
      summary: Get a draft with its payload
      operationId: getDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDraft'
    put:
      tags:
      - Product drafts
      summary: Autosave a draft
      description: 409 catalog.draft-changed when the draft was saved elsewhere since version
      operationId: saveDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDraft'
    delete:
      tags:
      - Product drafts
      summary: Discard a draft
      operationId: deleteDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
  /v1/product-reviews:
