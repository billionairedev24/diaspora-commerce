    CreateProductRequest:
      type: object
      description: 'Exactly one of categoryId or categoryRequestId. variationTheme empty (or absent) = a product without variations:
        exactly one variant without options'
      properties:
        categoryId:
          type: string
          format: uuid
        categoryRequestId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
          minLength: 10
        attributes:
          type: object
          additionalProperties:
            type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          maxItems: 10
          minItems: 0
        variationTheme:
          type: string
          maxLength: 60
          minLength: 0
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantRequest'
          maxItems: 200
          minItems: 0
        currency:
          type: string
          maxLength: 3
          minLength: 3
