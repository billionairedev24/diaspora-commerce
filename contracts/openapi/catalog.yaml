      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{atin}/reviews:
    post:
      tags:
      - Product reviews
      summary: Review a product I received (signed-in customer)
      description: 403 catalog.review-not-verified-purchase without a delivered order line for the product; 409 catalog.review-already-exists
        the second time. The review is published at once or, when the automatic checks (profanity, links, personal data) flag
        it, waits for moderation (status PENDING). Publishes catalog.review.published or catalog.review.submitted.
      operationId: writeProductReview
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteReviewRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnReview'
  /v1/products/{atin}/reviews/mine:
    get:
      tags:
      - Product reviews
      summary: 'My standing with a product: may I review it, and my review (signed-in customer)'
      description: eligible is true when orders-service says the customer received the product and they have no live review
        yet. A review in any state is returned, with the moderation reason when it was refused or removed. 503 catalog.purchase-check-unavailable
        when orders cannot answer.
      operationId: myProductReview
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MyReview'
    put:
      tags:
      - Product reviews
      summary: Edit my review within 30 days (signed-in customer)
      description: The checks run again. 409 catalog.review-edit-window-closed after the window. An edit of a rejected or
        removed review always goes back to moderation.
      operationId: editProductReview
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditReviewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnReview'
    delete:
      tags:
      - Product reviews
      summary: Delete my review (signed-in customer)
      description: Any time. The rating is recomputed; the customer can review the product again.
      operationId: deleteProductReview
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/taxonomy/import:
    post:
      tags:
      - Taxonomy (back office)
      summary: Import the category tax tree (idempotent, audited; catalog:taxonomy)
      description: 'Loads departments, categories (taxProfileId, taxStatus), product types and the tax questions of every category from the category tax dataset (tools/taxonomy/category_tax_map.json, bundled with the service, or the posted `dataset`). Creates what is missing and refreshes the tax questions; names, placement, statuses and detail questions staff changed are left alone unless `force` is set. `dryRun` reports without writing. Every run that changes something is audited with the reason.'
      operationId: importTaxonomy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                dataset:
                  type: object
                  additionalProperties: true
                  description: The JSON of category_tax_map.json; omitted = the bundled dataset
                dryRun:
                  type: boolean
                force:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
      responses:
        '200':
          description: What the import did or would do
          content:
            application/json:
              schema:
                type: object
                properties:
                  ruleVersion:
                    type: string
                  dryRun:
                    type: boolean
                  force:
                    type: boolean
                  departments:
                    type: integer
                  categories:
                    type: integer
                  productTypes:
                    type: integer
                  createdNodes:
                    type: integer
                  updatedNodes:
                    type: integer
                  unchangedNodes:
                    type: integer
                  createdTypes:
                    type: integer
                  updatedTypes:
                    type: integer
                  notes:
                    type: array
                    items:
                      type: string
        '422':
          description: A reason is needed
  /v1/image-library/sku-list:
    get:
      tags:
      - Image library
      summary: Download my SKU list (CSV)
      description: 'One line per variant of the organisation: SKU, whether the service generated it, ATIN, barcode, title and options. Name library image files after the SKU (SKU.MAIN.jpg, SKU.PT01.jpg); bulk updates match by SKU, else GTIN, else ATIN.'
      operationId: downloadSkuList
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
  /v1/tax-evidence/{id}/file:
    get:
      tags:
      - Products
      summary: The stored file of an evidence record (owner or staff)
      operationId: downloadTaxEvidenceFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The file (PDF, JPEG or PNG)
  /v1/products/{id}/tax-readiness:
    get:
      tags:
      - Products
      summary: Tax publish gate of a product, per variant (owner or staff)
      description: 'Calls tax-returns POST /v1/tax/classifications/resolve for every variant with its facts and the seller''s behaviour facts. A product goes live only when status is READY. Missing facts are listed in plain words; the tax is never guessed (TX-10).'
      operationId: productTaxReadiness
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxReadiness'
  /v1/tax-gate/live-without-decision:
    get:
      tags:
      - Products
      summary: Live listings without a resolved tax decision (staff, tax:read)
      description: 'The audit behind catalog_live_without_tax_decision: live products that have a variant whose tax gate is not READY or that tax-returns does not answer RESOLVED for. Always empty when the publish gate holds; the sweep closes anything listed here (POST /v1/tax-gate/sweep runs it now).'
      operationId: liveWithoutTaxDecision
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveWithoutTaxDecisionPage'
  /v1/tax-gate/sweep:
    post:
      tags:
      - Products
      summary: Run the tax gate sweep now (staff, tax:classify-admin)
      description: The repair path behind the scheduled sweep. Closes every live listing whose variants tax-returns (the decision checkout reads) does not answer RESOLVED for, re-reports facts tax-returns has no record of so they reach the Tax review queue, and reopens held listings that are now resolved. Safe to repeat.
      operationId: runSweep
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxGateSweepResult'
  /v1/variants/{atin}/tax-evidence:
    post:
      tags:
      - Products
      summary: Upload the proof for an exemption fact (label photo, Drug Facts, Supplement Facts)
      description: 'Stored with the variant and shown to tax review. Allowed: PDF, JPEG, PNG up to 10 MB. Re-uploading a fact adds a version; earlier files are kept for audit.'
      operationId: uploadTaxEvidence
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                factId:
                  type: string
                file:
                  type: string
                  format: binary
              required:
              - factId
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxEvidence'
        '422':
          description: catalog.tax-evidence-invalid (not an evidence fact, wrong type or too large)
    get:
      tags:
      - Products
      summary: The evidence files of a variant (owner or staff)
      operationId: listTaxEvidence
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxEvidence'
  /v1/products/{id}:
    get:
      tags:
      - Products
      summary: Get a product by id
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
    put:
      tags:
      - Products
      summary: Edit a product (one-step form in edit mode)
      description: Owner or staff. The whole content is validated again; variants are matched by sellerSku, else GTIN, else ATIN (new variants get ATINs and, when sellerSku is empty, a generated one;
        a published listing keeps its category and variants). A rejected listing goes back to review. Publishes catalog.product.updated,
        plus catalog.product.terms_changed when prices, quantities or listing terms changed and catalog.product.resubmitted
        when a rejected listing is resubmitted. 409 when version is stale.
      operationId: updateProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/approve:
    post:
      tags:
      - Products
      summary: Approve a product in review (catalog:moderate)
      description: Only a product in review can be approved, and only through the selling approval and the tax gate. Any other
        status (already live, say) is a 409 with a plain message and changes nothing.
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/flags:
    post:
      tags:
      - Products
      summary: Flag a live listing for review (catalog:moderate)
      description: Staff flags are source STAFF; service clients (principal type SERVICE) are AUTOMATED. Publishes catalog.product.flagged;
        trust-ops queues it as a live-listing moderation item.
      operationId: flag
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
