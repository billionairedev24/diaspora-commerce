          type: string
          description: 'Unit of a DECIMAL or PERCENT value, e.g. oz or %'
        section:
          type: string
          enum:
          - DETAILS
          - FOOD
          - REGULATED
          - TAX
        help:
          type: string
        applies:
          type: boolean
