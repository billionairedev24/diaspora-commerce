openapi: 3.1.0
info:
  title: Catalog API
  description: Products (ATIN/GTIN), variants, category tree, product-type schemas and category requests.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8101
  description: local
- url: https://api.dev.afrotransact.com/catalog
  description: dev
- url: https://api.uat.afrotransact.com/catalog
  description: uat
- url: https://api.afrotransact.com/catalog
  description: prod
security:
- bearer: []
tags:
- name: Public catalog
  description: Anonymous reads of live products (storefront, cart, search)
- name: Categories
  description: Browse tree, product-type schemas and new-category requests
- name: Labels
  description: 'Barcode labels (S032): Code 128, GS1-128 and EAN-13 as SVG, PNG, ZPL or PDF'
- name: Products
  description: Product builder, listing moderation and lookup
- name: Product drafts
  description: Autosaved drafts of the one-step product form (S307)
- name: Identifiers
  description: GTIN / ISBN checks and GTIN prefill for the product builder, GTIN lookups by service clients
- name: Listing reports
  description: Shoppers report a live listing (signed in); reports reach the trust-ops moderation queue through catalog.product.flagged
- name: Product reviews
  description: 'Verified-purchase ratings and reviews (S324): customers who received a product review it once, public reads
    of the published reviews and the rating, and reports'
- name: Seller reviews
  description: The product owner sees the published reviews of its products and replies once to each (catalog:write). Sellers
    cannot edit or hide a review; they can report it.
- name: Review moderation
  description: Trust and safety staff and the trust-ops service client (catalog:moderate) approve, reject and remove product
    reviews. Decisions are idempotent; the product's rating follows each decision.
- name: Image library
  description: 'Library images (media) matched to listings by SKU file names: attach matching images, image usage (S310)'
- name: Bulk upload
  description: 'Upload templates, .xlsx/.csv uploads with row validation, preview, error report and the background import
    (S308). Limits: 10 MB and 5,000 rows per file'
paths:
  /v1/categories:
    get:
      tags:
      - Categories
      summary: Full active category tree (department › category › product type)
      operationId: tree
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNode'
  /v1/category-requests:
    get:
      tags:
      - Categories
      summary: Review queue of category requests (catalog:taxonomy)
      operationId: queue
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_REVIEW
          - APPROVED
          - REJECTED
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRequest'
    post:
      tags:
      - Categories
      summary: Request a new category (products can be built against it right away)
      operationId: request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/mine:
    get:
      tags:
      - Categories
      summary: My organisation's category requests
      operationId: mine
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/{id}/approve:
    post:
      tags:
      - Categories
      summary: Approve a category request; waiting products move into listing review
      operationId: approve_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/{id}/reject:
    post:
      tags:
      - Categories
      summary: Reject a category request; waiting products are rejected with the note
      operationId: reject_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/identifiers/gtin/{code}:
    get:
      tags:
      - Identifiers
      summary: Validate a GTIN and find an existing product page that already uses it
      description: Needs catalog:read (service tokens such as offers-service, any principal type) or catalog:write (sellers
        in the product builder).
      operationId: check
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: isbn
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GtinCheck'
  /v1/identifiers/gtin/{code}/prefill:
    get:
      tags:
      - Identifiers
      summary: Prefill the product builder from a GTIN (GS1, Open Food Facts)
      description: Validates the GTIN-8/12/13/14 check digit (422 with a suggested fix), then asks the product-data providers
        in order (GS1 Verified when configured, then Open Food Facts for groceries) and returns title, brand, net content,
        images and category hints in our taxonomy. `importedFrom` marks imported fields (they stay editable); `found=false`
        means manual entry. When a product page already uses the GTIN, `existingAtin` is set and no provider is called. Answers
        are cached per GTIN. Needs catalog:write or catalog:read.
      operationId: prefillGtin
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GtinPrefill'
  /v1/image-library/attach:
    post:
      tags:
      - Image library
      summary: Attach matching library images to the organisation's listings by SKU
      description: 'Looks up the organisation''s library images (media) for the SKUs of its listings (all, or those in
        skus) and applies them: SKU.MAIN and SKU.PT01-PT08 of the first of a product''s SKUs that has a MAIN image
        replace the product images in that order; on products with several variants a variant SKU''s MAIN sets that
        variant''s image. Images held by moderation are skipped. Each changed product is validated again like an edit
        (catalog.product.updated); taken-down listings and products whose new main image is under 1000 px are skipped
        with a reason. Products without matches are left unchanged. 503 catalog.media-unavailable when media cannot
        be reached.'
      operationId: attachLibraryImages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachLibraryImagesRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttachLibraryImagesResult'
  /v1/image-library/usage:
    post:
      tags:
      - Image library
      summary: Which of the organisation's SKUs use these image URLs, and which of these SKUs exist
      description: For the image library page (used by). An image counts for every SKU of a product whose images
        include it and for the variant whose image or swatch it is.
      operationId: imageUsage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUsageRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ImageUsage'
  /v1/brands:
    get:
      tags:
      - Products
      summary: Brands for the product form's brand combobox
      description: The organisation's brands (from its products' brand attribute) with how many of its products use
        each, most used first; q filters by prefix of the name or of a word (case-insensitive).
      operationId: listBrands
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BrandList'
  /v1/imports:
    get:
      tags:
      - Bulk upload
      summary: The organisation's uploads, newest first (upload history)
      operationId: listImports
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImportPage'
    post:
      tags:
      - Bulk upload
      summary: Upload and validate a .xlsx or .csv file
      description: 'Every row is validated (required fields, allowed values, numbers and units, GTIN check digit, duplicate
        SKUs in the file and against the organisation''s listings, image URL format). 422 catalog.upload-rejected when the
        file cannot be read (format, 10 MB, 5,000 rows, missing required columns); nothing is stored then. Starts nothing:
        see POST /v1/imports/{id}/start.'
      operationId: uploadImport
      parameters:
      - name: mode
        in: query
        required: false
        schema:
          type: string
          default: CREATE
          enum:
          - CREATE
          - UPDATE
      - name: productType
        in: query
        required: false
        schema:
          type: string
      - name: uploadedByName
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImport'
  /v1/imports/template:
    get:
      tags:
      - Bulk upload
      summary: Download an upload template
      description: 'Generated from the product type definitions: a product type''s template (productType, or the product type
        of categoryId) or the generic one. xlsx: Products sheet with required columns marked *, a note per column and dropdowns;
        Instructions, Example and hidden Lists sheets. csv: "#" comment lines and the header row.'
      operationId: importTemplate
      parameters:
      - name: productType
        in: query
        required: false
        schema:
          type: string
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: xlsx
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /v1/imports/{id}:
    get:
      tags:
      - Bulk upload
      summary: An upload with its validation counts and import progress
      operationId: getImport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImport'
  /v1/imports/{id}/report:
    get:
      tags:
      - Bulk upload
      summary: Download the error report
      description: The uploaded rows with Row, Row status, Result and Errors columns; cells starting with = + - @ are prefixed
        with ' (formula injection)
      operationId: importReport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: xlsx
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /v1/imports/{id}/rows:
    get:
      tags:
      - Bulk upload
      summary: Rows of an upload (preview)
      description: In file order; status filters the preview (ERROR = errors only), outcome the import result
      operationId: importRows
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - VALID
          - WARNING
          - ERROR
      - name: outcome
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - CREATED
          - UPDATED
          - FAILED
          - SKIPPED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImportRowPage'
  /v1/imports/{id}/start:
    post:
      tags:
      - Bulk upload
      summary: Start the import
      description: Runs in the background (poll GET /v1/imports/{id}); resumable and idempotent per row. 409 catalog.import-has-errors
        when rows have errors and validOnly is false; starting again returns the upload as it is.
      operationId: startImport
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartImportRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductImport'
  /v1/labels:
    post:
      tags:
      - Labels
      summary: Render one label
      description: Needs catalog:write or catalog:read. Invalid data (GTIN / SSCC check digits, GS1 AI rules, too long for
        the label) is a 422 with fieldErrors.
      operationId: renderLabel
      parameters:
      - name: format
        in: query
        description: SVG (vector label), PNG (bare symbol, no text), ZPL (Zebra, 203 dpi), PDF (one page per label, or a sheet)
        required: false
        schema:
          type: string
          default: SVG
          enum:
          - SVG
          - PNG
          - ZPL
          - PDF
      - name: layout
        in: query
        required: false
        schema:
          type: string
          enum:
          - LABEL
          - SHEET
      - name: paper
        in: query
        required: false
        schema:
          type: string
          enum:
          - LETTER
          - A4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
        required: true
      responses:
        '200':
          description: The label
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
            application/pdf:
              schema:
                type: string
                format: binary
  /v1/labels/batch:
    post:
      tags:
      - Labels
      summary: Render a batch of labels as one PDF or ZPL
      description: Up to 500 labels and 2000 printed labels (copies included). Field errors are keyed labels[i].field. Needs
        catalog:write or catalog:read.
      operationId: renderLabelBatch
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: PDF
          enum:
          - PDF
          - ZPL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelBatchRequest'
        required: true
      responses:
        '200':
          description: The labels
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
  /v1/labels/units/{atin}:
    get:
      tags:
      - Labels
      summary: Unit label of a product or variant ATIN
      description: 'Platform (AfroTransact Retail) stock with a vendor GTIN keeps the manufacturer barcode; every other unit
        gets the stock owner''s AT-FN code (ATF + 7, Code 128), issued once per owner and variant. Sellers print for their
        own organisation; staff and service clients may pass orgId (default: the product''s owner). Needs catalog:write; service
        clients (inventory-service) and staff may use catalog:read. The AT-FN code is returned as data in the X-Unit-Label-Code
        header (absent for manufacturer barcodes).'
      operationId: unitLabel
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: SVG (vector label), PNG (bare symbol, no text), ZPL (Zebra, 203 dpi), PDF (one page per label, or a sheet)
        required: false
        schema:
          type: string
          default: SVG
          enum:
          - SVG
          - PNG
          - ZPL
          - PDF
      - name: copies
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The unit label
          headers:
            X-Unit-Label-Code:
              description: AT-FN code of the unit label (absent for a manufacturer barcode)
              style: simple
              schema:
                type: string
                pattern: ^ATF[0-9A-Z]{7}$
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
            application/pdf:
              schema:
                type: string
                format: binary
  /v1/product-drafts:
    get:
      tags:
      - Product drafts
      summary: The organisation's drafts, most recently saved first
      operationId: listDrafts
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDraftSummary'
    post:
      tags:
      - Product drafts
      summary: Save a new draft (Save draft, or the first autosave)
      operationId: createDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDraft'
  /v1/product-drafts/{id}:
    get:
      tags:
      - Product drafts
      summary: Get a draft with its payload
      operationId: getDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDraft'
    put:
      tags:
      - Product drafts
      summary: Autosave a draft
      description: 409 catalog.draft-changed when the draft was saved elsewhere since version
      operationId: saveDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductDraft'
    delete:
      tags:
      - Product drafts
      summary: Discard a draft
      operationId: deleteDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
  /v1/product-reviews:
    get:
      tags:
      - Review moderation
      summary: Product reviews by state, newest first (catalog:moderate)
      operationId: listProductReviews
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - PUBLISHED
          - REJECTED
          - REMOVED
          - DELETED
      - name: atin
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReviewPage'
  /v1/product-reviews/{reviewId}:
    get:
      tags:
      - Review moderation
      summary: One product review (catalog:moderate)
      operationId: getProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReview'
  /v1/product-reviews/{reviewId}/approve:
    post:
      tags:
      - Review moderation
      summary: Publish a review
      description: A pending review becomes public and counts in the rating; also reinstates a rejected or removed one. Approving
        a published review changes nothing. catalog.review.published.
      operationId: approveProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewApproveRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReview'
  /v1/product-reviews/{reviewId}/reject:
    post:
      tags:
      - Review moderation
      summary: Reject a review that is waiting for moderation
      description: The customer sees the reason and may edit the review (which goes back to moderation). 409 catalog.review-not-pending
        for a published review - remove it instead. 422 without a note for reasonCode OTHER. catalog.review.rejected.
      operationId: rejectProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRemoveRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReview'
  /v1/product-reviews/{reviewId}/remove:
    post:
      tags:
      - Review moderation
      summary: Take a review down, published or not
      description: It stops being public and counting in the rating; the customer sees the reason. catalog.review.removed.
      operationId: removeProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRemoveRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReview'
  /v1/product-reviews/{reviewId}/reply:
    post:
      tags:
      - Seller reviews
      summary: Reply to a published review, once (catalog:write, members of the owning organisation)
      description: 409 catalog.review-not-published before approval, 409 catalog.review-already-replied the second time; catalog.review.replied.
        The reply is public and cannot be edited.
      operationId: replyToProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReplyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerReview'
  /v1/product-reviews/{reviewId}/reports:
    post:
      tags:
      - Product reviews
      summary: Report a published review (signed-in customer, or a member of the product's seller)
      description: 'One report per reporter and review: a repeated report returns 200 with created=false. The first report
        of a text queues the review in trust-ops (catalog.review.reported); sellers can report but never edit or hide a review.'
      operationId: reportProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReportRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReviewReportResult'
  /v1/product-types:
    get:
      tags:
      - Categories
      summary: All product-type schemas
      operationId: productTypes
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductType'
  /v1/product-types/{code}:
    get:
      tags:
      - Categories
      summary: 'Product-type schema: required details, variation themes, identifier rule'
      operationId: productType
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductType'
  /v1/products:
    get:
      tags:
      - Products
      summary: List products (own organisation; staff may filter by org)
      operationId: list
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - IN_REVIEW
          - PENDING_CATEGORY_APPROVAL
          - LIVE
          - REJECTED
          - PAUSED
          - TAKEN_DOWN
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductPage'
    post:
      tags:
      - Products
      summary: Create a product and submit it for review
      description: The listing owner (seller org or AfroTransact Retail) is derived from the token.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/atin/{atin}:
    get:
      tags:
      - Products
      summary: Get a product by ATIN
      operationId: byAtin
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{atin}/reviews:
    post:
      tags:
      - Product reviews
      summary: Review a product I received (signed-in customer)
      description: 403 catalog.review-not-verified-purchase without a delivered order line for the product; 409 catalog.review-already-exists
        the second time. The review is published at once or, when the automatic checks (profanity, links, personal data) flag
        it, waits for moderation (status PENDING). Publishes catalog.review.published or catalog.review.submitted.
      operationId: writeProductReview
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteReviewRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnReview'
  /v1/products/{atin}/reviews/mine:
    get:
      tags:
      - Product reviews
      summary: 'My standing with a product: may I review it, and my review (signed-in customer)'
      description: eligible is true when orders-service says the customer received the product and they have no live review
        yet. A review in any state is returned, with the moderation reason when it was refused or removed. 503 catalog.purchase-check-unavailable
        when orders cannot answer.
      operationId: myProductReview
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MyReview'
    put:
      tags:
      - Product reviews
      summary: Edit my review within 30 days (signed-in customer)
      description: The checks run again. 409 catalog.review-edit-window-closed after the window. An edit of a rejected or
        removed review always goes back to moderation.
      operationId: editProductReview
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditReviewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnReview'
    delete:
      tags:
      - Product reviews
      summary: Delete my review (signed-in customer)
      description: Any time. The rating is recomputed; the customer can review the product again.
      operationId: deleteProductReview
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/products/{id}:
    get:
      tags:
      - Products
      summary: Get a product by id
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
    put:
      tags:
      - Products
      summary: Edit a product (one-step form in edit mode)
      description: Owner or staff. The whole content is validated again; variants are matched by sellerSku (new SKUs get ATINs;
        a published listing keeps its category and variants). A rejected listing goes back to review. Publishes catalog.product.updated,
        plus catalog.product.terms_changed when prices, quantities or listing terms changed and catalog.product.resubmitted
        when a rejected listing is resubmitted. 409 when version is stale.
      operationId: updateProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/approve:
    post:
      tags:
      - Products
      summary: Approve a product in review (catalog:moderate)
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/flags:
    post:
      tags:
      - Products
      summary: Flag a live listing for review (catalog:moderate)
      description: Staff flags are source STAFF; service clients (principal type SERVICE) are AUTOMATED. Publishes catalog.product.flagged;
        trust-ops queues it as a live-listing moderation item.
      operationId: flag
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagListingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListingFlag'
  /v1/products/{id}/pause:
    post:
      tags:
      - Products
      summary: Pause a live product
      operationId: pause
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/preorder-flags:
    put:
      tags:
      - Products
      summary: Set the pre-order flags of a product (S272)
      description: 'preorderEligible: may be sold in a community pre-order window (default true for food). shipsNow: always
        ships now by carrier, never as a pre-order. Owner or staff; publishes catalog.product.updated.'
      operationId: preorderFlags
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderFlagsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/reject:
    post:
      tags:
      - Products
      summary: Reject a product with a note (catalog:moderate)
      operationId: reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationNote'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/restore:
    post:
      tags:
      - Products
      summary: Reverse a takedown (catalog:moderate)
      description: Returns the listing to its status before the takedown (LIVE or PAUSED) and publishes catalog.product.reinstated.
        Idempotent.
      operationId: restore
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreListingRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/resume:
    post:
      tags:
      - Products
      summary: Resume a paused product
      operationId: resume
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/takedown:
    post:
      tags:
      - Products
      summary: Take a live or paused listing down with a reason (catalog:moderate)
      description: 'Status becomes TAKEN_DOWN: hidden from public reads and the owner cannot resume it. Publishes catalog.product.taken_down.
        Idempotent.'
      operationId: takeDown
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakedownRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/public/products/{atin}:
    get:
      tags:
      - Public catalog
      summary: A live product page by product ATIN
      operationId: product
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicProduct'
      security: []
  /v1/public/products/{atin}/rating:
    get:
      tags:
      - Product reviews
      summary: 'A live product''s rating: average, count and star breakdown'
      operationId: productRating
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductRating'
      security: []
  /v1/public/products/{atin}/reviews:
    get:
      tags:
      - Product reviews
      summary: Published reviews of a live product, with its rating
      description: Sorted NEWEST (default), HIGHEST or LOWEST, optionally only reviews with the given stars. Reviewers show
        as first name and last initial, always Verified purchase.
      operationId: publicProductReviews
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      - name: stars
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: NEWEST
          enum:
          - NEWEST
          - HIGHEST
          - LOWEST
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicReviewPage'
      security: []
  /v1/public/products/{atin}/reports:
    post:
      tags:
      - Listing reports
      summary: Report a live listing by product ATIN (any signed-in user)
      description: 'One report per user and listing: a repeated report returns 200 with the earlier report (created=false)
        and publishes nothing. Listings that are not publicly visible return 404.'
      operationId: reportListing
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportListingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListingFlag'
  /v1/public/variants/{atin}:
    get:
      tags:
      - Public catalog
      summary: A live variant (with its product) by variant ATIN — used by cart and checkout
      operationId: variant
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicVariant'
      security: []
  /v1/seller/reviews:
    get:
      tags:
      - Seller reviews
      summary: Published reviews of my products, newest first (catalog:write)
      description: Sellers see their own organisation; staff name it with orgId. The customer's identity is left out. unanswered=true
        lists reviews without a reply.
      operationId: listSellerReviews
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: unanswered
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerReviewPage'
  /v1/variants/{atin}:
    get:
      tags:
      - Products
      summary: A variant in any status with its product, by variant ATIN
      description: Service clients and staff with catalog:read (retail-service links draft AfroTransact Retail products before
        they go live); members of the owning organisation with catalog:write. Unlike GET /v1/public/variants/{atin}, drafts,
        products in review, paused, rejected, taken-down and hidden products are returned with their status. 404 catalog.variant-not-found.
      operationId: variantAnyStatus
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VariantLookup'
components:
  schemas:
    ListingDetails:
      type: object
      description: Description, condition, search keywords, fulfilment, package, handling time and ship-from
      properties:
        description:
          type: string
          maxLength: 5000
          minLength: 0
        condition:
          type: string
          enum:
          - NEW
          - RENEWED
          - USED_LIKE_NEW
          - USED_VERY_GOOD
          - USED_GOOD
          - USED_ACCEPTABLE
        keywords:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 0
          maxItems: 20
          minItems: 0
        fulfilment:
          type: string
          enum:
          - SELLER
          - AFROTRANSACT
        packaging:
          $ref: '#/components/schemas/PackageDimensions'
        handlingDays:
          type: integer
          format: int32
          description: Business days from order to dispatch, 1–30 (default 2)
        shipFrom:
          $ref: '#/components/schemas/ShipFrom'
    PackageDimensions:
      type: object
      description: Packed size (inches) and weight (pounds)
      properties:
        lengthIn:
          type: number
          format: double
          exclusiveMinimum: 0
        widthIn:
          type: number
          format: double
          exclusiveMinimum: 0
        heightIn:
          type: number
          format: double
          exclusiveMinimum: 0
        weightLb:
          type: number
          format: double
          exclusiveMinimum: 0
    ProductImage:
      type: object
      properties:
        url:
          type: string
          minLength: 1
        width:
          type: integer
          format: int32
          minimum: 0
        height:
          type: integer
          format: int32
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
        contentType:
          type: string
          minLength: 1
        alt:
          type: string
          maxLength: 200
          description: Optional alternative text (what the picture shows), stored with the image
      required:
      - contentType
      - url
    ShipFrom:
      type: object
      description: The seller's ship-from location (snapshot)
      properties:
        locationId:
          type: string
          maxLength: 80
          minLength: 0
        label:
          type: string
          maxLength: 80
          minLength: 0
        city:
          type: string
          maxLength: 80
          minLength: 0
        region:
          type: string
          maxLength: 80
          minLength: 0
        country:
          type: string
          maxLength: 2
          minLength: 0
        postalCode:
          type: string
          maxLength: 12
          minLength: 0
    UpdateProductRequest:
      type: object
      description: The whole editable content of a product (one-step form in edit mode). Variants are matched by sellerSku;
        a published listing keeps its category and variants
      properties:
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
          minLength: 10
        attributes:
          type: object
          additionalProperties:
            type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          maxItems: 10
          minItems: 0
        variationTheme:
          type: string
          maxLength: 60
          minLength: 0
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantRequest'
          maxItems: 200
          minItems: 0
        preorderEligible:
          type: boolean
        shipsNow:
          type: boolean
        listing:
          $ref: '#/components/schemas/ListingDetails'
        version:
          type: integer
          format: int64
          description: The version the edit is based on (409 when the product changed since)
        draftId:
          type: string
          format: uuid
      required:
      - images
      - title
      - variants
    VariantRequest:
      type: object
      properties:
        options:
          type: object
          additionalProperties:
            type: string
        sellerSku:
          type: string
          minLength: 1
        gtin:
          type: string
        gtinExempt:
          type: boolean
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        quantity:
          type: integer
          format: int32
          minimum: 0
        compareAtMinor:
          type: integer
          format: int64
          description: '"Was" price shown struck through; above priceMinor'
          exclusiveMinimum: 0
        images:
          type: array
          description: Images of this variant only (e.g. its colour)
          items:
            $ref: '#/components/schemas/ProductImage'
          maxItems: 5
          minItems: 0
      required:
      - options
      - sellerSku
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        atin:
          type: string
        ownerKind:
          type: string
        ownerOrgId:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryRequestId:
          type: string
          format: uuid
        productType:
          type: string
        title:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        variationTheme:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        status:
          type: string
        moderationNote:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        preorderEligible:
          type: boolean
        shipsNow:
          type: boolean
        listing:
          $ref: '#/components/schemas/ListingDetails'
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        atin:
          type: string
        sellerSku:
          type: string
        gtin:
          type: string
        gtinExempt:
          type: boolean
        options:
          type: object
          additionalProperties:
            type: string
        priceMinor:
          type: integer
          format: int64
        currency:
          type: string
        quantity:
          type: integer
          format: int32
        compareAtMinor:
          type: integer
          format: int64
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
    PreorderFlagsRequest:
      type: object
      description: Pre-order flags of a product (S272)
      properties:
        preorderEligible:
          type: boolean
        shipsNow:
          type: boolean
      required:
      - preorderEligible
      - shipsNow
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        array:
          type: boolean
        'null':
          type: boolean
        object:
          type: boolean
        float:
          type: boolean
        valueNode:
          type: boolean
        container:
          type: boolean
        missingNode:
          type: boolean
        nodeType:
          type: string
          enum:
          - ARRAY
          - BINARY
          - BOOLEAN
          - MISSING
          - 'NULL'
          - NUMBER
          - OBJECT
          - POJO
          - STRING
        string:
          type: boolean
        integralNumber:
          type: boolean
        pojo:
          type: boolean
        floatingPointNumber:
          type: boolean
        short:
          type: boolean
        int:
          type: boolean
        long:
          type: boolean
        double:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        boolean:
          type: boolean
        binary:
          type: boolean
        number:
          type: boolean
        embeddedValue:
          type: boolean
    SaveDraftRequest:
      type: object
      description: 'Autosave: replaces the payload when version still matches'
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
          maxLength: 200
          minLength: 0
        categoryPath:
          type: string
          maxLength: 400
          minLength: 0
        payload:
          $ref: '#/components/schemas/JsonNode'
      required:
      - payload
    ProductDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        title:
          type: string
