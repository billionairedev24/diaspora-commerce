openapi: 3.1.0
info:
  title: Catalog API
  description: Products (ATIN/GTIN), variants, category tree, product-type schemas and category requests.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8101
  description: local
- url: https://api.dev.afrotransact.com/catalog
  description: dev
- url: https://api.uat.afrotransact.com/catalog
  description: uat
- url: https://api.afrotransact.com/catalog
  description: prod
security:
- bearer: []
tags:
- name: Public catalog
  description: Anonymous reads of live products (storefront, cart, search)
- name: Categories
  description: Browse tree, product-type schemas and new-category requests
- name: Labels
  description: 'Barcode labels (S032): Code 128, GS1-128 and EAN-13 as SVG, PNG, ZPL or PDF'
- name: Products
  description: Product builder, listing moderation and lookup
- name: Identifiers
  description: GTIN / ISBN checks and GTIN prefill for the product builder, GTIN lookups by service clients
- name: Listing reports
  description: Shoppers report a live listing (signed in); reports reach the trust-ops moderation queue through catalog.product.flagged
paths:
  /v1/categories:
    get:
      tags:
      - Categories
      summary: Full active category tree (department › category › product type)
      operationId: tree
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNode'
  /v1/category-requests:
    get:
      tags:
      - Categories
      summary: Review queue of category requests (catalog:taxonomy)
      operationId: queue
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_REVIEW
          - APPROVED
          - REJECTED
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRequest'
    post:
      tags:
      - Categories
      summary: Request a new category (products can be built against it right away)
      operationId: request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/mine:
    get:
      tags:
      - Categories
      summary: My organisation's category requests
      operationId: mine
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/{id}/approve:
    post:
      tags:
      - Categories
      summary: Approve a category request; waiting products move into listing review
      operationId: approve_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/category-requests/{id}/reject:
    post:
      tags:
      - Categories
      summary: Reject a category request; waiting products are rejected with the note
      operationId: reject_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoryRequest'
  /v1/identifiers/gtin/{code}:
    get:
      tags:
      - Identifiers
      summary: Validate a GTIN and find an existing product page that already uses it
      description: Needs catalog:read (service tokens such as offers-service, any principal type) or catalog:write (sellers
        in the product builder).
      operationId: check
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: isbn
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GtinCheck'
  /v1/identifiers/gtin/{code}/prefill:
    get:
      tags:
      - Identifiers
      summary: Prefill the product builder from a GTIN (GS1, Open Food Facts)
      description: Validates the GTIN-8/12/13/14 check digit (422 with a suggested fix), then asks the product-data providers
        in order (GS1 Verified when configured, then Open Food Facts for groceries) and returns title, brand, net content,
        images and category hints in our taxonomy. `importedFrom` marks imported fields (they stay editable); `found=false`
        means manual entry. When a product page already uses the GTIN, `existingAtin` is set and no provider is called. Answers
        are cached per GTIN. Needs catalog:write or catalog:read.
      operationId: prefillGtin
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GtinPrefill'
  /v1/labels:
    post:
      tags:
      - Labels
      summary: Render one label
      description: Needs catalog:write or catalog:read. Invalid data (GTIN / SSCC check digits, GS1 AI rules, too long for
        the label) is a 422 with fieldErrors.
      operationId: renderLabel
      parameters:
      - name: format
        in: query
        description: SVG (vector label), PNG (bare symbol, no text), ZPL (Zebra, 203 dpi), PDF (one page per label, or a sheet)
        required: false
        schema:
          type: string
          default: SVG
          enum:
          - SVG
          - PNG
          - ZPL
          - PDF
      - name: layout
        in: query
        required: false
        schema:
          type: string
          enum:
          - LABEL
          - SHEET
      - name: paper
        in: query
        required: false
        schema:
          type: string
          enum:
          - LETTER
          - A4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
        required: true
      responses:
        '200':
          description: The label
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
            application/pdf:
              schema:
                type: string
                format: binary
  /v1/labels/batch:
    post:
      tags:
      - Labels
      summary: Render a batch of labels as one PDF or ZPL
      description: Up to 500 labels and 2000 printed labels (copies included). Field errors are keyed labels[i].field. Needs
        catalog:write or catalog:read.
      operationId: renderLabelBatch
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: PDF
          enum:
          - PDF
          - ZPL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelBatchRequest'
        required: true
      responses:
        '200':
          description: The labels
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
  /v1/labels/units/{atin}:
    get:
      tags:
      - Labels
      summary: Unit label of a product or variant ATIN
      description: 'Platform (AfroTransact Retail) stock with a vendor GTIN keeps the manufacturer barcode; every other unit
        gets the stock owner''s AT-FN code (ATF + 7, Code 128), issued once per owner and variant. Sellers print for their
        own organisation; staff and service clients may pass orgId (default: the product''s owner). Needs catalog:write; service
        clients (inventory-service) and staff may use catalog:read. The AT-FN code is returned as data in the X-Unit-Label-Code
        header (absent for manufacturer barcodes).'
      operationId: unitLabel
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: SVG (vector label), PNG (bare symbol, no text), ZPL (Zebra, 203 dpi), PDF (one page per label, or a sheet)
        required: false
        schema:
          type: string
          default: SVG
          enum:
          - SVG
          - PNG
          - ZPL
          - PDF
      - name: copies
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The unit label
          headers:
            X-Unit-Label-Code:
              description: AT-FN code of the unit label (absent for a manufacturer barcode)
              style: simple
              schema:
                type: string
                pattern: ^ATF[0-9A-Z]{7}$
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                description: ZPL
            application/pdf:
              schema:
                type: string
                format: binary
  /v1/product-types:
    get:
      tags:
      - Categories
      summary: All product-type schemas
      operationId: productTypes
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductType'
  /v1/product-types/{code}:
    get:
      tags:
      - Categories
      summary: 'Product-type schema: required details, variation themes, identifier rule'
      operationId: productType
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductType'
  /v1/products:
    get:
      tags:
      - Products
      summary: List products (own organisation; staff may filter by org)
      operationId: list
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - IN_REVIEW
          - PENDING_CATEGORY_APPROVAL
          - LIVE
          - REJECTED
          - PAUSED
          - TAKEN_DOWN
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductPage'
    post:
      tags:
      - Products
      summary: Create a product and submit it for review
      description: The listing owner (seller org or AfroTransact Retail) is derived from the token.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/atin/{atin}:
    get:
      tags:
      - Products
      summary: Get a product by ATIN
      operationId: byAtin
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}:
    get:
      tags:
      - Products
      summary: Get a product by id
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/approve:
    post:
      tags:
      - Products
      summary: Approve a product in review (catalog:moderate)
      operationId: approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/flags:
    post:
      tags:
      - Products
      summary: Flag a live listing for review (catalog:moderate)
      description: Staff flags are source STAFF; service clients (principal type SERVICE) are AUTOMATED. Publishes catalog.product.flagged;
        trust-ops queues it as a live-listing moderation item.
      operationId: flag
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagListingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListingFlag'
  /v1/products/{id}/pause:
    post:
      tags:
      - Products
      summary: Pause a live product
      operationId: pause
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/reject:
    post:
      tags:
      - Products
      summary: Reject a product with a note (catalog:moderate)
      operationId: reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationNote'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/restore:
    post:
      tags:
      - Products
      summary: Reverse a takedown (catalog:moderate)
      description: Returns the listing to its status before the takedown (LIVE or PAUSED) and publishes catalog.product.reinstated.
        Idempotent.
      operationId: restore
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreListingRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/resume:
    post:
      tags:
      - Products
      summary: Resume a paused product
      operationId: resume
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/preorder-flags:
    put:
      tags:
      - Products
      summary: Set the pre-order flags of a product (S272)
      description: 'preorderEligible: may be sold in a community pre-order window (default true for food). shipsNow:
        always ships now by carrier, never as a pre-order. Owner or staff; publishes catalog.product.updated.'
      operationId: preorderFlags
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreorderFlagsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/products/{id}/takedown:
    post:
      tags:
      - Products
      summary: Take a live or paused listing down with a reason (catalog:moderate)
      description: 'Status becomes TAKEN_DOWN: hidden from public reads and the owner cannot resume it. Publishes catalog.product.taken_down.
        Idempotent.'
      operationId: takeDown
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakedownRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product'
  /v1/public/products/{atin}:
    get:
      tags:
      - Public catalog
      summary: A live product page by product ATIN
      operationId: product
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicProduct'
      security: []
  /v1/public/products/{atin}/reports:
    post:
      tags:
      - Listing reports
      summary: Report a live listing by product ATIN (any signed-in user)
      description: 'One report per user and listing: a repeated report returns 200 with the earlier report (created=false)
        and publishes nothing. Listings that are not publicly visible return 404.'
      operationId: reportListing
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportListingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListingFlag'
  /v1/public/variants/{atin}:
    get:
      tags:
      - Public catalog
      summary: A live variant (with its product) by variant ATIN — used by cart and checkout
      operationId: variant
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicVariant'
      security: []
  /v1/variants/{atin}:
    get:
      tags:
      - Products
      summary: A variant in any status with its product, by variant ATIN
      description: Service clients and staff with catalog:read (retail-service links draft AfroTransact Retail products before
        they go live); members of the owning organisation with catalog:write. Unlike GET /v1/public/variants/{atin}, drafts,
        products in review, paused, rejected, taken-down and hidden products are returned with their status. 404 catalog.variant-not-found.
      operationId: variantAnyStatus
      parameters:
      - name: atin
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VariantLookup'
components:
  schemas:
    ReportListingRequest:
      type: object
      description: Reason code required; details required for OTHER
      properties:
        reasonCode:
          type: string
          enum:
          - PROHIBITED_ITEM
          - UNAPPROVED_HEALTH_CLAIM
          - RESTRICTED_INGREDIENT
          - COUNTERFEIT
          - IMAGE_POLICY
          - MISLEADING_CONTENT
          - LABELLING
          - SHIPPING_METHOD
          - DUPLICATE_LISTING
          - WRONG_CATEGORY
          - OTHER
        details:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - reasonCode
    ListingFlag:
      type: object
      description: A report or flag on a live listing (catalog.product.flagged)
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        source:
          type: string
          enum:
          - CUSTOMER_REPORT
          - STAFF
          - AUTOMATED
        reasonCode:
          type: string
          enum:
          - PROHIBITED_ITEM
          - UNAPPROVED_HEALTH_CLAIM
          - RESTRICTED_INGREDIENT
          - COUNTERFEIT
          - IMAGE_POLICY
          - MISLEADING_CONTENT
          - LABELLING
          - SHIPPING_METHOD
          - DUPLICATE_LISTING
          - WRONG_CATEGORY
          - OTHER
        details:
          type: string
        riskLevel:
          type: string
        createdAt:
          type: string
          format: date-time
        created:
          type: boolean
    CreateProductRequest:
      type: object
      description: Exactly one of categoryId or categoryRequestId
      properties:
        categoryId:
          type: string
          format: uuid
        categoryRequestId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
          minLength: 10
        attributes:
          type: object
          additionalProperties:
            type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          maxItems: 10
          minItems: 0
        variationTheme:
          type: string
          minLength: 1
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantRequest'
          maxItems: 200
          minItems: 0
        currency:
          type: string
          maxLength: 3
          minLength: 3
        preorderEligible:
          type: boolean
          description: May be sold in a pre-order window; default true for food product types
        shipsNow:
          type: boolean
          description: Always ships now by carrier (never a pre-order); default false
      required:
      - images
      - title
      - variants
      - variationTheme
    PreorderFlagsRequest:
      type: object
      description: Pre-order flags of a product (S272)
      properties:
        preorderEligible:
          type: boolean
        shipsNow:
          type: boolean
      required:
      - preorderEligible
      - shipsNow
    ProductImage:
      type: object
      properties:
        url:
          type: string
          minLength: 1
        width:
          type: integer
          format: int32
          minimum: 0
        height:
          type: integer
          format: int32
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0
        contentType:
          type: string
          minLength: 1
      required:
      - contentType
      - url
    VariantRequest:
      type: object
      properties:
        options:
          type: object
          additionalProperties:
            type: string
        sellerSku:
          type: string
          minLength: 1
        gtin:
          type: string
        gtinExempt:
          type: boolean
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        quantity:
          type: integer
          format: int32
          minimum: 0
      required:
      - options
      - sellerSku
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        atin:
          type: string
        ownerKind:
          type: string
        ownerOrgId:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryRequestId:
          type: string
          format: uuid
        productType:
          type: string
        title:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        variationTheme:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        status:
          type: string
        moderationNote:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        preorderEligible:
          type: boolean
          description: May be sold in a community pre-order window (S272); default true for food product types
        shipsNow:
          type: boolean
          description: Always ships now by carrier, never as a pre-order (shea, fabric …)
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        atin:
          type: string
        sellerSku:
          type: string
        gtin:
          type: string
        gtinExempt:
          type: boolean
        options:
          type: object
          additionalProperties:
            type: string
        priceMinor:
