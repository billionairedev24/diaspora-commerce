  /v1/product-reviews/{reviewId}:
    get:
      tags:
      - Review moderation
      summary: One product review (catalog:moderate)
      operationId: getProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReview'
  /v1/product-reviews/{reviewId}/approve:
    post:
      tags:
      - Review moderation
      summary: Publish a review
      description: A pending review becomes public and counts in the rating; also reinstates a rejected or removed one. Approving
        a published review changes nothing. catalog.review.published.
      operationId: approveProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewApproveRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReview'
  /v1/product-reviews/{reviewId}/reject:
    post:
      tags:
      - Review moderation
      summary: Reject a review that is waiting for moderation
      description: The customer sees the reason and may edit the review (which goes back to moderation). 409 catalog.review-not-pending
        for a published review - remove it instead. 422 without a note for reasonCode OTHER. catalog.review.rejected.
      operationId: rejectProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRemoveRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReview'
  /v1/product-reviews/{reviewId}/remove:
    post:
      tags:
      - Review moderation
      summary: Take a review down, published or not
      description: It stops being public and counting in the rating; the customer sees the reason. catalog.review.removed.
      operationId: removeProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRemoveRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductReview'
  /v1/product-reviews/{reviewId}/reply:
    post:
      tags:
      - Seller reviews
      summary: Reply to a published review, once (catalog:write, members of the owning organisation)
      description: 409 catalog.review-not-published before approval, 409 catalog.review-already-replied the second time; catalog.review.replied.
        The reply is public and cannot be edited.
      operationId: replyToProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReplyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerReview'
  /v1/product-reviews/{reviewId}/reports:
    post:
      tags:
      - Product reviews
      summary: Report a published review (signed-in customer, or a member of the product's seller)
      description: 'One report per reporter and review: a repeated report returns 200 with created=false. The first report
        of a text queues the review in trust-ops (catalog.review.reported); sellers can report but never edit or hide a review.'
      operationId: reportProductReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReportRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReviewReportResult'
  /v1/seller/catalog-scope:
    get:
      tags:
      - Seller scope
      summary: Departments my organisation may list in (every department), and whether any sells sized goods
      description: A seller may list in any department, so exempt is always true, every department is returned and there
        are no requests. hasSizing is true when a department has a product type with the sizing trait. Never calls seller-service.
      operationId: mine
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerCatalogScope'
  /v1/listing-rules:
    get:
      tags:
      - Listing rules
      summary: The listing rules of a category
      description: Kind of product, approval level and the status of every field (required, required_or_exemption, document, optional, hidden) for the category code (the category above the product type, such as dairy-eggs); the code general answers the general goods rules for a requested category. 404 for a code the rules do not know.
      operationId: getListingRules
      parameters:
      - name: categoryCode
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListingRules'
        '404':
          description: No rules for that category code
  /v1/product-types:
    get:
      tags:
