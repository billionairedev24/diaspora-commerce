          format: uuid
          description: A product-type (third level) category node
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartColumn'
          maxItems: 12
          minItems: 0
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartRowInput'
          maxItems: 60
          minItems: 0
        fitNote:
          type: string
          enum:
          - RUNS_SMALL
          - TRUE_TO_SIZE
          - RUNS_LARGE
        howToMeasure:
          type: string
          maxLength: 1000
          minLength: 0
        version:
          type: integer
          format: int64
          description: 'PUT only: the version the editor loaded (409 when the chart changed since)'
          minimum: 0
      required:
      - columns
      - name
      - rows
      - unitSystem
    SizeChartRowInput:
      type: object
      description: 'One size: its label and a value per column key'
      properties:
        size:
          type: string
          maxLength: 40
          minLength: 0
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SizeChartValue'
      required:
      - size
      - values
    SizeChartValue:
      type: object
      description: A single value (max omitted or equal to min) or a range, in the chart's unit
      properties:
        min:
          type: number
        max:
          type: number
      required:
      - min
    SizeChart:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerOrgId:
          type: string
        name:
          type: string
        unitSystem:
          type: string
          enum:
          - CM
          - IN
        alternateUnit:
          type: string
          enum:
          - CM
          - IN
        productTypeCode:
          type: string
        categoryId:
          type: string
          format: uuid
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartColumn'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartRow'
        fitNote:
          type: string
          enum:
          - RUNS_SMALL
          - TRUE_TO_SIZE
          - RUNS_LARGE
        howToMeasure:
          type: string
        retired:
          type: boolean
        retiredAt:
          type: string
          format: date-time
        productCount:
          type: integer
          format: int64
          description: Products that use this chart
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Send back as version when saving (PUT)
    SizeChartRow:
      type: object
      properties:
        size:
          type: string
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SizeChartValue'
          description: Value per column key, in the chart's unit
        alternateValues:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SizeChartValue'
          description: The same values converted to alternateUnit, one decimal
    TaxonomySizing:
      type: object
      description: 'Marks the product type as sized: sellers attach size charts they write themselves and write their own
        size labels (the size variation then allows custom values). suggestedMeasurements pre-fill the seller''s chart editor
        and the bulk template.'
      properties:
        enabled:
          type: boolean
          description: false switches sizing off; default true
        sizeChartRequired:
          type: boolean
          description: A listing needs a size chart whose rows cover every size it sells
        sizeDimension:
          type: string
          description: The variation dimension that holds the size; default Size
          maxLength: 40
          minLength: 0
        suggestedMeasurements:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomySuggestedMeasurement'
          maxItems: 12
          minItems: 0
    TaxonomySuggestedMeasurement:
      type: object
      properties:
        key:
          type: string
          maxLength: 40
          minLength: 0
        label:
          type: string
          maxLength: 40
          minLength: 0
        unit:
          type: string
          enum:
          - CM
          - IN
        help:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - label
    SizingTrait:
      type: object
      properties:
        sizeChartRequired:
          type: boolean
        sizeDimension:
          type: string
        suggestedMeasurements:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedMeasurement'
    SuggestedMeasurement:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        unit:
          type: string
          enum:
          - CM
          - IN
        help:
          type: string
    DuplicateSizeChartRequest:
      type: object
      properties:
        name:
          type: string
          description: 'Default: "<name> (copy)"'
          maxLength: 80
          minLength: 0
    SizeChartImportChart:
      type: object
      properties:
        name:
          type: string
        action:
          type: string
          description: CREATE or UPDATE (what was done, or with dryRun what would be done), UNCHANGED (the same chart was
            already saved) or FAILED
        chartId:
          type: string
          format: uuid
          description: The saved chart; null for a dry run's new charts and failed ones
        rows:
          type: array
          items:
            type: integer
            format: int32
        message:
          type: string
          description: Why the chart failed; null otherwise
    SizeChartImportMessage:
      type: object
      properties:
        column:
          type: string
          description: 'The column key: chart_name, unit, size, fit_note, how_to_measure or m:<measurement key>; null for
            the row'
        columnIndex:
          type: integer
          format: int32
          description: Position of the column in the uploaded header; -1 when none
        severity:
          type: string
          description: ERROR blocks the chart, WARNING is informational
        message:
          type: string
    SizeChartImportReport:
      type: object
      description: Row-level result of a size chart upload
      properties:
        applied:
          type: boolean
          description: 'false for a dry run: nothing was saved'
        fileName:
          type: string
        fileWarnings:
          type: array
          items:
            type: string
        chartCount:
          type: integer
          format: int32
        created:
          type: integer
          format: int32
        updated:
          type: integer
          format: int32
        unchanged:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        errorRows:
          type: integer
          format: int32
        warningRows:
          type: integer
          format: int32
        charts:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartImportChart'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartImportRow'
    SizeChartImportRow:
      type: object
      properties:
        rowNumber:
          type: integer
          format: int32
          description: The row number in the spreadsheet (header = 1)
        chartName:
          type: string
        size:
          type: string
        status:
          type: string
          description: VALID, WARNING or ERROR
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartImportMessage'
        cells:
          type: array
          items:
            type: string
    TaxonomyVariationDimension:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
          minLength: 0
        options:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 0
        allowCustomValues:
          type: boolean
          description: Sellers may write values of their own; options are then suggestions
      required:
      - name
    TaxonomyVariationTheme:
      type: object
      description: 'One way a product varies: one or two dimensions'
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 0
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyVariationDimension'
          maxItems: 2
          minItems: 0
      required:
      - dimensions
      - name
    SizeChartPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SizeChart'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    SizeChartSuggestedMeasurement:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        unit:
          type: string
          enum:
          - CM
          - IN
        help:
          type: string
    SizeChartSuggestions:
      type: object
      description: 'What the category suggests for the chart editor and the size input of the product form: size labels and
        measurement columns. All of it can be used, renamed or extended by the seller.'
      properties:
        productTypeCode:
          type: string
        productTypeLabel:
          type: string
        sized:
          type: boolean
          description: 'false: this product type has no sizes and no size chart'
        sizeChartRequired:
          type: boolean
          description: A listing needs a size chart whose rows cover every size it sells
        sizeDimension:
          type: string
          description: The variation dimension that holds the size, e.g. Size
        sizes:
          type: array
          description: Suggested size labels, in order (XS ... 3XL)
          items:
            type: string
        sizesAllowCustomValues:
          type: boolean
          description: The seller may add size labels of their own
        unitSystem:
          type: string
          description: The unit to start a new chart in
          enum:
          - CM
          - IN
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartSuggestedMeasurement'
    PublicSizeChart:
      type: object
      description: The size chart shown on the product page
      properties:
        name:
          type: string
        unitSystem:
          type: string
          enum:
          - CM
          - IN
        alternateUnit:
          type: string
          enum:
          - CM
          - IN
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartColumn'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SizeChartRow'
        fitNote:
          type: string
          description: The product's own fit note, else the chart's
          enum:
          - RUNS_SMALL
          - TRUE_TO_SIZE
          - RUNS_LARGE
        howToMeasure:
          type: string
    MatchRequest:
      type: object
      description: A barcode (UPC, EAN, GTIN or ISBN), or a brand with its manufacturer part number. At least one of the two.
      properties:
        gtin:
          type: string
          description: Digits with optional spaces or dashes; 8, 12, 13 or 14 digits, or an ISBN-10
          example: '012345678905'
          maxLength: 20
        brand:
          type: string
          description: Brand name or registry id (with mpn, for items without a barcode)
          maxLength: 120
        mpn:
          type: string
          description: Manufacturer part number (letters and digits are compared; case and punctuation ignored)
          maxLength: 80
        categoryId:
          type: string
          format: uuid
          description: Narrows a brand plus part number match to a category
    PageImage:
      type: object
      properties:
        url:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
    Blocker:
      type: object
      description: Why the organisation cannot do something, in plain words
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'Stable code, for example catalog.page-not-live, catalog.department-not-allowed, offers.selling-approval-required, catalog.brand-unavailable, catalog.wrong-match-open'
        message:
          type: string
    MatchResult:
      type: object
      required:
      - result
      - canOffer
      - blockers
      - canCreate
      - createBlockers
      properties:
        result:
          type: string
          enum:
          - MATCH
          - NO_MATCH
          - INVALID
          - RESTRICTED
        matchedOn:
          type: string
          description: Present on MATCH
          enum:
          - GTIN
          - BRAND_MPN
        gtin14:
          type: string
          description: The normalised 14-digit key (null for a brand plus part number lookup or an unreadable code)
          pattern: '[0-9]{14}'
        digits:
          type: string
          description: The cleaned input digits (an ISBN-10 shown as its ISBN-13)
        atin:
          type: string
          description: ATIN of the matched child (variant); offers attach to this
        parentAtin:
          type: string
          description: ATIN of the product page
        productStatus:
          type: string
        title:
          type: string
        brand:
          type: string
        image:
          $ref: '#/components/schemas/PageImage'
        category:
          type: string
          description: Category path
        categoryId:
          type: string
          format: uuid
        variantOptions:
          type: object
          additionalProperties:
            type: string
        variants:
          type: array
          description: Every child of the matched page, so the seller may offer the others too. A brand plus part number match on a page with several children has no `atin`; the seller picks one of these.
          items:
            $ref: '#/components/schemas/MatchVariant'
        canOffer:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        canCreate:
          type: boolean
          description: False when a new page with this barcode must not be created (a match exists, the barcode is invalid or restricted, or a wrong-match report on it is open)
        createBlockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        suggestion:
          type: string
          description: A corrected barcode when only the check digit is wrong
        message:
          type: string
          description: Plain words for INVALID and RESTRICTED, for example "This number is for store use or coupons, not a product barcode."
    MatchVariant:
      type: object
      properties:
        atin:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
        gtin14:
          type: string
          pattern: '[0-9]{14}'
    OfferEligibilityRequest:
      type: object
      required:
      - atin
      properties:
        atin:
          type: string
          description: Variant ATIN
          pattern: AT[0-9A-Z]{8}
        sellerOrgId:
          type: string
          description: Service and staff tokens only
    OfferEligibility:
      type: object
      required:
      - atin
      - canOffer
      - blockers
      properties:
        atin:
          type: string
        productAtin:
          type: string
        canOffer:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        allowedConditions:
          type: array
          description: Conditions the category allows (NEW only unless used items are allowed, listing rule D9)
          items:
            type: string
            enum:
            - NEW
            - RENEWED
            - USED_LIKE_NEW
            - USED_VERY_GOOD
            - USED_GOOD
            - USED_ACCEPTABLE
        pageOwnerOrgId:
          type: string
    ChangeRequestType:
      type: string
      enum:
      - IMAGE_ADD
      - IMAGE_REPLACE
      - TITLE
      - ATTRIBUTE
      - DESCRIPTION
      - CATEGORY
      - BRAND
      - NEW_VARIANT
      - WRONG_MATCH
      - DUPLICATE_PAGE
    ChangeRequestStatus:
      type: string
      description: PENDING is Waiting, APPLIED is Applied, REJECTED is "Not applied, because ..."
      enum:
      - PENDING
      - APPLIED
      - REJECTED
      - WITHDRAWN
    ChangeRequestInput:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/ChangeRequestType'
        field:
          type: string
          description: The attribute key for ATTRIBUTE; the image slot (MAIN, OTHER) for image types; otherwise empty
          maxLength: 60
        payload:
          type: object
          description: |
            By type. TITLE, DESCRIPTION, BRAND: {value}. ATTRIBUTE: {key, value}. CATEGORY: {categoryId}.
            IMAGE_ADD: {url, width, height, bytes, contentType}; IMAGE_REPLACE: the same plus {position}.
            NEW_VARIANT: {options, gtin?, gtinExempt?, sellerSku?, images?}. WRONG_MATCH: {gtin, variantAtin, correctGtin?}.
            DUPLICATE_PAGE: {duplicateOfAtin}.
          additionalProperties: {}
        note:
          type: string
          description: Why, in the seller's words (shown to staff); at most `noteMaxLength` of the catalog settings (1000 by default, never above 5000)
          maxLength: 5000
    ChangeRequest:
      type: object
      required:
      - id
      - atin
      - type
      - status
      - requestedByOrg
      - requestedAt
      - version
      properties:
        id:
          type: string
          format: uuid
        atin:
          type: string
          description: The page ATIN the request is about
        productId:
          type: string
          format: uuid
        title:
          type: string
          description: The page title at filing time
        type:
          $ref: '#/components/schemas/ChangeRequestType'
        field:
          type: string
        payload:
          type: object
          additionalProperties: {}
        note:
          type: string
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        requestedByOrg:
          type: string
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        slaDueAt:
          type: string
          format: date-time
          description: Business-day SLA from filing
        overdue:
          type: boolean
        ageHours:
          type: integer
          format: int64
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        reason:
          type: string
          description: Staff reason, shown to the requester
        resolution:
          type: string
          description: CORRECT_GTIN, MOVE_VARIANT, SPLIT_VARIANT or MERGE when staff resolved a WRONG_MATCH or DUPLICATE_PAGE
        version:
          type: integer
          format: int64
    ChangeRequestPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequest'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    ChangeRequestDecisionInput:
      type: object
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        resolution:
          type: string
          description: Required to approve WRONG_MATCH or DUPLICATE_PAGE (NEW_VARIANT and the content types need none)
          enum:
          - CORRECT_GTIN
          - MOVE_VARIANT
          - SPLIT_VARIANT
          - MERGE
        resolutionParams:
          type: object
          description: 'NEW_VARIANT: {holdPageForTax?}. CORRECT_GTIN: {gtin}. MOVE_VARIANT: {targetAtin, holdPageForTax?}. SPLIT_VARIANT: none (the variant is the one in the report). MERGE: {survivorAtin, variantMap?}'
          additionalProperties: {}
        expectedVersion:
          type: integer
          format: int64
    ExemptionStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    DuplicateHint:
      type: object
      properties:
        atin:
          type: string
        title:
          type: string
        brand:
          type: string
        mpn:
          type: string
        score:
          type: number
          format: double
          description: 0 to 1
        matchedOn:
          type: array
          items:
            type: string
            enum:
            - BRAND_MPN
            - TITLE
    GtinExemptionRequest:
      type: object
      required:
      - id
      - productAtin
      - status
      - requestedByOrg
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productAtin:
          type: string
        title:
          type: string
        brand:
          type: string
        mpn:
          type: string
        sellerReason:
          type: string
          description: The seller's reason for having no barcode
        requiredBecause:
          type: string
          enum:
          - BRAND_GATED_CATEGORY
          - KNOWN_GS1_BRAND
        status:
          $ref: '#/components/schemas/ExemptionStatus'
        requestedByOrg:
          type: string
        createdAt:
          type: string
          format: date-time
        slaDueAt:
          type: string
          format: date-time
        overdue:
          type: boolean
        ageHours:
          type: integer
          format: int64
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        reason:
          type: string
        sellerMessage:
          type: string
          description: What the seller reads while waiting
        duplicateHints:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateHint'
    GtinExemptionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GtinExemptionRequest'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    ExemptionDecisionInput:
      type: object
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    ReviewQueueItem:
      type: object
      required:
      - kind
      - id
      - createdAt
      - slaDueAt
      - overdue
      properties:
        kind:
          type: string
          enum:
          - CHANGE_REQUEST
          - GTIN_EXEMPTION
        id:
          type: string
          format: uuid
        atin:
          type: string
        title:
          type: string
        summary:
          type: string
          description: The request type or "No barcode"
        requestedByOrg:
          type: string
        createdAt:
          type: string
          format: date-time
        slaDueAt:
          type: string
          format: date-time
        overdue:
          type: boolean
        ageHours:
          type: integer
          format: int64
    ReviewQueuePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    AtinRedirect:
      type: object
      required:
      - atin
      - redirectTo
      properties:
        atin:
          type: string
        redirectTo:
          type: string
          description: ATIN of the page that survived the merge
    CatalogPolicySettings:
      type: object
      description: Every threshold of matching, exemptions and the review queue, editable by staff
      required:
      - reservedPrefixes
      - mpnAttributeKey
      - reviewSlaBusinessDays
      - alertAfterBusinessDays
      - noteMaxLength
      - knownGs1BrandMinPages
      - exemptionGatedCategoryCodes
      properties:
        reservedPrefixes:
          type: array
          description: Prefixes of the GTIN (leading zeros of the 14-digit form dropped) that are store-use or coupon numbers; seeded with 02, 04, 20 to 29, 981 to 984 and 99
          items:
            type: string
            pattern: '[0-9]{2,6}'
        mpnAttributeKey:
          type: string
          description: The product attribute that holds the manufacturer part number
          default: model
        reviewSlaBusinessDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
          default: 2
        alertAfterBusinessDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 3
        noteMaxLength:
          type: integer
          format: int32
          default: 1000
        knownGs1BrandMinPages:
          type: integer
          format: int32
          description: A brand with at least this many pages that carry barcodes counts as a known GS1 brand (a no-barcode item of it needs staff approval)
          minimum: 1
          default: 1
        exemptionGatedCategoryCodes:
          type: array
          description: Category or product-type codes treated as brand-gated for no-barcode items, on top of the categories whose listing rules say brand_gated; a no-barcode item in them needs staff approval
          items:
            type: string
        exemptionRequiresApprovalForKnownBrands:
          type: boolean
          default: true
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
