    LabelRequest:
      type: object
      description: 'One label. UNIT/SHELF/CUSTOM: Code 128 of `data` (or EAN-13 of `gtin`); RETAIL: EAN-13 / UPC-A of `gtin`
        (GS1-128 (01) for GTIN-8/14); CASE: GS1-128 (01) `gtin` + (10) lot, (11) production, (15) best before, (17) expiry,
        (21) serial; PALLET: GS1-128 (00) `sscc` + optional (02) `gtin` with (37) `count`. `symbology` overrides the default.'
      properties:
        kind:
          type: string
          enum:
          - UNIT
          - RETAIL
          - SHELF
          - CASE
          - PALLET
          - CUSTOM
        symbology:
          type: string
          enum:
          - CODE_128
          - GS1_128
          - EAN_13
        data:
          type: string
          examples:
          - ATF3XK8P2QL
          maxLength: 48
          minLength: 0
        gtin:
          type: string
          examples:
          - 09501101530003
          maxLength: 20
          minLength: 0
        sscc:
          type: string
          examples:
          - '106141411234567897'
          maxLength: 20
          minLength: 0
        lot:
          type: string
          maxLength: 20
          minLength: 0
        productionDate:
          type: string
          format: date
        bestBefore:
          type: string
          format: date
        expiry:
          type: string
          format: date
        serial:
          type: string
          maxLength: 20
          minLength: 0
        count:
          type: integer
          format: int32
        caption:
          type: string
          maxLength: 60
          minLength: 0
        title:
          type: string
          maxLength: 200
          minLength: 0
        lines:
          type: array
          items:
            type: string
            maxLength: 120
            minLength: 0
          maxItems: 4
          minItems: 0
        copies:
          type: integer
          format: int32
          description: 1–1000, default 1
      required:
      - kind
    LabelBatchRequest:
      type: object
      description: Up to 500 labels rendered as one PDF (pages or sheets) or one ZPL stream.
      properties:
        labels:
          type: array
          items:
            $ref: '#/components/schemas/LabelRequest'
          maxItems: 500
          minItems: 0
        layout:
          type: string
          description: 'PDF: LABEL = one page per label (label printers, default), SHEET = tiled on paper'
          enum:
          - LABEL
          - SHEET
        paper:
          type: string
          description: 'PDF sheets: LETTER (default) or A4'
          enum:
          - LETTER
          - A4
      required:
      - labels
