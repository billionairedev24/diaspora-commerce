        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductType'
  /v1/products:
    get:
      tags:
      - Products
      summary: List products (own organisation; staff may filter by org)
      operationId: list
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - IN_REVIEW
          - PENDING_CATEGORY_APPROVAL
          - LIVE
          - REJECTED
          - PAUSED
          - TAKEN_DOWN
          - PENDING_EXEMPTION
          - MERGED
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: heldForTax
        in: query
        required: false
        schema:
          type: boolean
