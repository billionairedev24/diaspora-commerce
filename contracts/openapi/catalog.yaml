          - STAFF
          - AUTOMATED
        reasonCode:
          type: string
          enum:
          - PROHIBITED_ITEM
          - UNAPPROVED_HEALTH_CLAIM
          - RESTRICTED_INGREDIENT
          - COUNTERFEIT
          - IMAGE_POLICY
          - MISLEADING_CONTENT
          - LABELLING
          - SHIPPING_METHOD
          - DUPLICATE_LISTING
          - WRONG_CATEGORY
          - OTHER
