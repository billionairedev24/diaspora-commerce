      description: Sellers see their own organisation; staff name it with orgId. The customer's identity is left out. unanswered=true
        lists reviews without a reply.
      operationId: listSellerReviews
      parameters:
      - name: orgId
        in: query
        required: false
        schema:
          type: string
      - name: unanswered
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
