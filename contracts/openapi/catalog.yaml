          format: int32
        groupKey:
          type: string
        sku:
          type: string
        status:
          type: string
          enum:
          - VALID
          - WARNING
          - ERROR
        outcome:
          type: string
          enum:
          - PENDING
          - CREATED
          - UPDATED
          - FAILED
          - SKIPPED
        outcomeNote:
          type: string
        productId:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowMessage'
        cells:
          type: array
          items:
            type: string
        images:
          type: array
          description: The row's images as the preview shows them (S310)
          items:
            $ref: '#/components/schemas/ImportRowImage'
    ImportRowImage:
      type: object
      description: 'One image of an upload row: where it comes from (LINK = an https URL cell, FILE = a library file name
        in an image cell, SKU = a library file named after the SKU) and what was found (FOUND = a library image, LINK = a
        link copied when the import runs, HELD = a library image held by moderation, MISSING = no such library image,
        BAD_LINK = not a usable https link)'
      properties:
        slot:
          type: string
          enum:
          - MAIN
          - PT01
          - PT02
          - PT03
          - PT04
          - PT05
          - PT06
          - PT07
          - PT08
          - SWCH
        source:
          type: string
          enum:
          - LINK
          - FILE
          - SKU
        ref:
          type: string
          description: The link, the file name or the matched library file name
        state:
          type: string
          enum:
          - FOUND
          - LINK
          - HELD
          - MISSING
          - BAD_LINK
        url:
          type: string
          description: Thumbnail of a FOUND library image
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        message:
          type: string
      required:
      - ref
      - slot
      - source
      - state
    ProductImportRowPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductImportRow'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    GtinCheck:
      type: object
      properties:
        digits:
          type: string
        valid:
          type: boolean
        suggestion:
          type: string
        existingAtin:
          type: string
        message:
          type: string
    CategoryHint:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        path:
          type: string
        level:
          type: string
        productTypeCode:
          type: string
        matchedOn:
          type: string
    GtinPrefill:
      type: object
      properties:
        gtin:
          type: string
        found:
          type: boolean
        existingAtin:
          type: string
        title:
          type: string
        brand:
          type: string
        netContent:
          type: string
        description:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        importedFrom:
          type: object
          additionalProperties:
            type: string
        categoryHints:
          type: array
          items:
            $ref: '#/components/schemas/CategoryHint'
        sources:
          type: array
          items:
            type: string
        cached:
          type: boolean
        message:
          type: string
    CategoryNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: string
        productType:
          type: string
        path:
          type: string
    AttachLibraryImagesRequest:
      type: object
      properties:
        skus:
          type: array
          description: Only listings with one of these SKUs (any variant); empty = every listing of the organisation
          items:
            type: string
            maxLength: 64
          maxItems: 5000
    AttachLibraryImagesResult:
      type: object
      properties:
        productsUpdated:
          type: integer
          format: int32
        imagesAttached:
          type: integer
          format: int32
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/AttachSkipped'
      required:
      - imagesAttached
      - productsUpdated
      - skipped
    AttachSkipped:
      type: object
      properties:
        sku:
          type: string
        reason:
          type: string
      required:
      - reason
      - sku
    ImageUsageRequest:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
            maxLength: 2048
          maxItems: 500
        skus:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 500
    ImageUsage:
      type: object
      properties:
        usage:
          type: array
          items:
            $ref: '#/components/schemas/ImageUse'
