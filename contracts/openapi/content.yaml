        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PrivacyRequestReceipt'
      security: []
  /v1/privacy/requests/{reference}:
    get:
      tags:
      - Privacy requests
      summary: One privacy request (content:legal.view)
      operationId: getPrivacyRequest
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PrivacyRequestRecord'
  /v1/privacy/requests/{reference}/resolution:
    post:
      tags:
      - Privacy requests
      summary: Complete or deny a received request; a denial needs a reason (content:legal.edit)
      operationId: resolvePrivacyRequest
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyRequestResolution'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PrivacyRequestRecord'
  /v1/site-config:
    get:
      tags:
      - Site config
      summary: Public site configuration (ETag + revision; 304 on If-None-Match)
      operationId: get
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SiteConfig'
      security: []
    put:
      tags:
      - Site config
      summary: Save a new revision (content:site.edit). Invalid profile links block saving; a stale expectedRevision returns
        409
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteConfigRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SiteConfigSettings'
  /v1/site-config/revisions:
    get:
      tags:
      - Site config
      summary: Revision history (content:site.view)
      operationId: revisions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteConfigRevision'
  /v1/site-config/settings:
    get:
      tags:
      - Site config
      summary: Full editable configuration (content:site.view)
      operationId: settings
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SiteConfigSettings'
  /v1/slots:
    get:
      tags:
      - Placements
      summary: Slot catalogue with payload schemas and size specs (content:placements.view)
      operationId: slots
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
