openapi: 3.1.0
info:
  title: Content API
  description: Nothing promotional or legal is hard-coded. Placements (announcement bar, hero carousel, tiles, banners, product
    rows, checkout cross-sell) with targeting and a review workflow; markets & locations with per-state capability switches
    and an eligibility check; site configuration (social links, contacts, app links, locales); legal documents with versions;
    cookie consent; feature flags with OpenFeature (OFREP) evaluation; newsletter double opt-in, launch lists and careers;
    sponsored-products campaigns (CPC bids, budgets, targeting, charged clicks, 7-day-click attribution and reports) served
    to search-service's auction.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8112
  description: local
- url: https://api.dev.afrotransact.com/content
  description: dev
- url: https://api.uat.afrotransact.com/content
  description: uat
- url: https://api.afrotransact.com/content
  description: prod
security:
- bearer: []
tags:
- name: Feature flags
  description: Rollout percentages, targeting and kill switches (back office)
- name: Legal
  description: 'Legal & privacy center: current documents, versions, counsel sign-off'
- name: Sponsored products
  description: 'Seller campaigns: CPC bids, budgets, targeting, reports (S127)'
- name: Markets
  description: 'Published markets: eligibility for checkout and onboarding, country pickers, launch lists'
- name: Privacy requests
  description: 'Your Privacy Choices: access, delete, correct and opt-out requests, answered within 45 days'
- name: Careers
  description: Open roles, applications and role management
- name: Help center
  description: Help pages (shipping, returns, press, advertising…) edited without deployments
- name: Markets (back office)
  description: Draft changes to countries and state capability switches, then Publish
- name: Cookie consent
  description: Consent banner configuration, cookie table and auditable consent records (GPC aware)
- name: Newsletter
  description: Double opt-in newsletter
- name: OpenFeature (OFREP)
  description: OpenFeature Remote Evaluation Protocol v1
- name: Placements
  description: Slots, placements and the review workflow (back office)
- name: Feature flag evaluation
  description: Server-side evaluation with stable bucketing
- name: Audit
  description: Who changed which content, when
- name: Site config
  description: Social links, contacts, app links, locales and legal versions — no deployments
- name: Placement delivery
  description: Public, cacheable placements for storefront, apps and the CDN
paths:
  /ofrep/v1/evaluate/flags:
    post:
      tags:
      - OpenFeature (OFREP)
      summary: Evaluate every flag (OFREP bulk; ETag / If-None-Match → 304)
      operationId: evaluateAll
      parameters:
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfrepEvaluationRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OfrepBulkResponse'
      security: []
  /ofrep/v1/evaluate/flags/{key}:
    post:
      tags:
      - OpenFeature (OFREP)
      summary: Evaluate one flag (OFREP)
      operationId: evaluate_1
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfrepEvaluationRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      security: []
  /v1/ads/campaigns:
    get:
      tags:
      - Sponsored products
      summary: 'List campaigns (sellers: their organisation''s with ads:manage; staff: content:ads.view)'
      operationId: list_2
      parameters:
      - name: sellerOrgId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - ENDED
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdCampaign'
    post:
      tags:
      - Sponsored products
      summary: Create a campaign (ACTIVE from startsAt; ads:manage for the organisation, or content:ads.edit)
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdCampaignRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdCampaign'
  /v1/ads/campaigns/{id}:
    get:
      tags:
      - Sponsored products
      summary: Get a campaign
      operationId: get_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdCampaign'
    put:
      tags:
      - Sponsored products
      summary: Edit bids, budgets, targeting or schedule (expectedVersion required); raising the budget of a campaign paused
        at zero resumes it
      operationId: update_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdCampaignRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdCampaign'
  /v1/ads/campaigns/{id}/end:
    post:
      tags:
      - Sponsored products
      summary: End the campaign for good
      operationId: end_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdCampaign'
  /v1/ads/campaigns/{id}/pause:
    post:
      tags:
      - Sponsored products
      summary: Pause (publishes content.ads.campaign_paused)
      operationId: pause
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdCampaign'
  /v1/ads/campaigns/{id}/report:
    get:
      tags:
      - Sponsored products
      summary: 'Daily report: impressions, clicks, CTR, spend, CPC, attributed orders and sales (7-day click), ROAS (default:
        last 30 days)'
      operationId: report
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdCampaignReport'
  /v1/ads/campaigns/{id}/resume:
    post:
      tags:
      - Sponsored products
      summary: Resume a paused campaign (409 content.ads-budget-exhausted when nothing is left)
      operationId: resume
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdCampaign'
  /v1/ads/serving:
    get:
      tags:
      - Sponsored products
      summary: Campaigns eligible to serve in a market, for search-service's auction (scope ads:serve)
      description: 'ACTIVE, inside the schedule, with budget left today. remainingMinor is the smaller of the lifetime and
        today''s remaining budget. Bids are confidential: service and ads staff only.'
      operationId: serving
      parameters:
      - name: market
        in: query
        required: false
        schema:
          type: string
          default: US
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdServingResponse'
  /v1/ads/spend:
    get:
      tags:
      - Sponsored products
      summary: Charged ads spend per organisation and UTC day (metered billing, S206)
      description: Service scope ads:spend.read (seller-service) or staff with content:ads.view / content:ads.edit. Inclusive
        range of at most 93 days; only days with spend are listed. AfroTransact Retail's internal campaigns are never billed
        and are not listed.
      operationId: spend
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdSpendReport'
  /v1/audit:
    get:
      tags:
      - Audit
      summary: Audit entries, newest first (content:audit.view)
      operationId: find
      parameters:
      - name: entityType
        in: query
        required: false
        schema:
          type: string
      - name: entityId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentAuditEntry'
  /v1/careers/admin/jobs:
    get:
      tags:
      - Careers
      summary: Every role including drafts and closed ones (content:careers.view)
      operationId: allJobs
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
  /v1/careers/applications:
    get:
      tags:
      - Careers
      summary: Applications, newest first (content:careers.view)
      operationId: applications
      parameters:
      - name: jobId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplicationRecord'
  /v1/careers/jobs:
    get:
      tags:
      - Careers
      summary: Open roles, filterable by team and location
      operationId: jobs
      parameters:
      - name: team
        in: query
        required: false
        schema:
          type: string
      - name: location
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Jobs'
      security: []
    post:
      tags:
      - Careers
      summary: Create a role (content:careers.edit)
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Job'
  /v1/careers/jobs/{id}:
    get:
      tags:
      - Careers
      summary: An open role
      operationId: job
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Job'
      security: []
    put:
      tags:
      - Careers
      summary: Change, open or close a role (content:careers.edit)
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Job'
  /v1/careers/jobs/{id}/applications:
    post:
      tags:
      - Careers
      summary: Apply (résumé uploaded beforehand through media-service); returns a CAR-###### reference
      operationId: apply
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobApplication'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApplicationReceipt'
      security: []
  /v1/consent/categories/{key}:
    put:
      tags:
      - Cookie consent
      summary: Create or change a cookie category (content:legal.edit)
      operationId: saveCategory
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CookieCategory'
  /v1/consent/cookie-policy:
    get:
      tags:
      - Cookie consent
      summary: Categories and cookie table for the consent banner
      operationId: policy
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CookiePolicy'
      security: []
  /v1/consent/cookies/{name}:
    put:
      tags:
      - Cookie consent
      summary: Create or change a cookie in the table (content:legal.edit)
      operationId: saveCookie
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CookieDefinition'
    delete:
      tags:
      - Cookie consent
      summary: Remove a cookie from the table (content:legal.edit)
      operationId: deleteCookie
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/consent/records:
    post:
      tags:
      - Cookie consent
      summary: Store a consent decision (required categories forced on; GPC or a sale/sharing opt-out forces advertising off)
      operationId: record
      parameters:
      - name: Sec-GPC
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ConsentRecord'
      security: []
  /v1/flags:
    get:
      tags:
      - Feature flags
      summary: List flags (content:flags.view)
      operationId: list_1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlag'
    post:
      tags:
      - Feature flags
      summary: Create a flag (content:flags.edit)
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlagRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeatureFlag'
  /v1/flags/evaluate:
    post:
      tags:
      - Feature flag evaluation
      summary: 'Evaluate flags for a subject: map of flag → on/off'
      operationId: evaluate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateFlagsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EvaluateFlagsResponse'
      security: []
  /v1/flags/{key}:
    get:
      tags:
      - Feature flags
      summary: Get a flag (content:flags.view)
      operationId: get_2
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeatureFlag'
    put:
      tags:
      - Feature flags
      summary: Change a flag (content:flags.edit); takes effect everywhere within 30 s
      operationId: update_2
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlagRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeatureFlag'
  /v1/flags/{key}/kill-switch:
    post:
      tags:
      - Feature flags
      summary: Kill switch on/off (content:flags.edit); forces the flag off within 30 s
      operationId: killSwitch
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillSwitchRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeatureFlag'
  /v1/help/admin/articles:
    get:
      tags:
      - Help center
      summary: Every help article including drafts (content:site.view)
      operationId: allHelpArticles
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HelpArticleAdmin'
  /v1/help/articles:
    get:
      tags:
      - Help center
      summary: Published help articles (the hub excluded), by topic and text, a page at a time
      operationId: listHelpArticles
      parameters:
      - name: topic
        in: query
        required: false
        schema:
          type: string
          enum:
          - ORDERS_DELIVERY
          - RETURNS_REFUNDS
          - ACCOUNT_PAYMENTS
          - SELLING
          - COMPANY
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpArticlePage'
      security: []
  /v1/help/articles/{slug}:
    get:
      tags:
      - Help center
      summary: A published help article (help-center is the hub)
      operationId: getHelpArticle
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpArticle'
      security: []
    put:
      tags:
      - Help center
      summary: Create or change a help article (content:site.edit); expectedVersion guards concurrent edits
      operationId: saveHelpArticle
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpArticleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpArticle'
  /v1/help/articles/{slug}/draft:
    get:
      tags:
      - Help center
      summary: The working draft of a page (content:site.view)
      operationId: getHelpDraft
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpDraft'
    put:
      tags:
      - Help center
      summary: Create or change the draft; nothing public changes (content:site.edit)
      operationId: saveHelpDraft
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveHelpDraftRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpDraft'
    delete:
      tags:
      - Help center
      summary: Throw the draft away (content:site.edit)
      operationId: discardHelpDraft
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/help/articles/{slug}/draft/publication:
    post:
      tags:
      - Help center
      summary: Replace the live text with the draft and record a revision (content:site.edit)
      operationId: publishHelpDraft
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishHelpDraftRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpArticleAdmin'
  /v1/help/articles/{slug}/revisions:
    get:
      tags:
      - Help center
      summary: Every published revision of a page, newest first (content:site.view)
      operationId: listHelpRevisions
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HelpRevision'
  /v1/help/articles/{slug}/revisions/{revision}:
    get:
      tags:
      - Help center
      summary: One revision (content:site.view)
      operationId: getHelpRevision
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpRevision'
  /v1/help/articles/{slug}/revisions/{revision}/restoration:
    post:
      tags:
      - Help center
      summary: Publish an older revision's text as the newest revision (content:site.edit)
      operationId: restoreHelpRevision
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreHelpRevisionRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HelpArticleAdmin'
  /v1/legal:
    get:
      tags:
      - Legal
      summary: Current version of every document
      operationId: index
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LegalDocumentIndex'
      security: []
  /v1/legal/{type}:
    get:
      tags:
      - Legal
      summary: A document's current version, rendered (placeholders filled from the site config)
      operationId: current
      parameters:
      - name: type
        in: path
        description: 'Document key: conditions-of-use, privacy, cookies, privacy-choices, returns, seller-terms, prohibited-items,
          accessibility, sms-terms, gift-card-terms, store-credit-terms, membership-terms, referral-terms, preorder-delivery-terms,
          community-guidelines, ip-policy, provider-terms, payments-terms, subprocessors, data-processing, seller-fees'
        required: true
        schema:
          type: string
        example: sms-terms
      - name: locale
        in: query
