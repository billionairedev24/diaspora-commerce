openapi: 3.1.0
info:
  title: Authz sync
  version: v1
  description: |
    Keeps OpenFGA relationship tuples (contracts/openfga/model.fga) in sync with identity memberships and seller
    organisations. Consumes identity.role.granted / revoked (topic at.identity.events: organisation roles when orgId is
    set, platform staff roles otherwise) and seller.org.approved / updated (at.seller-org.events: platform link,
    market and SELLER / PROVIDER / BOTH capability flags) as consumer group authz-sync. Every event is one atomic,
    idempotent OpenFGA write, so replays converge. Store outages are retried until they succeed (a revocation is never
    dropped); malformed or rejected events go to at.authz-sync.dlq.events. At start-up it selects (or creates) the
    store named afrotransact and deploys contracts/openfga/model.json when the store's latest model differs.
    The HTTP surface is operational only.
servers:
  - url: http://localhost:8210
    description: local
tags:
  - name: Operations
    description: Liveness, readiness and Prometheus metrics (unauthenticated, served by the shared HTTP server)
paths:
  /healthz:
    get:
      tags: [Operations]
      summary: Liveness
      security: []
      operationId: healthz
      responses: {'200': {description: alive}}
  /readyz:
    get:
      tags: [Operations]
      summary: Readiness (OpenFGA reachable)
      security: []
      operationId: readyz
      responses: {'200': {description: ready}, '503': {description: not ready}}
  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics (authz_sync_events_total by type and outcome)
      security: []
      operationId: metrics
      responses: {'200': {description: metrics, content: {text/plain: {schema: {type: string}}}}}
