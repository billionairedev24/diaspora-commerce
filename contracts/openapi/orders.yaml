openapi: 3.1.0
info:
  title: Orders API
  description: Checkout saga on Temporal (cart validation, price and tax snapshot, all-or-nothing stock reservation, PaymentIntent
    with manual capture, payment wait with compensations), orders split into one shipment per seller and fulfilment node,
    the shipment state machine with actor rules per fulfilment type, delivery preferences and handover codes, courier events
    with proof of delivery, capture per shipment and settlement notices.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8104
  description: local
- url: https://api.dev.afrotransact.com/orders
  description: dev
- url: https://api.uat.afrotransact.com/orders
  description: uat
- url: https://api.afrotransact.com/orders
  description: prod
security:
- bearer: []
tags:
- name: Checkout
  description: 'Checkout saga (Temporal): reserve stock, authorise payment, split into shipments'
- name: Orders
  description: Your orders, order detail per viewer, customer shipment cancellation, payment split
- name: Shipments
  description: 'Shipment state machine: seller queue, status transitions per actor, courier events with proof, tracking, staff
    search'
- name: Order lookup
  description: Service-to-service order lookup (tax-returns, trust-ops)
- name: Seller analytics
  description: Seller Center dashboard figures (orders:read)
- name: Pre-orders
  description: 'Community pre-orders (S272): late adds on a customer''s behalf, missed deliveries'
paths:
  /v1/admin/orders:
    get:
      tags:
      - Shipments
      summary: Staff order search (orders:read)
      operationId: search
      parameters:
      - name: number
        in: query
        required: false
        schema:
          type: string
      - name: customer
        in: query
        required: false
        schema:
          type: string
      - name: seller
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: shipmentStatus
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderPageOrderView'
  /v1/checkout:
    post:
      tags:
      - Checkout
      summary: Place an order from the cart
      description: 'Starts the checkout saga: validate the cart and address (markets switched off block checkout), snapshot
        prices and tax, reserve AfroTransact stock (all or nothing), create the PaymentIntent (manual capture) and store the
        order + shipments as pending payment. Returns the client secret to confirm with Stripe; the order is placed when payments
        reports the authorisation (15 minutes, then everything is released). The same Idempotency-Key returns the same order.
        POST /v1/orders is an alias used by gateway-bff.'
      operationId: checkout
      parameters:
      - name: Idempotency-Key
        in: header
        description: Required; the same key returns the same order
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      responses:
        '201':
          description: Order created; awaiting payment (or already placed)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckoutView'
        '202':
          description: Still processing; poll GET /v1/checkout/{orderNumber}
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckoutView'
        '409':
          description: orders.insufficient-stock / orders.idempotency-key-reused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: orders.cart-empty, orders.cart-not-checkoutable, orders.market-disabled, orders.address-not-found,
            orders.invalid-delivery-selection
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/checkout/{orderNumber}:
    get:
      tags:
      - Checkout
      summary: Checkout status of one of my orders
      operationId: status
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckoutView'
  /v1/checkout/{orderNumber}/confirm:
    post:
      tags:
      - Checkout
      summary: I confirmed the payment (Stripe.js / PaymentSheet)
      description: Orders asks payments for the intent status and continues the saga without waiting for the webhook.
      operationId: confirm
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckoutView'
  /v1/lookup/orders/{idOrNumber}:
    get:
      tags:
      - Order lookup
      summary: Look up an order by id or number (SERVICE with orders:lookup; staff with orders:read)
      description: Customer id, payment id, the full ship-to address and every shipment with its lines (line ids = payments
        line ids), shipping, tax jurisdictions, ship-by date and return window. Used by tax-returns (returns, labels) and
        trust-ops (claim ownership, refunds). No handover codes.
      operationId: lookup
      parameters:
      - name: idOrNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderLookup'
  /v1/orders:
    get:
      tags:
      - Orders
      summary: My orders (newest first)
      description: Customer token; each order with its shipments, status timeline, tracking and handover codes. Page with
        limit and the opaque nextCursor.
      operationId: list
      parameters:
      - name: customer
        in: query
        description: Only 'me' is supported
        required: false
        schema:
          type: string
          default: me
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderPageOrderView'
    post:
      tags:
      - Checkout
      summary: Place an order from the cart
      description: 'Starts the checkout saga: validate the cart and address (markets switched off block checkout), snapshot
        prices and tax, reserve AfroTransact stock (all or nothing), create the PaymentIntent (manual capture) and store the
        order + shipments as pending payment. Returns the client secret to confirm with Stripe; the order is placed when payments
        reports the authorisation (15 minutes, then everything is released). The same Idempotency-Key returns the same order.
        POST /v1/orders is an alias used by gateway-bff.'
      operationId: checkout_1
      parameters:
      - name: Idempotency-Key
        in: header
        description: Required; the same key returns the same order
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      responses:
        '201':
          description: Order created; awaiting payment (or already placed)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckoutView'
        '202':
          description: Still processing; poll GET /v1/checkout/{orderNumber}
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckoutView'
        '409':
          description: orders.insufficient-stock / orders.idempotency-key-reused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: orders.cart-empty, orders.cart-not-checkoutable, orders.market-disabled, orders.address-not-found,
            orders.invalid-delivery-selection
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/orders/{number}:
    get:
      tags:
      - Orders
      summary: One order (by number or id)
      description: The customer sees their own order with handover codes; a seller organisation only its own shipments (totals
        of those); staff with orders:read everything except the codes.
      operationId: get
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderView'
  /v1/orders/{number}/payment-split:
    get:
      tags:
      - Orders
      summary: 'Payment split of an order (staff: all recipients; seller: own row)'
      description: 'One charge, many recipients: items, shipping, tax, commission, FBA fees, AfroTransact Delivery pickup
        fees (deliveryFeesMinor: what the seller pays for its pickup-delivery trips; on the AfroTransact row the total earned),
        Stripe fee share and net per recipient, from payments-service.'
      operationId: split
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Split'
  /v1/orders/{number}/shipments/{shipmentId}/cancel:
    post:
      tags:
      - Orders
      summary: Cancel one shipment of my order (until it is packed)
      description: Refunds or releases the shipment's amount and stock (captured shipments are refunded). Pre-order shipments
        (S272) are charged at checkout and can be cancelled until the window closes, for a full refund including their
        delivery fee; after the close 409 orders.preorder-closed.
      operationId: cancel
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelShipmentRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderView'
        '409':
          description: orders.cancel-window-closed / orders.preorder-closed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/orders/{id}/shipments/{shipmentId}/missed-delivery:
    post:
      tags:
      - Pre-orders
      summary: 'Answer a missed pre-order delivery: refund or wait for a new date (S272)'
      description: After orders.preorder.delivery_missed. REFUND cancels the pre-order shipment and refunds it in full (delivery
        fee included) unless it is already out for delivery (409); WAIT keeps it for the new date delivery-runs schedules.
        Publishes orders.preorder.missed_delivery_answered. 409 orders.delivery-not-missed before the date was missed,
        orders.missed-delivery-answered after a refund was chosen.
      operationId: missedDelivery
      parameters:
      - name: id
        in: path
        description: Order number or id
        required: true
        schema:
          type: string
      - name: shipmentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissedDeliveryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderView'
        '409':
          description: orders.delivery-not-missed / orders.missed-delivery-answered / orders.invalid-transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/seller/analytics:
    get:
      tags:
      - Seller analytics
      summary: Sales, orders and checkout conversion by day for the token's organisation
      description: Every day of [from, to] (business time zone, inclusive; default the last 30 days, at most 366) with sales
        (items − discounts of paid, not cancelled or returned shipments), units, paid orders, checkouts that reached payment
        and conversionRate = orders / checkouts; plus top products, paid orders by fulfilment and shipments waiting to ship.
      operationId: sellerAnalytics
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: org
        in: query
        description: 'Staff only: seller organisation'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SellerAnalytics'
  /v1/seller/shipments:
    get:
      tags:
      - Shipments
      summary: Seller shipment queue
      description: 'Shipments of the caller''s organisation (staff: name it with org), newest first.'
      operationId: sellerQueue
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: org
        in: query
        description: 'Staff only: seller organisation'
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderPageSellerShipmentView'
  /v1/service/pay-links/{orderNumber}/lookup:
    post:
      tags:
      - Pre-orders
      summary: Resolve a late add's pay-now link (gateway-bff, orders:pay-link)
      description: The storefront pay page (/orders/{orderNumber}/pay?token=…) shows the order and, while it awaits payment,
        the client secret of its existing manual-capture PaymentIntent, which the customer confirms with Stripe Elements.
        The token is sent in the body. A paid order answers status PAID without a client secret.
      operationId: lookupPayLink
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayLinkToken'
        required: true
      responses:
        '200':
          description: AWAITING_PAYMENT (with clientSecret) or PAID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayLinkView'
        '404':
          description: 'orders.pay-link-not-found: unknown order or wrong token'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '410':
          description: 'orders.pay-link-expired: the link expired or the order was voided'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/service/pay-links/{orderNumber}/confirm:
    post:
      tags:
      - Pre-orders
      summary: 'After stripe.confirmPayment on the pay page: place the order once authorised'
      description: Reads the PaymentIntent from Stripe (through payments) and places the order when it is authorised;
        idempotent. Answers like lookup (PAID once placed; failureMessage after a decline).
      operationId: confirmPayLink
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayLinkToken'
        required: true
      responses:
        '200':
          description: AWAITING_PAYMENT or PAID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayLinkView'
        '404':
          description: orders.pay-link-not-found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '410':
          description: orders.pay-link-expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/service/orders/late-preorder:
    post:
      tags:
      - Pre-orders
      summary: Create a late pre-order on a customer's behalf (delivery-runs-service, orders:on-behalf)
      description: Customer service adds an order to a pre-order window that is OPEN (assisted order) or CLOSED and not delivered.
        Items are priced from the catalog and must be pre-orders of the window at the address. SAVED_CARD charges the customer's
        default saved card off-session (status PLACED, or AWAITING_PAYMENT when the bank asks the customer to authenticate);
        PAYMENT_LINK creates the order's manual-capture PaymentIntent and answers a pay-now link to AfroTransact's own pay
        page (paymentLinkUrl = <storefront>/orders/<number>/pay?token=<signed token>; status AWAITING_PAYMENT,
        orders.preorder.payment_link_created), where the customer pays with Stripe Elements; never a Stripe-hosted page.
        Voided, its intent cancelled, when the link expires unpaid. lateAdd carries the window's back-office late-add settings
        (savedCard / paymentLink switches, linkExpiryHours, default 24). The order has channel AGENT_LATE and tag LATE_ADD
        and records the staff actor, reason and note. The same Idempotency-Key returns the same order (one charge);
        another key for the same customer, window and items within 10 minutes is 409 orders.late-add-duplicate.
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        description: Required; the same key returns the same order
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LatePreorderRequest'
        required: true
      responses:
        '200':
          description: Replay of the same Idempotency-Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LatePreorderView'
        '201':
          description: Created (placed or awaiting payment)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LatePreorderView'
        '403':
          description: orders.on-behalf-forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: orders.preorder-not-open, orders.preorder-not-eligible, orders.payment-failed, orders.late-add-payment-disabled,
            orders.phone-not-confirmed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/shipments/stream:
    get:
      tags:
      - Shipments
      summary: Live shipment status changes (server-sent events)
      description: Staff with orders:read receive every transition; sellers only their organisation's. Event name shipment.status_changed;
        driver and carrier updates appear within a second of commit.
      operationId: stream
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseEmitter'
  /v1/shipments/{id}/courier-events:
    post:
      tags:
      - Shipments
      summary: Driver-app event (AfroTransact Delivery)
      description: DRIVER principal with delivery:operate. Delivered needs a photo and a handover method; handing to the customer
        checks their 4-digit code when one is required; a safe place is refused for perishables and hand-delivery orders.
        Out-of-order events never move a shipment backwards; replays of the same eventId are ignored.
      operationId: courier
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierEventRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ShipmentActionResult'
  /v1/shipments/{id}/delivery-brief:
    get:
      tags:
      - Shipments
      summary: Stop details for the driver app (address, instructions, perishable, code needed)
      operationId: brief
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryBrief'
  /v1/shipments/{id}/tracking:
    post:
      tags:
      - Shipments
      summary: Record the carrier label of a carrier shipment (seller or staff)
      description: carrier.tracking.updated events are matched by label reference (shipment id) or by carrier + tracking number.
      operationId: tracking
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderView'
  /v1/shipments/{id}/transitions:
    post:
      tags:
      - Shipments
      summary: Move a shipment to another status
      description: 'Seller-fulfilled: only the seller confirms, packs and marks ready; platform admins may confirm delivery,
        record a failure, process returns or cancel — never packed. AfroTransact-fulfilled: admins and fulfilment ops own
        every step. Refusals: 403 orders.transition-forbidden (not this actor''s step) or 409 orders.invalid-transition. The
        optional Idempotency-Key makes retries safe (same key = same result).'
      operationId: transition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ShipmentActionResult'
components:
  schemas:
    PayLinkToken:
      type: object
      description: The token of the pay-now link
      properties:
        token:
          type: string
          maxLength: 200
          minLength: 1
      required:
      - token
    PayLinkView:
      type: object
      description: The pay page of a late pre-order add
      properties:
        orderNumber: {type: string}
        status: {type: string, enum: [AWAITING_PAYMENT, PAID]}
        totalMinor: {type: integer, format: int64}
        deliveryFeeMinor: {type: integer, format: int64}
        currency: {type: string}
        clientSecret: {type: string, description: Client secret of the order's PaymentIntent; only while AWAITING_PAYMENT}
        failureMessage: {type: string, description: The last decline; the customer may try again}
        expiresAt: {type: string, format: date-time}
        windowName: {type: string}
        deliversOn: {type: string, format: date}
        fulfilment: {type: string}
        lines:
          type: array
          items:
            type: object
            properties:
              title: {type: string}
              quantity: {type: integer, format: int32}
              totalMinor: {type: integer, format: int64}
    TransitionRequest:
      type: object
      description: Move a shipment to the next status
      properties:
        to:
          type: string
          description: confirmed | packed | ready | picked_up | in_transit | out_for_delivery | delivered | delivery_failed
            | returned | cancelled
          minLength: 1
        reason:
          type: string
          description: Required for cancelled and delivery_failed
          maxLength: 500
          minLength: 0
      required:
      - to
    DeliveryPreferences:
      type: object
      properties:
        handover:
          type: string
          enum:
          - HAND
          - DOOR
          - DESK
        safePlace:
          type: string
        instructions:
          type: string
        contact:
          type: string
          enum:
          - TEXT
          - CALL
          - NONE
    LineView:
      type: object
      properties:
        id:
          type: string
        lineNo:
          type: integer
          format: int32
        variantAtin:
          type: string
        productAtin:
          type: string
        title:
          type: string
        imageUrl:
          type: string
        quantity:
          type: integer
          format: int32
        unitPriceMinor:
          type: integer
          format: int64
        itemsMinor:
          type: integer
          format: int64
        taxMinor:
          type: integer
          format: int64
        discountMinor:
          type: integer
          format: int64
        category:
          type: string
        perishable:
          type: boolean
        taxJurisdiction:
          type: string
        productType:
          type: string
    LocalDeliveryView:
      type: object
      properties:
        shipFromLocationId:
          type: string
        roadMiles:
          type: number
          format: double
        durationMinutes:
          type: number
          format: double
        distanceMethod:
          type: string
        customerChargeMinor:
          type: integer
          format: int64
        sellerFeeMinor:
          type: integer
          format: int64
        pricingVersion:
          type: integer
          format: int32
    OrderView:
      type: object
      properties:
        id:
          type: string
