        key:
          type: string
        portal:
          type: string
          enum:
          - seller
          - provider
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    OrgRoleList:
      type: object
      description: 'Roles that can be granted or invited in the organisation: seller roles for SELLER, provider roles for
        PROVIDER, both groups for BOTH (Seller Center shows both nav groups)'
      properties:
        orgId:
          type: string
        kind:
          type: string
          enum:
          - SELLER
          - PROVIDER
          - BOTH
        roles:
          type: array
          items:
            $ref: '#/components/schemas/OrgRole'
    OrgMember:
      type: object
      description: One member of the organisation's team
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        name:
          type: string
          description: First and last name
          examples:
          - Adaeze Okafor
        email:
          type: string
        roleKey:
          type: string
          examples:
          - seller.admin
        roleLabel:
          type: string
          description: Role display name
          examples:
          - Admin
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        joinedAt:
          type: string
          format: date-time
          description: When the membership was created
    OrgMemberList:
      type: object
      properties:
        orgId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrgMember'
    OrgInvitationList:
      type: object
      properties:
        orgId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrgInvitation'
    Session:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        signedInAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    MfaStatus:
      type: object
      properties:
        totp:
          type: boolean
        sms:
          type: boolean
        smsPhone:
          type: string
        recoveryCodesLeft:
          type: integer
          format: int32
        passkeys:
          type: integer
          format: int32
        required:
          type: boolean
        mayDisable:
          type: boolean
        mayRemoveTotp:
          type: boolean
          description: The authenticator app may be turned off now (staff only while SMS codes stay on)
        mayRemoveSms:
          type: boolean
          description: SMS codes may be turned off now (staff only while the authenticator app stays on)
    LinkedAccount:
      type: object
      properties:
        provider:
          type: string
        email:
          type: string
        linkedAt:
          type: string
          format: date-time
        canUnlink:
          type: boolean
    LinkedAccounts:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccount'
        hasPassword:
          type: boolean
        passkeys:
          type: integer
          format: int32
        linkPathTemplate:
          type: string
          description: 'Start linking by visiting this path on the authorization server while signed in: /oauth2/authorization/{provider}'
    ChannelPreferences:
      type: object
      description: false = drop the channel (except security messages)
      properties:
        email:
          type: boolean
        sms:
          type: boolean
        push:
          type: boolean
    PushTarget:
      type: object
      properties:
        token:
          type: string
        platform:
          type: string
          description: Push transport
          enum:
          - fcm
          - apns
        app:
          type: string
          enum:
          - customer
          - driver
        os:
          type: string
          enum:
          - ios
          - android
          - web
    UserContact:
      type: object
      properties:
        userId:
          type: string
        firstName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        phone:
          type: string
          description: E.164
        phoneVerified:
          type: boolean
          description: 'false: the number was never confirmed with a code; do not text it'
        locale:
          type: string
          description: BCP 47, null = default
        timeZone:
          type: string
          description: IANA zone, null = market zone
        market:
          type: string
          description: ISO country, e.g. US
        pushTokens:
          type: array
          items:
            $ref: '#/components/schemas/PushTarget'
        preferences:
          $ref: '#/components/schemas/ChannelPreferences'
        marketingOptIn:
          type: boolean
    OrgOwners:
      type: object
      properties:
        orgId:
          type: string
        ownerUserIds:
          type: array
          items:
            type: string
    IdentityProvider:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        authorizationPath:
          type: string
    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserAccess'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    Permission:
      type: object
      properties:
        key:
          type: string
        module:
          type: string
        description:
          type: string
    ModuleMatrix:
      type: object
      description: 'Rows: modules; columns: roles; cells: none/view/edit/approve/full'
      properties:
        portal:
          type: string
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleRow'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    ModuleRow:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        levels:
          type: object
          additionalProperties:
            type: string
    DataProtectionStatus:
      type: object
      description: secretsByKey counts TOTP secrets per key id; 'plaintext' counts legacy rows not sealed yet
      properties:
        currentKeyId:
          type: string
        secretsByKey:
          type: object
          additionalProperties:
            type: integer
            format: int64
    AccessChange:
      type: object
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actorId:
          type: string
        action:
          type: string
        targetUserId:
          type: string
          format: uuid
        targetRole:
          type: string
        subject:
          type: string
        detail:
          type: string
    AccessChangePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessChange'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    UnregisterDeviceRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 4096
          minLength: 0
      required:
      - token
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
