  /v1/me/phone/verification:
    post:
      tags:
      - Me
      summary: Text a 6-digit code to the account's phone number (S234)
      description: Independent of MFA. 10-minute expiry, 5 wrong attempts, at most 1 code per 30 seconds and 5 per hour (429
        + Retry-After). 422 identity.phone-missing without a phone; 409 identity.phone-already-verified. Published as identity.verification.requested
        (channel sms, purpose PHONE_VERIFICATION).
      operationId: startPhoneVerification
      responses:
        '202':
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PhoneCodeSent'
  /v1/me/phone/verification/confirm:
    post:
      tags:
      - Me
      summary: Confirm the phone number with the SMS code
      description: 422 identity.invalid-code / code-expired / too-many-attempts / code-used / phone-changed. Changing the
        phone with PATCH /v1/me resets phoneVerified. Publishes identity.user.phone-verified.
      operationId: confirmPhoneVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
