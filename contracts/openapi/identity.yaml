              schema:
                $ref: '#/components/schemas/Passkey'
  /v1/me/passkeys/registrations:
    post:
      tags:
      - Login & security
      summary: Start registering a passkey for the signed-in account
      description: Returns WebAuthn creation options valid for five minutes and one registration. Up to 20 passkeys per account
        (422 identity.too-many-passkeys).
      operationId: startPasskeyRegistration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationStartRequest'
