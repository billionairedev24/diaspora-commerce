  /v1/orgs/{orgId}:
    put:
      tags:
      - Organisations
      summary: Create or update an organisation and its approval status
      operationId: upsert
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrgRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Organization'
  /v1/orgs/{orgId}/invitations:
    get:
      tags:
      - Organisations
      summary: Pending (unexpired) invitations
      operationId: pendingInvitations
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrgInvitationList'
    post:
      tags:
      - Organisations
      summary: Invite someone by email with an organisation role
      description: Publishes identity.invitation.created with a single-use token (7 days) for notifications-service to email.
        Inviting the same email again replaces the open invitation. 409 identity.already-member when the email already belongs
        to a member.
      operationId: invite
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrgInvitation'
  /v1/orgs/{orgId}/invitations/{invitationId}:
    delete:
      tags:
      - Organisations
      summary: Revoke a pending invitation (publishes identity.invitation.revoked)
      operationId: revokeInvitation
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
  /v1/orgs/{orgId}/members:
    get:
      tags:
      - Organisations
      summary: 'Member directory: names, email, role, status and join date'
      description: Members of the (approved) organisation whose role has team:manage or at least VIEW on the Team & roles
        module; staff and services with orgs:read or orgs:manage.
      operationId: members
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrgMemberList'
  /v1/orgs/{orgId}/members/{userId}:
    put:
      tags:
      - Organisations
      summary: Change a member's organisation role (seller.* / provider.*)
      description: team:manage members change other members' roles (not their own; only owners grant or change the owner role).
        The seller service and staff (orgs:manage) may also add a member. The last owner can't be demoted (422 identity.last-owner).
        Publishes identity.role.revoked for the old role and identity.role.granted for the new one.
      operationId: setMember
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMemberRequest'
        required: true
      responses:
        '204':
          description: No Content
    delete:
      tags:
      - Organisations
      summary: Remove a member
      description: The last owner can't be removed (422 identity.last-owner); only owners remove owners. Publishes identity.role.revoked.
      operationId: removeMember
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
  /v1/orgs/{orgId}/roles:
    get:
      tags:
      - Organisations
      summary: Roles assignable in the organisation (Seller Center role pickers, S245)
      description: Same readers as the member directory. BOTH organisations get the seller and provider roles.
      operationId: orgRoles
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrgRoleList'
  /v1/password-reset:
    post:
      tags:
      - Password reset
      summary: Ask for a password reset code (always 202, whether or not the email has an account)
      description: 'If the email belongs to an account with a password, a 6-digit code (10-minute expiry, single use) is sent
        by email and, when the account has a verified phone, by text message. An account that only signs in with Google,
        Apple or Facebook gets an email saying to sign in with that provider instead. Unknown emails get nothing, and the
        answer is the same in every case (no account enumeration). Every request counts towards per-email and per-IP limits:
        429 identity.reset-locked with Retry-After once they are exceeded.'
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
      security: []
  /v1/password-reset/confirm:
    post:
      tags:
      - Password reset
      summary: Set a new password with the emailed or texted code
      description: 'The new password follows the sign-up policy (422 identity.invalid-password-reset with fieldErrors.newPassword
        / confirmPassword). A wrong, expired, used or unknown code, or an email without an account, all answer 422
        identity.invalid-reset-code (fieldErrors.code) and count towards the per-email and per-IP lockout (429
        identity.reset-locked with Retry-After). On success every session and refresh token of the account is revoked.'
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: No Content
      security: []
components:
  schemas:
    OrgSyncResult:
      type: object
      properties:
        orgId:
          type: string
        status:
          type: string
          description: identity's status after the sync; null when the organisation has none yet
          enum:
          - PENDING
          - APPROVED
          - SUSPENDED
          - REJECTED
        repaired:
          type: boolean
          description: true when identity's copy was repaired
    OrgReconcileSummary:
      type: object
      properties:
        scanned:
          type: integer
          format: int32
        repaired:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
    UpsertOrgRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - SELLER
          - PROVIDER
          - BOTH
          minLength: 1
        name:
          type: string
          maxLength: 200
          minLength: 0
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - SUSPENDED
          - REJECTED
          minLength: 1
      required:
      - kind
      - name
      - status
    Organization:
      type: object
      properties:
        id:
          type: string
          examples:
          - org_3k2j9x8q7w6e5r4t3y2u
        kind:
          type: string
          enum:
          - SELLER
          - PROVIDER
          - BOTH
        name:
          type: string
        status:
          type: string
        market:
          type: string
          description: Market code as content-service defines it (ISO 3166-1 alpha-2)
          examples:
          - US
        updatedAt:
          type: string
          format: date-time
    SetMemberRequest:
      type: object
      properties:
        roleKey:
          type: string
          examples:
          - seller.fulfilment
          minLength: 1
      required:
      - roleKey
    ChangePasswordRequest:
      type: object
      description: currentPassword is required when the account has one
      properties:
        currentPassword:
          type: string
          maxLength: 128
          minLength: 0
        newPassword:
          type: string
