openapi: 3.1.0
info:
  title: Identity API
  description: Accounts, sign-up and verification, role-based landing, access control administration, MFA, passkeys and social
    sign-in. OAuth 2.1 / OIDC endpoints are described by /.well-known/openid-configuration.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8100
  description: local
- url: https://api.dev.afrotransact.com/identity
  description: dev
- url: https://api.uat.afrotransact.com/identity
  description: uat
- url: https://api.afrotransact.com/identity
  description: prod
security:
- bearer: []
tags:
- name: Organisation sync
  description: Repairs identity's copy of seller and provider organisations from the seller service (the source of truth)
    when an approval event was missed or arrived late
- name: Two-step verification
  description: Authenticator app, SMS codes and recovery codes
- name: Data protection
  description: 'Encryption at rest of MFA secrets: key status and key rotation (staff with platform.super_admin only)'
- name: Notification preferences
  description: Account-level email, SMS and push switches and marketing opt-in, read by notifications-service (security messages
    such as one-time codes always go out)
- name: Address book
  description: The signed-in customer's saved delivery addresses
- name: Login & security
  description: Password, active sessions, linked social accounts and passkeys
- name: Organisations
  description: Seller/provider organisations mirrored from the seller service (orgs:manage), their member directory, role
    changes and invitations (team:manage members, staff, seller service)
- name: Devices
  description: Push notification devices of the signed-in shopper (customer app, web) or driver (driver app)
- name: Internal lookups
  description: 'Service-to-service lookups for notifications-service: SERVICE principals (client credentials) with users:read.
    404 = unknown user or organisation.'
- name: Accounts
  description: Unified sign-up and email verification (public)
- name: Invitations
  description: The invitee's side of organisation invitations (token from the invite link)
- name: Identity providers
  description: Which social sign-in buttons appear (Developers › Identity providers)
- name: Me
  description: 'The signed-in user: profile, roles, permissions and role-based landing'
- name: Access control
  description: Module matrix, capabilities, people and change log (access:read to view, access:admin to change)
- name: First-party sign-in
  description: Password, two-step and passkey sign-in for the storefront's own forms, called by gateway-bff only (client-credentials
    token, scope auth:first-party). A completed sign-in returns a one-time loginTicket that the BFF redeems on GET /oauth2/authorize?…&login_ticket=…
    (authorization code + PKCE), then exchanges the code at /oauth2/token. Failed attempts count towards per-account and per-IP
    lockouts (429 identity.sign-in-locked with Retry-After).
- name: Password reset
  description: 'Forgotten password (public, enumeration-safe): request a 6-digit code (email, plus SMS to a verified phone; 10-minute
    expiry, single use, hashed at rest), then set a new password with it. Requests and wrong codes are rate-limited per email and
    per IP with escalating lockouts (429 with Retry-After). A completed reset signs the account out everywhere (refresh tokens,
    browser sessions, trusted browsers) and emails a "your password was changed" notice. Staff still need two-step verification
    at the next sign-in. The hosted pages /login/forgot use the same rules.'
paths:
  /v1/accounts:
    post:
      tags:
      - Accounts
      summary: Create an account (customers, sellers and providers use the same form)
      description: Adds account.customer, plus the seller/provider applicant role when intent is sell/provide. A 6-digit code
        is emailed (10-minute expiry). With invitationToken (organisation invite link, same email) the account starts verified,
        joins the organisation and no code is sent.
      operationId: signUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SignUpResponse'
      security: []
  /v1/accounts/verification:
    post:
      tags:
      - Accounts
      summary: Confirm the email address with the 6-digit code
      operationId: verify_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '204':
          description: No Content
      security: []
  /v1/accounts/verification/resend:
    post:
      tags:
      - Accounts
      summary: Send a new code (at most 1 per 30 seconds and 5 per hour; 429 with Retry-After otherwise)
      operationId: resend
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendCodeRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CodeSentResponse'
      security: []
  /v1/admin/access-log:
    get:
      tags:
      - Access control
      summary: Append-only access change log (who changed what and when)
      operationId: log
      parameters:
      - name: userId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccessChangePage'
  /v1/admin/data-protection:
    get:
      tags:
      - Data protection
      summary: Current data-protection key and TOTP secrets per key (platform.super_admin)
      operationId: dataProtectionStatus
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataProtectionStatus'
  /v1/admin/data-protection/rotate:
    post:
      tags:
      - Data protection
      summary: Re-encrypt every TOTP secret under the current key (platform.super_admin)
      description: Run after deploying a new IDENTITY_DATA_KEY with the old key in IDENTITY_DATA_KEYS_PREVIOUS. Online and
        idempotent; audited in the access change log.
      operationId: rotateDataProtectionKey
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DataProtectionRotation'
  /v1/admin/identity-providers:
    get:
      tags:
      - Identity providers
      summary: All providers with their switch and configuration state (access:read)
      operationId: all
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderAdmin'
  /v1/admin/identity-providers/{providerId}:
    put:
      tags:
      - Identity providers
      summary: Enable or disable a provider (access:admin)
      operationId: set
      parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProviderEnabledRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdentityProviderAdmin'
  /v1/admin/module-access:
    get:
      tags:
      - Access control
      summary: Module access matrix of a portal
      operationId: matrix
      parameters:
      - name: portal
        in: query
        required: false
        schema:
          type: string
          default: platform
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModuleMatrix'
  /v1/admin/module-access/{portal}/{moduleKey}/{roleKey}:
    put:
      tags:
      - Access control
      summary: Set one cell of the module access matrix
      operationId: setModuleAccess
      parameters:
      - name: portal
        in: path
        required: true
        schema:
          type: string
      - name: moduleKey
        in: path
        required: true
        schema:
          type: string
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModuleAccessRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModuleAccess'
  /v1/admin/permissions:
    get:
      tags:
      - Access control
      summary: Permission catalogue
      operationId: permissions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
  /v1/admin/roles:
    get:
      tags:
      - Access control
      summary: Roles of a portal with their permissions (capabilities tab)
      operationId: roles
      parameters:
      - name: portal
        in: query
        required: false
        schema:
          type: string
          default: platform
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
  /v1/admin/roles/{roleKey}/permissions/{permissionKey}:
    put:
      tags:
      - Access control
      summary: Add a permission to a role
      operationId: addRolePermission
      parameters:
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      - name: permissionKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Role'
    delete:
      tags:
      - Access control
      summary: Remove a permission from a role (holders lose it on their next token)
      operationId: removeRolePermission
      parameters:
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      - name: permissionKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Role'
  /v1/admin/users:
    get:
      tags:
      - Access control
      summary: 'People: search users by name or email'
      operationId: users
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserPage'
    post:
      tags:
      - Access control
      summary: Provision a staff or driver account with initial roles
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffUserRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}:
    get:
      tags:
      - Access control
      summary: A user's roles, direct grants and effective permissions
      operationId: user
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}/addresses:
    get:
      tags:
      - Address book
      summary: A customer's saved addresses, default first (staff late adds and support; users:read)
      operationId: listOf
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '403':
          description: Missing users:read
  /v1/admin/users/{userId}/disable:
    post:
      tags:
      - Access control
      summary: Disable an account; all its sessions end immediately
      operationId: disable
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}/enable:
    post:
      tags:
      - Access control
      summary: Re-enable an account
      operationId: enable
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}/permissions/{permissionKey}:
    put:
      tags:
      - Access control
      summary: Grant a permission directly (for example delivery:operate)
      operationId: grant
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: permissionKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
    delete:
      tags:
      - Access control
      summary: Revoke a direct permission grant (takes effect on the user's next token)
      operationId: revoke
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: permissionKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}/roles/{roleKey}:
    put:
      tags:
      - Access control
      summary: Assign an account or platform role
      description: 'S248: market (ISO 3166-1 alpha-2, e.g. GB) scopes a staff role to one market; repeat for more markets.
        Without market the role is platform-wide. A role is either platform-wide or market-scoped (409 identity.role-platform-wide
        / identity.role-market-scoped). Super Admin and account roles are never market-scoped (422 identity.role-not-market-scoped).
        identity.role.granted carries the market for authz-sync.'
      operationId: assignRole
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      - name: market
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
    delete:
      tags:
      - Access control
      summary: Remove a role (takes effect on the user's next token)
      description: With market, removes only that market's scope (the role goes when its last market does); without market,
        removes the role with every market.
      operationId: removeRole
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      - name: market
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/auth/mfa/sms:
    post:
      tags:
      - First-party sign-in
      summary: Text a sign-in code for an MFA challenge
      operationId: sms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaSmsRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SmsCodeResponse'
  /v1/auth/mfa/verify:
    post:
      tags:
      - First-party sign-in
      summary: Verify an authenticator, text-message or recovery code (returns a login ticket)
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SignInStepResponse'
  /v1/auth/passkey/options:
    post:
      tags:
      - First-party sign-in
      summary: Start a passkey sign-in (WebAuthn assertion options)
      operationId: passkeyOptions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyOptionsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PasskeyOptionsResponse'
  /v1/auth/passkey/verify:
    post:
      tags:
      - First-party sign-in
      summary: Verify a passkey assertion (returns a login ticket; passkeys need no second factor)
      operationId: passkeyVerify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyVerifyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SignInStepResponse'
  /v1/auth/password:
    post:
      tags:
      - First-party sign-in
      summary: Sign in with email and password (returns an MFA challenge or a login ticket)
      operationId: password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SignInStepResponse'
  /v1/identity-providers:
    get:
      tags:
      - Identity providers
      summary: Enabled social providers for sign-in screens (public)
      operationId: enabled
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProvider'
      security: []
  /v1/internal/orgs/reconcile:
    post:
      tags:
      - Organisation sync
      summary: Reconcile every approved or suspended organisation with the seller service now
      description: What the scheduled job does on start-up and every few minutes, on request (the local repair command, an
        operator). Needs a service or staff token with orgs:manage.
      operationId: reconcileAll
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrgReconcileSummary'
  /v1/orgs/{orgId}/sync:
    post:
      tags:
      - Organisation sync
      summary: Sync one organisation from the seller service now
      description: 'gateway-bff calls it with the person''s token when the seller service shows the organisation approved
        and identity does not yet: identity reads the seller service, corrects the status and adds the owners'' memberships,
        so the next token carries the organisation. The caller must be an owner or the approved applicant at the seller service,
        or a service or staff member with orgs:manage; anyone else gets 404.'
      operationId: sync
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrgSyncResult'
  /v1/internal/orgs/{orgId}/owners:
    get:
      tags:
      - Internal lookups
      summary: Owner accounts of a seller or provider organisation
      operationId: owners
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrgOwners'
  /v1/internal/users/{userId}/contact:
    get:
      tags:
      - Internal lookups
      summary: 'How to reach a user: email, verified phone, push tokens, locale, time zone, market, channel switches'
      operationId: contact
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: app
        in: query
        description: Only push tokens of this app
        required: false
        schema:
          type: string
          enum:
          - customer
          - driver
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserContact'
  /v1/invitations/accept:
    post:
      tags:
      - Invitations
      summary: Accept an invitation as the signed-in user
      description: 'The account email must be the invited one (422 identity.invitation-email-mismatch). Expired, used or revoked
        tokens: 422 identity.invitation-expired / -used / -revoked. People without an account sign up with POST /v1/accounts
        and invitationToken instead. Publishes identity.role.granted and identity.invitation.accepted.'
      operationId: accept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AcceptedInvitation'
  /v1/invitations/lookup:
    post:
      tags:
      - Invitations
      summary: Look up an invitation link (public)
      description: Organisation, role, invited email and status for the accept / sign-up page. 404 for unknown tokens. The
        token is sent in the body so it stays out of access logs.
      operationId: lookup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InvitationPreview'
      security: []
  /v1/me:
    get:
      tags:
      - Me
      summary: Profile, roles, effective permissions, organisations and landing
      operationId: me
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Me'
    patch:
      tags:
      - Me
      summary: Complete or edit the profile (social sign-ups add their phone and accept terms here)
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Me'
  /v1/me/active-org:
    put:
      tags:
      - Me
      summary: Choose the organisation to act for (token org claim from the next token)
      operationId: selectOrg
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOrgRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Me'
  /v1/me/addresses:
    get:
      tags:
      - Address book
      summary: List saved addresses (default first)
      operationId: list_1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags:
      - Address book
      summary: Add an address; the first one becomes the default
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
