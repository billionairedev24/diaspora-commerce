                  $ref: '#/components/schemas/Passkey'
    post:
      tags:
      - Login & security
      summary: Finish registering a passkey
      description: Verifies the attestation (challenge, origin, RP id, user presence and verification) with the same relying
        party as the hosted page. 422 identity.passkey-rejected; 409 identity.passkey-registration-expired when the registration
        expired, was used or is another account's.
      operationId: registerPasskey
      requestBody:
        content:
