openapi: 3.1.0
info:
  title: Identity API
  description: Accounts, sign-up and verification, role-based landing, access control administration, MFA, passkeys and social
    sign-in. OAuth 2.1 / OIDC endpoints are described by /.well-known/openid-configuration.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8100
  description: local
- url: https://api.dev.afrotransact.com/identity
  description: dev
- url: https://api.uat.afrotransact.com/identity
  description: uat
- url: https://api.afrotransact.com/identity
  description: prod
security:
- bearer: []
tags:
- name: Two-step verification
  description: Authenticator app, SMS codes and recovery codes
- name: Address book
  description: The signed-in customer's saved delivery addresses
- name: Login & security
  description: Password, active sessions, linked social accounts and passkeys
- name: Access control
  description: Module matrix, capabilities, people and change log (access:read to view, access:admin to change)
- name: Organisations
  description: Seller/provider organisations mirrored from the seller service (orgs:manage)
- name: Accounts
  description: Unified sign-up and email verification (public)
- name: Identity providers
  description: Which social sign-in buttons appear (Developers › Identity providers)
- name: Me
  description: 'The signed-in user: profile, roles, permissions and role-based landing'
paths:
  /v1/accounts:
    post:
      tags:
      - Accounts
      summary: Create an account (customers, sellers and providers use the same form)
      description: Adds account.customer, plus the seller/provider applicant role when intent is sell/provide. A 6-digit code
        is emailed (10-minute expiry).
      operationId: signUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SignUpResponse'
      security: []
  /v1/accounts/verification:
    post:
      tags:
      - Accounts
      summary: Confirm the email address with the 6-digit code
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '204':
          description: No Content
      security: []
  /v1/accounts/verification/resend:
    post:
      tags:
      - Accounts
      summary: Send a new code (at most 1 per 30 seconds and 5 per hour; 429 with Retry-After otherwise)
      operationId: resend
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendCodeRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CodeSentResponse'
      security: []
  /v1/admin/access-log:
    get:
      tags:
      - Access control
      summary: Append-only access change log (who changed what and when)
      operationId: log
      parameters:
      - name: userId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccessChangePage'
  /v1/admin/identity-providers:
    get:
      tags:
      - Identity providers
      summary: All providers with their switch and configuration state (access:read)
      operationId: all
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderAdmin'
  /v1/admin/identity-providers/{providerId}:
    put:
      tags:
      - Identity providers
      summary: Enable or disable a provider (access:admin)
      operationId: set
      parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProviderEnabledRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IdentityProviderAdmin'
  /v1/admin/module-access:
    get:
      tags:
      - Access control
      summary: Module access matrix of a portal
      operationId: matrix
      parameters:
      - name: portal
        in: query
        required: false
        schema:
          type: string
          default: platform
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModuleMatrix'
  /v1/admin/module-access/{portal}/{moduleKey}/{roleKey}:
    put:
      tags:
      - Access control
      summary: Set one cell of the module access matrix
      operationId: setModuleAccess
      parameters:
      - name: portal
        in: path
        required: true
        schema:
          type: string
      - name: moduleKey
        in: path
        required: true
        schema:
          type: string
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModuleAccessRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModuleAccess'
  /v1/admin/permissions:
    get:
      tags:
      - Access control
      summary: Permission catalogue
      operationId: permissions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
  /v1/admin/roles:
    get:
      tags:
      - Access control
      summary: Roles of a portal with their permissions (capabilities tab)
      operationId: roles
      parameters:
      - name: portal
        in: query
        required: false
        schema:
          type: string
          default: platform
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
  /v1/admin/roles/{roleKey}/permissions/{permissionKey}:
    put:
      tags:
      - Access control
      summary: Add a permission to a role
      operationId: addRolePermission
      parameters:
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      - name: permissionKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Role'
    delete:
      tags:
      - Access control
      summary: Remove a permission from a role (holders lose it on their next token)
      operationId: removeRolePermission
      parameters:
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      - name: permissionKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Role'
  /v1/admin/users:
    get:
      tags:
      - Access control
      summary: 'People: search users by name or email'
      operationId: users
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserPage'
    post:
      tags:
      - Access control
      summary: Provision a staff or driver account with initial roles
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffUserRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}:
    get:
      tags:
      - Access control
      summary: A user's roles, direct grants and effective permissions
      operationId: user
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}/disable:
    post:
      tags:
      - Access control
      summary: Disable an account; all its sessions end immediately
      operationId: disable
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}/enable:
    post:
      tags:
      - Access control
      summary: Re-enable an account
      operationId: enable
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}/permissions/{permissionKey}:
    put:
      tags:
      - Access control
      summary: Grant a permission directly (for example delivery:operate)
      operationId: grant
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: permissionKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
    delete:
      tags:
      - Access control
      summary: Revoke a direct permission grant (takes effect on the user's next token)
      operationId: revoke
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: permissionKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/admin/users/{userId}/roles/{roleKey}:
    put:
      tags:
      - Access control
      summary: Assign an account or platform role
      operationId: assignRole
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
    delete:
      tags:
      - Access control
      summary: Remove a role (takes effect on the user's next token)
      operationId: removeRole
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleKey
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserAccess'
  /v1/identity-providers:
    get:
      tags:
      - Identity providers
      summary: Enabled social providers for sign-in screens (public)
      operationId: enabled
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProvider'
      security: []
  /v1/me:
    get:
      tags:
      - Me
      summary: Profile, roles, effective permissions, organisations and landing
      operationId: me
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Me'
    patch:
      tags:
      - Me
      summary: Complete or edit the profile (social sign-ups add their phone and accept terms here)
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Me'
  /v1/me/active-org:
    put:
      tags:
      - Me
      summary: Choose the organisation to act for (token org claim from the next token)
      operationId: selectOrg
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOrgRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Me'
  /v1/me/addresses:
    get:
      tags:
      - Address book
      summary: List saved addresses (default first)
      operationId: list
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags:
      - Address book
      summary: Add an address; the first one becomes the default
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Address'
  /v1/me/addresses/{id}:
    delete:
      tags:
      - Address book
      summary: Remove an address (the next most recent becomes default if needed)
      operationId: remove
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Address book
      summary: Edit an address
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Address'
  /v1/me/addresses/{id}/default:
    post:
      tags:
      - Address book
      summary: Make an address the default
      operationId: makeDefault
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Address'
  /v1/me/linked-accounts:
    get:
      tags:
      - Login & security
      summary: Linked Google / Apple / Facebook accounts
      operationId: linked
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LinkedAccounts'
  /v1/me/linked-accounts/{provider}:
    delete:
      tags:
      - Login & security
      summary: Unlink a social account (refused for the last sign-in method)
      operationId: unlink
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LinkedAccounts'
  /v1/me/mfa:
    get:
      tags:
      - Two-step verification
      summary: Enrolled factors and whether MFA is required / may be turned off (never for staff)
      operationId: status
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MfaStatus'
  /v1/me/mfa/recovery-codes:
    post:
      tags:
      - Two-step verification
      summary: Regenerate recovery codes (old ones stop working)
      operationId: regenerate
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
  /v1/me/mfa/sms:
    post:
      tags:
      - Two-step verification
      summary: Text a code to the account phone to turn on SMS sign-in codes
      operationId: startSms
      responses:
        '202':
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CodeSent'
    delete:
      tags:
      - Two-step verification
      summary: Turn off SMS sign-in codes (403 for staff)
      operationId: disableSms
      responses:
        '204':
          description: No Content
  /v1/me/mfa/sms/confirm:
    post:
      tags:
      - Two-step verification
      summary: Confirm SMS sign-in codes; returns recovery codes the first time
      operationId: confirmSms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
  /v1/me/mfa/totp:
    post:
      tags:
      - Two-step verification
      summary: Start authenticator-app enrolment (QR otpauth URI)
      operationId: startTotp
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TotpSetup'
    delete:
      tags:
      - Two-step verification
      summary: Turn off the authenticator app (403 for staff)
      operationId: disableTotp
      responses:
        '204':
          description: No Content
  /v1/me/mfa/totp/confirm:
    post:
      tags:
      - Two-step verification
      summary: Confirm the authenticator app with a code; returns recovery codes the first time
      operationId: confirmTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
  /v1/me/passkeys:
    get:
      tags:
      - Login & security
      summary: Registered passkeys (register at /webauthn/register on the authorization server)
      operationId: passkeys
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Passkey'
  /v1/me/passkeys/{credentialId}:
    delete:
      tags:
      - Login & security
      summary: Remove a passkey (refused for the last sign-in method)
      operationId: removePasskey
      parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/me/password:
    put:
      tags:
      - Login & security
      summary: Change password (requires the current password)
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: No Content
  /v1/me/roles/provider-applicant:
    post:
      tags:
      - Me
      summary: 'Offer services: adds account.provider_applicant to this account (no second sign-up)'
      operationId: startProviding
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Me'
  /v1/me/roles/seller-applicant:
    post:
      tags:
      - Me
      summary: 'Start selling: adds account.seller_applicant to this account (no second sign-up)'
      operationId: startSelling
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Me'
  /v1/me/sessions:
    get:
      tags:
      - Login & security
      summary: Active sessions (one per signed-in app or device); current marks this device
      operationId: sessions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
  /v1/me/sessions/revoke-others:
    post:
      tags:
      - Login & security
      summary: Sign out other devices
      operationId: revokeOthers
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RevokedSessions'
  /v1/me/sessions/{sessionId}:
    delete:
      tags:
      - Login & security
      summary: Sign out one session (its refresh token stops working immediately)
      operationId: revoke_1
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /v1/orgs/{orgId}:
    put:
      tags:
      - Organisations
      summary: Create or update an organisation and its approval status
      operationId: upsert
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrgRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Organization'
  /v1/orgs/{orgId}/members/{userId}:
    put:
      tags:
      - Organisations
      summary: Add a member or change their organisation role (seller.* / provider.*)
      operationId: setMember
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMemberRequest'
        required: true
      responses:
        '204':
          description: No Content
    delete:
      tags:
      - Organisations
      summary: Remove a member
      operationId: removeMember
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
components:
  schemas:
    UpsertOrgRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - SELLER
          - PROVIDER
          minLength: 1
        name:
          type: string
          maxLength: 200
          minLength: 0
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - SUSPENDED
          - REJECTED
          minLength: 1
      required:
      - kind
      - name
      - status
    Organization:
      type: object
      properties:
        id:
          type: string
          examples:
          - org_3k2j9x8q7w6e5r4t3y2u
        kind:
          type: string
        name:
          type: string
        status:
          type: string
        market:
          type: string
        updatedAt:
          type: string
