components:
  schemas:
    TeamMemberRequest:
      type: object
      properties:
        userId:
          type: string
          description: Identity user id of the member's login
          maxLength: 120
          minLength: 0
        displayName:
          type: string
          maxLength: 120
          minLength: 0
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - PRACTITIONER
          - FINANCE
        bookable:
          type: boolean
          description: 'Takes appointments; default: owners and practitioners'
        active:
          type: boolean
        hours:
          $ref: '#/components/schemas/WeeklyHours'
      required:
      - displayName
      - role
    TimeRange:
      type: object
      description: Local wall-clock range, end exclusive
      properties:
        start:
          type: string
          example: 600
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          example: 1080
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      required:
      - end
      - start
    WeeklyHours:
      type: object
      description: Ranges per weekday (MONDAY…SUNDAY); several ranges = breaks; missing day = closed
      properties:
        days:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TimeRange'
      required:
      - days
    TeamMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        userId:
          type: string
        displayName:
          type: string
        role:
          type: string
        bookable:
          type: boolean
        active:
          type: boolean
        hours:
          $ref: '#/components/schemas/WeeklyHours'
        version:
          type: integer
          format: int64
    DayOverride:
      type: object
      description: Time off (closed) or special hours on one date
      properties:
        date:
          type: string
          format: date
        closed:
          type: boolean
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
        note:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - date
    BookingRules:
      type: object
      description: Working-hours screen rules
      properties:
        leadMinutes:
          type: integer
          format: int32
          description: Minimum notice in minutes
          example: 720
          minimum: 0
        horizonDays:
          type: integer
          format: int32
          description: Book up to N days ahead
          example: 30
          maximum: 365
          minimum: 1
        bufferMinutes:
          type: integer
          format: int32
          description: Buffer after each booking
          example: 15
          maximum: 240
          minimum: 0
        stepMinutes:
          type: integer
          format: int32
          description: Time slot interval
          example: 30
          maximum: 240
          minimum: 5
        maxPerDay:
          type: integer
          format: int32
          description: Max bookings per team member per day
          example: 6
          maximum: 50
          minimum: 1
        instantBooking:
          type: boolean
        autoAcceptReschedule:
          type: boolean
    ProviderSettingsRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 120
          minLength: 0
        timeZone:
          type: string
          example: America/Chicago
          minLength: 1
        currency:
          type: string
          example: USD
          pattern: ^[A-Za-z]{3}$
        location:
          type: string
          maxLength: 200
          minLength: 0
        rules:
          $ref: '#/components/schemas/BookingRules'
      required:
      - displayName
      - timeZone
    CancellationPolicy:
      type: object
      properties:
        kind:
          type: string
        label:
          type: string
        text:
          type: string
        freeHours:
          type: integer
          format: int32
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/RefundTier'
        noShow:
          type: string
        rescheduleHours:
          type: integer
          format: int32
        maxReschedules:
          type: integer
          format: int32
    Provider:
      type: object
      properties:
        orgId:
          type: string
        displayName:
          type: string
        timeZone:
          type: string
        currency:
          type: string
        location:
          type: string
        rules:
          $ref: '#/components/schemas/BookingRules'
        policy:
          $ref: '#/components/schemas/CancellationPolicy'
        strikes:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    RefundTier:
      type: object
      properties:
        hoursBefore:
          type: integer
          format: int32
        shareBps:
          type: integer
          format: int32
    AddOn:
      type: object
      properties:
        id:
          type: string
          maxLength: 40
          minLength: 0
        name:
          type: string
          maxLength: 80
          minLength: 0
        priceMinor:
          type: integer
          format: int64
          minimum: 0
        extraMinutes:
          type: integer
          format: int32
          maximum: 480
          minimum: 0
      required:
      - id
      - name
    ServiceRequest:
      type: object
      description: Services & prices form
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 3
        description:
          type: string
          maxLength: 2000
          minLength: 0
        category:
          type: string
