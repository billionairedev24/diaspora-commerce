openapi: 3.1.0
info:
  title: Bookings API
  description: Provider services and prices with take-home, team members and roles, weekly hours with breaks, time off, booking
    rules and live slot generation, the booking flow (slot hold, deposit authorised via payments-service, provider confirm
    / decline / propose a time, reschedules, completion, no-shows), request expiry, and Flexible / Moderate / Strict / Custom
    cancellation policies with exact refund quotes.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8109
  description: local
- url: https://api.dev.afrotransact.com/bookings
  description: dev
- url: https://api.uat.afrotransact.com/bookings
  description: uat
- url: https://api.afrotransact.com/bookings
  description: prod
security:
- bearer: []
tags:
- name: Public bookings
  description: 'Anonymous shopper reads (web shop, customer app, Lola): find a service, pick a day and a time, read the summary.
    Availability is computed live, never cached.'
- name: Bookings
  description: Booking flow for customers (CUSTOMER token) and providers (bookings:manage). Every write takes an Idempotency-Key
    and is safe to retry.
- name: Provider Hub
  description: 'Setup, cancellation policy, services & prices, team, working hours, calendar, bookings and earnings of a provider
    organisation. Roles: Owner and Manager full; Practitioner own calendar and hours only; Finance view only (enforced server-side).'
paths:
  /v1/bookings:
    post:
      tags:
      - Bookings
      summary: Book a slot (customer)
      description: 'Holds the slot (a database exclusion constraint makes double booking impossible) and creates the payments-service
        PaymentIntent for the deposit (manual capture: deposit held now, charged on confirmation, balance on completion).
        Returns the client secret for Stripe.js / PaymentSheet. 409 bookings.slot-taken when the time was just taken.'
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreateBookingResponse'
  /v1/bookings/mine:
    get:
      tags:
      - Bookings
      summary: Your bookings (customer), active first
      operationId: mine
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}:
    get:
      tags:
      - Bookings
      summary: A booking (its customer, or the provider with bookings:read)
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/cancel:
    post:
      tags:
      - Bookings
      summary: 'Cancel (customer: policy refund; provider: full refund, fee + strike under 24 h)'
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CancelResponse'
  /v1/bookings/{id}/cancellation-quote:
    get:
      tags:
      - Bookings
      summary: What cancelling now refunds, keeps or releases
      description: Customers see the exact refund under the policy the booking was made with before they cancel; providers
        see the late-cancellation fee.
      operationId: quote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CancellationQuote'
  /v1/bookings/{id}/complete:
    post:
      tags:
      - Bookings
      summary: 'Mark complete (provider): the balance is charged and the settlement hold starts'
      operationId: complete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/confirm:
    post:
      tags:
      - Bookings
      summary: 'Confirm a request (provider): the deposit is captured'
      operationId: confirm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/decline:
    post:
      tags:
      - Bookings
      summary: 'Decline a request with a reason (provider): the deposit hold is released'
      operationId: decline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/history:
    get:
      tags:
      - Bookings
      summary: History of a booking (who did what, and the money it moved)
      operationId: history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingActivity'
  /v1/bookings/{id}/new-time/accept:
    post:
      tags:
      - Bookings
      summary: Accept the pending new time
      description: Customer accepts the provider's proposal, or the provider accepts the customer's request.
      operationId: acceptNewTime
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/new-time/decline:
    post:
      tags:
      - Bookings
      summary: Decline the pending new time
      description: Provider keeps the original time; a customer declining the provider's proposal cancels with a full refund.
      operationId: declineNewTime
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/no-show:
    post:
      tags:
      - Bookings
      summary: 'Mark no-show (provider, after the start time): deposit kept, or full price per policy'
      operationId: noShow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/payment/sync:
    post:
      tags:
      - Bookings
      summary: Refresh the deposit authorisation from payments
      description: Call after Stripe.js confirmed the card; payments' intent.succeeded event does the same asynchronously.
      operationId: syncPayment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/propose-time:
    post:
      tags:
      - Bookings
      summary: Propose a new time (provider)
      description: Must be inside the provider's availability; the customer accepts or declines.
      operationId: proposeTime
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTimeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/reschedule:
    post:
      tags:
      - Bookings
      summary: Customer moves the appointment
      description: Allowed inside the policy's free-change window and reschedule limit; moves straight away when the provider
        auto-accepts, otherwise waits for the provider (RESCHEDULE_REQUESTED).
      operationId: reschedule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTimeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/providers/{orgId}/bookings:
    get:
      tags:
      - Provider Hub
      summary: 'Bookings starting in [from, to) (bookings:read; practitioners: own)'
      operationId: bookings
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: memberId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_PAYMENT
          - REQUESTED
          - CONFIRMED
          - RESCHEDULE_REQUESTED
          - RESCHEDULE_PROPOSED
          - COMPLETED
          - NO_SHOW
          - DECLINED
          - EXPIRED
          - CANCELLED_CUSTOMER
          - CANCELLED_PROVIDER
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
  /v1/providers/{orgId}/calendar:
    get:
      tags:
      - Provider Hub
      summary: 'Week / month calendar (bookings:read; practitioners: own column)'
      description: Open hours and time off per member and day, what's on each day (appointments, hours booked, expected revenue,
        requests waiting) and the bookings for the quick view.
      operationId: calendar
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: memberId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Calendar'
  /v1/providers/{orgId}/cancellation-policy:
    put:
      tags:
      - Provider Hub
      summary: 'Set the cancellation policy: FLEXIBLE, MODERATE, STRICT or CUSTOM (bookings:services:write)'
      description: Existing bookings keep the policy they were made under.
      operationId: savePolicy
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationPolicyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Provider'
  /v1/providers/{orgId}/earnings:
    get:
      tags:
      - Provider Hub
      summary: 'Earnings: collected − commission − card fees − late-cancellation fees (bookings:read)'
      description: Commission is taken only on what the customer actually paid (after refunds).
      operationId: earnings
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Earnings'
  /v1/providers/{orgId}/services:
    get:
      tags:
      - Provider Hub
      summary: Services & prices with the provider's take-home (bookings:read)
      operationId: services
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      tags:
      - Provider Hub
      summary: Add a service (bookings:services:write)
      operationId: createService
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/services/{serviceId}:
    get:
      tags:
      - Provider Hub
      summary: A service with its take-home (bookings:read)
      operationId: service
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
    put:
      tags:
      - Provider Hub
      summary: Change a service (bookings:services:write)
      description: Price changes don't affect existing bookings.
      operationId: updateService
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/services/{serviceId}/activate:
    post:
      tags:
      - Provider Hub
      summary: Offer a service again (bookings:services:write)
      operationId: activate
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/services/{serviceId}/deactivate:
    post:
      tags:
      - Provider Hub
      summary: Stop offering a service (bookings:services:write)
      operationId: deactivate
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/services/{serviceId}/members:
    put:
      tags:
      - Provider Hub
      summary: Who performs a service (bookings:team:manage); empty = every bookable member
      operationId: assign
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignMembersRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/settings:
    get:
      tags:
      - Provider Hub
      summary: Booking setup (bookings:read)
      operationId: settings
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Provider'
    put:
      tags:
      - Provider Hub
      summary: 'Create or update the setup: name, time zone, rules (bookings:availability:write; not practitioners)'
      description: Minimum notice, booking horizon, buffer, slot interval, daily limit, instant booking and auto-accepting
        reschedules. Customers see the change immediately.
      operationId: saveSettings
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderSettingsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Provider'
  /v1/providers/{orgId}/team:
    get:
      tags:
      - Provider Hub
      summary: Team members with their roles and hours (bookings:read)
      operationId: team
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
    post:
      tags:
      - Provider Hub
      summary: 'Add a team member: Owner, Manager, Practitioner or Finance (bookings:team:manage)'
      operationId: addMember
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TeamMember'
  /v1/providers/{orgId}/team/{memberId}:
    put:
      tags:
      - Provider Hub
      summary: Change a member's role, login link, bookability or status (bookings:team:manage)
      operationId: updateMember
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TeamMember'
  /v1/providers/{orgId}/team/{memberId}/hours:
    put:
      tags:
      - Provider Hub
      summary: 'Set weekly working hours with breaks (bookings:availability:write; practitioners: own)'
      operationId: setHours
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyHours'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TeamMember'
  /v1/providers/{orgId}/team/{memberId}/overrides:
    get:
      tags:
      - Provider Hub
      summary: 'Time off and special hours in a date range (bookings:read; practitioners: own)'
      operationId: overrides
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayOverride'
    put:
      tags:
      - Provider Hub
      summary: 'Block a date (time off) or set special hours (bookings:availability:write; practitioners: own)'
      operationId: putOverride
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayOverride'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DayOverride'
  /v1/providers/{orgId}/team/{memberId}/overrides/{date}:
    delete:
      tags:
      - Provider Hub
      summary: Remove time off / special hours of a date (bookings:availability:write)
      operationId: removeOverride
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
  /v1/public/providers/{orgId}:
    get:
      tags:
      - Public bookings
      summary: 'A provider''s booking page: services, policy and bookable team'
      operationId: provider
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublicProvider'
      security: []
  /v1/public/services/search:
    get:
      tags:
      - Public bookings
      summary: Search services (name, description, category, provider) with the next free time
      operationId: search
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
