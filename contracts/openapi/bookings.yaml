          maxLength: 60
          minLength: 0
        durationMinutes:
          type: integer
          format: int32
          maximum: 1440
          minimum: 5
        priceMinor:
          type: integer
          format: int64
          exclusiveMinimum: 0
        depositMinor:
          type: integer
          format: int64
          minimum: 0
        modes:
          type: array
          items:
            type: string
            enum:
            - IN_PERSON
            - AT_HOME
            - VIRTUAL
          minItems: 1
          uniqueItems: true
        addOns:
          type: array
          items:
            $ref: '#/components/schemas/AddOn'
          maxItems: 20
          minItems: 0
      required:
      - modes
      - name
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        durationMinutes:
          type: integer
          format: int32
        priceMinor:
          type: integer
          format: int64
        depositMinor:
          type: integer
          format: int64
        balanceMinor:
          type: integer
          format: int64
        currency:
