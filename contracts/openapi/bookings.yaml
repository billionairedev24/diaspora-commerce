components:
  schemas:
    CityRef:
      type: object
      properties:
        city:
          type: string
        state:
          type: string
    ReasonedZone:
      type: object
      properties:
        zone:
          $ref: '#/components/schemas/ServiceZone'
        reason:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - reason
      - zone
    ServiceZone:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{1,39}$
        name:
          type: string
          maxLength: 80
          minLength: 0
        cities:
          type: array
          items:
            $ref: '#/components/schemas/CityRef'
          maxItems: 200
          minItems: 0
      required:
      - cities
      - key
      - name
    AreaPolicy:
      type: object
      description: Staff-set default search radius by category (a default for shoppers, never a limit) and the bounds of a provider's
        declared radius
      properties:
        byCategory:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RadiusRule'
          minProperties: 1
        fallback:
          $ref: '#/components/schemas/RadiusRule'
      required:
      - byCategory
      - fallback
    RadiusRule:
      type: object
      properties:
        defaultMiles:
          type: integer
          format: int32
          maximum: 150
          minimum: 1
        minMiles:
          type: integer
          format: int32
          maximum: 150
          minimum: 1
        maxMiles:
          type: integer
          format: int32
          maximum: 150
          minimum: 1
    ReasonedPolicy:
      type: object
      properties:
        policy:
          $ref: '#/components/schemas/AreaPolicy'
        reason:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - policy
      - reason
    TeamMemberRequest:
      type: object
      properties:
        userId:
          type: string
          description: Identity user id of the member's login
          maxLength: 120
          minLength: 0
        displayName:
          type: string
          maxLength: 120
          minLength: 0
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - PRACTITIONER
          - FINANCE
        bookable:
          type: boolean
          description: 'Takes appointments; default: owners and practitioners'
        active:
          type: boolean
        hours:
          $ref: '#/components/schemas/WeeklyHours'
      required:
      - displayName
      - role
    TimeRange:
      type: object
      description: Local wall-clock range, end exclusive
      properties:
        start:
          type: string
          example: '10:00'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          example: '18:00'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      required:
      - end
      - start
    WeeklyHours:
      type: object
      description: Ranges per weekday (MONDAY…SUNDAY); several ranges = breaks; missing day = closed
      properties:
        days:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TimeRange'
      required:
      - days
    TeamMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
        userId:
          type: string
        displayName:
          type: string
        role:
          type: string
        bookable:
          type: boolean
        active:
          type: boolean
        hours:
          $ref: '#/components/schemas/WeeklyHours'
        version:
          type: integer
          format: int64
    DayOverride:
      type: object
      description: Time off (closed) or special hours on one date
      properties:
        date:
          type: string
          format: date
        closed:
          type: boolean
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'
        note:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - date
    BookingRules:
      type: object
      description: Working-hours screen rules
      properties:
        leadMinutes:
          type: integer
          format: int32
          description: Minimum notice in minutes
          example: 720
          minimum: 0
        horizonDays:
          type: integer
          format: int32
          description: Book up to N days ahead
          example: 30
          maximum: 365
          minimum: 1
        bufferMinutes:
          type: integer
          format: int32
          description: Buffer after each booking
          example: 15
          maximum: 240
          minimum: 0
        stepMinutes:
          type: integer
          format: int32
          description: Time slot interval
          example: 30
          maximum: 240
          minimum: 5
        maxPerDay:
          type: integer
          format: int32
          description: Max bookings per team member per day
          example: 6
          maximum: 50
          minimum: 1
        instantBooking:
          type: boolean
        autoAcceptReschedule:
          type: boolean
    ProviderSettingsRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 120
          minLength: 0
        timeZone:
          type: string
          example: America/Chicago
          minLength: 1
        currency:
          type: string
          example: USD
          pattern: ^[A-Za-z]{3}$
        location:
          type: string
          maxLength: 200
          minLength: 0
        rules:
          $ref: '#/components/schemas/BookingRules'
      required:
      - displayName
      - timeZone
    CancellationPolicy:
      type: object
      properties:
        kind:
          type: string
        label:
          type: string
        text:
          type: string
        freeHours:
          type: integer
          format: int32
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/RefundTier'
        noShow:
          type: string
        rescheduleHours:
          type: integer
          format: int32
