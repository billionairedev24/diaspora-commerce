        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: memberId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: addOnIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableSlot'
      security: []
  /v1/public/services/{serviceId}/summary:
    get:
      tags:
      - Public bookings
