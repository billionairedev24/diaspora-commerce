openapi: 3.1.0
info:
  title: Bookings API
  description: Provider services and prices with take-home, team members and roles, weekly hours with breaks, time off, booking
    rules and live slot generation, the booking flow (slot hold, deposit authorised via payments-service, provider confirm
    / decline / propose a time, reschedules, completion, no-shows), request expiry, and Flexible / Moderate / Strict / Custom
    cancellation policies with exact refund quotes.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
  version: v1
servers:
- url: http://localhost:8109
  description: local
- url: https://api.dev.afrotransact.com/bookings
  description: dev
- url: https://api.uat.afrotransact.com/bookings
  description: uat
- url: https://api.afrotransact.com/bookings
  description: prod
security:
- bearer: []
tags:
- name: Public bookings
  description: 'Anonymous shopper reads (web shop, customer app, Lola): find a service, pick a day and a time, read the summary.
    Availability is computed live, never cached.'
- name: Review moderation
  description: Trust and safety staff and the trust-ops service client (bookings:reviews:moderate, principal type STAFF or
    SERVICE) approve or reject customer reviews before they are public. Decisions are idempotent, so a retried queue decision
    is safe.
- name: Service areas
  description: Where providers work (base, radius, extra areas) and the staff settings behind it (radius policy, metro zones).
    Services are in person only.
- name: Bookings
  description: Booking flow for customers (CUSTOMER token) and providers (bookings:manage). Every write takes an Idempotency-Key
    and is safe to retry.
- name: Provider Hub
  description: 'Setup, cancellation policy, services & prices, team, working hours, calendar, bookings and earnings of a provider
    organisation. Roles: Owner and Manager full; Practitioner own calendar and hours only; Finance view only (enforced server-side).'
- name: Reviews
  description: Approved reviews per provider and per service (public), the provider's own reviews and their single reply.
paths:
  /v1/bookings:
    post:
      tags:
      - Bookings
      summary: Book a slot (customer)
      description: 'Holds the slot (a database exclusion constraint makes double booking impossible) and creates the payments-service
        PaymentIntent for the deposit (manual capture: deposit held now, charged on confirmation, balance on completion).
        Returns the client secret for Stripe.js / PaymentSheet. 409 bookings.slot-taken when the time was just taken.'
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreateBookingResponse'
  /v1/bookings/mine:
    get:
      tags:
      - Bookings
      summary: Your bookings (customer), active first
      operationId: mine
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}:
    get:
      tags:
      - Bookings
      summary: A booking (its customer, or the provider with bookings:read)
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/balance-payment:
    get:
      tags:
      - Bookings
      summary: The balance and its off-session charge (long-dated bookings)
      description: When the customer's bank asks for authentication (state ACTION_REQUIRED) the customer gets the charge's
        clientSecret to confirm with Stripe.js / PaymentSheet, then calls POST /payment/sync. Providers see the state without
        the secret.
      operationId: balancePayment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BookingBalancePayment'
  /v1/bookings/{id}/cancel:
    post:
      tags:
      - Bookings
      summary: 'Cancel (customer: policy refund; provider: full refund, fee + strike under 24 h)'
      description: After the deposit capture the uncaptured balance hold is released (or the open off-session balance charge
        cancelled).
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CancelResponse'
  /v1/bookings/{id}/cancellation-quote:
    get:
      tags:
      - Bookings
      summary: What cancelling now refunds, keeps or releases
      description: Customers see the exact refund under the policy the booking was made with before they cancel; providers
        see the late-cancellation fee.
      operationId: quote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CancellationQuote'
  /v1/bookings/{id}/complete:
    post:
      tags:
      - Bookings
      summary: 'Mark complete (provider): the balance is charged and the settlement hold starts'
      description: The balance is captured on the original authorisation, or on the off-session charge of a long-dated booking;
        a balance that could not be collected flags the booking (balance.state NEEDS_ATTENTION, event booking.balance_unpaid).
      operationId: complete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/confirm:
    post:
      tags:
      - Bookings
      summary: 'Confirm a request (provider): the deposit is captured'
      operationId: confirm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/decline:
    post:
      tags:
      - Bookings
      summary: 'Decline a request with a reason (provider): the deposit hold is released'
      operationId: decline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/history:
    get:
      tags:
      - Bookings
      summary: History of a booking (who did what, and the money it moved)
      operationId: history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingActivity'
  /v1/bookings/{id}/new-time/accept:
    post:
      tags:
      - Bookings
      summary: Accept the pending new time
      description: Customer accepts the provider's proposal, or the provider accepts the customer's request.
      operationId: acceptNewTime
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/new-time/decline:
    post:
      tags:
      - Bookings
      summary: Decline the pending new time
      description: Provider keeps the original time; a customer declining the provider's proposal cancels with a full refund.
      operationId: declineNewTime
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/no-show:
    post:
      tags:
      - Bookings
      summary: 'Mark no-show (provider, after the start time): deposit kept, or full price per policy'
      description: Without full price the uncaptured balance hold is released.
      operationId: noShow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/payment/sync:
    post:
      tags:
      - Bookings
      summary: Refresh the deposit authorisation (and an off-session balance charge) from payments
      description: Call after Stripe.js confirmed the card, or after the customer authenticated the off-session balance charge;
        payments' intent events do the same asynchronously.
      operationId: syncPayment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/propose-time:
    post:
      tags:
      - Bookings
      summary: Propose a new time (provider)
      description: Must be inside the provider's availability; the customer accepts or declines.
      operationId: proposeTime
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTimeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/reschedule:
    post:
      tags:
      - Bookings
      summary: Customer moves the appointment
      description: Allowed inside the policy's free-change window and reschedule limit; moves straight away when the provider
        auto-accepts, otherwise waits for the provider (RESCHEDULE_REQUESTED).
      operationId: reschedule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 160
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTimeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Booking'
  /v1/bookings/{id}/review:
    post:
      tags:
      - Bookings
      summary: 'Rate a completed booking (customer, once): 1–5 stars and an optional text'
      description: The review is PENDING until trust and safety approves it (booking.review.submitted queues it); only approved
        reviews are public and averaged in ratings. 409 bookings.not-reviewable before completion, 409 bookings.already-reviewed
        the second time.
      operationId: review
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Review'
  /v1/providers/{orgId}/bookings:
    get:
      tags:
      - Provider Hub
      summary: 'Bookings starting in [from, to) (bookings:read; practitioners: own)'
      operationId: bookings
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: memberId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_PAYMENT
          - REQUESTED
          - CONFIRMED
          - RESCHEDULE_REQUESTED
          - RESCHEDULE_PROPOSED
          - COMPLETED
          - NO_SHOW
          - DECLINED
          - EXPIRED
          - CANCELLED_CUSTOMER
          - CANCELLED_PROVIDER
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
  /v1/providers/{orgId}/calendar:
    get:
      tags:
      - Provider Hub
      summary: 'Week / month calendar (bookings:read; practitioners: own column)'
      description: Open hours and time off per member and day, what's on each day (appointments, hours booked, expected revenue,
        requests waiting) and the bookings for the quick view.
      operationId: calendar
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: memberId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Calendar'
  /v1/providers/{orgId}/cancellation-policy:
    put:
      tags:
      - Provider Hub
      summary: 'Set the cancellation policy: FLEXIBLE, MODERATE, STRICT or CUSTOM (bookings:services:write)'
      description: Existing bookings keep the policy they were made under.
      operationId: savePolicy
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationPolicyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Provider'
  /v1/providers/{orgId}/earnings:
    get:
      tags:
      - Provider Hub
      summary: 'Earnings: collected − connection fee − card fees − late-cancellation fees (bookings:read)'
      description: The connection fee is taken only on what the customer actually paid (after refunds).
      operationId: earnings
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Earnings'
  /v1/providers/{orgId}/reviews:
    get:
      tags:
      - Reviews
      summary: The provider's reviews in every state (bookings:read)
      description: Pending and rejected reviews are visible to the provider but never public.
      operationId: providerReviewList
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReviewPage'
  /v1/providers/{orgId}/reviews/{bookingId}/reply:
    post:
      tags:
      - Reviews
      summary: 'Reply to a published review, once (Owner / Manager: bookings:manage)'
      description: 409 bookings.review-not-published before approval, 409 bookings.already-replied the second time; booking.review.replied.
      operationId: replyToReview
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReplyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Review'
  /v1/providers/{orgId}/service-area:
    get:
      tags:
      - Service areas
      summary: The provider's service area with radius bounds and zones (bookings:read)
      operationId: serviceArea
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceAreaView'
    put:
      tags:
      - Service areas
      summary: Save the service area (bookings:services:write)
      description: The base ZIP is placed through geo-service; the radius must be within the staff-set bounds of the provider's
        categories (422 bookings.invalid-service-area).
      operationId: saveServiceArea
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAreaRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceAreaView'
  /v1/providers/{orgId}/service-area/preview:
    get:
      tags:
      - Service areas
      summary: Cities a base ZIP and radius would cover, without saving (bookings:read)
      operationId: previewServiceArea
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: zip
        in: query
        required: true
        schema:
          type: string
      - name: radiusMiles
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceAreaPreview'
  /v1/providers/{orgId}/services:
    get:
      tags:
      - Provider Hub
      summary: Services & prices with the provider's take-home (bookings:read)
      operationId: services
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      tags:
      - Provider Hub
      summary: Add a service (bookings:services:write)
      operationId: createService
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/services/{serviceId}:
    get:
      tags:
      - Provider Hub
      summary: A service with its take-home (bookings:read)
      operationId: service
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
    put:
      tags:
      - Provider Hub
      summary: Change a service (bookings:services:write)
      description: Price changes don't affect existing bookings.
      operationId: updateService
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/services/{serviceId}/activate:
    post:
      tags:
      - Provider Hub
      summary: Offer a service again (bookings:services:write)
      operationId: activate
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/services/{serviceId}/deactivate:
    post:
      tags:
      - Provider Hub
      summary: Stop offering a service (bookings:services:write)
      operationId: deactivate
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/services/{serviceId}/members:
    put:
      tags:
      - Provider Hub
      summary: Who performs a service (bookings:team:manage); empty = every bookable member
      operationId: assign
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignMembersRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Service'
  /v1/providers/{orgId}/settings:
    get:
      tags:
      - Provider Hub
      summary: Booking setup (bookings:read)
      operationId: settings
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Provider'
    put:
      tags:
      - Provider Hub
      summary: 'Create or update the setup: name, time zone, rules (bookings:availability:write; not practitioners)'
