  /v1/seller/provider/hours:
    get:
      tags: [Provider Hub]
      operationId: getWorkingHours
      security: [{sessionCookie: []}]
      summary: Weekly hours with breaks, blocked dates and booking rules
      description: bookings `GET /v1/providers/me/availability` (planned).
      responses:
        '200': {description: Availability, content: {application/json: {schema: {$ref: '#/components/schemas/Availability'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Provider Hub]
      operationId: saveWorkingHours
      security: [{sessionCookie: []}]
      summary: Save weekly hours, blocked dates and booking rules
      description: bookings `PUT /v1/providers/me/availability` (planned).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Availability'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/Availability'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/provider/services:
    get:
      tags: [Provider Hub]
      operationId: listServices
      security: [{sessionCookie: []}]
      summary: Services with price, deposit and what the provider takes home after commission and card fees
      description: bookings `GET /v1/providers/me/services` (planned).
      responses:
        '200': {description: Services, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ServiceOffer'}}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Provider Hub]
      operationId: createService
      security: [{sessionCookie: []}]
      summary: Add a service
      description: bookings `POST /v1/providers/me/services` (planned).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ServiceInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOffer'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/provider/services/{serviceId}:
    patch:
      tags: [Provider Hub]
      operationId: updateService
      security: [{sessionCookie: []}]
      summary: Change a service (price changes apply to new bookings only)
      description: bookings `PATCH /v1/providers/me/services/{id}` (planned).
      parameters: [{name: serviceId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ServiceInput'}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceOffer'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/provider/cancellation-policy:
    get:
      tags: [Provider Hub]
      operationId: getCancellationPolicy
      security: [{sessionCookie: []}]
      summary: Cancellation, late and no-show rules shown before customers book
      description: bookings `GET /v1/providers/me/cancellation-policy` (planned).
      responses:
        '200': {description: Policy, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationPolicy'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Provider Hub]
      operationId: saveCancellationPolicy
      security: [{sessionCookie: []}]
      summary: Pick Flexible, Moderate or Strict, or build a Custom policy (existing bookings keep theirs)
      description: bookings `PUT /v1/providers/me/cancellation-policy` (planned).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CancellationPolicyInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationPolicy'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/provider/earnings:
    get:
      tags: [Provider Hub]
      operationId: getEarnings
      security: [{sessionCookie: []}]
      summary: Per booking what was collected minus commission, Stripe fees and late-cancellation fees
      description: bookings `GET /v1/providers/me/earnings?from=&to=` (planned) + payments `GET /v1/payouts/provider-fees` (outstanding provider fees).
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: Earnings, content: {application/json: {schema: {$ref: '#/components/schemas/Earnings'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/storefront:
    get:
      tags: [Provider Hub]
      operationId: getPublicPage
      security: [{sessionCookie: []}]
      summary: Draft of the seller storefront or provider public page (layout, colours, gallery, featured work, social links)
      description: storefront `GET /v1/storefronts/me/draft`.
      responses:
        '200': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/PublicPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Provider Hub]
      operationId: savePublicPage
      security: [{sessionCookie: []}]
      summary: Save the draft (edited social links go back to pending approval)
      description: storefront `GET /v1/storefronts/me/draft` merged with the changes, then `PUT /v1/storefronts/me/draft`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PublicPageInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/PublicPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/storefront/publish:
    post:
      tags: [Provider Hub]
      operationId: publishPublicPage
      security: [{sessionCookie: []}]
      summary: Publish the draft (blocked with the failing contrast checks)
      description: storefront `POST /v1/storefronts/me/publish` then the draft is read back.
      responses:
        '200': {description: Published page, content: {application/json: {schema: {$ref: '#/components/schemas/PublicPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: at_session
      description: Opaque BFF session id (HttpOnly, Secure, SameSite=Lax). Tokens stay server-side.
  parameters:
    Sort:
      name: sort
      in: query
      style: form
      explode: true
      description: |
        Sort column and direction, `<column>,asc|desc` (the Spring Data convention); repeat for secondary keys (at most
        3). Empty cells sort last in both directions.
      schema:
        type: array
        maxItems: 3
        items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.]{0,79}(,(asc|desc|ASC|DESC))?$'}
    ExportId: {name: exportId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}
    OrderNumber: {name: orderNumber, in: path, required: true, schema: {type: string}}
    ShipmentId: {name: shipmentId, in: path, required: true, schema: {type: string}}
    ProductId: {name: productId, in: path, required: true, schema: {type: string}}
    PaymentMethodId: {name: paymentMethodId, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}, description: Makes retries safe (same key = same result).}
    IdempotencyKeyRequired: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}, description: Same key = same label; never buys twice.}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Validation failed; `errors` maps request properties to messages
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          description: |
            Stable machine code: VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, NOT_APPROVED,
            NO_ORGANISATION, RATE_LIMITED, UPSTREAM_UNAVAILABLE, UPSTREAM_ERROR; exports: EXPORT_NOT_READY,
            EXPORT_EXPIRED; team: LAST_OWNER, INVALID_ROLE,
            OWNER_ONLY, OWN_ROLE, ALREADY_MEMBER, INVITATION_EXPIRED, INVITATION_USED, INVITATION_REVOKED,
            INVITATION_EMAIL_MISMATCH; AfroTransact pickup (S255): PICKUP_ORG_NOT_APPROVED, PICKUP_INVALID_HOURS,
            PICKUP_NOT_GEOCODED, PICKUP_OUTSIDE_DELIVERY_AREA.
        errors:
          type: object
          additionalProperties: {type: string}
      additionalProperties: true
    # ── shell
    OrgKind: {type: string, enum: [SELLER, PROVIDER]}
    OrgStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, FLAGGED, AWAITING_FINAL_APPROVAL, INFO_REQUESTED, APPROVED, REJECTED, SUSPENDED]
    Portal: {type: string, enum: [SELLER_CENTER, PROVIDER_HUB]}
    AccessLevel: {type: string, enum: [VIEW, EDIT, APPROVE, FULL]}
    ModuleKey:
      type: string
      enum: [onboarding, home, orders, listings, inventory, storefront, calendar, requests, hours, services, policy, public-page, earnings, payouts, fees, billing, account-health, team]
    SellerUser:
      type: object
      required: [id, firstName, lastName, email, initials]
      properties:
        id: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        initials: {type: string}
    OrgSummary:
      type: object
      required: [id, kind, name, status, approved, roleKey, roleLabel]
      properties:
        id: {type: string}
        kind: {$ref: '#/components/schemas/OrgKind'}
        name: {type: string}
        status: {$ref: '#/components/schemas/OrgStatus'}
        approved: {type: boolean}
        roleKey: {type: string, description: 'Organisation role, e.g. seller.owner or provider.practitioner'}
        roleLabel: {type: string}
    NavModule:
      type: object
      required: [key, label, level, badge]
      properties:
        key: {$ref: '#/components/schemas/ModuleKey'}
        label: {type: string}
        level: {$ref: '#/components/schemas/AccessLevel'}
        badge: {type: [integer, 'null'], description: 'Count shown next to the item (orders to ship, requests waiting, open compliance items)'}
    NavGroup:
      type: object
      required: [key, label, modules]
      properties:
        key: {type: string}
        label: {type: string}
        modules: {type: array, items: {$ref: '#/components/schemas/NavModule'}}
    SellerSession:
      type: object
      required: [user, orgs, activeOrg, portal, approved, navGroups, landing, accessNote]
      properties:
        user: {$ref: '#/components/schemas/SellerUser'}
        orgs: {type: array, items: {$ref: '#/components/schemas/OrgSummary'}}
        activeOrg:
          oneOf:
            - {$ref: '#/components/schemas/OrgSummary'}
            - {type: 'null'}
        portal:
          oneOf:
            - {$ref: '#/components/schemas/Portal'}
            - {type: 'null'}
        approved: {type: boolean}
        navGroups:
          type: array
          description: Sidebar groups in order; only Onboarding until the organisation is approved.
          items: {$ref: '#/components/schemas/NavGroup'}
        landing: {$ref: '#/components/schemas/ModuleKey'}
        accessNote: {type: string}
    ActiveOrgRequest:
      type: object
      required: [orgId]
      properties:
        orgId: {type: string, minLength: 1}
    OnboardingStepState: {type: string, enum: [DONE, TODO, ACTION, WAITING, BLOCKED]}
    OnboardingStatus:
      type: object
      required: [orgId, kind, status, reference, steps, requestedItems, canResume]
      properties:
        orgId: {type: string}
        kind: {$ref: '#/components/schemas/OrgKind'}
        status: {type: string}
        reference: {type: [string, 'null']}
        steps:
          type: array
          items:
            type: object
            required: [key, label, state]
            properties:
              key: {type: string}
              label: {type: string}
              state: {$ref: '#/components/schemas/OnboardingStepState'}
        requestedItems: {type: array, items: {type: string}}
        canResume: {type: boolean}
    ComplianceStatus: {type: string, enum: [COMPLIANT, ACTION_NEEDED, RESTRICTED_SOON, RESTRICTED, VERIFYING]}
    ComplianceSummary:
      type: object
      required: [status, showBanner, tone, title, message, openItems, deadline, payoutsPaused, chargesEnabled, payoutsEnabled, listingsHidden, items]
      properties:
        status: {$ref: '#/components/schemas/ComplianceStatus'}
        showBanner: {type: boolean}
        tone: {type: string, enum: [none, info, warning, danger]}
        title: {type: string}
        message: {type: string}
        openItems: {type: integer, minimum: 0}
        deadline: {type: [string, 'null'], format: date-time}
        payoutsPaused: {type: boolean}
        chargesEnabled: {type: boolean}
        payoutsEnabled: {type: boolean}
        listingsHidden: {type: boolean}
        items:
          type: array
          items:
            type: object
            required: [requirement, label, bucket]
            properties:
              requirement: {type: string}
              label: {type: string}
              bucket: {type: string}
    # ── dashboard
    ChartTone: {type: string, enum: [ink, gold, green, blue, red, grey]}
    ChartKind: {type: string, enum: [trend, hbar, donut, stack]}
    ChartSpec:
      type: object
      description: One chart and its rows. Money series are in major currency units (dollars) so exports read naturally.
      required: [id, title, kind, categoryLabel, valueFormat, series, rows, available]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {$ref: '#/components/schemas/ChartKind'}
        categoryLabel: {type: string}
        valueFormat: {type: string, enum: [money, count]}
        series:
          type: array
          items:
            type: object
            required: [key, label, tone]
            properties:
              key: {type: string}
              label: {type: string}
              tone: {$ref: '#/components/schemas/ChartTone'}
              format: {type: string, enum: [money, count]}
        rows:
          type: array
          items:
            type: object
            required: [category, values]
            properties:
              category: {type: string}
              values: {type: object, additionalProperties: {type: number}}
        available: {type: boolean}
    Kpi:
      type: object
      required: [label, value, detail, tone]
      properties:
        label: {type: string}
        value: {type: string}
        detail: {type: string}
        tone: {type: string, enum: [positive, attention, neutral]}
    TodoItem:
      type: object
      required: [label, module, tone]
      properties:
        label: {type: string}
        module: {$ref: '#/components/schemas/ModuleKey'}
        tone: {type: string, enum: [info, warning, success, danger]}
    Dashboard:
      type: object
      required: [portal, rangeDays, kpis, charts, todo]
      properties:
        portal: {$ref: '#/components/schemas/Portal'}
        rangeDays: {type: integer}
        kpis: {type: array, items: {$ref: '#/components/schemas/Kpi'}}
        charts: {type: array, items: {$ref: '#/components/schemas/ChartSpec'}}
        todo: {type: array, items: {$ref: '#/components/schemas/TodoItem'}}
    # ── orders
    Fulfilment:
      type: string
      enum: [SELLER, AFROTRANSACT, AFROTRANSACT_DELIVERY]
      description: 'SELLER = I ship it; AFROTRANSACT = Fulfilled by AfroTransact (FBA); AFROTRANSACT_DELIVERY = AfroTransact picks up from my store (S255)'
    ShipmentStatus:
      type: string
      enum: [PENDING_PAYMENT, PLACED, CONFIRMED, PACKED, READY, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERY_FAILED, DELIVERED, RETURNED, CANCELLED]
    SellerStatusAction: {type: string, enum: [CONFIRMED, PACKED, READY], description: The only statuses a seller may set.}
    SellerOrderRow:
      type: object
      required: [orderNumber, shipmentId, placedAt, buyerName, shipTo, itemsSummary, itemCount, totalMinor, currency, fulfilment, status, statusLabel, carrier, trackingNumber, nextActions, canBuyLabel]
      properties:
        orderNumber: {type: string}
        shipmentId: {type: string}
        placedAt: {type: string, format: date-time}
        buyerName: {type: string}
        shipTo: {type: string, description: '"City, ST"'}
        itemsSummary: {type: string}
        itemCount: {type: integer}
        totalMinor: {type: integer}
        currency: {type: string}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        statusLabel: {type: string}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        nextActions: {type: array, items: {$ref: '#/components/schemas/SellerStatusAction'}}
        canBuyLabel: {type: boolean}
    SellerOrderPage:
      type: object
      required: [items, nextCursor, total, sort, partial]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SellerOrderRow'}}
        nextCursor: {type: [string, 'null']}
        total: {type: integer}
        sort: {type: array, items: {type: string}, description: 'The applied sort (`<column>,asc|desc`); empty for newest first'}
        partial: {type: boolean, description: 'The search or sort covered the first 5,000 shipments only'}
    ShipFromAddress:
      type: object
      required: [id, label, name, company, phone, line1, line2, city, state, postalCode, country, isDefault, version, position, afrotransactPickup]
      properties:
        id: {type: string}
        label: {type: string, example: Houston warehouse}
        name: {type: string}
        company: {type: string}
        phone: {type: string}
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        state: {type: string}
        postalCode: {type: string}
        country: {type: string}
        isDefault: {type: boolean}
        version: {type: integer, format: int64}
        position:
          oneOf: [{$ref: '#/components/schemas/GeoPosition'}, {type: 'null'}]
          description: Where geo-service located the address; null until it could (geocoding failed or geo was down)
        afrotransactPickup: {$ref: '#/components/schemas/AfrotransactPickup'}
    GeoPosition:
      type: object
      required: [lat, lng, precision, geocodedAt]
      properties:
        lat: {type: number}
        lng: {type: number}
        precision: {type: string, enum: [ADDRESS, ZIP, POINT], description: 'ADDRESS = street level; ZIP = ZIP centroid only (not enough for a driver)'}
        geocodedAt: {type: [string, 'null'], format: date-time}
    PickupWindow:
      type: object
      required: [day, opens, closes]
      properties:
        day: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
        opens: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 24-hour local time}
        closes: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    AfrotransactPickup:
      type: object
      description: 'AfroTransact Delivery from this address: the seller packs, the nearest AfroTransact driver collects during the pickup hours'
      required: [enabled, hours, zoneName, enabledAt]
      properties:
        enabled: {type: boolean}
        hours: {type: array, items: {$ref: '#/components/schemas/PickupWindow'}}
        zoneName: {type: [string, 'null'], description: Delivery zone covering (or nearest to) the address}
        enabledAt: {type: [string, 'null'], format: date-time}
    AfrotransactPickupRequest:
      type: object
      required: [enabled, hours]
      properties:
        enabled: {type: boolean}
        hours: {type: array, maxItems: 14, items: {$ref: '#/components/schemas/PickupWindow'}, description: At least one window to enable}
        version: {type: [integer, 'null'], format: int64, description: Version being edited}
    SellerOffer:
      type: object
      required: [offerId, atin, productId, sellerSku, condition, priceMinor, currency, fulfilment, quantity, availableQty, shipFromLocationId, shipsFrom, status, version]
      properties:
        offerId: {type: string}
        atin: {type: string, description: Variant ATIN}
        productId: {type: string}
        sellerSku: {type: string}
        condition: {type: string}
        priceMinor: {type: integer}
        currency: {type: string}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        quantity: {type: integer, description: Seller-declared stock (SELLER and AFROTRANSACT_DELIVERY)}
        availableQty: {type: integer}
        shipFromLocationId: {type: [string, 'null'], description: Pickup location (AFROTRANSACT_DELIVERY)}
        shipsFrom: {type: [string, 'null'], examples: ['Houston, TX']}
        status: {type: string, enum: [ACTIVE, PAUSED, WITHDRAWN]}
        version: {type: integer, format: int64}
    SellerOfferList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SellerOffer'}}
    OfferFulfilmentRequest:
      type: object
      required: [fulfilment]
      properties:
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        shipFromLocationId: {type: [string, 'null'], maxLength: 64, description: Required for AFROTRANSACT_DELIVERY}
    LocalDelivery:
      type: object
      description: AfroTransact Delivery from the seller's store (S255), as quoted at checkout
      required: [pickupLocationId, roadMiles, durationMinutes, customerChargeMinor, sellerFeeMinor]
      properties:
        pickupLocationId: {type: [string, 'null']}
        roadMiles: {type: [number, 'null']}
        durationMinutes: {type: [number, 'null']}
        customerChargeMinor: {type: integer, description: What the shopper paid for delivery (AfroTransact keeps it)}
        sellerFeeMinor: {type: integer, description: The seller delivery fee deducted from the payout}
    OrderEarnings:
      type: object
      description: The organisation's row of the order's payment split (payments); deductions are positive amounts
      required: [itemsMinor, shippingMinor, commissionMinor, fbaFeesMinor, deliveryFeesMinor, stripeFeeMinor, netMinor]
      properties:
        itemsMinor: {type: integer}
        shippingMinor: {type: integer}
        commissionMinor: {type: integer}
        fbaFeesMinor: {type: integer}
        deliveryFeesMinor: {type: integer, description: AfroTransact Delivery seller fees}
        stripeFeeMinor: {type: integer}
        netMinor: {type: integer}
    ShipFromInput:
      type: object
      required: [name, line1, city, state, postalCode]
      properties:
        label: {type: string, maxLength: 60}
        name: {type: string, maxLength: 120}
        company: {type: string, maxLength: 120}
        phone: {type: string, maxLength: 40}
        line1: {type: string, maxLength: 120}
        line2: {type: string, maxLength: 120}
        city: {type: string, maxLength: 80}
        state: {type: string, maxLength: 40}
        postalCode: {type: string, maxLength: 12}
        country: {type: string, default: US, pattern: '^[A-Z]{2}$'}
        makeDefault: {type: boolean}
        version: {type: [integer, 'null'], format: int64, description: Version being edited (updates)}
    PostalAddress:
      type: object
      required: [name, line1, city, state, postalCode, country]
      properties:
        name: {type: string}
        phone: {type: [string, 'null']}
        line1: {type: string}
        line2: {type: [string, 'null']}
        city: {type: string}
        state: {type: string}
        postalCode: {type: string}
        country: {type: string}
    SellerShipment:
      type: object
      required: [shipmentId, label, status, statusLabel, fulfilment, perishable, lines, itemsMinor, shippingMinor, totalMinor, carrier, trackingNumber, nextActions, canBuyLabel, timeline, localDelivery]
      properties:
        shipmentId: {type: string}
        label: {type: string}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        statusLabel: {type: string}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        perishable: {type: boolean}
        lines:
          type: array
          items:
            type: object
            required: [title, quantity, unitPriceMinor, itemsMinor, variantAtin, imageUrl]
            properties:
              title: {type: string}
              quantity: {type: integer}
              unitPriceMinor: {type: integer}
              itemsMinor: {type: integer}
              variantAtin: {type: string}
              imageUrl: {type: [string, 'null']}
        itemsMinor: {type: integer}
        shippingMinor: {type: integer}
        totalMinor: {type: integer}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        nextActions: {type: array, items: {$ref: '#/components/schemas/SellerStatusAction'}}
        canBuyLabel: {type: boolean}
        localDelivery:
          oneOf: [{$ref: '#/components/schemas/LocalDelivery'}, {type: 'null'}]
          description: AfroTransact Delivery from the seller's store (S255); null for other shipments
        timeline:
          type: array
          items:
            type: object
            required: [status, at, actor]
            properties:
              status: {type: string}
              at: {type: string, format: date-time}
              actor: {type: string}
    SellerOrderDetail:
      type: object
      required: [orderNumber, status, placedAt, currency, buyerName, shippingAddress, shipments, totalMinor, earnings]
      properties:
        orderNumber: {type: string}
        status: {type: string}
        placedAt: {type: string, format: date-time}
        currency: {type: string}
        buyerName: {type: string}
        shippingAddress:
          oneOf:
            - {$ref: '#/components/schemas/PostalAddress'}
            - {type: 'null'}
        shipments: {type: array, items: {$ref: '#/components/schemas/SellerShipment'}}
        totalMinor: {type: integer}
        earnings:
          oneOf: [{$ref: '#/components/schemas/OrderEarnings'}, {type: 'null'}]
          description: Payout breakdown from the order's payment split; null until the payment is split (or when payments can't be read)
    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/SellerStatusAction'}
    Parcel:
      type: object
      required: [weightLb]
      properties:
        weightLb: {type: number, exclusiveMinimum: 0, maximum: 150}
        lengthIn: {type: number, minimum: 0}
        widthIn: {type: number, minimum: 0}
        heightIn: {type: number, minimum: 0}
    RatesRequest:
      type: object
      required: [parcel, shipFrom]
      properties:
        parcel: {$ref: '#/components/schemas/Parcel'}
        shipFrom: {$ref: '#/components/schemas/PostalAddress'}
    Carrier: {type: string, enum: [usps, ups, fedex, dhl]}
    RateQuote:
      type: object
      required: [carrier, service, serviceName, amountMinor, currency, transitDays, estimatedDelivery]
      properties:
        carrier: {$ref: '#/components/schemas/Carrier'}
        service: {type: string}
        serviceName: {type: string}
        amountMinor: {type: integer}
        currency: {type: string}
        transitDays: {type: [integer, 'null']}
        estimatedDelivery: {type: [string, 'null'], format: date-time}
    RateQuotes:
      type: object
      required: [quotes, partial]
      properties:
        quotes: {type: array, items: {$ref: '#/components/schemas/RateQuote'}}
        partial: {type: boolean, description: Some carriers did not answer in time}
    BuyLabelRequest:
      type: object
      required: [carrier, service, parcel, shipFrom]
      properties:
        carrier: {$ref: '#/components/schemas/Carrier'}
        service: {type: string, minLength: 1}
        parcel: {$ref: '#/components/schemas/Parcel'}
        shipFrom: {$ref: '#/components/schemas/PostalAddress'}
    LabelPurchase:
      type: object
      required: [carrier, service, trackingNumber, costMinor, currency, documentUrl, order]
      properties:
        carrier: {$ref: '#/components/schemas/Carrier'}
        service: {type: string}
        trackingNumber: {type: string}
        costMinor: {type: integer}
        currency: {type: string}
        documentUrl: {type: [string, 'null']}
        order: {$ref: '#/components/schemas/SellerOrderDetail'}
    # ── listings
    ListingStatus: {type: string, enum: [IN_REVIEW, PENDING_CATEGORY_APPROVAL, LIVE, REJECTED, PAUSED, TAKEN_DOWN]}
    ListingRow:
      type: object
      required: [productId, atin, title, sku, variantCount, priceMinor, currency, stock, fulfilment, status, statusLabel, moderationNote, imageUrl, updatedAt]
      properties:
        productId: {type: string}
        atin: {type: [string, 'null']}
        title: {type: string}
        sku: {type: string}
        variantCount: {type: integer}
        priceMinor: {type: integer, description: Lowest variant price}
        currency: {type: string}
        stock: {type: integer, description: Sum of variant quantities}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        status: {$ref: '#/components/schemas/ListingStatus'}
        statusLabel: {type: string}
        moderationNote: {type: [string, 'null']}
        imageUrl: {type: [string, 'null']}
        updatedAt: {type: string, format: date-time}
    ListingPage:
      type: object
      required: [items, total, page, size, sort, partial]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ListingRow'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
        sort: {type: array, items: {type: string}, description: 'The applied sort (`<column>,asc|desc`); empty for the catalog order'}
        partial: {type: boolean, description: 'The search or sort covered the first 5,000 listings only'}
    # ── exports
    ExportFormat:
      type: string
      enum: [csv, xlsx, pdf]
      description: |
        csv: the data only (CSV cannot carry charts). xlsx: a "Summary" sheet (first) with key totals and native Excel
        charts, plus a "Data" sheet. pdf: a summary page with the same charts and totals, then the table in landscape
        with the header repeated on every page. Charts follow the column kinds: rows by status, the first amount (or rows)
        by day or month, the top 10 rows by amount, rows by a low-cardinality text column.
    ExportColumn:
      type: object
      required: [key, label, kind]
      properties:
        key: {type: string, maxLength: 80}
        label: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [text, strong, mono, money, number, date, datetime, status, percent]}
    ExportDataset:
      type: object
      description: A client-side table exported as shown, through the same pipeline.
      required: [table, columns, rows]
      properties:
        table: {type: string, pattern: '^[a-z0-9-]{1,60}$', description: The table's key (file name)}
        title: {type: string, maxLength: 120}
        scope: {type: string, maxLength: 200}
        columns: {type: array, minItems: 1, maxItems: 40, items: {$ref: '#/components/schemas/ExportColumn'}}
        rows:
          type: array
          maxItems: 5000
          description: One array per row, one cell per column; money in currency units, dates as ISO strings.
          items: {type: array, items: {type: [string, number, boolean, 'null']}}
    SellerExportRequest:
      type: object
      description: A server table (`table`) with its search, sort, visible columns and optional selection, or a client-side table (`dataset`).
      required: [format]
      properties:
        table: {type: string, enum: [orders, listings]}
        format: {$ref: '#/components/schemas/ExportFormat'}
        q: {type: string, maxLength: 120}
        status: {type: string, maxLength: 60}
        sort: {type: array, maxItems: 3, items: {type: string, maxLength: 90}}
        ids: {type: array, maxItems: 1000, items: {type: string, maxLength: 200}, description: 'Only these rows: shipment ids for orders, product ids for listings'}
        columns: {type: array, maxItems: 40, items: {type: string, maxLength: 80}, description: The visible columns in order}
        dataset: {$ref: '#/components/schemas/ExportDataset'}
    ExportJob:
      type: object
      required: [id, resource, title, format, status, rows, async, fileName, createdAt, finishedAt, expiresAt, downloadUrl, error]
      properties:
        id: {type: string}
        resource: {type: string, description: The table exported}
        title: {type: string}
        format: {$ref: '#/components/schemas/ExportFormat'}
        status: {type: string, enum: [QUEUED, RUNNING, READY, FAILED, EXPIRED]}
        rows: {type: integer}
        async: {type: boolean, description: 'Built in the background (more than 5,000 rows)'}
        fileName: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        downloadUrl: {type: [string, 'null'], description: App-relative download path (redirects to the signed URL)}
        error: {type: [string, 'null']}
    ExportJobList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ExportJob'}}
    ListingStatusRequest:
      type: object
      required: [active]
      properties:
        active: {type: boolean}
    CategoryNode:
      type: object
      required: [id, name, level, productType, path, children]
      properties:
        id: {type: string}
        name: {type: string}
        level: {type: string, description: 'DEPARTMENT, CATEGORY or PRODUCT_TYPE'}
        productType: {type: [string, 'null']}
        path: {type: string}
        children: {type: array, items: {$ref: '#/components/schemas/CategoryNode'}}
    ProductTypeSchema:
      type: object
      required: [code, label, identifierRule, attributes, themes]
      properties:
        code: {type: string}
        label: {type: string}
        identifierRule: {type: string, enum: [gtin, isbn, none]}
        attributes:
          type: array
          items:
            type: object
            required: [key, label, options, required, multiline]
            properties:
              key: {type: string}
              label: {type: string}
              options: {type: array, items: {type: string}}
              required: {type: boolean}
              multiline: {type: boolean}
        themes:
          type: array
          items:
            type: object
            required: [name, dimensions]
            properties:
              name: {type: string}
              dimensions:
                type: array
                items:
                  type: object
                  required: [name, options]
                  properties:
                    name: {type: string}
                    options: {type: array, items: {type: string}}
    GtinCheck:
      type: object
      required: [digits, valid, suggestion, existingAtin, message]
      properties:
        digits: {type: string}
        valid: {type: boolean}
        suggestion: {type: [string, 'null']}
        existingAtin: {type: [string, 'null']}
        message: {type: string}
    CategoryRequestInput:
      type: object
      required: [parentPath, name, exampleProduct, detailsNeeded]
      properties:
        parentPath: {type: string, minLength: 3, maxLength: 200}
        name: {type: string, minLength: 3, maxLength: 80}
        exampleProduct: {type: string, minLength: 3, maxLength: 200}
        detailsNeeded: {type: string, minLength: 3, maxLength: 1000}
    CategoryRequest:
      type: object
      required: [id, reference, path, status, decisionNote, createdAt]
      properties:
        id: {type: string}
        reference: {type: string}
        path: {type: string}
        status: {type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED]}
        decisionNote: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    ProductImageInput:
      type: object
      required: [url, contentType]
      properties:
        url: {type: string, minLength: 1}
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        bytes: {type: integer, minimum: 0}
        contentType: {type: string}
    VariantInput:
      type: object
      required: [options, sellerSku, priceMinor, quantity]
      properties:
        options: {type: object, additionalProperties: {type: string}}
        sellerSku: {type: string, minLength: 1, maxLength: 64}
        gtin: {type: string}
        gtinExempt: {type: boolean}
        priceMinor: {type: integer, minimum: 1}
        quantity: {type: integer, minimum: 0}
    ProductDraft:
      type: object
      required: [title, attributes, images, variationTheme, variants]
      description: Exactly one of categoryId or categoryRequestId.
      properties:
        categoryId: {type: string}
        categoryRequestId: {type: string}
        title: {type: string, minLength: 10, maxLength: 200}
        attributes: {type: object, additionalProperties: {type: string}}
        images: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/ProductImageInput'}}
        variationTheme: {type: string, minLength: 1}
        variants: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/VariantInput'}}
    UploadRequest:
      type: object
      required: [purpose, fileName, contentType, size]
      properties:
        purpose: {type: string, enum: [product-image, storefront]}
        fileName: {type: string, minLength: 1, maxLength: 200}
        contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
        size: {type: integer, minimum: 1, maximum: 8388608}
    UploadTicket:
      type: object
      required: [assetId, method, url, headers, publicUrl, expiresAt]
      properties:
        assetId: {type: string}
        method: {type: string}
        url: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        publicUrl: {type: [string, 'null']}
        expiresAt: {type: [string, 'null'], format: date-time}
    Asset:
      type: object
      required: [id, url, width, height, bytes, contentType, status]
      properties:
        id: {type: string}
        url: {type: string}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
        bytes: {type: [integer, 'null']}
        contentType: {type: string}
        status: {type: string, enum: [PENDING, READY, FLAGGED, REJECTED]}
    StockPosition:
      type: object
      required: [sku, nodeId, onHand, reserved, available, inbound, lowStock]
      properties:
        sku: {type: string}
        nodeId: {type: string}
        onHand: {type: integer}
        reserved: {type: integer}
        available: {type: integer}
        inbound: {type: integer}
        lowStock: {type: boolean}
    InventoryView:
      type: object
      required: [positions, totals]
      properties:
        positions: {type: array, items: {$ref: '#/components/schemas/StockPosition'}}
        totals:
          type: object
          required: [available, reserved, inbound, lowStockSkus]
          properties:
            available: {type: integer}
            reserved: {type: integer}
            inbound: {type: integer}
            lowStockSkus: {type: integer}
    StockAdjustmentRequest:
      type: object
      required: [sku, quantity, reason]
      properties:
        sku: {type: string, minLength: 1}
        quantity: {type: integer, minimum: 0, maximum: 100000}
        reason: {type: string, enum: [STOCK_TAKE, DAMAGED, FOUND, RETURNED, OTHER]}
    StockAdjustment:
      type: object
      required: [sku, quantity]
      properties:
        sku: {type: string}
        quantity: {type: integer}
    # ── money
    PayoutBalance:
      type: object
      required: [currency, availableMinor, onHoldMinor, requestedOrInTransitMinor, paidMinor, providerFeesMinor, minimumPayoutMinor, canRequestToday, payoutsPaused, payoutsPausedReason, payoutsPausedMessage, holds]
      properties:
        currency: {type: string}
        availableMinor: {type: integer}
        onHoldMinor: {type: integer}
        requestedOrInTransitMinor: {type: integer}
        paidMinor: {type: integer}
        providerFeesMinor: {type: integer, description: Provider fees (late cancellations) debited from or reserved in the balance}
        payoutsPaused: {type: boolean, description: 'Compliance hold: payout requests fail until it is lifted; the balance keeps accruing'}
        payoutsPausedReason:
          oneOf:
            - {type: string, enum: [AUTO_PAST_DUE, MANUAL, DEAUTHORIZED, CHARGES_DISABLED]}
            - {type: 'null'}
        payoutsPausedMessage: {type: [string, 'null'], description: What the hold means for the member and how it lifts}
        minimumPayoutMinor: {type: integer}
        canRequestToday: {type: boolean}
        holds:
          type: array
          items:
            type: object
            required: [orderId, amountMinor, releaseAt]
            properties:
              orderId: {type: string}
              amountMinor: {type: integer}
              releaseAt: {type: [string, 'null']}
    Payout:
      type: object
      required: [id, amountMinor, currency, status, requestedAt, holdReason, failureMessage]
      properties:
        id: {type: string}
        amountMinor: {type: integer}
        currency: {type: string}
        status: {type: string, enum: [REQUESTED, HELD, IN_TRANSIT, PAID, FAILED]}
        requestedAt: {type: string}
        holdReason: {type: [string, 'null']}
        failureMessage: {type: [string, 'null']}
    PayoutsView:
      type: object
      required: [balance, payouts, historyAvailable]
      properties:
        balance: {$ref: '#/components/schemas/PayoutBalance'}
        payouts: {type: array, items: {$ref: '#/components/schemas/Payout'}}
        historyAvailable: {type: boolean}
    PayoutRequest:
      type: object
      properties:
        amountMinor: {type: integer, minimum: 1}
        all: {type: boolean}
    Cadence: {type: string, enum: [MONTHLY, QUARTERLY, ANNUAL]}
    PlanPrice:
      type: object
      required: [cadence, months, totalMinor, perMonthMinor, savingMinor, perMonthLabel, billedLabel, savingLabel]
      properties:
        cadence: {$ref: '#/components/schemas/Cadence'}
        months: {type: integer}
        totalMinor: {type: integer}
        perMonthMinor: {type: integer}
        savingMinor: {type: integer}
        perMonthLabel: {type: string}
        billedLabel: {type: string}
        savingLabel: {type: string}
    Plan:
      type: object
      required: [code, name, tagline, monthlyMinor, trialDays, features, prices, current]
      properties:
        code: {type: string}
        name: {type: string}
        tagline: {type: string}
        monthlyMinor: {type: integer}
        trialDays: {type: integer}
        features: {type: array, items: {type: string}}
        prices: {type: array, items: {$ref: '#/components/schemas/PlanPrice'}}
        current: {type: boolean}
    BillingPaymentMethod:
      type: object
      required: [id, kind, brand, last4, expMonth, expYear, bankName, accountType, verified, receivesPayouts, isDefault, label]
      properties:
        id: {type: string}
        kind: {type: string, enum: [card, bank]}
        brand: {type: [string, 'null']}
        last4: {type: string}
        expMonth: {type: [integer, 'null']}
        expYear: {type: [integer, 'null']}
        bankName: {type: [string, 'null']}
        accountType: {type: [string, 'null']}
        verified: {type: boolean}
        receivesPayouts: {type: boolean}
        isDefault: {type: boolean}
        label: {type: string}
    Invoice:
      type: object
      required: [id, number, periodStart, periodEnd, amountDueMinor, amountPaidMinor, currency, status, pdfUrl, hostedUrl, createdAt]
      properties:
        id: {type: string}
        number: {type: string}
        periodStart: {type: [string, 'null'], format: date-time}
        periodEnd: {type: [string, 'null'], format: date-time}
        amountDueMinor: {type: integer}
        amountPaidMinor: {type: integer}
        currency: {type: string}
        status: {type: string}
        pdfUrl: {type: [string, 'null']}
        hostedUrl: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    Subscription:
      type: object
      required: [planCode, planName, cadence, status, priceLabel, billedLabel, trialEndsAt, currentPeriodEnd, nextChargeAt, nextChargeMinor, nextChargeLabel, cancelAtPeriodEnd, pendingChange, dunning]
      properties:
        planCode: {type: string}
        planName: {type: string}
        cadence: {$ref: '#/components/schemas/Cadence'}
        status: {type: string}
        priceLabel: {type: string}
        billedLabel: {type: string}
        trialEndsAt: {type: [string, 'null'], format: date-time}
        currentPeriodEnd: {type: [string, 'null'], format: date-time}
        nextChargeAt: {type: [string, 'null'], format: date-time}
        nextChargeMinor: {type: [integer, 'null']}
        nextChargeLabel: {type: string}
        cancelAtPeriodEnd: {type: boolean}
        pendingChange:
          type: [object, 'null']
          required: [planCode, planName, cadence, effectiveAt]
          properties:
            planCode: {type: string}
            planName: {type: string}
            cadence: {$ref: '#/components/schemas/Cadence'}
            effectiveAt: {type: string, format: date-time}
        dunning: {type: [string, 'null']}
    BillingView:
      type: object
      required: [subscription, plans, paymentMethods, invoices, canManage]
      properties:
        subscription: {$ref: '#/components/schemas/Subscription'}
        plans: {type: array, items: {$ref: '#/components/schemas/Plan'}}
        paymentMethods: {type: array, items: {$ref: '#/components/schemas/BillingPaymentMethod'}}
        invoices: {type: array, items: {$ref: '#/components/schemas/Invoice'}}
        canManage: {type: boolean, description: Only the owner role changes billing}
    ChangePlanRequest:
      type: object
      required: [planCode, cadence]
      properties:
        planCode: {type: string, minLength: 1}
        cadence: {$ref: '#/components/schemas/Cadence'}
    ChangePlanResult:
      type: object
      required: [applied, billing]
      properties:
        applied: {type: string, enum: [IMMEDIATE_UPGRADE, AT_RENEWAL, NO_CHANGE]}
        billing: {$ref: '#/components/schemas/BillingView'}
    # ── team
    RoleCard:
      type: object
      required: [key, label, summary, note, can, view, cannot]
      properties:
        key: {type: string}
        label: {type: string}
        summary: {type: string}
        note: {type: [string, 'null']}
        can: {type: array, items: {type: string}, description: What the role can change}
        view: {type: array, items: {type: string}, description: What it can only view}
        cannot: {type: array, items: {type: string}, description: What it can't access}
    TeamMember:
      type: object
      required: [userId, name, email, roleKey, roleLabel, status, isYou]
      properties:
        userId: {type: string}
        name: {type: string}
        email: {type: [string, 'null']}
        roleKey: {type: string}
        roleLabel: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED, INVITED], description: INVITED rows are pending invitations (userId `invite:<invitationId>`)}
        isYou: {type: boolean}
        invitationId: {type: string, format: uuid, description: INVITED rows only (revoke with it)}
        joinedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: INVITED rows only}
    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 200}
    InvitationPreview:
      type: object
      required: [orgName, orgKind, email, roleKey, roleLabel, status, expiresAt]
      properties:
        orgName: {type: string}
        orgKind: {type: string, enum: [SELLER, PROVIDER]}
        email: {type: string, description: The invited address (sign in or sign up with it)}
        roleKey: {type: string}
        roleLabel: {type: string}
        status: {type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]}
        expiresAt: {type: string, format: date-time}
    AcceptedInvitation:
      type: object
      required: [orgId, orgName, orgKind, roleKey, roleLabel, alreadyMember]
      properties:
        orgId: {type: string}
        orgName: {type: string}
        orgKind: {type: string, enum: [SELLER, PROVIDER]}
        roleKey: {type: string}
        roleLabel: {type: string}
        alreadyMember: {type: boolean, description: Was already a member; the role was left unchanged}
    TeamView:
      type: object
      required: [members, roles, yourRoleKey, canManage]
      properties:
        members: {type: array, items: {$ref: '#/components/schemas/TeamMember'}}
        roles: {type: array, items: {$ref: '#/components/schemas/RoleCard'}}
        yourRoleKey: {type: string}
        canManage: {type: boolean}
    InviteRequest:
      type: object
      required: [email, roleKey]
      properties:
        email: {type: string, format: email}
        roleKey: {type: string, minLength: 1}
    RoleChangeRequest:
      type: object
      required: [roleKey]
      properties:
        roleKey: {type: string, minLength: 1}
    # ── provider hub
    BookingStatus:
      type: string
      enum: [PENDING_PAYMENT, REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED, RESCHEDULE_PROPOSED, COMPLETED, NO_SHOW, DECLINED, EXPIRED, CANCELLED_CUSTOMER, CANCELLED_PROVIDER]
    BookingAction: {type: string, enum: [CONFIRM, DECLINE, PROPOSE, COMPLETE, NO_SHOW, CANCEL]}
    BookingCard:
      type: object
      required: [id, reference, customerName, serviceName, startAt, endAt, durationMinutes, status, statusLabel, priceMinor, depositMinor, currency, depositState, note, practitioner, expiresAt, proposedStartAt, allowedActions]
      properties:
        id: {type: string}
        reference: {type: string}
        customerName: {type: string}
        serviceName: {type: string}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        durationMinutes: {type: integer}
        status: {$ref: '#/components/schemas/BookingStatus'}
        statusLabel: {type: string}
        priceMinor: {type: integer}
        depositMinor: {type: integer}
        currency: {type: string}
        depositState: {type: string, enum: [none, held, captured, released, refunded]}
        note: {type: [string, 'null']}
        practitioner: {type: [string, 'null']}
        expiresAt: {type: [string, 'null'], format: date-time}
        proposedStartAt: {type: [string, 'null'], format: date-time}
        allowedActions: {type: array, items: {$ref: '#/components/schemas/BookingAction'}}
    DaySummary:
      type: object
      required: [date, appointments, bookedMinutes, expectedRevenueMinor, needsAction]
      properties:
        date: {type: string, format: date}
        appointments: {type: integer}
        bookedMinutes: {type: integer}
        expectedRevenueMinor: {type: integer}
        needsAction: {type: integer}
    TimeRange:
      type: object
      required: [start, end]
      properties:
        start: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        end: {type: string, pattern: '^([01]\d|2[0-4]):[0-5]\d$'}
    Weekday: {type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN]}
    DayHours:
      type: object
      required: [day, ranges]
      properties:
        day: {$ref: '#/components/schemas/Weekday'}
        ranges: {type: array, items: {$ref: '#/components/schemas/TimeRange'}, description: Empty = closed; two ranges = a break}
    CalendarView:
      type: object
      required: [timezone, from, to, openHours, bookings, days]
      properties:
        timezone: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        openHours: {type: array, items: {$ref: '#/components/schemas/DayHours'}}
        bookings: {type: array, items: {$ref: '#/components/schemas/BookingCard'}}
        days: {type: array, items: {$ref: '#/components/schemas/DaySummary'}}
    BookingActionRequest:
      type: object
      required: [action]
      properties:
        action: {$ref: '#/components/schemas/BookingAction'}
        reason: {type: string, maxLength: 500, description: Required to decline or cancel}
        proposedStartAt: {type: string, format: date-time, description: Required to propose a new time}
    BookingRules:
      type: object
      required: [leadMinutes, horizonDays, bufferMinutes, stepMinutes, maxPerDay, instantBooking, autoAcceptReschedule]
      properties:
        leadMinutes: {type: integer, minimum: 0, maximum: 43200}
        horizonDays: {type: integer, minimum: 1, maximum: 365}
        bufferMinutes: {type: integer, minimum: 0, maximum: 240}
        stepMinutes: {type: integer, minimum: 5, maximum: 240}
        maxPerDay: {type: integer, minimum: 1, maximum: 50}
        instantBooking: {type: boolean}
        autoAcceptReschedule: {type: boolean}
    Availability:
      type: object
      required: [timezone, weekly, blockedDates, rules]
      properties:
        timezone: {type: string}
        weekly: {type: array, minItems: 7, maxItems: 7, items: {$ref: '#/components/schemas/DayHours'}}
        blockedDates:
          type: array
          items:
            type: object
            required: [date, note]
            properties:
              date: {type: string, format: date}
              note: {type: string}
        rules: {$ref: '#/components/schemas/BookingRules'}
    TakeHome:
      type: object
      required: [commissionPercent, commissionMinor, cardFeesMinor, takeHomeMinor]
      properties:
        commissionPercent: {type: number}
        commissionMinor: {type: integer}
        cardFeesMinor: {type: integer}
        takeHomeMinor: {type: integer}
    ServiceOffer:
      type: object
      required: [id, name, description, durationMinutes, priceMinor, depositMinor, currency, active, takeHome]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        durationMinutes: {type: integer}
        priceMinor: {type: integer}
        depositMinor: {type: integer}
        currency: {type: string}
        active: {type: boolean}
        takeHome: {$ref: '#/components/schemas/TakeHome'}
    ServiceInput:
      type: object
      required: [name, durationMinutes, priceMinor, depositMinor, active]
      properties:
        name: {type: string, minLength: 3, maxLength: 120}
        description: {type: string, maxLength: 2000}
        durationMinutes: {type: integer, minimum: 5, maximum: 1440}
        priceMinor: {type: integer, minimum: 1}
        depositMinor: {type: integer, minimum: 0}
        active: {type: boolean}
    PolicyKind: {type: string, enum: [FLEXIBLE, MODERATE, STRICT, CUSTOM]}
    CancellationPolicyInput:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/PolicyKind'}
        freeHours: {type: integer, minimum: 0, maximum: 720}
        partialRefund: {type: boolean}
        partialFromHours: {type: integer, minimum: 0, maximum: 720}
        partialPercent: {type: integer, minimum: 1, maximum: 99}
        noShow: {type: string, enum: [DEPOSIT, FULL]}
        rescheduleHours: {type: integer, minimum: 0, maximum: 720}
        maxReschedules: {type: integer, minimum: 0, maximum: 10}
    CancellationPolicy:
      type: object
      required: [kind, label, freeHours, partialRefund, partialFromHours, partialPercent, noShow, rescheduleHours, maxReschedules, summary, timeline]
      properties:
        kind: {$ref: '#/components/schemas/PolicyKind'}
        label: {type: string}
        freeHours: {type: integer}
        partialRefund: {type: boolean}
        partialFromHours: {type: integer}
        partialPercent: {type: integer}
        noShow: {type: string, enum: [DEPOSIT, FULL]}
        rescheduleHours: {type: integer}
        maxReschedules: {type: integer}
        summary: {type: string}
        timeline:
          type: array
          description: Refund timeline from booking to the appointment
          items:
            type: object
            required: [label, refundPercent]
            properties:
              label: {type: string}
              refundPercent: {type: integer}
    EarningsRow:
      type: object
      required: [bookingId, reference, customerName, serviceName, startAt, status, statusLabel, collectedMinor, commissionMinor, cardFeesMinor, lateCancelFeeMinor, netMinor]
      properties:
        bookingId: {type: string}
        reference: {type: string}
        customerName: {type: string}
        serviceName: {type: string}
        startAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/BookingStatus'}
        statusLabel: {type: string}
        collectedMinor: {type: integer}
        commissionMinor: {type: integer}
        cardFeesMinor: {type: integer}
        lateCancelFeeMinor: {type: integer}
        netMinor: {type: integer}
    ProviderFee:
      type: object
      required: [id, bookingReference, amountMinor, currency, reason, status, nextAttemptAt, createdAt]
      properties:
        id: {type: string}
        bookingReference: {type: string}
        amountMinor: {type: integer}
        currency: {type: string}
        reason: {type: string}
        status: {type: string, enum: [OUTSTANDING, COLLECTED]}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    ProviderFees:
      type: object
      description: Late-cancellation fees the provider owes (payments `GET /v1/payouts/provider-fees`); `available` is false when payments cannot answer.
      required: [available, outstandingMinor, collectedMinor, items]
      properties:
        available: {type: boolean}
        outstandingMinor: {type: integer}
        collectedMinor: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/ProviderFee'}}
    Earnings:
      type: object
      required: [currency, commissionPercent, payoutDay, totals, rows, providerFees]
      properties:
        currency: {type: string}
        commissionPercent: {type: number}
        payoutDay: {type: string}
        totals:
          type: object
          required: [collectedMinor, commissionMinor, cardFeesMinor, lateCancelFeesMinor, netMinor, heldMinor]
          properties:
            collectedMinor: {type: integer}
            commissionMinor: {type: integer}
            cardFeesMinor: {type: integer}
            lateCancelFeesMinor: {type: integer}
            netMinor: {type: integer}
            heldMinor: {type: integer}
        rows: {type: array, items: {$ref: '#/components/schemas/EarningsRow'}}
        providerFees: {$ref: '#/components/schemas/ProviderFees'}
    SocialLink:
      type: object
      required: [network, url, status]
      properties:
        network: {type: string, enum: [instagram, tiktok, facebook, youtube, whatsapp, x, linkedin, website]}
        url: {type: string}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
    PublicPage:
      type: object
      required: [kind, slug, name, tagline, status, publishedAt, primaryColor, accentColor, layout, header, buttonShape, gallerySize, gallery, featured, social, publicPath]
      properties:
        kind: {$ref: '#/components/schemas/OrgKind'}
        slug: {type: string}
        name: {type: string}
        tagline: {type: string}
        status: {type: string, enum: [DRAFT, PUBLISHED]}
        publishedAt: {type: [string, 'null'], format: date-time}
        primaryColor: {type: string}
        accentColor: {type: string}
        layout: {type: string, enum: [CLASSIC, GALLERY_FIRST, STORY]}
        header: {type: string, enum: [COVER, BAND]}
        buttonShape: {type: string, enum: [ROUNDED, SQUARE]}
        gallerySize: {type: integer}
        gallery:
          type: array
          items:
            type: object
            required: [assetId, url, caption]
            properties:
              assetId: {type: string}
              url: {type: string}
              caption: {type: string}
        featured:
          type: array
          items:
            type: object
            required: [id, headline, body, serviceId, published]
            properties:
              id: {type: string}
              headline: {type: string}
              body: {type: string}
              serviceId: {type: [string, 'null']}
              published: {type: boolean}
        social: {type: array, items: {$ref: '#/components/schemas/SocialLink'}}
        publicPath: {type: string, description: Path of the page in the shop}
    PublicPageInput:
      type: object
      properties:
        name: {type: string, minLength: 2, maxLength: 80}
        tagline: {type: string, maxLength: 80}
        primaryColor: {type: string, pattern: '^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'}
        accentColor: {type: string, pattern: '^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'}
        layout: {type: string, enum: [CLASSIC, GALLERY_FIRST, STORY]}
        header: {type: string, enum: [COVER, BAND]}
        buttonShape: {type: string, enum: [ROUNDED, SQUARE]}
        gallerySize: {type: integer, minimum: 0, maximum: 24}
        featured:
          type: array
          maxItems: 6
          items:
            type: object
            required: [id, headline, body, published]
            properties:
              id: {type: string}
              headline: {type: string, maxLength: 80}
              body: {type: string, maxLength: 400}
              serviceId: {type: [string, 'null']}
              published: {type: boolean}
        social:
          type: array
          items:
            type: object
            required: [network, url]
            properties:
              network: {type: string, enum: [instagram, tiktok, facebook, youtube, whatsapp, x, linkedin, website]}
              url: {type: string, format: uri}
    # ── fees (read-only)
    SellerFeeCategory:
      type: object
      required: [category, label, commissionBps, source]
      properties:
        category: {type: string, description: payments category key (lower-case)}
        label: {type: string}
        commissionBps: {type: integer, minimum: 0, maximum: 10000, description: 1250 = 12.50 %}
        source: {type: string, enum: [OVERRIDE, CATEGORY, DEFAULT, RETAIL], description: 'OVERRIDE: negotiated for this organisation'}
    SellerFeeVersion:
      type: object
      required: [version, effectiveFrom, defaultCommissionBps, categories, cardPctBps, cardFixedMinor, fbaPerUnitMinor, reverseCommissionOnRefund, deliveryFee]
      properties:
        version: {type: integer}
        effectiveFrom: {type: string, format: date-time}
        defaultCommissionBps: {type: integer, description: "Commission in categories not listed (the organisation's all-category override when it has one)"}
        categories: {type: array, items: {$ref: '#/components/schemas/SellerFeeCategory'}}
        cardPctBps: {type: integer, description: 'Card fee estimate per charge, percentage part'}
        cardFixedMinor: {type: integer, format: int64, description: 'Card fee estimate per charge, fixed part'}
        fbaPerUnitMinor: {type: integer, format: int64, description: 'FBA pick, pack and ship fee per unit'}
        reverseCommissionOnRefund: {type: boolean, description: Refunds give back the commission on the refunded amount}
        deliveryFee:
          oneOf: [{$ref: '#/components/schemas/SellerDeliveryFee'}, {type: 'null'}]
          description: The seller delivery fee of AfroTransact Delivery from your store (S255); null when the version has no delivery pricing
    SellerDeliveryTariff:
      type: object
      required: [mode, flatPerPackageMinor, baseMinor, perMileMinor, bands, minMinor, maxMinor]
      properties:
        mode: {type: string, enum: [FLAT, DISTANCE]}
        flatPerPackageMinor: {type: [integer, 'null']}
        baseMinor: {type: [integer, 'null']}
        perMileMinor: {type: [integer, 'null']}
        bands:
          type: array
          items:
            type: object
            required: [fromMiles, toMiles, feeMinor]
            properties:
              fromMiles: {type: number}
              toMiles: {type: number}
              feeMinor: {type: integer}
        minMinor: {type: [integer, 'null']}
        maxMinor: {type: [integer, 'null']}
    SellerDeliveryFee:
      type: object
      required: [enabled, maxRadiusMiles, source, tariff, summary]
      properties:
        enabled: {type: boolean, description: AfroTransact Delivery from seller stores is offered}
        maxRadiusMiles: {type: number}
        source: {type: string, enum: [DEFAULT, OVERRIDE, RETAIL], description: 'OVERRIDE: negotiated for this organisation; RETAIL: never charged'}
        tariff: {oneOf: [{$ref: '#/components/schemas/SellerDeliveryTariff'}, {type: 'null'}], description: null = no fee}
        summary: {type: string, examples: ['$2.00 per package']}
    SellerFeeChange:
      type: object
      required: [field, label, from, to]
      properties:
        field: {type: string}
        label: {type: string}
        from: {type: string}
        to: {type: string}
    SellerFeesView:
      type: object
      required: [currency, retail, note, current, upcoming, changes]
      properties:
        currency: {type: string}
        retail: {type: boolean, description: 'AfroTransact Retail (merchant of record) — no commission, no fees'}
        note: {type: [string, 'null']}
        current: {$ref: '#/components/schemas/SellerFeeVersion'}
        upcoming: {oneOf: [{$ref: '#/components/schemas/SellerFeeVersion'}, {type: 'null'}], description: 'The next scheduled version, if any'}
        changes: {type: array, items: {$ref: '#/components/schemas/SellerFeeChange'}, description: What changes for this organisation with the upcoming version}
