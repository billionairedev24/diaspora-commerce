      description: >-
        identity `PUT /v1/orgs/{orgId}/members/{userId}`. 403 OWN_ROLE for your own role, OWNER_ONLY when a non-owner
        grants or changes the owner role; 422 LAST_OWNER when the last owner would be demoted, INVALID_ROLE.
