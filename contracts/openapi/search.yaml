openapi: 3.1.0
info:
  title: Search API
  version: v1
  description: |
    Product search and typeahead for the storefront, mobile app and Lola (via MCP).
    Every typed word must match; partial words, diaspora synonyms (gari/garri, zobo/bissap/hibiscus,
    kpekere/plantain chips …, a curated synonym set that staff edit without reindexing) and typos (one edit for
    3–5 letters, two for 6+) are tolerated. Relevance is boosted for in-stock items, Fulfilled by AfroTransact,
    rating × review volume and fast delivery.

    **Hybrid retrieval (S036).** Queries of three or more words (relevance order, first 120 results) request an
    embedding from the AI gateway with a 150 ms budget and run BM25 and kNN over the products' embeddings (same
    filters and commercial boosts), merged by reciprocal rank fusion. If the embedder fails or times out the page is
    lexical. `retrieval` (`HYBRID` / `LEXICAL`) and `semantic` report what was used; `semanticSkipped` says why not.

    **Stock signals (S038).** Every hit carries `availableQty`, `lowStock` (1–5 units: "Only N left") and
    `availability` (`IN_STOCK`, `LOW_STOCK`, `OUT_OF_STOCK`: "Currently unavailable"), in results, typeahead products
    and ads.

    Results pages may carry sponsored products (`ads=true`) at fixed slots, always labelled "Sponsored" with the
    reason they were shown (second-price auction on bid × relevance with a relevance floor). Clicks are reported with
    `POST /v1/search/clicks`; searches and clicks feed the staff console's search analytics.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
servers:
  - url: http://localhost:8201
    description: local
  - url: https://api.dev.afrotransact.com/search
    description: dev
  - url: https://api.uat.afrotransact.com/search
    description: uat
  - url: https://api.afrotransact.com/search
    description: prod
tags:
  - name: Search
    description: Product search and typeahead
  - name: Tracking
    description: Result and sponsored-product clicks reported by the BFF
  - name: Analytics
    description: Search analytics for the staff console (search:analytics.view)
  - name: Synonyms
    description: Curation of the diaspora synonym set (search:synonyms.edit)
paths:
  /v1/search:
    get:
      tags: [Search]
      operationId: searchProducts
      summary: Search products with filters and facets
      security: [{}, {bearer: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}, description: Free text}
        - {name: market, in: query, schema: {type: string, default: us}}
        - {name: department, in: query, schema: {type: string}}
        - {name: community, in: query, schema: {type: string}, description: 'Comma-separated communities (Nigerian, Ghanaian…)'}
        - {name: fulfilment, in: query, schema: {type: string, enum: [AFROTRANSACT, SELLER]}}
        - {name: sellerKind, in: query, schema: {type: string, enum: [PLATFORM, SELLER]}}
        - {name: minRating, in: query, schema: {type: number, minimum: 0, maximum: 5}}
        - {name: minPrice, in: query, schema: {type: integer, format: int64, minimum: 0}, description: Minor units}
        - {name: maxPrice, in: query, schema: {type: integer, format: int64, minimum: 0}, description: Minor units}
        - {name: maxDays, in: query, schema: {type: integer, minimum: 1}, description: Delivery within N days}
        - {name: inStock, in: query, schema: {type: boolean}}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lon, in: query, schema: {type: number}}
        - {name: withinMiles, in: query, schema: {type: integer, minimum: 1}}
        - {name: sort, in: query, schema: {type: string, enum: [relevance, price_asc, price_desc, rating, newest]}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 60, default: 24}}
        - name: ads
          in: query
          schema: {type: boolean, default: false}
          description: >-
            Blend sponsored products into the page at the configured slots (positions 1 and 5). Results pages only;
            the response is then private (Cache-Control no-store) because each ad carries a click token.
        - name: track
          in: query
          schema: {type: boolean, default: true}
          description: >-
            Count the search in analytics and publish search.query.performed. Send false for home rails, Lola and
            other machine-made queries.
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /v1/search/clicks:
    post:
      tags: [Tracking]
      operationId: recordSearchClick
      summary: Report a click on a search result (organic or sponsored)
      description: >-
        Publishes search.result.clicked once per search and product, and for a sponsored result with a valid,
        unexpired adToken ads.click.recorded once per token (content-service charges the campaign). The query and
        market of a sponsored click come from the signed token. A customerId is taken from a customer token, or from
        the body when the caller is a service (the BFF's client-credentials token).
      security: [{}, {bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClickRequest'}
      responses:
        '202':
          description: Recorded, or recognised as a duplicate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClickResult'}
        '400': {$ref: '#/components/responses/Problem'}
  /v1/search/analytics/top-queries:
    get:
      tags: [Analytics]
      operationId: topSearchQueries
      summary: Most searched queries in a window, with zero results, clicks and CTR
      security: [{bearer: []}]
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Queries by searches (descending)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryReport'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/search/analytics/zero-results:
    get:
      tags: [Analytics]
      operationId: zeroResultSearchQueries
      summary: Queries that returned nothing, for synonym curation
      security: [{bearer: []}]
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Queries by zero-result searches (descending)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryReport'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/search/analytics/ctr:
    get:
      tags: [Analytics]
      operationId: searchClickThroughByDay
      summary: Searches, clicks, click-through and zero-result rates by day
      security: [{bearer: []}]
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: One row per day of the window (days without searches included)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CTRReport'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/search/synonyms:
    get:
      tags: [Synonyms]
      operationId: listSearchSynonyms
      summary: Rules of the diaspora synonym set (search:analytics.view or search:synonyms.edit)
      security: [{bearer: []}]
      responses:
        '200':
          description: Synonym rules
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules: {type: array, items: {$ref: '#/components/schemas/SynonymRule'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/search/synonyms/{ruleId}:
    parameters:
      - {name: ruleId, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}}
    put:
      tags: [Synonyms]
      operationId: putSearchSynonym
      summary: Create or replace a rule; search analyzers reload immediately (no reindex)
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [synonyms]
              properties:
                synonyms: {type: string, examples: ['plantain chips, kpekere, ipekere']}
      responses:
        '200':
          description: The normalised rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SynonymRule'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Synonyms]
      operationId: deleteSearchSynonym
      summary: Delete a rule
      security: [{bearer: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/suggest:
    get:
      tags: [Search]
      operationId: suggest
      summary: Typeahead phrases and up to five products
      security: [{}, {bearer: []}]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 100}}
        - {name: market, in: query, schema: {type: string, default: us}}
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Suggestions'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Market: {name: market, in: query, schema: {type: string, default: us}}
    From: {name: from, in: query, schema: {type: string, format: date}, description: 'First day (UTC), default 6 days before to'}
    To: {name: to, in: query, schema: {type: string, format: date}, description: 'Last day (UTC), default today'}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        errors: {type: object, additionalProperties: {type: string}}
    Hit:
      type: object
      required: [atin, title, sellerKind, fulfilment, priceMinor, currency, inStock]
      properties:
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        title: {type: string}
        brand: {type: string}
        categoryPath: {type: string}
        sellerName: {type: string}
        sellerKind: {type: string, enum: [PLATFORM, SELLER]}
        fulfilment: {type: string, enum: [AFROTRANSACT, SELLER]}
        priceMinor: {type: integer, format: int64}
        currency: {type: string}
        rating: {type: number}
        reviewCount: {type: integer}
        inStock: {type: boolean}
        lowStock: {type: boolean, description: True when 1–5 units are left ("Only N left")}
        availableQty: {type: integer, description: Units available across fulfilment nodes (N in "Only N left")}
        availability:
          type: string
          enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
          description: LOW_STOCK shows "Only N left"; OUT_OF_STOCK shows "Currently unavailable".
        deliveryDays: {type: integer}
        imageUrl: {type: string}
        offerCount: {type: integer}
        score: {type: number}
        sponsored: {$ref: '#/components/schemas/Sponsored'}
    Sponsored:
      type: object
      description: Present on ads only. Render the label and advertiser ("Sponsored · Mama Tee").
      required: [label, advertiser, campaignId, slot, token, reason]
      properties:
        label: {type: string, const: Sponsored}
        advertiser: {type: string}
        campaignId: {type: string}
        slot: {type: integer, description: 1-based position the ad won}
        token: {type: string, description: Opaque click token; send it back as adToken with the click}
        reason: {$ref: '#/components/schemas/AdReason'}
    AdReason:
      type: object
      description: Why this ad was shown (no bids or prices are disclosed)
      required: [targeting, matched, qualityScore, auctionRank, competitors, eligibility, summary]
      properties:
        targeting: {type: string, enum: [KEYWORD, CATEGORY]}
        matched: {type: string, description: The keyword or category that matched}
        qualityScore: {type: number, minimum: 0, maximum: 1, description: Relevance to the query relative to the best organic result}
        auctionRank: {type: integer}
        competitors: {type: integer, description: Eligible ads in the auction}
        eligibility: {type: array, items: {type: string}}
        summary: {type: string}
    ClickRequest:
      type: object
      required: [searchId, atin, position]
      properties:
        searchId: {type: string, description: searchId of the results page}
        q: {type: string, maxLength: 200}
        market: {type: string, default: us}
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        position: {type: integer, minimum: 1, maximum: 1000, description: 1-based position on the page}
        adToken: {type: string, description: sponsored.token of an ad}
        customerId: {type: string, description: Shopper (accepted from service callers only)}
    ClickResult:
      type: object
      required: [recorded, duplicate, sponsored]
      properties:
        recorded: {type: boolean}
        duplicate: {type: boolean}
        sponsored: {type: boolean}
        adStatus: {type: string, enum: [BILLABLE, DUPLICATE, EXPIRED]}
    QueryStat:
      type: object
      required: [query, searches, zeroResults, clicks, ctr]
      properties:
        query: {type: string, description: Normalised query}
        searches: {type: integer, format: int64}
        zeroResults: {type: integer, format: int64}
        clicks: {type: integer, format: int64}
        ctr: {type: number}
    QueryReport:
      type: object
      required: [market, from, to, items]
      properties:
        market: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        items: {type: array, items: {$ref: '#/components/schemas/QueryStat'}}
    DailyCTR:
      type: object
      required: [day, searches, clicks, zeroResults, ctr, zeroResultRate]
      properties:
        day: {type: string, description: 'YYYY-MM-DD, or "total"'}
        searches: {type: integer, format: int64}
        clicks: {type: integer, format: int64}
        zeroResults: {type: integer, format: int64}
        ctr: {type: number}
        zeroResultRate: {type: number}
    CTRReport:
      type: object
      required: [market, from, to, days, total]
      properties:
        market: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        days: {type: array, items: {$ref: '#/components/schemas/DailyCTR'}}
        total: {$ref: '#/components/schemas/DailyCTR'}
    SynonymRule:
      type: object
      required: [id, synonyms]
      properties:
        id: {type: string}
        synonyms: {type: string, examples: ['gari, garri, cassava flakes']}
    FacetBucket:
      type: object
      properties:
        value: {type: string}
        count: {type: integer, format: int64}
    SearchPage:
      type: object
      required: [hits, total, page, size, facets]
      properties:
        hits: {type: array, items: {$ref: '#/components/schemas/Hit'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        size: {type: integer}
        facets:
          type: object
          additionalProperties: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}}
        semantic: {type: boolean, description: True when semantic (kNN) retrieval was fused into the ranking}
        retrieval:
          type: string
          enum: [HYBRID, LEXICAL]
          description: HYBRID = BM25 and kNN fused by reciprocal rank; LEXICAL = BM25 only.
        semanticSkipped:
          type: string
          enum: [SHORT_QUERY, NOT_CONFIGURED, SORTED, DEEP_PAGE, EMBEDDER_UNAVAILABLE, EMBEDDER_TIMEOUT]
          description: Why semantic retrieval was not used (LEXICAL pages only).
        tookMs: {type: integer, format: int64}
        searchId: {type: string, description: Identifies this search for click reporting}
    Suggestion:
      type: object
      properties:
        text: {type: string}
        department: {type: string}
    Suggestions:
      type: object
      properties:
        phrases: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
        products: {type: array, items: {$ref: '#/components/schemas/Hit'}}
