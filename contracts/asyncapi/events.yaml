defaultContentType: application/json
info:
  description: Every domain event on the bus. Topics are at.<aggregate>.events, keyed by aggregate id; headers carry event-id,
    event-type and occurred-at. Producers use a transactional outbox; consumers de-duplicate on event-id.
  title: AfroTransact platform events
  version: 1.0.0
operations:
  publishCarrierShipmentEvents:
    action: send
    channel:
      $ref: '#/channels/carrierShipmentEvents'
    summary: carrier-gateway publishes normalised tracking from UPS Track Alert, FedEx and DHL pushes and USPS polling, and
      pickup-ready notices for counters, lockers and seller pickup. Consumed by orders (shipment states, promise measurement)
      and notifications (customer updates).
  publishCatalogProductEvents:
    action: send
    channel:
      $ref: '#/channels/catalogProductEvents'
    summary: catalog-service publishes product lifecycle events via its transactional outbox.
  publishCatalogCategoryRequestEvents:
    action: send
    channel:
      $ref: '#/channels/catalogCategoryRequestEvents'
  publishIdentityEvents:
    action: send
    channel:
      $ref: '#/channels/identityEvents'
    summary: identity-service publishes account, verification and access-change events via its transactional outbox.
  publishInventoryStockEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryStockEvents'
    summary: inventory-service publishes availability (available = on hand − reserved) and lot lifecycle events via its transactional
      outbox. Search indexer, storefront, cart, promise, Lola and finance (GL postings) consume them.
  publishInventoryReservationEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryReservationEvents'
    summary: Reservation lifecycle for the orders saga and finance (COGS on committed).
  publishInventoryReconciliationEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryReconciliationEvents'
    summary: Raised when positions differ from the ledger or lots; alerts the inventory channel.
  consumeNotificationsIdentityEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsIdentityEvents'
    summary: identity.verification.requested → template identity.verification (email, or the payload's channel).
  consumeNotificationsOrdersEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsOrdersEvents'
    summary: order.placed → order.confirmed (email, sms, push); shipment.out_for_delivery → shipment.out_for_delivery (sms,
      push, email).
  consumeNotificationsSellerEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsSellerEvents'
    summary: seller.payout.requirement_due → payout.requirement_due (email, sms; reminder category, quiet hours apply).
  consumeNotificationsBookingsEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsBookingsEvents'
    summary: booking.confirmed → booking.confirmed (email, sms, push).
  publishPaymentsPaymentEvents:
    action: send
    channel:
      $ref: '#/channels/paymentsPaymentEvents'
    summary: payments-service publishes via its transactional outbox. The orders saga confirms on intent.succeeded and compensates
      on intent.failed; notifications tells sellers about chargebacks; finance reporting reads captures.
  publishPaymentsPayoutEvents:
    action: send
    channel:
      $ref: '#/channels/paymentsPayoutEvents'
    summary: Seller / provider payouts for the portals, notifications and Finance.
servers:
  cloud:
    description: Confluent Cloud (same on AWS, GCP and Azure)
    host: pkc-xxxxx.confluent.cloud:9092
    protocol: kafka-secure
  local:
    host: localhost:9092
    protocol: kafka
