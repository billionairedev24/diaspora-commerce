      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationFlagged:
      name: seller.application.flagged
      title: Reviewer flagged failed checks for the final approver
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationInfoRequested:
      name: seller.application.info_requested
      title: Reviewer asked the applicant for documents or fields (requestedItems)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationApproved:
      name: seller.application.approved
      title: Final approval by a second person
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationRejected:
      name: seller.application.rejected
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerOrgApproved:
      name: seller.org.approved
      title: Organisation approved — unlock the back office for its owners
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerOrgEvent'
    sellerOrgUpdated:
      name: seller.org.updated
      title: Organisation name or status changed (display name for search and carts)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerOrgEvent'
    sellerPickupLocationUpdated:
      name: seller.pickup_location.updated
      title: AfroTransact Delivery pickup location enabled, moved, disabled or deleted (S255)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerPickupLocationUpdated'
    sellerComplianceChanged:
      name: seller.compliance.changed
      title: Stripe requirements or account health changed
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerComplianceChanged'
    sellerComplianceReminder:
      name: seller.compliance.reminder
      title: Reminder 7, 3 or 1 day(s) before current_deadline, or sent by staff (manual)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerComplianceReminder'
    sellerPayoutsPaused:
      name: seller.payouts.paused
      title: Hold payouts (past-due requirements, staff hold, disconnected account or Trust and Safety suspension); funds
        keep accruing
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerPayoutsResumed:
      name: seller.payouts.resumed
      title: Release held payouts (requirements cleared, released by staff, or seller reinstated with no compliance hold left)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerListingsHidden:
      name: seller.listings.hidden
      title: Charges disabled, account disconnected or seller suspended — hide listings and bookings from the storefront
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerListingsRestored:
      name: seller.listings.restored
      title: Show listings again (charges re-enabled, or seller reinstated while no compliance hold hides them)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerSubscriptionChanged:
      name: seller.subscription.changed
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerSubscriptionChanged'
    sellerBillingGrantApplied:
      name: seller.billing.grant_applied
      title: A reward or staff billing adjustment was applied at Stripe
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerBillingGrantApplied'
    returnsRmaRequested:
      name: returns.rma.requested
      title: A customer started a return (or reported a problem with a perishable item)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRmaApproved:
      name: returns.rma.approved
      title: Approved by the seller or staff, or auto-approved (AfroTransact-fulfilled, low value, seller SLA passed)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRmaRejected:
      name: returns.rma.rejected
      title: Rejected by the seller / staff, or every line failed inspection
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRmaCancelled:
      name: returns.rma.cancelled
      title: The customer cancelled before drop-off / pickup
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRmaLabelIssued:
      name: returns.rma.label_issued
      title: 'Drop-off: carrier label + QR payload issued; driver pickup: handover code issued (not in the payload)'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRmaInTransit:
      name: returns.rma.in_transit
      title: First carrier scan or driver pickup
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRmaReceived:
      name: returns.rma.received
      title: The parcel arrived at the seller or the AfroTransact return centre
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRmaInspected:
      name: returns.rma.inspected
      title: Inspection outcome per line (PASS / FAIL, RESTOCK / DAMAGED)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRmaRefunded:
      name: returns.rma.refunded
      title: The return is closed with its refund issued
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRma'
    returnsRefundIssued:
      name: returns.refund.issued
      title: payments-service accepted the refund (seller transfer portion and commission reversed by payments)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRefund'
    returnsRefundFailed:
      name: returns.refund.failed
      title: payments-service refused the refund (4xx); staff can retry
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ReturnsRefund'
    taxSaleRecorded:
      name: tax.sale.recorded
      title: Tax collected on a placed order, per line and seller
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TaxLedgerEntry'
    taxRefundReversed:
      name: tax.refund.reversed
      title: Tax given back by a refund (booked negative in the month of the refund)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TaxLedgerEntry'
    trustOpsModerationQueued:
      name: trustops.moderation.queued
      title: A new submission, a reported / flagged live listing or a booking review entered the moderation queue (itemType)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsModerationEvent'
    trustOpsModerationEscalated:
      name: trustops.moderation.escalated
      title: A listing or review was escalated (by a reviewer, or automatically when its SLA was breached). Carries sellerOrgId
        and, for a shopper-reported live listing, the reporting customer's customerId.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsModerationEvent'
    trustOpsModerationDecided:
      name: trustops.moderation.decided
      title: A listing or review was decided through trust-ops (new listing approved / rejected, live listing kept / taken
        down, review published / rejected) or closed because catalog or bookings decided it. Consumers that act on listings
        must filter on itemType.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsModerationEvent'
    trustOpsClaimOpened:
      name: trustops.claim.opened
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsClaimEvent'
    trustOpsClaimResponseDueSoon:
      name: trustops.claim.response_due_soon
      title: 'Reminder to the seller: the claim still awaits their response and the deadline (dueAt) is within 24 h. Sent
        once per claim by the SLA sweep (idempotent: claim.response_reminder_sent_at).'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsClaimEvent'
    trustOpsClaimResponseLapsed:
      name: trustops.claim.response_lapsed
      title: The seller's response window passed without an answer; the claim moved to staff review (status UNDER_REVIEW,
        dueAt = decision deadline, responseDueAt = the missed seller deadline).
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsClaimEvent'
    trustOpsClaimSellerResponded:
      name: trustops.claim.seller_responded
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsClaimEvent'
    trustOpsClaimEscalated:
      name: trustops.claim.escalated
      title: Staff escalated a claim, or the sweep did when the decision SLA was breached (reason). Carries sellerOrgId and
        customerId.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsClaimEvent'
    trustOpsClaimDecided:
      name: trustops.claim.decided
      title: Staff decided a claim (refund through payments-service, or denial). decisionNote is the staff note shown to both
        parties.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsClaimEvent'
    trustOpsClaimWithdrawn:
      name: trustops.claim.withdrawn
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsClaimEvent'
    trustOpsSellerSuspended:
      name: trustops.seller.suspended
      title: 'Staff suspended a seller. seller-service holds its suspension hold (POST /v1/orgs/{orgId}/suspend: payouts paused,
        listings hidden through seller.listings.hidden in catalog, offers, bookings and search) and the seller is restricted
        in the buy box (offers).'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsSellerEnforcement'
    trustOpsSellerReinstated:
      name: trustops.seller.reinstated
      title: 'Staff reinstated a seller: the suspension hold and the buy-box restriction are lifted. Unrelated Stripe compliance
        payout holds stay in seller-service.'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsSellerEnforcement'
    trustOpsSellerHealthComputed:
      name: trustops.seller.health_computed
      title: Seller health computed (daily job or on demand) and pushed to offers
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsSellerHealth'
    trustOpsSupportCaseOpened:
      name: trustops.support_case.opened
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsSupportCase'
    trustOpsAuditRecorded:
      name: trustops.audit.recorded
      title: An entry was appended to the immutable, hash-chained audit log
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/TrustOpsAuditRecorded'
  schemas:
    EventHeaders:
      properties:
        event-id:
          format: uuid
          type: string
        event-type:
          type: string
        occurred-at:
          format: date-time
          type: string
      required:
      - event-id
      - event-type
      - occurred-at
      type: object
    AiHandoffRequested:
      type: object
      required:
      - handoffId
      - sessionId
      - subject
      - reason
      - summary
      - requestedAt
      properties:
        handoffId:
          type: string
          format: uuid
        sessionId:
          type: string
          description: Lola conversation id
        subject:
          type: string
          description: Shopper user id (token subject)
        reason:
          type: string
          description: 'Why: human_requested, unsafe (safety rule) or the model''s reason (for example payment-issue).'
        summary:
          type: string
          description: Redacted summary for the support agent (max 1
          000 characters): null
        requestedAt:
          type: string
          format: date-time
    BookingsBookingEvent:
      type: object
      required:
      - recipient
      - firstName
      - serviceName
      - providerName
      - startsAt
      - location
      - bookingReference
      - manageUrl
      - bookingId
      - orgId
      - memberId
      - serviceId
      - status
      - startAt
      - endAt
      - priceMinor
      - depositMinor
      - currency
      - policy
      properties:
        recipient:
          type: object
          description: The customer (notifications' recipient block).
          properties:
            id:
              type: string
              description: Customer id (token subject)
            email:
              type:
              - string
              - 'null'
            phone:
              type:
              - string
              - 'null'
            timeZone:
              type: string
              description: Provider's IANA zone
        firstName:
          type: string
        serviceName:
          type: string
        providerName:
          type: string
        startsAt:
          type: string
          description: Formatted in the provider zone, e.g. "Sat, Oct 17 · 10:00 AM"
        location:
          type: string
        bookingReference:
          type: string
          examples:
          - BK-24018
        manageUrl:
          type: string
          format: uri
        bookingId:
          type: string
          format: uuid
        orgId:
          type: string
        memberId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - REQUESTED
          - CONFIRMED
          - RESCHEDULE_REQUESTED
          - RESCHEDULE_PROPOSED
          - COMPLETED
          - NO_SHOW
          - DECLINED
          - EXPIRED
          - CANCELLED_CUSTOMER
          - CANCELLED_PROVIDER
        previousStatus:
          type:
          - string
          - 'null'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        proposedStartAt:
          type:
          - string
          - 'null'
          format: date-time
        priceMinor:
          type: integer
          format: int64
          description: Minor units (cents)
          add-ons included: null
        depositMinor:
          type: integer
          format: int64
        currency:
          type: string
          examples:
          - USD
        policy:
          type: string
          enum:
          - FLEXIBLE
          - MODERATE
          - STRICT
          - CUSTOM
        refundedMinor:
          type: integer
          format: int64
        providerFeeMinor:
          type: integer
          format: int64
          description: Late provider-cancellation fee
        reason:
          type:
          - string
          - 'null'
        cancelledBy:
          type:
          - string
          - 'null'
          enum:
          - CUSTOMER
          - PROVIDER
          - SYSTEM
          - null
        balanceMinor:
          type: integer
          format: int64
          description: Price minus deposit
        balanceState:
          type: string
          description: Where the balance stands. Long-dated bookings release the balance hold after the deposit capture (DUE)
            and charge it off-session on the saved card before the appointment.
          enum:
          - ON_AUTHORISATION
          - DUE
          - PROCESSING
          - ACTION_REQUIRED
          - FAILED
          - AUTHORIZED
          - CAPTURED
          - NEEDS_ATTENTION
          - RELEASED
        balanceFailure:
          type:
          - string
          - 'null'
          description: Why the last off-session attempt failed
    BookingsServiceEvent:
      type: object
      required:
      - serviceId
      - orgId
      - name
      - category
      - durationMinutes
      - priceMinor
      - depositMinor
      - currency
      - modes
      - active
      properties:
        serviceId:
          type: string
          format: uuid
        orgId:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        durationMinutes:
          type: integer
        priceMinor:
          type: integer
          format: int64
        depositMinor:
          type: integer
          format: int64
        currency:
          type: string
        modes:
          type: array
          items:
            type: string
            enum:
            - IN_PERSON
            - AT_HOME
            - VIRTUAL
        addOns:
          type: array
          items:
            type: string
        active:
          type: boolean
    BookingsReviewEvent:
      type: object
      description: Key = booking id (one review per booking, so the review id is the booking id).
      required:
      - contentType
      - reviewId
      - bookingId
      - orgId
      - serviceId
      - customerId
      - reviewerName
      - rating
      - status
      - createdAt
      - approvePath
      - rejectPath
      properties:
        contentType:
          type: string
          const: BOOKING_REVIEW
          description: Routing hint for a generic moderation queue
        reviewId:
          type: string
          format: uuid
          description: Same as bookingId
        bookingId:
          type: string
          format: uuid
        orgId:
          type: string
          description: Provider organisation
        serviceId:
          type: string
          format: uuid
        serviceName:
          type:
          - string
          - 'null'
        customerId:
          type: string
          description: Author (token subject); never shown publicly
        reviewerName:
          type: string
          description: Public display name, e.g. "Adaeze N."
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type:
          - string
          - 'null'
          maxLength: 2000
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        createdAt:
          type: string
          format: date-time
        moderatedBy:
          type:
          - string
          - 'null'
        moderatedAt:
          type:
          - string
          - 'null'
          format: date-time
        reasonCode:
          type:
          - string
          - 'null'
          enum:
          - ABUSIVE
          - PERSONAL_INFORMATION
          - SPAM
          - OFF_TOPIC
          - CONFLICT_OF_INTEREST
          - OTHER
          - null
        moderationNote:
          type:
          - string
          - 'null'
        replyText:
          type:
          - string
          - 'null'
          maxLength: 1000
        repliedAt:
          type:
          - string
          - 'null'
          format: date-time
        approvePath:
          type: string
          examples:
          - /v1/reviews/0b7e…/approve
        rejectPath:
          type: string
          description: POST body {reasonCode, note}; note required for OTHER
    CarrierShipmentState:
      type: string
      enum:
      - label_created
      - picked_up
      - in_transit
      - out_for_delivery
      - delivered
      - delivery_failed
      - returned
      - exception
    CarrierTrackingUpdated:
      type: object
      required:
      - carrier
      - trackingNumber
      - state
      - stateChanged
      - event
      properties:
        carrier:
          type: string
          enum:
          - usps
          - ups
          - fedex
          - dhl
        trackingNumber:
          type: string
        labelId:
          type:
          - string
          - 'null'
          format: uuid
          description: Set when the label was bought through carrier-gateway
        reference:
          type:
          - string
          - 'null'
          description: Order/package reference given when buying or registering the label
        state:
          $ref: '#/components/schemas/CarrierShipmentState'
        previousState:
          type:
          - string
          - 'null'
        stateChanged:
          type: boolean
        event:
          type: object
          required:
          - eventId
          - occurredAt
          properties:
            eventId:
              type: string
              description: Carrier event id or a stable hash of carrier fields (same scan via push and poll de-duplicates)
            code:
              type: string
              description: Carrier status code (USPS eventCode
              UPS type/code: null
              FedEx eventType: null
              DHL typeCode): null
            description:
              type: string
            state:
              type: string
            occurredAt:
              type: string
              format: date-time
              description: Carrier timestamp (UTC)
            location:
              type: string
            sequence:
              type: integer
    CarrierPickupReady:
      type: object
      required:
      - locationId
      - orderRef
      - customerRef
      - readyAt
      properties:
        locationId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - PLATFORM_COUNTER
          - LOCKER
          - SELLER
        address:
          type: object
          properties:
            line1:
              type: string
            line2:
              type: string
            city:
              type: string
            state:
              type: string
            postalCode:
              type: string
            country:
              type: string
        hours:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
              open:
                type: string
              close:
                type: string
        orderRef:
          type: string
        customerRef:
          type: string
        pickupCode:
          type:
          - string
          - 'null'
        readyAt:
          type: string
          format: date-time
    CarrierLabelEvent:
      type: object
      required:
      - labelId
      - originNode
      - carrier
      - service
      - trackingNumber
      - kind
      - fulfilment
      - billTo
      - billingReason
      - costMinor
      - handlingMinor
      - amountMinor
      - currency
      - purchasedAt
      properties:
        labelId:
          type: string
          format: uuid
        orgId:
          type: string
          description: Organisation of the member who bought the label (absent for staff / services)
        shipmentId:
          type: string
          description: Order shipment the label is for
        orderId:
          type: string
          description: Order of the shipment
          when the caller gave it: null
        reference:
          type: string
          description: Reference printed on the label
        originNode:
          type: string
          description: FC id or seller org id the parcel leaves from
        carrier:
          type: string
          enum:
          - usps
          - ups
          - fedex
          - dhl
        service:
          type: string
        trackingNumber:
          type: string
        kind:
          type: string
          enum:
          - outbound
          - return
        fulfilment:
          type: string
          enum:
          - SELLER_SHIPPED
          - FBA
          - AFROTRANSACT_DELIVERY
        billTo:
          type: string
          enum:
          - SELLER
          - AFROTRANSACT
          description: SELLER only for an organisation member's outbound, seller-shipped label from its own origin that is
            not AfroTransact Retail's; everything else (Retail, FBA, AfroTransact Delivery, FC origins, returns, staff and
            services) is AfroTransact's own cost.
        billingReason:
          type: string
          enum:
          - SELLER_SHIPPED
          - RETAIL
          - FBA
          - AFROTRANSACT_DELIVERY
          - RETURN
          - PLATFORM_CALLER
          - PLATFORM_ORIGIN
        costMinor:
          type: integer
          description: The carrier's negotiated charge for the label
        handlingMinor:
          type: integer
          description: Handling markup (carrier-gateway billing config; 0 unless billTo is SELLER)
        amountMinor:
          type: integer
          description: costMinor + handlingMinor; what a SELLER-billed label is charged
        currency:
          type: string
        purchasedAt:
          type: string
          format: date-time
        voidedAt:
          type: string
          format: date-time
          description: Set on carrier.label.voided
        voidReason:
          type: string
          enum:
          - VOIDED
          description: Set on carrier.label.voided
    CatalogProductEvent:
      type: object
      required:
      - productId
      - atin
      - ownerKind
      - ownerOrgId
      - status
      - title
      - variants
      properties:
        productId:
          type: string
          format: uuid
        atin:
          type: string
          pattern: ^AT[0-9A-Z]{8}$
        ownerKind:
          type: string
          enum:
          - SELLER
          - PLATFORM
        ownerOrgId:
          type: string
        status:
          type: string
          enum:
          - IN_REVIEW
          - PENDING_CATEGORY_APPROVAL
          - LIVE
          - REJECTED
          - PAUSED
          - TAKEN_DOWN
