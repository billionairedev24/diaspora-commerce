info:
  description: Every domain event on the bus. Topics are at.<aggregate>.events, keyed by aggregate id; headers carry event-id,
    event-type and occurred-at. Producers use a transactional outbox; consumers de-duplicate on event-id.
  title: AfroTransact platform events
  version: 1.0.0
operations:
  publishCatalogProductEvents:
    action: send
    channel:
      $ref: '#/channels/catalogProductEvents'
    summary: catalog-service publishes product lifecycle events via its transactional outbox.
  publishCatalogCategoryRequestEvents:
    action: send
    channel:
      $ref: '#/channels/catalogCategoryRequestEvents'
  publishInventoryStockEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryStockEvents'
    summary: inventory-service publishes availability (available = on hand − reserved) and lot lifecycle events via its transactional
      outbox. Search indexer, storefront, cart, promise, Lola and finance (GL postings) consume them.
  publishInventoryReservationEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryReservationEvents'
    summary: Reservation lifecycle for the orders saga and finance (COGS on committed).
  publishInventoryReconciliationEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryReconciliationEvents'
    summary: Raised when positions differ from the ledger or lots; alerts the inventory channel.
