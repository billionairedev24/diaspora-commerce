      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/PaymentsPayout'
    sellerApplicationSubmitted:
      name: seller.application.submitted
      title: Application submitted (or resubmitted after a request for info; see submissionCount)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationFlagged:
      name: seller.application.flagged
      title: Reviewer flagged failed checks for the final approver
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationInfoRequested:
      name: seller.application.info_requested
      title: Reviewer asked the applicant for documents or fields (requestedItems)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationApproved:
      name: seller.application.approved
      title: Final approval by a second person
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationRejected:
      name: seller.application.rejected
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerOrgApproved:
      name: seller.org.approved
      title: Organisation approved — unlock the back office for its owners
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerOrgEvent'
    sellerOrgUpdated:
      name: seller.org.updated
      title: Organisation name or status changed (display name for search and carts)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerOrgEvent'
    sellerComplianceChanged:
      name: seller.compliance.changed
      title: Stripe requirements or account health changed
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerComplianceChanged'
    sellerComplianceReminder:
      name: seller.compliance.reminder
      title: Reminder 7, 3 or 1 day(s) before current_deadline, or sent by staff (manual)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerComplianceReminder'
    sellerPayoutsPaused:
      name: seller.payouts.paused
      title: Hold payouts (past-due requirements, staff hold or disconnected account); funds keep accruing
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerPayoutsResumed:
      name: seller.payouts.resumed
      title: Release held payouts (requirements cleared, or released by Trust & Safety)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerListingsHidden:
      name: seller.listings.hidden
      title: Charges disabled — hide listings and bookings from the storefront
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerListingsRestored:
      name: seller.listings.restored
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerSubscriptionChanged:
      name: seller.subscription.changed
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerSubscriptionChanged'
  schemas:
    EventHeaders:
      properties:
        event-id:
          format: uuid
          type: string
        event-type:
          type: string
        occurred-at:
          format: date-time
          type: string
      required:
      - event-id
      - event-type
      - occurred-at
      type: object
    AiHandoffRequested:
      type: object
      required:
      - handoffId
      - sessionId
      - subject
      - reason
      - summary
      - requestedAt
      properties:
        handoffId:
          type: string
          format: uuid
        sessionId:
          type: string
          description: Lola conversation id
        subject:
          type: string
          description: Shopper user id (token subject)
        reason:
          type: string
          description: 'Why: human_requested, unsafe (safety rule) or the model''s reason (for example payment-issue).'
        summary:
          type: string
          description: Redacted summary for the support agent (max 1
          000 characters): null
        requestedAt:
          type: string
          format: date-time
    BookingsBookingEvent:
      type: object
      required:
      - recipient
      - firstName
      - serviceName
      - providerName
      - startsAt
      - location
      - bookingReference
      - manageUrl
      - bookingId
      - orgId
      - memberId
      - serviceId
      - status
      - startAt
      - endAt
      - priceMinor
      - depositMinor
      - currency
      - policy
      properties:
        recipient:
          type: object
          description: The customer (notifications' recipient block).
          properties:
            id:
              type: string
              description: Customer id (token subject)
            email:
              type:
              - string
              - 'null'
            phone:
              type:
              - string
              - 'null'
            timeZone:
              type: string
              description: Provider's IANA zone
        firstName:
          type: string
        serviceName:
          type: string
        providerName:
          type: string
        startsAt:
          type: string
          description: Formatted in the provider zone, e.g. "Sat, Oct 17 · 10:00 AM"
        location:
          type: string
        bookingReference:
          type: string
          examples:
          - BK-24018
        manageUrl:
          type: string
          format: uri
        bookingId:
          type: string
          format: uuid
        orgId:
          type: string
        memberId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - REQUESTED
          - CONFIRMED
          - RESCHEDULE_REQUESTED
          - RESCHEDULE_PROPOSED
          - COMPLETED
          - NO_SHOW
          - DECLINED
          - EXPIRED
          - CANCELLED_CUSTOMER
          - CANCELLED_PROVIDER
        previousStatus:
          type:
          - string
          - 'null'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        proposedStartAt:
          type:
          - string
          - 'null'
          format: date-time
        priceMinor:
          type: integer
          format: int64
          description: Minor units (cents)
          add-ons included: null
        depositMinor:
          type: integer
          format: int64
        currency:
          type: string
          examples:
          - USD
        policy:
          type: string
          enum:
          - FLEXIBLE
          - MODERATE
          - STRICT
          - CUSTOM
        refundedMinor:
          type: integer
          format: int64
        providerFeeMinor:
          type: integer
          format: int64
          description: Late provider-cancellation fee
        reason:
          type:
          - string
          - 'null'
        cancelledBy:
          type:
          - string
          - 'null'
          enum:
          - CUSTOMER
          - PROVIDER
          - SYSTEM
          - null
    BookingsServiceEvent:
      type: object
      required:
      - serviceId
      - orgId
      - name
      - category
      - durationMinutes
      - priceMinor
      - depositMinor
      - currency
      - modes
      - active
      properties:
        serviceId:
          type: string
          format: uuid
        orgId:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        durationMinutes:
          type: integer
        priceMinor:
          type: integer
          format: int64
        depositMinor:
          type: integer
          format: int64
        currency:
          type: string
        modes:
          type: array
          items:
            type: string
            enum:
            - IN_PERSON
            - AT_HOME
            - VIRTUAL
        addOns:
          type: array
          items:
            type: string
        active:
          type: boolean
    CarrierShipmentState:
      type: string
      enum:
      - label_created
      - picked_up
      - in_transit
      - out_for_delivery
      - delivered
      - delivery_failed
      - returned
      - exception
    CarrierTrackingUpdated:
      type: object
      required:
      - carrier
      - trackingNumber
      - state
      - stateChanged
      - event
      properties:
        carrier:
          type: string
          enum:
          - usps
          - ups
          - fedex
          - dhl
        trackingNumber:
          type: string
        labelId:
          type:
          - string
          - 'null'
          format: uuid
          description: Set when the label was bought through carrier-gateway
        reference:
          type:
          - string
          - 'null'
          description: Order/package reference given when buying or registering the label
        state:
          $ref: '#/components/schemas/CarrierShipmentState'
        previousState:
          type:
          - string
          - 'null'
        stateChanged:
          type: boolean
        event:
          type: object
          required:
          - eventId
          - occurredAt
          properties:
            eventId:
              type: string
              description: Carrier event id or a stable hash of carrier fields (same scan via push and poll de-duplicates)
            code:
              type: string
              description: Carrier status code (USPS eventCode
              UPS type/code: null
              FedEx eventType: null
              DHL typeCode): null
            description:
              type: string
            state:
              type: string
            occurredAt:
              type: string
              format: date-time
              description: Carrier timestamp (UTC)
            location:
              type: string
            sequence:
              type: integer
    CarrierPickupReady:
      type: object
      required:
      - locationId
      - orderRef
      - customerRef
      - readyAt
      properties:
        locationId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - PLATFORM_COUNTER
          - LOCKER
          - SELLER
        address:
          type: object
          properties:
            line1:
              type: string
            line2:
              type: string
            city:
              type: string
            state:
              type: string
            postalCode:
              type: string
            country:
              type: string
        hours:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
              open:
                type: string
              close:
                type: string
        orderRef:
          type: string
        customerRef:
          type: string
        pickupCode:
          type:
          - string
          - 'null'
        readyAt:
          type: string
          format: date-time
    CatalogProductEvent:
      type: object
      required:
      - productId
      - atin
      - ownerKind
      - ownerOrgId
      - status
      - title
      - variants
      properties:
        productId:
          type: string
          format: uuid
        atin:
          type: string
          pattern: ^AT[0-9A-Z]{8}$
        ownerKind:
          type: string
          enum:
          - SELLER
          - PLATFORM
        ownerOrgId:
          type: string
        status:
          type: string
          enum:
          - IN_REVIEW
          - PENDING_CATEGORY_APPROVAL
          - LIVE
          - REJECTED
          - PAUSED
        title:
          type: string
        categoryId:
          type:
          - string
          - 'null'
          format: uuid
        productTypeCode:
          type: string
        note:
          type:
          - string
          - 'null'
        sellerHidden:
          type: boolean
          description: The owner's listings are hidden by seller-service compliance enforcement (seller.listings.hidden).
            Keep the product off public surfaces regardless of status; set on every catalog.product.* event while hidden.
        variants:
          type: array
          items:
            type: object
            properties:
              atin:
                type: string
              sellerSku:
                type: string
              gtin:
                type:
                - string
                - 'null'
              priceMinor:
                type: integer
                format: int64
              currency:
                type: string
              quantity:
                type: integer
    CatalogCategoryRequestEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        orgId:
          type: string
        path:
          type: string
        status:
          type: string
          enum:
          - PENDING_REVIEW
          - APPROVED
          - REJECTED
    ContentPlacementsPublished:
      type: object
      required:
      - placementId
      - slot
      - market
      - status
      - action
      - purgePaths
      - cacheTags
      - occurredAt
      properties:
        placementId:
          type: string
          examples:
          - plc_3f9a1c0d2b7e4a11
        slot:
          type: string
          enum:
          - announcement_bar
          - hero_carousel
          - home_tiles
          - home_product_row
          - display_banner
          - category_banner
          - checkout_cross_sell
        market:
          type: string
          description: ISO country, or * for every market
        status:
          type: string
          enum:
          - SCHEDULED
          - LIVE
          - ENDED
        action:
          type: string
          enum:
          - SCHEDULED
          - LIVE
          - ENDED
        purgePaths:
          type: array
          items:
            type: string
          examples:
          - - /v1/placements/bundles/US
        cacheTags:
          type: array
          items:
            type: string
          examples:
          - - placements:US
            - placements:slot:hero_carousel
        occurredAt:
          type: string
          format: date-time
    ContentMarketsPublished:
      type: object
      required:
      - version
      - publishedBy
      - changedCountries
      - newlyLive
      - disabledRegions
      - enabledRegions
      properties:
        version:
          type: integer
        publishedBy:
          type: string
        note:
          type:
          - string
          - 'null'
        changedCountries:
          type: array
          items:
            type: string
        newlyLive:
          type: array
          items:
            type: string
          description: Countries now LIVE (email their launch lists)
        disabledRegions:
          type: array
          items:
            type: string
          examples:
          - - US-GA
          description: Marketplace switched off — block delivery
        enabledRegions:
          type: array
          items:
            type: string
    ContentSiteConfigChanged:
      type: object
      required:
      - revision
      - changedSections
      - updatedBy
      properties:
        revision:
          type: integer
        changedSections:
          type: array
          items:
            type: string
            enum:
            - socials
            - contacts
            - appLinks
            - paymentMethods
            - smsProgramName
            - identityProviders
            - locales
            - market
        updatedBy:
          type: string
    ContentLegalVersionChanged:
      type: object
      required:
      - document
      - title
      - version
      - effectiveDate
      - draftBanner
      - href
      properties:
        document:
          type: string
          enum:
          - conditions-of-use
          - privacy
          - cookies
          - privacy-choices
          - returns
          - seller-terms
          - prohibited-items
          - accessibility
          - sms-terms
        title:
          type: string
        version:
          type: string
          examples:
          - '3.3'
        previousVersion:
          type:
          - string
          - 'null'
          description: Archived version (raise only)
        effectiveDate:
          type: string
          format: date
        draftBanner:
          type: boolean
          description: '"Draft for legal counsel review" banner shown'
        href:
          type: string
          examples:
          - /legal/sms-terms
    ContentFlagChanged:
      type: object
      required:
      - key
      - enabled
      - killSwitch
      - rolloutPercentage
      - version
      - updatedBy
      properties:
        key:
          type: string
        enabled:
          type: boolean
        killSwitch:
          type: boolean
        rolloutPercentage:
          type: number
          minimum: 0
          maximum: 100
        version:
          type: integer
          format: int64
        updatedBy:
          type: string
    ContentNewsletterConfirmationRequested:
      type: object
      required:
      - subscriptionId
      - email
      - locale
      - confirmUrl
      - unsubscribeUrl
      - expiresAt
      properties:
        subscriptionId:
          type: string
          format: uuid
        email:
