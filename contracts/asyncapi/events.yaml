          type: string
        event-type:
          type: string
        occurred-at:
          format: date-time
          type: string
      required:
      - event-id
      - event-type
      - occurred-at
      type: object
    AiHandoffRequested:
      type: object
      required:
      - handoffId
      - sessionId
      - subject
