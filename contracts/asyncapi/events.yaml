    description: retail (S225/S243) → supplier purchase-order emails requested with notification.requested (templateKey retail.purchase_order.sent;
      recipient = the supplier contact's address, never resolved through identity). Typed retail.* events (retail.po.sent,
      retail.po.dispatched, retail.po.dispatch-failed …) are not mapped.
    messages:
      notificationsRequestedRetail:
        $ref: '#/components/messages/notificationsRequested'
  offersEvents:
    address: at.offers.events
    description: Offers, buy box and coupon events from offers-service via its transactional outbox. Offer and buy box events
      are keyed by the variant ATIN (so one product variant's offer changes and buy box decisions stay in order); coupon events
      are keyed by coupon id. Headers event-id, event-type, occurred-at; consumers de-duplicate on event-id.
    messages:
      offersOfferCreated:
        $ref: '#/components/messages/offersOfferCreated'
      offersOfferUpdated:
        $ref: '#/components/messages/offersOfferUpdated'
      offersOfferWithdrawn:
        $ref: '#/components/messages/offersOfferWithdrawn'
      offersBuyBoxChanged:
        $ref: '#/components/messages/offersBuyBoxChanged'
      offersCouponCreated:
        $ref: '#/components/messages/offersCouponCreated'
      offersCouponUpdated:
        $ref: '#/components/messages/offersCouponUpdated'
      offersCouponRedeemed:
        $ref: '#/components/messages/offersCouponRedeemed'
      offersCouponReleased:
        $ref: '#/components/messages/offersCouponReleased'
  ordersOrderEvents:
    address: at.order.events
    description: Order and shipment lifecycle from orders-service, written to its transactional outbox in the same transaction
      as the change (key = order id, so one order's events stay in order). Headers event-id, event-type, occurred-at; consumers
      de-duplicate on event-id. Shipment statuses use the wire names of the state machine (placed, confirmed, packed, ready,
      picked_up, in_transit, out_for_delivery, delivered, delivery_failed, returned, cancelled).
    messages:
      ordersOrderPlaced:
        $ref: '#/components/messages/ordersOrderPlaced'
      ordersOrderCancelled:
        $ref: '#/components/messages/ordersOrderCancelled'
      ordersShipmentStatusChanged:
        $ref: '#/components/messages/ordersShipmentStatusChanged'
      ordersShipmentDelivered:
        $ref: '#/components/messages/ordersShipmentDelivered'
      ordersShipmentCancelled:
        $ref: '#/components/messages/ordersShipmentCancelled'
      ordersPreorderDeliveryMissed:
        $ref: '#/components/messages/ordersPreorderDeliveryMissed'
      ordersPreorderMissedDeliveryAnswered:
        $ref: '#/components/messages/ordersPreorderMissedDeliveryAnswered'
      ordersPreorderPaymentLinkCreated:
        $ref: '#/components/messages/ordersPreorderPaymentLinkCreated'
      ordersPreorderRefundSettled:
        $ref: '#/components/messages/ordersPreorderRefundSettled'
      ordersPreorderRefundFailed:
        $ref: '#/components/messages/ordersPreorderRefundFailed'
  paymentsPaymentEvents:
    address: at.payment.events
    description: Payment lifecycle, captures, refunds, settlement transfers and chargebacks from payments-service (key = order
      id, so one order's money events stay in order). Headers event-id, event-type, occurred-at; consumers de-duplicate on
      event-id.
    messages:
      paymentsIntentCreated:
        $ref: '#/components/messages/paymentsIntentCreated'
      paymentsIntentSucceeded:
        $ref: '#/components/messages/paymentsIntentSucceeded'
      paymentsIntentFailed:
        $ref: '#/components/messages/paymentsIntentFailed'
      paymentsIntentCanceled:
        $ref: '#/components/messages/paymentsIntentCanceled'
      paymentsIntentActionRequired:
        $ref: '#/components/messages/paymentsIntentActionRequired'
      paymentsAuthorizationReleased:
        $ref: '#/components/messages/paymentsAuthorizationReleased'
      paymentsCaptured:
        $ref: '#/components/messages/paymentsCaptured'
      paymentsRefunded:
        $ref: '#/components/messages/paymentsRefunded'
      paymentsTransferCreated:
        $ref: '#/components/messages/paymentsTransferCreated'
      paymentsDisputeOpened:
        $ref: '#/components/messages/paymentsDisputeOpened'
      paymentsDisputeClosed:
        $ref: '#/components/messages/paymentsDisputeClosed'
  paymentsPayoutEvents:
    address: at.payout.events
    description: Payout requests on manual Connect payout schedules and provider fees debited from connected accounts (key
      = organisation id), and AfroTransact Retail supplier payments (key = supplier id, S226).
    messages:
      paymentsPayoutRequested:
        $ref: '#/components/messages/paymentsPayoutRequested'
      paymentsPayoutApproved:
        $ref: '#/components/messages/paymentsPayoutApproved'
      paymentsPayoutPaid:
        $ref: '#/components/messages/paymentsPayoutPaid'
      paymentsPayoutFailed:
        $ref: '#/components/messages/paymentsPayoutFailed'
      paymentsProviderFeeRecorded:
        $ref: '#/components/messages/paymentsProviderFeeRecorded'
      paymentsProviderFeeCollected:
        $ref: '#/components/messages/paymentsProviderFeeCollected'
      paymentsSupplierPaymentScheduled:
        $ref: '#/components/messages/paymentsSupplierPaymentScheduled'
      paymentsSupplierPaymentPaid:
        $ref: '#/components/messages/paymentsSupplierPaymentPaid'
      paymentsSupplierPaymentUpdated:
        $ref: '#/components/messages/paymentsSupplierPaymentUpdated'
  retailEvents:
    address: at.retail.events
    description: 'AfroTransact Retail (1P) purchasing events from retail-service (key = aggregate id: item, supplier, PO,
      shipment, receipt, invoice or journal entry id). Headers event-id, event-type, occurred-at. Published through the transactional
      outbox; consumers de-duplicate on event-id.'
    messages:
      retailItemCreated:
        $ref: '#/components/messages/retailItemCreated'
      retailItemUpdated:
        $ref: '#/components/messages/retailItemUpdated'
      retailItemListingChanged:
        $ref: '#/components/messages/retailItemListingChanged'
      retailSupplierCreated:
        $ref: '#/components/messages/retailSupplierCreated'
      retailSupplierUpdated:
        $ref: '#/components/messages/retailSupplierUpdated'
      retailSupplierStatusChanged:
        $ref: '#/components/messages/retailSupplierStatusChanged'
      retailPoCreated:
        $ref: '#/components/messages/retailPoCreated'
      retailPoUpdated:
        $ref: '#/components/messages/retailPoUpdated'
      retailPoSubmitted:
        $ref: '#/components/messages/retailPoSubmitted'
      retailPoApproved:
        $ref: '#/components/messages/retailPoApproved'
      retailPoSentBack:
        $ref: '#/components/messages/retailPoSentBack'
      retailPoSent:
        $ref: '#/components/messages/retailPoSent'
      retailPoDispatched:
        $ref: '#/components/messages/retailPoDispatched'
      retailPoDispatchFailed:
        $ref: '#/components/messages/retailPoDispatchFailed'
      retailNotificationRequested:
        $ref: '#/components/messages/notificationsRequested'
      retailPoConfirmed:
        $ref: '#/components/messages/retailPoConfirmed'
      retailPoCancelled:
        $ref: '#/components/messages/retailPoCancelled'
      retailPoReceived:
        $ref: '#/components/messages/retailPoReceived'
      retailPoClosed:
        $ref: '#/components/messages/retailPoClosed'
      retailShipmentBooked:
        $ref: '#/components/messages/retailShipmentBooked'
      retailShipmentUpdated:
        $ref: '#/components/messages/retailShipmentUpdated'
      retailShipmentStageChanged:
        $ref: '#/components/messages/retailShipmentStageChanged'
      retailReceiptOpened:
        $ref: '#/components/messages/retailReceiptOpened'
      retailReceiptPosted:
        $ref: '#/components/messages/retailReceiptPosted'
      retailReceiptDiscrepancyRaised:
        $ref: '#/components/messages/retailReceiptDiscrepancyRaised'
      retailReceiptClaimResolved:
        $ref: '#/components/messages/retailReceiptClaimResolved'
      retailLandedCostAllocated:
        $ref: '#/components/messages/retailLandedCostAllocated'
      retailGlJournalPosted:
        $ref: '#/components/messages/retailGlJournalPosted'
      retailInvoiceMatched:
        $ref: '#/components/messages/retailInvoiceMatched'
      retailMatchException:
        $ref: '#/components/messages/retailMatchException'
      retailInvoiceHeld:
        $ref: '#/components/messages/retailInvoiceHeld'
      retailInvoiceApproved:
        $ref: '#/components/messages/retailInvoiceApproved'
      retailInvoiceRejected:
        $ref: '#/components/messages/retailInvoiceRejected'
      retailPaymentReleased:
        $ref: '#/components/messages/retailPaymentReleased'
  searchEvents:
    address: at.search.events
    description: Searches and result clicks (key = search id). search.query.performed is published for every tracked search
      page (the BFF sends track=false for rails and Lola); search.result.clicked once per search and product.
    messages:
      searchQueryPerformed:
        $ref: '#/components/messages/searchQueryPerformed'
      searchResultClicked:
        $ref: '#/components/messages/searchResultClicked'
  adsEvents:
    address: at.ads.events
    description: Sponsored-product delivery from search's second-price auction (key = campaign id, so one campaign's clicks
      are charged in order). Impression ids are stable per search and ad; click ids per served ad token (one billable click
      per ad shown).
    messages:
      adsImpressionRecorded:
        $ref: '#/components/messages/adsImpressionRecorded'
      adsClickRecorded:
        $ref: '#/components/messages/adsClickRecorded'
  sellerApplicationEvents:
    address: at.seller-application.events
    description: Onboarding applications (key = application id). Headers event-id, event-type, occurred-at; consumers de-duplicate
      on event-id. notifications-service emails / texts the applicant; trust-ops audits decisions.
    messages:
      sellerApplicationSubmitted:
        $ref: '#/components/messages/sellerApplicationSubmitted'
      sellerApplicationFlagged:
        $ref: '#/components/messages/sellerApplicationFlagged'
      sellerApplicationInfoRequested:
        $ref: '#/components/messages/sellerApplicationInfoRequested'
      sellerApplicationApproved:
        $ref: '#/components/messages/sellerApplicationApproved'
      sellerApplicationRejected:
        $ref: '#/components/messages/sellerApplicationRejected'
  sellerOrgEvents:
    address: at.seller-org.events
    description: Seller and provider organisations (key = org id).
    messages:
      sellerOrgApproved:
        $ref: '#/components/messages/sellerOrgApproved'
      sellerOrgUpdated:
        $ref: '#/components/messages/sellerOrgUpdated'
      sellerPickupLocationUpdated:
        $ref: '#/components/messages/sellerPickupLocationUpdated'
  sellerComplianceEvents:
    address: at.seller-compliance.events
    description: Stripe Connect compliance mirror and automatic enforcement, plus Trust and Safety suspension holds (key =
      org id, so pause / resume and hide / restore for one organisation stay in order).
    messages:
      sellerComplianceChanged:
        $ref: '#/components/messages/sellerComplianceChanged'
      sellerComplianceReminder:
        $ref: '#/components/messages/sellerComplianceReminder'
      sellerPayoutsPaused:
        $ref: '#/components/messages/sellerPayoutsPaused'
      sellerPayoutsResumed:
        $ref: '#/components/messages/sellerPayoutsResumed'
      sellerListingsHidden:
        $ref: '#/components/messages/sellerListingsHidden'
      sellerListingsRestored:
        $ref: '#/components/messages/sellerListingsRestored'
  sellerSubscriptionEvents:
    address: at.seller-subscription.events
    description: Plan subscriptions on Stripe Billing, and the rewards and staff adjustments applied to them (key = org id).
    messages:
      sellerSubscriptionChanged:
        $ref: '#/components/messages/sellerSubscriptionChanged'
      sellerBillingGrantApplied:
        $ref: '#/components/messages/sellerBillingGrantApplied'
  taxReturnsEvents:
    address: at.taxreturns.events
    description: 'Returns (RMAs), refunds and the tax ledger from tax-returns-service, written to its transactional outbox
      in the same transaction as the change. Keys: RMA id for returns.rma.*, refund id for returns.refund.*, order id for
      tax.*. Headers event-id, event-type, occurred-at; consumers de-duplicate on event-id. Money is in minor units of `currency`.'
    messages:
      returnsRmaRequested:
        $ref: '#/components/messages/returnsRmaRequested'
      returnsRmaApproved:
        $ref: '#/components/messages/returnsRmaApproved'
      returnsRmaRejected:
        $ref: '#/components/messages/returnsRmaRejected'
      returnsRmaCancelled:
        $ref: '#/components/messages/returnsRmaCancelled'
      returnsRmaLabelIssued:
        $ref: '#/components/messages/returnsRmaLabelIssued'
      returnsRmaInTransit:
        $ref: '#/components/messages/returnsRmaInTransit'
      returnsRmaReceived:
        $ref: '#/components/messages/returnsRmaReceived'
      returnsRmaInspected:
        $ref: '#/components/messages/returnsRmaInspected'
      returnsRmaRefunded:
        $ref: '#/components/messages/returnsRmaRefunded'
      returnsRefundIssued:
        $ref: '#/components/messages/returnsRefundIssued'
      returnsRefundFailed:
        $ref: '#/components/messages/returnsRefundFailed'
      taxSaleRecorded:
        $ref: '#/components/messages/taxSaleRecorded'
      taxRefundReversed:
        $ref: '#/components/messages/taxRefundReversed'
  trustOpsEvents:
    address: at.trustops.events
    description: Trust & safety decisions and the audit stream from trust-ops-service (transactional outbox). Key = product
      id (listing moderation), booking id (review moderation), claim id (claims), seller org id (seller events), support case
      id, or "audit-log" for trustops.audit.recorded (one key, so the audit stream keeps its order). Headers event-id, event-type,
      occurred-at.
    messages:
      trustOpsModerationQueued:
        $ref: '#/components/messages/trustOpsModerationQueued'
      trustOpsModerationEscalated:
        $ref: '#/components/messages/trustOpsModerationEscalated'
      trustOpsModerationDecided:
        $ref: '#/components/messages/trustOpsModerationDecided'
      trustOpsClaimOpened:
        $ref: '#/components/messages/trustOpsClaimOpened'
      trustOpsClaimResponseDueSoon:
        $ref: '#/components/messages/trustOpsClaimResponseDueSoon'
      trustOpsClaimResponseLapsed:
        $ref: '#/components/messages/trustOpsClaimResponseLapsed'
      trustOpsClaimSellerResponded:
        $ref: '#/components/messages/trustOpsClaimSellerResponded'
      trustOpsClaimEscalated:
        $ref: '#/components/messages/trustOpsClaimEscalated'
      trustOpsClaimDecided:
        $ref: '#/components/messages/trustOpsClaimDecided'
      trustOpsClaimWithdrawn:
        $ref: '#/components/messages/trustOpsClaimWithdrawn'
      trustOpsSellerSuspended:
        $ref: '#/components/messages/trustOpsSellerSuspended'
      trustOpsSellerReinstated:
        $ref: '#/components/messages/trustOpsSellerReinstated'
      trustOpsSellerHealthComputed:
        $ref: '#/components/messages/trustOpsSellerHealthComputed'
      trustOpsSupportCaseOpened:
        $ref: '#/components/messages/trustOpsSupportCaseOpened'
      trustOpsAuditRecorded:
        $ref: '#/components/messages/trustOpsAuditRecorded'
components:
  messages:
    aiHandoffRequested:
      name: ai.handoff.requested
      title: Lola handed a conversation to human support
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/AiHandoffRequested'
    bookingsRequested:
      name: booking.requested
      title: Deposit authorised; waiting for the provider (expires after the request SLA, 4 h)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsConfirmed:
      name: booking.confirmed
      title: Confirmed by the provider or automatically (instant booking); deposit captured
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsDeclined:
      name: booking.declined
      title: Declined by the provider; deposit hold released
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsExpired:
      name: booking.expired
      title: Unanswered request or unpaid slot hold expired; authorisation released
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsCancelled:
      name: booking.cancelled
      title: Cancelled by the customer (policy refund) or the provider (full refund, late fee under 24 h); after the deposit
        capture the rest of the authorisation is released (or the off-session balance charge cancelled)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsRescheduleRequested:
      name: booking.reschedule_requested
      title: The customer asked for a new time; the provider decides
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsTimeProposed:
      name: booking.time_proposed
      title: The provider proposed a new time; the customer accepts or declines
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsRescheduled:
      name: booking.rescheduled
      title: The appointment moved to a new time
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsCompleted:
      name: booking.completed
      title: Appointment completed (by the provider or automatically 48 h after); balance charged (on the original authorisation
        or the off-session charge), settlement hold started
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsNoShow:
      name: booking.no_show
      title: Customer didn't show; deposit kept and the rest of the authorisation released (or full price per policy)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsBalanceUnpaid:
      name: booking.balance_unpaid
      title: 'Long-dated booking whose balance could not be charged off-session on the saved card (declined after every attempt,
        or not authorised by completion): the provider and the customer need to settle it'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsBookingEvent'
    bookingsReviewSubmitted:
      name: booking.review.submitted
      title: A customer rated a completed booking; the review is PENDING until moderation approves it (trust-ops queues it
        and decides with POST /v1/reviews/{bookingId}/approve|reject, permission bookings:reviews:moderate)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsReviewEvent'
    bookingsReviewApproved:
      name: booking.review.approved
      title: Moderation published the review (listed publicly, counted in ratings); closes the moderation item
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsReviewEvent'
    bookingsReviewRejected:
      name: booking.review.rejected
      title: Moderation removed the review (never public, or taken down after publication); closes the moderation item
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsReviewEvent'
    bookingsReviewReplied:
      name: booking.review.replied
      title: The provider replied (once) to a published review; the reply is public at once
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsReviewEvent'
    bookingsServiceUpserted:
      name: booking.service.upserted
      title: A provider's service was created or changed (key = service id)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/BookingsServiceEvent'
    carrierTrackingUpdated:
      name: carrier.tracking.updated
      title: A carrier scan was applied to a tracked parcel
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CarrierTrackingUpdated'
    carrierPickupReady:
      name: carrier.pickup.ready
      title: An order is ready for collection at a pickup location
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CarrierPickupReady'
    carrierLabelPurchased:
      name: carrier.label.purchased
      title: A label was bought through carrier-gateway
      summary: Written once per label, in the transaction that completes the purchase (an idempotent replay of POST /v1/labels
        publishes nothing). billTo SELLER means the buying organisation pays amountMinor (carrier cost + handling).
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CarrierLabelEvent'
    carrierLabelVoided:
      name: carrier.label.voided
      title: A purchased label was voided at the carrier
      summary: Written once per label, in the transaction that marks it voided (a second void is refused with 409). Carries
        the same billing fields as the purchase, so a seller-billed label's charge can be credited back.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CarrierLabelEvent'
    catalogProductCreated:
      name: catalog.product.created
      title: Product created (in review or waiting for category approval)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductApproved:
      name: catalog.product.approved
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductRejected:
      name: catalog.product.rejected
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductPaused:
      name: catalog.product.paused
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductResumed:
      name: catalog.product.resumed
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductUpdated:
      name: catalog.product.updated
      title: Listing settings changed without a status change (S272 pre-order flags)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductHidden:
      name: catalog.product.hidden
      title: The owner's listings were hidden by seller-service compliance enforcement (sellerHidden = true)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductRestored:
      name: catalog.product.restored
      title: The owner's listings were restored (sellerHidden = false; status is the product's own status)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductFlagged:
      name: catalog.product.flagged
      title: A live listing was reported, flagged by staff or flagged automatically
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductFlagged'
    catalogProductTakenDown:
      name: catalog.product.taken_down
      title: Trust and Safety took a live or paused listing down (status TAKEN_DOWN, reasonCode set)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductReinstated:
      name: catalog.product.reinstated
      title: A takedown was reversed (status is the listing's status before the takedown, LIVE or PAUSED)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductTermsChanged:
      name: catalog.product.terms_changed
      title: Price, quantity, "was" price, condition, fulfilment, handling time or ship-from changed (S307)
      summary: Published with catalog.product.updated when the seller edits these through the one-step product form or a bulk
        update, or adds variants; offers-service updates the seller's offers (price, list price, seller quantity, handling
        time, ship-from) and creates offers for new variants.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogProductResubmitted:
      name: catalog.product.resubmitted
      title: A rejected listing was edited and is back in review (S307)
      summary: trust-ops-service queues it for moderation again, like catalog.product.created with status IN_REVIEW.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogProductEvent'
    catalogImportCompleted:
      name: catalog.import.completed
      title: A bulk upload finished importing (S308)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogImportCompleted'
    catalogCategoryRequestCreated:
      name: catalog.category-request.created
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogCategoryRequestEvent'
    catalogCategoryRequestApproved:
      name: catalog.category-request.approved
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogCategoryRequestEvent'
    catalogCategoryRequestRejected:
      name: catalog.category-request.rejected
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/CatalogCategoryRequestEvent'
    contentAdsCampaignPaused:
      name: content.ads.campaign_paused
      title: A sponsored-products campaign was paused (budget spent or by its owner); key = campaign id
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ContentAdsCampaignPaused'
    contentPlacementsPublished:
      name: content.placements.published
      title: Placements of a market changed (approved, live or ended) — purge the CDN bundle
      headers:
