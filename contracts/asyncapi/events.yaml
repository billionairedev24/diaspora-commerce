      title: Finance approved; Stripe payout created (IN_TRANSIT)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/PaymentsPayout'
    paymentsPayoutPaid:
      name: payments.payout.paid
      title: Payout arrived (payout.paid)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/PaymentsPayout'
    paymentsPayoutFailed:
      name: payments.payout.failed
      title: Payout failed; amount is available again
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/PaymentsPayout'
    sellerApplicationSubmitted:
      name: seller.application.submitted
      title: Application submitted (or resubmitted after a request for info; see submissionCount)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationFlagged:
      name: seller.application.flagged
      title: Reviewer flagged failed checks for the final approver
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationInfoRequested:
      name: seller.application.info_requested
      title: Reviewer asked the applicant for documents or fields (requestedItems)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationApproved:
      name: seller.application.approved
      title: Final approval by a second person
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerApplicationRejected:
      name: seller.application.rejected
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerApplicationEvent'
    sellerOrgApproved:
      name: seller.org.approved
      title: Organisation approved — unlock the back office for its owners
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerOrgEvent'
    sellerOrgUpdated:
      name: seller.org.updated
      title: Organisation name or status changed (display name for search and carts)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerOrgEvent'
    sellerComplianceChanged:
      name: seller.compliance.changed
      title: Stripe requirements or account health changed
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerComplianceChanged'
    sellerComplianceReminder:
      name: seller.compliance.reminder
      title: Reminder 7, 3 or 1 day(s) before current_deadline, or sent by staff (manual)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerComplianceReminder'
    sellerPayoutsPaused:
      name: seller.payouts.paused
      title: Hold payouts (past-due requirements, staff hold or disconnected account); funds keep accruing
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerPayoutsResumed:
      name: seller.payouts.resumed
      title: Release held payouts (requirements cleared, or released by Trust & Safety)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerListingsHidden:
      name: seller.listings.hidden
      title: Charges disabled — hide listings and bookings from the storefront
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerListingsRestored:
      name: seller.listings.restored
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerEnforcement'
    sellerSubscriptionChanged:
      name: seller.subscription.changed
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SellerSubscriptionChanged'
  schemas:
    EventHeaders:
      properties:
        event-id:
          format: uuid
          type: string
        event-type:
          type: string
        occurred-at:
          format: date-time
          type: string
      required:
      - event-id
      - event-type
      - occurred-at
      type: object
    AiHandoffRequested:
      type: object
      required:
      - handoffId
      - sessionId
      - subject
      - reason
      - summary
      - requestedAt
      properties:
        handoffId:
          type: string
          format: uuid
        sessionId:
          type: string
          description: Lola conversation id
        subject:
          type: string
          description: Shopper user id (token subject)
        reason:
          type: string
          description: 'Why: human_requested, unsafe (safety rule) or the model''s reason (for example payment-issue).'
        summary:
          type: string
          description: Redacted summary for the support agent (max 1
          000 characters): null
        requestedAt:
          type: string
          format: date-time
    CarrierShipmentState:
      type: string
      enum:
      - label_created
      - picked_up
      - in_transit
      - out_for_delivery
      - delivered
      - delivery_failed
      - returned
      - exception
    CarrierTrackingUpdated:
      type: object
      required:
      - carrier
      - trackingNumber
      - state
      - stateChanged
      - event
      properties:
        carrier:
          type: string
          enum:
          - usps
          - ups
          - fedex
          - dhl
        trackingNumber:
          type: string
        labelId:
          type:
          - string
          - 'null'
          format: uuid
          description: Set when the label was bought through carrier-gateway
        reference:
          type:
          - string
          - 'null'
          description: Order/package reference given when buying or registering the label
        state:
          $ref: '#/components/schemas/CarrierShipmentState'
        previousState:
          type:
          - string
          - 'null'
        stateChanged:
          type: boolean
        event:
          type: object
          required:
          - eventId
          - occurredAt
          properties:
            eventId:
              type: string
              description: Carrier event id or a stable hash of carrier fields (same scan via push and poll de-duplicates)
            code:
              type: string
              description: Carrier status code (USPS eventCode
              UPS type/code: null
              FedEx eventType: null
              DHL typeCode): null
            description:
              type: string
            state:
              type: string
            occurredAt:
              type: string
              format: date-time
              description: Carrier timestamp (UTC)
            location:
              type: string
            sequence:
              type: integer
    CarrierPickupReady:
      type: object
      required:
      - locationId
      - orderRef
      - customerRef
      - readyAt
      properties:
        locationId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - PLATFORM_COUNTER
          - LOCKER
          - SELLER
        address:
          type: object
          properties:
            line1:
              type: string
            line2:
              type: string
            city:
              type: string
            state:
              type: string
            postalCode:
              type: string
            country:
              type: string
        hours:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
              open:
                type: string
              close:
                type: string
        orderRef:
          type: string
        customerRef:
          type: string
        pickupCode:
          type:
          - string
          - 'null'
        readyAt:
          type: string
          format: date-time
    CatalogProductEvent:
      type: object
      required:
      - productId
      - atin
      - ownerKind
      - ownerOrgId
      - status
      - title
      - variants
      properties:
        productId:
          type: string
          format: uuid
        atin:
          type: string
          pattern: ^AT[0-9A-Z]{8}$
        ownerKind:
          type: string
          enum:
          - SELLER
          - PLATFORM
        ownerOrgId:
          type: string
        status:
          type: string
          enum:
          - IN_REVIEW
          - PENDING_CATEGORY_APPROVAL
          - LIVE
          - REJECTED
          - PAUSED
        title:
          type: string
        categoryId:
          type:
          - string
          - 'null'
          format: uuid
        productTypeCode:
          type: string
        note:
          type:
          - string
          - 'null'
        variants:
          type: array
          items:
            type: object
            properties:
              atin:
                type: string
              sellerSku:
                type: string
              gtin:
                type:
                - string
                - 'null'
              priceMinor:
                type: integer
                format: int64
              currency:
                type: string
              quantity:
                type: integer
    CatalogCategoryRequestEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        orgId:
          type: string
        path:
          type: string
        status:
          type: string
          enum:
          - PENDING_REVIEW
          - APPROVED
          - REJECTED
    ContentPlacementsPublished:
      type: object
      required:
      - placementId
      - slot
      - market
      - status
      - action
      - purgePaths
      - cacheTags
      - occurredAt
      properties:
        placementId:
          type: string
          examples:
          - plc_3f9a1c0d2b7e4a11
        slot:
          type: string
          enum:
          - announcement_bar
          - hero_carousel
          - home_tiles
          - home_product_row
          - display_banner
          - category_banner
          - checkout_cross_sell
        market:
          type: string
          description: ISO country, or * for every market
        status:
          type: string
          enum:
          - SCHEDULED
          - LIVE
          - ENDED
        action:
          type: string
          enum:
          - SCHEDULED
          - LIVE
          - ENDED
        purgePaths:
          type: array
          items:
            type: string
          examples:
          - - /v1/placements/bundles/US
        cacheTags:
          type: array
          items:
            type: string
          examples:
          - - placements:US
            - placements:slot:hero_carousel
        occurredAt:
          type: string
          format: date-time
    ContentMarketsPublished:
      type: object
      required:
      - version
      - publishedBy
      - changedCountries
      - newlyLive
      - disabledRegions
      - enabledRegions
      properties:
        version:
          type: integer
        publishedBy:
          type: string
        note:
          type:
          - string
          - 'null'
        changedCountries:
          type: array
          items:
            type: string
        newlyLive:
          type: array
          items:
            type: string
          description: Countries now LIVE (email their launch lists)
        disabledRegions:
          type: array
          items:
            type: string
          examples:
          - - US-GA
          description: Marketplace switched off — block delivery
        enabledRegions:
          type: array
          items:
            type: string
    ContentSiteConfigChanged:
      type: object
      required:
      - revision
      - changedSections
      - updatedBy
      properties:
        revision:
          type: integer
        changedSections:
          type: array
          items:
            type: string
            enum:
            - socials
            - contacts
            - appLinks
            - paymentMethods
            - smsProgramName
            - identityProviders
            - locales
            - market
        updatedBy:
          type: string
    ContentLegalVersionChanged:
      type: object
      required:
      - document
      - title
      - version
      - effectiveDate
      - draftBanner
      - href
      properties:
        document:
          type: string
          enum:
          - conditions-of-use
          - privacy
          - cookies
          - privacy-choices
          - returns
          - seller-terms
          - prohibited-items
          - accessibility
          - sms-terms
        title:
          type: string
        version:
          type: string
          examples:
          - '3.3'
        previousVersion:
          type:
          - string
          - 'null'
          description: Archived version (raise only)
        effectiveDate:
          type: string
          format: date
        draftBanner:
          type: boolean
          description: '"Draft for legal counsel review" banner shown'
        href:
          type: string
          examples:
          - /legal/sms-terms
    ContentFlagChanged:
      type: object
      required:
      - key
      - enabled
      - killSwitch
      - rolloutPercentage
      - version
      - updatedBy
      properties:
        key:
          type: string
        enabled:
          type: boolean
        killSwitch:
          type: boolean
        rolloutPercentage:
          type: number
          minimum: 0
          maximum: 100
        version:
          type: integer
          format: int64
        updatedBy:
          type: string
    ContentNewsletterConfirmationRequested:
      type: object
      required:
      - subscriptionId
      - email
      - locale
      - confirmUrl
      - unsubscribeUrl
      - expiresAt
      properties:
        subscriptionId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        locale:
          type: string
          enum:
          - en
          - fr
          - es
          - ar
        confirmUrl:
          type: string
          format: uri
          description: Signed link; expires at expiresAt
        unsubscribeUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    ContentNewsletterStatusChanged:
      type: object
      required:
      - subscriptionId
      - email
      - locale
      properties:
        subscriptionId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        locale:
          type: string
        unsubscribeUrl:
          type:
          - string
          - 'null'
          format: uri
          description: One-click unsubscribe (List-Unsubscribe header)
    ContentLaunchListJoined:
      type: object
      required:
      - entryId
      - email
      - country
      - countryName
      - audience
      - shoppingUpdates
      properties:
        entryId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        country:
          type: string
        countryName:
          type: string
        audience:
          type: string
          enum:
          - SELLER
          - PROVIDER
          - SHOPPER
        shoppingUpdates:
          type: boolean
        launchNote:
          type:
          - string
          - 'null'
    ContentCareerApplicationReceived:
      type: object
      required:
      - reference
      - jobId
      - jobTitle
      - team
      - location
      - name
      - email
      - resumeAssetId
      - resumeFileName
      - submittedAt
      properties:
        reference:
          type: string
          pattern: ^CAR-\d{6}$
        jobId:
          type: string
        jobTitle:
          type: string
        team:
          type: string
        location:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        resumeAssetId:
          type: string
          description: media-service asset id
        resumeFileName:
          type: string
        submittedAt:
          type: string
          format: date-time
    IdentityUserRegistered:
      type: object
      required:
      - userId
      - email
      - firstName
      - lastName
      - intent
      - roles
      - method
      - emailVerified
      - smsConsent
      - registeredAt
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type:
          - string
          - 'null'
          description: E.164 mobile number
        intent:
          type: string
          enum:
          - SHOP
          - SELL
          - PROVIDE
          - STAFF
        roles:
          type: array
          items:
            type: string
            examples:
            - account.customer
            - account.seller_applicant
        method:
          type: string
          enum:
          - PASSWORD
          - GOOGLE
          - APPLE
          - FACEBOOK
          - ADMIN
        emailVerified:
          type: boolean
          description: true for social sign-ups and staff provisioning
        smsConsent:
          type: boolean
          description: Separate
          optional SMS opt-in from the sign-up form: null
        registeredAt:
          type: string
          format: date-time
    IdentityUserEmailVerified:
      type: object
      required:
      - userId
      - email
      - verifiedAt
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        verifiedAt:
          type: string
          format: date-time
    IdentityVerificationRequested:
      type: object
      description: Follows the notifications-service payload convention (recipient block, channel override).
      required:
      - recipient
      - channel
      - code
      - expiresInMinutes
      - expiresAt
      - purpose
      - userId
      - transactional
      properties:
        recipient:
          type: object
          required:
          - id
          properties:
            id:
              type: string
              format: uuid
            email:
              type:
              - string
              - 'null'
              format: email
            phone:
              type:
              - string
              - 'null'
              description: E.164
        channel:
          type: string
          enum:
          - email
          - sms
        code:
          type: string
          pattern: ^[0-9]{6}$
        expiresInMinutes:
          type: integer
          examples:
          - 10
        expiresAt:
          type: string
          format: date-time
        purpose:
          type: string
          enum:
          - EMAIL_VERIFICATION
          - SIGN_IN_SMS
          - SMS_ENROLMENT
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        transactional:
          type: boolean
          const: true
    IdentityRoleChanged:
      type: object
      required:
      - userId
      - roleKey
      - actorId
      - at
      properties:
        userId:
          type: string
          format: uuid
        roleKey:
          type: string
          examples:
          - platform.driver
          - seller.owner
          - account.seller_applicant
        orgId:
          type:
          - string
          - 'null'
          format: uuid
          description: Set for seller/provider organisation roles
        actorId:
          type: string
          description: User id of the administrator
          the user themself: null
          or a client id: null
        reason:
          type:
          - string
          - 'null'
        at:
          type: string
          format: date-time
    IdentityPermissionChanged:
      type: object
      required:
      - permissionKey
      - actorId
      - at
      description: Exactly one of userId (direct grant) or roleKey (role capability change) is set.
      properties:
        userId:
          type:
          - string
          - 'null'
          format: uuid
        roleKey:
          type:
          - string
          - 'null'
        permissionKey:
          type: string
          examples:
          - delivery:operate
        actorId:
          type: string
        reason:
          type:
          - string
          - 'null'
        at:
          type: string
          format: date-time
    IdentityUserStatusChanged:
      type: object
      required:
      - userId
      - actorId
      - at
      properties:
        userId:
          type: string
          format: uuid
        actorId:
          type: string
        reason:
          type:
          - string
          - 'null'
        at:
          type: string
          format: date-time
    InventoryAvailabilityChanged:
      type: object
      required:
      - sku
      - nodeId
      - ownerOrg
      - available
      - onHand
      - reserved
      - version
      properties:
        sku:
          type: string
        nodeId:
          type: string
          examples:
          - HOU-FC
        ownerOrg:
          type: string
          description: AfroTransact Retail for 1P
          the seller org for FBA stock: null
        available:
          type: integer
          description: on hand − reserved
        onHand:
          type: integer
        reserved:
          type: integer
        inbound:
          type: integer
        damaged:
          type: integer
          description: Units present but blocked from sale (quarantine
          damaged: null
          expired): null
        version:
          type: integer
          format: int64
          description: Position version; ignore events with an older version
    InventoryLotEvent:
      type: object
      required:
      - lotId
      - sku
      - lotNo
      - nodeId
      - ownerOrg
      - qtyOnHand
      - qty
      - status
      - unitLandedCostMinor
      - currency
      properties:
        lotId:
          type: string
          format: uuid
        sku:
          type: string
        lotNo:
          type: string
        nodeId:
          type: string
        ownerOrg:
          type: string
        bin:
          type:
          - string
          - 'null'
        qtyOnHand:
          type: integer
        qty:
          type: integer
          description: Units affected by this event
        status:
          type: string
          enum:
          - SELLABLE
          - QUARANTINE
          - EXPIRED
          - WRITTEN_OFF
          - DAMAGED
        mfgDate:
          type:
          - string
          - 'null'
          format: date
        expDate:
          type:
          - string
          - 'null'
          format: date
        unitLandedCostMinor:
          type: integer
          format: int64
        currency:
          type: string
        reason:
          type:
          - string
          - 'null'
        receiptRef:
          type:
          - string
          - 'null'
    InventoryReservationEvent:
      type: object
      required:
      - reservationId
      - orderId
      - status
      - lines
      properties:
        reservationId:
          type: string
          format: uuid
        orderId:
          type: string
        status:
          type: string
          enum:
          - HELD
          - COMMITTED
          - RELEASED
          - EXPIRED
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        reason:
          type:
          - string
          - 'null'
        cogs:
          type: array
          items:
            $ref: '#/components/schemas/InventoryMoney'
        lines:
          type: array
          items:
            type: object
            properties:
              lineNo:
                type: integer
              sku:
                type: string
              nodeId:
                type: string
              qty:
                type: integer
              allocations:
                type: array
                items:
                  type: object
                  properties:
                    lotId:
                      type: string
                      format: uuid
                    lotNo:
                      type: string
                    qty:
                      type: integer
                    expDate:
                      type:
                      - string
                      - 'null'
                      format: date
                    unitLandedCostMinor:
                      type: integer
                      format: int64
                    currency:
                      type: string
    InventoryMoney:
      type: object
      properties:
        currency:
          type: string
        amountMinor:
          type: integer
          format: int64
    McpToolInvoked:
      type: object
      required:
      - eventId
      - tool
      - toolset
      - subject
      - clientId
      - argumentsHash
      - outcome
      - durationMs
      - at
      properties:
        eventId:
          type: string
          format: uuid
        tool:
          type: string
          description: Tool name
          for example search_products: null
        toolset:
          type: string
          enum:
          - shopper
          - seller
          - staff
        subject:
          type: string
          description: Token subject (user id) or client id for service tokens
        clientId:
          type: string
          description: OAuth client that made the call
        orgId:
          type:
          - string
          - 'null'
          description: Active org of the caller
          when any: null
        argumentsHash:
          type: string
          description: SHA-256 of the canonical JSON arguments (arguments are never stored)
        outcome:
          type: string
          description: ok, denied, rate_limited or error
        durationMs:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
    NotificationsRecipient:
      type: object
      description: Who to notify. Every field is optional; a channel is used only when its address is present. When id is
        missing the event key is used.
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164
        pushTokens:
          type: array
          items:
            type: object
            required:
            - token
            - platform
            properties:
              token:
                type: string
              platform:
                type: string
                enum:
                - fcm
                - apns
        timeZone:
          type: string
          description: IANA zone for quiet hours
        locale:
          type: string
    NotificationsEnvelopeFields:
      type: object
      description: Common fields; every other top-level field becomes template data.
      required:
      - recipient
      properties:
