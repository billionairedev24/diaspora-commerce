        handoffId:
          type: string
          format: uuid
        sessionId:
          type:
          - string
          - 'null'
        customerId:
          type: string
        reason:
          type: string
        dueAt:
          type: string
          format: date-time
    TrustOpsAuditRecorded:
      type: object
      required:
      - seq
      - id
      - eventType
      - actorId
      - action
      - entityType
      - entityId
      - occurredAt
      - hash
      - prevHash
      properties:
        seq:
          type: integer
          format: int64
          description: Position in the chain (1, 2, 3 …)
        id:
          type: string
          format: uuid
        eventType:
          type: string
        actorId:
          type: string
        actorType:
          type:
          - string
          - 'null'
        action:
          type: string
          examples:
          - identity.role.granted
          - trustops.claim.decided
        entityType:
          type: string
        entityId:
          type: string
        orgId:
          type:
          - string
          - 'null'
        summary:
          type:
          - string
          - 'null'
        occurredAt:
          type: string
          format: date-time
        hash:
          type: string
          description: SHA-256 hex of prevHash, seq and the record content
        prevHash:
          type: string
defaultContentType: application/json
info:
  description: Every domain event on the bus. Topics are at.<aggregate>.events, keyed by aggregate id; headers carry event-id,
    event-type and occurred-at. Producers use a transactional outbox; consumers de-duplicate on event-id.
  title: AfroTransact platform events
  version: 1.0.0
operations:
  publishAiHandoffEvents:
    action: send
    channel:
      $ref: '#/channels/aiHandoffEvents'
    summary: ai-gateway-service publishes hand-off requests via its transactional outbox. The support console (trust-ops)
      opens a ticket with the summary and joins the Lola session.
  publishAuthzSyncDeadLetters:
    action: send
    channel:
      $ref: '#/channels/authzSyncDeadLetters'
    summary: Poison events parked so one bad event never blocks a partition.
  consumeAuthzSyncIdentityEvents:
    action: receive
    channel:
      $ref: '#/channels/identityEvents'
    summary: authz-sync (consumer group authz-sync) mirrors roles into OpenFGA. identity.role.granted / revoked with orgId
      writes / deletes user:<userId> <relation> organization:<orgId> (seller.owner and provider.owner → owner, seller.admin
      → admin, provider.manager → manager, seller.catalog → catalog, seller.fulfilment → fulfilment, seller.finance and provider.finance
      → finance, seller.ads → ads, seller.support → support, provider.practitioner → practitioner). Without orgId, platform
      staff roles become relations on platform:afrotransact (or on market:<code> when the payload carries a market), and platform.retail_buyer
      becomes catalog on AfroTransact Retail's organisation. Other roles and event types are ignored.
  consumeAuthzSyncSellerOrgEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerOrgEvents'
    summary: 'seller.org.approved / updated: organization:<orgId> gets platform:afrotransact, its market (country as content''s
      market code; other market tuples are removed) and the capability flags of its kind — sells_products for SELLER, offers_services
      for PROVIDER, both for BOTH (user:* and client:* wildcards); flags of other kinds are removed.'
  publishBookingsEvents:
    action: send
    channel:
      $ref: '#/channels/bookingsEvents'
    summary: bookings-service publishes via its transactional outbox. notifications sends booking.confirmed to the customer;
      search indexes booking.service.upserted. booking.balance_unpaid flags a long-dated booking whose balance could not be
      charged off-session on the saved card (declined after every attempt, or not authorised by completion) so the provider
      and the customer can settle it (also for services without a deposit, whose whole price is charged off-session when the
      appointment is beyond the card authorisation window); customers asked to authenticate an off-session charge are reached
      through payments' payments.intent.action_required. booking.review.submitted queues a customer review for moderation
      (trust-ops); only approved reviews are public (booking.review.approved / rejected record the decision, booking.review.replied
      the provider's single reply).
  consumeBookingsPaymentEvents:
    action: receive
    channel:
      $ref: '#/channels/bookingsPaymentEvents'
    summary: 'Without parentPaymentId: payments.intent.succeeded → the deposit is authorised: PENDING_PAYMENT becomes REQUESTED
      (or CONFIRMED with the deposit captured for instant-booking providers); payments.intent.failed records the failure (slot
      stays held). With parentPaymentId (the booking''s off-session balance charge; events of older charges are ignored):
      intent.succeeded → balance AUTHORIZED (captured on completion, or straight away when the booking is already completed);
      intent.action_required → ACTION_REQUIRED (the customer confirms with the charge''s client secret from GET /v1/bookings/{id}/balance-payment);
      intent.failed → a declined attempt, retried with a new Idempotency-Key until the attempt limit, then booking.balance_unpaid.'
  consumeBookingsSellerComplianceEvents:
    action: receive
    channel:
      $ref: '#/channels/bookingsSellerComplianceEvents'
    summary: seller.listings.hidden hides the provider's services from public reads; seller.listings.restored restores them.
  publishCarrierShipmentEvents:
    action: send
    channel:
      $ref: '#/channels/carrierShipmentEvents'
    summary: 'carrier-gateway publishes normalised tracking from UPS Track Alert, FedEx and DHL pushes and USPS polling, and
      pickup-ready notices for counters, lockers and seller pickup, and every label bought or voided through it. Consumed
      by orders (shipment states, promise measurement), notifications (customer updates) and payments (label charges: a label
      with billTo SELLER is debited from the seller''s payable and credited back once when voided).'
  publishCatalogProductEvents:
    action: send
    channel:
      $ref: '#/channels/catalogProductEvents'
    summary: 'catalog-service publishes product lifecycle events via its transactional outbox. catalog.product.flagged: a
      live listing was reported by a shopper (POST /v1/public/products/{atin}/reports), flagged by staff or flagged automatically
      by a service client (POST /v1/products/{id}/flags); trust-ops-service queues it as a live-listing moderation item. catalog.product.taken_down
      / reinstated: Trust and Safety removed a live or paused listing (POST /v1/products/{id}/takedown, status TAKEN_DOWN,
      hidden from public reads) or reversed it (POST /v1/products/{id}/restore, back to LIVE or PAUSED). Read models keep
      a product public only while its status is LIVE and sellerHidden is false.'
  publishCatalogProductImportEvents:
    action: send
    channel:
      $ref: '#/channels/catalogProductImportEvents'
    summary: 'catalog.import.completed: a bulk upload finished importing (every importable row created, updated or failed;
      rows with errors skipped). notifySeller is true for uploads of at least at.catalog.imports.notify-min-rows rows (100
      by default); notifications-service then tells the member who uploaded it.'
  publishCatalogCategoryRequestEvents:
    action: send
    channel:
      $ref: '#/channels/catalogCategoryRequestEvents'
  consumeCatalogSellerComplianceEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerComplianceEvents'
    summary: 'catalog-service (consumer group catalog-service, inbox-deduplicated) handles seller.listings.hidden / restored:
      records the organisation''s suppression (org_listing_suppression), hides its products from the public catalog API and
      publishes catalog.product.hidden / restored for every product of the organisation. Older decisions never override newer
      ones (occurredAt). This covers Stripe compliance enforcement and Trust and Safety suspension (reason SUSPENDED / REINSTATED)
      alike. Large catalogs are republished in pages of 500 products, one transaction per page (S216), so the product events
      of one decision are spread over several commits; a redelivered or crashed run resumes after its last committed page
      and a newer decision supersedes a run in progress, so each product gets at most one event per decision.'
  publishContentEvents:
    action: send
    channel:
      $ref: '#/channels/contentEvents'
    summary: 'content-service publishes via its transactional outbox. Consumers - edge worker and gateway-bff (content.placements.published:
      purge the market bundle / cached home); gateway-bff, cart, orders and seller onboarding (content.markets.published:
      refresh eligibility, block disabled states); gateway-bff and web/mobile (content.site-config.changed, content.legal.*);
      notifications (newsletter confirmation and welcome emails, launch-list emails for newly live countries, careers acknowledgements,
      30-day notices of material legal changes); identity (re-acceptance of raised Conditions of Use / Privacy versions);
      OFREP providers (content.flag.changed, optional early refresh); notifications (content.ads.campaign_paused: tell the
      seller a sponsored-products campaign stopped because its budget is spent).'
  receiveContentAdsEvents:
    action: receive
    channel:
      $ref: '#/channels/adsEvents'
    summary: 'Sponsored products (S127): ads.impression.recorded adds to the campaign''s daily impressions; ads.click.recorded
      charges the click (at most the second price, the lifetime budget left and today''s budget left) under a row lock and
      pauses the campaign at zero budget (content.ads.campaign_paused). Inbox-deduplicated on event-id (consumer group content-service)
      and on clickId.'
  receiveContentOrderEvents:
    action: receive
    channel:
      $ref: '#/channels/ordersOrderEvents'
    summary: orders.order.placed attributes order lines to the shopper's last sponsored-product click on the ordered variant
      from the same seller within 7 days (attributed orders and sales, ROAS). Each line is attributed once.
  publishDeliveryRunsEvents:
    action: send
    channel:
      $ref: '#/channels/deliveryRunsEvents'
    summary: 'delivery-runs-service publishes run lifecycle and subscription events. notifications announces opened, cutoff_reminder
      (24 h before cutoff, again after an extension) and out_for_delivery to the location''s opted-in subscribers (audience
      from GET /v1/service/locations/{id}/audience) and the run''s customers (orders[]), sends the double opt-in link of subscription.created
      (confirmUrl) and confirms / cancels customers'' preorders on confirmed / cancelled. orders captures payment on run.confirmed
      and releases stock and payment holds on run.cancelled. fulfilment plans the sweep on run.confirmed (GET /v1/service/runs/{id}/dispatch)
      and cancels the routes that have not started on run.cancelled. content refreshes run advertorials on announced / opened
      / extended and expires them on cancelled / confirmed. Pre-orders (S270–S275): notifications sends preorder.comms.due
      by kind — ANNOUNCE (preorder.announce email / SMS / push to the window''s audience from GET /v1/service/preorders/{windowId}/audience?segment=SUBSCRIBERS,
      and preorder.waitlist.opened email to segment=WAITLIST), REMIND_48H (preorder.reminder email / push), LAST_CALL_6H (preorder.last_call
      SMS / push), CLOSED (preorder.closed email to orders[]) and OUT_FOR_DELIVERY (preorder.out_for_delivery SMS / push to
      orders[]) — and texts the payment link of preorder.late_order.added (payment PAYMENT_LINK, preorder.late_order.payment_link).
      preorder.window.* follow a window''s lifecycle (keyed by window id; opened / closed / delivered come from the scheduler,
      closed after the paid orders were handed to a run, which publishes delivery-runs.run.confirmed; paused / resumed carry
      the staff actorId); preorder.settings.changed and preorder.areas.changed (key preorder-settings) and preorder.export.created
      are audit records; preorder.waitlist.joined records a waitlist sign-up. ADR 0005 §4: staff set a minimum order count
      per window. When the close date passes below it the window is not cancelled: it becomes AWAITING_DECISION and preorder.window.decision_needed
      tells staff (decision.kind AWAITING, orders and minimum counted). Staff then CANCEL or PROCEED with a required reason;
      every decision (and an early close once the minimum is met) is published as preorder.window.decided with who, when and
      why. A cancelled window (preorder.window.cancelled, orders[] = every order) is refunded in full by orders-service (consumer
      orders-delivery-runs-events), which also consumes delivery-runs.run.cancelled the same way; progress per order comes
      back as orders.preorder.refund_settled / refund_failed.'
  receiveDeliveryRunsOrderEvents:
    action: receive
    channel:
      $ref: '#/channels/ordersOrderEvents'
    summary: 'delivery-runs projects pre-orders (consumer delivery-runs-preorders, inbox-deduplicated on event-id): orders.order.placed
      with shipments[] of fulfilmentType PREORDER (preorder.windowId, preorder.fulfilment, attribution {src, cr, po} on the
      order or the preorder block) becomes a window order numbered <CODE>-1001…; orders.shipment.cancelled cancels that package
      (the order once none is left, with its refund PENDING); orders.preorder.refund_settled (REFUNDED or VOIDED) and orders.preorder.refund_failed
      record the refund progress of a cancelled order; orders.order.cancelled of a placed order cancels it. Late adds (<CODE>-L90…)
      are completed by their order''s placed event. S264: the run follows what happens to its orders'' PREORDER shipments
      (consumer delivery-runs-progress, inbox-deduplicated on event-id, forward only, harmless when repeated or late): orders.shipment.status_changed
      to picked_up (collected from the seller), out_for_delivery, delivery_failed or returned, and orders.shipment.delivered
      (deliveredAt is kept on the order''s slot). The first collection moves the run to COLLECTING (delivery-runs.run.collecting),
      the last one to OUT_FOR_DELIVERY, and when every order is delivered or back the run is COMPLETED. A cancelled shipment
      (orders.shipment.cancelled) leaves the run. The seller payout hold starts in orders-service / payments from the same
      delivered event.'
  publishFulfilmentEvents:
    action: send
    channel:
      $ref: '#/channels/fulfilmentEvents'
    summary: 'fulfilment-service publishes pick/pack progress, route lifecycle, stop outcomes (delivered, failed, skipped,
      reassigned), vehicle defects, SOS alerts (priority HIGH: notifications pages dispatch at once), driver access revocations
      and orders-service calls that could not be applied. Dispatch consoles also get the same updates live over GET /v1/dispatch/stream
      (server-sent events). fulfilment.shipment.handed_over (key shipment id) carries the ship-by date when a seller hands
      a shipment to the driver or the FC loads it out (trust-ops seller health); fulfilment.return_pickup.* (key RMA id) follow
      return pickups scheduled by tax-returns-service. fulfilment.pickup.auto_assigned / dispatch_assigned (S255, key shipment
      id): a seller pickup (AfroTransact Delivery from the seller''s store) joined the nearest available driver''s route,
      or dispatch moved it with a logged reason. fulfilment.run.planned (S264, key = delivery-runs run id): a delivery run''s
      routes were planned.'
  receiveFulfilmentDeliveryRunsEvents:
    action: receive
    channel:
      $ref: '#/channels/deliveryRunsEvents'
    summary: 'fulfilment-service (consumer group fulfilment-service, inbox-deduplicated) plans delivery runs (S264): delivery-runs.run.confirmed
      (a closed pre-order window''s paid orders) fetches GET /v1/service/runs/{id}/dispatch (scope delivery-runs:read) and
      turns the shipments of the run''s orders into routes: one route per capacity chunk (RUN_ROUTE_CAPACITY bags), a pickup
      stop per seller before the drops, doorstep drops ordered by road distance from the hub (geo POST /v1/distance/batch)
      or one drop per order at the community pickup point (each needing the customer''s handover code). The shipments are
      confirmed in orders-service. When delivery-runs cannot be reached the run is kept PENDING with the reason and staff
      plan it from the console. delivery-runs.run.cancelled cancels the routes that have not started. Other run events are
      ignored.'
  receiveFulfilmentOrderEvents:
    action: receive
    channel:
      $ref: '#/channels/ordersOrderEvents'
    summary: 'fulfilment-service (consumer group fulfilment-service, inbox-deduplicated) handles orders.order.placed: a pick
      / pack task per FBA_AFROTRANSACT or RETAIL_1P shipment (node from inventory''s reservation), and an entry in the dispatch
      pool per AFROTRANSACT_DELIVERY shipment (FC load-out or seller pickup), each with one ATS package label. PREORDER shipments
      (door or pickup point, S264) wait for their run instead: they are kept out of the zone builder and the seller-pickup
      screens, and their lines (each with its own sellerOrgId) become one labelled bag per seller. A seller pickup with a
      pickup position (shipments[].pickup, S255) goes to the nearest available driver''s route at once (fulfilment.pickup.auto_assigned);
      otherwise it waits for the zone route builder. orders.shipment.cancelled cancels the task and takes the shipment off
      a route that has not started. Other order events are ignored.'
  receiveFulfilmentIdentityEvents:
    action: receive
    channel:
      $ref: '#/channels/identityEvents'
    summary: 'fulfilment-service (consumer group fulfilment-service, inbox-deduplicated) mirrors driver access: identity.role.revoked
      (platform.driver), identity.permission.revoked (delivery:operate, direct grants) and identity.user.disabled revoke it
      at the event''s time — the driver app is told to sign out and events captured on the device before that time still sync;
      the matching granted / enabled events restore it. Older changes never override newer ones.'
  publishIdentityEvents:
    action: send
    channel:
      $ref: '#/channels/identityEvents'
    summary: identity-service publishes account, verification and access-change events via its transactional outbox.
  consumeIdentitySellerOrgEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerOrgEvents'
    summary: 'identity-service (consumer group identity-service, inbox-deduplicated) mirrors seller organisations with the
      seller org id (org_…) as the organisation id and token org claim. seller.org.approved: organisation APPROVED, applicantUserId
      and ownerUserIds become members with seller.owner / provider.owner (identity.role.granted is published) and get it as
      their active organisation when they have none. seller.org.updated: name, kind, status and market (country) are refreshed.
      S215: kind BOTH is mirrored as an organisation whose members may hold seller.* or provider.* roles (owner role from
      primaryKind); market is stored as content''s market code (ISO 3166-1 alpha-2, UK → GB), other values are not stored.'
  publishIndexerDeadLetters:
    action: send
    channel:
      $ref: '#/channels/indexerDeadLetters'
    summary: Poison events parked so one bad event never blocks a partition.
  consumeIndexerProductEvents:
    action: receive
    channel:
      $ref: '#/channels/catalogProductEvents'
    summary: catalog.product.* upsert the product document (version = occurred-at). Events with sellerHidden = true (catalog.product.hidden,
      and any product event while the owner is hidden) index status SELLER_HIDDEN, which search never returns; catalog.product.restored
      brings back the product's own status. catalog.product.taken_down indexes status TAKEN_DOWN (not returned) and catalog.product.reinstated
      restores it. Each document also carries an embedding of its text (title, brand, category path) from ai-gateway's POST
      /v1/embeddings (purpose search-document, client indexer-service, scope ai:use) for hybrid search (S036); an embedding
      failure never blocks the event, and a backfill embeds LIVE documents without one.
  consumeIndexerOffersEvents:
    action: receive
    channel:
      $ref: '#/channels/offersEvents'
    summary: offers.buybox.changed sets the variant's sellable quantity to the winner's availableQty (0 when winnerOfferId
      is null), stored as variant entry "<atin>|BUYBOX" (version = decidedAt). When present it replaces the per-node inventory
      entries for that variant, so stock held under a retail SKU or FBA FNSKU reaches search the same way it reaches the PDP
      (S281).
  consumeIndexerSellerOrgEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerOrgEvents'
    summary: 'seller.org.approved / updated: the seller display name (else legal name) is applied to seller_name on every
      document of the organisation and used for documents indexed afterwards. The in-memory seller directory is warmed on
      start from seller-service''s GET /v1/orgs/directory (client indexer-service, scope sellers:directory) before events
      are consumed, refreshed every 30 minutes, and an unknown organisation is looked up once via GET /v1/orgs/{id}/public,
      so restarts never change indexed seller names (S213).'
  publishInventoryStockEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryStockEvents'
    summary: inventory-service publishes availability (available = on hand − reserved) and lot lifecycle events via its transactional
      outbox. Search indexer, storefront, cart, promise, Lola and finance (GL postings) consume them.
  publishInventoryReservationEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryReservationEvents'
    summary: Reservation lifecycle for the orders saga and finance (COGS on committed / group_committed). Lines carry the
      caller's group (orders' line id) and the stock owner; group events cover one shipment's lines.
  publishInventoryReconciliationEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryReconciliationEvents'
    summary: Raised when positions differ from the ledger or lots; alerts the inventory channel.
  publishInventoryInboundEvents:
    action: send
    channel:
      $ref: '#/channels/inventoryInboundEvents'
    summary: Inbound lifecycle via the transactional outbox. inventory.inbound.received (one per FC receipt) lets offers-service
      switch the seller's listing to Fulfilled by AfroTransact; closed carries the discrepancies (SHORT, OVER, DAMAGED, UNEXPECTED)
      for Seller Center and the FC team.
  consumeInventoryRetailShipmentEvents:
    action: receive
    channel:
      $ref: '#/channels/retailEvents'
    summary: 'S226: retail.shipment.stage-changed (consumer inventory-retail-shipments, inbox-deduplicated). From DEPARTED
      (or a later in-transit stage when the notice does not exist yet) the ASN lines become a RETAIL_ASN inbound shipment
      and its units are inbound at nodeId ("Coming soon"); goods receipts posted with inboundRef = the shipment reference
      consume exactly those units; RECEIVED closes the notice so units that never arrived stop counting as inbound. Other
      retail events are ignored.'
  consumeInventoryOffersEvents:
    action: receive
    channel:
      $ref: '#/channels/offersEvents'
    summary: 'S067: offers.offer.created|updated|withdrawn (consumer inventory-offers, inbox-deduplicated) keep a projection
      of Fulfilled-by-AfroTransact offers by (sellerOrgId, inventorySku); FBA stock without a live one is reported stranded
      in GET /v1/fba/inventory. Buy box and coupon events are ignored.'
  publishMcpToolEvents:
    action: send
    channel:
      $ref: '#/channels/mcpToolEvents'
    summary: mcp-server publishes one event per tool call, allowed or refused. trust-ops keeps it in the audit log.
  consumeNotificationsIdentityEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsIdentityEvents'
    summary: 'identity.verification.requested → identity.verification (email, or the payload''s channel; security, never resolved
      through identity), identity.verification.phone for purpose PHONE_VERIFICATION (sms), or identity.password_reset for
      purpose PASSWORD_RESET (the payload''s channel: email, or sms to a verified phone); identity.password-reset.federated
      → identity.password_reset.federated (email: sign in with the linked provider); identity.password.changed → identity.password_changed
      (email); identity.invitation.created → org.invitation (email to recipient.email only, never resolved through identity:
      the invitee may have no account); identity.user.registered → account.welcome (email; not for STAFF); identity.user.phone-verified
      and identity.notification-preferences.updated send nothing and drop the user''s cached contact lookup.'
  consumeNotificationsOrderEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsOrderEvents'
    summary: orders.order.placed → order.confirmed (email, sms, push); orders.order.cancelled with wasPlaced=true → order.cancelled
      (email, push); orders.shipment.status_changed → shipment.shipped (picked_up, or in_transit without a pickup scan; email,
      push), shipment.out_for_delivery (sms, push, email), shipment.ready_for_pickup (ready + PICKUP; email, sms, push), shipment.delivery_failed
      (email, sms, push); orders.shipment.delivered → shipment.delivered (email, push); orders.shipment.cancelled → shipment.cancelled
      (email, push).
  consumeNotificationsSellerApplicationEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsSellerApplicationEvents'
    summary: seller.application.submitted → seller.application.submitted (email); info_requested → seller.application.info_requested
      (email, sms); approved → seller.application.approved (email, sms, push); rejected → seller.application.rejected (email).
  consumeNotificationsSellerComplianceEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsSellerComplianceEvents'
    summary: 'seller.compliance.reminder → seller.compliance.reminder and seller.compliance.changed (new items, or status
      moved to RESTRICTED_SOON / RESTRICTED) → seller.compliance.action_needed, on the payload''s channels (in_app → push;
      reminder category: preferences and quiet hours apply); seller.payouts.paused / resumed and seller.listings.hidden /
      restored → matching templates (email, plus sms when paused / hidden); with reason SUSPENDED / REINSTATED (Trust and
      Safety) → seller.payouts.paused.suspended, seller.listings.hidden.suspended, seller.payouts.resumed.reinstated, seller.listings.restored.reinstated
      (suspension wording, email only: trustops.seller.suspended carries the sms).'
  consumeNotificationsPayoutEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsPayoutEvents'
    summary: payments.payout.paid → payout.paid (email, push); payments.payout.failed → payout.failed (email, sms).
  consumeNotificationsBookingsEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsBookingsEvents'
    summary: 'booking.confirmed / cancelled / rescheduled → matching templates (email, sms, push); booking.declined → booking.declined
      (email, push); booking.balance_unpaid → booking.balance_unpaid to the customer (email, push: update the card or authenticate).
      booking.reminder has a template but no event yet: bookings can send it with notification.requested (templateKey booking.reminder).'
  consumeNotificationsCatalogImportEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsCatalogImportEvents'
    summary: 'catalog.import.completed with notifySeller=true (large uploads) → catalog.import_completed to the uploader (email,
      push): created, updated and failed counts and a link to the upload''s report.'
  consumeNotificationsContentEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsContentEvents'
    summary: content.career-application.received → careers.application_received (email); content.newsletter.confirmation_requested
      → newsletter.confirm (email).
  consumeNotificationsPaymentEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsPaymentEvents'
    summary: payments.intent.action_required with a customerId → payment.authentication_required to the customer (email, push;
      link to the booking for BK- references, else the orders page). Other payment events are ignored.
  consumeNotificationsTrustOpsEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsTrustOpsEvents'
    summary: trustops.claim.opened → claim.opened to the customer (email, push) and, while AWAITING_SELLER, claim.seller_response_due
      to the seller owners (email, sms; deadline = dueAt); trustops.claim.decided → claim.decided to the customer (email,
      push) and claim.decided.seller to the seller owners (email); trustops.claim.withdrawn → claim.withdrawn to the seller
      owners (email); trustops.claim.response_due_soon → claim.seller_response_reminder (email, sms) and trustops.claim.response_lapsed
      → claim.seller_response_lapsed (email) to the seller owners; trustops.moderation.decided with status REJECTED → listing.rejected
      (NEW_LISTING; email) or listing.taken_down (LIVE_LISTING; email, sms) to the seller owners; trustops.seller.suspended
      → seller.suspended (email, sms) and trustops.seller.reinstated → seller.reinstated (email) to the seller owners. notification.requested
      with templateKey claim.opened, claim.decided or claim.withdrawn is ignored (the typed claim events above cover both
      parties).
  consumeNotificationsInventoryEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsInventoryEvents'
    summary: inventory.availability.changed with available > 0 claims every active stock alert for the SKU (= variant ATIN)
      and sends stock.back_in_stock (email, push) once; redeliveries re-claim the same alerts and the inbox stops a second
      send.
  consumeNotificationsRetailEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationsRetailEvents'
    summary: 'notification.requested with templateKey retail.purchase_order.sent → the supplier PO email (email, to recipient.email
      only; transactional). Fields: contactName, poNumber, supplierName, orderDate, deliverBy, incoterm, paymentTerms, total
      (else totalMinor + currency), documentUrl, documentExpiresAt; nulls render as empty and the optional rows are dropped.
      data.attachments (the PO PDF as a media asset reference) is fetched from an allow-listed host within the size limit
      and attached by Resend, SendGrid, SES and SMTP; otherwise the email links to documentUrl. Other retail events are ignored:
      retail.po.dispatch-failed carries no buyer to notify, and retail.po.sent would duplicate the request.'
  publishOffersEvents:
    action: send
    channel:
      $ref: '#/channels/offersEvents'
    summary: 'offers.offer.*: search indexer (offer count, price range), cart (price changes on saved lines), seller center.
      offers.buybox.changed: indexer and storefront caches refresh the card price / seller / fulfilment badge; published when
      the winner, its price, the listed offer count or the lowest landed price changes (winner null = currently unavailable).
      offers.coupon.redeemed / released: payments-service books PLATFORM-funded discounts as marketing expense and deducts
      SELLER-funded ones (per-line allocation) from that seller''s payout.'
  consumeOffersCatalogProductEvents:
    action: receive
    channel:
      $ref: '#/channels/catalogProductEvents'
    summary: 'offers-service (consumer group offers-service, inbox-deduplicated) handles catalog.product.created by creating
      the creating seller''s NEW offer per variant (price, quantity and SKU from the event; AfroTransact Retail products get
      Fulfilled by AfroTransact offers), not live until approved. approved / resumed make every offer on the page live; rejected
      / paused take them off sale. taken_down (Trust and Safety) suppresses every offer on the page: none can win the buy
      box or appear in public reads; reinstated restores them when the listing''s status is LIVE again (a listing reinstated
      as PAUSED stays off sale). The buy box of every affected ATIN is recomputed.'
  consumeOffersInventoryStockEvents:
    action: receive
    channel:
      $ref: '#/channels/inventoryStockEvents'
    summary: inventory.availability.changed keeps the availability projection (sku, nodeId) used for Fulfilled by AfroTransact
      offers (matched on ownerOrg = seller org and sku = the offer's inventory SKU). Events whose version is not newer than
      the stored one are ignored. Lot events are ignored. Affected buy boxes are recomputed.
  consumeOffersInventoryInboundEvents:
    action: receive
    channel:
      $ref: '#/channels/inventoryInboundEvents'
    summary: 'S257: inventory.inbound.received with source FBA switches the seller''s listing to Fulfilled by AfroTransact.
      For every received line with good units and no open Fulfilled-by-AfroTransact offer of the seller on the variant, an
      AFROTRANSACT offer is created from the seller''s own-store offer (price, list price, currency, condition and seller
      SKU; no shipping charge; inventory SKU = the received SKU) and the buy box is recomputed. The own-store offer stays
      open (one offer per channel). Lines without any offer of the seller stay stranded. Other inbound events are ignored;
      inbox-deduplicated (consumer offers-inventory-inbound).'
  consumeOffersRetailEvents:
    action: receive
    channel:
      $ref: '#/channels/retailEvents'
    summary: 'S281: AfroTransact Retail''s "list on storefront". retail.item.listing-changed (and retail.item.updated for
      a new ATIN link) with a linked atin drive the open first-party (AfroTransact Retail, Fulfilled by AfroTransact) offer
      of that variant: LIVE sets the offer''s inventory SKU to the retail item SKU (the SKU retail goods receipts stock lots
      under), takes the item''s retail price when the currency matches and resumes a paused offer; PAUSED pauses an active
      offer; DRAFT and unlinked items change nothing. offers.offer.updated is published and the buy box recomputed. Other
      retail events are ignored; inbox-deduplicated (consumer offers-retail).'
  consumeOffersSellerComplianceEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerComplianceEvents'
    summary: seller.listings.hidden suppresses every offer of the organisation (not listed, cannot win the buy box); seller.listings.restored
      restores them. Buy boxes of the organisation's ATINs are recomputed.
  consumeOffersSellerOrgEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerOrgEvents'
    summary: seller.org.approved / updated → the seller display name shown as "Sold by" on offers.
  publishOrdersOrderEvents:
    action: send
    channel:
      $ref: '#/channels/ordersOrderEvents'
    summary: 'orders-service publishes order placement / cancellation and every applied shipment transition. Notifications
      map them to templates (order confirmation, shipped, out for delivery, delivered, cancelled), payments and finance follow
      deliveries and cancellations, the indexer keeps sales stats, tax-returns reads delivered lines for RMAs. Pre-orders
      (S270–S275): an orders.order.placed with a PREORDER shipment sends preorder.confirmed ("You''re in"); orders.preorder.delivery_missed
      sends preorder.delivery_missed (refund / new date links). S272 pre-orders: orders.order.placed carries the attribution
      {src, cr, po}, channel, tags and per shipment the pre-order window and fulfilment (delivery-runs projects window orders
      from it); a scheduler publishes orders.preorder.delivery_missed when a PREORDER shipment passes its delivery date undelivered
      (notifications sends preorder.delivery_missed with refund / new-date links) and the customer''s answer as orders.preorder.missed_delivery_answered;
      late adds paid by link publish orders.preorder.payment_link_created (notifications texts preorder.late_order.payment_link).
      orders also routes payments.intent.* of late adds (no saga) to place or void them.'
  receiveOrdersDeliveryRunsEvents:
    action: receive
    channel:
      $ref: '#/channels/deliveryRunsEvents'
    summary: 'ADR 0005 §1 (consumer orders-delivery-runs-events): preorder.window.cancelled cancels every placed PREORDER
      shipment of the window, and delivery-runs.run.cancelled the PREORDER shipments of the orders[] it lists, through the
      same cancellation path a customer''s own cancellation uses (orders.shipment.cancelled, then the CANCEL follow-up: a
      captured payment is refunded in full with the delivery fee, an uncaptured authorisation is released, stock held for
      the lines is released). Idempotent per shipment, so redeliveries and the window event followed by its run''s event do
      no harm. A package that can no longer be cancelled (already on its way) publishes orders.preorder.refund_failed.'
  receiveOrdersPaymentEvents:
    action: receive
    channel:
      $ref: '#/channels/paymentsPaymentEvents'
    summary: orders consumes payments.intent.succeeded / failed / canceled (inbox-deduplicated) and signals the checkout saga
      waiting for the authorisation.
  receiveOrdersCarrierEvents:
    action: receive
    channel:
      $ref: '#/channels/carrierShipmentEvents'
    summary: 'orders consumes carrier.tracking.updated (inbox-deduplicated, idempotent per carrier event id) and applies the
      transit steps to carrier shipments; scans older than the last applied one are ignored. carrier.pickup.ready (S219, same
      topic, inbox-deduplicated): orderRef names the order (id or number) or one shipment; the order''s pickup shipments (delivery
      method PICKUP, matching pickup location when both are set, customerRef equal to the order''s customer) that are confirmed
      or packed move to ready with actor PICKUP_POINT and source carrier (which also triggers the pickup capture); shipments
      already ready or further along are left as they are. Every transition is published as orders.shipment.status_changed
      and pushed to GET /v1/shipments/stream on every replica through Valkey pub/sub (channel at:orders:shipment-status).'
  consumePaymentsSellerComplianceEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerComplianceEvents'
    summary: 'payments-service (consumer group payments-service, inbox-deduplicated) handles seller.payouts.paused / resumed:
      the organisation''s payout_hold is set or cleared (older decisions never override newer ones). While paused, POST /v1/payouts/requests
      and approvals fail with 422 payments.payouts_paused; balances keep accruing.'
  consumePaymentsSellerSubscriptionEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerSubscriptionEvents'
    summary: payments-service (consumer group payments-service, listener payments-seller-subscription, inbox consumer payments.seller-subscription)
      keeps each organisation's current plan from seller.subscription.changed (planCode, status; a CANCELED or PENDING_ACTIVATION
      subscription has no plan; older events never override newer ones). The plan selects the fee schedule's plan rates for
      product commission and service connection fees, snapshotted on each payment line. Until an organisation's first event,
      payments reads its plan once from the seller service's GET /v1/orgs/{orgId}/billing (client payments-service, scope
      seller:billing). Every other event is ignored.
  consumePaymentsBookingsEvents:
    action: receive
    channel:
      $ref: '#/channels/bookingsEvents'
    summary: 'payments-service (consumer group payments-service, listener payments-bookings-events, inbox consumer payments.bookings-events)
      handles booking.cancelled with cancelledBy = PROVIDER and providerFeeMinor > 0: the late provider-cancellation fee is
      recorded once per booking (inbox on event-id plus a unique booking id), accrued in the ledger (Dr 1200:<org> / Cr 4300)
      and debited from the provider''s Stripe connected account with an account debit (Dr 1000 / Cr 1200:<org>). Fees that
      cannot be debited yet stay OUTSTANDING, are retried after settlement transfers and are reserved out of the payout balance.
      Every other booking event is ignored.'
  consumePaymentsCarrierShipmentEvents:
    action: receive
    channel:
      $ref: '#/channels/carrierShipmentEvents'
    summary: 'payments-service (consumer group payments-service, listener payments-carrier-shipment-events, inbox consumer
      payments.carrier-shipment-events) handles carrier.label.purchased and carrier.label.voided (S256). A label with billTo
      SELLER, fulfilment SELLER_SHIPPED and kind outbound is charged to its organisation once per label (inbox on event-id
      plus a unique label id): Dr 2000:<org> amountMinor / Cr 2400 carrier labels payable costMinor, Cr 4500 label handling
      revenue handlingMinor, even when that takes the payable below zero. A void credits the charge back once with the reverse
      journal; a void that arrives first is remembered so the late purchase charges nothing. AfroTransact Retail (RETAIL_ORG_ID)
      and FBA / AFROTRANSACT_DELIVERY labels are never charged, whatever billTo says. Outstanding charges reserve the payout
      balance and are recovered from the organisation''s next Connect transfer. Tracking and pickup events are ignored.'
  consumePaymentsRetailEvents:
    action: receive
    channel:
      $ref: '#/channels/retailEvents'
    summary: 'payments-service (consumer group payments-service, listener payments-retail-events, inbox consumer payments.retail-events)
      handles retail.payment.released (S226): AfroTransact Retail (merchant of record) owes the supplier the released invoices,
      so payments books Dr 1400 Retail purchases released / Cr 2500:<supplierId> once per purchase order (inbox on event-id
      plus a unique PO id) and schedules the supplier payment for dueOn (when sent) or the release date plus SUPPLIER_PAYMENT_TERMS_DAYS
      (30). Finance pays it from the operating bank account (POST /v1/supplier-payments/{id}/paid: Dr 2500:<supplierId> /
      Cr 1050). Supplier money never touches a seller payable, a Connect transfer or Retail''s payout balance. Every other
      retail event is ignored.'
  publishPaymentsPaymentEvents:
    action: send
    channel:
      $ref: '#/channels/paymentsPaymentEvents'
    summary: payments-service publishes via its transactional outbox. The orders saga confirms on intent.succeeded and compensates
      on intent.failed; notifications tells sellers about chargebacks; finance reporting reads captures. Off-session follow-up
      charges of an order (long-dated bookings) publish intent events with the same key and parentPaymentId set; payments.intent.action_required
      asks notifications to bring the customer back to confirm the charge (3-D Secure / SCA).
  publishPaymentsPayoutEvents:
    action: send
    channel:
      $ref: '#/channels/paymentsPayoutEvents'
    summary: Seller / provider payouts and provider fees for the portals, notifications and Finance; AfroTransact Retail supplier
      payments (scheduled, paid, held / released) for retail-service and Finance.
  publishRetailEvents:
    action: send
    channel:
      $ref: '#/channels/retailEvents'
    summary: 'retail-service publishes product-master, supplier, PO, shipment/ASN, goods-receipt, landed-cost, GL journal
      and three-way-match events. Finance consumes retail.gl.journal.posted; payments-service pays suppliers on retail.payment.released;
      the buyer''s work queue listens to retail.match.exception (assignee = PO buyer); catalog/inventory/search use the item
      and receipt events. Sending a PO (S225) is delivered by a job: notification.requested (templateKey retail.purchase_order.sent,
      channel email, recipient = the supplier contact''s address, data.documentUrl = signed media link to the PO PDF, data.attachments
      = media asset reference) for notifications-service, and the X12 850 through the EDI transport for EDI-enabled suppliers;
      each channel ends in retail.po.dispatched or retail.po.dispatch-failed (key = PO id).'
  consumeRetailInventoryReservationEvents:
    action: receive
    channel:
      $ref: '#/channels/inventoryReservationEvents'
    summary: 'retail-service (consumer group retail-service, inbox-deduplicated) handles inventory.reservation.committed:
      shipped units of 1P SKUs are costed at their lots'' landed cost and posted as COGS (Dr 5000 / Cr 1300, retail.gl.journal.posted
      with source COGS). Other reservation events are ignored.'
  publishSearchEvents:
    action: send
    channel:
      $ref: '#/channels/searchEvents'
    summary: 'Search analytics: data platform and personalisation consume them; search itself keeps daily per-query aggregates
      (searches, zero results, clicks) in Elasticsearch for the staff console.'
  publishAdsEvents:
    action: send
    channel:
      $ref: '#/channels/adsEvents'
    summary: content-service counts impressions, charges clicks against campaign budgets (pausing at zero) and attributes
      orders (7-day click). ads.click.recorded is only published for a valid, unexpired, first use of an ad token.
  publishSellerApplicationEvents:
    action: send
    channel:
      $ref: '#/channels/sellerApplicationEvents'
    summary: seller-service publishes application lifecycle events via its transactional outbox. notifications-service tells
      the applicant (submitted, info requested with the requested items, approved, rejected); staff-console badges count flagged
      applications.
  publishSellerOrgEvents:
    action: send
    channel:
      $ref: '#/channels/sellerOrgEvents'
    summary: 'seller.org.approved: identity-service (consumer group identity-service, inbox-deduplicated) mirrors the organisation
      with the seller org id (org_…) as its id and grants applicantUserId and ownerUserIds the seller.owner / provider.owner
      role, so the next token carries the org claim (unlocking Seller Center / Provider Hub). seller.org.updated: indexer
      refreshes the seller display name on indexed documents (and its directory, which it warms on start from GET /v1/orgs/directory,
      scope sellers:directory), cart refreshes it; identity mirrors name, status and market. Also published when Trust and
      Safety suspends (status SUSPENDED) or reinstates (status back to APPROVED) an organisation. seller.pickup_location.updated
      (S255): an AfroTransact Delivery pickup location was enabled, moved, disabled or deleted; offers and fulfilment may
      follow it (checkout re-reads the location from GET /v1/ship-from-locations/{id} anyway).'
  receiveSellerIdentityRoleEvents:
    action: receive
    channel:
      $ref: '#/channels/identityEvents'
    summary: 'S236: seller-service (consumer group seller-service, inbox-deduplicated) keeps its org_member list consistent
      with identity, the source of truth for organisation members. identity.role.granted with orgId adds the member or changes
      its role (unless the stored row is newer); identity.role.revoked with orgId removes the member while it still holds
      that role. Organisations seller does not know and roles without orgId are ignored.'
  publishSellerComplianceEvents:
    action: send
    channel:
      $ref: '#/channels/sellerComplianceEvents'
    summary: 'seller.compliance.changed / reminder: notifications-service sends email + SMS + in-app banner (consent and quiet
      hours respected). seller.payouts.paused / resumed: payments-service holds or releases payouts (payout requests and approvals
      fail with 422 payments.payouts_paused while held). seller.listings.hidden / restored: catalog suppresses the org''s
      products from public reads and republishes them as catalog.product.hidden / restored (the indexer follows those), offers
      and bookings hide or show the org''s listings and services. Trust and Safety suspension (POST /v1/orgs/{orgId}/suspend,
      sellers:enforce) is a separate hold: it publishes seller.listings.hidden and seller.payouts.paused with reason SUSPENDED;
      reinstatement publishes seller.payouts.resumed / seller.listings.restored with reason REINSTATED only when no Stripe
      compliance hold still requires them, and compliance releases (CLEARED, MANUAL) are held back while the organisation
      is suspended. Consumers keep treating these as one latest-wins hold per organisation.'
  publishSellerSubscriptionEvents:
    action: send
    channel:
      $ref: '#/channels/sellerSubscriptionEvents'
    summary: 'Plan changes, trials, dunning and staff migrations to a new plan version (change MIGRATED); identity / feature
      limits and finance consume them. seller.billing.grant_applied (S296-S297): a reward rule or a staff adjustment (credit,
      free days, discount, waived invoice, trial change) was applied at Stripe; notifications-service emails the organisation''s
      owners (seller.billing.reward_earned / seller.billing.credit_granted).'
  receiveSellerRewardMetrics:
    action: receive
    channel:
      $ref: '#/channels/ordersOrderEvents'
    summary: 'S296: seller-service (consumer group seller-service, inbox consumer seller.reward-metrics) counts orders.shipment.delivered
      per sellerOrgId (gross sales in USD cents, completed orders) for reward rules, then evaluates the organisation''s live
      rules on those metrics.'
  receiveSellerRewardBookings:
    action: receive
    channel:
      $ref: '#/channels/bookingsEvents'
    summary: S296 reward rules count booking.completed per orgId (completed bookings, providers).
  receiveSellerRewardListings:
    action: receive
    channel:
      $ref: '#/channels/offersEvents'
    summary: 'S296 reward rules track offers.offer.created / updated / withdrawn per sellerOrgId: a listing is active while
      the offer is ACTIVE and its product live.'
  publishTaxReturnsEvents:
    action: send
    channel:
      $ref: '#/channels/taxReturnsEvents'
    summary: 'tax-returns publishes every RMA transition (notifications: return started, label / QR, refund on its way; seller
      center queues; trust-ops follows rejected and failed-after-refund inspections), refunds it orchestrated through payments-service,
      and tax ledger entries (finance and seller statements).'
  receiveTaxReturnsOrderEvents:
    action: receive
    channel:
      $ref: '#/channels/ordersOrderEvents'
    summary: tax-returns (consumer group tax-returns-service, inbox-deduplicated) keeps a snapshot of orders.order.placed
      (lines, sellers, fulfilment, ship-to) and books one SALE tax entry per line; orders.shipment.delivered starts the return
      window of the shipment.
  receiveTaxReturnsPaymentEvents:
    action: receive
    channel:
      $ref: '#/channels/paymentsPaymentEvents'
    summary: tax-returns consumes payments.refunded (inbox-deduplicated) and books the tax reversal of every refunded line,
      keyed by the payments refund id (FAILED refunds void it), so cancellations and staff refunds made elsewhere also reduce
      the monthly liability.
  receiveTaxReturnsCarrierEvents:
    action: receive
    channel:
      $ref: '#/channels/carrierShipmentEvents'
    summary: 'tax-returns consumes carrier.tracking.updated for return labels (matched by carrier + tracking number or reference
      = RMA number): picked_up / in_transit / out_for_delivery → in transit (refund at first scan where policy allows), delivered
      → received.'
  publishTrustOpsEvents:
    action: send
    channel:
      $ref: '#/channels/trustOpsEvents'
    summary: trust-ops-service publishes moderation, claim, seller-enforcement, seller-health, support-case and audit events
      via its transactional outbox. Claim notifications come from the typed trustops.claim.* events (they carry sellerOrgId
      and customerId); trust-ops no longer publishes notification.requested. The SLA sweep publishes trustops.claim.response_due_soon
      once per claim, 24 h (TRUSTOPS_SLA_SELLER_RESPONSE_REMINDER) before the seller's deadline, and trustops.claim.response_lapsed
      when the window passes without an answer.
  consumeTrustOpsCatalogProductEvents:
    action: receive
    channel:
      $ref: '#/channels/catalogProductEvents'
    summary: 'Consumer group trust-ops-service-moderation (inbox consumer trust-ops:catalog-products): catalog.product.created
      with status IN_REVIEW is queued for moderation as a NEW_LISTING item (AI triage hint attached when ai-gateway answers;
      fail-open); catalog.product.flagged (a shopper report, staff flag or automated flag on a live listing) is queued as
      a LIVE_LISTING item, or counted on the product''s open item (a HIGH-risk automated flag raises its priority). Removing
      a LIVE_LISTING item takes the listing down in catalog (POST /v1/products/{id}/takedown); allowing it keeps the listing
      live. catalog.product.approved / rejected / taken_down close an item decided directly in catalog.'
  consumeTrustOpsBookingReviewEvents:
    action: receive
    channel:
      $ref: '#/channels/bookingsEvents'
    summary: 'Consumer group trust-ops-service-reviews (inbox consumer trust-ops:booking-reviews; other bookings events are
      ignored): booking.review.submitted with status PENDING is queued for moderation as a SERVICE_REVIEW item (one open item
      per review, listing SLA, AI triage hint with subjectType REVIEW when ai-gateway answers; fail-open). Allowing it publishes
      the review (POST /v1/reviews/{bookingId}/approve), removing it rejects the review with a review reason code (POST /v1/reviews/{bookingId}/reject),
      both with the trust-ops-service token (scope bookings:reviews:moderate). booking.review.approved / rejected close an
      item decided directly in bookings (and are no-ops for decisions made in trust-ops).'
  consumeTrustOpsOrderEvents:
    action: receive
    channel:
      $ref: '#/channels/ordersOrderEvents'
    summary: 'Consumer group trust-ops-service-seller-health: orders.order.placed (shipments, promisedBy, shipBy), orders.shipment.delivered,
      orders.shipment.cancelled and orders.shipment.status_changed feed the per-shipment projection behind seller health (late
      shipment, seller cancellation and order defect rates). A status change to picked_up records the seller''s handover when
      fulfilment does not report one.'
  consumeTrustOpsFulfilmentEvents:
    action: receive
    channel:
      $ref: '#/channels/fulfilmentEvents'
    summary: 'Consumer group trust-ops-service-fulfilment (inbox consumer trust-ops:fulfilment): fulfilment.shipment.handed_over
      with origin SELLER records when the shipment left the seller and its shipBy date. Seller health counts a shipment late
      when it was handed over after its ship-by date (SELLER_HEALTH_ZONE, default America/Chicago); shipments without a ship-by
      date fall back to delivered after promisedBy. FC-origin handovers and other fulfilment events are ignored.'
  consumeTrustOpsAiHandoffEvents:
    action: receive
    channel:
      $ref: '#/channels/aiHandoffEvents'
    summary: 'Consumer group trust-ops-service-support: every ai.handoff.requested opens one support case (deduplicated by
      handoffId) with a first-response SLA.'
  consumeTrustOpsAuditIdentityEvents:
    action: receive
    channel:
      $ref: '#/channels/identityEvents'
    summary: 'Audit log (consumer group trust-ops-service-audit, topics configurable with TRUSTOPS_AUDIT_TOPICS): identity.role.granted|revoked,
      identity.permission.granted|revoked, identity.user.disabled|enabled.'
  consumeTrustOpsAuditSellerApplicationEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerApplicationEvents'
    summary: 'Audit log: seller.application.flagged|info_requested|approved|rejected (reviewer decisions).'
  consumeTrustOpsAuditSellerComplianceEvents:
    action: receive
    channel:
      $ref: '#/channels/sellerComplianceEvents'
    summary: 'Audit log: seller.payouts.paused|resumed, seller.listings.hidden|restored.'
  consumeTrustOpsAuditPayoutEvents:
    action: receive
    channel:
      $ref: '#/channels/paymentsPayoutEvents'
    summary: 'Audit log: payments.payout.requested|approved|paid|failed.'
  consumeTrustOpsAuditMcpToolEvents:
    action: receive
    channel:
      $ref: '#/channels/mcpToolEvents'
    summary: 'Audit log: every mcp.tool.invoked (actor = token subject, entity = tool).'
  consumeTrustOpsAuditOrderEvents:
    action: receive
    channel:
      $ref: '#/channels/ordersOrderEvents'
    summary: 'Audit log: orders.shipment.status_changed and orders.shipment.cancelled only when actorType is PLATFORM_ADMIN
      or FULFILMENT_OPS (staff status overrides).'
servers:
  cloud:
    description: Confluent Cloud (same on AWS, GCP and Azure)
    host: pkc-xxxxx.confluent.cloud:9092
    protocol: kafka-secure
  local:
    host: localhost:9092
    protocol: kafka
