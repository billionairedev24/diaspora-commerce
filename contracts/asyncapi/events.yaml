      name: identity.user.registered
      title: Account created (sign-up form, social sign-in or staff provisioning)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityUserRegistered'
    identityUserEmailVerified:
      name: identity.user.email-verified
      title: Email confirmed with the 6-digit code
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityUserEmailVerified'
    identityVerificationRequested:
      name: identity.verification.requested
      title: Deliver a one-time code (email verification, SMS sign-in code, SMS enrolment, phone verification, password reset)
      description: 'Contains the plain one-time code so notifications-service can render template identity.verification on
        the payload channel (email or sms; phone verification, S234, is purpose PHONE_VERIFICATION with channel sms and recipient.phone).
        Password reset (S300) is purpose PASSWORD_RESET: one code, published once per channel (email, and sms when the account
        has a verified phone), rendered with identity.password_reset. Security message: always sent, quiet hours do not apply.
        Never log the payload.'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityVerificationRequested'
    identityRoleGranted:
      name: identity.role.granted
      title: Role added to a user (sign-up intent, start selling, admin, org membership, accepted invitation)
      description: For organisation roles orgId is set. An organisation role change publishes identity.role.revoked for the
        old role followed by identity.role.granted for the new one.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityRoleChanged'
    identityRoleRevoked:
      name: identity.role.revoked
      title: Role removed from a user (or member removed from an organisation); effective on the next token (≤ 5 minutes)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityRoleChanged'
    identityPermissionGranted:
      name: identity.permission.granted
      title: Permission granted directly to a user, or added to a role
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityPermissionChanged'
    identityPermissionRevoked:
      name: identity.permission.revoked
      title: Direct grant revoked, or permission removed from a role; effective on the next token
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityPermissionChanged'
    identityUserDisabled:
      name: identity.user.disabled
      title: Account disabled; every session and refresh token was revoked
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityUserStatusChanged'
    identityUserEnabled:
      name: identity.user.enabled
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityUserStatusChanged'
    identitySignInLocked:
      name: identity.sign-in.locked
      title: Too many failed sign-in attempts locked an account or a client IP address
      description: 'Brute-force protection (hosted pages and the first-party BFF API): 5 failures per account or 30 per IP
        within 15 minutes lock the key for 15 minutes, doubling for consecutive lockouts up to 4 hours. Key = user id (scope
        ACCOUNT) or ip:<address> (scope IP). Lockouts of emails without an account are not published. notifications-service
        may send a security notice; trust-ops may alert on IP lockouts.'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentitySignInLocked'
    identityDeviceRegistered:
      name: identity.device.registered
      title: A push token was registered for an account (customer or driver app, web push)
      description: The token itself is not published; read it with GET /v1/internal/users/{id}/contact (users:read).
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityDeviceChanged'
    identityDeviceUnregistered:
      name: identity.device.unregistered
      title: A push token was removed from an account (sign-out, removal, or moved to another account)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityDeviceChanged'
    identityNotificationPreferencesUpdated:
      name: identity.notification-preferences.updated
      title: Account-level notification channel switches or marketing opt-in changed
      description: Consumers caching contact lookups (notifications-service) should drop the user's entry.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityNotificationPreferencesUpdated'
    identityUserPhoneVerified:
      name: identity.user.phone-verified
      title: The account's phone number was confirmed with an SMS code (S234)
      description: GET /v1/internal/users/{id}/contact now returns phoneVerified true for this number. Changing the phone
        resets it (no event); consumers caching contact lookups should drop the user's entry.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityUserPhoneVerified'
    identityInvitationCreated:
      name: identity.invitation.created
      title: Someone was invited to join a seller or provider organisation (S231)
      description: 'Key = organisation id. Contains the plain single-use token (valid 7 days) and the Seller Center acceptUrl
        so notifications-service can email recipient.email (template e.g. org.invitation). Security-style message: the recipient
        usually has no account yet, so resolve nothing through identity. Inviting the same email again revokes the previous
        invitation (identity.invitation.revoked) and publishes a new one. Never log the payload.'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityInvitationCreated'
    identityInvitationRevoked:
      name: identity.invitation.revoked
      title: An open invitation was withdrawn or replaced by a new one (key = organisation id)
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityInvitationRevoked'
    identityPasswordResetFederated:
      name: identity.password-reset.federated
      title: A password reset was asked for an account that only signs in with Google, Apple or Facebook (S300)
      description: 'The account has no password, so no code is sent: notifications-service emails recipient.email (template
        identity.password_reset.federated) to sign in with the linked provider instead. Security message, never resolved through
        identity. The requester gets the same answer as for any email (no account enumeration).'
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityPasswordResetFederated'
    identityPasswordChanged:
      name: identity.password.changed
      title: The account's password was reset with a code (S300)
      description: Every session and refresh token of the account was revoked (signed out everywhere) and trusted browsers
        were forgotten, so two-step verification is asked again where it applies. notifications-service emails recipient.email
        (template identity.password_changed). Security message, never resolved through identity.
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/IdentityPasswordChanged'
