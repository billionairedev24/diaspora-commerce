# AsyncAPI 3.0 fragment for identity-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
# All identity events are written to the transactional outbox and relayed to one topic, at.identity.events.
channels:
  identityEvents:
    address: at.identity.events
    description: >-
      Accounts, one-time codes, phone verification, access changes, organisation invitations, sign-in lockouts, push
      devices and notification preferences from identity-service. Key = user id (role key for role-permission changes,
      ip:<address> for IP lockouts, organisation id for identity.invitation.created / revoked). Headers event-id,
      event-type, occurred-at. Consumers: notifications-service (identity.verification.requested,
      identity.invitation.created), seller-service (organisation role changes, identity.role.granted / revoked with
      orgId), audit/trust-ops (access changes), BFF caches (role and permission changes).
    messages:
      identityUserRegistered: {$ref: '#/components/messages/identityUserRegistered'}
      identityUserEmailVerified: {$ref: '#/components/messages/identityUserEmailVerified'}
      identityVerificationRequested: {$ref: '#/components/messages/identityVerificationRequested'}
      identityRoleGranted: {$ref: '#/components/messages/identityRoleGranted'}
      identityRoleRevoked: {$ref: '#/components/messages/identityRoleRevoked'}
      identityPermissionGranted: {$ref: '#/components/messages/identityPermissionGranted'}
      identityPermissionRevoked: {$ref: '#/components/messages/identityPermissionRevoked'}
      identityUserDisabled: {$ref: '#/components/messages/identityUserDisabled'}
      identityUserEnabled: {$ref: '#/components/messages/identityUserEnabled'}
      identitySignInLocked: {$ref: '#/components/messages/identitySignInLocked'}
      identityDeviceRegistered: {$ref: '#/components/messages/identityDeviceRegistered'}
      identityDeviceUnregistered: {$ref: '#/components/messages/identityDeviceUnregistered'}
      identityNotificationPreferencesUpdated: {$ref: '#/components/messages/identityNotificationPreferencesUpdated'}
      identityUserPhoneVerified: {$ref: '#/components/messages/identityUserPhoneVerified'}
      identityInvitationCreated: {$ref: '#/components/messages/identityInvitationCreated'}
      identityInvitationRevoked: {$ref: '#/components/messages/identityInvitationRevoked'}
      identityInvitationAccepted: {$ref: '#/components/messages/identityInvitationAccepted'}
operations:
  publishIdentityEvents:
    action: send
    channel: {$ref: '#/channels/identityEvents'}
    summary: identity-service publishes account, verification and access-change events via its transactional outbox.
  consumeIdentitySellerOrgEvents:
    action: receive
    channel: {$ref: '#/channels/sellerOrgEvents'}
    summary: >-
      identity-service (consumer group identity-service, inbox-deduplicated) mirrors seller organisations with the
      seller org id (org_…) as the organisation id and token org claim. seller.org.approved: organisation APPROVED,
      applicantUserId and ownerUserIds become members with seller.owner / provider.owner (identity.role.granted is
      published) and get it as their active organisation when they have none. seller.org.updated: name, kind, status
      and market (country) are refreshed.
components:
  messages:
    identityUserRegistered:
      name: identity.user.registered
      title: Account created (sign-up form, social sign-in or staff provisioning)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityUserRegistered'}
    identityUserEmailVerified:
      name: identity.user.email-verified
      title: Email confirmed with the 6-digit code
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityUserEmailVerified'}
    identityVerificationRequested:
      name: identity.verification.requested
      title: Deliver a one-time code (email verification, SMS sign-in code, SMS enrolment, phone verification)
      description: >-
        Contains the plain one-time code so notifications-service can render template identity.verification on the
        payload channel (email or sms; phone verification, S234, is purpose PHONE_VERIFICATION with channel sms and
        recipient.phone). Security message: always sent, quiet hours do not apply. Never log the payload.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityVerificationRequested'}
    identityRoleGranted:
      name: identity.role.granted
      title: Role added to a user (sign-up intent, start selling, admin, org membership, accepted invitation)
      description: >-
        For organisation roles orgId is set. An organisation role change publishes identity.role.revoked for the old
        role followed by identity.role.granted for the new one.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityRoleChanged'}
    identityRoleRevoked:
      name: identity.role.revoked
      title: Role removed from a user (or member removed from an organisation); effective on the next token (≤ 5 minutes)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityRoleChanged'}
    identityPermissionGranted:
      name: identity.permission.granted
      title: Permission granted directly to a user, or added to a role
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityPermissionChanged'}
    identityPermissionRevoked:
      name: identity.permission.revoked
      title: Direct grant revoked, or permission removed from a role; effective on the next token
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityPermissionChanged'}
    identityUserDisabled:
      name: identity.user.disabled
      title: Account disabled; every session and refresh token was revoked
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityUserStatusChanged'}
    identityUserEnabled:
      name: identity.user.enabled
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityUserStatusChanged'}
    identitySignInLocked:
      name: identity.sign-in.locked
      title: Too many failed sign-in attempts locked an account or a client IP address
      description: >-
        Brute-force protection (hosted pages and the first-party BFF API): 5 failures per account or 30 per IP within
        15 minutes lock the key for 15 minutes, doubling for consecutive lockouts up to 4 hours. Key = user id
        (scope ACCOUNT) or ip:<address> (scope IP). Lockouts of emails without an account are not published.
        notifications-service may send a security notice; trust-ops may alert on IP lockouts.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentitySignInLocked'}
    identityDeviceRegistered:
      name: identity.device.registered
      title: A push token was registered for an account (customer or driver app, web push)
      description: The token itself is not published; read it with GET /v1/internal/users/{id}/contact (users:read).
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityDeviceChanged'}
    identityDeviceUnregistered:
      name: identity.device.unregistered
      title: A push token was removed from an account (sign-out, removal, or moved to another account)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityDeviceChanged'}
    identityNotificationPreferencesUpdated:
      name: identity.notification-preferences.updated
      title: Account-level notification channel switches or marketing opt-in changed
      description: Consumers caching contact lookups (notifications-service) should drop the user's entry.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityNotificationPreferencesUpdated'}
    identityUserPhoneVerified:
      name: identity.user.phone-verified
      title: The account's phone number was confirmed with an SMS code (S234)
      description: >-
        GET /v1/internal/users/{id}/contact now returns phoneVerified true for this number. Changing the phone resets
        it (no event); consumers caching contact lookups should drop the user's entry.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityUserPhoneVerified'}
    identityInvitationCreated:
      name: identity.invitation.created
      title: Someone was invited to join a seller or provider organisation (S231)
      description: >-
        Key = organisation id. Contains the plain single-use token (valid 7 days) and the Seller Center acceptUrl so
        notifications-service can email recipient.email (template e.g. org.invitation). Security-style message: the
        recipient usually has no account yet, so resolve nothing through identity. Inviting the same email again
        revokes the previous invitation (identity.invitation.revoked) and publishes a new one. Never log the payload.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityInvitationCreated'}
    identityInvitationRevoked:
      name: identity.invitation.revoked
      title: An open invitation was withdrawn or replaced by a new one (key = organisation id)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityInvitationRevoked'}
    identityInvitationAccepted:
      name: identity.invitation.accepted
      title: The invitee joined the organisation, signed in or by signing up from the link (key = user id)
      description: identity.role.granted (with orgId) is published for the new membership unless alreadyMember.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/IdentityInvitationAccepted'}
  schemas:
    IdentityUserRegistered:
      type: object
      required: [userId, email, firstName, lastName, intent, roles, method, emailVerified, smsConsent, registeredAt]
      properties:
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        firstName: {type: string}
        lastName: {type: string}
        phone: {type: [string, 'null'], description: E.164 mobile number}
        intent: {type: string, enum: [SHOP, SELL, PROVIDE, STAFF]}
        roles:
          type: array
          items: {type: string, examples: [account.customer, account.seller_applicant]}
        method: {type: string, enum: [PASSWORD, GOOGLE, APPLE, FACEBOOK, ADMIN]}
        emailVerified: {type: boolean, description: true for social sign-ups and staff provisioning}
        smsConsent: {type: boolean, description: Separate, optional SMS opt-in from the sign-up form}
        registeredAt: {type: string, format: date-time}
    IdentityUserEmailVerified:
      type: object
      required: [userId, email, verifiedAt]
      properties:
        userId: {type: string, format: uuid}
        email: {type: string, format: email}
        verifiedAt: {type: string, format: date-time}
    IdentityVerificationRequested:
      type: object
      description: Follows the notifications-service payload convention (recipient block, channel override).
      required: [recipient, channel, code, expiresInMinutes, expiresAt, purpose, userId, transactional]
      properties:
        recipient:
          type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
            email: {type: [string, 'null'], format: email}
            phone: {type: [string, 'null'], description: E.164}
        channel: {type: string, enum: [email, sms]}
        code: {type: string, pattern: '^[0-9]{6}$'}
        expiresInMinutes: {type: integer, examples: [10]}
        expiresAt: {type: string, format: date-time}
        purpose: {type: string, enum: [EMAIL_VERIFICATION, SIGN_IN_SMS, SMS_ENROLMENT, PHONE_VERIFICATION]}
        userId: {type: string, format: uuid}
        firstName: {type: string}
        transactional: {type: boolean, const: true}
    IdentityRoleChanged:
      type: object
      required: [userId, roleKey, actorId, at]
      properties:
        userId: {type: string, format: uuid}
        roleKey: {type: string, examples: [platform.driver, seller.owner, account.seller_applicant]}
        orgId: {type: [string, 'null'], examples: [org_3k2j9x8q7w6e5r4t3y2u], description: Seller-service organisation id; set for seller/provider organisation roles}
        actorId: {type: string, description: User id of the administrator, the user themself, or a client id}
        reason: {type: [string, 'null']}
        at: {type: string, format: date-time}
    IdentityPermissionChanged:
      type: object
      required: [permissionKey, actorId, at]
      description: Exactly one of userId (direct grant) or roleKey (role capability change) is set.
      properties:
        userId: {type: [string, 'null'], format: uuid}
        roleKey: {type: [string, 'null']}
        permissionKey: {type: string, examples: [delivery:operate]}
        actorId: {type: string}
        reason: {type: [string, 'null']}
        at: {type: string, format: date-time}
    IdentityUserStatusChanged:
      type: object
      required: [userId, actorId, at]
      properties:
        userId: {type: string, format: uuid}
        actorId: {type: string}
        reason: {type: [string, 'null']}
        at: {type: string, format: date-time}
    IdentitySignInLocked:
      type: object
      required: [scope, channel, lockouts, lockoutSeconds, lockedUntil, at]
      properties:
        scope: {type: string, enum: [ACCOUNT, IP]}
        userId: {type: [string, 'null'], format: uuid, description: Set for ACCOUNT lockouts}
        ip: {type: [string, 'null'], description: Set for IP lockouts}
        channel: {type: string, enum: [first-party, hosted], description: BFF sign-in API or the authorization server pages}
        lockouts: {type: integer, description: Consecutive lockouts including this one}
        lockoutSeconds: {type: integer, examples: [900]}
        lockedUntil: {type: string, format: date-time}
        at: {type: string, format: date-time}
    IdentityDeviceChanged:
      type: object
      required: [userId, deviceId, app, platform, provider, at]
      properties:
        userId: {type: string, format: uuid}
        deviceId: {type: string, format: uuid}
        app: {type: string, enum: [customer, driver]}
        platform: {type: string, enum: [ios, android, web]}
        provider: {type: string, enum: [fcm, apns]}
        at: {type: string, format: date-time}
    IdentityNotificationPreferencesUpdated:
      type: object
      required: [userId, email, sms, push, marketingOptIn, at]
      properties:
        userId: {type: string, format: uuid}
        email: {type: boolean}
        sms: {type: boolean}
        push: {type: boolean}
        marketingOptIn: {type: boolean}
        locale: {type: [string, 'null'], examples: [fr-CA]}
        timeZone: {type: [string, 'null'], examples: [America/Chicago]}
        at: {type: string, format: date-time}
    IdentityUserPhoneVerified:
      type: object
      required: [userId, phone, verifiedAt]
      properties:
        userId: {type: string, format: uuid}
        phone: {type: string, description: E.164}
        verifiedAt: {type: string, format: date-time}
    IdentityInvitationCreated:
      type: object
      description: Follows the notifications-service payload convention (recipient block).
      required: [invitationId, orgId, orgName, orgKind, email, roleKey, roleName, token, acceptUrl, expiresAt,
                 expiresInDays, invitedBy, recipient, transactional]
      properties:
        invitationId: {type: string, format: uuid}
        orgId: {type: string, examples: [org_3k2j9x8q7w6e5r4t3y2u]}
        orgName: {type: string, examples: [Mama Put]}
        orgKind: {type: string, enum: [SELLER, PROVIDER]}
        email: {type: string, format: email}
        roleKey: {type: string, examples: [seller.catalog, provider.practitioner]}
        roleName: {type: string, examples: [Catalog manager]}
        token: {type: string, description: Single-use base64url token (256 bits); identity stores only its SHA-256}
        acceptUrl: {type: string, format: uri, examples: ['https://seller.afrotransact.com/invitations/accept?token=…']}
        expiresAt: {type: string, format: date-time}
        expiresInDays: {type: integer, examples: [7]}
        invitedBy: {type: string, description: User id of the inviter, or a client id}
        inviterName: {type: [string, 'null'], examples: [Adaeze Okafor]}
        recipient:
          type: object
          required: [email]
          properties:
            id: {type: 'null', description: The invitee may not have an account}
            email: {type: string, format: email}
            phone: {type: 'null'}
        transactional: {type: boolean, const: true}
    IdentityInvitationRevoked:
      type: object
      required: [invitationId, orgId, email, roleKey, actorId, at]
      properties:
        invitationId: {type: string, format: uuid}
        orgId: {type: string}
        email: {type: string, format: email}
        roleKey: {type: string}
        actorId: {type: string}
        reason: {type: [string, 'null'], examples: [revoked, replaced by a new invitation]}
        at: {type: string, format: date-time}
    IdentityInvitationAccepted:
      type: object
      required: [invitationId, orgId, email, roleKey, userId, alreadyMember, at]
      properties:
        invitationId: {type: string, format: uuid}
        orgId: {type: string}
        email: {type: string, format: email}
        roleKey: {type: string, description: The invited role}
        userId: {type: string, format: uuid}
        alreadyMember: {type: boolean, description: The user was a member already; their role was left unchanged}
        at: {type: string, format: date-time}
