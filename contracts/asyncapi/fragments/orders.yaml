# AsyncAPI 3.0 fragment for orders-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  ordersOrderEvents:
    address: at.order.events
    description: >-
      Order and shipment lifecycle from orders-service, written to its transactional outbox in the same transaction as
      the change (key = order id, so one order's events stay in order). Headers event-id, event-type, occurred-at;
      consumers de-duplicate on event-id. Shipment statuses use the wire names of the state machine (placed,
      confirmed, packed, ready, picked_up, in_transit, out_for_delivery, delivered, delivery_failed, returned,
      cancelled).
    messages:
      ordersOrderPlaced: {$ref: '#/components/messages/ordersOrderPlaced'}
      ordersOrderCancelled: {$ref: '#/components/messages/ordersOrderCancelled'}
      ordersShipmentStatusChanged: {$ref: '#/components/messages/ordersShipmentStatusChanged'}
      ordersShipmentDelivered: {$ref: '#/components/messages/ordersShipmentDelivered'}
      ordersShipmentCancelled: {$ref: '#/components/messages/ordersShipmentCancelled'}
operations:
  publishOrdersOrderEvents:
    action: send
    channel: {$ref: '#/channels/ordersOrderEvents'}
    summary: >-
      orders-service publishes order placement / cancellation and every applied shipment transition. Notifications map
      them to templates (order confirmation, shipped, out for delivery, delivered, cancelled), payments and finance
      follow deliveries and cancellations, the indexer keeps sales stats, tax-returns reads delivered lines for RMAs.
  receiveOrdersPaymentEvents:
    action: receive
    channel: {$ref: '#/channels/paymentsPaymentEvents'}
    summary: >-
      orders consumes payments.intent.succeeded / failed / canceled (inbox-deduplicated) and signals the checkout saga
      waiting for the authorisation.
  receiveOrdersCarrierEvents:
    action: receive
    channel: {$ref: '#/channels/carrierShipmentEvents'}
    summary: >-
      orders consumes carrier.tracking.updated (inbox-deduplicated, idempotent per carrier event id) and applies the
      transit steps to carrier shipments; scans older than the last applied one are ignored. carrier.pickup.ready
      (S219, same topic, inbox-deduplicated): orderRef names the order (id or number) or one shipment; the order's
      pickup shipments (delivery method PICKUP, matching pickup location when both are set, customerRef equal to the
      order's customer) that are confirmed or packed move to ready with actor PICKUP_POINT and source carrier (which
      also triggers the pickup capture); shipments already ready or further along are left as they are. Every
      transition is published as orders.shipment.status_changed and pushed to GET /v1/shipments/stream on every
      replica through Valkey pub/sub (channel at:orders:shipment-status).
components:
  messages:
    ordersOrderPlaced:
      name: orders.order.placed
      title: 'Payment authorised: the order is placed and split into shipments'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersOrderPlaced'}
    ordersOrderCancelled:
      name: orders.order.cancelled
      title: 'Checkout voided (wasPlaced=false) or every shipment of a placed order cancelled'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersOrderCancelled'}
    ordersShipmentStatusChanged:
      name: orders.shipment.status_changed
      title: 'A shipment moved through the state machine (actor, source and reason recorded)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersShipmentStatusChanged'}
    ordersShipmentDelivered:
      name: orders.shipment.delivered
      title: 'A shipment was delivered (carrier scan, driver proof or admin confirmation)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersShipmentDelivered'}
    ordersShipmentCancelled:
      name: orders.shipment.cancelled
      title: 'One shipment of a placed order was cancelled (refund or release follows)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersShipmentCancelled'}
  schemas:
    OrdersShipmentStatus:
      type: string
      enum: [pending_payment, placed, confirmed, packed, ready, picked_up, in_transit, out_for_delivery,
             delivery_failed, delivered, returned, cancelled]
    OrdersOrderPlaced:
      type: object
      required: [orderId, orderNumber, customerId, currency, itemsMinor, shippingMinor, taxMinor, discountMinor,
                 totalMinor, placedAt, shipments]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string, examples: [AT-2026-7KQ3MD]}
        customerId: {type: string, description: identity subject of the shopper}
        currency: {type: string, examples: [USD]}
        itemsMinor: {type: integer, format: int64}
        shippingMinor: {type: integer, format: int64}
        taxMinor: {type: integer, format: int64}
        discountMinor: {type: integer, format: int64}
        totalMinor: {type: integer, format: int64, description: items + shipping + tax − discount}
        placedAt: {type: string, format: date-time}
        shipToCity: {type: [string, 'null']}
        shipToState: {type: [string, 'null']}
        shipToPostalCode: {type: [string, 'null']}
        shipToCountry: {type: [string, 'null']}
        shipToName: {type: [string, 'null'], description: Recipient name of the ship-to address}
        shipToLine1: {type: [string, 'null'], description: Ship-to street line (return labels need no app address)}
        shipToLine2: {type: [string, 'null']}
        paymentId: {type: [string, 'null'], description: payments-service payment of the order}
        shipments:
          type: array
          items:
            type: object
            required: [shipmentId, sellerOrgId, fulfilmentType, deliveryMethod, totalMinor, lines]
            properties:
              shipmentId: {type: string, format: uuid}
              sellerOrgId: {type: string}
              sellerName: {type: [string, 'null']}
              fulfilmentType: {type: string, enum: [SELLER_FULFILLED, FBA_AFROTRANSACT, RETAIL_1P]}
              deliveryMethod: {type: string, enum: [CARRIER, AFROTRANSACT_DELIVERY, PICKUP]}
              serviceLevel: {type: [string, 'null'], examples: [standard, express, local, pickup]}
              promisedBy: {type: [string, 'null'], format: date}
              handoverRequired: {type: boolean, description: The customer must give the driver their 4-digit code}
              totalMinor: {type: integer, format: int64}
              nodeId: {type: [string, 'null'], description: Fulfilment node of AfroTransact-fulfilled shipments (inventory reservation)}
              perishable: {type: boolean, description: Frozen or chilled food (no safe place; handover code)}
              shipToLine1: {type: [string, 'null'], description: Ship-to street line (AfroTransact Delivery routing)}
              shipToLine2: {type: [string, 'null']}
              lat: {type: [number, 'null'], description: Ship-to latitude when the address book knows it}
              lng: {type: [number, 'null'], description: Ship-to longitude when the address book knows it}
              shippingMinor:
                type: integer
                format: int64
                description: Shipping of the shipment (charged on its first line, as payments allocates it)
              shipBy: {type: [string, 'null'], format: date, description: Date the shipment must be handed over by}
              promisedFrom: {type: [string, 'null'], format: date}
              lines:
                type: array
                items:
                  type: object
                  properties:
                    lineId: {type: string, format: uuid, description: Order line id (= payments line id)}
                    lineNo: {type: integer}
                    variantAtin: {type: string}
                    productAtin: {type: [string, 'null']}
                    title: {type: [string, 'null']}
                    quantity: {type: integer}
                    unitPriceMinor: {type: integer, format: int64}
                    taxMinor: {type: integer, format: int64, description: Tax of the line incl. tax on its shipping}
                    productType: {type: [string, 'null'], description: Catalog product type}
                    category: {type: [string, 'null'], description: Payments commission category}
                    perishable: {type: boolean}
                    discountMinor: {type: integer, format: int64, description: Coupon discount allocated to the line}
                    taxJurisdiction: {type: [string, 'null'], examples: [US-TX]}
                    localTaxJurisdiction: {type: [string, 'null'], examples: [US-TX-770]}
                    shippingTaxMinor: {type: integer, format: int64, description: Part of taxMinor on shipping}
    OrdersOrderCancelled:
      type: object
      required: [orderId, orderNumber, customerId, code, wasPlaced, cancelledAt]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        code:
          type: string
          description: >-
            Checkout failure code (orders.insufficient-stock, orders.payment-failed, orders.payment-timeout,
            orders.market-disabled …) or orders.all-shipments-cancelled
        reason: {type: [string, 'null']}
        wasPlaced: {type: boolean, description: false when the checkout never completed (no notification to send)}
        cancelledAt: {type: string, format: date-time}
    OrdersShipmentStatusChanged:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, sellerOrgId, fulfilmentType, deliveryMethod, to,
                 actorType, actorId, source, occurredAt]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        sellerOrgId: {type: string}
        fulfilmentType: {type: string, enum: [SELLER_FULFILLED, FBA_AFROTRANSACT, RETAIL_1P]}
        deliveryMethod: {type: string, enum: [CARRIER, AFROTRANSACT_DELIVERY, PICKUP]}
        from: {$ref: '#/components/schemas/OrdersShipmentStatus'}
        to: {$ref: '#/components/schemas/OrdersShipmentStatus'}
        actorType: {type: string, enum: [CUSTOMER, SELLER, PLATFORM_ADMIN, FULFILMENT_OPS, CARRIER, COURIER, PICKUP_POINT, SYSTEM]}
        actorId: {type: string}
        source: {type: string, enum: [api, carrier, driver, system]}
        reason: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        promisedBy: {type: [string, 'null'], format: date}
    OrdersShipmentDelivered:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, sellerOrgId, deliveredAt, totalMinor, lineIds, source]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        sellerOrgId: {type: string}
        deliveredAt: {type: string, format: date-time}
        totalMinor: {type: integer, format: int64}
        lineIds: {type: array, items: {type: string, format: uuid}}
        source: {type: string, enum: [api, carrier, driver, system]}
    OrdersShipmentCancelled:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, sellerOrgId, actorType, captured, totalMinor,
                 cancelledAt]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        sellerOrgId: {type: string}
        actorType: {type: string, enum: [CUSTOMER, PLATFORM_ADMIN, FULFILMENT_OPS, SYSTEM]}
        reason: {type: [string, 'null']}
        captured: {type: boolean, description: true → payments refunds the lines; false → authorisation / stock released}
        totalMinor: {type: integer, format: int64}
        cancelledAt: {type: string, format: date-time}
