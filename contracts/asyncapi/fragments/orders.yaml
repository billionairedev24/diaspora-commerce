# AsyncAPI 3.0 fragment for orders-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  ordersOrderEvents:
    address: at.order.events
    description: >-
      Order and shipment lifecycle from orders-service, written to its transactional outbox in the same transaction as
      the change (key = order id, so one order's events stay in order). Headers event-id, event-type, occurred-at;
      consumers de-duplicate on event-id. Shipment statuses use the wire names of the state machine (placed,
      confirmed, packed, ready, picked_up, in_transit, out_for_delivery, delivered, delivery_failed, returned,
      cancelled).
    messages:
      ordersOrderPlaced: {$ref: '#/components/messages/ordersOrderPlaced'}
      ordersOrderCancelled: {$ref: '#/components/messages/ordersOrderCancelled'}
      ordersShipmentStatusChanged: {$ref: '#/components/messages/ordersShipmentStatusChanged'}
      ordersShipmentDelivered: {$ref: '#/components/messages/ordersShipmentDelivered'}
      ordersShipmentCancelled: {$ref: '#/components/messages/ordersShipmentCancelled'}
      ordersPreorderDeliveryMissed: {$ref: '#/components/messages/ordersPreorderDeliveryMissed'}
      ordersPreorderMissedDeliveryAnswered: {$ref: '#/components/messages/ordersPreorderMissedDeliveryAnswered'}
      ordersPreorderPaymentLinkCreated: {$ref: '#/components/messages/ordersPreorderPaymentLinkCreated'}
      ordersPreorderRefundSettled: {$ref: '#/components/messages/ordersPreorderRefundSettled'}
      ordersPreorderRefundFailed: {$ref: '#/components/messages/ordersPreorderRefundFailed'}
operations:
  publishOrdersOrderEvents:
    action: send
    channel: {$ref: '#/channels/ordersOrderEvents'}
    summary: >-
      orders-service publishes order placement / cancellation and every applied shipment transition. Notifications map
      them to templates (order confirmation, shipped, out for delivery, delivered, cancelled), payments and finance
      follow deliveries and cancellations, the indexer keeps sales stats, tax-returns reads delivered lines for RMAs.
      Pre-orders (S270–S275): an orders.order.placed with a PREORDER shipment sends preorder.confirmed ("You're in");
      orders.preorder.delivery_missed sends preorder.delivery_missed (refund / new date links).
      S272 pre-orders: orders.order.placed carries the attribution {src, cr, po}, channel, tags and per shipment the
      pre-order window and fulfilment (delivery-runs projects window orders from it); a scheduler publishes
      orders.preorder.delivery_missed when a PREORDER shipment passes its delivery date undelivered (notifications
      sends preorder.delivery_missed with refund / new-date links) and the customer's answer as
      orders.preorder.missed_delivery_answered; late adds paid by link publish orders.preorder.payment_link_created
      (notifications texts preorder.late_order.payment_link). orders also routes payments.intent.* of late adds (no
      saga) to place or void them.
  receiveOrdersDeliveryRunsEvents:
    action: receive
    channel: {$ref: '#/channels/deliveryRunsEvents'}
    summary: >-
      ADR 0005 §1 (consumer orders-delivery-runs-events): preorder.window.cancelled cancels every placed PREORDER
      shipment of the window, and delivery-runs.run.cancelled the PREORDER shipments of the orders[] it lists, through the
      same cancellation path a customer's own cancellation uses (orders.shipment.cancelled, then the CANCEL follow-up:
      a captured payment is refunded in full with the delivery fee, an uncaptured authorisation is released, stock held for
      the lines is released). Idempotent per shipment, so redeliveries and the window event followed by its run's event do
      no harm. A package that can no longer be cancelled (already on its way) publishes orders.preorder.refund_failed.
  receiveOrdersPaymentEvents:
    action: receive
    channel: {$ref: '#/channels/paymentsPaymentEvents'}
    summary: >-
      orders consumes payments.intent.succeeded / failed / canceled (inbox-deduplicated) and signals the checkout saga
      waiting for the authorisation.
  receiveOrdersCarrierEvents:
    action: receive
    channel: {$ref: '#/channels/carrierShipmentEvents'}
    summary: >-
      orders consumes carrier.tracking.updated (inbox-deduplicated, idempotent per carrier event id) and applies the
      transit steps to carrier shipments; scans older than the last applied one are ignored. carrier.pickup.ready
      (S219, same topic, inbox-deduplicated): orderRef names the order (id or number) or one shipment; the order's
      pickup shipments (delivery method PICKUP, matching pickup location when both are set, customerRef equal to the
      order's customer) that are confirmed or packed move to ready with actor PICKUP_POINT and source carrier (which
      also triggers the pickup capture); shipments already ready or further along are left as they are. Every
      transition is published as orders.shipment.status_changed and pushed to GET /v1/shipments/stream on every
      replica through Valkey pub/sub (channel at:orders:shipment-status).
components:
  messages:
    ordersOrderPlaced:
      name: orders.order.placed
      title: 'Payment authorised: the order is placed and split into shipments'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersOrderPlaced'}
    ordersOrderCancelled:
      name: orders.order.cancelled
      title: 'Checkout voided (wasPlaced=false) or every shipment of a placed order cancelled'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersOrderCancelled'}
    ordersShipmentStatusChanged:
      name: orders.shipment.status_changed
      title: 'A shipment moved through the state machine (actor, source and reason recorded)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersShipmentStatusChanged'}
    ordersShipmentDelivered:
      name: orders.shipment.delivered
      title: 'A shipment was delivered (carrier scan, driver proof or admin confirmation)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersShipmentDelivered'}
    ordersShipmentCancelled:
      name: orders.shipment.cancelled
      title: 'One shipment of a placed order was cancelled (refund or release follows)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersShipmentCancelled'}
    ordersPreorderDeliveryMissed:
      name: orders.preorder.delivery_missed
      title: >-
        A pre-order package was not delivered on the window's date; the customer chooses a refund or the new date
        (the choices the pre-order payment settings allow: missedDelivery.offerRefund / offerNewDate)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersPreorderDeliveryMissed'}
    ordersPreorderMissedDeliveryAnswered:
      name: orders.preorder.missed_delivery_answered
      title: 'The customer answered a missed pre-order delivery (delivery-runs reschedules WAIT answers)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersPreorderMissedDeliveryAnswered'}
    ordersPreorderPaymentLinkCreated:
      name: orders.preorder.payment_link_created
      title: 'A late pre-order add waits for the customer to pay its payment link (send it by SMS)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersPreorderPaymentLinkCreated'}
    ordersPreorderRefundSettled:
      name: orders.preorder.refund_settled
      title: 'A cancelled pre-order package was refunded in full (REFUNDED) or its authorisation released (VOIDED)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersPreorderRefundSettled'}
    ordersPreorderRefundFailed:
      name: orders.preorder.refund_failed
      title: 'A cancelled pre-order package could not be cancelled or refunded automatically; staff must act'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/OrdersPreorderRefundFailed'}
  schemas:
    OrdersAttribution:
      type: [object, 'null']
      description: 'S272 storefront attribution (last touch): ?src=ig|fb|tt|wa|email|sms|app or placement, creative, window code'
      properties:
        src: {type: [string, 'null'], examples: [ig, ribbon]}
        cr: {type: [string, 'null'], examples: [STORY, HERO]}
        po: {type: [string, 'null'], examples: [LBK-7]}
    OrdersPreorderDeliveryMissed:
      type: object
      required: [orderId, orderNumber, customerId, windowId, code, name, deliversOn, totalMinor, currency]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: [string, 'null']}
        windowId: {type: string}
        code: {type: string, examples: [LBK-7]}
        name: {type: string}
        deliversOn: {type: string, format: date, description: The missed date}
        newDate: {type: [string, 'null'], format: date, description: The proposed new delivery date}
        offerRefund: {type: boolean}
        offerNewDate: {type: boolean}
        refundUrl: {type: [string, 'null'], format: uri, description: 'Default <PUBLIC_WEB_URL>/orders/<number>/pre-order?choice=refund'}
        newDateUrl: {type: [string, 'null'], format: uri}
        totalMinor: {type: integer, format: int64, description: Refund amount of the pre-order package}
        currency: {type: string}
        reason: {type: [string, 'null']}
        sellerOrgId: {type: [string, 'null']}
        preorder: {$ref: '#/components/schemas/OrdersPreorderBlock'}
        choices:
          type: array
          description: POST /v1/orders/{orderId}/shipments/{shipmentId}/missed-delivery {choice}
          items: {type: string, enum: [REFUND, WAIT]}
        missedAt: {type: string, format: date-time}
        items: {type: array, description: 'S279: the package''s items (emails)', items: {$ref: '#/components/schemas/OrdersShipmentItem'}}
    OrdersShipmentItem:
      type: object
      description: 'S279: a shipment''s line as the customer''s emails show it. Optional and additive: consumers ignore it when absent.'
      required: [lineId, variantAtin, quantity, unitPriceMinor]
      properties:
        lineId: {type: string, format: uuid}
        variantAtin: {type: string}
        productAtin: {type: [string, 'null']}
        title: {type: [string, 'null']}
        imageUrl: {type: [string, 'null'], format: uri, description: Product photo snapshotted at checkout}
        quantity: {type: integer}
        unitPriceMinor: {type: integer, format: int64}
    OrdersPreorderMissedDeliveryAnswered:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, windowId, choice, answeredAt]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        windowId: {type: string}
        choice: {type: string, enum: [REFUND, WAIT]}
        answeredAt: {type: string, format: date-time}
    OrdersPreorderRefundSettled:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, status, amountMinor, currency, at]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        windowId: {type: [string, 'null']}
        status: {type: string, enum: [REFUNDED, VOIDED]}
        amountMinor: {type: integer, format: int64, description: 'Refunded or released: items, tax and the delivery fee'}
        currency: {type: string}
        at: {type: string, format: date-time}
    OrdersPreorderRefundFailed:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, code, error, at]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        windowId: {type: [string, 'null']}
        code: {type: string, examples: ['orders.invalid-transition', 'payments.unavailable']}
        error: {type: string}
        at: {type: string, format: date-time}
    OrdersPreorderPaymentLinkCreated:
      type: object
      required: [orderId, orderNumber, customerId, url, expiresAt, amountMinor, currency]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        windowId: {type: [string, 'null']}
        windowCode: {type: [string, 'null']}
        url: {type: string, description: "Pay-now link: AfroTransact's own pay page with its signed token (/orders/{number}/pay?token=…); never a Stripe-hosted page"}
        expiresAt: {type: string, format: date-time}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        shipToName: {type: [string, 'null']}
        shipToPhone: {type: [string, 'null'], description: Where to text the link}
    OrdersPreorderBlock:
      type: [object, 'null']
      description: Pre-order package of the order (fulfilmentType PREORDER); null for other shipments
      properties:
        windowId: {type: string}
        code: {type: string, examples: [LBK-7]}
        name: {type: string}
        number: {type: [string, 'null'], examples: [LBK-1042], description: Pre-order number shown to the customer}
        deliversOn: {type: string, format: date}
        deliversDisplay: {type: [string, 'null']}
        closesAt: {type: [string, 'null'], format: date-time, description: Cancel for a full refund until then}
        closesDisplay: {type: [string, 'null']}
        fulfilment: {type: string, enum: [DOOR, PICKUP]}
        feeMinor: {type: integer, format: int64, description: Effective door or pickup fee charged}
        currency: {type: string}
        pickupWindow: {type: [string, 'null']}
        source:
          type: string
          enum: [WINDOW, RUN]
          description: 'WINDOW (default when absent), or RUN for a delivery run staff scheduled (S261): windowId is then the run id and the order holds a slot on the run (POST /v1/service/runs/{id}/reservations), not a pre-order window order'
    OrdersShipmentStatus:
      type: string
      enum: [pending_payment, placed, confirmed, packed, ready, picked_up, in_transit, out_for_delivery,
             delivery_failed, delivered, returned, cancelled]
    OrdersOrderPlaced:
      type: object
      required: [orderId, orderNumber, customerId, currency, itemsMinor, shippingMinor, taxMinor, discountMinor,
                 totalMinor, placedAt, shipments]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string, examples: [AT-2026-7KQ3MD]}
        customerId: {type: string, description: identity subject of the shopper}
        currency: {type: string, examples: [USD]}
        itemsMinor: {type: integer, format: int64}
        shippingMinor: {type: integer, format: int64}
        taxMinor: {type: integer, format: int64}
        discountMinor: {type: integer, format: int64}
        totalMinor: {type: integer, format: int64, description: items + shipping + tax − discount}
        placedAt: {type: string, format: date-time}
        shipToCity: {type: [string, 'null']}
        shipToState: {type: [string, 'null']}
        shipToPostalCode: {type: [string, 'null']}
        shipToCountry: {type: [string, 'null']}
        shipToName: {type: [string, 'null'], description: Recipient name of the ship-to address}
        shipToLine1: {type: [string, 'null'], description: Ship-to street line (return labels need no app address)}
        shipToLine2: {type: [string, 'null']}
        paymentId: {type: [string, 'null'], description: payments-service payment of the order}
        shipToPhone: {type: [string, 'null'], description: Phone of the ship-to address (pre-order dispatch)}
        attribution: {$ref: '#/components/schemas/OrdersAttribution'}
        channel:
          type: string
          enum: [SITE_HERO, SITE_RIBBON, SITE_PDP, SITE_PAGE, SITE_DIRECT, APP, INSTAGRAM, FACEBOOK, TIKTOK, WHATSAPP,
                 EMAIL, SMS, AGENT_LATE]
          description: S272 channel derived from the attribution source (AGENT_LATE for customer-service late adds)
        tags: {type: array, items: {type: string}, description: e.g. LATE_ADD}
        onBehalf:
          type: [object, 'null']
          description: Set when customer service created the order on the customer's behalf (late pre-order add)
          properties:
            actorId: {type: string, description: Staff subject}
            reason: {type: [string, 'null']}
            note: {type: [string, 'null']}
        shipments:
          type: array
          items:
            type: object
            required: [shipmentId, sellerOrgId, fulfilmentType, deliveryMethod, totalMinor, lines]
            properties:
              shipmentId: {type: string, format: uuid}
              sellerOrgId: {type: string}
              sellerName: {type: [string, 'null']}
              fulfilmentType: {type: string, enum: [SELLER_FULFILLED, FBA_AFROTRANSACT, RETAIL_1P, PREORDER]}
              preorder: {$ref: '#/components/schemas/OrdersPreorderBlock'}
              deliveryMethod: {type: string, enum: [CARRIER, AFROTRANSACT_DELIVERY, PICKUP]}
              serviceLevel: {type: [string, 'null'], examples: [standard, express, local, pickup, preorder_door]}
              windowId: {type: [string, 'null'], description: S272 pre-order window (PREORDER shipments)}
              fulfilment: {type: [string, 'null'], enum: [DOOR, PICKUP, null], description: S272 pre-order fulfilment}
              promisedBy: {type: [string, 'null'], format: date}
              handoverRequired: {type: boolean, description: The customer must give the driver their 4-digit code}
              totalMinor: {type: integer, format: int64}
              nodeId: {type: [string, 'null'], description: Fulfilment node of AfroTransact-fulfilled shipments (inventory reservation)}
              perishable: {type: boolean, description: Frozen or chilled food (no safe place; handover code)}
              shipToLine1: {type: [string, 'null'], description: Ship-to street line (AfroTransact Delivery routing)}
              shipToLine2: {type: [string, 'null']}
              lat: {type: [number, 'null'], description: Ship-to latitude when the address book knows it}
              lng: {type: [number, 'null'], description: Ship-to longitude when the address book knows it}
              shippingMinor:
                type: integer
                format: int64
                description: Shipping of the shipment (charged on its first line, as payments allocates it)
              shipBy: {type: [string, 'null'], format: date, description: Date the shipment must be handed over by}
              promisedFrom: {type: [string, 'null'], format: date}
              pickup:
                type: [object, 'null']
                description: >-
                  S255 AfroTransact Delivery from the seller's store (SELLER_FULFILLED + AFROTRANSACT_DELIVERY): where
                  the driver collects (fulfilment creates a SELLER-origin pickup and prefers the nearest driver) and
                  the checkout snapshot. Null for every other shipment.
                properties:
                  locationId: {type: string, description: seller-service ship-from location}
                  lat: {type: number}
                  lng: {type: number}
                  roadMiles: {type: number, description: geo routing provider road miles pickup → customer}
                  straightLineMiles: {type: number}
                  durationMinutes: {type: number}
                  distanceMethod: {type: string, enum: [ROAD_GOOGLE, ROAD_OSRM, GEODESIC_DETOUR]}
                  customerChargeMinor: {type: integer, format: int64, description: Delivery charge (= shippingMinor)}
                  sellerFeeMinor: {type: integer, format: int64, description: Seller pickup-delivery fee}
                  pricingVersion: {type: integer, description: Fee-schedule version that priced it}
              lines:
                type: array
                items:
                  type: object
                  properties:
                    lineId: {type: string, format: uuid, description: Order line id (= payments line id)}
                    lineNo: {type: integer}
                    variantAtin: {type: string}
                    productAtin: {type: [string, 'null']}
                    title: {type: [string, 'null']}
                    quantity: {type: integer}
                    sellerOrgId: {type: [string, 'null'], description: 'The line''s own seller (S264): a PREORDER package mixes sellers, so delivery-runs and fulfilment plan seller pickups and pick lists from it. Null for orders placed before it was kept.'}
                    sellerName: {type: [string, 'null']}
                    unitPriceMinor: {type: integer, format: int64}
                    taxMinor: {type: integer, format: int64, description: Tax of the line incl. tax on its shipping}
                    productType: {type: [string, 'null'], description: Catalog product type}
                    category: {type: [string, 'null'], description: Payments commission category}
                    perishable: {type: boolean}
                    discountMinor: {type: integer, format: int64, description: Coupon discount allocated to the line}
                    taxJurisdiction: {type: [string, 'null'], examples: [US-TX]}
                    localTaxJurisdiction: {type: [string, 'null'], examples: [US-TX-770]}
                    shippingTaxMinor: {type: integer, format: int64, description: Part of taxMinor on shipping}
                    imageUrl: {type: [string, 'null'], format: uri, description: 'S279: product photo snapshotted at checkout (order emails)'}
    OrdersOrderCancelled:
      type: object
      required: [orderId, orderNumber, customerId, code, wasPlaced, cancelledAt]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        code:
          type: string
          description: >-
            Checkout failure code (orders.insufficient-stock, orders.payment-failed, orders.payment-timeout,
            orders.market-disabled …) or orders.all-shipments-cancelled
        reason: {type: [string, 'null']}
        wasPlaced: {type: boolean, description: false when the checkout never completed (no notification to send)}
        cancelledAt: {type: string, format: date-time}
    OrdersShipmentStatusChanged:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, sellerOrgId, fulfilmentType, deliveryMethod, to,
                 actorType, actorId, source, occurredAt]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        sellerOrgId: {type: string}
        fulfilmentType: {type: string, enum: [SELLER_FULFILLED, FBA_AFROTRANSACT, RETAIL_1P, PREORDER]}
        deliveryMethod: {type: string, enum: [CARRIER, AFROTRANSACT_DELIVERY, PICKUP]}
        from: {$ref: '#/components/schemas/OrdersShipmentStatus'}
        to: {$ref: '#/components/schemas/OrdersShipmentStatus'}
        actorType: {type: string, enum: [CUSTOMER, SELLER, PLATFORM_ADMIN, FULFILMENT_OPS, CARRIER, COURIER, PICKUP_POINT, SYSTEM]}
        actorId: {type: string}
        source: {type: string, enum: [api, carrier, driver, system]}
        reason: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        promisedBy: {type: [string, 'null'], format: date}
        sellerName: {type: [string, 'null'], description: 'S279: seller shown on the package (emails)'}
        currency: {type: [string, 'null']}
        items: {type: array, description: 'S279: the shipment''s items (emails)', items: {$ref: '#/components/schemas/OrdersShipmentItem'}}
    OrdersShipmentDelivered:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, sellerOrgId, deliveredAt, totalMinor, lineIds, source]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        sellerOrgId: {type: string}
        deliveredAt: {type: string, format: date-time}
        totalMinor: {type: integer, format: int64}
        lineIds: {type: array, items: {type: string, format: uuid}}
        source: {type: string, enum: [api, carrier, driver, system]}
        fulfilmentType: {type: [string, 'null'], enum: [SELLER_FULFILLED, FBA_AFROTRANSACT, RETAIL_1P, PREORDER, null], description: S279}
        sellerName: {type: [string, 'null'], description: S279}
        currency: {type: [string, 'null'], description: S279}
        items: {type: array, description: 'S279: the shipment''s items (emails)', items: {$ref: '#/components/schemas/OrdersShipmentItem'}}
    OrdersShipmentCancelled:
      type: object
      required: [orderId, orderNumber, customerId, shipmentId, sellerOrgId, actorType, captured, totalMinor,
                 cancelledAt]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        customerId: {type: string}
        shipmentId: {type: string, format: uuid}
        sellerOrgId: {type: string}
        actorType: {type: string, enum: [CUSTOMER, PLATFORM_ADMIN, FULFILMENT_OPS, SYSTEM]}
        reason: {type: [string, 'null']}
        captured: {type: boolean, description: true → payments refunds the lines; false → authorisation / stock released}
        totalMinor: {type: integer, format: int64}
        cancelledAt: {type: string, format: date-time}
        fulfilmentType: {type: string, enum: [SELLER_FULFILLED, FBA_AFROTRANSACT, RETAIL_1P, PREORDER]}
        windowId: {type: [string, 'null'], description: S272 pre-order window of a PREORDER shipment}
        sellerName: {type: [string, 'null'], description: S279}
        currency: {type: [string, 'null'], description: S279}
        items: {type: array, description: 'S279: the shipment''s items (emails)', items: {$ref: '#/components/schemas/OrdersShipmentItem'}}
