# AsyncAPI 3.0 fragment for the indexer (Go). Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
# The indexer publishes nothing except poison events on its dead-letter topic.
channels:
  indexerDeadLetters:
    address: at.indexer.dlq.events
    description: >-
      Events the indexer could not project after its retries (same key, headers and payload as the original event).
operations:
  publishIndexerDeadLetters:
    action: send
    channel: {$ref: '#/channels/indexerDeadLetters'}
    summary: Poison events parked so one bad event never blocks a partition.
  consumeIndexerProductEvents:
    action: receive
    channel: {$ref: '#/channels/catalogProductEvents'}
    summary: >-
      catalog.product.* upsert the product document (version = occurred-at). Events with sellerHidden = true
      (catalog.product.hidden, and any product event while the owner is hidden) index status SELLER_HIDDEN, which
      search never returns; catalog.product.restored brings back the product's own status. catalog.product.taken_down indexes status TAKEN_DOWN (not returned) and catalog.product.reinstated restores it.
      Each document also carries an embedding of its text (title, brand, category path) from ai-gateway's
      POST /v1/embeddings (purpose search-document, client indexer-service, scope ai:use) for hybrid search (S036);
      an embedding failure never blocks the event, and a backfill embeds LIVE documents without one.
  consumeIndexerOffersEvents:
    action: receive
    channel: {$ref: '#/channels/offersEvents'}
    summary: >-
      offers.buybox.changed sets the variant's sellable quantity to the winner's availableQty (0 when winnerOfferId is
      null), stored as variant entry "<atin>|BUYBOX" (version = decidedAt). When present it replaces the per-node
      inventory entries for that variant, so stock held under a retail SKU or FBA FNSKU reaches search the same way it
      reaches the PDP (S281).
  consumeIndexerSellerOrgEvents:
    action: receive
    channel: {$ref: '#/channels/sellerOrgEvents'}
    summary: >-
      seller.org.approved / updated: the seller display name (else legal name) is applied to seller_name on every
      document of the organisation and used for documents indexed afterwards. The in-memory seller directory is
      warmed on start from seller-service's GET /v1/orgs/directory (client indexer-service, scope sellers:directory)
      before events are consumed, refreshed every 30 minutes, and an unknown organisation is looked up once via
      GET /v1/orgs/{id}/public, so restarts never change indexed seller names (S213).
