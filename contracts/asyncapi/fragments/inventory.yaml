# AsyncAPI 3.0 fragment for inventory-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  inventoryStockEvents:
    address: at.inventory.events
    description: >-
      Stock and lot changes from inventory-service (key = SKU, so one SKU's events stay in order).
      Headers event-id, event-type, occurred-at. Consumers de-duplicate on event-id and ignore
      availability events whose version is not newer than the one they hold for (sku, nodeId).
    messages:
      inventoryAvailabilityChanged: {$ref: '#/components/messages/inventoryAvailabilityChanged'}
      inventoryLotCreated: {$ref: '#/components/messages/inventoryLotCreated'}
      inventoryLotQuarantined: {$ref: '#/components/messages/inventoryLotQuarantined'}
      inventoryLotReleased: {$ref: '#/components/messages/inventoryLotReleased'}
      inventoryLotExpired: {$ref: '#/components/messages/inventoryLotExpired'}
      inventoryLotWrittenOff: {$ref: '#/components/messages/inventoryLotWrittenOff'}
  inventoryReservationEvents:
    address: at.inventory-reservation.events
    description: Checkout reservations (key = order id).
    messages:
      inventoryReservationHeld: {$ref: '#/components/messages/inventoryReservationHeld'}
      inventoryReservationCommitted: {$ref: '#/components/messages/inventoryReservationCommitted'}
      inventoryReservationReleased: {$ref: '#/components/messages/inventoryReservationReleased'}
      inventoryReservationGroupCommitted: {$ref: '#/components/messages/inventoryReservationGroupCommitted'}
      inventoryReservationGroupReleased: {$ref: '#/components/messages/inventoryReservationGroupReleased'}
  inventoryReconciliationEvents:
    address: at.inventory-reconciliation.events
    description: Nightly reconciliation alerts (key = run id).
    messages:
      inventoryReconciliationDriftDetected: {$ref: '#/components/messages/inventoryReconciliationDriftDetected'}
  inventoryInboundEvents:
    address: at.inventory-inbound.events
    description: >-
      Inbound shipments (key = inbound shipment id): seller FBA plans ("Send stock to AfroTransact", S257) and
      AfroTransact Retail ASNs opened from retail shipment events (S226). Headers event-id, event-type, occurred-at.
    messages:
      inventoryInboundCreated: {$ref: '#/components/messages/inventoryInboundCreated'}
      inventoryInboundShipped: {$ref: '#/components/messages/inventoryInboundShipped'}
      inventoryInboundReceived: {$ref: '#/components/messages/inventoryInboundReceived'}
      inventoryInboundClosed: {$ref: '#/components/messages/inventoryInboundClosed'}
      inventoryInboundCancelled: {$ref: '#/components/messages/inventoryInboundCancelled'}
operations:
  publishInventoryStockEvents:
    action: send
    channel: {$ref: '#/channels/inventoryStockEvents'}
    summary: >-
      inventory-service publishes availability (available = on hand − reserved) and lot lifecycle events via its
      transactional outbox. Search indexer, storefront, cart, promise, Lola and finance (GL postings) consume them.
  publishInventoryReservationEvents:
    action: send
    channel: {$ref: '#/channels/inventoryReservationEvents'}
    summary: >-
      Reservation lifecycle for the orders saga and finance (COGS on committed / group_committed). Lines carry the
      caller's group (orders' line id) and the stock owner; group events cover one shipment's lines.
  publishInventoryReconciliationEvents:
    action: send
    channel: {$ref: '#/channels/inventoryReconciliationEvents'}
    summary: Raised when positions differ from the ledger or lots; alerts the inventory channel.
  publishInventoryInboundEvents:
    action: send
    channel: {$ref: '#/channels/inventoryInboundEvents'}
    summary: >-
      Inbound lifecycle via the transactional outbox. inventory.inbound.received (one per FC receipt) lets
      offers-service switch the seller's listing to Fulfilled by AfroTransact; closed carries the discrepancies
      (SHORT, OVER, DAMAGED, UNEXPECTED) for Seller Center and the FC team.
  consumeInventoryRetailShipmentEvents:
    action: receive
    channel: {$ref: '#/channels/retailEvents'}
    summary: >-
      S226: retail.shipment.stage-changed (consumer inventory-retail-shipments, inbox-deduplicated). From DEPARTED
      (or a later in-transit stage when the notice does not exist yet) the ASN lines become a RETAIL_ASN inbound
      shipment and its units are inbound at nodeId ("Coming soon"); goods receipts posted with inboundRef = the
      shipment reference consume exactly those units; RECEIVED closes the notice so units that never arrived stop
      counting as inbound. Other retail events are ignored.
  consumeInventoryOffersEvents:
    action: receive
    channel: {$ref: '#/channels/offersEvents'}
    summary: >-
      S067: offers.offer.created|updated|withdrawn (consumer inventory-offers, inbox-deduplicated) keep a projection
      of Fulfilled-by-AfroTransact offers by (sellerOrgId, inventorySku); FBA stock without a live one is reported
      stranded in GET /v1/fba/inventory. Buy box and coupon events are ignored.
components:
  messages:
    inventoryAvailabilityChanged:
      name: inventory.availability.changed
      title: Available units of a SKU at a node changed
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryAvailabilityChanged'}
    inventoryLotCreated:
      name: inventory.lot.created
      title: Lot received (sellable, short-dated quarantine, -DMG, transfer destination or damaged return)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryLotEvent'}
    inventoryLotQuarantined:
      name: inventory.lot.quarantined
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryLotEvent'}
    inventoryLotReleased:
      name: inventory.lot.released
      title: Quarantined or damaged lot released back to sale
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryLotEvent'}
    inventoryLotExpired:
      name: inventory.lot.expired
      title: Lot passed its expiry date and is blocked from sale (nightly job)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryLotEvent'}
    inventoryLotWrittenOff:
      name: inventory.lot.written_off
      title: Units written off (qty = units written off in this event)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryLotEvent'}
    inventoryReservationHeld:
      name: inventory.reservation.held
      title: All lines of an order reserved (checkout hold with TTL)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryReservationEvent'}
    inventoryReservationCommitted:
      name: inventory.reservation.committed
      title: Order shipped; cogsUsdMinor carries the landed cost of the shipped lots in US cents (cogs holds the amounts per currency paid)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryReservationEvent'}
    inventoryReservationReleased:
      name: inventory.reservation.released
      title: Hold released (status RELEASED on cancel / payment failure, EXPIRED after the TTL)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryReservationEvent'}
    inventoryReservationGroupCommitted:
      name: inventory.reservation.group_committed
      title: Some groups (one shipment's lines) shipped; lines = those groups' lines, cogs = their landed cost
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryReservationEvent'}
    inventoryReservationGroupReleased:
      name: inventory.reservation.group_released
      title: Some groups (one cancelled shipment's lines) released; other groups stay held
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryReservationEvent'}
    inventoryReconciliationDriftDetected:
      name: inventory.reconciliation.drift_detected
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload:
        type: object
        required: [runId, driftUnits, positions]
        properties:
          runId: {type: string, format: uuid}
          driftUnits: {type: integer, format: int64}
          positions: {type: integer, description: Number of positions with drift}
    inventoryInboundCreated:
      name: inventory.inbound.created
      title: A seller created an FBA inbound plan (WORKING)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryInboundShipment'}
    inventoryInboundShipped:
      name: inventory.inbound.shipped
      title: Expected units are on their way and count as inbound at the FC
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryInboundShipment'}
    inventoryInboundReceived:
      name: inventory.inbound.received
      title: Units received at the FC against an inbound shipment (one event per receipt)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryInboundReceived'}
    inventoryInboundClosed:
      name: inventory.inbound.closed
      title: Receiving finished; remaining expected units cancelled; discrepancies listed
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryInboundShipment'}
    inventoryInboundCancelled:
      name: inventory.inbound.cancelled
      title: Plan or shipment cancelled before receiving
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/InventoryInboundShipment'}
  schemas:
    InventoryInboundShipment:
      type: object
      required: [shipmentId, number, source, ownerOrg, nodeId, status, lines]
      properties:
        shipmentId: {type: string, format: uuid}
        number: {type: string, examples: [FBA-IN-006600, SHP-2610-GH01]}
        source: {type: string, enum: [FBA, RETAIL_ASN]}
        externalRef: {type: [string, 'null'], description: Retail shipment reference (RETAIL_ASN)}
        ownerOrg: {type: string, description: The seller org (FBA) or AfroTransact Retail}
        nodeId: {type: string, examples: [ATL-FC]}
        status: {type: string, enum: [WORKING, SHIPPED, RECEIVING, CLOSED, CANCELLED]}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        expectedUnits: {type: integer}
        receivedUnits: {type: integer}
        discrepancy: {type: boolean}
        lines:
          type: array
          items:
            type: object
            properties:
              sku: {type: string, description: Inventory SKU (FBA default = the seller's AT-FN code)}
              atin: {type: [string, 'null']}
              unitLabel: {type: [string, 'null'], description: AT-FN unit label code (ATF + 7)}
              expectedQty: {type: integer}
              receivedGood: {type: integer}
              receivedDamaged: {type: integer}
        discrepancies:
          type: array
          items:
            type: object
            properties:
              sku: {type: string}
              atin: {type: [string, 'null']}
              type: {type: string, enum: [SHORT, OVER, DAMAGED, UNEXPECTED]}
              expectedQty: {type: integer}
              receivedQty: {type: integer}
              qty: {type: integer}
        at: {type: string, format: date-time}
    InventoryInboundReceived:
      type: object
      required: [shipmentId, number, source, ownerOrg, nodeId, receiptRef, lines]
      properties:
        shipmentId: {type: string, format: uuid}
        number: {type: string}
        source: {type: string, enum: [FBA, RETAIL_ASN]}
        ownerOrg: {type: string}
        nodeId: {type: string}
        receiptRef: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [sku, qtyGood, qtyDamaged]
            properties:
              sku: {type: string}
              atin: {type: [string, 'null'], description: Variant ATIN from the plan (null for unplanned SKUs)}
              unitLabel: {type: [string, 'null']}
              qtyGood: {type: integer}
              qtyDamaged: {type: integer}
        at: {type: string, format: date-time}
    InventoryAvailabilityChanged:
      type: object
      required: [sku, nodeId, ownerOrg, available, onHand, reserved, version]
      properties:
        sku: {type: string}
        nodeId: {type: string, examples: [HOU-FC]}
        ownerOrg: {type: string, description: AfroTransact Retail for 1P, the seller org for FBA stock}
        available: {type: integer, description: on hand − reserved}
        onHand: {type: integer}
        reserved: {type: integer}
        inbound: {type: integer}
        damaged: {type: integer, description: Units present but blocked from sale (quarantine, damaged, expired)}
        version: {type: integer, format: int64, description: Position version; ignore events with an older version}
    InventoryLotEvent:
      type: object
      required: [lotId, sku, lotNo, nodeId, ownerOrg, qtyOnHand, qty, status, unitLandedCostMinor, currency]
      properties:
        lotId: {type: string, format: uuid}
        sku: {type: string}
        lotNo: {type: string}
        nodeId: {type: string}
        ownerOrg: {type: string}
        bin: {type: [string, 'null']}
        qtyOnHand: {type: integer}
        qty: {type: integer, description: Units affected by this event}
        status: {type: string, enum: [SELLABLE, QUARANTINE, EXPIRED, WRITTEN_OFF, DAMAGED]}
        mfgDate: {type: [string, 'null'], format: date}
        expDate: {type: [string, 'null'], format: date}
        unitLandedCostMinor: {type: integer, format: int64, description: Unit landed cost in minor units of `currency` (the currency the lot was paid in)}
        currency: {type: string, description: ISO 4217 code of the currency paid}
        unitCostUsdMinor: {type: integer, format: int64, description: Unit landed cost in US cents, fixed at receiving; finance books this}
        fxRateToUsd: {type: number, description: US dollars per 1 unit of `currency` used for the USD value}
        reason: {type: [string, 'null']}
        receiptRef: {type: [string, 'null']}
    InventoryReservationEvent:
      type: object
      required: [reservationId, orderId, status, lines]
      properties:
        reservationId: {type: string, format: uuid}
        orderId: {type: string}
        status: {type: string, enum: [HELD, COMMITTED, RELEASED, EXPIRED]}
        expiresAt: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null']}
        groups:
          type: [array, 'null']
          description: Groups a group_committed / group_released event is about; null for whole-order events
          items: {type: string}
        cogs:
          type: array
          description: COGS per currency the lots were paid in
          items: {$ref: '#/components/schemas/InventoryMoney'}
        cogsUsdMinor: {type: integer, format: int64, description: COGS in US cents (what margin and the GL use)}
        lines:
          type: array
          items:
            type: object
            properties:
              lineNo: {type: integer}
              sku: {type: string}
              nodeId: {type: string}
              qty: {type: integer}
              group: {type: [string, 'null'], description: Caller's grouping key (orders' line id)}
              status: {type: string, enum: [HELD, COMMITTED, RELEASED]}
              stockOwnerOrgId:
                type: [string, 'null']
                description: Owner of the reserved stock (AfroTransact Retail for 1P, the FBA seller otherwise)
              allocations:
                type: array
                items:
                  type: object
                  properties:
                    lotId: {type: string, format: uuid}
                    lotNo: {type: string}
                    qty: {type: integer}
                    expDate: {type: [string, 'null'], format: date}
                    unitLandedCostMinor: {type: integer, format: int64}
                    currency: {type: string}
                    unitCostUsdMinor: {type: integer, format: int64, description: Unit landed cost of the lot in US cents}
    InventoryMoney:
      type: object
      properties:
        currency: {type: string}
        amountMinor: {type: integer, format: int64}
