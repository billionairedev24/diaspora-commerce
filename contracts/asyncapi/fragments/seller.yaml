# AsyncAPI 3.0 fragment for seller-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  sellerApplicationEvents:
    address: at.seller-application.events
    description: >-
      Onboarding applications (key = application id). Headers event-id, event-type, occurred-at; consumers
      de-duplicate on event-id. notifications-service emails / texts the applicant; trust-ops audits decisions.
    messages:
      sellerApplicationSubmitted: {$ref: '#/components/messages/sellerApplicationSubmitted'}
      sellerApplicationFlagged: {$ref: '#/components/messages/sellerApplicationFlagged'}
      sellerApplicationInfoRequested: {$ref: '#/components/messages/sellerApplicationInfoRequested'}
      sellerApplicationApproved: {$ref: '#/components/messages/sellerApplicationApproved'}
      sellerApplicationRejected: {$ref: '#/components/messages/sellerApplicationRejected'}
      sellerApplicationAssigned: {$ref: '#/components/messages/sellerApplicationAssigned'}
      sellerApplicationEscalated: {$ref: '#/components/messages/sellerApplicationEscalated'}
      sellerDepartmentRequestDecided: {$ref: '#/components/messages/sellerDepartmentRequestDecided'}
      sellerOrgDepartmentsChanged: {$ref: '#/components/messages/sellerOrgDepartmentsChanged'}
      sellerSellingApplicationSubmitted: {$ref: '#/components/messages/sellerSellingApplicationSubmitted'}
      sellerSellingApplicationInfoRequested: {$ref: '#/components/messages/sellerSellingApplicationInfoRequested'}
      sellerSellingApplicationApproved: {$ref: '#/components/messages/sellerSellingApplicationApproved'}
      sellerSellingApplicationRejected: {$ref: '#/components/messages/sellerSellingApplicationRejected'}
  sellerOrgEvents:
    address: at.seller-org.events
    description: Seller and provider organisations (key = org id).
    messages:
      sellerOrgApproved: {$ref: '#/components/messages/sellerOrgApproved'}
      sellerOrgUpdated: {$ref: '#/components/messages/sellerOrgUpdated'}
      sellerPickupLocationUpdated: {$ref: '#/components/messages/sellerPickupLocationUpdated'}
  sellerComplianceEvents:
    address: at.seller-compliance.events
    description: >-
      Stripe Connect compliance mirror and automatic enforcement, plus Trust and Safety suspension holds (key = org
      id, so pause / resume and hide / restore for one organisation stay in order).
    messages:
      sellerComplianceChanged: {$ref: '#/components/messages/sellerComplianceChanged'}
      sellerComplianceReminder: {$ref: '#/components/messages/sellerComplianceReminder'}
      sellerPayoutsPaused: {$ref: '#/components/messages/sellerPayoutsPaused'}
      sellerPayoutsResumed: {$ref: '#/components/messages/sellerPayoutsResumed'}
      sellerListingsHidden: {$ref: '#/components/messages/sellerListingsHidden'}
      sellerListingsRestored: {$ref: '#/components/messages/sellerListingsRestored'}
      sellerSellingExpiryWarning: {$ref: '#/components/messages/sellerSellingExpiryWarning'}
      sellerSellingExpired: {$ref: '#/components/messages/sellerSellingExpired'}
      sellerSellingListingsPaused: {$ref: '#/components/messages/sellerSellingListingsPaused'}
      sellerSellingListingsRestored: {$ref: '#/components/messages/sellerSellingListingsRestored'}
      sellerSellingRuleChanged: {$ref: '#/components/messages/sellerSellingRuleChanged'}
  sellerSubscriptionEvents:
    address: at.seller-subscription.events
    description: Plan subscriptions on Stripe Billing, and the rewards and staff adjustments applied to them (key = org id).
    messages:
      sellerSubscriptionChanged: {$ref: '#/components/messages/sellerSubscriptionChanged'}
      sellerBillingGrantApplied: {$ref: '#/components/messages/sellerBillingGrantApplied'}
operations:
  publishSellerApplicationEvents:
    action: send
    channel: {$ref: '#/channels/sellerApplicationEvents'}
    summary: >-
      seller-service publishes application lifecycle events via its transactional outbox. notifications-service
      tells the applicant (submitted, info requested with the requested items, approved, rejected); staff-console
      badges count flagged applications. seller.department_request.decided and seller.org.departments_changed (key = org
      id) record staff decisions on the catalog departments an organisation may sell in; trust-ops audits both.
  publishSellerOrgEvents:
    action: send
    channel: {$ref: '#/channels/sellerOrgEvents'}
    summary: >-
      seller.org.approved: identity-service (consumer group identity-service, inbox-deduplicated) mirrors the
      organisation with the seller org id (org_…) as its id and grants applicantUserId and ownerUserIds the
      seller.owner / provider.owner role, so the next token carries the org claim (unlocking Seller Center / Provider
      Hub). seller.org.updated: indexer refreshes the seller display name on indexed documents (and its directory,
      which it warms on start from GET /v1/orgs/directory, scope sellers:directory), cart refreshes it;
      identity mirrors name, status and market. Also published when Trust and Safety suspends (status SUSPENDED) or
      reinstates (status back to APPROVED) an organisation. seller.pickup_location.updated (S255): an AfroTransact
      Delivery pickup location was enabled, moved, disabled or deleted; offers and fulfilment may follow it (checkout
      re-reads the location from GET /v1/ship-from-locations/{id} anyway).
  receiveSellerIdentityRoleEvents:
    action: receive
    channel: {$ref: '#/channels/identityEvents'}
    summary: >-
      S236: seller-service (consumer group seller-service, inbox-deduplicated) keeps its org_member list consistent
      with identity, the source of truth for organisation members. identity.role.granted with orgId adds the member or
      changes its role (unless the stored row is newer); identity.role.revoked with orgId removes the member while it
      still holds that role. Organisations seller does not know and roles without orgId are ignored.
  publishSellerComplianceEvents:
    action: send
    channel: {$ref: '#/channels/sellerComplianceEvents'}
    summary: >-
      seller.compliance.changed / reminder: notifications-service sends email + SMS + in-app banner (consent and quiet
      hours respected). seller.payouts.paused / resumed: payments-service holds or releases payouts (payout requests
      and approvals fail with 422 payments.payouts_paused while held). seller.listings.hidden / restored: catalog
      suppresses the org's products from public reads and republishes them as catalog.product.hidden / restored (the
      indexer follows those), offers and bookings hide or show the org's listings and services.
      Trust and Safety suspension (POST /v1/orgs/{orgId}/suspend, sellers:enforce) is a separate hold: it publishes
      seller.listings.hidden and seller.payouts.paused with reason SUSPENDED; reinstatement publishes
      seller.payouts.resumed / seller.listings.restored with reason REINSTATED only when no Stripe compliance hold
      still requires them, and compliance releases (CLEARED, MANUAL) are held back while the organisation is
      suspended. Consumers keep treating these as one latest-wins hold per organisation.
      Selling approvals (docs/runbooks/selling-approvals.md) also publish here, keyed by organisation (rule changes by rule
      id): seller.selling.approval.expiry_warning (30, 14 and 7 days before the earliest document expires; recipientUserIds
      are the organisation's owners) and seller.selling.approval.expired tell the seller; seller.selling.listings.paused
      (reason EXPIRED once the 14 days of grace are over, PERFORMANCE or REVOKED by staff) and
      seller.selling.listings.restored (RENEWED, STAFF_RESTORED) make catalog pause or resume that organisation's listings in the
      scope (status PAUSED with a hold that says why, never deleted; catalog publishes catalog.product.paused / resumed, which
      the indexer follows); seller.selling.rule.changed makes catalog re-check every listing of the scope against its seller's
      approvals. Catalog reads them with its own consumer group next to the compliance consumer.
  publishSellerSubscriptionEvents:
    action: send
    channel: {$ref: '#/channels/sellerSubscriptionEvents'}
    summary: >-
      Plan changes, trials, dunning and staff migrations to a new plan version (change MIGRATED); identity / feature
      limits and finance consume them. seller.billing.grant_applied (S296-S297): a reward rule or a staff adjustment
      (credit, free days, discount, waived invoice, trial change) was applied at Stripe; notifications-service emails
      the organisation's owners (seller.billing.reward_earned / seller.billing.credit_granted).
  receiveSellerRewardMetrics:
    action: receive
    channel: {$ref: '#/channels/ordersOrderEvents'}
    summary: >-
      S296: seller-service (consumer group seller-service, inbox consumer seller.reward-metrics) counts
      orders.shipment.delivered per sellerOrgId (gross sales in USD cents, completed orders) for reward rules, then
      evaluates the organisation's live rules on those metrics.
  receiveSellerRewardBookings:
    action: receive
    channel: {$ref: '#/channels/bookingsEvents'}
    summary: S296 reward rules count booking.completed per orgId (completed bookings, providers).
  receiveSellerRewardListings:
    action: receive
    channel: {$ref: '#/channels/offersEvents'}
    summary: >-
      S296 reward rules track offers.offer.created / updated / withdrawn per sellerOrgId: a listing is active while
      the offer is ACTIVE and its product live.
components:
  messages:
    sellerApplicationSubmitted:
      name: seller.application.submitted
      title: Application submitted (or resubmitted after a request for info; see submissionCount)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerApplicationEvent'}
    sellerApplicationFlagged:
      name: seller.application.flagged
      title: Reviewer flagged failed checks for the final approver
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerApplicationEvent'}
    sellerApplicationInfoRequested:
      name: seller.application.info_requested
      title: Reviewer asked the applicant for documents or fields (requestedItems)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerApplicationEvent'}
    sellerApplicationApproved:
      name: seller.application.approved
      title: Final approval by a second person
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerApplicationEvent'}
    sellerApplicationRejected:
      name: seller.application.rejected
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerApplicationEvent'}
    sellerSellingApplicationSubmitted:
      name: seller.selling.application.submitted
      title: A seller applied to sell in a scope (or renewed an approval)
      summary: >-
        On at.seller-application.events, key = application id. The staff case is in the Selling approvals queue; notifications may confirm to the applicant.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerSellingApplicationInfoRequested:
      name: seller.selling.application.info_requested
      title: Staff asked the seller for more documents
      summary: >-
        requestedItems and the staff message (reason) are for the seller; recipientUserIds is the applicant.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerSellingApplicationApproved:
      name: seller.selling.application.approved
      title: The seller is approved for the scope; every listing there may go live
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerSellingApplicationRejected:
      name: seller.selling.application.rejected
      title: 'The application was not approved, or the seller cannot apply (disqualified: not appealable, reapplyAfter set)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerSellingExpiryWarning:
      name: seller.selling.approval.expiry_warning
      title: A document of an approval expires in 30, 14 or 7 days
      summary: >-
        Sent once per threshold (a job that was down skips the thresholds already passed). daysLeft and expiresAt say when.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerSellingExpired:
      name: seller.selling.approval.expired
      title: An approval expired; its listings stay up for 14 days of grace, then are paused
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerSellingListingsPaused:
      name: seller.selling.listings.paused
      title: Pause the organisation's listings in the scope (never delete)
      summary: >-
        reason EXPIRED (grace over), PERFORMANCE (staff pause) or REVOKED. staffRecipientUserIds are told too. For a CAPABILITY scope categoryCodes lists the categories it covers.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerSellingListingsRestored:
      name: seller.selling.listings.restored
      title: Bring back the listings paused for the scope
      summary: >-
        reason RENEWED (renewal approved) or STAFF_RESTORED. A listing the seller paused themselves stays paused.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerSellingRuleChanged:
      name: seller.selling.rule.changed
      title: A selling rule was created or edited; re-check the scope's listings
      summary: >-
        Key = rule id; orgId is null. status is the rule's new level (SELL, APPLY or NOT_AVAILABLE).
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSellingEvent'}
    sellerApplicationAssigned:
      name: seller.application.assigned
      title: 'Internal staff notification - a case was assigned to you, handed to the approval pool, or sent back to review'
      summary: >-
        Staff only, never the applicant. One event lists every recipient (recipientUserIds): the assignee, or the people
        who can act on the case when it is unassigned (all holders of the stage permission, minus the applicant and,
        at approval, the step 1 reviewer; a send-back also names the previous reviewer). reason is ASSIGNED,
        AUTO_ASSIGNED, READY_FOR_APPROVAL or SENT_BACK.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerApplicationAssignmentEvent'}
    sellerApplicationEscalated:
      name: seller.application.escalated
      title: 'Internal staff notification - a case reached escalation level 1 or 2'
      summary: Staff only. recipientUserIds are the people the level's role and named targets resolve to.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerApplicationAssignmentEvent'}
    sellerOrgApproved:
      name: seller.org.approved
      title: Organisation approved — unlock the back office for its owners
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerOrgEvent'}
    sellerOrgUpdated:
      name: seller.org.updated
      title: Organisation name or status changed (display name for search and carts)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerOrgEvent'}
    sellerPickupLocationUpdated:
      name: seller.pickup_location.updated
      title: AfroTransact Delivery pickup location enabled, moved, disabled or deleted (S255)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerPickupLocationUpdated'}
    sellerComplianceChanged:
      name: seller.compliance.changed
      title: Stripe requirements or account health changed
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerComplianceChanged'}
    sellerComplianceReminder:
      name: seller.compliance.reminder
      title: Reminder 7, 3 or 1 day(s) before current_deadline, or sent by staff (manual)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerComplianceReminder'}
    sellerPayoutsPaused:
      name: seller.payouts.paused
      title: >-
        Hold payouts (past-due requirements, staff hold, disconnected account or Trust and Safety suspension); funds
        keep accruing
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerEnforcement'}
    sellerPayoutsResumed:
      name: seller.payouts.resumed
      title: >-
        Release held payouts (requirements cleared, released by staff, or seller reinstated with no compliance hold
        left)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerEnforcement'}
    sellerListingsHidden:
      name: seller.listings.hidden
      title: Charges disabled, account disconnected or seller suspended — hide listings and bookings from the storefront
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerEnforcement'}
    sellerListingsRestored:
      name: seller.listings.restored
      title: Show listings again (charges re-enabled, or seller reinstated while no compliance hold hides them)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerEnforcement'}
    sellerDepartmentRequestDecided:
      name: seller.department_request.decided
      title: Staff approved or rejected a seller's department request (audit - who, what, why; key = org id)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerDepartmentRequestDecided'}
    sellerOrgDepartmentsChanged:
      name: seller.org.departments_changed
      title: Staff replaced the departments an organisation may sell in, with a reason (audit; key = org id)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerOrgDepartmentsChanged'}
    sellerSubscriptionChanged:
      name: seller.subscription.changed
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerSubscriptionChanged'}
    sellerBillingGrantApplied:
      name: seller.billing.grant_applied
      title: A reward or staff billing adjustment was applied at Stripe
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/SellerBillingGrantApplied'}
  schemas:
    SellerPickupLocationUpdated:
      type: object
      required: [orgId, locationId, enabled, deleted, occurredAt]
      properties:
        orgId: {type: string}
        locationId: {type: string, format: uuid, description: Ship-from address id (offers reference it)}
        label: {type: string}
        enabled: {type: boolean, description: AfroTransact pickup is on (false when disabled or deleted)}
        deleted: {type: boolean}
        lat: {type: [number, 'null']}
        lng: {type: [number, 'null']}
        zoneName: {type: [string, 'null'], description: DELIVERY zone covering or nearest to the location}
        city: {type: string}
        state: {type: string}
        postalCode: {type: string}
        country: {type: string}
        hours:
          type: array
          items:
            type: object
            properties:
              day: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
              opens: {type: string, description: 'Local time HH:MM', example: '09:00'}
              closes: {type: string, description: 'Local time HH:MM', example: '17:00'}
        occurredAt: {type: string, format: date-time}
    SellerApplicationEvent:
      type: object
      required: [applicationId, reference, orgId, kind, applicantUserId, status, action, actorId, occurredAt]
      properties:
        applicationId: {type: string, examples: [app_3k2j…]}
        reference: {type: string, examples: [APP-30201]}
        orgId: {type: string, examples: [org_9x8…]}
        kind: {type: string, enum: [SELLER, PROVIDER]}
        applicantUserId: {type: string}
        status: {type: string, enum: [PENDING_REVIEW, FLAGGED, AWAITING_FINAL_APPROVAL, INFO_REQUESTED, APPROVED, REJECTED]}
        action: {type: string, enum: [SUBMITTED, RESUBMITTED, FLAG, REQUEST_INFO, FINAL_APPROVE, REJECT]}
        actorId: {type: string}
        reasonCode: {type: [string, 'null'], examples: [PERMIT_MISSING]}
        note: {type: [string, 'null']}
        failedChecks: {type: array, items: {type: string}}
        requestedItems: {type: array, items: {type: string}}
        reviewerId: {type: [string, 'null']}
        finalApproverId: {type: [string, 'null']}
        displayName: {type: [string, 'null']}
        submissionCount: {type: integer}
        occurredAt: {type: string, format: date-time}
    SellerSellingEvent:
      type: object
      required: [scopeType, scopeKey, occurredAt]
      properties:
        orgId: {type: [string, 'null'], description: Null for seller.selling.rule.changed}
        scopeType: {type: string, enum: [CATEGORY, PRODUCT_TYPE, BRAND, BRAND_IN_CATEGORY, PRODUCT, CAPABILITY]}
        scopeKey: {type: string, description: 'Category or product type code, normalised brand, "brand|category", barcode, or a capability such as FOOD_SERVICE'}
        scopeLabel: {type: [string, 'null']}
        applicationId: {type: [string, 'null']}
        reference: {type: [string, 'null'], examples: [SA-50001]}
        status: {type: [string, 'null'], description: 'Application or approval status; for a rule change the rule level'}
        reason: {type: [string, 'null'], description: 'Why: a staff message, EXPIRED, PERFORMANCE, REVOKED, RENEWED, RULE...'}
        note: {type: [string, 'null']}
        requestedItems: {type: array, items: {type: string}}
        disqualified: {type: boolean}
        reapplyAfter: {type: [string, 'null'], format: date}
        expiresAt: {type: [string, 'null'], format: date-time}
        daysLeft: {type: [integer, 'null']}
        recipientUserIds: {type: array, items: {type: string}, description: The seller people to tell (the applicant, or the organisation's owners)}
        staffRecipientUserIds: {type: array, items: {type: string}, description: Staff to tell (supervisors) on pauses}
        categoryCodes: {type: array, items: {type: string}, description: For a CAPABILITY scope, the categories it covers}
        occurredAt: {type: string, format: date-time}
    SellerApplicationAssignmentEvent:
      type: object
      required: [applicationId, reference, kind, reason, recipientUserIds, occurredAt]
      properties:
        applicationId: {type: string}
        reference: {type: string, examples: [APP-30201]}
        displayName: {type: [string, 'null']}
        kind: {type: string, enum: [SELLER, PROVIDER, SELLING_APPROVAL], description: SELLING_APPROVAL for a selling approval case}
        stage: {type: [string, 'null'], enum: [REVIEW, APPROVAL, null]}
        reason: {type: string, enum: [ASSIGNED, AUTO_ASSIGNED, READY_FOR_APPROVAL, SENT_BACK, ESCALATED]}
        assigneeId: {type: [string, 'null']}
        assigneeName: {type: [string, 'null']}
        actorName: {type: [string, 'null'], description: 'Who made the change: a name, Auto-assignment or Escalation'}
        recipientUserIds: {type: array, items: {type: string}}
        level: {type: integer, description: Escalation level (0 for assignments)}
        note: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
    SellerOrgEvent:
      type: object
      required: [orgId, kind, status, occurredAt]
      properties:
        orgId: {type: string}
        kind:
          type: string
          enum: [SELLER, PROVIDER, BOTH]
          description: BOTH (S215) when the organisation sells products and offers services (offering BOTH)
        primaryKind:
          type: string
          enum: [SELLER, PROVIDER]
          description: Portal it onboarded through; decides the owner role (seller.owner / provider.owner) for BOTH
        offering: {type: [string, 'null'], enum: [PRODUCTS, SERVICES, BOTH, null], description: What it sells; null before approval}
        legalName: {type: [string, 'null']}
        displayName: {type: [string, 'null']}
        country: {type: [string, 'null']}
        status: {type: string, enum: [DRAFT, PENDING_REVIEW, FLAGGED, AWAITING_FINAL_APPROVAL, INFO_REQUESTED, APPROVED, REJECTED, SUSPENDED]}
        ownerUserIds: {type: array, items: {type: string}, description: Identity user ids of the organisation's owners}
        applicantUserId:
          type: [string, 'null']
          description: >-
            Identity user id of the applicant whose application was approved (seller.org.approved); null on
            seller.org.updated. identity-service grants it seller.owner / provider.owner and sets it as the user's
            active organisation when they have none.
        occurredAt: {type: string, format: date-time}
    SellerComplianceChanged:
      type: object
      required: [orgId, accountId, status, trigger, channels, occurredAt]
      properties:
        orgId: {type: string}
        accountId: {type: string, examples: [acct_1Pm8…]}
        status: {type: string, enum: [COMPLIANT, ACTION_NEEDED, RESTRICTED_SOON, RESTRICTED, VERIFYING]}
        previousStatus: {type: [string, 'null']}
        currentlyDue: {type: array, items: {type: string}}
        pastDue: {type: array, items: {type: string}}
        eventuallyDue: {type: array, items: {type: string}}
        pendingVerification: {type: array, items: {type: string}}
        newItems: {type: array, items: {type: string}, description: Requirements that just became due (notify)}
        currentDeadline: {type: [string, 'null'], format: date-time}
        disabledReason: {type: [string, 'null']}
        chargesEnabled: {type: boolean}
        payoutsEnabled: {type: boolean}
        payoutsPaused: {type: boolean}
        trigger: {type: string, examples: [account.updated, answer, payout.failed, external_account.errored, deauthorized]}
        channels: {type: array, items: {type: string, enum: [email, sms, in_app]}}
        occurredAt: {type: string, format: date-time}
    SellerComplianceReminder:
      type: object
      required: [orgId, accountId, manual, openItems, channels, occurredAt]
      properties:
        orgId: {type: string}
        accountId: {type: string}
        thresholdDays: {type: [integer, 'null'], enum: [7, 3, 1, null]}
        manual: {type: boolean}
        actorId: {type: [string, 'null']}
        openItems: {type: array, items: {type: string}}
        currentDeadline: {type: [string, 'null'], format: date-time}
        channels: {type: array, items: {type: string}}
        occurredAt: {type: string, format: date-time}
    SellerEnforcement:
      type: object
      required: [orgId, accountId, reason, occurredAt]
      properties:
        orgId: {type: string}
        accountId:
          type: [string, 'null']
          description: Stripe connected account; null for a suspension of an organisation that has none yet
        reason:
          type: string
          enum: [AUTO_PAST_DUE, MANUAL, DEAUTHORIZED, CHARGES_DISABLED, CLEARED, SUSPENDED, REINSTATED]
          description: >-
            SUSPENDED / REINSTATED come from Trust and Safety suspension (seller-service /v1/orgs/{orgId}/suspend and
            /reinstate); the others from Stripe compliance enforcement.
        actorId:
          type: [string, 'null']
          description: Staff member or service client (trust-ops-service) for manual holds, suspensions and releases
