# AsyncAPI 3.0 fragment for payments-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  paymentsPaymentEvents:
    address: at.payment.events
    description: >-
      Payment lifecycle, captures, refunds, settlement transfers and chargebacks from payments-service
      (key = order id, so one order's money events stay in order). Headers event-id, event-type, occurred-at;
      consumers de-duplicate on event-id.
    messages:
      paymentsIntentCreated: {$ref: '#/components/messages/paymentsIntentCreated'}
      paymentsIntentSucceeded: {$ref: '#/components/messages/paymentsIntentSucceeded'}
      paymentsIntentFailed: {$ref: '#/components/messages/paymentsIntentFailed'}
      paymentsIntentCanceled: {$ref: '#/components/messages/paymentsIntentCanceled'}
      paymentsIntentActionRequired: {$ref: '#/components/messages/paymentsIntentActionRequired'}
      paymentsAuthorizationReleased: {$ref: '#/components/messages/paymentsAuthorizationReleased'}
      paymentsCaptured: {$ref: '#/components/messages/paymentsCaptured'}
      paymentsRefunded: {$ref: '#/components/messages/paymentsRefunded'}
      paymentsTransferCreated: {$ref: '#/components/messages/paymentsTransferCreated'}
      paymentsDisputeOpened: {$ref: '#/components/messages/paymentsDisputeOpened'}
      paymentsDisputeClosed: {$ref: '#/components/messages/paymentsDisputeClosed'}
  paymentsPayoutEvents:
    address: at.payout.events
    description: >-
      Payout requests on manual Connect payout schedules and provider fees debited from connected accounts
      (key = organisation id).
    messages:
      paymentsPayoutRequested: {$ref: '#/components/messages/paymentsPayoutRequested'}
      paymentsPayoutApproved: {$ref: '#/components/messages/paymentsPayoutApproved'}
      paymentsPayoutPaid: {$ref: '#/components/messages/paymentsPayoutPaid'}
      paymentsPayoutFailed: {$ref: '#/components/messages/paymentsPayoutFailed'}
      paymentsProviderFeeRecorded: {$ref: '#/components/messages/paymentsProviderFeeRecorded'}
      paymentsProviderFeeCollected: {$ref: '#/components/messages/paymentsProviderFeeCollected'}
operations:
  consumePaymentsSellerComplianceEvents:
    action: receive
    channel: {$ref: '#/channels/sellerComplianceEvents'}
    summary: >-
      payments-service (consumer group payments-service, inbox-deduplicated) handles seller.payouts.paused / resumed:
      the organisation's payout_hold is set or cleared (older decisions never override newer ones). While paused,
      POST /v1/payouts/requests and approvals fail with 422 payments.payouts_paused; balances keep accruing.
  consumePaymentsBookingsEvents:
    action: receive
    channel: {$ref: '#/channels/bookingsEvents'}
    summary: >-
      payments-service (consumer group payments-service, listener payments-bookings-events, inbox consumer
      payments.bookings-events) handles booking.cancelled with cancelledBy = PROVIDER and providerFeeMinor > 0: the late
      provider-cancellation fee is recorded once per booking (inbox on event-id plus a unique booking id), accrued in the
      ledger (Dr 1200:<org> / Cr 4300) and debited from the provider's Stripe connected account with an account debit
      (Dr 1000 / Cr 1200:<org>). Fees that cannot be debited yet stay OUTSTANDING, are retried after settlement
      transfers and are reserved out of the payout balance. Every other booking event is ignored.
  publishPaymentsPaymentEvents:
    action: send
    channel: {$ref: '#/channels/paymentsPaymentEvents'}
    summary: >-
      payments-service publishes via its transactional outbox. The orders saga confirms on intent.succeeded and
      compensates on intent.failed; notifications tells sellers about chargebacks; finance reporting reads captures.
      Off-session follow-up charges of an order (long-dated bookings) publish intent events with the same key and
      parentPaymentId set; payments.intent.action_required asks notifications to bring the customer back to confirm
      the charge (3-D Secure / SCA).
  publishPaymentsPayoutEvents:
    action: send
    channel: {$ref: '#/channels/paymentsPayoutEvents'}
    summary: Seller / provider payouts and provider fees for the portals, notifications and Finance.
components:
  messages:
    paymentsIntentCreated:
      name: payments.intent.created
      title: 'PaymentIntent created for an order (manual capture)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsIntentEvent'}
    paymentsIntentSucceeded:
      name: payments.intent.succeeded
      title: 'Funds authorised (requires_capture): the order can be confirmed'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsIntentEvent'}
    paymentsIntentFailed:
      name: payments.intent.failed
      title: 'Payment attempt failed (declined); the shopper may retry'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsIntentEvent'}
    paymentsIntentCanceled:
      name: payments.intent.canceled
      title: 'Uncaptured intent cancelled; authorisation released'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsIntentEvent'}
    paymentsIntentActionRequired:
      name: payments.intent.action_required
      title: 'Off-session charge needs the customer to authenticate (SCA); confirm on-session with the client secret'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsIntentActionRequired'}
    paymentsAuthorizationReleased:
      name: payments.authorization.released
      title: 'Uncaptured rest of an authorisation released (e.g. booking cancelled or no-show after the deposit capture)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsAuthorizationReleased'}
    paymentsCaptured:
      name: payments.captured
      title: 'One shipment captured and its journal posted'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsCaptured'}
    paymentsRefunded:
      name: payments.refunded
      title: 'Line-level refund issued (with any transfer reversals)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsRefunded'}
    paymentsTransferCreated:
      name: payments.transfer.created
      title: 'Seller net transferred to the connected account after the settlement hold'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsTransferCreated'}
    paymentsDisputeOpened:
      name: payments.dispute.opened
      title: 'Chargeback opened; responsible sellers debited (notify them)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsDispute'}
    paymentsDisputeClosed:
      name: payments.dispute.closed
      title: 'Chargeback closed as WON or LOST'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsDispute'}
    paymentsPayoutRequested:
      name: payments.payout.requested
      title: 'Seller / provider requested a payout'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsPayout'}
    paymentsPayoutApproved:
      name: payments.payout.approved
      title: 'Finance approved; Stripe payout created (IN_TRANSIT)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsPayout'}
    paymentsPayoutPaid:
      name: payments.payout.paid
      title: 'Payout arrived (payout.paid)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsPayout'}
    paymentsPayoutFailed:
      name: payments.payout.failed
      title: 'Payout failed; amount is available again'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsPayout'}
    paymentsProviderFeeRecorded:
      name: payments.provider_fee.recorded
      title: 'Provider fee (late provider cancellation) recorded and accrued; status OUTSTANDING or COLLECTED'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsProviderFee'}
    paymentsProviderFeeCollected:
      name: payments.provider_fee.collected
      title: 'Provider fee debited from the connected account (Stripe account debit)'
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PaymentsProviderFee'}
  schemas:
    PaymentsIntentEvent:
      type: object
      required: [paymentId, orderId, status, amountMinor, capturedMinor, refundedMinor, currency]
      properties:
        paymentId: {type: string, format: uuid}
        orderId: {type: string}
        stripePaymentIntentId: {type: [string, 'null']}
        status:
          type: string
          enum: [REQUIRES_PAYMENT_METHOD, REQUIRES_CONFIRMATION, REQUIRES_ACTION, PROCESSING, AUTHORIZED,
                 PARTIALLY_CAPTURED, CAPTURED, CANCELED, FAILED]
        amountMinor: {type: integer, format: int64, description: Minor units (cents)}
        capturedMinor: {type: integer, format: int64}
        refundedMinor: {type: integer, format: int64}
        currency: {type: string, examples: [USD]}
        failureMessage: {type: [string, 'null'], description: Decline message and code for intent.failed}
        parentPaymentId:
          type: [string, 'null']
          format: uuid
          description: Set for an off-session follow-up charge of the order (the order's primary payment)
        offSession: {type: boolean, description: True for an off-session follow-up charge}
    PaymentsIntentActionRequired:
      type: object
      required: [paymentId, orderId, parentPaymentId, customerId, amountMinor, currency, reason]
      properties:
        paymentId: {type: string, format: uuid, description: The off-session charge}
        orderId: {type: string, description: 'Order / booking reference (BK-…)'}
        parentPaymentId: {type: string, format: uuid}
        customerId: {type: string, description: AfroTransact customer id (token subject) to notify}
        stripePaymentIntentId: {type: [string, 'null']}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        reason: {type: string, examples: [authentication_required]}
        lineIds:
          type: array
          items: {type: string}
    PaymentsAuthorizationReleased:
      type: object
      required: [paymentId, orderId, status, amountMinor, capturedMinor, releasedMinor, currency]
      properties:
        paymentId: {type: string, format: uuid}
        orderId: {type: string}
        stripePaymentIntentId: {type: [string, 'null']}
        status: {type: string, enum: [CAPTURED, CANCELED]}
        amountMinor: {type: integer, format: int64}
        capturedMinor: {type: integer, format: int64}
        releasedMinor: {type: integer, format: int64, description: Authorised amount released without capture}
        currency: {type: string}
        reason: {type: [string, 'null']}
        parentPaymentId: {type: [string, 'null'], format: uuid}
    PaymentsCaptured:
      type: object
      required: [paymentId, orderId, captureId, shipmentId, amountMinor, stripeFeeMinor, currency, recipients]
      properties:
        paymentId: {type: string, format: uuid}
        orderId: {type: string}
        captureId: {type: string, format: uuid}
        shipmentId: {type: string}
        amountMinor: {type: integer, format: int64}
        stripeFeeMinor: {type: integer, format: int64}
        feeEstimated: {type: boolean, description: Stripe had not reported the fee yet; the card-fee estimate was used}
        currency: {type: string}
        stripeChargeId: {type: [string, 'null']}
        finalCapture: {type: boolean}
        journalId: {type: string, format: uuid}
        recipients:
          type: array
          items:
            type: object
            properties:
              recipientId: {type: string, description: 'Seller org id, AfroTransact Retail, or afrotransact (platform)'}
              kind: {type: string, enum: [SELLER, RETAIL, PLATFORM]}
              netMinor: {type: integer, format: int64}
              commissionMinor: {type: integer, format: int64}
              taxMinor: {type: integer, format: int64}
              stripeFeeMinor: {type: integer, format: int64}
    PaymentsRefunded:
      type: object
      required: [paymentId, orderId, refundId, amountMinor, currency, status, lines]
      properties:
        paymentId: {type: string, format: uuid}
        orderId: {type: string}
        refundId: {type: string, format: uuid}
        stripeRefundId: {type: string}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string, enum: [PENDING, SUCCEEDED, FAILED]}
        reason: {type: [string, 'null']}
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: {type: string}
              sellerOrg: {type: string}
              itemsMinor: {type: integer, format: int64}
              shippingMinor: {type: integer, format: int64}
              taxMinor: {type: integer, format: int64}
              commissionReversedMinor: {type: integer, format: int64}
        reversals:
          type: array
          items:
            type: object
            properties:
              orgId: {type: string}
              stripeTransferId: {type: string}
              stripeReversalId: {type: string}
              amountMinor: {type: integer, format: int64}
    PaymentsTransferCreated:
      type: object
      required: [orderId, orgId, transferId, stripeTransferId, amountMinor, currency, transferGroup]
      properties:
        orderId: {type: string}
        orgId: {type: string}
        transferId: {type: string, format: uuid}
        stripeTransferId: {type: string}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        transferGroup: {type: string, description: Equals the order id}
    PaymentsDispute:
      type: object
      required: [disputeId, paymentId, orderId, amountMinor, currency, status, allocations]
      properties:
        disputeId: {type: string}
        paymentId: {type: string, format: uuid}
        orderId: {type: string}
        chargeId: {type: [string, 'null']}
        amountMinor: {type: integer, format: int64}
        feeMinor: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string, enum: [OPEN, WON, LOST]}
        reason: {type: string}
        allocations:
          type: array
          description: Part of the disputed amount borne by each responsible seller (afrotransact = platform)
          items:
            type: object
            properties:
              recipientId: {type: string}
              amountMinor: {type: integer, format: int64}
    PaymentsPayout:
      type: object
      required: [payoutRequestId, orgId, amountMinor, currency, status]
      properties:
        payoutRequestId: {type: string, format: uuid}
        orgId: {type: string}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string, enum: [REQUESTED, HELD, IN_TRANSIT, PAID, FAILED]}
        stripePayoutId: {type: [string, 'null']}
        failureMessage: {type: [string, 'null']}
        requestedAt: {type: string, format: date-time}
    PaymentsProviderFee:
      type: object
      required: [feeId, orgId, bookingId, amountMinor, currency, reason, status]
      properties:
        feeId: {type: string, format: uuid}
        orgId: {type: string}
        bookingId: {type: string}
        bookingReference: {type: [string, 'null']}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        reason: {type: string, enum: [LATE_PROVIDER_CANCELLATION]}
        status: {type: string, enum: [OUTSTANDING, COLLECTED]}
        stripeDebitId: {type: [string, 'null'], description: 'Stripe account debit (py_…) once collected'}
        lastError: {type: [string, 'null'], description: Why the last collection attempt failed}
