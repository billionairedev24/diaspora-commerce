# AsyncAPI 3.0 fragment for carrier-gateway. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  carrierShipmentEvents:
    address: at.carrier-shipment.events
    description: >-
      Carrier tracking, label and pickup-ready events from carrier-gateway, written to its Postgres outbox in the same
      transaction as the tracking or label state and relayed by a SKIP LOCKED dispatcher (at-least-once). Key =
      "<carrier>:<trackingNumber>" (or "pickup:<orderRef>"), so one parcel's label purchase, scans and void stay in order.
      Headers event-id, event-type, occurred-at. Consumers de-duplicate on event-id. Tracking events are only published
      for scans newer than the last applied one; orders applies `state` to the shipment state machine (carriers may only
      move transit steps).
    messages:
      carrierTrackingUpdated: {$ref: '#/components/messages/carrierTrackingUpdated'}
      carrierPickupReady: {$ref: '#/components/messages/carrierPickupReady'}
      carrierLabelPurchased: {$ref: '#/components/messages/carrierLabelPurchased'}
      carrierLabelVoided: {$ref: '#/components/messages/carrierLabelVoided'}
operations:
  publishCarrierShipmentEvents:
    action: send
    channel: {$ref: '#/channels/carrierShipmentEvents'}
    summary: >-
      carrier-gateway publishes normalised tracking from UPS Track Alert, FedEx and DHL pushes and USPS polling, and
      pickup-ready notices for counters, lockers and seller pickup, and every label bought or voided through it.
      Consumed by orders (shipment states, promise measurement), notifications (customer updates) and payments (label
      charges: a label with billTo SELLER is debited from the seller's payable and credited back once when voided).
components:
  messages:
    carrierTrackingUpdated:
      name: carrier.tracking.updated
      title: A carrier scan was applied to a tracked parcel
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CarrierTrackingUpdated'}
    carrierPickupReady:
      name: carrier.pickup.ready
      title: An order is ready for collection at a pickup location
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CarrierPickupReady'}
    carrierLabelPurchased:
      name: carrier.label.purchased
      title: A label was bought through carrier-gateway
      summary: >-
        Written once per label, in the transaction that completes the purchase (an idempotent replay of POST /v1/labels
        publishes nothing). billTo SELLER means the buying organisation pays amountMinor (carrier cost + handling).
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CarrierLabelEvent'}
    carrierLabelVoided:
      name: carrier.label.voided
      title: A purchased label was voided at the carrier
      summary: >-
        Written once per label, in the transaction that marks it voided (a second void is refused with 409). Carries the
        same billing fields as the purchase, so a seller-billed label's charge can be credited back.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CarrierLabelEvent'}
  schemas:
    CarrierShipmentState:
      type: string
      enum: [label_created, picked_up, in_transit, out_for_delivery, delivered, delivery_failed, returned, exception]
    CarrierTrackingUpdated:
      type: object
      required: [carrier, trackingNumber, state, stateChanged, event]
      properties:
        carrier: {type: string, enum: [usps, ups, fedex, dhl]}
        trackingNumber: {type: string}
        labelId: {type: [string, 'null'], format: uuid, description: Set when the label was bought through carrier-gateway}
        reference: {type: [string, 'null'], description: Order/package reference given when buying or registering the label}
        state: {$ref: '#/components/schemas/CarrierShipmentState'}
        previousState: {type: [string, 'null']}
        stateChanged: {type: boolean}
        event:
          type: object
          required: [eventId, occurredAt]
          properties:
            eventId: {type: string, description: Carrier event id or a stable hash of carrier fields (same scan via push and poll de-duplicates)}
            code: {type: string, description: Carrier status code (USPS eventCode, UPS type/code, FedEx eventType, DHL typeCode)}
            description: {type: string}
            state: {type: string}
            occurredAt: {type: string, format: date-time, description: Carrier timestamp (UTC)}
            location: {type: string}
            sequence: {type: integer}
    CarrierPickupReady:
      type: object
      required: [locationId, orderRef, customerRef, readyAt]
      properties:
        locationId: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [PLATFORM_COUNTER, LOCKER, SELLER]}
        address:
          type: object
          properties:
            line1: {type: string}
            line2: {type: string}
            city: {type: string}
            state: {type: string}
            postalCode: {type: string}
            country: {type: string}
        hours:
          type: array
          items:
            type: object
            properties:
              weekday: {type: integer}
              open: {type: string}
              close: {type: string}
        orderRef: {type: string}
        customerRef: {type: string}
        pickupCode: {type: [string, 'null']}
        readyAt: {type: string, format: date-time}
    CarrierLabelEvent:
      type: object
      required: [labelId, originNode, carrier, service, trackingNumber, kind, fulfilment, billTo, billingReason, costMinor,
        handlingMinor, amountMinor, currency, purchasedAt]
      properties:
        labelId: {type: string, format: uuid}
        orgId: {type: string, description: Organisation of the member who bought the label (absent for staff / services)}
        shipmentId: {type: string, description: Order shipment the label is for}
        orderId: {type: string, description: Order of the shipment, when the caller gave it}
        reference: {type: string, description: Reference printed on the label}
        originNode: {type: string, description: FC id or seller org id the parcel leaves from}
        carrier: {type: string, enum: [usps, ups, fedex, dhl]}
        service: {type: string}
        trackingNumber: {type: string}
        kind: {type: string, enum: [outbound, return]}
        fulfilment: {type: string, enum: [SELLER_SHIPPED, FBA, AFROTRANSACT_DELIVERY]}
        billTo:
          type: string
          enum: [SELLER, AFROTRANSACT]
          description: >-
            SELLER only for an organisation member's outbound, seller-shipped label from its own origin that is not
            AfroTransact Retail's; everything else (Retail, FBA, AfroTransact Delivery, FC origins, returns, staff and
            services) is AfroTransact's own cost.
        billingReason:
          type: string
          enum: [SELLER_SHIPPED, RETAIL, FBA, AFROTRANSACT_DELIVERY, RETURN, PLATFORM_CALLER, PLATFORM_ORIGIN]
        costMinor: {type: integer, description: The carrier's negotiated charge for the label}
        handlingMinor: {type: integer, description: Handling markup (carrier-gateway billing config; 0 unless billTo is SELLER)}
        amountMinor: {type: integer, description: costMinor + handlingMinor; what a SELLER-billed label is charged}
        currency: {type: string}
        purchasedAt: {type: string, format: date-time}
        voidedAt: {type: string, format: date-time, description: Set on carrier.label.voided}
        voidReason: {type: string, enum: [VOIDED], description: Set on carrier.label.voided}
