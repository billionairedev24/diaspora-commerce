# AsyncAPI 3.0 fragment for delivery-runs-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  deliveryRunsEvents:
    address: at.delivery-runs.events
    description: >-
      Community delivery runs (E34) from delivery-runs-service via its transactional outbox. Run events are keyed by
      run id (one run's events stay in order), subscription events by subscription id. Headers event-id, event-type,
      occurred-at; consumers de-duplicate on event-id. Links are built from the environment's PUBLIC_WEB_URL and carry
      UTM attribution (utm_source / utm_medium = channel, utm_campaign = delivery-run-<slug>-<yyyymmdd>,
      utm_content = event).
    messages:
      deliveryRunsRunAnnounced: {$ref: '#/components/messages/deliveryRunsRunAnnounced'}
      deliveryRunsRunOpened: {$ref: '#/components/messages/deliveryRunsRunOpened'}
      deliveryRunsRunCutoffReminder: {$ref: '#/components/messages/deliveryRunsRunCutoffReminder'}
      deliveryRunsRunConfirmed: {$ref: '#/components/messages/deliveryRunsRunConfirmed'}
      deliveryRunsRunExtended: {$ref: '#/components/messages/deliveryRunsRunExtended'}
      deliveryRunsRunCollecting: {$ref: '#/components/messages/deliveryRunsRunCollecting'}
      deliveryRunsRunCancelled: {$ref: '#/components/messages/deliveryRunsRunCancelled'}
      deliveryRunsRunOutForDelivery: {$ref: '#/components/messages/deliveryRunsRunOutForDelivery'}
      deliveryRunsRunCompleted: {$ref: '#/components/messages/deliveryRunsRunCompleted'}
      deliveryRunsSubscriptionCreated: {$ref: '#/components/messages/deliveryRunsSubscriptionCreated'}
      deliveryRunsSubscriptionConfirmed: {$ref: '#/components/messages/deliveryRunsSubscriptionConfirmed'}
      deliveryRunsSubscriptionCancelled: {$ref: '#/components/messages/deliveryRunsSubscriptionCancelled'}
      preorderCommsDue: {$ref: '#/components/messages/preorderCommsDue'}
      preorderLateOrderAdded: {$ref: '#/components/messages/preorderLateOrderAdded'}
      preorderWindowPublished: {$ref: '#/components/messages/preorderWindowPublished'}
      preorderWindowUpdated: {$ref: '#/components/messages/preorderWindowUpdated'}
      preorderWindowPaused: {$ref: '#/components/messages/preorderWindowPaused'}
      preorderWindowResumed: {$ref: '#/components/messages/preorderWindowResumed'}
      preorderWindowOpened: {$ref: '#/components/messages/preorderWindowOpened'}
      preorderWindowClosed: {$ref: '#/components/messages/preorderWindowClosed'}
      preorderWindowDelivered: {$ref: '#/components/messages/preorderWindowDelivered'}
      preorderWindowDecisionNeeded: {$ref: '#/components/messages/preorderWindowDecisionNeeded'}
      preorderWindowDecided: {$ref: '#/components/messages/preorderWindowDecided'}
      preorderWindowCancelled: {$ref: '#/components/messages/preorderWindowCancelled'}
      preorderSettingsChanged: {$ref: '#/components/messages/preorderSettingsChanged'}
      preorderAreasChanged: {$ref: '#/components/messages/preorderAreasChanged'}
      preorderExportCreated: {$ref: '#/components/messages/preorderExportCreated'}
      preorderWaitlistJoined: {$ref: '#/components/messages/preorderWaitlistJoined'}
operations:
  publishDeliveryRunsEvents:
    action: send
    channel: {$ref: '#/channels/deliveryRunsEvents'}
    summary: >-
      delivery-runs-service publishes run lifecycle and subscription events. notifications announces opened,
      cutoff_reminder (24 h before cutoff, again after an extension) and out_for_delivery to the location's opted-in
      subscribers (audience from GET /v1/service/locations/{id}/audience) and the run's customers (orders[]), sends the
      double opt-in link of subscription.created (confirmUrl) and confirms / cancels customers' preorders on
      confirmed / cancelled. orders captures payment on run.confirmed and releases stock and payment holds on
      run.cancelled. fulfilment plans the sweep on run.confirmed (GET /v1/service/runs/{id}/dispatch) and cancels the
      routes that have not started on run.cancelled. content
      refreshes run advertorials on announced / opened / extended and expires them on cancelled / confirmed.
      Pre-orders (S270–S275): notifications sends preorder.comms.due by kind — ANNOUNCE (preorder.announce email / SMS
      / push to the window's audience from GET /v1/service/preorders/{windowId}/audience?segment=SUBSCRIBERS, and
      preorder.waitlist.opened email to segment=WAITLIST), REMIND_48H (preorder.reminder email / push), LAST_CALL_6H
      (preorder.last_call SMS / push), CLOSED (preorder.closed email to orders[]) and OUT_FOR_DELIVERY
      (preorder.out_for_delivery SMS / push to orders[]) — and texts the payment link of preorder.late_order.added
      (payment PAYMENT_LINK, preorder.late_order.payment_link). preorder.window.* follow a window's lifecycle (keyed by
      window id; opened / closed / delivered come from the scheduler, closed after the paid orders were handed to a
      run, which publishes delivery-runs.run.confirmed; paused / resumed carry the staff actorId);
      preorder.settings.changed and preorder.areas.changed (key preorder-settings) and
      preorder.export.created are audit records; preorder.waitlist.joined records a waitlist sign-up.
      ADR 0005 §4: staff set a minimum order count per window. When the close date passes below it the window is not
      cancelled: it becomes AWAITING_DECISION and preorder.window.decision_needed tells staff (decision.kind
      AWAITING, orders and minimum counted). Staff then CANCEL or PROCEED with a required reason; every decision
      (and an early close once the minimum is met) is published as preorder.window.decided with who, when and why.
      A cancelled window (preorder.window.cancelled, orders[] = every order) is refunded in full by orders-service
      (consumer orders-delivery-runs-events), which also consumes delivery-runs.run.cancelled the same way; progress per
      order comes back as orders.preorder.refund_settled / refund_failed.
  receiveDeliveryRunsOrderEvents:
    action: receive
    channel: {$ref: '#/channels/ordersOrderEvents'}
    summary: >-
      delivery-runs projects pre-orders (consumer delivery-runs-preorders, inbox-deduplicated on event-id):
      orders.order.placed with shipments[] of fulfilmentType PREORDER (preorder.windowId, preorder.fulfilment,
      attribution {src, cr, po} on the order or the preorder block) becomes a window order numbered <CODE>-1001…;
      orders.shipment.cancelled cancels that package (the order once none is left, with its refund PENDING);
      orders.preorder.refund_settled (REFUNDED or VOIDED) and orders.preorder.refund_failed record the refund progress
      of a cancelled order; orders.order.cancelled of a placed
      order cancels it. Late adds (<CODE>-L90…) are completed by their order's placed event.
      S264: the run follows what happens to its orders' PREORDER shipments (consumer delivery-runs-progress,
      inbox-deduplicated on event-id, forward only, harmless when repeated or late): orders.shipment.status_changed
      to picked_up (collected from the seller), out_for_delivery, delivery_failed or returned, and
      orders.shipment.delivered (deliveredAt is kept on the order's slot). The first collection moves the run to
      COLLECTING (delivery-runs.run.collecting), the last one to OUT_FOR_DELIVERY, and when every order is delivered
      or back the run is COMPLETED. A cancelled shipment (orders.shipment.cancelled) leaves the run. The seller payout
      hold starts in orders-service / payments from the same delivered event.
components:
  messages:
    preorderCommsDue:
      name: preorder.comms.due
      title: >-
        A pre-order window's comms are due (scheduler: opening, closes − 48 h, closes − 6 h, closing; OUT_FOR_DELIVERY
        from the driver events), for a kind the window has switched on. Keyed by window id.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderCommsDue'}
    preorderWindowPublished:
      name: preorder.window.published
      title: A draft passed its publish checks and was published (placements and comms follow its dates)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowUpdated:
      name: preorder.window.updated
      title: A published window or its creatives changed
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowPaused:
      name: preorder.window.paused
      title: Staff paused the window (placements hidden, comms stop)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowResumed:
      name: preorder.window.resumed
      title: Staff resumed a paused window
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowOpened:
      name: preorder.window.opened
      title: The window opened for orders (scheduler, at opensAt; once)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowClosed:
      name: preorder.window.closed
      title: Ordering closed; runId is the run the paid orders were handed to (null when no location serves it)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowDelivered:
      name: preorder.window.delivered
      title: The day after the delivery day (projected orders are deleted after the retention period)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowDecisionNeeded:
      name: preorder.window.decision_needed
      title: The window closed below its minimum order count and waits for staff to cancel or proceed (notify staff)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowDecided:
      name: preorder.window.decided
      title: Staff proceeded below the minimum, cancelled the window or closed it early (audit - who, when, why)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderWindowCancelled:
      name: preorder.window.cancelled
      title: >-
        The window was cancelled: orders-service refunds every order in orders[] in full (delivery fee included) and
        releases stock; a run it was handed to is cancelled too (delivery-runs.run.cancelled)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWindowEvent'}
    preorderSettingsChanged:
      name: preorder.settings.changed
      title: Platform pre-order settings, payment setup or coverage areas changed (audit; key preorder-settings)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderSettingsChanged'}
    preorderAreasChanged:
      name: preorder.areas.changed
      title: Staff edited one region's coverage in place (cities added, removed or switched; audit; key preorder-settings)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderAreasChanged'}
    preorderExportCreated:
      name: preorder.export.created
      title: Staff exported a window's orders, picking list or advertorial report (audit)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderExportCreated'}
    preorderWaitlistJoined:
      name: preorder.waitlist.joined
      title: A shopper joined the waitlist of an area (email only; keyed by entry id)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderWaitlistJoined'}
    preorderLateOrderAdded:
      name: preorder.late_order.added
      title: >-
        Customer service added a late order to a window (channel AGENT_LATE). With payment PAYMENT_LINK the order
        awaits payment until the customer pays the link (expiresAt from the payment settings' lateAdd.linkExpiryHours).
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/PreorderLateOrderAdded'}
    deliveryRunsRunAnnounced:
      name: delivery-runs.run.announced
      title: A run was announced (date and fee known; preorders not open yet)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsRunOpened:
      name: delivery-runs.run.opened
      title: Preorders are open until cutoffAt (staff, or automatically at opensAt)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsRunCutoffReminder:
      name: delivery-runs.run.cutoff_reminder
      title: 24 hours (configurable) before the cutoff; sent again for a new cutoff after an extension
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsRunConfirmed:
      name: delivery-runs.run.confirmed
      title: >-
        The run goes ahead (minimum met at cutoff, or confirmed by staff); orders[] are the confirmed orders, with
        handover codes for pickup-point runs. Capture payments now.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsRunExtended:
      name: delivery-runs.run.extended
      title: >-
        The cutoff (and window) moved later (staff, or the EXTEND policy once when the minimum was not met;
        reason MINIMUM_NOT_MET); previousCutoffAt is the old cutoff. Preorders stay held.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsRunCancelled:
      name: delivery-runs.run.cancelled
      title: >-
        The run will not happen (minimum not met after the policy, or staff with a reason); orders[] lists every
        affected order and customer. Release stock and payment holds and tell the customers.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsRunCollecting:
      name: delivery-runs.run.collecting
      title: >-
        The first order was collected from its seller (the driver's pickup, or staff): the sweep has started (S264).
        Not sent to customers.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsRunOutForDelivery:
      name: delivery-runs.run.out_for_delivery
      title: >-
        Every order was collected from its seller and the run is on the road (S264: derived from the drivers' shipment
        events; staff can still press it); orders[] are the orders on board
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsRunCompleted:
      name: delivery-runs.run.completed
      title: >-
        Every order was delivered or came back (S264: derived from orders-service shipment events when the last one
        is handed over; staff can still press it); orders[] are the run's orders
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsRunEvent'}
    deliveryRunsSubscriptionCreated:
      name: delivery-runs.subscription.created
      title: >-
        A shopper subscribed to a location's run alerts or added channels (changedChannels). Email-only subscribers are
        PENDING_CONFIRMATION: send confirmUrl (double opt-in); nothing else may be sent until it is used.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsSubscriptionEvent'}
    deliveryRunsSubscriptionConfirmed:
      name: delivery-runs.subscription.confirmed
      title: An email subscriber confirmed (double opt-in); welcome message with the WhatsApp community link
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsSubscriptionEvent'}
    deliveryRunsSubscriptionCancelled:
      name: delivery-runs.subscription.cancelled
      title: >-
        Consent withdrawn on changedChannels; status CANCELLED when no channel is left. Stop messaging those channels.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/DeliveryRunsSubscriptionEvent'}
  schemas:
    DeliveryRunsPickupPoint:
      type: object
      required: [name, line1, city, hours]
      properties:
        name: {type: string, examples: [Bastrop Public Library]}
        line1: {type: string}
        city: {type: string}
        state: {type: [string, 'null']}
        postalCode: {type: [string, 'null']}
        hours: {type: string, examples: [Sat 2–5 PM]}
        notes: {type: [string, 'null']}
    DeliveryRunsOrderRef:
      type: object
      required: [orderId, customerId, packages, status]
      properties:
        orderId: {type: string}
        customerId: {type: string, description: Customer (token subject); notifications resolves contacts}
        packages: {type: integer}
        status: {type: string, enum: [RESERVED, CONFIRMED, RELEASED, CANCELLED]}
        handoverCode: {type: [string, 'null'], description: 'Six digits; confirmed pickup-point runs only. Window runs hand over with the order''s own 4-digit code (orders-service), which the driver app checks.'}
    DeliveryRunsSellerRef:
      type: object
      description: A seller the run collects from (confirmed pre-order runs; notifications tells each seller the pickup time)
      required: [sellerOrgId, orders, units]
      properties:
        sellerOrgId: {type: string}
        sellerName: {type: [string, 'null']}
        orders: {type: integer, description: Run orders with lines of this seller}
        units: {type: integer, description: Units to pick}
    DeliveryRunsRunEvent:
      type: object
      required: [runId, status, locationId, locationSlug, town, market, timeZone, windowStart, windowEnd, cutoffAt,
                 deliveryDay, windowDisplay, cutoffDisplay, feeMinor, currency, feeDisplay, dropMode, minOrders,
                 reservedOrders, extensions, runUrl, links, locationUrl]
      properties:
        runId: {type: string, format: uuid}
        status:
          type: string
          enum: [DRAFT, ANNOUNCED, OPEN, EXTENDED, CUT_OFF, CONFIRMED, COLLECTING, OUT_FOR_DELIVERY, COMPLETED, CANCELLED]
        previousStatus: {type: [string, 'null']}
        locationId: {type: string, format: uuid}
        locationSlug: {type: string, examples: [bastrop-tx]}
        town: {type: string, examples: [Bastrop]}
        market: {type: string, examples: [US]}
        state: {type: [string, 'null'], examples: [TX]}
        timeZone: {type: string, examples: [America/Chicago]}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        cutoffAt: {type: string, format: date-time, description: Order cutoff (the new one for extended)}
        previousCutoffAt: {type: [string, 'null'], format: date-time, description: Extended only}
        sellerPickupAt: {type: [string, 'null'], format: date-time, description: Seller sweep time when scheduled}
        deliveryDay: {type: string, examples: ['Saturday, October 24']}
        windowDisplay: {type: string, examples: ['10:00 AM – 2:00 PM']}
        cutoffDisplay: {type: string, examples: ['Thu, Oct 22 · 8:00 PM CDT']}
        feeMinor: {type: integer, format: int64, examples: [799]}
        currency: {type: string, examples: [USD]}
        feeDisplay: {type: string, examples: [$7.99]}
        dropMode: {type: string, enum: [DOORSTEP, PICKUP_POINT]}
        pickupPoint:
          oneOf:
            - {$ref: '#/components/schemas/DeliveryRunsPickupPoint'}
            - {type: 'null'}
        minOrders: {type: integer}
        reservedOrders: {type: integer}
        capacityOrders: {type: [integer, 'null']}
        extensions: {type: integer}
        reason: {type: [string, 'null'], description: 'Extended / cancelled: MINIMUM_NOT_MET, STAFF or the staff reason'}
        runUrl: {type: string, format: uri, description: '<PUBLIC_WEB_URL>/delivery-runs/<slug>?run=<id>'}
        links:
          type: object
          description: runUrl with UTM per channel
          properties:
            email: {type: string, format: uri}
            sms: {type: string, format: uri}
            push: {type: string, format: uri}
            whatsapp: {type: string, format: uri}
            social: {type: string, format: uri}
        locationUrl: {type: string, format: uri}
        whatsappInviteUrl: {type: [string, 'null'], format: uri, description: The location's WhatsApp community}
        orders:
          type: [array, 'null']
          description: confirmed, cancelled, out_for_delivery and completed only
          items: {$ref: '#/components/schemas/DeliveryRunsOrderRef'}
        sellers:
          type: [array, 'null']
          description: >-
            confirmed pre-order runs only (S264): the sellers to collect from at sellerPickupAt, largest first. Each
            reads its own pick list in Seller Center.
          items: {$ref: '#/components/schemas/DeliveryRunsSellerRef'}
    DeliveryRunsSubscriptionEvent:
      type: object
      required: [subscriptionId, locationId, locationSlug, town, status, channels, changedChannels, unsubscribeUrl,
                 locationUrl]
      properties:
        subscriptionId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        locationSlug: {type: string}
        town: {type: string}
        userId: {type: [string, 'null'], description: Signed-in shopper; notifications resolves verified contacts}
        email: {type: [string, 'null'], format: email, description: Email-only subscriber}
        status: {type: string, enum: [PENDING_CONFIRMATION, ACTIVE, CANCELLED]}
        channels:
          type: array
          description: Channels with consent in force
          items: {type: string, enum: [EMAIL, SMS, PUSH, WHATSAPP]}
        changedChannels:
          type: array
          description: Granted (created / confirmed) or withdrawn (cancelled) by this change
          items: {type: string, enum: [EMAIL, SMS, PUSH, WHATSAPP]}
        source: {type: [string, 'null'], examples: [location-page, checkout, unsubscribe-link]}
        confirmUrl: {type: [string, 'null'], format: uri, description: Double opt-in link (pending email subscribers)}
        unsubscribeUrl: {type: string, format: uri}
        locationUrl: {type: string, format: uri}
        whatsappInviteUrl: {type: [string, 'null'], format: uri}
    PreorderCommsDue:
      type: object
      required: [windowId, code, name, kind, where, opensAt, closesAt, deliversOn, door, pickup, currency]
      properties:
        windowId: {type: string, format: uuid}
        code: {type: string, examples: [LBK-7], description: 'Window code; links carry po=<code>'}
        name: {type: string, examples: ['Lubbock Pre-order #7']}
        kind: {type: string, enum: [ANNOUNCE, REMIND_48H, LAST_CALL_6H, CLOSED, OUT_FOR_DELIVERY]}
        where: {type: string, examples: ['Lubbock, TX']}
        targets: {type: array, items: {type: string, examples: [US/TX/Lubbock]}}
        timeZone: {type: string, examples: [America/Chicago]}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        deliversOn: {type: string, format: date}
        opensDisplay: {type: [string, 'null'], examples: ['Tue, Oct 6 9:00 AM'], description: Market-local, GSM-7}
        closesDisplay: {type: [string, 'null'], examples: ['Wed, Oct 21 11:59 PM']}
        deliversDisplay: {type: [string, 'null'], examples: ['Sun, Oct 25']}
        ribbon: {type: [string, 'null']}
        headline: {type: [string, 'null']}
        smsCopy:
          type: [string, 'null']
          description: >-
            The window's SMS copy (≤ 160, GSM-7). "{link}" is replaced with the tracked link
            <PUBLIC_WEB_URL>/pre-orders?src=sms&po=<code>&cr=<slot> (about 60 characters): count it in the 160.
        categories: {type: array, items: {type: string}}
        door: {type: boolean}
        pickup: {type: boolean}
        doorFeeMinor: {type: [integer, 'null'], description: Effective door fee (window override or payment settings)}
        pickupFeeMinor: {type: [integer, 'null'], description: Effective pickup fee}
        currency: {type: string, examples: [USD]}
        pickupWindow: {type: [string, 'null'], examples: [10am-2pm]}
        deliveryWindow: {type: [string, 'null'], description: OUT_FOR_DELIVERY only, examples: [10am-2pm]}
        status: {type: string, description: Window status when the event was written}
        dueAt: {type: string, format: date-time, description: When the message was due}
        pickupAddress: {type: [string, 'null']}
        comms: {type: array, items: {type: string}}
        heroUrl: {type: [string, 'null'], format: uri}
        emailImageUrl: {type: [string, 'null'], format: uri}
        runId: {type: [string, 'null'], format: uuid}
        pageUrl: {type: string, format: uri, description: '<PUBLIC_WEB_URL>/pre-orders/<code>'}
        links:
          type: object
          description: pageUrl with ?src=<channel>&po=<code>[&cr=<slot>] per channel
          properties:
            email: {type: string, format: uri}
            sms: {type: string, format: uri}
            push: {type: string, format: uri}
            whatsapp: {type: string, format: uri}
            instagram: {type: string, format: uri}
            facebook: {type: string, format: uri}
            tiktok: {type: string, format: uri}
        supportPhone: {type: [string, 'null']}
        orders:
          type: [array, 'null']
          description: CLOSED and OUT_FOR_DELIVERY only — the window's paid orders (notifications resolves contacts)
          items:
            type: object
            required: [orderId, customerId]
            properties:
              orderId: {type: string}
              customerId: {type: string}
              fulfilment: {type: string, enum: [DOOR, PICKUP]}
    PreorderLateOrderAdded:
      type: object
      required: [windowId, code, name, orderId, number, customerId, payment, totalMinor, currency, deliversOn]
      properties:
        windowId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        orderId: {type: string}
        number: {type: string, examples: [LBK-L90]}
        customerId: {type: string}
        phone: {type: [string, 'null'], description: The number the agent confirmed with the customer (E.164)}
        payment: {type: string, enum: [SAVED_CARD, PAYMENT_LINK]}
        paymentUrl: {type: [string, 'null'], format: uri, description: "Pay-now link (PAYMENT_LINK): AfroTransact's own pay page with its signed token; never a Stripe-hosted page"}
        expiresAt: {type: [string, 'null'], format: date-time}
        totalMinor: {type: integer, format: int64, description: Items + the window's door fee when DOOR}
        currency: {type: string}
        deliversOn: {type: string, format: date}
        reason: {type: string, examples: [Customer called]}
        actor: {type: string, description: Staff subject}
        note: {type: [string, 'null'], description: Recorded note (reason, payment, agent)}
        addedAt: {type: string, format: date-time}
    PreorderWindowEvent:
      type: object
      description: >-
        The window as notifications, content and the storefront need it (same fields as PreorderCommsDue without kind,
        dueAt and orders).
      required: [windowId, code, name, status, targets, opensAt, closesAt, deliversOn, door, pickup, currency]
      properties:
        windowId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        status: {type: string, enum: [DRAFT, PAUSED, UPCOMING, OPEN, CLOSED, DELIVERED, AWAITING_DECISION, CANCELLED]}
        targets: {type: array, items: {type: string}}
        where: {type: string}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        deliversOn: {type: string, format: date}
        timeZone: {type: string}
        opensDisplay: {type: [string, 'null']}
        closesDisplay: {type: [string, 'null']}
        deliversDisplay: {type: [string, 'null']}
        ribbon: {type: [string, 'null']}
        headline: {type: [string, 'null']}
        smsCopy: {type: [string, 'null']}
        categories: {type: array, items: {type: string}}
        door: {type: boolean}
        pickup: {type: boolean}
        doorFeeMinor: {type: [integer, 'null']}
        pickupFeeMinor: {type: [integer, 'null']}
        currency: {type: string}
        pickupWindow: {type: [string, 'null']}
        pickupAddress: {type: [string, 'null']}
        comms: {type: array, items: {type: string}}
        heroUrl: {type: [string, 'null'], format: uri}
        emailImageUrl: {type: [string, 'null'], format: uri}
        runId: {type: [string, 'null'], format: uuid}
        pageUrl: {type: string, format: uri}
        links: {type: object, additionalProperties: {type: string, format: uri}}
        supportPhone: {type: [string, 'null']}
        actorId:
          type: [string, 'null']
          description: Staff subject who paused, resumed or edited the window (audit); null for scheduler events
        minOrders: {type: integer, description: 'Fewest orders the window needs (0 = none)'}
        orders:
          type: [array, 'null']
          description: preorder.window.cancelled only - every order orders-service must refund
          items:
            type: object
            required: [orderId]
            properties:
              orderId: {type: string}
              customerId: {type: [string, 'null']}
              fulfilment: {type: string, enum: [DOOR, PICKUP]}
        decision:
          type: [object, 'null']
          description: decision_needed, decided and cancelled only
          required: [kind, reason, actor, orders, minimum, at]
          properties:
            kind: {type: string, enum: [AWAITING, PROCEED, CANCEL, EARLY_CLOSE]}
            reason: {type: string}
            actor: {type: string, description: 'Staff subject, or system'}
            orders: {type: integer, description: 'Orders that counted'}
            minimum: {type: integer}
            at: {type: string, format: date-time}
    PreorderAreasChanged:
      type: object
      required: [region, added, removed, switched, actorId]
      properties:
        region: {type: string, examples: [US/TX]}
        added:
          type: array
          items: {type: object, properties: {key: {type: string}, 'on': {type: boolean}}}
        removed: {type: array, items: {type: string, examples: [US/TX/Laredo]}}
        switched:
          type: array
          items: {type: object, properties: {key: {type: string}, 'on': {type: boolean}}}
        actorId: {type: string}
        changedAt: {type: string, format: date-time}
    PreorderSettingsChanged:
      type: object
      required: [enabled, fallback, placements, payment, actor]
      properties:
        enabled: {type: boolean}
        fallback: {type: string, enum: [SHIP, WAITLIST]}
        placements: {type: array, items: {type: string, enum: [RIBBON, HERO, BADGE, PDP, CART, FAMILY]}}
        payment:
          type: object
          properties:
            doorFees: {type: object, additionalProperties: {type: integer}, description: Minor units per currency}
            pickupFees: {type: object, additionalProperties: {type: integer}}
            allowedMethods: {type: array, items: {type: string, enum: [CARD, WALLET, ACH]}}
            cancelUntil: {type: string, enum: [CLOSE]}
            lateAdd:
              type: object
              properties:
                savedCard: {type: boolean}
                paymentLink: {type: boolean}
                linkExpiryHours: {type: integer}
            missedDelivery:
              type: object
              properties:
                offerRefund: {type: boolean}
                offerNewDate: {type: boolean}
            pickupWindow: {type: string}
        actor: {type: string}
        actorId: {type: string, description: Same as actor (audit log)}
        changedAt: {type: [string, 'null'], format: date-time}
    PreorderExportCreated:
      type: object
      required: [windowId, code, export, rows, actor, createdAt]
      properties:
        windowId: {type: string, format: uuid}
        code: {type: string}
        export: {type: string, enum: [orders, orders-filtered, picking-list, advertorial-report]}
        rows: {type: integer}
        filter: {type: object, additionalProperties: {type: string}, description: 'orders-filtered: status, channel, q'}
        containsPii: {type: boolean}
        actor: {type: string}
        createdAt: {type: string, format: date-time}
    PreorderWaitlistJoined:
      type: object
      required: [entryId, area, country, region, email, source, unsubscribeUrl, joinedAt]
      properties:
        entryId: {type: string, format: uuid}
        area: {type: string, examples: [US/TX/Lubbock]}
        country: {type: string}
        region: {type: string}
        city: {type: [string, 'null']}
        email: {type: string, format: email}
        source: {type: string, examples: [preorder-waitlist]}
        unsubscribeUrl: {type: string, format: uri}
        joinedAt: {type: string, format: date-time}
