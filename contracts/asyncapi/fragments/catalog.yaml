# AsyncAPI 3.0 fragment for catalog-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  catalogProductEvents:
    address: at.product.events
    description: Product lifecycle from catalog-service (key = product id). Headers event-id, event-type, occurred-at.
    messages:
      catalogProductCreated: {$ref: '#/components/messages/catalogProductCreated'}
      catalogProductApproved: {$ref: '#/components/messages/catalogProductApproved'}
      catalogProductRejected: {$ref: '#/components/messages/catalogProductRejected'}
      catalogProductPaused: {$ref: '#/components/messages/catalogProductPaused'}
      catalogProductResumed: {$ref: '#/components/messages/catalogProductResumed'}
      catalogProductUpdated: {$ref: '#/components/messages/catalogProductUpdated'}
      catalogProductHidden: {$ref: '#/components/messages/catalogProductHidden'}
      catalogProductRestored: {$ref: '#/components/messages/catalogProductRestored'}
      catalogProductFlagged: {$ref: '#/components/messages/catalogProductFlagged'}
      catalogProductTakenDown: {$ref: '#/components/messages/catalogProductTakenDown'}
      catalogProductReinstated: {$ref: '#/components/messages/catalogProductReinstated'}
  catalogCategoryRequestEvents:
    address: at.category-request.events
    description: New-category requests (key = request id).
    messages:
      catalogCategoryRequestCreated: {$ref: '#/components/messages/catalogCategoryRequestCreated'}
      catalogCategoryRequestApproved: {$ref: '#/components/messages/catalogCategoryRequestApproved'}
      catalogCategoryRequestRejected: {$ref: '#/components/messages/catalogCategoryRequestRejected'}
operations:
  publishCatalogProductEvents:
    action: send
    channel: {$ref: '#/channels/catalogProductEvents'}
    summary: >-
      catalog-service publishes product lifecycle events via its transactional outbox. catalog.product.flagged: a
      live listing was reported by a shopper (POST /v1/public/products/{atin}/reports), flagged by staff or flagged
      automatically by a service client (POST /v1/products/{id}/flags); trust-ops-service queues it as a
      live-listing moderation item. catalog.product.taken_down / reinstated: Trust and Safety removed a live or
      paused listing (POST /v1/products/{id}/takedown, status TAKEN_DOWN, hidden from public reads) or reversed it
      (POST /v1/products/{id}/restore, back to LIVE or PAUSED). Read models keep a product public only while its
      status is LIVE and sellerHidden is false.
  publishCatalogCategoryRequestEvents:
    action: send
    channel: {$ref: '#/channels/catalogCategoryRequestEvents'}
  consumeCatalogSellerComplianceEvents:
    action: receive
    channel: {$ref: '#/channels/sellerComplianceEvents'}
    summary: >-
      catalog-service (consumer group catalog-service, inbox-deduplicated) handles seller.listings.hidden / restored:
      records the organisation's suppression (org_listing_suppression), hides its products from the public catalog
      API and publishes catalog.product.hidden / restored for every product of the organisation. Older decisions
      never override newer ones (occurredAt). This covers Stripe compliance enforcement and Trust and Safety
      suspension (reason SUSPENDED / REINSTATED) alike. Large catalogs are republished in pages of 500 products, one
      transaction per page (S216), so the product events of one decision are spread over several commits; a
      redelivered or crashed run resumes after its last committed page and a newer decision supersedes a run in
      progress, so each product gets at most one event per decision.
components:
  messages:
    catalogProductCreated:
      name: catalog.product.created
      title: Product created (in review or waiting for category approval)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductApproved:
      name: catalog.product.approved
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductRejected:
      name: catalog.product.rejected
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductPaused:
      name: catalog.product.paused
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductResumed:
      name: catalog.product.resumed
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductUpdated:
      name: catalog.product.updated
      title: Listing settings changed without a status change (S272 pre-order flags)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductHidden:
      name: catalog.product.hidden
      title: The owner's listings were hidden by seller-service compliance enforcement (sellerHidden = true)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductRestored:
      name: catalog.product.restored
      title: The owner's listings were restored (sellerHidden = false; status is the product's own status)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductFlagged:
      name: catalog.product.flagged
      title: A live listing was reported, flagged by staff or flagged automatically
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductFlagged'}
    catalogProductTakenDown:
      name: catalog.product.taken_down
      title: Trust and Safety took a live or paused listing down (status TAKEN_DOWN, reasonCode set)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductReinstated:
      name: catalog.product.reinstated
      title: A takedown was reversed (status is the listing's status before the takedown, LIVE or PAUSED)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogCategoryRequestCreated:
      name: catalog.category-request.created
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogCategoryRequestEvent'}
    catalogCategoryRequestApproved:
      name: catalog.category-request.approved
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogCategoryRequestEvent'}
    catalogCategoryRequestRejected:
      name: catalog.category-request.rejected
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogCategoryRequestEvent'}
  schemas:
    CatalogProductEvent:
      type: object
      required: [productId, atin, ownerKind, ownerOrgId, status, title, variants]
      properties:
        productId: {type: string, format: uuid}
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        ownerKind: {type: string, enum: [SELLER, PLATFORM]}
        ownerOrgId: {type: string}
        status: {type: string, enum: [IN_REVIEW, PENDING_CATEGORY_APPROVAL, LIVE, REJECTED, PAUSED, TAKEN_DOWN]}
        title: {type: string}
        categoryId: {type: [string, 'null'], format: uuid}
        productTypeCode: {type: string}
        note: {type: [string, 'null'], description: 'Moderation note; on a takedown "[REASON_CODE] Taken down: note"'}
        reasonCode:
          type: [string, 'null']
          description: Takedown reason code (catalog.product.taken_down only; ListingReasonCode)
        sellerHidden:
          type: boolean
          description: >-
            The owner's listings are hidden by seller-service compliance enforcement (seller.listings.hidden). Keep
            the product off public surfaces regardless of status; set on every catalog.product.* event while hidden.
        preorderEligible:
          type: boolean
          description: May be sold in a community pre-order window (S272); default true for food product types
        shipsNow:
          type: boolean
          description: Always ships now by carrier, never as a pre-order (delivery-runs eligibility excludes it)
        imageUrl:
          type:
          - string
          - 'null'
          description: Public URL of the main (first) product image; the search indexer shows it on product cards
        brand:
          type:
          - string
          - 'null'
          description: The product's brand attribute
        communities:
          type: array
          items:
            type: string
          description: Diaspora communities from the community / communities attribute (comma-separated there)
        variants:
          type: array
          items:
            type: object
            properties:
              atin: {type: string}
              sellerSku: {type: string}
              gtin: {type: [string, 'null']}
              priceMinor: {type: integer, format: int64}
              currency: {type: string}
              quantity: {type: integer}
    CatalogProductFlagged:
      type: object
      required: [flagId, productId, atin, ownerKind, ownerOrgId, status, title, source, reasonCode, occurredAt]
      properties:
        flagId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        ownerKind: {type: string, enum: [SELLER, PLATFORM]}
        ownerOrgId: {type: string}
        status: {type: string, enum: [LIVE, PAUSED]}
        title: {type: string}
        categoryId: {type: [string, 'null'], format: uuid}
        productTypeCode: {type: string}
        sellerHidden: {type: boolean}
        source: {type: string, enum: [CUSTOMER_REPORT, STAFF, AUTOMATED]}
        reasonCode:
          type: string
          enum: [PROHIBITED_ITEM, UNAPPROVED_HEALTH_CLAIM, RESTRICTED_INGREDIENT, COUNTERFEIT, IMAGE_POLICY,
                 MISLEADING_CONTENT, LABELLING, SHIPPING_METHOD, DUPLICATE_LISTING, WRONG_CATEGORY, OTHER]
        details: {type: [string, 'null'], description: Reporter's description (required for OTHER)}
        reporterId: {type: [string, 'null'], description: Token subject of the shopper, staff member or service client}
        riskLevel: {type: [string, 'null'], description: Optional risk level of an automated flag (e.g. HIGH)}
        occurredAt: {type: string, format: date-time}
    CatalogCategoryRequestEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        orgId: {type: string}
        path: {type: string}
        status: {type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED]}
