# AsyncAPI 3.0 fragment for catalog-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
channels:
  catalogProductEvents:
    address: at.product.events
    description: Product lifecycle from catalog-service (key = product id). Headers event-id, event-type, occurred-at.
    messages:
      catalogProductCreated: {$ref: '#/components/messages/catalogProductCreated'}
      catalogProductApproved: {$ref: '#/components/messages/catalogProductApproved'}
      catalogProductRejected: {$ref: '#/components/messages/catalogProductRejected'}
      catalogProductPaused: {$ref: '#/components/messages/catalogProductPaused'}
      catalogProductResumed: {$ref: '#/components/messages/catalogProductResumed'}
      catalogProductUpdated: {$ref: '#/components/messages/catalogProductUpdated'}
      catalogProductHidden: {$ref: '#/components/messages/catalogProductHidden'}
      catalogProductRestored: {$ref: '#/components/messages/catalogProductRestored'}
      catalogProductFlagged: {$ref: '#/components/messages/catalogProductFlagged'}
      catalogProductTakenDown: {$ref: '#/components/messages/catalogProductTakenDown'}
      catalogProductReinstated: {$ref: '#/components/messages/catalogProductReinstated'}
      catalogProductTermsChanged: {$ref: '#/components/messages/catalogProductTermsChanged'}
      catalogProductResubmitted: {$ref: '#/components/messages/catalogProductResubmitted'}
      catalogProductRatingChanged: {$ref: '#/components/messages/catalogProductRatingChanged'}
  catalogProductReviewEvents:
    address: at.product-review.events
    description: Verified-purchase product reviews (S324, key = review id). Headers event-id, event-type, occurred-at.
    messages:
      catalogReviewSubmitted: {$ref: '#/components/messages/catalogReviewSubmitted'}
      catalogReviewPublished: {$ref: '#/components/messages/catalogReviewPublished'}
      catalogReviewUpdated: {$ref: '#/components/messages/catalogReviewUpdated'}
      catalogReviewRejected: {$ref: '#/components/messages/catalogReviewRejected'}
      catalogReviewRemoved: {$ref: '#/components/messages/catalogReviewRemoved'}
      catalogReviewDeleted: {$ref: '#/components/messages/catalogReviewDeleted'}
      catalogReviewReported: {$ref: '#/components/messages/catalogReviewReported'}
      catalogReviewReplied: {$ref: '#/components/messages/catalogReviewReplied'}
  catalogProductImportEvents:
    address: at.product-import.events
    description: Bulk product uploads (S308, key = upload id). Headers event-id, event-type, occurred-at.
    messages:
      catalogImportCompleted: {$ref: '#/components/messages/catalogImportCompleted'}
  catalogCategoryRequestEvents:
    address: at.category-request.events
    description: New-category requests (key = request id).
    messages:
      catalogCategoryRequestCreated: {$ref: '#/components/messages/catalogCategoryRequestCreated'}
      catalogCategoryRequestApproved: {$ref: '#/components/messages/catalogCategoryRequestApproved'}
      catalogCategoryRequestRejected: {$ref: '#/components/messages/catalogCategoryRequestRejected'}
operations:
  publishCatalogProductEvents:
    action: send
    channel: {$ref: '#/channels/catalogProductEvents'}
    summary: >-
      catalog-service publishes product lifecycle events via its transactional outbox. catalog.product.flagged: a
      live listing was reported by a shopper (POST /v1/public/products/{atin}/reports), flagged by staff or flagged
      automatically by a service client (POST /v1/products/{id}/flags); trust-ops-service queues it as a
      live-listing moderation item. catalog.product.taken_down / reinstated: Trust and Safety removed a live or
      paused listing (POST /v1/products/{id}/takedown, status TAKEN_DOWN, hidden from public reads) or reversed it
      (POST /v1/products/{id}/restore, back to LIVE or PAUSED). Read models keep a product public only while its
      status is LIVE and sellerHidden is false.
  publishCatalogProductReviewEvents:
    action: send
    channel: {$ref: '#/channels/catalogProductReviewEvents'}
    summary: >-
      Verified-purchase product reviews (S324). A customer with a DELIVERED order line for the product writes a review
      (POST /v1/products/{atin}/reviews). It passes the automatic checks (profanity list, links, e-mail addresses, phone
      numbers) and is published at once (catalog.review.published), or fails them and is announced as
      catalog.review.submitted with status PENDING: trust-ops-service queues it as a PRODUCT_REVIEW item. An edit
      (PUT /v1/products/{atin}/reviews/mine) is checked again: catalog.review.updated when the review stays public,
      catalog.review.submitted when it goes to moderation (an edit of a rejected or removed review always does).
      Moderation (POST /v1/product-reviews/{id}/approve | reject | remove) publishes catalog.review.published /
      rejected / removed; the customer deleting their review publishes catalog.review.deleted. A customer or the
      product's seller reporting a published review publishes catalog.review.reported (once per reporter and review),
      which trust-ops-service queues as a PRODUCT_REVIEW item; the seller's single reply publishes
      catalog.review.replied. Every decision rewrites the product's rating in the same transaction and, when it
      moved, publishes catalog.product.rating_changed on the product channel.
  publishCatalogProductImportEvents:
    action: send
    channel: {$ref: '#/channels/catalogProductImportEvents'}
    summary: >-
      catalog.import.completed: a bulk upload finished importing (every importable row created, updated or failed;
      rows with errors skipped). notifySeller is true for uploads of at least at.catalog.imports.notify-min-rows rows
      (100 by default); notifications-service then tells the member who uploaded it.
  publishCatalogCategoryRequestEvents:
    action: send
    channel: {$ref: '#/channels/catalogCategoryRequestEvents'}
  consumeCatalogSellerComplianceEvents:
    action: receive
    channel: {$ref: '#/channels/sellerComplianceEvents'}
    summary: >-
      catalog-service (consumer group catalog-service, inbox-deduplicated) handles seller.listings.hidden / restored:
      records the organisation's suppression (org_listing_suppression), hides its products from the public catalog
      API and publishes catalog.product.hidden / restored for every product of the organisation. Older decisions
      never override newer ones (occurredAt). This covers Stripe compliance enforcement and Trust and Safety
      suspension (reason SUSPENDED / REINSTATED) alike. Large catalogs are republished in pages of 500 products, one
      transaction per page (S216), so the product events of one decision are spread over several commits; a
      redelivered or crashed run resumes after its last committed page and a newer decision supersedes a run in
      progress, so each product gets at most one event per decision.
components:
  messages:
    catalogProductCreated:
      name: catalog.product.created
      title: Product created (in review or waiting for category approval)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductApproved:
      name: catalog.product.approved
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductRejected:
      name: catalog.product.rejected
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductPaused:
      name: catalog.product.paused
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductResumed:
      name: catalog.product.resumed
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductUpdated:
      name: catalog.product.updated
      title: Listing settings changed without a status change (S272 pre-order flags)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductHidden:
      name: catalog.product.hidden
      title: The owner's listings were hidden by seller-service compliance enforcement (sellerHidden = true)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductRestored:
      name: catalog.product.restored
      title: The owner's listings were restored (sellerHidden = false; status is the product's own status)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductFlagged:
      name: catalog.product.flagged
      title: A live listing was reported, flagged by staff or flagged automatically
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductFlagged'}
    catalogProductTakenDown:
      name: catalog.product.taken_down
      title: Trust and Safety took a live or paused listing down (status TAKEN_DOWN, reasonCode set)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductReinstated:
      name: catalog.product.reinstated
      title: A takedown was reversed (status is the listing's status before the takedown, LIVE or PAUSED)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductTermsChanged:
      name: catalog.product.terms_changed
      title: Price, quantity, "was" price, condition, fulfilment, handling time or ship-from changed (S307)
      summary: >-
        Published with catalog.product.updated when the seller edits these through the one-step product form or a
        bulk update, or adds variants; offers-service updates the seller's offers (price, list price, seller
        quantity, handling time, ship-from) and creates offers for new variants.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductResubmitted:
      name: catalog.product.resubmitted
      title: A rejected listing was edited and is back in review (S307)
      summary: trust-ops-service queues it for moderation again, like catalog.product.created with status IN_REVIEW.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogImportCompleted:
      name: catalog.import.completed
      title: A bulk upload finished importing (S308)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogImportCompleted'}
    catalogProductTermsChanged:
      name: catalog.product.terms_changed
      title: Price, quantity, "was" price, condition, fulfilment, handling time or ship-from changed (S307)
      summary: >-
        Published with catalog.product.updated when the seller edits these through the one-step product form or a
        bulk update, or adds variants; offers-service updates the seller's offers (price, list price, seller
        quantity, handling time, ship-from) and creates offers for new variants.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogProductResubmitted:
      name: catalog.product.resubmitted
      title: A rejected listing was edited and is back in review (S307)
      summary: trust-ops-service queues it for moderation again, like catalog.product.created with status IN_REVIEW.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductEvent'}
    catalogImportCompleted:
      name: catalog.import.completed
      title: A bulk upload finished importing (S308)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogImportCompleted'}
    catalogProductRatingChanged:
      name: catalog.product.rating_changed
      title: A product's average rating or review count changed (S324)
      summary: >-
        Published when a review is published, edited, removed or deleted and the product's average, count or star
        breakdown moved. Key = product id, so it stays in order with the product's lifecycle. The search indexer sets
        the product document's rating and reviewCount from it (rating filter and sort, listing cards).
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogProductRatingChanged'}
    catalogReviewSubmitted:
      name: catalog.review.submitted
      title: A product review waits for moderation (status PENDING)
      summary: >-
        The review failed the automatic checks, or was edited after a rejection or removal. trust-ops-service queues it
        as a PRODUCT_REVIEW item; a newer submission of the same review replaces its open item.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogReview'}
    catalogReviewPublished:
      name: catalog.review.published
      title: A product review is public (passed the checks, or moderation approved it)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogReview'}
    catalogReviewUpdated:
      name: catalog.review.updated
      title: The customer edited a published review and it stayed public
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogReview'}
    catalogReviewRejected:
      name: catalog.review.rejected
      title: Moderation refused a pending review (reasonCode set)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogReview'}
    catalogReviewRemoved:
      name: catalog.review.removed
      title: Moderation took a review down (reasonCode set)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogReview'}
    catalogReviewDeleted:
      name: catalog.review.deleted
      title: The customer deleted their review
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogReview'}
    catalogReviewReported:
      name: catalog.review.reported
      title: A customer or the product's seller reported a published review
      summary: >-
        One event per new report (a repeated report publishes nothing). reportReason is the new report's reason code
        (ABUSIVE, PERSONAL_INFORMATION, SPAM, OFF_TOPIC, CONFLICT_OF_INTEREST, OTHER) and reportCount the reports on the
        review's current text. trust-ops-service queues the review, or counts the report on its open item.
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogReview'}
    catalogReviewReplied:
      name: catalog.review.replied
      title: The product's seller replied to a review (once)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogReview'}
    catalogCategoryRequestCreated:
      name: catalog.category-request.created
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogCategoryRequestEvent'}
    catalogCategoryRequestApproved:
      name: catalog.category-request.approved
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogCategoryRequestEvent'}
    catalogCategoryRequestRejected:
      name: catalog.category-request.rejected
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/CatalogCategoryRequestEvent'}
  schemas:
    CatalogProductEvent:
      type: object
      required: [productId, atin, ownerKind, ownerOrgId, status, title, variants]
      properties:
        productId: {type: string, format: uuid}
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        ownerKind: {type: string, enum: [SELLER, PLATFORM]}
        ownerOrgId: {type: string}
        status: {type: string, enum: [IN_REVIEW, PENDING_CATEGORY_APPROVAL, LIVE, REJECTED, PAUSED, TAKEN_DOWN]}
        title: {type: string}
        categoryId: {type: [string, 'null'], format: uuid}
        productTypeCode: {type: string}
        note: {type: [string, 'null'], description: 'Moderation note; on a takedown "[REASON_CODE] Taken down: note"'}
        reasonCode:
          type: [string, 'null']
          description: Takedown reason code (catalog.product.taken_down only; ListingReasonCode)
        sellerHidden:
          type: boolean
          description: >-
            The owner's listings are hidden by seller-service compliance enforcement (seller.listings.hidden). Keep
            the product off public surfaces regardless of status; set on every catalog.product.* event while hidden.
        preorderEligible:
          type: boolean
          description: May be sold in a community pre-order window (S272); default true for food product types
        shipsNow:
          type: boolean
          description: Always ships now by carrier, never as a pre-order (delivery-runs eligibility excludes it)
        imageUrl:
          type:
          - string
          - 'null'
          description: Public URL of the main (first) product image; the search indexer shows it on product cards
        brand:
          type:
          - string
          - 'null'
          description: The product's brand attribute
        communities:
          type: array
          items:
            type: string
          description: Diaspora communities from the community / communities attribute (comma-separated there)
        condition:
          type: string
          enum: [NEW, RENEWED, USED_LIKE_NEW, USED_VERY_GOOD, USED_GOOD, USED_ACCEPTABLE]
          description: The listed item condition (S307)
        fulfilment:
          type: string
          enum: [SELLER, AFROTRANSACT]
          description: Ships from the seller, or Fulfilled by AfroTransact (S307)
        handlingDays: {type: integer, minimum: 1, maximum: 30, description: Business days from order to dispatch}
        shipFrom:
          type: [object, 'null']
          description: The seller's ship-from location (snapshot); null = the seller's default
          properties:
            locationId: {type: [string, 'null']}
            label: {type: [string, 'null']}
            city: {type: [string, 'null']}
            region: {type: [string, 'null']}
            country: {type: [string, 'null']}
            postalCode: {type: [string, 'null']}
        variants:
          type: array
          items:
            type: object
            properties:
              atin: {type: string}
              sellerSku: {type: string}
              gtin: {type: [string, 'null']}
              priceMinor: {type: integer, format: int64}
              currency: {type: string}
              quantity: {type: integer}
              compareAtMinor:
                type: [integer, 'null']
                format: int64
                description: '"Was" price shown struck through (offers'' list price); null for none (S307)'
    CatalogImportCompleted:
      type: object
      required: [importId, reference, ownerOrgId, uploadedBy, fileName, mode, totalRows, processedRows, createdProducts,
                 updatedProducts, failedRows, skippedRows, notifySeller, finishedAt]
      properties:
        importId: {type: string, format: uuid}
        reference: {type: string, description: Shown to the seller (BU-000123)}
        ownerOrgId: {type: string}
        uploadedBy: {type: string, description: Token subject of the member who uploaded the file}
        fileName: {type: string}
        mode: {type: string, enum: [CREATE, UPDATE]}
        totalRows: {type: integer}
        processedRows: {type: integer}
        createdProducts: {type: integer}
        updatedProducts: {type: integer}
        failedRows: {type: integer}
        skippedRows: {type: integer, description: Rows with errors that were not imported}
        notifySeller: {type: boolean}
        finishedAt: {type: string, format: date-time}
    CatalogProductFlagged:
      type: object
      required: [flagId, productId, atin, ownerKind, ownerOrgId, status, title, source, reasonCode, occurredAt]
      properties:
        flagId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        ownerKind: {type: string, enum: [SELLER, PLATFORM]}
        ownerOrgId: {type: string}
        status: {type: string, enum: [LIVE, PAUSED]}
        title: {type: string}
        categoryId: {type: [string, 'null'], format: uuid}
        productTypeCode: {type: string}
        sellerHidden: {type: boolean}
        source: {type: string, enum: [CUSTOMER_REPORT, STAFF, AUTOMATED]}
        reasonCode:
          type: string
          enum: [PROHIBITED_ITEM, UNAPPROVED_HEALTH_CLAIM, RESTRICTED_INGREDIENT, COUNTERFEIT, IMAGE_POLICY,
                 MISLEADING_CONTENT, LABELLING, SHIPPING_METHOD, DUPLICATE_LISTING, WRONG_CATEGORY, OTHER]
        details: {type: [string, 'null'], description: Reporter's description (required for OTHER)}
        reporterId: {type: [string, 'null'], description: Token subject of the shopper, staff member or service client}
        riskLevel: {type: [string, 'null'], description: Optional risk level of an automated flag (e.g. HIGH)}
        occurredAt: {type: string, format: date-time}
    CatalogProductRatingChanged:
      type: object
      required: [productId, atin, ownerOrgId, average, count, breakdown]
      properties:
        productId: {type: string, format: uuid}
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        ownerOrgId: {type: string}
        average: {type: number, description: Average stars over published reviews, two decimals (0 when there are none)}
        count: {type: integer, minimum: 0, description: Published reviews}
        breakdown:
          type: array
          minItems: 5
          maxItems: 5
          items: {type: integer, minimum: 0}
          description: Reviews that gave 1, 2, 3, 4 and 5 stars, in that order
    CatalogReview:
      type: object
      required: [contentType, reviewId, productId, atin, sellerOrgId, customerId, reviewerName, rating, status, flags,
                 createdAt, reportCount, approvePath, rejectPath, removePath]
      properties:
        contentType: {type: string, enum: [PRODUCT_REVIEW], description: Lets a generic moderation queue route it}
        reviewId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        productTitle: {type: string}
        sellerOrgId: {type: string, description: The product's owner (may reply and report)}
        customerId: {type: string, description: The author's token subject; never public}
        reviewerName: {type: string, description: 'Public display name: first name and last initial, e.g. "Adaeze N."'}
        rating: {type: integer, minimum: 1, maximum: 5}
        title: {type: [string, 'null']}
        text: {type: [string, 'null']}
        photoUrls: {type: array, items: {type: string}}
        status: {type: string, enum: [PENDING, PUBLISHED, REJECTED, REMOVED, DELETED]}
        flags:
          type: array
          items: {type: string, enum: [PROFANITY, LINK, EMAIL, PHONE]}
          description: What the automatic checks found in the current text
        createdAt: {type: string, format: date-time}
        reportCount: {type: integer, description: Reports on the current text}
        reportReason: {type: [string, 'null'], description: Reason of the report that raised catalog.review.reported}
        moderatedBy: {type: [string, 'null'], description: 'Staff subject, trust-ops client, or system:auto-checks'}
        moderatedAt: {type: [string, 'null'], format: date-time}
        reasonCode:
          type: [string, 'null']
          enum: [ABUSIVE, PERSONAL_INFORMATION, SPAM, OFF_TOPIC, CONFLICT_OF_INTEREST, OTHER, null]
        moderationNote: {type: [string, 'null']}
        replyText: {type: [string, 'null']}
        repliedAt: {type: [string, 'null'], format: date-time}
        approvePath: {type: string, description: 'Catalog endpoint that publishes the review (catalog:moderate)'}
        rejectPath: {type: string, description: 'Endpoint that refuses a pending review, body {reasonCode, note}'}
        removePath: {type: string, description: 'Endpoint that takes a review down, body {reasonCode, note}'}
    CatalogCategoryRequestEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        orgId: {type: string}
        path: {type: string}
        status: {type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED]}
