# AsyncAPI 3.0 fragment for notifications-service. Merged into contracts/asyncapi/events.yaml by tools/contracts/merge_asyncapi.py.
# notifications-service only consumes events (consumer group "notifications", inbox de-duplication on event-id);
# it publishes none. The channels below are the producers' topics (same addresses) with the messages notifications
# maps to templates; the producing services own those messages in their fragments. Rules live in
# go/services/notifications/internal/app/rules.go and a contract test checks every mapped type and topic against
# this document. Payloads that carry only user / org ids are resolved through identity
# (GET /v1/internal/users/{id}/contact, GET /v1/internal/orgs/{orgId}/owners; client notifications-service).
# Any consumed topic may also carry notification.requested (explicit template + channels + recipient); email requests
# may reference files (data.attachments, signed media links) that are attached at send time when allowed.
channels:
  notificationsIdentityEvents:
    address: at.identity.events
    description: >-
      identity → one-time codes and organisation invitations (payload recipient, never resolved through identity),
      the welcome email, and contact changes that drop the user's cached contact lookup.
    messages:
      notificationsIdentityVerificationRequested: {$ref: '#/components/messages/identityVerificationRequested'}
      notificationsIdentityUserRegistered: {$ref: '#/components/messages/identityUserRegistered'}
      notificationsIdentityInvitationCreated: {$ref: '#/components/messages/identityInvitationCreated'}
      notificationsIdentityUserPhoneVerified: {$ref: '#/components/messages/identityUserPhoneVerified'}
      notificationsIdentityNotificationPreferencesUpdated: {$ref: '#/components/messages/identityNotificationPreferencesUpdated'}
      notificationsRequestedIdentity: {$ref: '#/components/messages/notificationsRequested'}
  notificationsOrderEvents:
    address: at.order.events
    description: orders → customer order and shipment updates (customerId resolved through identity).
    messages:
      notificationsOrderPlaced: {$ref: '#/components/messages/ordersOrderPlaced'}
      notificationsOrderCancelled: {$ref: '#/components/messages/ordersOrderCancelled'}
      notificationsShipmentStatusChanged: {$ref: '#/components/messages/ordersShipmentStatusChanged'}
      notificationsShipmentDelivered: {$ref: '#/components/messages/ordersShipmentDelivered'}
      notificationsShipmentCancelled: {$ref: '#/components/messages/ordersShipmentCancelled'}
      notificationsRequestedOrders: {$ref: '#/components/messages/notificationsRequested'}
  notificationsSellerApplicationEvents:
    address: at.seller-application.events
    description: seller onboarding → the applicant (applicantUserId resolved through identity).
    messages:
      notificationsSellerApplicationSubmitted: {$ref: '#/components/messages/sellerApplicationSubmitted'}
      notificationsSellerApplicationInfoRequested: {$ref: '#/components/messages/sellerApplicationInfoRequested'}
      notificationsSellerApplicationApproved: {$ref: '#/components/messages/sellerApplicationApproved'}
      notificationsSellerApplicationRejected: {$ref: '#/components/messages/sellerApplicationRejected'}
  notificationsSellerComplianceEvents:
    address: at.seller-compliance.events
    description: >-
      Stripe compliance and enforcement, and Trust and Safety suspension holds (reason SUSPENDED / REINSTATED) →
      every owner of the organisation (orgId → identity owners).
    messages:
      notificationsSellerComplianceChanged: {$ref: '#/components/messages/sellerComplianceChanged'}
      notificationsSellerComplianceReminder: {$ref: '#/components/messages/sellerComplianceReminder'}
      notificationsSellerPayoutsPaused: {$ref: '#/components/messages/sellerPayoutsPaused'}
      notificationsSellerPayoutsResumed: {$ref: '#/components/messages/sellerPayoutsResumed'}
      notificationsSellerListingsHidden: {$ref: '#/components/messages/sellerListingsHidden'}
      notificationsSellerListingsRestored: {$ref: '#/components/messages/sellerListingsRestored'}
  notificationsPayoutEvents:
    address: at.payout.events
    description: payments payouts → every owner of the organisation.
    messages:
      notificationsPayoutPaid: {$ref: '#/components/messages/paymentsPayoutPaid'}
      notificationsPayoutFailed: {$ref: '#/components/messages/paymentsPayoutFailed'}
  notificationsBookingsEvents:
    address: at.bookings.events
    description: bookings → the customer (payload recipient block; missing addresses filled from identity by recipient.id).
    messages:
      notificationsBookingConfirmed: {$ref: '#/components/messages/bookingsConfirmed'}
      notificationsBookingCancelled: {$ref: '#/components/messages/bookingsCancelled'}
      notificationsBookingDeclined: {$ref: '#/components/messages/bookingsDeclined'}
      notificationsBookingRescheduled: {$ref: '#/components/messages/bookingsRescheduled'}
      notificationsBookingBalanceUnpaid: {$ref: '#/components/messages/bookingsBalanceUnpaid'}
      notificationsRequestedBookings: {$ref: '#/components/messages/notificationsRequested'}
  notificationsContentEvents:
    address: at.content.events
    description: content → careers acknowledgements and newsletter double opt-in (payload email).
    messages:
      notificationsCareerApplicationReceived: {$ref: '#/components/messages/contentCareerApplicationReceived'}
      notificationsNewsletterConfirmationRequested: {$ref: '#/components/messages/contentNewsletterConfirmationRequested'}
  notificationsPaymentEvents:
    address: at.payment.events
    description: payments → the customer when an off-session charge needs authentication (customerId resolved through identity).
    messages:
      notificationsPaymentIntentActionRequired: {$ref: '#/components/messages/paymentsIntentActionRequired'}
  notificationsTrustOpsEvents:
    address: at.trustops.events
    description: >-
      trust-ops (S230) → the customer (customerId resolved through identity) and every owner of the seller
      organisation (sellerOrgId / orgId → identity owners) for claims, moderation decisions and suspensions.
    messages:
      notificationsTrustOpsClaimOpened: {$ref: '#/components/messages/trustOpsClaimOpened'}
      notificationsTrustOpsClaimDecided: {$ref: '#/components/messages/trustOpsClaimDecided'}
      notificationsTrustOpsClaimWithdrawn: {$ref: '#/components/messages/trustOpsClaimWithdrawn'}
      notificationsTrustOpsModerationDecided: {$ref: '#/components/messages/trustOpsModerationDecided'}
      notificationsTrustOpsSellerSuspended: {$ref: '#/components/messages/trustOpsSellerSuspended'}
      notificationsTrustOpsSellerReinstated: {$ref: '#/components/messages/trustOpsSellerReinstated'}
      notificationsRequestedTrustOps: {$ref: '#/components/messages/notificationsRequested'}
  notificationsInventoryEvents:
    address: at.inventory.events
    description: inventory availability → back-in-stock alerts (SKU = variant ATIN; available > 0 sends each active alert once).
    messages:
      notificationsInventoryAvailabilityChanged: {$ref: '#/components/messages/inventoryAvailabilityChanged'}
  notificationsRetailEvents:
    address: at.retail.events
    description: >-
      retail (S225/S243) → supplier purchase-order emails requested with notification.requested (templateKey
      retail.purchase_order.sent; recipient = the supplier contact's address, never resolved through identity).
      Typed retail.* events (retail.po.sent, retail.po.dispatched, retail.po.dispatch-failed …) are not mapped.
    messages:
      notificationsRequestedRetail: {$ref: '#/components/messages/notificationsRequested'}
operations:
  consumeNotificationsIdentityEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsIdentityEvents'}
    summary: >-
      identity.verification.requested → identity.verification (email, or the payload's channel; security, never
      resolved through identity), or identity.verification.phone for purpose PHONE_VERIFICATION (sms);
      identity.invitation.created → org.invitation (email to recipient.email only, never resolved through identity:
      the invitee may have no account); identity.user.registered → account.welcome (email; not for STAFF);
      identity.user.phone-verified and identity.notification-preferences.updated send nothing and drop the user's
      cached contact lookup.
  consumeNotificationsOrderEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsOrderEvents'}
    summary: >-
      orders.order.placed → order.confirmed (email, sms, push); orders.order.cancelled with wasPlaced=true →
      order.cancelled (email, push); orders.shipment.status_changed → shipment.shipped (picked_up, or in_transit
      without a pickup scan; email, push), shipment.out_for_delivery (sms, push, email), shipment.ready_for_pickup
      (ready + PICKUP; email, sms, push), shipment.delivery_failed (email, sms, push); orders.shipment.delivered →
      shipment.delivered (email, push); orders.shipment.cancelled → shipment.cancelled (email, push).
  consumeNotificationsSellerApplicationEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsSellerApplicationEvents'}
    summary: >-
      seller.application.submitted → seller.application.submitted (email); info_requested →
      seller.application.info_requested (email, sms); approved → seller.application.approved (email, sms, push);
      rejected → seller.application.rejected (email).
  consumeNotificationsSellerComplianceEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsSellerComplianceEvents'}
    summary: >-
      seller.compliance.reminder → seller.compliance.reminder and seller.compliance.changed (new items, or status
      moved to RESTRICTED_SOON / RESTRICTED) → seller.compliance.action_needed, on the payload's channels (in_app →
      push; reminder category: preferences and quiet hours apply); seller.payouts.paused / resumed and
      seller.listings.hidden / restored → matching templates (email, plus sms when paused / hidden); with reason
      SUSPENDED / REINSTATED (Trust and Safety) → seller.payouts.paused.suspended, seller.listings.hidden.suspended,
      seller.payouts.resumed.reinstated, seller.listings.restored.reinstated (suspension wording, email only:
      trustops.seller.suspended carries the sms).
  consumeNotificationsPayoutEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsPayoutEvents'}
    summary: payments.payout.paid → payout.paid (email, push); payments.payout.failed → payout.failed (email, sms).
  consumeNotificationsBookingsEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsBookingsEvents'}
    summary: >-
      booking.confirmed / cancelled / rescheduled → matching templates (email, sms, push); booking.declined →
      booking.declined (email, push); booking.balance_unpaid → booking.balance_unpaid to the customer (email, push:
      update the card or authenticate). booking.reminder has a template but no event yet: bookings can send it with
      notification.requested (templateKey booking.reminder).
  consumeNotificationsContentEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsContentEvents'}
    summary: >-
      content.career-application.received → careers.application_received (email);
      content.newsletter.confirmation_requested → newsletter.confirm (email).
  consumeNotificationsPaymentEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsPaymentEvents'}
    summary: >-
      payments.intent.action_required with a customerId → payment.authentication_required to the customer (email,
      push; link to the booking for BK- references, else the orders page). Other payment events are ignored.
  consumeNotificationsTrustOpsEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsTrustOpsEvents'}
    summary: >-
      trustops.claim.opened → claim.opened to the customer (email, push) and, while AWAITING_SELLER,
      claim.seller_response_due to the seller owners (email, sms; deadline = dueAt); trustops.claim.decided →
      claim.decided to the customer (email, push) and claim.decided.seller to the seller owners (email);
      trustops.claim.withdrawn → claim.withdrawn to the seller owners (email); trustops.claim.response_due_soon → claim.seller_response_reminder (email, sms) and trustops.claim.response_lapsed → claim.seller_response_lapsed (email) to the seller owners; trustops.moderation.decided with status
      REJECTED → listing.rejected (NEW_LISTING; email) or listing.taken_down (LIVE_LISTING; email, sms) to the seller
      owners; trustops.seller.suspended → seller.suspended (email, sms) and trustops.seller.reinstated →
      seller.reinstated (email) to the seller owners. notification.requested with templateKey claim.opened,
      claim.decided or claim.withdrawn is ignored (the typed claim events above cover both parties).
  consumeNotificationsInventoryEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsInventoryEvents'}
    summary: >-
      inventory.availability.changed with available > 0 claims every active stock alert for the SKU (= variant
      ATIN) and sends stock.back_in_stock (email, push) once; redeliveries re-claim the same alerts and the inbox
      stops a second send.
  consumeNotificationsRetailEvents:
    action: receive
    channel: {$ref: '#/channels/notificationsRetailEvents'}
    summary: >-
      notification.requested with templateKey retail.purchase_order.sent → the supplier PO email (email, to
      recipient.email only; transactional). Fields: contactName, poNumber, supplierName, orderDate, deliverBy,
      incoterm, paymentTerms, total (else totalMinor + currency), documentUrl, documentExpiresAt; nulls render as
      empty and the optional rows are dropped. data.attachments (the PO PDF as a media asset reference) is fetched
      from an allow-listed host within the size limit and attached by Resend, SendGrid, SES and SMTP; otherwise the
      email links to documentUrl. Other retail events are ignored: retail.po.dispatch-failed carries no buyer to
      notify, and retail.po.sent would duplicate the request.
components:
  messages:
    notificationsRequested:
      name: notification.requested
      title: Explicit templated notification request (any consumed topic)
      headers: {$ref: '#/components/schemas/EventHeaders'}
      payload: {$ref: '#/components/schemas/NotificationsRequestedPayload'}
  schemas:
    NotificationsRecipient:
      type: object
      description: >-
        Who to notify. Every field is optional; a channel is used only when its address is present. When id is set
        and an address is missing, notifications fills it from identity.
      properties:
        id: {type: string}
        email: {type: string, format: email}
        phone: {type: string, description: E.164}
        pushTokens:
          type: array
          items:
            type: object
            required: [token, platform]
            properties:
              token: {type: string}
              platform: {type: string, enum: [fcm, apns]}
        timeZone: {type: string, description: IANA zone for quiet hours}
        locale: {type: string}
        name: {type: string, description: Display name (informational; e.g. the supplier contact)}
    NotificationsAttachmentRef:
      type: object
      description: >-
        A file to attach to the email, by signed media link. Fetched at send time only from allow-listed hosts (the
        media base URL's host and configured storage hosts) and up to the size limit; when it cannot be fetched or
        the provider cannot attach files, the email still links to it.
      required: [url]
      properties:
        assetId: {type: string, format: uuid}
        fileName: {type: string, examples: [PO-1P-323.pdf]}
        contentType: {type: string, examples: [application/pdf]}
        url: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    NotificationsRequestedPayload:
      type: object
      required: [templateKey, channels, recipient]
      properties:
        templateKey: {type: string}
        channels: {type: array, items: {type: string, enum: [email, sms, push, chat]}}
        recipient: {$ref: '#/components/schemas/NotificationsRecipient'}
        market: {type: string}
        locale: {type: string}
        data:
          type: object
          additionalProperties: true
          description: Template fields; data.attachments (at most 10) are email attachment references.
          properties:
            attachments: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/NotificationsAttachmentRef'}}
