# gateway-bff · local. Secrets (REDIS_URL outside local, OIDC_CLIENT_SECRET, SESSION_SIGNING_KEY) come from env vars only.
# Upstream URLs can be overridden with <NAME>_URL (SEARCH_URL, CATALOG_URL, …).
port: 8200
docsEnabled: true
redisUrl: redis://localhost:6379/0
market: us
# Shared platform URLs (docs/engineering/environments.md). Helm injects PUBLIC_WEB_URL, SELLER_CENTER_URL,
# STAFF_CONSOLE_URL and AUTH_ISSUER_URL from global.domain and they override these values. The CORS/CSRF origins,
# the storefront origin, the OIDC issuer and the per-app OIDC redirect URIs are derived from them; WEB_ORIGINS,
# WEB_PUBLIC_ORIGIN, OIDC_ISSUER and OIDC_REDIRECT_URI override the derived values.
platform:
  publicWebUrl: http://localhost:3000
  sellerCenterUrl: http://localhost:3010
  staffConsoleUrl: http://localhost:3002
  authIssuerUrl: http://localhost:8100
web:
  bffPath: /api/bff
session:
  cookieName: at_session
  cookieSecure: false
  cookieDomain: ""
  # Upper bound for the session store and cookie; the per-audience sign-out policy (identity) ends sessions earlier.
  # Keep it at least 2160h (90 days): the longest default session length.
  idleTtl: 2208h
oidc:
  clientId: gateway-bff
  scopes: [openid, email, profile, phone, offline_access]
  audience: ""
  verifyBearer: true
upstreams:
  search:
    url: http://localhost:8201
    timeout: 2s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  catalog:
    url: http://localhost:8101
    timeout: 2s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  inventory:
    url: http://localhost:8103
    timeout: 1500ms
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  cart:
    url: http://localhost:8203
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  geo:
    url: http://localhost:8205
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  identity:
    url: http://localhost:8100
    timeout: 5s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  content:
    url: http://localhost:8112
    timeout: 1500ms
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  payments:
    url: http://localhost:8105
    timeout: 5s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  promise:
    url: http://localhost:8204
    timeout: 800ms
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  orders:
    url: http://localhost:8104
    timeout: 10s
    # POST /v1/checkout waits up to orders' checkout-response-timeout (20s): never give up before it.
    slowTimeout: 25s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  notifications:
    url: http://localhost:8208
    timeout: 2s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  seller:
    url: http://localhost:8106
    timeout: 3s
    # a final approval activates the Stripe subscription before it answers (POST /v1/applications/{id}/decision)
    slowTimeout: 20s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  offers:
    url: http://localhost:8102
    timeout: 2s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  bookings:
    url: http://localhost:8109
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  media:
    url: http://localhost:8207
    timeout: 3s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  carrier:
    url: http://localhost:8209
    timeout: 10s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  taxReturns:
    url: http://localhost:8111
    timeout: 5s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  aiGateway:
    url: http://localhost:8113
    timeout: 10s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  trustOps:
    url: http://localhost:8110
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  retail:
    url: http://localhost:8107
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  fulfilment:
    url: http://localhost:8108
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  deliveryRuns:
    url: http://localhost:8115
    timeout: 3s
    # Late pre-order adds wait for delivery-runs → orders (15s) → payments → Stripe.
    slowTimeout: 20s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
rateLimit:
  authPerMinute: 60
  lookupPerMinute: 120
  # Single trusted header (never X-Forwarded-For); empty = socket peer.
  clientIpHeader: ""
  maxBodyBytes: 65536
cache:
  maxEntries: 5000
  defaultTtl: 60s
  catalogTtl: 60s
  referenceTtl: 10m
commerce:
  defaultZip: "77042"
  defaultCity: Houston
  defaultState: TX
  trustEdgeGeo: true
  detectOverrideZip: "77042"
  timeZone: America/Chicago
  # Seller-shipped carrier fee, used ONLY while the staff switch sellerCarrierShippingEnabled is on (off at launch); same as
  # orders at.orders.shipping.carrier-standard-minor / free-carrier-above-minor. The delivery fee itself is orders' shipping settings.
  sellerShippingMinor: 599
  freeShippingThresholdMinor: 3500
  retailOrgId: org_afrotransact_retail
  sellerNames: {}
checkout:
  shippingAllocation: PROPORTIONAL # CHECKOUT_SHIPPING_ALLOCATION: PROPORTIONAL | FIRST_LINE (rollback); open legal decision 5
  requireTaxQuote: false # CHECKOUT_REQUIRE_TAX_QUOTE: refuse a Place order without a valid taxQuoteId (turn on once every client sends it; docs/engineering/checkout-tax-estimate.md)
stripe:
  publishableKey: "" # STRIPE_PUBLISHABLE_KEY (pk_test_… / pk_live_…)
staff:
  exportStore: local
  exportDir: "" # STAFF_EXPORT_DIR (default: the OS temp dir)
telemetry:
  otlpEndpoint: localhost:4318
  sampleRatio: 1.0
