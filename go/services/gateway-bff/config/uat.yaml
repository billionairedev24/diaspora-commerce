# gateway-bff · uat. Secrets (REDIS_URL outside local, OIDC_CLIENT_SECRET, SESSION_SIGNING_KEY) come from env vars only.
# Upstream URLs can be overridden with <NAME>_URL (SEARCH_URL, CATALOG_URL, …).
port: 8080
docsEnabled: true
redisUrl: ""
market: us
# Shared platform URLs (docs/engineering/environments.md). Helm injects PUBLIC_WEB_URL, SELLER_CENTER_URL,
# STAFF_CONSOLE_URL and AUTH_ISSUER_URL from global.domain and they override these values. The CORS/CSRF origins,
# the storefront origin, the OIDC issuer and (outside local) the OIDC redirect URI are derived from them; WEB_ORIGINS,
# WEB_PUBLIC_ORIGIN, OIDC_ISSUER and OIDC_REDIRECT_URI override the derived values.
platform:
  publicWebUrl: https://uat.afrotransact.com
  sellerCenterUrl: https://seller.uat.afrotransact.com
  staffConsoleUrl: https://admin.uat.afrotransact.com
  authIssuerUrl: https://auth.uat.afrotransact.com
web:
  bffPath: /api/bff
session:
  cookieName: at_session
  cookieSecure: true
  cookieDomain: ""
  idleTtl: 720h
oidc:
  clientId: gateway-bff
  scopes: [openid, email, profile, phone, offline_access]
  audience: ""
  verifyBearer: true
upstreams:
  search:
    url: http://search
    timeout: 2s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  catalog:
    url: http://catalog
    timeout: 2s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  inventory:
    url: http://inventory
    timeout: 1500ms
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  cart:
    url: http://cart
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  geo:
    url: http://geo
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  identity:
    url: http://identity
    timeout: 5s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  content:
    url: http://content
    timeout: 1500ms
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  payments:
    url: http://payments
    timeout: 5s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  promise:
    url: http://promise
    timeout: 800ms
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  orders:
    url: http://orders
    timeout: 10s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  notifications:
    url: http://notifications
    timeout: 2s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  seller:
    url: http://seller
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  offers:
    url: http://offers
    timeout: 2s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  bookings:
    url: http://bookings
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  storefront:
    url: http://storefront
    timeout: 2s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  media:
    url: http://media
    timeout: 3s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  carrier:
    url: http://carrier-gateway
    timeout: 10s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  taxReturns:
    url: http://tax-returns
    timeout: 5s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  aiGateway:
    url: http://ai-gateway
    timeout: 10s
    retries: 0
    breaker: {failures: 5, cooldown: 15s}
  trustOps:
    url: http://trust-ops
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  retail:
    url: http://retail
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
  fulfilment:
    url: http://fulfilment
    timeout: 3s
    retries: 1
    breaker: {failures: 5, cooldown: 15s}
rateLimit:
  authPerMinute: 20
  lookupPerMinute: 120
  trustForwardedFor: true
  maxBodyBytes: 65536
cache:
  maxEntries: 5000
  defaultTtl: 60s
  catalogTtl: 60s
  referenceTtl: 10m
commerce:
  defaultZip: "77042"
  defaultCity: Houston
  defaultState: TX
  timeZone: America/Chicago
  sellerShippingMinor: 599
  freeShippingThresholdMinor: 4900
  retailOrgId: org_afrotransact_retail
  sellerNames: {}
stripe:
  publishableKey: "" # STRIPE_PUBLISHABLE_KEY (pk_test_… / pk_live_…)
staff:
  exportStore: local
  exportDir: "" # STAFF_EXPORT_DIR (default: the OS temp dir)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampleRatio: 0.5
