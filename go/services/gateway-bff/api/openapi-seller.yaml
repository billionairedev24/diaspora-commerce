        services: {type: array, items: {$ref: '#/components/schemas/OnboardingServiceLicenceInput'}}
        insuranceDocumentAssetId: {type: string}
        agreementsAccepted: {type: boolean}
        w9Certified: {type: boolean}
        w9SignerName: {type: string, maxLength: 120}
    OnboardingStripeSession:
      type: object
      required: [accountId, clientSecret, publishableKey, expiresAt, localTest]
      properties:
        accountId: {type: string}
        clientSecret: {type: string, description: Account Session client secret for Connect.js}
        publishableKey: {type: string}
        expiresAt: {type: [string, 'null'], format: date-time}
        localTest: {type: boolean, description: The seller service's local stand-in (local profile without a Stripe key only)}
    OnboardingPlanPrice:
      type: object
      required: [cadence, months, totalCents, perMonthCents, savingCents, perMonthLabel, billedLabel, savingLabel, firstCharge]
      properties:
        cadence: {type: string, enum: [MONTHLY, QUARTERLY, ANNUAL]}
        months: {type: integer}
        totalCents: {type: integer, format: int64}
        perMonthCents: {type: integer, format: int64}
        savingCents: {type: integer, format: int64}
        perMonthLabel: {type: string}
        billedLabel: {type: string}
        savingLabel: {type: [string, 'null']}
        firstCharge:
          oneOf:
            - {$ref: '#/components/schemas/OnboardingFirstCharge'}
            - {type: 'null'}
    OnboardingPlans:
      type: object
      required: [plans, publishableKey]
