        statusLabel: {type: string}
        method: {type: string, description: 'DROP_OFF, DRIVER_PICKUP or NO_RETURN'}
        refundMinor: {type: integer, format: int64}
        currency: {type: string}
        refundState: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/SellerReturnLine'}}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        dropOffBy: {type: [string, 'null']}
        createdAt: {type: [string, 'null']}
    SellerReturnList:
      type: object
