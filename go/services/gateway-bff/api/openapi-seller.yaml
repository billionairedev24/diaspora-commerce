  # ───────────────────────────────────────────────────────────── exports
  /v1/seller/exports:
    get:
      tags: [Exports]
      operationId: listSellerExports
      security: [{sessionCookie: []}]
      summary: My exports of the active organisation, newest first (kept 24 hours after they finish)
      responses:
        '200': {description: Export jobs, content: {application/json: {schema: {$ref: '#/components/schemas/ExportJobList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Exports]
      operationId: createSellerExport
      security: [{sessionCookie: []}]
      summary: Export a table as CSV, Excel (with a Summary sheet of native charts) or PDF (with a summary page of charts)
      description: |
        Always scoped to the active organisation and the member's token. `table: orders` (needs VIEW on orders) and
        `table: listings` (VIEW on listings) are read by the BFF (orders `GET /v1/seller/shipments`, catalog
        `GET /v1/products`, up to 50,000 rows) with the table's search, sort and visible columns, or only the selected
        rows (`ids`). Client-side tables (inventory, team, payouts, invoices, fees, earnings, services) send their rows
        (`dataset`). Up to 5,000 rows finish within the request (201 READY, download right away); larger exports are
        queued (202 QUEUED) — poll `GET /v1/seller/exports/{exportId}`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SellerExportRequest'}}}
      responses:
        '201': {description: Export ready, content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}}
        '202': {description: Export queued, content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/exports/{exportId}:
    get:
      tags: [Exports]
      operationId: getSellerExport
      security: [{sessionCookie: []}]
      summary: Status of one export (poll until READY or FAILED); only its member, in the organisation it was made for
      parameters: [{$ref: '#/components/parameters/ExportId'}]
      responses:
        '200': {description: Export job, content: {application/json: {schema: {$ref: '#/components/schemas/ExportJob'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/seller/exports/{exportId}/download:
    get:
      tags: [Exports]
      operationId: downloadSellerExport
      security: [{sessionCookie: []}]
      summary: Redirect to the signed download URL of a ready export
      description: 302 to the signed URL (valid until `expiresAt`); 409 while the job is not ready, 410 once it expired.
      parameters: [{$ref: '#/components/parameters/ExportId'}]
      responses:
        '302':
          description: Signed download URL
          headers:
            Location: {description: Signed URL of the file, schema: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /v1/seller/export-files/{exportId}:
    get:
      tags: [Exports]
      operationId: getSellerExportFile
