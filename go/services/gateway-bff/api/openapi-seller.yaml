        productId: {type: string}
        sellerSku: {type: string}
        condition: {type: string}
        priceMinor: {type: integer}
        currency: {type: string}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        quantity: {type: integer, description: Seller-declared stock (SELLER and AFROTRANSACT_DELIVERY)}
        availableQty: {type: integer}
        shipFromLocationId: {type: [string, 'null'], description: Pickup location (AFROTRANSACT_DELIVERY)}
        shipsFrom: {type: [string, 'null'], examples: ['Houston, TX']}
        status: {type: string, enum: [ACTIVE, PAUSED, WITHDRAWN]}
        version: {type: integer, format: int64}
    SellerOfferList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SellerOffer'}}
    SellerCoupon:
      type: object
