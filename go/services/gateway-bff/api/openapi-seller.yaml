        publishableKey: {type: string, description: 'Stripe publishable key for Stripe Elements (the card of a paid plan); empty locally without Stripe, where Seller Center shows its labelled test card form'}
        plans:
          type: array
          items:
            type: object
            required: [code, name, tagline, monthlyCents, trialDays, features, prices]
            properties:
              code: {type: string}
              name: {type: string}
              tagline: {type: [string, 'null']}
              monthlyCents: {type: integer, format: int64}
              trialDays: {type: integer}
              features: {type: array, items: {type: string}}
              prices: {type: array, items: {$ref: '#/components/schemas/OnboardingPlanPrice'}}
    OnboardingUploadRequest:
      type: object
      required: [fileName, contentType, size]
      properties:
        fileName: {type: string, minLength: 1, maxLength: 200}
        contentType: {type: string, enum: [application/pdf, image/jpeg, image/png, image/webp]}
        size: {type: integer, minimum: 1, maximum: 15728640}
    ComplianceStatus: {type: string, enum: [COMPLIANT, ACTION_NEEDED, RESTRICTED_SOON, RESTRICTED, VERIFYING]}
    ComplianceSummary:
      type: object
      required: [status, showBanner, tone, title, message, openItems, deadline, payoutsPaused, chargesEnabled, payoutsEnabled, listingsHidden, payoutBank, items]
      properties:
        status: {$ref: '#/components/schemas/ComplianceStatus'}
        showBanner: {type: boolean}
        tone: {type: string, enum: [none, info, warning, danger]}
        title: {type: string}
        message: {type: string}
        openItems: {type: integer, minimum: 0}
        deadline: {type: [string, 'null'], format: date-time}
        payoutsPaused: {type: boolean}
        chargesEnabled: {type: boolean}
        payoutsEnabled: {type: boolean}
        listingsHidden: {type: boolean}
        payoutBank:
          description: The payout bank account Stripe holds (changed in Stripe's account management component)
          oneOf:
            - type: object
              required: [bankName, last4, status]
              properties:
                bankName: {type: [string, 'null']}
                last4: {type: [string, 'null']}
                status: {type: [string, 'null']}
            - {type: 'null'}
        items:
          type: array
          items:
            type: object
            required: [requirement, label, bucket, component]
            properties:
              requirement: {type: string}
              label: {type: string}
              bucket: {type: string}
              component:
                type: string
                enum: [account_onboarding, account_management]
                description: The Stripe embedded component that collects it (nothing is answered through AfroTransact)
    # ── dashboard
    ChartTone: {type: string, enum: [ink, gold, green, blue, red, grey]}
    ChartKind: {type: string, enum: [trend, hbar, donut, stack]}
    ChartSpec:
      type: object
      description: One chart and its rows. Money series are in major currency units (dollars) so exports read naturally.
      required: [id, title, kind, categoryLabel, valueFormat, series, rows, available]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {$ref: '#/components/schemas/ChartKind'}
        categoryLabel: {type: string}
        valueFormat: {type: string, enum: [money, count]}
        series:
          type: array
          items:
            type: object
            required: [key, label, tone]
            properties:
              key: {type: string}
              label: {type: string}
              tone: {$ref: '#/components/schemas/ChartTone'}
              format: {type: string, enum: [money, count]}
        rows:
          type: array
          items:
            type: object
            required: [category, values]
            properties:
              category: {type: string}
              values: {type: object, additionalProperties: {type: number}}
        available: {type: boolean}
    Kpi:
      type: object
      required: [label, value, detail, tone]
      properties:
        label: {type: string}
        value: {type: string}
        detail: {type: string}
        tone: {type: string, enum: [positive, attention, neutral]}
    TodoItem:
      type: object
      required: [label, module, tone]
      properties:
        label: {type: string}
        module: {$ref: '#/components/schemas/ModuleKey'}
        tone: {type: string, enum: [info, warning, success, danger]}
    Dashboard:
      type: object
      required: [portal, rangeDays, kpis, charts, todo]
      properties:
        portal: {$ref: '#/components/schemas/Portal'}
        rangeDays: {type: integer}
        kpis: {type: array, items: {$ref: '#/components/schemas/Kpi'}}
        charts: {type: array, items: {$ref: '#/components/schemas/ChartSpec'}}
        todo: {type: array, items: {$ref: '#/components/schemas/TodoItem'}}
    # ── orders
    Fulfilment:
      type: string
      enum: [SELLER, AFROTRANSACT, AFROTRANSACT_DELIVERY]
      description: 'SELLER = I ship it; AFROTRANSACT = Fulfilled by AfroTransact (FBA); AFROTRANSACT_DELIVERY = AfroTransact picks up from my store (S255)'
    ShipmentStatus:
      type: string
      enum: [PENDING_PAYMENT, PLACED, CONFIRMED, PACKED, READY, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERY_FAILED, DELIVERED, RETURNED, CANCELLED]
    SuggestedParcel:
      type: object
      required: [weightLb, lengthIn, widthIn, heightIn]
      properties:
        weightLb: {type: number}
        lengthIn: {type: number}
        widthIn: {type: number}
        heightIn: {type: number}
    SellerStatusAction: {type: string, enum: [CONFIRMED, PACKED, READY, PICKED_UP, DELIVERED], description: 'The only statuses a seller may set. PICKED_UP ("Shipped": handed to the carrier) needs a label and applies to carrier parcels. DELIVERED is the handover of a pickup order at the seller''s own shop and needs the buyer''s 4-digit code (handoverCode).'}
    SellerOrderRow:
      type: object
      required: [orderNumber, shipmentId, placedAt, buyerName, shipTo, itemsSummary, itemCount, totalMinor, currency, fulfilment, status, statusLabel, carrier, trackingNumber, nextActions, canBuyLabel]
      properties:
        orderNumber: {type: string}
        shipmentId: {type: string}
        placedAt: {type: string, format: date-time}
        buyerName: {type: string}
        shipTo: {type: string, description: '"City, ST"'}
        itemsSummary: {type: string}
        itemCount: {type: integer}
        totalMinor: {type: integer}
        currency: {type: string}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        statusLabel: {type: string}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        nextActions: {type: array, items: {$ref: '#/components/schemas/SellerStatusAction'}}
        canBuyLabel: {type: boolean}
    SellerOrderPage:
      type: object
      required: [items, nextCursor, total, sort, partial]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SellerOrderRow'}}
        nextCursor: {type: [string, 'null']}
        total: {type: integer}
        sort: {type: array, items: {type: string}, description: 'The applied sort (`<column>,asc|desc`); empty for newest first'}
        partial: {type: boolean, description: 'The search or sort covered the first 5,000 shipments only'}
    BusinessPageSettings:
      type: object
      required: [name, slug, description, brandColor, logoUrl, contactEmail, canEdit]
      properties:
        name: {type: string}
        slug: {type: [string, 'null'], description: 'The address of the page (/b/{slug}); null until the page is first made'}
        description: {type: [string, 'null']}
        brandColor: {type: [string, 'null'], description: '#rrggbb'}
        logoUrl: {type: [string, 'null'], description: 'https URL of the uploaded logo'}
        contactEmail: {type: [string, 'null']}
        canEdit: {type: boolean}
    BusinessPageSettingsInput:
      type: object
      properties:
        description: {type: string, maxLength: 500}
        brandColor: {type: string, description: '#rrggbb or empty', maxLength: 7}
        logoUrl: {type: string, description: 'https URL from POST /v1/seller/uploads (purpose storefront), or empty', maxLength: 2048}
    ShipFromAddress:
      type: object
      required: [id, label, name, company, phone, line1, line2, city, state, postalCode, country, isDefault, version, position, afrotransactPickup]
      properties:
        id: {type: string}
        label: {type: string, example: Houston warehouse}
        name: {type: string}
        company: {type: string}
        phone: {type: string}
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        state: {type: string}
        postalCode: {type: string}
        country: {type: string}
        isDefault: {type: boolean}
        version: {type: integer, format: int64}
        position:
          oneOf: [{$ref: '#/components/schemas/GeoPosition'}, {type: 'null'}]
          description: Where geo-service located the address; null until it could (geocoding failed or geo was down)
        afrotransactPickup: {$ref: '#/components/schemas/AfrotransactPickup'}
        customerPickup: {$ref: '#/components/schemas/CustomerPickup'}
    CustomerPickup:
      type: object
      description: Customers can collect their orders at this address (a carrier-gateway SELLER pickup location with the same id)
      required: [enabled, hours, readyHours]
      properties:
        enabled: {type: boolean}
        hours: {type: array, items: {$ref: '#/components/schemas/PickupWindow'}}
        readyHours: {type: integer, minimum: 0, maximum: 168, description: Typical hours from order to ready for pickup}
    CustomerPickupRequest:
      type: object
      required: [enabled, hours]
      properties:
        enabled: {type: boolean}
        hours: {type: array, maxItems: 14, items: {$ref: '#/components/schemas/PickupWindow'}, description: At least one window to enable}
        readyHours: {type: integer, minimum: 0, maximum: 168}
    GeoPosition:
      type: object
      required: [lat, lng, precision, geocodedAt]
      properties:
        lat: {type: number}
        lng: {type: number}
        precision: {type: string, enum: [ADDRESS, ZIP, POINT], description: 'ADDRESS = street level; ZIP = ZIP centroid only (not enough for a driver)'}
        geocodedAt: {type: [string, 'null'], format: date-time}
    PickupWindow:
      type: object
      required: [day, opens, closes]
      properties:
        day: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
        opens: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 24-hour local time}
        closes: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    AfrotransactPickup:
      type: object
      description: 'AfroTransact Delivery from this address: the seller packs, the nearest AfroTransact driver collects during the pickup hours'
      required: [enabled, hours, zoneName, enabledAt]
      properties:
        enabled: {type: boolean}
        hours: {type: array, items: {$ref: '#/components/schemas/PickupWindow'}}
        zoneName: {type: [string, 'null'], description: Delivery zone covering (or nearest to) the address}
        enabledAt: {type: [string, 'null'], format: date-time}
    AfrotransactPickupRequest:
      type: object
      required: [enabled, hours]
      properties:
        enabled: {type: boolean}
        hours: {type: array, maxItems: 14, items: {$ref: '#/components/schemas/PickupWindow'}, description: At least one window to enable}
        version: {type: [integer, 'null'], format: int64, description: Version being edited}
    AssistantStatus:
      type: object
      required: [tier, limits, used, remaining, upgrade]
      properties:
        tier: {type: string, enum: [ESSENTIALS, GROWTH, PRO]}
        limits:
          type: object
          required: [label, dailyMessages, maxToolRounds, history, tools, canPropose]
          properties:
            label: {type: string, example: Lola Growth}
            dailyMessages: {type: integer, description: Messages a day (UTC); Lola starts again at midnight UTC}
            maxToolRounds: {type: integer}
            history: {type: integer, description: Earlier messages she remembers in a conversation}
            tools: {type: array, items: {type: string}, description: 'my_orders, order_detail, my_listings, stock_levels, fees_and_plan, payouts, sales_summary, propose_set_stock, propose_next_step'}
            canPropose: {type: boolean, description: She can prepare a change for the seller to confirm}
        used: {type: integer}
        remaining: {type: integer}
        upgrade:
          oneOf:
            - type: 'null'
            - type: object
              required: [planCode, label, gains]
              properties:
                planCode: {type: string}
                label: {type: string}
                gains: {type: string}
    AssistantChatRequest:
      type: object
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 1500}
        history:
          type: array
          description: The earlier turns the browser kept (the last few are used, by tier)
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string, enum: [user, assistant]}
              content: {type: string}
        language: {type: string, description: Reply language (BCP 47)}
    AssistantReply:
      type: object
      required: [answer, steps, proposals, status]
      properties:
        answer: {type: string}
        steps:
          type: array
          description: What she looked up, for the seller to see ("Checking your orders")
          items:
            type: object
            required: [tool, label]
            properties:
              tool: {type: string}
              label: {type: string}
        proposals:
          type: array
          description: Changes she prepared. Nothing happens until the seller taps one.
          items: {$ref: '#/components/schemas/AssistantProposal'}
        status: {$ref: '#/components/schemas/AssistantStatus'}
    AssistantProposal:
      type: object
      required: [kind, label]
      properties:
        kind: {type: string, enum: [SET_STOCK, NEXT_STEP]}
        label: {type: string, example: Set JOLLOF-1 to 40}
        sku: {type: string, description: SET_STOCK}
        quantity: {type: integer, description: SET_STOCK}
        orderNumber: {type: string, description: NEXT_STEP}
        shipmentId: {type: string, description: NEXT_STEP}
        step: {type: string, enum: [CONFIRMED, PACKED, READY], description: NEXT_STEP}
    SellerOffer:
