      tags: [Inventory & FBA]
      operationId: postSellerFbaInboundCancel
      security: [{sessionCookie: []}]
      summary: inventory `POST /v1/inbound/shipments/{id}/cancel`
      description: 'Mirrors inventory `POST /v1/inbound/shipments/{id}/cancel` with the member''s token for the active organisation (Inventory module EDIT). ownerOrg in the body is ignored. The body is inventory''s `InboundShipment` (contracts/openapi/inventory.yaml).'
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._~-]{1,80}$'}}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        description: The inventory request body, relayed as is.
        content: {application/json: {schema: {$ref: '#/components/schemas/MirroredBody'}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InboundShipment'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/fba/inbound/{id}/labels:
    get:
      tags: [Inventory & FBA]
      operationId: getSellerFbaInboundLabels
      security: [{sessionCookie: []}]
      summary: inventory `GET /v1/inbound/shipments/{id}/labels`
      description: 'Mirrors inventory `GET /v1/inbound/shipments/{id}/labels` with the member''s token for the active organisation (Inventory module VIEW).'
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._~-]{1,80}$'}}
        - {name: kind, in: query, schema: {type: string, maxLength: 120}}
        - {name: format, in: query, schema: {type: string, maxLength: 120}}
        - {name: lineNo, in: query, schema: {type: integer}}
      responses:
        '200':
          description: The document (PDF, ZPL as text/plain, or EDI X12)
          content:
            application/pdf: {schema: {type: string, format: binary}}
            text/plain: {schema: {type: string}}
            application/octet-stream: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/fba/lots:
    get:
      tags: [Inventory & FBA]
      operationId: getSellerFbaLots
      security: [{sessionCookie: []}]
      summary: inventory `GET /v1/lots`
      description: 'Mirrors inventory `GET /v1/lots` with the member''s token for the active organisation (Inventory module VIEW). Filtered to the active organisation (ownerOrg is set by the BFF). The body is inventory''s `LotPage` (contracts/openapi/inventory.yaml).'
      parameters:
        - {name: sku, in: query, schema: {type: string, maxLength: 120}}
        - {name: nodeId, in: query, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, schema: {type: string, maxLength: 120}}
        - {name: lotNo, in: query, schema: {type: string, maxLength: 120}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryLotPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/fba/lots/markdown:
    get:
      tags: [Inventory & FBA]
      operationId: getSellerFbaLotsMarkdown
      security: [{sessionCookie: []}]
      summary: inventory `GET /v1/lots/markdown`
      description: 'Mirrors inventory `GET /v1/lots/markdown` with the member''s token for the active organisation (Inventory module VIEW). Filtered to the active organisation (ownerOrg is set by the BFF).'
      parameters:
        - {name: within, in: query, schema: {type: string, maxLength: 120}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MirroredList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/fba/lots/{id}:
    get:
      tags: [Inventory & FBA]
      operationId: getSellerFbaLotsById
      security: [{sessionCookie: []}]
      summary: inventory `GET /v1/lots/{id}`
      description: 'Mirrors inventory `GET /v1/lots/{id}` with the member''s token for the active organisation (Inventory module VIEW). The body is inventory''s `Lot` (contracts/openapi/inventory.yaml).'
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._~-]{1,80}$'}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryLot'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: at_session
      description: Opaque BFF session id (HttpOnly, Secure, SameSite=Lax). Tokens stay server-side.
  parameters:
    Sort:
      name: sort
      in: query
      style: form
      explode: true
      description: |
        Sort column and direction, `<column>,asc|desc` (the Spring Data convention); repeat for secondary keys (at most
        3). Empty cells sort last in both directions.
      schema:
        type: array
        maxItems: 3
        items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.]{0,79}(,(asc|desc|ASC|DESC))?$'}
    ExportId: {name: exportId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}
    OrderNumber: {name: orderNumber, in: path, required: true, schema: {type: string}}
    ShipmentId: {name: shipmentId, in: path, required: true, schema: {type: string}}
    ProductId: {name: productId, in: path, required: true, schema: {type: string}}
    DraftId: {name: draftId, in: path, required: true, schema: {type: string, maxLength: 64}}
    ImportId: {name: importId, in: path, required: true, schema: {type: string, maxLength: 64}}
    PaymentMethodId: {name: paymentMethodId, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}, description: Makes retries safe (same key = same result).}
    IdempotencyKeyRequired: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}, description: Same key = same label; never buys twice.}
    IfMatch: {name: If-Match, in: header, required: false, schema: {type: string, maxLength: 40}, description: The version from the ETag (optimistic locking).}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Validation failed; `errors` maps request properties to messages
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    SellerRunPickupList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SellerRunPickup'}}
    SellerRunPickup:
      type: object
      description: One delivery run's pick list for the organisation (S264)
      required: [runId, town, state, timeZone, runStatus, windowStart, windowEnd, pickupAt, dropMode, orders, units, collectedOrders, items, bags]
      properties:
        runId: {type: string, format: uuid}
        town: {type: string, example: Bastrop}
        state: {type: string, example: TX}
        timeZone: {type: string, example: America/Chicago}
        runStatus: {type: string, enum: [CONFIRMED, COLLECTING, OUT_FOR_DELIVERY, COMPLETED], description: 'CONFIRMED: pack for the pickup; COLLECTING: the driver is collecting; OUT_FOR_DELIVERY and COMPLETED: everything left the sellers'}
        windowStart: {type: string, format: date-time, description: The delivery window opens}
        windowEnd: {type: string, format: date-time}
        pickupAt: {type: [string, 'null'], format: date-time, description: When the driver collects from the sellers}
        dropMode: {type: string, enum: [DOORSTEP, PICKUP_POINT]}
        orders: {type: integer, description: Run orders with lines of the organisation}
        units: {type: integer, description: Units to pick in total}
        collectedOrders: {type: integer, description: Orders the driver has already collected}
        items: {type: array, items: {$ref: '#/components/schemas/RunPickItem'}, description: 'Units per product across all orders, most units first'}
        bags: {type: array, items: {$ref: '#/components/schemas/RunOrderBag'}, description: 'One per order, by order number'}
    RunPickItem:
      type: object
      required: [atin, name, units]
      properties:
        atin: {type: string}
        name: {type: string}
        units: {type: integer}
    RunOrderBag:
      type: object
      required: [orderNumber, collected, units, lines]
      properties:
        orderNumber: {type: string, example: LBK-7-1001, description: Write it on the bag}
        collected: {type: boolean, description: The driver has collected the bag}
        units: {type: integer}
        lines: {type: array, items: {$ref: '#/components/schemas/RunPickItem'}}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          description: |
            Stable machine code: VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, NOT_APPROVED,
            NO_ORGANISATION, RATE_LIMITED, UPSTREAM_UNAVAILABLE, UPSTREAM_ERROR; exports: EXPORT_NOT_READY,
            EXPORT_EXPIRED; team: LAST_OWNER, INVALID_ROLE,
            OWNER_ONLY, OWN_ROLE, ALREADY_MEMBER, INVITATION_EXPIRED, INVITATION_USED, INVITATION_REVOKED,
            INVITATION_EMAIL_MISMATCH; AfroTransact pickup (S255): PICKUP_ORG_NOT_APPROVED, PICKUP_INVALID_HOURS,
            PICKUP_NOT_GEOCODED, PICKUP_OUTSIDE_DELIVERY_AREA; start selling (S286): STAFF_CANNOT_APPLY,
            ALREADY_APPROVED, APPLICATION_EXISTS.
        errors:
          type: object
          additionalProperties: {type: string}
      additionalProperties: true
    # ── shell
    OrgKind: {type: string, enum: [SELLER, PROVIDER]}
    OrgStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, FLAGGED, AWAITING_FINAL_APPROVAL, INFO_REQUESTED, APPROVED, REJECTED, SUSPENDED]
    Portal: {type: string, enum: [SELLER_CENTER, PROVIDER_HUB]}
    AccessLevel: {type: string, enum: [VIEW, EDIT, APPROVE, FULL]}
    ModuleKey:
      type: string
      enum: [onboarding, home, orders, returns, disputes, listings, reviews, inventory, coupons, calendar, requests, hours, services, policy, earnings, payouts, fees, billing, account-health, team]
    SellerUser:
      type: object
      required: [id, firstName, lastName, email, initials]
      properties:
        id: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        initials: {type: string}
    OrgSummary:
      type: object
      required: [id, kind, name, status, approved, roleKey, roleLabel]
      properties:
        id: {type: string}
        kind: {$ref: '#/components/schemas/OrgKind'}
        name: {type: string}
        status: {$ref: '#/components/schemas/OrgStatus'}
        approved: {type: boolean}
        roleKey: {type: string, description: 'Organisation role, e.g. seller.owner or provider.practitioner'}
        roleLabel: {type: string}
    NavModule:
      type: object
      required: [key, label, level, badge]
      properties:
        key: {$ref: '#/components/schemas/ModuleKey'}
        label: {type: string}
        level: {$ref: '#/components/schemas/AccessLevel'}
        badge: {type: [integer, 'null'], description: 'Count shown next to the item (orders to ship, requests waiting, open compliance items)'}
    NavGroup:
      type: object
      required: [key, label, modules]
      properties:
        key: {type: string}
        label: {type: string}
        modules: {type: array, items: {$ref: '#/components/schemas/NavModule'}}
    SellerSession:
      type: object
      required: [user, orgs, activeOrg, portal, approved, navGroups, landing, accessNote, capabilities]
      properties:
        user: {$ref: '#/components/schemas/SellerUser'}
        orgs: {type: array, items: {$ref: '#/components/schemas/OrgSummary'}}
        activeOrg:
          oneOf:
            - {$ref: '#/components/schemas/OrgSummary'}
            - {type: 'null'}
        portal:
          oneOf:
            - {$ref: '#/components/schemas/Portal'}
            - {type: 'null'}
        approved: {type: boolean}
        navGroups:
          type: array
          description: Sidebar groups in order; only Onboarding until the organisation is approved.
          items: {$ref: '#/components/schemas/NavGroup'}
        landing: {$ref: '#/components/schemas/ModuleKey'}
        accessNote: {type: string}
        capabilities:
          type: array
          description: >-
            What the active organisation's plan includes. Anything not listed is not shown (Seller Center hides it, the
            BFF refuses it with 403 PLAN_FEATURE_REQUIRED).
          items: {type: string, enum: [bulkUpload, imageLibrary, coupons, aiListingWriter, lola]}
    ActiveOrgRequest:
      type: object
      required: [orgId]
      properties:
        orgId: {type: string, minLength: 1}
    OnboardingStepState: {type: string, enum: [DONE, TODO, ACTION, WAITING, BLOCKED]}
    OnboardingStep:
      type: object
      required: [key, slug, label, sub, state]
      properties:
        key: {type: string, enum: [BUSINESS, BUSINESS_DETAILS, OWNERS, STRIPE_VERIFICATION, PAYOUTS, PLAN, CATALOG_COMPLIANCE, REVIEW]}
        slug: {type: string, description: 'URL segment in Seller Center (/onboarding/<slug>)', enum: [business, business-details, owners, stripe-verification, payouts, plan, catalog-compliance, review]}
        label: {type: string, description: 'Design title: "About you" for a sole proprietor, "Services & licences" for services only'}
        sub: {type: string}
        state:
          allOf: [{$ref: '#/components/schemas/OnboardingStepState'}]
          description: DONE only when the seller service finds the step's required data complete and valid (Stripe verification and Payouts from what Stripe reports). REVIEW is WAITING while staff review the application.
    OnboardingStripeStatus: {type: string, enum: [NOT_STARTED, IN_PROGRESS, REQUIREMENTS_DUE, PENDING, VERIFIED, REJECTED]}
    OnboardingStripe:
      type: object
      required: [status, detailsSubmitted, chargesEnabled, payoutsEnabled, identityStatus, taxIdStatus, currentlyDue]
      properties:
        status: {$ref: '#/components/schemas/OnboardingStripeStatus'}
        detailsSubmitted: {type: boolean}
        chargesEnabled: {type: boolean}
        payoutsEnabled: {type: boolean}
        identityStatus: {type: [string, 'null']}
        taxIdStatus: {type: [string, 'null']}
        currentlyDue: {type: array, items: {type: string}, description: Stripe requirement keys still due}
    OnboardingTimelineEntry:
      type: object
      required: [action, status, note, occurredAt]
      properties:
        action: {type: string}
        status: {type: string}
        note: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
    OnboardingStatus:
      type: object
      required: [orgId, kind, status, reference, steps, requestedItems, canResume, resumeStep, submittedAt, stripe, timeline, form]
      properties:
        orgId: {type: string}
        kind: {$ref: '#/components/schemas/OrgKind'}
        status: {type: string}
        reference: {type: [string, 'null']}
        steps: {type: array, items: {$ref: '#/components/schemas/OnboardingStep'}}
        requestedItems: {type: array, items: {type: string}}
        canResume: {type: boolean}
        resumeStep: {type: string, description: Slug of the first incomplete step (review once every step is complete)}
        submittedAt: {type: [string, 'null'], format: date-time}
        stripe: {$ref: '#/components/schemas/OnboardingStripe'}
        timeline: {type: array, items: {$ref: '#/components/schemas/OnboardingTimelineEntry'}}
        form: {$ref: '#/components/schemas/OnboardingForm'}
    StartOnboardingRequest:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/OrgKind'}
    OnboardingOffering: {type: [string, 'null'], enum: [PRODUCTS, SERVICES, BOTH, null]}
    OnboardingEntityType:
      type: [string, 'null']
      enum: [SOLE_PROPRIETOR, SINGLE_MEMBER_LLC, MULTI_MEMBER_LLC, CORPORATION, PARTNERSHIP, NONPROFIT, null]
    OnboardingAddress:
      type: object
      required: [line1, line2, city, state, postalCode, country]
      properties:
        line1: {type: [string, 'null']}
        line2: {type: [string, 'null']}
        city: {type: [string, 'null']}
        state: {type: [string, 'null'], description: Two-letter state code}
        postalCode: {type: [string, 'null']}
        country: {type: [string, 'null'], description: ISO 3166-1 alpha-2}
    OnboardingOwner:
      type: object
      required: [firstName, lastName, title, email, ownershipPercent, significantControl, dateOfBirth, address]
      properties:
        firstName: {type: [string, 'null']}
        lastName: {type: [string, 'null']}
        title: {type: [string, 'null']}
        email: {type: [string, 'null']}
        ownershipPercent: {type: [number, 'null']}
        significantControl: {type: boolean}
        dateOfBirth: {type: [string, 'null'], format: date}
        address:
          oneOf:
            - {$ref: '#/components/schemas/OnboardingAddress'}
            - {type: 'null'}
    OnboardingFirstCharge:
      type: object
      required: [chargeOn, amountCents, sentence]
      properties:
        chargeOn: {type: [string, 'null'], format: date}
        amountCents: {type: integer, format: int64}
        sentence: {type: string}
    OnboardingFoodPermitType: {type: string, enum: [FOOD_ESTABLISHMENT, COTTAGE_FOOD, FDA_FACILITY, FOOD_HANDLER]}
    OnboardingFoodPermit:
      type: object
      required: [permitType, permitNumber, issuingAuthority, expiresOn, documentAssetId]
      properties:
        permitType: {type: [string, 'null'], description: OnboardingFoodPermitType}
        permitNumber: {type: [string, 'null']}
        issuingAuthority: {type: [string, 'null']}
        expiresOn: {type: [string, 'null'], format: date}
        documentAssetId: {type: [string, 'null']}
    OnboardingServiceLicence:
      type: object
      required: [serviceName, regulated, licenceNumber, issuingState, expiresOn, documentAssetId]
      properties:
        serviceName: {type: string}
        regulated: {type: boolean}
        licenceNumber: {type: [string, 'null']}
        issuingState: {type: [string, 'null']}
        expiresOn: {type: [string, 'null'], format: date}
        documentAssetId: {type: [string, 'null']}
    OnboardingForm:
      type: object
      description: |
        Every answer of the wizard (S286, S289). `prefilled` lists the fields filled in from the account and still
        unchanged: business.contactEmail, business.phone, business.storeName, details.legalFirstName,
        details.legalLastName, details.address. The tax ID and bank numbers are never returned (masked / last 4).
      required: [business, details, owners, payouts, plan, compliance, documents, prefilled, editable]
      properties:
        business:
          type: object
          required: [offering, entityType, country, storeName, contactEmail, phone, description, brandColor, logoUrl]
          properties:
            offering: {$ref: '#/components/schemas/OnboardingOffering'}
            entityType: {$ref: '#/components/schemas/OnboardingEntityType'}
            country: {type: [string, 'null']}
            storeName: {type: [string, 'null']}
            contactEmail: {type: [string, 'null']}
            phone: {type: [string, 'null'], description: E.164}
            description: {type: [string, 'null'], description: What the business sells or does; shown on its public page and given to Stripe}
            brandColor: {type: [string, 'null'], description: '#rrggbb, the one colour of its public page'}
            logoUrl: {type: [string, 'null'], description: https URL of its logo}
        details:
          type: object
          required: [legalFirstName, legalLastName, legalName, dba, taxIdType, taxIdMasked, dateOfBirth, stateOfFormation, dateOfFormation, address, formationDocumentAssetId, irsDeterminationLetterAssetId]
          properties:
            legalFirstName: {type: [string, 'null']}
            legalLastName: {type: [string, 'null']}
            legalName: {type: [string, 'null'], description: Registered business name (not for sole proprietors)}
            dba: {type: [string, 'null']}
            taxIdType: {type: [string, 'null'], enum: [SSN, ITIN, EIN, null]}
            taxIdMasked: {type: [string, 'null'], description: 'e.g. •••-••-6789'}
            dateOfBirth: {type: [string, 'null'], format: date}
            stateOfFormation: {type: [string, 'null']}
            dateOfFormation: {type: [string, 'null'], format: date}
            address:
              oneOf:
                - {$ref: '#/components/schemas/OnboardingAddress'}
                - {type: 'null'}
            formationDocumentAssetId: {type: [string, 'null']}
            irsDeterminationLetterAssetId: {type: [string, 'null']}
        owners: {type: array, items: {$ref: '#/components/schemas/OnboardingOwner'}}
        payouts:
          type: object
          description: |
            The payout bank account Stripe holds, read-only: Stripe collects it in its embedded onboarding ("Stripe
            verification") and changes it in account management ("Change bank account"). Never the numbers.
          required: [status, bankName, accountLast4, bankStatus, linked]
          properties:
            status:
              type: string
              enum: [NOT_STARTED, NEEDS_BANK, FAILED, VERIFYING, READY]
              description: |
                NOT_STARTED (no Stripe account yet), NEEDS_BANK (Stripe holds no bank yet: finish Stripe verification),
                FAILED (Stripe rejected the bank: change it), VERIFYING (bank on file, payouts not on yet), READY (the
                step is complete).
            bankName: {type: [string, 'null']}
            accountLast4: {type: [string, 'null']}
            bankStatus: {type: [string, 'null'], description: "Stripe's status: new, validated, verified, verification_failed, errored"}
            linked: {type: boolean, description: Stripe holds a usable payout account}
        plan:
          type: object
          required: [planCode, planName, cadence, paymentMethodKind, cardBrand, cardLast4, cardExpMonth, cardExpYear, firstCharge, planFeeCollection, planFeeCollectionAvailable, planFeeCollectionDefault]
          properties:
            planCode: {type: [string, 'null']}
            planName: {type: [string, 'null']}
            cadence: {type: [string, 'null'], enum: [MONTHLY, QUARTERLY, ANNUAL, null]}
            paymentMethodKind: {type: [string, 'null'], enum: [CARD, US_BANK_ACCOUNT, null]}
            cardBrand: {type: [string, 'null']}
            cardLast4: {type: [string, 'null']}
            cardExpMonth: {type: [integer, 'null']}
            cardExpYear: {type: [integer, 'null']}
            firstCharge:
              oneOf:
                - {$ref: '#/components/schemas/OnboardingFirstCharge'}
                - {type: 'null'}
            planFeeCollection:
              description: How the applicant chose to pay the plan (S298); null keeps the platform default
              oneOf:
                - {$ref: '#/components/schemas/PlanFeeCollectionMode'}
                - {type: 'null'}
            planFeeCollectionAvailable: {type: boolean, description: 'The platform offers paying the plan from sales (kill switch on); false hides the choice'}
            planFeeCollectionDefault: {$ref: '#/components/schemas/PlanFeeCollectionMode'}
        compliance:
          type: object
          required: [categories, foodPermit, beautyLabellingConfirmed, services, insuranceDocumentAssetId, agreementsAccepted, w9Certified, w9SignerName]
          properties:
            categories: {type: array, items: {type: string}}
            foodPermit:
              oneOf:
                - {$ref: '#/components/schemas/OnboardingFoodPermit'}
                - {type: 'null'}
            beautyLabellingConfirmed: {type: [boolean, 'null']}
            services: {type: array, items: {$ref: '#/components/schemas/OnboardingServiceLicence'}}
            insuranceDocumentAssetId: {type: [string, 'null']}
            agreementsAccepted: {type: [boolean, 'null']}
