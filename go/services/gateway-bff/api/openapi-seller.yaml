openapi: 3.1.0
info:
  title: Gateway BFF API (Seller Center & Provider Hub)
  version: v1
  summary: Screen-shaped API for the Seller Center and Provider Hub back offices (web/apps/seller-center).
  description: |
    The same gateway BFF (Go, port 8200) that serves the storefront also serves the seller and service-provider
    back offices under `/v1/seller/...`. Browsers never talk to the domain services: the Seller Center's same-origin
    `/api/bff` proxy forwards to the BFF, which relays the signed-in member's access token (token relay) to
    identity, seller, catalog, inventory, offers, orders, payments, bookings, storefront, media and carrier-gateway.

    **Sessions.** The HttpOnly `at_session` cookie issued by the BFF (shared cookie domain with the storefront, so a
    member who signs in once reaches both). Every operation needs a signed-in member (401 `UNAUTHENTICATED`).

    **Active organisation.** Members can belong to several seller and provider organisations. The active one comes
    from identity (`GET /v1/me` → `orgId`) and is switched with `PUT /v1/seller/session/active-org`. Seller Center
    screens act on the active organisation; Provider Hub screens need a PROVIDER organisation.

    **Role-aware navigation.** `GET /v1/seller/session` returns the sidebar already filtered for the member's
    organisation role (module access levels VIEW, EDIT, APPROVE, FULL from identity's module matrix). Until the
    organisation is APPROVED only the Onboarding entry is returned; it disappears after approval.

    **Errors** are RFC 9457 `application/problem+json` with a stable `code`. Services that are still being built
    (orders, bookings, offers) or that are unreachable answer 503 `UPSTREAM_UNAVAILABLE`
    (`type https://developers.afrotransact.com/problems/bff.upstream-unavailable`) with `Retry-After`.

    **Money** is always an integer amount in minor units (`*Minor`, cents for USD) plus an ISO 4217 `currency`.

    **CSRF.** Unsafe methods require an `Origin` header matching an allowed web origin (storefront or Seller Center).
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
servers:
  - url: http://localhost:8200
    description: local
  - url: https://api.dev.afrotransact.com/bff
    description: dev
  - url: https://api.uat.afrotransact.com/bff
    description: uat
  - url: https://api.afrotransact.com/bff
    description: prod
tags:
  - name: Assistant
    description: Lola for sellers, with the level (and the daily messages) of the organisation's plan
  - name: Shell
    description: Session, organisation switcher, role-aware navigation, onboarding status and compliance banner
  - name: Dashboard
    description: KPIs and charts for the seller or provider home
  - name: Orders
    description: Seller shipment queue, order detail, status updates and shipping labels
  - name: Listings
    description: Listings table, one-step product form (with autosaved drafts), category requests, uploads and stock
  - name: Bulk upload
    description: |
      Product templates (Excel and CSV, per product type or generic), .xlsx/.csv uploads validated row by row, preview,
      error report and the background import (S308). Limits: 10 MB and 5,000 rows per file, 10 images and 200
      variants per product. Mirrors catalog-service `/v1/imports` with the member's token.
  - name: Image library
    description: The organisation's product image library (files, folders, ZIPs) matched to listings by SKU file names (S310)
  - name: Returns & disputes
    description: Customer returns and their refunds (tax-returns) and disputes or A-to-z claims against the organisation (trust-ops), read only
  - name: Reviews
    description: |
      Verified-purchase reviews of the organisation's products (S324, catalog): the published reviews with the star
      rating, photos and first name and last initial of the reviewer (the customer is never identified), one public
      reply per review, and reports. Sellers cannot edit, hide or remove a review: only Trust & Safety can, after a
      report or when a review fails the automatic checks.
  - name: Money
    description: Payouts, plan and billing
  - name: Team
    description: Members, invitations and role capability cards
  - name: Provider Hub
    description: Calendar, booking requests, working hours, services, cancellation policy, public page and earnings
  - name: Exports
    description: Every table exports as CSV, Excel (with a Summary sheet of native charts) or PDF (with a summary page of charts)
  - name: Inventory & FBA
    description: |
      Send to AfroTransact (S281): inbound plans with the packing-list batch (case pack, lot, made and expiry dates),
      unit and carton labels, tracking, shipping, receiving progress, and the organisation's lots with expiry. Mirrors
      inventory-service with the member's token for the active organisation only. Inventory module: VIEW to read,
      EDIT to change plans.
security:
  - sessionCookie: []
paths:
  # ───────────────────────────────────────────────────────────── shell
  /v1/seller/session:
    get:
      tags: [Shell]
      operationId: getSellerSession
      security: [{sessionCookie: []}]
      summary: Signed-in member, organisations, active organisation and role-aware navigation
      description: |
        Composes identity `GET /v1/me` (profile, organisations with the member's role, active org), seller
        `GET /v1/orgs/{id}` (approval status) and identity's module matrix for the portal (falls back to the
        platform default matrix when the member may not read it).
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/SellerSession'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/session/active-org:
    put:
      tags: [Shell]
      operationId: setActiveOrg
      security: [{sessionCookie: []}]
      summary: Switch the organisation to act for (org switcher)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActiveOrgRequest'}}}
      responses:
        '200': {description: Session for the new organisation, content: {application/json: {schema: {$ref: '#/components/schemas/SellerSession'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding:
    get:
      tags: [Shell]
      operationId: getOnboarding
      security: [{sessionCookie: []}]
      summary: Onboarding application status (the only screen before approval)
      description: seller `GET /v1/applications/me`, with the first two steps' answers (`form`) for the wizard.
      responses:
        '200': {description: Application status, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Shell]
      operationId: startOnboarding
      security: [{sessionCookie: []}]
      summary: Start selling / offer services — start or resume the application (idempotent, S286)
      description: |
        "Start selling" and "Offer your services" for a signed-in account, with no second sign-up. Adds the seller
        (or provider) applicant role to the account (identity `POST /v1/me/roles/{seller|provider}-applicant`,
        idempotent), then starts the application (seller `POST /v1/applications/me`), which creates the DRAFT
        organisation with the caller as owner. A second call resumes the same application (200).

        The application is prefilled from what the account already has: name and email (identity profile),
        phone (verified or not), the default address-book address (business address) and, when the person
        already belongs to an organisation, its name as the store name. Prefilled fields are listed in
        `form.prefilled`.

        403 `STAFF_CANNOT_APPLY`: staff accounts (platform roles) cannot apply; they use a personal account.
        409 `ALREADY_APPROVED`: the account already has an approved organisation of that kind (open Seller Center
        or Provider Hub instead). 409 `APPLICATION_EXISTS`: the account already has an application of the other
        kind.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StartOnboardingRequest'}}}
      responses:
        '200': {description: Existing application resumed, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '201': {description: Application started, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/business:
    put:
      tags: [Shell]
      operationId: saveOnboardingBusiness
      security: [{sessionCookie: []}]
      summary: Autosave the wizard's "Your business" step
      description: seller `PUT /v1/applications/me/steps/business`; only the fields present are validated.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingBusinessInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/business-details:
    put:
      tags: [Shell]
      operationId: saveOnboardingDetails
      security: [{sessionCookie: []}]
      summary: Save "About you" (sole proprietor) / "Business details & TIN"
      description: |
        seller `PUT /v1/applications/me/steps/business-details`; the whole step is sent (the seller service replaces the
        section). `taxId` (SSN/ITIN or EIN) is encrypted at rest by the seller service and never returned or logged;
        omit it to keep the stored one. Only the fields present are validated; completion is decided by the seller
        service.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingDetailsInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/owners:
    put:
      tags: [Shell]
      operationId: saveOnboardingOwners
      security: [{sessionCookie: []}]
      summary: Save "Owners" (beneficial owners and control persons)
      description: seller `PUT /v1/applications/me/steps/owners` (not for sole proprietors). Everyone with 25%+ and at least one person with significant control; ownership may not exceed 100%.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingOwnersInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/plan:
    put:
      tags: [Shell]
      operationId: saveOnboardingPlan
      security: [{sessionCookie: []}]
      summary: Save "Plan" (plan, billing frequency and, for paid plans, the card)
      description: seller `PUT /v1/applications/me/steps/plan`. Cards are tokenised by Stripe.js (`pm_…`); only brand, last 4 and expiry are stored. The subscription starts after approval, with the plans free trial.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingPlanInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/catalog-compliance:
    put:
      tags: [Shell]
      operationId: saveOnboardingCompliance
      security: [{sessionCookie: []}]
      summary: Save "Catalog, permits & licences" / "Services & licences"
      description: 'seller `PUT /v1/applications/me/steps/catalog-compliance`: categories (lower-cased keys), the food permit for groceries / prepared food, beauty labelling, service licences, insurance, agreements and the W-9 certification.'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingComplianceInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/plans:
    get:
      tags: [Shell]
      operationId: getOnboardingPlans
      security: [{sessionCookie: []}]
      summary: Plans the applicant can choose (their kind), with prices per billing frequency and the first charge
      description: seller `GET /v1/plans?kind=` for the application's kind.
      responses:
        '200': {description: Plans, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingPlans'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/stripe/session:
    post:
      tags: [Shell]
      operationId: createOnboardingStripeSession
      security: [{sessionCookie: []}]
      summary: Account Session for Stripe's embedded Connect components (verification and the payout bank account)
      description: |
        seller `POST /v1/applications/me/stripe/account-session`: creates the connected account on first use and an
        Account Session for Connect.js, with the BFF's Stripe publishable key. The account is Stripe-collected (Stripe
        keeps the liability and KYC), so Stripe's components collect identity, tax ID and the payout bank account:
        `account-onboarding` in "Stripe verification", `account-management` for "Change bank account" on "Payouts".
        No Stripe-hosted page. `localTest` is true only for the seller service's local stand-in (local profile without
        a Stripe key); Seller Center then shows its labelled local verification. 503 `STRIPE_NOT_CONFIGURED` when a real
        session can't load for lack of a publishable key.
      responses:
        '200': {description: Account Session, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStripeSession'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/stripe/refresh:
    post:
      tags: [Shell]
      operationId: refreshOnboardingStripe
      security: [{sessionCookie: []}]
      summary: Re-read the Stripe verification results (after the embedded onboarding closes)
      description: seller `POST /v1/applications/me/stripe/refresh`.
      responses:
        '200': {description: Application status, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/submit:
    post:
      tags: [Shell]
      operationId: submitOnboarding
      security: [{sessionCookie: []}]
      summary: Submit the application to AfroTransact staff review (or resubmit after a request for information)
      description: seller `POST /v1/applications/me/submit`; 422 lists every field still missing across the steps.
      responses:
        '200': {description: Submitted, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/uploads:
    post:
      tags: [Shell]
      operationId: requestOnboardingUpload
      security: [{sessionCookie: []}]
      summary: Direct upload ticket for an application document (permit, licence, insurance, formation document)
      description: media `POST /v1/uploads` with purpose `kyc-document` (private; PDF, JPG, PNG or WebP, ≤ 15 MB).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingUploadRequest'}}}
      responses:
        '201': {description: Upload instructions, content: {application/json: {schema: {$ref: '#/components/schemas/UploadTicket'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/onboarding/uploads/{assetId}/complete:
    post:
      tags: [Shell]
      operationId: completeOnboardingUpload
      security: [{sessionCookie: []}]
      summary: Finalise an uploaded application document
      description: media `POST /v1/assets/{id}/complete`.
      parameters: [{name: assetId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/compliance:
    get:
      tags: [Shell]
      operationId: getCompliance
      security: [{sessionCookie: []}]
      summary: Stripe compliance status for the banner shown on every page while something is outstanding
      description: seller `GET /v1/orgs/{orgId}/account-health`.
      responses:
        '200': {description: Compliance summary, content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceSummary'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/stripe/session:
    post:
      tags: [Shell]
      operationId: createSellerStripeSession
      security: [{sessionCookie: []}]
      summary: Account Session for Stripe's embedded components in Account health (owner / finance)
      description: |
        seller `POST /v1/orgs/{orgId}/stripe/account-session` for the active organisation. Seller accounts are
        Stripe-collected: what Stripe needs and the payout bank account are answered in Stripe's embedded components
        (`notification-banner`, `account-management`, `account-onboarding`), never through AfroTransact. 403 for
        members other than the owner and finance; 404 before the organisation has a Stripe account; 503
        `STRIPE_NOT_CONFIGURED` without a publishable key.
      responses:
        '200': {description: Account Session, content: {application/json: {schema: {$ref: '#/components/schemas/OnboardingStripeSession'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── dashboard
  /v1/seller/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      security: [{sessionCookie: []}]
      summary: Home KPIs and charts (seller or provider, by the active organisation's kind)
      description: |
        Seller: sales and units (orders), top products (orders), orders by fulfilment (orders), stock by warehouse
        (inventory positions). Provider: bookings and deposits, bookings by service, status donut and earnings by
        week (bookings). Each chart reports `available: false` when its upstream cannot answer, so the rest of the
        page still renders. Exports (PDF, Excel with a native chart, CSV) are produced from these rows.
      parameters:
        - {name: rangeDays, in: query, schema: {type: integer, enum: [7, 30, 90], default: 30}}
      responses:
        '200': {description: Dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── orders
  /v1/seller/orders:
    get:
      tags: [Orders]
      operationId: listSellerOrders
      security: [{sessionCookie: []}]
      summary: Shipment queue of the active organisation (server-driven table)
      description: |
        orders `GET /v1/seller/shipments` (newest first, cursor pagination, status filter). `q` searches every column
        the table shows (order, placed date, buyer, ship-to, items, units, total, fulfilment, status, tracking) and `sort`
        orders by any of them: the BFF then reads the queue (up to 5,000 shipments, cached 20 seconds per member) and
        pages it itself; the cursor is then an offset and `partial` says when the queue had more rows than were read.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: Search over every column}
        - {$ref: '#/components/parameters/Sort'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ShipmentStatus'}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: One page, content: {application/json: {schema: {$ref: '#/components/schemas/SellerOrderPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/orders/{orderNumber}:
    get:
      tags: [Orders]
      operationId: getSellerOrder
      security: [{sessionCookie: []}]
      summary: Order detail with the organisation's shipments (opened in a sheet)
      description: orders `GET /v1/orders/{number}` (sellers see only their own shipments).
      parameters: [{$ref: '#/components/parameters/OrderNumber'}]
      responses:
        '200': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/SellerOrderDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/orders/{orderNumber}/shipments/{shipmentId}/status:
    post:
      tags: [Orders]
      operationId: updateShipmentStatus
      security: [{sessionCookie: []}]
      summary: Confirm, pack, mark ready, mark shipped or hand a pickup order over (the only statuses a seller may set)
      description: |
        orders `POST /v1/shipments/{id}/transitions`. Anything but CONFIRMED, PACKED, READY, PICKED_UP or DELIVERED is
        refused with 422 before calling orders. DELIVERED (a pickup order handed to the buyer) needs `handoverCode`, the
        buyer's 4-digit code from their order page; a wrong one is refused with 409 `orders.handover-code-invalid`; orders answers 409 `CONFLICT` for a transition that is not allowed from the current
        status and 403 for a step that belongs to AfroTransact (AfroTransact-fulfilled shipments).
      parameters: [{$ref: '#/components/parameters/OrderNumber'}, {$ref: '#/components/parameters/ShipmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StatusUpdateRequest'}}}
      responses:
        '200': {description: Updated order, content: {application/json: {schema: {$ref: '#/components/schemas/SellerOrderDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/orders/{orderNumber}/shipments/{shipmentId}/rates:
    post:
      tags: [Orders]
      operationId: quoteShippingRates
      security: [{sessionCookie: []}]
      summary: Carrier rates for a seller-fulfilled shipment (cheapest first)
      description: orders `GET /v1/orders/{number}` (ship-to) + carrier-gateway `POST /v1/rates`.
      parameters: [{$ref: '#/components/parameters/OrderNumber'}, {$ref: '#/components/parameters/ShipmentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RatesRequest'}}}
      responses:
        '200': {description: Quotes, content: {application/json: {schema: {$ref: '#/components/schemas/RateQuotes'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/orders/{orderNumber}/shipments/{shipmentId}/label:
    get:
      tags: [Orders]
      operationId: downloadShippingLabel
      security: [{sessionCookie: []}]
      summary: Download the shipping label bought for a shipment
      description: carrier-gateway `GET /v1/labels/by-tracking/{carrier}/{trackingNumber}/document` (PDF or ZPL), for seller-shipped carrier parcels with a label.
      parameters:
        - {name: orderNumber, in: path, required: true, schema: {type: string}}
        - {name: shipmentId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The label document, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/orders/{orderNumber}/shipments/{shipmentId}/labels:
    post:
      tags: [Orders]
      operationId: buyShippingLabel
      security: [{sessionCookie: []}]
      summary: Buy a label for a quoted rate and attach its tracking number to the shipment
      description: |
        carrier-gateway `POST /v1/labels` (Idempotency-Key relayed; the same key returns the same label) then orders
        `POST /v1/shipments/{id}/tracking`.
      parameters: [{$ref: '#/components/parameters/OrderNumber'}, {$ref: '#/components/parameters/ShipmentId'}, {$ref: '#/components/parameters/IdempotencyKeyRequired'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BuyLabelRequest'}}}
      responses:
        '201': {description: Label bought, content: {application/json: {schema: {$ref: '#/components/schemas/LabelPurchase'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/business-page:
    get:
      tags: [Business page]
      operationId: getBusinessPage
      security: [{sessionCookie: []}]
      summary: How the organisation's public page looks (description, logo, brand colour)
      description: seller `GET /v1/orgs/{orgId}/business-page` for the active organisation (Team view). `canEdit` is false for members who may only look.
      responses:
        '200':
          description: The page settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessPageSettings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Business page]
      operationId: updateBusinessPage
      security: [{sessionCookie: []}]
      summary: Change the description, logo and brand colour (any time, also after approval)
      description: seller `PUT /v1/orgs/{orgId}/business-page` (Team edit; the seller service limits it to the owner and admins). Blank values clear them. 422 with `fieldErrors` for `description`, `brandColor` and `logoUrl`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BusinessPageSettingsInput'}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessPageSettings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/run-pickups:
    get:
      tags: [Orders]
      operationId: listSellerRunPickups
      security: [{sessionCookie: []}]
      summary: Delivery runs that collect from the organisation, with the pickup time and a pick list (S264)
      description: |
        delivery-runs `GET /v1/seller/run-pickups` for the active organisation (Orders view): the pre-order runs that are
        confirmed, being collected or out for delivery, and those completed in the last two weeks, earliest pickup first.
        Each carries when the driver comes (`pickupAt`), the units to pack per product and, per order, what goes into its
        bag (the order number is written on it). Only the organisation's own lines; no customer details.
      responses:
        '200': {description: Runs, content: {application/json: {schema: {$ref: '#/components/schemas/SellerRunPickupList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/run-pickups/{runId}:
    get:
      tags: [Orders]
      operationId: getSellerRunPickup
      security: [{sessionCookie: []}]
      summary: The organisation's pick list for one delivery run (S264)
      description: delivery-runs `GET /v1/seller/run-pickups/{runId}` for the active organisation (Orders view). 404 when the run collects nothing from it.
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Pick list, content: {application/json: {schema: {$ref: '#/components/schemas/SellerRunPickup'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/ship-from-addresses:
    get:
      tags: [Orders]
      operationId: listShipFromAddresses
      security: [{sessionCookie: []}]
      summary: The organisation's ship-from addresses, default first (label form)
      description: seller `GET /v1/orgs/{orgId}/ship-from-addresses` for the active organisation (Orders view).
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ShipFromAddress'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Orders]
      operationId: createShipFromAddress
      security: [{sessionCookie: []}]
      summary: Add a ship-from address (the first one becomes the default)
      description: seller `POST /v1/orgs/{orgId}/ship-from-addresses` (Orders edit; at most 20 per organisation).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ShipFromInput'}}}
      responses:
        '201': {description: Added, content: {application/json: {schema: {$ref: '#/components/schemas/ShipFromAddress'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/ship-from-addresses/{addressId}:
    parameters:
      - {name: addressId, in: path, required: true, schema: {type: string}}
    put:
      tags: [Orders]
      operationId: updateShipFromAddress
      security: [{sessionCookie: []}]
      summary: Change a ship-from address
      description: Optimistic — send the `version` you edited; 409 `CONFLICT` when someone changed it meanwhile.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ShipFromInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/ShipFromAddress'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    delete:
      tags: [Orders]
      operationId: deleteShipFromAddress
      security: [{sessionCookie: []}]
      summary: Delete a ship-from address; returns the rest (a new default is chosen when needed)
      responses:
        '200':
          description: Remaining addresses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ShipFromAddress'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/seller/ship-from-addresses/{addressId}/default:
    post:
      tags: [Orders]
      operationId: defaultShipFromAddress
      security: [{sessionCookie: []}]
      summary: Make an address the default
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Every address, default first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ShipFromAddress'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/seller/ship-from-addresses/{addressId}/afrotransact-pickup:
    put:
      tags: [Orders]
      operationId: setAfrotransactPickup
      security: [{sessionCookie: []}]
      summary: Turn "AfroTransact picks up from my store" on or off for a ship-from address (S255)
      description: |
        seller `PUT /v1/orgs/{orgId}/ship-from-addresses/{id}/afrotransact-pickup` (Orders edit). Enabling needs an approved
        organisation (409 `PICKUP_ORG_NOT_APPROVED`), 1–14 non-overlapping pickup windows (422 `PICKUP_INVALID_HOURS`,
        `errors.hours`), a street-level geocoded position (422 `PICKUP_NOT_GEOCODED`) and a location inside or within 25
        miles of an AfroTransact delivery zone (422 `PICKUP_OUTSIDE_DELIVERY_AREA`). Geo down → 503
        `UPSTREAM_UNAVAILABLE`. Disabling keeps the hours for next time. Optimistic: 409 `CONFLICT` when the address changed.
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AfrotransactPickupRequest'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/ShipFromAddress'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/ship-from-addresses/{addressId}/customer-pickup:
    put:
      tags: [Orders]
      operationId: setCustomerPickup
      security: [{sessionCookie: []}]
      summary: Turn "customers can pick up their orders here" on or off for a ship-from address (store or pickup place)
      description: |
        carrier-gateway `PUT /v1/pickup-locations/{addressId}` with the seller's token (Orders edit; carrier-gateway checks
        shipping:label and the organisation): a SELLER pickup location with the address's id, name (company · label),
        address, position, the state's time zone, the opening hours and how long orders take to be ready. Checkout lists
        it (with address, hours, ready time and distance) for this seller's packages; pickup has no shipping charge.
        Enabling needs 1–14 non-overlapping windows (422 `PICKUP_INVALID_HOURS`, `errors.hours`). Disabling keeps the
        hours. Unknown address → 404. carrier-gateway down → 503 `UPSTREAM_UNAVAILABLE`.
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CustomerPickupRequest'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/ShipFromAddress'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── Lola for sellers (plan tiers)
  /v1/seller/assistant:
    get:
      tags: [Assistant]
      operationId: sellerAssistantStatus
      security: [{sessionCookie: []}]
      summary: Lola's tier for the active organisation, today's messages and what she can do
      description: |
        The tier comes from the organisation's plan (Essentials, Growth, Pro) and sets the daily messages (UTC), the tools she
        can use and whether she can prepare changes for the seller to confirm. `upgrade` is the next plan up (null on Pro).
      responses:
        '200': {description: Status, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantStatus'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/assistant/chat:
    post:
      tags: [Assistant]
      operationId: sellerAssistantChat
      security: [{sessionCookie: []}]
      summary: Ask Lola one question (the browser keeps the conversation and sends the earlier turns)
      description: |
        Lola looks things up through the same Seller Center services as the pages, as the signed-in seller, then answers. She
        never sees buyers' names or addresses. A change she prepares comes back as a proposal the seller confirms with a tap;
        the app then calls the normal Seller Center API (stock adjustment, order status). Earlier turns are plain user and
        assistant text only (anything else is dropped). The usage is billed to the organisation as AI credits.
        429 `ASSISTANT_LIMIT` when today's messages on the plan are used (the detail names the plan that gives more);
        429 `RATE_LIMITED` when ai-gateway's budget is spent; 503 when ai-gateway is not reachable.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantChatRequest'}}}
      responses:
        '200': {description: Answer, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantReply'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── offers (fulfilment choice, S255)
  /v1/seller/offers:
    get:
      tags: [Listings]
      operationId: listSellerOffers
      security: [{sessionCookie: []}]
      summary: The organisation's offers of a product (fulfilment, pickup location, price, stock)
      description: offers `GET /v1/offers` for the active organisation (Listings view), filtered by catalog product id.
      parameters:
        - {name: productId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Offers, content: {application/json: {schema: {$ref: '#/components/schemas/SellerOfferList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/offers/{offerId}/fulfilment:
    put:
      tags: [Listings]
      operationId: setOfferFulfilment
      security: [{sessionCookie: []}]
      summary: 'Choose who fulfils an offer: I ship it, Fulfilled by AfroTransact (FBA) or AfroTransact picks up from my store'
      description: |
        offers `PATCH /v1/offers/{id}` `{fulfilment, shipFrom: {locationId}}` (Listings edit). `AFROTRANSACT_DELIVERY` needs
        `shipFromLocationId`: one of the organisation's ship-from addresses with AfroTransact pickup enabled (422,
        `errors.shipFromLocationId`). 409 `CONFLICT` when the offer changed meanwhile.
      parameters:
        - {name: offerId, in: path, required: true, schema: {type: string, maxLength: 64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OfferFulfilmentRequest'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/SellerOffer'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── coupons (offers-service, seller-funded)
  /v1/seller/returns:
    get:
      tags: [Returns & disputes]
      operationId: listSellerReturns
      security: [{sessionCookie: []}]
      summary: Returns customers started on the organisation's orders
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [REQUESTED, APPROVED, AUTO_APPROVED, LABEL_ISSUED, IN_TRANSIT, RECEIVED, INSPECTED, REFUNDED, REJECTED, CANCELLED]}}
      responses:
        '200': {description: Returns, content: {application/json: {schema: {$ref: '#/components/schemas/SellerReturnList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/disputes:
    get:
      tags: [Returns & disputes]
      operationId: listSellerDisputes
      security: [{sessionCookie: []}]
      summary: Disputes and A-to-z claims against the organisation (the buyer is never identified)
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [AWAITING_SELLER, UNDER_REVIEW, ESCALATED, RESOLVED_REFUND, RESOLVED_DENIED, WITHDRAWN]}}
      responses:
        '200': {description: Disputes, content: {application/json: {schema: {$ref: '#/components/schemas/SellerDisputeList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/reviews:
    get:
      tags: [Reviews]
      operationId: listSellerReviews
      security: [{sessionCookie: []}]
      summary: Published reviews of the organisation's products, newest first
      description: |
        catalog `GET /v1/seller/reviews` with the member's token (module Reviews). Only published reviews are listed; the
        customer is never identified. `unanswered=true` lists the reviews that still wait for a reply.
      parameters:
        - {name: unanswered, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: One page of reviews, content: {application/json: {schema: {$ref: '#/components/schemas/SellerReviewPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/reviews/{reviewId}/reply:
    post:
      tags: [Reviews]
      operationId: replyToSellerReview
      security: [{sessionCookie: []}]
      summary: Reply to a published review, once
      description: |
        The reply is public next to the review and cannot be edited or deleted. 409 `ALREADY_DONE` when the review already
        has a reply, 409 `CONFLICT` while it is not published.
      parameters:
        - {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: The review with the reply, content: {application/json: {schema: {$ref: '#/components/schemas/SellerReview'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/reviews/{reviewId}/reports:
    post:
      tags: [Reviews]
      operationId: reportSellerReview
      security: [{sessionCookie: []}]
      summary: Report a review to Trust & Safety
      description: "One report per member and review (a repeat answers 200 with `created: false`). The review stays public until Trust & Safety decide."
      parameters:
        - {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SellerReviewReportRequest'}
      responses:
        '200': {description: Already reported, content: {application/json: {schema: {$ref: '#/components/schemas/SellerReviewReportResult'}}}}
        '201': {description: Reported, content: {application/json: {schema: {$ref: '#/components/schemas/SellerReviewReportResult'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/coupons:
    get:
      tags: [Growth]
      operationId: listSellerCoupons
      security: [{sessionCookie: []}]
      summary: Seller-funded coupons for the active organisation
      responses:
        '200': {description: Coupons, content: {application/json: {schema: {$ref: '#/components/schemas/SellerCouponList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Growth]
      operationId: createSellerCoupon
      security: [{sessionCookie: []}]
      summary: Create a seller-funded coupon (applies only to this organisation's offers)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSellerCouponRequest'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/SellerCoupon'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/coupons/{couponId}/status:
    post:
      tags: [Growth]
      operationId: setSellerCouponStatus
      security: [{sessionCookie: []}]
      summary: Pause or activate a seller coupon
      parameters:
        - {name: couponId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [ACTIVE, PAUSED, EXPIRED]}}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/SellerCoupon'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/seller/coupons/{couponId}:
    delete:
      tags: [Growth]
      operationId: deleteSellerCoupon
      security: [{sessionCookie: []}]
      summary: Delete a seller-funded coupon
      parameters:
        - {name: couponId, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── listings
  /v1/seller/listings:
    get:
      tags: [Listings]
      operationId: listListings
      security: [{sessionCookie: []}]
      summary: The organisation's listings (server-driven table)
      description: |
        catalog `GET /v1/products` (own organisation; status, page, size). `q` searches every column the table shows
        (product, ATIN, SKU, variants, price, stock, fulfilment, status, updated) and `sort` orders by any of them: the BFF
        then reads the organisation's listings (up to 5,000, cached 20 seconds per member) and pages them itself.
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ListingStatus'}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: Search over every column}
        - {$ref: '#/components/parameters/Sort'}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: One page, content: {application/json: {schema: {$ref: '#/components/schemas/ListingPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/listings/{productId}/status:
    post:
      tags: [Listings]
      operationId: setListingActive
      security: [{sessionCookie: []}]
      summary: Pause or resume a live listing
      description: catalog `POST /v1/products/{id}/pause` or `/resume`.
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ListingStatusRequest'}}}
      responses:
        '200': {description: Updated listing, content: {application/json: {schema: {$ref: '#/components/schemas/ListingRow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/products:
    post:
      tags: [Listings]
      operationId: submitProduct
      security: [{sessionCookie: []}]
      summary: Submit the one-step product form for review, or save it pending category approval
      description: |
        catalog `POST /v1/products`. With `categoryId` the product goes to listing review (IN_REVIEW); with
        `categoryRequestId` it waits for the requested category (PENDING_CATEGORY_APPROVAL) and moves to review when
        the catalog team approves the category. `listing.shipFromId` is resolved to the seller's ship-from address;
        `draftId` deletes the saved draft with the submission.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProductDraft'}}}
      responses:
        '201': {description: Listing created, content: {application/json: {schema: {$ref: '#/components/schemas/ListingRow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/listings/{productId}:
    get:
      tags: [Listings]
      operationId: getProduct
      security: [{sessionCookie: []}]
      summary: One listing with everything the one-step form edits
      description: catalog `GET /v1/products/{id}` (own organisation), with the category path and the ship-from address id.
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      responses:
        '200': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/ProductDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/products/{productId}:
    put:
      tags: [Listings]
      operationId: updateProduct
      security: [{sessionCookie: []}]
      summary: Save an edited listing (one-step form in edit mode)
      description: |
        catalog `PUT /v1/products/{id}`. The whole product is validated again; variants are matched by SKU (new SKUs
        get ATINs). A rejected listing goes back to review; a published listing keeps its category and variants (set
        a variant's quantity to 0 instead of removing it). 409 `CONFLICT` when `version` is stale.
      parameters: [{$ref: '#/components/parameters/ProductId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProductUpdate'}}}
      responses:
        '200': {description: Listing, content: {application/json: {schema: {$ref: '#/components/schemas/ListingRow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/product-drafts:
    get:
      tags: [Listings]
      operationId: listProductDrafts
      security: [{sessionCookie: []}]
      summary: The organisation's saved product drafts, most recently saved first
      description: catalog `GET /v1/product-drafts`.
      responses:
        '200': {description: Drafts, content: {application/json: {schema: {$ref: '#/components/schemas/ProductDraftList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Listings]
      operationId: createProductDraft
      security: [{sessionCookie: []}]
      summary: Save draft (the first autosave of a new product, or of an edit when productId is set)
      description: catalog `POST /v1/product-drafts`. A product has at most one unsaved-edit draft.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveProductDraftRequest'}}}
      responses:
        '201': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/SavedProductDraft'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/product-drafts/{draftId}:
    parameters: [{$ref: '#/components/parameters/DraftId'}]
    get:
      tags: [Listings]
      operationId: getProductDraft
      security: [{sessionCookie: []}]
      summary: A saved draft with the form's input
      responses:
        '200': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/SavedProductDraft'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Listings]
      operationId: saveProductDraft
      security: [{sessionCookie: []}]
      summary: Autosave a draft
      description: catalog `PUT /v1/product-drafts/{id}`; 409 `CONFLICT` when it was saved from another tab since `version`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveProductDraftRequest'}}}
      responses:
        '200': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/SavedProductDraft'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Listings]
      operationId: deleteProductDraft
      security: [{sessionCookie: []}]
      summary: Discard a draft
      responses:
        '204': {description: Discarded}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/catalog/listing-context:
    get:
      tags: [Listings]
      operationId: getListingContext
      security: [{sessionCookie: []}]
      summary: What the product form offers this member (AI listing writer, moderation, bulk upload limits)
      description: The AI listing writer needs a plan that includes it (Seller Growth, Seller Pro) and the ai:use permission (organisation owners).
      responses:
        '200': {description: Context, content: {application/json: {schema: {$ref: '#/components/schemas/ListingContext'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/catalog/listing-writer:
    post:
      tags: [Listings]
      operationId: writeListing
      security: [{sessionCookie: []}]
      summary: Draft a title, description and bullets with the AI listing writer
      description: |
        ai-gateway `POST /v1/ai/listing-writer` with the member's token. A draft for the seller to edit: nothing is
        saved or published. 403 `PLAN_FEATURE_REQUIRED` when the plan doesn't include the writer.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ListingWriterRequest'}}}
      responses:
        '200': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/ListingWriterDraft'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/imports/template:
    get:
      tags: [Bulk upload]
      operationId: downloadImportTemplate
      security: [{sessionCookie: []}]
      summary: Download a bulk upload template (Excel or CSV)
      description: |
        catalog `GET /v1/imports/template`, generated from the product type definitions: a product type's template
        (`productType`, or the type of `categoryId`) with a column per attribute (dropdowns for allowed values, unit
        columns, required columns marked `*`) and per variation option, or the generic template (`Category`,
        `Attributes` and `Options` as "name: value" pairs) when both are omitted. xlsx: Products sheet (header notes,
        dropdowns, number checks), Instructions, Example and a hidden Lists sheet. csv: `#` comment lines and the header.
      parameters:
        - {name: productType, in: query, schema: {type: string, maxLength: 40}}
        - {name: categoryId, in: query, schema: {type: string, maxLength: 64}}
        - {name: format, in: query, schema: {$ref: '#/components/schemas/SpreadsheetFormat'}}
      responses:
        '200':
          description: Template file (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
            text/csv: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/imports:
    get:
      tags: [Bulk upload]
      operationId: listImports
      security: [{sessionCookie: []}]
      summary: Upload history (newest first)
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Uploads, content: {application/json: {schema: {$ref: '#/components/schemas/ProductImportPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Bulk upload]
      operationId: uploadImport
      security: [{sessionCookie: []}]
      summary: Upload a .xlsx or .csv file and validate every row
      description: |
        catalog `POST /v1/imports` (multipart). Rows are checked for required fields, allowed values, numbers and
        units, GTIN check digits, duplicate SKUs in the file and against the organisation's listings, and image URL
        format; images are fetched when the import runs. Nothing is imported yet: review the preview, then start it.
        422 `VALIDATION_FAILED` (`errors.file`) when the file can't be read: wrong type, over 10 MB or 5,000 rows,
        missing required columns. `mode` CREATE adds products; UPDATE changes listings by SKU (blank cells unchanged).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: '.xlsx or .csv, at most 10 MB'}
                mode: {$ref: '#/components/schemas/ImportMode'}
                productType: {type: string, maxLength: 40, description: The template's product type; omit for the generic template}
      responses:
        '201': {description: Validated upload, content: {application/json: {schema: {$ref: '#/components/schemas/ProductImport'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/imports/{importId}:
    get:
      tags: [Bulk upload]
      operationId: getImport
      security: [{sessionCookie: []}]
      summary: An upload with its validation counts and import progress (poll while QUEUED or RUNNING)
      parameters: [{$ref: '#/components/parameters/ImportId'}]
      responses:
        '200': {description: Upload, content: {application/json: {schema: {$ref: '#/components/schemas/ProductImport'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/imports/{importId}/rows:
    get:
      tags: [Bulk upload]
      operationId: listImportRows
      security: [{sessionCookie: []}]
      summary: Rows of an upload for the preview (server-driven table; status ERROR = errors only)
      parameters:
        - {$ref: '#/components/parameters/ImportId'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ImportRowStatus'}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/ImportRowOutcome'}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Rows, content: {application/json: {schema: {$ref: '#/components/schemas/ProductImportRowPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/imports/{importId}/report:
    get:
      tags: [Bulk upload]
      operationId: downloadImportReport
      security: [{sessionCookie: []}]
      summary: Download the error report
      description: |
        The uploaded rows as they were, plus Row, Row status, Result and Errors columns. Cells that start with
        = + - @ (or a tab / carriage return) are prefixed with ' so spreadsheet apps never run them as formulas.
        Fix the rows in this file and upload it again (the extra columns are ignored).
      parameters:
        - {$ref: '#/components/parameters/ImportId'}
        - {name: format, in: query, schema: {$ref: '#/components/schemas/SpreadsheetFormat'}}
      responses:
        '200':
          description: Report file (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
            text/csv: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/imports/{importId}/start:
    post:
      tags: [Bulk upload]
      operationId: startImport
      security: [{sessionCookie: []}]
      summary: Start the import (background, resumable, idempotent per row)
      description: |
        catalog `POST /v1/imports/{id}/start`. Runs in the background: poll `GET /v1/seller/imports/{importId}`.
        Images are copied from their URLs by media (quarantine and moderation like uploads). Each row is imported at
        most once (key = upload id + row SKU), so retries and restarts never duplicate products. With rows in error
        send `validOnly: true` to import the others; otherwise 409 `CONFLICT`. Large uploads notify the uploader when
        they finish.
      parameters: [{$ref: '#/components/parameters/ImportId'}]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/StartImportRequest'}}}
      responses:
        '202': {description: Started, content: {application/json: {schema: {$ref: '#/components/schemas/ProductImport'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/catalog/categories:
    get:
      tags: [Listings]
      operationId: getCategoryTree
      security: [{sessionCookie: []}]
      summary: Category tree (department › category › product type) for the product form's category picker
      description: catalog `GET /v1/categories`, nested.
      responses:
        '200': {description: Tree, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CategoryNode'}}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/catalog/product-types/{code}:
    get:
      tags: [Listings]
      operationId: getProductType
      security: [{sessionCookie: []}]
      summary: Attributes, variation themes, identifier rule and traits of a product type
      description: |
        catalog `GET /v1/product-types/{code}`. Each attribute has a kind (TEXT, MULTILINE, ENUM, NUMBER with units),
        the form section it belongs to (DETAILS, FOOD, REGULATED) and a help line; traits (food, perishable, regulated,
        preorder) decide which conditional sections the one-step form shows.
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Schema, content: {application/json: {schema: {$ref: '#/components/schemas/ProductTypeSchema'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/catalog/gtin/{code}:
    get:
      tags: [Listings]
      operationId: checkGtin
      security: [{sessionCookie: []}]
      summary: Validate a GTIN/ISBN and find an existing product page that uses it
      description: catalog `GET /v1/identifiers/gtin/{code}`.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^\d{8,14}$'}}
        - {name: isbn, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Check, content: {application/json: {schema: {$ref: '#/components/schemas/GtinCheck'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/category-requests:
    get:
      tags: [Listings]
      operationId: listCategoryRequests
      security: [{sessionCookie: []}]
      summary: The organisation's category requests
      description: catalog `GET /v1/category-requests/mine`.
      responses:
        '200': {description: Requests, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CategoryRequest'}}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Listings]
      operationId: requestCategory
      security: [{sessionCookie: []}]
      summary: Request a new category; the builder switches to the requested category right away
      description: catalog `POST /v1/category-requests`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CategoryRequestInput'}}}
      responses:
        '201': {description: Request, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryRequest'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/uploads:
    post:
      tags: [Listings]
      operationId: requestUpload
      security: [{sessionCookie: []}]
      summary: Direct upload ticket for a product or storefront image
      description: media `POST /v1/uploads` (JPG, PNG or WebP, ≤ 8 MB). `library` adds a product image to the image library.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UploadRequest'}}}
      responses:
        '201': {description: Upload instructions, content: {application/json: {schema: {$ref: '#/components/schemas/UploadTicket'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/uploads/{assetId}/complete:
    post:
      tags: [Listings]
      operationId: completeUpload
      security: [{sessionCookie: []}]
      summary: Finalise an uploaded image (size and dimensions are read by media)
      description: media `POST /v1/assets/{id}/complete`.
      parameters: [{name: assetId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/seller/image-library:
    get:
      tags: [Image library]
      operationId: listImageLibrary
      security: [{sessionCookie: []}]
      summary: The organisation's image library with the SKUs that use each image (server-driven table)
      description: |
        media `GET /v1/library` (the member's token) plus catalog `POST /v1/image-library/usage` for "used by" and for
        whether the SKU in the file name belongs to a listing. File names `SKU.MAIN`, `SKU.PT01`…`SKU.PT08` and
        `SKU.SWCH` (any image extension, case-insensitive, `.`, `_`, `-` or a space before the slot) are matched to the
        listing with that SKU (variant SKUs too). Images are uploaded with `POST /v1/seller/uploads` and `library: true`.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: File name or SKU contains}
        - {name: status, in: query, schema: {type: string, enum: [READY, FLAGGED, REJECTED]}}
        - {name: matched, in: query, schema: {type: boolean}, description: 'true = named after a SKU, false = other names'}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Library page, content: {application/json: {schema: {$ref: '#/components/schemas/ImageLibraryPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
