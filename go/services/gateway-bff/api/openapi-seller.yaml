      type: object
      required: [reference, type, typeLabel, status, statusLabel, orderNumber, amountMinor, currency, description, responded, escalated, refundMinor]
      properties:
        reference: {type: string}
        type: {type: string}
        typeLabel: {type: string}
        status: {type: string, enum: [AWAITING_SELLER, UNDER_REVIEW, ESCALATED, RESOLVED_REFUND, RESOLVED_DENIED, WITHDRAWN]}
        statusLabel: {type: string}
        orderNumber: {type: string}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        description: {type: string, description: 'What the customer wrote (untrusted text)'}
        responded: {type: boolean}
        sellerResponse: {type: [string, 'null']}
        respondBy: {type: [string, 'null'], description: 'Deadline to respond (only while waiting for the seller)'}
        deadlineState: {type: [string, 'null'], enum: [ON_TRACK, AT_RISK, BREACHED, null]}
        escalated: {type: boolean}
        outcome: {type: [string, 'null']}
        refundMinor: {type: integer, format: int64}
        openedAt: {type: [string, 'null']}
    SellerDisputeList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SellerDispute'}}
        total: {type: integer}
    SellerReviewPhoto:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri}
    SellerReviewReply:
      type: object
      required: [text, at]
      properties:
        text: {type: string}
        at: {type: string, format: date-time}
    SellerReview:
      type: object
      description: A published, verified-purchase review of one of the organisation's products. The customer is never identified.
      required: [id, atin, productTitle, reviewerName, rating, title, text, photos, verifiedPurchase, createdAt, reportCount, reply]
      properties:
        id: {type: string, format: uuid}
        atin: {type: string}
        productTitle: {type: string}
        reviewerName: {type: string, examples: [Adaeze N.]}
        rating: {type: integer, minimum: 1, maximum: 5}
        title: {type: [string, 'null']}
        text: {type: [string, 'null']}
        photos: {type: array, items: {$ref: '#/components/schemas/SellerReviewPhoto'}}
        verifiedPurchase: {type: boolean}
        createdAt: {type: string, format: date-time}
        reportCount: {type: integer, minimum: 0}
        reply: {oneOf: [{$ref: '#/components/schemas/SellerReviewReply'}, {type: 'null'}]}
    SellerReviewPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SellerReview'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        size: {type: integer}
    SellerReviewReportRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode: {type: string, enum: [ABUSIVE, PERSONAL_INFORMATION, SPAM, OFF_TOPIC, CONFLICT_OF_INTEREST, OTHER]}
        details: {type: string, maxLength: 500, description: Required for OTHER}
    SellerReviewReportResult:
      type: object
      required: [created]
      properties:
        created: {type: boolean}
    SellerCouponList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SellerCoupon'}}
    CreateSellerCouponRequest:
      type: object
      required: [code, type, value, scope]
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9]{3,20}$'}
        description: {type: string, maxLength: 300}
        type: {type: string, enum: [PERCENT, FIXED, FREE_SHIPPING]}
        value: {type: integer, format: int64}
        currency: {type: string, default: USD}
        scope: {type: string, enum: [CART, CATEGORY, PRODUCT, SELLER]}
        scopeRef: {type: string}
        minSpendMinor: {type: integer, format: int64, default: 0}
        totalLimit: {type: integer, default: 0}
        perCustomerLimit: {type: integer, default: 0}
    OfferFulfilmentRequest:
      type: object
      required: [fulfilment]
      properties:
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        shipFromLocationId: {type: [string, 'null'], maxLength: 64, description: Required for AFROTRANSACT_DELIVERY}
    LocalDelivery:
      type: object
      description: AfroTransact Delivery from the seller's store (S255), as quoted at checkout
      required: [pickupLocationId, roadMiles, durationMinutes, customerChargeMinor, sellerFeeMinor]
      properties:
        pickupLocationId: {type: [string, 'null']}
        roadMiles: {type: [number, 'null']}
        durationMinutes: {type: [number, 'null']}
        customerChargeMinor: {type: integer, description: What the shopper paid for delivery (AfroTransact keeps it)}
        sellerFeeMinor: {type: integer, description: The seller delivery fee deducted from the payout}
    OrderEarnings:
      type: object
      description: The organisation's row of the order's payment split (payments); deductions are positive amounts
      required: [itemsMinor, shippingMinor, commissionMinor, fbaFeesMinor, deliveryFeesMinor, stripeFeeMinor, netMinor]
      properties:
        itemsMinor: {type: integer}
        shippingMinor: {type: integer}
        commissionMinor: {type: integer}
        fbaFeesMinor: {type: integer}
        deliveryFeesMinor: {type: integer, description: AfroTransact Delivery seller fees}
        stripeFeeMinor: {type: integer}
        netMinor: {type: integer}
    ShipFromInput:
      type: object
      required: [name, line1, city, state, postalCode]
      properties:
        label: {type: string, maxLength: 60}
        name: {type: string, maxLength: 120}
        company: {type: string, maxLength: 120}
        phone: {type: string, maxLength: 40}
        line1: {type: string, maxLength: 120}
        line2: {type: string, maxLength: 120}
        city: {type: string, maxLength: 80}
        state: {type: string, maxLength: 40}
        postalCode: {type: string, maxLength: 12}
        country: {type: string, default: US, pattern: '^[A-Z]{2}$'}
        makeDefault: {type: boolean}
        version: {type: [integer, 'null'], format: int64, description: Version being edited (updates)}
    PostalAddress:
      type: object
      required: [name, line1, city, state, postalCode, country]
      properties:
        name: {type: string}
        phone: {type: [string, 'null']}
        line1: {type: string}
        line2: {type: [string, 'null']}
        city: {type: string}
        state: {type: string}
        postalCode: {type: string}
        country: {type: string}
    DeliveryProof:
      type: [object, 'null']
      description: |
        How our driver handed the parcel over, shown on a delivered shipment. Null for carrier deliveries (the carrier's
        tracking is the record), pickups and deliveries staff confirmed by hand. The photo and signature links are
        short-lived (about 5 minutes): read the order again for fresh ones. The driver's GPS position is for staff only.
      required: [method, recipientName, relationship, safePlace, photoUrl, signatureUrl, at]
      properties:
        method: {type: string, enum: [CUSTOMER, SOMEONE_ELSE, SAFE_PLACE], description: 'To the customer (who gave their code), to someone else (name, relationship, signature), or left in a safe place'}
        recipientName: {type: [string, 'null']}
        relationship: {type: [string, 'null']}
        safePlace: {type: [string, 'null']}
        photoUrl: {type: [string, 'null'], format: uri, description: Proof photo; null when none or it cannot be shown right now}
        signatureUrl: {type: [string, 'null'], format: uri, description: Recipient's signature (someone-else handovers)}
        at: {type: string, format: date-time, description: When it was delivered}
    SellerShipment:
      type: object
      required: [shipmentId, label, status, statusLabel, fulfilment, perishable, lines, itemsMinor, shippingMinor, totalMinor, carrier, trackingNumber, nextActions, canBuyLabel, hasLabel, suggestedParcel, timeline, localDelivery]
      properties:
        shipmentId: {type: string}
        label: {type: string}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        statusLabel: {type: string}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        perishable: {type: boolean}
        lines:
          type: array
          items:
            type: object
            required: [title, quantity, unitPriceMinor, itemsMinor, variantAtin, imageUrl]
            properties:
              title: {type: string}
              quantity: {type: integer}
              unitPriceMinor: {type: integer}
              itemsMinor: {type: integer}
              variantAtin: {type: string}
              imageUrl: {type: [string, 'null']}
        itemsMinor: {type: integer}
        shippingMinor: {type: integer}
        totalMinor: {type: integer}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        nextActions: {type: array, items: {$ref: '#/components/schemas/SellerStatusAction'}}
        canBuyLabel: {type: boolean}
        hasLabel: {type: boolean, description: A shipping label was bought for this shipment and can be downloaded again}
        proof: {$ref: '#/components/schemas/DeliveryProof'}
        suggestedParcel:
          oneOf: [{$ref: '#/components/schemas/SuggestedParcel'}, {type: 'null'}]
          description: The package of the products as listed (weight of every unit, largest footprint, heights stacked); null when not listed
        localDelivery:
          oneOf: [{$ref: '#/components/schemas/LocalDelivery'}, {type: 'null'}]
          description: AfroTransact Delivery from the seller's store (S255); null for other shipments
        timeline:
          type: array
          items:
            type: object
            required: [status, at, actor]
            properties:
              status: {type: string}
              at: {type: string, format: date-time}
              actor: {type: string}
    SellerOrderDetail:
      type: object
      required: [orderNumber, status, placedAt, currency, buyerName, shippingAddress, shipments, totalMinor, earnings]
      properties:
        orderNumber: {type: string}
        status: {type: string}
        placedAt: {type: string, format: date-time}
        currency: {type: string}
        buyerName: {type: string}
        shippingAddress:
          oneOf:
            - {$ref: '#/components/schemas/PostalAddress'}
            - {type: 'null'}
        shipments: {type: array, items: {$ref: '#/components/schemas/SellerShipment'}}
        totalMinor: {type: integer}
        earnings:
          oneOf: [{$ref: '#/components/schemas/OrderEarnings'}, {type: 'null'}]
          description: Payout breakdown from the order's payment split; null until the payment is split (or when payments can't be read)
    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/SellerStatusAction'}
        handoverCode: {type: string, pattern: '^\d{4}$', description: 'The buyer''s 4-digit code; required when status is DELIVERED (handing a pickup order over), ignored otherwise'}
    Parcel:
      type: object
      required: [weightLb]
      properties:
        weightLb: {type: number, exclusiveMinimum: 0, maximum: 150}
        lengthIn: {type: number, minimum: 0}
        widthIn: {type: number, minimum: 0}
        heightIn: {type: number, minimum: 0}
    RatesRequest:
      type: object
      required: [parcel, shipFrom]
      properties:
        carrier: {$ref: '#/components/schemas/Carrier', description: Optional carrier filter}
        parcel: {$ref: '#/components/schemas/Parcel'}
        shipFrom: {$ref: '#/components/schemas/PostalAddress'}
    Carrier: {type: string, enum: [usps, ups, fedex, dhl]}
    RateQuote:
      type: object
      required: [carrier, service, serviceName, amountMinor, currency, transitDays, estimatedDelivery]
      properties:
        carrier: {$ref: '#/components/schemas/Carrier'}
        service: {type: string}
        serviceName: {type: string}
        amountMinor: {type: integer}
        currency: {type: string}
        transitDays: {type: [integer, 'null']}
        estimatedDelivery: {type: [string, 'null'], format: date-time}
    RateQuotes:
      type: object
      required: [quotes, partial]
      properties:
        quotes: {type: array, items: {$ref: '#/components/schemas/RateQuote'}}
        partial: {type: boolean, description: Some carriers did not answer in time}
    BuyLabelRequest:
      type: object
      required: [carrier, service, parcel, shipFrom]
      properties:
        carrier: {$ref: '#/components/schemas/Carrier'}
        service: {type: string, minLength: 1}
        parcel: {$ref: '#/components/schemas/Parcel'}
        shipFrom: {$ref: '#/components/schemas/PostalAddress'}
    LabelPurchase:
      type: object
      required: [carrier, service, trackingNumber, costMinor, currency, documentUrl, order]
      properties:
        carrier: {$ref: '#/components/schemas/Carrier'}
        service: {type: string}
        trackingNumber: {type: string}
        costMinor: {type: integer}
        currency: {type: string}
        documentUrl: {type: [string, 'null']}
        order: {$ref: '#/components/schemas/SellerOrderDetail'}
    # ── listings
    ListingStatus: {type: string, enum: [IN_REVIEW, PENDING_CATEGORY_APPROVAL, LIVE, REJECTED, PAUSED, TAKEN_DOWN]}
    ListingRow:
      type: object
      required: [productId, atin, title, sku, variantCount, priceMinor, currency, stock, fulfilment, status, statusLabel, moderationNote, imageUrl, updatedAt]
      properties:
        productId: {type: string}
        atin: {type: [string, 'null']}
        title: {type: string}
        sku: {type: string}
        variantCount: {type: integer}
        priceMinor: {type: integer, description: Lowest variant price}
        currency: {type: string}
        stock: {type: integer, description: Sum of variant quantities}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        status: {$ref: '#/components/schemas/ListingStatus'}
        statusLabel: {type: string}
        moderationNote: {type: [string, 'null']}
        imageUrl: {type: [string, 'null']}
        updatedAt: {type: string, format: date-time}
    ListingPage:
      type: object
      required: [items, total, page, size, sort, partial]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ListingRow'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
        sort: {type: array, items: {type: string}, description: 'The applied sort (`<column>,asc|desc`); empty for the catalog order'}
        partial: {type: boolean, description: 'The search or sort covered the first 5,000 listings only'}
    # ── exports
    ExportFormat:
      type: string
      enum: [csv, xlsx, pdf]
      description: |
        csv: the data only (CSV cannot carry charts). xlsx: a "Summary" sheet (first) with key totals and native Excel
        charts, plus a "Data" sheet. pdf: a summary page with the same charts and totals, then the table in landscape
        with the header repeated on every page. Charts follow the column kinds: rows by status, the first amount (or rows)
        by day or month, the top 10 rows by amount, rows by a low-cardinality text column.
    ExportColumn:
      type: object
      required: [key, label, kind]
      properties:
        key: {type: string, maxLength: 80}
        label: {type: string, minLength: 1, maxLength: 80}
        kind: {type: string, enum: [text, strong, mono, money, number, date, datetime, status, percent]}
    ExportDataset:
      type: object
      description: A client-side table exported as shown, through the same pipeline.
      required: [table, columns, rows]
      properties:
        table: {type: string, pattern: '^[a-z0-9-]{1,60}$', description: The table's key (file name)}
        title: {type: string, maxLength: 120}
        scope: {type: string, maxLength: 200}
        columns: {type: array, minItems: 1, maxItems: 40, items: {$ref: '#/components/schemas/ExportColumn'}}
        rows:
          type: array
          maxItems: 5000
          description: One array per row, one cell per column; money in currency units, dates as ISO strings.
          items: {type: array, items: {type: [string, number, boolean, 'null']}}
    SellerExportRequest:
      type: object
      description: A server table (`table`) with its search, sort, visible columns and optional selection, or a client-side table (`dataset`).
      required: [format]
      properties:
        table: {type: string, enum: [orders, listings]}
        format: {$ref: '#/components/schemas/ExportFormat'}
        q: {type: string, maxLength: 120}
        status: {type: string, maxLength: 60}
        sort: {type: array, maxItems: 3, items: {type: string, maxLength: 90}}
        ids: {type: array, maxItems: 1000, items: {type: string, maxLength: 200}, description: 'Only these rows: shipment ids for orders, product ids for listings'}
        columns: {type: array, maxItems: 40, items: {type: string, maxLength: 80}, description: The visible columns in order}
        dataset: {$ref: '#/components/schemas/ExportDataset'}
    ExportJob:
      type: object
      required: [id, resource, title, format, status, rows, async, fileName, createdAt, finishedAt, expiresAt, downloadUrl, error]
      properties:
        id: {type: string}
        resource: {type: string, description: The table exported}
        title: {type: string}
        format: {$ref: '#/components/schemas/ExportFormat'}
        status: {type: string, enum: [QUEUED, RUNNING, READY, FAILED, EXPIRED]}
        rows: {type: integer}
        async: {type: boolean, description: 'Built in the background (more than 5,000 rows)'}
        fileName: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        downloadUrl: {type: [string, 'null'], description: App-relative download path (redirects to the signed URL)}
        error: {type: [string, 'null']}
    ExportJobList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ExportJob'}}
    ListingStatusRequest:
      type: object
      required: [active]
      properties:
        active: {type: boolean}
    CategoryNode:
      type: object
      required: [id, name, level, productType, path, children]
      properties:
        id: {type: string}
        name: {type: string}
        level: {type: string, description: 'DEPARTMENT, CATEGORY or PRODUCT_TYPE'}
        productType: {type: [string, 'null']}
        path: {type: string}
        children: {type: array, items: {$ref: '#/components/schemas/CategoryNode'}}
    AttributeKind: {type: string, enum: [TEXT, MULTILINE, ENUM, NUMBER]}
    AttributeSection: {type: string, enum: [DETAILS, FOOD, REGULATED], description: 'Where the form shows it: product details, the food section or the regulated-items section'}
    ProductTypeSchema:
      type: object
      required: [code, label, identifierRule, attributes, themes, traits]
      properties:
        code: {type: string}
        label: {type: string}
        identifierRule: {type: string, enum: [gtin, isbn, none]}
        attributes:
          type: array
          items:
            type: object
            required: [key, label, options, required, multiline, kind, units, section, help]
            properties:
              key: {type: string}
              label: {type: string}
              options: {type: array, items: {type: string}}
              required: {type: boolean}
              multiline: {type: boolean}
              kind: {$ref: '#/components/schemas/AttributeKind'}
              units: {type: array, items: {type: string}, description: 'NUMBER only: allowed units, the first is the default (value stored as "12 months")'}
              section: {$ref: '#/components/schemas/AttributeSection'}
              help: {type: [string, 'null']}
        themes:
          type: array
          items:
            type: object
            required: [name, dimensions]
            properties:
              name: {type: string}
              dimensions:
                type: array
                items:
                  type: object
                  required: [name, options]
                  properties:
                    name: {type: string}
                    options: {type: array, items: {type: string}}
        traits:
          type: object
          required: [food, perishable, regulated, preorder]
          description: Decide the form's conditional sections and the template's columns
          properties:
            food: {type: boolean, description: 'Food section: shelf life, storage, ingredients, allergens'}
            perishable: {type: boolean, description: Frozen or chilled food (storage temperature)}
            regulated: {type: boolean, description: 'Regulated items section: permit, licence or certificate references'}
            preorder: {type: boolean, description: May be sold in community pre-order windows}
    GtinCheck:
      type: object
      required: [digits, valid, suggestion, existingAtin, message]
      properties:
        digits: {type: string}
        valid: {type: boolean}
        suggestion: {type: [string, 'null']}
        existingAtin: {type: [string, 'null']}
        message: {type: string}
    CategoryRequestInput:
      type: object
      required: [parentPath, name, exampleProduct, detailsNeeded]
      properties:
        parentPath: {type: string, minLength: 3, maxLength: 200}
        name: {type: string, minLength: 3, maxLength: 80}
        exampleProduct: {type: string, minLength: 3, maxLength: 200}
        detailsNeeded: {type: string, minLength: 3, maxLength: 1000}
    CategoryRequest:
      type: object
      required: [id, reference, path, status, decisionNote, createdAt]
      properties:
        id: {type: string}
        reference: {type: string}
        path: {type: string}
        status: {type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED]}
        decisionNote: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    ProductImageInput:
      type: object
      required: [url, contentType]
      properties:
        url: {type: string, minLength: 1}
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        bytes: {type: integer, minimum: 0}
        contentType: {type: string}
        alt: {type: [string, 'null'], maxLength: 200, description: 'Optional alternative text (what the picture shows), stored with the image'}
    VariantInput:
      type: object
      required: [options, sellerSku, priceMinor, quantity]
      properties:
        options: {type: object, additionalProperties: {type: string}, description: 'Empty for a product without variations'}
        sellerSku: {type: string, minLength: 1, maxLength: 64}
        gtin: {type: string}
        gtinExempt: {type: boolean}
        priceMinor: {type: integer, minimum: 1}
        compareAtMinor: {type: [integer, 'null'], minimum: 1, description: '"Was" price shown struck through; above priceMinor'}
        quantity: {type: integer, minimum: 0, maximum: 100000}
        images: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/ProductImageInput'}, description: Images of this variant only}
    ItemCondition: {type: string, enum: [NEW, RENEWED, USED_LIKE_NEW, USED_VERY_GOOD, USED_GOOD, USED_ACCEPTABLE]}
    ListingFulfilment: {type: string, enum: [SELLER, AFROTRANSACT], description: 'Ships from the seller, or Fulfilled by AfroTransact'}
    PackageDimensions:
      type: object
      required: [lengthIn, widthIn, heightIn, weightLb]
      properties:
        lengthIn: {type: number, exclusiveMinimum: 0, maximum: 108}
        widthIn: {type: number, exclusiveMinimum: 0, maximum: 108}
        heightIn: {type: number, exclusiveMinimum: 0, maximum: 108}
        weightLb: {type: number, exclusiveMinimum: 0, maximum: 150}
    ListingDetailsInput:
      type: object
      description: Description, condition, search keywords, fulfilment, package, handling time and ship-from
      properties:
        description: {type: string, maxLength: 5000}
        condition: {$ref: '#/components/schemas/ItemCondition'}
        keywords: {type: array, maxItems: 20, items: {type: string, maxLength: 40}}
        fulfilment: {$ref: '#/components/schemas/ListingFulfilment'}
        packaging:
          oneOf:
            - {$ref: '#/components/schemas/PackageDimensions'}
            - {type: 'null'}
        handlingDays: {type: integer, minimum: 1, maximum: 30}
        shipFromId: {type: [string, 'null'], description: 'A ship-from address id (GET /v1/seller/ship-from-addresses); null = the default'}
    ProductDraft:
      type: object
      required: [title, attributes, images, variationTheme, variants]
      description: Exactly one of categoryId or categoryRequestId. variationTheme "" = a product without variations (one variant without options).
      properties:
        categoryId: {type: string}
        categoryRequestId: {type: string}
        title: {type: string, minLength: 10, maxLength: 200}
        attributes: {type: object, additionalProperties: {type: string}}
        images: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/ProductImageInput'}}
        variationTheme: {type: string, maxLength: 60}
        variants: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/VariantInput'}}
        preorderEligible: {type: boolean, description: 'Food only: may be sold in community pre-order windows'}
        listing: {$ref: '#/components/schemas/ListingDetailsInput'}
        draftId: {type: string, description: The saved draft this submission comes from; deleted with the submission}
    ProductUpdate:
      description: The whole edited product (categoryId may change only before it is published) and the version it was based on.
      allOf:
        - {$ref: '#/components/schemas/ProductDraft'}
        - type: object
          properties:
            version: {type: integer, minimum: 0}
    ProductVariant:
      type: object
      required: [atin, sellerSku, gtin, gtinExempt, options, priceMinor, compareAtMinor, quantity, images]
      properties:
        atin: {type: string}
        sellerSku: {type: string}
        gtin: {type: [string, 'null']}
        gtinExempt: {type: boolean}
        options: {type: object, additionalProperties: {type: string}}
        priceMinor: {type: integer}
        compareAtMinor: {type: [integer, 'null']}
        quantity: {type: integer}
        images: {type: array, items: {$ref: '#/components/schemas/ProductImageInput'}}
    ListingDetails:
      type: object
      required: [description, condition, keywords, fulfilment, packaging, handlingDays, shipFromId]
      properties:
        description: {type: [string, 'null']}
        condition: {$ref: '#/components/schemas/ItemCondition'}
        keywords: {type: array, items: {type: string}}
        fulfilment: {$ref: '#/components/schemas/ListingFulfilment'}
        packaging:
          oneOf:
            - {$ref: '#/components/schemas/PackageDimensions'}
            - {type: 'null'}
        handlingDays: {type: integer}
        shipFromId: {type: [string, 'null']}
    ProductDetail:
      type: object
      required: [productId, atin, status, statusLabel, moderationNote, categoryId, categoryRequestId, categoryPath, productType, title,
                 attributes, images, variationTheme, variants, preorderEligible, listing, currency, version, updatedAt]
      properties:
        productId: {type: string}
        atin: {type: string}
        status: {$ref: '#/components/schemas/ListingStatus'}
        statusLabel: {type: string}
        moderationNote: {type: [string, 'null']}
        categoryId: {type: [string, 'null']}
        categoryRequestId: {type: [string, 'null']}
        categoryPath: {type: string}
        productType: {type: string}
        title: {type: string}
        attributes: {type: object, additionalProperties: {type: string}}
        images: {type: array, items: {$ref: '#/components/schemas/ProductImageInput'}}
        variationTheme: {type: string}
        variants: {type: array, items: {$ref: '#/components/schemas/ProductVariant'}}
        preorderEligible: {type: boolean}
        listing: {$ref: '#/components/schemas/ListingDetails'}
        currency: {type: string}
        version: {type: integer}
        updatedAt: {type: string, format: date-time}
    ProductDraftSummary:
      type: object
      required: [id, productId, title, categoryPath, updatedAt, version]
      properties:
        id: {type: string}
        productId: {type: [string, 'null'], description: The listing being edited; null for a new product}
        title: {type: string}
        categoryPath: {type: [string, 'null']}
        updatedAt: {type: string, format: date-time}
        version: {type: integer}
    ProductDraftList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ProductDraftSummary'}}
    SavedProductDraft:
      allOf:
        - {$ref: '#/components/schemas/ProductDraftSummary'}
        - type: object
          required: [payload]
          properties:
            payload: {type: object, additionalProperties: true, description: The form's input as saved (need not be valid)}
    SaveProductDraftRequest:
      type: object
      required: [payload]
      properties:
        productId: {type: string, description: 'Create only: the listing this draft edits'}
        title: {type: string, maxLength: 200}
        categoryPath: {type: string, maxLength: 400}
        payload: {type: object, additionalProperties: true}
        version: {type: integer, minimum: 0, description: 'Save only: the version being replaced'}
    ListingContext:
      type: object
      required: [aiListingWriter, moderated, importLimits]
      properties:
        aiListingWriter:
          type: object
          required: [available, reason]
          properties:
            available: {type: boolean}
            reason: {type: [string, 'null'], enum: [PLAN, ROLE, null], description: 'Why not: the plan lacks it, or the member may not use AI tools'}
        moderated: {type: boolean, description: New listings go to review before they are live ("Submit for review")}
        importLimits:
          type: object
          required: [maxFileBytes, maxRows, maxImagesPerProduct, maxVariantsPerProduct]
          properties:
            maxFileBytes: {type: integer}
            maxRows: {type: integer}
            maxImagesPerProduct: {type: integer}
            maxVariantsPerProduct: {type: integer}
    ListingWriterRequest:
      type: object
      required: [productType, title]
      properties:
        productType: {type: string, minLength: 1, maxLength: 40}
        title: {type: string, minLength: 3, maxLength: 200}
        attributes: {type: object, additionalProperties: {type: string}}
        tone: {type: string, enum: [warm, concise, premium]}
    ListingWriterDraft:
      type: object
      required: [title, description, bullets]
      properties:
        title: {type: string}
        description: {type: string}
        bullets: {type: array, items: {type: string}}
    SpreadsheetFormat: {type: string, enum: [xlsx, csv], default: xlsx}
    ImportMode: {type: string, enum: [CREATE, UPDATE], default: CREATE}
    ImportStatus: {type: string, enum: [VALIDATED, QUEUED, RUNNING, COMPLETED, FAILED]}
    ImportRowStatus: {type: string, enum: [VALID, WARNING, ERROR]}
    ImportRowOutcome: {type: string, enum: [PENDING, CREATED, UPDATED, FAILED, SKIPPED]}
    ProductImport:
      type: object
      required: [id, reference, fileName, format, mode, productType, status, validOnly, totalRows, validRows, warningRows, errorRows,
                 productCount, processedRows, createdProducts, updatedProducts, failedRows, header, fileWarnings, uploadedByName,
                 createdAt, startedAt, finishedAt, reportUrl]
      properties:
        id: {type: string}
        reference: {type: string, description: e.g. BU-000123}
        fileName: {type: string}
        format: {type: string, enum: [XLSX, CSV]}
        mode: {$ref: '#/components/schemas/ImportMode'}
        productType: {type: [string, 'null'], description: The template's product type; null for the generic template}
        status: {$ref: '#/components/schemas/ImportStatus'}
        validOnly: {type: boolean}
        totalRows: {type: integer}
        validRows: {type: integer}
        warningRows: {type: integer}
        errorRows: {type: integer}
        productCount: {type: integer, description: Products in the file (rows sharing a Parent SKU count once)}
        processedRows: {type: integer}
        createdProducts: {type: integer}
        updatedProducts: {type: integer}
        failedRows: {type: integer}
        header: {type: array, items: {type: string}, description: The uploaded header cells (the preview's columns)}
        fileWarnings: {type: array, items: {type: string}}
        uploadedByName: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        reportUrl: {type: string, description: App-relative download of the error report (xlsx)}
    ProductImportPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ProductImport'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
    ImportRowMessage:
      type: object
      required: [column, columnIndex, severity, message]
      properties:
        column: {type: [string, 'null'], description: 'Column key (sku, price, attr:material, option:Size); null for the whole row'}
        columnIndex: {type: integer, description: Position in the uploaded header; -1 when the column is missing}
        severity: {type: string, enum: [ERROR, WARNING]}
        message: {type: string}
    ProductImportRow:
      type: object
      required: [rowNumber, groupKey, sku, status, outcome, outcomeNote, productId, messages, cells, images]
      properties:
        rowNumber: {type: integer, description: The row number in the spreadsheet}
        groupKey: {type: string, description: Parent SKU (rows of one product share it)}
        sku: {type: string}
        status: {$ref: '#/components/schemas/ImportRowStatus'}
        outcome: {$ref: '#/components/schemas/ImportRowOutcome'}
        outcomeNote: {type: [string, 'null']}
        productId: {type: [string, 'null']}
        messages: {type: array, items: {$ref: '#/components/schemas/ImportRowMessage'}}
        cells: {type: array, items: {type: string}, description: Cell text in header order}
        images: {type: array, items: {$ref: '#/components/schemas/ImportRowImage'}, description: "The row's images: found in the library (thumbnail), links, missing or bad links"}
    ImageSlot: {type: string, enum: [MAIN, PT01, PT02, PT03, PT04, PT05, PT06, PT07, PT08, SWCH]}
    ImportRowImage:
      type: object
      required: [slot, source, ref, state, url, message]
      properties:
        slot: {$ref: '#/components/schemas/ImageSlot'}
        source: {type: string, enum: [LINK, FILE, SKU], description: 'An https URL cell, a library file name in an image cell, or a library file named after the SKU'}
        ref: {type: string, description: The link or file name}
        state: {type: string, enum: [FOUND, LINK, HELD, MISSING, BAD_LINK], description: 'FOUND in the library, a LINK copied when the import runs, HELD by moderation, MISSING from the library, or a BAD_LINK'}
        url: {type: [string, 'null'], description: Thumbnail of a FOUND library image}
        message: {type: [string, 'null']}
    ImageLibraryItem:
      type: object
      required: [assetId, fileName, sku, slot, status, url, width, height, bytes, flags, createdAt, usedBy, skuKnown]
      properties:
        assetId: {type: string}
        fileName: {type: string}
        sku: {type: [string, 'null'], description: SKU parsed from the file name (upper case); null when the name has no slot}
        slot:
          oneOf:
            - {$ref: '#/components/schemas/ImageSlot'}
            - {type: 'null'}
        status: {type: string, enum: [READY, FLAGGED, REJECTED], description: 'READY, held for review (FLAGGED) or REJECTED (reasons in flags)'}
        url: {type: [string, 'null'], description: Public URL (thumbnail) when READY}
        width: {type: integer}
        height: {type: integer}
        bytes: {type: integer}
        flags: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        usedBy: {type: array, items: {type: string}, description: SKUs of listings that use this image}
        skuKnown: {type: boolean, description: The SKU in the file name belongs to one of the organisation's listings}
    ImageLibraryPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ImageLibraryItem'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
    AttachLibraryImagesRequest:
      type: object
      properties:
        skus: {type: array, maxItems: 5000, items: {type: string, maxLength: 64}, description: 'Only listings with one of these SKUs; omit for every listing'}
    AttachLibraryImagesResult:
      type: object
      required: [productsUpdated, imagesAttached, skipped]
      properties:
        productsUpdated: {type: integer}
        imagesAttached: {type: integer}
        skipped:
          type: array
          items:
            type: object
            required: [sku, reason]
            properties:
              sku: {type: string}
              reason: {type: string}
    BrandList:
      type: object
      required: [brands]
      properties:
        brands:
          type: array
          items:
            type: object
            required: [name, source, products]
            properties:
              name: {type: string}
              source: {type: string, enum: [OWN, CATALOG], description: 'Used by your products, or by live products of other sellers'}
              products: {type: integer}
    ProductImportRowPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ProductImportRow'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
    StartImportRequest:
      type: object
      properties:
        validOnly: {type: boolean, default: false, description: Import the valid and warning rows; rows with errors are skipped}
    UploadRequest:
      type: object
      required: [purpose, fileName, contentType, size]
      properties:
        purpose: {type: string, enum: [product-image, storefront]}
        fileName: {type: string, minLength: 1, maxLength: 200}
        contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
        size: {type: integer, minimum: 1, maximum: 8388608}
        library: {type: boolean, default: false, description: 'product-image only: add it to the image library (matched to SKUs by file name)'}
    UploadTicket:
      type: object
      required: [assetId, method, url, headers, publicUrl, expiresAt]
      properties:
        assetId: {type: string}
        method: {type: string}
        url: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        publicUrl: {type: [string, 'null']}
        expiresAt: {type: [string, 'null'], format: date-time}
    Asset:
      type: object
      required: [id, url, width, height, bytes, contentType, status]
      properties:
        id: {type: string}
        url: {type: string}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
        bytes: {type: [integer, 'null']}
        contentType: {type: string}
        status: {type: string, enum: [PENDING, READY, FLAGGED, REJECTED]}
    StockPosition:
      type: object
      required: [sku, nodeId, onHand, reserved, available, inbound, lowStock]
      properties:
        sku: {type: string}
        nodeId: {type: string}
        onHand: {type: integer}
        reserved: {type: integer}
        available: {type: integer}
        inbound: {type: integer}
        lowStock: {type: boolean}
    InventoryView:
      type: object
      required: [positions, totals]
      properties:
        positions: {type: array, items: {$ref: '#/components/schemas/StockPosition'}}
        totals:
          type: object
          required: [available, reserved, inbound, lowStockSkus]
          properties:
            available: {type: integer}
            reserved: {type: integer}
            inbound: {type: integer}
            lowStockSkus: {type: integer}
    StockAdjustmentRequest:
      type: object
      required: [sku, quantity, reason]
      properties:
        sku: {type: string, minLength: 1}
        quantity: {type: integer, minimum: 0, maximum: 100000}
        reason: {type: string, enum: [STOCK_TAKE, DAMAGED, FOUND, RETURNED, OTHER]}
    StockAdjustment:
      type: object
      required: [sku, quantity]
      properties:
        sku: {type: string}
        quantity: {type: integer}
    # ── money
    PayoutBalance:
      type: object
      required: [currency, availableMinor, onHoldMinor, requestedOrInTransitMinor, paidMinor, providerFeesMinor, planFeesMinor, minimumPayoutMinor, canRequestToday, payoutsPaused, payoutsPausedReason, payoutsPausedMessage, payoutAccountMissing, holds]
      properties:
        currency: {type: string}
        availableMinor: {type: integer}
        onHoldMinor: {type: integer}
        requestedOrInTransitMinor: {type: integer}
        paidMinor: {type: integer}
        providerFeesMinor: {type: integer, description: Provider fees (late cancellations) debited from or reserved in the balance}
        planFeesMinor: {type: integer, description: 'Plan fees paid from sales (S298) not yet deducted from a transfer: they come out of the amounts on hold. Negative when a released fee is paid back with the next transfer'}
        payoutsPaused: {type: boolean, description: 'Compliance hold: payout requests fail until it is lifted; the balance keeps accruing'}
        payoutsPausedReason:
          oneOf:
            - {type: string, enum: [AUTO_PAST_DUE, MANUAL, DEAUTHORIZED, CHARGES_DISABLED]}
            - {type: 'null'}
        payoutsPausedMessage: {type: [string, 'null'], description: What the hold means for the member and how it lifts}
        payoutAccountMissing: {type: boolean, description: 'Payments has no Stripe Connect account for the organisation: earnings stay on hold until it is registered (connect Stripe in Account health, or staff re-sync)'}
        minimumPayoutMinor: {type: integer}
        canRequestToday: {type: boolean}
        holds:
          type: array
          items:
            type: object
            required: [orderId, orderNumber, amountMinor, releaseAt]
            properties:
              orderId: {type: string}
              orderNumber: {type: [string, 'null'], description: 'What the screen shows. Payments reports ids only; the BFF names the order from the seller''s own shipments, null when it is not among the recent ones'}
              amountMinor: {type: integer}
              releaseAt: {type: [string, 'null']}
    Payout:
      type: object
      required: [id, amountMinor, currency, status, requestedAt, holdReason, failureMessage]
      properties:
        id: {type: string}
        amountMinor: {type: integer}
        currency: {type: string}
        status: {type: string, enum: [REQUESTED, HELD, IN_TRANSIT, PAID, FAILED]}
        requestedAt: {type: string}
        holdReason: {type: [string, 'null']}
        failureMessage: {type: [string, 'null']}
    SellerTaxStatement:
      type: object
      required: [month, currency, rows, totals, months]
      properties:
        month: {type: string, example: '2026-09'}
        currency: {type: string, example: USD}
        rows:
          type: array
          items: {$ref: '#/components/schemas/SellerTaxStateRow'}
        totals: {$ref: '#/components/schemas/SellerTaxStateTotals'}
        months: {type: array, items: {type: string}, description: "The months the picker offers, newest first."}
    SellerTaxStateRow:
      type: object
      required: [jurisdiction, state, orders, grossSalesMinor, taxableSalesMinor, taxCollectedMinor, taxRefundedMinor, netTaxMinor]
      properties:
        jurisdiction: {type: string, example: US-TX}
        state: {type: string, example: TX}
        orders: {type: integer, format: int64}
        grossSalesMinor: {type: integer, format: int64, description: "All sales shipped to the state, net of refunds"}
        taxableSalesMinor: {type: integer, format: int64}
        taxCollectedMinor: {type: integer, format: int64}
        taxRefundedMinor: {type: integer, format: int64, description: Tax given back by refunds}
        netTaxMinor: {type: integer, format: int64, description: Collected minus refunded}
    SellerTaxStateTotals:
      type: object
      required: [orders, grossSalesMinor, taxableSalesMinor, taxCollectedMinor, taxRefundedMinor, netTaxMinor]
      properties:
        orders: {type: integer, format: int64}
        grossSalesMinor: {type: integer, format: int64}
        taxableSalesMinor: {type: integer, format: int64}
        taxCollectedMinor: {type: integer, format: int64}
        taxRefundedMinor: {type: integer, format: int64}
        netTaxMinor: {type: integer, format: int64}
    PayoutsView:
      type: object
      required: [balance, payouts, historyAvailable, planFeeDeductions]
      properties:
        balance: {$ref: '#/components/schemas/PayoutBalance'}
        payouts: {type: array, items: {$ref: '#/components/schemas/Payout'}}
        historyAvailable: {type: boolean}
        planFeeDeductions: {type: array, items: {$ref: '#/components/schemas/PlanFeeDeduction'}, description: 'Plan invoices paid from sales, newest first (S298)'}
    PlanFeeDeduction:
      type: object
      description: 'A plan invoice paid from sales: "Plan fee (invoice …)", deducted from the next transfers (S298)'
      required: [invoiceId, invoiceNumber, label, status, requestedMinor, withheldMinor, releasedMinor, outstandingMinor, createdAt, transfers]
      properties:
        invoiceId: {type: string}
        invoiceNumber: {type: [string, 'null']}
        label: {type: string, description: Plan fee (invoice …)}
        status: {type: string, enum: [WITHHELD, DECLINED, RELEASED]}
        requestedMinor: {type: integer}
        withheldMinor: {type: integer, description: Paid from sales; the card paid requested − withheld}
        releasedMinor: {type: integer, description: Given back (voided or refunded invoice)}
        outstandingMinor: {type: integer, description: Still to deduct from the next transfers (negative while owed back)}
        createdAt: {type: string, format: date-time}
        transfers:
          type: array
          description: The settlements it was deducted from (negative amounts were paid back with them)
          items:
            type: object
            required: [orderId, orderNumber, amountMinor, at, label]
            properties:
              orderId: {type: string}
              orderNumber: {type: [string, 'null'], description: What the screen shows (null when the order is not among the seller's recent shipments)}
              amountMinor: {type: integer}
              at: {type: string, format: date-time}
              label: {type: string}
    PayoutRequest:
      type: object
      properties:
        amountMinor: {type: integer, minimum: 1}
        all: {type: boolean}
    Cadence: {type: string, enum: [MONTHLY, QUARTERLY, ANNUAL]}
    PlanPrice:
      type: object
      required: [cadence, months, totalMinor, perMonthMinor, savingMinor, perMonthLabel, billedLabel, savingLabel]
      properties:
        cadence: {$ref: '#/components/schemas/Cadence'}
        months: {type: integer}
        totalMinor: {type: integer}
        perMonthMinor: {type: integer}
        savingMinor: {type: integer}
        perMonthLabel: {type: string}
        billedLabel: {type: string}
        savingLabel: {type: string}
    Plan:
      type: object
      required: [code, name, tagline, monthlyMinor, trialDays, features, prices, current]
      properties:
        code: {type: string}
        name: {type: string}
        tagline: {type: string}
        monthlyMinor: {type: integer}
        trialDays: {type: integer}
        features: {type: array, items: {type: string}}
        prices: {type: array, items: {$ref: '#/components/schemas/PlanPrice'}}
        current: {type: boolean}
        chargeTerms: {type: string, description: 'What the plan charges, in words (free months, conditions), e.g. First 3 months free, then $39/mo; empty when not known'}
        entitlements:
          description: What the plan allows; null when the seller service did not say
          oneOf:
            - {$ref: '#/components/schemas/PlanEntitlements'}
            - {type: 'null'}
    PlanEntitlements:
      type: object
      description: >-
        What a plan lets an organisation do; staff set it per plan. A capability that is off is not offered to the plan's
        members at all. Null when the seller service did not say.
      required: [listings, listingsUnlimited, aiListingWriter, lolaTier, bulkUpload, imageLibrary, coupons]
      properties:
        listings: {type: [integer, 'null'], format: int64, description: The most live listings; null = unlimited}
        listingsUnlimited: {type: boolean}
        aiListingWriter: {type: boolean, description: The AI listing writer is included}
        lolaTier: {type: string, enum: [NONE, ESSENTIALS, GROWTH, PRO], description: 'What Lola, the seller assistant, can do; NONE = not included'}
        bulkUpload: {type: boolean, description: Listings can be uploaded in bulk}
        imageLibrary: {type: boolean, description: The bulk image library is included}
        coupons: {type: boolean, description: Coupon codes for the seller's listings are included}
    BillingPaymentMethod:
      type: object
      required: [id, kind, brand, last4, expMonth, expYear, bankName, accountType, verified, receivesPayouts, isDefault, label]
      properties:
        id: {type: string}
        kind: {type: string, enum: [card, bank]}
        brand: {type: [string, 'null']}
        last4: {type: string}
        expMonth: {type: [integer, 'null']}
        expYear: {type: [integer, 'null']}
        bankName: {type: [string, 'null']}
        accountType: {type: [string, 'null']}
        verified: {type: boolean}
        receivesPayouts: {type: boolean}
        isDefault: {type: boolean}
        label: {type: string}
    InvoiceLine:
      type: object
      required: [kind, description, amountMinor]
      properties:
        kind: {type: string, enum: [PLAN, USAGE, COUPON, PRORATION, WAIVER], description: 'USAGE is a metered add-on; COUPON and WAIVER are negative (a coupon, or the plan fee a charge condition waived)'}
        description: {type: string}
        amountMinor: {type: integer, format: int64}
    Invoice:
      type: object
      description: >-
        A plan invoice AfroTransact issued itself for one billing period. It is settled in this order: platform credit
        (coupons are already off the invoice), the seller's sales — only if they chose to pay from sales — then the
        saved card or bank account; a failed charge is retried 1, 3, 5 and 7 days later.
      required: [id, number, periodStart, periodEnd, subtotalMinor, discountMinor, amountDueMinor, amountPaidMinor, currency, status, createdAt, paidAt, nextAttemptAt, lastError, lines, paidFromCreditMinor, paidFromSalesMinor, paidByCardMinor, waivedMinor, canRetry]
      properties:
        id: {type: string}
        number: {type: string}
        periodStart: {type: [string, 'null'], format: date-time}
        periodEnd: {type: [string, 'null'], format: date-time}
        subtotalMinor: {type: integer, format: int64, description: The plan fee and usage before coupons and waivers}
        discountMinor: {type: integer, format: int64, description: Coupons and what a charge condition waived}
        amountDueMinor: {type: integer, format: int64, description: What is owed after discounts}
        amountPaidMinor: {type: integer, format: int64}
        currency: {type: string}
        status: {type: string, enum: [OPEN, PAID, VOID, UNCOLLECTIBLE], description: 'A fully waived or covered invoice is PAID'}
        createdAt: {type: string, format: date-time}
        paidAt: {type: [string, 'null'], format: date-time}
        nextAttemptAt: {type: [string, 'null'], format: date-time, description: When an unpaid invoice is tried again}
        lastError: {type: [string, 'null'], description: Why the last attempt failed ("Your card was declined.")}
        lines: {type: array, items: {$ref: '#/components/schemas/InvoiceLine'}}
        paidFromCreditMinor: {type: integer, format: int64, description: Paid from platform credit}
        paidFromSalesMinor: {type: integer, format: int64, description: 'Paid from the organisation''s sales (S298): withheld from its earnings, only if it chose that'}
        paidByCardMinor: {type: integer, format: int64, description: 'Paid (or, while open, due) by card or bank: the rest'}
        waivedMinor: {type: integer, format: int64, description: Forgiven by staff}
        canRetry: {type: boolean, description: The seller can fix the payment method and retry}
    PlanFeeCollectionMode:
      type: string
      enum: [EARNINGS_FIRST, CARD]
      description: 'EARNINGS_FIRST: "Pay your plan from your sales" — each invoice is taken from pending earnings and the card pays only what they don''t cover. CARD: "Charge my card" — plan fees stay a separate card expense.'
    PlanFeeCollectionInput:
      type: object
      required: [mode]
      properties:
        mode: {$ref: '#/components/schemas/PlanFeeCollectionMode'}
    PlanFeeCollectionView:
      type: object
      description: How the organisation pays its plan (S298)
      required: [available, mode, effective, source, platformDefault, appliesFromInvoiceAt, appliesFromLabel, inProgressInvoiceId, changedAt, canChange]
      properties:
        available: {type: boolean, description: The platform offers the choice; false hides it and every invoice is charged to the card}
        mode: {$ref: '#/components/schemas/PlanFeeCollectionMode'}
        effective: {$ref: '#/components/schemas/PlanFeeCollectionMode'}
        source: {type: string, enum: [DEFAULT, ONBOARDING, SELLER, STAFF]}
        platformDefault: {$ref: '#/components/schemas/PlanFeeCollectionMode'}
        appliesFromInvoiceAt: {type: [string, 'null'], format: date-time, description: A change applies from the invoice of this date (the next renewal)}
        appliesFromLabel: {type: string}
        inProgressInvoiceId: {type: [string, 'null'], description: An invoice being paid from sales right now keeps the earlier choice}
        changedAt: {type: [string, 'null'], format: date-time}
        canChange: {type: boolean, description: Owner and finance roles may change it}
    Subscription:
      type: object
      required: [planCode, planName, cadence, status, priceLabel, billedLabel, trialEndsAt, currentPeriodEnd, nextChargeAt, nextChargeMinor, nextChargeLabel, cancelAtPeriodEnd, pendingChange, dunning]
      properties:
        planCode: {type: string}
        planName: {type: string}
        cadence: {$ref: '#/components/schemas/Cadence'}
        status: {type: string}
        priceLabel: {type: string}
        billedLabel: {type: string}
        trialEndsAt: {type: [string, 'null'], format: date-time}
        currentPeriodEnd: {type: [string, 'null'], format: date-time}
        nextChargeAt: {type: [string, 'null'], format: date-time}
        nextChargeMinor: {type: [integer, 'null']}
        nextChargeLabel: {type: string}
        cancelAtPeriodEnd: {type: boolean}
        pendingChange:
          type: [object, 'null']
          required: [planCode, planName, cadence, effectiveAt]
          properties:
            planCode: {type: string}
            planName: {type: string}
            cadence: {$ref: '#/components/schemas/Cadence'}
            effectiveAt: {type: string, format: date-time}
        dunning: {type: [string, 'null']}
        planVersion: {type: integer, description: 'Plan version (prices) the organisation pays; changes only by a plan change or a staff migration (S292)'}
        creditBalanceMinor: {type: integer, format: int64, minimum: 0, description: 'Platform credit the next invoices use first (rewards, staff credits)'}
        trialSource: {type: [string, 'null'], enum: [PLAN, CAMPAIGN, OVERRIDE, NONE, null]}
        chargeGate:
          description: A condition staff put on the plan charges, with the seller's progress; null when charges apply as normal
          oneOf:
            - {$ref: '#/components/schemas/ChargeGate'}
            - {type: 'null'}
        entitlements:
          description: What the plan allows
          oneOf:
            - {$ref: '#/components/schemas/PlanEntitlements'}
            - {type: 'null'}
    ChargeGate:
      type: object
      description: >-
        START_AFTER: no plan charge until the seller reaches the threshold (sales, orders, bookings or live listings);
        WAIVE_WHILE: free while they keep it; WAIVE_UNTIL: free until a date. Staff set it with a reason.
      required: [mode, metric, threshold, progress, until, metAt, label]
      properties:
        mode: {type: string, enum: [START_AFTER, WAIVE_WHILE, WAIVE_UNTIL]}
        metric: {type: [string, 'null'], enum: [GROSS_SALES, COMPLETED_ORDERS, COMPLETED_BOOKINGS, ACTIVE_LISTINGS, null]}
        threshold: {type: [integer, 'null'], format: int64, description: 'Minor units for GROSS_SALES, else a count'}
        progress: {type: integer, format: int64, description: Where the seller is now}
        until: {type: [string, 'null'], format: date-time}
        metAt: {type: [string, 'null'], format: date-time, description: A START_AFTER condition was reached; charging has started}
        label: {type: string, description: 'One sentence for the seller: "Charging starts after $1,000 in sales — you''re at $420"'}
    RewardProgress:
      type: object
      description: >-
        A reward the organisation can still earn: "$640 of $1,000 in sales → 1 month free" (S296). A LESS_THAN rule
        (low-sales relief, S299) has no progress to show: it is pending until checkAt, when it is decided once.
      required: [ruleId, name, metric, value, threshold, percent, qualifies, label, rewardLabel, conditionLabel, comparison, windowAnchor, pending]
      properties:
        ruleId: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        metric: {type: string, enum: [GROSS_SALES, ACTIVE_LISTINGS, COMPLETED_ORDERS, COMPLETED_BOOKINGS, DAYS_SINCE_APPROVAL]}
        value: {type: integer, format: int64, description: 'Cents for GROSS_SALES, a count otherwise'}
        threshold: {type: integer, format: int64}
        percent: {type: integer, minimum: 0, maximum: 100}
        qualifies: {type: boolean}
        label: {type: string}
        rewardLabel: {type: string}
        conditionLabel: {type: string}
        endsAt: {type: [string, 'null'], format: date-time}
        comparison: {type: string, enum: [AT_LEAST, LESS_THAN]}
        windowAnchor: {type: string, enum: [APPROVAL, SUBSCRIPTION_START]}
        windowDays: {type: [integer, 'null'], description: The window's length (the first N days)}
        pending: {type: boolean, description: Decided once at window end and the check is still to come}
        checkAt: {type: [string, 'null'], format: date-time, description: When the check runs (rules checked at window end)}
        windowClosesAt: {type: [string, 'null'], format: date-time}
    EarnedReward:
      type: object
      description: A reward or credit the organisation received (reward rules and staff adjustments).
      required: [id, source, type, summary, status, createdAt]
      properties:
        id: {type: string}
        source: {type: string, enum: [RULE, MANUAL]}
        type: {type: string, enum: [FREE_DAYS, FREE_MONTHS, CREDIT, PERCENT_OFF, WAIVE_INVOICE, TRIAL_END, CHARGE_GATE]}
        summary: {type: string}
        reason: {type: [string, 'null'], description: The reward rule's name}
        status: {type: string, enum: [PENDING, APPLIED, FAILED]}
        creditMinor: {type: [integer, 'null'], format: int64}
        freeDays: {type: [integer, 'null']}
        createdAt: {type: string, format: date-time}
        appliedAt: {type: [string, 'null'], format: date-time}
        comparison: {type: [string, 'null'], enum: [AT_LEAST, LESS_THAN, null], description: 'The reward rule''s comparison: LESS_THAN is low-sales relief'}
        nextChargeAt: {type: [string, 'null'], format: date-time, description: 'Free days: the new trial end, when Stripe charges next'}
    SellerRewardsView:
      type: object
      required: [available, earned]
      properties:
        available: {type: array, items: {$ref: '#/components/schemas/RewardProgress'}}
        earned: {type: array, items: {$ref: '#/components/schemas/EarnedReward'}}
    BillingPlanChangePreview:
      type: object
      required: [change, planCode, planName, cadence, amountDueNowMinor, nextChargeMinor, trialing]
      properties:
        change: {type: string, enum: [IMMEDIATE_UPGRADE, AT_RENEWAL, NO_CHANGE]}
        planCode: {type: string}
        planName: {type: string}
        cadence: {$ref: '#/components/schemas/Cadence'}
        effectiveAt: {type: [string, 'null'], format: date-time}
        amountDueNowMinor: {type: integer, format: int64, description: "Invoiced now: Stripe's proration of an upgrade (0 in a trial or for a change at renewal)"}
        nextChargeMinor: {type: integer, format: int64}
        nextChargeAt: {type: [string, 'null'], format: date-time}
        trialing: {type: boolean}
    BillingSetupIntent:
      type: object
      required: [setupIntentId, clientSecret, publishableKey, localTest]
      properties:
        setupIntentId: {type: string}
        clientSecret: {type: string, description: 'Confirm with the Payment Element (stripe.confirmSetup)'}
        publishableKey: {type: string}
        localTest: {type: boolean, description: 'No Stripe key on this machine; the local stand-in accepted it'}
    AddBillingPaymentMethod:
      type: object
      required: [stripePaymentMethodId, kind, last4]
      properties:
        stripePaymentMethodId: {type: string, pattern: '^pm_'}
        kind: {type: string, enum: [CARD, US_BANK_ACCOUNT]}
        brand: {type: string}
        last4: {type: string, pattern: '^[0-9]{4}$'}
        expMonth: {type: integer}
        expYear: {type: integer}
        bankName: {type: string}
        accountType: {type: string}
        makeDefault: {type: boolean}
    BillingView:
      type: object
      required: [subscription, plans, paymentMethods, invoices, canManage, planFeeCollection]
      properties:
        planFeeCollection:
          description: How the plan is paid (S298); null when it can't be read
          oneOf:
            - {$ref: '#/components/schemas/PlanFeeCollectionView'}
            - {type: 'null'}
        subscription: {$ref: '#/components/schemas/Subscription'}
        plans: {type: array, items: {$ref: '#/components/schemas/Plan'}}
        paymentMethods: {type: array, items: {$ref: '#/components/schemas/BillingPaymentMethod'}}
        invoices: {type: array, items: {$ref: '#/components/schemas/Invoice'}}
        canManage: {type: boolean, description: Only the owner role changes billing}
    ChangePlanRequest:
      type: object
      required: [planCode, cadence]
      properties:
        planCode: {type: string, minLength: 1}
        cadence: {$ref: '#/components/schemas/Cadence'}
    ChangePlanResult:
      type: object
      required: [applied, billing]
      properties:
        applied: {type: string, enum: [IMMEDIATE_UPGRADE, AT_RENEWAL, NO_CHANGE]}
        billing: {$ref: '#/components/schemas/BillingView'}
    # ── team
    RoleCard:
      type: object
      required: [key, label, summary, note, can, view, cannot]
      properties:
        key: {type: string}
        label: {type: string}
        summary: {type: string}
        note: {type: [string, 'null']}
        can: {type: array, items: {type: string}, description: What the role can change}
        view: {type: array, items: {type: string}, description: What it can only view}
        cannot: {type: array, items: {type: string}, description: What it can't access}
    TeamMember:
      type: object
      required: [userId, name, email, roleKey, roleLabel, status, isYou]
      properties:
        userId: {type: string}
        name: {type: string}
        email: {type: [string, 'null']}
        roleKey: {type: string}
        roleLabel: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED, INVITED], description: INVITED rows are pending invitations (userId `invite:<invitationId>`)}
        isYou: {type: boolean}
        invitationId: {type: string, format: uuid, description: INVITED rows only (revoke with it)}
        joinedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: INVITED rows only}
    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 200}
    InvitationPreview:
      type: object
      required: [orgName, orgKind, email, roleKey, roleLabel, status, expiresAt]
      properties:
        orgName: {type: string}
        orgKind: {type: string, enum: [SELLER, PROVIDER]}
        email: {type: string, description: The invited address (sign in or sign up with it)}
        roleKey: {type: string}
        roleLabel: {type: string}
        status: {type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]}
        expiresAt: {type: string, format: date-time}
    AcceptedInvitation:
      type: object
      required: [orgId, orgName, orgKind, roleKey, roleLabel, alreadyMember]
      properties:
        orgId: {type: string}
        orgName: {type: string}
        orgKind: {type: string, enum: [SELLER, PROVIDER]}
        roleKey: {type: string}
        roleLabel: {type: string}
        alreadyMember: {type: boolean, description: Was already a member; the role was left unchanged}
    TeamView:
      type: object
      required: [members, roles, yourRoleKey, canManage]
      properties:
        members: {type: array, items: {$ref: '#/components/schemas/TeamMember'}}
        roles: {type: array, items: {$ref: '#/components/schemas/RoleCard'}}
        yourRoleKey: {type: string}
        canManage: {type: boolean}
    InviteRequest:
      type: object
      required: [email, roleKey]
      properties:
        email: {type: string, format: email}
        roleKey: {type: string, minLength: 1}
    RoleChangeRequest:
      type: object
      required: [roleKey]
      properties:
        roleKey: {type: string, minLength: 1}
    # ── provider hub
    BookingStatus:
      type: string
      enum: [PENDING_PAYMENT, REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED, RESCHEDULE_PROPOSED, COMPLETED, NO_SHOW, DECLINED, EXPIRED, CANCELLED_CUSTOMER, CANCELLED_PROVIDER]
    BookingAction: {type: string, enum: [CONFIRM, DECLINE, PROPOSE, COMPLETE, NO_SHOW, CANCEL]}
    BookingCard:
      type: object
      required: [id, reference, customerName, serviceName, startAt, endAt, durationMinutes, status, statusLabel, priceMinor, depositMinor, currency, depositState, note, practitioner, expiresAt, proposedStartAt, allowedActions]
      properties:
        id: {type: string}
        reference: {type: string}
        customerName: {type: string}
        serviceName: {type: string}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        durationMinutes: {type: integer}
        status: {$ref: '#/components/schemas/BookingStatus'}
        statusLabel: {type: string}
        priceMinor: {type: integer}
        depositMinor: {type: integer}
        currency: {type: string}
        depositState: {type: string, enum: [none, held, captured, released, refunded]}
        note: {type: [string, 'null']}
        practitioner: {type: [string, 'null']}
        expiresAt: {type: [string, 'null'], format: date-time}
        proposedStartAt: {type: [string, 'null'], format: date-time}
        allowedActions: {type: array, items: {$ref: '#/components/schemas/BookingAction'}}
        serviceCategory: {type: [string, 'null'], description: The service's category (selects the connection fee)}
        takeHome:
          oneOf: [{$ref: '#/components/schemas/BookingTakeHome'}, {type: 'null'}]
          description: 'Booking requests: what the provider keeps at the booking''s price, after the connection fee and card fees ("You keep $X after the 8% connection fee"); null when payments cannot say'
    BookingTakeHome:
      type: object
      required: [connectionFeeBps, connectionFeeMinor, cardFeesMinor, keepMinor, source, currency]
      properties:
        connectionFeeBps: {type: integer, description: AfroTransact's connection fee for the service category (800 = 8 %)}
        connectionFeeMinor: {type: integer, format: int64}
        cardFeesMinor: {type: integer, format: int64, description: Card fee estimate on the deposit charge and on the balance charge}
        keepMinor: {type: integer, format: int64, description: Price − connection fee − card fees}
        source: {type: string, enum: [OVERRIDE, PLAN, CATEGORY, DEFAULT, RETAIL]}
        currency: {type: string}
    SellerAppliedRate:
      type: object
      required: [category, label, bps, source, planCode, planName, negotiatedUntil]
      properties:
        category: {type: string, description: "'' for categories nobody lists"}
        label: {type: string}
        bps: {type: integer, minimum: 0, maximum: 10000}
        source: {type: string, enum: [OVERRIDE, PLAN, CATEGORY, DEFAULT, RETAIL], description: 'OVERRIDE: negotiated for this organisation'}
        planCode: {type: [string, 'null']}
        planName: {type: [string, 'null']}
        negotiatedUntil: {type: [string, 'null'], format: date-time, description: 'Source OVERRIDE: when the negotiated rate ends (null = open-ended)'}
    SellerNegotiatedRate:
      type: object
      required: [type, category, label, rateBps, amountMinor, startsAt, endsAt, status]
      properties:
        type: {type: string, enum: [COMMISSION, CONNECTION_FEE, FBA_FEE]}
        category: {type: string, description: "'*' = every category"}
        label: {type: string}
        rateBps: {type: integer}
        amountMinor: {type: [integer, 'null'], format: int64, description: 'FBA_FEE: the fee per unit in minor units; null for rates in basis points'}
        startsAt: {type: string, format: date-time}
        endsAt: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [SCHEDULED, ACTIVE, ENDED, EXPIRED]}
    SellerRateCard:
      type: object
      required: [kind, version, effectiveFrom, planCode, planName, other, categories, negotiated]
      description: What the organisation pays on one kind of line now (PRODUCT commission, SERVICE connection fee), with sources
      properties:
        kind: {type: string, enum: [PRODUCT, SERVICE]}
        version: {type: integer}
        effectiveFrom: {type: string, format: date-time}
        planCode: {type: [string, 'null']}
        planName: {type: [string, 'null']}
        other: {$ref: '#/components/schemas/SellerAppliedRate'}
        categories: {type: array, items: {$ref: '#/components/schemas/SellerAppliedRate'}}
        negotiated: {type: array, items: {$ref: '#/components/schemas/SellerNegotiatedRate'}}
    DaySummary:
      type: object
      required: [date, appointments, bookedMinutes, expectedRevenueMinor, needsAction]
      properties:
        date: {type: string, format: date}
        appointments: {type: integer}
        bookedMinutes: {type: integer}
        expectedRevenueMinor: {type: integer}
        needsAction: {type: integer}
    TimeRange:
      type: object
      required: [start, end]
      properties:
        start: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        end: {type: string, pattern: '^([01]\d|2[0-4]):[0-5]\d$'}
    Weekday: {type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN]}
    DayHours:
      type: object
      required: [day, ranges]
      properties:
        day: {$ref: '#/components/schemas/Weekday'}
        ranges: {type: array, items: {$ref: '#/components/schemas/TimeRange'}, description: Empty = closed; two ranges = a break}
    CalendarView:
      type: object
      required: [timezone, from, to, openHours, bookings, days]
      properties:
        timezone: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        openHours: {type: array, items: {$ref: '#/components/schemas/DayHours'}}
        bookings: {type: array, items: {$ref: '#/components/schemas/BookingCard'}}
        days: {type: array, items: {$ref: '#/components/schemas/DaySummary'}}
    BookingActionRequest:
      type: object
      required: [action]
      properties:
        action: {$ref: '#/components/schemas/BookingAction'}
        reason: {type: string, maxLength: 500, description: Required to decline or cancel}
        proposedStartAt: {type: string, format: date-time, description: Required to propose a new time}
    BookingRules:
      type: object
      required: [leadMinutes, horizonDays, bufferMinutes, stepMinutes, maxPerDay, instantBooking, autoAcceptReschedule]
      properties:
        leadMinutes: {type: integer, minimum: 0, maximum: 43200}
        horizonDays: {type: integer, minimum: 1, maximum: 365}
        bufferMinutes: {type: integer, minimum: 0, maximum: 240}
        stepMinutes: {type: integer, minimum: 5, maximum: 240}
        maxPerDay: {type: integer, minimum: 1, maximum: 50}
        instantBooking: {type: boolean}
        autoAcceptReschedule: {type: boolean}
    Availability:
      type: object
      required: [timezone, weekly, blockedDates, rules]
      properties:
        timezone: {type: string}
        weekly: {type: array, minItems: 7, maxItems: 7, items: {$ref: '#/components/schemas/DayHours'}}
        blockedDates:
          type: array
          items:
            type: object
            required: [date, note]
            properties:
              date: {type: string, format: date}
              note: {type: string}
        rules: {$ref: '#/components/schemas/BookingRules'}
    TakeHome:
      type: object
      required: [commissionPercent, commissionMinor, cardFeesMinor, takeHomeMinor]
      properties:
        commissionPercent: {type: number}
        commissionMinor: {type: integer}
        cardFeesMinor: {type: integer}
        takeHomeMinor: {type: integer}
    ServiceOffer:
      type: object
      required: [id, name, description, durationMinutes, priceMinor, depositMinor, currency, active, takeHome]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        durationMinutes: {type: integer}
        priceMinor: {type: integer}
        depositMinor: {type: integer}
        currency: {type: string}
        active: {type: boolean}
        takeHome: {$ref: '#/components/schemas/TakeHome'}
    ServiceInput:
      type: object
      required: [name, durationMinutes, priceMinor, depositMinor, active]
      properties:
        name: {type: string, minLength: 3, maxLength: 120}
        description: {type: string, maxLength: 2000}
        durationMinutes: {type: integer, minimum: 5, maximum: 1440}
        priceMinor: {type: integer, minimum: 1}
        depositMinor: {type: integer, minimum: 0}
        active: {type: boolean}
    PolicyKind: {type: string, enum: [FLEXIBLE, MODERATE, STRICT, CUSTOM]}
    CancellationPolicyInput:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/PolicyKind'}
        freeHours: {type: integer, minimum: 0, maximum: 720}
        partialRefund: {type: boolean}
        partialFromHours: {type: integer, minimum: 0, maximum: 720}
        partialPercent: {type: integer, minimum: 1, maximum: 99}
        noShow: {type: string, enum: [DEPOSIT, FULL]}
        rescheduleHours: {type: integer, minimum: 0, maximum: 720}
        maxReschedules: {type: integer, minimum: 0, maximum: 10}
    CancellationPolicy:
      type: object
      required: [kind, label, freeHours, partialRefund, partialFromHours, partialPercent, noShow, rescheduleHours, maxReschedules, summary, timeline]
      properties:
        kind: {$ref: '#/components/schemas/PolicyKind'}
        label: {type: string}
        freeHours: {type: integer}
        partialRefund: {type: boolean}
        partialFromHours: {type: integer}
        partialPercent: {type: integer}
        noShow: {type: string, enum: [DEPOSIT, FULL]}
        rescheduleHours: {type: integer}
        maxReschedules: {type: integer}
        summary: {type: string}
        timeline:
          type: array
          description: Refund timeline from booking to the appointment
          items:
            type: object
            required: [label, refundPercent]
            properties:
              label: {type: string}
              refundPercent: {type: integer}
    EarningsRow:
      type: object
      required: [bookingId, reference, customerName, serviceName, startAt, status, statusLabel, collectedMinor, commissionMinor, cardFeesMinor, lateCancelFeeMinor, netMinor]
      properties:
        bookingId: {type: string}
        reference: {type: string}
        customerName: {type: string}
        serviceName: {type: string}
        startAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/BookingStatus'}
        statusLabel: {type: string}
        collectedMinor: {type: integer}
        commissionMinor: {type: integer}
        cardFeesMinor: {type: integer}
        lateCancelFeeMinor: {type: integer}
        netMinor: {type: integer}
    ProviderFee:
      type: object
      required: [id, bookingReference, amountMinor, currency, reason, status, nextAttemptAt, createdAt]
      properties:
        id: {type: string}
        bookingReference: {type: string}
        amountMinor: {type: integer}
        currency: {type: string}
        reason: {type: string}
        status: {type: string, enum: [OUTSTANDING, COLLECTED]}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    ProviderFees:
      type: object
      description: Late-cancellation fees the provider owes (payments `GET /v1/payouts/provider-fees`); `available` is false when payments cannot answer.
      required: [available, outstandingMinor, collectedMinor, items]
      properties:
        available: {type: boolean}
        outstandingMinor: {type: integer}
        collectedMinor: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/ProviderFee'}}
    Earnings:
      type: object
      required: [currency, commissionPercent, payoutDay, totals, rows, providerFees, connectionFee]
      properties:
        currency: {type: string}
        commissionPercent: {type: number}
        payoutDay: {type: string}
        totals:
          type: object
          required: [collectedMinor, commissionMinor, cardFeesMinor, lateCancelFeesMinor, netMinor, heldMinor]
          properties:
            collectedMinor: {type: integer}
            commissionMinor: {type: integer}
            cardFeesMinor: {type: integer}
            lateCancelFeesMinor: {type: integer}
            netMinor: {type: integer}
            heldMinor: {type: integer}
        rows: {type: array, items: {$ref: '#/components/schemas/EarningsRow'}}
        providerFees: {$ref: '#/components/schemas/ProviderFees'}
        connectionFee:
          oneOf: [{$ref: '#/components/schemas/SellerRateCard'}, {type: 'null'}]
          description: The provider's connection fee now, per service category, with where it comes from; null when payments cannot say
    # ── fees (read-only)
    SellerFeeCategory:
      type: object
      required: [category, label, commissionBps, source, planCode, planName, negotiatedUntil]
      properties:
        category: {type: string, description: payments category key (lower-case)}
        label: {type: string}
        commissionBps: {type: integer, minimum: 0, maximum: 10000, description: 1250 = 12.50 %}
        source: {type: string, enum: [OVERRIDE, PLAN, CATEGORY, DEFAULT, RETAIL], description: 'OVERRIDE: negotiated for this organisation; PLAN: the rate of its plan'}
        planCode: {type: [string, 'null']}
        planName: {type: [string, 'null']}
        negotiatedUntil: {type: [string, 'null'], format: date-time, description: 'Source OVERRIDE: when the negotiated rate ends'}
    SellerFeeVersion:
      type: object
      required: [version, effectiveFrom, defaultCommissionBps, categories, cardPctBps, cardFixedMinor, fbaPerUnitMinor, reverseCommissionOnRefund, deliveryFee]
      properties:
        version: {type: integer}
        effectiveFrom: {type: string, format: date-time}
        defaultCommissionBps: {type: integer, description: "Commission in categories not listed (the organisation's all-category override when it has one)"}
        categories: {type: array, items: {$ref: '#/components/schemas/SellerFeeCategory'}}
        cardPctBps: {type: integer, description: 'Card fee estimate per charge, percentage part'}
        cardFixedMinor: {type: integer, format: int64, description: 'Card fee estimate per charge, fixed part'}
        fbaPerUnitMinor: {type: integer, format: int64, description: 'FBA pick, pack and ship fee per unit'}
        reverseCommissionOnRefund: {type: boolean, description: Refunds give back the commission on the refunded amount}
        deliveryFee:
          oneOf: [{$ref: '#/components/schemas/SellerDeliveryFee'}, {type: 'null'}]
          description: The seller delivery fee of AfroTransact Delivery from your store (S255); null when the version has no delivery pricing
    SellerDeliveryTariff:
      type: object
      required: [mode, flatPerPackageMinor, baseMinor, perMileMinor, bands, minMinor, maxMinor]
      properties:
        mode: {type: string, enum: [FLAT, DISTANCE]}
        flatPerPackageMinor: {type: [integer, 'null']}
        baseMinor: {type: [integer, 'null']}
        perMileMinor: {type: [integer, 'null']}
        bands:
          type: array
          items:
            type: object
            required: [fromMiles, toMiles, feeMinor]
            properties:
              fromMiles: {type: number}
              toMiles: {type: number}
              feeMinor: {type: integer}
        minMinor: {type: [integer, 'null']}
        maxMinor: {type: [integer, 'null']}
    SellerDeliveryFee:
      type: object
      required: [enabled, maxRadiusMiles, source, tariff, summary]
      properties:
        enabled: {type: boolean, description: AfroTransact Delivery from seller stores is offered}
        maxRadiusMiles: {type: number}
        source: {type: string, enum: [DEFAULT, OVERRIDE, RETAIL], description: 'OVERRIDE: negotiated for this organisation; RETAIL: never charged'}
        tariff: {oneOf: [{$ref: '#/components/schemas/SellerDeliveryTariff'}, {type: 'null'}], description: null = no fee}
        summary: {type: string, examples: ['$2.00 per package']}
    SellerFeeChange:
      type: object
      required: [field, label, from, to]
      properties:
        field: {type: string}
        label: {type: string}
        from: {type: string}
        to: {type: string}
    SellerFeesView:
      type: object
      required: [currency, retail, note, current, upcoming, changes, planCode, planName, negotiated, connectionFees]
      properties:
        currency: {type: string}
        retail: {type: boolean, description: 'AfroTransact Retail (merchant of record) — no commission, no fees'}
        note: {type: [string, 'null']}
        current: {$ref: '#/components/schemas/SellerFeeVersion'}
        upcoming: {oneOf: [{$ref: '#/components/schemas/SellerFeeVersion'}, {type: 'null'}], description: 'The next scheduled version, if any'}
        changes: {type: array, items: {$ref: '#/components/schemas/SellerFeeChange'}, description: What changes for this organisation with the upcoming version}
        planCode: {type: [string, 'null'], description: The plan whose rates apply (null when none or unknown)}
        planName: {type: [string, 'null']}
        negotiated: {type: array, items: {$ref: '#/components/schemas/SellerNegotiatedRate'}, description: Negotiated commission rates (active or scheduled)}
        connectionFees:
          oneOf: [{$ref: '#/components/schemas/SellerRateCard'}, {type: 'null'}]
          description: Connection fees on service bookings (Provider Hub); null when payments cannot say
    MirroredList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object, additionalProperties: true}}
      description: An upstream list answer wrapped as {items}.
    MirroredPage:
      type: object
      additionalProperties: true
      properties:
        items: {type: array, items: {type: object, additionalProperties: true}}
        total: {type: integer, format: int64}
        page: {type: integer}
        size: {type: integer}
      description: A page of an upstream list.
    MirroredBody:
      type: object
      additionalProperties: true
      description: The upstream request body (see the operation's description).
    InboundShipmentLine:
      type: object
      additionalProperties: true
      properties:
        lineNo: {type: integer}
        sku: {type: string}
        atin: {type: [string, 'null']}
        unitLabel: {type: [string, 'null'], description: AT-FN unit label code}
        expectedQty: {type: integer}
        receivedGood: {type: integer}
        receivedDamaged: {type: integer}
        shortQty: {type: integer}
        overQty: {type: integer}
        casePack: {type: [integer, 'null'], description: Units per case}
        cases: {type: integer}
        lotNo: {type: [string, 'null'], description: Batch on the packing list (GS1 AI 10)}
        mfgDate: {type: [string, 'null'], format: date}
        expDate: {type: [string, 'null'], format: date}
    InboundShipment:
      type: object
      additionalProperties: true
      required: [id, number, status, lines]
      description: An FBA inbound plan or a retail ASN (inventory `InboundShipment`)
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        source: {type: string, enum: [FBA, RETAIL_ASN]}
        ownerOrg: {type: [string, 'null']}
        nodeId: {type: string}
        status: {type: string, enum: [WORKING, SHIPPED, RECEIVING, CLOSED, CANCELLED]}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        expectedArrival: {type: [string, 'null'], format: date}
        expectedUnits: {type: integer}
        receivedUnits: {type: integer}
        lines: {type: array, items: {$ref: '#/components/schemas/InboundShipmentLine'}}
        boxes: {type: array, items: {type: object, additionalProperties: true}}
        version: {type: integer, format: int64}
    InboundShipmentPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InboundShipment'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        size: {type: integer}
    InboundTrackingResult:
      type: object
      additionalProperties: true
      properties:
        shipment: {$ref: '#/components/schemas/InboundShipment'}
        trackingRegistered: {type: boolean}
    InventoryLot:
      type: object
      additionalProperties: true
      required: [id, sku, lotNo, nodeId, status]
      description: A batch of one SKU at one node (inventory `Lot`)
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        lotNo: {type: string}
        nodeId: {type: string}
        ownerOrg: {type: [string, 'null']}
        bin: {type: [string, 'null']}
        qtyOnHand: {type: integer}
        qtyReserved: {type: integer}
        qtyAvailable: {type: integer}
        mfgDate: {type: [string, 'null'], format: date}
        expDate: {type: [string, 'null'], format: date}
        status: {type: string, enum: [SELLABLE, QUARANTINE, EXPIRED, WRITTEN_OFF, DAMAGED]}
        markdownFlag: {type: string, enum: [NONE, WITHIN_60, WITHIN_30]}
        receiptRef: {type: [string, 'null']}
        version: {type: integer, format: int64}
    InventoryLotPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InventoryLot'}}
        total: {type: integer, format: int64}
        page: {type: integer}
        size: {type: integer}
