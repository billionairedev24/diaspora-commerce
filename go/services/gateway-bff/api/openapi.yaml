        '200':
          description: Now the default
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/account/phone/verification:
    post:
      tags: [Account]
      operationId: startPhoneVerification
      summary: Text a 6-digit code to the account phone number
      description: >-
        identity `POST /v1/me/phone/verification`. 10-minute expiry; at most one code per 30 seconds and five per hour
        (429 with `Retry-After`). 422 `PHONE_MISSING` without a phone; 409 `CONFLICT` when already verified.
      security: [{sessionCookie: []}, {bearer: []}]
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhoneCodeSent'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/phone/verification/confirm:
    post:
      tags: [Account]
      operationId: confirmPhoneVerification
      summary: Confirm the account phone number with the SMS code
      description: >-
        identity `POST /v1/me/phone/verification/confirm`. Wrong code: 422 `INVALID_CODE` on `code`; expired, used, too
        many attempts or the phone changed since: 410 `CHALLENGE_EXPIRED` (send a new code).
      security: [{sessionCookie: []}, {bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^\d{6}$'}
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhoneVerification'}
        '401': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/payment-methods:
    get:
      tags: [Account]
      operationId: listPaymentMethods
      summary: Saved Stripe payment methods (brand, last 4, expiry only)
