    HelpArticlePage:
      type: object
      required: [items, topics, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/HelpArticleSummary'}
        topics:
          type: array
          description: Topics with at least one published article, in display order
          items: {$ref: '#/components/schemas/HelpTopicCount'}
        nextCursor: {type: [string, 'null'], description: Cursor of the next page; null on the last page}
    LegalHeading:
      type: object
      required: [id, title]
      properties:
        id: {type: string, example: notifications-email-and-text-messages}
        title: {type: string}
    LegalVersionRef:
      type: object
      required: [version, effectiveDate, status]
      properties:
        version: {type: string}
        effectiveDate: {type: string, format: date}
        status: {type: string, enum: [CURRENT, ARCHIVED]}
        changeSummary: {type: [string, 'null']}
    CookiePolicy:
      type: object
      required: [noticeVersion, effectiveDate, noticeHref, categories, cookies]
      properties:
        noticeVersion: {type: string, example: '2.1'}
        effectiveDate: {type: string, format: date}
        noticeHref: {type: string, example: /legal/cookies}
        categories:
          type: array
          items: {$ref: '#/components/schemas/CookieCategory'}
        cookies:
          type: array
          items: {$ref: '#/components/schemas/CookieDefinition'}
    CookieCategory:
      type: object
      required: [key, name, description, required, gpcOptOut]
      properties:
        key: {type: string, example: analytics}
        name: {type: string}
        description: {type: string}
        required: {type: boolean, description: Always on (strictly necessary)}
        gpcOptOut: {type: boolean, description: Switched off and locked by Global Privacy Control or a sale/sharing opt-out}
    CookieDefinition:
      type: object
      required: [name, provider, purpose, duration, category]
      properties:
        name: {type: string, example: _gcl_au}
        provider: {type: string}
        purpose: {type: string}
        duration: {type: string}
        category: {type: string}
    ConsentRequest:
      type: object
      required: [categories]
      properties:
        categories:
          type: object
          description: Choice per category key (unknown keys are rejected)
          additionalProperties: {type: boolean}
        saleOptOut: {type: boolean, description: Do not sell or share my personal information}
        gpc: {type: boolean, description: navigator.globalPrivacyControl (the Sec-GPC header is also read)}
        source: {type: string, enum: [banner, preferences, privacy-choices], default: banner}
    ConsentRecord:
      type: object
      required: [id, categories, gpc, saleOptOut, policyVersion, recordedAt]
      properties:
        id: {type: string, format: uuid}
        categories:
          type: object
          additionalProperties: {type: boolean}
        gpc: {type: boolean}
        saleOptOut: {type: boolean}
        policyVersion: {type: string, description: Cookie Notice version the choice was made under}
        recordedAt: {type: string, format: date-time}
    PrivacyRequest:
      type: object
      required: [type, email, state]
      properties:
        type: {type: string, enum: [access, delete, correct, optout]}
        email: {type: string, format: email, description: Email on the requester's account}
        state: {type: string, pattern: '^[A-Z]{2}$', description: US state of residence (DC included), example: TX}
        details: {type: string, maxLength: 2000}
        locale: {type: string, example: en}
    PrivacyRequestReceipt:
      type: object
      required: [reference, type, status, submittedAt, dueAt]
      properties:
        reference: {type: string, example: PR-100001}
        type: {type: string, enum: [access, delete, correct, optout]}
        status: {type: string, enum: [RECEIVED, COMPLETED, DENIED]}
        submittedAt: {type: string, format: date-time}
        dueAt: {type: string, format: date-time, description: Response deadline (45 days)}
    BackOffice:
      type: object
      description: A back office the signed-in person can open from the storefront (links use each app's configured URL).
      required: [app, state]
      properties:
        app:
          type: string
          enum: [seller-center, provider-hub, staff-console]
          description: Seller Center and Provider Hub are the Seller Center app (SELLER_CENTER_URL); the staff console is STAFF_CONSOLE_URL.
        state:
          type: string
          enum: [active, application]
          description: >-
            `active`: an approved (or suspended) organisation, or staff. `application`: a seller or provider application
            still in progress ("Continue your seller application"), which opens Seller Center onboarding.
    Me:
      type: object
      required: [authenticated, user, counts]
      properties:
        authenticated: {type: boolean}
        user:
          type: [object, 'null']
          required: [id, firstName, lastName, email, initials, roles, backOffices]
          properties:
            id: {type: string}
            firstName: {type: string}
            lastName: {type: string}
            email: {type: string}
            initials: {type: string}
            roles: {type: array, items: {type: string}}
            phone: {type: string, description: 'Masked account phone (•••• 0142); absent when identity is unavailable or no phone is set'}
            phoneVerified: {type: boolean, description: Whether the account phone passed SMS verification}
            backOffices:
              type: array
              description: |
                The person's back offices, for the storefront account menu and the customer app's account screen:
                Seller Center for a seller organisation, Provider Hub for a provider organisation, the staff console
                for staff. A person is always also a shopper; this only adds links (the storefront acts as the person,
                never as their organisation). Empty for shoppers only.
              items: {$ref: '#/components/schemas/BackOffice'}
        counts:
          type: [object, 'null']
          description: Badges for the account menu.
          required: [orders, returns, addresses, paymentMethods]
          properties:
            orders: {type: integer}
            returns: {type: integer}
            addresses: {type: integer}
            paymentMethods: {type: integer}
    SignOutRequest:
      type: object
      properties:
        returnTo:
          type: string
          maxLength: 2048
          description: >-
            The path to come back to on the calling app: the storefront returns there signed out (send it only for
            pages a guest may see); Seller Center and the staff console return there after signing in again.
            Anything but a relative path is ignored.
    SignOutResult:
      type: object
      required: [redirectTo]
      properties:
        redirectTo:
          type: [string, 'null']
          description: >-
            Where the browser goes next: identity's end-session URL (ends the identity session, then
            `GET /v1/auth/signed-out/{app}` on the calling app), or that signed-out URL directly when there is no
            identity session to end; null for native apps.
    PhoneCodeSent:
      type: object
      required: [sentTo, expiresAt]
      properties:
        sentTo: {type: string, description: 'Masked phone, e.g. •••• 0142'}
        expiresAt: {type: string, format: date-time}
    PhoneVerification:
      type: object
      required: [phoneVerified]
      properties:
        phoneVerified: {type: boolean}
        verifiedAt: {type: string, format: date-time}
    AddressInput:
      type: object
      required: [name, phone, line1, city, state, zip]
      properties:
        name: {type: string}
        phone: {type: string}
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        state: {type: string, pattern: '^[A-Z]{2}$'}
        zip: {type: string, pattern: '^\d{5}(-\d{4})?$'}
        isDefault: {type: boolean}
        acceptUnverified: {type: boolean, description: Keep the address as entered when it can't be USPS-verified}
    Address:
      type: object
      required: [id, name, phone, line1, line2, city, state, zip, isDefault, verified]
      properties:
        id: {type: string}
        name: {type: string}
        phone: {type: string}
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        state: {type: string}
        zip: {type: string}
        isDefault: {type: boolean}
        verified: {type: boolean}
    AddressPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Address'}}
        nextCursor: {type: [string, 'null']}
    PaymentMethod:
      type: object
      required: [id, type, brand, last4, label, expires, isDefault]
      properties:
        id: {type: string}
        type: {type: string, enum: [card, us_bank_account, cashapp, link, amazon_pay]}
        brand: {type: [string, 'null']}
        last4: {type: [string, 'null']}
        label: {type: string}
        expires: {type: [string, 'null']}
        isDefault: {type: boolean}
    PaymentMethodPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PaymentMethod'}}
        nextCursor: {type: [string, 'null']}
    OrderSummary:
      type: object
      required: [orderNumber, placedAt, totalMinor, currency, shipTo, status, shipments]
      properties:
        orderNumber: {type: string}
        placedAt: {type: string}
        totalMinor: {type: integer}
        currency: {type: string}
        shipTo: {type: string}
        status: {type: string}
        shipments:
          type: array
          items:
            type: object
            required: [shipmentId, label, status, items]
            properties:
              shipmentId: {type: string}
              label: {type: string}
              status: {type: string}
              items: {type: string}
              sellerName: {type: string, description: Who sells and ships this shipment}
              lines:
                type: array
                description: What is in the shipment (name, photo, quantity)
                items:
                  type: object
                  required: [title, quantity]
                  properties:
                    title: {type: string}
                    quantity: {type: integer}
                    imageUrl: {type: [string, 'null']}
                    productAtin: {type: string}
              cancellable: {type: boolean, description: 'The customer can still cancel it: before the parcel is packed and inside the cancellation window'}
              cancellableUntil: {type: [string, 'null'], format: date-time, description: 'When Cancel stops being offered; null when it is not offered now'}
              carrier: {type: [string, 'null']}
              trackingNumber: {type: [string, 'null']}
              promisedBy: {type: [string, 'null']}
              deliveredAt: {type: [string, 'null']}
              deliveryCode: {type: [string, 'null'], description: One-time handover code (hand delivery or perishables)}
              returnable: {type: boolean, description: A return can be started (show "Return items")}
              returnWindowEndsAt: {type: [string, 'null'], format: date-time}
              problemReportOnly: {type: boolean, description: 'Only "Report a problem" is possible (e.g. perishables, window closed)'}
    OrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OrderSummary'}}
        nextCursor: {type: [string, 'null']}
    ReturnSummary:
      type: object
      required: [rmaId, orderNumber, title, status, refundMinor]
      properties:
        rmaId: {type: string}
        orderNumber: {type: string}
        title: {type: string}
        status: {type: string, description: 'requested, approved, auto_approved, label_issued, in_transit, received, inspected, refunded, rejected, cancelled'}
        refundMinor: {type: integer, description: 'Refund estimate (tax-returns), then the refunded amount'}
        number: {type: string, examples: [RMA-0000ABCD]}
        method: {$ref: '#/components/schemas/ReturnMethod'}
        reason: {type: string}
        refundState: {type: string}
        currency: {type: string}
        cancellable: {type: boolean}
        createdAt: {type: [string, 'null']}
        labelUrl: {type: [string, 'null'], description: Drop-off return label}
        qrPayload: {type: [string, 'null'], description: Render as the drop-off QR code}
        handoverCode: {type: [string, 'null'], description: Driver pickup code (DRIVER_PICKUP)}
        dropOffBy: {type: [string, 'null']}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
    ReturnPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ReturnSummary'}}
        nextCursor: {type: [string, 'null']}
    CheckoutCouponSellerShare:
      type: object
      required: [sellerOrgId, discountMinor, funding]
      properties:
        sellerOrgId: {type: string}
        sellerName: {type: string}
        discountMinor: {type: integer}
        funding: {type: string, enum: [platform, seller], description: Who pays this slice at settlement}
    CheckoutCouponOfferDiscount:
      type: object
      required: [offerId, discountMinor]
      properties:
        offerId: {type: string}
        sellerOrgId: {type: string}
        discountMinor: {type: integer}
    CheckoutCoupon:
      type: object
      required: [code, applicable, discountMinor, shippingDiscountMinor]
      properties:
        code: {type: string}
        applicable: {type: boolean}
        rejection: {type: [string, 'null']}
        message: {type: string}
        discountMinor: {type: integer}
        shippingDiscountMinor: {type: integer}
        funding: {type: string, enum: [platform, seller]}
        fundedByOrg: {type: string, description: Seller org when funding is seller}
        offerDiscounts: {type: array, items: {$ref: '#/components/schemas/CheckoutCouponOfferDiscount'}}
        sellerShares:
          type: array
          items: {$ref: '#/components/schemas/CheckoutCouponSellerShare'}
          description: Per-seller discount totals for settlement preview
    CheckoutSummary:
      type: object
      required: [packages, addresses, paymentMethods, subtotalMinor, shippingMinor, discountMinor, shippingDiscountMinor, taxMinor, taxRateLabel, totalMinor, currency, sellerCount]
      properties:
        packages:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CartPackage'
              - type: object
                properties:
                  localDelivery:
                    $ref: '#/components/schemas/CheckoutLocalDelivery'
                  pickupPoints:
                    type: array
                    items:
                      type: object
                      required: [id, name, address, hours, ready, setBy]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        address: {type: string}
                        hours: {type: string}
                        ready: {type: string}
                        setBy: {type: string, enum: [platform, seller]}
                        kind: {type: string, enum: [PLATFORM_COUNTER, LOCKER, SELLER], description: carrier-gateway pickup location kind}
                        distanceMiles: {type: [number, 'null'], description: Straight-line miles from the delivery address; null when either isn't located}
        addresses: {type: array, items: {$ref: '#/components/schemas/Address'}}
        paymentMethods: {type: array, items: {$ref: '#/components/schemas/PaymentMethod'}}
        subtotalMinor: {type: integer}
        shippingMinor: {type: integer}
        discountMinor: {type: integer, description: Item discount from coupon}
        shippingDiscountMinor: {type: integer, description: Shipping discount from coupon (e.g. free shipping)}
        coupon: {$ref: '#/components/schemas/CheckoutCoupon'}
        taxMinor: {type: integer}
        taxRateLabel: {type: string, examples: ['8.25% TX']}
        totalMinor: {type: integer}
        currency: {type: string}
        sellerCount: {type: integer}
        publishableKey: {type: string, description: Stripe publishable key for Stripe.js (Payment / Express Checkout Elements)}
        crossSell:
          allOf:
            - $ref: '#/components/schemas/Rail'
          description: Optional checkout_cross_sell placement from content (product rail)
        credit:
          allOf:
            - $ref: '#/components/schemas/CheckoutCredit'
          description: What my AfroTransact credit would pay of this order (S320); absent when I have no credit
    CheckoutLocalDelivery:
      type: object
      description: |
        AfroTransact Delivery from the seller's store (S255), quoted for the chosen address: geo road distance from the
        store's pickup location, payments' delivery pricing. Present on AFROTRANSACT_DELIVERY packages only. When
        `available` is false the package can't be delivered to this address: remove it or choose another address.
      required: [available, chargeMinor, roadMiles, durationMinutes, fromCity, unavailableReason, message, maxRadiusMiles, offerIds]
      properties:
        available: {type: boolean}
        chargeMinor: {type: [integer, 'null'], description: The delivery charge (the package's shipping); null when not available or not quoted}
        roadMiles: {type: [number, 'null']}
        durationMinutes: {type: [number, 'null']}
        fromCity: {type: string, examples: ['Houston, TX']}
        unavailableReason:
          type: [string, 'null']
          enum: [OUT_OF_RANGE, UNAVAILABLE, PICKUP_UNAVAILABLE, ADDRESS_NOT_LOCATED, QUOTE_UNAVAILABLE, null]
          description: 'QUOTE_UNAVAILABLE: geo or payments could not answer now; the price is set when you place the order'
        message: {type: [string, 'null'], examples: ["Ama's Market is 31 miles from Houston, TX: too far for AfroTransact Delivery."]}
        maxRadiusMiles: {type: [number, 'null']}
        offerIds: {type: array, items: {type: string}, description: The package's offers (remove them to check out without this package)}
    OrderLocalDelivery:
      type: object
      description: AfroTransact Delivery from the seller's store (S255), as charged at checkout
      required: [roadMiles, durationMinutes, chargeMinor]
      properties:
        roadMiles: {type: [number, 'null']}
        durationMinutes: {type: [number, 'null']}
        chargeMinor: {type: integer}
    Attribution:
      type: object
      description: |
        Last-touch marketing source (`src` = ig | fb | tt | wa | email | sms | app | hero | ribbon | pdp | page, `cr`
        creative or comm slot, `po` window code). Stored on the order and echoed in `orders.order.placed`. Malformed
        values are dropped; without a body value the BFF reads the `at_attr` cookie.
      properties:
        src: {type: string, maxLength: 32, examples: [ig]}
        cr: {type: string, maxLength: 64, examples: [story]}
        po: {type: string, maxLength: 32, examples: [LBK-7]}
    PreorderPlacements:
      type: object
      description: Settings placements (all on by default)
      properties:
        ribbon: {type: boolean}
        hero: {type: boolean}
        badge: {type: boolean}
        pdp: {type: boolean}
        cart: {type: boolean}
        family: {type: boolean}
    PreorderPlace:
      type: object
      required: [country, region, city]
      properties:
        country: {type: string, examples: [US]}
        region: {type: string, examples: [TX]}
        city: {type: string, examples: [Lubbock]}
        source: {type: string, enum: [query, session, default], description: Where the BFF took the place from}
    PreorderCreative:
      type: [object, 'null']
      properties:
        url: {type: string}
        width: {type: integer}
        height: {type: integer}
    PreorderTerms:
      type: object
      description: |
        Money and payment setup of a window, all money in minor units: the window's doorFeeOverride / pickupFeeOverride,
        else the staff delivery fee rules (Settings → Delivery fees: AfroTransact delivery by distance band, pickup fee).
      properties:
        door: {type: boolean}
        pickup: {type: boolean}
        doorFeeMinor: {type: integer, examples: [799]}
        pickupFeeMinor: {type: integer, examples: [0]}
        currency: {type: string, examples: [USD]}
        pickupWindow: {type: string, examples: [10am–2pm]}
        allowedMethods: {type: array, items: {type: string, enum: [CARD, WALLET, ACH]}}
    PreorderWindowCard:
      description: A window as the storefront shows it (no PII); relayed from delivery-runs.
      allOf:
        - {$ref: '#/components/schemas/PreorderTerms'}
        - type: object
          properties:
            id: {type: string}
            code: {type: string, examples: [LBK-7]}
            name: {type: string, examples: ['Lubbock Pre-order #7']}
            ribbon: {type: string}
            headline: {type: string}
            categories: {type: array, items: {type: string}}
            departments: {type: array, items: {type: string}}
            opensAt: {type: string, format: date-time}
            closesAt: {type: string, format: date-time}
            deliversOn: {type: string, format: date}
            timeZone: {type: string, examples: [America/Chicago]}
            showCount: {type: boolean}
            count: {type: [integer, 'null'], description: Paid pre-orders so far; null when hidden or not open yet}
            creatives:
              type: object
              properties:
                hero: {$ref: '#/components/schemas/PreorderCreative'}
                pdp: {$ref: '#/components/schemas/PreorderCreative'}
    PreorderListItem:
      type: object
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        where: {type: string, examples: ['Lubbock, TX']}
        stage: {type: string, enum: [UPCOMING, OPEN]}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        deliversOn: {type: string, format: date}
        timeZone: {type: string}
        place: {$ref: '#/components/schemas/PreorderPlace'}
        zip: {type: [string, 'null']}
        heroUrl: {type: [string, 'null']}
        doorFeeMinor: {type: integer}
        currency: {type: string}
    PreorderResolution:
      type: object
      required: ['on', place, metro, covered, fallback, placements]
      properties:
        place: {$ref: '#/components/schemas/PreorderPlace'}
        metro: {type: boolean, description: Next-day metro city (geo zones) — never pre-order}
        covered: {type: boolean, description: A published window covers the place (even when switched off)}
        'on': {type: boolean, description: 'Window found, master switch on, window active and the area switched on'}
        stage: {type: [string, 'null'], description: 'UPCOMING, OPEN or CLOSED; null without a window'}
        countdownTo: {type: [string, 'null'], description: 'closesAt when open, opensAt when upcoming, the delivery day when closed'}
        window:
          oneOf:
            - {$ref: '#/components/schemas/PreorderWindowCard'}
            - {type: 'null'}
        fallback: {type: string, enum: [SHIP, WAITLIST], description: What the storefront does when `on` is false}
        placements: {$ref: '#/components/schemas/PreorderPlacements'}
        supportPhone: {type: string, description: '"Missed it? Call …"'}
    CartPreorder:
      description: Pre-order block of a PREORDER package (relayed from the cart service), money in minor units.
      allOf:
        - {$ref: '#/components/schemas/PreorderTerms'}
        - type: object
          properties:
            windowId: {type: string, description: 'The window id, or the run id when kind is RUN'}
            kind:
              type: string
              enum: [WINDOW, RUN]
              description: WINDOW, or RUN for a delivery run staff scheduled (S261; closesAt is then its order cutoff)
            minOrders: {type: integer, description: 'RUN: orders the run needs to go ahead'}
            ordersSoFar: {type: integer, description: 'RUN: orders holding a slot now (counts toward the minimum and the capacity)'}
            minimumMet: {type: boolean, description: 'RUN: ordersSoFar has reached minOrders'}
            code: {type: string}
            name: {type: string}
            stage: {type: string, enum: [UPCOMING, OPEN, CLOSED]}
            opensAt: {type: string, format: date-time}
            closesAt: {type: string, format: date-time}
            deliversOn: {type: string, format: date}
            timeZone: {type: string}
            fulfilment: {type: string, enum: [DOOR, PICKUP]}
            feeMinor: {type: integer, description: Fee of the chosen fulfilment}
            feeRule:
              $ref: '#/components/schemas/DeliveryFeeRuleRef'
            options:
              type: array
              items:
                type: object
                required: [fulfilment, feeMinor]
                properties:
                  fulfilment: {type: string, enum: [DOOR, PICKUP]}
                  feeMinor: {type: integer}
                  rule:
                    $ref: '#/components/schemas/DeliveryFeeRuleRef'
    PlaceOrderRequest:
      type: object
      required: [addressId, deliverySelections]
      properties:
        attribution: {$ref: '#/components/schemas/Attribution'}
        addressId: {type: string}
        paymentMethodId: {type: string, description: 'A saved Stripe PaymentMethod id (or a new one from PaymentSheet); omit when paying with a wallet or newPaymentMethod'}
        wallet: {type: string, enum: [apple_pay, google_pay, link]}
        newPaymentMethod:
          type: boolean
          description: Pay with a new method entered in Stripe's Payment Element (deferred-intent flow). Send neither paymentMethodId nor wallet; the storefront calls elements.submit() first, then confirms paymentClientSecret with stripe.confirmPayment({elements})
        savePaymentMethod:
          type: boolean
          description: With newPaymentMethod, save the method on the shopper's Stripe Customer for future purchases (the order's PaymentIntent gets setup_future_usage=off_session, so the Payment Element is created with setupFutureUsage off_session)
        gift: {type: boolean}
        useCredit:
          type: boolean
          description: |
            Pay with my AfroTransact credit first (S320). Credit is spent, up to the order total, when the order is placed
            (once per order, never more than the balance); the card pays only the rest. When credit pays everything
            (`summary.credit.cardDueMinor` is 0) no payment method is needed: send none, the answer has no
            `paymentClientSecret`, and the order is placed without a card (then `POST …/confirm` returns `placed`).
        couponCode:
          type: string
          maxLength: 20
          description: Coupon validated and redeemed by orders with the offers service (released if the order fails or is cancelled); 422 with errors.couponCode when it does not apply
        deliverySelections:
          type: array
          items:
            type: object
            required: [packageId, option]
            properties:
              packageId: {type: string}
              option: {type: string, enum: [carrier, express, afrotransact_delivery, pickup]}
              pickupPointId: {type: string}
              preferences:
                type: object
                properties:
                  handover: {type: string, enum: [hand, door, desk]}
                  safePlace: {type: string}
                  instructions: {type: string, maxLength: 240}
                  contact: {type: string, enum: [text, call, none]}
    CreditEntry:
      type: object
      description: One line of the credit history; the balance is the sum of the lines. The storefront words it from kind and source.
      required: [id, kind, source, amountMinor, currency, balanceAfterMinor, createdAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [GRANT, SPEND, REFUND, ADJUSTMENT]}
        source: {type: string, enum: [REFERRAL, GIFT_CARD, MEMBERSHIP, REFUND, STAFF, PROMO, ORDER]}
        amountMinor: {type: integer, format: int64, description: 'Signed: credit added is positive, credit spent negative'}
        currency: {type: string}
        balanceAfterMinor: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
    CreditAccount:
      type: object
      required: [balanceMinor, currency, entries, nextBefore]
      properties:
        balanceMinor: {type: integer, format: int64}
        currency: {type: string}
        entries: {type: array, items: {$ref: '#/components/schemas/CreditEntry'}}
        nextBefore: {type: [string, 'null'], description: Pass as `before` for older entries; null on the last page}
    CheckoutCredit:
      type: object
      description: What the shopper's credit would pay of this order if used (payments decides when the order is placed)
      required: [availableMinor, appliedMinor, cardDueMinor]
      properties:
        availableMinor: {type: integer, format: int64}
        appliedMinor: {type: integer, format: int64, description: The balance up to the total, leaving at least 0.50 for the card or paying everything}
        cardDueMinor: {type: integer, format: int64, description: What the card pays then; 0 means no payment method is needed}
    CreditRefundChoice:
      type: object
      required: [orderNumber, cardRefundsAsCredit, cardPartMinor, currency]
      properties:
        orderNumber: {type: string}
        cardRefundsAsCredit: {type: boolean}
        cardPartMinor: {type: integer, format: int64, description: What the card paid for the order}
        currency: {type: string}
    GiftCardConfig:
      type: object
      required: [minMinor, maxMinor, currency, presetsMinor, terms, publishableKey]
      properties:
        minMinor: {type: integer, format: int64}
        maxMinor: {type: integer, format: int64}
        currency: {type: string}
        publishableKey: {type: string, description: 'The Stripe publishable key the buy page creates its Payment Element with (cards only)'}
        presetsMinor: {type: array, items: {type: integer, format: int64}}
        terms: {type: object, additionalProperties: {type: string}, description: 'Staff-written terms by language (en, fr, es, ar, yo); empty means the page shows its built-in terms'}
    GiftCard:
      type: object
      description: A gift card as its buyer sees it. The code is never returned; the recipient gets it by email on the send date.
      required: [id, status, amountMinor, currency, recipientEmail, sendAt, deliveryStatus, redeemed, createdAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING_PAYMENT, ACTIVE, REDEEMED, VOID, PAYMENT_FAILED]}
        amountMinor: {type: integer, format: int64}
        currency: {type: string}
        recipientEmail: {type: string}
        recipientName: {type: [string, 'null']}
        senderName: {type: [string, 'null']}
        message: {type: [string, 'null']}
        sendAt: {type: string, format: date-time}
        deliveryStatus: {type: string, enum: [SCHEDULED, SENT]}
        sentAt: {type: [string, 'null'], format: date-time}
        redeemed: {type: boolean}
        createdAt: {type: string, format: date-time}
    GiftCardPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GiftCard'}}
        nextCursor: {type: [string, 'null']}
    GiftCardPurchase:
      allOf:
        - $ref: '#/components/schemas/GiftCard'
        - type: object
          required: [clientSecret, publishableKey]
          properties:
            clientSecret: {type: [string, 'null'], description: Confirm the payment with Stripe Elements; null when it was already paid}
            publishableKey: {type: string}
    GiftCardPurchaseRequest:
      type: object
      required: [amountMinor, recipientEmail]
      properties:
        amountMinor: {type: integer, format: int64, description: Within the staff-set limits (default 10.00 to 500.00)}
        recipientEmail: {type: string, maxLength: 254}
        recipientName: {type: string, maxLength: 120}
        senderName: {type: string, maxLength: 120}
        message: {type: string, maxLength: 500}
        sendAt: {type: string, format: date-time, description: When to email the card; omit to send it now (at most a year ahead)}
        locale: {type: string, enum: [en, fr, es, ar, yo], description: Language of the email}
    GiftCardRedeemRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, maxLength: 64, examples: [ABCD-EFGH-JKLM-2345]}
    GiftCardRedemption:
      type: object
      required: [redeemedMinor, balanceMinor, currency]
      properties:
        redeemedMinor: {type: integer, format: int64}
        balanceMinor: {type: integer, format: int64, description: The credit balance after redeeming}
        currency: {type: string}
    OrderConfirmation:
      type: object
      required: [orderNumber, status, totalMinor, currency, shipments]
      properties:
        orderNumber: {type: string}
        status: {type: string, enum: [placed, awaiting_payment, processing, requires_action], description: 'awaiting_payment: confirm paymentClientSecret with Stripe, then POST …/confirm; processing: poll'}
        paymentClientSecret: {type: [string, 'null'], description: The order's PaymentIntent client secret (always present once orders created it)}
        totalMinor: {type: integer}
        currency: {type: string}
        creditMinor: {type: integer, format: int64, description: The part of the total paid with AfroTransact credit (S320); the card pays the rest}
        preorder:
          type: [object, 'null']
          description: The "You're in" facts when the order holds a pre-order package (relayed from orders)
          properties:
            number: {type: string, examples: [LBK-1042]}
            windowName: {type: string}
            deliversOn: {type: string, format: date}
            closesAt: {type: string, format: date-time}
            timeZone: {type: string}
            otherItemCount: {type: integer, description: Units in the same order that ship now}
        shipments:
          type: array
          items:
            type: object
            required: [shipmentId, label, eta]
            properties:
              shipmentId: {type: string}
              label: {type: string}
              eta: {type: string}
              deliveryCode: {type: [string, 'null'], description: One-time handover code for AfroTransact Delivery}
    Job:
      type: object
      required: [id, title, team, location, type, pay, summary, responsibilities, requirements]
      properties:
        id: {type: string}
        title: {type: string}
        team: {type: string}
        location: {type: string}
        type: {type: string}
        pay: {type: string}
        summary: {type: string}
        responsibilities: {type: array, items: {type: string}}
        requirements: {type: array, items: {type: string}}
    JobApplication:
      type: object
      description: |
        The résumé is uploaded beforehand through the media service; send its asset id as `resumeAssetId` (the content
        service requires it and answers 422 `errors.resumeAssetId` otherwise). `resumeFileName` is the original file
        name, kept for display.
      required: [name, email, linkedin, workAuthorization, consent]
      properties:
        name: {type: string, minLength: 3}
        email: {type: string, format: email}
        linkedin: {type: string, description: Empty or an https://linkedin.com/ URL}
        workAuthorization: {type: string, enum: ['Yes', 'Yes, with sponsorship', 'No']}
        resumeAssetId: {type: string, description: Media-service asset id of the uploaded résumé (PDF)}
        resumeFileName: {type: string, pattern: '\.pdf$'}
        coverNote: {type: string, maxLength: 2000}
        consent: {type: boolean, const: true}
    ApplicationReceipt:
      type: object
      required: [reference, jobId]
      properties:
        reference: {type: string, pattern: '^CAR-\d{6}$', description: Application reference issued by the content service}
        jobId: {type: string}
    PaymentSheetKeys:
      type: object
      required: [customerId, ephemeralKey, publishableKey]
      properties:
        customerId: {type: string}
        ephemeralKey: {type: string}
        publishableKey: {type: string}
    DeliveryProof:
      type: [object, 'null']
      description: |
        How our driver handed the parcel over, shown on a delivered shipment. Null for carrier deliveries (the carrier's
        tracking is the record), pickups and deliveries staff confirmed by hand. The photo and signature links are
        short-lived (about 5 minutes): read the order again for fresh ones. The driver's GPS position is for staff only.
      required: [method, recipientName, relationship, safePlace, photoUrl, signatureUrl, at]
      properties:
        method: {type: string, enum: [CUSTOMER, SOMEONE_ELSE, SAFE_PLACE], description: 'To the customer (who gave their code), to someone else (name, relationship, signature), or left in a safe place'}
        recipientName: {type: [string, 'null']}
        relationship: {type: [string, 'null']}
        safePlace: {type: [string, 'null']}
        photoUrl: {type: [string, 'null'], format: uri, description: Proof photo; null when none or it cannot be shown right now}
        signatureUrl: {type: [string, 'null'], format: uri, description: Recipient's signature (someone-else handovers)}
        at: {type: string, format: date-time, description: When it was delivered}
    TimelineEvent:
      type: object
      required: [status, label, at]
      properties:
        status: {type: string}
        label: {type: string}
        at: {type: string}
    OrderLineView:
      type: object
      required: [lineId, atin, title, imageUrl, quantity, unitPriceMinor, itemsMinor]
      properties:
        lineId: {type: string}
        atin: {type: string}
        title: {type: string}
        imageUrl: {type: [string, 'null']}
        quantity: {type: integer}
        unitPriceMinor: {type: integer}
        itemsMinor: {type: integer}
        refundedMinor: {type: integer, description: 'Refunded on this line so far (returns, cancellations, claims)'}
    OrderPayment:
      type: object
      description: What was charged and refunded (payments); shippingTaxMinor is the part of the tax charged on delivery
      required: [status, capturedMinor, refundedMinor, refundableMinor, shippingTaxMinor, creditMinor, cardRefundsAsCredit]
      properties:
        status: {type: string}
        capturedMinor: {type: integer}
        refundedMinor: {type: integer}
        refundableMinor: {type: integer}
        shippingTaxMinor: {type: integer}
        creditMinor: {type: integer, format: int64, description: The part of the order paid with AfroTransact credit (S320); the card paid the rest}
        cardRefundsAsCredit: {type: boolean, description: The card part of this order's refunds comes back as credit (the shopper's one-way choice)}
    OrderDetail:
      type: object
      required: [orderNumber, placedAt, status, currency, itemsMinor, shippingMinor, taxMinor, discountMinor, totalMinor, shipTo, shippingAddress, shipments]
      properties:
        orderNumber: {type: string}
        placedAt: {type: string}
        status: {type: string}
        currency: {type: string}
        itemsMinor: {type: integer}
        shippingMinor: {type: integer}
        taxMinor: {type: integer}
        discountMinor: {type: integer}
        totalMinor: {type: integer}
        shipTo: {type: string}
        shippingAddress:
          type: [object, 'null']
          required: [name, line1, line2, city, state, zip]
          properties:
            name: {type: string}
            line1: {type: string}
            line2: {type: string}
            city: {type: string}
            state: {type: string}
            zip: {type: string}
        shipments:
          type: array
          items:
            type: object
            required: [shipmentId, label, status, statusLabel, items, sellerName, deliveryMethod, cancellable, carrier, trackingNumber, promisedFrom, promisedBy, deliveredAt, deliveryCode, lines, timeline]
            properties:
              shipmentId: {type: string}
              label: {type: string}
              status: {type: string, description: 'placed, confirmed, packed, ready, picked_up, in_transit, out_for_delivery, delivered, delivery_failed, returned, cancelled'}
              statusLabel: {type: string}
              items: {type: string}
              sellerName: {type: string}
              deliveryMethod: {type: string, enum: [carrier, express, afrotransact_delivery, pickup]}
              cancellable: {type: boolean, description: 'Cancel is offered: before the parcel is packed and inside the cancellation window'}
              cancellableUntil: {type: [string, 'null'], format: date-time, description: 'When Cancel stops being offered (the window''s end); null when it is not offered now'}
              carrier: {type: [string, 'null']}
              trackingNumber: {type: [string, 'null']}
              promisedFrom: {type: [string, 'null']}
              promisedBy: {type: [string, 'null']}
              deliveredAt: {type: [string, 'null']}
              proof: {$ref: '#/components/schemas/DeliveryProof'}
              deliveryCode: {type: [string, 'null'], description: One-time handover code (hand delivery or perishables)}
              lines: {type: array, items: {$ref: '#/components/schemas/OrderLineView'}}
              timeline: {type: array, items: {$ref: '#/components/schemas/TimelineEvent'}}
              returnable: {type: boolean, description: A return can be started (show "Return items")}
              returnWindowEndsAt: {type: [string, 'null'], format: date-time}
              problemReportOnly: {type: boolean, description: Only "Report a problem" is possible}
              localDelivery:
                oneOf: [{$ref: '#/components/schemas/OrderLocalDelivery'}, {type: 'null'}]
                description: AfroTransact Delivery from the seller's store (S255); null for other shipments
              deliveryFeeRule:
                description: |
                  The delivery fee rule the shipping was charged by, as it was when the order was placed (ADR 0005 §3):
                  later edits of the rule never change it. Null for flat rates and for AfroTransact Delivery from a
                  seller's store (see localDelivery).
                oneOf: [{$ref: '#/components/schemas/DeliveryFeeRuleRef'}, {type: 'null'}]
              pickup:
                description: Where a pickup shipment is collected (carrier-gateway pickup location); null for other shipments
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [id, name, address, hours, ready, setBy]
                    properties:
                      id: {type: string}
                      name: {type: string}
                      address: {type: string}
                      hours: {type: string}
                      ready: {type: string}
                      setBy: {type: string, enum: [platform, seller]}
        payment: {$ref: '#/components/schemas/OrderPayment'}
    OrderTracking:
      type: object
      required: [orderNumber, placedAt, totalMinor, currency, shipments]
      properties:
        orderNumber: {type: string}
        placedAt: {type: string}
        totalMinor: {type: integer}
        currency: {type: string}
        shipments:
          type: array
          items:
            type: object
            required: [shipmentId, label, status, eta, method, handover, perishable, deliveryCode, driver, carrier, trackingNumber, items, timeline]
            properties:
              shipmentId: {type: string}
              label: {type: string}
              status: {type: string}
              eta: {type: [string, 'null']}
              method: {type: string, enum: [carrier, express, afrotransact_delivery, pickup]}
              handover: {type: [string, 'null'], enum: [hand, door, desk, null]}
              perishable: {type: boolean}
              deliveryCode: {type: [string, 'null']}
              driver:
                type: [object, 'null']
                required: [name, initials]
                properties:
                  name: {type: string}
                  initials: {type: string}
              carrier: {type: [string, 'null']}
              trackingNumber: {type: [string, 'null']}
              items:
                type: array
                items:
                  type: object
                  required: [atin, title, quantity, priceMinor, returnable]
                  properties:
                    atin: {type: string}
                    title: {type: string}
                    quantity: {type: integer}
                    priceMinor: {type: integer}
                    returnable: {type: boolean}
              timeline: {type: array, items: {$ref: '#/components/schemas/TimelineEvent'}}
    ReturnReason:
      type: string
      enum: [DAMAGED, DEFECTIVE, WRONG_ITEM, NOT_AS_DESCRIBED, MISSING_PARTS, EXPIRED_OR_SPOILED, ARRIVED_LATE, NO_LONGER_NEEDED, ORDERED_BY_MISTAKE, BETTER_PRICE_AVAILABLE]
      description: 'Seller fault (photos required for the first four): DAMAGED, DEFECTIVE, WRONG_ITEM, EXPIRED_OR_SPOILED, NOT_AS_DESCRIBED, MISSING_PARTS, ARRIVED_LATE. No fault: the rest.'
    ReturnMethod:
      type: string
      enum: [DROP_OFF, DRIVER_PICKUP, NO_RETURN]
    StartReturnRequest:
      type: object
      description: |
        One delivered shipment, a method and a reason per line (`shipmentId`, `method`, `lines`). The customer app's
        short form `{orderNumber, atin, reason}` returns one unit of that item with its first allowed method.
        Send an `Idempotency-Key` header to make retries safe (one is derived otherwise).
      required: [orderNumber]
      properties:
        orderNumber: {type: string}
        shipmentId: {type: string}
        method: {$ref: '#/components/schemas/ReturnMethod'}
        lines:
          type: array
          maxItems: 100
          items:
            type: object
            required: [lineId, quantity, reason]
            properties:
              lineId: {type: string}
              quantity: {type: integer, minimum: 1}
              reason: {$ref: '#/components/schemas/ReturnReason'}
              comment: {type: string, maxLength: 500}
        atin: {$ref: '#/components/schemas/Atin'}
        reason: {$ref: '#/components/schemas/ReturnReason'}
    ReturnEligibility:
      type: object
      required: [orderNumber, currency, shipments]
      properties:
        orderNumber: {type: string}
        currency: {type: string}
        shipments:
          type: array
          items:
            type: object
            required: [shipmentId, sellerName, deliveredAt, lines]
            properties:
              shipmentId: {type: string}
              sellerName: {type: string}
              deliveredAt: {type: [string, 'null']}
              lines:
                type: array
                items:
                  type: object
                  required: [lineId, atin, title, quantity, maxQuantity, unitPriceMinor, eligible, reportProblemOnly, sellerFaultOnly, windowEndsAt, methods, ineligibleReason]
                  properties:
                    lineId: {type: string}
                    atin: {type: string}
                    title: {type: string}
                    quantity: {type: integer}
                    maxQuantity: {type: integer}
                    unitPriceMinor: {type: integer}
                    eligible: {type: boolean}
                    reportProblemOnly: {type: boolean, description: 'Food / perishables: report a problem (seller-fault reasons, refund without return)'}
                    sellerFaultOnly: {type: boolean}
                    windowEndsAt: {type: [string, 'null']}
                    methods: {type: array, items: {$ref: '#/components/schemas/ReturnMethod'}}
                    ineligibleReason: {type: [string, 'null']}
    ReturnDetail:
      allOf:
        - $ref: '#/components/schemas/ReturnSummary'
        - type: object
          required: [lines, quote]
          properties:
            lines:
              type: array
              items:
                type: object
                required: [lineId, atin, title, quantity, unitPriceMinor, reason, outcome]
                properties:
                  lineId: {type: string}
                  atin: {type: string}
                  title: {type: string}
                  quantity: {type: integer}
                  unitPriceMinor: {type: integer}
                  reason: {type: string}
                  outcome: {type: [string, 'null']}
            quote:
              type: [object, 'null']
              required: [itemsMinor, shippingMinor, taxMinor, restockingFeeMinor, totalMinor]
              properties:
                itemsMinor: {type: integer}
                shippingMinor: {type: integer}
                taxMinor: {type: integer}
                restockingFeeMinor: {type: integer}
                totalMinor: {type: integer}
    CodeInput:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^\d{6}$'}
    TotpSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: {type: string}
        otpauthUri: {type: string}
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: {type: array, items: {type: string}, description: Shown once; empty when existing codes were kept}
    LinkedAccounts:
      type: object
      required: [accounts, hasPassword]
      properties:
        accounts:
          type: array
          items:
            type: object
            required: [provider, email, canUnlink]
            properties:
              provider: {type: string}
              email: {type: [string, 'null']}
              canUnlink: {type: boolean}
        hasPassword: {type: boolean}
    SecurityOverview:
      type: object
      required: [mfa, passkeys, trustedBrowsers, sessions, devices, linkedAccounts, passkeyRegistrationUrl]
      properties:
        mfa:
          type: object
          required: [totp, sms, smsPhone, recoveryCodesLeft, required, mayDisable, mayRemoveTotp, mayRemoveSms]
          properties:
            totp: {type: boolean}
            sms: {type: boolean}
            smsPhone: {type: [string, 'null']}
            recoveryCodesLeft: {type: integer}
            required: {type: boolean, description: Two-step verification is required at sign-in (always for staff)}
            mayDisable: {type: boolean, description: Two-step verification may be turned off altogether (never for staff)}
            mayRemoveTotp: {type: boolean, description: The authenticator app may be turned off now (staff only while SMS codes stay on)}
            mayRemoveSms: {type: boolean, description: SMS codes may be turned off now (staff only while the authenticator app stays on)}
        passkeys:
          type: array
          items: {$ref: '#/components/schemas/Passkey'}
        trustedBrowsers:
          type: array
          description: Browsers that skip the second factor until expiresAt ("Trust this browser")
          items:
            type: object
            required: [id, label, createdAt, expiresAt]
            properties:
              id: {type: string}
              label: {type: string, description: 'Browser and system from the user agent, e.g. "Chrome on macOS"'}
              createdAt: {type: [string, 'null']}
              expiresAt: {type: [string, 'null']}
        sessions:
          type: array
          items:
            type: object
            required: [id, clientName, signedInAt, lastActiveAt, current]
            properties:
              id: {type: string}
              clientName: {type: string}
              signedInAt: {type: [string, 'null']}
              lastActiveAt: {type: [string, 'null']}
              current: {type: boolean}
        devices:
          type: array
          items:
            type: object
            required: [id, platform, deviceName, lastSeenAt]
            properties:
              id: {type: string}
              platform: {type: string}
              deviceName: {type: string}
              lastSeenAt: {type: [string, 'null']}
        linkedAccounts: {$ref: '#/components/schemas/LinkedAccounts'}
        passkeyRegistrationUrl: {type: string, description: "identity's hosted passkey registration page (/webauthn/register)"}
    Passkey:
      type: object
      required: [credentialId, label, createdAt, lastUsedAt]
      properties:
        credentialId: {type: string}
        label: {type: string}
        createdAt: {type: [string, 'null']}
        lastUsedAt: {type: [string, 'null']}
    SignInEvent:
      type: object
      required: [at, method, outcome, app, device, ip]
      properties:
        at: {type: string, format: date-time}
        method: {type: string, description: 'PASSWORD, MFA_TOTP, MFA_SMS, MFA_RECOVERY_CODE, PASSKEY, LOGIN_TICKET'}
        outcome: {type: string, description: 'SUCCEEDED, FAILED, MFA_REQUIRED, LOCKED, BLOCKED, …'}
        app: {type: string, description: 'Which app signed in, e.g. "AfroTransact web" or "Driver app"'}
        device: {type: string, description: 'Browser and system from the user agent'}
        ip: {type: [string, 'null']}
    AccountProfile:
      type: object
      required: [id, kind, firstName, lastName, email, emailVerified, emailManaged, initials, phone, phoneVerified, jobTitle, memberships, roles]
      properties:
        id: {type: string}
        kind: {type: string, enum: [customer, seller, staff]}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        emailVerified: {type: boolean}
        emailManaged: {type: boolean, description: A company (staff) address managed by AfroTransact IT}
        initials: {type: string}
        phone: {type: [string, 'null'], description: The account's mobile number (E.164)}
        phoneVerified: {type: boolean}
        jobTitle: {type: [string, 'null']}
        memberships:
          type: array
          description: Seller and provider organisations with this person's role (read-only)
          items:
            type: object
            required: [orgId, name, kind, status, roleKey, roleLabel, owner, active]
            properties:
              orgId: {type: string}
              name: {type: string}
              kind: {type: string, enum: [SELLER, PROVIDER, BOTH]}
              status: {type: string}
              roleKey: {type: string}
              roleLabel: {type: string}
              owner: {type: boolean}
              active: {type: boolean, description: The organisation this person currently acts for}
        roles:
          type: array
          description: Platform (staff) roles (read-only)
          items:
            type: object
            required: [key, label]
            properties:
              key: {type: string}
              label: {type: string}
    AccountProfileInput:
      type: object
      properties:
        firstName: {type: string, minLength: 1, maxLength: 80}
        lastName: {type: string, minLength: 1, maxLength: 80}
        phone: {type: string, maxLength: 32}
        jobTitle: {type: [string, 'null'], maxLength: 80}
    AccountPreferences:
      type: object
      required: [locale, timeZone, dateFormat, numberFormat, tableDensity]
      properties:
        locale: {type: [string, 'null'], description: 'BCP 47 tag, e.g. en-US or fr-CA; null = platform default', maxLength: 35}
        timeZone: {type: [string, 'null'], description: 'IANA zone, e.g. America/Chicago; null = market zone', maxLength: 64}
        dateFormat: {type: string, enum: [AUTO, MDY, DMY, YMD]}
        numberFormat: {type: string, enum: [AUTO, COMMA_DOT, DOT_COMMA, SPACE_COMMA]}
        tableDensity: {type: string, enum: [COMFORTABLE, COMPACT]}
    AlertPreference:
      type: object
      required: [topic, channel, enabled, locked]
      properties:
        topic: {type: string, enum: [seller.orders, seller.inventory, seller.payouts, seller.compliance, seller.claims, staff.assigned, staff.escalations, staff.approvals]}
        channel: {type: string, enum: [email, sms]}
        enabled: {type: boolean}
        locked: {type: boolean, description: Always on (the platform must reach you on this channel)}
    QuietHours:
      type: object
      required: [enabled, start, end]
      properties:
        enabled: {type: boolean}
        start: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        end: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
    AlertPreferences:
      type: object
      required: [audience, preferences, quietHours]
      properties:
        audience: {type: string, enum: [seller, staff]}
        preferences: {type: array, items: {$ref: '#/components/schemas/AlertPreference'}}
        quietHours: {$ref: '#/components/schemas/QuietHours'}
    AlertPreferencesInput:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            type: object
            required: [topic, channel, enabled]
            properties:
              topic: {type: string}
              channel: {type: string, enum: [email, sms]}
              enabled: {type: boolean}
        quietHours: {$ref: '#/components/schemas/QuietHours'}
    NotificationPreferences:
      type: object
      required: [email, sms, push, marketingOptIn]
      properties:
        email: {type: boolean}
        sms: {type: boolean}
        push: {type: boolean}
        marketingOptIn: {type: boolean}
    ServicePolicy:
      type: object
      required: [kind, label, text]
      properties:
        kind: {type: string, examples: [FLEXIBLE, MODERATE, STRICT, CUSTOM]}
        label: {type: string}
        text: {type: string}
    ServiceMember:
      type: object
      required: [id, displayName]
      properties:
        id: {type: string}
        displayName: {type: string}
    ServiceMode:
      type: string
      enum: [IN_PERSON, AT_HOME, VIRTUAL]
    ServiceSearch:
      type: object
      required: [zip, city, services]
      properties:
        zip: {type: string}
        city: {type: string}
        services:
          type: array
          items:
            type: object
            required: [serviceId, orgId, name, providerName, description, category, durationMinutes, priceFromMinor, depositMinor, currency, modes, rating, ratingCount, nextAvailable, location]
            properties:
              serviceId: {type: string}
              orgId: {type: string}
              name: {type: string}
              providerName: {type: string}
              description: {type: string}
              category: {type: string}
              durationMinutes: {type: integer}
              priceFromMinor: {type: integer}
              depositMinor: {type: integer}
              currency: {type: string}
              modes: {type: array, items: {$ref: '#/components/schemas/ServiceMode'}}
              rating: {type: number}
              ratingCount: {type: integer}
              nextAvailable: {type: [string, 'null']}
              location: {type: string}
    ServiceDetail:
      type: object
      required: [id, orgId, providerName, name, description, category, durationMinutes, priceMinor, depositMinor, balanceMinor, currency, modes, addOns, policy, instantBooking, team]
      properties:
        id: {type: string}
        orgId: {type: string}
        providerName: {type: string}
        name: {type: string}
        description: {type: string}
        category: {type: string}
        durationMinutes: {type: integer}
        priceMinor: {type: integer}
        depositMinor: {type: integer}
        balanceMinor: {type: integer}
        currency: {type: string}
        modes: {type: array, items: {$ref: '#/components/schemas/ServiceMode'}}
        addOns:
          type: array
          items:
            type: object
            required: [id, name, priceMinor, extraMinutes]
            properties:
              id: {type: string}
              name: {type: string}
              priceMinor: {type: integer}
              extraMinutes: {type: integer}
        policy: {$ref: '#/components/schemas/ServicePolicy'}
        instantBooking: {type: boolean}
        team: {type: array, items: {$ref: '#/components/schemas/ServiceMember'}}
    AvailableDay:
      type: object
      required: [date, slots]
      properties:
        date: {type: string, format: date}
        slots: {type: integer, minimum: 0}
    AvailableSlot:
      type: object
      required: [start, end, memberIds]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        memberIds: {type: array, items: {type: string}}
    BookingQuote:
      type: object
      required: [serviceId, serviceName, providerName, durationMinutes, priceMinor, depositNowMinor, balanceLaterMinor, currency, mode, addOns, policy, policyText, instantBooking, providerAnswersWithinMinutes]
      properties:
        serviceId: {type: string}
        serviceName: {type: string}
        providerName: {type: string}
        durationMinutes: {type: integer}
        priceMinor: {type: integer}
        depositNowMinor: {type: integer}
        balanceLaterMinor: {type: integer}
        currency: {type: string}
        mode: {type: string}
        addOns: {type: array, items: {type: string}}
        policy: {type: string}
        policyText: {type: string}
        instantBooking: {type: boolean}
        providerAnswersWithinMinutes: {type: [integer, 'null']}
    BusinessPage:
      type: object
      required: [slug, kind, name, description, brandColor, logoUrl, contactEmail, indexable, services, products]
      properties:
        slug: {type: string}
        kind: {type: string, enum: [SELLER, PROVIDER]}
        name: {type: string}
        description: {type: [string, 'null']}
        brandColor: {type: [string, 'null'], description: '#rrggbb, or null for the platform colour'}
        logoUrl: {type: [string, 'null']}
        contactEmail: {type: [string, 'null']}
        indexable: {type: boolean, description: False until the business is approved}
        products:
          type: array
          description: A seller's live products (at most twelve, best match first); empty for providers
          items: {$ref: '#/components/schemas/ProductSummary'}
        services:
          type: array
          items:
            type: object
            required: [serviceId, name, durationMinutes, priceMinor, currency]
            properties:
              serviceId: {type: string}
              name: {type: string}
              durationMinutes: {type: integer}
              priceMinor: {type: integer, format: int64}
              currency: {type: string}
    ProviderPage:
      type: object
      required: [orgId, displayName, timeZone, location, policy, instantBooking, team, services]
      properties:
        orgId: {type: string}
        displayName: {type: string}
        timeZone: {type: string}
        location: {type: string}
        policy: {$ref: '#/components/schemas/ServicePolicy'}
        instantBooking: {type: boolean}
        team: {type: array, items: {$ref: '#/components/schemas/ServiceMember'}}
        services: {type: array, items: {$ref: '#/components/schemas/ServiceDetail'}}

    CancellationQuote:
      type: object
      required: [refundSharePercent, depositMinor, refundMinor, keptMinor, releaseHold, policy, explanation, currency]
      properties:
        refundSharePercent: {type: integer}
        depositMinor: {type: integer}
        refundMinor: {type: integer}
        keptMinor: {type: integer}
        releaseHold: {type: boolean, description: The balance hold on the card is released}
        policy: {type: string}
        explanation: {type: string}
        currency: {type: string}
    CustomerBooking:
      type: object
      required: [id, reference, orgId, status, statusLabel, startAt, endAt, proposedStartAt, location, notes, service, policy, payment, canCancel, canReschedule, canReview, awaitingPayment]
      properties:
        id: {type: string}
        reference: {type: string}
        orgId: {type: string}
        status: {type: string, description: 'PENDING_PAYMENT, REQUESTED, CONFIRMED, COMPLETED, NO_SHOW, DECLINED, EXPIRED, RESCHEDULE_REQUESTED, RESCHEDULE_PROPOSED, CANCELLED_CUSTOMER, CANCELLED_PROVIDER'}
        statusLabel: {type: string}
        startAt: {type: string}
        endAt: {type: string}
        proposedStartAt: {type: [string, 'null']}
        location: {type: string}
        notes: {type: string}
        service:
          type: object
          required: [serviceId, name, durationMinutes, priceMinor, depositMinor, balanceMinor, currency, mode, providerName, memberName, addOns]
          properties:
            serviceId: {type: string}
            name: {type: string}
            durationMinutes: {type: integer}
            priceMinor: {type: integer}
            depositMinor: {type: integer}
            balanceMinor: {type: integer}
            currency: {type: string}
            mode: {type: string}
            providerName: {type: string}
            memberName: {type: string}
            addOns: {type: array, items: {type: string}}
        policy: {$ref: '#/components/schemas/ServicePolicy'}
        payment:
          type: object
          required: [state, depositCapturedMinor, refundedMinor, balanceState]
          properties:
            state: {type: string}
            depositCapturedMinor: {type: integer}
            refundedMinor: {type: integer}
            balanceState: {type: string}
        canCancel: {type: boolean}
        canReschedule: {type: boolean}
        canReview: {type: boolean}
        awaitingPayment: {type: boolean}
    BookingRequest:
      type: object
      required: [serviceId, startAt, mode]
      properties:
        serviceId: {type: string}
        memberId: {type: string, description: Preferred team member; empty = anyone free}
        startAt: {type: string, format: date-time, description: A start time from the slots endpoint}
        mode: {$ref: '#/components/schemas/ServiceMode'}
        addOnIds: {type: array, maxItems: 20, items: {type: string}}
        location: {type: string, maxLength: 300, description: Required for home visits}
        notes: {type: string, maxLength: 1000}
    BookingCreated:
      type: object
      required: [booking, payment]
      properties:
        booking: {$ref: '#/components/schemas/CustomerBooking'}
        payment:
          type: [object, 'null']
          description: Present when a deposit must be confirmed with Stripe.js / PaymentSheet
          required: [clientSecret, publishableKey]
          properties:
            clientSecret: {type: string}
            publishableKey: {type: string}
    BookingReview:
      type: object
      required: [bookingId, rating, text]
      properties:
        bookingId: {type: string}
        rating: {type: integer}
        text: {type: string}
    LolaChatRequest:
      type: object
      required: [message]
      properties:
        sessionId: {type: string, pattern: '^[A-Za-z0-9_-]{8,64}$', description: From a previous turn's done event; omit to start a conversation}
        message: {type: string, minLength: 1, maxLength: 4000}
        zip: {type: string, pattern: '^\d{5}$'}
        language: {type: string, maxLength: 16}
    LolaTurn:
      type: object
      required: [role, content, at]
      properties:
        role: {type: string, examples: [user, assistant]}
        content: {type: string}
        at: {type: string}
