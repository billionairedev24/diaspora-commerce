        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/payment-methods/setup-intents:
    post:
      tags: [Account]
      operationId: createSetupIntent
      summary: Stripe SetupIntent client secret for the Payment Element (card, US bank account, Cash App Pay)
