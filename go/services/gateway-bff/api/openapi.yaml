    HelpSection:
      type: object
      required: [heading, body]
      properties:
        heading: {type: string, example: Pickup}
        body: {type: string, description: 'Markdown (paragraphs, `-` lists, **bold**, [links](…)); email addresses become mailto links'}
    HelpArticle:
      type: object
      description: A help page — a title and its sections (Shop design info page)
      required: [slug, topic, topicTitle, title, summary, sections, updatedAt]
      properties:
        slug: {type: string, example: shipping}
        topic: {$ref: '#/components/schemas/HelpTopicKey'}
        topicTitle: {type: string, example: Orders & delivery}
        title: {type: string, example: Shipping & delivery}
        summary: {type: string}
        sections:
          type: array
          items: {$ref: '#/components/schemas/HelpSection'}
        updatedAt: {type: string, format: date-time}
    HelpArticleSummary:
      type: object
      required: [slug, topic, topicTitle, title, summary, updatedAt]
      properties:
        slug: {type: string}
        topic: {$ref: '#/components/schemas/HelpTopicKey'}
        topicTitle: {type: string}
        title: {type: string}
        summary: {type: string}
        updatedAt: {type: string, format: date-time}
    HelpTopicCount:
      type: object
      required: [key, title, count]
