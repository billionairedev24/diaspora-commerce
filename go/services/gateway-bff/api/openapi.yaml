        '401': {$ref: '#/components/responses/Problem'}
        '402': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/checkout/orders/{orderNumber}/confirm:
    post:
      tags: [Checkout]
      operationId: confirmCheckoutPayment
      summary: I confirmed the payment with Stripe.js / PaymentSheet — continue the saga without waiting for the webhook
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: orderNumber, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderConfirmation'}
        '401': {$ref: '#/components/responses/Problem'}
        '402': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/pay-links/{orderNumber}/lookup:
    post:
      tags: [Checkout]
      operationId: lookupPayLink
      summary: The pay-now page of a late pre-order add (no session; the SMS link's signed token is the credential)
      description: >-
        Customer service texts a pay-now link to AfroTransact's own page (/orders/{orderNumber}/pay?token=…); customers
        never get a Stripe-hosted page. While the order awaits payment the answer carries the client secret of its
        existing manual-capture PaymentIntent, which the page confirms with Stripe Elements
        (stripe.confirmPayment, redirect if_required). A paid order is status paid without a client secret; an unknown
        order or a wrong token is 404 PAY_LINK_NOT_FOUND; an expired or voided one is 410 PAY_LINK_EXPIRED.
        Rate-limited per IP.
      parameters:
        - {name: orderNumber, in: path, required: true, schema: {type: string, maxLength: 40}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PayLinkToken'}
      responses:
        '200':
          description: The order and, while awaiting payment, its client secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayLink'}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/pay-links/{orderNumber}/confirm:
    post:
      tags: [Checkout]
      operationId: confirmPayLink
      summary: After stripe.confirmPayment on the pay-now page — place the order once the payment is authorised
      description: >-
        Orders reads the PaymentIntent from Stripe and places the order when it is authorised (idempotent; the
        webhook does the same). Answers like lookup; failureMessage after a decline (the customer may try again on the
        same PaymentIntent until the link expires).
      parameters:
        - {name: orderNumber, in: path, required: true, schema: {type: string, maxLength: 40}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PayLinkToken'}
      responses:
        '200':
          description: awaiting_payment or paid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayLink'}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/services/search:
    get:
      tags: [Services]
      operationId: searchServices
      summary: Services near a ZIP (bookings public search; the deliver-to ZIP when omitted)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: category, in: query, schema: {type: string, maxLength: 60}}
        - {name: zip, in: query, schema: {type: string, pattern: '^\d{5}$'}}
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceSearch'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/services/{serviceId}:
    get:
      tags: [Services]
      operationId: getService
      summary: A bookable service with add-ons, team and cancellation policy
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceDetail'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/services/{serviceId}/days:
    get:
      tags: [Services]
      operationId: getServiceDays
      summary: Days with open slots (live from the provider's hours and bookings)
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 62}}
        - {name: memberId, in: query, schema: {type: string}}
        - {name: addOnIds, in: query, schema: {type: string}, description: Comma-separated add-on ids}
      responses:
        '200':
          description: Days
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days: {type: array, items: {$ref: '#/components/schemas/AvailableDay'}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/services/{serviceId}/slots:
    get:
      tags: [Services]
      operationId: getServiceSlots
      summary: Open start times on a day
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: memberId, in: query, schema: {type: string}}
        - {name: addOnIds, in: query, schema: {type: string}, description: Comma-separated add-on ids}
      responses:
        '200':
          description: Slots
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots: {type: array, items: {$ref: '#/components/schemas/AvailableSlot'}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/services/{serviceId}/summary:
    get:
      tags: [Services]
      operationId: getBookingQuote
      summary: Deposit now, balance later and the cancellation policy for the chosen options
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - {name: addOnIds, in: query, schema: {type: string}, description: Comma-separated add-on ids}
        - {name: mode, in: query, schema: {type: string, enum: [IN_PERSON, AT_HOME, VIRTUAL]}}
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingQuote'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/service-providers/{orgId}:
    get:
      tags: [Services]
      operationId: getProviderPage
      summary: A provider's page — bookings profile and services
      parameters:
        - {name: orgId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Provider
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderPage'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/business-pages/{slug}:
    get:
      tags: [Services]
      operationId: getBusinessPage
      summary: A business's plain public page (what Stripe is given as its website)
      description: Public, read-only. Name, description, logo and one brand colour from the business's application; providers also list their services. `indexable` is false until the business is approved, so search engines are kept off it.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string, maxLength: 80}}
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessPage'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/services/bookings:
    post:
      tags: [Services]
      operationId: bookService
      summary: Book a service; the deposit is held with Stripe (confirm `payment.clientSecret`, then sync the booking)
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookingRequest'}
      responses:
        '201':
          description: Booked (awaiting the deposit)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingCreated'}
        '401': {$ref: '#/components/responses/Problem'}
        '402': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/lola/chat:
    post:
      tags: [Lola]
      operationId: chatWithLola
      summary: One Lola turn as Server-Sent Events, relayed from ai-gateway as it streams
      description: |
        Events in order: `tool_call` {id, tool, label, arguments}, `tool_result` {id, tool, kind, data},
        `action_proposal` {proposal: {id, type: ADD_TO_CART|CHECKOUT|BOOK_SERVICE|START_RETURN, label, payload,
        requiresConfirmation}}, `token` {text} (one per fragment), `handoff` {handoffId, reason, summary}, then `done`
        {sessionId, message, products, proposals, suggestions, …}; a failure mid-stream sends `error` {code, detail}.
        Proposals are never executed by Lola: the client confirms them through the normal BFF routes. The deliver-to
        ZIP and Accept-Language are added when the request omits them. Requires a signed-in customer.
      security: [{sessionCookie: []}, {bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LolaChatRequest'}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/lola/sessions/{sessionId}/messages:
    get:
      tags: [Lola]
      operationId: getLolaHistory
      summary: Stored (redacted) turns of one of my Lola conversations
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Turns
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/LolaTurn'}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/careers/jobs:
    get:
      tags: [Careers]
      operationId: listJobs
      summary: Open roles (careers page)
      security: [{}, {sessionCookie: []}, {bearer: []}]
      responses:
        '200':
          description: Open roles
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
  /v1/careers/uploads:
    post:
      tags: [Careers]
      operationId: requestResumeUpload
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Signed direct upload for a résumé (PDF, at most 5 MB)
      description: |
        Returns a short-lived URL from the media service (private storage). PUT the file there with the given
        headers, then call `…/uploads/{assetId}/complete` and apply with `resumeAssetId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, size]
              properties:
                fileName: {type: string, maxLength: 200}
                contentType: {type: string, enum: [application/pdf]}
                size: {type: integer, format: int64, minimum: 1, maximum: 5242880}
      responses:
        '201':
          description: Upload instructions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResumeUpload'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/careers/uploads/{assetId}/complete:
    post:
      tags: [Careers]
      operationId: completeResumeUpload
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Check the uploaded résumé (real type and size) and finalise it
      parameters:
        - {name: assetId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Résumé ready; use assetId as resumeAssetId
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResumeAsset'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/careers/jobs/{jobId}/applications:
    post:
      tags: [Careers]
      operationId: applyToJob
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Apply for a role (résumé uploaded beforehand through the media service)
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobApplication'}
      responses:
        '201':
          description: Application received
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationReceipt'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: at_session
      description: Opaque BFF session id (HttpOnly, Secure, SameSite=Lax). Tokens stay server-side.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from identity (customer mobile app).
  parameters:
    Atin:
      name: atin
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Atin'}
    LineId:
      name: lineId
      in: path
      required: true
      schema: {type: string}
    SavedId:
      name: savedId
      in: path
      required: true
      schema: {type: string}
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: {type: string}
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: {type: string}
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes retries safe (the same key replays the same result); derived per customer and minute when omitted.
      schema: {type: string, minLength: 16, maxLength: 64}
    ReturnTo:
      name: returnTo
      in: query
      schema: {type: string, default: /}
      description: >-
        Where to return after sign-in: a path on the storefront, or an absolute URL on Seller Center's or the staff
        console's origin (sign-in then completes on that app's own callback). Any other absolute or protocol-relative
        URL is replaced by the storefront home page.
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Validation failed; `errors` maps request properties to messages
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://developers.afrotransact.com/problems/bff.validation-failed
            title: Validation failed
            status: 422
            code: VALIDATION_FAILED
            detail: One or more fields are invalid.
            errors: {email: Enter a valid email address}
    StockProblem:
      description: Requested quantity exceeds available stock (STOCK_LIMIT) or the item is out of stock (OUT_OF_STOCK)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/StockProblem'}
          example:
            type: https://developers.afrotransact.com/problems/bff.stock-limit
            title: Not enough stock
            status: 409
            code: STOCK_LIMIT
            detail: Only 3 available — 3 already in your cart.
            available: 3
            inCart: 3
            requested: 4
            maxQuantity: 3
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Cart:
      description: The updated cart
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Cart'}
    AuthorizeRedirect:
      description: Redirect to identity /oauth2/authorize (authorization code + PKCE S256, state, nonce)
      headers:
        Location: {schema: {type: string}}
  schemas:
    NativeApp:
      type: string
      enum: [customer, driver]
    NativePasswordRequest:
      type: object
      required: [app, email, password, codeChallenge, redirectUri]
      properties:
        app: {$ref: '#/components/schemas/NativeApp'}
        email: {type: string, maxLength: 254}
        password: {type: string, maxLength: 1024}
        trustedDeviceToken: {type: string, description: From an earlier verification with trustDevice=true}
        codeChallenge: {type: string, description: PKCE S256 challenge of the app's verifier, minLength: 43, maxLength: 43}
        redirectUri: {type: string, description: The app's redirect URI registered at identity}
    NativeSmsRequest:
      type: object
      required: [app, challengeId, codeChallenge, redirectUri]
      properties:
        app: {$ref: '#/components/schemas/NativeApp'}
        challengeId: {type: string, format: uuid}
        codeChallenge: {type: string}
        redirectUri: {type: string}
    NativeVerifyRequest:
      type: object
      required: [app, challengeId, factor, code, codeChallenge, redirectUri]
      properties:
        app: {$ref: '#/components/schemas/NativeApp'}
        challengeId: {type: string, format: uuid}
        factor: {type: string, enum: [TOTP, SMS, RECOVERY_CODE]}
        code: {type: string, maxLength: 32}
        trustDevice: {type: boolean, description: Return a trustedDeviceToken so this phone skips the second factor for 30 days}
        codeChallenge: {type: string, minLength: 43, maxLength: 43}
        redirectUri: {type: string}
    NativeSignInResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [MFA_REQUIRED, AUTHENTICATED]}
        challengeId: {type: string, format: uuid, description: MFA_REQUIRED only}
        challengeExpiresAt: {type: string, format: date-time}
        factors:
          type: object
          properties:
            totp: {type: boolean}
            sms: {type: boolean}
            smsHint: {type: string}
            recoveryCode: {type: boolean}
        code: {type: string, description: 'AUTHENTICATED only: authorization code to exchange at identity /oauth2/token with the PKCE verifier'}
        trustedDeviceToken: {type: string}
    PayLinkToken:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 200, description: The token of the SMS pay-now link}
    PayLink:
      type: object
      description: The pay-now page of a late pre-order add (AfroTransact's own page; Stripe Elements)
      required: [orderNumber, status, totalMinor, deliveryFeeMinor, currency, clientSecret, publishableKey, lines]
      properties:
        orderNumber: {type: string}
        status: {type: string, enum: [awaiting_payment, paid]}
        totalMinor: {type: integer, format: int64}
        deliveryFeeMinor: {type: integer, format: int64}
        currency: {type: string}
        clientSecret: {type: [string, 'null'], description: The order's PaymentIntent client secret; null once paid}
        publishableKey: {type: string, description: Stripe publishable key for Stripe.js (empty locally = test form)}
        failureMessage: {type: [string, 'null'], description: The last decline; the customer may try again}
        expiresAt: {type: [string, 'null'], format: date-time}
        windowName: {type: [string, 'null']}
        deliversOn: {type: [string, 'null'], format: date}
        fulfilment: {type: [string, 'null']}
        lines:
          type: array
          items:
            type: object
            required: [title, quantity, totalMinor]
            properties:
              title: {type: string}
              quantity: {type: integer}
              totalMinor: {type: integer, format: int64}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          description: |
            Stable machine code: VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, PRODUCT_NOT_FOUND, OFFER_NOT_FOUND,
            LINE_NOT_FOUND, SAVED_NOT_FOUND, STOCK_LIMIT, OUT_OF_STOCK, INVALID_CREDENTIALS, INVALID_CODE, CHALLENGE_EXPIRED,
            EMAIL_TAKEN, WEAK_PASSWORD, PROVIDER_DISABLED, ZIP_NOT_SERVICEABLE, PAYMENT_DECLINED, IDEMPOTENCY_CONFLICT,
            STOCK_CHANGED, RATE_LIMITED, UPSTREAM_UNAVAILABLE, PHONE_MISSING; AfroTransact Delivery from the seller's store
            (S255, 422 on place order, `errors.deliverySelections` explains it): DELIVERY_OUT_OF_RANGE, DELIVERY_UNAVAILABLE,
            DELIVERY_PICKUP_UNAVAILABLE, DELIVERY_ADDRESS_NOT_LOCATED.
        errors:
          type: object
          additionalProperties: {type: string}
      additionalProperties: true
    StockProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [available, inCart, requested]
          properties:
            available: {type: integer, minimum: 0}
            inCart: {type: integer, minimum: 0}
            requested: {type: integer, minimum: 0}
            maxQuantity: {type: integer, minimum: 0}
    Atin:
      type: string
      pattern: '^AT[0-9A-Z]{8}$'
      description: AfroTransact product identifier (one per product and per variant).
    Fulfilment:
      type: string
      enum: [AFROTRANSACT, SELLER, AFROTRANSACT_DELIVERY]
      description: AFROTRANSACT = "Fulfilled by AfroTransact"; SELLER = "Ships from seller"; AFROTRANSACT_DELIVERY = "AfroTransact
        Delivery from <store city>" (the seller packs, an AfroTransact driver collects at the seller's store and delivers;
        priced by road distance at checkout, S255). The offer's `seller.city` is the store city.
    SellerKind:
      type: string
      enum: [PLATFORM, SELLER]
      description: PLATFORM = sold by AfroTransact Retail (first party); SELLER = independent seller.
    StockStatus:
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
      description: LOW_STOCK when 1–5 units are available.
    PriceBucket:
      type: string
      enum: [u10, 10-25, 25-50, o50]
    SearchSort:
      type: string
      enum: [relevance, price_asc, price_desc, rating, fastest]
      default: relevance
    IdentityProviderId:
      type: string
      enum: [google, apple, facebook]
    DeliveryPromise:
      type: object
      required: [days, label, prefix, free, feeMinor, expressLabel, cutoff]
      properties:
        days: {type: integer, minimum: 0, description: Business days to the deliver-to ZIP (0 = today)}
        label: {type: string, examples: ['Tomorrow, Oct 11']}
        prefix: {type: string, examples: [FREE delivery, Delivery]}
        free: {type: boolean}
        feeMinor: {type: integer}
        expressLabel: {type: [string, 'null']}
        cutoff: {type: [string, 'null'], examples: ['Order within 4 hrs 12 mins.']}
    Seller:
      type: object
      required: [id, name, kind, city]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {$ref: '#/components/schemas/SellerKind'}
        city: {type: string}
    Offer:
      type: object
      required: [offerId, seller, priceMinor, listPriceMinor, currency, fulfilment, availableQty, stockStatus, delivery]
      properties:
        offerId: {type: string, description: offers-service offer id (add it to the cart as offerId)}
        seller: {$ref: '#/components/schemas/Seller'}
        priceMinor: {type: integer}
        listPriceMinor: {type: [integer, 'null']}
        currency: {type: string}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        availableQty: {type: integer, minimum: 0}
        stockStatus: {$ref: '#/components/schemas/StockStatus'}
        delivery: {$ref: '#/components/schemas/DeliveryPromise'}
    ProductSummary:
      type: object
      description: Product card data (search hit, rail item, typeahead product). Superset of the search service Hit.
      required: [atin, title, brand, community, department, unit, rating, reviewCount, imageUrl, offerId, priceMinor, listPriceMinor, currency, sellerName, sellerKind, sellerCity, fulfilment, availableQty, inStock, lowStock, stockStatus, delivery, offerCount, minOfferPriceMinor, sponsor]
      properties:
        atin: {$ref: '#/components/schemas/Atin'}
        title: {type: string}
        brand: {type: string}
        community: {type: string}
        department: {type: string}
        unit: {type: string}
        rating: {type: number, minimum: 0, maximum: 5}
        reviewCount: {type: integer, minimum: 0}
        imageUrl: {type: [string, 'null']}
        offerId: {type: string, description: Buy-box offer}
        priceMinor: {type: integer}
        listPriceMinor: {type: [integer, 'null']}
        currency: {type: string}
        sellerName: {type: string}
        sellerKind: {$ref: '#/components/schemas/SellerKind'}
        sellerCity: {type: string}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        availableQty: {type: integer, minimum: 0}
        inStock: {type: boolean}
        lowStock: {type: boolean}
        stockStatus: {$ref: '#/components/schemas/StockStatus'}
        delivery: {$ref: '#/components/schemas/DeliveryPromise'}
        offerCount: {type: integer, minimum: 1}
        minOfferPriceMinor: {type: integer}
        sponsor:
          type: [object, 'null']
          description: Present on sponsored products — render "Sponsored · {advertiser}" with the reason.
          required: [advertiser]
          properties:
            advertiser: {type: string}
            campaignId: {type: string}
            slot: {type: integer, minimum: 1, description: 1-based position the ad won}
            adToken: {type: string, description: Send back as adToken with POST /v1/search/clicks}
            reason: {$ref: '#/components/schemas/SponsorReason'}
    SponsorReason:
      type: object
      description: Why this ad was shown (no bids or prices are disclosed)
      required: [targeting, matched, qualityScore, auctionRank, competitors, eligibility, summary]
      properties:
        targeting: {type: string, enum: [KEYWORD, CATEGORY]}
        matched: {type: string}
        qualityScore: {type: number, minimum: 0, maximum: 1}
        auctionRank: {type: integer}
        competitors: {type: integer}
        eligibility: {type: array, items: {type: string}}
        summary: {type: string}
    SearchClickRequest:
      type: object
      required: [searchId, atin, position]
      properties:
        searchId: {type: string, maxLength: 200}
        q: {type: string, maxLength: 200}
        atin: {type: string, pattern: '^AT[0-9A-Z]{8}$'}
        position: {type: integer, minimum: 1, maximum: 1000, description: 1-based position on the page}
        adToken: {type: string, maxLength: 4096, description: sponsor.adToken of a sponsored product}
    SearchClickResult:
      type: object
      required: [recorded, duplicate, sponsored]
      properties:
        recorded: {type: boolean}
        duplicate: {type: boolean}
        sponsored: {type: boolean}
        adStatus: {type: string, enum: [BILLABLE, DUPLICATE, EXPIRED]}
    VariantOption:
      type: object
      required: [atin, label, selected, available, priceMinor]
      properties:
        atin: {$ref: '#/components/schemas/Atin'}
        label: {type: string}
        selected: {type: boolean}
        available: {type: boolean}
        priceMinor: {type: integer}
    ProductDetail:
      type: object
      required: [product, buyBox, otherOffers, shipsFrom, soldBy, returnsPolicy, unitPriceLabel]
      properties:
        product:
          type: object
          required: [atin, title, brand, community, department, unit, origin, bullets, rating, reviewCount, images, variants]
          properties:
            atin: {$ref: '#/components/schemas/Atin'}
            title: {type: string}
            brand: {type: string}
            community: {type: string}
            department: {type: string}
            unit: {type: string}
            origin: {type: string}
            bullets: {type: array, items: {type: string}}
            rating: {type: number}
            reviewCount: {type: integer}
            images:
              type: array
              items:
                type: object
                required: [url, alt]
                properties:
                  url: {type: [string, 'null']}
                  alt: {type: string}
            variants: {type: array, items: {$ref: '#/components/schemas/VariantOption'}}
        buyBox:
          description: Winning offer, or null when the product is currently unavailable
          oneOf:
            - $ref: '#/components/schemas/Offer'
            - type: 'null'
        otherOffers: {type: array, items: {$ref: '#/components/schemas/Offer'}}
        shipsFrom: {type: string}
        soldBy: {type: string}
        returnsPolicy: {type: string}
        unitPriceLabel: {type: string}
    StockAlertRequest:
      type: object
      properties:
        email: {type: string, format: email}
    StockAlert:
      type: object
      required: [atin, status]
      properties:
        atin: {$ref: '#/components/schemas/Atin'}
        status: {type: string, enum: [subscribed]}
    RunChannel:
      type: string
      enum: [EMAIL, SMS, PUSH, WHATSAPP]
      description: A way to reach a subscriber; each is consented to separately (WhatsApp only from approved templates)
    RunPickupPoint:
      type: [object, 'null']
      additionalProperties: true
      description: Where orders are collected when the drop mode is PICKUP_POINT
    RunLocation:
      type: object
      required: [id, slug, name, market, timeZone, defaultFeeMinor, currency, dropMode]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, examples: [lubbock]}
        name: {type: string, examples: [Lubbock]}
        market: {type: string, examples: [US]}
        state: {type: [string, 'null'], examples: [TX]}
        timeZone: {type: string, examples: [America/Chicago]}
        area: {type: object, additionalProperties: true, description: 'Coverage as delivery-runs keeps it (ZIP list, polygon or radius)'}
        defaultFeeMinor: {type: integer, description: Delivery fee when the run sets none}
        currency: {type: string, examples: [USD]}
        dropMode: {type: string, enum: [DOORSTEP, PICKUP_POINT]}
        pickupPoint: {$ref: '#/components/schemas/RunPickupPoint'}
        whatsappInviteUrl: {type: [string, 'null'], description: The location's WhatsApp community invite}
        socialLinks: {type: object, additionalProperties: {type: string}}
    RunPublic:
      type: object
      required: [runId, locationId, status, windowStart, windowEnd, cutoffAt, feeMinor, currency, acceptingOrders, full]
      description: A delivery run as shoppers see it
      properties:
        runId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        locationSlug: {type: string}
        town: {type: string}
        status: {type: string}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        cutoffAt: {type: string, format: date-time, description: Orders close at this time}
        feeMinor: {type: integer}
        currency: {type: string}
        dropMode: {type: string, enum: [DOORSTEP, PICKUP_POINT]}
        pickupPoint: {$ref: '#/components/schemas/RunPickupPoint'}
        acceptingOrders: {type: boolean}
        ordersLeft: {type: [integer, 'null'], description: 'Orders left (null = not limited)'}
        full: {type: boolean, description: No room left; checkout offers the next run}
        runUrl: {type: string, description: 'Link to the run on the location page, with attribution'}
    RunLocationPage:
      type: object
      required: [location, runs, locationUrl]
      properties:
        location: {$ref: '#/components/schemas/RunLocation'}
        runs: {type: array, items: {$ref: '#/components/schemas/RunPublic'}}
        locationUrl: {type: string, description: The location page URL}
        shareLinks: {type: object, additionalProperties: {type: string}, description: 'Share URLs per channel, each with UTM attribution'}
    RunConsent:
      type: object
      required: [channel, granted]
      description: Consent for one channel with its record
      properties:
        channel: {$ref: '#/components/schemas/RunChannel'}
        granted: {type: boolean}
        consentedAt: {type: [string, 'null'], format: date-time}
        source: {type: [string, 'null'], description: 'Where the consent was given (location-page, account, ...)'}
        withdrawnAt: {type: [string, 'null'], format: date-time}
    RunSubscription:
      type: object
      required: [id, locationId, status, consents]
      properties:
        id: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        status: {type: string, description: 'PENDING_CONFIRMATION, ACTIVE or UNSUBSCRIBED'}
        consents: {type: array, items: {$ref: '#/components/schemas/RunConsent'}}
        createdAt: {type: [string, 'null'], format: date-time}
        confirmedAt: {type: [string, 'null'], format: date-time}
    RunAdvertorial:
      type: object
      required: [id, source, sourceId, headline, ctaLabel, ctaUrl, expiresAt]
      description: An advertorial served to the shopper's place, one variant
      properties:
        id: {type: string, format: uuid}
        source: {type: string, enum: [WINDOW, RUN]}
        sourceId: {type: string, description: The pre-order window or delivery run it promotes}
        variant: {type: string, examples: [A]}
        code: {type: [string, 'null'], description: Window code; null for runs}
        place: {type: [string, 'null'], examples: ['Lubbock, TX']}
        headline: {type: string}
        body: {type: string}
        ctaLabel: {type: string}
        ctaUrl: {type: string, description: 'With UTM and order attribution (src=page&cr=adv-...)'}
        imageUrl: {type: [string, 'null']}
        countdownTarget: {type: [string, 'null'], format: date-time, description: The live countdown counts down to this}
        expiresAt: {type: string, format: date-time}
        deliveryDisplay: {type: [string, 'null']}
        feeDisplay: {type: [string, 'null']}
        featuredProducts:
          type: array
          maxItems: 4
          description: 'Up to four products staff chose; the card links each to its product page (/p/{atin}). The price is not kept: the product page shows today''s.'
          items: {$ref: '#/components/schemas/RunFeaturedProduct'}
    RunFeaturedProduct:
      type: object
      required: [atin, title]
      properties:
        atin: {type: string, examples: [ATSHEA0001]}
        title: {type: string}
        imageUrl: {type: [string, 'null'], description: An https picture}
    RunVisitRequest:
      type: object
      properties:
        runId: {type: string, format: uuid, description: 'The run the visitor was looking at, if any'}
        utmSource: {type: string, maxLength: 80, examples: [whatsapp]}
        utmMedium: {type: string, maxLength: 80, examples: [social]}
        utmCampaign: {type: string, maxLength: 120, examples: [delivery-run-bastrop-tx-20261024]}
    StockAlertItem:
      type: object
      required: [atin, productTitle, status, createdAt, notifiedAt]
      properties:
        atin: {$ref: '#/components/schemas/Atin'}
        productTitle: {type: string}
        status: {type: string, enum: [active, notified], description: notified = the back-in-stock email was sent}
        createdAt: {type: string, format: date-time}
        notifiedAt: {type: [string, 'null'], format: date-time}
    ResumeUpload:
      type: object
      required: [assetId, upload, maxBytes]
      properties:
        assetId: {type: string}
        maxBytes: {type: integer, format: int64}
        upload:
          type: object
          required: [method, url, headers]
          properties:
            method: {type: string}
            url: {type: string}
            headers: {type: object, additionalProperties: {type: string}}
            expiresAt: {type: [string, 'null'], format: date-time}
    ResumeAsset:
      type: object
      required: [assetId, contentType, bytes, status]
      properties:
        assetId: {type: string}
        contentType: {type: string}
        bytes: {type: integer, format: int64}
        status: {type: string, enum: [READY]}
    FacetBucket:
      type: object
      required: [value, label, count]
      properties:
        value: {type: string}
        label: {type: string}
        count: {type: integer, minimum: 0}
    SearchPage:
      type: object
      required: [hits, total, page, size, pageCount, facets, deliverToLabel, tookMs, services]
      properties:
        hits: {type: array, items: {$ref: '#/components/schemas/ProductSummary'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
        pageCount: {type: integer}
        facets:
          type: object
          required: [department, community, fulfilment, sellerKind, rating, price, delivery]
          properties:
            department: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}}
            community: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}}
            fulfilment: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}}
            sellerKind: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}}
            rating: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}}
            price: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}}
            delivery: {type: array, items: {$ref: '#/components/schemas/FacetBucket'}}
        deliverToLabel: {type: string}
        tookMs: {type: integer}
        services:
          type: array
          description: Services matching the typed words (first page of a text search only; at most four, best match first)
          items:
            type: object
            required: [serviceId, orgId, name, providerName, category, durationMinutes, priceFromMinor, currency, location]
            properties:
              serviceId: {type: string}
              orgId: {type: string}
              name: {type: string}
              providerName: {type: string}
              category: {type: string}
              durationMinutes: {type: integer}
              priceFromMinor: {type: integer, format: int64}
              currency: {type: string}
              location: {type: string}
        searchId: {type: string, description: Identifies this search for click reporting (POST /v1/search/clicks)}
    Suggestions:
      type: object
      required: [query, phrases, products]
      properties:
        query: {type: string}
        phrases:
          type: array
          description: Completed phrases; the first may be scoped to the top product's department.
          items:
            type: object
            required: [text, department]
            properties:
              text: {type: string}
              department: {type: [string, 'null']}
        products: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/ProductSummary'}}
    CartLine:
      type: object
      required: [lineId, atin, offerId, title, unit, department, imageUrl, priceMinor, lineTotalMinor, quantity, maxQuantity, availableQty, stockStatus, selected]
      properties:
        lineId: {type: string}
        atin: {$ref: '#/components/schemas/Atin'}
        offerId: {type: string}
        title: {type: string}
        unit: {type: string}
        department: {type: string}
        imageUrl: {type: [string, 'null']}
        priceMinor: {type: integer}
        lineTotalMinor: {type: integer}
        quantity: {type: integer, minimum: 1}
        maxQuantity: {type: integer, minimum: 0, description: 'min(available stock, 99)'}
        availableQty: {type: integer, minimum: 0}
        stockStatus: {$ref: '#/components/schemas/StockStatus'}
        selected: {type: boolean}
        perishable: {type: boolean, description: 'Catalog product type or attribute perishable: hand delivery with a code, no safe place'}
        productType: {type: string, description: 'Catalog product type code for sales-tax category mapping'}
    DeliveryOption:
      type: object
      required: [key, label, eta, feeMinor, free]
      properties:
        key: {type: string, enum: [carrier, express, afrotransact_delivery, pickup]}
        label: {type: string}
        eta: {type: string}
        feeMinor: {type: integer}
        free: {type: boolean}
        earliestDate: {type: string, format: date, description: Checkout only — promise service date range}
        latestDate: {type: string, format: date}
        cutoffLabel: {type: string, examples: [Order within 3 h 12 min]}
        feeRule:
          $ref: '#/components/schemas/DeliveryFeeRuleRef'
    DeliveryFeeRuleRef:
      type: object
      description: |
        The staff delivery fee rule behind a fee (ADR 0005 §3, staff manage them under Settings → Delivery fees): the
        delivery method, the rule and its version, the amount and where it came from. The cart and checkout show it next
        to the fee; the order keeps the rule it was charged by, so later edits never change it.
      required: [method, ruleVersion, amountMinor]
      properties:
        method: {type: string, enum: [AFROTRANSACT_DELIVERY, CARRIER, PICKUP]}
        ruleId: {type: string}
        ruleVersion: {type: integer}
        currency: {type: string}
        amountMinor: {type: integer}
        source: {type: string, enum: [RULE, WINDOW_OVERRIDE, CARRIER_QUOTE, CARRIER_FALLBACK]}
        band: {type: string, examples: ['10–40 mi']}
        distanceMiles: {type: number}
    CartPackage:
      type: object
      required: [packageId, seller, fulfilment, heading, shipsFrom, delivery, deliveryOptions, lines, itemCount, subtotalMinor, freeShippingNudge]
      properties:
        packageId: {type: string, description: '{sellerId}:{fulfilment}'}
        seller: {$ref: '#/components/schemas/Seller'}
        fulfilment: {$ref: '#/components/schemas/Fulfilment'}
        heading: {type: string}
        shipsFrom: {type: string}
        delivery: {$ref: '#/components/schemas/DeliveryPromise'}
        deliveryOptions: {type: array, items: {$ref: '#/components/schemas/DeliveryOption'}}
        lines: {type: array, items: {$ref: '#/components/schemas/CartLine'}}
        itemCount: {type: integer}
        subtotalMinor: {type: integer}
        freeShippingNudge:
          type: [object, 'null']
          required: [remainingMinor, thresholdMinor]
          properties:
            remainingMinor: {type: integer}
            thresholdMinor: {type: integer}
        preorder:
          description: Pre-order block (packageId ends in `:preorder`); null for packages that ship now
          oneOf:
            - {$ref: '#/components/schemas/CartPreorder'}
            - {type: 'null'}
    SavedItem:
      type: object
      required: [savedId, atin, offerId, title, imageUrl, priceMinor, available]
      properties:
        savedId: {type: string}
        atin: {$ref: '#/components/schemas/Atin'}
        offerId: {type: string}
        title: {type: string}
        imageUrl: {type: [string, 'null']}
        priceMinor: {type: integer}
        available: {type: boolean}
    Cart:
      type: object
      required: [cartId, currency, packages, saved, itemCount, selectedCount, subtotalMinor, allSelected, sellerCount]
      properties:
        cartId: {type: string}
        currency: {type: string}
        packages: {type: array, items: {$ref: '#/components/schemas/CartPackage'}}
        saved: {type: array, items: {$ref: '#/components/schemas/SavedItem'}}
        itemCount: {type: integer}
        selectedCount: {type: integer}
        subtotalMinor: {type: integer}
        allSelected: {type: boolean}
        sellerCount: {type: integer}
    AddToCartRequest:
      type: object
      required: [offerId, quantity]
      properties:
        offerId: {type: string, description: "The offers-service offer id (buy box or Other sellers; validated as buyable), or a product / variant ATIN when offers has none"}
        quantity: {type: integer, minimum: 1, maximum: 99}
    UpdateCartLineRequest:
      type: object
      minProperties: 1
      properties:
        quantity: {type: integer, minimum: 1, maximum: 99}
        selected: {type: boolean}
    Tone:
      type: string
      enum: [ink, gold, green, sand]
    Announcement:
      type: object
      required: [id, tone, icon, text, cta, href]
      properties:
        id: {type: string}
        tone: {$ref: '#/components/schemas/Tone'}
        icon: {type: string}
        text: {type: string}
        cta: {type: string}
        href: {type: string}
    HeroSlide:
      type: object
      required: [id, theme, kicker, title, sub, cta, href, label, imageUrl]
      properties:
        id: {type: string}
        theme: {$ref: '#/components/schemas/Tone'}
        kicker: {type: string}
        title: {type: string}
        sub: {type: string}
        cta: {type: string}
        href: {type: string}
        label: {type: string, description: '"AfroTransact" or "Sponsored"'}
        imageUrl: {type: [string, 'null']}
    Tile:
      type: object
      required: [id, title, cta, href, cells]
      properties:
        id: {type: string}
        title: {type: string}
        cta: {type: string}
        href: {type: string}
        cells:
          type: array
          maxItems: 4
          items:
            type: object
            required: [label, href, imageUrl]
            properties:
              label: {type: string}
              href: {type: string}
              imageUrl: {type: [string, 'null']}
    Banner:
      type: object
      required: [id, slot, advertiser, title, sub, cta, href, imageUrl]
      properties:
        id: {type: string}
        slot: {type: string}
        advertiser: {type: string}
        title: {type: string}
        sub: {type: string}
        cta: {type: string}
        href: {type: string}
        imageUrl: {type: [string, 'null']}
    Rail:
      type: object
      required: [id, title, href, items]
      properties:
        id: {type: string}
        title: {type: string}
        href: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/ProductSummary'}}
    Home:
      type: object
      required: [announcements, hero, tiles, banners, rails, deliverTo]
      properties:
        announcements: {type: array, items: {$ref: '#/components/schemas/Announcement'}}
        hero: {type: array, items: {$ref: '#/components/schemas/HeroSlide'}}
        tiles: {type: array, items: {$ref: '#/components/schemas/Tile'}}
        banners: {type: array, items: {$ref: '#/components/schemas/Banner'}}
        rails: {type: array, items: {$ref: '#/components/schemas/Rail'}}
        deliverTo: {$ref: '#/components/schemas/DeliveryLocation'}
    DeliveryLocation:
      type: object
      required: [zip, city, state, label, serviceable]
      properties:
        zip: {type: string}
        city: {type: string}
        state: {type: string}
        label: {type: string, examples: [Houston 77042]}
        serviceable: {type: boolean}
    PostalAddress:
      type: object
      required: [line1, line2, city, state, zip, country, lat, lon]
      properties:
        line1: {type: string}
        line2: {type: string}
        city: {type: string}
        state: {type: string}
        zip: {type: string}
        country: {type: string}
        lat: {type: [number, 'null']}
        lon: {type: [number, 'null']}
    AddressSuggestions:
      type: object
      required: [suggestions, attribution, sessionToken]
      properties:
        suggestions:
          type: array
          items:
            type: object
            required: [id, label, secondary, address, source, resolved]
            properties:
              id: {type: string}
              label: {type: string}
              secondary: {type: string}
              address: {$ref: '#/components/schemas/PostalAddress'}
              source: {type: string, enum: [google, osm, fixture]}
              resolved: {type: boolean, description: 'false: `address` holds the street line only; resolve the suggestion when picked'}
        attribution: {type: string, description: Required attribution text (e.g. © OpenStreetMap contributors)}
        sessionToken: {type: string, description: Autocomplete session of this address entry (Google Places billing)}
    MaintenanceStatus:
      type: object
      required: [active]
      properties:
        active: {type: boolean}
        scope: {type: string, enum: [SHOPPERS, ALL], description: SHOPPERS pauses the storefront and apps; ALL also pauses Seller Center.}
        title: {type: string}
        message: {type: string, description: What customers are told.}
        expectedBackAt: {type: string, format: date-time, description: Omitted when unknown or already past.}
    SiteConfig:
      type: object
      required: [revision, socials, contacts, legal, identityProviders, locales, market, appLinks, paymentMethods, smsProgramName]
      properties:
        revision: {type: integer}
        socials:
          type: array
          description: Enabled social profiles only, in display order.
          items:
            type: object
            required: [network, url, label]
            properties:
              network: {type: string, enum: [tiktok, instagram, facebook, x, youtube, linkedin, whatsapp]}
              url: {type: string, format: uri}
              label: {type: string}
        contacts:
          type: object
          required: [phone, phoneE164, privacyEmail, accessibilityEmail, legalEmail, pressEmail, partnersEmail, address]
          properties:
            phone: {type: string}
            phoneE164: {type: string, description: 'The support phone in E.164 (+18335550199); also the number of the WhatsApp chat button in the storefront and Seller Center. Empty when not set (the button is then hidden).'}
            privacyEmail: {type: string}
            accessibilityEmail: {type: string}
            legalEmail: {type: string}
            pressEmail: {type: string}
            partnersEmail: {type: string}
            address: {type: string}
        legal:
          type: array
          items:
            type: object
            required: [key, title, version, effective, href]
            properties:
              key: {type: string}
              title: {type: string}
