openapi: 3.1.0
info:
  title: Gateway BFF API (storefront & customer app)
  version: v1
  summary: Screen-shaped API for the AfroTransact storefront (web) and customer mobile app.
  description: |
    The gateway BFF (Go, port 8200) composes catalog, offers, inventory, promise, search, cart, content,
    identity, orders and payments into responses shaped for screens. Browsers never talk to the domain
    services directly.

    **Sessions and auth.** Web clients use the HttpOnly, Secure, SameSite=Lax cookie `at_session`, issued by the
    BFF. Tokens from identity (Spring Authorization Server) are kept server-side and relayed to downstream
    services (token relay); the browser never sees them. Sign-in with Google/Apple/Facebook and the hosted login
    use the OAuth 2.1 authorization code flow with PKCE (S256), `state` and `nonce`, started at
    `GET /v1/auth/oidc/{provider}/authorize` and `GET /v1/auth/login`, which redirect to identity's
    `/oauth2/authorize`. Identity's hosted pages are the only place credentials are entered (single sign-on
    across the storefront, Seller Center and the staff console); `POST /v1/auth/sign-out` also ends the identity
    session (RP-initiated logout) and identity then returns the browser to `GET /v1/auth/signed-out/{app}` on the
    app that signed out. Native apps send `Authorization: Bearer <access token>` instead of the cookie.
    Guests get an anonymous session (cart, deliver-to ZIP); on sign-in the guest cart is merged into the
    customer's cart.

    **CSRF.** Unsafe methods (POST, PUT, PATCH, DELETE) require an `Origin` header matching an allowed
    storefront origin; requests with a mismatched or missing Origin and a cookie session are rejected with 403.

    **Errors** are RFC 9457 `application/problem+json` documents with a stable machine `code`. Validation
    failures (422) list per-field messages in `errors` keyed by request property.

    **Money** is always an integer amount in minor units (`*Minor`, cents for USD) plus an ISO 4217 `currency`.

    **Stock rules.** Cart quantities are capped by available stock and by 99 per line. Requests that would
    exceed stock fail with 409 `STOCK_LIMIT` (or `OUT_OF_STOCK` at zero) and report `available`, `inCart`,
    `requested` and `maxQuantity`. Products with 1–5 units left are `LOW_STOCK` ("Only N left — order soon").

    **Localization.** `Accept-Language` selects the response language for labels (delivery dates, facet labels).
    The deliver-to ZIP is part of the session and drives delivery promises everywhere.
  contact:
    name: AfroTransact Platform
    url: https://developers.afrotransact.com
servers:
  - url: http://localhost:8200
    description: local
  - url: https://api.dev.afrotransact.com/bff
    description: dev
  - url: https://api.uat.afrotransact.com/bff
    description: uat
  - url: https://api.afrotransact.com/bff
    description: prod
tags:
  - name: Site
    description: Site configuration, home placements, newsletter
  - name: Legal
    description: |
      Legal & privacy center (content-service): versioned policy pages, the cookie banner configuration and
      auditable consent records (Global Privacy Control and "Do not sell or share" honoured), and privacy requests
      from Your Privacy Choices.
  - name: Help
    description: |
      Help center (content-service): the hub and its pages (shipping & delivery, returns, Fulfilled by AfroTransact,
      advertising, press), edited by site-content staff without a deployment.
  - name: Location
    description: Deliver-to location and address autocomplete
  - name: Search
    description: Search and typeahead (proxy of the search service with delivery promises)
  - name: Catalog
    description: Product detail with buy box, offers and delivery promise
  - name: Cart
    description: Cart split into packages per seller, save for later
  - name: Auth
    description: Session, first-party sign-in/sign-up steps, passkeys and OIDC redirects
  - name: Account
    description: Addresses, payment methods, orders and returns
  - name: Checkout
    description: Checkout summary and order placement
  - name: Credit
    description: |
      AfroTransact credit and gift cards (S320, S321, ADR 0006). Credit is a balance the shopper spends at checkout
      before the card and gets from refunds, gift cards, referrals and staff. It only buys products and services:
      nothing in this API pays it out, refunds it to a card or transfers it. A gift card is bought with the normal
      card payment (Stripe Elements), emailed on a chosen date and redeemed once into the recipient's credit.
  - name: Careers
    description: Open roles and applications
  - name: Services
    description: Services marketplace (bookings) — search by ZIP, provider pages, booking with a deposit, my bookings
  - name: Lola
    description: Lola, the AI shopping assistant (ai-gateway SSE relayed)
  - name: Delivery runs
    description: |
      Delivery runs by location (delivery-runs; S262, S263, ADR 0005). Shoppers see the locations and their pages
      (upcoming runs, WhatsApp community, share links with UTM attribution), subscribe to a location's run alerts
      per channel (email by link with double opt-in, or signed in from Account -> Delivery alerts with consent
      recorded per channel; WhatsApp only from approved templates to opted-in shoppers) and get the location-targeted
      advertorials with a live countdown (views and clicks are counted; orders are attributed with
      `src=page&cr=adv-...`). Every message carries an unsubscribe link (`/delivery-runs/subscriptions/unsubscribe`).
  - name: Pre-orders
    description: |
      Pre-order windows by city (delivery-runs; S270–S275). The storefront resolves the window covering the
      shopper's delivery location (ribbon, hero, badges, PDP, cart), lists open and upcoming windows on
      `/pre-orders`, and offers a waitlist where no pre-order covers the area (fallback `waitlist`). Fees, currency,
      pickup window and allowed payment methods are the effective values from Back office → Pre-orders → Settings
      (payment) and the window's overrides. Links carry `?src=<channel>&po=<CODE>&cr=<slot>`; the storefront keeps
      the last touch in the `at_attr` cookie and checkout sends it as `attribution`.
security:
  - {}
  - sessionCookie: []
  - bearer: []
paths:
  /v1/maintenance:
    get:
      tags: [Site]
      operationId: getMaintenance
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Whether the platform is in maintenance, and what to tell customers
      description: >-
        Always answered, even in maintenance. Web and mobile apps read it to show the maintenance page. While `active`,
        every other customer route (and Seller Center's when `scope` is ALL) answers 503 `MAINTENANCE` with `Retry-After`;
        sign-in and staff routes keep working. Switched in the staff console under Settings → General → Maintenance mode.
      responses:
        '200':
          description: Maintenance status
          headers:
            Cache-Control: {schema: {type: string}, example: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceStatus'}
  /v1/site-config:
    get:
      tags: [Site]
      operationId: getSiteConfig
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Site configuration (social links, contacts, legal versions, identity providers, locales)
      description: Published from Backoffice → Site content & legal; changes need no deployment. Cached with ETag.
      responses:
        '200':
          description: Current configuration
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}, example: 'public, max-age=60, stale-while-revalidate=600'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteConfig'}
        '304': {description: Not modified}
  /v1/home:
    get:
      tags: [Site]
      operationId: getHome
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Home page placements for the session's deliver-to location
      description: Announcement bar, hero carousel, tiles, sponsored banners and product rails. Nothing is hard-coded in clients.
      responses:
        '200':
          description: Placements
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Home'}
  /v1/newsletter/subscriptions:
    post:
      tags: [Site]
      operationId: subscribeNewsletter
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Subscribe to the weekly newsletter (double opt-in)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewsletterRequest'}
      responses:
        '202':
          description: Confirmation email sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NewsletterResponse'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/legal/{key}:
    get:
      tags: [Legal]
      operationId: getLegalDocument
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: A legal document (current version, or an archived one with `version`), placeholders filled in
      description: |
        Keys: conditions-of-use, privacy, cookies, privacy-choices, returns, seller-terms, prohibited-items,
        accessibility, sms-terms. English is binding; other locales fall back to English with
        `translationFallback: true`. Public and cacheable.
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}, example: sms-terms}
        - {name: version, in: query, required: false, schema: {type: string}, description: An archived or the current version, example: '3.1'}
        - {name: locale, in: query, required: false, schema: {type: string, default: en}}
      responses:
        '200':
          description: The document
          headers:
            Cache-Control: {schema: {type: string}, example: 'public, max-age=60'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalPage'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/help/articles:
    get:
      tags: [Help]
      operationId: listHelpArticles
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Published help articles (the hub excluded), by topic and text, a page at a time
      description: Load the next page with `cursor` = the previous page's `nextCursor` (infinite scroll). Public and cacheable.
      parameters:
        - {name: topic, in: query, required: false, schema: {$ref: '#/components/schemas/HelpTopicKey'}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 100}, description: 'Matches titles, summaries and section text'}
        - {name: cursor, in: query, required: false, schema: {type: string}, description: The previous page's nextCursor}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: One page of articles and the topics with published articles
          headers:
            Cache-Control: {schema: {type: string}, example: 'public, max-age=60'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HelpArticlePage'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/help/articles/{slug}:
    get:
      tags: [Help]
      operationId: getHelpArticle
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: A published help page (`help-center` is the hub at /help)
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,59}$'}, example: shipping}
      responses:
        '200':
          description: The page
          headers:
            Cache-Control: {schema: {type: string}, example: 'public, max-age=60'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HelpArticle'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/consent/cookie-policy:
    get:
      tags: [Legal]
      operationId: getCookiePolicy
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Cookie categories and the cookie table (banner, preferences and the Cookie Notice)
      responses:
        '200':
          description: Categories in display order and every cookie we use
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CookiePolicy'}
  /v1/consent/records:
    post:
      tags: [Legal]
      operationId: recordConsent
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Store the visitor's cookie choice (auditable; GPC and "Do not sell or share" force advertising off)
      description: |
        The subject is the signed-in user or the session's anonymous id (never chosen by the client). The browser's
        `Sec-GPC: 1` header is forwarded; required categories are always on.
      parameters:
        - {name: Sec-GPC, in: header, required: false, schema: {type: string, enum: ['1']}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentRequest'}
      responses:
        '201':
          description: Stored decision after normalisation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentRecord'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/privacy/requests:
    post:
      tags: [Legal]
      operationId: submitPrivacyRequest
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Make a privacy request (access, delete, correct, opt out); answered within 45 days
      description: A signed-in customer's account is attached to the request; identity is verified by email.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrivacyRequest'}
      responses:
        '201':
          description: Request received
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyRequestReceipt'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/delivery-location:
    get:
      tags: [Location]
      operationId: getDeliveryLocation
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Current deliver-to location of the session
      responses:
        '200':
          description: Location
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryLocation'}
    put:
      tags: [Location]
      operationId: setDeliveryLocation
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Change the deliver-to location by ZIP or device coordinates (updates every delivery promise)
      description: Coordinates come from "Use my current location" and are reverse-geocoded to a ZIP by the geo service; they are not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [zip]
                  properties:
                    zip: {type: string, pattern: '^\d{5}$'}
                - type: object
                  required: [lat, lon]
                  properties:
                    lat: {type: number, minimum: -90, maximum: 90}
                    lon: {type: number, minimum: -180, maximum: 180}
      responses:
        '200':
          description: Updated location
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryLocation'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/geo/address-suggestions:
    get:
      tags: [Location]
      operationId: suggestAddresses
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Address autocomplete (geo service — Google Places (New) with a key, else OpenStreetMap Nominatim)
      description: >-
        One call per keystroke of an address field. The first answer carries a `sessionToken`; send it with every
        following keystroke of the same address entry and with `GET /v1/geo/address-suggestions/{id}` for the picked
        suggestion, then start a new entry without one (Google Places bills the keystrokes and the Place Details call
        as one session). Google suggestions come back with `resolved: false` (street line only) and are resolved when
        picked; Nominatim and fixture suggestions are resolved already. Suggestions are restricted to `country`, by
        default the market's.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 120}}
        - {name: country, in: query, description: 'ISO 3166-1 alpha-2 country; default: the market''s (US)', schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - {name: sessionToken, in: query, description: Session token of the previous answer of this address entry (omit on the first keystroke), schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,36}$'}}
      responses:
        '200':
          description: Up to 5 suggestions and the session token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AddressSuggestions'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/geo/address-suggestions/{id}:
    get:
      tags: [Location]
      operationId: resolveAddressSuggestion
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Structured address of a picked suggestion (Google Place Details, closing the autocomplete session)
      parameters:
        - {name: id, in: path, required: true, description: 'Suggestion id (g:…, o:…, f:…)', schema: {type: string, maxLength: 512}}
        - {name: sessionToken, in: query, description: The session token of the suggestions, schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,36}$'}}
      responses:
        '200':
          description: Street, unit, city, state, ZIP, country and coordinates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostalAddress'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/search:
    get:
      tags: [Search]
      operationId: search
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Search products with filters, facet counts and delivery promises
      description: |
        Every typed word must match (prefix, synonym or typo tolerance). Facet counts for a dimension are computed
        with every other active filter applied (disjunctive faceting). Sponsored products (S240) take fixed slots
        and carry `sponsor` (advertiser, reason and a click token); a page with ads is `Cache-Control: private,
        no-store`. Report clicks with POST /v1/search/clicks using `searchId`.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: department, in: query, schema: {type: string}}
        - {name: community, in: query, schema: {type: string}}
        - {name: fulfilment, in: query, schema: {$ref: '#/components/schemas/Fulfilment'}}
        - {name: sellerKind, in: query, schema: {$ref: '#/components/schemas/SellerKind'}}
        - {name: minRating, in: query, schema: {type: number, minimum: 0, maximum: 5}}
        - {name: price, in: query, schema: {$ref: '#/components/schemas/PriceBucket'}}
        - {name: maxDays, in: query, schema: {type: integer, minimum: 0}, description: Delivery within N business days to the deliver-to ZIP}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/SearchSort'}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 60, default: 12}}
        - name: ads
          in: query
          schema: {type: boolean, default: true}
          description: Blend sponsored products into the page (results pages). Send false for machine-made queries.
      responses:
        '200':
          description: One page of results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /v1/search/clicks:
    post:
      tags: [Search]
      operationId: recordSearchClick
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Report a click on a search result (organic or sponsored)
      description: >-
        Counted once per search and product; a sponsored click with a valid, unexpired adToken is charged once per
        token. Clients fire and forget (navigation never waits on it).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchClickRequest'}
      responses:
        '202':
          description: Recorded, or recognised as a duplicate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchClickResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/search/suggestions:
    get:
      tags: [Search]
      operationId: suggest
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Typeahead — completed phrases (first scoped to a department) and up to five products
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Suggestions'}
  /v1/products/{atin}:
    get:
      tags: [Catalog]
      operationId: getProduct
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Product detail with buy box, other offers, availability and delivery promise
      parameters:
        - $ref: '#/components/parameters/Atin'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductDetail'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/products/{atin}/stock-alerts:
    post:
      tags: [Catalog]
      operationId: createStockAlert
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: '"Email me when available" for an out-of-stock product'
      description: |
        Arms a back-in-stock alert at the notifications service for the requested variant (the product's first
        variant for a product ATIN), with the shopper's own token: signing in is required (401 for guests). The
        email defaults to the account's; a typed one overrides it. Subscribing again while the alert is active is a
        no-op (still 201).
      parameters:
        - $ref: '#/components/parameters/Atin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StockAlertRequest'}
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockAlert'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/cart:
    get:
      tags: [Cart]
      operationId: getCart
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Current cart (guest or customer), one package per seller and fulfilment method
      responses:
        '200': {$ref: '#/components/responses/Cart'}
  /v1/cart/items:
    post:
      tags: [Cart]
      operationId: addToCart
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Add an offer to the cart (merged into an existing line for the same offer)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddToCartRequest'}
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StockProblem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/cart/items/{lineId}:
    parameters:
      - $ref: '#/components/parameters/LineId'
    patch:
      tags: [Cart]
      operationId: updateCartLine
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Change a line's quantity and/or whether it is selected for checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCartLineRequest'}
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StockProblem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
    delete:
      tags: [Cart]
      operationId: removeCartLine
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Remove a line
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/cart/selection:
    put:
      tags: [Cart]
      operationId: selectAllCartLines
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Select or deselect every line for checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties:
                selected: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/Cart'}
  /v1/cart/items/{lineId}/save-for-later:
    post:
      tags: [Cart]
      operationId: saveForLater
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Move a line to "Saved for later"
      parameters:
        - $ref: '#/components/parameters/LineId'
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/cart/saved/{savedId}/move-to-cart:
    post:
      tags: [Cart]
      operationId: moveToCart
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Move a saved item back to the cart (quantity 1, subject to stock)
      parameters:
        - $ref: '#/components/parameters/SavedId'
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StockProblem'}
  /v1/cart/saved/{savedId}:
    delete:
      tags: [Cart]
      operationId: removeSaved
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Delete a saved item
      parameters:
        - $ref: '#/components/parameters/SavedId'
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Who is signed in (guest sessions return authenticated=false)
      responses:
        '200':
          description: Session principal and account menu counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
  /v1/auth/login:
    get:
      tags: [Auth]
      operationId: startHostedLogin
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Redirect to identity's hosted sign-in (authorization code + PKCE)
      description: |
        Every web app (storefront, Seller Center, staff console) signs in here: credentials, two-step verification,
        passkeys, social sign-in and account creation all happen on identity's hosted pages, so one identity
        session signs the person in to every app (SSO). The callback is the calling app's own
        `<origin>/api/bff/v1/auth/oidc/callback` (the session cookie stays on that app's host), chosen from
        `returnTo`.
      parameters:
        - $ref: '#/components/parameters/ReturnTo'
        - name: prompt
          in: query
          description: OIDC prompt. `create` opens identity's sign-up page ("Create account"); `login` asks to sign in again.
          schema: {type: string, enum: [login, create]}
        - name: login_hint
          in: query
          description: Email to prefill on identity's pages (OIDC login_hint).
          schema: {type: string, format: email, maxLength: 254}
        - name: invitation
          in: query
          description: Organisation invitation token from an invite link; the account created on identity's sign-up page joins the organisation without an email code.
          schema: {type: string, maxLength: 200}
        - name: intent
          in: query
          description: |
            Entry point the person came from (S286). `sell` ("Start selling") and `provide` ("Offer your services")
            brand identity's sign-up page for it ("Create your account to start selling") and add the seller or
            provider applicant role to the account it creates. Other values are dropped.
          schema: {type: string, enum: [sell, provide]}
      responses:
        '302': {$ref: '#/components/responses/AuthorizeRedirect'}
  /v1/auth/oidc/{provider}/authorize:
    get:
      tags: [Auth]
      operationId: startSocialLogin
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Start sign-in with an external identity provider (only providers enabled in site config)
      description: |
        Generates `code_verifier`, `state` and `nonce`, stores them in the session and redirects to
        `{identity}/oauth2/authorize?response_type=code&client_id=gateway-bff&scope=openid%20email%20profile&code_challenge=…&code_challenge_method=S256&state=…&nonce=…&idp_hint={provider}`.
      parameters:
        - name: provider
          in: path
          required: true
          schema: {$ref: '#/components/schemas/IdentityProviderId'}
        - $ref: '#/components/parameters/ReturnTo'
      responses:
        '302': {$ref: '#/components/responses/AuthorizeRedirect'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: completeLogin
      summary: Authorization-code callback — exchanges the code (with the PKCE verifier), creates the session, redirects to returnTo
      security: [{}]
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302':
          description: Signed in; redirect to the original returnTo on the app that started sign-in (or the storefront's /signin?error=… on failure)
          headers:
            Location: {schema: {type: string}}
            Set-Cookie: {schema: {type: string}, description: 'at_session=…; HttpOnly; Secure; SameSite=Lax; Path=/'}
  /v1/auth/native/password:
    post:
      tags: [Auth]
      operationId: nativePasswordSignIn
      security: [{}]
      summary: Sign in inside the customer or driver app with email and password
      description: |
        The native apps show their own sign-in form instead of identity's hosted page. The BFF checks the credentials
        with identity's first-party sign-in API and either asks for a second factor (`MFA_REQUIRED`, continue at
        `/v1/auth/native/mfa/verify`) or redeems the one-time login ticket for the app's own authorization-code + PKCE
        request and returns the authorization `code` (`AUTHENTICATED`). The app exchanges the code with its PKCE
        verifier at identity's `/oauth2/token` and receives its own access and refresh tokens. A wrong password is 401
        `INVALID_CREDENTIALS` (no token was sent, so the app shows it on the form), repeated failures 429 `RATE_LIMITED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativePasswordRequest'}
      responses:
        '200':
          description: Second factor needed, or signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeSignInResult'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /v1/auth/native/mfa/sms:
    post:
      tags: [Auth]
      operationId: nativeSendSmsCode
      security: [{}]
      summary: Text a sign-in code for a second-factor step
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeSmsRequest'}
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sentTo: {type: string, description: Masked phone, example: '•••• 0142'}
                  expiresAt: {type: string, format: date-time}
        '410': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /v1/auth/native/mfa/verify:
    post:
      tags: [Auth]
      operationId: nativeVerifySecondFactor
      security: [{}]
      summary: Verify the second factor and get the authorization code
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NativeVerifyRequest'}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NativeSignInResult'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /v1/auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: End the session (revokes the tokens at identity) and get identity's end-session URL
      description: |
        Clears the `at_session` cookie and revokes the refresh and access tokens. For a web session `redirectTo` is
        identity's RP-initiated logout endpoint (`/connect/logout` with `id_token_hint`, `client_id` and the calling
        app's registered `post_logout_redirect_uri`, `<origin>/api/bff/v1/auth/signed-out/<app>`, chosen from the
        request's `Origin`): navigating there ends the identity session too, so every app is signed out (single
        sign-out), and identity then sends the browser to `GET /v1/auth/signed-out/{app}`. Without an ID token to
        end (the session had already expired) `redirectTo` is that signed-out URL directly. `redirectTo` is null for
        native apps (bearer token).
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignOutRequest'}
      responses:
        '200':
          description: Signed out
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignOutResult'}
  /v1/auth/signed-out/{app}:
    get:
      tags: [Auth]
      operationId: signedOut
      security: [{}]
      summary: Where identity returns the browser after single sign-out (each app's registered post-logout URI)
      description: |
        Registered at identity as the `gateway-bff` client's `post_logout_redirect_uri` for each web app
        (`<app origin>/api/bff/v1/auth/signed-out/<app>`). `state` carries the path the person signed out on
        (from `SignOutRequest.returnTo`).

        - `storefront`: back to that page (or the home page) with `signedOut=1`, where the storefront shows a
          "You're signed out" toast. No sign-in wall.
        - `seller-center`, `staff-console`: straight to that app's own sign-in, i.e. identity's hosted sign-in page
          branded for the app (`prompt=login`, `notice=signed_out`), which returns to the app (that page, or its
          home page) after signing in.
      parameters:
        - name: app
          in: path
          required: true
          schema: {type: string, enum: [storefront, seller-center, staff-console]}
        - name: state
          in: query
          description: The path on the app to come back to (a relative path; anything else is ignored).
          schema: {type: string, maxLength: 2048}
      responses:
        '302':
          description: To the storefront page with `signedOut=1`, or to identity's sign-in for Seller Center and the staff console
          headers:
            Location: {schema: {type: string}}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/account/addresses:
    get:
      tags: [Account]
      operationId: listAddresses
