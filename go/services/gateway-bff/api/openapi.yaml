  /v1/delivery-runs/locations:
    get:
      tags: [Delivery runs]
      operationId: listRunLocations
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Locations with delivery runs (active ones)
      description: delivery-runs `GET /v1/public/locations`. Public data, cached for a minute.
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/RunLocation'}}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/delivery-runs/locations/{slug}:
    get:
      tags: [Delivery runs]
      operationId: getRunLocation
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Location page data (upcoming runs, WhatsApp community link, social and share links)
      description: |
        delivery-runs `GET /v1/public/locations/{slug}`. `shareLinks` and the run links carry UTM attribution
        (`utm_source`, `utm_medium`, `utm_campaign`) so orders and sign-ups can be traced to the channel that shared them.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,79}$'}}
      responses:
        '200':
          description: Location page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunLocationPage'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/delivery-runs/locations/{slug}/visits:
    post:
      tags: [Delivery runs]
      operationId: countRunLocationVisit
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Count a visit that arrived with UTM tags (best effort)
      description: |
        delivery-runs `POST /v1/public/locations/{slug}/visits`. The storefront sends it once per visit to a location page
        or run link whose address has `utm_*` tags, so staff can see visits and sign-ups per source in Pre-orders ->
        Delivery runs. Only the three tags (and the run viewed) are sent: no cookie, address or visitor id. A visit
        without tags is accepted and not counted. The storefront ignores failures.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,79}$'}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunVisitRequest'}
      responses:
        '204': {description: 'Counted, or nothing to count'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/delivery-runs/subscriptions:
    post:
      tags: [Delivery runs]
      operationId: subscribeRunAlerts
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Get run alerts for a location by email (double opt-in)
      description: |
        delivery-runs `POST /v1/public/subscriptions {locationId, email, source}`. Always 202 for a valid email (whether
        or not it was known). Nothing else is sent until the link in the confirmation email is used
        (`POST /v1/delivery-runs/subscriptions/confirm`); only the email channel is consented to this way. A signed-in
        shopper chooses channels from the account screen instead (`POST /v1/account/run-subscriptions`). Rate limited
        like other lookups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, email]
              properties:
                locationId: {type: string, format: uuid}
                email: {type: string, format: email, maxLength: 254}
                source: {type: string, maxLength: 80, description: 'Where the sign-up happened, kept on the consent record (default storefront)', examples: [location-page]}
                utmSource: {type: string, maxLength: 80, description: 'utm_source the visitor arrived with; counted as a sign-up of that source once confirmed', examples: [whatsapp]}
                utmMedium: {type: string, maxLength: 80, examples: [social]}
                utmCampaign: {type: string, maxLength: 120}
      responses:
        '202':
          description: Accepted; the confirmation link is on its way
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [CONFIRMATION_SENT]}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/delivery-runs/subscriptions/confirm:
    post:
      tags: [Delivery runs]
      operationId: confirmRunAlerts
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Confirm an email subscription (token of the confirmation link)
      description: |
        delivery-runs `POST /v1/public/subscriptions/confirm {token}`; the storefront page
        `/delivery-runs/subscriptions/confirm?token=` calls it. Confirming twice is fine; an unknown token is a 422 on
        `token`. Records the email consent. Rate limited like other lookups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSubscription'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/delivery-runs/subscriptions/unsubscribe:
    post:
      tags: [Delivery runs]
      operationId: unsubscribeRunAlerts
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Unsubscribe from a message link (token), per channel or all
      description: |
        delivery-runs `POST /v1/public/subscriptions/unsubscribe {token, channels}`; the storefront page
        `/delivery-runs/subscriptions/unsubscribe?token=` calls it, and every run alert carries such a link. No
        channels withdraws all of them. Withdrawal is recorded with its time on the consent record. Rate limited like
        other lookups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 200}
                channels: {type: array, items: {$ref: '#/components/schemas/RunChannel'}}
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSubscription'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/run-subscriptions:
    get:
      tags: [Account, Delivery runs]
      operationId: listMyRunSubscriptions
      summary: My delivery alerts (per location and channel, with consent records)
      security: [{sessionCookie: []}, {bearer: []}]
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/RunSubscription'}}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Account, Delivery runs]
      operationId: subscribeMyRunAlerts
      summary: Turn on delivery alerts for a location and channels (consent recorded, active at once)
      description: |
        delivery-runs `POST /v1/me/run-subscriptions`. Adds the channels to an existing subscription. SMS and WhatsApp
        also need a verified phone number on the account; WhatsApp messages are only sent from approved templates to
        shoppers who opted in here.
      security: [{sessionCookie: []}, {bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, channels]
              properties:
                locationId: {type: string, format: uuid}
                channels: {type: array, minItems: 1, items: {$ref: '#/components/schemas/RunChannel'}}
                source: {type: string, maxLength: 80, examples: [account]}
                utmSource: {type: string, maxLength: 80, description: utm_source the shopper arrived with (counted as a sign-up), examples: [whatsapp]}
                utmMedium: {type: string, maxLength: 80, examples: [social]}
                utmCampaign: {type: string, maxLength: 120}
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSubscription'}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/run-subscriptions/{locationId}:
    delete:
      tags: [Account, Delivery runs]
      operationId: unsubscribeMyRunAlerts
      summary: Turn off delivery alerts for a location (some channels, or all)
      description: delivery-runs `DELETE /v1/me/run-subscriptions/{locationId}`. No `channel` withdraws all channels.
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: locationId, in: path, required: true, schema: {type: string, format: uuid}}
        - name: channel
          in: query
          schema: {type: array, items: {$ref: '#/components/schemas/RunChannel'}}
          style: form
          explode: true
      responses:
        '200':
          description: Subscription with the withdrawals recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunSubscription'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/delivery-runs/advertorials:
    get:
      tags: [Delivery runs]
      operationId: listRunAdvertorials
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Advertorials for the shopper's deliver-to place (windows and runs that take orders now)
      description: |
        delivery-runs `GET /v1/public/advertorials`. The place is the explicit `zip`, `lat`/`lng` or
        `country`+`region`(+`city`) when given, else the session's delivery location; with no place at all the list is
        empty. One variant per advertorial (the same `visitor` keeps theirs), higher priority first. Each carries the
        countdown target (the close or cutoff) and a link with UTM and order attribution (`src=page&cr=adv-...`); the
        storefront counts a `VIEW` once per visit and a `CLICK` on the button
        (`POST /v1/delivery-runs/advertorials/{advertorialId}/events`) and expires the card at `expiresAt`.
      parameters:
        - {name: zip, in: query, schema: {type: string, pattern: '^[0-9]{5}$'}}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lng, in: query, schema: {type: number}}
        - {name: country, in: query, schema: {type: string, minLength: 2, maxLength: 2}}
        - {name: region, in: query, schema: {type: string, maxLength: 3}}
        - {name: city, in: query, schema: {type: string, maxLength: 80}}
        - {name: visitor, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}, description: 'An anonymous id the storefront keeps per browser, so A/B variants stay stable'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10, default: 3}}
      responses:
        '200':
          description: Advertorials
          headers:
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/RunAdvertorial'}}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/delivery-runs/advertorials/{advertorialId}/events:
    post:
      tags: [Delivery runs]
      operationId: recordRunAdvertorialEvent
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Count a view or a click on an advertorial
      description: |
        delivery-runs `POST /v1/public/advertorials/{id}/events {type}`. Best effort: the storefront sends `VIEW` once
        per visit and `CLICK` on the button, and ignores a failure. Rate limited like other lookups.
      parameters:
        - {name: advertorialId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: {type: string, enum: [VIEW, CLICK]}
      responses:
        '204': {description: Counted}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/credit:
    get:
      tags: [Credit]
      operationId: getAccountCredit
      summary: My credit balance and history, newest first
      description: |
        payments `GET /v1/credit/me` and `/v1/credit/me/entries` with the shopper's token. The balance is the sum of the
        ledger. Each entry has a `kind` (GRANT, SPEND, REFUND, ADJUSTMENT) and a `source` (REFERRAL, GIFT_CARD, MEMBERSHIP,
        REFUND, STAFF, PROMO, ORDER); the storefront words them in the shopper's language. Page backwards with
        `before` = the previous page's `nextBefore`.
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: before, in: query, schema: {type: string, format: date-time}, description: Entries older than this}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Balance and a page of history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreditAccount'}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/orders/{orderNumber}/credit-refunds:
    post:
      tags: [Credit]
      operationId: chooseCreditRefunds
      summary: Take the card part of my order's refunds as credit (one way)
      description: |
        A refund goes back to what paid each part: the part paid with credit comes back as credit and the part paid
        with the card to the card. This chooses credit for the card part of every later refund of the order. It is one
        way: credit never goes back to a card or to cash, and refunds already sent to the card stay there.
        409 `NO_CARD_PORTION` when the order was paid with credit only.
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: orderNumber, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Chosen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreditRefundChoice'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/gift-cards/config:
    get:
      tags: [Credit]
      operationId: getGiftCardConfig
      summary: Gift card amount limits, preset amounts and terms (staff settings)
      description: Default limits are 10.00 to 500.00; gift cards never expire. Staff change them without a release.
      security: [{sessionCookie: []}, {bearer: []}]
      responses:
        '200':
          description: Limits and terms
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GiftCardConfig'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/gift-cards:
    get:
      tags: [Credit]
      operationId: listMyGiftCards
      summary: The gift cards I bought, newest first (never with the code)
      security: [{sessionCookie: []}, {bearer: []}]
      responses:
        '200':
          description: My gift cards
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GiftCardPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Credit]
      operationId: buyGiftCard
      summary: Start buying a gift card; confirm the card payment with the client secret
      description: |
        Requires `Idempotency-Key`. payments creates the card (PENDING_PAYMENT) and a PaymentIntent for it: confirm
        `clientSecret` with Stripe Elements (a card; credit cannot pay for a gift card), then
        `POST /v1/account/gift-cards/{giftCardId}/confirm`. The code is generated and emailed on `sendAt` (now when
        omitted). 422 `errors.amountMinor` when the amount is outside the staff-set limits.
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GiftCardPurchaseRequest'}
      responses:
        '201':
          description: Card created, payment pending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GiftCardPurchase'}
        '401': {$ref: '#/components/responses/Problem'}
        '402': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/gift-cards/{giftCardId}/confirm:
    post:
      tags: [Credit]
      operationId: confirmGiftCard
      summary: After the payment was confirmed, capture it and issue the card
      description: Idempotent; the payments webhook does the same, so either order works.
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: giftCardId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The card (ACTIVE once paid)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GiftCard'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/gift-cards/redeem:
    post:
      tags: [Credit]
      operationId: redeemGiftCard
      summary: Redeem a gift card code into my credit, once
      description: |
        404 `GIFT_CARD_INVALID` for a wrong code; 409 `GIFT_CARD_REDEEMED` when it was redeemed already. Wrong codes
        are counted per shopper and per network address: over the limit the answer is 429 `RATE_LIMITED` with
        `Retry-After`, even for a right code.
      security: [{sessionCookie: []}, {bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GiftCardRedeemRequest'}
      responses:
        '200':
          description: Redeemed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GiftCardRedemption'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/checkout/summary:
    get:
      tags: [Checkout]
      operationId: getCheckoutSummary
      summary: Checkout view of the selected cart lines (addresses, payment methods, per-package delivery options, tax)
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: addressId, in: query, schema: {type: string}}
        - name: packageDelivery
          in: query
          description: |
            Per-package delivery option keys for shipping and estimated tax (repeat the parameter or comma-separate
            entries). Each value is `packageId:optionKey` (for example `pkg_1:ground,pkg_2:pickup`).
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
        - name: couponCode
          in: query
          schema: {type: string, maxLength: 20}
          description: Optional coupon to price against the cart (offers validate; does not redeem until place order).
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutSummary'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StockProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/cart/preorder-fulfilment:
    put:
      tags: [Cart, Pre-orders]
      operationId: setPreorderFulfilment
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Choose door delivery or pickup for the cart's pre-order package of a window
      description: |
        Relayed to the cart service (`PUT /v1/cart/preorder-fulfilment {windowId, fulfilment}`). The fee is the
        window's effective door fee (Back office → Pre-orders → Settings → payment, or the window's override) or the
        pickup fee; only options the window offers (`preorder.options[]`) are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windowId, fulfilment]
              properties:
                windowId: {type: string, maxLength: 64}
                fulfilment: {type: string, enum: [DOOR, PICKUP]}
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/preorders/resolve:
    get:
      tags: [Pre-orders]
      operationId: resolvePreorder
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: The pre-order window covering the shopper's delivery location (or an explicit place)
      description: |
        Without `country`/`region` the BFF uses the session's delivery location (`/v1/delivery-location`: market
        country, state, city); `place.source` says which (`session`, `default` or `query`). delivery-runs
        `GET /v1/public/preorders/resolve` answers: the first OPEN, else UPCOMING, else CLOSED window that covers the
        place, whether pre-order is `on` (master switch, window active, area on; metro cities never), the countdown
        target, creatives, live count and the fallback when off. Cached 30 seconds.
      parameters:
        - {name: country, in: query, schema: {type: string, pattern: '^[A-Za-z]{2}$'}, description: ISO 3166-1 alpha-2 (default the market)}
        - {name: region, in: query, schema: {type: string, maxLength: 3}, description: State / region code}
        - {name: city, in: query, schema: {type: string, maxLength: 80}}
      responses:
        '200':
          description: Resolution
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreorderResolution'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/preorders/open:
    get:
      tags: [Pre-orders]
      operationId: listOpenPreorders
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Open and upcoming windows for the /pre-orders page
      description: delivery-runs `GET /v1/public/preorders/open`. Cached 30 seconds.
      responses:
        '200':
          description: Windows
          content:
            application/json:
              schema:
                type: object
                required: [windows, placements]
                properties:
                  windows: {type: array, items: {$ref: '#/components/schemas/PreorderListItem'}}
                  placements: {$ref: '#/components/schemas/PreorderPlacements'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/preorders/waitlist:
    post:
      tags: [Pre-orders]
      operationId: joinPreorderWaitlist
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Hear when a pre-order opens in an area (email, double opt-in)
      description: |
        delivery-runs `POST /v1/public/subscriptions {email, area, country, region, city, source: preorder-waitlist}`.
        The place defaults to the session's delivery location. Always 202 for a valid email (whether or not it was
        known); notifications sends the confirmation link, then `preorder.waitlist.opened` when a window opens.
        Rate limited like other lookups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
                place: {$ref: '#/components/schemas/PreorderPlace'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [status, city]
                properties:
                  status: {type: string, enum: [subscribed]}
                  city: {type: string, examples: [Lubbock]}
                  area: {type: string, examples: [US/TX/Lubbock]}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/preorders/waitlist/unsubscribe:
    post:
      tags: [Pre-orders]
      operationId: leavePreorderWaitlist
      security: [{}, {sessionCookie: []}, {bearer: []}]
      summary: Leave a pre-order waitlist (token from the waitlist email's unsubscribe link)
      description: |
        delivery-runs `POST /v1/public/preorders/waitlist/unsubscribe {token}` (no sign-in). The storefront page
        `/pre-orders/waitlist/unsubscribe?token=` calls it. Leaving twice is fine (200 again); an unknown token is a 422
        on `token`. Rate limited like other lookups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Off the waitlist
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [unsubscribed]}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/checkout/orders:
    post:
      tags: [Checkout]
      operationId: placeOrder
      summary: Place the order (orders saga — payment authorisation, stock reservation, shipment split)
      description: |
        Requires `Idempotency-Key`. Replaying the same key with the same body returns the original result (201);
        the same key with a different body fails with 409 `IDEMPOTENCY_CONFLICT`. The payment is authorised now
        and captured per shipment when it ships.

        orders `POST /v1/checkout` creates the PaymentIntent and always returns its `paymentClientSecret`
        (`status: awaiting_payment`): confirm it with Stripe.js / PaymentSheet (a saved method, a wallet or a new
        method from PaymentSheet — `paymentMethodId` may be any Stripe PaymentMethod id), then call
        `POST /v1/checkout/orders/{orderNumber}/confirm`. 202 means the saga is still preparing — poll
        `GET /v1/checkout/orders/{orderNumber}`.
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaceOrderRequest'}
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderConfirmation'}
        '202':
          description: Further action required (3-D Secure); confirm with Stripe.js and poll the order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderConfirmation'}
        '401': {$ref: '#/components/responses/Problem'}
        '402': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StockProblem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/payment-methods/{paymentMethodId}/default:
    post:
      tags: [Account]
      operationId: setDefaultPaymentMethod
      summary: Make a saved payment method the default (payments POST /v1/customers/me/payment-methods/{id}/default)
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: paymentMethodId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Now the default
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentMethod'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/payment-sheet:
    post:
      tags: [Account]
      operationId: createPaymentSheetKeys
      summary: Stripe customer id and ephemeral key so PaymentSheet (customer app) can list and reuse saved methods
      description: >-
        payments `POST /v1/customers/me/ephemeral-keys` (planned: payments does not issue ephemeral keys yet, so this
        answers 503 `UPSTREAM_UNAVAILABLE` until it does).
      security: [{sessionCookie: []}, {bearer: []}]
      responses:
        '201':
          description: Keys
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentSheetKeys'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/orders/{orderNumber}:
    get:
      tags: [Account]
      operationId: getOrder
      summary: One of my orders with shipments, lines, tracking numbers, timelines and handover codes
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: orderNumber, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/account/orders/{orderNumber}/tracking:
    get:
      tags: [Account]
      operationId: trackOrder
      summary: Shipment tracking (orders timeline + carrier-gateway scans) — the customer app's tracking screen
      security: [{sessionCookie: []}, {bearer: []}]
      parameters:
        - {name: orderNumber, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Tracking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderTracking'}
