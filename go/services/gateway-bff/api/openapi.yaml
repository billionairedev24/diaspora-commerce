        status: {type: string, enum: [CURRENT, ARCHIVED]}
        draftBanner: {type: boolean, description: 'Show "Draft for legal counsel review" until counsel signs off'}
        locale: {type: string, description: Locale of the body (en when the translation falls back)}
        translationFallback: {type: boolean, description: The requested locale has no reviewed translation; the binding English text is served}
        body: {type: string, description: Markdown}
        outline:
          type: array
          items: {$ref: '#/components/schemas/LegalHeading'}
        versions:
          type: array
