      parameters: [{$ref: '#/components/parameters/PreorderId'}]
      responses:
        '200': {description: Window, headers: {ETag: {description: 'Optimistic-lock version ("<version>"); send it back as If-Match', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
