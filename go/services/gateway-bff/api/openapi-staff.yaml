      type: object
      required: [shipmentId, routeId, routeName, driverId, status]
      properties:
        shipmentId: {type: string}
        routeId: {type: string}
        routeName: {type: [string, 'null']}
        driverId: {type: [string, 'null']}
        status: {type: string, description: The route's status}
    PickupAssignment:
      type: object
      required: [id, shipmentId, routeId, driverId, mode, reason, previousRouteId, straightMiles, roadMiles, distanceMethod, actor, createdAt]
      properties:
        id: {type: string}
        shipmentId: {type: string}
        routeId: {type: string}
        driverId: {type: [string, 'null']}
        mode: {type: string, enum: [AUTO_NEAREST, DISPATCH_OVERRIDE]}
        reason: {type: [string, 'null']}
        previousRouteId: {type: [string, 'null']}
        straightMiles: {type: [number, 'null']}
        roadMiles: {type: [number, 'null']}
        distanceMethod: {type: [string, 'null']}
        actor: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
    PickupAssignmentList:
      type: object
