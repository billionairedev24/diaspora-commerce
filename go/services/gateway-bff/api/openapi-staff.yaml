        pickupEnabled: {type: boolean}
        pickupHours: {type: array, items: {$ref: '#/components/schemas/PickupWindow'}}
        zoneName: {type: [string, 'null']}
    # ── Notifications: templates (S268)
    NotificationChannel: {type: string, enum: [email, sms, push, chat], description: chat is WhatsApp}
