    post:
      tags: [Fees]
      operationId: endNegotiatedRate
      security: [{sessionCookie: []}]
      summary: End a negotiated rate now, with a reason (audited)
      description: payments `POST /v1/negotiated-rates/{id}/end` (payments:configure and EDIT on fees). 409 when it already ended or expired.
      parameters:
        - {name: rateId, in: path, required: true, schema: {type: string, maxLength: 64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NegotiatedRateEnd'}}}
      responses:
        '200': {description: Ended, content: {application/json: {schema: {$ref: '#/components/schemas/NegotiatedRate'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/fees/calculator:
    get:
      tags: [Fees]
      operationId: calculateFeeRate
      security: [{sessionCookie: []}]
      summary: 'Rate calculator: what one organisation pays on one kind and category now, and why'
      description: |
        payments `GET /v1/fee-schedules/effective?kind=` (staff payments:read): kind PRODUCT is the commission, SERVICE the
        connection fee of a service category. The first match wins: an active negotiated rate (category, then `*`), the
        organisation's plan rate (category, then the plan's `*`), the category rate, the default; AfroTransact Retail pays
        none (RETAIL). Needs VIEW on the fees module.
      parameters:
        - {name: orgId, in: query, required: true, schema: {type: string, maxLength: 80}}
        - {name: category, in: query, required: true, schema: {type: string, maxLength: 80}}
        - {name: kind, in: query, schema: {type: string, enum: [PRODUCT, SERVICE], default: PRODUCT}}
      responses:
        '200': {description: Effective rate, content: {application/json: {schema: {$ref: '#/components/schemas/FeeRateQuote'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/fees/orgs/{orgId}/negotiated-plan:
    post:
      tags: [Fees]
      operationId: negotiatePlanPrice
      security: [{sessionCookie: []}]
      summary: Negotiate a plan price for one organisation (private, invite-only plan)
      description: |
        Over the seller service's plan catalogue (plans:manage and EDIT on plans): copies the base plan's kind, features,
        limits and trial into a new INVITE_ONLY plan `<base>_<org>` at the negotiated prices (quarterly and annual default
        to the catalogue's rule), invites the organisation and publishes it. The
        seller then chooses it in Plan & billing; it stays on its current plan until it does. 409 when that private plan
        already exists.
      parameters:
        - {name: orgId, in: path, required: true, schema: {type: string, maxLength: 80}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NegotiatedPlanDraft'}}}
      responses:
        '201': {description: Private plan created and the organisation invited, content: {application/json: {schema: {$ref: '#/components/schemas/NegotiatedPlan'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── dispatch: seller pickups (S255)
  /v1/staff/dispatch/pickups:
    get:
      tags: [Dispatch]
      operationId: listStaffPickups
      security: [{sessionCookie: []}]
      summary: Seller pickups waiting for a route (AfroTransact Delivery from the seller's store)
      description: |
        fulfilment `GET /v1/dispatch/shipments` (delivery:dispatch), keeping the SELLER-origin entries. Pickups already
        routed (auto-assigned to the nearest driver) are not in the pool; open them by shipment id. Needs VIEW on dispatch.
      parameters:
        - {name: nodeId, in: query, schema: {type: string, maxLength: 64}, description: Depot / fulfilment node}
      responses:
        '200': {description: Waiting pickups, content: {application/json: {schema: {$ref: '#/components/schemas/PickupList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/dispatch/pickups/{shipmentId}/driver-suggestions:
    get:
      tags: [Dispatch]
      operationId: getPickupDriverSuggestions
      security: [{sessionCookie: []}]
      summary: Top 5 available drivers for a seller pickup, nearest first
      description: |
        fulfilment `GET /v1/dispatch/pickups/{id}/driver-suggestions`: fresh positions in the pickup's delivery zone,
        access active, an ASSIGNED or IN_PROGRESS route today, vehicle inspection passed, room left; ranked by geo road
        distance (straight line when geo is down — `distanceMethod: STRAIGHT_LINE`, `roadMiles: null`).
      parameters: [{$ref: '#/components/parameters/ShipmentId'}]
      responses:
        '200': {description: Suggestions, content: {application/json: {schema: {$ref: '#/components/schemas/DriverSuggestions'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/dispatch/pickups/{shipmentId}/assign:
    post:
      tags: [Dispatch]
      operationId: assignPickup
