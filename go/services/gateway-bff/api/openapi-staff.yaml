        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cities]
              properties:
                cities:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string, minLength: 1, maxLength: 80}
                      status: {$ref: '#/components/schemas/StaffPlaceStatus'}
      responses:
        '200': {description: Country, content: {application/json: {schema: {$ref: '#/components/schemas/StaffMarketCountry'}}}}
