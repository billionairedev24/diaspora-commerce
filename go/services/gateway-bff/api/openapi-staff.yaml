        createdAt: {type: [string, 'null'], format: date-time}
    StaffBillingInvoice:
      type: object
      description: >-
        A plan invoice AfroTransact issued. Settled in this order: platform credit (coupons are already off the
        invoice), the seller's sales if they chose that, then the saved card or bank account.
      required: [id, subtotalCents, discountCents, amountDueCents, amountPaidCents, currency, createdAt, paidFromCreditCents, paidFromSalesCents, paidByCardCents, waivedCents]
      properties:
        id: {type: string}
        number: {type: [string, 'null']}
        periodStart: {type: [string, 'null'], format: date-time}
        periodEnd: {type: [string, 'null'], format: date-time}
        subtotalCents: {type: integer, format: int64}
        discountCents: {type: integer, format: int64}
        amountDueCents: {type: integer, format: int64}
        amountPaidCents: {type: integer, format: int64}
        currency: {type: string}
        status: {type: [string, 'null'], enum: [open, paid, void, uncollectible, null]}
        billingReason: {type: [string, 'null']}
        planCode: {type: [string, 'null']}
        attempts: {type: integer}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        lastError: {type: [string, 'null']}
        paidAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        lines: {type: array, items: {$ref: '#/components/schemas/StaffBillingInvoiceLine'}}
        payments: {type: array, items: {$ref: '#/components/schemas/StaffBillingInvoicePayment'}}
        paidFromCreditCents: {type: integer, format: int64}
        paidFromSalesCents: {type: integer, format: int64, description: 'Withheld from the organisation''s sales (S298), only if it chose that'}
