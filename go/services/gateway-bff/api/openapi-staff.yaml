      properties:
        invoiceId: {type: string}
        invoiceNumber: {type: [string, 'null']}
        invoiceAmountCents: {type: [integer, 'null'], format: int64, description: The invoice amount when it was issued}
        amountCents: {type: integer, format: int64, description: Asked from earnings (the invoice less the credit balance)}
        withheldCents: {type: integer, format: int64}
        creditedCents: {type: integer, format: int64}
        releasedCents: {type: integer, format: int64}
        paidFromSalesCents: {type: integer, format: int64}
        status: {type: string, enum: [REQUESTED, WITHHELD, CREDITED, DECLINED, MISSED, FAILED, RELEASED]}
        paymentsReference: {type: [string, 'null']}
        reason: {type: [string, 'null']}
        attempts: {type: integer}
        lastError: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
        updatedAt: {type: [string, 'null'], format: date-time}
