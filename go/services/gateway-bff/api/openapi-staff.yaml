        createdBy: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
    NotificationTemplateVariant:
      type: object
      required: [locale, channel, latestVersion, versions]
      properties:
        locale: {type: string}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        latestVersion: {type: integer}
        versions: {type: array, description: Newest first, items: {$ref: '#/components/schemas/NotificationTemplateVersion'}}
    NotificationSample:
      type: object
      required: [source, area, eventTypes, data]
      properties:
        source:
          type: string
          enum: [event, request, sample, none]
          description: "event: a producer event through notifications' real ingest; request: a producer's notification.requested; sample: fixed data for keys no event maps to; none: no sample"
        area: {type: string, enum: [account, orders, seller, payouts, bookings, trust, retail, marketing, security, other]}
        eventTypes: {type: array, items: {type: string}, description: Event types that send this template}
        data: {type: object, additionalProperties: true}
    NotificationTemplateDetail:
      type: object
      required: [key, category, variants, sample, canEdit, canTestSend]
      properties:
        key: {type: string}
        category: {$ref: '#/components/schemas/NotificationCategory'}
        variants: {type: array, items: {$ref: '#/components/schemas/NotificationTemplateVariant'}}
        sample: {$ref: '#/components/schemas/NotificationSample'}
        canEdit: {type: boolean}
        canTestSend: {type: boolean}
    NotificationDraft:
      type: object
      required: [bodyText]
      properties:
        category: {$ref: '#/components/schemas/NotificationCategory'}
        subject: {type: string, maxLength: 300}
        bodyHtml: {type: string, maxLength: 50000}
        bodyText: {type: string, maxLength: 5000}
    NotificationPreviewRequest:
      type: object
      required: [channel]
      properties:
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        locale: {type: string, default: en, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
        version: {type: integer, minimum: 0, default: 0, description: 0 = latest}
        data: {type: object, additionalProperties: true, description: Template fields (start from the sample data)}
        draft: {$ref: '#/components/schemas/NotificationDraft'}
    SmsSegments:
      type: object
      required: [encoding, characters, units, segments, perSegment]
      properties:
        encoding: {type: string, enum: [GSM-7, UCS-2], description: UCS-2 as soon as one character is outside the GSM 03.38 alphabet}
        characters: {type: integer}
        units: {type: integer, description: GSM-7 septets (extension characters count two) or UTF-16 code units}
        segments: {type: integer}
        perSegment: {type: integer, description: '160 / 70 for one segment, 153 / 67 per part when concatenated'}
    NotificationPreview:
      type: object
      required: [subject, html, text, version, category, sms]
      properties:
        subject: {type: string}
        html: {type: string, description: Email HTML; show it in a sandboxed iframe}
        text: {type: string}
        version: {type: integer, description: The rendered version (0 for a draft)}
        category: {$ref: '#/components/schemas/NotificationCategory'}
        sms:
          oneOf:
            - {$ref: '#/components/schemas/SmsSegments'}
            - {type: 'null'}
    NotificationVersionDraft:
      type: object
      required: [locale, channel, category, bodyText]
      properties:
        locale: {type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$'}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        category: {$ref: '#/components/schemas/NotificationCategory'}
        subject: {type: string, maxLength: 300}
        bodyHtml: {type: string, maxLength: 50000}
        bodyText: {type: string, minLength: 1, maxLength: 5000}
    NotificationTestSendResult:
      type: object
      required: [to, channel, provider]
      properties:
        to: {type: string, description: Your own email or phone}
        channel: {$ref: '#/components/schemas/NotificationChannel'}
        provider: {type: [string, 'null']}
    # ── pre-orders (S270–S275); relayed from delivery-runs, so objects stay open (additionalProperties)
    PreorderCan:
      type: object
      required: [manage, settings, export, lateAdd]
      properties:
        manage: {type: boolean, description: 'EDIT or FULL and preorders:manage: windows, creatives, areas'}
        settings: {type: boolean, description: 'FULL and preorders:manage: master switch, fallback, placements, payment setup'}
        export: {type: boolean, description: preorders:export}
        lateAdd: {type: boolean, description: 'APPROVE, EDIT or FULL and preorders:late-add'}
    StaffPreorderObject:
      type: object
      additionalProperties: true
    StaffPreorderItems:
      type: object
      required: [items]
      additionalProperties: true
      properties:
        items: {type: array, items: {type: object, additionalProperties: true}}
        total: {type: [integer, 'null']}
        page: {type: integer}
        size: {type: integer}
    StaffPreorderList:
      type: object
      required: [items, can]
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'Row: id, code, name, where, opensAt, closesAt, deliversOn, status, count, revenueMinor, areaOff'
        total: {type: [integer, 'null']}
        counts: {type: object, additionalProperties: {type: integer}, description: Tab counts}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderDraft:
      type: object
      additionalProperties: true
      description: |
        Window fields (delivery-runs PreorderWindow): name, targets[] (country/region[/city] keys), opensAt, closesAt,
        deliversOn, ribbon (≤ 80), headline (≤ 140), smsCopy (≤ 160, GSM-7), categories[], door, pickup, pickupPoint,
        doorFeeOverride / pickupFeeOverride (minor units, null = the settings' fees), showCount, socialBudget, comms[]
        (ANNOUNCE, REMIND_48H, LAST_CALL_6H, CLOSED, OUT_FOR_DELIVERY, PAID_SOCIAL).
      properties:
        name: {type: string, maxLength: 120}
        targets: {type: array, items: {type: string}}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        deliversOn: {type: string, format: date}
        ribbon: {type: string, maxLength: 80}
        headline: {type: string, maxLength: 140}
        smsCopy: {type: string, maxLength: 160}
        categories: {type: array, items: {type: string}}
        door: {type: boolean}
        pickup: {type: boolean}
        pickupPoint: {type: [object, 'null'], additionalProperties: true}
        doorFeeOverride: {type: [integer, 'null']}
        pickupFeeOverride: {type: [integer, 'null']}
        showCount: {type: boolean}
        comms: {type: array, items: {type: string}}
        version: {type: integer}
    StaffPreorderWindow:
      type: object
      required: [can]
      additionalProperties: true
      properties:
        id: {type: string}
        code: {type: string, examples: [LBK-7]}
        name: {type: string}
        status: {type: string, description: 'DRAFT, PAUSED, UPCOMING, OPEN, CLOSED, DELIVERED (derived)'}
        doorFeeOverride: {type: [integer, 'null'], description: Window override in minor units (null = the settings' fee for its currency)}
        pickupFeeOverride: {type: [integer, 'null']}
        effectiveDoorFee: {type: integer, description: 'Door fee shoppers pay (override, else settings), minor units'}
        effectivePickupFee: {type: integer}
        currency: {type: string}
        pickupWindow: {type: [string, 'null']}
        allowedMethods: {type: array, items: {type: string, enum: [CARD, WALLET, ACH]}}
        creatives: {type: object, additionalProperties: true}
        violations: {type: array, items: {type: object, additionalProperties: true}, description: Publish checks that fail}
        active: {type: boolean, description: "The window's own switch (never rewritten by the master switch)"}
        switchable: {type: boolean, description: Published and not delivered}
        switchState: {$ref: '#/components/schemas/PreorderSwitchState'}
        live: {type: boolean, description: switchState is ON}
        version: {type: integer}
        can: {$ref: '#/components/schemas/PreorderCan'}
    PreorderSwitchState:
      type: string
      enum: [ON, PAUSED, GLOBAL_OFF, AREA_OFF, NOT_LIVE]
      description: |
        Effective state = master switch AND window switch AND an area on. PAUSED = this window is off ("Off");
        GLOBAL_OFF = the master switch holds it ("Off (global switch)"); AREA_OFF = every target area is off;
        NOT_LIVE = draft or delivered (no switch).
    StaffPreorderBulkSwitch:
      type: object
      required: [items, can]
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: {type: string}
              outcome: {type: string, enum: [SWITCHED, UNCHANGED, SKIPPED]}
              window: {type: [object, 'null'], additionalProperties: true, description: The list row now}
              code: {type: [string, 'null']}
              reason: {type: [string, 'null']}
        switched: {type: integer}
        unchanged: {type: integer}
        skipped: {type: integer}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderRegionRow:
      type: object
      required: [key, name, 'on', version, windows]
      properties:
        key: {type: string, examples: [US/TX/Lubbock]}
        name: {type: string}
        'on': {type: boolean}
        version: {type: integer}
        windows: {type: array, items: {type: string}, description: Live pre-orders selling here (they block removal)}
    StaffPreorderRegion:
      type: object
      required: [country, region, cities, version, can]
      additionalProperties: true
      properties:
        country: {type: string}
        region: {type: string}
        countryName: {type: string}
        regionName: {type: string}
        regionLabel: {type: string}
        wholeRegion: {oneOf: [{$ref: '#/components/schemas/StaffPreorderRegionRow'}, {type: 'null'}]}
        cities: {type: array, items: {$ref: '#/components/schemas/StaffPreorderRegionRow'}}
        version: {type: integer, description: The region's optimistic-lock version (ETag)}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderSettings:
      type: object
      additionalProperties: true
      description: |
        Platform settings (delivery-runs): enabled, fallback (SHIP | WAITLIST), placements {ribbon, hero, badge, pdp,
        cart, family}, payment {doorFee and pickupFee (per currency, minor units), pickupWindow, allowedMethods
        [CARD, WALLET, ACH], lateAdd {savedCard, paymentLink, linkExpiryHours}, missedDelivery {offerRefund,
        offerNewDate}}. Answers carry `can`.
      properties:
        enabled: {type: boolean}
        fallback: {type: string, enum: [SHIP, WAITLIST]}
        placements: {type: object, additionalProperties: {type: boolean}}
        payment:
          type: object
          additionalProperties: true
          properties:
            doorFee: {type: object, additionalProperties: {type: integer}, description: Minor units per currency, examples: [{USD: 799, CAD: 999}]}
            pickupFee: {type: object, additionalProperties: {type: integer}, description: Minor units per currency, examples: [{USD: 0, CAD: 0}]}
            pickupWindow: {type: string, examples: [10am–2pm]}
            allowedMethods: {type: array, items: {type: string, enum: [CARD, WALLET, ACH]}}
            lateAdd:
              type: object
              properties:
                savedCard: {type: boolean}
                paymentLink: {type: boolean}
                linkExpiryHours: {type: integer, minimum: 1, maximum: 24, description: "Payment link lifetime in hours; orders-service creates links for at most 24 h"}
            missedDelivery:
              type: object
              properties:
                offerRefund: {type: boolean}
                offerNewDate: {type: boolean}
        version: {type: integer}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderAreas:
      type: object
      required: [can]
      additionalProperties: true
      properties:
        items: {type: array, items: {type: object, additionalProperties: true}}
        total: {type: [integer, 'null']}
        can: {$ref: '#/components/schemas/PreorderCan'}
    StaffPreorderLateOrder:
      type: object
      required: [customerId, phoneConfirmed, items, payment, reason]
      properties:
        customerId: {type: string}
        addressId: {type: string}
        newAddress:
          type: object
          properties:
            line1: {type: string}
            zip: {type: string}
            placeId: {type: string}
        address:
          $ref: '#/components/schemas/StaffPreorderLateAddress'
        phoneConfirmed: {type: boolean, const: true}
