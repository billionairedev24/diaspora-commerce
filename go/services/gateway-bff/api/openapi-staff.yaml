    post:
      tags: [Fees]
      operationId: importStaffTaxRates
      security: [{sessionCookie: []}]
      summary: Bulk upsert US state rules and local ZIP rates from CSV (USA pilot)
      description: |
        tax-returns `POST /v1/tax/rates/import` (tax:configure and EDIT on fees). Header row
        `kind,country,state,name,zipPrefix,generalRate,groceryRate,preparedFoodRate,shippingTaxable,facilitator,localRate,appliesToGrocery`
        with `kind=STATE|LOCAL`. Country column is stored for future markets; quotes today use US rules only.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TaxRatesImportRequest'}}}
      responses:
        '200': {description: Import result, content: {application/json: {schema: {$ref: '#/components/schemas/TaxRatesImportResult'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/fees/negotiated-rates:
    get:
      tags: [Fees]
      operationId: listNegotiatedRates
      security: [{sessionCookie: []}]
      summary: Negotiated commission and connection-fee rates (server-driven table)
      description: |
        payments `GET /v1/negotiated-rates` (staff payments:read), with organisation names from seller's directory. A
        negotiated rate wins over the organisation's plan rate, the category rate and the default while it is active
        (its category before `*`). Filters: one organisation (the seller billing panel lists its rates this way), type,
        status, and `q` over organisation, reason, reference and negotiator. Needs VIEW on the fees module.
      parameters:
        - {name: orgId, in: query, schema: {type: string, maxLength: 80}}
        - {name: type, in: query, schema: {type: string, enum: [COMMISSION, CONNECTION_FEE, FBA_FEE]}}
        - {name: status, in: query, schema: {type: string, enum: [SCHEDULED, ACTIVE, ENDED, EXPIRED]}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Negotiated rates, content: {application/json: {schema: {$ref: '#/components/schemas/NegotiatedRatePage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Fees]
      operationId: createNegotiatedRate
      security: [{sessionCookie: []}]
      summary: Negotiate a commission or connection fee with an organisation (audited)
      description: |
        payments `POST /v1/negotiated-rates` (payments:configure and EDIT on fees). One category or every category, from
        `startsAt` (default now, never in the past) to `endsAt` (optional; a job records the expiry). The reason is required
        and kept in the audit trail with who negotiated it and the contract or ticket reference. 409 when another rate of the
        organisation, type and category overlaps; AfroTransact Retail never pays fees (422). Payments already created keep
        the rate snapshotted on their lines.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NegotiatedRateDraft'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/NegotiatedRate'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
