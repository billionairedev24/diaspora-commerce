  # ───────────────────────────────────────────────────────────── S281 inventory
  /v1/staff/inventory/flow:
    get:
      tags: [Inventory hub]
      operationId: getStaffInventoryFlow
      security: [{sessionCookie: []}]
      summary: The pipeline from a purchase order to "Sold & shipped by AfroTransact" with live counts
      description: |
        Nine steps (create the product, raise a PO, approve & send, announce the inbound, transit, receive & count,
        lots into stock, sell on the storefront, match the invoice) with what is waiting at each, counted from
        retail-service (items, POs by status, open goods receipts, live listings, invoice exceptions) and
        inventory-service (inbound shipments by status, sellable lots). A step whose service cannot be reached has
        `count: null` and names it in `unavailable`; retail steps need the `retail` module at VIEW. Module `inventory`
        at VIEW.
      responses:
        '200': {description: Flow, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryFlow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/inventory/trace:
    get:
      tags: [Inventory hub]
      operationId: getStaffInventoryTrace
      security: [{sessionCookie: []}]
      summary: Follow one product from its retail item to the product page
      description: |
        Given a variant ATIN and / or an inventory SKU: the retail item and its listing, the latest inbound shipment,
        the sellable lots (next pick by FEFO), availability, the open Fulfilled-by-AfroTransact offer (its inventory SKU
        must be the SKU the lots are under, else BROKEN), the search index and the public buy box the product page
        shows (badges, delivery days). Module `inventory` at VIEW.
      parameters:
        - {name: atin, in: query, schema: {type: string, pattern: '^[A-Za-z0-9]{10}$'}}
        - {name: sku, in: query, schema: {type: string, maxLength: 64}}
      responses:
        '200': {description: Trace, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryTrace'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
