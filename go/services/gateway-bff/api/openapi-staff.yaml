  # ───────────────────────────────────────────────────────────── notifications: templates (S268)
  /v1/staff/notifications/templates:
    get:
      tags: [Notifications]
      operationId: listNotificationTemplates
      security: [{sessionCookie: []}]
      summary: Every notification template key with its channels, locales and latest version
      description: |
        notifications `GET /v1/templates` (latest version of every key, locale and channel) grouped by key; `q` filters
        by key, category or channel. Needs `notifications:read` (VIEW on the notifications module); `canEdit` says
        whether the staff member holds `notifications:templates:write`.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: 'Part of a key, a category or a channel'}
      responses:
        '200': {description: Templates, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTemplateList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/notifications/templates/{key}:
    get:
      tags: [Notifications]
      operationId: getNotificationTemplate
      security: [{sessionCookie: []}]
      summary: A template key's versions per locale and channel, with its sample data
      description: |
        notifications `GET /v1/templates?key=` (every version, newest first per locale and channel) and
        `GET /v1/templates/{key}/sample`: the fields the key's event carries in production (a contract-shaped event run
        through the real ingest), used to prefill the preview. When the sample cannot be read the editor starts from
        empty data (`source: none`). Needs `notifications:read`.
      parameters: [{$ref: '#/components/parameters/TemplateKey'}]
      responses:
        '200': {description: Template, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTemplateDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/notifications/templates/{key}/preview:
    post:
      tags: [Notifications]
      operationId: previewNotificationTemplate
      security: [{sessionCookie: []}]
      summary: Render a stored version or an unsaved draft with sample data
      description: |
        notifications `POST /v1/templates/{key}/preview` with the service's real renderer. `version` 0 renders the
        latest stored version (locale fallback fr-CA → fr → en); `draft` renders unsaved content (the editor's live
        preview). A template that does not compile, or reads a field the data lacks, is a 422 on the part that failed
        (`subject`, `bodyText`, `bodyHtml`, prefixed `draft.` for drafts, else `data`). SMS and WhatsApp previews carry
        the GSM-7 / UCS-2 segment count. Needs `notifications:read`.
      parameters: [{$ref: '#/components/parameters/TemplateKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreviewRequest'}}}
      responses:
        '200': {description: Rendered, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreview'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/notifications/templates/{key}/versions:
    post:
      tags: [Notifications]
      operationId: createNotificationTemplateVersion
      security: [{sessionCookie: []}]
      summary: Create the next version of a template for one locale and channel
      description: |
        notifications `POST /v1/templates` (`notifications:templates:write`). Before storing, the BFF checks that every
        placeholder (`{{.field}}`, `{{if .field}}`, `{{$.field}}`) is a field of the key's sample data (keys without a
        sample are only render-checked), renders the draft with the sample data, and refuses SMS longer than 3
        segments. Emails need a subject and an HTML body; push notifications need a title; only emails have HTML.
        The new version is what every later send of the key uses.
      parameters: [{$ref: '#/components/parameters/TemplateKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationVersionDraft'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTemplateVersion'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/notifications/templates/{key}/test-send:
    post:
      tags: [Notifications]
      operationId: testSendNotificationTemplate
      security: [{sessionCookie: []}]
      summary: Send a stored version or a draft to your own email or phone
      description: |
        notifications `POST /v1/templates/{key}/test-send` (`notifications:templates:write`). The destination is
        always the signed-in staff member's own email (email) or phone (SMS, WhatsApp) from their access token, never
        an address in the request; email subjects are prefixed `[TEST]`. Push cannot be test-sent (422 on `channel`);
        no address on the account is a 422 without field errors.
      parameters: [{$ref: '#/components/parameters/TemplateKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreviewRequest'}}}
      responses:
        '200': {description: Sent, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTestSendResult'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  # ───────────────────────────────────────────────────────────── pre-orders (S270–S275)
  /v1/staff/preorders:
    get:
      tags: [Pre-orders]
      operationId: listStaffPreorders
      security: [{sessionCookie: []}]
      summary: Pre-order windows (tabs All / Open / Scheduled / Closed / Drafts)
      description: delivery-runs `GET /v1/preorders?status=&q=&page=&size=` (delivery-runs:read). Needs VIEW on preorders.
      parameters:
        - {name: status, in: query, schema: {type: string, maxLength: 20}, description: 'OPEN, UPCOMING, CLOSED, DELIVERED, DRAFT, PAUSED'}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Windows, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Pre-orders]
      operationId: createStaffPreorder
      security: [{sessionCookie: []}]
      summary: Open a pre-order (saved as a draft)
      description: delivery-runs `POST /v1/preorders` (preorders:manage, EDIT). `Idempotency-Key` is relayed.
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderDraft'}}}
      responses:
        '201': {description: Draft created, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Pre-orders]
      operationId: switchStaffPreorders
      security: [{sessionCookie: []}]
      summary: Switch several pre-orders on or off (bulk), each on its own
      description: |
        delivery-runs `PATCH /v1/preorders {ids[], active}` (preorders:manage, EDIT). 1–100 ids. Each window's own
        switch only (the master switch is never touched); items[] say SWITCHED, UNCHANGED or SKIPPED (draft, delivered,
        unknown or failing its publish checks, with the reason).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, active]
              properties:
                ids: {type: array, minItems: 1, maxItems: 100, items: {type: string}}
                active: {type: boolean}
      responses:
        '200': {description: Outcomes, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderBulkSwitch'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/settings:
    get:
      tags: [Pre-orders]
      operationId: getStaffPreorderSettings
      security: [{sessionCookie: []}]
      summary: Platform pre-order settings (master switch, fallback, placements, payment setup)
      description: delivery-runs `GET /v1/preorder-settings`. Needs VIEW on preorders.
      responses:
        '200': {description: Settings, headers: {ETag: {description: 'Optimistic-lock version ("<version>"); send it back as If-Match', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderSettings'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Pre-orders]
      operationId: updateStaffPreorderSettings
      security: [{sessionCookie: []}]
      summary: Change the settings, including the payment setup (FULL only)
      description: |
        delivery-runs `PUT /v1/preorder-settings` (If-Match relayed; preorders:manage). Only FULL on preorders (Super
        Admin, Marketing) may change settings: Operations (EDIT) gets 403.
      parameters:
        - {name: If-Match, in: header, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderSettings'}}}
      responses:
        '200': {description: Saved, headers: {ETag: {description: 'Optimistic-lock version ("<version>"); send it back as If-Match', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderSettings'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/areas:
    get:
      tags: [Pre-orders]
      operationId: listStaffPreorderAreas
      security: [{sessionCookie: []}]
      summary: Coverage areas (country → region → city, on-count and window count)
      description: delivery-runs `GET /v1/preorder-areas?country=&region=&q=&page=&size=`.
      parameters:
        - {name: country, in: query, schema: {type: string, maxLength: 2}}
        - {name: region, in: query, schema: {type: string, maxLength: 3}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Areas, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderAreas'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Pre-orders]
      operationId: addStaffPreorderArea
      security: [{sessionCookie: []}]
      summary: Add a coverage area ("US/TX" or "US/TX/Lubbock")
      description: delivery-runs `POST /v1/preorder-areas {key}` (preorders:manage, EDIT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: {type: string, examples: [US/TX/Lubbock]}
      responses:
        '201': {description: Added, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderObject'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Pre-orders]
      operationId: toggleStaffPreorderAreas
      security: [{sessionCookie: []}]
      summary: Turn areas on or off in bulk (a country or region at once)
      description: delivery-runs `PATCH /v1/preorder-areas {keys[], on}` (preorders:manage, EDIT). 1 to 500 keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys, on]
              properties:
                keys: {type: array, minItems: 1, maxItems: 500, items: {type: string}}
                'on': {type: boolean}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderObject'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/areas/{key}:
    delete:
      tags: [Pre-orders]
      operationId: deleteStaffPreorderArea
      security: [{sessionCookie: []}]
      summary: Remove a coverage area
      description: |
        delivery-runs `DELETE /v1/preorder-areas/{key}` (preorders:manage, EDIT). The key is one path segment with its
        slashes encoded (`US%2FTX%2FLubbock`). Answers the refreshed area page.
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, examples: [US%2FTX%2FLubbock]}}
      responses:
        '200': {description: Areas after the removal, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderAreas'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/areas/regions/{country}/{region}:
    parameters:
      - {name: country, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
      - {name: region, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9]{1,3}$'}}
    get:
      tags: [Pre-orders]
      operationId: getStaffPreorderRegion
      security: [{sessionCookie: []}]
      summary: One state's / province's coverage for the in-place editor
      description: |
        delivery-runs `GET /v1/preorder-areas/regions/{country}/{region}` (VIEW): the "Every city" row (or null), every
        listed city with its switch and the live pre-orders selling there, and `version` (also the ETag) to send back
        as If-Match.
      responses:
        '200': {description: Coverage, headers: {ETag: {description: The region's version, schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderRegion'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Pre-orders]
      operationId: updateStaffPreorderRegion
      security: [{sessionCookie: []}]
      summary: Edit a state's / province's cities in place (If-Match)
      description: |
        delivery-runs `PUT /v1/preorder-areas/regions/{country}/{region}` (preorders:manage, EDIT). Full replacement:
        listed cities are added or switched, cities left out are removed, everyCity adds / switches / (null) removes the
        "Every city" row. 412 when anyone changed the region since the version sent; 409 `delivery-runs.area-in-use`
        when a removal would leave a live pre-order's place uncovered (switch it off instead).
      parameters:
        - {name: If-Match, in: header, schema: {type: string}}
      requestBody:
