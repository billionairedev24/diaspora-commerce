      operationId: getStaffInventoryTrace
      security: [{sessionCookie: []}]
      summary: Follow one product from its retail item to the product page
      description: |
        Given a variant ATIN and / or an inventory SKU: the retail item and its listing, the latest inbound shipment,
        the sellable lots (next pick by FEFO), availability, the open Fulfilled-by-AfroTransact offer (its inventory SKU
        must be the SKU the lots are under, else BROKEN), the search index and the public buy box the product page
