    SupportPermissions:
      type: object
      required: [refund, resend, cancelShipment]
      properties:
        refund: {type: boolean}
        resend: {type: boolean}
        cancelShipment: {type: boolean}
    Customer360:
      type: object
      required: [customer, orders, bookings, claims, returns, notifications, cases, audit, refundLimitMinor, can, unavailable]
      properties:
        customer: {$ref: '#/components/schemas/SupportCustomer'}
        orders: {type: array, items: {$ref: '#/components/schemas/SupportOrder'}}
        bookings: {type: array, items: {$ref: '#/components/schemas/SupportBooking'}}
        claims: {type: array, items: {$ref: '#/components/schemas/SupportClaim'}}
        returns: {type: array, items: {$ref: '#/components/schemas/SupportReturn'}}
        notifications: {type: array, items: {$ref: '#/components/schemas/SupportNotification'}}
        cases: {type: array, items: {$ref: '#/components/schemas/SupportCaseSummary'}}
        audit: {type: array, items: {$ref: '#/components/schemas/AuditLine'}}
        refundLimitMinor: {type: [integer, 'null'], format: int64}
        can: {$ref: '#/components/schemas/SupportPermissions'}
        unavailable: {type: array, items: {type: string}, description: Upstreams that could not answer (their sections are empty)}
    SupportRefundRequest:
      type: object
      required: [customerId, orderNumber, amountMinor, reason, via]
      properties:
        customerId: {type: string}
        orderNumber: {type: string, minLength: 1}
        amountMinor: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 3, maxLength: 500}
        via: {type: string, enum: [CLAIM, ORDER]}
        claimId: {type: string, description: Required with via CLAIM}
        caseId: {type: string, description: Support case the refund resolves (optional)}
    SupportResendRequest:
      type: object
      required: [customerId]
      properties:
        customerId: {type: string}
        caseId: {type: string}
    SupportCancelRequest:
      type: object
      required: [customerId, orderNumber, reason]
      properties:
        customerId: {type: string}
        orderNumber: {type: string, minLength: 1}
        reason: {type: string, minLength: 3, maxLength: 500}
        caseId: {type: string}
    SupportActionResult:
      type: object
      required: [ok, message, reference, audited]
      properties:
        ok: {type: boolean}
        message: {type: string}
        reference: {type: [string, 'null'], description: 'Refund, notification or shipment reference'}
        audited: {type: boolean, description: The upstream records the action in the trust-ops audit log}
    # ── fees & commissions
    FeeLimits:
      type: object
      description: Bounds the editor enforces (rates in basis points, amounts in minor units)
      required: [commissionMaxBps, cardPctMaxBps, cardFixedMaxMinor, fbaPerUnitMaxMinor, noteMinLength, noteMaxLength, maxCategoryRates, maxOverrides,
        deliveryMaxRadiusMiles, deliveryAmountMaxMinor, deliveryMaxBands, maxDeliveryOverrides]
      properties:
        commissionMaxBps: {type: integer, examples: [5000]}
        cardPctMaxBps: {type: integer, examples: [1000]}
        cardFixedMaxMinor: {type: integer, format: int64, examples: [1000]}
        fbaPerUnitMaxMinor: {type: integer, format: int64, examples: [10000]}
        noteMinLength: {type: integer}
        noteMaxLength: {type: integer}
        maxCategoryRates: {type: integer}
        maxOverrides: {type: integer}
        deliveryMaxRadiusMiles: {type: number, examples: [200], description: Largest AfroTransact Delivery service radius payments accepts}
        deliveryAmountMaxMinor: {type: integer, format: int64, examples: [10000], description: 'Largest delivery amount: fee, base, per mile, band, min or max'}
        deliveryMaxBands: {type: integer, examples: [20]}
        maxDeliveryOverrides: {type: integer, examples: [500]}
    FeeCategory:
      type: object
      required: [key, label, source]
      properties:
        key: {type: string, description: 'payments category key (lower-case), e.g. groceries'}
        label: {type: string}
        source: {type: string, enum: [TAXONOMY, SCHEDULE, PLATFORM], description: 'TAXONOMY: a catalog department; SCHEDULE: only known from a fee schedule; PLATFORM: services'}
    FeeCategoryRate:
      type: object
      required: [category, label, commissionBps]
      properties:
        category: {type: string}
        label: {type: string}
        commissionBps: {type: integer, minimum: 0, maximum: 10000}
    FeeOverride:
      type: object
      required: [orgId, orgName, category, categoryLabel, commissionBps]
      properties:
        orgId: {type: string}
        orgName: {type: [string, 'null']}
        category: {type: [string, 'null'], description: null = every category}
        categoryLabel: {type: string}
        commissionBps: {type: integer, minimum: 0, maximum: 10000}
    FeeScheduleView:
      type: object
      required: [id, version, status, effectiveFrom, currency, defaultCommissionBps, categoryRates, overrides, cardPctBps, cardFixedMinor, fbaPerUnitMinor,
        reverseCommissionOnRefund, deliveryPricing, note, createdBy, createdAt, cancelledAt, cancelledBy, cancelReason, cancellable]
      properties:
        id: {type: string}
        version: {type: integer}
        status: {type: string, enum: [ACTIVE, SCHEDULED, SUPERSEDED, CANCELLED]}
        effectiveFrom: {type: string, format: date-time}
        currency: {type: string}
        defaultCommissionBps: {type: integer, description: Commission of categories without their own rate (basis points)}
        categoryRates: {type: array, items: {$ref: '#/components/schemas/FeeCategoryRate'}}
        overrides: {type: array, items: {$ref: '#/components/schemas/FeeOverride'}}
        cardPctBps: {type: integer, description: 'Card fee estimate per charge, percentage part'}
        cardFixedMinor: {type: integer, format: int64, description: 'Card fee estimate per charge, fixed part'}
        fbaPerUnitMinor: {type: integer, format: int64}
        reverseCommissionOnRefund: {type: boolean}
        deliveryPricing:
          oneOf: [{$ref: '#/components/schemas/DeliveryPricing'}, {type: 'null'}]
          description: 'AfroTransact Delivery from seller stores (S255); null when the version has no delivery pricing (quotes NOT_CONFIGURED)'
        note: {type: [string, 'null']}
        createdBy: {type: string}
        createdAt: {type: [string, 'null'], format: date-time}
        cancelledAt: {type: [string, 'null'], format: date-time}
        cancelledBy: {type: [string, 'null']}
        cancelReason: {type: [string, 'null']}
        cancellable: {type: boolean, description: Scheduled and the caller may configure fees}
    FeeRetail:
      type: object
      required: [orgId, name, note]
      properties:
        orgId: {type: string, description: Empty when RETAIL_ORG_ID is not configured}
        name: {type: string}
        note: {type: string, examples: ['No commission, no fees (merchant of record)']}
    FeesOverview:
      type: object
      required: [generatedAt, currency, canConfigure, current, base, minEffectiveFrom, immediateAllowed, schedules, categories, taxonomyAvailable,
        orgNamesAvailable, retail, limits, exampleSaleMinor, reverseOnRefundHelp]
      properties:
        generatedAt: {type: string, format: date-time}
        currency: {type: string}
        canConfigure: {type: boolean, description: payments:configure and EDIT on fees (create and cancel versions)}
        current: {oneOf: [{$ref: '#/components/schemas/FeeScheduleView'}, {type: 'null'}], description: The version in force now}
        base: {oneOf: [{$ref: '#/components/schemas/FeeScheduleView'}, {type: 'null'}], description: 'What a new version starts from (the latest scheduled version, else the active one)'}
        minEffectiveFrom: {type: string, format: date-time, description: 'Earliest effective time of a new version'}
        immediateAllowed: {type: boolean, description: false while a version is scheduled}
        schedules: {type: array, items: {$ref: '#/components/schemas/FeeScheduleView'}, description: 'Every version, newest first'}
        categories: {type: array, items: {$ref: '#/components/schemas/FeeCategory'}}
        taxonomyAvailable: {type: boolean, description: false when catalog could not be read (free text still works)}
        orgNamesAvailable: {type: boolean}
        retail: {$ref: '#/components/schemas/FeeRetail'}
        limits: {$ref: '#/components/schemas/FeeLimits'}
        exampleSaleMinor: {type: integer, format: int64, description: Sale amount of the impact preview (10000 = $100.00)}
        reverseOnRefundHelp: {type: string}
    FeeOrgHit:
      type: object
      required: [orgId, name, kind, status, retail, selectable, reason]
      properties:
        orgId: {type: string}
        name: {type: string}
        kind: {type: string}
        status: {type: string}
        retail: {type: boolean}
        selectable: {type: boolean}
        reason: {type: [string, 'null'], description: Why the organisation can't be chosen}
    FeeOrgSearch:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FeeOrgHit'}}
    FeeDraftCategoryRate:
      type: object
      required: [category, commissionBps]
      properties:
        category: {type: string, minLength: 1, maxLength: 80}
        commissionBps: {type: integer, minimum: 0, maximum: 5000}
    FeeDraftOverride:
      type: object
      required: [orgId, commissionBps]
      properties:
        orgId: {type: string, minLength: 1, maxLength: 80}
        category: {type: [string, 'null'], maxLength: 80, description: Omitted or null = every category}
        commissionBps: {type: integer, minimum: 0, maximum: 5000}
    FeeScheduleDraft:
      type: object
      required: [defaultCommissionBps, categoryRates, overrides, cardPctBps, cardFixedMinor, fbaPerUnitMinor, reverseCommissionOnRefund, note]
      properties:
        effectiveFrom: {type: [string, 'null'], format: date-time, description: Required unless immediate; in the future}
        immediate: {type: boolean, description: Take effect now (the console asks for confirmation)}
        defaultCommissionBps: {type: integer, minimum: 0, maximum: 5000}
        categoryRates: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/FeeDraftCategoryRate'}}
        overrides: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/FeeDraftOverride'}}
        cardPctBps: {type: integer, minimum: 0, maximum: 1000}
        cardFixedMinor: {type: integer, format: int64, minimum: 0, maximum: 1000}
        fbaPerUnitMinor: {type: integer, format: int64, minimum: 0, maximum: 10000}
        reverseCommissionOnRefund: {type: boolean}
        deliveryPricing:
          oneOf: [{$ref: '#/components/schemas/DeliveryPricingDraft'}, {type: 'null'}]
          description: AfroTransact Delivery pricing (S255). Omitted or null = carried over from the latest live version; enabled=false stops offering it
        note: {type: string, minLength: 3, maxLength: 500, description: Why the fees change (required)}
    FeeCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
    # ── AfroTransact Delivery pricing (S255; amounts in minor units, distances in road miles)
    DeliveryBand:
      type: object
      required: [fromMiles, toMiles, feeMinor]
      properties:
        fromMiles: {type: number, minimum: 0, description: From (inclusive)}
        toMiles: {type: number, minimum: 0, description: To (exclusive); bands never overlap}
        feeMinor: {type: integer, format: int64, minimum: 0}
    DeliveryTariff:
      type: object
      description: 'FLAT: flatPerPackageMinor × packages. DISTANCE (per trip): the fee of the band covering the distance, else
        baseMinor + perMileMinor × miles (half up), then at least minMinor and at most maxMinor (null = no cap)'
      required: [mode, flatPerPackageMinor, baseMinor, perMileMinor, bands, minMinor, maxMinor]
      properties:
        mode: {type: string, enum: [FLAT, DISTANCE]}
        flatPerPackageMinor: {type: [integer, 'null'], format: int64, minimum: 0}
        baseMinor: {type: [integer, 'null'], format: int64, minimum: 0}
        perMileMinor: {type: [integer, 'null'], format: int64, minimum: 0, description: '85 = $0.85 per mile'}
        bands: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/DeliveryBand'}}
        minMinor: {type: [integer, 'null'], format: int64, minimum: 0}
        maxMinor: {type: [integer, 'null'], format: int64, minimum: 0}
    DeliveryFeeOverride:
      type: object
      required: [orgId, orgName, sellerFee]
      properties:
        orgId: {type: string}
        orgName: {type: [string, 'null']}
        sellerFee: {$ref: '#/components/schemas/DeliveryTariff'}
    DeliveryPricing:
      type: object
      description: AfroTransact Delivery pricing of a fee-schedule version
      required: [enabled, maxRadiusMiles, customerCharge, sellerFee, sellerOverrides]
      properties:
        enabled: {type: boolean, description: false = not offered under this version}
        maxRadiusMiles: {type: number, description: Beyond this road distance the option is unavailable (BEYOND_MAX_RADIUS)}
        customerCharge: {oneOf: [{$ref: '#/components/schemas/DeliveryTariff'}, {type: 'null'}], description: What the shopper pays (4200); null = free}
        sellerFee: {oneOf: [{$ref: '#/components/schemas/DeliveryTariff'}, {type: 'null'}], description: What the seller pays per pickup-delivery (4250); null = no fee}
        sellerOverrides: {type: array, items: {$ref: '#/components/schemas/DeliveryFeeOverride'}, description: Negotiated seller fees (AfroTransact Retail never pays one)}
    DeliveryDraftOverride:
      type: object
      required: [orgId, sellerFee]
      properties:
        orgId: {type: string, minLength: 1, maxLength: 80}
        sellerFee: {$ref: '#/components/schemas/DeliveryTariff'}
    DeliveryPricingDraft:
      type: object
      required: [enabled, maxRadiusMiles, customerCharge, sellerFee, sellerOverrides]
      properties:
        enabled: {type: boolean}
        maxRadiusMiles: {type: [number, 'null'], description: 0 < r ≤ limits.deliveryMaxRadiusMiles}
        customerCharge: {oneOf: [{$ref: '#/components/schemas/DeliveryTariff'}, {type: 'null'}]}
        sellerFee: {oneOf: [{$ref: '#/components/schemas/DeliveryTariff'}, {type: 'null'}]}
        sellerOverrides: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/DeliveryDraftOverride'}}
    DeliveryQuoteRequest:
      type: object
      required: [sellerOrgId, distanceMiles]
      properties:
        sellerOrgId: {type: string, minLength: 1, maxLength: 80}
        distanceMiles: {type: number, minimum: 0, maximum: 1000, description: Road miles}
        packages: {type: integer, minimum: 1, maximum: 50, default: 1}
        at: {type: [string, 'null'], format: date-time, description: Version in force at this time; default now}
    DeliveryQuote:
      type: object
      required: [available, unavailableReason, customerChargeMinor, sellerFeeMinor, sellerFeeSource, scheduleVersion, maxRadiusMiles, currency]
      properties:
        available: {type: boolean}
        unavailableReason: {type: [string, 'null'], enum: [NOT_CONFIGURED, BEYOND_MAX_RADIUS, null]}
        customerChargeMinor: {type: integer, format: int64}
        sellerFeeMinor: {type: integer, format: int64}
        sellerFeeSource: {type: [string, 'null'], enum: [DEFAULT, OVERRIDE, RETAIL, null]}
        scheduleVersion: {type: [integer, 'null']}
        maxRadiusMiles: {type: [number, 'null']}
        currency: {type: string}
    # ── Dispatch: seller pickups (S255)
    PickupRow:
      type: object
      required: [shipmentId, orderNumber, sellerOrgId, sellerName, city, state, postalCode, status, routeId, perishable, units, promisedBy, createdAt]
      properties:
        shipmentId: {type: string}
        orderNumber: {type: string}
