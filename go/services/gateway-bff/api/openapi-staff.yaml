    post:
      tags: [Pre-orders]
      operationId: requestStaffPreorderUpload
      security: [{sessionCookie: []}]
      summary: Sign a direct media upload for a creative
      description: |
        media `POST /v1/uploads` (purpose storefront; JPEG, PNG or WebP up to 10 MB). The console PUTs the file to
        `upload.url`, then sets the slot (`PUT /v1/staff/preorders/{id}/creatives/{slot} {assetId}`), where the BFF
        finalises the asset with media and delivery-runs verifies it. Needs EDIT and preorders:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, size]
              properties:
                fileName: {type: string, maxLength: 200}
                contentType: {type: string, enum: [image/jpeg, image/png, image/webp]}
                size: {type: integer, minimum: 1, maximum: 10485760}
                width: {type: integer}
                height: {type: integer}
      responses:
        '201':
          description: Upload ticket
          content:
            application/json:
              schema:
                type: object
                required: [assetId, upload]
                properties:
                  assetId: {type: string}
                  upload:
                    type: object
                    required: [method, url, headers]
                    properties:
                      method: {type: string, enum: [PUT, POST]}
