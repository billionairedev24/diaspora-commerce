      additionalProperties: true
      required: [id, number, status]
      description: retail `GoodsReceipt` (counted batches, variances, over-receipt approval)
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        poId: {type: string, format: uuid}
        status: {type: string}
        lines: {type: array, items: {type: object, additionalProperties: true}}
        version: {type: integer, format: int64}
    RetailItem:
      type: object
      additionalProperties: true
      required: [id, sku, name]
      description: retail `Item` (product master with GTIN, ATIN link and listing)
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        gtin: {type: string}
        atin: {type: [string, 'null']}
        name: {type: string}
        listingStatus: {type: string, enum: [DRAFT, LIVE, PAUSED]}
        version: {type: integer, format: int64}
    InventoryFlowStage:
      type: object
      required: [key, title, who, what, effect, count, countLabel, href]
      properties:
        key: {type: string}
        title: {type: string}
        who: {type: string}
        what: {type: string}
        effect: {type: string}
        count: {type: [integer, 'null'], format: int64, description: null when the service behind the step is unreachable}
        countLabel: {type: string}
        href: {type: string}
        unavailable: {type: string}
    InventoryFlow:
      type: object
      required: [stages, asOf]
      properties:
        stages: {type: array, items: {$ref: '#/components/schemas/InventoryFlowStage'}}
        asOf: {type: string, format: date-time}
    InventoryTraceStep:
      type: object
      required: [key, title, status, detail]
      properties:
        key: {type: string}
        title: {type: string}
        status: {type: string, enum: [DONE, WAITING, BROKEN]}
        detail: {type: string}
        href: {type: string}
    InventoryTrace:
      type: object
      required: [steps, availableUnits, badges, deliveryDays]
      properties:
        atin: {type: string}
        sku: {type: string}
        title: {type: string}
        steps: {type: array, items: {$ref: '#/components/schemas/InventoryTraceStep'}}
        availableUnits: {type: [integer, 'null'], format: int64}
        storefrontPath: {type: string}
        badges: {type: array, items: {type: string}}
        deliveryDays: {type: [integer, 'null'], format: int64}
