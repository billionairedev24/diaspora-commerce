        zone: {type: string}
        routeStatus: {type: string}
        straightLineMiles: {type: number}
        roadMiles: {type: [number, 'null'], description: null when geo is down (ranked by straight line)}
        durationMinutes: {type: [number, 'null']}
        distanceMethod: {type: string, description: 'ROAD_GOOGLE, ROAD_OSRM, GEODESIC_DETOUR or STRAIGHT_LINE'}
        positionAt: {type: [string, 'null'], format: date-time}
        packagesOnRoute: {type: integer}
        capacityLeft: {type: integer}
    DriverSuggestions:
      type: object
