    SupportBooking:
      type: object
      required: [id, service, status, startsAt]
      properties:
        id: {type: string}
        service: {type: string}
        status: {type: string}
        startsAt: {type: string, format: date-time}
    AuditLine:
      type: object
      required: [at, actor, action, summary]
      properties:
        at: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string}
        summary: {type: string}
    SupportCustomer:
      type: object
      required: [id, name, email, enabled, emailVerified, roles]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        enabled: {type: boolean}
        emailVerified: {type: boolean}
