    get:
      tags: [Markets]
      operationId: listStaffPlaces
      security: [{sessionCookie: []}]
      summary: Browse geo's gazetteer for the location pickers (Markets and Pre-order areas)
      description: |
        No country → every country; country → its states / provinces (label = what the country calls them);
        country + region → its cities (q filters, limit at most 5000, total = matches before the limit). Needs VIEW on
        Markets or Pre-orders.
