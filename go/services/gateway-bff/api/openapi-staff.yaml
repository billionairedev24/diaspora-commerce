    get:
      tags: [Support]
      operationId: getSupportCustomer
      security: [{sessionCookie: []}]
      summary: Customer 360 — account, orders with shipments, bookings, claims, returns, notifications, cases and audit
      description: |
        identity `GET /v1/admin/users/{id}`; orders `GET /v1/admin/orders?customer=`; trust-ops `GET /v1/claims?orderId=`
        and `GET /v1/support-cases`; tax-returns `GET /v1/returns?orderId=`; notifications `GET /v1/notifications?recipient=`;
        trust-ops `GET /v1/audit/entries?entityId=`. Bookings have no staff lookup by customer yet (listed in
        `unavailable`). Sections whose upstream fails are empty and named in `unavailable`; the rest still renders.
      parameters: [{name: customerId, in: path, required: true, schema: {type: string, maxLength: 64}}]
      responses:
        '200': {description: Customer 360, content: {application/json: {schema: {$ref: '#/components/schemas/Customer360'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/support/refunds:
    post:
      tags: [Support]
      operationId: supportRefund
      security: [{sessionCookie: []}]
      summary: Refund a customer within the role's refund limit (claim decision or a partial refund)
      description: |
        `via: CLAIM` decides the customer's open claim with a refund (trust-ops `POST /v1/claims/{id}/decision`,
        disputes:manage). `via: ORDER` issues a partial refund without a return (tax-returns `POST /v1/refunds`,
        refunds:issue), spread over the order's lines. Amounts above the role's limit answer 403 `REFUND_LIMIT`. Both
        upstreams write the decision to the trust-ops audit log.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyRequired'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SupportRefundRequest'}}}
      responses:
        '200': {description: Refund issued, content: {application/json: {schema: {$ref: '#/components/schemas/SupportActionResult'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/support/notifications/{notificationId}/resend:
    post:
      tags: [Support]
      operationId: supportResendNotification
      security: [{sessionCookie: []}]
      summary: Resend a notification to the customer
      description: |
        Failed notifications are replayed (notifications `POST /v1/dead-letters/{id}/replay`); delivered ones are queued
        again from the same template (notifications `POST /v1/notifications`, notifications:send). Needs EDIT on support.
      parameters:
