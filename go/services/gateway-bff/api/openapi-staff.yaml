        creditCents: {type: [integer, 'null'], format: int64}
        freeDays: {type: [integer, 'null']}
        freeMonths: {type: [integer, 'null']}
        percentOff: {type: [number, 'null']}
        durationInvoices: {type: [integer, 'null']}
        remainingInvoices: {type: [integer, 'null'], description: 'Coupons: invoices still to discount'}
        gateMode: {type: [string, 'null'], enum: [START_AFTER, WAIVE_WHILE, WAIVE_UNTIL, null]}
        invoiceId: {type: [string, 'null']}
        status: {type: string, enum: [PENDING, APPLIED, FAILED]}
        reasonCode: {type: [string, 'null']}
        note: {type: [string, 'null']}
        summary: {type: string}
        actorId: {type: string}
        metric: {type: [string, 'null']}
        metricValue: {type: [integer, 'null'], format: int64}
        reference: {type: [string, 'null']}
        previousTrialEnd: {type: [string, 'null'], format: date-time}
        newTrialEnd: {type: [string, 'null'], format: date-time}
        attempts: {type: integer}
        lastError: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        appliedAt: {type: [string, 'null'], format: date-time}
    StaffBillingGrantPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/StaffBillingGrant'}}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}
    StaffBillingReasonCode:
      type: object
      required: [code, label]
      properties:
        code: {type: string}
        label: {type: string}
    StaffBillingOrgSearch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [orgId, name, kind, status]
            properties:
              orgId: {type: string}
              name: {type: string}
              kind: {type: string}
              status: {type: string}
    StaffBillingSubscription:
      type: object
      description: seller's Billing (cents).
      required: [orgId, planCode, planName, cadence, status, nextChargeLabel, cancelAtPeriodEnd, planVersion, creditBalanceCents]
      properties:
        orgId: {type: string}
        planCode: {type: string}
        planName: {type: string}
        cadence: {type: string, enum: [MONTHLY, QUARTERLY, ANNUAL]}
        status: {type: string}
        trialEndsAt: {type: [string, 'null'], format: date-time}
        currentPeriodEnd: {type: [string, 'null'], format: date-time}
        nextChargeAt: {type: [string, 'null'], format: date-time}
        nextChargeCents: {type: integer, format: int64}
        nextChargeLabel: {type: string}
        cancelAtPeriodEnd: {type: boolean}
        dunning: {type: [string, 'null']}
