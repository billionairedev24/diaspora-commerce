        orgId: {type: string}
        available: {type: boolean, description: The kill switch is on; the choice is offered and honoured}
        mode: {$ref: '#/components/schemas/StaffPlanFeeCollectionMode'}
        effective: {$ref: '#/components/schemas/StaffPlanFeeCollectionMode'}
        source: {type: string, enum: [DEFAULT, ONBOARDING, SELLER, STAFF]}
        changedAt: {type: [string, 'null'], format: date-time}
        changedBy: {type: [string, 'null']}
        platformDefault: {$ref: '#/components/schemas/StaffPlanFeeCollectionMode'}
        appliesFromInvoiceAt: {type: [string, 'null'], format: date-time, description: A change applies from the invoice of this date (the next renewal)}
        appliesFromLabel: {type: string}
        inProgressInvoiceId: {type: [string, 'null'], description: An invoice being collected now keeps the choice it was created with}
        history: {type: array, items: {$ref: '#/components/schemas/StaffPlanFeeCollectionChange'}}
