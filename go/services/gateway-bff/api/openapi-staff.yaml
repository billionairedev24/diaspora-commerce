        delivery-runs `GET /v1/preorders/{id}/exports/{file}` (preorders:export; audit event preorders.export.created),
        relayed without buffering. `orders-filtered.csv` takes the orders list's status / channel / q.
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: file, in: path, required: true, schema: {type: string, enum: [orders.csv, orders-filtered.csv, picking-list.csv, advertorial-report.csv]}}
        - {name: status, in: query, schema: {type: string, maxLength: 20}}
        - {name: channel, in: query, schema: {type: string, maxLength: 20}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
      responses:
        '200':
          description: CSV
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            text/csv: {schema: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/staff/preorders/{preorderId}/late-orders:
    post:
      tags: [Pre-orders]
      operationId: addStaffPreorderLateOrder
      security: [{sessionCookie: []}]
      summary: Add a late order for a customer (tagged Agent (late))
      description: |
        delivery-runs `POST /v1/preorders/{id}/late-orders` (preorders:late-add; APPROVE, EDIT or FULL on preorders),
        which creates the on-behalf order in orders-service (saved card charged off-session, or a pay-now link sent by
        SMS when lateAdd.paymentLink is allowed in the payment settings). Only while the window is CLOSED (or OPEN, as
        an assisted order); refused once DELIVERED. `Idempotency-Key` is required (422 without it): the console
        makes one when the dialog opens and reuses it on every retry, so a retry returns the same order and charges
        once. PAYMENT_LINK texts a pay-now link to AfroTransact's own pay page (never a Stripe-hosted page).
        409 when the same items were just added for the customer under another key.
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderLateOrder'}}}
      responses:
        '201': {description: Late order added, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderObject'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
