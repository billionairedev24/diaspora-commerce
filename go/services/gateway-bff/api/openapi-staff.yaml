        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Pre-orders]
      operationId: updateStaffPreorder
      security: [{sessionCookie: []}]
      summary: Edit a window (If-Match)
      description: delivery-runs `PUT /v1/preorders/{id}` (If-Match relayed; preorders:manage, EDIT).
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: If-Match, in: header, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderDraft'}}}
      responses:
        '200': {description: Saved, headers: {ETag: {description: 'Optimistic-lock version ("<version>"); send it back as If-Match', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Pre-orders]
      operationId: switchStaffPreorder
      security: [{sessionCookie: []}]
      summary: Switch one pre-order on or off
      description: |
        delivery-runs `PATCH /v1/preorders/{id} {active}` (preorders:manage, EDIT; If-Match relayed). Sets this
        window's own switch only; it is live when the master switch AND its own switch AND one of its areas are on
        (`switchState`: ON, PAUSED, GLOBAL_OFF, AREA_OFF, NOT_LIVE). Off stops the storefront exposure (resolution,
        banners, eligibility, the cart's pre-order packages); orders already placed are kept. On re-runs the publish
        checks. Idempotent; drafts and delivered windows answer 409.
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: If-Match, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
      responses:
        '200': {description: Switched, headers: {ETag: {description: 'Optimistic-lock version ("<version>")', schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/StaffPreorderWindow'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
        '503': {$ref: '#/components/responses/Problem'}
