components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: at_session
      description: Opaque BFF session id (HttpOnly, Secure, SameSite=Lax). Tokens stay server-side.
  parameters:
    Sort:
      name: sort
      in: query
      style: form
      explode: true
      description: |
        Sort column and direction, `<column>,asc|desc` (the Spring Data convention); repeat for secondary keys (at most
        3). Any column of the table. Empty cells sort last in both directions.
      schema:
        type: array
        maxItems: 3
        items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.]{0,79}(,(asc|desc|ASC|DESC))?$'}
    Resource:
      name: resource
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ResourceKey'}
    RecordId: {name: id, in: path, required: true, schema: {type: string, maxLength: 120}}
    ExportId: {name: exportId, in: path, required: true, schema: {type: string, maxLength: 64}}
    ShipmentId: {name: shipmentId, in: path, required: true, schema: {type: string, maxLength: 64}}
    PreorderId: {name: preorderId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}, description: Window id or code}
    CreativeSlot: {name: slot, in: path, required: true, schema: {type: string, enum: [HERO, PDP, STORY, FEED, EMAIL]}}
    TemplateKey: {name: key, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,119}$'}, example: order.confirmed}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}, description: Makes retries safe (same key = same result).}
    IdempotencyKeyRequired: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}, description: Same key = same refund; never refunds twice.}
    MarketCountryCode: {name: code, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
    MarketRegionCode: {name: region, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9]{1,10}$'}}
    IfMatch: {name: If-Match, in: header, required: false, schema: {type: string, maxLength: 40}, description: The version from the ETag (optimistic locking).}
    PlanCode: {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,39}$'}}
    BillingId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    BillingOrgId: {name: orgId, in: path, required: true, schema: {type: string, maxLength: 120}}
    BillingInvoiceId: {name: invoiceId, in: path, required: true, schema: {type: string, maxLength: 120}}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Validation failed; `errors` maps request properties to messages
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    # ── Plans & billing (S292–S297) ─────────────────────────────────────────
    StaffPlanEntitlements:
      type: object
      description: What the plan lets an organisation do (read from `limits`). A capability that is off is not offered to the plan's members.
      required: [listings, listingsUnlimited, aiListingWriter, lolaTier, bulkUpload, imageLibrary, coupons]
      properties:
        listings: {type: [integer, 'null'], format: int64, description: The most live listings; null = unlimited}
        listingsUnlimited: {type: boolean}
        aiListingWriter: {type: boolean}
        lolaTier: {type: string, enum: [NONE, ESSENTIALS, GROWTH, PRO], description: 'NONE = Lola is not included'}
        bulkUpload: {type: boolean}
        imageLibrary: {type: boolean}
        coupons: {type: boolean}
    StaffPlanVersionPrice:
      type: object
      required: [cadence, amountCents]
      properties:
        cadence: {type: string, enum: [MONTHLY, QUARTERLY, ANNUAL]}
        amountCents: {type: integer, format: int64}
    StaffPlanVersion:
      type: object
      required: [version, status, trialDays, subscribers, prices]
      properties:
        version: {type: integer}
        status: {type: string, enum: [DRAFT, PUBLISHED, SUPERSEDED]}
        trialDays: {type: integer}
        note: {type: [string, 'null']}
        createdBy: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
        publishedAt: {type: [string, 'null'], format: date-time}
        subscribers: {type: integer, format: int64}
        prices: {type: array, items: {$ref: '#/components/schemas/StaffPlanVersionPrice'}}
    StaffPlan:
      type: object
      description: A plan AfroTransact owns; prices are those of the current version (0 before the first publish).
      required: [code, kind, name, features, visibility, status, currentVersion, monthlyCents, quarterlyCents, annualCents, trialDays, rowVersion, subscribers, invites, versions]
      properties:
        code: {type: string}
        kind: {type: string, enum: [SELLER, PROVIDER]}
        name: {type: string}
        tagline: {type: [string, 'null']}
        features: {type: array, items: {type: string}}
        limits:
          type: object
          additionalProperties: {type: string}
          description: >-
            The plan's settings. `listings` (a number or `unlimited`), `bulkUpload`, `imageLibrary`, `coupons` and
            `aiListingWriter` (`true`/`false`) and `lolaTier` (`NONE`, `ESSENTIALS`, `GROWTH`, `PRO`) are the
            capabilities the platform enforces; any other key is shown as plan information. The plan's `features` list
            is derived from them (only what the plan allows is listed), whatever is sent. Charge terms are the keys
            `chargeFreeMonths` (months free first), `chargeThen` (`CHARGE`, `CHARGE_WHEN`: start charging once the condition
            is met, `WAIVE_WHILE`: free while it holds), `chargeMatch` (`ALL`/`ANY`), `chargeClauses`
            (`METRIC:amount,…` with METRIC one of GROSS_SALES (cents), COMPLETED_ORDERS, COMPLETED_BOOKINGS, ACTIVE_LISTINGS)
            and `chargeWindowMonths` (sales and orders counted over the last N months).
        entitlements: {$ref: '#/components/schemas/StaffPlanEntitlements'}
        chargeTerms: {type: string, description: 'What the plan charges, in words (free months and conditions), from its charge* limits'}
        visibility: {type: string, enum: [PUBLIC, HIDDEN, INVITE_ONLY]}
        status: {type: string, enum: [DRAFT, ACTIVE, RETIRED]}
        sortOrder: {type: integer}
        currentVersion: {type: integer}
        monthlyCents: {type: integer, format: int64}
        quarterlyCents: {type: integer, format: int64}
        annualCents: {type: integer, format: int64}
        trialDays: {type: integer}
        rowVersion: {type: integer, format: int64, description: 'Send back as expectedVersion to edit the metadata'}
        subscribers: {type: integer, format: int64}
        invites: {type: array, items: {type: string}}
        versions: {type: array, items: {$ref: '#/components/schemas/StaffPlanVersion'}}
    StaffPlanPrices:
      type: object
      description: A version's price per cadence in cents and its default trial.
      properties:
        monthlyCents: {type: integer, format: int64, minimum: 0}
        quarterlyCents: {type: integer, format: int64, minimum: 0}
        annualCents: {type: integer, format: int64, minimum: 0}
        trialDays: {type: integer, minimum: 0, maximum: 365}
        note: {type: [string, 'null'], maxLength: 500}
    StaffCreatePlanRequest:
      type: object
      required: [code, kind, name]
      properties:
        code: {type: string, pattern: '^[a-z][a-z0-9_]{2,39}$'}
        kind: {type: string, enum: [SELLER, PROVIDER]}
        name: {type: string, maxLength: 80}
        tagline: {type: [string, 'null'], maxLength: 120}
        features: {type: array, items: {type: string, maxLength: 120}, maxItems: 12}
        limits: {type: object, additionalProperties: {type: string}}
        visibility: {type: string, enum: [PUBLIC, HIDDEN, INVITE_ONLY]}
        sortOrder: {type: integer}
        prices: {$ref: '#/components/schemas/StaffPlanPrices'}
    StaffUpdatePlanRequest:
      type: object
      required: [name, expectedVersion]
      properties:
        name: {type: string, maxLength: 80}
        tagline: {type: [string, 'null'], maxLength: 120}
        features: {type: array, items: {type: string, maxLength: 120}, maxItems: 12}
        limits: {type: object, additionalProperties: {type: string}}
        visibility: {type: string, enum: [PUBLIC, HIDDEN, INVITE_ONLY]}
        sortOrder: {type: integer}
        expectedVersion: {type: integer, format: int64}
    StaffPlanInvitesRequest:
      type: object
      required: [orgIds]
      properties:
        orgIds: {type: array, items: {type: string}}
    StaffPlanMigrationRow:
      type: object
      required: [orgId, fromVersion, cadence, fromCents, toCents, status]
      properties:
        orgId: {type: string}
        orgName: {type: [string, 'null']}
        fromVersion: {type: integer}
        cadence: {type: string, enum: [MONTHLY, QUARTERLY, ANNUAL]}
        fromCents: {type: integer, format: int64}
        toCents: {type: integer, format: int64}
        status: {type: string}
        effectiveAt: {type: [string, 'null'], format: date-time, description: 'Their next renewal, when the new price first applies'}
    StaffPlanMigrationPreview:
      type: object
      required: [planCode, toVersion, rows]
      properties:
        planCode: {type: string}
        toVersion: {type: integer}
        rows: {type: array, items: {$ref: '#/components/schemas/StaffPlanMigrationRow'}}
    StaffPlanMigrationRequest:
      type: object
      properties:
        orgIds: {type: array, items: {type: string}, description: 'Empty or missing = every subscriber in the preview'}
    StaffPlanMigrationResult:
      type: object
      required: [planCode, toVersion, migrated, failed]
      properties:
        planCode: {type: string}
        toVersion: {type: integer}
        migrated: {type: array, items: {type: string}}
        failed:
          type: array
          items:
            type: object
            required: [orgId]
            properties:
              orgId: {type: string}
              error: {type: [string, 'null']}
    StaffTrialCampaign:
      type: object
      required: [id, name, trialDays, eligiblePlans, redemptions, status, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        promoCode: {type: [string, 'null']}
        trialDays: {type: integer}
        signupFrom: {type: [string, 'null'], format: date-time}
        signupTo: {type: [string, 'null'], format: date-time}
        kind: {type: [string, 'null'], enum: [SELLER, PROVIDER, null]}
        eligiblePlans: {type: array, items: {type: string}}
        maxRedemptions: {type: [integer, 'null']}
        redemptions: {type: integer}
        status: {type: string, enum: [ACTIVE, PAUSED, ENDED]}
        createdBy: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
        updatedBy: {type: [string, 'null']}
        updatedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, format: int64}
    StaffTrialCampaignRequest:
      type: object
      description: A promo code, a sign-up window, or both.
      required: [name, trialDays]
      properties:
        name: {type: string, maxLength: 120}
        promoCode: {type: [string, 'null'], maxLength: 40}
        trialDays: {type: integer, minimum: 1, maximum: 365}
        signupFrom: {type: [string, 'null'], format: date-time}
        signupTo: {type: [string, 'null'], format: date-time}
        kind: {type: [string, 'null'], enum: [SELLER, PROVIDER, null]}
        eligiblePlans: {type: array, items: {type: string}}
        maxRedemptions: {type: [integer, 'null'], minimum: 1}
        status: {type: [string, 'null'], enum: [ACTIVE, PAUSED, ENDED, null]}
        expectedVersion: {type: [integer, 'null'], format: int64}
    StaffBillingStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string}
    StaffRewardRule:
      type: object
      description: >-
        Reach (AT_LEAST) or stay under (LESS_THAN, S299) the threshold of a metric and get the reward, once per seller.
        A LESS_THAN rule, or an AT_LEAST rule with checkAtWindowEnd, is decided once, checkLeadHours before its window
        (the first withinDaysOfApproval days from windowAnchor) or the trial ends.
      required: [id, name, status, metric, threshold, comparison, windowAnchor, checkAtWindowEnd, checkLeadHours, rewardType, eligiblePlans, grantsCount, rewardLabel, conditionLabel, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, 'null']}
        status: {type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED]}
        kind: {type: [string, 'null'], enum: [SELLER, PROVIDER, null]}
        metric: {type: string, enum: [GROSS_SALES, ACTIVE_LISTINGS, COMPLETED_ORDERS, COMPLETED_BOOKINGS, DAYS_SINCE_APPROVAL]}
        threshold: {type: integer, format: int64, description: 'Cents for GROSS_SALES, a count otherwise'}
        windowDays: {type: [integer, 'null']}
        withinDaysOfApproval: {type: [integer, 'null'], description: The first N days from windowAnchor}
        comparison: {type: string, enum: [AT_LEAST, LESS_THAN]}
        windowAnchor: {type: string, enum: [APPROVAL, SUBSCRIPTION_START]}
        checkAtWindowEnd: {type: boolean, description: Decided once when the window closes (always for LESS_THAN)}
        checkLeadHours: {type: integer, minimum: 0, maximum: 168, description: Hours before the window (or the trial) ends that the check runs}
        rewardType: {type: string, enum: [FREE_DAYS, CREDIT, PERCENT_OFF]}
        freeDays: {type: [integer, 'null']}
        creditCents: {type: [integer, 'null'], format: int64}
        percentOff: {type: [number, 'null']}
        durationInvoices: {type: [integer, 'null']}
        eligiblePlans: {type: array, items: {type: string}}
        startsAt: {type: [string, 'null'], format: date-time}
        endsAt: {type: [string, 'null'], format: date-time}
        maxGrants: {type: [integer, 'null']}
        grantsCount: {type: integer}
        rewardLabel: {type: string, examples: ['1 month free']}
        conditionLabel: {type: string, examples: ['$1,000 in sales within 60 days of approval', 'less than $1,000 in sales in the first 30 days of the subscription']}
        createdBy: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
        updatedBy: {type: [string, 'null']}
        updatedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, format: int64}
    StaffRewardRuleRequest:
      type: object
      required: [name, metric, threshold, rewardType]
      properties:
        name: {type: string, maxLength: 120}
        description: {type: [string, 'null']}
        kind: {type: [string, 'null'], enum: [SELLER, PROVIDER, null]}
        metric: {type: string, enum: [GROSS_SALES, ACTIVE_LISTINGS, COMPLETED_ORDERS, COMPLETED_BOOKINGS, DAYS_SINCE_APPROVAL]}
        threshold: {type: integer, format: int64, minimum: 1}
        windowDays: {type: [integer, 'null'], minimum: 1}
        withinDaysOfApproval: {type: [integer, 'null'], minimum: 1, description: The first N days from windowAnchor (required for a rule checked at window end)}
        comparison: {type: [string, 'null'], enum: [AT_LEAST, LESS_THAN, null], description: Default AT_LEAST}
        windowAnchor: {type: [string, 'null'], enum: [APPROVAL, SUBSCRIPTION_START, null], description: Default APPROVAL}
        checkAtWindowEnd: {type: [boolean, 'null'], description: 'AT_LEAST only: decide once when the window closes'}
        checkLeadHours: {type: [integer, 'null'], minimum: 0, maximum: 168, description: Default 24}
        rewardType: {type: string, enum: [FREE_DAYS, CREDIT, PERCENT_OFF]}
        freeDays: {type: [integer, 'null'], minimum: 1, maximum: 365}
        creditCents: {type: [integer, 'null'], format: int64, minimum: 1}
        percentOff: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 100}
        durationInvoices: {type: [integer, 'null'], minimum: 1, maximum: 36}
        eligiblePlans: {type: array, items: {type: string}}
        startsAt: {type: [string, 'null'], format: date-time}
        endsAt: {type: [string, 'null'], format: date-time}
        maxGrants: {type: [integer, 'null'], minimum: 1}
        status: {type: [string, 'null'], enum: [DRAFT, ACTIVE, PAUSED, ENDED, null]}
        expectedVersion: {type: [integer, 'null'], format: int64}
        ruleId: {type: [string, 'null'], description: Preview only - marks who already got this rule}
    StaffRewardPreviewRow:
      type: object
      required: [orgId, value, threshold, percent, qualifies, alreadyGranted, status]
      properties:
        orgId: {type: string}
        orgName: {type: [string, 'null']}
        planCode: {type: [string, 'null']}
        value: {type: integer, format: int64}
        threshold: {type: integer, format: int64}
        percent: {type: integer, minimum: 0, maximum: 100}
        qualifies: {type: boolean}
        alreadyGranted: {type: boolean}
        reason: {type: [string, 'null']}
        status:
          type: string
          enum: [GRANTED, QUALIFIES, PENDING, CHECKED, NOT_YET, INELIGIBLE]
          description: PENDING - in the window of a rule checked at window end (decided when the window closes)
        checkAt: {type: [string, 'null'], format: date-time, description: Rules checked at window end - when this organisation is checked}
    StaffRewardPreview:
      type: object
      required: [evaluated, qualifying, pending, rows]
      properties:
        evaluated: {type: integer}
        qualifying: {type: integer}
        pending: {type: integer, description: Rules checked at window end - organisations still in their window}
        rows: {type: array, items: {$ref: '#/components/schemas/StaffRewardPreviewRow'}}
    StaffBillingGrant:
      type: object
