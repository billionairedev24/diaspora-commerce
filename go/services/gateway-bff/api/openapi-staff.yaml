  /v1/staff/preorders/{preorderId}/orders:
    get:
      tags: [Pre-orders]
      operationId: listStaffPreorderOrders
      security: [{sessionCookie: []}]
      summary: The window's orders (one search over every column, sort by any column)
      description: |
        delivery-runs `GET /v1/preorders/{id}/orders?status=&channel=&page=&size=`. delivery-runs searches order,
        customer, phone, address and ZIP only, so with `q` or `sort` the BFF reads the window's orders (up to 5,000),
        matches `q` against every column the table shows (order, customer, phone, email, address, city, ZIP, delivery
        note, placed, channel, tracking tag, units, fulfilment, total as text, status) and sorts and pages them itself;
        the page then also carries `sort` and `partial`. Export the table with `POST /v1/staff/exports`
        (`table: preorder-orders`, `parent: <preorderId>`).
      parameters:
        - {$ref: '#/components/parameters/PreorderId'}
        - {name: status, in: query, schema: {type: string, maxLength: 20}, description: 'PAID, LATE_ADD, CANCELLED'}
        - {name: channel, in: query, schema: {type: string, maxLength: 20}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: Search over every column}
        - {$ref: '#/components/parameters/Sort'}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
