      description: Sidebar modules; keys follow identity's platform module matrix (support, exports and notifications are derived; preorders follows the Pre-orders matrix column).
      enum: [dash, exports, orders, catalog, inventory, retail, dispatch, orgs, apps, support, rbac, payouts, fees, marketing, disputes, audit, markets, siteCfg, dev, notifications, preorders, plans]
    StaffUser:
      type: object
      required: [id, firstName, lastName, email, initials]
      properties:
        id: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        initials: {type: string}
    StaffRole:
      type: object
      required: [key, label]
      properties:
        key: {type: string, description: 'Platform role, e.g. platform.customer_support'}
        label: {type: string}
    StaffNavModule:
      type: object
      required: [key, label, description, level, badge]
      properties:
        key: {$ref: '#/components/schemas/StaffModuleKey'}
        label: {type: string}
        description: {type: string}
        level: {$ref: '#/components/schemas/AccessLevel'}
        badge: {type: [integer, 'null']}
    StaffNavGroup:
      type: object
      required: [key, label, modules]
      properties:
        key: {type: string, enum: [overview, commerce, partners, finance, growth, trust, settings]}
        label: {type: string}
        modules: {type: array, items: {$ref: '#/components/schemas/StaffNavModule'}}
    StaffSession:
      type: object
      required: [user, roles, roleLabel, permissions, navGroups, landing, accessNote, refundLimitMinor]
      properties:
        user: {$ref: '#/components/schemas/StaffUser'}
        roles: {type: array, items: {$ref: '#/components/schemas/StaffRole'}}
        roleLabel: {type: string}
        permissions: {type: array, items: {type: string}}
        navGroups: {type: array, items: {$ref: '#/components/schemas/StaffNavGroup'}}
        landing: {$ref: '#/components/schemas/StaffModuleKey'}
        accessNote: {type: string}
        refundLimitMinor:
          type: [integer, 'null']
          format: int64
          description: Largest refund the roles allow (null = no limit, 0 = may not refund)
    # ── dashboard
    ChartTone: {type: string, enum: [ink, gold, green, blue, red, grey]}
    ValueFormat: {type: string, enum: [money, count]}
    ChartSeries:
      type: object
      required: [key, label, tone]
      properties:
        key: {type: string}
        label: {type: string}
        tone: {$ref: '#/components/schemas/ChartTone'}
        format: {$ref: '#/components/schemas/ValueFormat'}
    ChartRow:
      type: object
      required: [category, values]
      properties:
        category: {type: string}
        values:
          type: object
          additionalProperties: {type: number}
    ChartSpec:
      type: object
      required: [id, title, kind, categoryLabel, valueFormat, series, rows, available]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {type: string, enum: [trend, hbar, donut, stack]}
        categoryLabel: {type: string}
        valueFormat: {$ref: '#/components/schemas/ValueFormat'}
        series: {type: array, items: {$ref: '#/components/schemas/ChartSeries'}}
        rows: {type: array, items: {$ref: '#/components/schemas/ChartRow'}}
        available: {type: boolean}
    Kpi:
      type: object
      required: [label, value, detail, tone]
      properties:
        label: {type: string}
        value: {type: string}
        detail: {type: string}
        tone: {type: string, enum: [positive, attention, neutral]}
    StaffAssistantStatus:
      type: object
      required: [dailyMessages, used, remaining, tools]
      properties:
        dailyMessages: {type: integer}
        used: {type: integer}
        remaining: {type: integer}
        tools: {type: array, items: {type: string}}
    StaffAssistantReply:
      type: object
      required: [answer, steps, links, status]
      properties:
        answer: {type: string}
        steps:
          type: array
          description: What she looked up ("Checking the dashboard")
          items:
            type: object
            required: [tool, label]
            properties:
              tool: {type: string}
              label: {type: string}
        links:
          type: array
          description: Records she points at; the console opens one when the member taps its button
          items:
            type: object
            required: [label, resource, id]
            properties:
              label: {type: string}
              resource: {type: string}
              id: {type: string}
        status: {$ref: '#/components/schemas/StaffAssistantStatus'}
    StaffDashboard:
      type: object
      required: [rangeDays, generatedAt, kpis, charts]
      properties:
        rangeDays: {type: integer}
        generatedAt: {type: string, format: date-time}
        kpis: {type: array, items: {$ref: '#/components/schemas/Kpi'}}
        charts: {type: array, items: {$ref: '#/components/schemas/ChartSpec'}}
    # ── resources
    ResourceKey:
      type: string
      enum: [users, roles, applications, organisations, connect-accounts, orders, products, moderation, claims, returns, payouts, inventory, purchase-orders,
        routes, support-cases, audit, markets, site-settings, legal-documents, help-articles, privacy-requests, announcements,
        placements, identity-providers, fee-schedules, tax-rates, tax-codes, tax-rules, tax-review, dispatch-shipments, sos-alerts, vehicle-defects,
        driver-events, pickup-locations, coupons, reconciliation, reconciliation-runs, ledger-adjustments, stripe-lookup, payment-settings, tax-settings]
    Tone: {type: string, enum: [good, warn, bad, info, brand]}
    CellValue:
      type: [string, number, 'null']
    ColumnKind: {type: string, enum: [text, strong, mono, money, number, date, datetime, status, percent]}
    Column:
      type: object
      required: [key, label, kind, width]
      properties:
        key: {type: string}
        label: {type: string}
        kind: {$ref: '#/components/schemas/ColumnKind'}
        width: {type: integer, minimum: 1, maximum: 100, description: Share of the table width in percent (the table sizes columns from it; people may resize them)}
        sortable: {type: boolean, description: 'The column accepts `sort=<key>,asc|desc` (every column of a server-driven table)'}
    Facet:
      type: object
      required: [value, label]
      properties:
        value: {type: string}
        label: {type: string}
    ResourceRow:
      type: object
      required: [id, cells, tone]
      properties:
        id: {type: string}
        cells:
          type: object
          additionalProperties: {$ref: '#/components/schemas/CellValue'}
        tone: {oneOf: [{$ref: '#/components/schemas/Tone'}, {type: 'null'}]}
    FieldOption:
      type: object
      required: [value, label]
      properties:
        value: {type: string}
        label: {type: string}
    FieldValue:
      oneOf:
        - {type: string}
        - {type: number}
        - {type: boolean}
        - {type: array, items: {type: string}}
        - {type: 'null'}
    FormField:
      type: object
      required: [key, label, type, required]
      properties:
        key: {type: string}
        label: {type: string}
        type: {type: string, enum: [text, textarea, number, money, select, multiselect, toggle, date, datetime, email, password]}
        required: {type: boolean}
        options: {type: array, items: {$ref: '#/components/schemas/FieldOption'}}
        min: {type: number}
        max: {type: number}
        maxLength: {type: integer}
        pattern: {type: string, description: ECMAScript regular expression the value must match}
        help: {type: string}
        placeholder: {type: string}
        value: {$ref: '#/components/schemas/FieldValue'}
    Form:
      type: object
      required: [title, submitLabel, fields]
      properties:
        title: {type: string}
        submitLabel: {type: string}
        intro: {type: string, description: 'What submitting does, in a sentence or two (shown above the fields)'}
        fields: {type: array, items: {$ref: '#/components/schemas/FormField'}}
    ResourcePage:
      type: object
      required: [resource, title, columns, rows, page, size, total, nextCursor, hasNext, facets, searchable, canCreate, createForm, exportable, sort, partial]
      properties:
        resource: {$ref: '#/components/schemas/ResourceKey'}
        title: {type: string}
        columns: {type: array, items: {$ref: '#/components/schemas/Column'}}
        rows: {type: array, items: {$ref: '#/components/schemas/ResourceRow'}}
        page: {type: integer}
        size: {type: integer}
        total: {type: [integer, 'null'], description: Rows matching the filters (null when the upstream pages with cursors)}
        nextCursor: {type: [string, 'null']}
        hasNext: {type: boolean}
        facets: {type: array, items: {$ref: '#/components/schemas/Facet'}}
        searchable: {type: boolean}
        searchPlaceholder: {type: string}
        canCreate: {type: boolean}
        createForm: {oneOf: [{$ref: '#/components/schemas/Form'}, {type: 'null'}]}
        exportable: {type: boolean}
        sort: {type: array, items: {type: string}, description: 'The applied sort (`<column>,asc|desc`); empty for the upstream order'}
        partial: {type: boolean, description: 'The search or sort covered the first 5,000 rows of a bigger table'}
    DetailField:
      type: object
      required: [label, value, kind]
      properties:
        label: {type: string}
        value: {type: string}
        kind: {type: string, enum: [text, mono, money, date, datetime, status, link, image]}
        href: {type: string}
    DetailSection:
      type: object
      required: [title, fields]
      properties:
        title: {type: string}
        fields: {type: array, items: {$ref: '#/components/schemas/DetailField'}}
    DetailTable:
      type: object
      required: [title, columns, rows]
      properties:
        title: {type: string}
        columns: {type: array, items: {$ref: '#/components/schemas/Column'}}
        rows: {type: array, items: {$ref: '#/components/schemas/ResourceRow'}}
    ActivityEntry:
      type: object
      required: [at, actor, text]
      properties:
        at: {type: string, format: date-time}
        actor: {type: string}
        text: {type: string}
    Note:
      type: object
      required: [id, at, author, text]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        author: {type: string}
        text: {type: string}
    RecordAction:
      type: object
      required: [key, label, tone, allowed, reason, permission, confirm, form]
      properties:
        key: {type: string}
        label: {type: string}
        tone: {type: string, enum: [primary, neutral, danger]}
        allowed: {type: boolean}
        reason: {type: [string, 'null'], description: 'Why the action is disabled: missing permission, wrong state or the step-one reviewer'}
        permission: {type: string, description: Permission the upstream checks}
        confirm: {type: [string, 'null'], description: Confirmation question for actions without a form}
        form: {oneOf: [{$ref: '#/components/schemas/Form'}, {type: 'null'}]}
    RecordLink:
      type: object
      required: [label, href]
      properties:
        label: {type: string}
        href: {type: string, description: 'Console path, for example /support?customer=… or /orders?open=AT-…, or (external) a same-origin BFF path'}
        external: {type: boolean, description: 'Open in a new tab (an uploaded document the reviewer reads)'}
    RecordDetail:
      type: object
      required: [resource, id, title, subtitle, status, tone, sections, tables, activity, notes, notesEnabled, actions, editForm, links, version]
      properties:
        resource: {$ref: '#/components/schemas/ResourceKey'}
        id: {type: string}
        title: {type: string}
        subtitle: {type: string}
        status: {type: [string, 'null']}
        tone: {oneOf: [{$ref: '#/components/schemas/Tone'}, {type: 'null'}]}
        sections: {type: array, items: {$ref: '#/components/schemas/DetailSection'}}
        tables: {type: array, items: {$ref: '#/components/schemas/DetailTable'}}
        activity: {type: array, items: {$ref: '#/components/schemas/ActivityEntry'}}
        notes: {type: array, items: {$ref: '#/components/schemas/Note'}}
        notesEnabled: {type: boolean}
        actions: {type: array, items: {$ref: '#/components/schemas/RecordAction'}}
        editForm: {oneOf: [{$ref: '#/components/schemas/Form'}, {type: 'null'}]}
        links: {type: array, items: {$ref: '#/components/schemas/RecordLink'}}
        version: {type: [string, 'null'], description: Optimistic-locking version to send back with edits}
        removed: {type: boolean, description: Set when an action deleted the record; the console closes the sheet}
    RecordValues:
      type: object
      properties:
        values:
          type: object
          additionalProperties: {$ref: '#/components/schemas/FieldValue'}
        version: {type: [string, 'null']}
    NoteRequest:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
    # ── exports
    ExportFormat:
      type: string
      enum: [csv, xlsx, pdf]
      description: |
        csv: the data only (CSV cannot carry charts). xlsx: a "Summary" sheet (first) with key totals and native Excel
        charts over small aggregate tables, plus a "Data" sheet (typed cells, frozen header, an Excel table with
        filters). pdf: a summary page with the same charts and totals, then the table in landscape with the header
        repeated on every page (at most 10,000 table rows; the summary covers every row). Charts follow the column
        kinds: rows by status (pie, bar past six values), the first amount (or rows) by day or month (line), the top 10
        rows by amount (bar), rows by a low-cardinality text column (bar).
    ExportColumn:
      type: object
      required: [key, label, kind]
      properties:
        key: {type: string, maxLength: 80}
        label: {type: string, minLength: 1, maxLength: 80}
        kind: {$ref: '#/components/schemas/ColumnKind'}
    ExportDataset:
      type: object
      description: A client-side table (small lists the console holds in full) exported as shown, through the same pipeline.
      required: [table, columns, rows]
      properties:
        table: {type: string, pattern: '^[a-z0-9-]{1,60}$', description: The table's key (file name)}
        title: {type: string, maxLength: 120}
        scope: {type: string, maxLength: 200, description: 'Which rows are in the file, e.g. "Search “lagos” · 3 selected rows"'}
        columns: {type: array, minItems: 1, maxItems: 40, items: {$ref: '#/components/schemas/ExportColumn'}}
        rows:
          type: array
          maxItems: 5000
          description: One array per row, one cell per column; money in currency units, dates as ISO strings.
          items: {type: array, items: {type: [string, number, boolean, 'null']}}
    ExportRequest:
      type: object
      description: |
        A server table (`resource`, or `table` + `parent`) with its search, sort and visible columns, optionally only the
        selected rows (`ids`); or a client-side table (`dataset`). One of `resource`, `table` and `dataset` is required.
      required: [format]
      properties:
        resource: {$ref: '#/components/schemas/ResourceKey'}
        table: {type: string, enum: [preorder-orders], description: A staff table outside the resources (with `parent`)}
        parent: {type: string, maxLength: 64, description: 'The record the table belongs to (the pre-order window of `preorder-orders`)'}
        format: {$ref: '#/components/schemas/ExportFormat'}
        q: {type: string, maxLength: 120, description: The table's search (every column)}
        status: {type: string, maxLength: 60}
        sort: {type: array, maxItems: 3, items: {type: string, maxLength: 90}, description: 'The table''s sort (`<column>,asc|desc`)'}
        ids: {type: array, maxItems: 1000, items: {type: string, maxLength: 200}, description: Only these rows (the selection); search and sort still apply}
        columns: {type: array, maxItems: 40, items: {type: string, maxLength: 80}, description: The visible columns in order (default every column)}
        dataset: {$ref: '#/components/schemas/ExportDataset'}
    ExportJob:
      type: object
      required: [id, resource, title, format, status, rows, async, fileName, createdAt, finishedAt, expiresAt, downloadUrl, error]
      properties:
        id: {type: string}
        resource: {type: string, description: The table exported (a resource key or a client-side table's key)}
        title: {type: string, description: The table's name}
        format: {$ref: '#/components/schemas/ExportFormat'}
        status: {type: string, enum: [QUEUED, RUNNING, READY, FAILED, EXPIRED]}
        rows: {type: integer, description: Rows written so far}
        async: {type: boolean, description: 'Built in the background (more than 5,000 rows)'}
        fileName: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time, description: The download link stops working at this time (24 hours after READY)}
        downloadUrl: {type: [string, 'null'], description: Console-relative download path (redirects to the signed URL)}
        error: {type: [string, 'null']}
    ExportJobList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ExportJob'}}
    # ── support
    CustomerHit:
      type: object
      required: [id, name, email, enabled, principalType]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        enabled: {type: boolean}
        principalType: {type: string}
    CustomerSearch:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CustomerHit'}}
    SupportShipment:
      type: object
      required: [id, label, status, sellerName, carrier, trackingNumber, cancellable, totalMinor]
      properties:
        id: {type: string}
        label: {type: string}
        status: {type: string}
        sellerName: {type: string}
        carrier: {type: [string, 'null']}
        trackingNumber: {type: [string, 'null']}
        cancellable: {type: boolean}
        totalMinor: {type: integer, format: int64}
    SupportOrder:
      type: object
      required: [id, orderNumber, status, placedAt, totalMinor, currency, shipments]
      properties:
        id: {type: string}
        orderNumber: {type: string}
        status: {type: string}
        placedAt: {type: string, format: date-time}
        totalMinor: {type: integer, format: int64}
        currency: {type: string}
        shipments: {type: array, items: {$ref: '#/components/schemas/SupportShipment'}}
    SupportClaim:
      type: object
      required: [id, reference, type, status, orderNumber, amountMinor, refundMinor, open]
      properties:
        id: {type: string}
        reference: {type: string}
        type: {type: string}
        status: {type: string}
        orderNumber: {type: string}
        amountMinor: {type: integer, format: int64}
        refundMinor: {type: [integer, 'null'], format: int64}
        open: {type: boolean}
    SupportReturn:
      type: object
      required: [id, number, status, orderNumber, refundState, estimateMinor]
      properties:
        id: {type: string}
        number: {type: string}
        status: {type: string}
        orderNumber: {type: string}
        refundState: {type: [string, 'null']}
        estimateMinor: {type: integer, format: int64}
    SupportNotification:
      type: object
      required: [id, channel, templateKey, subject, status, address, createdAt]
      properties:
        id: {type: string}
        channel: {type: string}
        templateKey: {type: string}
        subject: {type: [string, 'null']}
        status: {type: string}
        address: {type: string}
        createdAt: {type: string, format: date-time}
    SupportCaseSummary:
      type: object
      required: [id, reference, reason, summary, status, openedAt]
      properties:
        id: {type: string}
        reference: {type: string}
        reason: {type: string}
        summary: {type: string}
        status: {type: string}
        openedAt: {type: string, format: date-time}
    SupportBooking:
      type: object
      required: [id, service, status, startsAt]
      properties:
        id: {type: string}
        service: {type: string}
        status: {type: string}
        startsAt: {type: string, format: date-time}
    AuditLine:
      type: object
      required: [at, actor, action, summary]
      properties:
        at: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string}
        summary: {type: string}
    SupportCustomer:
      type: object
      required: [id, name, email, enabled, emailVerified, roles]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        enabled: {type: boolean}
        emailVerified: {type: boolean}
        roles: {type: array, items: {type: string}}
    SupportPermissions:
      type: object
      required: [refund, resend, cancelShipment]
      properties:
        refund: {type: boolean}
        resend: {type: boolean}
        cancelShipment: {type: boolean}
    Customer360:
      type: object
      required: [customer, orders, bookings, claims, returns, notifications, cases, audit, refundLimitMinor, can, unavailable]
      properties:
        customer: {$ref: '#/components/schemas/SupportCustomer'}
        orders: {type: array, items: {$ref: '#/components/schemas/SupportOrder'}}
        bookings: {type: array, items: {$ref: '#/components/schemas/SupportBooking'}}
        claims: {type: array, items: {$ref: '#/components/schemas/SupportClaim'}}
        returns: {type: array, items: {$ref: '#/components/schemas/SupportReturn'}}
        notifications: {type: array, items: {$ref: '#/components/schemas/SupportNotification'}}
        cases: {type: array, items: {$ref: '#/components/schemas/SupportCaseSummary'}}
        audit: {type: array, items: {$ref: '#/components/schemas/AuditLine'}}
        refundLimitMinor: {type: [integer, 'null'], format: int64}
        can: {$ref: '#/components/schemas/SupportPermissions'}
        unavailable: {type: array, items: {type: string}, description: Upstreams that could not answer (their sections are empty)}
    SupportRefundRequest:
      type: object
      required: [customerId, orderNumber, amountMinor, reason, via]
      properties:
        customerId: {type: string}
        orderNumber: {type: string, minLength: 1}
        amountMinor: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 3, maxLength: 500}
        via: {type: string, enum: [CLAIM, ORDER]}
        claimId: {type: string, description: Required with via CLAIM}
        caseId: {type: string, description: Support case the refund resolves (optional)}
    SupportResendRequest:
      type: object
      required: [customerId]
      properties:
        customerId: {type: string}
        caseId: {type: string}
    SupportCancelRequest:
      type: object
      required: [customerId, orderNumber, reason]
      properties:
        customerId: {type: string}
        orderNumber: {type: string, minLength: 1}
        reason: {type: string, minLength: 3, maxLength: 500}
        caseId: {type: string}
    SupportActionResult:
      type: object
      required: [ok, message, reference, audited]
      properties:
        ok: {type: boolean}
        message: {type: string}
        reference: {type: [string, 'null'], description: 'Refund, notification or shipment reference'}
        audited: {type: boolean, description: The upstream records the action in the trust-ops audit log}
    # ── fees & commissions
    FeeLimits:
      type: object
      description: Bounds the editor enforces (rates in basis points, amounts in minor units)
      required: [commissionMaxBps, cardPctMaxBps, cardFixedMaxMinor, fbaPerUnitMaxMinor, noteMinLength, noteMaxLength, maxCategoryRates, maxOverrides,
        deliveryMaxRadiusMiles, deliveryAmountMaxMinor, deliveryMaxBands, maxDeliveryOverrides]
      properties:
        commissionMaxBps: {type: integer, examples: [5000]}
        cardPctMaxBps: {type: integer, examples: [1000]}
        cardFixedMaxMinor: {type: integer, format: int64, examples: [1000]}
        fbaPerUnitMaxMinor: {type: integer, format: int64, examples: [10000]}
        noteMinLength: {type: integer}
        noteMaxLength: {type: integer}
        maxCategoryRates: {type: integer}
        maxOverrides: {type: integer}
        deliveryMaxRadiusMiles: {type: number, examples: [200], description: Largest AfroTransact Delivery service radius payments accepts}
        deliveryAmountMaxMinor: {type: integer, format: int64, examples: [10000], description: 'Largest delivery amount: fee, base, per mile, band, min or max'}
        deliveryMaxBands: {type: integer, examples: [20]}
        maxDeliveryOverrides: {type: integer, examples: [500]}
    FeeCategory:
      type: object
      required: [key, label, source]
      properties:
        key: {type: string, description: 'payments category key (lower-case), e.g. groceries'}
        label: {type: string}
        source: {type: string, enum: [TAXONOMY, SCHEDULE, PLATFORM], description: 'TAXONOMY: a catalog department; SCHEDULE: only known from a fee schedule; PLATFORM: services'}
    FeeCategoryRate:
      type: object
      required: [category, label, commissionBps]
      properties:
        category: {type: string}
        label: {type: string}
        commissionBps: {type: integer, minimum: 0, maximum: 10000}
    FeeOverride:
      type: object
      required: [orgId, orgName, category, categoryLabel, commissionBps]
      properties:
        orgId: {type: string}
        orgName: {type: [string, 'null']}
        category: {type: [string, 'null'], description: null = every category}
        categoryLabel: {type: string}
        commissionBps: {type: integer, minimum: 0, maximum: 10000}
    FeeScheduleView:
      type: object
      required: [id, version, status, effectiveFrom, currency, defaultCommissionBps, categoryRates, overrides, cardPctBps, cardFixedMinor, fbaPerUnitMinor,
