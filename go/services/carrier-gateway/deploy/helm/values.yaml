# Base values for carrier-gateway. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: carrier-gateway
  runtime: go
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: carrier-gateway
  tag: dev   # sentinel for local renders; the deploy pipeline writes the git sha into values-<env>.yaml
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {memory: 256Mi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/carrier-gateway in the cloud secret store:
#   - DB_URL
#   - REDIS_URL
#   - USPS_CLIENT_ID
#   - USPS_CLIENT_SECRET
#   - USPS_PAYMENT_TOKEN
#   - UPS_CLIENT_ID
#   - UPS_CLIENT_SECRET
#   - UPS_ACCOUNT
#   - UPS_WEBHOOK_CREDENTIAL
#   - FEDEX_CLIENT_ID
#   - FEDEX_CLIENT_SECRET
#   - FEDEX_ACCOUNT
#   - FEDEX_WEBHOOK_SECRET
#   - DHL_USERNAME
#   - DHL_PASSWORD
#   - DHL_ACCOUNT
#   - DHL_WEBHOOK_SECRET
#   - S3_ACCESS_KEY_ID
#   - S3_SECRET_ACCESS_KEY
secrets:
  enabled: true
  store: platform-secrets
  keySeparator: "/"     # "-" on GCP Secret Manager and Azure Key Vault (set in platform-values.yaml)
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv: {}
nodeSelector: {}
tolerations: []
