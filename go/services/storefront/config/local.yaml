# storefront · local. Limits mirror Backoffice › Storefront settings; plan codes come from the seller service.
port: 8206
docsEnabled: true
databaseUrl: postgres://storefront:storefront@localhost:5432/storefront
publicBaseUrl: http://localhost:3000
maxSections: 10
maxFeatured: 6
maxTagline: 120
plans:
  starter: {maxGallery: 6}
  growth: {maxGallery: 12}
  pro: {maxGallery: 24}
auth:
  enabled: false
  issuer: http://localhost:8100
  audience: storefront
telemetry:
  otlpEndpoint: localhost:4318
  sampleRatio: 1.0
