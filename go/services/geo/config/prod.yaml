# geo · prod. DB_URL, GOOGLE_PLACES_API_KEY, SMARTY_AUTH_ID/TOKEN come from the environment.
port: 8080
docsEnabled: false
databaseUrl: ""
providers: [google-places, osm-nominatim]
reverseProviders: [google-geocoding, osm-nominatim]
routing:
  providers: [google, osrm]   # each enabled only with GOOGLE_MAPS_API_KEY / OSRM_URL
  timeout: 2s
  cacheTtl: 24h
  cachePrecisionMeters: 50
  cacheMaxEntries: 50000
  detourFactor: 1.3
  fallbackSpeedMph: 25
nominatim:
  url: https://nominatim.openstreetmap.org
  userAgent: AfroTransact/1.0 (platform@afrotransact.com)
auth:
  enabled: true
  issuer: https://auth.afrotransact.com
  audience: geo
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampleRatio: 0.1
