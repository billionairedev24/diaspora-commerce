# indexer · prod. ES_URLS / KAFKA_BOOTSTRAP / ES_API_KEY come from the environment outside local and dev;
# INDEXER_CLIENT_SECRET (identity client indexer-service) always comes from the environment.
port: 8080
docsEnabled: false
market: us
kafka:
  brokers: []
  group: indexer
  topics: [at.product.events, at.inventory.events, at.offers.events, at.seller-org.events]
elasticsearch:
  urls: []
  refresh: false
synonymsSet: diaspora-synonyms
catalogUrl: http://catalog
sellerNames:
  org_afrotransact_retail: AfroTransact Retail
# Shared AUTH_ISSUER_URL (Helm library); the seller directory token endpoint is <authIssuer>/oauth2/token
# unless AUTH_TOKEN_URL / sellerDirectory.tokenUrl is set.
authIssuer: https://auth.afrotransact.com
sellerDirectory:
  enabled: true
  baseUrl: http://seller
  clientId: indexer-service
  scopes: ["sellers:directory"]
  pageSize: 500
  warmTimeout: 30s
  refreshInterval: 30m
# S036: every product document carries an embedding of its text for hybrid search (ai-gateway, client
# indexer-service with scope ai:use). Failures never block indexing; the backfill fills missing vectors.
embeddings:
  enabled: true
  baseUrl: http://ai-gateway:8080
  timeout: 5s
  scopes: ["ai:use"]
  cacheSize: 10000
  backfillInterval: 15m
  backfillBatch: 100
retry:
  attempts: 4
  backoffMs: 250
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampleRatio: 0.1
