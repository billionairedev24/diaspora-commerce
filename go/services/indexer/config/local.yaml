# indexer · local. ES_URLS / KAFKA_BOOTSTRAP / ES_API_KEY come from the environment outside local and dev;
# INDEXER_CLIENT_SECRET (identity client indexer-service) always comes from the environment.
port: 8202
docsEnabled: true
market: us
kafka:
  brokers: [localhost:9092]
  group: indexer
  topics: [at.product.events, at.inventory.events, at.seller-org.events]
elasticsearch:
  urls: [http://localhost:9200]
  refresh: true
synonymsSet: diaspora-synonyms
catalogUrl: http://localhost:8101
sellerNames:
  org_afrotransact_retail: AfroTransact Retail
sellerDirectory:
  enabled: true
  baseUrl: http://localhost:8106
  tokenUrl: ""
  clientId: indexer-service
  scopes: ["sellers:directory"]
  pageSize: 500
  warmTimeout: 30s
  refreshInterval: 30m
# S036: every product document carries an embedding of its text for hybrid search (ai-gateway, client
# indexer-service with scope ai:use). Failures never block indexing; the backfill fills missing vectors.
embeddings:
  enabled: false
  baseUrl: http://localhost:8113
  timeout: 5s
  scopes: ["ai:use"]
  cacheSize: 10000
  backfillInterval: 15m
  backfillBatch: 100
retry:
  attempts: 4
  backoffMs: 250
telemetry:
  otlpEndpoint: localhost:4318
  sampleRatio: 1.0
