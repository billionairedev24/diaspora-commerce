# Base values for indexer. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: indexer
  runtime: go
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: indexer
  tag: dev   # sentinel for local renders; the deploy pipeline writes the git sha into values-<env>.yaml
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {memory: 256Mi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/indexer in the cloud secret store:
#   - ES_URLS
#   - ES_API_KEY
#   - KAFKA_BOOTSTRAP
#   - INDEXER_CLIENT_SECRET    (identity client indexer-service, scopes sellers:directory and ai:use)
secrets:
  enabled: true
  store: platform-secrets
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
# One-off rebuild of the search index from catalog, offers and inventory (`indexer reindex`; docs/runbooks/kafka-replay.md
# section 5). Off by default. When on, a SUSPENDED CronJob indexer-reindex is rendered: it never runs by itself, an
# operator starts a run with `kubectl -n <ns> create job indexer-reindex-$(date +%s) --from=cronjob/indexer-reindex`.
# It uses this chart's image, configuration and secrets (MEILISEARCH_URL / MEILISEARCH_API_KEY or ES_*,
# INDEXER_CLIENT_SECRET) and the in-cluster http://catalog, http://offers and http://inventory.
reindex:
  enabled: false
  args: []                    # extra flags for `indexer reindex`, for example ["--since", "48h"]
  activeDeadlineSeconds: 21600  # a run is killed after 6 h; a re-run continues idempotently
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
extraEnv: {}
nodeSelector: {}
tolerations: []
