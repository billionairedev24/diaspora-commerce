env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
resources:
  requests: {cpu: 25m, memory: 48Mi}
  limits: {memory: 160Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint (docs/engineering/cloud-cost.md)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  SEARCH_PROVIDER: meilisearch   # Meilisearch on Layerbase; MEILISEARCH_URL / MEILISEARCH_API_KEY come from the secret store
