env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
resources:
  requests: {cpu: 25m, memory: 48Mi}
  limits: {memory: 160Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint (docs/engineering/cloud-cost.md)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  SEARCH_PROVIDER: meilisearch   # Meilisearch in the cluster (infra/k8s/platform/lean/data); MEILISEARCH_URL / MEILISEARCH_API_KEY come from the service Secret
# Renders the SUSPENDED CronJob indexer-reindex (it never runs by itself). Rebuild the index after the first catalog data or after losing the
# Meilisearch disk: kubectl -n afrotransact-prod create job reindex-$(date +%s) --from=cronjob/indexer-reindex (docs/runbooks/ovh-production.md).
reindex:
  enabled: true
