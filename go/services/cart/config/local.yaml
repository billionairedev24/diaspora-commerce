# cart · local. DB_URL and REDIS_URL come from the environment outside local.
port: 8203
docsEnabled: true
databaseUrl: postgres://cart:cart@localhost:5432/cart
redisUrl: redis://localhost:6379/0
guestTtlDays: 30
catalogUrl: http://localhost:8101
inventoryUrl: http://localhost:8103
offersUrl: http://localhost:8102
retailOrgId: org_afrotransact_retail
sellerNames: {}
# S272 pre-orders: delivery-runs eligibility with the cart-service client (scope delivery-runs:reserve).
deliveryRuns:
  url: http://localhost:8115
  tokenUrl: http://localhost:8100/oauth2/token
  clientId: cart-service
  clientSecret: "local-cart-service-secret"
auth:
  enabled: false
  issuer: http://localhost:8100
  audience: cart
telemetry:
  otlpEndpoint: localhost:4318
  sampleRatio: 1.0
