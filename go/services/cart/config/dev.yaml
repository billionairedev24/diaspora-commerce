# cart · dev. DB_URL and REDIS_URL come from the environment outside local.
port: 8080
docsEnabled: true
databaseUrl: ""
redisUrl: ""
guestTtlDays: 30
catalogUrl: http://catalog
inventoryUrl: http://inventory
offersUrl: http://offers
retailOrgId: org_afrotransact_retail
sellerNames: {}
# S272 pre-orders: delivery-runs eligibility with the cart-service client (scope delivery-runs:reserve).
deliveryRuns:
  url: http://delivery-runs
  tokenUrl: http://identity/oauth2/token
  clientId: cart-service
  clientSecret: ""
auth:
  enabled: true
  issuer: https://auth.dev.afrotransact.com
  audience: cart
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampleRatio: 1.0
