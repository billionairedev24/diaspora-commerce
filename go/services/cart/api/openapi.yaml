openapi: 3.1.0
info:
  title: Cart API
  version: v1
  description: |
    Shopping cart split into packages per seller and fulfilment type (AfroTransact Delivery also per seller pickup
    location), with save-for-later and guest-to-customer
    merge on sign-in. Quantities are always capped by live sellable stock from inventory; prices are snapshotted
    when a line is added and the live price is shown with a `priceChanged` flag. Lines without a live offer or stock
    are marked `unavailable` and excluded from checkout. A line can name an offers-service offer (`offerId`, e.g. a
    seller from "Other sellers on AfroTransact"): its seller, price and stock then come from the offers service and
    the line becomes unavailable as soon as the offer is no longer buyable. Guests are identified by the `X-Guest-Cart` header, which
    the service issues on first use; signed-in customers by their access token.
servers:
  - {url: 'http://localhost:8203', description: local}
  - {url: 'https://api.dev.afrotransact.com/cart', description: dev}
  - {url: 'https://api.uat.afrotransact.com/cart', description: uat}
  - {url: 'https://api.afrotransact.com/cart', description: prod}
security: [{}, {bearer: []}]
tags:
  - {name: Cart, description: The shopper's cart and saved-for-later lines (guests and signed-in customers)}
  - {name: Checkout, description: Service-to-service cart maintenance after an order is placed}
paths:
  /v1/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: View the cart (packages per seller, saved lines, totals)
      parameters: [{$ref: '#/components/parameters/Guest'}]
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '400': {$ref: '#/components/responses/Problem'}
  /v1/cart/items:
    post:
      tags: [Cart]
      operationId: addToCart
      summary: Add a variant (or a specific offer of it) to the cart, capped by sellable stock
      description: |
        Send `variantAtin`, `offerId` or both. With `offerId` the offer is validated against the offers service:
        unknown or withdrawn → 409 `cart.not-sellable`; paused, out of stock, product not live or seller suppressed →
        409 `cart.offer-not-buyable`; an offer of another variant → 422 `cart.invalid`. Prices always come from the
        offers service (never from the client). One line per variant: adding another seller's offer of a variant
        already in the cart switches that line to the new offer.
      parameters: [{$ref: '#/components/parameters/Guest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variantAtin: {type: string}
                offerId: {type: string, format: uuid, description: offers-service offer id}
                quantity: {type: integer, minimum: 1, default: 1}
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/cart/items/{atin}:
    put:
      tags: [Cart]
      operationId: setQuantity
      summary: Set the exact quantity (stepper); 0 removes the line
      parameters: [{$ref: '#/components/parameters/Atin'}, {$ref: '#/components/parameters/Guest'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [quantity], properties: {quantity: {type: integer, minimum: 0}}}}}
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Cart]
      operationId: removeLine
      summary: Remove a line from the cart
      parameters: [{$ref: '#/components/parameters/Atin'}, {$ref: '#/components/parameters/Guest'}]
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/cart/items/{atin}/save-for-later:
    post:
      tags: [Cart]
      operationId: saveForLater
      summary: Move a cart line to saved-for-later
      parameters: [{$ref: '#/components/parameters/Atin'}, {$ref: '#/components/parameters/Guest'}]
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/cart/saved/{atin}/move-to-cart:
    post:
      tags: [Cart]
      operationId: moveToCart
      summary: Move a saved-for-later line back into the cart
      parameters: [{$ref: '#/components/parameters/Atin'}, {$ref: '#/components/parameters/Guest'}]
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/cart/merge:
    post:
      tags: [Cart]
      operationId: mergeGuestCart
      summary: After sign-in, fold the guest cart (X-Guest-Cart) into the customer's cart
      security: [{bearer: []}]
      parameters: [{$ref: '#/components/parameters/Guest'}]
      responses:
        '200': {$ref: '#/components/responses/Cart'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /v1/carts/{customerId}/ordered:
    post:
      tags: [Checkout]
      operationId: removeOrderedLines
      summary: Clear checked-out lines after an order is placed (cart:service)
      security: [{bearer: []}]
      parameters: [{name: customerId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {variantAtins: {type: array, items: {type: string}}}}}}
      responses:
        '204': {description: Cleared}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Guest: {name: X-Guest-Cart, in: header, schema: {type: string, format: uuid}}
    Atin: {name: atin, in: path, required: true, schema: {type: string}}
  responses:
    Cart:
      description: The cart
      headers:
        X-Guest-Cart: {schema: {type: string}, description: Guest cart id (store it client-side)}
      content: {application/json: {schema: {$ref: '#/components/schemas/CartView'}}}
    Problem:
      description: RFC 9457 problem (cart.insufficient-stock, cart.not-sellable, cart.offer-not-buyable, cart.concurrent-update …)
      content: {application/problem+json: {schema: {type: object, properties: {type: {type: string}, status: {type: integer}, detail: {type: string}, code: {type: string}}}}}
  schemas:
    LineView:
      type: object
      properties:
        offerId: {type: string, description: offers-service offer of the line (absent for catalog-only lines)}
        variantAtin: {type: string}
        productAtin: {type: string}
        title: {type: string}
        options: {type: object, additionalProperties: {type: string}}
        imageUrl: {type: string}
        sellerOrgId: {type: string}
        sellerName: {type: string}
        sellerKind: {type: string, enum: [PLATFORM, SELLER]}
        fulfilment: {type: string, enum: [AFROTRANSACT, SELLER, AFROTRANSACT_DELIVERY]}
        shipFromLocationId:
          type: string
          description: Seller pickup location of an AFROTRANSACT_DELIVERY offer (seller-service id)
        priceMinor: {type: integer, format: int64}
        currency: {type: string}
        quantity: {type: integer}
        addedPriceMinor: {type: integer, format: int64}
        addedAt: {type: string, format: date-time}
        available: {type: integer}
        lowStock: {type: boolean}
        unavailable: {type: boolean}
        priceChanged: {type: boolean}
        lineTotalMinor: {type: integer, format: int64}
    Package:
      type: object
      description: >-
        One shipment: lines of one seller and fulfilment type; AFROTRANSACT_DELIVERY lines are further split per seller
        pickup location (one driver pickup each).
      properties:
        sellerOrgId: {type: string}
        sellerName: {type: string}
        fulfilment: {type: string}
        pickupLocationId:
          type: string
          description: Seller pickup location of an AFROTRANSACT_DELIVERY package (absent for other fulfilment)
        lines: {type: array, items: {$ref: '#/components/schemas/LineView'}}
        subtotalMinor: {type: integer, format: int64}
    CartView:
      type: object
      properties:
        packages: {type: array, items: {$ref: '#/components/schemas/Package'}}
        saved: {type: array, items: {$ref: '#/components/schemas/LineView'}}
        itemCount: {type: integer}
        subtotalMinor: {type: integer, format: int64}
        currency: {type: string}
        checkoutable: {type: boolean}
        version: {type: integer, format: int64}
