# Base values for notifications. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: notifications
  runtime: go
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: notifications
  tag: dev   # sentinel for local renders; the deploy pipeline writes the git sha into values-<env>.yaml
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {memory: 256Mi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/notifications in the cloud secret store:
#   - DB_URL
#   - RESEND_API_KEY
#   - SENDGRID_API_KEY
#   - TWILIO_ACCOUNT_SID
#   - TWILIO_AUTH_TOKEN
#   - VONAGE_API_KEY
#   - VONAGE_API_SECRET
#   - FCM_SERVICE_ACCOUNT_JSON
#   - APNS_KEY_P8
#   - WHATSAPP_TOKEN
#   - RESEND_WEBHOOK_SECRET
#   - SENDGRID_WEBHOOK_PUBLIC_KEY
#   - UNSUBSCRIBE_SIGNING_KEY
#   - NOTIFICATIONS_CLIENT_SECRET   (identity client notifications-service, recipient lookups)
secrets:
  enabled: true
  store: platform-secrets
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv: {}
nodeSelector: {}
tolerations: []
