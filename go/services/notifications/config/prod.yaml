# notifications · prod. Secrets come from env vars only: DB_URL, RESEND_API_KEY, SENDGRID_API_KEY,
# TWILIO_ACCOUNT_SID/TWILIO_AUTH_TOKEN, VONAGE_API_KEY/VONAGE_API_SECRET, FCM_SERVICE_ACCOUNT_JSON, APNS_KEY_P8,
# WHATSAPP_TOKEN, RESEND_WEBHOOK_SECRET, SENDGRID_WEBHOOK_PUBLIC_KEY, UNSUBSCRIBE_SIGNING_KEY. AWS (SES, End User
# Messaging) uses the default credential chain (workload identity).
port: 8080
docsEnabled: false
# Public API base (shared API_BASE_URL, injected by the Helm library); publicBaseUrl defaults to <apiBaseUrl>/notifications.
apiBaseUrl: https://api.afrotransact.com
database:
  url: ""
  migrate: true
kafka:
  enabled: true
  brokers: [kafka:9092]
  # Logical topic → address (defaults are the AsyncAPI channel addresses in contracts/asyncapi/events.yaml).
  topics:
    identity: at.identity.events
    orders: at.order.events
    sellerApplications: at.seller-application.events
    sellerCompliance: at.seller-compliance.events
    sellerSubscription: at.seller-subscription.events
    payouts: at.payout.events
    bookings: at.bookings.events
    content: at.content.events
    inventory: at.inventory.events
    payments: at.payment.events
    trustOps: at.trustops.events
    retail: at.retail.events
    deliveryRuns: at.delivery-runs.events
# Pre-order and location audiences (delivery-runs GET /v1/service/preorders/{id}/audience and
# /v1/service/locations/{id}/audience; the identity client, scope delivery-runs:audience.read).
deliveryRuns:
  enabled: true
  baseUrl: http://delivery-runs
  timeout: 5s
  # WhatsApp announcements of runs (open, cutoff reminder) as approved templates, only to members who opted in on
  # WhatsApp. Keep off until afrotransact_run_opened and afrotransact_run_cutoff_reminder are approved in Meta
  # Business Manager and WHATSAPP_TOKEN + phoneNumberId are set (README, "Delivery runs").
  whatsapp:
    enabled: false
# Recipient lookup by user / org id (client-credentials client notifications-service, scope users:read; the secret
# comes from NOTIFICATIONS_CLIENT_SECRET).
identity:
  enabled: true
  baseUrl: http://identity
  tokenUrl: http://identity/oauth2/token
  clientId: notifications-service
  timeout: 3s
  cacheTtl: 5m
  notFoundTtl: 30s
  cacheMaxEntries: 10000
# Email attachments (S243): signed media links are fetched at send time from these hosts only (the media base URL's
# host is always allowed); larger files stay links. Media's private bucket
# signs the links (add the purchase-order store's host here if media maps that purpose elsewhere).
attachments:
  enabled: true
  mediaBaseUrl: http://media
  mediaPublicUrl: https://media.afrotransact.com
  allowedHosts: [afrotransact-prod-kyc-evidence.s3.us-east-1.amazonaws.com]
  maxBytes: 10485760
  maxTotalBytes: 20971520
  timeout: 10s
# Shared PUBLIC_WEB_URL / SELLER_CENTER_URL (Helm library); Provider Hub is the Seller Center app.
links:
  storefront: https://afrotransact.com
  sellerCenter: https://seller.afrotransact.com
auth:
  enabled: true
  issuer: https://auth.afrotransact.com
  audience: notifications
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampleRatio: 0.1
dispatcher:
  enabled: true
  batch: 100
  concurrency: 16
  lease: 2m
  pollInterval: 1s
  maxAttempts: 8
  backoffBase: 30s
  backoffMax: 1h
routing:
  sendTimeout: 3s
  # Ordered provider lists per market; "default" covers markets without their own list.
  email:
    default: [resend, sendgrid, ses]
    us: [resend, sendgrid, ses]
  sms:
    default: [twilio, vonage, aws]
    us: [twilio, aws, vonage]
  push:
    default: [fcm, apns]
  chat:
    default: [whatsapp]
breaker:
  failureThreshold: 5
  coolDown: 30s
  halfOpenProbes: 1
quietHours: {start: "21:00", end: "08:00"}
marketTimeZones: {us: America/New_York, ca: America/Toronto, uk: Europe/London}
email:
  from: AfroTransact <no-reply@mail.afrotransact.com>
  replyTo: support@afrotransact.com
  unsubscribeMailto: unsubscribe@mail.afrotransact.com
webhooks:
  verify: true
smsCompliance:
  textVersion: sms-terms-2026-01
  help: "AfroTransact Alerts: order, delivery and account texts. Msg frequency varies. Msg & data rates may apply. Help: support@afrotransact.com or +1 (800) 555-0199. Reply STOP to opt out."
  stop: "AfroTransact Alerts: you're unsubscribed and will receive no further messages. Reply START to resubscribe."
  start: "AfroTransact Alerts: you're resubscribed. Msg frequency varies. Msg & data rates may apply. Reply HELP for help, STOP to opt out."
providers:
  ses: {region: us-east-1, configurationSet: notifications-prod}
  twilio: {messagingServiceSid: ""}
  vonage: {from: AfroTransact}
  aws: {region: us-east-1, originationIdentity: "", configurationSet: notifications-prod}
  fcm: {projectId: ""}
  apns: {keyId: "", teamId: "", bundleId: com.afrotransact.customer, production: true}
  whatsapp: {phoneNumberId: "", apiVersion: v21.0}
# Email layout (S279): logo, social icons and store badges are PNGs under assetBaseUrl (default
# <links.storefront>/email = web/apps/storefront/public/email). Footer socials, the WhatsApp community link, app links,
# phone, address and legal links come from content's site config (siteConfigUrl, refreshed every refresh).
brand:
  name: AfroTransact
  siteConfigUrl: http://content/v1/site-config
  refresh: 5m
  # whatsappCommunityUrl comes from the site config (staff console → Site settings); empty hides the block.
  # Defaults until content's site config answers (and for fields it leaves empty). Staff edit the live values in
  # the staff console: Site settings (content GET /v1/site-config).
  supportPhone: "+1 (833) 555-0199"
  supportPhoneE164: "+18335550199"
  supportEmail: help@afrotransact.com
  address: "AfroTransact, Inc. · 1001 Texas Ave, Suite 1400 · Houston, TX 77002"
  socials:
    - {network: tiktok, url: "https://www.tiktok.com/@afrotransact"}
    - {network: instagram, url: "https://www.instagram.com/afrotransact"}
    - {network: facebook, url: "https://www.facebook.com/afrotransact"}
    - {network: x, url: "https://x.com/afrotransact"}
    - {network: youtube, url: "https://www.youtube.com/@afrotransact"}
    - {network: linkedin, url: "https://www.linkedin.com/company/afrotransact"}
  legal:
    - {label: Privacy Notice, url: /legal/privacy}
    - {label: Your Privacy Choices, url: /legal/privacy-choices}
    - {label: Conditions of Use, url: /legal/conditions-of-use}
    - {label: SMS & Notification Terms, url: /legal/sms-terms}
# Promotions below the main content of the emails app.AdvertorialPolicy allows (never security emails, never for
# recipients who opted out of promotional email). Public read APIs; best-effort within timeout.
advertorials:
  enabled: true
  timeout: 800ms
  searchUrl: http://search
  contentUrl: http://content
  campaignSlot: hero_carousel
