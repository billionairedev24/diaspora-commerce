# notifications · local. Secrets (DB_URL in other envs, provider keys, webhook secrets, UNSUBSCRIBE_SIGNING_KEY)
# come from env vars only. Local sends email to Mailpit (http://localhost:8025) and logs SMS/push/WhatsApp.
port: 8208
docsEnabled: true
publicBaseUrl: http://localhost:8208
database:
  url: postgres://notifications:notifications@localhost:5432/notifications?sslmode=disable
  migrate: true
kafka:
  enabled: true
  brokers: [localhost:9092]
  # Logical topic → address (defaults are the AsyncAPI channel addresses in contracts/asyncapi/events.yaml).
  topics:
    identity: at.identity.events
    orders: at.order.events
    sellerApplications: at.seller-application.events
    sellerCompliance: at.seller-compliance.events
    payouts: at.payout.events
    bookings: at.bookings.events
    content: at.content.events
    inventory: at.inventory.events
    payments: at.payment.events
    trustOps: at.trustops.events
    retail: at.retail.events
# Recipient lookup by user / org id (client-credentials client notifications-service, scope users:read; the secret
# comes from NOTIFICATIONS_CLIENT_SECRET).
identity:
  enabled: true
  baseUrl: http://localhost:8100
  tokenUrl: http://localhost:8100/oauth2/token
  clientId: notifications-service
  timeout: 3s
  cacheTtl: 5m
  notFoundTtl: 30s
  cacheMaxEntries: 10000
# Email attachments (S243): signed media links are fetched at send time from these hosts only (the media base URL's
# host is always allowed); larger files stay links. MinIO serves the signed links locally.
attachments:
  enabled: true
  mediaBaseUrl: http://localhost:8207
  allowedHosts: [localhost:9000]
  maxBytes: 10485760
  maxTotalBytes: 20971520
  timeout: 10s
links:
  storefront: http://localhost:3000
  sellerCenter: http://localhost:3001
  providerHub: http://localhost:3001
auth:
  enabled: false
  issuer: http://localhost:8100
  audience: notifications
telemetry:
  otlpEndpoint: localhost:4318
  sampleRatio: 1.0
dispatcher:
  enabled: true
  batch: 50
  concurrency: 4
  lease: 2m
  pollInterval: 1s
  maxAttempts: 5
  backoffBase: 5s
  backoffMax: 5m
routing:
  sendTimeout: 3s
  email: {default: [smtp]}
  sms: {default: [log]}
  push: {default: [log]}
  chat: {default: [log]}
breaker:
  failureThreshold: 5
  coolDown: 30s
  halfOpenProbes: 1
quietHours: {start: "21:00", end: "08:00"}
marketTimeZones: {us: America/New_York, ca: America/Toronto, uk: Europe/London}
email:
  from: AfroTransact <no-reply@afrotransact.local>
  replyTo: support@afrotransact.local
  unsubscribeMailto: unsubscribe@afrotransact.local
webhooks:
  verify: false
smsCompliance:
  textVersion: sms-terms-2026-01
  help: "AfroTransact Alerts: order, delivery and account texts. Msg frequency varies. Msg & data rates may apply. Help: support@afrotransact.com or +1 (800) 555-0199. Reply STOP to opt out."
  stop: "AfroTransact Alerts: you're unsubscribed and will receive no further messages. Reply START to resubscribe."
  start: "AfroTransact Alerts: you're resubscribed. Msg frequency varies. Msg & data rates may apply. Reply HELP for help, STOP to opt out."
testSend:
  localEmail: local-dev@afrotransact.local
  localPhone: "+15555550100"
providers:
  smtp: {host: localhost, port: 1025}
