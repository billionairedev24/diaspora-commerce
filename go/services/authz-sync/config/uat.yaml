# authz-sync · uat. KAFKA_BOOTSTRAP comes from the environment outside local and dev; OPENFGA_API_TOKEN (one of
# OpenFGA's pre-shared keys) always comes from the environment (empty locally: docker compose runs OpenFGA without authn).
port: 8080
docsEnabled: true
kafka:
  brokers: []
  group: authz-sync
  topics: [at.identity.events, at.seller-org.events]
openfga:
  apiUrl: http://openfga.openfga.svc:8080
  storeName: afrotransact
  storeId: ""
  timeout: 3s
  manageModel: true
retailOrgId: org_afrotransact_retail
retry:
  backoffMs: 250
  maxBackoffMs: 30000
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampleRatio: 0.5
