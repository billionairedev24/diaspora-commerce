# authz-sync · local. KAFKA_BOOTSTRAP comes from the environment outside local and dev; OPENFGA_API_TOKEN (one of
# OpenFGA's pre-shared keys) always comes from the environment (empty locally: docker compose runs OpenFGA without authn).
port: 8210
docsEnabled: true
kafka:
  brokers: [localhost:9092]
  group: authz-sync
  topics: [at.identity.events, at.seller-org.events]
openfga:
  apiUrl: http://localhost:8091
  storeName: afrotransact
  storeId: ""
  timeout: 3s
  manageModel: true
# First-party service clients (identity's client_credentials clients): each gets `service` on the platform (S266).
serviceClients:
  - gateway-bff
  - seller-service
  - orders-service
  - cart-service
  - tax-returns-service
  - bookings-service
  - fulfilment-service
  - payments-service
  - notifications-service
  - trust-ops-service
  - search-service
  - delivery-runs-service
  - media-service
  - indexer-service
  - offers-service
  - catalog-service
  - retail-service
  - inventory-service
retailOrgId: org_afrotransact_retail
retry:
  backoffMs: 250
  maxBackoffMs: 30000
telemetry:
  otlpEndpoint: localhost:4318
  sampleRatio: 1.0
