env: prod
# A small Kafka consumer: fixed replicas (partitions bound the parallelism), no CPU autoscaling.
replicas: 1
autoscaling:
  enabled: false
  min: 2
  max: 2
  cpu: 70
rollout:
  enabled: false
resources:
  requests: {cpu: 25m, memory: 48Mi}
  limits: {memory: 160Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint (docs/engineering/cloud-cost.md)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
