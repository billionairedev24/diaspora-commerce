# Base values for search. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: search
  runtime: go
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: search
  tag: latest
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {memory: 256Mi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/search in the cloud secret store:
#   - ES_URLS
#   - ES_API_KEY
#   - KAFKA_BOOTSTRAP          (search.* and ads.* events)
#   - ADS_TOKEN_KEY            (≥ 32 chars; signs sponsored-product click tokens)
#   - SEARCH_CLIENT_SECRET     (identity client search-service: ai:use, ads:serve)
secrets:
  enabled: true
  store: platform-secrets
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv: {}
nodeSelector: {}
tolerations: []
