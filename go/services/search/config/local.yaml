# search · local. Secrets (ES_PASSWORD / ES_API_KEY, ADS_TOKEN_KEY, SEARCH_CLIENT_SECRET) come from env vars only.
# KAFKA_BOOTSTRAP comes from the environment outside local.
port: 8201
docsEnabled: true
markets: [us]
# SEARCH_PROVIDER=meilisearch switches the engine (tools/dev/local.sh starts it; the key is the local compose default).
meilisearch:
  url: http://localhost:7700
  apiKey: local-meili-master-key
elasticsearch:
  urls: [http://localhost:9200]
auth:
  enabled: false
  issuer: http://localhost:8100
  audience: search
aiGatewayUrl: ""
# S036 hybrid retrieval: 3+ word queries are embedded by ai-gateway (client search-service, scope ai:use) within
# 150 ms; on failure or timeout the page is lexical and reports semanticSkipped.
semantic:
  timeout: 150ms
  minWords: 3
  scopes: ["ai:use"]
kafka:
  brokers: [localhost:9092]
  buffer: 10000
synonyms:
  file: ""
  overwrite: false
  migrateIndex: true
analytics:
  enabled: true
  flushInterval: 10s
  retentionDays: 400
  clickDedupe: 30m
ads:
  enabled: true
  slots: [1, 5]
  minQuality: 0.3
  reserveMinor: 5
  tokenTtl: 1h
  cacheTtl: 15s
  content:
    baseUrl: http://localhost:8112
    tokenUrl: ""
    clientId: search-service
    scopes: ["ads:serve"]
telemetry:
  otlpEndpoint: localhost:4318
  sampleRatio: 1.0
