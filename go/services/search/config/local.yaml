# search · local. Secrets (ES_PASSWORD / ES_API_KEY, ADS_TOKEN_KEY, SEARCH_CLIENT_SECRET) come from env vars only.
# KAFKA_BOOTSTRAP comes from the environment outside local.
port: 8201
docsEnabled: true
markets: [us]
elasticsearch:
  urls: [http://localhost:9200]
auth:
  enabled: false
  issuer: http://localhost:8100
  audience: search
aiGatewayUrl: ""
kafka:
  brokers: [localhost:9092]
  buffer: 10000
synonyms:
  file: ""
  overwrite: false
  migrateIndex: true
analytics:
  enabled: true
  flushInterval: 10s
  retentionDays: 400
  clickDedupe: 30m
ads:
  enabled: true
  slots: [1, 5]
  minQuality: 0.3
  reserveMinor: 5
  tokenTtl: 1h
  cacheTtl: 15s
  content:
    baseUrl: http://localhost:8112
    tokenUrl: ""
    clientId: search-service
    scopes: ["ads:serve"]
telemetry:
  otlpEndpoint: localhost:4318
  sampleRatio: 1.0
