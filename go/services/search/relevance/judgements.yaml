# Relevance judgements (S039): query → expected ATINs with graded relevance, run against products.yaml by
# internal/adapter/elastic/relevance_integration_test.go (Elasticsearch 9 in Testcontainers, the production query).
#
# Grades: 3 = exactly what the shopper wants (in stock), 2 = right product but a weaker offer (out of stock, seller-
# fulfilled twin of an AfroTransact-fulfilled item) or a close variant, 1 = related, 0 / unlisted = not relevant.
# The business preferences (in stock first, Fulfilled by AfroTransact preferred on ties) are encoded in the grades.
#
# Metrics: NDCG@10 (gain 2^grade − 1, ideal order from these grades) and precision@5 (share of the top
# min(5, |grade ≥ 1|) results that are relevant). The test fails when a mean falls below its threshold.
# Measured (Elasticsearch 9.3.0): before S039 tuning 0.855 / 0.807; after 0.942 / 0.913. Raise the thresholds when
# the ranking improves; add a query here for every relevance bug fixed.
thresholds:
  ndcg10: 0.92
  precision5: 0.90
# S036: natural-language queries (3+ words, so search asks for an embedding). The harness runs every query keyword-only
# and hybrid (BM25 + kNN, reciprocal rank fusion) with the fake deterministic embeddings of concepts.yaml, prints both
# and fails when hybrid falls below these thresholds or does not beat keyword-only on them. Measured: see README.
semanticThresholds:
  ndcg10: 0.80
  precision5: 0.75
