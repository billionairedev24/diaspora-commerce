# media · prod: Cloudflare R2 for everything, two buckets with two least-privilege API tokens (docs/runbooks/r2-buckets.md).
#   public bucket  afrotransact-prod-media        product images + storefront media, served from media.afrotransact.com
#   private bucket afrotransact-prod-kyc-evidence KYC / identity documents, proof and return photos, POs, resumes,
#                                                 exports: no public access, no custom domain, short-lived signed URLs
# UploadThing, MinIO and AWS S3 are not used in prod; Config.Validate refuses to start if prod selects them, if a
# credential is missing or if the ACCOUNT_ID placeholder is left in an endpoint.
# Endpoint: R2_ACCOUNT_ID (Cloudflare account id) or R2_ENDPOINT (full https://<id>.r2.cloudflarestorage.com).
port: 8080
# Public API base (shared API_BASE_URL, injected by the Helm library); publicBaseUrl defaults to <apiBaseUrl>/media,
# the base of media-hosted long-lived links.
apiBaseUrl: https://api.afrotransact.com
docsEnabled: false
stores:
  r2:
    kind: s3
    name: r2
    endpoint: https://ACCOUNT_ID.r2.cloudflarestorage.com   # placeholder: R2_ENDPOINT / R2_ACCOUNT_ID must override it
    endpointEnv: R2_ENDPOINT
    accountIdEnv: R2_ACCOUNT_ID
    region: auto
    bucket: afrotransact-prod-media
    publicBaseUrl: https://media.afrotransact.com
    publicBaseUrlEnv: MEDIA_PUBLIC_URL   # shared media CDN URL from the Helm library wins when set
    accessKeyEnv: R2_ACCESS_KEY_ID
    secretKeyEnv: R2_SECRET_ACCESS_KEY
  private:
    kind: s3
    name: r2
    endpoint: https://ACCOUNT_ID.r2.cloudflarestorage.com
    endpointEnv: R2_ENDPOINT
    accountIdEnv: R2_ACCOUNT_ID
    region: auto
    bucket: afrotransact-prod-kyc-evidence   # no publicBaseUrl: never served publicly
    accessKeyEnv: R2_PRIVATE_ACCESS_KEY_ID
    secretKeyEnv: R2_PRIVATE_SECRET_ACCESS_KEY
# Unreleased public images (quarantine/...) are uploaded to the PRIVATE bucket and copied into the public bucket only
# after moderation passes, so the public bucket and media.afrotransact.com never hold or serve quarantine/.
quarantineStore: private
purposes:
  product-image: r2
  storefront: r2
  proof-photo: private
  return-photo: private
  kyc-document: private
  purchase-order: private
  shipping-document: private
  career-resume: private
  export: private
# Signed download links of private assets: 5 minutes by default; purchase orders, shipping documents, résumés and
# exports may ask for longer ones (GET /v1/assets/{id}?urlTtlSeconds=) up to maxLongTtl. The store caps them too
# (R2 and other S3-compatible stores sign for at most 7 days). KYC documents and photos never get long links.
# Long links (above defaultTtl) are media-hosted redirect links <publicBaseUrl>/v1/l/<token> when LINK_SIGNING_KEY
# (secret) is set: they last up to maxLongTtl on every cloud; each click gets a fresh storage URL of redirectTtl.
links:
  defaultTtl: 5m
  maxLongTtl: 336h
  redirectTtl: 5m
auth:
  enabled: true
  issuer: https://auth.afrotransact.com
  audience: media
  # S250: user tokens the BFF forwards (minted for gateway-bff) act as that user.
  forwardedAudiences: [gateway-bff]
# S030: public images (product-image, storefront) are uploaded into quarantine/ and published only after moderation:
# purpose rules, EXIF/XMP stripping, perceptual-hash duplicates (Hamming distance ≤ duplicateDistance; another
# seller's photo is held for review) and the AI hook on ai-gateway (client media-service, scope ai:use; secret
# MEDIA_CLIENT_SECRET). failMode closed holds images while the hook is down; open publishes them with a note.
moderation:
  maxPixels: 40000000
  duplicateDistance: 6
  ai:
    enabled: true
    baseUrl: http://ai-gateway:8080
    failMode: closed
    timeout: 10s
    # tokenUrl: defaults to <auth.issuer>/oauth2/token (AUTH_TOKEN_URL overrides)
    clientId: media-service
    scopes: ["ai:use"]
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampleRatio: 0.1
