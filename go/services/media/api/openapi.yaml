openapi: 3.1.0
info:
  title: Media API
  version: v1
  description: |
    Direct uploads for product images (UploadThing), storefront media, driver proof-of-delivery photos, return
    photos and KYC documents (private, object-locked bucket on the primary cloud), plus private documents:
    retail purchase orders (PDF ≤ 10 MB), inbound shipping documents (PDF or image ≤ 15 MB), job applicants'
    résumés (PDF ≤ 5 MB) and staff exports (CSV or XLSX ≤ 50 MB). Flow: `POST /v1/uploads`
    returns a short-lived upload URL; the client PUTs the file straight to storage (as multipart/form-data in
    `upload.formField` when it is set, which UploadThing requires); `POST /v1/assets/{id}/complete` makes the service
    read the object back, detect its real type, measure it and apply the purpose rules (type, size, minimum edge,
    white background for product main images). Rejected files are deleted.

    **Moderation (public images: `product-image`, `storefront`).** Uploads land in quarantine (private) and are
    published only when moderation passes: EXIF / XMP / IPTC metadata (GPS, camera) is stripped, a perceptual hash
    finds duplicates (another seller's near-identical photo is held for review; the organisation's own is only noted)
    and an AI hook (ai-gateway) checks the content, failing closed (held) or open (published with a note) as
    configured. `moderation.verdict` is `PASSED` (public `url`), `HELD` (status `FLAGGED`, private until staff
    review with `POST /v1/assets/{id}/review`) or `BLOCKED` (status `REJECTED`, deleted).

    **Image checks (S388, `product-image`).** Each upload or import names a `slot`: `MAIN` (strict), `OTHER` (the
    default), `SWATCH` or `LABEL`; library file names infer it (`SKU.MAIN`, `SKU.PT01`, `SKU.SWCH`). The asset gets a
    `verdict` (`PASS`, `WARN`, `HOLD`, `REJECT`) and `checks` (`code`, `level`, `params`, an English `message`);
    clients translate by `code` (Seller Center `sc.img.check.<CODE>`). `REJECT` is status `REJECTED` and the file is
    deleted, `HOLD` is status `FLAGGED` (private, staff decide), `PASS` and `WARN` publish. The main image is
    rejected under 1000 px on its longest side or 500 px on its shortest, when its background is not pure white
    (95 percent of the outer 2 percent ring and the four corners at 250 or more; a passing background is set to pure
    white 255), when the product fills under 75 percent of the frame (warning from 75 to 85 percent), when it has a
    border or frame, or when it is a placeholder; blur and a very wide or tall frame only warn. Other images warn
    under 1000 px and are rejected under 500 px. Transparent PNGs are flattened on white and CMYK JPEGs become RGB.
    Every threshold is configuration (`images.*`); staff may change some at run time (`PUT /v1/image-rules`), and the
    `warnOnly` switch turns the main image's appearance rejects into warnings per environment. With
    `images.enforce: false` (shadow mode) verdicts are recorded and `shadow` is true, but nothing is rejected for
    quality. The AI hook adds held findings: text, logos and watermarks, props or people on a main image (apparel
    on a model only when the setting allows it), a title and brand mismatch; a hook that fails or runs out of its
    budget holds the image, it never rejects it. Catalog verifies the images of a listing with `POST /v1/assets/verify`
    (judged from what was measured at upload, for the slot the image is used in) and back-fills old images with
    `POST /v1/assets/rescore`. Storage URLs of quarantined or private objects are never returned or logged.

    The document purposes (`purchase-order`, `shipping-document`, `career-resume`, `export`) accept the
    client-credentials tokens of `retail-service` and `gateway-bff` and refuse other service clients;
    `purchase-order`, `shipping-document` and `export` are otherwise staff-only. User access tokens the BFF forwards
    (minted for `gateway-bff`) act as that user. Signed download links of document purposes may last longer than
    the default 5 minutes (`urlTtlSeconds`, up to 14 days by default, configurable): such links are media-hosted
    (`GET /v1/l/{token}`), so they work for their whole lifetime on every cloud; every other purpose keeps 5-minute
    links.
servers:
  - {url: 'http://localhost:8207', description: local}
  - {url: 'https://api-dev.afrotransact.com/media', description: dev}
  - {url: 'https://api-uat.afrotransact.com/media', description: uat}
  - {url: 'https://api.afrotransact.com/media', description: prod}
security: [{bearer: []}]
tags:
  - {name: Uploads, description: Direct-to-storage upload URLs}
  - {name: Assets, description: Finalised media assets and their metadata}
  - {name: Image library, description: 'The organisation''s product image library, matched to SKUs by file name (S310)'}
  - {name: Image checks, description: 'Slot-aware image rules, verdicts, verification and the staff-editable thresholds (S388)'}
paths:
  /v1/uploads:
    post:
      tags: [Uploads]
      operationId: requestUpload
      summary: Get a direct upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, fileName, contentType, size]
              properties:
                purpose: {$ref: '#/components/schemas/Purpose'}
                fileName: {type: string, maxLength: 200}
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, application/pdf, text/csv,
                         application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
                size: {type: integer, format: int64, minimum: 1}
                library:
                  type: boolean
                  default: false
                  description: >-
                    `product-image` only: add the image to the organisation's image library. The file name is parsed
                    for SKU matching (`sku`, `slot` of the asset); the image slot is then inferred from the name.
                slot: {$ref: '#/components/schemas/ImageSlot'}
                title: {type: string, maxLength: 200, description: 'Listing title the AI check compares the picture with (optional)'}
                brand: {type: string, maxLength: 80, description: Brand the AI check compares the picture with (optional)}
                productTypeCode: {type: string, maxLength: 80, description: 'Product type: apparel may show a model when the rules allow it (optional)'}
      responses:
        '201':
          description: Upload instructions
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset: {$ref: '#/components/schemas/Asset'}
                  upload: {$ref: '#/components/schemas/Upload'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/assets/import:
    post:
      tags: [Uploads]
      operationId: importAsset
      summary: Copy a public image from a URL for an organisation (catalog-service, scope media:import)
      description: |
        Images of bulk product uploads (S308). Only the importer client `catalog-service` with scope `media:import`,
        only purpose `product-image`. media downloads the https URL itself (public addresses only: private, loopback,
        link-local and reserved ranges are refused; at most 3 https redirects; 20 s; at most 8 MB), checks the bytes
        are a JPG, PNG or WebP image, stores it in quarantine and completes it like an upload: inspection, metadata
        stripping, duplicate check and AI moderation. The asset is owned by `ownerOrg`. 201 with the asset (status
        READY, FLAGGED when held for review, or REJECTED with flags); 422 when the URL can't be fetched or isn't an
        allowed image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, url, ownerOrg]
              properties:
                purpose: {$ref: '#/components/schemas/Purpose'}
                url: {type: string, maxLength: 2048}
                ownerOrg: {type: string, minLength: 1, maxLength: 80}
                uploadedBy: {type: string, maxLength: 120, description: The member who uploaded the sheet}
                slot: {$ref: '#/components/schemas/ImageSlot'}
                title: {type: string, maxLength: 200, description: 'Listing title the AI check compares the picture with (optional)'}
                brand: {type: string, maxLength: 80, description: Brand the AI check compares the picture with (optional)}
                productTypeCode: {type: string, maxLength: 80, description: 'Product type: apparel may show a model when the rules allow it (optional)'}
      responses:
        '201': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/assets/held:
    get:
      tags: [Image checks]
      operationId: listHeldImages
      summary: The staff review queue of held product images (staff with media:moderate or catalog:moderate)
      description: |
        Product images held by moderation, oldest first, each with its findings (`checks`), the AI labels and the title and
        brand mismatch score (`moderation`), and a signed `url` valid for 5 minutes to look at the image. Release or reject
        with `POST /v1/assets/{id}/review`.
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}]
      responses:
        '200':
          description: Held images
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/assets/verify:
    post:
      tags: [Image checks]
      operationId: verifyImages
      summary: Judge published images for the slot each is used in (catalog-service, scope media:import)
      description: |
        Catalog's defence in depth (S390): the verdict of each image URL is computed from what media measured when the
        image was uploaded, for the slot the caller says (a main image is judged by the main rules even when it was
        uploaded as an additional picture), with the current thresholds. Width and height are media's own; a client's
        numbers are never used. An URL media does not know as a published image is `found: false` and a `REJECT` with
        `NOT_VERIFIED`. An image can also be named by `assetId` (S390 with held photos): a READY one is judged like one
        asked for by URL and the answer carries its public URL; a HELD one answers `status: HELD`, verdict `HOLD`, no
        URL, so catalog can save the listing and keep it off sale until staff decide. Images stored before the checks existed (no measurements) are judged on their size only until
        they are rescored. At most 100 images.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VerifyRequest'}}}
      responses:
        '200': {description: 'One result per image, in order', content: {application/json: {schema: {$ref: '#/components/schemas/VerifyResponse'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/assets/rescore:
    post:
      tags: [Image checks]
      operationId: rescoreImages
      summary: Measure published images again and store the result (catalog-service, scope media:import)
      description: |
        The back-fill of S392: media reads each stored file, measures it and records the metrics, verdict and checks
        (for the slot the asset was uploaded for); the file is never changed. Answers like verify, for the slot asked.
        Rate limited: at most 20 images per call and two measured at a time. An unreadable file is reported as
        `NOT_AN_IMAGE`, not as an error.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VerifyRequest'}}}
      responses:
        '200': {description: 'One result per image, in order', content: {application/json: {schema: {$ref: '#/components/schemas/VerifyResponse'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/image-rules:
    get:
      tags: [Image checks]
      operationId: getImageRules
      summary: The image rules in force and the staff override
      description: The thresholds Seller Center shows ("at least 1000 pixels") and staff edit.
      responses:
        '200': {description: Rules, content: {application/json: {schema: {$ref: '#/components/schemas/ImageRulesView'}}}}
    put:
      tags: [Image checks]
      operationId: setImageRules
      summary: Replace the staff override of the image rules (staff with media:moderate or catalog:moderate)
      description: >-
        Fields left out keep the configured value. The override is stored in this environment's database (so
        `warnOnly` is per environment) and replaces the previous one. Values that do not make a usable rule set (for
        example a fill warning below the fill rejection) are refused with 422.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ImageRulesOverride'}}}
      responses:
        '200': {description: Rules after the change, content: {application/json: {schema: {$ref: '#/components/schemas/ImageRulesView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/assets/{id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: Inspect the uploaded file and finalise the asset (idempotent)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/assets/{id}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Asset metadata (private assets include a signed URL, 5 minutes unless asked otherwise)
      description: >-
        Readable by the uploader, the owning organisation and staff with the purpose's permission. Two service clients
        read with their own client-credentials token and scope `media:read`: `delivery-runs-service` (public assets,
        including ones not published yet) and `gateway-bff`, which also reads driver proof-of-delivery photos and
        signatures (purpose `proof-photo`, nothing else private) to hand the customer's, the seller's and staff's
        order pages a short-lived link. The BFF asks only for ids that orders-service returned for an order the viewer
        may already read.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - name: urlTtlSeconds
          in: query
          description: >-
            Lifetime of the signed URL of a private asset. Purposes with long links (`purchase-order`,
            `shipping-document`, `career-resume`, `export`) get up to the configured maximum (14 days by default);
            every other purpose is capped at 5 minutes. A lifetime above 5 minutes returns a media-hosted link
            (`<media public URL>/v1/l/{token}`) that redirects each click to a fresh short-lived storage URL, so it is
            not limited by what the store can sign; without a configured link signing key the store caps it (S3-compatible
            stores and UploadThing sign for at most 7 days). `urlExpiresAt` tells the lifetime granted.
          schema: {type: integer, format: int64, minimum: 1, maximum: 31622400}
      responses:
        '200': {description: Asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/assets/{id}/review:
    post:
      tags: [Assets]
      operationId: reviewAsset
      summary: Release or reject an image held by moderation (staff with media:moderate or catalog:moderate)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [APPROVE, REJECT]}
                note: {type: string, maxLength: 500, description: Shown in the rejection reason}
      responses:
        '200': {description: Reviewed asset, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/l/{token}:
    get:
      tags: [Assets]
      operationId: followLink
      summary: Media-hosted long-lived document link (redirects to a fresh short-lived storage URL)
      description: >-
        The signed token is the credential (links are e-mailed to suppliers), so no bearer token is needed. Each
        request is redirected (302) to a storage URL that lasts a few minutes; the link itself lasts until the expiry
        it was issued with (`urlExpiresAt` of `GET /v1/assets/{id}`).
      security: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{20,120}$'}}
      responses:
        '302':
          description: Redirect to the file
          headers:
            Location: {description: Short-lived storage URL, schema: {type: string, format: uri}}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /v1/library:
    get:
      tags: [Image library]
      operationId: listLibrary
      summary: The caller's organisation's image library, newest first
      description: >-
        Completed library images (READY, FLAGGED while held for review, REJECTED with the reason in `flags`); uploads
        never completed are left out. `q` matches the file name or SKU (case-insensitive, contains).
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, schema: {type: string, enum: [READY, FLAGGED, REJECTED]}}
        - {name: matched, in: query, description: 'true = file names with a SKU and slot, false = the others', schema: {type: boolean}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Library page, content: {application/json: {schema: {$ref: '#/components/schemas/LibraryPage'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/library/lookup:
    post:
      tags: [Image library]
      operationId: lookupLibrary
      summary: Library images of an organisation by SKU and file name (catalog-service, scope media:import)
      description: >-
        For bulk uploads and "attach matching images": per requested SKU the newest READY or FLAGGED image of each
        slot, and per requested file name the newest READY or FLAGGED image with that name (case-insensitive). SKUs
        and file names that match nothing are simply absent. Only the importer client `catalog-service` with
        `media:import`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerOrg]
              properties:
                ownerOrg: {type: string, minLength: 1, maxLength: 80}
                skus: {type: array, maxItems: 5000, items: {type: string, maxLength: 64}}
                fileNames: {type: array, maxItems: 5000, items: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Matching images
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images: {type: array, items: {$ref: '#/components/schemas/LibraryImage'}}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/library/{id}:
    patch:
      tags: [Image library]
      operationId: renameLibraryImage
      summary: Rename a library image and re-match SKU / slot
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              properties:
                fileName: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Renamed image
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryImage'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Image library]
      operationId: removeFromLibrary
      summary: Remove an image from the library (listings that use it keep it)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: The caller's organisation's assets
      parameters: [{name: purpose, in: query, schema: {$ref: '#/components/schemas/Purpose'}}]
      responses:
        '200':
          description: Assets
          content: {application/json: {schema: {type: object, properties: {assets: {type: array, items: {$ref: '#/components/schemas/Asset'}}}}}}
        '401': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Problem:
      description: RFC 9457 problem
      content: {application/problem+json: {schema: {type: object, properties: {type: {type: string}, title: {type: string}, status: {type: integer}, detail: {type: string}, code: {type: string}}}}}
  schemas:
    Purpose:
      type: string
      enum: [product-image, storefront, proof-photo, return-photo, kyc-document, purchase-order, shipping-document,
             career-resume, export]
    Upload:
      type: object
      properties:
        method: {type: string}
        url: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        key: {type: string}
        publicUrl:
          type: string
          description: Empty for public images, which become public only after moderation (use the completed asset's `url`).
        expiresAt: {type: string, format: date-time}
        formField:
          type: string
          description: >-
            When set (UploadThing: `file`), send the file as multipart/form-data in this field instead of as the raw
            body, and let the HTTP client set the multipart Content-Type.
    Asset:
      type: object
      properties:
        id: {type: string, format: uuid}
        ownerOrg: {type: string}
        uploadedBy: {type: string}
        purpose: {$ref: '#/components/schemas/Purpose'}
        provider: {type: string}
        key: {type: string}
        url: {type: string}
        fileName: {type: string}
        contentType: {type: string}
        bytes: {type: integer, format: int64}
        width: {type: integer}
        height: {type: integer}
        status: {type: string, enum: [PENDING, READY, FLAGGED, REJECTED]}
        flags: {type: array, items: {type: string}}
        notice:
          type: string
          description: >
            "We are checking this file" while the malware scan has no verdict yet (status stays PENDING, no url is
            served); ask again with POST /v1/assets/{id}/complete. A file the scanner found infected is REJECTED with
            the flag "malware detected".
        createdAt: {type: string, format: date-time}
        urlExpiresAt:
          type: string
          format: date-time
          description: When the signed `url` of a private asset stops working (absent for public assets).
        moderation: {$ref: '#/components/schemas/Moderation'}
        library: {type: boolean, description: In the organisation's image library}
        sku: {type: string, description: 'Library images: the SKU parsed from the file name (upper case), absent when none'}
        slot: {$ref: '#/components/schemas/LibrarySlot'}
        imageSlot: {$ref: '#/components/schemas/ImageSlot'}
        verdict: {$ref: '#/components/schemas/ImageVerdict'}
        checks:
          type: array
          items: {$ref: '#/components/schemas/ImageCheck'}
          description: 'What the image rules found (product images). `flags` carries the same findings as plain English.'
        shadow:
          type: boolean
          description: The verdict was recorded but not applied (shadow mode, `images.enforce` off).
    ImageSlot:
      type: string
      enum: [MAIN, OTHER, SWATCH, LABEL]
      description: 'What an image is used for; MAIN is judged by the strict rules. Default OTHER.'
    ImageVerdict:
      type: string
      enum: [PASS, WARN, HOLD, REJECT]
      description: 'PASS and WARN publish (status READY), HOLD keeps the image private for staff (FLAGGED), REJECT deletes it (REJECTED).'
    ImageCheck:
      type: object
      required: [code, level, message]
      properties:
        code:
          type: string
          description: 'Translate by this code: MAIN_TOO_SMALL, TOO_SMALL, LOW_RES, LARGER_BETTER, NOT_WHITE, FILL_LOW, FILL_OK_NEAR, BORDER, PLACEHOLDER, FORMAT, FILE_TOO_BIG, NOT_AN_IMAGE, BLUR, ASPECT, HELD_TEXT, HELD_MISMATCH, HELD_DUPLICATE, HELD_PROPS, HELD_REVIEW, PROHIBITED, MAIN_PROPS, REVIEW_REJECTED, NOT_VERIFIED, FETCH_FAILED, FETCH_PRIVATE'
        level: {type: string, enum: [INFO, WARN, HOLD, REJECT], description: INFO never changes the verdict}
        params:
          type: object
          additionalProperties: true
          description: 'Numbers the text needs: w, h, px, min, mb, fill (percent), actual (percent)'
        message: {type: string, description: 'Plain English text without ids, for API readers'}
    VerifyRequest:
      type: object
      required: [images]
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [slot]
            description: 'Name the image by `url` (a published image) or by `assetId` (any product image, including a held one that has no public URL). One of the two is required.'
            properties:
              url: {type: string, maxLength: 2048, description: Public URL of a published image}
              assetId: {type: string, maxLength: 64, description: Media asset id of a product image; the way a listing refers to a photo that is held for review}
              ownerOrg: {type: string, maxLength: 64, description: 'With assetId: the organisation that must own the asset; another organisation''s image is answered as UNKNOWN'}
              slot: {$ref: '#/components/schemas/ImageSlot'}
              productTypeCode: {type: string, maxLength: 80}
    VerifyResponse:
      type: object
      required: [results]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/VerifyResult'}}
    VerifyResult:
      type: object
      required: [url, found, slot, verdict, checks, measured]
      properties:
        url: {type: string, description: 'Public URL; empty for a held image'}
        assetId: {type: string, description: Set when the image was asked for by asset id}
        status:
          type: string
          enum: [READY, HELD, REJECTED, UNKNOWN]
          description: 'Set with assetId. READY: published, url is its public URL. HELD: kept private until staff decide (verdict HOLD, no url). REJECTED or UNKNOWN (no such asset, someone else''s, not a product image): verdict REJECT with NOT_VERIFIED.'
        found: {type: boolean}
        slot: {$ref: '#/components/schemas/ImageSlot'}
        verdict: {$ref: '#/components/schemas/ImageVerdict'}
        checks: {type: array, items: {$ref: '#/components/schemas/ImageCheck'}}
        width: {type: integer}
        height: {type: integer}
        bytes: {type: integer, format: int64}
        contentType: {type: string}
        measured: {type: boolean, description: False for images stored before the checks existed (judged on size only until rescored)}
        shadow: {type: boolean}
    ImageRulesView:
      type: object
      required: [effective, override]
      properties:
        effective: {$ref: '#/components/schemas/ImageRules'}
        override:
          type: object
          properties:
            override: {$ref: '#/components/schemas/ImageRulesOverride'}
            updatedBy: {type: string}
            updatedAt: {type: string, format: date-time}
    ImageRules:
      type: object
      description: 'The thresholds in force (config `images.*` with the staff override on top)'
      properties:
        enforce: {type: boolean}
        warnOnly: {type: boolean}
        maxBytes: {type: integer, format: int64}
        main:
          type: object
          additionalProperties: true
        other:
          type: object
          additionalProperties: true
    ImageRulesOverride:
      type: object
      additionalProperties: false
      description: What staff may change at run time; a field left out keeps the configured value.
      properties:
        warnOnly: {type: boolean, description: 'Main image appearance rejects (not white, fill, border) become warnings'}
        maxBytes: {type: integer, format: int64, minimum: 102400, maximum: 52428800}
        minLongestSide: {type: integer, minimum: 1, maximum: 10000}
        recommendedLongestSide: {type: integer, minimum: 1, maximum: 10000}
        minShortestSide: {type: integer, minimum: 1}
        fillReject: {type: number, minimum: 0, maximum: 1}
        fillWarn: {type: number, minimum: 0, maximum: 1}
        allowOnModelApparel: {type: boolean}
        otherWarnLongestSide: {type: integer, minimum: 1}
        otherMinShortestSide: {type: integer, minimum: 1}
        mismatchHold: {type: number, minimum: 0, maximum: 1}
    LibrarySlot:
      type: string
      enum: [MAIN, PT01, PT02, PT03, PT04, PT05, PT06, PT07, PT08, SWCH]
      description: 'Where a library image goes: MAIN image, additional images PT01–PT08 in order, or the variant swatch'
    LibraryImage:
      type: object
      required: [assetId, fileName, sku, slot, status, url, width, height, bytes, contentType, flags, createdAt]
      properties:
        assetId: {type: string, format: uuid}
        fileName: {type: string}
        sku: {type: [string, 'null'], description: SKU parsed from the file name (upper case)}
        slot:
          oneOf:
            - {$ref: '#/components/schemas/LibrarySlot'}
            - {type: 'null'}
        status: {type: string, enum: [READY, FLAGGED, REJECTED]}
        url: {type: [string, 'null'], description: 'Public URL when READY; null while held or when rejected'}
        width: {type: integer}
        height: {type: integer}
        bytes: {type: integer, format: int64}
        contentType: {type: string}
        flags: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        verdict: {$ref: '#/components/schemas/ImageVerdict'}
        checks: {type: array, items: {$ref: '#/components/schemas/ImageCheck'}}
    LibraryPage:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/LibraryImage'}}
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
    Moderation:
      type: object
      description: Checks a public image went through before it could be published (absent for other purposes).
      properties:
        verdict: {type: string, enum: [PASSED, HELD, BLOCKED]}
        reasons: {type: array, items: {type: string}}
        ai: {type: string, enum: [CHECKED, UNAVAILABLE, OFF], description: How the AI hook took part}
        aiLabels: {type: array, items: {type: string}, description: 'AI labels such as WATERMARK or NUDITY'}
        metadataStripped: {type: boolean, description: EXIF / XMP / text metadata was removed}
        duplicateOf: {type: string, description: Closest earlier image with the same perceptual hash}
        duplicateHeld: {type: boolean, description: Another seller's near-identical image is why it was held}
        mismatchScore: {type: number, description: 'AI title and brand mismatch score, 0 (matches) to 1'}
        reviewedBy: {type: string}
        reviewedAt: {type: string, format: date-time}
