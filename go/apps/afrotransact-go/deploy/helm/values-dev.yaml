# afrotransact-go in dev (image.tag / image.digest are written by the deploy / promote workflow). The modules it mounts are the
# cutover.services entries of infra/argocd/envs/dev/platform-values.yaml, listed in infra/argocd/launch-set/release-1.yaml.
env: dev
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
monitoring:
  serviceMonitor: true
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
