# afrotransact-go in prod (image.tag / image.digest are written by the deploy / promote workflow). The modules it mounts are the
# cutover.services entries of infra/argocd/envs/prod/platform-values.yaml, listed in infra/argocd/launch-set/release-1.yaml.
env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint: Alloy scrapes the pod annotations
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
