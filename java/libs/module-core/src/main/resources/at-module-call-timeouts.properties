# Default bounded wait of each in-process edge, `<caller>.<callee>[.<operation>]=<duration>` (module names as in the registry).
# Each value is the read timeout the edge's HTTP adapter used (its configured default), so a hung callee fails after the same
# time in both modes. An edge that is not listed gets 5 s (10 s when ai-gateway is the caller or the callee: an AI call behind it).
# Override one edge: at.<caller>.<callee>.timeout (module names without dashes: at.taxreturns.inventory.timeout=15s) or, for one operation,
# at.<caller>.<callee>.<operation>-timeout. Source of each default: the @Value / *Properties default of the Http* adapter.
orders.tax-returns=2s
payments.seller=3s
bookings.payments=10s
catalog.offers=3s
catalog.offers.batch=60s
catalog.seller=3s
catalog.orders=3s
catalog.tax-returns=5s
offers.catalog=3s
offers.seller=3s
offers.tax-returns=5s
identity.seller=10s
inventory.catalog=10s
seller.catalog=3s
seller.identity=10s
seller.content=10s
seller.inventory=10s
seller.ai-gateway=10s
seller.payments=10s
tax-returns.inventory=10s
tax-returns.orders=10s
tax-returns.payments=10s
tax-returns.fulfilment=10s
tax-returns.catalog=10s
trust-ops.payments=10s
trust-ops.bookings=10s
trust-ops.offers=10s
trust-ops.seller=10s
trust-ops.catalog=10s
trust-ops.orders=10s
trust-ops.ai-gateway=10s
# ai-gateway readers (Lola): at.ai.downstream.timeout was 5 s, so these five stay 5 s although ai-gateway is on one side
ai-gateway.catalog=5s
ai-gateway.offers=5s
ai-gateway.orders=5s
ai-gateway.bookings=5s
ai-gateway.tax-returns=5s
