# The 8-day trial runs the prod profile (ADR 0004). Its own pin file, never promoted from or to values-prod.yaml.
env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
monitoring:
  serviceMonitor: false
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
