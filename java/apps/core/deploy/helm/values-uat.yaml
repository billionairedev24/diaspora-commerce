# uat: the same shape as prod (one replica, no canary on the lean footprint). image.tag / image.digest: the promote workflow.
env: uat
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
monitoring:
  serviceMonitor: false
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.25"
extraEnv:
  # BEGIN module-env (generated by tools/release/chart_env_sync.py from the service charts; edit the service chart, then run it)
  CHECKOUT_PAYMENT_TIMEOUT: "15m"
  EDI_ENABLED: "false"
  ORDERS_ZONE: "America/Chicago"
  RETURN_CENTRE_CITY: "Houston"
  RETURN_CENTRE_COUNTRY: "US"
  RETURN_CENTRE_LINE1: "9800 Returns Pkwy"
  RETURN_CENTRE_NAME: "AfroTransact Returns"
  RETURN_CENTRE_NODE: "fc_houston"
  RETURN_CENTRE_POSTAL_CODE: "77032"
  RETURN_CENTRE_STATE: "TX"
  SIGNING_KEY_ID: "identity-uat-1"
  TAX_PROVIDER: "RULES"
  TEMPORAL_NAMESPACE: "afrotransact"
  TEMPORAL_TARGET: "temporal.temporal.svc.cluster.local:7233"
  # END module-env
