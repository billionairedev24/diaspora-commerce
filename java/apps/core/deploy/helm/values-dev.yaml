# dev runs everything on the shared cluster; modules move into core batch by batch through cutover.services in
# infra/argocd/envs/dev/platform-values.yaml (nothing is switched on here). image.tag / image.digest: written by the deploy workflow.
env: dev
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
resources:
  requests: {cpu: 250m, memory: 1024Mi}
  limits: {memory: 2048Mi}
extraEnv:
  # BEGIN module-env (generated by tools/release/chart_env_sync.py from the service charts; edit the service chart, then run it)
  CATALOG_BASE_URL: "http://catalog:8080"
  CHECKOUT_PAYMENT_TIMEOUT: "15m"
  COLLECT_PLAN_FEES_FROM_EARNINGS: "true"
  EDI_ENABLED: "false"
  INVENTORY_BASE_URL: "http://inventory:8080"
  MCP_PUBLIC_URL: "http://mcp-server.afrotransact-dev.svc.cluster.local"
  ORDERS_ZONE: "America/Chicago"
  RETURN_CENTRE_CITY: "Houston"
  RETURN_CENTRE_COUNTRY: "US"
  RETURN_CENTRE_LINE1: "9800 Returns Pkwy"
  RETURN_CENTRE_NAME: "AfroTransact Returns"
  RETURN_CENTRE_NODE: "fc_houston"
  RETURN_CENTRE_POSTAL_CODE: "77032"
  RETURN_CENTRE_STATE: "TX"
  SIGNING_KEY_ID: "identity-dev-1"
  TAX_PROVIDER: "RULES"
  TEMPORAL_NAMESPACE: "afrotransact-dev"
  TEMPORAL_TARGET: "afrotransact-dev.tmprl.cloud:7233"
  # END module-env
