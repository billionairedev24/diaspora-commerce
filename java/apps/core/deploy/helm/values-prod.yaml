# Production: OVH MKS, one b3-16 node, ONE core pod (prod profile). image.tag / image.digest: the promote workflow after a green
# release-1 build; a human syncs core-prod (manual sync). The modules it runs are the cutover.services entries of
# infra/argocd/envs/prod/platform-values.yaml (listed in infra/argocd/launch-set/release-1.yaml).
env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
# The REQUEST grows with the batches (docs/runbooks/release-1-deploy.md section 6, cloud-cost.md): 768Mi for batch 1, 1024Mi batch 2, 1280Mi batch 3,
# 1536Mi from batch 4. With the old JVMs still up, 2 x 1536Mi (a rolling-update surge) does not fit the node. The limit (the 2.0 GiB RSS cap) is constant.
resources:
  requests: {cpu: 500m, memory: 768Mi}
  limits: {memory: 2048Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint: Alloy scrapes the pod annotations (honor_labels, see observability)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
extraEnv:
  # BEGIN module-env (generated by tools/release/chart_env_sync.py from the service charts; edit the service chart, then run it)
  AI_CALLER_DAILY_COST_USD: "0.50"
  AI_GLOBAL_DAILY_COST_USD: "2.00"
  CATALOG_BASE_URL: "http://catalog:8080"
  CHECKOUT_PAYMENT_TIMEOUT: "15m"
  EDI_ENABLED: "false"
  INVENTORY_BASE_URL: "http://inventory:8080"
  MCP_PUBLIC_URL: "http://mcp-server.afrotransact-prod.svc.cluster.local"
  ORDERS_ZONE: "America/Chicago"
  RETURN_CENTRE_CITY: "Houston"
  RETURN_CENTRE_COUNTRY: "US"
  RETURN_CENTRE_LINE1: "9800 Returns Pkwy"
  RETURN_CENTRE_NAME: "AfroTransact Returns"
  RETURN_CENTRE_NODE: "fc_houston"
  RETURN_CENTRE_POSTAL_CODE: "77032"
  RETURN_CENTRE_STATE: "TX"
  SIGNING_KEY_ID: "identity-prod-1"
  TAX_PROVIDER: "RULES"
  TEMPORAL_NAMESPACE: "afrotransact"
  TEMPORAL_TARGET: "temporal.temporal.svc.cluster.local:7233"
  # END module-env
