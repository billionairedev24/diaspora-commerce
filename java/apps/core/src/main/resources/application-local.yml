# Local developer profile for afrotransact-core: docker compose stack from infra/local, security off, readable logs.
# The module-level local settings (taxonomy import, tax resolver ...) come from each module's own application-local.yml.
at:
  core:
    # Old standalone ports served by this one JVM (local only): a module left in http mode, a script or gateway-bff configured as
    # before keeps working. A request on a module's port prefers that module where two modules map the same route.
    module-ports:
      8100: identity
      8101: catalog
      8102: offers
      8103: inventory
      8104: orders
      8105: payments
      8106: seller
      8107: retail
      8108: fulfilment
      8109: bookings
      8110: trust-ops
      8111: tax-returns
      8112: content
      8113: ai-gateway
      8114: mcp-server
      8115: delivery-runs
  security:
    enabled: false
    fga:
      enabled: ${FGA_ENABLED:false}
  modules:
    schema-admin:
      # Local only: core creates each module's role and schema on start (idempotent). make core-db does the same up front.
      url: ${CORE_DB_ADMIN_URL:jdbc:postgresql://localhost:5432/core}
      username: ${CORE_DB_ADMIN_USER:postgres}
      password: ${CORE_DB_ADMIN_PASSWORD:postgres}
    catalog:
      datasource:
        # F15: the local database passwords live in this profile, so a missing password in uat or prod fails the start.
        password: ${CATALOG_DB_PASSWORD:catalog}
    tax-returns:
      datasource:
        password: ${TAX_RETURNS_DB_PASSWORD:tax_returns}
    offers:
      datasource:
        password: ${OFFERS_DB_PASSWORD:offers}
    inventory:
      datasource:
        password: ${INVENTORY_DB_PASSWORD:inventory}
    content:
      datasource:
        password: ${CONTENT_DB_PASSWORD:content}
    seller:
      datasource:
        password: ${SELLER_DB_PASSWORD:seller}
    orders:
      datasource:
        password: ${ORDERS_DB_PASSWORD:orders}
    payments:
      datasource:
        password: ${PAYMENTS_DB_PASSWORD:payments}
    bookings:
      datasource:
        password: ${BOOKINGS_DB_PASSWORD:bookings}
    fulfilment:
      datasource:
        password: ${FULFILMENT_DB_PASSWORD:fulfilment}
    trust-ops:
      datasource:
        password: ${TRUST_OPS_DB_PASSWORD:trust_ops}
    identity:
      datasource:
        password: ${IDENTITY_DB_PASSWORD:identity}
    retail:
      datasource:
        password: ${RETAIL_DB_PASSWORD:retail}
    delivery-runs:
      datasource:
        password: ${DELIVERY_RUNS_DB_PASSWORD:delivery_runs}
    ai-gateway:
      datasource:
        password: ${AI_GATEWAY_DB_PASSWORD:ai_gateway}
logging:
  level:
    com.afrotransact: DEBUG
