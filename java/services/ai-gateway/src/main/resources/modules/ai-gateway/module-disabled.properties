# Applied by afrotransact-core only while at.modules.ai-gateway.enabled=false: the Spring AI model auto-configuration would
# otherwise try to build OpenAI-compatible models without an API key and stop the whole application from starting.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
