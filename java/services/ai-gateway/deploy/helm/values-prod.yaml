env: prod
replicas: 3
autoscaling:
  enabled: true
  min: 3
  max: 12
  cpu: 70
rollout:
  enabled: true
resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {memory: 2Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  AUTH_ISSUER_URI: https://auth.afrotransact.com
  SEARCH_URL: http://search:8080
  CATALOG_URL: http://catalog:8080
  OFFERS_URL: http://offers:8080
  PROMISE_URL: http://promise:8080
  ORDERS_URL: http://orders:8080
  BOOKINGS_URL: http://bookings:8080
  OPENROUTER_REFERER: https://afrotransact.com
  LOLA_SSE_TIMEOUT: 120s
