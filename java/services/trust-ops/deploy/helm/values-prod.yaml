env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 640Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint (docs/engineering/cloud-cost.md)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70 -Xss512k"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  CATALOG_URL: http://catalog:8080
  BOOKINGS_URL: http://bookings:8080
  PAYMENTS_URL: http://payments:8080
  SELLER_URL: http://seller:8080
  OFFERS_URL: http://offers:8080
  AI_GATEWAY_URL: http://ai-gateway:8080
  AI_TRIAGE_ENABLED: "true"
  TRUSTOPS_SLA_SELLER_RESPONSE: 72h
  SELLER_HEALTH_WINDOW: 90d
