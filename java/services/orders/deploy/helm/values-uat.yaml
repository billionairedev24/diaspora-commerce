env: uat
replicas: 2
autoscaling:
  enabled: true
  min: 2
  max: 4
  cpu: 70
rollout:
  enabled: true
resources:
  requests: {cpu: 250m, memory: 768Mi}
  limits: {memory: 1536Mi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.5"
tolerations:
  - {key: afrotransact.com/spot, operator: Exists, effect: NoSchedule}
# Temporal Cloud: one namespace per environment (<namespace>.<account>); mTLS cert/key come from the secret store
# (TEMPORAL_TLS_CERT / TEMPORAL_TLS_KEY). Override TEMPORAL_TARGET / TEMPORAL_NAMESPACE with the account suffix in
# infra/argocd/envs/uat/platform-values.yaml if it differs.
extraEnv:
  AUTH_ISSUER_URI: https://auth.uat.afrotransact.com
  RETAIL_ORG_ID: org_afrotransact_retail
  ORDERS_ZONE: America/Chicago
  TEMPORAL_NAMESPACE: afrotransact-uat
  TEMPORAL_TARGET: afrotransact-uat.tmprl.cloud:7233
  CHECKOUT_PAYMENT_TIMEOUT: 15m
