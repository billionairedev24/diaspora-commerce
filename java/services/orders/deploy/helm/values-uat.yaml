env: uat
replicas: 2
autoscaling:
  enabled: true
  min: 2
  max: 4
  cpu: 70
rollout:
  enabled: true
resources:
  requests: {cpu: 250m, memory: 768Mi}
  limits: {memory: 1536Mi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.5"
tolerations:
  - {key: afrotransact.com/spot, operator: Exists, effect: NoSchedule}
# UAT runs the SELF-HOSTED Temporal of the lean platform (infra/k8s/platform/lean/temporal.yaml, namespace "afrotransact", state in
# Layerbase): no Temporal Cloud, no mTLS, no `temporal-cloud` profile (a deployable cannot switch a profile for one module anyway).
# Temporal Cloud instead: SPRING_PROFILES_ACTIVE "uat,temporal-cloud", TEMPORAL_TARGET <ns>.<account>.tmprl.cloud:7233 and the mTLS secrets.
extraEnv:
  RETAIL_ORG_ID: org_afrotransact_retail
  ORDERS_ZONE: America/Chicago
  TEMPORAL_NAMESPACE: afrotransact
  TEMPORAL_TARGET: temporal.temporal.svc.cluster.local:7233
  CHECKOUT_PAYMENT_TIMEOUT: 15m
