# Production: reference pages off (published on developers.afrotransact.com), sampled traces. Temporal is the
# in-cluster server by default (no TLS, private to the namespace); add the `temporal-cloud` profile for Temporal Cloud mTLS.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
  temporal:
    connection:
      target: ${TEMPORAL_TARGET}
    namespace: ${TEMPORAL_NAMESPACE:afrotransact-prod}
at:
  security:
    # S248 OpenFGA relationship checks. Off until uat has run enforced; flip FGA_ENABLED (shadow) then FGA_ENFORCE per runbook.
    fga:
      enabled: ${FGA_ENABLED:false}
      enforce: ${FGA_ENFORCE:false}
      # In-cluster OpenFGA (infra/k8s/platform/openfga); FGA_API_TOKEN comes from the service's secret.
      api-url: ${FGA_API_URL:http://openfga.openfga.svc:8080}
  api-docs:
    enabled: false
  orders:
    handover:
      key: ${HANDOVER_CODE_KEY}
    pay-links:
      key: ${PAY_LINK_KEY}
    upstreams:
      cart-url: ${CART_URL:http://cart}
      identity-url: ${IDENTITY_URL:http://identity}
      inventory-url: ${INVENTORY_URL:http://inventory}
      payments-url: ${PAYMENTS_URL:http://payments}
      promise-url: ${PROMISE_URL:http://promise}
      content-url: ${CONTENT_URL:http://content}
      catalog-url: ${CATALOG_URL:http://catalog}
      # POST /v1/tax/quotes at checkout (scope tax:quote). Without it orders would call localhost and every checkout would fail.
      tax-returns-url: ${TAX_RETURNS_URL:http://tax-returns}
      offers-url: ${OFFERS_URL:http://offers}
      seller-url: ${SELLER_URL:http://seller}
      geo-url: ${GEO_URL:http://geo}
      delivery-runs-url: ${DELIVERY_RUNS_URL:http://delivery-runs}
      # Customer pickup points chosen at checkout (public GET /v1/pickup-locations/{id}).
      carrier-gateway-url: ${CARRIER_GATEWAY_URL:http://carrier-gateway}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
