spring:
  application:
    name: orders-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URL:http://localhost:8100}
  # Temporal (temporal-spring-boot-starter). The checkout worker polls task queue "orders-checkout" in the namespace
  # of the environment. Cloud environments add mTLS (Temporal Cloud) in application-<env>.yml.
  data:
    redis:
      # Valkey: live shipment feed fan-out across replicas (S219).
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
  temporal:
    connection:
      target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:afrotransact}   # local docker-compose namespace (DEFAULT_NAMESPACE); dev/uat/prod override
    start-workers: ${TEMPORAL_START_WORKERS:true}
    workers-auto-discovery:
      packages:
        - com.afrotransact.orders.application

server:
  port: ${PORT:8104}
  shutdown: graceful

management:
  health:
    redis:
      # The live feed degrades to this replica when Valkey is down; that must not take the pod out of service.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: afrotransact
      deployment.environment: ${APP_ENV:local}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      service: orders-service
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

at:
  security:
    # What delivery costs is public (the storefront estimate reads it): GET /v1/public/shipping-settings.
    public-paths:
      - /v1/public/shipping-settings
    # S248 fine-grained authorisation (OpenFGA, docs/engineering/authorisation.md). Off unless FGA_ENABLED=true;
    # enforce=false is shadow mode: relationship denials are logged ("FGA shadow:"), not enforced.
    fga:
      enabled: ${FGA_ENABLED:false}
      enforce: ${FGA_ENFORCE:true}
      api-url: ${FGA_API_URL:http://localhost:8091}
      store-id: ${FGA_STORE_ID:}
      store-name: ${FGA_STORE_NAME:afrotransact}
      model-id: ${FGA_MODEL_ID:}
      api-token: ${FGA_API_TOKEN:}
      timeout: ${FGA_TIMEOUT:500ms}
      cache-ttl: ${FGA_CACHE_TTL:5s}
  api-docs:
    title: Orders API
    description: >-
      Checkout saga on Temporal (cart validation, price and tax snapshot, all-or-nothing stock reservation,
      PaymentIntent with manual capture, payment wait with compensations), orders split into one shipment per seller
      and fulfilment node, the shipment state machine with actor rules per fulfilment type, delivery preferences and
      handover codes, courier events with proof of delivery, capture per shipment and settlement notices.
    version: v1
  events:
    relay-enabled: true
  orders:
    live-feed:
      # valkey: every replica's SSE subscribers get every transition (pub/sub); local: this replica only.
      fanout: ${LIVE_FEED_FANOUT:valkey}
      channel: ${LIVE_FEED_CHANNEL:at:orders:shipment-status}
    retail-org-id: ${RETAIL_ORG_ID:org_afrotransact_retail}
    # How long checkout waits for the payment authorisation; matches inventory's reservation TTL.
    payment-timeout: ${CHECKOUT_PAYMENT_TIMEOUT:15m}
    # gateway-bff's orders.slowTimeout (25s, POST /v1/checkout and /confirm) must stay above this, so the BFF never
    # gives up while the saga still answers (tools/ci/check_env_config.py checks it).
    checkout-response-timeout: ${CHECKOUT_RESPONSE_TIMEOUT:20s}
    zone: ${ORDERS_ZONE:America/Chicago}
    # Product types of the category tax tree (catalog's `perishable` trait: dairy, produce, frozen, meat and fish): they get a
    # handover code and the perishable promise. The old single `perishable` type no longer exists.
    perishable-types: [dairy-eggs, fresh-produce, frozen-meals, meat-poultry-fish]
    # Product type of the tree -> the commission category of payments' fee schedule (departments Groceries & Food and
    # Beverages = groceries, Fashion = fashion, Beauty = beauty, Home = home & art, Books = books, Health = health,
    # Services = services). Types not listed (Electronics, Baby & Kids, Pets, Digital, Other) are sent under their own
    # code and take the schedule's default rate until the owner sets a category rate for them.
    commission-categories:
      baby-food-formula: groceries
      bakery-products: groceries
      beans-pantry-sauces: groceries
      candy-gum: groceries
      cooking-oils: groceries
      dairy-eggs: groceries
      flours-starches: groceries
      fresh-produce: groceries
      frozen-meals: groceries
      meat-poultry-fish: groceries
      nuts-seeds: groceries
      packaged-snacks: groceries
      pasta-noodles: groceries
      prepared-meals: groceries
      rice-grains: groceries
      spices-seasonings: groceries
      coffee-tea-dry: groceries
      energy-protein-drink-mixes: groceries
      flavored-water-soda: groceries
      fruit-vegetable-juice: groceries
      plain-water: groceries
      ready-to-drink-coffee-tea: groceries
      hair-accessories: beauty
      haircare: beauty
      medicated-skincare: beauty
      perfumes-fragrances: beauty
      skincare-cosmetics: beauty
      wigs-extensions: beauty
      dress: fashion
      top: fashion
      menwear: fashion
      footwear: fashion
      bags-purses: fashion
      kids: fashion
      jewelry-accessories: fashion
      bedding-linens: 'home & art'
      cleaning-paper-products: 'home & art'
      decor-candles: 'home & art'
      furniture-small-appliances: 'home & art'
      kitchenware-cookware: 'home & art'
      magazines: books
      printed-books: books
      dietary-supplements: health
      feminine-hygiene: health
      first-aid-wound-care: health
      medical-devices: health
      otc-medicines: health
      personal-hygiene: health
      event-tickets: services
      fitness-classes: services
      hair-beauty-appointments: services
      laundry-dry-cleaning: services
      photography-media: services
      repairs: services
      residential-cleaning: services
      tutoring-consulting: services
      fabrics-textiles: fashion
    # Listing rules D16 to D18: the delivery fee is NOT configured here. It is one staff-editable record in the database
    # (shipping_settings, Settings > Flat delivery fee), read by the estimate and by checkout. Only the carrier fallback of
    # seller-shipped packages (off at launch) and the fallback delivery estimates (business days) live here.
    shipping:
      carrier-standard-minor: 599
      free-carrier-above-minor: 3500
      standard-days: 5
      delivery-days: 1
      pickup-days: 1
    # Checkout tax: tax-returns' POST /v1/tax/quotes (orders-service token, scope tax:quote) reads the stored per-line
    # decision. There is no rate table and no default rate: a line without a definite decision blocks the checkout
    # (orders.tax-line-blocked) and an unreachable tax-returns fails the saga step, which is retried.
    tax:
      # PROPORTIONAL (default) spreads a package's delivery charge over its lines by net item value (TX-05..07);
      # FIRST_LINE is the rollback to the previous behaviour. OPEN LEGAL DECISION 5: the tax adviser must approve the
      # mixed-basket method before production (docs/engineering/checkout-tax-estimate.md).
      shipping-allocation: ${ORDERS_TAX_SHIPPING_ALLOCATION:PROPORTIONAL}
    # Return windows for the order views' "Return or replace items" link; mirrors at.taxreturns.returns (tax-returns
    # decides eligibility, including seller policies).
    returns:
      window-days: ${RETURN_WINDOW_DAYS:30}
      window-days-by-product-type:
        electronics: 15
        books: 30
      non-returnable-product-types: [perishable, fresh-produce, frozen-food, meat-seafood, prepared-meals, hot-food,
                                     pantry, spices, grains, beverages]
    # Handling time (business days after the order day) before a shipment must be handed over.
    ship-by:
      afrotransact-days: 1
      seller-days: 2
    handover:
      # AES key material for sealing customer handover codes (HANDOVER_CODE_KEY in cloud).
      key: ${HANDOVER_CODE_KEY}
    # Pay-now links of late pre-order adds: <base-url>/orders/<number>/pay?token=<HMAC token>. The customer pays the
    # order's PaymentIntent with Stripe Elements on the storefront (never a Stripe-hosted page). PAY_LINK_KEY in cloud.
    pay-links:
      base-url: ${PUBLIC_WEB_URL:http://localhost:3000}
      key: ${PAY_LINK_KEY}
    oauth:
      issuer-url: ${AUTH_ISSUER_URL:http://localhost:8100}
      token-path: /oauth2/token
      client-id: ${ORDERS_CLIENT_ID:orders-service}
      client-secret: ${ORDERS_CLIENT_SECRET}
      scopes: payments:service inventory:reserve cart:service tax:quote sellers:ship-from.read offers:read delivery-runs:reserve
    upstreams:
      timeout: ${UPSTREAM_TIMEOUT:5s}
      promise-timeout: ${PROMISE_TIMEOUT:800ms}
      cart-url: ${CART_URL:http://localhost:8203}
      identity-url: ${IDENTITY_URL:http://localhost:8100}
      inventory-url: ${INVENTORY_URL:http://localhost:8103}
      payments-url: ${PAYMENTS_URL:http://localhost:8105}
      promise-url: ${PROMISE_URL:http://localhost:8204}
      content-url: ${CONTENT_URL:http://localhost:8112}
      catalog-url: ${CATALOG_URL:http://localhost:8101}
      offers-url: ${OFFERS_URL:http://localhost:8102}
      # S255 AfroTransact Delivery from seller stores: pickup locations (seller, sellers:ship-from.read) and
      # distances (geo, public).
      seller-url: ${SELLER_URL:http://localhost:8106}
      geo-url: ${GEO_URL:http://localhost:8205}
      tax-returns-url: ${TAX_RETURNS_URL:http://localhost:8111}
      # S272 pre-orders: eligibility of cart lines (delivery-runs-service, scope delivery-runs:reserve).
      delivery-runs-url: ${DELIVERY_RUNS_URL:http://localhost:8115}
      # Customer pickup points chosen at checkout (public GET /v1/pickup-locations/{id}).
      carrier-gateway-url: ${CARRIER_GATEWAY_URL:http://localhost:8209}
      tax-timeout: ${TAX_QUOTE_TIMEOUT:2s}
    topics:
      payment-events: at.payment.events
      carrier-events: at.carrier-shipment.events
      # ADR 0005: preorder.window.cancelled and delivery-runs.run.cancelled refund every order on them in full.
      delivery-runs-events: at.delivery-runs.events
    consumers:
      enabled: ${ORDERS_CONSUMERS_ENABLED:true}
    # S272 community pre-orders: cart lines in an open window become a PREORDER package (door or pickup, charged at
    # checkout); off = every line ships now. Jobs flag missed delivery dates and void unpaid late-add pay-now links
    # (cancelling their PaymentIntent). A second late add of the same items for the same customer and window within
    # late-add-duplicate-window is refused even with another Idempotency-Key.
    preorders:
      enabled: ${PREORDERS_ENABLED:true}
      # S261: offer the next open delivery run staff scheduled for the address (AfroTransact-held goods) before a window
      runs-enabled: ${PREORDER_RUNS_ENABLED:true}
      job-batch: 100
      link-expiry-hours: 24
      late-add-duplicate-window: 10m
      missed-delivery-interval: ${PREORDER_MISSED_DELIVERY_INTERVAL:15m}
      link-expiry-interval: ${PREORDER_LINK_EXPIRY_INTERVAL:5m}
    jobs:
      enabled: ${ORDERS_JOBS_ENABLED:true}
      follow-up-interval: ${FOLLOW_UP_INTERVAL:5s}
      follow-up-batch: 50
      follow-up-max-attempts: 12
