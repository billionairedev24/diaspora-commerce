# UAT / staging: production-like, anonymised data, API reference pages on for testers. Temporal Cloud with mTLS.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  temporal:
    connection:
      target: ${TEMPORAL_TARGET}
      mtls:
        cert-chain: ${TEMPORAL_TLS_CERT}
        key: ${TEMPORAL_TLS_KEY}
    namespace: ${TEMPORAL_NAMESPACE:afrotransact-uat}
at:
  security:
    # S248 OpenFGA relationship checks. Shadow mode: denials are logged (FGA shadow) and reviewed before FGA_ENFORCE=true.
    fga:
      enabled: ${FGA_ENABLED:true}
      enforce: ${FGA_ENFORCE:false}
      # In-cluster OpenFGA (infra/k8s/platform/openfga); FGA_API_TOKEN comes from the service's secret.
      api-url: ${FGA_API_URL:http://openfga.openfga.svc:8080}
  api-docs:
    enabled: true
  orders:
    # S235: checkout tax must come from tax-returns' quote (per line, local rates, shipping); when it is down the
    # checkout's tax step fails and the saga retries it instead of charging the interim per-state table.
    tax:
      fallback-to-table: ${ORDERS_TAX_FALLBACK_TO_TABLE:false}
    handover:
      key: ${HANDOVER_CODE_KEY}
    upstreams:
      cart-url: ${CART_URL:http://cart}
      identity-url: ${IDENTITY_URL:http://identity}
      inventory-url: ${INVENTORY_URL:http://inventory}
      payments-url: ${PAYMENTS_URL:http://payments}
      promise-url: ${PROMISE_URL:http://promise}
      content-url: ${CONTENT_URL:http://content}
      catalog-url: ${CATALOG_URL:http://catalog}
      offers-url: ${OFFERS_URL:http://offers}
      seller-url: ${SELLER_URL:http://seller}
      geo-url: ${GEO_URL:http://geo}
management:
  tracing:
    sampling:
      probability: 0.5
