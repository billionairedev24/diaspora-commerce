# UAT / staging: production-like, anonymised data, API reference pages on for testers.
at:
  security:
    # S248 OpenFGA relationship checks. Shadow mode: denials are logged (FGA shadow) and reviewed before FGA_ENFORCE=true.
    fga:
      enabled: ${FGA_ENABLED:true}
      enforce: ${FGA_ENFORCE:false}
      # In-cluster OpenFGA (infra/k8s/platform/openfga); FGA_API_TOKEN comes from the service's secret.
      api-url: ${FGA_API_URL:http://openfga.openfga.svc:8080}
  catalog:
    tax:
      # The publish gate asks tax-returns (POST /v1/tax/classifications/resolve, scope tax:classify). `local` is the
      # dataset fake for the local stack only: a deployed catalog never resolves tax by itself.
      resolver: ${CATALOG_TAX_RESOLVER:http}
      base-url: ${TAX_RETURNS_URL:http://tax-returns}
    media:
      # In-cluster service name of media-service (Helm chart `media`, port 8080).
      base-url: ${MEDIA_URL:http://media:8080}
    oauth:
      # identity's catalog-service client secret, only from the environment (secret store).
      client-secret: ${CATALOG_CLIENT_SECRET:}
  api-docs:
    enabled: true
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
management:
  tracing:
    sampling:
      probability: 0.5
