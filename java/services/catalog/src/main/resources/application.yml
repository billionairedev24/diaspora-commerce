spring:
  application:
    name: catalog-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP:catalog-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8100}

server:
  port: ${PORT:8101}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: afrotransact
      deployment.environment: ${APP_ENV:local}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      service: catalog-service
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

at:
  consumers:
    # Kafka listeners for other services' events (off in tests that have no broker).
    enabled: ${CONSUMERS_ENABLED:true}
  api-docs:
    title: Catalog API
    description: Products (ATIN/GTIN), variants, category tree, product-type schemas and category requests.
    version: v1
  security:
    public-paths:
      - /v1/categories
      - /v1/product-types
      - /v1/product-types/*
      - /v1/public/**
  events:
    relay-enabled: true
  catalog:
    retail-org-id: ${RETAIL_ORG_ID:org_afrotransact_retail}
