spring:
  application:
    name: catalog-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  servlet:
    multipart:
      # S308 bulk upload: 10 MB per file (ImportLimits.MAX_FILE_BYTES), a little more for the form fields.
      max-file-size: 10MB
      max-request-size: 11MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP:catalog-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URL:http://localhost:8100}

server:
  port: ${PORT:8101}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: afrotransact
      deployment.environment: ${APP_ENV:local}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      service: catalog-service
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

at:
  consumers:
    # Kafka listeners for other services' events (off in tests that have no broker).
    enabled: ${CONSUMERS_ENABLED:true}
  api-docs:
    title: Catalog API
    description: Products (ATIN/GTIN), variants, category tree, product-type schemas and category requests.
    version: v1
  security:
    # S248 fine-grained authorisation (OpenFGA, docs/engineering/authorisation.md). Off unless FGA_ENABLED=true;
    # enforce=false is shadow mode: relationship denials are logged ("FGA shadow:"), not enforced.
    fga:
      enabled: ${FGA_ENABLED:false}
      enforce: ${FGA_ENFORCE:true}
      api-url: ${FGA_API_URL:http://localhost:8091}
      store-id: ${FGA_STORE_ID:}
      store-name: ${FGA_STORE_NAME:afrotransact}
      model-id: ${FGA_MODEL_ID:}
      api-token: ${FGA_API_TOKEN:}
      timeout: ${FGA_TIMEOUT:500ms}
      cache-ttl: ${FGA_CACHE_TTL:5s}
    public-paths:
      - /v1/categories
      - /v1/product-types
      - /v1/product-types/*
      - /v1/public/**
  events:
    relay-enabled: true
  catalog:
    retail-org-id: ${RETAIL_ORG_ID:org_afrotransact_retail}
    # S216: seller.listings.hidden|restored republish an org's products in pages, one transaction per page.
    listing-enforcement:
      page-size: ${LISTING_ENFORCEMENT_PAGE_SIZE:500}
      stall-after: 2m          # a running run with no page committed for this long is resumed by the job
      resume-interval: 60s
    # S308 bulk upload: the background import notifies the seller for uploads of at least notify-min-rows rows;
    # a queued or running import without progress for stall-after is resumed by another pod.
    imports:
      notify-min-rows: ${IMPORT_NOTIFY_MIN_ROWS:100}
      stall-after: 2m
      resume-interval: 60s
    # S308: images of bulk uploads are copied from their URLs by media-service (POST /v1/assets/import).
    media:
      base-url: ${MEDIA_URL:http://localhost:8207}
      timeout: ${MEDIA_TIMEOUT:30s}
    # catalog-service's own client-credentials token (identity client catalog-service, scope media:import).
    oauth:
      issuer-url: ${AUTH_ISSUER_URL:http://localhost:8100}
      token-path: /oauth2/token
      client-id: ${CATALOG_CLIENT_ID:catalog-service}
      client-secret: ${CATALOG_CLIENT_SECRET:local-catalog-service-secret}
      scopes: media:import
    # S031 GTIN prefill: providers in lookup order, cached per GTIN in product_data_lookup.
    product-data:
      order: ${PRODUCT_DATA_ORDER:GS1,OPEN_FOOD_FACTS}
      cache-ttl: ${PRODUCT_DATA_CACHE_TTL:7d}
      miss-ttl: ${PRODUCT_DATA_MISS_TTL:1d}
      gs1:
        enabled: ${GS1_ENABLED:false}
        base-url: ${GS1_BASE_URL:https://grp.gs1.org}
        api-key: ${GS1_API_KEY:}
        timeout: ${GS1_TIMEOUT:3s}
      open-food-facts:
        enabled: ${OFF_ENABLED:true}
        base-url: ${OFF_BASE_URL:https://world.openfoodfacts.org}
        user-agent: ${OFF_USER_AGENT:AfroTransact-Catalog/1.0 (catalog@afrotransact.com)}
        timeout: ${OFF_TIMEOUT:3s}
