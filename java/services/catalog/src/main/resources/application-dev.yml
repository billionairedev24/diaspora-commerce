# Shared dev cluster: per-PR preview namespaces; API reference pages on.
at:
  security:
    # S248 OpenFGA relationship checks. Enforced: authz-sync runs in dev and owns the store and model.
    fga:
      enabled: ${FGA_ENABLED:true}
      enforce: ${FGA_ENFORCE:false}  # shadow until authz-sync seeds service-client tuples (S248)
      # In-cluster OpenFGA (infra/k8s/platform/openfga); FGA_API_TOKEN comes from the service's secret.
      api-url: ${FGA_API_URL:http://openfga.openfga.svc:8080}
  catalog:
    media:
      # In-cluster service name of media-service (Helm chart `media`, port 8080).
      base-url: ${MEDIA_URL:http://media:8080}
    oauth:
      # identity's catalog-service client secret, only from the environment (secret store).
      client-secret: ${CATALOG_CLIENT_SECRET:}
  api-docs:
    enabled: true
management:
  tracing:
    sampling:
      probability: 1.0
