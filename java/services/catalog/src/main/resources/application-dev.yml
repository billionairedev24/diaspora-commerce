# Shared dev cluster: per-PR preview namespaces; API reference pages on.
at:
  security:
    # S248 OpenFGA relationship checks. Enforced: authz-sync runs in dev and owns the store and model.
    fga:
      enabled: ${FGA_ENABLED:true}
      enforce: ${FGA_ENFORCE:true}
      # In-cluster OpenFGA (infra/k8s/platform/openfga); FGA_API_TOKEN comes from the service's secret.
      api-url: ${FGA_API_URL:http://openfga.openfga.svc:8080}
  api-docs:
    enabled: true
management:
  tracing:
    sampling:
      probability: 1.0
