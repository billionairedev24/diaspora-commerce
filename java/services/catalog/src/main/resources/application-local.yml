# Local developer profile: docker compose stack from infra/local, security off, human-readable logs.
at:
  catalog:
    images:
      mode: ${CATALOG_IMAGE_MODE:off}  # the local seeds use external pictures; try CATALOG_IMAGE_MODE=shadow or enforce with media on :8207
    taxonomy:
      import-on-start: true
    tax:
      # Facts are resolved with the local fake built from the dataset, but the decision that counts is tax-returns' stored one
      # (at.catalog.tax.authority, default tax-returns on :8111): a listing goes live only once tax review approved it there.
      resolver: ${CATALOG_TAX_RESOLVER:local}
      review-required: true
  security:
    enabled: false
    # Security is off locally (every call is the local super admin), so relationship checks stay off too. To try
    # them: FGA_ENABLED=true with docker compose's OpenFGA on :8091 and authz-sync running (it creates the store).
    fga:
      enabled: ${FGA_ENABLED:false}
      api-url: ${FGA_API_URL:http://localhost:8091}
logging:
  level:
    com.afrotransact: DEBUG
# F15: the local database password lives here, not in application.yml, so a missing DB_PASSWORD in uat or prod
# fails the start instead of falling back to the service name.
spring:
  datasource:
    password: ${DB_PASSWORD:catalog}
# F15: local-only default of the service client secret (identity's local profile registers the matching client).
at.catalog.oauth.client-secret: ${CATALOG_CLIENT_SECRET:local-catalog-service-secret}
