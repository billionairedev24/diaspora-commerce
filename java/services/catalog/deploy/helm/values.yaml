# Base values for catalog. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: catalog
  runtime: java
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: catalog-service
  tag: dev   # sentinel for local renders; the deploy pipeline writes the git sha into values-<env>.yaml
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/catalog in the cloud secret store:
#   - DB_URL
#   - DB_USER
#   - DB_PASSWORD
#   - KAFKA_BOOTSTRAP
#   - GS1_API_KEY (optional: Verified by GS1 for the S031 GTIN prefill; also set extraEnv GS1_ENABLED: "true")
#   - FGA_API_TOKEN            (one of OpenFGA's pre-shared keys, afrotransact/openfga preshared-keys; S248)
#   - CATALOG_CLIENT_SECRET    (identity's catalog-service client, scopes media:import: bulk-upload images, S308, orders:purchase-check: verified-purchase reviews, S324, sellers:catalog-scope.read: the departments a seller may list in, and tax:classify: the tax publish gate asks tax-returns to resolve a variant's facts)
secrets:
  enabled: true
  store: platform-secrets
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv:
  # Which departments a seller may list in: seller-service's catalog scope (fail closed when it is down).
  SELLER_URL: http://seller:8080
  # The tax publish gate: tax-returns' resolve endpoint (scope tax:classify on the catalog-service client). `local` (the
  # dataset fake) is for the local stack only.
  TAX_RETURNS_URL: http://tax-returns
  CATALOG_TAX_RESOLVER: http
nodeSelector: {}
tolerations: []
