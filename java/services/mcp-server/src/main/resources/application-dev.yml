# Shared dev cluster: API reference pages on; MCP Inspector and the dev storefront may call /mcp from a browser.
at:
  api-docs:
    enabled: true
  mcp:
    allowed-origins: ${MCP_ALLOWED_ORIGINS:${PUBLIC_WEB_URL:https://dev.afrotransact.com},https://developers.${PLATFORM_DOMAIN:dev.afrotransact.com}}
management:
  tracing:
    sampling:
      probability: 1.0
