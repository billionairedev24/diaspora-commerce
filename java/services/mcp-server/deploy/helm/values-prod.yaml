env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 640Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint (docs/engineering/cloud-cost.md)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70 -Xss512k -XX:-UsePerfData -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
  # No database (no Hikari pool). OAuth 2.1 bearer tokens from identity are REQUIRED: at.security.enabled is only ever false in
  # the local profile, and it is pinned here so a stray override cannot open the server (McpSecurityConfiguration).
  AT_SECURITY_ENABLED: "true"
  # mcp-server is PRIVATE (owner decision, docs/runbooks/ai-spend-and-mcp-access.md): ClusterIP only, no public hostname, no route
  # through the Cloudflare Tunnel or Envoy. This is its in-cluster address (resource indicator in the OAuth protected-resource
  # metadata); consumers call http://mcp-server.afrotransact-prod.svc.cluster.local. McpExposureGuard accepts this form only
  # because AT_SECURITY_ENABLED is true.
  MCP_PUBLIC_URL: http://mcp-server.afrotransact-prod.svc.cluster.local
  SEARCH_URL: http://search:8080
  CATALOG_URL: http://catalog:8080
  CART_URL: http://cart:8080
  INVENTORY_URL: http://inventory:8080
  GEO_URL: http://geo:8080
  PROMISE_URL: http://promise:8080
  ORDERS_URL: http://orders:8080
  SELLER_URL: http://seller:8080
  PAYMENTS_URL: http://payments:8080
  BOOKINGS_URL: http://bookings:8080
  TAX_URL: http://tax-returns:8080
