# Base values for mcp-server. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: mcp-server
  runtime: java
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: mcp-server-service
  tag: latest
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/mcp-server in the cloud secret store:
#   - KAFKA_BOOTSTRAP
secrets:
  enabled: true
  store: platform-secrets
  keySeparator: "/"     # "-" on GCP Secret Manager and Azure Key Vault (set in platform-values.yaml)
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv:
  AUTH_ISSUER_URI: https://auth.dev.afrotransact.com
  # External URL MCP clients use (resource indicator in the OAuth protected-resource metadata).
  MCP_PUBLIC_URL: https://mcp.dev.afrotransact.com
  SEARCH_URL: http://search:8080
  CATALOG_URL: http://catalog:8080
  CART_URL: http://cart:8080
  INVENTORY_URL: http://inventory:8080
  GEO_URL: http://geo:8080
  PROMISE_URL: http://promise:8080
  ORDERS_URL: http://orders:8080
  SELLER_URL: http://seller:8080
  PAYMENTS_URL: http://payments:8080
  BOOKINGS_URL: http://bookings:8080
nodeSelector: {}
tolerations: []
