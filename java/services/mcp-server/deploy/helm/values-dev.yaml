env: dev
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 2
  cpu: 70
rollout:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
tolerations:
  - {key: afrotransact.com/spot, operator: Exists, effect: NoSchedule}
extraEnv:
  # External URL MCP clients use (resource indicator in the OAuth protected-resource metadata). mcp.<domain> is not
  # derived by the library (it is this service's own host); set it per environment.
  MCP_PUBLIC_URL: https://mcp.dev.afrotransact.com
