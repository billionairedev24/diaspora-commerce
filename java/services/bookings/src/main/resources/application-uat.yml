# UAT / staging: production-like, anonymised data, API reference pages on for testers.
at:
  api-docs:
    enabled: true
  bookings:
    manage-url-base: ${BOOKINGS_MANAGE_URL_BASE:${PUBLIC_WEB_URL:https://uat.afrotransact.com}/account/appointments/}
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
management:
  tracing:
    sampling:
      probability: 0.5
