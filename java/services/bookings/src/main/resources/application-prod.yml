# Production: reference pages off (published on developers.afrotransact.com), sampled traces.
at:
  api-docs:
    enabled: false
  bookings:
    manage-url-base: ${BOOKINGS_MANAGE_URL_BASE:${PUBLIC_WEB_URL:https://afrotransact.com}/account/appointments/}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
