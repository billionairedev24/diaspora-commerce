env: uat
replicas: 2
autoscaling:
  enabled: true
  min: 2
  max: 4
  cpu: 70
rollout:
  enabled: true
resources:
  requests: {cpu: 250m, memory: 768Mi}
  limits: {memory: 1536Mi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.5"
tolerations:
  - {key: afrotransact.com/spot, operator: Exists, effect: NoSchedule}
extraEnv:
  AUTH_ISSUER_URI: https://auth.uat.afrotransact.com
  AUTH_TOKEN_URI: https://auth.uat.afrotransact.com/oauth2/token
  PAYMENTS_URL: http://payments:8080
  GEO_URL: http://geo:8080
  BOOKINGS_REQUEST_SLA: 4h
  BOOKING_HOLD_TTL: 15m
  BOOKINGS_MANAGE_URL_BASE: https://uat.afrotransact.com/account/appointments/
