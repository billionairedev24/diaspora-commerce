spring:
  application:
    name: inventory-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP:inventory-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URL:http://localhost:8100}

server:
  port: ${PORT:8103}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: afrotransact
      deployment.environment: ${APP_ENV:local}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      service: inventory-service
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

at:
  api-docs:
    title: Inventory API
    description: >-
      Sellable stock for AfroTransact-owned (1P) products and seller stock held in AfroTransact fulfilment centres
      (FBA): positions per SKU × node, lots with expiry (FEFO), all-or-nothing reservations, receipts, lot
      operations and the append-only stock ledger.
    version: v1
  security:
    public-paths:
      - /v1/availability
  events:
    relay-enabled: true
  consumers:
    enabled: ${CONSUMERS_ENABLED:true}
  inventory:
    retail-org-id: ${RETAIL_ORG_ID:org_afrotransact_retail}
    # Checkout holds are released automatically after this long unless confirmed (payment authorised).
    reservation-ttl: ${RESERVATION_TTL:15m}
    # FEFO skips lots that would expire within this many days of today (node-local date).
    fefo-min-remaining-days: ${FEFO_MIN_REMAINING_DAYS:7}
    # Currencies stock may be sourced and received in (ADR 0005 §7); customers always pay in USD and USD is always accepted.
    cost-currencies: ${COST_CURRENCIES:USD,MXN,NGN,GHS,CAD,EUR,GBP,ZAR,KES,XOF}
    shelf-life:
      # Receipts quarantine lots whose remaining life is below max(min-days, min-fraction × shelf life).
      min-days: 90
      min-fraction: 0.5
    storage:
      # FBA storage billing (S206): volume of one unit whose SKU has no dimensions yet.
      default-unit-cubic-feet: ${STORAGE_DEFAULT_UNIT_CUBIC_FEET:0.25}
    jobs:
      enabled: ${INVENTORY_JOBS_ENABLED:true}
      reservation-sweep-interval: ${RESERVATION_SWEEP_INTERVAL:30s}
      reservation-sweep-batch: 200
      # Hourly so each node expires lots shortly after its own local midnight; the job is idempotent.
      expire-lots-cron: ${EXPIRE_LOTS_CRON:0 5 * * * *}
      markdown-cron: ${MARKDOWN_CRON:0 20 2 * * *}
      reconciliation-cron: ${RECONCILIATION_CRON:0 40 2 * * *}
      # Hourly: retakes today's (UTC) storage snapshot; the last run of the day stands. Idempotent.
      storage-snapshot-cron: ${STORAGE_SNAPSHOT_CRON:0 55 * * * *}
      zone: ${JOBS_ZONE:UTC}
    # S257: AT-FN unit labels and label rendering (catalog), inbound labels and tracking (carrier-gateway).
    catalog:
      base-url: ${CATALOG_URL:http://localhost:8101}
      timeout: ${CATALOG_TIMEOUT:10s}
    carrier-gateway:
      base-url: ${CARRIER_GATEWAY_URL:http://localhost:8209}
      timeout: ${CARRIER_GATEWAY_TIMEOUT:15s}
    auth:
      # Client-credentials token for catalog and carrier-gateway calls. Blank secret = no token (local).
      token-uri: ${AUTH_TOKEN_URL:${AUTH_ISSUER_URL:http://localhost:8100}/oauth2/token}
      client-id: ${INVENTORY_CLIENT_ID:inventory-service}
      client-secret: ${INVENTORY_CLIENT_SECRET:}
      scopes: catalog:read catalog:write shipping:label
    consumers:
      # retail.shipment.stage-changed → inbound notices of 1P ASNs (S226); offers.offer.* → stranded FBA stock (S067)
      retail-topic: at.retail.events
      offers-topic: at.offers.events
