# Base values for inventory. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: inventory
  runtime: java
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: inventory-service
  tag: dev   # sentinel for local renders; the deploy pipeline writes the git sha into values-<env>.yaml
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/inventory in the cloud secret store:
#   - DB_URL
#   - DB_USER
#   - DB_PASSWORD
#   - KAFKA_BOOTSTRAP
#   - INVENTORY_CLIENT_SECRET   (client inventory-service: catalog:read catalog:write shipping:label, S257)
secrets:
  enabled: true
  store: platform-secrets
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv:
  CATALOG_URL: http://catalog:8080
  CARRIER_GATEWAY_URL: http://carrier-gateway:8080
nodeSelector: {}
tolerations: []
