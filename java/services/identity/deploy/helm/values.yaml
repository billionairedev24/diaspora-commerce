# Base values for identity. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: identity
  runtime: java
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: identity-service
  tag: dev   # sentinel for local renders; the deploy pipeline writes the git sha into values-<env>.yaml
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/identity in the cloud secret store:
#   - DB_URL
#   - DB_USER
#   - DB_PASSWORD
#   - KAFKA_BOOTSTRAP
#   - SIGNING_KEY_PEM
#   - IDENTITY_DATA_KEY (S202 data key: base64 AES-256 key-encryption key sealing TOTP secrets at rest;
#     generate with `openssl rand -base64 32`, one per environment, never reused)
#   - IDENTITY_DATA_KEY_ID (optional; id stored with every ciphertext, derived from the key when unset)
#   - IDENTITY_DATA_KEYS_PREVIOUS (optional, only during a rotation: "[keyId:]base64,..." of retired keys)
#   - GOOGLE_CLIENT_SECRET
#   - GOOGLE_CLIENT_ID
#   - APPLE_CLIENT_ID
#   - APPLE_CLIENT_SECRET
#   - FACEBOOK_CLIENT_ID
#   - FACEBOOK_CLIENT_SECRET
#   - BFF_CLIENT_SECRET
#   - SELLER_SERVICE_CLIENT_SECRET
#   - ORDERS_CLIENT_SECRET, BOOKINGS_CLIENT_SECRET, FULFILMENT_CLIENT_SECRET, PAYMENTS_CLIENT_SECRET,
#     NOTIFICATIONS_CLIENT_SECRET
#   - SEARCH_CLIENT_SECRET (search-service, scopes ai:use ads:serve)
#   - RETAIL_CLIENT_SECRET (retail-service, scopes catalog:read inventory:receive inventory:read media:write)
#   - INVENTORY_CLIENT_SECRET (inventory-service, scopes catalog:read catalog:write shipping:label)
#   - GATEWAY_BFF_CLIENT_SECRET, OFFERS_CLIENT_SECRET, INDEXER_CLIENT_SECRET, TRUSTOPS_CLIENT_SECRET,
#     TAX_RETURNS_CLIENT_SECRET
#   - BOOTSTRAP_ADMIN_EMAIL
#   - BOOTSTRAP_ADMIN_PASSWORD
#   - BOOTSTRAP_ADMIN_PHONE
secrets:
  enabled: true
  store: platform-secrets
  keySeparator: "/"     # "-" on GCP Secret Manager and Azure Key Vault (set in platform-values.yaml)
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv: {}
nodeSelector: {}
tolerations: []
