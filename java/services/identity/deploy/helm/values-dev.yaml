env: dev
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 2
  cpu: 70
rollout:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
tolerations:
  - {key: afrotransact.com/spot, operator: Exists, effect: NoSchedule}
extraEnv:
  SIGNING_KEY_ID: identity-dev-1
