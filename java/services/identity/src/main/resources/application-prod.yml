# Production: reference pages off (published on developers.afrotransact.com), sampled traces, keys from KMS-backed secrets.
at:
  api-docs:
    enabled: false
  identity:
    issuer: ${AUTH_ISSUER:https://auth.afrotransact.com}
    home-url: ${HOME_URL:https://afrotransact.com}
    signing:
      generate-if-missing: false
    webauthn:
      rp-id: afrotransact.com
      rp-name: AfroTransact
      allowed-origins:
        - https://auth.afrotransact.com
    cors-allowed-origins:
      - https://afrotransact.com
      - https://seller.afrotransact.com
      - https://staff.afrotransact.com
    clients:
      - client-id: storefront
        name: Storefront (web)
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: ["${STOREFRONT_URL:https://afrotransact.com}/auth/callback"]
        post-logout-redirect-uris: ["${STOREFRONT_URL:https://afrotransact.com}/"]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: seller-center
        name: Seller Center & Provider Hub
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: ["${SELLER_CENTER_URL:https://seller.afrotransact.com}/auth/callback"]
        post-logout-redirect-uris: ["${SELLER_CENTER_URL:https://seller.afrotransact.com}/"]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: staff-console
        name: Staff console
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        refresh-token-ttl: 12h
        redirect-uris: ["${STAFF_CONSOLE_URL:https://staff.afrotransact.com}/auth/callback"]
        post-logout-redirect-uris: ["${STAFF_CONSOLE_URL:https://staff.afrotransact.com}/"]
        scopes: [openid, profile, email, offline_access]
      - client-id: customer-app
        name: AfroTransact app
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: [com.afrotransact.customer:/oauth2redirect]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: driver-app
        name: AfroTransact Driver
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        refresh-token-ttl: 14h
        redirect-uris: [com.afrotransact.driver:/oauth2redirect]
        scopes: [openid, profile, email, offline_access]
      - client-id: gateway-bff
        name: Gateway BFF
        type: confidential
        # GATEWAY_BFF_CLIENT_SECRET (BFF_CLIENT_SECRET still accepted). Authorization code + PKCE + refresh tokens;
        # the callback lives on the storefront origin so the session cookie stays first-party.
        secret: ${GATEWAY_BFF_CLIENT_SECRET:${BFF_CLIENT_SECRET:}}
        grant-types: [authorization_code, refresh_token]
        redirect-uris: ["${STOREFRONT_URL:https://afrotransact.com}/api/bff/v1/auth/oidc/callback", "https://www.afrotransact.com/api/bff/v1/auth/oidc/callback", "${BFF_URL:https://api.afrotransact.com}/login/oauth2/code/afrotransact"]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: seller-service
        name: Seller service
        type: confidential
        secret: ${SELLER_SERVICE_CLIENT_SECRET:}
        grant-types: [client_credentials]
        scopes: [orgs:manage, users:read]
      - client-id: orders-service
        name: Orders service
        type: confidential
        secret: ${ORDERS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, inventory:reserve, cart:service, orders:manage, users:read]
      - client-id: bookings-service
        name: Bookings service
        type: confidential
        secret: ${BOOKINGS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, users:read]
      - client-id: fulfilment-service
        name: Fulfilment service
        type: confidential
        secret: ${FULFILMENT_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, orders:update-status, inventory:reserve]
      - client-id: payments-service
        name: Payments service
        type: confidential
        secret: ${PAYMENTS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [orgs:read]
      - client-id: notifications-service
        name: Notifications service
        type: confidential
        secret: ${NOTIFICATIONS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [users:read]
      - client-id: search-service
        name: Search service
        type: confidential
        secret: ${SEARCH_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [ai:use]
      - client-id: retail-service
        name: AfroTransact Retail service
        type: confidential
        secret: ${RETAIL_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [inventory:receive, inventory:adjust, inventory:read]
      - client-id: mcp-client
        name: AI agents (MCP)
        type: public
        grant-types: [authorization_code]
        require-consent: true
        redirect-uris: ["http://127.0.0.1:33418/callback", "https://claude.ai/api/mcp/auth_callback"]
        scopes: [openid, mcp:shopper, mcp:seller, mcp:staff]
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
