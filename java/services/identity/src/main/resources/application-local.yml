# Local developer profile: docker compose stack from infra/local, ephemeral signing key, codes written to the log,
# a bootstrap super admin and first-party clients for the apps on localhost.
logging:
  level:
    com.afrotransact: DEBUG
at:
  identity:
    issuer: ${AUTH_ISSUER:http://localhost:8100}
    signing:
      generate-if-missing: true
    verification:
      sender: ${VERIFICATION_SENDER:log}
    mfa:
      secure-cookies: false
    webauthn:
      rp-id: localhost
      rp-name: AfroTransact (local)
      allowed-origins:
        - http://localhost:8100
    cors-allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@afrotransact.com}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:LocalAdmin2026!}
      phone: ${BOOTSTRAP_ADMIN_PHONE:+17132490142}
    clients:
      - client-id: storefront
        name: Storefront (web)
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: [http://localhost:3000/auth/callback]
        post-logout-redirect-uris: [http://localhost:3000/]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: seller-center
        name: Seller Center & Provider Hub
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: [http://localhost:3001/auth/callback]
        post-logout-redirect-uris: [http://localhost:3001/]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: staff-console
        name: Staff console
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        refresh-token-ttl: 12h
        redirect-uris: [http://localhost:3002/auth/callback]
        post-logout-redirect-uris: [http://localhost:3002/]
        scopes: [openid, profile, email, offline_access]
      - client-id: customer-app
        name: AfroTransact app
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: [com.afrotransact.customer:/oauth2redirect, http://localhost:8081/auth/callback]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: driver-app
        name: AfroTransact Driver
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        refresh-token-ttl: 14h
        redirect-uris: [com.afrotransact.driver:/oauth2redirect, http://localhost:8082/auth/callback]
        scopes: [openid, profile, email, offline_access]
      - client-id: gateway-bff
        name: Gateway BFF
        type: confidential
        secret: ${BFF_CLIENT_SECRET:local-bff-secret}
        grant-types: [authorization_code, refresh_token, client_credentials]
        redirect-uris: [http://localhost:8200/login/oauth2/code/afrotransact]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: seller-service
        name: Seller service
        type: confidential
        secret: ${SELLER_SERVICE_CLIENT_SECRET:local-seller-secret}
        grant-types: [client_credentials]
        scopes: [orgs:manage, users:read]
      - client-id: orders-service
        name: Orders service
        type: confidential
        secret: ${ORDERS_CLIENT_SECRET:local-orders-service-secret}
        grant-types: [client_credentials]
        scopes: [payments:service, inventory:reserve, cart:service, orders:manage, users:read]
      - client-id: bookings-service
        name: Bookings service
        type: confidential
        secret: ${BOOKINGS_CLIENT_SECRET:local-bookings-service-secret}
        grant-types: [client_credentials]
        scopes: [payments:service, users:read]
      - client-id: fulfilment-service
        name: Fulfilment service
        type: confidential
        secret: ${FULFILMENT_CLIENT_SECRET:local-fulfilment-service-secret}
        grant-types: [client_credentials]
        scopes: [payments:service, orders:update-status, inventory:reserve]
      - client-id: payments-service
        name: Payments service
        type: confidential
        secret: ${PAYMENTS_CLIENT_SECRET:local-payments-service-secret}
        grant-types: [client_credentials]
        scopes: [orgs:read]
      - client-id: notifications-service
        name: Notifications service
        type: confidential
        secret: ${NOTIFICATIONS_CLIENT_SECRET:local-notifications-service-secret}
        grant-types: [client_credentials]
        scopes: [users:read]
