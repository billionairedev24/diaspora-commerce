# Local developer profile: docker compose stack from infra/local, ephemeral signing key, one-time codes written to the
# log and dropped in Mailpit (http://localhost:8025), a bootstrap super admin, the S276 test users (@afrotransact.test,
# docs/engineering/local-development.md) and first-party clients for the apps on localhost.
logging:
  level:
    com.afrotransact: DEBUG
at:
  identity:
    issuer: ${AUTH_ISSUER_URL:http://localhost:8100}
    signing:
      generate-if-missing: true
    verification:
      # mailpit: the log line plus a message in Mailpit (texted codes too, tagged sms); log: the log only. Both are
      # refused at start-up on any other profile.
      sender: ${VERIFICATION_SENDER:mailpit}
    # S276: ready-made test users (TestPersonas) with one shared password; never on uat/prod (enforced in code).
    local-development:
      test-users: ${IDENTITY_TEST_USERS:true}
      test-users-password: ${IDENTITY_TEST_USERS_PASSWORD:Test1234!Local}
      mailpit-url: ${MAILPIT_URL:http://localhost:8025}
    mfa:
      secure-cookies: false
    data-protection:
      # LOCAL DEVELOPMENT KEY, NOT A SECRET: committed so a local database survives restarts. Every other environment
      # reads IDENTITY_DATA_KEY from the secret store (afrotransact/<env>/identity).
      key-id: ${IDENTITY_DATA_KEY_ID:local-dev-1}
      key: ${IDENTITY_DATA_KEY:sshryzvJNZkej8pi+fHGy3bSux3JTUPQbYBooxVpSN0=}
      previous-keys: ${IDENTITY_DATA_KEYS_PREVIOUS:}
    webauthn:
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      rp-name: AfroTransact (local)
      # identity's own pages and the storefront origins whose sign-in forms run the passkey ceremony
      allowed-origins:
        - ${AUTH_ISSUER_URL:http://localhost:8100}
        - ${PUBLIC_WEB_URL:http://localhost:3000}
      # S016: native app origins for platform passkeys (Face ID / fingerprint), comma-separated. Android:
      # android:apk-key-hash:<base64url SHA-256 of the app signing certificate>, one per app and signing key. iOS apps
      # sign with the web origin of their associated domain (apple-app-site-association on the storefront).
      app-origins: ${WEBAUTHN_APP_ORIGINS:}
    cors-allowed-origins:
      - ${PUBLIC_WEB_URL:http://localhost:3000}
      - ${SELLER_CENTER_URL:http://localhost:3001}
      - ${STAFF_CONSOLE_URL:http://localhost:3002}
      # Expo web previews of the customer and driver apps (make up / make mobile): OIDC discovery and token calls.
      - http://localhost:8081
      - http://localhost:8082
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@afrotransact.com}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:LocalAdmin2026!}
      phone: ${BOOTSTRAP_ADMIN_PHONE:+17132490142}
    # Hosted sign-in / sign-up pages: branding per app (by the authorization request) and their links.
    pages:
      storefront-url: ${PUBLIC_WEB_URL:http://localhost:3000}
      seller-center-url: ${SELLER_CENTER_URL:http://localhost:3001}
      staff-console-url: ${STAFF_CONSOLE_URL:http://localhost:3002}
    clients:
      - client-id: customer-app
        name: AfroTransact app
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: [com.afrotransact.customer:/oauth2redirect, http://localhost:8081/auth/callback]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: driver-app
        name: AfroTransact Driver
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        refresh-token-ttl: 14h
        redirect-uris: [com.afrotransact.driver:/oauth2redirect, http://localhost:8082/auth/callback]
        scopes: [openid, profile, email, offline_access]
      - client-id: gateway-bff
        name: Gateway BFF (storefront, Seller Center, staff console)
        type: confidential
        # GATEWAY_BFF_CLIENT_SECRET (BFF_CLIENT_SECRET still accepted). The web apps' only OAuth client: authorization
        # code + PKCE + refresh tokens through identity's hosted sign-in (single sign-on). Each app has its own callback
        # on its own origin (<app>/api/bff proxies to the BFF), so its session cookie stays first-party, and its own
        # post-logout page (RP-initiated logout, /connect/logout). Client credentials with scope auth:first-party call
        # the first-party sign-in API (/v1/auth/*).
        secret: ${GATEWAY_BFF_CLIENT_SECRET:${BFF_CLIENT_SECRET:local-bff-secret}}
        grant-types: [authorization_code, refresh_token, client_credentials]
        redirect-uris: ["${PUBLIC_WEB_URL:http://localhost:3000}/api/bff/v1/auth/oidc/callback", "${SELLER_CENTER_URL:http://localhost:3001}/api/bff/v1/auth/oidc/callback", "${STAFF_CONSOLE_URL:http://localhost:3002}/api/bff/v1/auth/oidc/callback"]
        post-logout-redirect-uris: ["${PUBLIC_WEB_URL:http://localhost:3000}/", "${SELLER_CENTER_URL:http://localhost:3001}/", "${STAFF_CONSOLE_URL:http://localhost:3002}/"]
        scopes: [openid, profile, email, phone, offline_access, "auth:first-party", "shipping:rate", "tax:quote", "payments:fees.read", "sellers:ship-from.read", "orders:pay-link"]
      - client-id: seller-service
        name: Seller service
        type: confidential
        secret: ${SELLER_SERVICE_CLIENT_SECRET:local-seller-secret}
        grant-types: [client_credentials]
        scopes: [orgs:manage, users:read, "inventory:storage.read", "ads:spend.read", "ai:usage.read"]
      - client-id: orders-service
        name: Orders service
        type: confidential
        secret: ${ORDERS_CLIENT_SECRET:local-orders-service-secret}
        grant-types: [client_credentials]
        scopes: [payments:service, inventory:reserve, cart:service, orders:manage, users:read, "tax:quote", "sellers:ship-from.read", offers:read, delivery-runs:reserve]
      - client-id: cart-service
        name: Cart service
        type: confidential
        # S272: pre-order eligibility of cart lines (delivery-runs GET /v1/service/preorders/eligibility).
        secret: ${CART_CLIENT_SECRET:local-cart-service-secret}
        grant-types: [client_credentials]
        scopes: [delivery-runs:reserve]
      - client-id: tax-returns-service
        name: Tax returns service
        type: confidential
        secret: ${TAX_RETURNS_CLIENT_SECRET:local-tax-returns-service-secret}
        grant-types: [client_credentials]
        scopes: [payments:service, inventory:adjust, "shipping:label", users:read, inventory:returns, orders:lookup, delivery:returns]
      - client-id: bookings-service
        name: Bookings service
        type: confidential
        secret: ${BOOKINGS_CLIENT_SECRET:local-bookings-service-secret}
        grant-types: [client_credentials]
        scopes: [payments:service, users:read]
      - client-id: fulfilment-service
        name: Fulfilment service
        type: confidential
        secret: ${FULFILMENT_CLIENT_SECRET:local-fulfilment-service-secret}
        grant-types: [client_credentials]
        scopes: [orders:update-status, inventory:reserve, delivery:relay, delivery-runs:read, delivery-runs:manage]
      - client-id: payments-service
        name: Payments service
        type: confidential
        secret: ${PAYMENTS_CLIENT_SECRET:local-payments-service-secret}
        grant-types: [client_credentials]
        scopes: [orgs:read]
      - client-id: notifications-service
        name: Notifications service
        type: confidential
        secret: ${NOTIFICATIONS_CLIENT_SECRET:local-notifications-service-secret}
        grant-types: [client_credentials]
        scopes: [users:read, delivery-runs:audience.read]
      - client-id: trust-ops-service
        name: Trust & safety operations service
        type: confidential
        secret: ${TRUSTOPS_CLIENT_SECRET:local-trust-ops-secret}
        grant-types: [client_credentials]
        scopes: [catalog:moderate, payments:service, compliance:hold, offers:write, ai:triage, users:read, orders:lookup, sellers:enforce, "bookings:reviews:moderate"]
      - client-id: search-service
        name: Search service
        type: confidential
        secret: ${SEARCH_CLIENT_SECRET:local-search-service-secret}
        grant-types: [client_credentials]
        scopes: [ai:use, ads:serve]
      - client-id: delivery-runs-service
        name: Delivery runs service
        type: confidential
        secret: ${DELIVERY_RUNS_CLIENT_SECRET:local-delivery-runs-service-secret}
        grant-types: [client_credentials]
        scopes: [geo:zones:write, "orders:on-behalf", "media:read"]
      - client-id: media-service
        name: Media service
        type: confidential
        secret: ${MEDIA_CLIENT_SECRET:local-media-service-secret}
        grant-types: [client_credentials]
        scopes: [ai:use]
      - client-id: indexer-service
        name: Search indexer
        type: confidential
        secret: ${INDEXER_CLIENT_SECRET:local-indexer-service-secret}
        grant-types: [client_credentials]
        scopes: [sellers:directory, ai:use]
      - client-id: offers-service
        name: Offers service
        type: confidential
        secret: ${OFFERS_CLIENT_SECRET:local-offers-service-secret}
        grant-types: [client_credentials]
        scopes: [catalog:read, "sellers:ship-from.read"]
      - client-id: retail-service
        name: AfroTransact Retail service
        type: confidential
        secret: ${RETAIL_CLIENT_SECRET:local-retail-service-secret}
        grant-types: [client_credentials]
        scopes: [catalog:read, inventory:receive, inventory:read, "media:write"]
      - client-id: inventory-service
        name: Inventory service
        type: confidential
        secret: ${INVENTORY_CLIENT_SECRET:local-inventory-service-secret}
        grant-types: [client_credentials]
        # FBA inbound: AT-FN unit labels (catalog), inbound shipping labels (carrier-gateway)
        scopes: [catalog:read, catalog:write, "shipping:label"]
      - client-id: mcp-client
        name: AI agents (MCP)
        type: public
        grant-types: [authorization_code]
        require-consent: true
        redirect-uris: ["http://127.0.0.1:33418/callback", "https://claude.ai/api/mcp/auth_callback"]
        scopes: [openid, mcp:shopper, mcp:seller, mcp:staff]
