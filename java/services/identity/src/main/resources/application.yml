spring:
  application:
    name: identity-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP:identity-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

server:
  port: ${PORT:8100}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: afrotransact
      deployment.environment: ${APP_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      service: identity-service
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /v1/**

at:
  consumers:
    # Kafka listeners for other services' events (off in tests that have no broker).
    enabled: ${CONSUMERS_ENABLED:true}
  api-docs:
    title: Identity API
    description: Accounts, sign-up and verification, role-based landing, access control administration, MFA, passkeys and social sign-in. OAuth 2.1 / OIDC endpoints are described by /.well-known/openid-configuration.
    version: v1
  security:
    enabled: true
  events:
    relay-enabled: true
  identity:
    # Shared platform settings (docs/engineering/environments.md): AUTH_ISSUER_URL, PUBLIC_WEB_URL, SELLER_CENTER_URL,
    # STAFF_CONSOLE_URL, API_BASE_URL and PLATFORM_DOMAIN are injected per environment by the Helm library chart.
    issuer: ${AUTH_ISSUER_URL:http://localhost:8100}
    home-url: ${HOME_URL:${PUBLIC_WEB_URL:http://localhost:3000}}
    # S322: sign-up device and network are published as keyed hashes (never raw) for the referral program's abuse checks.
    signup:
      fingerprint-key: ${SIGNUP_FINGERPRINT_KEY:identity-signup-fingerprints}
    # Reconciles identity's copy of seller and provider organisations with the seller service (the source of truth):
    # on start-up after initial-delay, then every interval, and on demand (POST /v1/orgs/{id}/sync, /v1/internal/orgs/reconcile).
    seller-sync:
      enabled: ${SELLER_SYNC_ENABLED:true}
      seller-url: ${SELLER_URL:http://localhost:8106}
      interval: ${SELLER_SYNC_INTERVAL:5m}
      initial-delay: ${SELLER_SYNC_INITIAL_DELAY:30s}
    invitations:
      # Seller Center page that accepts organisation invitations; ?token=… is appended (identity.invitation.created)
      accept-url: ${INVITATION_ACCEPT_URL:${SELLER_CENTER_URL:http://localhost:3001}/invitations/accept}
    # Email domains reserved for staff (comma-separated; cannot self-register).
    staff-email-domains: ${IDENTITY_STAFF_EMAIL_DOMAINS:afrotransact.com}
    signing:
      key-id: ${SIGNING_KEY_ID:identity-1}
      private-key-pem: ${SIGNING_KEY_PEM:}
      generate-if-missing: false
    # S291: the dangerous identity admin actions (rotate the signing key, sign a user or a client out, disable a client,
    # change the settings) need the staff member's password again, unless they signed in this recently.
    step-up:
      fresh-sign-in: ${IDENTITY_STEP_UP_FRESH_SIGN_IN:PT5M}
    verification:
      sender: outbox
    mfa:
      issuer-name: AfroTransact
      secure-cookies: true
    # S202: envelope encryption of TOTP secrets at rest (README "Data protection"). Provider local = key ring from the
    # secret store; aws-kms / gcp-kms / azure-key-vault need a KMS DataKeyWrapper adapter (not bundled, off by default).
    data-protection:
      provider: ${IDENTITY_DATA_PROVIDER:local}
      key-id: ${IDENTITY_DATA_KEY_ID:}
      key: ${IDENTITY_DATA_KEY:}
      previous-keys: ${IDENTITY_DATA_KEYS_PREVIOUS:}
      seal-on-startup: true
    social:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      apple:
        client-id: ${APPLE_CLIENT_ID:}
        client-secret: ${APPLE_CLIENT_SECRET:}
      facebook:
        client-id: ${FACEBOOK_CLIENT_ID:}
        client-secret: ${FACEBOOK_CLIENT_SECRET:}
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: Platform
      last-name: Administrator
      phone: ${BOOTSTRAP_ADMIN_PHONE:}
