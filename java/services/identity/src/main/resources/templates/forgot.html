<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(#{auth.title.forgot})}"></head>
<body>
<a class="skip" href="#main" th:text="#{auth.skip}">Skip to the form</a>
<div class="page" th:attr="data-app=${brand.app}">
  <div class="card">
    <aside th:replace="~{layout :: aside}"></aside>
    <main id="main" tabindex="-1" class="form-col">
      <a th:replace="~{layout :: logo}"></a>
      <div class="form" data-page="forgot">
        <h1 class="h1" th:text="#{auth.forgot.title}">Forgot your password?</h1>
        <p class="lead" th:text="#{auth.reset.lead}">Enter the email you sign in with. We’ll send you a code to set a new password.</p>
        <th:block th:replace="~{layout :: alert('error', ${formError})}"></th:block>
        <form class="form" method="post" th:action="@{/login/forgot}" data-once novalidate>
          <div class="field">
            <label class="label" for="email" th:text="#{auth.email}">Email</label>
            <input class="control" id="email" name="email" type="email" autocomplete="username" required maxlength="254"
                   autofocus th:value="${email}"
                   th:attr="aria-invalid=${emailError != null ? 'true' : null},aria-describedby=${emailError != null ? 'email-error' : null}">
            <p class="message message-error" id="email-error" th:text="${emailError}"></p>
          </div>
          <button type="submit" class="btn btn-primary" th:text="#{auth.reset.send}">Send code</button>
        </form>
        <p class="message" th:text="#{auth.forgot.passkey}"></p>
        <p class="message" th:if="${brand.app == 'staff'}" data-staff-note th:text="#{auth.reset.staffNote}"></p>
        <div class="links">
          <a th:href="@{/login}" th:text="#{auth.forgot.back}">Back to sign in</a>
          <a th:href="${links.support}" th:text="#{auth.forgot.support}">Contact support</a>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
