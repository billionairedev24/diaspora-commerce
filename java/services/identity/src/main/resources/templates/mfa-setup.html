<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(#{auth.title.setup})}"></head>
<body>
<a class="skip" href="#main" th:text="#{auth.skip}">Skip to the form</a>
<div class="page" th:attr="data-app=${brand.app}">
  <div class="card">
    <aside th:replace="~{layout :: aside}"></aside>
    <main id="main" tabindex="-1" class="form-col">
      <a th:replace="~{layout :: logo}"></a>
      <div class="form" data-page="mfa-setup" th:attr="data-mode=${mode}">
        <h1 class="h1" th:text="${mode == 'done'} ? #{auth.setup.doneTitle} : (${skippable} ? #{auth.setup.title} : #{auth.setup.titleForced})">Secure your account</h1>
        <p class="lead" th:if="${mode == 'choose'}" th:text="${skippable} ? #{auth.setup.lead} : #{auth.setup.leadForced}"></p>
        <th:block th:replace="~{layout :: alert('error', ${formError})}"></th:block>
        <th:block th:replace="~{layout :: alert('success', ${notice})}"></th:block>

        <th:block th:if="${mode == 'choose'}">
          <section class="method-card">
            <h2 class="h2" th:text="#{auth.setup.totpTitle}">Authenticator app</h2>
            <p class="message" th:text="#{auth.setup.totpText}"></p>
            <form method="post" th:action="@{/login/mfa/setup/totp}" data-once>
              <button type="submit" class="btn btn-primary" th:text="#{auth.setup.totpButton}">Use an authenticator app</button>
            </form>
          </section>
          <section class="method-card">
            <h2 class="h2" th:text="#{auth.setup.emailTitle}">Email codes</h2>
            <p class="message" th:text="#{auth.setup.emailText(${emailHint})}"></p>
            <form method="post" th:action="@{/login/mfa/setup/email}" data-once>
              <button type="submit" class="btn btn-neutral" th:text="#{auth.setup.emailButton}">Use email codes</button>
            </form>
          </section>
          <form th:if="${skippable}" method="post" th:action="@{/login/mfa/setup/skip}" class="inline-form">
            <button type="submit" class="btn btn-link" th:text="#{auth.setup.skip}">Skip for now</button>
            <p class="message" th:text="#{auth.setup.skipNote}"></p>
          </form>
          <form th:unless="${skippable}" method="post" th:action="@{/logout}" class="inline-form">
            <button type="submit" class="btn btn-link toggle" th:text="#{auth.mfa.cancel}">Cancel and sign in again</button>
          </form>
        </th:block>

        <th:block th:if="${mode == 'totp'}">
          <p class="lead" th:text="#{auth.setup.scan}"></p>
          <div class="qr" th:utext="${qr}"></div>
          <p class="message" th:text="#{auth.setup.manual}"></p>
          <p class="message"><code class="secret" id="totp-secret" th:text="${secret}"></code></p>
          <form class="form" method="post" th:action="@{/login/mfa/setup/totp/confirm}" data-once novalidate>
            <div class="field">
              <label class="label" for="code" th:text="#{auth.setup.confirm}">Code</label>
              <input class="control code" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                     pattern="[0-9]{6}" maxlength="6" required autofocus
                     th:attr="aria-invalid=${formError != null ? 'true' : null}">
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{auth.setup.confirmButton}">Turn on</button>
          </form>
          <form method="get" th:action="@{/login/mfa/setup}" class="inline-form">
            <button type="submit" class="btn btn-link" th:text="#{auth.setup.back}">Choose a different method</button>
          </form>
        </th:block>

        <th:block th:if="${mode == 'email'}">
          <p class="lead" th:text="#{auth.setup.emailEnter(${emailHint})}"></p>
          <form class="form" method="post" th:action="@{/login/mfa/setup/email/confirm}" data-once novalidate>
            <div class="field">
              <label class="label" for="code" th:text="#{auth.mfa.code}">Code</label>
              <input class="control code" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                     pattern="[0-9]{6}" maxlength="6" required autofocus
                     th:attr="aria-invalid=${formError != null ? 'true' : null}">
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{auth.setup.confirmButton}">Turn on</button>
          </form>
          <form method="post" th:action="@{/login/mfa/setup/email}" class="inline-form">
            <button type="submit" class="btn btn-link" th:text="#{auth.setup.resend}">Send a new code</button>
          </form>
          <form method="get" th:action="@{/login/mfa/setup}" class="inline-form">
            <button type="submit" class="btn btn-link" th:text="#{auth.setup.back}">Choose a different method</button>
          </form>
        </th:block>

        <th:block th:if="${mode == 'done'}">
          <th:block th:if="${#lists.isEmpty(recoveryCodes)}">
            <p class="lead" th:text="#{auth.setup.noCodes}"></p>
          </th:block>
          <th:block th:unless="${#lists.isEmpty(recoveryCodes)}">
            <p class="lead" th:text="#{auth.setup.doneLead}"></p>
            <ul class="recovery" id="recovery-codes">
              <li th:each="c : ${recoveryCodes}"><code th:text="${c}"></code></li>
            </ul>
            <div class="links">
              <button type="button" class="btn btn-neutral" data-copy="recovery-codes" hidden
                      th:attr="data-copied=#{auth.setup.copied}" th:text="#{auth.setup.copy}">Copy codes</button>
              <button type="button" class="btn btn-neutral" data-download="recovery-codes" hidden
                      th:text="#{auth.setup.download}">Download codes</button>
            </div>
          </th:block>
          <form method="post" th:action="@{/login/mfa/setup/finish}" data-once>
            <button type="submit" class="btn btn-primary" th:text="#{auth.setup.continue}">Continue</button>
          </form>
        </th:block>
      </div>
    </main>
  </div>
</div>
</body>
</html>
