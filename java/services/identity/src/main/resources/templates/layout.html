<!DOCTYPE html>
<!-- Shared fragments of the hosted pages: <head>, the brand panel, the logo and the social buttons. -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
  <title th:text="${title} + ' · AfroTransact'">AfroTransact</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" th:href="@{/assets/fonts.css}">
  <link rel="stylesheet" th:href="@{/assets/tokens.css}">
  <link rel="stylesheet" th:href="@{/assets/auth.css}">
  <script th:src="@{/assets/auth.js}" defer></script>
</head>
<body>

<aside th:fragment="aside" class="aside" th:attr="aria-label=${brand.tag}">
  <div class="photo" aria-hidden="true"><div class="fade"></div></div>
  <div class="ad">
    <span class="tag" th:text="${brand.tag}">Welcome back</span>
    <p class="ad-head" th:text="${brand.head}">The flavours of home, a click away.</p>
    <p class="ad-sub" th:text="${brand.sub}"></p>
    <ul class="points">
      <li class="point" th:each="p : ${brand.points}">
        <th:block th:replace="~{icons :: icon(${p.icon})}"></th:block>
        <span><strong th:text="${p.title}"></strong><br><span class="point-sub" th:text="${p.text}"></span></span>
      </li>
    </ul>
  </div>
</aside>

  <th:block th:if="${!providers.isEmpty()}">
    <div class="divider" th:text="#{auth.orContinue}">or continue with</div>
    <a th:each="p : ${providers}" class="social" th:href="@{/oauth2/authorization/{id}(id=${p.id})}" th:attr="data-provider=${p.id}">

    </a>
  </th:block>
</th:block>

<th:block th:fragment="alert(kind, message)">
  <p th:if="${message != null}" th:class="'alert alert-' + ${kind}" th:attr="role=${kind == 'error' ? 'alert' : 'status'}">
    <th:block th:replace="~{icons :: icon(${kind == 'error' ? 'warning' : (kind == 'success' ? 'check' : 'envelope')})}"></th:block>
    <span th:text="${message}"></span>
  </p>
</th:block>

</body>
</html>
