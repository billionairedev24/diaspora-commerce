# UAT / staging: production-like, anonymised data, API reference pages on for testers.
at:
  api-docs:
    enabled: true
  identity:
    issuer: ${AUTH_ISSUER:https://auth.uat.afrotransact.com}
    home-url: ${HOME_URL:https://uat.afrotransact.com}
    invitations:
      accept-url: ${INVITATION_ACCEPT_URL:${SELLER_CENTER_URL:https://seller.uat.afrotransact.com}/invitations/accept}
    signing:
      generate-if-missing: false
    data-protection:
      # IDENTITY_DATA_KEY (secret store afrotransact/uat/identity): base64 AES-256 key-encryption key for MFA
      # secrets at rest, required with provider local. During a rotation the old key moves to
      # IDENTITY_DATA_KEYS_PREVIOUS ([keyId:]base64, comma-separated) until POST /v1/admin/data-protection/rotate
      # reports nothing left on it. IDENTITY_DATA_PROVIDER switches to a cloud KMS adapter when one is deployed.
      provider: ${IDENTITY_DATA_PROVIDER:local}
      key-id: ${IDENTITY_DATA_KEY_ID:}
      key: ${IDENTITY_DATA_KEY:}
      previous-keys: ${IDENTITY_DATA_KEYS_PREVIOUS:}
    webauthn:
      rp-id: uat.afrotransact.com
      rp-name: AfroTransact
      # identity's own pages and the storefront origins whose sign-in forms run the passkey ceremony
      allowed-origins:
        - https://auth.uat.afrotransact.com
        - https://uat.afrotransact.com
    cors-allowed-origins:
      - https://uat.afrotransact.com
      - https://seller.uat.afrotransact.com
      - https://staff.uat.afrotransact.com
    clients:
      - client-id: storefront
        name: Storefront (web)
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: ["${STOREFRONT_URL:https://uat.afrotransact.com}/auth/callback"]
        post-logout-redirect-uris: ["${STOREFRONT_URL:https://uat.afrotransact.com}/"]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: seller-center
        name: Seller Center & Provider Hub
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: ["${SELLER_CENTER_URL:https://seller.uat.afrotransact.com}/auth/callback"]
        post-logout-redirect-uris: ["${SELLER_CENTER_URL:https://seller.uat.afrotransact.com}/"]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: staff-console
        name: Staff console
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        refresh-token-ttl: 12h
        redirect-uris: ["${STAFF_CONSOLE_URL:https://staff.uat.afrotransact.com}/auth/callback"]
        post-logout-redirect-uris: ["${STAFF_CONSOLE_URL:https://staff.uat.afrotransact.com}/"]
        scopes: [openid, profile, email, offline_access]
      - client-id: customer-app
        name: AfroTransact app
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: [com.afrotransact.customer:/oauth2redirect]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: driver-app
        name: AfroTransact Driver
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        refresh-token-ttl: 14h
        redirect-uris: [com.afrotransact.driver:/oauth2redirect]
        scopes: [openid, profile, email, offline_access]
      - client-id: gateway-bff
        name: Gateway BFF
        type: confidential
        # GATEWAY_BFF_CLIENT_SECRET (BFF_CLIENT_SECRET still accepted). Authorization code + PKCE + refresh tokens;
        # the callback lives on the storefront origin so the session cookie stays first-party. Client credentials with
        # scope auth:first-party call the first-party sign-in API (/v1/auth/*) and redeem its login tickets.
        secret: ${GATEWAY_BFF_CLIENT_SECRET:${BFF_CLIENT_SECRET:}}
        grant-types: [authorization_code, refresh_token, client_credentials]
        redirect-uris: ["${STOREFRONT_URL:https://uat.afrotransact.com}/api/bff/v1/auth/oidc/callback", "${BFF_URL:https://api.uat.afrotransact.com}/login/oauth2/code/afrotransact"]
        scopes: [openid, profile, email, phone, offline_access, "auth:first-party"]
      - client-id: seller-service
        name: Seller service
        type: confidential
        secret: ${SELLER_SERVICE_CLIENT_SECRET:}
        grant-types: [client_credentials]
        scopes: [orgs:manage, users:read]
      - client-id: orders-service
        name: Orders service
        type: confidential
        secret: ${ORDERS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, inventory:reserve, cart:service, orders:manage, users:read, "tax:quote"]
      - client-id: tax-returns-service
        name: Tax returns service
        type: confidential
        secret: ${TAX_RETURNS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, inventory:adjust, "shipping:label", users:read]
      - client-id: bookings-service
        name: Bookings service
        type: confidential
        secret: ${BOOKINGS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, users:read]
      - client-id: fulfilment-service
        name: Fulfilment service
        type: confidential
        secret: ${FULFILMENT_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [orders:update-status, inventory:reserve, delivery:relay]
      - client-id: payments-service
        name: Payments service
        type: confidential
        secret: ${PAYMENTS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [orgs:read]
      - client-id: notifications-service
        name: Notifications service
        type: confidential
        secret: ${NOTIFICATIONS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [users:read]
      - client-id: trust-ops-service
        name: Trust & safety operations service
        type: confidential
        secret: ${TRUSTOPS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [catalog:moderate, payments:service, compliance:hold, offers:write, ai:triage, users:read]
      - client-id: search-service
        name: Search service
        type: confidential
        secret: ${SEARCH_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [ai:use, ads:serve]
      - client-id: indexer-service
        name: Search indexer
        type: confidential
        secret: ${INDEXER_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [sellers:directory]
      - client-id: offers-service
        name: Offers service
        type: confidential
        secret: ${OFFERS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [catalog:read]
      - client-id: retail-service
        name: AfroTransact Retail service
        type: confidential
        secret: ${RETAIL_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [inventory:receive, inventory:adjust, inventory:read]
      - client-id: mcp-client
        name: AI agents (MCP)
        type: public
        grant-types: [authorization_code]
        require-consent: true
        redirect-uris: ["http://127.0.0.1:33418/callback", "https://claude.ai/api/mcp/auth_callback"]
        scopes: [openid, mcp:shopper, mcp:seller, mcp:staff]
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
management:
  tracing:
    sampling:
      probability: 0.5
