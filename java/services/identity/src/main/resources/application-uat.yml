# UAT / staging: production-like, anonymised data, API reference pages on for testers.
at:
  api-docs:
    enabled: true
  identity:
    seller-sync:
      # In-cluster service name of seller-service (organisation reconcile).
      seller-url: ${SELLER_URL:http://seller:8080}
    issuer: ${AUTH_ISSUER_URL:https://auth.uat.afrotransact.com}
    home-url: ${HOME_URL:${PUBLIC_WEB_URL:https://uat.afrotransact.com}}
    invitations:
      accept-url: ${INVITATION_ACCEPT_URL:${SELLER_CENTER_URL:https://seller.uat.afrotransact.com}/invitations/accept}
    signing:
      generate-if-missing: false
    data-protection:
      # IDENTITY_DATA_KEY (secret store afrotransact/uat/identity): base64 AES-256 key-encryption key for MFA
      # secrets at rest, required with provider local. During a rotation the old key moves to
      # IDENTITY_DATA_KEYS_PREVIOUS ([keyId:]base64, comma-separated) until POST /v1/admin/data-protection/rotate
      # reports nothing left on it. IDENTITY_DATA_PROVIDER switches to a cloud KMS adapter when one is deployed.
      provider: ${IDENTITY_DATA_PROVIDER:local}
      key-id: ${IDENTITY_DATA_KEY_ID:}
      key: ${IDENTITY_DATA_KEY:}
      previous-keys: ${IDENTITY_DATA_KEYS_PREVIOUS:}
    webauthn:
      rp-id: ${WEBAUTHN_RP_ID:${PLATFORM_DOMAIN:uat.afrotransact.com}}
      rp-name: AfroTransact
      # identity's own pages and the storefront origins whose sign-in forms run the passkey ceremony
      allowed-origins:
        - ${AUTH_ISSUER_URL:https://auth.uat.afrotransact.com}
        - ${PUBLIC_WEB_URL:https://uat.afrotransact.com}
      # S016: native app origins for platform passkeys (Face ID / fingerprint), comma-separated. Android:
      # android:apk-key-hash:<base64url SHA-256 of the app signing certificate>, one per app and signing key. iOS apps
      # sign with the web origin of their associated domain (apple-app-site-association on the storefront).
      app-origins: ${WEBAUTHN_APP_ORIGINS:}
    cors-allowed-origins:
      - ${PUBLIC_WEB_URL:https://uat.afrotransact.com}
      - ${SELLER_CENTER_URL:https://seller.uat.afrotransact.com}
      - ${STAFF_CONSOLE_URL:https://admin.uat.afrotransact.com}
    # Hosted sign-in / sign-up pages: branding per app (by the authorization request) and their links.
    pages:
      storefront-url: ${PUBLIC_WEB_URL:https://uat.afrotransact.com}
      seller-center-url: ${SELLER_CENTER_URL:https://seller.uat.afrotransact.com}
      staff-console-url: ${STAFF_CONSOLE_URL:https://admin.uat.afrotransact.com}
    clients:
      - client-id: customer-app
        name: AfroTransact app
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        redirect-uris: [com.afrotransact.customer:/oauth2redirect]
        scopes: [openid, profile, email, phone, offline_access]
      - client-id: driver-app
        name: AfroTransact Driver
        type: public
        grant-types: [authorization_code, refresh_token]
        public-refresh-tokens: true
        refresh-token-ttl: 14h
        redirect-uris: [com.afrotransact.driver:/oauth2redirect]
        scopes: [openid, profile, email, offline_access]
      - client-id: gateway-bff
        name: Gateway BFF (storefront, Seller Center, staff console)
        type: confidential
        # GATEWAY_BFF_CLIENT_SECRET (BFF_CLIENT_SECRET still accepted). The web apps' only OAuth client: authorization
        # code + PKCE + refresh tokens through identity's hosted sign-in (single sign-on). Each app has its own callback
        # on its own origin (<app>/api/bff proxies to the BFF), so its session cookie stays first-party, and its own
        # post-logout landing (RP-initiated logout, /connect/logout), <app>/api/bff/v1/auth/signed-out/<app>: the BFF then
        # shows the storefront signed out or starts that app's own branded sign-in. Client credentials with scope auth:first-party call
        # the first-party sign-in API (/v1/auth/*).
        secret: ${GATEWAY_BFF_CLIENT_SECRET:${BFF_CLIENT_SECRET:}}
        grant-types: [authorization_code, refresh_token, client_credentials]
        redirect-uris: ["${PUBLIC_WEB_URL:https://uat.afrotransact.com}/api/bff/v1/auth/oidc/callback", "${SELLER_CENTER_URL:https://seller.uat.afrotransact.com}/api/bff/v1/auth/oidc/callback", "${STAFF_CONSOLE_URL:https://admin.uat.afrotransact.com}/api/bff/v1/auth/oidc/callback"]
        post-logout-redirect-uris: ["${PUBLIC_WEB_URL:https://uat.afrotransact.com}/api/bff/v1/auth/signed-out/storefront", "${SELLER_CENTER_URL:https://seller.uat.afrotransact.com}/api/bff/v1/auth/signed-out/seller-center", "${STAFF_CONSOLE_URL:https://admin.uat.afrotransact.com}/api/bff/v1/auth/signed-out/staff-console"]
        scopes: [openid, profile, email, phone, offline_access, "auth:first-party", "shipping:rate", "tax:quote", "payments:fees.read", "sellers:ship-from.read", "orders:pay-link"]
      - client-id: seller-service
        name: Seller service
        type: confidential
        secret: ${SELLER_SERVICE_CLIENT_SECRET:}
        grant-types: [client_credentials]
        scopes: [orgs:manage, users:read, "inventory:storage.read", "ads:spend.read", "ai:usage.read", "payments:plan-fees", "payments:connected-accounts"]
      - client-id: orders-service
        name: Orders service
        type: confidential
        secret: ${ORDERS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, inventory:reserve, cart:service, orders:manage, users:read, "tax:quote", "sellers:ship-from.read", offers:read, delivery-runs:reserve]
      - client-id: cart-service
        name: Cart service
        type: confidential
        # S272: pre-order eligibility of cart lines (delivery-runs GET /v1/service/preorders/eligibility).
        secret: ${CART_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [delivery-runs:reserve]
      - client-id: tax-returns-service
        name: Tax returns service
        type: confidential
        secret: ${TAX_RETURNS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, inventory:adjust, "shipping:label", users:read, inventory:returns, orders:lookup, delivery:returns]
      - client-id: bookings-service
        name: Bookings service
        type: confidential
        secret: ${BOOKINGS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [payments:service, users:read]
      - client-id: fulfilment-service
        name: Fulfilment service
        type: confidential
        secret: ${FULFILMENT_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [orders:update-status, inventory:reserve, delivery:relay, delivery-runs:read, delivery-runs:manage]
      - client-id: payments-service
        name: Payments service
        type: confidential
        secret: ${PAYMENTS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [orgs:read, "seller:billing"]
      - client-id: notifications-service
        name: Notifications service
        type: confidential
        secret: ${NOTIFICATIONS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [users:read, delivery-runs:audience.read]
      - client-id: trust-ops-service
        name: Trust & safety operations service
        type: confidential
        secret: ${TRUSTOPS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [catalog:moderate, payments:service, compliance:hold, offers:write, ai:triage, users:read, orders:lookup, sellers:enforce, "bookings:reviews:moderate"]
      - client-id: search-service
        name: Search service
        type: confidential
        secret: ${SEARCH_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [ai:use, ads:serve]
      - client-id: delivery-runs-service
        name: Delivery runs service
        type: confidential
        secret: ${DELIVERY_RUNS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [geo:zones:write, "orders:on-behalf", "media:read"]
      - client-id: media-service
        name: Media service
        type: confidential
        secret: ${MEDIA_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [ai:use]
      - client-id: indexer-service
        name: Search indexer
        type: confidential
        secret: ${INDEXER_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [sellers:directory, ai:use]
      - client-id: offers-service
        name: Offers service
        type: confidential
        secret: ${OFFERS_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [catalog:read, "sellers:ship-from.read"]
      # S308: catalog-service copies the images of bulk product uploads through media (POST /v1/assets/import).
      - client-id: catalog-service
        name: Catalog service
        type: confidential
        secret: ${CATALOG_CLIENT_SECRET:}
        grant-types: [client_credentials]
        scopes: ["media:import"]
      - client-id: retail-service
        name: AfroTransact Retail service
        type: confidential
        secret: ${RETAIL_CLIENT_SECRET}
        grant-types: [client_credentials]
        scopes: [catalog:read, inventory:receive, inventory:read, "media:write"]
      - client-id: inventory-service
        name: Inventory service
        type: confidential
        secret: ${INVENTORY_CLIENT_SECRET}
        grant-types: [client_credentials]
        # FBA inbound: AT-FN unit labels (catalog), inbound shipping labels (carrier-gateway)
        scopes: [catalog:read, catalog:write, "shipping:label"]
      - client-id: mcp-client
        name: AI agents (MCP)
        type: public
        grant-types: [authorization_code]
        require-consent: true
        redirect-uris: ["http://127.0.0.1:33418/callback", "https://claude.ai/api/mcp/auth_callback"]
        scopes: [openid, mcp:shopper, mcp:seller, mcp:staff]
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
management:
  tracing:
    sampling:
      probability: 0.5
