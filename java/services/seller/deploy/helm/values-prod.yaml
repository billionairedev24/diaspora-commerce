env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 640Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint (docs/engineering/cloud-cost.md)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70 -Xss512k"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  MEDIA_BASE_URL: http://media:8080
  GEO_URL: http://geo:8080
  # S298 kill switch: sellers may pay their plan from their sales (payments withholds it from the next transfers).
  # Off here until operations switch it on for this environment; dev turns it on (values-dev.yaml).
  PAYMENTS_URL: http://payments:8080
  COLLECT_PLAN_FEES_FROM_EARNINGS: "false"
  SELLER_LIVE_COUNTRIES: US
