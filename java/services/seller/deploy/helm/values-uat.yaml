env: uat
replicas: 2
autoscaling:
  enabled: true
  min: 2
  max: 4
  cpu: 70
rollout:
  enabled: true
resources:
  requests: {cpu: 250m, memory: 768Mi}
  limits: {memory: 1536Mi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.5"
tolerations:
  - {key: afrotransact.com/spot, operator: Exists, effect: NoSchedule}
extraEnv:
  MEDIA_BASE_URL: http://media:8080
  GEO_URL: http://geo:8080
  # S298 kill switch: sellers may pay their plan from their sales (payments withholds it from the next transfers).
  # Off here until operations switch it on for this environment; dev turns it on (values-dev.yaml).
  PAYMENTS_URL: http://payments:8080
  COLLECT_PLAN_FEES_FROM_EARNINGS: "false"
  SELLER_LIVE_COUNTRIES: US
