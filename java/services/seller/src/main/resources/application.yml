spring:
  application:
    name: seller-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seller}
    username: ${DB_USER:seller}
    password: ${DB_PASSWORD:seller}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP:seller-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URL:http://localhost:8100}

server:
  port: ${PORT:8106}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: afrotransact
      deployment.environment: ${APP_ENV:local}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      service: seller-service
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

at:
  api-docs:
    title: Seller API
    description: >-
      Seller and service-provider organisations: resumable onboarding applications (entity-aware business details,
      beneficial owners, Stripe Connect embedded verification, payouts, plan, permits and licences), the two-step
      staff review, Stripe Connect compliance sync (Account health, reminders, payout holds) and plans & billing on
      Stripe Billing.
    version: v1
  security:
    public-paths:
      - /v1/orgs/*/public
      - /v1/plans
      - /v1/markets
  events:
    relay-enabled: true
  seller:
    # Markets open to sellers; other countries get 422 seller.country-not-live and the launch list.
    live-countries: ${SELLER_LIVE_COUNTRIES:US}
    # AfroTransact Retail (1P): never on a plan, never metered, never suspended.
    retail-org-id: ${RETAIL_ORG_ID:org_afrotransact_retail}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}
      billing-webhook-secret: ${STRIPE_BILLING_WEBHOOK_SECRET:}
      session-components: account_onboarding,account_management,notification_banner
      max-network-retries: 2
      # stripe everywhere; only the local profile may use the stand-in (auto / local-test, LocalTestStripePolicy).
      mode: stripe
    crypto:
      active-key-id: ${FIELD_ENCRYPTION_KEY_ID:k1}
      keys:
        k1: ${FIELD_ENCRYPTION_KEY:}
    media:
      base-url: ${MEDIA_BASE_URL:http://localhost:8207}
      service-token: ${MEDIA_SERVICE_TOKEN:}
    # S255: geocoding ship-from addresses and AfroTransact pickup validation (DELIVERY zones, public geo endpoints).
    geo:
      base-url: ${GEO_URL:http://localhost:8205}
      timeout: ${GEO_TIMEOUT:3s}
      pickup-max-radius-miles: ${PICKUP_MAX_RADIUS_MILES:25}
    consumers:
      # identity.role.granted / revoked (S236: org_member mirrors identity). Off in tests without a broker.
      enabled: ${SELLER_CONSUMERS_ENABLED:true}
      identity-topic: ${IDENTITY_EVENTS_TOPIC:at.identity.events}
      # S296 reward metrics: delivered shipments (sales, orders), completed bookings, live offers (listings).
      orders-topic: ${ORDER_EVENTS_TOPIC:at.order.events}
      bookings-topic: ${BOOKINGS_EVENTS_TOPIC:at.bookings.events}
      offers-topic: ${OFFERS_EVENTS_TOPIC:at.offers.events}
    # S292–S297: plans, trials, credits and rewards are ours; Stripe Billing executes the charges.
    billing:
      # Reconcile the plan catalogue with Stripe at startup (adopt make stripe-setup prices, create missing ones).
      sync-on-startup: ${PLAN_SYNC_ON_STARTUP:true}
      # S298 kill switch: organisations may pay their plan from their sales (payments withholds each invoice from the
      # next transfers; per-organisation choice EARNINGS_FIRST / CARD). Off: the choice is hidden and every plan
      # invoice is charged to the card. On in local and dev profiles; uat / prod set it in Helm values.
      collect-from-earnings: ${COLLECT_PLAN_FEES_FROM_EARNINGS:false}
      payments-url: ${PAYMENTS_URL:http://localhost:8105}
      timeout: ${PAYMENTS_TIMEOUT:10s}
    # S206 metered billing: usage sources (service token of the seller-service client, scopes
    # inventory:storage.read ads:spend.read ai:usage.read) and the daily metering run.
    metering:
      inventory-url: ${INVENTORY_URL:http://localhost:8103}
      content-url: ${CONTENT_URL:http://localhost:8112}
      ai-url: ${AI_GATEWAY_URL:http://localhost:8113}
      token-uri: ${AUTH_TOKEN_URL:${AUTH_ISSUER_URL:http://localhost:8100}/oauth2/token}
      client-id: ${SELLER_SERVICE_CLIENT_ID:seller-service}
      client-secret: ${SELLER_SERVICE_CLIENT_SECRET:}
      timeout: ${METERING_TIMEOUT:10s}
    jobs:
      enabled: ${SELLER_JOBS_ENABLED:true}
      # Hourly: reminders 7/3/1 days before current_deadline (idempotent per threshold).
      reminder-cron: ${REMINDER_CRON:0 15 * * * *}
      plan-change-cron: ${PLAN_CHANGE_CRON:0 5 * * * *}
      activation-retry-interval: ${ACTIVATION_RETRY_INTERVAL:10m}
      # Daily: meters the two previous UTC days (late usage is picked up; re-runs only send differences).
      metering-cron: ${METERING_CRON:0 20 1 * * *}
      # Daily: every live reward rule for every organisation (days since approval, windows without events).
      rewards-cron: ${REWARDS_CRON:0 40 2 * * *}
      grant-retry-interval: ${GRANT_RETRY_INTERVAL:15m}
      earnings-interval: ${EARNINGS_COLLECTION_INTERVAL:1m}
      zone: ${JOBS_ZONE:UTC}
