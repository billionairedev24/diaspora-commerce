# Local developer profile: docker compose stack from infra/local, security off, human-readable logs.
# The field-encryption key below is a well-known DEV key; real environments inject FIELD_ENCRYPTION_KEY.
at:
  security:
    enabled: false
  seller:
    # POST /v1/orgs: staff provision approved demo organisations (make seed). Never on in uat or prod.
    provisioning-enabled: true
    crypto:
      keys:
        k1: ${FIELD_ENCRYPTION_KEY:ZGV2LW9ubHktZmllbGQta2V5LTMyLWJ5dGVzLWxvbiE=}
logging:
  level:
    com.afrotransact: DEBUG
