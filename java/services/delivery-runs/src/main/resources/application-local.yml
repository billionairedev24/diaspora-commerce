# Local developer profile: docker compose stack from infra/local, security off, human-readable logs.
at:
  security:
    enabled: false
  delivery-runs:
    # The delivery-runs-service client of identity's local profile (geo:zones:write, orders:on-behalf, media:read).
    geo:
      client-secret: ${DELIVERY_RUNS_CLIENT_SECRET:local-delivery-runs-service-secret}
    preorders:
      # The design's demo coverage areas (Lubbock, Amarillo, El Paso, Midland, Odessa, Toronto, Mississauga,
      # Brampton on; Laredo off). Local only: no demo data in migrations.
      seed-demo-areas: ${PREORDERS_SEED_DEMO_AREAS:true}
logging:
  level:
    com.afrotransact: DEBUG
