spring:
  application:
    name: payments-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP:payments-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URL:http://localhost:8100}

server:
  port: ${PORT:8105}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: afrotransact
      deployment.environment: ${APP_ENV:local}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      service: payments-service
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

at:
  consumers:
    # Kafka listeners for other services' events (off in tests that have no broker).
    enabled: ${CONSUMERS_ENABLED:true}
  api-docs:
    title: Payments API
    description: >-
      Stripe PaymentIntents with manual capture per shipment, line-level refunds, the immutable double-entry
      ledger, multi-seller payment splits and fee schedules, settlement holds and Connect transfers, payouts on
      request, chargebacks, the signed Stripe webhook inbox, daily reconciliation and shoppers' saved payment
      methods.
    version: v1
  security:
    # S248 fine-grained authorisation (OpenFGA, docs/engineering/authorisation.md). Off unless FGA_ENABLED=true;
    # enforce=false is shadow mode: relationship denials are logged ("FGA shadow:"), not enforced.
    fga:
      enabled: ${FGA_ENABLED:false}
      enforce: ${FGA_ENFORCE:true}
      api-url: ${FGA_API_URL:http://localhost:8091}
      store-id: ${FGA_STORE_ID:}
      store-name: ${FGA_STORE_NAME:afrotransact}
      model-id: ${FGA_MODEL_ID:}
      api-token: ${FGA_API_TOKEN:}
      timeout: ${FGA_TIMEOUT:500ms}
      cache-ttl: ${FGA_CACHE_TTL:5s}
    # Stripe calls the webhook without a JWT; the Stripe-Signature header is verified instead.
    public-paths:
      - /v1/webhooks/stripe
  events:
    relay-enabled: true
  payments:
    retail-org-id: ${RETAIL_ORG_ID:org_afrotransact_retail}
    settlement-hold: ${SETTLEMENT_HOLD:7d}
    currency: USD
    zone: ${PAYMENTS_ZONE:America/New_York}
    payout:
      minimum-minor: ${PAYOUT_MINIMUM_MINOR:2500}
    # S321 gift cards. Codes are stored as HMACs under GIFT_CARD_CODE_KEY (blank: derived from the Stripe webhook
    # secret). A customer may get max-failures codes wrong, a network address max-failures-per-address, per window;
    # the send-date job emails due cards.
    gift-cards:
      code-key: ${GIFT_CARD_CODE_KEY:}
      max-failures: ${GIFT_CARD_MAX_FAILURES:5}
      max-failures-per-address: ${GIFT_CARD_MAX_FAILURES_PER_ADDRESS:20}
      window: ${GIFT_CARD_ATTEMPT_WINDOW:15m}
      delivery-batch: 50
    # S322 referral program. The offer itself (rewards, minimum order, return window, caps, validity, on/off) is staff
    # Settings, stored in the database; only the key of the abuse-check fingerprints is configuration. Delivery addresses
    # are kept as HMACs under REFERRAL_SIGNAL_KEY (blank: derived from the Stripe webhook secret). The reward job runs
    # every referral-interval (jobs.referral-interval, jobs.referral-batch).
    referral:
      signal-key: ${REFERRAL_SIGNAL_KEY:}
    # S226: AfroTransact Retail supplier payments (retail.payment.released) are due this many days after release
    # unless retail-service sends a due date.
    supplier-payments:
      terms-days: ${SUPPLIER_PAYMENT_TERMS_DAYS:30}
    # The seller service's billing API, read with identity's payments-service client (scope seller:billing) to learn an
    # organisation's plan before payments received its first seller.subscription.changed (plan rates of the fee
    # schedule). Blank SELLER_URL = no fallback: such organisations pay category rates until the event arrives.
    seller:
      base-url: ${SELLER_URL:}
      token-uri: ${AUTH_TOKEN_URL:${AUTH_ISSUER_URL:http://localhost:8100}/oauth2/token}
      client-id: ${PAYMENTS_CLIENT_ID:payments-service}
      client-secret: ${PAYMENTS_CLIENT_SECRET:}
      timeout: ${SELLER_TIMEOUT:3s}
    stripe:
      # Keys only from the environment. No default here: every profile must provide them.
      secret-key: ${STRIPE_SECRET_KEY}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}
      api-base: ${STRIPE_API_BASE:https://api.stripe.com}
      # stripe everywhere; only the local profile may use its stand-in (auto / local-test, LocalTestPaymentsPolicy).
      mode: stripe
      require-live-key: false
      # Multicapture ("captured per shipment") needs Stripe flexible payments on the account; without it Stripe refuses
      # every checkout ("This account is not eligible for the requested card features"). Off: each order is captured
      # once, when its first shipment ships (the rest of the order with it). Turn on only once Stripe enabled it.
      multicapture: ${STRIPE_MULTICAPTURE:false}
      max-network-retries: 2
      webhook-tolerance-seconds: 300
    webhooks:
      max-attempts: 12
    jobs:
      enabled: ${PAYMENTS_JOBS_ENABLED:true}
      webhook-batch: 100
      webhook-interval: ${WEBHOOK_INTERVAL:1s}
      settlement-batch: 200
      settlement-cron: ${SETTLEMENT_CRON:0 */15 * * * *}
      settlement-recheck: 1h
      reconciliation-cron: ${RECONCILIATION_CRON:0 10 3 * * *}
      # Records negotiated rates that reached their end date (they stop applying at it anyway).
      negotiated-rate-expiry-cron: ${NEGOTIATED_RATE_EXPIRY_CRON:0 */5 * * * *}
