# Local developer profile: docker compose stack from infra/local, security off, human-readable logs.
# Stripe stays real (test mode on api.stripe.com): export STRIPE_SECRET_KEY=sk_test_… and run
# `stripe listen --forward-to localhost:8105/v1/webhooks/stripe` to get STRIPE_WEBHOOK_SECRET.
at:
  security:
    enabled: false
  payments:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:sk_test_replace_with_your_stripe_test_key}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_with_stripe_listen_secret}
logging:
  level:
    com.afrotransact: DEBUG
