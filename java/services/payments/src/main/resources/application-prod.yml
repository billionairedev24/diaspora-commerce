# Production: live Stripe keys required, reference pages off (published on developers.afrotransact.com).
at:
  security:
    # S248 OpenFGA relationship checks. OFF in prod by owner decision (ADR 0010 "No OpenFGA at launch"): isolation is RBAC + the
    # signed org claim + owner checks (docs/engineering/tenant-isolation.md). Do not set FGA_ENABLED in prod without that ADR's shadow-then-enforce plan.
    fga:
      enabled: ${FGA_ENABLED:false}
      enforce: ${FGA_ENFORCE:false}
      # In-cluster OpenFGA (infra/k8s/platform/openfga); FGA_API_TOKEN comes from the service's secret.
      api-url: ${FGA_API_URL:http://openfga.openfga.svc:8080}
  api-docs:
    enabled: false
  payments:
    stripe:
      require-live-key: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
