# UAT / staging: production-like, Stripe test mode, API reference pages on for testers.
at:
  security:
    # S248 OpenFGA relationship checks. Shadow mode: denials are logged (FGA shadow) and reviewed before FGA_ENFORCE=true.
    fga:
      enabled: ${FGA_ENABLED:true}
      enforce: ${FGA_ENFORCE:false}
      # In-cluster OpenFGA (infra/k8s/platform/openfga); FGA_API_TOKEN comes from the service's secret.
      api-url: ${FGA_API_URL:http://openfga.openfga.svc:8080}
  api-docs:
    enabled: true
  payments:
    stripe:
      require-live-key: false
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
management:
  tracing:
    sampling:
      probability: 0.5
