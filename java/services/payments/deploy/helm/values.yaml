# Base values for payments. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: payments
  runtime: java
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: payments-service
  tag: dev   # sentinel for local renders; the deploy pipeline writes the git sha into values-<env>.yaml
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/payments in the cloud secret store:
#   - DB_URL
#   - DB_USER
#   - DB_PASSWORD
#   - KAFKA_BOOTSTRAP
#   - STRIPE_SECRET_KEY
#   - STRIPE_WEBHOOK_SECRET
#   - FGA_API_TOKEN            (one of OpenFGA's pre-shared keys, afrotransact/openfga preshared-keys; S248)
#   - PAYMENTS_CLIENT_SECRET   (identity's payments-service client, scope seller:billing: reads an organisation's plan
#                               from the seller service until seller.subscription.changed arrives; optional)
secrets:
  enabled: true
  store: platform-secrets
  keySeparator: "/"     # "-" on GCP Secret Manager and Azure Key Vault (set in platform-values.yaml)
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv:
  SELLER_URL: http://seller:8080
  RETAIL_ORG_ID: org_afrotransact_retail
  SETTLEMENT_HOLD: 7d
  PAYMENTS_ZONE: America/New_York
nodeSelector: {}
tolerations: []
