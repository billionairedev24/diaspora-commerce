spring:
  application:
    name: offers-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offers}
    username: ${DB_USER:offers}
    password: ${DB_PASSWORD:offers}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP:offers-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URL:http://localhost:8100}

server:
  port: ${PORT:8102}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: afrotransact
      deployment.environment: ${APP_ENV:local}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    tags:
      service: offers-service
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

at:
  consumers:
    # Kafka listeners for other services' events (off in tests that have no broker).
    enabled: ${CONSUMERS_ENABLED:true}
  api-docs:
    title: Offers API
    description: >-
      Seller offers on shared product pages (many sellers per ATIN), buy box selection with reasons, the
      "other sellers on this product" listing, and coupons & promotions (validate / idempotent redeem).
    version: v1
  security:
    public-paths:
      - /v1/public/**
    # S022 fine-grained authorisation (OpenFGA). Off unless FGA_ENABLED=true; see docs/engineering/authorisation.md.
    # enforce=false is shadow mode: relationship denials are logged, not enforced.
    fga:
      enabled: ${FGA_ENABLED:false}
      enforce: ${FGA_ENFORCE:true}
      api-url: ${FGA_API_URL:http://localhost:8091}
      store-id: ${FGA_STORE_ID:}
      store-name: ${FGA_STORE_NAME:afrotransact}
      model-id: ${FGA_MODEL_ID:}
      api-token: ${FGA_API_TOKEN:}
      timeout: ${FGA_TIMEOUT:500ms}
      cache-ttl: ${FGA_CACHE_TTL:5s}
  events:
    relay-enabled: true
  offers:
    retail-org-id: ${RETAIL_ORG_ID:org_afrotransact_retail}
    default-handling-days: 2
    afrotransact-transit-days: 2
    seller-transit-days: 4
    # S255: AfroTransact Delivery from the seller's store (local, collected and delivered by our driver).
    afrotransact-delivery-transit-days: 1
    low-stock-threshold: 5
    catalog:
      base-url: ${CATALOG_URL:http://localhost:8101}
      timeout: ${CATALOG_TIMEOUT:3s}
    # S255: seller-service GET /v1/ship-from-locations/{id} (AFROTRANSACT_DELIVERY offers need a pickup location).
    seller:
      base-url: ${SELLER_URL:http://localhost:8106}
      timeout: ${SELLER_TIMEOUT:3s}
    # offers-service's own client-credentials token (GTIN lookups at catalog need catalog:read; pickup locations at
    # seller need sellers:ship-from.read).
    oauth:
      issuer-url: ${AUTH_ISSUER_URL:http://localhost:8100}
      token-path: /oauth2/token
      client-id: ${OFFERS_CLIENT_ID:offers-service}
      client-secret: ${OFFERS_CLIENT_SECRET:local-offers-service-secret}
      scopes: catalog:read sellers:ship-from.read
    consumers:
      catalog-topic: at.product.events
      inventory-topic: at.inventory.events
      # S257: inventory.inbound.received (FBA stock received at a fulfilment centre) → Fulfilled by AfroTransact offer
      inventory-inbound-topic: at.inventory-inbound.events
      seller-compliance-topic: at.seller-compliance.events
      seller-org-topic: at.seller-org.events
      # S281: AfroTransact Retail's item listing (LIVE / PAUSED) drives its first-party offer
      retail-topic: at.retail.events
    buy-box:
      price-points: 600
      fulfilment-points: 100
      delivery-points: 100
      performance-points: 150
      stock-points: 50
      full-stock-units: 10
      max-defect-rate: 0.02
      min-on-time-rate: 0.80
      new-seller-rating: 4.0
