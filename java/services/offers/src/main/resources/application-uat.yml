# UAT / staging: production-like, anonymised data, API reference pages on for testers.
at:
  offers:
    catalog:
      # In-cluster service name of catalog-service (Helm chart `catalog`, port 8080).
      base-url: ${CATALOG_URL:http://catalog:8080}
  api-docs:
    enabled: true
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
management:
  tracing:
    sampling:
      probability: 0.5
