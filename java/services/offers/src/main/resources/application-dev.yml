# Shared dev cluster: per-PR preview namespaces; API reference pages on.
at:
  security:
    # S022 OpenFGA relationship checks. Enforced: authz-sync runs in dev and owns the store and model.
    fga:
      enabled: ${FGA_ENABLED:true}
      enforce: ${FGA_ENFORCE:false}  # shadow until authz-sync seeds service-client tuples (S248)
      # In-cluster OpenFGA (infra/k8s/platform/openfga); FGA_API_TOKEN comes from the service's secret.
      api-url: ${FGA_API_URL:http://openfga.openfga.svc:8080}
  offers:
    catalog:
      # In-cluster service name of catalog-service (Helm chart `catalog`, port 8080).
      base-url: ${CATALOG_URL:http://catalog:8080}
    seller:
      # In-cluster service name of seller-service (AfroTransact Delivery pickup locations, S255).
      base-url: ${SELLER_URL:http://seller:8080}
  api-docs:
    enabled: true
management:
  tracing:
    sampling:
      probability: 1.0
