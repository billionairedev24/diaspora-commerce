# Local developer profile: docker compose stack from infra/local, security off, human-readable logs.
at:
  security:
    enabled: false
    # Security is off locally (every call is the local super admin), so relationship checks stay off too. To try
    # them: FGA_ENABLED=true with docker compose's OpenFGA on :8091 and authz-sync running (it creates the store).
    fga:
      enabled: ${FGA_ENABLED:false}
      api-url: ${FGA_API_URL:http://localhost:8091}
logging:
  level:
    com.afrotransact: DEBUG
# F15: the local database password lives here, not in application.yml, so a missing DB_PASSWORD in uat or prod
# fails the start instead of falling back to the service name.
spring:
  datasource:
    password: ${DB_PASSWORD:offers}
# F15: local-only default of the service client secret.
at.offers.oauth.client-secret: ${OFFERS_CLIENT_SECRET:local-offers-service-secret}
