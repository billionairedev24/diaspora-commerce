# UAT / staging: production-like, anonymised data, API reference pages on for testers.
at:
  api-docs:
    enabled: true
  content:
    newsletter:
      confirm-url: https://www.uat.afrotransact.com/newsletter/confirm
      unsubscribe-url: https://www.uat.afrotransact.com/newsletter/unsubscribe
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
management:
  tracing:
    sampling:
      probability: 0.5
