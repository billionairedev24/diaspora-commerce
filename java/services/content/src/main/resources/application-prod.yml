# Production: reference pages off (published on developers.afrotransact.com), sampled traces.
at:
  api-docs:
    enabled: false
  content:
    newsletter:
      confirm-url: ${NEWSLETTER_CONFIRM_URL:${PUBLIC_WEB_URL:https://afrotransact.com}/newsletter/confirm}
      unsubscribe-url: ${NEWSLETTER_UNSUBSCRIBE_URL:${PUBLIC_WEB_URL:https://afrotransact.com}/newsletter/unsubscribe}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
