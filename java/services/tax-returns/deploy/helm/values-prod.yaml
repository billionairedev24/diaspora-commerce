env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 640Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint (docs/engineering/cloud-cost.md)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70 -Xss512k"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  PAYMENTS_URL: http://payments:8080
  INVENTORY_URL: http://inventory:8080
  CARRIER_GATEWAY_URL: http://carrier-gateway:8080
  CATALOG_URL: http://catalog:8080
  TAX_PROVIDER: RULES
  RETURN_CENTRE_NODE: fc_houston
  RETURN_CENTRE_NAME: AfroTransact Returns
  RETURN_CENTRE_LINE1: 9800 Returns Pkwy
  RETURN_CENTRE_CITY: Houston
  RETURN_CENTRE_STATE: TX
  RETURN_CENTRE_POSTAL_CODE: "77032"
  RETURN_CENTRE_COUNTRY: US
