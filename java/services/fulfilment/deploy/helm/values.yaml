# Base values for fulfilment. Environment files override; Argo CD adds platform-values.yaml (cloud, identity, store).
service:
  name: fulfilment
  runtime: java
  port: 8080
env: dev
cloud: none            # aws | gcp | azure | none (kind / local clusters)
image:
  registry: ghcr.io/billionairedev24/diaspora-commerce
  repository: fulfilment-service
  tag: latest
replicas: 1
autoscaling:
  enabled: false
  min: 1
  max: 3
  cpu: 70
rollout:
  enabled: false
  pause: 2m
  maxErrorRate: "0.01"
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "1.0"
monitoring:
  serviceMonitor: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability:9090
# Secret keys expected at afrotransact/<env>/fulfilment in the cloud secret store:
#   - DB_URL
#   - DB_USER
#   - DB_PASSWORD
#   - KAFKA_BOOTSTRAP
#   - FULFILMENT_CLIENT_SECRET
secrets:
  enabled: true
  store: platform-secrets
  keySeparator: "/"     # "-" on GCP Secret Manager and Azure Key Vault (set in platform-values.yaml)
workloadIdentity:
  aws: {roleArn: ""}
  gcp: {serviceAccount: ""}
  azure: {clientId: ""}
extraEnv:
  AUTH_ISSUER_URI: https://auth.dev.afrotransact.com
  ORDERS_URL: http://orders:8080
  INVENTORY_URL: http://inventory:8080
  GEO_URL: http://geo:8080
  # Node for FC tasks when inventory has no reservation (empty = ops assign it).
  FULFILMENT_DEFAULT_NODE: ""
nodeSelector: {}
tolerations: []
