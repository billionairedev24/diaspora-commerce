env: prod
replicas: 1
autoscaling:
  enabled: false
rollout:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {memory: 640Mi}
monitoring:
  serviceMonitor: false     # no in-cluster Prometheus on the lean footprint (docs/engineering/cloud-cost.md)
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxRAMPercentage=70 -Xss512k -XX:-UsePerfData -XX:ReservedCodeCacheSize=64m -XX:+ExitOnOutOfMemoryError"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  # Client-credentials token of retail-service (secret RETAIL_CLIENT_SECRET) for inventory calls.
  # In-cluster service names; every service listens on 8080 in Kubernetes.
  CATALOG_BASE_URL: http://catalog:8080
  INVENTORY_BASE_URL: http://inventory:8080
  # S225: PO PDFs and shipment documents live in media. EDI stays off until the SFTP / AS2 adapters are finished.
  MEDIA_BASE_URL: http://media:8080
  EDI_ENABLED: "false"
