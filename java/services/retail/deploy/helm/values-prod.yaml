env: prod
replicas: 3
autoscaling:
  enabled: true
  min: 3
  max: 12
  cpu: 70
rollout:
  enabled: true
resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {memory: 2Gi}
telemetry:
  otlpEndpoint: otel-collector.observability:4318
  sampling: "0.1"
tolerations: []
extraEnv:
  # Client-credentials token of retail-service (secret RETAIL_CLIENT_SECRET) for inventory calls.
  # In-cluster service names; every service listens on 8080 in Kubernetes.
  CATALOG_BASE_URL: http://catalog:8080
  INVENTORY_BASE_URL: http://inventory:8080
  # S225: PO PDFs and shipment documents live in media. EDI stays off until the SFTP / AS2 adapters are finished.
  MEDIA_BASE_URL: http://media:8080
  EDI_ENABLED: "false"
