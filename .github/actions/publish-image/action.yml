name: Publish signed image
description: >
  Multi-arch (linux/amd64 + linux/arm64) reproducible build (SOURCE_DATE_EPOCH = commit time, layer timestamps
  rewritten) and push to GHCR, image policy check (non-root user, port 8080, prod defaults, size budget),
  Trivy image scan (CRITICAL fails), Syft SPDX SBOM (artifact + cosign attestation), cosign keyless signature.
  Requires the job to have `packages: write` and `id-token: write`.
inputs:
  service:
    description: Service name (image repository).
    required: true
  context:
    description: Docker build context.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  build-args:
    description: Extra build args (newline separated).
    required: false
    default: ""
  push:
    description: Push, scan, SBOM and sign (false = build only, e.g. on pull requests).
    required: false
    default: "true"
  max-size-mb:
    description: >
      Size budget of the linux/amd64 image in MB (uncompressed, as `docker image ls` shows it); empty = no budget.
      Go services: 60 (S010). Checked on every build, pull requests included.
    required: false
    default: ""
  required-env:
    description: Environment defaults the image must declare (space separated NAME=value), e.g. APP_ENV=prod.
    required: false
    default: ""
outputs:
  image:
    description: Image repository without tag.
    value: ${{ steps.meta.outputs.image }}
  tag:
    description: Immutable tag (git sha).
    value: ${{ steps.meta.outputs.tag }}
  digest:
    description: Manifest list digest.
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Image name
      id: meta
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        image="ghcr.io/${REPO,,}/${SERVICE}"
        echo "image=${image}" >> "$GITHUB_OUTPUT"
        echo "tag=${SHA}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    - uses: docker/setup-buildx-action@v4

    - name: Reproducible build timestamp
      id: epoch
      shell: bash
      run: |
        # SOURCE_DATE_EPOCH = the commit time, so the same commit always yields the same image digest: BuildKit
        # uses it for the image config/history and (rewrite-timestamp) clamps every file mtime in the layers.
        # Verified locally: two --no-cache builds of go/services/cart produce an identical OCI manifest digest.
        echo "epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Labels
      id: labels
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.meta.outputs.image }}
        tags: |
          type=raw,value=${{ steps.meta.outputs.tag }}
          type=sha,format=short
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
        labels: |
          org.opencontainers.image.title=${{ inputs.service }}
          com.afrotransact.service=${{ inputs.service }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        build-args: |
          VERSION=${{ steps.meta.outputs.tag }}
          ${{ inputs.build-args }}
        platforms: linux/amd64,linux/arm64
        outputs: type=image,push=${{ inputs.push == 'true' }},rewrite-timestamp=true
        tags: ${{ steps.labels.outputs.tags }}
        labels: ${{ steps.labels.outputs.labels }}
        provenance: mode=max
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,scope=${{ inputs.service }},mode=max
      env:
        SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}

    - name: Load linux/amd64 image for the policy check
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        build-args: |
          VERSION=${{ steps.meta.outputs.tag }}
          ${{ inputs.build-args }}
        platforms: linux/amd64
        load: true
        tags: local/${{ inputs.service }}:policy-check
        cache-from: type=gha,scope=${{ inputs.service }}
      env:
        SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}

    - name: Image policy (non-root, port 8080, prod defaults, size budget)
      shell: bash
      env:
        IMAGE: local/${{ inputs.service }}:policy-check
        MAX_MB: ${{ inputs.max-size-mb }}
        REQUIRED_ENV: ${{ inputs.required-env }}
      run: |
        set -euo pipefail
        fail=0
        user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
        case "${user%%:*}" in
          ""|root|0) echo "::error title=image policy::$IMAGE runs as root (USER '${user}'); set a non-root USER"; fail=1 ;;
        esac
        ports="$(docker image inspect --format '{{json .Config.ExposedPorts}}' "$IMAGE")"
        [[ "$ports" == *'"8080/tcp"'* ]] || { echo "::error title=image policy::$IMAGE does not EXPOSE 8080 ($ports)"; fail=1; }
        envs="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE")"
        for kv in $REQUIRED_ENV; do
          grep -qxF "$kv" <<<"$envs" || { echo "::error title=image policy::$IMAGE lacks ENV $kv"; fail=1; }
        done
        bytes="$(docker image inspect --format '{{.Size}}' "$IMAGE")"
        mb="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1000000 }')"
        {
          echo "### Image policy: ${{ inputs.service }}"
          echo "| user | exposed | size (linux/amd64, uncompressed) | budget |"
          echo "|---|---|---|---|"
          echo "| \`${user}\` | \`${ports}\` | ${mb} MB | ${MAX_MB:-none} MB |"
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ -n "$MAX_MB" ]] && awk -v m="$mb" -v x="$MAX_MB" 'BEGIN { exit !(m > x) }'; then
          echo "::error title=image size::$IMAGE is ${mb} MB, over the ${MAX_MB} MB budget"; fail=1
        fi
        docker image rm "$IMAGE" >/dev/null
        exit "$fail"

    - name: Trivy image scan (CRITICAL fails)
      if: inputs.push == 'true'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        trivy-config: trivy.yaml
        image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        format: json
        output: trivy-image.json

    - name: Report image vulnerabilities
      if: always() && inputs.push == 'true'
      shell: bash
      run: |
        # One annotation per finding, so failures are readable from the run summary without downloading logs.
        [[ -f trivy-image.json ]] || exit 0
        jq -r '.Results[]? as $r | $r.Vulnerabilities[]? |
          "::error title=\(.Severity) \(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix") (\($r.Target))"' \
          trivy-image.json | head -50

    - name: SBOM (Syft, SPDX)
      if: inputs.push == 'true'
      uses: anchore/sbom-action@v0
      with:
        image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        format: spdx-json
        output-file: sbom-${{ inputs.service }}.spdx.json
        artifact-name: sbom-${{ inputs.service }}.spdx.json

    - uses: sigstore/cosign-installer@v3
      if: inputs.push == 'true'

    - name: Sign image and attest SBOM (keyless)
      if: inputs.push == 'true'
      shell: bash
      env:
        REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        SERVICE: ${{ inputs.service }}
      run: |
        cosign sign --yes "$REF"
        cosign attest --yes --type spdxjson --predicate "sbom-${SERVICE}.spdx.json" "$REF"
        {
          echo "### Image"
          echo "\`$REF\`"
          echo "- signed (keyless, Fulcio/Rekor) and SBOM attested"
        } >> "$GITHUB_STEP_SUMMARY"
