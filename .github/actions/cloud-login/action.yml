name: Cloud login (OIDC)
description: >
  Federate the workflow's GitHub OIDC token into aws | gcp | azure - no long-lived keys. Values come from
  GitHub environment variables published by `tofu output github_oidc` (see docs/engineering/ci-cd.md).
  The job needs `id-token: write`.
  ovh is the exception: OVHcloud cannot trust GitHub's OIDC token (no workload identity federation for CI), so it
  uses scoped API credentials and S3 keys kept in GitHub secrets (plan and apply identities are separate; the
  deploy job needs neither, only the registry robot account). Nothing is written to disk; the values are masked
  and exported to the job environment for the OVH provider and OpenTofu's S3 state backend.
inputs:
  cloud:
    description: aws | gcp | azure | ovh
    required: true
  aws-role-arn:
    description: IAM role to assume (aws).
    required: false
    default: ""
  aws-region:
    description: AWS region (aws).
    required: false
    default: us-east-1
  gcp-workload-identity-provider:
    description: projects/<n>/locations/global/workloadIdentityPools/github/providers/github (gcp).
    required: false
    default: ""
  gcp-service-account:
    description: Service account to impersonate (gcp).
    required: false
    default: ""
  azure-client-id:
    description: Managed identity client id (azure).
    required: false
    default: ""
  azure-tenant-id:
    description: Entra tenant id (azure).
    required: false
    default: ""
  azure-subscription-id:
    description: Subscription id (azure).
    required: false
    default: ""
  ovh-endpoint:
    description: OVHcloud API endpoint (ovh) - ovh-eu, ovh-ca or ovh-us.
    required: false
    default: ovh-eu
  ovh-application-key:
    description: OVHcloud API application key (ovh). Empty for a registry-only identity (deploy).
    required: false
    default: ""
  ovh-application-secret:
    description: OVHcloud API application secret (ovh).
    required: false
    default: ""
  ovh-consumer-key:
    description: OVHcloud API consumer key (ovh); its access rules are the permission boundary of plan vs apply.
    required: false
    default: ""
  ovh-service-name:
    description: Public Cloud project id (ovh).
    required: false
    default: ""
  ovh-s3-access-key:
    description: Object Storage (S3) access key for the OpenTofu state bucket (ovh).
    required: false
    default: ""
  ovh-s3-secret-key:
    description: Object Storage (S3) secret key for the OpenTofu state bucket (ovh).
    required: false
    default: ""
outputs:
  gcp-access-token:
    description: Short-lived access token (gcp only) for registry logins.
    value: ${{ steps.gcp.outputs.access_token }}
runs:
  using: composite
  steps:
    - name: Validate target
      shell: bash
      env:
        CLOUD: ${{ inputs.cloud }}
      run: |
        case "$CLOUD" in aws|gcp|azure|ovh) ;; *) echo "::error::cloud must be aws, gcp, azure or ovh (got '$CLOUD')"; exit 1 ;; esac

    - name: AWS
      if: inputs.cloud == 'aws'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-${{ github.run_id }}

    - name: GCP
      id: gcp
      if: inputs.cloud == 'gcp'
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
        service_account: ${{ inputs.gcp-service-account }}
        token_format: access_token

    - name: Azure
      if: inputs.cloud == 'azure'
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: OVHcloud
      if: inputs.cloud == 'ovh'
      shell: bash
      env:
        ENDPOINT: ${{ inputs.ovh-endpoint }}
        APP_KEY: ${{ inputs.ovh-application-key }}
        APP_SECRET: ${{ inputs.ovh-application-secret }}
        CONSUMER_KEY: ${{ inputs.ovh-consumer-key }}
        SERVICE_NAME: ${{ inputs.ovh-service-name }}
        S3_ACCESS: ${{ inputs.ovh-s3-access-key }}
        S3_SECRET: ${{ inputs.ovh-s3-secret-key }}
      run: |
        set -euo pipefail
        case "$ENDPOINT" in ovh-eu|ovh-ca|ovh-us) ;; *) echo "::error::ovh-endpoint must be ovh-eu, ovh-ca or ovh-us (got '$ENDPOINT')"; exit 1 ;; esac
        if [[ -z "$APP_KEY$APP_SECRET$CONSUMER_KEY$S3_ACCESS$S3_SECRET" ]]; then
          echo "::notice::ovh: registry-only identity (no API or state credentials requested)."
          exit 0
        fi
        # Plan/apply need the whole set; a half-filled secret list is a setup mistake, not a soft failure.
        for pair in "ovh-application-key:$APP_KEY" "ovh-application-secret:$APP_SECRET" "ovh-consumer-key:$CONSUMER_KEY" \
                    "ovh-service-name:$SERVICE_NAME" "ovh-s3-access-key:$S3_ACCESS" "ovh-s3-secret-key:$S3_SECRET"; do
          [[ -n "${pair#*:}" ]] || { echo "::error::ovh: ${pair%%:*} is empty. Set the OVH_PLAN_*/OVH_APPLY_* secrets (docs/engineering/ci-cd.md#ovhcloud)."; exit 1; }
        done
        for v in "$APP_KEY" "$APP_SECRET" "$CONSUMER_KEY" "$S3_ACCESS" "$S3_SECRET"; do echo "::add-mask::$v"; done
        {
          echo "OVH_ENDPOINT=$ENDPOINT"
          echo "OVH_APPLICATION_KEY=$APP_KEY"
          echo "OVH_APPLICATION_SECRET=$APP_SECRET"
          echo "OVH_CONSUMER_KEY=$CONSUMER_KEY"
          echo "OVH_CLOUD_PROJECT_SERVICE=$SERVICE_NAME"
          # OpenTofu's s3 backend (state bucket on OVH Object Storage) and the S3-compatible provider calls.
          echo "AWS_ACCESS_KEY_ID=$S3_ACCESS"
          echo "AWS_SECRET_ACCESS_KEY=$S3_SECRET"
          echo "AWS_EC2_METADATA_DISABLED=true"
        } >> "$GITHUB_ENV"
