# storefront (web): PR -> Cloudflare preview URL; main -> dev; manual dispatch -> uat/prod (prod needs approval).
name: web-storefront

on:
  push:
    branches: [main]
    paths:
      - web/apps/storefront/**
      - web/packages/**
      - web/package.json
      - web/pnpm-lock.yaml
      - web/pnpm-workspace.yaml
      - .github/workflows/web-storefront.yml
      - .github/workflows/_web-app.yml
  pull_request:
    paths:
      - web/apps/storefront/**
      - web/packages/**
      - web/package.json
      - web/pnpm-lock.yaml
      - web/pnpm-workspace.yaml
      - .github/workflows/web-storefront.yml
      - .github/workflows/_web-app.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, uat, prod]
        default: uat
      vercel:
        description: Also deploy to Vercel (fallback)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-storefront-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    uses: ./.github/workflows/_web-app.yml
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      app: storefront
      target: ${{ github.event_name == 'pull_request' && 'preview' || (github.event_name == 'workflow_dispatch' && inputs.environment || 'dev') }}
      vercel: ${{ github.event_name == 'workflow_dispatch' && inputs.vercel || vars.VERCEL_FALLBACK == 'true' }}
    secrets: inherit
