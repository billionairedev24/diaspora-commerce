# afrotransact-core (Release 1, ADR 0011): ONE pipeline for the Java deployable and every Java module in it.
#   verify    : Checkstyle + every module's unit tests + ArchUnit (module boundaries) + Testcontainers ITs + core's context tests
#               (./mvnw verify on the whole reactor) against a Postgres 17 service container, then the contract route diff of
#               every default-enabled module against /v3/api-docs of the built jar (tools/release/route_diff.py)
#   security  : gitleaks, Trivy filesystem scan (HIGH/CRITICAL)
#   helm      : chart lint + template (dev/uat/prod x clouds) + kubeconform, and the cutover and connection-budget render tests
#   image     : ONE image afrotransact-core (java/Dockerfile, PROJECT=apps/core) -> GHCR, Trivy image scan, SBOM, cosign keyless sign
#   deploy-dev: pins the signed digest in values-dev.yaml on release-1 (Argo CD syncs core-dev automatically)
# Triggers only on release-1: the per-service workflows (java-<service>.yml) run on main and develop. Prod is promoted by hand
# (promote.yml, service afrotransact-core). Runbook: docs/runbooks/release-1-deploy.md.
name: core

on:
  push:
    branches: [release-1]
    paths:
      - java/**
      - contracts/openapi/**
      - infra/helm/library/**
      - infra/ops/postgres/**
      - tools/ci/core_ci_db.sh
      - tools/release/route_diff.py
      - tools/release/requirements-ci.txt
      - tools/release/test_cutover_render.sh
      - .github/workflows/core.yml
      - .github/workflows/_deploy.yml
      - .github/actions/publish-image/**
      - .github/actions/helm-check/**
  pull_request:
    branches: [release-1]
    paths:
      - java/**
      - contracts/openapi/**
      - infra/helm/library/**
      - infra/ops/postgres/**
      - tools/ci/core_ci_db.sh
      - tools/release/route_diff.py
      - tools/release/requirements-ci.txt
      - tools/release/test_cutover_render.sh
      - .github/workflows/core.yml
      - .github/workflows/_deploy.yml
      - .github/actions/publish-image/**
      - .github/actions/helm-check/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Postgres every job below talks to (a service container): the same PostGIS 17 image the local stack and every
  # Testcontainers suite use (docker-compose.yml). Passwords are the module names: CI only (tools/ci/core_ci_db.sh).
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - name: No duplicate Flyway versions
        run: tools/dev/check_migrations.sh
      - id: check
        run: |
          if [[ -f java/apps/core/pom.xml ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "::notice::java/apps/core does not exist - nothing to build."; fi

  verify:
    name: verify (checkstyle, unit, ArchUnit, integration, route diff)
    needs: meta
    if: needs.meta.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: imresamu/postgis:17-3.5.4-alpine3.22
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
          --shm-size 256m
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            java/**/pom.xml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/release/requirements-ci.txt
      - name: Release 1 databases (core, go; schema + role per module)
        run: |
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          tools/ci/core_ci_db.sh
      - name: Verify the whole Java reactor (every module, ArchUnit, Checkstyle, core context tests)
        working-directory: java
        env:
          CORE_IT_DB: localhost:5432
        run: ./mvnw -B -ntp verify
      - name: Contract route diff (every default-enabled module against /v3/api-docs of the built jar)
        run: |
          pip install -q -r tools/release/requirements-ci.txt
          jar=""
          for f in java/apps/core/target/afrotransact-core-*.jar; do
            case "$f" in *-plain.jar) ;; *) jar="$f"; break ;; esac
          done
          [[ -n "$jar" ]] || { echo "::error::no executable core jar was built"; exit 1; }
          # One database (core), one schema and role per module: the production layout. Consumers and relays off, no Kafka here.
          export CORE_DB_URL="jdbc:postgresql://localhost:5432/core"
          export CATALOG_DB_USER=catalog CATALOG_DB_PASSWORD=catalog TAX_RETURNS_DB_USER=tax_returns TAX_RETURNS_DB_PASSWORD=tax_returns
          export CONSUMERS_ENABLED=false KAFKA_BOOTSTRAP=localhost:1 SPRING_PROFILES_ACTIVE=local PORT=18080 MANAGEMENT_SERVER_PORT=18081
          export AT_MODULES_CATALOG_EVENTS_RELAY_ENABLED=false AT_MODULES_TAX_RETURNS_EVENTS_RELAY_ENABLED=false
          java -jar "$jar" > core.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do
            curl -fsS localhost:18081/actuator/health/readiness >/dev/null 2>&1 && break
            kill -0 "$pid" 2>/dev/null || { echo "::error::core exited"; tail -50 core.log; exit 1; }
            sleep 2
          done
          curl -fsS localhost:18081/actuator/health/readiness >/dev/null || { echo "::error::core not ready after 180 s"; tail -50 core.log; exit 1; }
          python3 tools/release/route_diff.py --live http://localhost:18080 --modules-from java/apps/core/src/main/resources/application.yml
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-core
          path: |
            java/**/target/surefire-reports/
            java/**/target/failsafe-reports/
            core.log
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: security (gitleaks, trivy fs)
    needs: meta
    if: needs.meta.outputs.exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo/java --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: Trivy filesystem scan (dependencies, IaC, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivy-config: trivy.yaml
          scan-type: fs
          scan-ref: java
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  helm:
    name: helm (lint, template, kubeconform, cutover and budget tests)
    needs: meta
    if: needs.meta.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/helm-check
        with:
          chart: java/apps/core/deploy/helm
      - name: Cutover routing, module switches and connection budget
        run: tools/release/test_cutover_render.sh

  image:
    name: image (build${{ github.event_name == 'push' && github.ref == 'refs/heads/release-1' && ', push, SBOM, sign' || '' }})
    needs: [meta, verify, security, helm]
    if: needs.meta.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      tag: ${{ steps.publish.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - id: publish
        uses: ./.github/actions/publish-image
        with:
          service: afrotransact-core
          context: java
          dockerfile: java/Dockerfile
          build-args: |
            SERVICE=core
            PROJECT=apps/core
            JAR_GLOB=afrotransact-core-*.jar
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release-1' }}
          # A guard rail, not a measurement: the jlinked JRE (~60 MB) + distroless (~25 MB) + the one fat jar (96 MB for two modules,
          # release-1-architecture.md 11.2; each further module adds libraries). TIGHTEN it from the first image policy summary.
          max-size-mb: "420"
          required-env: SPRING_PROFILES_ACTIVE=prod

  deploy-dev:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-1'
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: write
      packages: read
      id-token: write
    with:
      service: afrotransact-core
      environment: dev
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit
