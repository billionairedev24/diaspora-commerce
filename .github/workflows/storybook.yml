# Storybook for @afrotransact/ui (+ app component stories): build, interaction + a11y tests, visual diffs against the
# PNG baselines in web/packages/ui/visual-baselines, and Cloudflare Pages deploys (PR preview URL comment; main ->
# production of the `afrotransact-storybook` project). Hand-written (not generated by tools/ci/gen_workflows.py).
#
#   build              root pnpm install -> `storybook build` (a story that does not compile fails here) -> artifact
#   test               in the pinned Playwright image: the `storybook` Vitest project (@storybook/addon-vitest, headless
#                      Chromium: render + play functions + axe serious/critical gate) with v8 coverage (gated by
#                      tools/quality/coverage_report.sh, uploaded), then Playwright screenshot comparison of every story of
#                      the static build (diffs uploaded)
#   deploy             wrangler pages deploy (preview per PR branch, production on main); same-repo PRs only
#   update-baselines   label a PR `update-visual-baselines` (or dispatch with update_baselines on a branch): regenerate
#                      the baselines in the same image and commit them to the branch
name: storybook

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - web/packages/ui/**
      - web/packages/tokens/**
      - web/packages/i18n/**
      - web/apps/*/src/**/*.stories.tsx
      # App components and styles rendered by web/packages/ui/stories/apps/seller-center.
      - web/apps/seller-center/src/components/ui/**
      - web/apps/seller-center/src/app/globals.css
      - web/apps/seller-center/src/i18n/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/storybook.yml
  push:
    branches: [main]
    paths:
      - web/packages/ui/**
      - web/packages/tokens/**
      - web/packages/i18n/**
      - web/apps/*/src/**/*.stories.tsx
      - web/apps/seller-center/src/components/ui/**
      - web/apps/seller-center/src/app/globals.css
      - web/apps/seller-center/src/i18n/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/storybook.yml
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Regenerate the visual baselines and commit them to this branch (not main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}-${{ github.event.action == 'labeled' && 'baselines' || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  UI_DIR: web/packages/ui
  PAGES_PROJECT: afrotransact-storybook
  # Same image locally: web/packages/ui/scripts/visual-docker.sh (keep the tag = @playwright/test and playwright, the
  # Vitest browser provider's, in the ui package).
  BASELINE_LABEL: update-visual-baselines

jobs:
  build:
    if: github.event.action != 'labeled' && !inputs.update_baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (root pnpm workspace)
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm --filter @afrotransact/ui build-storybook
      - name: Index sanity check
        run: |
          n="$(jq '[.entries[] | select(.type == "story")] | length' "$UI_DIR/storybook-static/index.json")"
          echo "Storybook: $n stories" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$n" -gt 0 ]] || { echo "::error::index.json has no stories"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: ${{ env.UI_DIR }}/storybook-static
          retention-days: 7

  test:
    name: interaction, a11y and visual tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned to the @playwright/test and playwright (Vitest browser provider) version, 1.56.1 = Chromium 1194; from MCR,
    # not Docker Hub. The baselines are rendered in this image, so fonts and rasterisation match exactly.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (root pnpm workspace)
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: storybook-static
          path: ${{ env.UI_DIR }}/storybook-static
      - name: Stories (Vitest browser mode; render, play functions, axe serious/critical; coverage)
        id: stories
        run: pnpm --filter @afrotransact/ui test:storybook
      - name: Coverage gate (tools/quality/coverage-thresholds.conf ui-storybook.web)
        if: ${{ !cancelled() && steps.stories.outcome == 'success' }}
        run: tools/quality/coverage_report.sh --service ui-storybook
      - name: Upload coverage
        if: ${{ !cancelled() && steps.stories.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-coverage
          path: ${{ env.UI_DIR }}/coverage/storybook
          if-no-files-found: warn
          retention-days: 14
      - name: Visual diffs (Playwright screenshots vs visual-baselines)
        id: visual
        if: ${{ !cancelled() }}
        run: pnpm --filter @afrotransact/ui visual
      - name: Upload visual diffs
        if: ${{ failure() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            ${{ env.UI_DIR }}/visual/test-results
            ${{ env.UI_DIR }}/visual/report
          retention-days: 14
      - name: How to accept the changes
        if: ${{ failure() && steps.visual.outcome == 'failure' }}
        run: |
          {
            echo "### Visual diffs"
            echo "Download the \`visual-diffs\` artifact (\`*-expected.png\` / \`*-actual.png\` / \`*-diff.png\`)."
            echo "If the change is intended, add the \`${BASELINE_LABEL}\` label to the PR (CI regenerates and commits the"
            echo "baselines), or run \`pnpm --filter @afrotransact/ui visual:update:docker\` locally and commit them."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Cloudflare Pages
    needs: [build, test]
    # PR previews also when tests fail (reviewers look at the change); production only when everything passed.
    # Fork PRs get no secrets, so they skip.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name == 'pull_request' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      # Until the Cloudflare secrets are configured the deploy is skipped with a notice instead of failing.
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Cloudflare not configured
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; Storybook is not deployed."
      - uses: actions/download-artifact@v5
        if: env.HAS_CF == 'true'
        with:
          name: storybook-static
          path: storybook-static
      - name: Branch
        id: branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(tr -c 'A-Za-z0-9-' '-' <<<"$BRANCH" | sed -E 's/-+$//')" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        id: pages
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy storybook-static --project-name=${{ env.PAGES_PROJECT }} --branch=${{ steps.branch.outputs.name }}
      - name: Preview URL
        if: github.event_name == 'pull_request' && steps.pages.outputs.deployment-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
          RESULT: ${{ needs.test.result }}
        run: |
          marker='<!-- storybook-preview -->'
          body="$(printf '%s\nStorybook preview: %s (tests: %s)' "$marker" "$URL" "$RESULT")"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
      - name: Summary
        if: steps.pages.outputs.deployment-url != ''
        env:
          URL: ${{ steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
        run: |
          echo "Storybook: $URL" >> "$GITHUB_STEP_SUMMARY"

  update-baselines:
    name: regenerate visual baselines
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'labeled'
        && github.event.label.name == 'update-visual-baselines'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.update_baselines && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (root pnpm workspace)
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm --filter @afrotransact/ui build-storybook
      - name: Regenerate baselines
        run: |
          rm -rf "$UI_DIR/visual-baselines"
          pnpm --filter @afrotransact/ui visual:update
      - name: Commit
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -A "$UI_DIR/visual-baselines"
          if git diff --cached --quiet; then
            echo "Baselines unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat | tee -a "$GITHUB_STEP_SUMMARY"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(ui): update Storybook visual baselines"
          git push origin "HEAD:$BRANCH"
          echo "Pushed with GITHUB_TOKEN, which does not start new runs: push again (or close/reopen the PR) to re-run CI." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$BASELINE_LABEL" || true
