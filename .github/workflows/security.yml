# Repo-wide security scanning (S201). Per-service pipelines already gate each PR with gitleaks, Trivy fs,
# Semgrep, govulncheck (Go), osv-scanner (web), Trivy image (CRITICAL fails) and SBOMs; this workflow adds the
# whole-repo, scheduled view (docs/engineering/security-scanning.md section 3):
#   CodeQL (java-kotlin, go, javascript-typescript, actions) -> code scanning alerts
#   Trivy repo scan (vulns, secrets, IaC misconfig) -> SARIF; CRITICAL and HIGH vulns, CRITICAL secrets fail;
#     Trivy IaC (infra/) CRITICAL/HIGH fail
#   Semgrep (our rules + registry packs) over the whole tree -> SARIF; ERROR fails
#   govulncheck over every Go module (reachable vulnerabilities fail)
#   osv-scanner over every lockfile -> SARIF; HIGH and above (CVSS >= 7) or unscored fail (tools/security/osv-gate.sh)
#   gitleaks over the full git history
#   OWASP Dependency-Check for the Maven reactor (weekly / manual; NVD_API_KEY is mandatory, a missing key fails the job)
#   supply-chain checks: Go toolchain pins agree, third-party actions SHA-pinned, security ignores not expired
#   OWASP ZAP baseline against the dev environment (scheduled / manual)
name: security

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - go/go.work
      - go/**/go.mod
      - go/services/*/Dockerfile
      - tools/ci/check_*_pins.py
      - Makefile
      - CLAUDE.md
      - trivy.yaml
      - .gitleaks.toml
      - tools/security/**
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
    - cron: "43 4 * * *" # daily: expiring ignores and fresh advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply-chain checks (pins, ignores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Go toolchain pins agree everywhere
        run: python3 tools/ci/check_go_pins.py
      - name: Third-party actions are pinned to a commit SHA
        run: python3 tools/ci/check_action_pins.py
      - name: Accepted-risk ignores have reason, owner and a future expiry
        run: python3 tools/security/check_ignores.py

  codeql:
    name: CodeQL ${{ matrix.language }}
    if: github.event.schedule != '43 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: "1.27.4"
          cache-dependency-path: go/**/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Go modules
        if: matrix.language == 'go'
        working-directory: go
        run: |
          for mod in $(go list -m -f '{{.Dir}}'); do
            (cd "$mod" && go build ./...)
          done
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  trivy:
    name: Trivy (repo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivy-config: trivy.yaml
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          skip-dirs: design
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Fail on fixable CRITICAL and HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivy-config: trivy.yaml
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: design
          skip-setup-trivy: true

  trivy-iac:
    name: Trivy IaC (infra, CRITICAL/HIGH fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Build Helm chart dependencies (charts are rendered with the prod platform values)
        run: |
          for chart in java/services/*/deploy/helm go/services/*/deploy/helm; do
            [[ -f "$chart/Chart.yaml" ]] && helm dependency build "$chart" >/dev/null
          done
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          trivy-config: trivy.yaml
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: "1"

  semgrep:
    name: Semgrep (repo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --quiet semgrep==1.180.0
      - name: Rule self-test (tools/security/semgrep-tests)
        run: tools/security/run_semgrep.sh --self-test
      - name: Semgrep (our rules; ERROR fails)
        run: tools/security/run_semgrep.sh
      - name: Semgrep + p/java p/golang p/typescript p/react p/secrets (SARIF; report only until triaged)
        continue-on-error: true
        run: tools/security/run_semgrep.sh --registry --sarif semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  govulncheck:
    name: govulncheck (every Go module)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: go/**/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: tools/security/govulncheck.sh

  osv-scanner:
    name: osv-scanner (every lockfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: osv-scanner (SARIF + gate: CVSS >= 7 or unscored fails; checksum-verified binary)
        # --no-resolve: the reactor poms depend on each other (0.1.0-SNAPSHOT), which the online resolver cannot fetch (exit 127).
        # Transitive Java dependencies are judged by Trivy and OWASP Dependency-Check (real Maven resolution).
        run: tools/security/osv-gate.sh --no-resolve -r .
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('osv.sarif') != ''
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  dependency-check:
    name: OWASP Dependency-Check (Maven, weekly)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: NVD API key is mandatory
        run: |
          if [[ -z "$NVD_API_KEY" ]]; then
            echo "::error title=NVD_API_KEY missing::OWASP Dependency-Check cannot run without the NVD_API_KEY secret. Create a key at https://nvd.nist.gov/developers/request-an-api-key and add it as the repository secret NVD_API_KEY. This job fails until it exists: the zero-known-vulnerabilities rule needs the Java scan."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Dependency-Check (CVSS >= 7 fails)
        working-directory: java
        run: |
          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.1.0:aggregate -DnvdApiKey="$NVD_API_KEY" \
            -DfailBuildOnCVSS=7 -Dformats=SARIF,HTML \
            -DsuppressionFile=../tools/security/dependency-check-suppressions.xml
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('java/target/dependency-check-report.sarif') != ''
        with:
          sarif_file: java/target/dependency-check-report.sarif
          category: dependency-check

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  zap:
    name: OWASP ZAP baseline (dev)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        target: [storefront, api]
    steps:
      - name: Target URL
        id: url
        env:
          BASE: ${{ vars.DEV_BASE_DOMAIN || 'dev.afrotransact.com' }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == storefront ]]; then echo "url=https://${BASE}" >> "$GITHUB_OUTPUT"
          else echo "url=https://${TARGET}.${BASE}/healthz" >> "$GITHUB_OUTPUT"; fi
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.url.outputs.url }}
          allow_issue_writing: true
          issue_title: ZAP baseline (${{ matrix.target }}, dev)
          fail_action: false
          artifact_name: zap-${{ matrix.target }}
