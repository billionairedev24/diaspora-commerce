# Reusable pipeline for ONE web app (web/apps/<app>): lint, typecheck, test, Next.js build, OpenNext
# (Cloudflare adapter) build, security (gitleaks, Semgrep, osv-scanner on pnpm-lock.yaml; a finding blocks the
# deploy), then deploy to Cloudflare Workers:
#   target=preview -> `wrangler versions upload --preview-alias pr-<n>` (preview URL commented on the PR)
#   target=dev|uat|prod -> `wrangler deploy --name <app>-<env>` (Workers routes from infra/cloudflare)
# Vercel fallback (input `vercel`): the same app deployed with the Vercel CLI (prebuilt output).
name: _web-app

on:
  workflow_call:
    inputs:
      app:
        description: storefront | seller-center | staff-console
        type: string
        required: true
      target:
        description: "'' (build only) | preview | dev | uat | prod"
        type: string
        default: ""
      vercel:
        description: Also deploy to Vercel (fallback host).
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false

permissions:
  contents: read

env:
  APP: ${{ inputs.app }}
  APP_DIR: web/apps/${{ inputs.app }}
  NODE_VERSION: "22"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [[ -f "$APP_DIR/package.json" ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "::notice::$APP_DIR does not exist yet."; fi

  build:
    name: lint, typecheck, test, build
    needs: meta
    if: needs.meta.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter "./apps/${APP}..." --if-present run lint
      - name: Typecheck
        run: pnpm --filter "./apps/${APP}..." --if-present run typecheck
      - name: Test
        run: pnpm --filter "./apps/${APP}..." --if-present run test
      - name: Next.js build
        run: pnpm --filter "./apps/${APP}" run build
      - name: OpenNext build (Cloudflare Workers)
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec opennextjs-cloudflare build
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ inputs.app }}
          path: |
            ${{ env.APP_DIR }}/.open-next
            ${{ env.APP_DIR }}/wrangler.*
          include-hidden-files: true
          retention-days: 7

  security:
    name: security (gitleaks, semgrep, osv-scanner)
    needs: meta
    if: needs.meta.outputs.exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      OSV_SCANNER_VERSION: v2.6.0
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo/web --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Semgrep (tools/security/semgrep.yml; ERROR fails)
        run: |
          pip install --quiet semgrep==1.180.0
          tools/security/run_semgrep.sh -- "$APP_DIR" web/packages
      - name: Semgrep registry packs (report only until the first full scan is triaged)
        continue-on-error: true
        run: tools/security/run_semgrep.sh --registry --sarif semgrep.sarif -- "$APP_DIR" web/packages
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-web-${{ inputs.app }}
      - name: osv-scanner (pnpm-lock.yaml; CRITICAL = CVSS >= 9 fails)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # osv-scanner exits 1 on any finding, so the gate is on the highest severity per advisory group.
          "$RUNNER_TEMP/osv-scanner" scan source --config tools/security/osv-scanner.toml --lockfile pnpm-lock.yaml \
            --format json --output osv.json || true
          jq -r '.results[]?.packages[]? as $p | $p.groups[]? | "\(.max_severity // "?")\t\($p.package.name)@\($p.package.version)\t\(.ids | join(","))"' \
            osv.json | sort -rn | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '[.results[]?.packages[]?.groups[]? | select((.max_severity // "0" | tonumber? // 0) >= 9)] | length == 0' osv.json

  cloudflare:
    name: Cloudflare Workers (${{ inputs.target }})
    needs: [meta, build, security]
    if: needs.meta.outputs.exists == 'true' && inputs.target != ''
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target == 'preview' && 'dev' || inputs.target }}
      url: ${{ steps.url.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      # Until the Cloudflare secrets are configured the app is built and tested but not deployed.
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Cloudflare not configured
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set for this environment; not deployed."
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-${{ inputs.app }}
          path: ${{ env.APP_DIR }}
      - name: Wrangler command
        id: cmd
        env:
          TARGET: ${{ inputs.target }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Apps with per-environment sections in wrangler.jsonc (top level = dev) select them with --env so
          # each environment gets its own vars and routes; apps without one fall back to the Worker name.
          if [[ -f "$APP_DIR/wrangler.jsonc" ]] && grep -q '"env"' "$APP_DIR/wrangler.jsonc"; then
            case "$TARGET" in
              preview) echo "command=versions upload --env preview --preview-alias pr-${PR}" >> "$GITHUB_OUTPUT" ;;
              dev)     echo "command=deploy" >> "$GITHUB_OUTPUT" ;;
              *)       echo "command=deploy --env ${TARGET}" >> "$GITHUB_OUTPUT" ;;
            esac
          elif [[ "$TARGET" == "preview" ]]; then
            echo "command=versions upload --name ${APP}-dev --preview-alias pr-${PR}" >> "$GITHUB_OUTPUT"
          else
            echo "command=deploy --name ${APP}-${TARGET}" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.APP_DIR }}
          command: ${{ steps.cmd.outputs.command }}
      - name: URL
        id: url
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' <<<"$OUTPUT" | tail -1 || true)"
          echo "url=${DEPLOYMENT_URL:-$url}" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: inputs.target == 'preview' && steps.url.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.url.outputs.url }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview for **${APP}**: ${URL}" --edit-last --create-if-none

  vercel:
    name: Vercel fallback (${{ inputs.target }})
    needs: [meta, build, security]
    if: needs.meta.outputs.exists == 'true' && inputs.vercel && inputs.target != ''
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target == 'preview' && 'dev' || inputs.target }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ inputs.target == 'prod' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and deploy (prebuilt)
        working-directory: ${{ env.APP_DIR }}
        run: |
          prod=()
          [[ "$VERCEL_ENV" == production ]] && prod=(--prod)
          npx --yes vercel@latest pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build "${prod[@]}" --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt "${prod[@]}" --token="$VERCEL_TOKEN" | tee -a "$GITHUB_STEP_SUMMARY"
