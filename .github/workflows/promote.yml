        type: choice
        options: [identity, catalog, offers, inventory, orders, payments, seller, retail, fulfilment, bookings, trust-ops, tax-returns, content, ai-gateway, mcp-server, gateway-bff, search, indexer, cart, promise, geo, storefront, media, notifications, carrier-gateway, authz-sync, delivery-runs]
