# GENERATED by tools/ci/gen_workflows.py - edit the generator, not this file.
# Promote an already-built, signed image of ONE service to uat or prod (prod waits for the
# `production` reviewers configured on the GitHub environment `prod`). Only launch-set services can be promoted
# (infra/argocd/launch-set). uat: empty tag = what dev runs now. prod: the tag is REQUIRED (the full sha of a build that
# passed CI on release-1 for afrotransact-core / afrotransact-go, on main for a per-service image): the single production has no uat to
# copy from (ADR 0004, ADR 0008). release-1 is the production line (ADR 0011): run it from release-1 ("Use workflow from"), the pins are
# committed to release-1 (_deploy.yml), which is what the Argo CD root apps track. Each environment has its OWN pin file
# (values-uat.yaml, values-prod.yaml in the service's chart): promoting to uat never edits the prod pin.
name: promote
# MANUAL ONLY: automatic triggers are off (tools/ci/manual_only.py enable restores them).
on:
  workflow_dispatch:
    inputs:
      service:
        description: Service
        type: choice
        options: [afrotransact-core, afrotransact-go, identity, catalog, offers, inventory, orders, payments, seller, retail, fulfilment, bookings, trust-ops, tax-returns, content, ai-gateway, mcp-server, delivery-runs, gateway-bff, search, indexer, cart, promise, geo, media, notifications, carrier-gateway, authz-sync]
      environment:
        description: Target environment
        type: choice
        options: [uat, prod]
        default: prod
      tag:
        description: Image tag (full git sha). Required for prod. Empty (uat only) = the tag in values-dev.yaml.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        env:
          SERVICE: ${{ inputs.service }}
          TARGET: ${{ inputs.environment }}
          TAG: ${{ inputs.tag }}
        run: |
          # Production line: the pins land on release-1 and the Argo CD apps track it, so promote runs there (the workflow file, the
          # charts and the launch set it reads are release-1's).
          [[ "$GITHUB_REF" == refs/heads/release-1 ]] || { echo "::error::run promote from release-1 (Use workflow from: release-1); got $GITHUB_REF"; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/release-1:refs/remotes/origin/release-1
          case "$SERVICE" in
            afrotransact-core) dir="java/apps/core" ;;      # Release 1 deployables: always deployed (infra/argocd/applicationsets/deployables.yaml)
            afrotransact-go) dir="go/apps/afrotransact-go" ;;
            *)
              dir=$([[ -d "java/services/$SERVICE" ]] && echo "java/services/$SERVICE" || echo "go/services/$SERVICE")
              # uat and prod run the launch set only; a service outside it has no Application there.
              if ! grep -qx " *- path: $dir/deploy/helm" infra/argocd/launch-set/kustomization.yaml; then
                echo "::error::$SERVICE is not in the launch set (infra/argocd/launch-set): nothing deploys it to $TARGET"; exit 1
              fi ;;
          esac
          if [[ -z "$TAG" ]]; then
            [[ "$TARGET" == uat ]] || { echo "::error::$TARGET needs an explicit tag (full git sha of a green build: release-1 for the deployables, main for a per-service image)"; exit 1; }
            TAG="$(yq '.image.tag // ""' "$dir/deploy/helm/values-dev.yaml")"
          fi
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no deployable tag for $SERVICE ($TAG)"; exit 1; }
          # The image must come from the line that builds it: a deployable from release-1, a per-service image from main (or release-1).
          git cat-file -e "$TAG^{commit}" 2>/dev/null || { echo "::error::commit $TAG is not in the repository"; exit 1; }
          case "$SERVICE" in
            afrotransact-core|afrotransact-go)
              git merge-base --is-ancestor "$TAG" origin/release-1 || { echo "::error::$TAG is not on release-1: $SERVICE images are built by release-1 only"; exit 1; } ;;
            *)
              git merge-base --is-ancestor "$TAG" origin/main || git merge-base --is-ancestor "$TAG" origin/release-1                 || { echo "::error::$TAG is on neither main nor release-1"; exit 1; } ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: write
      packages: read
      id-token: write
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit
