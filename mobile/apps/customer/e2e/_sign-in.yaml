# Fresh install, mock sign-in, passcode, notifications off. Used by every flow.
appId: com.afrotransact.customer.local
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    text: "Sign in"
    index: 1
- tapOn:
    text: "Use passcode only"
    optional: true
- assertVisible: "Create a 6-digit passcode"
- repeat:
    times: 2
    commands:
      - tapOn: "1"
      - tapOn: "3"
      - tapOn: "5"
      - tapOn: "7"
      - tapOn: "9"
      - tapOn: "0"
- tapOn: "Not now"
- assertVisible: "Home"
