- inputText: "Adaeze Okafor"
- tapOn: "Phone"
- inputText: "7135550142"
- tapOn: "Street address"
- inputText: "0 Nowhere Rd"
- tapOn: "City"
- inputText: "Houston"
- tapOn: "ZIP code"
- inputText: "77002"
- tapOn: "State.*"
- tapOn: "Texas.*"
- tapOn: "Add address"
- assertVisible: "We couldn’t verify this address."
- tapOn: "Keep mine"
- assertVisible: "Addresses"
- assertVisible: ".*Nowhere Rd.*"
