# ---------------------------------------------------------------------------------------------------------------------------------
# Configuration parity (tools/release/chart_env_sync.py and parity.py `config`, `secrets`).
config:
  # Names never copied from a service chart's extraEnv into the deployable chart. Glob patterns allowed. Name: reason.
  env_skip:
    DB_URL: "core derives it: CORE_DB_URL (one database) and <MODULE>_DB_USER / <MODULE>_DB_PASSWORD per module (infra/ovh-vps/secrets.sh)"
    DB_USER: "per-module <MODULE>_DB_USER in afrotransact-core-secrets"
    DB_PASSWORD: "per-module <MODULE>_DB_PASSWORD in afrotransact-core-secrets"
    DB_NAME: "not used by a module in core"
    SPRING_DATASOURCE_*: "the pool is modules.<m>.pool (<M>_DB_POOL_SIZE), bounded by dbBudget"
    JAVA_TOOL_OPTIONS: "core sets heap, GC and metaspace for the shared JVM (values.yaml)"
    SPRING_PROFILES_ACTIVE: "process-wide: orders' `uat,temporal-cloud` cannot switch the whole JVM. OPEN ITEM for the orders batch: check that application-temporal-cloud.yml settings reach core in uat (its TEMPORAL_* values are copied)"
    AT_SECURITY_ENABLED: "process-wide switch of the shared security chain, owned by CoreSecurityConfiguration"
    MANAGEMENT_*: "core has one management port"
    PORT: "core has one port"
  # Secret names a module expects (service chart comment `# - NAME`) that are not rendered by secrets.sh for a deployable on purpose.
  secret_skip:
    DB_URL: "renamed per module in the deployable secrets (CORE_DB_URL, <MODULE>_DB_URL)"
    DB_USER: "renamed per module in the deployable secrets"
    DB_PASSWORD: "renamed per module in the deployable secrets"
    DB_NAME: "not a secret key in the deployable secrets"

# ---------------------------------------------------------------------------------------------------------------------------------
# Kafka: consumer groups of a module are `<module>-service[-suffix]` in core exactly as standalone (KafkaGroupIdsTest in core runs
# the same rule at runtime). Topic names are declared in contracts/asyncapi/events.yaml.
kafka:
  group_pattern: '^[a-z]+(-[a-z]+)*-service(-[a-z-]+)?$'

# ---------------------------------------------------------------------------------------------------------------------------------
# Observability: `service=` values rules, alerts, dashboards and scrape configs may select on. Modules and deployables are always known.
observability:
  extra_service_values:
    - alloy

# ---------------------------------------------------------------------------------------------------------------------------------
# Capacity of the ONE b3-16 node (docs/engineering/cloud-cost.md, "Release 1"): tools/release/check_capacity.py. Figures are the repo's own,
# UNVERIFIED on the node until `kubectl top` runs in the trial.
capacity:
  allocatable_mib: 13312           # ~13 GiB of the 16 GB node
  fixed_mib:                       # what runs next to the deployables (cloud-cost.md table), requests
    platform: 2264                 # Kafka 640, Temporal 512, Valkey 128, Meilisearch 384, OTLP 128, Alloy 96, kube-state 32, kafka-exporter 24, cloudflared 64, Envoy 128 + 128
    kubernetes_system: 1229
    argocd: 1024
    clamav: 1280                   # media's malware scan (UNMEASURED); counted, the conservative case
  core_request_mib_by_batch:       # docs/runbooks/release-1-deploy.md section 6: core's request grows with the batches
    0: 0
    1: 768
    2: 1024
    3: 1280
    4: 1536
    5: 1536
