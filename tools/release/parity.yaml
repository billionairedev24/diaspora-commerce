# release-1 parity configuration (ADR 0011, docs/engineering/release-1-parity.md). Read by tools/release/parity.py and
# tools/release/chart_env_sync.py. This file is the ALLOW-LIST: anything main or develop adds that is not mounted in a deployable
# (afrotransact-core, afrotransact-go) must be listed here WITH A REASON, or the release-1 parity check fails.
version: 1

# ---------------------------------------------------------------------------------------------------------------------------------
# Services that exist under java/services or go/services but are deliberately NOT mounted in a deployable. Name: reason.
# Empty today: all 16 Java services are @ModuleSpec entries of CoreApplication (retail and delivery-runs are mounted and switched off by
# default), all 10 Go services are in go/apps/afrotransact-go/internal/registry.
unmounted:
  java: {}
  go: {}

# ---------------------------------------------------------------------------------------------------------------------------------
# What may stay per-service on release-1 (the per-service build is kept until the ADR 0011 cutover phase).
per_service_only:
  # path globs (repository relative) whose NEW files are not a parity gap, with the reason
  paths:
    "java/services/*/Dockerfile": "per-service image, built on main/develop; release-1 builds java/Dockerfile with PROJECT=apps/core"
    "java/services/*/deploy/**": "per-service chart and Argo CD Application; scaled to 0 by cutover.services once the module moves"
    "go/services/*/Dockerfile": "per-service image, built on main/develop; release-1 builds go/Dockerfile.afrotransact-go"
    "go/services/*/deploy/**": "per-service chart and Argo CD Application; scaled to 0 by cutover.services once the module moves"
    "infra/argocd/applicationsets/services.yaml": "per-service ApplicationSet, kept for the services that have not moved (cutover.movedTo scales the rest)"
    "infra/argocd/launch-set/kustomization.yaml": "per-service launch set; release-1.yaml adds the deployables"

# Every workflow file must be classified. line:
#   release-1         runs on release-1 pushes and/or pull requests (a release-1 push trigger, or pull_request without a branch filter)
#   per-service-only  triggers only on main/develop (and manual): the per-service build, kept until the cutover phase
#   manual            workflow_dispatch / workflow_call / schedule only: no push or pull_request trigger
#   reusable          workflow_call only (called by another workflow)
# tools/release/parity.py verifies each class against the workflow's real triggers and fails on a mismatch or an unclassified workflow.
workflows:
  _deploy.yml:               {line: reusable, reason: "deploy of one signed image: pins the digest on release-1 (uat, trial, prod and the deployables)"}
  _go-service.yml:           {line: reusable, reason: "per-service Go pipeline, called by go-<service>.yml on main/develop"}
  _java-service.yml:         {line: reusable, reason: "per-service Java pipeline, called by java-<service>.yml on main/develop"}
  _web-app.yml:              {line: reusable, reason: "web build and Cloudflare deploy; prod only from a commit release-1 contains"}
  afrotransact-go.yml:       {line: release-1, reason: "build, test, sign and push the Go deployable"}
  core.yml:                  {line: release-1, reason: "build, test, sign and push the Java deployable"}
  backlog.yml:               {line: release-1, reason: "backlog.csv stays importable"}
  carrier-sandboxes.yml:     {line: manual, reason: "carrier sandbox run against carrier-gateway, on demand"}
  contracts.yml:             {line: release-1, reason: "OpenAPI/AsyncAPI lint and breaking-change diff"}
  deploy-guide.yml:          {line: release-1, reason: "deploy guide script tests"}
