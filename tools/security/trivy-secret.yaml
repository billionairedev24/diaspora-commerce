# Trivy secret-scanner config (referenced from /trivy.yaml). Built-in rules stay enabled; these allow-rules mirror
# the gitleaks allowlists in /.gitleaks.toml for documented local-only defaults and test fixtures.
allow-rules:
  - id: local-only-client-secrets
    description: OAuth client secrets of the local docker-compose stack (local-<service>-secret)
    regex: local-[a-z0-9-]+-secret
  - id: test-fixture-keys
    description: Placeholder keys in unit/integration tests and test kits
    regex: (sk_test_[a-z_]+|0123456789abcdef|integration-test-[a-z-]+)
  - id: fake-cluster-secret-store
    description: Fake ClusterSecretStore used by kind/CI clusters without a cloud secret manager
    path: infra/k8s/platform/secret-stores/none/.*
  - id: test-sources
    description: Test sources and fixtures
    path: (.*_test\.go|.*/src/test/.*|.*/testkit/.*|tools/security/semgrep-tests/.*)
