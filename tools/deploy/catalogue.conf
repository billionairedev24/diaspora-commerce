# Every secret and variable of the GitHub Environment `ovh-vps` that the workflows read (ovh-vps.yml, ovh-web.yml; ovh-images.yml
# reads none: it only uses the run's own GITHUB_TOKEN) and that tools/ovh/render-config.sh writes for the server. ONE list, read by
# tools/deploy/guide.sh (the wizard) and tools/ovh/gh-setup.sh. tools/deploy/test/test-guide.sh fails when a workflow reads a name
# that is missing here. infra/cloudflare (OpenTofu, real environments only) reads CLOUDFLARE_API_TOKEN (same name, broader rights)
# and account_id / zone_name (= CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_ZONE); nothing else is needed for the test environment.
#
# Fields, separated by | (so no | inside a field; ~ inside the last field is a line break):
#   name | kind (secret or var) | need | default | phase | gate | validator | live check | what it is | why / if skipped | how to get it
# need:      required  (the wizard refuses to start the gated step while it is missing)
#            optional  (skipping is allowed; the "why" field says what stops working)
#            generated (the wizard can make it for you; shown once)
#            external  (required only when DB_MODE=external)
#            managed   (made by the wizard through an API or a tool, not typed: OVH API values, state keys, SSH key pair)
# phase:     the wizard phase that collects it (2 values, 3 database, 4 flavor, 8 after the first deploy)
# gate:      server (needed before the server is created), web (needed before the web apps are deployed), none
# validator: hex32 bucket domain email phone sk_test pk_test whsec resend cfid cftoken ghpat ovhkey location flavor host user
#            nonempty minlen12 or choice:a,b,c      live check: cf_token cf_account cf_zone stripe gh_pull ovh ovh_project or -
OVH_LOCATION|var|managed|us-east-va|2|server|location|-|Where the server runs: us-east-va (Virginia), us-west-or (Oregon) or ca-bhs (Quebec).|Decides which OVHcloud company you need an account with (US and Canada are separate), the API address and the price list. OVH does not meter outbound traffic in its US regions.|Pick the one closest to your database and users. us-east-va is the default and sits next to Layerbase in Virginia.
OVH_APPLICATION_KEY|secret|managed||2|server|ovhkey|ovh|OVHcloud API application key (1 of 3 values of one API token).|The pipeline creates and deletes the server and the state bucket through the OVHcloud API with it.|1. Open the token address shown below, signed in to the OVHcloud account of your location.~2. The rights are pre-filled: keep them. Set validity to 30 days, no IP restriction.~3. Click Create keys.~4. The page shows Application key, Application secret and Consumer key: copy each into the next three prompts.
OVH_APPLICATION_SECRET|secret|managed||2|server|ovhkey|-|OVHcloud API application secret (2 of 3).|Same token as above.|Shown on the same page as the application key, right after Create keys.
OVH_CONSUMER_KEY|secret|managed||2|server|ovhkey|-|OVHcloud API consumer key (3 of 3).|Same token as above.|Shown on the same page as the application key, right after Create keys.
OVH_SERVICE_NAME|var|required||2|server|hex32|ovh_project|Public Cloud project id: 32 hexadecimal characters.|Every server, bucket and user is created inside this project. Creating a project is free; only instances bill.|1. OVHcloud Control Panel > Public Cloud > Create a project (free) if you have none.~2. Open the project.~3. The project id is shown at the top left of the project page and in the URL after /project/.~Example: 0123456789abcdef0123456789abcdef
TF_STATE_BUCKET|var|required|afrotransact-tfstate|2|server|bucket|-|Name of the Object Storage bucket that keeps the Terraform state.|Without a shared state a laptop and the pipeline would each think the server does not exist. The pipeline creates the bucket; you only choose a name. Bucket names are unique inside your OVH account.|Lower-case letters, digits and hyphens, 3 to 63 characters. Keep the default unless it is taken.
TF_STATE_ACCESS_KEY|secret|managed||2|server|-|-|S3 access key of the Public Cloud user terraform-state.|Lets the pipeline read and write the state bucket.|Made for you through the OVHcloud API (found again on later runs); you never type it.
TF_STATE_SECRET_KEY|secret|managed||2|server|-|-|S3 secret key of the same user.|As above.|Made for you through the OVHcloud API.
OVH_DOMAIN|var|required||2|server|domain|-|The base domain of the test environment, for example example.com.|The backend is api. auth. mcp. grafana. of it and the web apps are www. seller. admin. of it. Use the registered domain itself, or a name under it with the flat web hosts (OVH_SELLER_HOST, OVH_ADMIN_HOST, OVH_STOREFRONT_HOST=apex): Cloudflare's free certificate covers only one label under the zone.|The domain you own and that is (or will be) a zone on Cloudflare. Lower-case, no https://, no trailing dot.~Example: example.com
OVH_STOREFRONT_HOST|var|optional|www|2|server|choice:www,apex|-|Where the storefront lives: www = https://www.<domain> (the bare domain redirects to it) or apex = https://<domain>.|The backend derives sign-in redirect URIs and CORS from it. The ovh-web run must use the same value or sign-in fails with a redirect_uri mismatch.|Keep www unless you have a reason.
ACME_EMAIL|var|required||2|server|email|-|Email address Let's Encrypt writes to about certificate expiry.|Certificates are issued automatically; the notices are the warning if renewal ever fails.|Any mailbox you read.
ADMIN_EMAIL|var|required||2|server|email|-|Email of the first staff admin (identity bootstrap admin).|It is the account you sign in with at admin.<domain> after the deploy.|Your own email address.
ADMIN_PHONE|var|required|+15555550100|2|server|phone|-|Phone number of the first staff admin, international format.|Identity requires one for the bootstrap admin; the default is a placeholder that works for a test.|Format: + country code and number, digits only. Example: +15555550100
ADMIN_PASSWORD|secret|generated||2|server|minlen12|-|Password of the first staff admin.|You sign in with it. If you let the wizard generate it, it is shown once and stored only in GitHub.|Type your own (at least 12 characters, hidden) or press Enter to have one generated.
BACKUP_PASSPHRASE|secret|generated||2|server|minlen12|-|Passphrase that encrypts the nightly backups.|Without it a backup cannot be read. Keep a copy outside the server and outside GitHub.|Type your own (at least 12 characters, hidden) or press Enter to have one generated.
OVH_VPS_SSH_PRIVATE_KEY|secret|managed||2|server|-|-|Private half of the SSH key pair the pipeline uses to log in to the server.|The pipeline installs software over SSH.|Generated for you into .ovh/ovh-vps-deploy-key (git-ignored). It is also how you log in yourself.
OVH_SSH_PUBLIC_KEY|var|managed||2|server|-|-|Public half of that key pair, installed on the server at creation.|As above.|Generated with the private half.
REGISTRY_PULL_USERNAME|var|optional||2|none|user|-|GitHub login that owns the pull token below.|Empty means the person who runs the workflow.|Your GitHub login.
REGISTRY_PULL_TOKEN|secret|optional||2|none|ghpat|gh_pull|Classic GitHub token with only the read:packages permission.|The server pulls the 26 images from ghcr.io with it. Skipped: it pulls with the run's own token, which stops working after the run, so any pod that restarts later ends in ImagePullBackOff.|1. github.com > Settings > Developer settings > Personal access tokens > Tokens (classic) > Generate new token (classic).~2. Tick ONLY read:packages. Expiry 30 to 90 days.~3. Copy the token (starts with ghp_), it is shown once.
CLOUDFLARE_API_TOKEN|secret|required||2|web|cftoken|cf_token|Cloudflare API token that can edit DNS and deploy Workers on your zone.|The ovh-vps run makes the api./auth./mcp./grafana. records with it and the ovh-web run deploys the three web apps. Without it you create the records by hand and cannot deploy the web apps from the pipeline.|1. dash.cloudflare.com > My Profile > API Tokens > Create Token > Create Custom Token.~2. Permissions, add five rows: Account / Workers Scripts / Edit; Account / Account Settings / Read; Zone / Workers Routes / Edit; Zone / DNS / Edit; Zone / Zone / Read.~3. Account Resources: Include your account. Zone Resources: Include, Specific zone, your domain.~4. Continue, Create Token, copy it (shown once).
CLOUDFLARE_ACCOUNT_ID|secret|required||2|web|hex32|cf_account|Cloudflare account id: 32 hexadecimal characters.|wrangler needs it to deploy the Workers.|dash.cloudflare.com > Workers & Pages > the right-hand column shows Account ID. (If you gave the wizard a verified token, it offers the ids it can see.)
CLOUDFLARE_ZONE|var|required||2|web|domain|cf_zone|The Cloudflare zone of the domain (the registered domain).|The DNS records and Workers Custom Domains are created in this zone. The zone must be Active (nameservers moved).|dash.cloudflare.com > the domain card shows the zone name. Example: example.com
OVH_SELLER_HOST|var|optional||2|web|fullhost|-|FULL hostname of the Seller Center and Provider Hub, for example seller-test.example.com. Empty = seller.<domain>.|Cloudflare's free certificate covers the zone apex and ONE label under it (example.com and *.example.com). With OVH_DOMAIN=test.example.com the default seller.test.example.com is two labels deep and gets no free certificate; seller-test.example.com is one label and does. The backend and the web app derive sign-in redirect URIs, CORS and email links from it, so the ovh-web run reads the same variable. If skipped: seller.<domain>.|The wizard offers it when OVH_DOMAIN is not the zone itself (phase 2) and proposes seller-<name>.<zone>. Or type your own: lower-case, under your Cloudflare zone, not equal to another host.~Example: seller-test.example.com
OVH_ADMIN_HOST|var|optional||2|web|fullhost|-|FULL hostname of the staff console, for example admin-test.example.com. Empty = admin.<domain>.|Same reason and same rules as OVH_SELLER_HOST. If skipped: admin.<domain>.|The wizard offers it together with OVH_SELLER_HOST; proposes admin-<name>.<zone>.~Example: admin-test.example.com
OVH_MEDIA_PUBLIC_URL|var|optional||2|web|httpsurl|-|Public base URL of the media bucket or CDN the product images are served from. Empty = https://media.<domain>.|The services put this base in every image URL and the web apps allow it in their Content-Security-Policy (img-src, media-src). Without it the browser may block product images. If skipped: https://media.<domain>, which must then exist.|The public hostname you gave the media bucket (Cloudflare R2 custom domain, or another CDN). Keep it one label under the zone for the free certificate, for example https://media-test.example.com.~Example: https://media-test.example.com
STRIPE_SECRET_KEY|secret|required||2|server|sk_test|stripe|Stripe TEST secret key, starts with sk_test_.|The payments service starts with it. Only test keys are accepted here.|1. dashboard.stripe.com, switch to Test mode (top right toggle).~2. Developers > API keys.~3. Reveal and copy the Secret key (sk_test_...).
STRIPE_PUBLISHABLE_KEY|secret|required||2|server|pk_test|-|Stripe TEST publishable key, starts with pk_test_.|gateway-bff refuses to start without it (CrashLoopBackOff).|Same page as the secret key: Publishable key (pk_test_...), Test mode.
STRIPE_WEBHOOK_SECRET|secret|optional||8|none|whsec|-|REQUIRED for the test environment: signing secret (whsec_) of the platform webhook https://api.<domain>/payments/v1/webhooks/stripe.|Without it Stripe events are rejected (400): payments never confirm. You can only create the webhook after the server exists, so the wizard asks after the first deploy.|1. dashboard.stripe.com, Test mode on.~2. Developers > Webhooks > Add destination (older layout: Add endpoint).~3. Listen to: Your account. Payload style: Snapshot, not Thin. URL: https://api.<domain>/payments/v1/webhooks/stripe~4. Events (15): payment_intent.succeeded, .amount_capturable_updated, .payment_failed, .requires_action, .canceled, charge.refunded, charge.dispute.created, charge.dispute.closed, transfer.reversed, payout.paid, payout.failed, setup_intent.succeeded, setup_intent.requires_action, payment_method.attached, payment_method.detached.~5. Create, then Signing secret > Reveal, copy whsec_... Apply: ovh-vps action services, then restart payments. Full guide: docs/runbooks/stripe-webhooks.md
STRIPE_CONNECT_WEBHOOK_SECRET|secret|optional||8|none|whsec|-|REQUIRED for sellers in the test environment: signing secret (whsec_) of the Connect webhook https://api.<domain>/seller/v1/webhooks/stripe-connect.|Seller onboarding and payout events need it: without it seller verification never completes and payout holds do not react to Stripe.|1. dashboard.stripe.com, Test mode on, Connect enabled (make stripe-setup checks it).~2. Developers > Webhooks > Add destination (older layout: Add endpoint).~3. Listen to: Connected accounts (not Your account). Payload style: Snapshot. URL: https://api.<domain>/seller/v1/webhooks/stripe-connect~4. Events (9): account.updated, capability.updated, person.created, person.updated, account.external_account.created, account.external_account.updated, account.external_account.deleted, payout.failed, account.application.deauthorized.~5. Create, Signing secret > Reveal, copy whsec_... Apply: ovh-vps action services, then restart seller. Full guide: docs/runbooks/stripe-webhooks.md
STRIPE_BILLING_WEBHOOK_SECRET|secret|optional||8|none|whsec|-|OPTIONAL: signing secret (whsec_) of the plan-fee webhook https://api.<domain>/seller/v1/webhooks/stripe-billing (the name is historical: Stripe Billing is replaced by our own billing).|Only plan fees paid by US bank debit, which settle days after the charge, need it. Skipped: card-paid plan fees work, bank-debit ones stay processing until the retry job.|1. Test mode on. Developers > Webhooks > Add destination (older layout: Add endpoint).~2. Listen to: Your account. Payload style: Snapshot. URL: https://api.<domain>/seller/v1/webhooks/stripe-billing~3. Events (2 only): payment_intent.succeeded, payment_intent.payment_failed.~4. Create, Signing secret > Reveal, copy whsec_... Apply: ovh-vps action services, then restart seller. Full guide: docs/runbooks/stripe-webhooks.md
RESEND_API_KEY|secret|optional||2|none|resend|-|Resend API key, starts with re_.|Sign-up, order and password emails. OVHcloud blocks outbound SMTP, so email goes over HTTPS. Skipped: no email is sent.|1. resend.com > create an account > Domains > add and verify your sending domain.~2. API Keys > Create API Key (sending access).~3. Copy it (re_...), shown once.
OPENROUTER_API_KEY|secret|optional||2|none|nonempty|-|OpenRouter key for the Lola assistant, AI moderation and product embeddings.|Skipped: no assistant and search is text-only.|openrouter.ai > Keys > Create Key.
GOOGLE_PLACES_API_KEY|secret|optional||2|none|nonempty|-|Google Places key (address autocomplete).|Skipped: addresses are typed in full.|Google Cloud console > APIs and Services > Credentials > Create credentials > API key, enable Places API.
GOOGLE_MAPS_API_KEY|secret|optional||2|none|nonempty|-|Google Routes key (delivery distance).|Skipped: no distance estimates.|Same console, enable Routes API.
SMARTY_AUTH_ID|secret|optional||2|none|nonempty|-|Smarty auth id (address verification).|Skipped: addresses are not verified.|smarty.com > account > API keys > Auth ID.
SMARTY_AUTH_TOKEN|secret|optional||2|none|nonempty|-|Smarty auth token.|As above.|smarty.com > account > API keys > Auth Token.
UPLOADTHING_API_KEY|secret|optional||2|none|nonempty|-|UploadThing key (media uploads).|Skipped: no image uploads.|uploadthing.com > dashboard > API Keys.
R2_ACCESS_KEY_ID|secret|optional||2|none|nonempty|-|Cloudflare R2 access key id (media bucket).|Skipped: media storage is not configured.|dash.cloudflare.com > R2 > Manage API tokens.
R2_SECRET_ACCESS_KEY|secret|optional||2|none|nonempty|-|Cloudflare R2 secret access key.|As above.|Shown once when the R2 token is created.
USPS_CLIENT_ID|secret|optional||2|none|nonempty|-|Carrier sandbox: USPS client id.|Skipped: no USPS rates or labels.|developers.usps.com > your app.
USPS_CLIENT_SECRET|secret|optional||2|none|nonempty|-|Carrier sandbox: USPS client secret.|As above.|developers.usps.com > your app.
UPS_CLIENT_ID|secret|optional||2|none|nonempty|-|Carrier sandbox: UPS client id.|Skipped: no UPS rates or labels.|developer.ups.com > your app.
UPS_CLIENT_SECRET|secret|optional||2|none|nonempty|-|Carrier sandbox: UPS client secret.|As above.|developer.ups.com > your app.
FEDEX_CLIENT_ID|secret|optional||2|none|nonempty|-|Carrier sandbox: FedEx client id.|Skipped: no FedEx rates or labels.|developer.fedex.com > your project.
FEDEX_CLIENT_SECRET|secret|optional||2|none|nonempty|-|Carrier sandbox: FedEx client secret.|As above.|developer.fedex.com > your project.
DB_MODE|var|required|cluster|3|server|choice:cluster,external|-|Where PostgreSQL runs: cluster (a pod on the server's disk) or external (a managed Postgres such as Layerbase).|cluster loses every row when the server is destroyed: throwaway test data only. external keeps data across destroy but is a separate monthly bill.|Decided in phase 3 of the wizard.
EXTERNAL_PG_HOST|var|external||3|server|host|-|Host name of the managed Postgres.|The services connect to it; the pipeline creates one role and database per service.|Layerbase dashboard > your database > Connection details > Host.
EXTERNAL_PG_ADMIN_USER|var|external||3|server|user|-|Admin user of the managed Postgres (can create roles and databases).|Used once per service to create its role and database.|Same connection details page.
EXTERNAL_PG_ADMIN_PASSWORD|secret|external||3|server|nonempty|-|Password of that admin user.|As above.|Same connection details page.
EXTERNAL_PG_SSLMODE|var|external|require|3|server|choice:require,verify-ca,verify-full|-|sslmode of the connection.|require encrypts; verify-full also checks the certificate (needs the provider's CA on the server).|Keep require unless the provider says otherwise.
OVH_INSTANCE_FLAVOR|var|optional|b3-32|4|server|flavor|-|Public Cloud flavor (machine size) of the server.|The biggest cost line: billed by the hour from creation until destroy. 16 GB is too small for the stack.|Public Cloud > your project > Instances > Create an instance: pick your region and read each flavor's hourly price there. b3-32 is 8 vCPU and 32 GB.
