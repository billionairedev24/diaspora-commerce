# Coverage thresholds (line % for Java/JaCoCo and web/Vitest, statement % for Go) used by tools/quality/coverage_report.sh.
# Precedence: COVERAGE_MIN_* env vars > `<service>.<metric>` here > `default.<metric>` here > built-in defaults.
# Metrics: java (Java total), domain (Java …/domain packages), go (Go total, cmd/ and testkit excluded),
#          domain_go (Go internal/domain), web (line % of a web package's Vitest project, service `<pkg>-<project>`).
#
# Policy (backlog S197): 80% on domain modules, a ratchet on totals. Defaults were set from measurements on
# 2026-10-10 (Java with failsafe ITs, Go with Testcontainers ITs and -coverpkg=./...):
#   Java  identity 86.2% (domain 96.6%), offers 85.3% (92.0%), seller 89.6% (92.7%)
#   Go    gateway-bff 81.9% (83.6%), promise 81.5% (93.8%), notifications 76.5% (84.8%), geo 63.0% (81.1%),
#         cart 60.8% (77.5%),
#         search 47.0% (84.2%), go/pkg 11.6% (-short)
# Overrides below are ratchets for modules under the default: raise them as tests land, never lower them.

default.java = 75
default.domain = 80
default.go = 60
default.domain_go = 80

# --- ratchets (owner: the service team; target = default)
cart.domain_go = 75
search.go = 45
go-pkg.go = 10
# Measured 2026-10-10 with `coverage_report.sh --run-go` (-short: unit tests only, so CI with the Testcontainers ITs
# is at or above these): authz-sync 41.1% (domain 94.1%), indexer 40.2% (100%), storefront 33.9% (83.7%),
# carrier-gateway 68.3% (81.5%), geo 63.9% (84.1%). media 44.0% (domain 58.8%) was measured while its
# internal/app tests did not compile (concurrent change); re-measure and raise.
authz-sync.go = 40
indexer.go = 40
storefront.go = 33
media.go = 40
media.domain_go = 55

# --- web (Vitest v8). No default gate: each project is gated from its own measurement, rounded down.
# ui-storybook: every @afrotransact/ui story run by @storybook/addon-vitest (render + play + a11y) over src/**
# (stories excluded); measured 84.17% lines (250/297) on 2026-10-10.
ui-storybook.web = 84
