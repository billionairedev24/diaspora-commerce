# Shared edge Gateway (Envoy Gateway, Gateway API). Per-service HTTPRoutes attach to it from afrotransact-<env>.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Selector, selector: {matchLabels: {app.kubernetes.io/part-of: afrotransact}}}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.afrotransact.com"
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: afrotransact-wildcard-tls}]
      allowedRoutes:
        namespaces: {from: Selector, selector: {matchLabels: {app.kubernetes.io/part-of: afrotransact}}}
