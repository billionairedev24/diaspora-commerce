# Public routes for dev (hosts from infra/cloudflare local.hosts; docs/engineering/environments.md). Cloudflare
# terminates TLS and forwards through the tunnel (or AOP-protected ingress) to the edge Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: afrotransact-dev
spec:
  parentRefs: [{name: edge, namespace: ingress}]
  hostnames: [api-dev.afrotransact.com]
  rules:
    # screen APIs for web and mobile (BFF_ORIGIN = <API_BASE_URL>/bff)
    - matches: [{path: {type: PathPrefix, value: /bff}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: gateway-bff, port: 80}]
    # mobile devices / notification preferences (EXPO_PUBLIC_IDENTITY_URL)
    - matches: [{path: {type: PathPrefix, value: /identity}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: identity, port: 80}]
    # customer app bookings
    - matches: [{path: {type: PathPrefix, value: /bookings}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: bookings, port: 80}]
    # driver app
    - matches: [{path: {type: PathPrefix, value: /fulfilment}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: fulfilment, port: 80}]
    # driver proof photos, upload signing
    - matches: [{path: {type: PathPrefix, value: /media}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: media, port: 80}]
    # provider webhooks (Resend, SendGrid, Twilio), PUBLIC_BASE_URL
    - matches: [{path: {type: PathPrefix, value: /notifications}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: notifications, port: 80}]
    # carrier webhooks (UPS, FedEx, DHL), PUBLIC_BASE_URL
    - matches: [{path: {type: PathPrefix, value: /carrier-gateway}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: carrier-gateway, port: 80}]
    # Stripe webhooks only (rewritten to /v1/webhooks)
    - matches: [{path: {type: PathPrefix, value: /payments/v1/webhooks}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /v1/webhooks}}
      backendRefs: [{name: payments, port: 80}]
    # seller Stripe webhook, Connect (account.updated, payouts: STRIPE_CONNECT_WEBHOOK_SECRET): this exact path only, signature-verified by the service
    - matches: [{path: {type: PathPrefix, value: /seller/v1/webhooks/stripe-connect}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /v1/webhooks/stripe-connect}}
      backendRefs: [{name: seller, port: 80}]
    # seller Stripe webhook, plan-fee PaymentIntent results (STRIPE_BILLING_WEBHOOK_SECRET): this exact path only, signature-verified by the service
    - matches: [{path: {type: PathPrefix, value: /seller/v1/webhooks/stripe-billing}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /v1/webhooks/stripe-billing}}
      backendRefs: [{name: seller, port: 80}]
    # Release 1 (docs/runbooks/release-1-deploy.md, "Upstream wiring"): after a cutover these Services select a deployable's pods, which serve EVERY module
    # of the deployable (core: each module flat and under /modules/<m>/; afrotransact-go: /modules/<m>/). Deny the module mount on every prefix and the PRIVATE
    # mcp-server (POST /mcp, GET /v1/tools, the OAuth protected-resource metadata) on the prefixes that land on core. tools/release/upstreams.py checks both.
    - matches:
      - {path: {type: PathPrefix, value: /identity/modules}}
      - {path: {type: PathPrefix, value: /bookings/modules}}
      - {path: {type: PathPrefix, value: /fulfilment/modules}}
      - {path: {type: PathPrefix, value: /media/modules}}
      - {path: {type: PathPrefix, value: /notifications/modules}}
      - {path: {type: PathPrefix, value: /carrier-gateway/modules}}
      - {path: {type: PathPrefix, value: /identity/mcp}}
      - {path: {type: PathPrefix, value: /identity/v1/tools}}
      - {path: {type: PathPrefix, value: /identity/.well-known/oauth-protected-resource}}
      - {path: {type: PathPrefix, value: /bookings/mcp}}
      - {path: {type: PathPrefix, value: /bookings/v1/tools}}
      - {path: {type: PathPrefix, value: /bookings/.well-known/oauth-protected-resource}}
      - {path: {type: PathPrefix, value: /fulfilment/mcp}}
      - {path: {type: PathPrefix, value: /fulfilment/v1/tools}}
      - {path: {type: PathPrefix, value: /fulfilment/.well-known/oauth-protected-resource}}
      filters:
        - type: ExtensionRef
          extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: deny-operational-paths}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: deny-operational-paths
  namespace: afrotransact-dev
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body: {type: Inline, inline: "not found"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: afrotransact-dev
spec:
  parentRefs: [{name: edge, namespace: ingress}]
  hostnames: [auth-dev.afrotransact.com]
  rules:
    - backendRefs: [{name: identity, port: 80}]
    # Release 1: the auth host's Service selects core after the cutover; only identity's own paths are for the internet (see the api route above).
    - matches:
      - {path: {type: PathPrefix, value: /modules}}
      - {path: {type: PathPrefix, value: /mcp}}
      - {path: {type: PathPrefix, value: /v1/tools}}
      - {path: {type: PathPrefix, value: /.well-known/oauth-protected-resource}}
      filters:
        - type: ExtensionRef
          extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: deny-operational-paths}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs: [{name: edge, namespace: ingress}]
  hostnames: [grafana-dev.afrotransact.com]
  rules:
    - backendRefs: [{name: kube-prometheus-stack-grafana, port: 80}]
---
# Tunnel token for cloudflared (base/cloudflared.yaml): `cloudflared tunnel token <tofu output tunnel_id>`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
  namespace: ingress
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: cloudflared}
  data:
    - secretKey: token
      remoteRef: {key: afrotransact/dev/cloudflared, property: token}
