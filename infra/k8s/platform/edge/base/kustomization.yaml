apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Environment-independent edge: issuers, Gateway + EnvoyProxy, cloudflared. Needs the cert-manager, external-secrets,
# Gateway API and Envoy Gateway CRDs (later sync wave than the operators). Routes and the tunnel token are per
# environment: overlays/<env>.
resources:
  - cluster-issuers.yaml
  - gateway.yaml
  - cloudflared.yaml
