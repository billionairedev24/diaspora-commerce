# Cloudflare Tunnel connector (infra/cloudflare origin_mode = "tunnel", the default): outbound-only connection from the
# cluster to Cloudflare, so api./auth./mcp./grafana.<base> need no public load balancer. The tunnel and its ingress
# rules (hostname -> http://envoy-gateway.ingress.svc.cluster.local:80) are managed remotely by infra/cloudflare
# (config_src = cloudflare); the pod only needs the tunnel token, synced from the secret store by the overlay's
# ExternalSecret (key afrotransact/<env>/cloudflared, property token: `cloudflared tunnel token <tunnel_id>`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: ingress
  labels: {app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: afrotransact-platform}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflared, app.kubernetes.io/part-of: afrotransact-platform}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: cloudflared}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args: [tunnel, --no-autoupdate, --metrics, 0.0.0.0:2000, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: cloudflared, key: token}
          ports:
            - {name: metrics, containerPort: 2000}
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: ingress
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
