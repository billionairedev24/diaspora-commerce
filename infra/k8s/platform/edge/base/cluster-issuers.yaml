# Let's Encrypt via DNS-01 on Cloudflare (DNS is managed in infra/cloudflare). Token from the secret store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: cloudflare-api-token}
  data:
    - secretKey: api-token
      remoteRef: {key: afrotransact/platform/cloudflare, property: api-token}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@afrotransact.com
    privateKeySecretRef: {name: letsencrypt-account-key}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: {name: cloudflare-api-token, key: api-token}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
