# Envoy Gateway (oci://docker.io/envoyproxy/gateway-helm v1.9.2) — Gateway API implementation used for ingress.
# (ingress-nginx is retired upstream, so it is not used.) The controller runs in envoy-gateway-system; with deploy type
# GatewayNamespace the Envoy proxies run in the Gateway's namespace "ingress", which the at-service NetworkPolicy
# admits. The Gateway, EnvoyProxy and cloudflared live in ../edge/base, the HTTPRoutes in ../edge/overlays/<env>.
deployment:
  replicas: 2
config:
  envoyGateway:
    provider:
      type: Kubernetes
      kubernetes:
        deploy:
          type: GatewayNamespace
    telemetry:
      metrics:
        prometheus: {disable: false}
    logging:
      level:
        default: info
