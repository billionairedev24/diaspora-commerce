# kube-prometheus-stack (prometheus-community 92.3.0) — base values for every environment.
# Namespace: observability. Env overrides: ../envs/<env>/kube-prometheus-stack.yaml
fullnameOverride: kube-prometheus-stack     # service: kube-prometheus-stack-prometheus.observability:9090 (used by Argo Rollouts analysis)

crds:
  enabled: true
  upgradeJob:
    enabled: true

defaultRules:
  create: true
  rules:
    etcd: false            # managed control planes (EKS / GKE / AKS)
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false

kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 15d
    retentionSize: 45GB
    enableRemoteWriteReceiver: true          # OTel Collector gateway + Tempo metrics-generator push here
    enableFeatures: [exemplar-storage]
    walCompression: true
    # Pick up every ServiceMonitor / PodMonitor / PrometheusRule in the cluster, not only this release's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # scrapeClasses (env / service labels on every target) are set per environment in envs/<env>/.
    externalLabels:
      cluster: afrotransact
    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {memory: 4Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 50Gi}

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
  # Routing: severity=page -> PagerDuty, severity=ticket -> Opsgenie (P3) + Slack.
  # Keys come from the cloud secret store via ExternalSecret alertmanager-receivers (../observability/alertmanager-secrets.yaml)
  # and are mounted at /etc/alertmanager/secrets/alertmanager-receivers/.
  config:
    global:
      resolve_timeout: 5m
      opsgenie_api_url: https://api.opsgenie.com/
    route:
      receiver: slack
      group_by: [alertname, env, service, slo]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: [alertname=~"Watchdog|InfoInhibitor"]
        - receiver: pagerduty
          matchers: [severity="page"]
          continue: true
        - receiver: opsgenie
          matchers: [severity=~"ticket|warning"]
          continue: true
        - receiver: slack
          matchers: [severity=~"page|ticket|warning"]
    inhibit_rules:
      - source_matchers: [severity="page"]
        target_matchers: [severity="ticket"]
        equal: [slo, env]
      - source_matchers: [alertname="ElasticsearchClusterRed"]
        target_matchers: [alertname="ElasticsearchClusterYellow"]
        equal: [cluster]
    receivers:
      - name: "null"
      - name: pagerduty
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-receivers/pagerduty-routing-key
            send_resolved: true
            severity: critical
            links:
              - href: '{{ (index .Alerts 0).Annotations.runbook_url }}'
                text: Runbook
      - name: opsgenie
        opsgenie_configs:
          - api_key_file: /etc/alertmanager/secrets/alertmanager-receivers/opsgenie-api-key
            priority: P3
            tags: '{{ .CommonLabels.env }},{{ .CommonLabels.service }}'
            description: '{{ (index .Alerts 0).Annotations.description }} Runbook: {{ (index .Alerts 0).Annotations.runbook_url }}'
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack-webhook-url
            channel: '#afrotransact-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} {{ .CommonLabels.env }}/{{ .CommonLabels.service }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }} — <{{ .Annotations.runbook_url }}|runbook>{{ "\n" }}{{ end }}'
  alertmanagerSpec:
    secrets: [alertmanager-receivers]

grafana:
  enabled: true
  defaultDashboardsTimezone: browser
  admin:
    existingSecret: grafana-admin          # ExternalSecret in ../observability/grafana-admin.yaml
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      uid: prometheus                      # same UID as local, so dashboards are portable
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability
      jsonData:
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: '$${__value.raw}'
          - name: traceId
            matcherType: regex
            matcherRegex: '"(?:traceId|trace_id)"\s*:\s*"([0-9a-f]{32})"'
            datasourceUid: tempo
            url: '$${__value.raw}'
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo-query-frontend.observability:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: true
          customQuery: true
          query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
        tracesToMetrics:
          datasourceUid: prometheus
          tags: [{key: service.name, value: service}]
        serviceMap: {datasourceUid: prometheus}
        nodeGraph: {enabled: true}
        lokiSearch: {datasourceUid: loki}
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 32Mi}

kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/name,afrotransact.com/env]
    - deployments=[app.kubernetes.io/name]
