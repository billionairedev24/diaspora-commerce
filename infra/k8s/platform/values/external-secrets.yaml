# External Secrets Operator (external-secrets 2.12.0). The ClusterSecretStore "platform-secrets" is installed
# per cloud from infra/k8s/platform/secret-stores/<cloud>/ (selected by `cloud` in platform-values.yaml).
installCRDs: true
replicaCount: 2
serviceAccount:
  name: external-secrets
  annotations: {}                    # workload identity per cloud — envs/<env>/external-secrets.yaml
serviceMonitor:
  enabled: true
  additionalLabels: {release: kube-prometheus-stack}
webhook:
  replicaCount: 2
certController:
  replicaCount: 1
resources:
  requests: {cpu: 20m, memory: 64Mi}
