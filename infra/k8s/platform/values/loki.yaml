# Loki (grafana 7.4.0) — SimpleScalable in uat/prod, SingleBinary in dev. Object storage per cloud in
# ../envs/<env>/loki.yaml (S3 / GCS / Azure Blob, via workload identity). Receives OTLP logs from the
# OTel Collector gateway at http://loki-gateway.observability/otlp.
fullnameOverride: loki
deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3            # overridden per cloud: s3 | gcs | azure
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 744h          # 31 days (prod overrides)
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes: [service.namespace, deployment.environment, k8s.namespace.name]
  compactor:
    retention_enabled: true
    delete_request_store: s3        # overridden per cloud
  pattern_ingester:
    enabled: true
  storage:
    type: s3                        # overridden per cloud
    bucketNames:
      chunks: afrotransact-loki-chunks
      ruler: afrotransact-loki-ruler
      admin: afrotransact-loki-admin

serviceAccount:
  create: true
  name: loki
  annotations: {}                   # workload identity annotation per cloud (envs/<env>/loki.yaml)

backend: {replicas: 2}
read: {replicas: 2}
write:
  replicas: 3
  persistence: {size: 20Gi}

chunksCache: {enabled: true, allocatedMemory: 1024}
resultsCache: {enabled: true, allocatedMemory: 512}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}

monitoring:
  serviceMonitor:
    enabled: true
    labels: {release: kube-prometheus-stack}
