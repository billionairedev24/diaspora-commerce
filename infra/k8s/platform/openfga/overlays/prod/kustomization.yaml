# prod: three replicas across zones, more datastore connections, 10% of traces (base default).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: Deployment, name: openfga}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 3}
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: "1", memory: 256Mi}, limits: {memory: 1Gi}}
      - {op: test, path: /spec/template/spec/containers/0/env/2/name, value: OPENFGA_DATASTORE_MAX_OPEN_CONNS}
      - {op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "60"}
  - target: {kind: PodDisruptionBudget, name: openfga}
    patch: |-
      - {op: replace, path: /spec/minAvailable, value: 2}
