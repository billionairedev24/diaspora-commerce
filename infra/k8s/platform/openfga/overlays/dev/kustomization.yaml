# dev: one replica, every trace sampled.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: Deployment, name: openfga}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 96Mi}, limits: {memory: 256Mi}}
      - {op: test, path: /spec/template/spec/containers/0/env/12/name, value: OPENFGA_TRACE_SAMPLE_RATIO}
      - {op: replace, path: /spec/template/spec/containers/0/env/12/value, value: "1.0"}
  - target: {kind: PodDisruptionBudget, name: openfga}
    patch: |-
      - {op: replace, path: /spec/minAvailable, value: 0}
