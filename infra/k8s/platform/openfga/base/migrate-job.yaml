# Datastore schema migrations on every sync (Argo CD Sync hook, wave 0: after the ExternalSecret, before the server).
# `openfga migrate` is idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app.kubernetes.io/name: openfga-migrate}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: openfga/openfga:v1.10.0
          args: ["migrate"]
          env:
            - {name: OPENFGA_DATASTORE_ENGINE, value: postgres}
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef: {name: openfga, key: OPENFGA_DATASTORE_URI}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
