# OpenFGA secrets from the cloud secret store (ClusterSecretStore platform-secrets), key afrotransact/openfga:
#   datastore-uri   postgres://openfga:<password>@<host>:5432/openfga?sslmode=require  (managed Postgres, own database)
#   preshared-keys  comma-separated API keys; services get one as FGA_API_TOKEN, authz-sync as OPENFGA_API_TOKEN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: openfga}
  data:
    - {secretKey: OPENFGA_DATASTORE_URI, remoteRef: {key: afrotransact/openfga, property: datastore-uri}}
    - {secretKey: OPENFGA_AUTHN_PRESHARED_KEYS, remoteRef: {key: afrotransact/openfga, property: preshared-keys}}
