# OpenFGA (fine-grained authorisation, S022 / ADR 0001) — plain manifests like elasticsearch/: base + env overlays.
# Argo CD: platform-manifests ApplicationSet element
#   {component: openfga, wave: "1", manifestPath: infra/k8s/platform/openfga/overlays/ENV}
# The store and authorization model are created / upgraded by authz-sync at start-up (contracts/openfga/model.json),
# so nothing here depends on the model version.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openfga
labels:
  - pairs: {app.kubernetes.io/part-of: afrotransact-platform}
    includeSelectors: false
resources:
  - external-secret.yaml
  - migrate-job.yaml
  - deployment.yaml
  - network-policy.yaml
  - service-monitor.yaml
