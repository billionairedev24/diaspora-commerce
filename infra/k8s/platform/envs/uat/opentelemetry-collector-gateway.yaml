# OTel gateway — uat: share of fast, successful traces kept (errors and > 500 ms are always kept).
replicaCount: 2
config:
  processors:
    resource/env:
      attributes:
        - {key: deployment.environment, value: uat, action: insert}
    tail_sampling:
      policies:
        - {name: keep-errors, type: status_code, status_code: {status_codes: [ERROR]}}
        - {name: keep-slow, type: latency, latency: {threshold_ms: 500}}
        - {name: baseline, type: probabilistic, probabilistic: {sampling_percentage: 50}}
  service:
    pipelines:
      traces: {processors: [memory_limiter, resource/env, tail_sampling, batch]}
      metrics: {processors: [memory_limiter, resource/env, batch]}
      logs: {processors: [memory_limiter, resource/env, batch]}
