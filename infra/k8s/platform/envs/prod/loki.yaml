# Loki — prod. Retention + identity. Uncomment the block for the env's cloud (must match platform-values.yaml).
loki:
  limits_config:
    retention_period: 2160h
  storage:
    bucketNames:
      chunks: afrotransact-prod-loki-chunks
      ruler: afrotransact-prod-loki-ruler
      admin: afrotransact-prod-loki-admin
