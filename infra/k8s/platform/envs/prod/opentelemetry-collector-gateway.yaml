# OTel gateway - prod (lean): ONE replica (tail sampling needs every span of a trace on one replica) shipping traces,
# metrics and logs to Grafana Cloud over OTLP/HTTP. Errors and traces slower than 500 ms are always kept, plus 10% of the rest.
# Credentials: Secret grafana-cloud-otlp (infra/k8s/platform/lean/grafana-cloud.yaml).
replicaCount: 1
extraEnvsFrom:
  - secretRef: {name: grafana-cloud-otlp}
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 384Mi}
podDisruptionBudget:
  enabled: false
serviceMonitor:
  enabled: false
autoscaling:
  enabled: false
config:
  extensions:
    health_check: {endpoint: "${env:MY_POD_IP}:13133"}
    basicauth/grafana:
      client_auth:
        username: ${env:GRAFANA_INSTANCE_ID}
        password: ${env:GRAFANA_API_TOKEN}
  processors:
    resource/env:
      attributes:
        - {key: deployment.environment, value: prod, action: insert}
    tail_sampling:
      policies:
        - {name: keep-errors, type: status_code, status_code: {status_codes: [ERROR]}}
        - {name: keep-slow, type: latency, latency: {threshold_ms: 500}}
        - {name: baseline, type: probabilistic, probabilistic: {sampling_percentage: 10}}
  exporters:
    otlphttp/grafana:
      endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
      auth: {authenticator: basicauth/grafana}
  service:
    extensions: [health_check, basicauth/grafana]
    pipelines:
      traces: {receivers: [otlp], processors: [memory_limiter, resource/env, tail_sampling, batch], exporters: [otlphttp/grafana]}
      metrics: {receivers: [otlp], processors: [memory_limiter, resource/env, batch], exporters: [otlphttp/grafana]}
      logs: {receivers: [otlp], processors: [memory_limiter, resource/env, batch], exporters: [otlphttp/grafana]}
