# GENERATED from infra/observability/rules/release-1.yaml by generate_rules.py — do not edit by hand.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: afrotransact-release-1
  namespace: observability
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: afrotransact
spec:
  groups:
  - name: afrotransact-release-1
    rules:
    - alert: ModuleNotReady
      expr: max by (env, service, module) (at_module_up) == 0
      for: 3m
      labels:
        severity: page
      annotations:
        summary: Module {{ $labels.module }} is not ready in {{ $labels.env }}
        description: 'The module''s readiness inside its deployable has been DOWN for 3 minutes (Java: its start state, a failed migration or startup error; Go: a failing readiness check such as its database
          or Redis). The other modules keep serving. Java: look at /actuator/health/{{ $labels.module }} (adds the live database check) and the pod log filtered by module; Go: /modules/{{ $labels.module
          }}/readyz.'
        runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/release-1/docs/runbooks/release-1-deploy.md
        dashboard: /d/at-release-1-modules
    - alert: CoreMemoryNearCap
      expr: max by (env) (process_resident_memory_bytes{job="afrotransact-core"}) > 1.8 * 1024 * 1024 * 1024
      for: 10m
      labels:
        severity: ticket
      annotations:
        summary: afrotransact-core RSS is {{ $value | humanize1024 }}B in {{ $labels.env }}
        description: Resident memory above 1.8 GiB for 10 minutes; the container limit and the ADR 0011 hard cap (S1) are 2.0 GiB, above which the kernel OOM-kills the pod (every Java module restarts).
          Find the module that grew (jvm and Hikari panels on /d/at-release-1-modules) or detach a heavy one (ai-gateway, mcp-server).
        runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/release-1/docs/runbooks/release-1-deploy.md
        dashboard: /d/at-release-1-modules
    - alert: CorePoolBudgetExceeded
      expr: sum by (env) (hikaricp_connections_max{job="afrotransact-core"}) > 48
      for: 15m
      labels:
        severity: ticket
      annotations:
        summary: afrotransact-core pools add up to {{ $value }} connections (budget 48 per pod)
        description: 'The Java budget is under 100 database connections including a rolling-update surge of two pods (2 x 48). Someone raised a pool above java/apps/core/deploy/helm/values.yaml (helm template
          refuses it, so this is an env var override). Lower it or move the budget deliberately: docs/runbooks/release-1-deploy.md, Connections.'
        runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/release-1/docs/runbooks/release-1-deploy.md
        dashboard: /d/at-release-1-modules
    - alert: DeployableRolloutOverlap
      expr: count by (env, job) (up{job=~"afrotransact-core|afrotransact-go"} == 1) > 1
      for: 20m
      labels:
        severity: ticket
      annotations:
        summary: '{{ $labels.job }} has {{ $value }} pods running for 20 minutes in {{ $labels.env }}'
        description: 'A rolling update normally overlaps for a minute. Two pods for 20 minutes mean a stuck rollout (the new pod is not Ready) or a manual scale-up: the second pod doubles the module schedulers,
          outbox relays and database connections.'
        runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/release-1/docs/runbooks/release-1-deploy.md
        dashboard: /d/at-release-1-modules
    - alert: ModuleReadinessMetricMissing
      expr: |
        count by (env) (up{job=~"afrotransact-core|afrotransact-go"} == 1) unless count by (env) (at_module_up)
      for: 15m
      labels:
        severity: ticket
      annotations:
        summary: A deployable is up in {{ $labels.env }} but at_module_up is not arriving
        description: ModuleNotReady cannot fire without the at_module_up series. Check the scrape (Alloy allowlist `at_module_(up|ready)` in infra/k8s/platform/lean/alloy/config.alloy, honor_labels) and
          that the running image contains the module-core / afrotransact-go version that exports it.
        runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/release-1/docs/runbooks/release-1-deploy.md
        dashboard: /d/at-release-1-modules
    - alert: ConnectionBudgetNearLimit
      expr: |
        sum by (env) (hikaricp_connections_max{job="afrotransact-core"})
        + 12 * (count by (env) (up{job="afrotransact-go"} == 1) or on (env) (0 * sum by (env) (hikaricp_connections_max{job="afrotransact-core"})))
        + 20 > 400
      for: 15m
      labels:
        severity: ticket
      annotations:
        summary: Worst-case database connections are {{ $value }} of the 500 Layerbase limit in {{ $labels.env }}
        description: 'Java pool maximums (Hikari, measured) + 12 per Go pod (4 modules x 3, capped in code, not measured) + 20 (Temporal, backup, operators) above 400, 80% of the limit. A rolling update
          or a second replica doubles the pod terms. Lower a pool or revisit the budget: docs/runbooks/release-1-deploy.md, Connections.'
        runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/release-1/docs/runbooks/release-1-deploy.md
        dashboard: /d/at-release-1-modules
