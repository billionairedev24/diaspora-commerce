  - name: slo-checkout-alerts
    rules:
    - alert: CheckoutSuccessBudgetBurn
      expr: |-
        (slo:sli_error:ratio_rate1h{slo="checkout"} > (14.4 * 0.001) and slo:sli_error:ratio_rate5m{slo="checkout"} > (14.4 * 0.001))
        or
