        or
        (slo:sli_error:ratio_rate3d{slo="checkout"} > (1 * 0.001) and slo:sli_error:ratio_rate6h{slo="checkout"} > (1 * 0.001))
      for: 15m
      labels:
        severity: ticket
        slo: checkout
        team: orders
      annotations:
        runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CheckoutSuccessBudgetBurn.md
        dashboard: /d/at-business-slo
