      labels:
        slo: checkout
    - record: slo:sli_error:ratio_rate1h
      expr: |-
        (sum by (env) (rate(checkout_attempts_total{outcome="failure"}[1h])))
        /
        (sum by (env) (rate(checkout_attempts_total{outcome=~"success|failure"}[1h])) > 0)
      labels:
        slo: checkout
    - record: slo:sli_error:ratio_rate2h
      expr: |-
        (sum by (env) (rate(checkout_attempts_total{outcome="failure"}[2h])))
        /
        (sum by (env) (rate(checkout_attempts_total{outcome=~"success|failure"}[2h])) > 0)
      labels:
        slo: checkout
    - record: slo:sli_error:ratio_rate6h
      expr: |-
        (sum by (env) (rate(checkout_attempts_total{outcome="failure"}[6h])))
        /
        (sum by (env) (rate(checkout_attempts_total{outcome=~"success|failure"}[6h])) > 0)
      labels:
        slo: checkout
    - record: slo:sli_error:ratio_rate1d
      expr: |-
        (sum by (env) (rate(checkout_attempts_total{outcome="failure"}[1d])))
        /
        (sum by (env) (rate(checkout_attempts_total{outcome=~"success|failure"}[1d])) > 0)
      labels:
        slo: checkout
    - record: slo:sli_error:ratio_rate3d
      expr: |-
        (sum by (env) (rate(checkout_attempts_total{outcome="failure"}[3d])))
        /
        (sum by (env) (rate(checkout_attempts_total{outcome=~"success|failure"}[3d])) > 0)
      labels:
        slo: checkout
    - record: slo:sli_error:ratio_rate30d
      expr: avg_over_time(slo:sli_error:ratio_rate1h{slo="checkout"}[30d])
      labels:
        slo: checkout
    - record: slo:error_budget:ratio
      expr: vector(0.001)
