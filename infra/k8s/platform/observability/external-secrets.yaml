# Secrets for the observability stack, pulled from the cloud secret store (ClusterSecretStore platform-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-receivers
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: alertmanager-receivers}
  data:
    - {secretKey: pagerduty-routing-key, remoteRef: {key: afrotransact/observability, property: pagerduty-routing-key}}
    - {secretKey: opsgenie-api-key, remoteRef: {key: afrotransact/observability, property: opsgenie-api-key}}
    - {secretKey: slack-webhook-url, remoteRef: {key: afrotransact/observability, property: slack-webhook-url}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: grafana-admin}
  data:
    - {secretKey: admin-user, remoteRef: {key: afrotransact/observability, property: admin-user}}
    - {secretKey: admin-password, remoteRef: {key: afrotransact/observability, property: admin-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-exporter
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: postgres-exporter}
  data:
    - {secretKey: DATA_SOURCE_NAME, remoteRef: {key: afrotransact/observability, property: DATA_SOURCE_NAME}}
