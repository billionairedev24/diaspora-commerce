# cloud=ovh — OVHcloud Secret Manager (OKMS) through External Secrets' Vault provider (KV v2, mTLS client certificate).
# Secrets are named afrotransact/<env>/<service> (JSON value), the same "/" form as AWS, so the Helm chart needs no keySeparator.
# The client certificate is an OKMS credential created in the Control Panel and stored as Secret external-secrets/okms-client
# (tls.crt, tls.key, ca.crt). Take server/path from `tofu output cluster_secret_store`; verify the mount path on first use.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    vault:
      server: https://eu-west-rbx.okms.ovh.net/api/OKMS_ID    # Terraform output per env
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: okms-client
        namespace: external-secrets
        key: ca.crt
      auth:
        cert:
          clientCert:
            name: okms-client
            namespace: external-secrets
            key: tls.crt
          secretRef:
            name: okms-client
            namespace: external-secrets
            key: tls.key
