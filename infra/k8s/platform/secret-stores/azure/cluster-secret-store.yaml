# cloud=azure — Azure Key Vault via Azure Workload Identity. Key Vault names allow only [0-9a-zA-Z-], so
# secrets are named afrotransact-<env>-<service> (JSON value) — keep in sync with Terraform.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    azurekv:
      vaultUrl: https://afrotransact-VAULT.vault.azure.net    # Terraform output per env
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
