# cloud=gcp — Google Secret Manager via GKE Workload Identity.
# NOTE: Secret Manager ids allow only [A-Za-z0-9_-]; the at-service library currently reads
# afrotransact/<env>/<svc>, so on GCP (and Azure) the library must use afrotransact-<env>-<svc> — see report.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    gcpsm:
      projectID: afrotransact-PROJECT_ID          # set per env (kustomize patch or edit) — Terraform output
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: afrotransact
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
