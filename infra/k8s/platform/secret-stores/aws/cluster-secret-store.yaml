# cloud=aws — AWS Secrets Manager via IRSA / Pod Identity of the external-secrets service account.
# Service secrets live at afrotransact/<env>/<service> (JSON key/value) — see at-service externalSecret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
