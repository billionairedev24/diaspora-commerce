# cloud=none (kind / local clusters) — Fake provider with local-only values, so ExternalSecrets resolve
# without a cloud. Mirrors infra/local/docker-compose.yml credentials. NEVER used in a real cloud env.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    fake:
      data:
        - key: afrotransact/dev/catalog
          value: '{"DB_URL":"jdbc:postgresql://postgres.data:5432/catalog","DB_USER":"catalog","DB_PASSWORD":"catalog","KAFKA_BOOTSTRAP":"kafka.data:9092"}'
        - key: afrotransact/uat/catalog
          value: '{"DB_URL":"jdbc:postgresql://postgres.data:5432/catalog","DB_USER":"catalog","DB_PASSWORD":"catalog","KAFKA_BOOTSTRAP":"kafka.data:9092"}'
        - key: afrotransact/prod/catalog
          value: '{"DB_URL":"jdbc:postgresql://postgres.data:5432/catalog","DB_USER":"catalog","DB_PASSWORD":"catalog","KAFKA_BOOTSTRAP":"kafka.data:9092"}'
        - key: afrotransact/dev/search
          value: '{"ES_URLS":"https://search-es-http.elastic:9200","ES_API_KEY":"local-only"}'
        - key: afrotransact/uat/search
          value: '{"ES_URLS":"https://search-es-http.elastic:9200","ES_API_KEY":"local-only"}'
        - key: afrotransact/prod/search
          value: '{"ES_URLS":"https://search-es-http.elastic:9200","ES_API_KEY":"local-only"}'
        - key: afrotransact/observability
          value: '{"pagerduty-routing-key":"local","opsgenie-api-key":"local","slack-webhook-url":"http://localhost/","admin-user":"admin","admin-password":"admin","DATA_SOURCE_NAME":"postgresql://monitoring:monitoring@postgres.data:5432/postgres?sslmode=disable"}'
