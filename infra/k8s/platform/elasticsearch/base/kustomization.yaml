apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - elasticsearch.yaml
  - setup-job.yaml
configMapGenerator:
  - name: search-es-setup
    namespace: elastic
    files:
      - setup.sh
      - template-products.json
      - template-logs.json
generatorOptions:
  disableNameSuffixHash: true
