# prod: 3 dedicated masters, 3 hot, 2 warm, 1 frozen (searchable snapshots — needs an Enterprise licence and the
# "afrotransact-snapshots" repository registered against the cloud bucket: s3 / gcs / azure; see snapshot-repo note).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
configMapGenerator:
  - name: search-es-setup
    namespace: elastic
    behavior: merge
    files: [ilm-logs.json]
patches:
  - target: {kind: Elasticsearch, name: search}
    patch: |-
      - op: replace
        path: /spec/nodeSets
        value:
          - name: master
            count: 3
            config: {node.roles: [master], node.store.allow_mmap: false}
            podTemplate:
              spec:
                containers:
                  - name: elasticsearch
                    resources: {requests: {cpu: 500m, memory: 2Gi}, limits: {memory: 2Gi}}
            volumeClaimTemplates:
              - metadata: {name: elasticsearch-data}
                spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
          - name: hot
            count: 3
            config:
              node.roles: [data_hot, data_content, ingest]
              node.store.allow_mmap: false
              xpack.ml.enabled: false
            podTemplate:
              spec:
                containers:
                  - name: elasticsearch
                    resources: {requests: {cpu: "4", memory: 16Gi}, limits: {memory: 16Gi}}
            volumeClaimTemplates:
              - metadata: {name: elasticsearch-data}
                spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 200Gi}}}
          - name: warm
            count: 2
            config: {node.roles: [data_warm], node.store.allow_mmap: false}
            podTemplate:
              spec:
                containers:
                  - name: elasticsearch
                    resources: {requests: {cpu: "1", memory: 8Gi}, limits: {memory: 8Gi}}
            volumeClaimTemplates:
              - metadata: {name: elasticsearch-data}
                spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Ti}}}
          - name: frozen
            count: 1
            config:
              node.roles: [data_frozen]
              node.store.allow_mmap: false
              xpack.searchable.snapshot.shared_cache.size: 90%
            podTemplate:
              spec:
                containers:
                  - name: elasticsearch
                    resources: {requests: {cpu: "1", memory: 8Gi}, limits: {memory: 8Gi}}
            volumeClaimTemplates:
              - metadata: {name: elasticsearch-data}
                spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 200Gi}}}
  - target: {kind: Kibana, name: search}
    patch: |-
      - {op: replace, path: /spec/count, value: 2}
