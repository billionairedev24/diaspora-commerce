apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Previews run in the dev cluster only. Idle after 30 minutes without requests; outside Mon-Fri 07-21 (US Central)
# every preview sleeps until it is woken (annotation) or redeployed.
resources:
  - ../../base
configMapGenerator:
  - name: preview-idle-scaler-settings
    namespace: previews-system
    literals:
      - IDLE_MINUTES=30
      - UPTIME_DAYS=Mon-Fri
      - UPTIME_HOURS=07-21
      - UPTIME_TZ=America/Chicago
      - PROMETHEUS_URL=http://kube-prometheus-stack-prometheus.observability:9090
      - DRY_RUN=false
