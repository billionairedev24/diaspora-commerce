# cloud=aws: S3 via IRSA / EKS Pod Identity. Bucket names + role ARN are set in envs/<env>/loki.yaml.
loki:
  storage:
    type: s3
    s3:
      region: us-east-1
      s3ForcePathStyle: false
      insecure: false
  schemaConfig:
    configs:
      - {from: "2024-01-01", store: tsdb, object_store: s3, schema: v13, index: {prefix: loki_index_, period: 24h}}
  compactor: {delete_request_store: s3}
