# cloud=azure: Blob Storage via Azure Workload Identity. Account / container names + client id in envs/<env>/loki.yaml.
loki:
  storage:
    type: azure
    azure:
      useFederatedToken: true
  schemaConfig:
    configs:
      - {from: "2024-01-01", store: tsdb, object_store: azure, schema: v13, index: {prefix: loki_index_, period: 24h}}
  compactor: {delete_request_store: azure}
  podLabels:
    azure.workload.identity/use: "true"
