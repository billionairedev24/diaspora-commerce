# cloud=gcp: GCS via GKE Workload Identity. Bucket names + GSA are set in envs/<env>/loki.yaml.
loki:
  storage:
    type: gcs
  schemaConfig:
    configs:
      - {from: "2024-01-01", store: tsdb, object_store: gcs, schema: v13, index: {prefix: loki_index_, period: 24h}}
  compactor: {delete_request_store: gcs}
