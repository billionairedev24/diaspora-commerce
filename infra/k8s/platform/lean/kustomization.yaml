# Lean (single-node) platform data plane for prod on OVH. Everything here runs in the cluster EXCEPT Postgres (Layerbase).
#   Kafka         events and the outbox relay (sign-up codes go through it)      kafka.yaml
#   Temporal      checkout saga, state in Layerbase (temporal, temporal_visibility)  temporal.yaml
#   Valkey        cache, sessions, carts, rate limits                            data/valkey.yaml
#   Meilisearch   search index (rebuildable)                                     data/meilisearch.yaml
#   backup        nightly pg_dump of the 18 databases to another vendor's bucket backup/
#   alloy         Grafana Alloy + kube-state-metrics: metrics and logs to Grafana Cloud    alloy/
# NOT here on purpose: OpenFGA, Elasticsearch, MinIO, Mailpit, Kafka UI, Prometheus/Loki/Grafana (Grafana Cloud: traces via the OTel
# collector, metrics and logs via Alloy), Postgres (postgres-trial.yaml is for throwaway trials only).
# Secrets are not in git in clear and not synced by Argo CD: infra/ops/secrets/apply.sh (SOPS/age). Optional OKMS path:
# external-secrets/. Sizing and the memory table: docs/engineering/cloud-cost.md. Argo CD: platform-manifests element `lean`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: afrotransact-platform}
    includeSelectors: false
resources:
  - namespaces.yaml
  - data/namespace.yaml
  - kafka.yaml
  - temporal.yaml
  - data/valkey.yaml
  - data/meilisearch.yaml
  - backup
  - alloy
  # - data/postgres-trial.yaml   # TRIAL ONLY: a Postgres pod on the node's disk (never production)
