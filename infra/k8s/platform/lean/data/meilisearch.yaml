# Meilisearch in the cluster (SEARCH_PROVIDER=meilisearch): ~500 MB, 5 GiB disk. The index is rebuildable
# (`kubectl -n afrotransact-prod create job --from=cronjob/indexer-reindex`, docs/runbooks/kafka-replay.md section 5.1),
# so losing the disk costs time, not data. Services reach it at http://meilisearch.data.svc.cluster.local:7700
# (MEILISEARCH_URL). Secret "meilisearch" (namespace data): MEILI_MASTER_KEY (= MEILISEARCH_API_KEY of search and indexer).
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: data
spec:
  selector: {app.kubernetes.io/name: meilisearch}
  ports:
    - {name: http, port: 7700}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: data
spec:
  serviceName: meilisearch
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: meilisearch}
  template:
    metadata:
      labels: {app.kubernetes.io/name: meilisearch}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.12
          envFrom:
            - secretRef: {name: meilisearch}
          env:
            - {name: MEILI_ENV, value: production}
            - {name: MEILI_NO_ANALYTICS, value: "true"}
            - {name: MEILI_DB_PATH, value: /meili_data}
            - {name: MEILI_MAX_INDEXING_MEMORY, value: 256MiB}
            # /metrics (Prometheus) is experimental in v1.12 and needs the master key as bearer token: scraped by Alloy.
            - {name: MEILI_EXPERIMENTAL_ENABLE_METRICS, value: "true"}
          ports:
            - {name: http, containerPort: 7700}
          readinessProbe:
            httpGet: {path: /health, port: 7700}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /meili_data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meilisearch
  namespace: data
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: meilisearch}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/part-of: afrotransact}
      ports:
        - {port: 7700}
    # Grafana Alloy (namespace observability) scrapes metrics.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {port: 7700}
