# Valkey in the cluster (cache, sessions, carts, live feed fan-out): ~200 MB, append-only file on a 2 GiB disk so a restart
# keeps carts and sessions. Used for the TRIAL and for option B of docs/engineering/cloud-cost.md (Layerbase 4 GB for
# Postgres only). Services reach it at valkey.data.svc.cluster.local:6379 (REDIS_URL / REDIS_ADDR); the password is
# ExternalSecret key afrotransact/valkey, property password. Not highly available.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: valkey}
  data:
    - {secretKey: VALKEY_PASSWORD, remoteRef: {key: afrotransact/valkey, property: password}}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: data
spec:
  selector: {app.kubernetes.io/name: valkey}
  ports:
    - {name: redis, port: 6379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: data
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: valkey}
  template:
    metadata:
      labels: {app.kubernetes.io/name: valkey}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          command: ["sh", "-c", 'exec valkey-server --requirepass "$VALKEY_PASSWORD" --appendonly yes --dir /data --maxmemory 192mb --maxmemory-policy volatile-lru']
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: valkey, key: VALKEY_PASSWORD}
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  namespace: data
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: valkey}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/part-of: afrotransact}
      ports:
        - {port: 6379}
