# Valkey in the cluster (cache, sessions, carts, live feed fan-out, rate-limit buckets): ~200 MB, append-only file on a 2 GiB
# disk so a restart keeps carts and sessions. Services reach it at valkey.data.svc.cluster.local:6379 (REDIS_URL / REDIS_ADDR
# = redis://:<password>@valkey.data.svc.cluster.local:6379). Secret "valkey" (namespace data): VALKEY_PASSWORD.
# Not highly available; the data is a cache (carts also live in Postgres), so it is NOT backed up.
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: data
spec:
  selector: {app.kubernetes.io/name: valkey}
  ports:
    - {name: redis, port: 6379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: data
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: valkey}
  template:
    metadata:
      labels: {app.kubernetes.io/name: valkey}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          command: ["sh", "-c", 'exec valkey-server --requirepass "$VALKEY_PASSWORD" --appendonly yes --dir /data --maxmemory 192mb --maxmemory-policy volatile-lru']
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: valkey, key: VALKEY_PASSWORD}
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  namespace: data
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: valkey}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/part-of: afrotransact}
      ports:
        - {port: 6379}
    # Grafana Alloy (namespace observability) scrapes metrics.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {port: 6379}
