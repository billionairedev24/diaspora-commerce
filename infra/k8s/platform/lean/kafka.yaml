# Single-node Apache Kafka (KRaft, no ZooKeeper): broker and controller in one pod, 10 GiB disk, 3 days of retention.
# Enough for ~20-200 users of event traffic (a few events per order); it is NOT highly available. A node restart
# pauses event delivery for ~30 s and producers/consumers reconnect; nothing is lost (offsets and logs are on the disk).
# Topics are auto-created on first use (3 partitions) so Terraform's Confluent topic module is not needed.
# The <topic>.dlq dead-letter topics are the exception: the kafka-dlq-topics Job at the end creates them with 14-day
# retention (the 3-day broker default is too short to triage a DLQ); docs/runbooks/kafka-replay.md. Keep its list in
# step with contracts/asyncapi/events.yaml: `tools/ops/dlq-topics.sh --check`.
# Services reach it at kafka.kafka.svc.cluster.local:9092 (KAFKA_BOOTSTRAP), plaintext, inside the cluster network only.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: kafka}
  ports:
    - {name: broker, port: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels: {app.kubernetes.io/name: kafka}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - {name: broker, containerPort: 9092}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://localhost:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.kafka.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_LOG_RETENTION_HOURS, value: "72"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx384m"}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 640Mi}
            limits: {memory: 896Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
---
# Only AfroTransact service namespaces (labelled by Argo CD) reach the broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
  namespace: kafka
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kafka}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/part-of: afrotransact}
      ports:
        - {port: 9092}
    # The DLQ topic Job below runs in this namespace.
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: kafka-dlq-topics}
      ports:
        - {port: 9092}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-dlq-topics
  namespace: kafka
  labels: {app.kubernetes.io/name: kafka-dlq-topics}
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka-dlq-topics}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: create
          image: apache/kafka:4.1.0
          command:
            - /bin/bash
            - -ec
            - |
              KT=/opt/kafka/bin/kafka-topics.sh
              for topic in $TOPICS; do
                "$KT" --bootstrap-server kafka-0.kafka.kafka.svc.cluster.local:9092 --create --if-not-exists \
                  --topic "$topic" --partitions 3 --replication-factor 1 --config retention.ms=1209600000
              done
          env:
            - name: TOPICS
              value: >-
                at.ads.events.dlq at.ai-handoff.events.dlq at.bookings.events.dlq at.carrier-shipment.events.dlq
                at.category-request.events.dlq at.content.events.dlq at.delivery-runs.events.dlq
                at.fulfilment.events.dlq at.identity.events.dlq at.inventory-inbound.events.dlq
                at.inventory-reconciliation.events.dlq at.inventory-reservation.events.dlq at.inventory.events.dlq
                at.mcp-tool.events.dlq at.offers.events.dlq at.order.events.dlq at.payment.events.dlq
                at.payout.events.dlq at.product-import.events.dlq at.product-review.events.dlq at.product.events.dlq
                at.retail.events.dlq at.search.events.dlq at.seller-application.events.dlq
                at.seller-compliance.events.dlq at.seller-org.events.dlq at.seller-subscription.events.dlq
                at.taxonomy.events.dlq at.taxreturns.events.dlq at.trustops.events.dlq
                at.indexer.dlq.events at.authz-sync.dlq.events
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
