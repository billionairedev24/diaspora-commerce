apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
  - r2-cronjob.yaml
configMapGenerator:
  - name: pg-backup-script
    namespace: ops
    files:
      - pg-backup.sh
  - name: r2-backup-script
    namespace: ops
    files:
      - r2-backup.sh
generatorOptions:
  disableNameSuffixHash: true
