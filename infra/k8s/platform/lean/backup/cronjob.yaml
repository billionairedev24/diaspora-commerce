# Nightly pg_dump of every database on the external Postgres (Layerbase) to this environment's Backblaze B2 bucket (S3 API, rclone),
# age-encrypted, RETENTION_DAYS kept (default 14, the owner may set 7; RPO 24 h). Cloudflare R2 is NOT used for backups. Script:
# pg-backup.sh (same directory). Restore: infra/ops/backup/pg-restore.sh. Setup, retention, lifecycle and key rotation:
# docs/runbooks/backups-backblaze.md; drill: docs/runbooks/restore-drill.md. The job fails until the Secret pg-backup exists
# (infra/ops/secrets/apply.sh).
#
# Secret pg-backup (namespace ops) keys: PGHOST PGPORT PGUSER PGPASSWORD PGSSLMODE AGE_RECIPIENT
#   B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET B2_ENDPOINT [B2_REGION]    one bucket and one key per environment (test | prod)
#   [RETENTION_DAYS RETENTION_MODE BACKUP_ENV PUSHGATEWAY_URL HEALTHCHECK_URL]
# A failed or missed run must page someone: the alert BackupStale (infra/observability/rules/backup.yaml, kube-state-metrics) and,
# optionally, HEALTHCHECK_URL (a dead-man's-switch service). The run's total size is logged as one backup_metrics line.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: ops
  labels: {app.kubernetes.io/name: pg-backup, app.kubernetes.io/part-of: afrotransact-platform}
spec:
  schedule: "15 3 * * *" # 03:15 UTC = late evening in Texas, the quietest hours of a US shopper base
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app.kubernetes.io/name: pg-backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: backup
              image: postgres:17-alpine
              command: ["/bin/sh", "/scripts/pg-backup.sh"]
              envFrom:
                - secretRef: {name: pg-backup}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext:
                # Runs as root with the default capability set ONLY because `apk add` (rclone, age, curl) needs chown; a
                # pre-built tools image would allow runAsNonRoot and drop ALL (follow-up, see docs/runbooks/ovh-production.md).
                allowPrivilegeEscalation: false
                seccompProfile: {type: RuntimeDefault}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: work, mountPath: /work}
          volumes:
            - name: scripts
              configMap: {name: pg-backup-script, defaultMode: 0555}
            - name: work
              emptyDir: {sizeLimit: 4Gi}
