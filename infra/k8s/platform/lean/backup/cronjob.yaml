# Nightly pg_dump of every database on the external Postgres (Layerbase) to this environment's Backblaze B2 bucket (S3 API, rclone),
# age-encrypted, RETENTION_DAYS kept (default 14, the owner may set 7; RPO 24 h). Cloudflare R2 is NOT used for backups. Script:
# pg-backup.sh (same directory). Restore: infra/ops/backup/pg-restore.sh. Setup, retention, lifecycle and key rotation:
# docs/runbooks/backups-backblaze.md; drill: docs/runbooks/restore-drill.md. The job fails until the Secret pg-backup exists
# (infra/ops/secrets/apply.sh).
#
# Secret pg-backup (namespace ops) keys: PGHOST PGPORT PGUSER PGPASSWORD PGSSLMODE AGE_RECIPIENT
#   B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET B2_ENDPOINT [B2_REGION]    one bucket and one key per environment (test | prod)
#   [RETENTION_DAYS RETENTION_MODE BACKUP_ENV PUSHGATEWAY_URL HEALTHCHECK_URL]
# A failed or missed run must page someone: the alert BackupStale (infra/observability/rules/backup.yaml, kube-state-metrics) and,
# optionally, HEALTHCHECK_URL (a dead-man's-switch service). The run's total size is logged as one backup_metrics line.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: ops
  labels: {app.kubernetes.io/name: pg-backup, app.kubernetes.io/part-of: afrotransact-platform}
spec:
  schedule: "15 3 * * *" # 03:15 UTC = late evening in Texas, the quietest hours of a US shopper base
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app.kubernetes.io/name: pg-backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # Pull secret "ghcr" is optional: not needed when the backup-tools package is public (docs/runbooks/read-only-root-first-boot.md).
          imagePullSecrets:
            - name: ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 70       # "postgres" user of the Alpine postgres image the tools image is built from
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              # Tools image (infra/ops/backup-tools/Dockerfile, built by .github/workflows/backup-tools-image.yml): pg client, rclone, age, curl
              # are baked in, so nothing is installed at run time and the container needs no root.
              image: ghcr.io/billionairedev24/diaspora-commerce/backup-tools:1.0.0
              command: ["/bin/sh", "/scripts/pg-backup.sh"]
              env:
                - {name: SKIP_APK, value: "1"}   # the tools are in the image
              envFrom:
                - secretRef: {name: pg-backup}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true   # KSV-0014. Writable: /work (dumps, scratch) and /tmp (HOME, rclone cache)
                runAsNonRoot: true
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap: {name: pg-backup-script, defaultMode: 0555}
            - name: work
              emptyDir: {sizeLimit: 4Gi}
            - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
