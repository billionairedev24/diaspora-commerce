# OPTIONAL: External Secrets Operator + OKMS (OVH Secret Manager) as the source of the platform Secrets. NOT part of the default
# prod path (that is SOPS/age applied by infra/ops/secrets/apply.sh) and NOT verified against a live OVH account.
# To use it: install the external-secrets chart (add it to applicationsets/lean/platform-charts.yaml), sync
# infra/k8s/platform/secret-stores/ovh (ClusterSecretStore platform-secrets), add this directory to ../kustomization.yaml,
# remove `secrets.plain` from infra/argocd/envs/prod/platform-values.yaml, and write the secrets into OKMS under
#   afrotransact/temporal (host, port, user, password)   afrotransact/valkey (password)   afrotransact/meilisearch (master-key)
#   afrotransact/grafana-cloud (endpoint, instance-id, api-token)   afrotransact/grafana-cloud-alloy (env, prom-url, prom-user, loki-url, loki-user, token, valkey-password, meili-master-key)   afrotransact/prod/cloudflared (token)   afrotransact/prod/<service>
# Same Secret names and keys as the SOPS path, so the workloads do not change.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal
  namespace: temporal
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: temporal}
  data:
    - {secretKey: POSTGRES_SEEDS, remoteRef: {key: afrotransact/temporal, property: host}}
    - {secretKey: DB_PORT, remoteRef: {key: afrotransact/temporal, property: port}}
    - {secretKey: POSTGRES_USER, remoteRef: {key: afrotransact/temporal, property: user}}
    - {secretKey: POSTGRES_PWD, remoteRef: {key: afrotransact/temporal, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: valkey}
  data:
    - {secretKey: VALKEY_PASSWORD, remoteRef: {key: afrotransact/valkey, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meilisearch
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: meilisearch}
  data:
    - {secretKey: MEILI_MASTER_KEY, remoteRef: {key: afrotransact/meilisearch, property: master-key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-otlp
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: grafana-cloud-otlp}
  data:
    - {secretKey: GRAFANA_OTLP_ENDPOINT, remoteRef: {key: afrotransact/grafana-cloud, property: endpoint}}
    - {secretKey: GRAFANA_INSTANCE_ID, remoteRef: {key: afrotransact/grafana-cloud, property: instance-id}}
    - {secretKey: GRAFANA_API_TOKEN, remoteRef: {key: afrotransact/grafana-cloud, property: api-token}}
---
# Tunnel token for cloudflared (edge/base/cloudflared.yaml): `cloudflared tunnel token <tunnel id>`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
  namespace: ingress
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: cloudflared}
  data:
    - secretKey: token
      remoteRef: {key: afrotransact/prod/cloudflared, property: token}
---
# Grafana Alloy (metrics + logs; infra/k8s/platform/lean/alloy). Same Secret name and keys as the SOPS path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-alloy
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: grafana-cloud-alloy}
  data:
    - {secretKey: CLUSTER_ENV, remoteRef: {key: afrotransact/grafana-cloud-alloy, property: env}}
    - {secretKey: GRAFANA_PROM_URL, remoteRef: {key: afrotransact/grafana-cloud-alloy, property: prom-url}}
    - {secretKey: GRAFANA_PROM_USER, remoteRef: {key: afrotransact/grafana-cloud-alloy, property: prom-user}}
    - {secretKey: GRAFANA_LOKI_URL, remoteRef: {key: afrotransact/grafana-cloud-alloy, property: loki-url}}
    - {secretKey: GRAFANA_LOKI_USER, remoteRef: {key: afrotransact/grafana-cloud-alloy, property: loki-user}}
    - {secretKey: GRAFANA_TOKEN, remoteRef: {key: afrotransact/grafana-cloud-alloy, property: token}}
    - {secretKey: VALKEY_PASSWORD, remoteRef: {key: afrotransact/valkey, property: password}}
    - {secretKey: MEILI_MASTER_KEY, remoteRef: {key: afrotransact/meilisearch, property: master-key}}
