# Self-hosted Temporal (checkout saga, billing schedules): one auto-setup pod runs all four server roles with the
# default 4 history shards, state in two databases on the external Postgres (Layerbase: temporal, temporal_visibility),
# namespace "afrotransact" created on first start. Replaces Temporal Cloud (USD 100+/month minimum).
# One replica means workflows pause (and resume) during a restart; they are durable in Postgres.
# Secret "temporal" (namespace temporal; infra/ops/secrets/apply.sh): POSTGRES_SEEDS (Layerbase host), DB_PORT, POSTGRES_USER
# (temporal_app), POSTGRES_PWD. Both databases are created by infra/tofu/scripts/postgres-bootstrap.sh BEFORE this starts
# (SKIP_DB_CREATE=true). Connections: DB_CONNECT_MAX_CONNS=5 per database, so at most 10 (docs/runbooks/ovh-production.md).
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: temporal
spec:
  selector: {app.kubernetes.io/name: temporal}
  ports:
    - {name: grpc, port: 7233}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
  labels: {app.kubernetes.io/name: temporal}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: temporal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: temporal}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.28.1
          ports:
            - {name: grpc, containerPort: 7233}
          envFrom:
            - secretRef: {name: temporal}
          env:
            - {name: DB, value: postgres12}
            - {name: DBNAME, value: temporal}
            - {name: VISIBILITY_DBNAME, value: temporal_visibility}
            - {name: SKIP_DB_CREATE, value: "true"}
            - {name: POSTGRES_TLS_ENABLED, value: "true"}
            - {name: DEFAULT_NAMESPACE, value: afrotransact}
            - {name: DEFAULT_NAMESPACE_RETENTION, value: 7d}
            - {name: NUM_HISTORY_SHARDS, value: "4"}
            - {name: SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES, value: "true"}
            - {name: TEMPORAL_ADDRESS, value: "temporal.temporal.svc.cluster.local:7233"}
            - {name: DB_CONNECT_MAX_CONNS, value: "5"}
          readinessProbe:
            tcpSocket: {port: 7233}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal
  namespace: temporal
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: temporal}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/part-of: afrotransact}
      ports:
        - {port: 7233}
