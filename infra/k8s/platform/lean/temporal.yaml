# Self-hosted Temporal (checkout saga, billing schedules): one auto-setup pod runs all four server roles with the
# default 4 history shards, state in two databases on the external Postgres (temporal, temporal_visibility), namespace
# "afrotransact" created on first start. Replaces Temporal Cloud (USD 100+/month minimum).
# One replica means workflows pause (and resume) during a restart; they are durable in Postgres.
# ExternalSecret key afrotransact/temporal: host, port, user, password (database role must be able to create both DBs,
# or create them first and keep SKIP_DB_CREATE=true as below).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal
  namespace: temporal
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: platform-secrets}
  target: {name: temporal}
  data:
    - {secretKey: POSTGRES_SEEDS, remoteRef: {key: afrotransact/temporal, property: host}}
    - {secretKey: DB_PORT, remoteRef: {key: afrotransact/temporal, property: port}}
    - {secretKey: POSTGRES_USER, remoteRef: {key: afrotransact/temporal, property: user}}
    - {secretKey: POSTGRES_PWD, remoteRef: {key: afrotransact/temporal, property: password}}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: temporal
spec:
  selector: {app.kubernetes.io/name: temporal}
  ports:
    - {name: grpc, port: 7233}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
  labels: {app.kubernetes.io/name: temporal}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: temporal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: temporal}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.28.1
          ports:
            - {name: grpc, containerPort: 7233}
          envFrom:
            - secretRef: {name: temporal}
          env:
            - {name: DB, value: postgres12}
            - {name: DBNAME, value: temporal}
            - {name: VISIBILITY_DBNAME, value: temporal_visibility}
            - {name: SKIP_DB_CREATE, value: "true"}
            - {name: POSTGRES_TLS_ENABLED, value: "true"}
            - {name: DEFAULT_NAMESPACE, value: afrotransact}
            - {name: DEFAULT_NAMESPACE_RETENTION, value: 7d}
            - {name: NUM_HISTORY_SHARDS, value: "4"}
            - {name: SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES, value: "true"}
            - {name: TEMPORAL_ADDRESS, value: "temporal.temporal.svc.cluster.local:7233"}
            - {name: DB_CONNECT_MAX_CONNS, value: "5"}
          readinessProbe:
            tcpSocket: {port: 7233}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal
  namespace: temporal
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: temporal}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/part-of: afrotransact}
      ports:
        - {port: 7233}
