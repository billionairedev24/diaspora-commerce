# SOPS rules for the production Secrets in ./prod. Replace the placeholder with the age PUBLIC keys of the two people who may
# decrypt (`age-keygen` prints it; keep the private key offline, never in git). Two recipients so one lost laptop is not a lockout.
# Only the `data`/`stringData` values are encrypted, so a diff still shows which keys exist.
creation_rules:
  - path_regex: prod/.*\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1REPLACE_WITH_FIRST_PUBLIC_KEY,
      age1REPLACE_WITH_SECOND_PUBLIC_KEY
