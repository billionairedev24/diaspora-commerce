# Local Prometheus (docker compose), Release 1 (ADR 0011): the application targets are the two deployables of the modular monolith,
#   afrotransact-core   (Java, every module)  host.docker.internal:8120/actuator/prometheus
#   afrotransact-go     (Go, every module)    host.docker.internal:8200/metrics   (`make up` runs it on 8200)
# Per-module series come from LABELS, never from extra ports: every series carries `module` and `service` (the module's old short
# name: catalog, orders, cart, search ...), so the dashboards and rules that select on `service` keep working. Process-level series
# (jvm_*, process_*, go_*, up) carry service/job = the deployable. The old per-service ports (8100-8115 served by core for
# compatibility, 8201-8209 only with STACK=services) are NOT scraped: they would duplicate every series. Standalone services
# (STACK=services) are not monitored by this file; add a job for them in a local, uncommitted copy if you need it.
# Targets that are not running show as down (the local Alertmanager silences ServiceDown for env=local).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local
    cluster: docker-compose

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# honor_labels: true is what the Alloy job does in production too: the application's own `service` and `module` tags win over the
# target's. Without it the target label (afrotransact-core) would replace every module's service value and the app's would be
# renamed exported_service. job = the deployable, as the Kubernetes pod discovery sets it.
scrape_configs:
  - job_name: afrotransact-core
    metrics_path: /actuator/prometheus
    honor_labels: true
    fallback_scrape_protocol: PrometheusText0.0.4
    # One target exposes what 14 services did; a runaway guard well above the expected size.
    sample_limit: 40000
    scrape_timeout: 10s
    static_configs:
      - targets: [host.docker.internal:8120]
        labels: {service: afrotransact-core, env: local, runtime: java}

  - job_name: afrotransact-go
    metrics_path: /metrics
    honor_labels: true
    fallback_scrape_protocol: PrometheusText0.0.4
    sample_limit: 40000
    scrape_timeout: 10s
    # In local and dev /metrics is on the public listener (:8200); when MANAGEMENT_ADDR is set the metrics move to that
    # listener, point this target at it (uat and prod always use the management listener, :9090 in the chart).
    static_configs:
      - targets: [host.docker.internal:8200]
        labels: {service: afrotransact-go, env: local, runtime: go}

  # ---- platform / infrastructure ----
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090], labels: {env: local}}]
  - job_name: alertmanager
    static_configs: [{targets: [alertmanager:9093], labels: {env: local}}]
  - job_name: otel-collector
    static_configs: [{targets: [otel-collector:8888], labels: {env: local}}]
  - job_name: grafana
    static_configs: [{targets: [grafana:3000], labels: {env: local}}]
  - job_name: loki
    static_configs: [{targets: [loki:3100], labels: {env: local}}]
  - job_name: tempo
    static_configs: [{targets: [tempo:3200], labels: {env: local}}]
  - job_name: postgres
    static_configs: [{targets: [postgres-exporter:9187], labels: {instance: postgres, env: local}}]
  - job_name: elasticsearch
    static_configs: [{targets: [elasticsearch-exporter:9114], labels: {instance: elasticsearch, env: local}}]
  - job_name: kafka
    static_configs: [{targets: [kafka-exporter:9308], labels: {instance: kafka, env: local}}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121], labels: {instance: valkey, env: local}}]
  - job_name: temporal
    static_configs: [{targets: [temporal:8000], labels: {env: local}}]
  - job_name: openfga
    static_configs: [{targets: [openfga:2112], labels: {env: local}}]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{targets: [minio:9000], labels: {env: local}}]
