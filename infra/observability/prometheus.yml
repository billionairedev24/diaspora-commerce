# Local Prometheus (docker compose). Generated service lists mirror infra/local/PORTS.md: every service is
# scraped on host.docker.internal:<port>, which reaches both services run from the IDE and containers of the
# compose "apps" profile (they publish the same host port). Targets that are not running simply show as down
# (the local Alertmanager silences ServiceDown for env=local).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local
    cluster: docker-compose

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# Normalise every app target: job = service name (as the Kubernetes ServiceMonitors do), env = local.
# The scraped Spring "service" tag (catalog-service) is kept as exported_service.
scrape_configs:
  - job_name: java-services
    metrics_path: /actuator/prometheus
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: [host.docker.internal:8100]
        labels: {service: identity}
      - targets: [host.docker.internal:8101]
        labels: {service: catalog}
      - targets: [host.docker.internal:8102]
        labels: {service: offers}
      - targets: [host.docker.internal:8103]
        labels: {service: inventory}
      - targets: [host.docker.internal:8104]
        labels: {service: orders}
      - targets: [host.docker.internal:8105]
        labels: {service: payments}
      - targets: [host.docker.internal:8106]
        labels: {service: seller}
      - targets: [host.docker.internal:8107]
        labels: {service: retail}
      - targets: [host.docker.internal:8108]
        labels: {service: fulfilment}
      - targets: [host.docker.internal:8109]
        labels: {service: bookings}
      - targets: [host.docker.internal:8110]
        labels: {service: trust-ops}
      - targets: [host.docker.internal:8111]
        labels: {service: tax-returns}
      - targets: [host.docker.internal:8112]
        labels: {service: content}
      - targets: [host.docker.internal:8113]
        labels: {service: ai-gateway}
      - targets: [host.docker.internal:8114]
        labels: {service: mcp-server}
    relabel_configs:
      - source_labels: [service]
        target_label: job
      - target_label: env
        replacement: local
      - target_label: runtime
        replacement: java

  - job_name: go-services
    metrics_path: /metrics
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: [host.docker.internal:8200]
        labels: {service: gateway-bff}
      - targets: [host.docker.internal:8201]
        labels: {service: search}
      - targets: [host.docker.internal:8202]
        labels: {service: indexer}
      - targets: [host.docker.internal:8203]
        labels: {service: cart}
      - targets: [host.docker.internal:8204]
        labels: {service: promise}
      - targets: [host.docker.internal:8205]
        labels: {service: geo}
      - targets: [host.docker.internal:8206]
        labels: {service: storefront}
      - targets: [host.docker.internal:8207]
        labels: {service: media}
      - targets: [host.docker.internal:8208]
        labels: {service: notifications}
      - targets: [host.docker.internal:8209]
        labels: {service: carrier-gateway}
    relabel_configs:
      - source_labels: [service]
        target_label: job
      - target_label: env
        replacement: local
      - target_label: runtime
        replacement: go

  # ---- platform / infrastructure ----
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090], labels: {env: local}}]
  - job_name: alertmanager
    static_configs: [{targets: [alertmanager:9093], labels: {env: local}}]
  - job_name: otel-collector
    static_configs: [{targets: [otel-collector:8888], labels: {env: local}}]
  - job_name: grafana
    static_configs: [{targets: [grafana:3000], labels: {env: local}}]
  - job_name: loki
    static_configs: [{targets: [loki:3100], labels: {env: local}}]
  - job_name: tempo
    static_configs: [{targets: [tempo:3200], labels: {env: local}}]
  - job_name: postgres
    static_configs: [{targets: [postgres-exporter:9187], labels: {instance: postgres, env: local}}]
  - job_name: elasticsearch
    static_configs: [{targets: [elasticsearch-exporter:9114], labels: {instance: elasticsearch, env: local}}]
  - job_name: kafka
    static_configs: [{targets: [kafka-exporter:9308], labels: {instance: kafka, env: local}}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121], labels: {instance: valkey, env: local}}]
  - job_name: temporal
    static_configs: [{targets: [temporal:8000], labels: {env: local}}]
  - job_name: openfga
    static_configs: [{targets: [openfga:2112], labels: {env: local}}]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{targets: [minio:9000], labels: {env: local}}]
