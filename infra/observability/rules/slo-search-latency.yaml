- name: slo-search_latency-alerts
  rules:
  - alert: SearchLatencyBudgetBurn
    expr: |-
      (slo:sli_error:ratio_rate1h{slo="search_latency"} > (14.4 * 0.05) and slo:sli_error:ratio_rate5m{slo="search_latency"} > (14.4 * 0.05))
      or
      (slo:sli_error:ratio_rate6h{slo="search_latency"} > (6 * 0.05) and slo:sli_error:ratio_rate30m{slo="search_latency"} > (6 * 0.05))
    for: 2m
    labels:
      severity: page
      slo: search_latency
      team: search
    annotations:
      runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/SearchLatencyBudgetBurn.md
      dashboard: /d/at-business-slo
      summary: Search p95 < 150 ms SLO is burning its error budget (fast burn)
      description: "{{ $labels.env }}: error ratio {{ $value | humanizePercentage }} \u2014 at this rate the 30-day budget (0.05) is gone in < 2 days."
  - alert: SearchLatencyBudgetBurn
    expr: |-
      (slo:sli_error:ratio_rate1d{slo="search_latency"} > (3 * 0.05) and slo:sli_error:ratio_rate2h{slo="search_latency"} > (3 * 0.05))
      or
      (slo:sli_error:ratio_rate3d{slo="search_latency"} > (1 * 0.05) and slo:sli_error:ratio_rate6h{slo="search_latency"} > (1 * 0.05))
    for: 15m
    labels:
      severity: ticket
      slo: search_latency
      team: search
    annotations:
      runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/SearchLatencyBudgetBurn.md
      dashboard: /d/at-business-slo
      summary: Search p95 < 150 ms SLO is burning its error budget (slow burn)
