# Service health alerts for every Java (Micrometer) and Go (go/pkg/httpserver) service.
# Prometheus rule file; also rendered as a PrometheusRule CR (infra/k8s/platform/observability/prometheus-rules).
groups:
  - name: afrotransact-services-recording
    interval: 30s
    rules:
      - record: service:http_requests:rate5m
        expr: |
          sum by (env, service) (rate(http_server_requests_seconds_count[5m]))
          or
          sum by (env, service) (rate(http_server_requests_total[5m]))
      - record: service:http_errors_5xx:rate5m
        expr: |
          sum by (env, service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          or
          sum by (env, service) (rate(http_server_requests_total{status=~"5.."}[5m]))
      - record: service:http_latency_seconds:p95_5m
        expr: |
          histogram_quantile(0.95, sum by (env, service, le) (rate(http_server_requests_seconds_bucket[5m])))
          or
          histogram_quantile(0.95, sum by (env, service, le) (rate(http_server_request_duration_seconds_bucket[5m])))

  - name: afrotransact-services
    rules:
      - alert: ServiceDown
        expr: up{service=~"identity|catalog|offers|inventory|orders|payments|seller|retail|fulfilment|bookings|trust-ops|tax-returns|content|ai-gateway|mcp-server|gateway-bff|search|indexer|cart|promise|geo|media|notifications|carrier-gateway"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }} is down in {{ $labels.env }}"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.service }}) for 2 minutes."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/ServiceDown.md
          dashboard: /d/at-platform-overview

      - alert: HighErrorRate
        expr: |
          (service:http_errors_5xx:rate5m / (service:http_requests:rate5m > 0.1)) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }} returns 5xx for {{ $value | humanizePercentage }} of requests"
          description: "More than 5% of {{ $labels.service }} requests in {{ $labels.env }} failed with 5xx over 5 minutes."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/HighErrorRate.md
          dashboard: /d/at-platform-overview

      - alert: HighLatency
        expr: |
          service:http_latency_seconds:p95_5m{service!="search"} > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }} p95 latency is {{ $value | humanizeDuration }}"
          description: "p95 latency of {{ $labels.service }} in {{ $labels.env }} has been above 1 s for 10 minutes (search has its own 150 ms SLO)."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/HighLatency.md
          dashboard: /d/at-platform-overview

      - alert: DatabasePoolSaturation
        expr: |
          max by (env, service, pool) (hikaricp_connections_active / hikaricp_connections_max) > 0.9
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }} Hikari pool {{ $labels.pool }} is {{ $value | humanizePercentage }} busy"
          description: "Requests will queue for connections; check slow queries and pool size."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/DatabasePoolSaturation.md
          dashboard: /d/at-jvm

      - alert: OutboxBacklogGrowing
        expr: |
          max by (env, service) (outbox_pending_events) > 1000
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service }} has {{ $value }} unrelayed outbox events"
          description: "The transactional outbox relay is not keeping up or cannot reach Kafka."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/OutboxBacklogGrowing.md
          dashboard: /d/at-jvm

      - alert: OtelCollectorExportFailures
        expr: |
          sum by (env, exporter) (rate(otelcol_exporter_send_failed_spans_total[5m]))
          + sum by (env, exporter) (rate(otelcol_exporter_send_failed_metric_points_total[5m]))
          + sum by (env, exporter) (rate(otelcol_exporter_send_failed_log_records_total[5m])) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "OTel Collector exporter {{ $labels.exporter }} is failing"
          description: "Telemetry is being dropped on the way to Tempo / Prometheus / Loki."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/OtelCollectorExportFailures.md
