# Never sell without a tax decision (docs/engineering/tax-gate-paths.md). The catalog service exposes
# catalog_live_without_tax_decision: live listings that have a variant without a stored, resolved tax decision. It must always
# be 0. The catalog sweep closes any such listing within a minute, so the page fires on the first scrape that sees one and
# stays on until a person has looked at why a path skipped the gate.
groups:
  - name: afrotransact-catalog-tax-gate
    rules:
      - alert: CatalogLiveWithoutTaxDecision
        expr: |
          max by (env) (catalog_live_without_tax_decision) > 0
        for: 0m
        labels:
          severity: page
          team: catalog
        annotations:
          summary: "{{ $value }} live listing(s) have no resolved tax decision"
          description: "A product is live (purchasable) although a variant has no stored, resolved tax decision. The sweep closes it, but a code path skipped the tax gate: find it (runbook) before it happens again. Staff console: Fees & commissions > Sales tax > Tax review shows the list."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CatalogLiveWithoutTaxDecision.md

      - alert: CatalogTaxGateClosedListings
        expr: |
          sum by (env) (increase(catalog_tax_gate_closed_total[15m])) > 0
        for: 0m
        labels:
          severity: ticket
          team: catalog
        annotations:
          summary: "{{ $value }} live listing(s) were closed in the last 15 minutes because their tax decision was missing"
          description: "The tax gate closed live listings (a seller edit, a tax review result, or the sweep). Sellers see 'We are checking the tax details for this item'. Check the tax review queue is moving."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CatalogLiveWithoutTaxDecision.md

      - alert: CatalogTaxGateMetricMissing
        expr: |
          absent(catalog_live_without_tax_decision)
        for: 15m
        labels:
          severity: ticket
          team: catalog
        annotations:
          summary: "catalog_live_without_tax_decision is not reported"
          description: "The catalog service is down or its database count fails, so the live-without-tax-decision alert cannot fire."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CatalogLiveWithoutTaxDecision.md

      # Two sources of truth made the owner's bug: catalog said READY and listed the product, tax-returns (what checkout reads)
      # had not approved it. The catalog gate and sweep now ask tax-returns; every closing they do for that reason counts here.
      - alert: CatalogTaxReturnsDisagreement
        expr: |
          sum by (env) (increase(catalog_tax_gate_disagreement_total[30m])) > 0
        for: 0m
        labels:
          severity: ticket
          team: catalog
        annotations:
          summary: "{{ $value }} live listing(s) were closed because tax-returns does not resolve them but catalog said OK"
          description: "Catalog's own tax state and tax-returns' stored decision (the one checkout uses) disagreed. The listings were closed and announced, so search and carts dropped them. Check the Tax review queue and the tax.classification.changed consumer (catalog-tax-classification): a missed event is the usual cause."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CatalogLiveWithoutTaxDecision.md

      - alert: CatalogTaxReturnsUnreachable
        expr: |
          sum by (env) (increase(catalog_tax_gate_authority_unreachable_total[15m])) > 0
        for: 10m
        labels:
          severity: ticket
          team: catalog
        annotations:
          summary: "The catalog tax gate could not ask tax-returns for 10 minutes"
          description: "Listings keep their current state and nothing is marked OK, but no new listing can go live and nothing is verified until tax-returns answers. Check tax-returns health and catalog's tax:classify token."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CatalogLiveWithoutTaxDecision.md

      - alert: CatalogTaxReturnsCheckStale
        expr: |
          time() - max by (env) (catalog_tax_gate_authority_last_check_timestamp_seconds) > 1800
        for: 5m
        labels:
          severity: ticket
          team: catalog
        annotations:
          summary: "Live listings were last checked against tax-returns more than 30 minutes ago"
          description: "The sweep against tax-returns' stored decisions has not succeeded for 30 minutes (value 0 means never since start). Run POST /v1/tax-gate/sweep and read the catalog log."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CatalogLiveWithoutTaxDecision.md

      # S384: the second-seller gap. An offer on a page another seller created is live only when tax-returns holds a RESOLVED
      # decision for that seller on that ATIN (Offer.taxBasis). The offers service exposes offers_active_without_tax_decision:
      # ACTIVE offers with no tax basis. It must always be 0; the release component and the sweep hold or release offers, so a
      # value above 0 means a code path made an offer ACTIVE without asking tax-returns.
      - alert: OffersActiveWithoutTaxDecision
        expr: |
          max by (env) (offers_active_without_tax_decision) > 0
        for: 0m
        labels:
          severity: page
          team: offers
        annotations:
          summary: "{{ $value }} active offer(s) have no tax decision for their seller"
          description: "An offer is active (buyable, in search, in the buy box) although tax-returns holds no RESOLVED decision for that seller on that ATIN. Checkout still blocks the line, but shoppers see an offer they cannot buy. Find the path that set it ACTIVE (runbook); never write a decision by hand."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CatalogLiveWithoutTaxDecision.md

      - alert: OffersTaxGateMetricMissing
        expr: |
          absent(offers_active_without_tax_decision)
        for: 15m
        labels:
          severity: ticket
          team: offers
        annotations:
          summary: "offers_active_without_tax_decision is not reported"
          description: "The offers service is down or its database count fails, so the alert on active offers without a tax decision cannot fire."
          runbook_url: https://github.com/billionairedev24/diaspora-commerce/blob/main/docs/runbooks/CatalogLiveWithoutTaxDecision.md
