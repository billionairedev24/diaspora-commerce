# Local single-binary Loki with filesystem storage. Accepts OTLP logs at /otlp (from the OTel Collector);
# resource attributes service.name / deployment.environment become the service_name / deployment_environment labels,
# trace_id / span_id are kept as structured metadata (used for log -> trace links in Grafana).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.namespace, deployment.environment]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
