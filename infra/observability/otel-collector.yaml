# Local OpenTelemetry Collector (docker compose). The Kubernetes gateway uses the same pipeline shape —
# see infra/k8s/platform/values/opentelemetry-collector-gateway.yaml.
#
#   OTLP in (4317 gRPC / 4318 HTTP)
#     traces  -> tail sampling (errors + >500 ms + baseline %) -> Tempo
#     metrics -> Prometheus remote write
#     logs    -> Loki (native OTLP endpoint)
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["http://localhost:3000", "http://localhost:3001", "http://localhost:3002"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: insert
      - key: service.namespace
        value: afrotransact
        action: insert
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: keep-slow
        type: latency
        latency: {threshold_ms: 500}
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TAIL_SAMPLING_BASELINE_PERCENT}
  batch:
    send_batch_size: 8192
    timeout: 2s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion: {enabled: true}
    tls: {insecure: true}
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls: {insecure: true}
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
