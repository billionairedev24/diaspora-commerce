# Defaults merged under every service chart's values (documented here; the library itself renders nothing).
#
# image: the library never defaults the tag and refuses "latest" (Trivy KSV-0013). Set at least one of:
#   image.tag     immutable tag; CI's GitOps bump writes the full git sha into values-<env>.yaml.
#                 Service charts ship the sentinel "dev" until their first deploy (and for local renders).
#   image.digest  sha256:<64 hex>; rendered as <registry>/<repository>[:<tag>]@<digest>.
# A missing tag and digest, or tag "latest", fails `helm template` with a message naming the service.
#
# global (set ONCE per environment in infra/argocd/envs/<env>/platform-values.yaml, never in a service chart):
#   global.domain  the environment's public base domain: dev.<zone> | uat.<zone> | <zone> (prod); <zone> is the
#                  Cloudflare zone of infra/cloudflare.
#                  Every container gets PLATFORM_ENV, PLATFORM_DOMAIN and the derived PUBLIC_WEB_URL,
#                  SELLER_CENTER_URL, STAFF_CONSOLE_URL, API_BASE_URL, AUTH_ISSUER_URL and MEDIA_PUBLIC_URL
#                  (templates/_helpers.tpl "at-service.platformEnvVars"; docs/engineering/environments.md).
#   (Legacy, one-server test box only: the four environments set the explicit hosts below, generated from infra/cloudflare/hosts.json.)
#   global.storefrontHost  www | apex (default www): the customer storefront's canonical host, www.<domain> without global.webHost
#                  (PUBLIC_WEB_URL = https://www.<domain>; the apex only 301-redirects to it). apex is an explicit opt-out
#                  (PUBLIC_WEB_URL = https://<domain>). Every other app keeps its sub-domain (docs/engineering/environments.md,
#                  "Storefront host rule"). global.urls.PUBLIC_WEB_URL still wins over it.
#   global.sellerHost / global.adminHost  optional FULL host names (default empty = seller.<domain> / admin.<domain>):
#                  SELLER_CENTER_URL / STAFF_CONSOLE_URL = https://<host>. For the free Cloudflare certificate layout
#                  (docs/engineering/environments.md, "Free certificate layout (flat web hosts)"), e.g. seller-test.example.com.
#   global.webHost / global.apiHost / global.authHost / global.mediaHost  optional FULL host names for the storefront, the
#                  public API, identity and the public media CDN (default empty = the derived hosts above). The trial's flat
#                  layout (test.<zone>, api-test.<zone>, auth-test.<zone>, media-test.<zone>): one label under the zone, covered
#                  by Cloudflare's free certificate. webHost replaces the storefront host rule (www | apex) entirely.
#                  global.domain then stays the ZONE (PLATFORM_DOMAIN, the WebAuthn relying-party suffix).
#   global.urls    optional {ENV_NAME: value} overrides of a derived URL for the whole environment.
# A service's extraEnv entry of the same name wins over both. Unset global.domain renders PLATFORM_ENV only.
#
# secrets.plain: true   the pod still reads envFrom Secret <service>-secrets, but no ExternalSecret is rendered: the Secret is
#                       created by hand (single-node k3s without External Secrets: infra/ovh-vps/secrets.sh). Default false.
#
# postgresCA: {enabled: true, secretName: pg-ca, mountPath: /etc/pg-ca}   (F11, set per environment in platform-values.yaml)
#                       mounts the Secret <secretName> (key ca.crt: the managed Postgres provider's CA bundle) read-only at
#                       <mountPath> in every service, so DB_URL may carry sslmode=verify-full&sslrootcert=<mountPath>/ca.crt.
#                       Default off (sslmode=require). infra/ovh-vps/secrets.sh creates the Secret and the URLs from
#                       EXTERNAL_PG_SSLMODE / EXTERNAL_PG_SSLROOTCERT / EXTERNAL_PG_CA_FILE (docs/runbooks/postgres-tls.md).
#
# service.managementPort (default 9090): the private management listener. Java (MANAGEMENT_SERVER_PORT): all of actuator, so probes and
#                       /actuator/prometheus; Go (MANAGEMENT_ADDR): /metrics. Not behind Service port 80 or any Gateway route; Prometheus/Alloy
#                       scrape it (pod annotation, Service port `management`, NetworkPolicy from `observability`). Security audit F3.

# imagePullSecrets: [{name: ghcr}]   private registry credentials (kubectl create secret docker-registry); default none.
