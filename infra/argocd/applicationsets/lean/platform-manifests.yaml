# LEAN: only what a single-node prod needs (no observability content, Elasticsearch, Kyverno policies, previews or
# OpenFGA; adds the in-cluster Kafka, Temporal, Valkey, Meilisearch and the backup CronJob of infra/k8s/platform/lean).
# Plain-manifest / kustomize platform layers for one environment. manifestPath may contain CLOUD and ENV, replaced
# with platform-values.yaml's cloud and argocd.env.
# Secrets are NOT synced by Argo CD: they are SOPS/age files applied by infra/ops/secrets/apply.sh
# (docs/runbooks/ovh-production.md section 7). To use OKMS + External Secrets instead (optional, not verified against a live
# account): add the external-secrets chart to platform-charts.yaml, add the element
#   {component: secret-store, wave: "-3", manifestPath: infra/k8s/platform/secret-stores/CLOUD}
# below and `infra/k8s/platform/lean/external-secrets` to the lean kustomization.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/billionairedev24/diaspora-commerce.git
              revision: HEAD
              files:
                - path: infra/argocd/envs/ENV/platform-values.yaml     # patched per env
          - list:
              elements:
                - {component: namespaces, wave: "-10", manifestPath: infra/k8s/platform/namespaces}
                - {component: edge, wave: "-1", manifestPath: infra/k8s/platform/edge/overlays/ENV}
                - {component: lean, wave: "0", manifestPath: infra/k8s/platform/lean}
  template:
    metadata:
      name: '{{ .component }}-{{ .argocd.env }}'
      labels:
        app.kubernetes.io/part-of: afrotransact-platform
        afrotransact.com/env: '{{ .argocd.env }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: 'platform-{{ .argocd.env }}'
      source:
        repoURL: https://github.com/billionairedev24/diaspora-commerce.git
        targetRevision: '{{ .argocd.targetRevision }}'
        path: '{{ .manifestPath | replace "CLOUD" .cloud | replace "ENV" .argocd.env }}'
      destination:
        server: '{{ .argocd.destinationServer }}'
      syncPolicy:
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff: {duration: 15s, factor: 2, maxDuration: 5m}
  templatePatch: |
    {{- if .argocd.autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: {{ .argocd.prune }}
          selfHeal: {{ .argocd.selfHeal }}
    {{- end }}
