# Environment-wide values for the 8-day TRIAL: OVHcloud Managed Kubernetes (one b3-16 node, US East) + Layerbase PostgreSQL, web apps on
# Cloudflare Workers, FLAT single-label hosts under the zone (Cloudflare's free certificate covers the apex and one label only).
# A values overlay of prod (envs/trial/kustomization.yaml lists every difference): same prod profile, same 21 launch services.
#  1. Merged LAST into every service chart by the services ApplicationSet.
#  2. Read by the ApplicationSets (git files generator): the "argocd" block and "cloud".
#
# The hosts are generated (HOSTS block below) from the single map infra/cloudflare/hosts.json: `python3 tools/ci/env_hosts.py sync`.
# To run the trial in another zone: `python3 tools/ci/env_hosts.py set-trial-zone <zone>`; `check` proves every file agrees.
cloud: ovh

image:
  registry: ghcr.io/billionairedev24/diaspora-commerce

global:
  # HOSTS BEGIN (generated by tools/ci/env_hosts.py sync; edit infra/cloudflare/hosts.json)
  domain: afrotransact.com
  webHost: test.afrotransact.com
  sellerHost: seller-test.afrotransact.com
  adminHost: admin-test.afrotransact.com
  apiHost: api-test.afrotransact.com
  authHost: auth-test.afrotransact.com
  mediaHost: media-test.afrotransact.com
  # HOSTS END

secrets:
  enabled: true
  plain: true
  keySeparator: "/"
  store: platform-secrets

imagePullSecrets:
  - name: ghcr

argocd:
  env: trial
  destinationServer: https://kubernetes.default.svc
  targetRevision: HEAD             # the trial may pin the promoted commit, e.g. targetRevision: <sha>
  autoSync: false                  # MANUAL sync, as in prod: the owner approves every sync
  prune: false
  selfHeal: false
