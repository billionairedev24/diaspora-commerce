# Environment-wide values for prod: OVHcloud Managed Kubernetes (one b3-16 node, US East) + Layerbase PostgreSQL.
#  1. Merged LAST into every service chart by the services ApplicationSet (so it wins over values-prod.yaml):
#     cloud, secret store and image registry are decided here, once per environment.
#  2. Read by the ApplicationSets (git files generator): the "argocd" block and "cloud" (which picks
#     infra/k8s/platform/secret-stores/<cloud> and infra/k8s/platform/clouds/<cloud>/*).
# The at-service chart ignores the "argocd" block.
#
# Which services run here is decided by infra/argocd/launch-set (21 of 26); `make launch-set-check` lists the Applications.
# The Spring/Go profile is prod: each chart's values-prod.yaml sets env: prod, which the library chart turns into
# SPRING_PROFILES_ACTIVE=prod / APP_ENV=prod (the Secret's APP_ENV is prod too: infra/ops/secrets).
cloud: ovh

image:
  registry: ghcr.io/billionairedev24/diaspora-commerce

# Public base domain of this environment (infra/cloudflare: "<env>." prefix outside prod). The at-service library
# derives every public URL from it and injects PLATFORM_ENV, PLATFORM_DOMAIN, PUBLIC_WEB_URL, SELLER_CENTER_URL,
# STAFF_CONSOLE_URL, API_BASE_URL, AUTH_ISSUER_URL and MEDIA_PUBLIC_URL into every service
# (docs/engineering/environments.md). global.urls overrides one derived value env-wide; a service's extraEnv wins.
global:
  domain: afrotransact.com
  # The customer storefront lives at https://www.afrotransact.com; the apex 301-redirects to it at the Cloudflare edge
  # (infra/cloudflare storefront_host = "www"). Every other app keeps its sub-domain. PUBLIC_WEB_URL = https://www.<domain>.
  storefrontHost: www
  # urls:
  #   MEDIA_PUBLIC_URL: https://cdn.example.net

# Secrets: SOPS/age files applied by infra/ops/secrets/apply.sh create the Secret <service>-secrets in afrotransact-prod, and
# the pods read it with envFrom. `plain: true` = no ExternalSecret is rendered (no External Secrets Operator in the lean
# platform). Optional OKMS + External Secrets path (not verified against a live account): remove `plain`, add the
# external-secrets chart and the secret-store element (applicationsets/lean/platform-manifests.yaml).
secrets:
  enabled: true
  plain: true
  keySeparator: "/"               # OKMS paths allow "/"
  store: platform-secrets          # only used on the optional OKMS path

# GHCR packages are private: read-only token (read:packages), created by infra/ops/secrets/apply.sh as the pull Secret "ghcr".
imagePullSecrets:
  - name: ghcr

# workloadIdentity: set the env-wide default identity in the cloud block below. platform-values is merged last, so a
# service that needs its own least-privilege identity sets it here with care (or the key is left unset here and each
# service sets workloadIdentity in its values-prod.yaml).

argocd:
  env: prod
  destinationServer: https://kubernetes.default.svc
  targetRevision: HEAD             # prod may pin a release tag, e.g. v2026.10.1
  autoSync: false                  # MANUAL sync: a human approves every prod sync (S187). No Rollouts on the lean footprint: rolling update, maxUnavailable 0
  prune: false
  selfHeal: false

