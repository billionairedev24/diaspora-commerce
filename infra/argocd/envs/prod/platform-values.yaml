# Environment-wide values for prod.
#  1. Merged LAST into every service chart by the services ApplicationSet (so it wins over values-prod.yaml):
#     cloud, workload identity, secret store and image registry are decided here, once per environment.
#  2. Read by the ApplicationSets (git files generator): the "argocd" block and "cloud" (which picks
#     infra/k8s/platform/secret-stores/<cloud> and infra/k8s/platform/clouds/<cloud>/*).
# The at-service chart ignores the "argocd" block.
#
# cloud: none renders on kind / any local cluster (no identity annotations, Fake secret store).
cloud: none

image:
  registry: ghcr.io/billionairedev24/diaspora-commerce

secrets:
  enabled: true
  keySeparator: "/"               # AWS Secrets Manager path; "-" on GCP and Azure (see examples below)
  store: platform-secrets          # ClusterSecretStore from infra/k8s/platform/secret-stores/<cloud>

# workloadIdentity: set the env-wide default identity in the cloud block below. platform-values is merged last, so a
# service that needs its own least-privilege identity sets it here with care (or the key is left unset here and each
# service sets workloadIdentity in its values-prod.yaml).

argocd:
  env: prod
  destinationServer: https://kubernetes.default.svc
  targetRevision: HEAD             # prod may pin a release tag, e.g. v2026.10.1
  autoSync: false                  # MANUAL sync — a human approves every prod sync (S187); Rollouts canary + analysis
  prune: false
  selfHeal: false

