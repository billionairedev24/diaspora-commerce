# Root "app of apps" for uat. Apply once per cluster after installing Argo CD:
#   kubectl apply -n argocd -f infra/argocd/bootstrap/root-uat.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-uat
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/billionairedev24/diaspora-commerce.git
    targetRevision: HEAD
    path: infra/argocd/envs/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
