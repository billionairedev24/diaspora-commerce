# RELEASE 1 ONLY (this directory does not exist on main). Makes the `services` and `deployables` ApplicationSets read their generator
# inputs (platform-values.yaml, the chart directories) from the release-1 branch instead of the repository's default branch, which is
# what `revision: HEAD` means to Argo CD. Without it the cutover map and the deployables would be invisible to Argo CD.
# The platform ApplicationSets (platform-manifests, platform-charts) are patched too: release-1 DOES change the platform layer (the Alloy
# scrape config of infra/k8s/platform/lean, observability rules and dashboards for the two deployables), and a generator that kept reading HEAD
# (the default branch) would list the platform Applications, and their `argocd.targetRevision`, from main. tools: `make launch-set-check` fails
# when any ApplicationSet of any environment still has a git generator revision other than release-1.
# The Applications' own chart source follows `argocd.targetRevision` of each environment's platform-values.yaml (release-1 there too);
# the root Applications (bootstrap/root-<env>.yaml) are applied with targetRevision release-1. Going back to main = remove this component from
# the env kustomizations, set argocd.targetRevision back to HEAD and re-apply the root with targetRevision HEAD.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: ApplicationSet, name: services}
    patch: |-
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/revision
        value: release-1
      - op: replace
        path: /spec/generators/0/matrix/generators/1/git/revision
        value: release-1
  - target: {kind: ApplicationSet, name: deployables}
    patch: |-
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/revision
        value: release-1
  - target: {kind: ApplicationSet, name: platform-manifests}
    patch: |-
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/revision
        value: release-1
  - target: {kind: ApplicationSet, name: platform-charts}
    patch: |-
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/revision
        value: release-1
